# notes-cli package manifest.
#
# Shape mirrors `pkg::Manifest` — the launcher's minimal shim
# also decodes this file. Placeholder publisher key; a real
# publish would go through `qos-pkg-cli sign`.

[package]
id      = "dev.qos.notes-cli"
version = "0.1.0"
kind    = "app"

[publisher]
identity  = "ed25519:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
signature = ""

[sandbox]
namespaces = ["user", "pid", "uts", "ipc", "mount", "net"]
seccomp    = "qos-default"
landlock   = "strict"

[sandbox.net]
mode = "off"

[entrypoint]
bin  = "bin/notes"
type = "cli"

[cli]
commands = ["notes"]
