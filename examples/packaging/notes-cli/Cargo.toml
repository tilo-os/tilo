[package]
name = "notes-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Reference CLI app for the Tilo package model — 'notes' on PATH writes a note."

[[bin]]
name = "notes"
path = "src/main.rs"

# Uses the `cli` SDK for workspace-path resolution + terminal-aware
# output. Ships as a `type = "cli"` package (see manifest.toml).

[features]
# Build `notes` as a thin app. Enabling this brings the shared runtime
# SDK dylib (`runtime-dylib` → libruntime_dylib.so) onto the link path;
# combined with `-C prefer-dynamic --profile thin-app` it links `cli`
# (and its whole runtime + tokio graph) and libstd dynamically, so the
# `notes` binary carries only its own code. Off by default — a normal
# `cargo build --release -p notes-cli` is an unchanged static build.
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-cli-kit    = { path = "../../../crates/runtime/cli" }
anyhow.workspace = true
clap.workspace = true
# Only pulled in under `--features thin`; see the `thin` feature above.
runtime-dylib = { path = "../../../crates/runtime/runtime-dylib", optional = true }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
