[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Minimal Tilo-native app for demonstrating the app install pipeline."

[[bin]]
name = "tilo-hello"
path = "src/main.rs"

[features]
# Build as a thin app: bring `runtime-dylib` (libruntime_dylib.so) onto
# the link path so `-C prefer-dynamic --profile thin-app` links the SDK
# + libstd dynamically instead of baking them in. Off by default, so a
# plain `cargo build --release -p hello` is a normal static
# (panic=abort) build, untouched by any of the thin machinery.
thin = ["dep:runtime-dylib"]

[dependencies]
hex.workspace = true
runtime-collab = { path = "../../../crates/runtime/runtime-collab" }
runtime-fs = { package = "tilo-fs-client", path = "../../../crates/runtime/tilo-fs-client" }
runtime-identity = { package = "tilo-identity-client", path = "../../../crates/runtime/tilo-identity-client" }
runtime-portal = { path = "../../../crates/runtime/runtime-portal" }
# Only pulled in under `--features thin`; see the `thin` feature above.
runtime-dylib = { path = "../../../crates/runtime/runtime-dylib", optional = true }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
