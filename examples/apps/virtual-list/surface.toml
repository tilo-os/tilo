# The app's public surface, written by `tilo-app surface`: its resources' verbs
# and stored fields. Review changes to it like an API change; `tilo-app check`
# fails when the code and this file disagree.

[[resources]]
kind = "example.activity-feed"
label = "Activity"
version = 1

[[resources.fields]]
owner = "feed"
path = "opened"
stored = "value"
title = "Recently opened activity ids, newest first"
type = "Vec<u64>"

[[resources.verbs]]
description = "Open an activity."
id = "open"
kind = "undoable"
label = "Open an activity"

[[resources.verbs.params]]
name = "id"
required = true

[resources.verbs.params.schema]
description = "Stable activity id"
minimum = 0
type = "integer"
