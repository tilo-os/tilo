# The app's public surface, written by `tilo-app surface`: its resources' verbs
# and stored fields. Review changes to it like an API change; `tilo-app check`
# fails when the code and this file disagree.

[[resources]]
kind = "example.checklist"
label = "Checklist"
version = 1

[[resources.fields]]
owner = "checklist"
path = "name"
stored = "value"
title = "Collaborative text, like every `String`"
type = "String"

[[resources.fields]]
owner = "checklist"
path = "items"
stored = "collection"
title = "Items"
type = "Collection<Item>"

[[resources.fields]]
label = true
owner = "item"
path = "items.*.title"
stored = "value"
title = "Collaborative text"
type = "String"

[[resources.fields]]
owner = "item"
path = "items.*.done"
stored = "value"
title = "A register: concurrent toggles settle on one value"
type = "bool"

[[resources.verbs]]
description = "Add an item."
id = "add"
kind = "undoable"
label = "Add an item"

[[resources.verbs.params]]
name = "title"
required = true

[resources.verbs.params.schema]
description = "Title of the new item"
type = "string"

[[resources.verbs]]
description = "Remove every checked item, as one undo step."
destructive = true
id = "clear-done"
kind = "undoable"
label = "Remove every checked item, as one undo step"
params = []
