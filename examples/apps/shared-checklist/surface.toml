# Written by `tilo-app surface`; review changes like an API change.

[[resources]]
kind = "example.checklist"
label = "Checklist"
version = 1
fields = [
  { path = "name", type = "String" },
  { path = "items", type = "Collection<Item>", stored = "collection" },
  { path = "items.*.title", type = "String", label = true },
  { path = "items.*.done", type = "bool" },
]

[[resources.verbs]]
id = "add"
kind = "undoable"
params = [
  { name = "title", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "clear-done"
destructive = true
kind = "undoable"

