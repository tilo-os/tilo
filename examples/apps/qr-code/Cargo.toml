[package]
name = "example-qr-code"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "example_qr_code"
path = "src/lib.rs"

[[bin]]
name = "example-qr-code"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../../crates/runtime/runtime-dylib", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ui = { package = "tilo-app", path = "../../../crates/sdk/tilo-app" }
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ui = { package = "tilo-app", path = "../../../crates/sdk/tilo-app", default-features = false }

[lints]
workspace = true
