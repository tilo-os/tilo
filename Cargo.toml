# Release binaries keep their symbol table (`strip = "debuginfo"`), so a field
# crash log (shell::crash_log) names each frame's function; fully stripped,
# the same backtrace was only `<unknown>` frames. The line tables compiled
# below are stripped: kept in the compositor they would also give file:line,
# but measured on `shell` (thin LTO as packages build it, panic = "abort")
# they grow the zstd-compressed binary from 46 MB to 220 MB, against 42 MB
# fully stripped.
# The OS image, RPM, Debian and Arch packages ship these binaries as built
# (the RPM spec and PKGBUILD turn their strip passes off); Nix's default
# debug-only strip keeps the symbol table too.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, so a process can contain a helper that fails: the compositor
# restarts its collaboration broker rather than end the session. Every other
# panic still aborts the process: tilo-rt installs a hook that aborts outside
# `tilo_rt::panic_boundary::isolate` (see that module).
panic = "unwind"
strip = "debuginfo"
overflow-checks = false
debug = "line-tables-only"
incremental = false

# The browser bundles' release build (`build.sh --profile release`), measured
# in crates/browser/tilo-web-desktop/SIZE.md. Fat LTO and one codegen unit
# come from `release`. `panic = "abort"` is the only panic
# strategy wasm32-unknown-unknown has on stable: the runtime's panic hook
# reports the message, then the module traps and the page must reload.
# No debug info or symbol table: the bundle size is what matters in a browser.
# Local development builds that must run at near-release speed (the desktop,
# screenshots, a device swap). `release` links with fat LTO and one codegen
# unit: a single rustc for the shell reached 24 GB and took the laptop down.
# Without LTO, with parallel codegen and incremental builds, this compiles in
# a fraction of the time and memory and still runs smoothly.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.wasm-release]
inherits = "release"
opt-level = 3
panic = "abort"
debug = false
strip = "symbols"

# `wasm-release` with the symbol table kept: the desktop bundle is split into
# a start module and per-app modules loaded on demand, and the splitter reads
# function names and relocations from the linked module. The modules it
# writes are stripped.
[profile.wasm-split]
inherits = "wasm-release"
strip = "none"

# The browser bundles' quick development build (`build.sh --profile quick`).
# Without debug information and with light optimisation, the linked desktop
# module is a quarter of `dev`'s, and wasm-bindgen and the splitter take half
# as long on it, for a compile that is barely slower.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

# Thin-app profile: release settings minus those incompatible with dynamic SDK
# linking.
#
#   * `panic = "unwind"` — a Rust `dylib` (and anything linking one, via
#     `-C prefer-dynamic`) must unwind; `panic = "abort"` is rejected.
#   * `lto = false` — fat LTO + `-C prefer-dynamic` is rejected by rustc.
#
# Thin builds are opt-in. Pass `-C prefer-dynamic` after `--` so workspace
# target and linker hardening flags remain active.
[profile.thin-app]
inherits = "release"
panic = "unwind"
lto = false
# Signed app packages stay fully stripped; only the native release binaries
# keep their symbol table.
strip = "symbols"
# Pin codegen-units here: CARGO_PROFILE_RELEASE_CODEGEN_UNITS (set for fast
# release links in CI and the image) is inherited by thin-app unless the child
# profile names its own value. The wrapper also forces one unit on each tapp
# crate; this keeps their dependencies on the same size-oriented setting.
codegen-units = 1

# tilo-ui is one crate on the critical path of every thin build: at one unit
# its codegen alone takes about 4.5 of a full collection's 10 minutes. Sixteen
# cost the shared runtime 1.8% in size; tapp crates stay at one unit.
[profile.thin-app.package.tilo-ui]
codegen-units = 16

# Imager's backend is the longest single compile of the thin graph: at one
# unit it took three minutes of a warm build on sixteen cores, after the
# toolkit, so it set when the collection was done. It is linked into Imager
# alone, which has room under its budget for what parallel codegen costs.
[profile.thin-app.package.imager-backend]
codegen-units = 16

# The demo profile keeps release optimisation while enabling shell's
# debug-only test-control surface for recordings.
[profile.demo]
inherits = "release"

[profile.demo.package.shell]
debug-assertions = true

# The headless harnesses point a demo-profile launcher at their own app store
# and runtime bundle; those overrides are gated on debug assertions too.
[profile.demo.package.launcher]
debug-assertions = true

# ...and a demo-profile `app` at their own `tilo-install` build.
[profile.demo.package.app-cli]
debug-assertions = true

# Vendored winit fork adds Wayland `zwp_pointer_gestures_v1` support and maps
# pinch events to winit's existing `PinchGesture` API.
[patch.crates-io]
# Chromium origin storage reader: bundled engine provenance in vendor/leveldb-sys.
leveldb-sys = { path = "vendor/leveldb-sys" }
# Assemble fragmented OpenAI Chat tool names consistently in Rig's decoder.
# Exact registry baseline and removal condition: vendor/rig-core/PROVENANCE.md.
rig-core = { path = "vendor/rig-core" }
# Build outputs must not become Cargo inputs; see vendor/buffa-build/PROVENANCE.md.
buffa-build = { path = "vendor/buffa-build" }
# Verify Cast TLS handshake signatures and bound cancellation; identity
# authentication remains a separate explicit trust decision. See provenance.
fcast-sender-sdk = { path = "vendor/fcast-sender-sdk" }
# Spotify parser/session and Rustls proxy repairs; preserve Tilo trust roots.
# See the two vendor PROVENANCE.md files.
librespot-core = { path = "vendor/librespot-core" }
hyper-proxy2 = { path = "vendor/hyper-proxy2" }
# Shapes a variable font at its `wdth` as well as its `wght`, so condensed
# text is measured and kerned at the width it is drawn. See
# vendor/cosmic-text/TILO-PATCH.md.
cosmic-text = { path = "vendor/cosmic-text" }
# The Google Cast message types with their prost code pre-generated, so the
# build no longer compiles a protobuf compiler for one message.
# See vendor/google-cast-protocol/PROVENANCE.md.
google-cast-protocol = { path = "vendor/google-cast-protocol" }
# Preserve raw HTTP/3 routing fields before URL normalization.
# See vendor/web-transport-proto/PROVENANCE.md.
web-transport-proto = { path = "vendor/web-transport-proto" }
# Adds `Request::from_parts` so one QUIC endpoint serves plain HTTP/3 delivery
# requests and WebTransport. See vendor/web-transport-quinn/PROVENANCE.md.
web-transport-quinn = { path = "vendor/web-transport-quinn" }
# libspa-sys 0.10.1 lets bindgen discover newer PipeWire inline functions
# through transitive headers, but its emitted C wrapper includes only the
# narrower wrapper.h. Keep the missing direct includes locally until upstream
# ships the same fix; clean Fedora 44 builds otherwise fail in static_fns.c.
libspa-sys = { path = "vendor/libspa-sys" }
# Pinned DX12 shader cache and opt-in Metal presentation feedback; a device-loss
# switch that lets tests reset a Vulkan device. See vendor/wgpu-hal/TILO-PATCH.md.
wgpu-hal = { path = "vendor/wgpu-hal" }
# `Device::poll` reports a lost device instead of panicking, so the compositor
# survives a GPU reset. See vendor/wgpu/TILO-PATCH.md.
wgpu = { path = "vendor/wgpu" }
genawaiter-proc-macro = { path = "vendor/genawaiter-proc-macro" }
rustls-native-certs = { path = "crates/system/tilo-native-certs" }
# The pure-Rust server used by Smithay used to panic if a client disappeared
# from inside a request callback which had just created a child object. OAuth
# browser launches make that race easy to hit: a probing helper can connect,
# create a registry object, and exit before dispatch finishes. Keep the
# compositor alive and treat the vanished object as a disconnected client.
# See vendor/wayland-backend/TILO-PATCH.md.
wayland-backend = { path = "vendor/wayland-backend" }
# The HTML5 entity table as offsets into two string literals instead of 2125
# pairs of pointers the loader relocates in every app process (it is in the
# shared runtime through the Markdown codec). See
# vendor/pulldown-cmark/TILO-PATCH.md.
pulldown-cmark = { path = "vendor/pulldown-cmark" }
# The Unicode name and case folding tables as string literals and offsets
# instead of about 3,900 entries of pointers the loader relocates in every
# app process (regex is in the shared runtime). Generated by
# tools/regex-syntax-tables.py; see vendor/regex-syntax/TILO-PATCH.md.
regex-syntax = { path = "vendor/regex-syntax" }
# An idle endpoint wakes for nothing: no re-STUN tick and no home relay once
# the relay map is empty, no wall-clock poll on Linux (a timerfd that the
# kernel cancels on resume or a clock step replaces it), and no gossip cache
# sweep once a topic's caches are empty. See each crate's TILO-PATCH.md.
iroh = { path = "vendor/iroh" }
iroh-gossip = { path = "vendor/iroh-gossip" }
netwatch = { path = "vendor/netwatch" }
# Members depend on `workspace-hack = "0.1"`; this workspace builds the local
# crate, while workspaces outside it get crates.io's empty stub (.config/hakari.toml).
workspace-hack = { path = "crates/workspace-hack" }
# Git forks on code.tilo.so, public so apps outside this repository fetch
# them too (see `vendor/PATCHES.md`); upstream contributions are prepared in
# tilo/upstream-contribs. Drop the entries once upstream
# releases the changes.
#
# accesskit_unix and atspi enable zbus's async-io backend unconditionally, so
# the tokio-only accessibility stack also built a second async runtime
# (async-executor, async-io, async-process, blocking, ...). These forks make
# the backend follow the crates' `async-io`/`tokio` features.
#
# The accesskit crates the fork's accesskit_unix depends on by path come from
# the same revision (identical to their crates.io releases), so each resolves
# to one copy.
accesskit = { git = "https://code.tilo.so/tilo/accesskit.git", rev = "a76088c4c36c03de8109ded02bd42a305fb1d569" }
accesskit_atspi_common = { git = "https://code.tilo.so/tilo/accesskit.git", rev = "a76088c4c36c03de8109ded02bd42a305fb1d569" }
accesskit_consumer = { git = "https://code.tilo.so/tilo/accesskit.git", rev = "a76088c4c36c03de8109ded02bd42a305fb1d569" }
accesskit_unix = { git = "https://code.tilo.so/tilo/accesskit.git", rev = "a76088c4c36c03de8109ded02bd42a305fb1d569" }
atspi = { git = "https://code.tilo.so/tilo/atspi.git", rev = "9183f58d2e18e7c7cd76a1436f7fedc3ada015c2" }
atspi-common = { git = "https://code.tilo.so/tilo/atspi.git", rev = "9183f58d2e18e7c7cd76a1436f7fedc3ada015c2" }
atspi-proxies = { git = "https://code.tilo.so/tilo/atspi.git", rev = "9183f58d2e18e7c7cd76a1436f7fedc3ada015c2" }
# rustypipe 0.11.4 uses reqwest 0.12, which kept reqwest 0.12, its QUIC stack
# (quinn) and fancy-regex 0.14 in the lock. The fork ports 0.11.4 to reqwest
# 0.13 and fancy-regex 0.16.
rustypipe = { git = "https://code.tilo.so/tilo/rustypipe.git", rev = "aeb292fb23856c335ee3423745ed98ae0e683760" }
