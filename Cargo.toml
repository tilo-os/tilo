[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
# Password sealing derives its key with Argon2 at its production cost: an
# unoptimised build takes tens of seconds per seal, so a journey that saves
# connections behind a password (Imager's checkpoint) outran its test's wait
# on a loaded builder.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.test.package.blake3]
opt-level = 3
[profile.test.package.curve25519-dalek]
opt-level = 3
[profile.test.package.ed25519-dalek]
