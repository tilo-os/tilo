resolver = "2"

# Tilo is distributed as one AGPL operating-system source tree; workspace
# members inherit this metadata and are not published independently.
[workspace.package]
license = "AGPL-3.0-only"
publish = false
repository = "https://code.tilo.so/tilo/tilo"
homepage = "https://tilo.so"

# workspace-hack is never named in code: it only unifies third-party features.
# tilo-winit-x11 has no items: depending on it turns on winit's X11 backend.
[workspace.metadata.cargo-machete]
ignored = ["workspace-hack", "tilo-winit-x11"]

[workspace.lints.rust]
# `tilo_no_js`: a wasm32-unknown-unknown build for a host that is not a
# JavaScript page (a sandboxed format provider), which must link no
# wasm-bindgen glue. `tilo_model_split`: the build that links every app's model
# into one module (crates/sdk/tilo-models-wasm), where `tilo_model_guest::model!`
# names each app's entry by its app. `tilo_model_guest`: an app's model module,
# whose documents its host keeps (vendor/automerge/src/model_device).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tilo_no_js)", "cfg(tilo_model_split)", "cfg(tilo_model_guest)"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Boilerplate `# Errors` / `# Panics` sections; see AGENTS.md "Comments".
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `nursery` is unstable and includes documented false positives, so its lints
# are enabled individually below where they catch correctness defects.

# Panics. clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"

# More than eight parameters; clippy.toml sets the threshold.
too_many_arguments = "deny"

# Selected nursery lints.
redundant_clone = "deny"                    # allocations that are never needed
significant_drop_tightening = "deny"        # lock held longer than necessary
significant_drop_in_scrutinee = "deny"      # lock held across a match arm
needless_pass_by_ref_mut = "deny"           # &mut that never mutates
future_not_send = "deny"                    # future that cannot cross threads
while_float = "deny"                        # float loop counter accumulates error
or_fun_call = "deny"                        # eager evaluation in unwrap_or
needless_collect = "deny"                   # collect just to iterate
suspicious_operation_groupings = "deny"     # a.x == b.x && a.y == b.x
collection_is_never_read = "deny"
iter_with_drain = "deny"
unused_peekable = "deny"
literal_string_with_formatting_args = "deny"
as_ptr_cast_mut = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
set_contains_or_insert = "deny"
clear_with_drain = "deny"
trailing_empty_array = "deny"
equatable_if_let = "deny"                   # if let used as an equality test
# Crates list their banned calls in their own clippy.toml; a listed call is an
# error, not a style suggestion.
disallowed_methods = "deny"
# Every `#[allow]` says why the lint does not apply there.
allow_attributes_without_reason = "deny"

# `as_conversions` is broad; pedantic already denies the dangerous cast
# categories more precisely. The blanket lint adds noise to bounded graphics
# conversions.
as_conversions = "allow"

# `duration_suboptimal_units` suggests constructors behind the unstable
# `duration_constructors` feature, so it remains disabled on stable Rust.
duration_suboptimal_units = "allow"

# `must_use_candidate` is too broad for this API; annotate result types,
# guards, builders, and tokens where ignoring a value is harmful.
must_use_candidate = "allow"

[workspace.dependencies]
browser-continuity = { path = "crates/import/browser-continuity", version = "0.1.0" }
browser-continuity-core = { package = "tilo-browser-continuity-core", path = "crates/core/browser-continuity-core", version = "0.1.0" }
tilo-app-id = { path = "crates/core/tilo-app-id", version = "0.1.0" }

# ---------------------------------------------------------------------------
# UI toolkit stack
#
# Prefer the re-exports in `crates/ui/ui-core/src/lib.rs`. Direct dependencies must use
# compatible versions to share types such as `vello::Scene`.
# ---------------------------------------------------------------------------
# Tilo's vello fork (vendor/PATCHES.md), published under its own names; the
# libraries keep upstream's names.
vello = { package = "tilo-vello", version = "0.9.0", path = "vendor/vello" }
vello_encoding = { package = "tilo-vello-encoding", version = "0.9.0", path = "vendor/vello_encoding" }
# Tilo's wgpu fork, published as tilo-wgpu; the library keeps its name.
# `Device::poll` reports a lost device instead of panicking, so the compositor
# survives a GPU reset. See vendor/wgpu/TILO-PATCH.md.
wgpu = { package = "tilo-wgpu", version = "29.0.3", path = "vendor/wgpu" }
# Tilo's taffy fork, published as tilo-taffy; the library keeps its name. It rounds layout onto
# the display's device pixels at any scale, not only whole logical pixels, and measures a flex
# item at the cross size it is laid out at. See vendor/taffy/TILO-PATCH.md.
taffy = { package = "tilo-taffy", version = "0.10.1", path = "vendor/taffy" }
# Tilo's winit fork, published as tilo-winit; the library keeps its name.
# crates.io crates reach it through the `[patch]` facade below. The default
# `wayland-csd-adwaita` draws titles through ab_glyph and owned_ttf_parser;
# `-notitle` keeps the client-side frame without that stack.
winit = { package = "tilo-winit", version = "0.30.13", path = "vendor/winit", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# Automerge 0.12.0 folded the formatting changes of several text objects in
# one diff into a single patch on the first of them, so undoing a mark set
# across several paragraphs cleared it from the first alone. Tilo's fork keeps
# a mark change on its own object (vendor/automerge/TILO-PATCH.md) and is
# published under its own name; the library keeps upstream's.
automerge = { package = "tilo-automerge-fork", version = "0.12.0", path = "vendor/automerge" }
# Every AutoCommit that takes in changes goes through its `ApplyIncoming`.
tilo-automerge = { version = "0.1.0", path = "crates/core/tilo-automerge" }
tilo-automerge-isolate = { version = "0.1.0", path = "crates/core/tilo-automerge-isolate" }
pollster = "0.4.0"
rustc-hash = "2.1"
# FNV-1a for stable, persisted identifiers: a fixed algorithm, unlike std's hashers.
fnv = "1"
# Tilo's cosmic-text fork, published as tilo-cosmic-text; the library keeps its name. It shapes a
# variable font at its `wdth` as well as its `wght`, so condensed text is measured and kerned at
# the width it is drawn. See vendor/cosmic-text/TILO-PATCH.md.
cosmic-text = { package = "tilo-cosmic-text", version = "0.19.0", path = "vendor/cosmic-text", default-features = false }

# ---------------------------------------------------------------------------
# Async runtime and networking
# ---------------------------------------------------------------------------
tokio = "1.53.3"
tilo-rt = { version = "0.1.0", path = "crates/platform/tilo-rt" }
tilo-wake = { version = "0.1.0", path = "crates/platform/tilo-wake" }
tilo-paths = { version = "0.1.0", path = "crates/platform/tilo-paths" }
tilo-clipboard = { version = "0.1.0", path = "crates/platform/tilo-clipboard" }
tilo-dialogs = { version = "0.1.0", path = "crates/platform/tilo-dialogs" }
tilo-notify = { version = "0.1.0", path = "crates/platform/tilo-notify" }
tilo-location = { version = "0.1.0", path = "crates/platform/tilo-location" }
tilo-secrets = { version = "0.1.0", path = "crates/platform/tilo-secrets" }
tilo-net = { path = "crates/platform/tilo-net" }
tilo-sandbox = { version = "0.1.0", path = "crates/platform/tilo-sandbox" }
tilo-shm = { version = "0.1.0", path = "crates/platform/tilo-shm" }
tokio-util = { version = "0.7.18", features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
futures = { version = "0.3", default-features = false }
futures-util = "0.3"
# Defaults off keeps native-tls/OpenSSL and aws-lc-rs out of the tree. Build
# clients through `tilo_net::http`, which installs the ring provider this
# configuration requires.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
zstd = "0.14.3"
crc32fast = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
rustls-native-certs = "0.8"
url = "2"
# MIME types from file extensions.
mime_guess = "2.0.5"
# Percent-encoding and form-urlencoding outside a whole `url::Url`.
percent-encoding = "2"
form_urlencoded = "1"

# ---------------------------------------------------------------------------
# Serialisation and encoding
# ---------------------------------------------------------------------------
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
# The field path a value that does not decode failed at, which an effect's
# flattened arguments report by.
serde_path_to_error = "0.1.20"
postcard = "1.1.3"
toml = "1.0"
quick-xml = "0.41.0"
roxmltree = "0.21"
base64 = "0.22.1"
data-encoding = "2.10"
data-encoding-macro = "0.1.19"
hex = "0.4.3"
bytes = "1.11.1"
# The moq-lite live session's protocol layer, shared by native devices and pages.
moq-net = "0.3.3"
flate2 = "1"
miniz_oxide = "0.8"
# A standalone build (a published crate) needs flate2 to name its backend;
# zlib-rs is the one the workspace already links.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"

# ---------------------------------------------------------------------------
# Cryptography and identity
#
# ed25519-dalek 3 and x25519-dalek 3 take rand_core 0.10 RNGs; rand,
# rand_core and rand_chacha stay on that generation with them. OS randomness
# comes from getrandom's `SysRng` (`UnwrapErr(SysRng)` where an infallible
# `CryptoRng` is required).
# ---------------------------------------------------------------------------
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand = "0.10"
rand_core = "0.10"
rand_chacha = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
# Gravatar paths and the Drive fake's checksums.
md-5 = "0.11"
hmac = "0.13"
# SRP-6a for the iCloud sign-in (tilo-crypto `srp`).
pbkdf2 = "0.13"
blake3 = "1.8.5"
# Raw AEAD and password-KDF crates are for `crates/core/tilo-seal` only;
# deny.toml's `[bans]` rejects any other direct user.
# `zeroize` keeps the cipher key wiped on drop; 0.11 made it opt-in.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
zeroize = "1"

# ---------------------------------------------------------------------------
# Collaboration transport and content addressing
# ---------------------------------------------------------------------------
iroh = "1.0.3"
iroh-base = "1.0.3"
# Disable unused RPC support and its platform certificate dependencies. The
# content store serves its own blobs, so the filesystem store is not built.
iroh-blobs = { version = "0.103.0", default-features = false, features = ["hide-proto-docs"] }
# iroh-blobs' BAO tree and RPC layer, for the content store's provider
# (versions follow iroh-blobs). `fs` lets a whole blob's ranges be read from
# its file instead of held in memory.
bao-tree = { version = "0.16", default-features = false, features = ["experimental-mixed", "fs"] }
irpc = { version = "0.17.0", default-features = false }
ref-cast = "1.0.24"
# Content-defined chunking for the native backend (normalised FastCDC).
fastcdc = { version = "3.2", default-features = false }
# The storage daemon's content area: its index, its inline blobs and every
# whole blob's outboard.
redb = "4.1.0"
# ---------------------------------------------------------------------------
# Media: images, codecs, capture and playback
#
# The gstreamer crates are optional everywhere — the hermetic build, `--shots`
# and CI must never need the gstreamer-1.0 dev stack.
# ---------------------------------------------------------------------------
# 0.25.10 decodes TIFF through tiff 0.11, which shares zune-jpeg 0.5 with the
# JPEG decoder instead of linking a second zune-jpeg/zune-core generation.
image = { version = "0.25.10", default-features = false }
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.10", default-features = false }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
rustypipe = { version = "0.11", default-features = false }
rquickjs = "0.9"
# The spreadsheet formula engine: Excel-compatible functions, dynamic arrays
# and cycle detection, evaluated over a workbook kept in step with the sheets.
ironcalc_base = "0.9.1"
# The local IANA zone name, which ironcalc_base needs for TODAY() and NOW().
iana-time-zone = "0.1.65"
# Sender-side discovery and transports for FCast and Google Cast. Disable the
# mobile FFI/logging defaults: tilo-projector-broker is a native Rust broker.
fcast-sender-sdk = { version = "0.3.0", default-features = false, features = ["fcast", "chromecast", "discovery"] }
mdns-sd = "=0.20.3"
# Miracast (Wi-Fi Display) source for tilo-projector-broker: Tilo's own standalone
# crate, kept in vendor/miracast until it is published (see its PROVENANCE.md).
miracast = { path = "vendor/miracast", default-features = false }
# Discord's DAVE end-to-end encryption for the Discord connector's voice:
# davey 0.1.5 moved to the openmls generation the workspace builds (see
# vendor/davey/TILO-PATCH.md).
davey = { path = "vendor/davey" }
# FFT for acoustic calibration: deconvolving a recorded sweep into the
# speaker's impulse response and reading its magnitude response.
rustfft = "6.2"

# ---------------------------------------------------------------------------
# Desktop and platform integration
# ---------------------------------------------------------------------------
wayland-client = "0.31.14"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
zbus = { version = "5.16", default-features = false }
# X11, Windows and macOS only; Wayland clients use focus-gated wl_data_device
# on the app's own connection (see crates/platform/tilo-clipboard/src/wayland.rs).
arboard = { version = "3.6.1", default-features = false }
fuser = "0.18.0"
# Defaults on: the only default is `macos_fsevent`, without which notify has no
# macOS backend and fails to compile there.
notify = "8"
landlock = "0.4"
seccompiler = "0.5"
sd-notify = "0.4"
sysinfo = "0.36"
oneshot = "0.1.13"
open = "5.3.5"
libc = "0.2.186"
rustix = "1.1.4"

# ---------------------------------------------------------------------------
# Diagnostics and utilities
# ---------------------------------------------------------------------------
# Another thread's stack, recorded by its own signal handler as bare return
# addresses (nothing a handler may not do) and symbolized afterwards; std
# symbolizes only the backtraces it captured itself.
backtrace = "0.3.76"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.102"
thiserror = "2"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.9"
strsim = "0.11"
uuid = { version = "1.23.1", features = ["serde", "v4", "v5"] }
# Local time in the zone the device is set to: `tz-system` reads `TZ` and the
# `/etc/localtime` link, and `tzdb-zoneinfo` resolves the zone name they give against
# the machine's IANA database (the OS installs one and refuses a name it does not hold),
# so a named zone is read as itself rather than as its `/etc/localtime` neighbour.
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo"] }
# The IANA time-zone database, built in so every device resolves a named zone
# the same way whatever zoneinfo its host has.
jiff-tzdb = "0.1"
qcms = "0.3.0"
walkdir = "2.5.0"
# The one in-memory cache: fs, thumbnail and the app mount share it.
lru = { version = "0.18.3", default-features = false }
moka = { version = "0.12.15", features = ["sync"] }
regex = "1"
# For patterns in code every browser visitor loads first (action schemas,
# feedback redaction): about a tenth of `regex`'s size, ASCII classes only.
regex-lite = "0.1"
semver = "1"
parking_lot = "0.12.5"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"

# ---------------------------------------------------------------------------
# Test-only
# ---------------------------------------------------------------------------
tempfile = "3.27.0"
serial_test = "3.4.0"
proptest = "1"

# Keep line tables in development and test artifacts to retain useful
# backtraces/profiling information without full DWARF size.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
# CI strips the symbol table from test executables (`CARGO_PROFILE_TEST_STRIP` in t.toml); these
# packages' tests read it and keep it. A package setting wins over that profile-wide one.
# tilo-liveness names stack frames from its own executable's symbol table (src/symtab.rs).
[profile.test.package.tilo-liveness]
strip = false
# The panic-boundary test finds the panicking function's name in the backtrace the abort hook
# prints, which a stripped executable cannot give it.
[profile.test.package.tilo-rt]
strip = false
# The session's logging test finds the test's own function in a panic's backtrace. It is a package
# of its own so that the session's tests, which link the compositor, don't keep theirs.
[profile.test.package.tilo-session-logging]
strip = false
# The session's allocation-site test names the function that holds a block from the test's own
# symbol table (src/dev_alloc_sites.rs), as the dev image's release session does.
[profile.test.package.tilo-session]
strip = false

# Keep the renderer's math, scene encoding and GPU command processing optimised
# even when application code is unoptimised. These run for every interactive
# frame, including each password character on the lock screen. Package overrides
# preserve debug assertions, overflow checks and line tables; GPU validation is
# unchanged. Mirror test so build and test can reuse the same dependencies.
[profile.dev.package.tilo-vello]
opt-level = 3
[profile.test.package.tilo-vello]
opt-level = 3
[profile.dev.package.tilo-vello-encoding]
opt-level = 3
[profile.test.package.tilo-vello-encoding]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.test.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.test.package.peniko]
opt-level = 3
[profile.dev.package.tilo-wgpu]
opt-level = 3
[profile.test.package.tilo-wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.test.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.test.package.wgpu-hal]
opt-level = 3
[profile.dev.package.tilo-taffy]
opt-level = 3
[profile.test.package.tilo-taffy]
opt-level = 3

# The CPU raster path draws every frame of a window that has no GPU: the
# scanline work of the vector renderer and of the layers it composes stays
# optimised too, or a window without a GPU redraws slowly in a development
# build.
[profile.dev.package.tilo-cpu-raster]
opt-level = 3
[profile.test.package.tilo-cpu-raster]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.test.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.test.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.test.package.fearless_simd]
opt-level = 3

# The compositor monomorphises UI traversal and search/serialization code that
# dependency-only optimisation cannot speed up. Keep a development build of it
# lightly optimised with full debugger information, assertions and overflow
# checks, so the desktop stays interactive. Application and toolkit code remain
# unoptimised; this is not the release profile. Its tests build it as the test
# profile builds every crate: optimised with debug information it took five
# times as long to compile and link for each test run.
[profile.dev.package.tilo-compositor]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true

# The toolkit and the crates every app's tests run through, optimised in the
# test profile only. An app's tests spend their time in these, not in the app:
# sampled, Contacts' reach walk was 45% tilo-ui (taffy's generics instantiate
# inside it, so taffy's own level above never reached them) and 13% tilo-app,
# tilo-actions, tilo-resource, collaboration and color. On 2,092 CPU-seconds
# of app, tilo-app and tilo-ui tests these tables took 37% off (tilo-ui's
# alone 27%) and every test of that sample kept its outcome, the visual goldens
# included. A test that passed only while the toolkit was slow does not: one
# that counts frames for work done off the frame, or reads the clock after a
# motion began, waits for what it reads instead.
# Level 2 rather than 1: the two cost the same to compile and 1 took off 19%,
# because rustc shares generic instantiations with unoptimised crates up to
# level 1. What it costs is tilo-ui's compile, about three times the CPU (some
# 250 core-seconds unoptimised, 730 at level 2), in the runs that recompile
# it; a run whose build is cached pays nothing. Debug assertions and overflow
# checks stay on.
# The dev profile is unchanged: `cargo build`, `cargo run` and the desktop
# compile these crates as before, and what the paragraph above tilo-compositor
# says of application and toolkit code still holds there. Only `cargo test` and
# nextest build the optimised ones, so a build and a test run no longer share
# these crates or what depends on them.
# Each table names `strip` because a package table drops the profile-wide one:
# cargo resets `strip` in every table that leaves it out, so CI's
# `CARGO_PROFILE_TEST_STRIP` (t.toml) stopped reaching these packages' own test
# executables, and tilo-ui's unit tests grew from 294 MB to 344 MB. Written
# here it holds outside CI too: for a backtrace that names its functions in
# one of these packages' own tests, run them with
# `--config 'profile.test.package.tilo-ui.strip=false'`.
[profile.test.package.tilo-ui]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.tilo-app]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.tilo-resource]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.tilo-actions]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.tilo-action-policy]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.collaboration]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.tilo-ui-paint]
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "symbols"
[profile.test.package.color]
opt-level = 3

# Optimise the CRDT dependencies in development and test builds; their generic
# data structures are otherwise disproportionately slow in workspace tests.
[profile.dev.package.tilo-automerge-fork]
opt-level = 3
[profile.dev.package.hexane]
opt-level = 3
[profile.test.package.tilo-automerge-fork]
opt-level = 3
[profile.test.package.hexane]
opt-level = 3
# crates.io automerge, the reference tilo-automerge's tests compare the fork to.
[profile.test.package.automerge]
opt-level = 3
# The record's indexes: unoptimised, a commit zero-fills each page it writes a byte at a time,
# and a store pays one commit per change it takes in.
[profile.dev.package.redb]
opt-level = 3
[profile.test.package.redb]
opt-level = 3

# The wet-media simulations re-run on every edit of a painted layer; unoptimised
# they take seconds per stroke, and the canvas app is unusable in a dev build.
[profile.dev.package.tilo-wet-media]
opt-level = 3
[profile.test.package.tilo-wet-media]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.test.package.tiny-skia]
opt-level = 3
# Refining a selection's edge filters every pixel of a photograph, and the
# subject model runs a network: unoptimised, select subject takes many
# seconds in a dev build. rten's kernels are its own crates.
[profile.dev.package.tilo-segment]
opt-level = 3
[profile.test.package.tilo-segment]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3

# Hashing, signature verification and font parsing run on every fixture in
# large parts of the suite: tilo-ui hashes its 43 MB bundled font catalog per
