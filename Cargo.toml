[workspace]
# qdoc-codec-markdown-wasm is intentionally excluded from default `cargo build`
# runs: it must be compiled with `--target wasm32-wasip2` and produces a
# Component Model `.wasm`, not a host-target library. Build it explicitly:
# `cargo build -p qdoc-codec-markdown-wasm --target wasm32-wasip2 --release`.
exclude = ["crates/doc/qdoc-codec-markdown-wasm"]
members = [
    "crates/system/swipe",
    "crates/system/tts",
    "crates/doc/qdoc",
    "crates/text/spellcheck",
    "crates/doc/qdoc-pdf",
    "crates/doc/qdoc-html",
    "crates/doc/qdoc-rtf",
    "crates/doc/qdoc-epub",
    "apps/word-processor",
    "fs",
    "shell",
    "ui",
    "crates/system/os-actions",
    "qos-collab-types",
    "qos-threshold-identity",
    "qos-channel-crypto",
    "qos-collab-link",
    "qos-relay",
    "crates/packaging/pkg",
    "crates/packaging/pkg-cli",
    "crates/packaging/launcher",
    "crates/runtime/runtime",
    "crates/runtime/runtime-portal",
    "crates/runtime/runtime-collab",
    "crates/runtime/runtime-fs",
    "crates/runtime/runtime-identity",
    "qos-format-provider-wit",
    "qos-format-host",
    "crates/packaging/hello",
    "crates/packaging/install",
    "apps/file-explorer",
    "apps/terminal",
    "apps/browser",
    "apps/notes",
    "apps/osk",
    "apps/collab-broker",
    "apps/settings",
    "crates/session/greeter",
    "crates/session/installer",
]
resolver = "2"
