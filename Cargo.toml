[workspace]
# qdoc-codec-markdown-wasm is intentionally excluded from default `cargo build`
# runs: it must be compiled with `--target wasm32-wasip2` and produces a
# Component Model `.wasm`, not a host-target library. Build it explicitly:
# `cargo build -p qdoc-codec-markdown-wasm --target wasm32-wasip2 --release`.
exclude = ["crates/doc/qdoc-codec-markdown-wasm", "vendor/winit"]
# `runtime-dylib` is a workspace member (so it shares the lockfile,
# target dir, and crate SVHs with the apps that link it) but is kept
# OUT of `default-members`: a bare `cargo build` / `cargo test` never
# compiles it. It carries `crate-type = ["dylib"]`, which requires
# `panic = "unwind"` — incompatible with the workspace's default
# `panic = "abort"` release profile. It is built only, and explicitly,
# under `--profile thin-app` (`cargo build -p runtime-dylib --profile
# thin-app`). See its Cargo.toml for the full rationale.
# Keep bare developer builds on the load-bearing spine. CI's affected-package
# selector and nightly full-workspace gate cover every member explicitly.
default-members = [
    "crates/doc/qdoc",
    "fs",
    "shell",
    "ui",
    "crates/packaging/pkg",
    "crates/runtime/runtime",
]
