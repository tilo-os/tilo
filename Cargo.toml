# Every dependency shared by two or more workspace members is pinned here, and
# the members inherit it with `dep.workspace = true`. This is the one file to
# edit to bump a shared version — before it existed, `vello` was spelled out in
# 49 separate manifests and any one of them could silently drift.
#
# Reading the entries:
#
#   * The version here is the floor for the whole workspace. A member may not
#     override it; that is the point.
#   * `features` here are the ones nearly every member wants. A member adds its
#     own on top (`features = [...]` alongside `workspace = true`); features are
#     additive, so the member gets the union.
#   * `default-features = false` here is a floor too, and it only travels one
#     way: a member can turn defaults back **on** with `default-features = true`,
#     but a member can never turn them off if this table leaves them on. So any
#     dependency where even one member wants defaults off is declared off here.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# `nursery` as a group is clippy's unstable channel: documented false positives,
# behaviour that changes between releases, so a toolchain bump can turn CI red
# with no code change. Measured here it was 10,873 violations, 96% of them four
# style lints (use_self 3401, missing_const_for_fn 2511, redundant_pub_crate
# 1443, suboptimal_flops 1224 — the last rewrites float expressions and changes
# results, which a renderer should not accept from a lint).
#
# The nursery lints that find bugs rather than style are named individually
# below: 431 violations, and each one is a defect.

# Panics. clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"

# Nursery lints kept individually: each catches a defect, not a style.
redundant_clone = "deny"                    # allocations that are never needed
significant_drop_tightening = "deny"        # lock held longer than necessary
significant_drop_in_scrutinee = "deny"      # lock held across a match arm
needless_pass_by_ref_mut = "deny"           # &mut that never mutates
future_not_send = "deny"                    # future that cannot cross threads
while_float = "deny"                        # float loop counter accumulates error
or_fun_call = "deny"                        # eager evaluation in unwrap_or
needless_collect = "deny"                   # collect just to iterate
suspicious_operation_groupings = "deny"     # a.x == b.x && a.y == b.x
collection_is_never_read = "deny"
iter_with_drain = "deny"
unused_peekable = "deny"
literal_string_with_formatting_args = "deny"
as_ptr_cast_mut = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
set_contains_or_insert = "deny"
clear_with_drain = "deny"
trailing_empty_array = "deny"

# `as_conversions` fires on all 7,090 `as` uses, including provably-safe ones.
# pedantic already denies the dangerous subset more precisely — cast_possible_
# truncation (1,518), cast_precision_loss (872), cast_sign_loss (469),
# cast_possible_wrap (301) — plus cast_lossless (3,388) which rewrites a safe
# cast to `From`. Denying the blanket lint on top adds no safety and turns
# bounded graphics casts into fallible conversions that cannot be discharged
# with unwrap, since that is denied too.
as_conversions = "allow"

# `must_use_candidate` wants `#[must_use]` on every public value-returning
# function: 6,746 attributes here. The bug it aims at — calling something and
# discarding a result that mattered — is better caught by `#[must_use]` on the
# *type*, the way Result and Option do it. Mark guards, builders returning Self
# and tokens; a getter whose result is ignored is harmless.
must_use_candidate = "allow"

[workspace.dependencies]

# ---------------------------------------------------------------------------
# UI toolkit stack
#
# `ui` re-exports vello, taffy, winit and automerge (see `ui/src/lib.rs`). An
# app should reach for `ui::vello` rather than declaring its own copy: two vello
# versions in one process means two incompatible `Scene` types, and a widget
# tree that cannot be handed a scene it can draw into. These entries exist so
# the crates that legitimately need a direct dependency all get the same one.
# ---------------------------------------------------------------------------
vello = "0.9"
vello_encoding = "0.9"
wgpu = "29"
taffy = "0.10.1"
winit = "0.30.13"
automerge = "0.8.0"
pollster = "0.4.0"

# ---------------------------------------------------------------------------
# Async runtime and networking
# ---------------------------------------------------------------------------
# tokio declares `default = []`, so there is nothing to switch off; members
# carry their own runtime features (`rt`, `net`, `macros`, ...) since those
# genuinely differ per crate.
tokio = "1.52.3"
tokio-util = { version = "0.7.18", features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
futures = { version = "0.3", default-features = false }
futures-lite = "2"
futures-util = "0.3"
# Defaults off keeps the native-tls/OpenSSL backend out of the tree; every
# member picks rustls explicitly.
reqwest = { version = "0.12", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"

# ---------------------------------------------------------------------------
# Serialisation and encoding
# ---------------------------------------------------------------------------
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
# Canonical wire encoding for everything that gets signed — little-endian,
# varint, no field-reorder leeway, so signatures reproduce byte-for-byte.
postcard = "1.1.3"
toml = "0.8"
quick-xml = "0.38.4"
capnp = "0.26"
capnp-rpc = "0.26"
capnp-futures = "0.26"
capnpc = "0.26"
base64 = "0.22.1"
bs58 = "0.5.1"
base32 = "0.5"
hex = "0.4.3"
bytes = "1.11.1"
flate2 = "1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tar = "0.4"

# ---------------------------------------------------------------------------
# Cryptography and identity
#
# The Ed25519 stack is deliberately conservative. Every qOS signing path
# (`collab-types`, `qos-user-identity`, `threshold-identity`, `app-registry`,
# `pkg`, `runtime-identity`) is on ed25519-dalek 2.x, which consumes `rand_core`
# 0.6 — and `rand` 0.8 is the only release that hands out a 0.6-shaped `OsRng`.
# That is why `rand` is pinned to 0.8 rather than the current 0.10: bumping it
# would not typecheck against `SigningKey::generate`. iroh drags in a *second*
# Ed25519 implementation (ed25519-dalek 3.x) for its own node identity; that is
# iroh's business and must not become ours.
# ---------------------------------------------------------------------------
ed25519-dalek = "2"
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
blake3 = "1.8.5"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
bip39 = "2"

# ---------------------------------------------------------------------------
# Collaboration transport and content addressing
# ---------------------------------------------------------------------------
iroh = "1.0.3"
iroh-base = "1.0.3"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
iroh-mdns-address-lookup = "0.5.0"
# ---------------------------------------------------------------------------
# Media: images, codecs, capture and playback
#
# The gstreamer crates are optional everywhere — the hermetic build, `--shots`
# and CI must never need the gstreamer-1.0 dev stack.
# ---------------------------------------------------------------------------
image = { version = "0.25", default-features = false }
png = "0.18.1"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.10", default-features = false }
openh264 = { version = "0.9", features = ["source"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
rustypipe = { version = "0.11", default-features = false }
# Sender-side discovery and transports for FCast and Google Cast. Disable the
# mobile FFI/logging defaults: qos-projector is a native Rust broker.
fcast-sender-sdk = { version = "0.3.0", default-features = false, features = ["fcast", "chromecast", "discovery"] }
mdns-sd = "=0.20.3"

# ---------------------------------------------------------------------------
# Desktop and platform integration
# ---------------------------------------------------------------------------
wayland-client = "0.31.14"
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
zbus = { version = "4.4", default-features = false }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
fuser = "0.17.0"
notify = { version = "8", default-features = false }
landlock = "0.4"
seccompiler = "0.5"
sd-notify = "0.4"
sysinfo = "0.32"
open = "5.3.5"
libc = "0.2.186"

# ---------------------------------------------------------------------------
# Diagnostics, CLI and the long tail
# ---------------------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.102"
thiserror = "2"
clap = { version = "4.6.1", features = ["derive"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false }
dirs = "6.0.0"
qcms = "0.3.0"
walkdir = "2.5.0"
regex = "1"
semver = "1"
once_cell = "1.21.4"
parking_lot = "0.12.5"
fluent = "0.17.0"
unic-langid = "0.9.6"

# ---------------------------------------------------------------------------
# Test-only
# ---------------------------------------------------------------------------
tempfile = "3.27.0"
serial_test = "3.4.0"
proptest = "1"

# Aggressive release profile. Fat LTO across the workspace + a single
# codegen unit unlock cross-crate inlining — meaningful for the shell
# because most of the hot path (widget draw → wgpu submit, CRDT apply,
# encode/decode) crosses crate boundaries. panic=abort drops the
# unwinding tables + landing pads (a compositor can't meaningfully
# recover from a panic, and abort strips a real chunk of binary size).
# strip=symbols removes the symbol table without touching perf.
# debug=line-tables-only is deliberately kept — cheap on disk, needed
# for perf/BOLT flamegraphs to attribute samples to lines.
#
# Debug builds carry line tables, not full DWARF.
#
# A `target/` here reaches 150+ GB, and it is not the object code: of one
# measured 154 GB tree, 103 GB was `deps/` and 77 GB of that was binaries
# and objects rather than rlibs. This workspace has 97 members and builds
# on the order of 200 test binaries, and cargo's default `debug = true`
# copies full DWARF — every type, every variable, every inlined frame —
# into each of them. Multiplied across per-worktree targets (which cannot
# be shared: cargo's artifact key omits the package path, so worktrees of
# one repo collide) that is what fills a 2.7 TB disk.
#
# `line-tables-only` keeps the part anyone actually reads: a panic still
# names the file and line, backtraces still resolve, and profilers still
# attribute samples. What it drops is variable and type inspection in a
# debugger. If you need that for a session, override it for the one crate
# you are stepping through rather than paying for it across the fleet.
#
# Compile time is unaffected or slightly better; this is a size setting.
#
# Note `target/debug/incremental` is a further ~45 GB and is pure cache —
# it can be deleted at any time and costs only one slower rebuild.
[profile.dev]
debug = "line-tables-only"

# Test binaries are the bulk of the count, so they get the same treatment.
[profile.test]
debug = "line-tables-only"

# Optimise the CRDT core even in a dev build. Every widget's state lives in an
# `AutoCommit`, so almost every test touches this code, and unoptimised it is
# not slow-but-workable — deleting ~3 KB from a text object takes 6.1 s in a
# dev build against 6.9 ms in release, an 890x gap, because the column store is
# built from deep generic iterator chains that only inlining makes sane. Seven
# maps tests hit the 240 s timeout on that alone. These are dependencies, so
# they are compiled once and cached; nothing here is our own code being
# optimised out from under a debugger.
[profile.dev.package.automerge]
opt-level = 3
[profile.dev.package.hexane]
opt-level = 3
[profile.test.package.automerge]
opt-level = 3
[profile.test.package.hexane]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = "line-tables-only"
incremental = false

# Thin-app profile: the release profile, minus the two settings that are
# fundamentally incompatible with dynamic linking of the SDK.
#
#   * `panic = "unwind"` — a Rust `dylib` (and anything linking one, via
#     `-C prefer-dynamic`) must unwind; `panic = "abort"` is rejected.
#   * `lto = false` — fat LTO + `-C prefer-dynamic` is rejected by rustc.
#
# Everything else (opt-level 3, strip, one codegen unit) is inherited so
# thin binaries stay as small + fast as the static ones. This profile is
# how `runtime-dylib` and the thin apps that link it are compiled:
#
#   cargo rustc --profile thin-app -p runtime-dylib -- -C prefer-dynamic
#   cargo rustc --profile thin-app -p <app> --features thin \
#     --bin <bin> -- -C prefer-dynamic
#
# Pass the flag after `--`, never as RUSTFLAGS. The environment variable
# REPLACES `build.rustflags` from .cargo/config.toml rather than adding
# to it, so `RUSTFLAGS='-C prefer-dynamic'` silently drops
# target-cpu=x86-64-v3 and every link-time hardening flag -- full RELRO,
# BIND_NOW, noexecstack and the GNU_PROPERTY shadow-stack mark. The `--`
# form is additive and keeps them.
#
# It is opt-in: nothing builds under it unless `--profile thin-app` is
# passed, so the default `panic = "abort"` release path is untouched.
[profile.thin-app]
inherits = "release"
panic = "unwind"
lto = false

# Optimised, but still a developer build — what a screen recording of the
# compositor needs.
#
# `snapshot` re-renders the scene and PNG-encodes it on the event loop, so
# the frame rate of any recording is the speed of that code: unoptimised it
# is ~1.4 s per frame at 1920x1080, which is not a video anybody can watch.
#
# `--release` is not the answer, because it is not merely optimised. The
# `QOS_TEST_CONTROL` socket the harnesses drive the shell through is a
# complete lock-screen bypass, so `compositor::dev_env` gates it on
# `cfg!(debug_assertions)` and a shipped binary does not contain the code at
# all — there is no flag to turn back on, deliberately. A `--release` shell
# is therefore a compositor the harness cannot reach: it binds no socket and
# says nothing about why.
#
# So: release's optimisation, with the developer surface still compiled in.
# The override is scoped to `shell` alone, which is where the gate is read —
# every dependency stays bit-identical to its release build, so this is
# mostly a re-link rather than a rebuild. `--release` itself is untouched,
# and the OS image and host RPM still ship the closed gate.
[profile.demo]
inherits = "release"

[profile.demo.package.shell]
debug-assertions = true

# Vendored winit fork. Upstream winit 0.30.13 only emits
# `WindowEvent::PinchGesture` on macOS/iOS — its Wayland backend never binds
# `zwp_pointer_gestures_v1`, so touchpad pinch-to-zoom is dead on Linux. The
# vendored copy adds that binding and translates the protocol's pinch
# begin/update/end into the same `PinchGesture` event shape the Apple
# backends emit, giving every `ui` app touchpad pinch-to-zoom for free.
[patch.crates-io]
winit = { path = "vendor/winit" }
# vello reserves its scratch buffers for a 30,000-path stress scene, per
# renderer and so per process -- about 165 MB a desktop never touches. Its
# own source says as much: "hand picked to accommodate ... paris-30k ...
# should instead get derived from the scene layout". On an integrated GPU
# shared by a dozen clients that is the entire memory window, and it froze
# this machine four times in one evening.
#
# The two vendored copies size those buffers from what frames actually
# use instead: the GPU already writes the counts into `BumpAllocators`,
# so the renderer reads them back and grows a `BumpBudget` to fit. That
# is upstream's own TODO ("apply logic to determine whether we need to
# rerun coarse") and is meant to go back to them rather than live here.
# `vendor/vello/src/bump_budget.rs` is the whole of it; the rest of both
# crates is upstream 0.9.0 with the call sites threaded through.
vello_encoding = { path = "vendor/vello_encoding" }
vello = { path = "vendor/vello" }
