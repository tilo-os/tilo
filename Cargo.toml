[workspace]
# Vendored crates stay out: cargo makes a package under this directory a workspace member when a
# member names it by path, and a member's dev-dependencies then build with every workspace build.
exclude = [
    "vendor/leveldb-sys",
    "vendor/hexane",
    "vendor/buffa-build",
    "tools/web/wasm-split",
    "fuzz",
    # A wasm32 library `tilolang bench --library` runs; built by its own build.sh.
    "crates/lang/tilolang-tilo/bench/imagefilter",
    # An app's model as the WebAssembly module its package carries, and the
    # guest side of the host's ABI it needs; built for wasm32 by build.sh.
    # The empty workspace-hack of the greeter's initramfs build (os/image/compile.sh).
    "os/initrd/workspace-hack",
    "vendor/vello",
    "vendor/vello_encoding",
    "vendor/vello_shaders",
    "vendor/genawaiter-proc-macro",
    "vendor/google-cast-protocol",
    "vendor/fcast-sender-sdk",
    "vendor/libspa-sys",
    "vendor/winit",
    "vendor/accesskit_winit",
    "vendor/wgpu",
    "vendor/wgpu-hal",
    "vendor/wayland-backend",
    "vendor/pulldown-cmark",
    "vendor/regex-syntax",
    "vendor/serde_json",
    # Built only by the OS image's bootc (os/Containerfile, bootc-builder).
    "vendor/zlink-macros",
    "vendor/automerge",
    "vendor/librespot-core",
    "vendor/hyper-proxy2",
    "vendor/cosmic-text",
    "vendor/taffy",
    "vendor/alacritty_terminal",
    "vendor/iroh",
    "vendor/iroh-relay",
    "vendor/netwatch",
    "vendor/accesskit_unix",
    "vendor/atspi",
    "vendor/atspi-common",
    "vendor/atspi-proxies",
    "vendor/rustypipe",
    "vendor/miracast",
    "vendor/smithay",
    "vendor/davey",
    "vendor/zbus",
    "vendor/typst-library",
]
# Build `runtime-dylib` with `cargo build -p runtime-dylib --profile thin-app`;
# it requires unwind support, unlike the default release profile.
# Default builds cover core crates. CI checks affected packages and runs
# the full workspace nightly.
