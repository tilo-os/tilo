[workspace]
# tilo-doc-codec-markdown-wasm is intentionally excluded from default `cargo build`
# runs: it is a format-provider guest compiled for `wasm32-unknown-unknown`,
# not a host-target library. Build it from its own directory so its
# `.cargo/config.toml` applies:
# `crates/doc/tilo-doc-codec-markdown-wasm/build.sh`.
exclude = [
    "vendor/leveldb-sys",
    "vendor/buffa-build",
    "vendor/rig-core",
    "tools/web/wasm-split",
    "fuzz",
    "crates/doc/tilo-doc-codec-markdown-wasm",
    "vendor/vello",
    "vendor/vello_encoding",
    "vendor/vello_shaders",
    "vendor/genawaiter-proc-macro",
    "vendor/google-cast-protocol",
    "vendor/fcast-sender-sdk",
    "vendor/libspa-sys",
    "vendor/winit",
    "vendor/accesskit_winit",
    "vendor/wgpu",
    "vendor/wgpu-hal",
    "vendor/wayland-backend",
    "vendor/pulldown-cmark",
    "vendor/regex-syntax",
    # Built only by the OS image's bootc (os/Containerfile, bootc-builder).
    "vendor/zlink-macros",
    "vendor/web-transport-quinn",
    "vendor/automerge",
    "vendor/librespot-core",
    "vendor/hyper-proxy2",
    "vendor/cosmic-text",
    "vendor/iroh",
    "vendor/iroh-gossip",
    "vendor/netwatch",
]
# Build `runtime-dylib` with `cargo build -p runtime-dylib --profile thin-app`;
# it requires unwind support, unlike the default release profile.
# Default builds cover core crates. CI checks affected packages and runs
# the full workspace nightly.
