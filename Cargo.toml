    "crates/doc/qdoc-epub",
    "apps/word-processor",
    "apps/video-player",
    "crates/media",
    "fs",
    "shell",
    "ui",
    "crates/system/os-actions",
    "crates/collab/collab-types",
    "crates/collab/collab-bridge",
    "crates/collab/threshold-identity",
    "crates/collab/channel-crypto",
    "crates/collab/collab-link",
    "crates/collab/frame-link",
    "crates/collab/relay",
    "crates/packaging/pkg",
    "crates/packaging/pkg-cli",
    "crates/packaging/app-registry",
    "crates/packaging/launcher",
