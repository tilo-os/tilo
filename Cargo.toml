[workspace]
# qdoc-codec-markdown-wasm is intentionally excluded from default `cargo build`
# runs: it must be compiled with `--target wasm32-wasip2` and produces a
# Component Model `.wasm`, not a host-target library. Build it explicitly:
# `cargo build -p qdoc-codec-markdown-wasm --target wasm32-wasip2 --release`.
exclude = ["qdoc-codec-markdown-wasm"]
members = [
    "qos-swipe",
    "qos-tts",
    "qdoc",
    "spellcheck",
    "docpdf",
    "dochtml",
    "docrtf",
    "docepub",
    # excluded for demo: "editor",
    # excluded for demo: "fs",
    # excluded for demo: "shell",
    # excluded for demo: "ui",
    "os-actions",
    "qos-collab-types",
    "qos-threshold-identity",
    "qos-channel-crypto",
    "qos-collab-link",
    "qos-relay",
    "qos-pkg",
    "qos-pkg-cli",
    "qos-launcher",
    "qos-runtime",
    "qos-runtime-portal",
    "qos-runtime-collab",
    "qos-runtime-fs",
    "qos-runtime-identity",
    "qos-format-provider-wit",
    "qos-format-host",
    "qos-hello",
    # excluded for demo: "apps/file-explorer",
    # excluded for demo: "apps/terminal",
    # excluded for demo: "apps/browser",
    # excluded for demo: "apps/notes",
    # excluded for demo: "apps/osk",
    # excluded for demo: "apps/collab-broker",
    # excluded for demo: "apps/settings",
    # excluded for demo: "greeter",
    # excluded for demo: "installer",
]
resolver = "2"
