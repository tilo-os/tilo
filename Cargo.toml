# Release binaries keep their symbol table (`strip = "debuginfo"`), so a field
# crash log (the session's crash log) names each frame's function; fully stripped,
# the same backtrace was only `<unknown>` frames. The line tables compiled
# below are stripped: kept in the compositor they would also give file:line,
# but measured on `tilo-session` (thin LTO as packages build it, panic = "abort")
# they grow the zstd-compressed binary from 46 MB to 220 MB, against 42 MB
# fully stripped.
# The OS image, RPM, Debian and Arch packages ship these binaries as built
# (the RPM spec and PKGBUILD turn their strip passes off); Nix's default
# debug-only strip keeps the symbol table too.
# Instruction profiling needs optimized code and symbols, not a whole-program
# release link on every iteration. Keep incremental off so sccache can reuse
# crate compilations without changing the production release profile.
[profile.bench]
opt-level = 3
lto = false
codegen-units = 16
debug = "line-tables-only"
strip = "none"
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, so a process can contain a helper that fails: the compositor
# restarts its collaboration broker rather than end the session. Every other
# panic still aborts the process: tilo-rt installs a hook that aborts outside
# `tilo_rt::panic_boundary::isolate` (see that module).
panic = "unwind"
strip = "debuginfo"
overflow-checks = false
debug = "line-tables-only"
incremental = false

# The early-boot helpers are copied into the initramfs, which every update
# reseals into the UKI: their symbol tables were 12 MB of each UKI, and no crash
# log reads them there.
[profile.release.package.tilo-rollback]
strip = "symbols"
[profile.release.package.tilo-auth]
strip = "symbols"
[profile.release.package.tilo-boot-signin]
strip = "symbols"

# The browser bundles' release build (`build.sh --profile release`). Fat LTO
# and one codegen unit come from `release`. `panic = "abort"` is the only panic
# strategy wasm32-unknown-unknown has on stable: the runtime's panic hook
# reports the message, then the module traps and the page must reload.
# No debug info or symbol table: the bundle size is what matters in a browser.
# Local development builds that must run at near-release speed (the desktop,
# screenshots, a device swap). `release` links with fat LTO and one codegen
# unit: a single rustc for the session reached 24 GB and took the laptop down.
# Without LTO, with parallel codegen and incremental builds, this compiles in
# a fraction of the time and memory and still runs smoothly.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
# The tilolang runtime a session's tests install is bundled as a package is, under the runtime
# bundle's size limit for one program, which this profile's build (no link-time optimisation, its
# symbols kept) passes.
[profile.fast.package.tilolang-process]
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = 3
panic = "abort"
debug = false
strip = "symbols"

# `wasm-release` with the symbol table kept: a bundle that splits its apps is
# split into a start module and per-app modules loaded on demand, and the
# splitter reads function names and relocations from the linked module. The
# modules it writes are stripped.
[profile.wasm-split]
inherits = "wasm-release"
strip = "none"

# `wasm-split` without its whole-program link, as `lounge-check` is `release`
# without it: the local tilo.sh stack's and its checks' bundle, which a
# change to one app relinks in a minute instead of fat LTO's single
# codegen unit over every app. Same opt-level, same split, same wasm-opt; the
# module is larger before wasm-opt and the shipped bundle stays `wasm-split`'s.
[profile.wasm-split-check]
inherits = "wasm-split"
lto = false
codegen-units = 16

# `wasm-split-check` compiled incrementally: the local stack's bundle
# (build.sh --profile local), built in a build directory that stays, as
# `lounge-local` is to `lounge-check`, in as many codegen units.
[profile.wasm-split-local]
inherits = "wasm-split-check"
incremental = true
codegen-units = 256
lto = "off"

# `wasm-release` with the assertions the qualification surface is behind. A
# measured release-speed bundle must still refuse what a dev build refuses
# (`debug_assertions`, `cfg!(debug_assertions)` and the diagnostics that read
# it, overflow checks), so qualification runs on this profile rather than on a
# plain `release` that drops them. Debug information and the symbol table stay
# out: a page streams this module.
[profile.wasm-assert]
inherits = "wasm-release"
debug-assertions = true
overflow-checks = true

# `wasm-assert` with the symbol table kept, for the same reason `wasm-split`
# keeps it: a bundle that splits its apps is split into a start module and
# per-app modules, and the splitter reads the linked module's function names
# and relocations. The modules it writes are stripped.
[profile.wasm-assert-split]
inherits = "wasm-assert"
strip = "none"

# The browser bundles' quick development build (`build.sh --profile quick`).
# Without debug information and with light optimisation, the linked desktop
# module is a quarter of `dev`'s, and wasm-bindgen and the splitter take half
# as long on it, for a compile that is barely slower.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

# Thin-app profile: release settings minus those incompatible with dynamic SDK
# linking.
#
#   * `panic = "unwind"` — a Rust `dylib` (and anything linking one, via
#     `-C prefer-dynamic`) must unwind; `panic = "abort"` is rejected.
#   * `lto = false` — fat LTO + `-C prefer-dynamic` is rejected by rustc.
#
# Thin builds are opt-in. Pass `-C prefer-dynamic` after `--` so workspace
# target and linker hardening flags remain active.
[profile.thin-app]
inherits = "release"
panic = "unwind"
lto = false
# Signed app packages stay fully stripped; only the native release binaries
# keep their symbol table.
strip = "symbols"
# Stripping drops line tables anyway, and any debug info at all makes rustc embed
# its 4.5 KB of gdb scripts in every app, the runtime and each engine.
debug = false
# Pin codegen-units here: CARGO_PROFILE_RELEASE_CODEGEN_UNITS (set for fast
# release links in CI and the image) is inherited by thin-app unless the child
# profile names its own value. The wrapper also forces one unit on each tapp
# crate; this keeps their dependencies on the same size-oriented setting.
codegen-units = 1

# tilo-ui is one crate on the critical path of every thin build: at one unit
# its codegen alone takes about 4.5 of a full collection's 10 minutes. Sixteen
# cost the shared runtime 1.8% in size; tapp crates stay at one unit.
[profile.thin-app.package.tilo-ui]
codegen-units = 16

# Imager's backend is the longest single compile of the thin graph: at one
# unit it took three minutes of a warm build on sixteen cores, after the
# toolkit, so it set when the collection was done. It is linked into Imager
# alone, which has room under its budget for what parallel codegen costs.
[profile.thin-app.package.imager-backend]
codegen-units = 16

# Mail's model and engine are linked into Mail's tapp alone, and build the way
# the app itself does (build-thin-apps.sh knows only the apps' own crates):
# optimised for size, in the one codegen unit above.
[profile.thin-app.package.mail-engine]
opt-level = "z"

# The thin graph of a developer session (PROFILE=thin-dev to
# os/scripts/build-thin-apps.sh, from dist/dev/nested-session-build.sh and
# dist/dev/tilolang-runtime-build.sh together): built for build speed alone,
# since it is never published. Incremental, in rustc's incremental unit count, without
# debug information, and the app crates at these settings too rather than
# size-optimised in one unit (build-thin-apps.sh). Its apps are larger than
# the distribution limit allows; the session installs them, signed with its
# own key, under the local-build ceiling (package_store::size_limit).
[profile.thin-dev]
inherits = "thin-app"
opt-level = 1
codegen-units = 256
incremental = true
debug = false

[profile.thin-dev.package.tilo-ui]
codegen-units = 256

[profile.thin-dev.package.imager-backend]
codegen-units = 256

# The published graph's size setting is for a tapp a person downloads; a
# developer session builds for speed.
[profile.thin-dev.package.mail-engine]
opt-level = 1

# The greeter's initramfs build (os/image/compile.sh, phase rust-boot-greeter):
# release code without its symbol table, since every boot unpacks the
# initramfs and nothing there reads symbols. The initramfs holds it to a size
# budget (os/scripts/build-initramfs.sh), so it links as small as it can. Fat
# LTO and one codegen unit: with the image compile's thin LTO and 8 units its
# binary is 66.2 MB on x86_64, with these 54.2 MB. A panic aborts, which leaves
# out the unwind tables and landing pads: 48.2 MB. A greeter that exits ends
# its link, and tilo-boot-signin asks on the console instead.
[profile.initrd]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The demo profile keeps release optimisation while enabling the session's
# debug-only test-control surface for recordings.
[profile.demo]
inherits = "release"

[profile.demo.package.tilo-session]
debug-assertions = true

# The headless harnesses point a demo-profile launcher at their own app store
# and runtime bundle; those overrides are gated on debug assertions too.
[profile.demo.package.launcher]
debug-assertions = true

# ...and a demo-profile `app` at their own `tilo-install` build.
[profile.demo.package.app-cli]
debug-assertions = true

# The checks' build of the Lounge's programs (tools/ci/publish/lounge-binaries.sh). The image
# ships `release`'s thin whole-program link; a check starts from an empty build directory, takes
# every crate it reuses from the compiler cache and then links that graph whole — a host that
# serves pages carries every app's components, the UI toolkit's renderer, shaping and search
# among them, so that link is the last and longest thing such a run does, for a binary no check
# reads the speed of. Release optimisation without it: the same code at the same opt-level,
# sixteen codegen units, and each cached crate stored without the bitcode a whole-program link
# alone needs.
[profile.lounge-check]
inherits = "release"
lto = false
codegen-units = 16

# `lounge-check` compiled incrementally: the local tilo.sh stack's programs
# (os/containers/tilo-sh/stack.sh), built in a build directory that stays, so
# a one-line change recompiles the parts of the crate it touched rather than
# the whole crate. The same code at the same opt-level, in rustc's 256
# codegen units for incremental builds and without the ThinLTO pass across
# them, so a change re-optimises the units it touched and nothing those units
# were inlined into: with sixteen units and that pass, a one-line change to
# the server's library took 48 s of rustc, without it 21 s. A build that
# starts from an empty directory (a check's) gains nothing from it and keeps
# `lounge-check`, whose crates the compiler cache stores.
[profile.lounge-local]
inherits = "lounge-check"
incremental = true
codegen-units = 256
lto = "off"

# Vendored winit fork adds Wayland `zwp_pointer_gestures_v1` support and maps
# pinch events to winit's existing `PinchGesture` API.
[patch.crates-io]
# Typst's plugin host is the shared wasm host layer's: a plugin call gets per-call fuel, a
# memory cap and the retirement rule every other guest gets. See
# vendor/typst-library/TILO-PATCH.md.
typst-library = { path = "vendor/typst-library" }
# Chromium origin storage reader: bundled engine provenance in vendor/leveldb-sys.
leveldb-sys = { path = "vendor/leveldb-sys" }
# A slab split gives back the capacity its left half no longer uses, so a document edited
# after it loaded holds what it holds, not every buffer its columns were. See
# vendor/hexane/TILO-PATCH.md.
hexane = { path = "vendor/hexane" }
# The content store's metadata database keeps the page cache its owner bounds, not redb's
# Build outputs must not become Cargo inputs; see vendor/buffa-build/PROVENANCE.md.
buffa-build = { path = "vendor/buffa-build" }
# Verify Cast TLS handshake signatures and bound cancellation; identity
# authentication remains a separate explicit trust decision. See provenance.
fcast-sender-sdk = { path = "vendor/fcast-sender-sdk" }
# Spotify parser/session and Rustls proxy repairs; preserve Tilo trust roots.
# See the two vendor PROVENANCE.md files.
librespot-core = { path = "vendor/librespot-core" }
hyper-proxy2 = { path = "vendor/hyper-proxy2" }
# Erasing above the cursor clears the first line too. See
# vendor/alacritty_terminal/PROVENANCE.md.
alacritty_terminal = { path = "vendor/alacritty_terminal" }
# zbus's blocking API runs on a runtime of its own with a worker thread per
# host CPU; one worker, as its message says. See vendor/zbus/PROVENANCE.md.
zbus = { path = "vendor/zbus" }
# The Google Cast message types with their prost code pre-generated, so the
# build no longer compiles a protobuf compiler for one message.
# See vendor/google-cast-protocol/PROVENANCE.md.
google-cast-protocol = { path = "vendor/google-cast-protocol" }
# libspa-sys 0.10.1 lets bindgen discover newer PipeWire inline functions
# through transitive headers, but its emitted C wrapper includes only the
# narrower wrapper.h. Keep the missing direct includes locally until upstream
# ships the same fix; clean Fedora 44 builds otherwise fail in static_fns.c.
libspa-sys = { path = "vendor/libspa-sys" }
# Pinned DX12 shader cache and opt-in Metal presentation feedback; a device-loss
# switch that lets tests reset a Vulkan device. See vendor/wgpu-hal/TILO-PATCH.md.
wgpu-hal = { path = "vendor/wgpu-hal" }
genawaiter-proc-macro = { path = "vendor/genawaiter-proc-macro" }
rustls-native-certs = { path = "crates/core/tilo-native-certs" }
# The pure-Rust server used by Smithay used to panic if a client disappeared
# from inside a request callback which had just created a child object. OAuth
# browser launches make that race easy to hit: a probing helper can connect,
# create a registry object, and exit before dispatch finishes. Keep the
# compositor alive and treat the vanished object as a disconnected client.
# See vendor/wayland-backend/TILO-PATCH.md.
wayland-backend = { path = "vendor/wayland-backend" }
# Tablet pads (zwp_tablet_pad_v2) for clients, which smithay 0.7 lacks.
# See vendor/smithay/TILO-PATCH.md.
smithay = { path = "vendor/smithay" }
# The HTML5 entity table as offsets into two string literals instead of 2125
# pairs of pointers the loader relocates in every app process (it is in the
# shared runtime through the Markdown codec). See
# vendor/pulldown-cmark/TILO-PATCH.md.
pulldown-cmark = { path = "vendor/pulldown-cmark" }
# The Unicode name and case folding tables as string literals and offsets
# instead of about 3,900 entries of pointers the loader relocates in every
# app process (regex is in the shared runtime). Generated by
# tools/regex-syntax-tables.py; see vendor/regex-syntax/TILO-PATCH.md.
regex-syntax = { path = "vendor/regex-syntax" }
# A crate that reads, clones or extends a `serde_json::Value` compiles that
# code once, in serde_json, instead of its own copy: the string parser a raw
# value is read back with, the map's insertion, cloning and comparing, and
# `Value`'s `Clone` and `PartialEq`. Every thin app carried all of them beside
# the shared runtime's. Text is read as bytes, so a type read from both
# compiles one deserializer. See vendor/serde_json/TILO-PATCH.md.
serde_json = { path = "vendor/serde_json" }
# An idle endpoint wakes for nothing: no re-STUN tick and no home relay once
# the relay map is empty, no wall-clock poll on Linux (a timerfd that the
# kernel cancels on resume or a clock step replaces it). See each crate's
# TILO-PATCH.md.
iroh = { path = "vendor/iroh" }
# A server client sends right behind its answer to the server's challenge
# instead of waiting a round trip for the relay to confirm it; iroh turns that
# on for its relay connections. See vendor/iroh-relay/TILO-PATCH.md.
iroh-relay = { path = "vendor/iroh-relay" }
netwatch = { path = "vendor/netwatch" }
# Members depend on `workspace-hack = "0.1"`; this workspace builds the local
# crate, while workspaces outside it get crates.io's empty stub (.config/hakari.toml).
workspace-hack = { path = "crates/workspace-hack" }
# accesskit_unix and atspi enable zbus's async-io backend unconditionally, so
# the tokio-only accessibility stack also built a second async runtime
# (async-executor, async-io, async-process, blocking, ...). The vendored
# releases make the backend follow the crates' `async-io`/`tokio` features;
# accesskit, accesskit_consumer and accesskit_atspi_common stay the crates.io
# releases. rustypipe 0.11.4 used reqwest 0.12, which kept reqwest 0.12, its
# QUIC stack (quinn) and fancy-regex 0.14 in the lock; the vendored release is
# ported to reqwest 0.13 and fancy-regex 0.16. Each change is a manifest edit,
# described in the crate's PROVENANCE.md and vendor/PATCHES.md. Drop an entry
# once upstream releases its change.
accesskit_unix = { path = "vendor/accesskit_unix" }
atspi = { path = "vendor/atspi" }
atspi-common = { path = "vendor/atspi-common" }
atspi-proxies = { path = "vendor/atspi-proxies" }
rustypipe = { path = "vendor/rustypipe" }
