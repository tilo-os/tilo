[workspace]
# qdoc-codec-markdown-wasm is intentionally excluded from default `cargo build`
# runs: it must be compiled with `--target wasm32-wasip2` and produces a
# Component Model `.wasm`, not a host-target library. Build it explicitly:
# `cargo build -p qdoc-codec-markdown-wasm --target wasm32-wasip2 --release`.
exclude = ["crates/doc/qdoc-codec-markdown-wasm"]
members = [
    "crates/system/swipe",
    "crates/system/tts",
    "crates/doc/qdoc",
    "crates/text/spellcheck",
    "crates/doc/qdoc-pdf",
    "crates/doc/qdoc-html",
    "crates/doc/qdoc-rtf",
    "crates/doc/qdoc-epub",
    "apps/word-processor",
    "fs",
    "shell",
    "ui",
    "crates/system/os-actions",
    "crates/collab/collab-types",
    "crates/collab/collab-bridge",
    "crates/collab/threshold-identity",
    "crates/collab/channel-crypto",
    "crates/collab/collab-link",
    "crates/collab/frame-link",
    "crates/collab/relay",
    "crates/packaging/pkg",
    "crates/packaging/pkg-cli",
    "crates/packaging/launcher",
    "crates/packaging/app-fs",
    "crates/packaging/app-host",
    "crates/packaging/runtime-bundle",
    "crates/runtime/runtime",
    "crates/runtime/runtime-portal",
    "crates/runtime/runtime-portal-xdg",
    "crates/runtime/runtime-collab",
    "crates/runtime/runtime-fs",
    "crates/runtime/runtime-identity",
    "crates/runtime/cli",
    "crates/format/format-provider-wit",
    "crates/format/format-host",
    "crates/packaging/hello",
    "crates/packaging/install",
    "crates/packaging/cli-shim",
    "crates/packaging/notes-cli",
    "crates/identity/qos-user-identity",
    "apps/file-explorer",
    "apps/terminal",
    "apps/browser",
    "apps/notes",
    "apps/osk",
    "apps/collab-broker",
    "apps/settings",
    "apps/api_tester",
    "apps/backups",
    "apps/calculator",
    "apps/calendar",
    "apps/camera",
    "apps/chat",
    "apps/code_editor",
    "apps/contacts",
    "apps/containers",
    "apps/db_client",
