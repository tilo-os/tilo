# Tilo is distributed as one AGPL operating-system source tree; workspace
# members inherit this metadata and are not published independently.
[workspace.package]
license = "AGPL-3.0-only"
publish = false
repository = "https://code.tilo.so/tilo/tilo"
homepage = "https://tilo.so"

# workspace-hack is never named in code: it only unifies third-party features.
[workspace.metadata.cargo-machete]
ignored = ["workspace-hack"]

[workspace.lints.rust]
# `tilo_no_js`: a wasm32-unknown-unknown build for a host that is not a
# JavaScript page (a sandboxed format provider), which must link no
# wasm-bindgen glue.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tilo_no_js)"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# `nursery` is unstable and includes documented false positives, so its lints
# are enabled individually below where they catch correctness defects.

# Panics. clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"

# More than eight parameters; clippy.toml sets the threshold.
too_many_arguments = "deny"

# Selected nursery lints.
redundant_clone = "deny"                    # allocations that are never needed
significant_drop_tightening = "deny"        # lock held longer than necessary
significant_drop_in_scrutinee = "deny"      # lock held across a match arm
needless_pass_by_ref_mut = "deny"           # &mut that never mutates
future_not_send = "deny"                    # future that cannot cross threads
while_float = "deny"                        # float loop counter accumulates error
or_fun_call = "deny"                        # eager evaluation in unwrap_or
needless_collect = "deny"                   # collect just to iterate
suspicious_operation_groupings = "deny"     # a.x == b.x && a.y == b.x
collection_is_never_read = "deny"
iter_with_drain = "deny"
unused_peekable = "deny"
literal_string_with_formatting_args = "deny"
as_ptr_cast_mut = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
set_contains_or_insert = "deny"
clear_with_drain = "deny"
trailing_empty_array = "deny"
equatable_if_let = "deny"                   # if let used as an equality test
# Crates list their banned calls in their own clippy.toml; a listed call is an
# error, not a style suggestion.
disallowed_methods = "deny"

# `as_conversions` is broad; pedantic already denies the dangerous cast
# categories more precisely. The blanket lint adds noise to bounded graphics
# conversions.
as_conversions = "allow"

# `duration_suboptimal_units` suggests constructors behind the unstable
# `duration_constructors` feature, so it remains disabled on stable Rust.
duration_suboptimal_units = "allow"

# `must_use_candidate` is too broad for this API; annotate result types,
# guards, builders, and tokens where ignoring a value is harmful.
must_use_candidate = "allow"

[workspace.dependencies]
browser-continuity = { path = "crates/browser/browser-continuity", version = "0.1.0" }
browser-continuity-core = { path = "crates/browser/browser-continuity-core", version = "0.1.0" }

# ---------------------------------------------------------------------------
# UI toolkit stack
#
# Prefer the re-exports in `crates/sdk/ui-core/src/lib.rs`. Direct dependencies must use
# compatible versions to share types such as `vello::Scene`.
# ---------------------------------------------------------------------------
# Tilo's vello fork (vendor/PATCHES.md), published under its own names; the
# libraries keep upstream's names.
vello = { package = "tilo-vello", version = "0.9.0", path = "vendor/vello" }
vello_encoding = { package = "tilo-vello-encoding", version = "0.9.0", path = "vendor/vello_encoding" }
wgpu = "29"
taffy = "0.10.1"
# Tilo's winit fork, published as tilo-winit; the library keeps its name.
# crates.io crates reach it through the `[patch]` facade below. The default
# `wayland-csd-adwaita` draws titles through ab_glyph and owned_ttf_parser;
# `-notitle` keeps the client-side frame without that stack.
winit = { package = "tilo-winit", version = "0.30.13", path = "vendor/winit", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# Automerge 0.12.0 folded the formatting changes of several text objects in
# one diff into a single patch on the first of them, so undoing a mark set
# across several paragraphs cleared it from the first alone. Tilo's fork keeps
# a mark change on its own object (vendor/automerge/TILO-PATCH.md) and is
# published under its own name; the library keeps upstream's.
automerge = { package = "tilo-automerge-fork", version = "0.12.0", path = "vendor/automerge" }
# Every AutoCommit that takes in changes goes through its `ApplyIncoming`.
tilo-automerge = { version = "0.1.0", path = "crates/doc/tilo-automerge" }
tilo-automerge-isolate = { path = "crates/doc/tilo-automerge-isolate" }
pollster = "0.4.0"
rustc-hash = "2.1"
# FNV-1a for stable, persisted identifiers: a fixed algorithm, unlike std's hashers.
fnv = "1"
cosmic-text = { version = "0.19.0", default-features = false }

# ---------------------------------------------------------------------------
# Async runtime and networking
# ---------------------------------------------------------------------------
tokio = "1.52.3"
tilo-rt = { version = "0.1.0", path = "crates/platform/tilo-rt" }
tilo-wake = { version = "0.1.0", path = "crates/platform/tilo-wake" }
tilo-paths = { version = "0.1.0", path = "crates/platform/tilo-paths" }
tilo-clipboard = { version = "0.1.0", path = "crates/platform/tilo-clipboard" }
tilo-dialogs = { version = "0.1.0", path = "crates/platform/tilo-dialogs" }
tilo-notify = { version = "0.1.0", path = "crates/platform/tilo-notify" }
tilo-location = { version = "0.1.0", path = "crates/platform/tilo-location" }
tilo-secrets = { version = "0.1.0", path = "crates/platform/tilo-secrets" }
tilo-net = { path = "crates/platform/tilo-net" }
tilo-sandbox = { version = "0.1.0", path = "crates/platform/tilo-sandbox" }
tokio-util = { version = "0.7.18", features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
futures = { version = "0.3", default-features = false }
futures-util = "0.3"
# Defaults off keeps native-tls/OpenSSL and aws-lc-rs out of the tree. Build
# clients through `tilo_net::http`, which installs the ring provider this
# configuration requires.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
zstd = "0.13"
crc32fast = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
rustls-native-certs = "0.8"
url = "2"
# MIME types from file extensions.
mime_guess = "2.0.5"
# Percent-encoding and form-urlencoding outside a whole `url::Url`.
percent-encoding = "2"
form_urlencoded = "1"
# Media over QUIC networking (moq-lite); driven over web-transport-quinn.
moq-net = "0.3.3"

# ---------------------------------------------------------------------------
# Serialisation and encoding
# ---------------------------------------------------------------------------
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
postcard = "1.1.3"
toml = "1.0"
quick-xml = "0.41.0"
roxmltree = "0.21"
capnp = "0.26"
capnp-rpc = "0.26"
base64 = "0.22.1"
data-encoding = "2.10"
data-encoding-macro = "0.1.19"
hex = "0.4.3"
bytes = "1.11.1"
flate2 = "1"
miniz_oxide = "0.8"
# A standalone build (a published crate) needs flate2 to name its backend;
# zlib-rs is the one the workspace already links.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"

# ---------------------------------------------------------------------------
# Cryptography and identity
#
# ed25519-dalek 3 and x25519-dalek 3 take rand_core 0.10 RNGs; rand,
# rand_core and rand_chacha stay on that generation with them. OS randomness
# comes from getrandom's `SysRng` (`UnwrapErr(SysRng)` where an infallible
# `CryptoRng` is required).
# ---------------------------------------------------------------------------
ed25519-dalek = "3"
rand = "0.10"
rand_core = "0.10"
rand_chacha = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
# Gravatar paths and the Drive fake's checksums.
md-5 = "0.11"
hmac = "0.13"
# SRP-6a for the iCloud sign-in (tilo-crypto `srp`).
pbkdf2 = "0.13"
blake3 = "1.8.5"
# Raw AEAD and password-KDF crates are for `crates/system/tilo-seal` only;
# `tools/policy/check_crypto_dependencies.py` rejects any other direct user.
# `zeroize` keeps the cipher key wiped on drop; 0.11 made it opt-in.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
zeroize = "1"

# ---------------------------------------------------------------------------
# Collaboration transport and content addressing
# ---------------------------------------------------------------------------
iroh = "1.0.3"
iroh-base = "1.0.3"
# Disable unused RPC support and its platform certificate dependencies.
iroh-blobs = { version = "0.103.0", default-features = false, features = ["fs-store", "hide-proto-docs"] }
iroh-gossip = "0.101.0"
# iroh-blobs' BAO tree and RPC layer, for the content store's file-backed
# provider (versions follow iroh-blobs).
bao-tree = { version = "0.16", default-features = false, features = ["experimental-mixed"] }
irpc = { version = "0.17.0", default-features = false }
ref-cast = "1.0.24"
iroh-mdns-address-lookup = "0.5.0"
# Content-defined chunking for the native data plane (normalised FastCDC).
fastcdc = { version = "3.2", default-features = false }
# Embedded metadata database of the storage daemon (already in the graph
# through iroh-blobs' store).
redb = "4.1.0"
# ---------------------------------------------------------------------------
# Media: images, codecs, capture and playback
#
# The gstreamer crates are optional everywhere — the hermetic build, `--shots`
# and CI must never need the gstreamer-1.0 dev stack.
# ---------------------------------------------------------------------------
# 0.25.10 decodes TIFF through tiff 0.11, which shares zune-jpeg 0.5 with the
# JPEG decoder instead of linking a second zune-jpeg/zune-core generation.
image = { version = "0.25.10", default-features = false }
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.10", default-features = false }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
rustypipe = { version = "0.11", default-features = false }
rquickjs = "0.9"
# Sender-side discovery and transports for FCast and Google Cast. Disable the
# mobile FFI/logging defaults: tilo-projector is a native Rust broker.
fcast-sender-sdk = { version = "0.3.0", default-features = false, features = ["fcast", "chromecast", "discovery"] }
mdns-sd = "=0.20.3"
# Miracast (Wi-Fi Display) source for tilo-projector, a standalone crate in
# its own repository until it is published.
miracast = { git = "https://code.tilo.so/tilo/miracast.git", rev = "c37c8cdfcdf7959a1daa38925f0e13d217c083c0", default-features = false }
# FFT for acoustic calibration: deconvolving a recorded sweep into the
# speaker's impulse response and reading its magnitude response.
rustfft = "6.2"

# ---------------------------------------------------------------------------
# Desktop and platform integration
# ---------------------------------------------------------------------------
wayland-client = "0.31.14"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
zbus = { version = "5.16", default-features = false }
# X11, Windows and macOS only; Wayland clients use focus-gated wl_data_device
# through smithay-clipboard (see crates/sdk/tilo-host/src/clipboard.rs).
arboard = { version = "3.6.1", default-features = false }
fuser = "0.18.0"
# Defaults on: the only default is `macos_fsevent`, without which notify has no
# macOS backend and fails to compile there.
notify = "8"
landlock = "0.4"
seccompiler = "0.5"
sd-notify = "0.4"
sysinfo = "0.36"
open = "5.3.5"
libc = "0.2.186"
rustix = "1.1.4"

# ---------------------------------------------------------------------------
# Diagnostics and utilities
# ---------------------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.102"
thiserror = "2"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.9"
strsim = "0.11"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false }
qcms = "0.3.0"
walkdir = "2.5.0"
# The one in-memory cache: fs, thumbnail and the app mount share it.
lru = { version = "0.18.3", default-features = false }
moka = { version = "0.12.15", features = ["sync"] }
regex = "1"
# For patterns in code every browser visitor loads first (action schemas,
# feedback redaction): about a tenth of `regex`'s size, ASCII classes only.
regex-lite = "0.1"
semver = "1"
parking_lot = "0.12.5"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"

# ---------------------------------------------------------------------------
# Test-only
# ---------------------------------------------------------------------------
tempfile = "3.27.0"
serial_test = "3.4.0"
proptest = "1"

