name: Development / inspect ARM disk environment

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:

concurrency:
  group: development-disk-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Observe disposable ARM guest without disk operations
        shell: bash
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh aarch64
          source <(grep '^BASE_REF=' os/base-snapshot.env)
          image=$BASE_REF
          name="tilo-disk-environment-${GITHUB_RUN_ID}"
          evidence="$PWD/disk-environment-evidence"
          mkdir -p "$evidence"
          cleanup() {
            docker cp "$name:/receipt.json" "$evidence/receipt.json" >/dev/null 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker pull --platform linux/arm64 "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/arm64
          docker image inspect --format '{{.Id}}' "$image" > "$evidence/tools-image-id.txt"
          printf '%s\n' "$image" > "$evidence/tools-image-reference.txt"
          # Privilege applies inside the operator-provisioned Kata guest. No
          # host path, Docker socket, credential, TPM or physical disk is bound.
          # This observation cannot certify the provisioner's passthrough policy.
          docker create --name "$name" --platform linux/arm64 --pull=never \
            --privileged --network=none --memory=512m --memory-swap=512m \
            --entrypoint /usr/bin/python3 "$image" /preflight.py
          docker cp os/dev/inspect-disk-environment.py "$name:/preflight.py"
          docker start --attach "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Retain bounded public observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disk-environment-arm64-${{ github.run_id }}
          path: disk-environment-evidence/
          if-no-files-found: warn
