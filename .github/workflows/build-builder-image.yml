name: Build / Tilo builder image

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "os/Containerfile.builder"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "rust-toolchain.toml"
      - "crates/system/atomic-file/**"
      - "tools/ci/check-build-env.sh"
      - "tools/ci/install-pdfium.sh"
      - "tools/ci/native-mold-linker.sh"
      - "tools/ci/verify-native-mold.sh"
      - ".github/workflows/build-builder-image.yml"
  workflow_dispatch:

concurrency:
  group: tilo-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: aarch64
            platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the native architecture
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Restore immutable build inputs
        id: assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save immutable build inputs
        if: steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Read the pinned Rust toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          test -n "$channel"
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and publish the native image
        id: image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          build-contexts: github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: ghcr.io/tilo-os/tilo-builder:sha-${{ github.sha }}-${{ matrix.arch }}

      - name: Attest the image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/tilo-os/tilo-builder
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Retain the digest for the manifest job
        run: |
          mkdir -p digest
          printf '%s\n' '${{ steps.image.outputs.digest }}' > digest/${{ matrix.arch }}

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tilo-builder-${{ matrix.arch }}
          path: digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Download native digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tilo-builder-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish manifest
        run: |
          set -euo pipefail
          refs=()
          for arch in x86_64 aarch64; do
            digest=$(<"digests/$arch")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("ghcr.io/tilo-os/tilo-builder@$digest")
          done
          tags=(--tag "ghcr.io/tilo-os/tilo-builder:sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag ghcr.io/tilo-os/tilo-builder:latest)
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
