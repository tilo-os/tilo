name: Development / focused native test

permissions:
  contents: read
  packages: read

# Diagnostic evidence, not a replacement for required PR checks. Workflow code
# comes from the dispatch ref; source_sha selects only the code being tested.
# Forgejo ignores workflow permissions keys. Checkout credentials are removed;
# no publication or signing secret is passed to the source build.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit (40 lowercase hex characters)'
        required: true
        type: string
      package:
        description: 'One Cargo workspace package'
        required: true
        type: string
      operation:
        description: 'Run one integration test or compile all tests of this package'
        required: true
        default: test
        type: choice
        options: [test, check-tests]
      test_target:
        description: 'Integration target for test, e.g. it; empty for check-tests'
        required: false
        type: string
      test_name:
        description: 'Exact Rust test path; empty for check-tests'
        required: false
        type: string

env:
  SOURCE_SHA: ${{ github.event.inputs.source_sha }}
  PACKAGE: ${{ github.event.inputs.package }}
  OPERATION: ${{ github.event.inputs.operation }}
  TEST_TARGET: ${{ github.event.inputs.test_target }}
  TEST_NAME: ${{ github.event.inputs.test_name }}
  CARGO_HOME: /cargo-home
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  RUSTFLAGS: '-D warnings'
  WGPU_BACKEND: vulkan
  WGPU_ADAPTER_NAME: llvmpipe

jobs:
  builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source: ${{ steps.validate.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate focused request before native admission
        id: validate
        run: python3 -I tools/ci/focused_test.py validate
      - name: Resolve immutable native builder
        id: resolve
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: python3 tools/ci/resolve_builder.py

  focused:
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          path: control
          persist-credentials: false
      - name: Checkout exact test source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          ref: ${{ needs.builder.outputs.source }}
          path: source
          persist-credentials: false
      - name: Restore source lockfile downloads
        id: downloads
        uses: ./control/.github/actions/restore-cargo-downloads
        with:
          lockfile: source/Cargo.lock
      - name: Prepare native compiler cache and headless runtime
        run: |
          ./control/os/dev/assert-native-arch.sh x86_64
          bash control/tools/ci/sccache.sh prepare
          driver=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          test -r "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          mkdir -p /tmp/tilo-focused-runtime
          chmod 700 /tmp/tilo-focused-runtime
          bash control/tools/ensure-headless-audio.sh
      - name: Execute focused request
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-focused-runtime
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
        run: bash control/tools/with-headless-audio.sh python3 -I control/tools/ci/focused_test.py run --root source
      - name: Report compiler cache
        if: always()
        run: bash control/tools/ci/sccache.sh report
      - name: Save source lockfile downloads
        if: always() && steps.downloads.outputs.cache-hit != 'true' && steps.downloads.outputs.cache-key != ''
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: ${{ steps.downloads.outputs.cache-key }}
