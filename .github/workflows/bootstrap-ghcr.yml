name: Infrastructure / bootstrap GHCR

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

jobs:
  import:
    name: Import pinned OCI dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install registry tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Copy immutable images to GHCR
        env:
          LEGACY_REGISTRY_USERNAME: ${{ secrets.LEGACY_REGISTRY_USERNAME }}
          LEGACY_REGISTRY_TOKEN: ${{ secrets.LEGACY_REGISTRY_TOKEN }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$LEGACY_REGISTRY_USERNAME"
          test -n "$LEGACY_REGISTRY_TOKEN"

          images=(
            'ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5|ci-control'
            'ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a|ci-fast'
            'fedora-bootc@sha256:69944835958dda565f8d613587535a3d90e3256cf0a0f0e29bca5ca3d2360d06|fedora-bootc'
            'qos-kernel@sha256:f932be5b8c0df334b853c3436e7b912885c28133cb9ff7aea79adf83e7f822fd|tilo-kernel'
            'rpms@sha256:2caf1fe6010a981f7465754029ffdb92e4ae114246bdbb582d622fe4869c43fa|rpms'
            'tilo-builder@sha256:027e43c051f1f34ce9ac1539172af0e711958243115e2efd08901ffa58729c5a|tilo-builder'
            'tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9|tilo-builder'
            'tilo-development-finalization-tools-aarch64@sha256:a8481a3265c2f4e47287a11163ab8cc13f31b070bba3566d62191c173b54d612|tilo-development-finalization-tools-aarch64'
            'tilo-development-finalization-tools-aarch64@sha256:b8f09490cb08b93ca137a9aca5a7c87b97a218ae33453f6b24b315fb0469903f|tilo-development-finalization-tools-aarch64'
            'tilo-development-reconstructed-native-aarch64@sha256:d695db34b54d6997d400034312fafeaf9d4cee507f282fc5d61284cc2fc964f4|tilo-development-reconstructed-native-aarch64'
            'tilo-development-rpms-aarch64@sha256:912255637bab849ee5c3f62a963481f0b994576ef08cec8ff4fe4bc4cfb9e02f|tilo-development-rpms-aarch64'
            'tilo-development-windows-guest@sha256:592518b08a4c88395b7054c293eab9aeb52750869aba3a59dbe87d98556ae765|tilo-development-windows-guest'
            'tilo-development-wpe-adopted-aarch64@sha256:7a4ce1f1d8985977a18f3b360ff0ff2fda4f53770fee7f6389570c300a4be8ed|tilo-development-wpe-adopted-aarch64'
            'wine-tools@sha256:2a85681f640ebfbe0a15e6e92bd181b13bc674f10ca98b136fed448a754d12d8|wine-tools'
          )

          for mapping in "${images[@]}"; do
            source_ref=${mapping%%|*}
            destination_repository=${mapping#*|}
            digest=${source_ref##*@sha256:}
            skopeo copy --all --preserve-digests \
              --src-creds "$LEGACY_REGISTRY_USERNAME:$LEGACY_REGISTRY_TOKEN" \
              --dest-creds "${{ github.actor }}:$GHCR_TOKEN" \
              "docker://code.podesta.ai/qos/$source_ref" \
              "docker://ghcr.io/tilo-os/$destination_repository:migration-${digest:0:12}"
          done

          for image in tilo-builder wine-tools; do
            skopeo copy --all --preserve-digests \
              --src-creds "$LEGACY_REGISTRY_USERNAME:$LEGACY_REGISTRY_TOKEN" \
              --dest-creds "${{ github.actor }}:$GHCR_TOKEN" \
              "docker://code.podesta.ai/qos/$image:latest" \
              "docker://ghcr.io/tilo-os/$image:latest"
          done
