name: Development / inspect retained guest loaders

permissions:
  contents: read
  packages: read
on:
  workflow_dispatch:
concurrency:
  group: development-inspect-guest7532
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ github.token }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inspect public files without guest execution
        run: |
          command -v readelf docker python3
          python3 os/tests/test_guest_loader_inspection.py
          python3 os/dev/inspect-retained-guest-loaders.py --output "$RUNNER_TEMP/guest-loader-inspection"
      - name: Retain small public diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guest7532-loaders-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guest-loader-inspection/
          retention-days: 7
