name: CI / legacy app E2E

permissions:
  contents: read
  packages: read

# This is a merge gate when compositor/input compatibility changes, plus a
# daily drift check against the Fedora toolkit/application packages installed
# explicitly below. Running it for unrelated documentation or application changes
# would spend runner time without increasing confidence.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/session/shell/src/compositor/**"
      - "crates/session/shell/src/collab/**"
      - "crates/session/shell/src/network/**"
      - "crates/session/shell/src/shell/network.rs"
      - "crates/session/shell/src/shell/overlay_host.rs"
      - "crates/session/shell/src/shell/peer_view.rs"
      - "crates/session/shell/src/shell/state/shared_surfaces.rs"
      - "crates/sdk/ui-core/src/input.rs"
      - "crates/sdk/ui-core/src/interaction.rs"
      - "crates/sdk/ui-core/src/widget/group_row.rs"
      - "scripts/legacy-app-caret-e2e.py"
      - ".github/actions/restore-cargo-downloads/**"
      - ".github/actions/prepare-rust-build/**"
      - ".github/workflows/legacy-app-e2e.yml"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
  # Capacity relief: main-push validation is covered by nightly/manual runs.
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "crates/session/shell/src/compositor/**"
  #     - "crates/session/shell/src/collab/**"
  #     - "crates/session/shell/src/network/**"
  #     - "crates/session/shell/src/shell/network.rs"
  #     - "crates/session/shell/src/shell/overlay_host.rs"
  #     - "crates/session/shell/src/shell/peer_view.rs"
  #     - "crates/session/shell/src/shell/state/shared_surfaces.rs"
  #     - "crates/sdk/ui-core/src/input.rs"
  #     - "crates/sdk/ui-core/src/interaction.rs"
  #     - "crates/sdk/ui-core/src/widget/group_row.rs"
  #     - "scripts/legacy-app-caret-e2e.py"
  #     - ".github/actions/restore-cargo-downloads/**"
  #     - ".github/actions/prepare-rust-build/**"
  #     - ".github/workflows/legacy-app-e2e.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: legacy-app-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .github/workflows/legacy-app-e2e.yml
          sparse-checkout-cone-mode: false
          token: ${{ github.token }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before legacy-app work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .github/workflows/legacy-app-e2e.yml

  caret:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        true
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/tilo-os/tilo-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: never
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}

      - name: Prepare Rust build caches
        uses: ./.github/actions/prepare-rust-build

      - name: Install and verify real app subjects
        run: |
          # Keep large test applications out of the general CI builder. Request
          # only these subjects and required dependencies; record exact versions
          # so failures identify the exact Fedora update-stream versions tested.
          dnf install -y --setopt=install_weak_deps=False \
            gnome-text-editor qt6-qtbase-examples libreoffice-writer
          rpm -q gnome-text-editor qt6-qtbase-examples libreoffice-writer
          command -v gnome-text-editor
          command -v libreoffice
          find /usr/lib64/qt6/examples /usr/lib/qt6/examples \
            -type f -path '*/widgets/lineedits/*/lineedits' -perm /111 \
            -print -quit 2>/dev/null | grep .

      - name: Build the compositor under test
        run: >-
          bash tools/ci/measure.sh "legacy app compositor build" --
          bash scripts/ci-run.sh "cargo build (legacy app E2E)" --
          cargo build --locked -p shell --bin shell

      - name: Exercise caret retention in real Linux applications
        run: >-
          bash tools/ci/measure.sh "legacy app caret E2E" --
          python3 scripts/legacy-app-caret-e2e.py
          --shell target/debug/shell
          --artifacts target/legacy-app-e2e

      - name: Upload screenshots and process logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-app-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/legacy-app-e2e
          if-no-files-found: error
