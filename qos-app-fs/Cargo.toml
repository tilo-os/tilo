[package]
name = "qos-app-fs"
version = "0.1.0"
edition = "2024"
description = "FUSE3 driver that page-fault streams qOS package payloads from a content-addressed blob store."

[dependencies]
fuser = "0.17.0"
blake3 = "1.8.5"
lru = "0.16.3"
thiserror = "2.0.18"
nix = { version = "0.30.1", features = ["mount"] }
libc = "0.2.186"
tracing = "0.1.44"

[dependencies.clap]
version = "4.6.1"
features = ["derive"]
optional = true

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "qos-app-mount"
path = "src/bin/qos-app-mount.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.27.0"
hex = "0.4.3"
