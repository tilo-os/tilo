[package]
name = "davey"
version = "0.1.5"
description = "A Rust implementation of Discord Audio & Video End-to-End Encryption (DAVE) Protocol"
license = "MIT"
homepage = "https://github.com/Snazzah/davey"
repository = "https://github.com/Snazzah/davey"
authors = ["Snazzah <me@snazzah.com>"]
keywords = ["MLS", "Encryption", "E2EE", "Discord", "DAVE"]
edition = "2024"

# Tilo: openmls 0.9 and its 0.6 providers (TILO-PATCH.md), the generation
# the workspace already builds; the Node and Python bindings are left out.
[dependencies]
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
tracing = "0.1.41"
thiserror = "2.0.12"
# Crypto utils
p256 = { version = "0.13" }
rand = "0.8"
sha2 = { version = "0.10" }
hmac = { version = "0.12" }
scrypt = { version = "0.11.0", default-features = false }
num-derive = "0.4.2"
num-traits = "0.2.19"
# aes-gcm
aead = { version = "0.5", default-features = false }
aes = { version = "0.8" }
cipher = { version = "0.4" }
ctr = { version = "0.9" }
ghash = { version = "0.5", default-features = false }
subtle = { version = "2", default-features = false }
hex-literal = { version = "0.3" }

[features]
default = []
# The bindings' switches, kept so their attributes in the sources stay
# inert; this tree builds no bindings.
napi = []
pyo3 = []
