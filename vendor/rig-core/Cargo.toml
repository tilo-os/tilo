[package]
edition = "2024"
rust-version = "1.95.0"
name = "rig-core"
version = "0.44.0"
build = false
exclude = [
    "tests/macro_hygiene.rs",
    "tests/fixtures/telemetry_macro_consumer",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An opinionated library for building LLM powered applications."
readme = "README.md"
license = "MIT"
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
audio = []
default = [
    "derive",
    "rustls",
]
derive = ["dep:rig-derive"]
epub = [
    "dep:epub",
    "dep:quick-xml",
]
image = []
native-tls = [
    "rig-reqwest?/native-tls",
    "rig-tungstenite?/native-tls",
]
pdf = ["dep:lopdf"]
reqwest = ["dep:rig-reqwest"]
rustls = [
    "rig-reqwest?/rustls",
    "rig-tungstenite?/rustls",
]
test-utils = [
    "rig-http/test-utils",
    "dep:tracing-subscriber",
]
tungstenite = [
    "websocket",
    "dep:rig-tungstenite",
]
websocket = ["rig-http/websocket"]

[lib]
name = "rig_core"
path = "src/lib.rs"
doctest = true

[[test]]
name = "driver_adoption"
path = "tests/driver_adoption.rs"

[[test]]
name = "model_listing_warnings"
path = "tests/model_listing_warnings.rs"

[[test]]
name = "openai_responses_websocket"
path = "tests/openai_responses_websocket.rs"

[[test]]
name = "out_of_tree_decoder"
path = "tests/out_of_tree_decoder.rs"

[[test]]
name = "provider_config_base_url_env"
path = "tests/provider_config_base_url_env.rs"

[[test]]
name = "pull_protocol"
path = "tests/pull_protocol.rs"

[[test]]
name = "reqwest_no_ca_store"
path = "tests/reqwest_no_ca_store.rs"
required-features = ["reqwest"]

[[test]]
name = "streaming_conformance_websocket"
path = "tests/streaming_conformance_websocket.rs"
required-features = ["tungstenite"]

[[test]]
name = "websocket_off_runtime"
path = "tests/websocket_off_runtime.rs"
required-features = ["tungstenite"]

