# Release sets resolve `*` from tracked app manifests.

[collections.default]
include = ["*"]
# Browser remains an OS-native WPE integration build.
exclude = ["browser"]

[collections.desktop]
extends = ["default"]

[collections.os]
extends = ["default"]

[collections.recovery]
include = ["file-explorer", "settings", "terminal"]

[features]
music = ["audio", "live"]
video-player = ["decode"]
camera = ["live-capture"]
tube = ["live", "media", "grayjay-sync"]
chat = ["live-media"]
mail = ["live"]
disks = ["live"]
video-editor = ["decode", "gst"]
