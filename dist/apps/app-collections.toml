# Release sets resolve `*` from tracked app manifests.

[collections.default]
include = ["*"]

[collections.desktop]
extends = ["default"]

[collections.os]
extends = ["default"]

[collections.recovery]
include = ["file-explorer", "settings", "terminal"]

[features]
music = ["audio", "live"]
video-player = ["decode"]
camera = ["live-capture"]
tube = ["live", "media", "grayjay-sync"]
mail = ["live"]
disks = ["live"]
video-editor = ["decode", "gst"]
# Typst from its engine library beside the runtime.
typst-editor = ["runtime-engine"]
