# Release sets resolve `*` from tracked app manifests. A tilolang package is named
# beside it: `*` is every native app, and a package joins the collection in the
# change that retires the native app it replaces.
[collections.default]
include = ["*", "tl-calendar", "tl-ebook", "tl-files", "tl-music", "tl-notes", "tl-sheets", "tl-tube", "tl-photos", "tl-pdf", "tl-video"]

[collections.desktop]
extends = ["default"]

[collections.os]
extends = ["default"]

# The apps an OS image bakes into its read-only store (os/scripts/pack-apps.sh,
# from the plan its compile writes): every native app, and the tilolang packages
# in place of the native apps they replaced.
[collections.image]
extends = ["default"]

[collections.recovery]
include = ["tl-files", "settings", "terminal"]

[features]
video-player = ["decode"]
camera = ["live-capture"]
disks = ["live"]
video-editor = ["decode", "gst"]
# Typst from its engine library beside the runtime.
typst-editor = ["runtime-engine"]
# The painting engines from their engine library beside the runtime.
canvas = ["runtime-engine"]
# Account credentials, the IMAP and the WebDAV client from their engine library
# beside the runtime.
settings = ["runtime-engine"]
# The provider panel from the Settings engine library, which holds it for
# Settings.
model-providers = ["runtime-engine"]
# The time-zone database, and the CalDAV client with the account credentials its
# sign-in reaches, from their engine libraries beside the runtime.
calendar = ["runtime-engine"]
clocks = ["runtime-engine"]
messages = ["runtime-engine"]
print-centre = ["runtime-engine"]
# The installer's home-capture worker (not an app: the capture service builds
# it): account credentials with the WebDAV client, and the projection worker's
# FUSE presentation, from their engine libraries beside the runtime.
imager = ["runtime-engine"]
# The app host's client, with its RPC, and the catalogue, from their engine
# library beside the runtime.
store = ["runtime-engine"]
# The emoji catalogue, with its names in every locale, from its engine library
# beside the runtime.
chat = ["runtime-engine"]
osk = ["runtime-engine"]
