# Release sets resolve `*` from tracked app manifests.

[collections.default]
include = ["*"]

[collections.desktop]
extends = ["default"]

[collections.os]
extends = ["default"]

[collections.recovery]
include = ["file-explorer", "settings", "terminal"]

[features]
# Spotify playback and the YouTube client from their engine libraries beside
# the runtime.
music = ["audio", "live", "runtime-engine"]
video-player = ["decode"]
camera = ["live-capture"]
# The YouTube client from its engine library beside the runtime.
tube = ["live", "media", "grayjay-sync", "runtime-engine"]
# Account custody with the IMAP client, and the contact directory, from their
# engine libraries beside the runtime.
mail = ["live", "runtime-engine"]
disks = ["live"]
video-editor = ["decode", "gst"]
# Typst from its engine library beside the runtime.
typst-editor = ["runtime-engine"]
# The painting engines from their engine library beside the runtime.
canvas = ["runtime-engine"]
# Account custody, the IMAP and the WebDAV client from their engine library
# beside the runtime.
settings = ["runtime-engine"]
# The time-zone database, and the CalDAV client with the account custody its
# sign-in reaches, from their engine libraries beside the runtime.
calendar = ["runtime-engine"]
clocks = ["runtime-engine"]
# The contact directory from its engine library beside the runtime.
contacts = ["runtime-engine"]
messages = ["runtime-engine"]
# The PDF engine from its engine library beside the runtime.
pdf-viewer = ["runtime-engine"]
file-explorer = ["runtime-engine"]
word-processor = ["runtime-engine"]
print-centre = ["runtime-engine"]
