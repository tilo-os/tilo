# Product copy for the independently downloadable Tilo app fleet. Every entry
# is rendered as localized English metadata today (tag lines are each app's
# `app-tagline` in apps/<app>/search/<tag>.ftl); app UI language support is
# detected from each app's checked-in locale resources.

