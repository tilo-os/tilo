<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tilo Assistant's icon on the Mac and the iPhone: a message on Tilo's blue, and in it the
       three parts of Tilo's mark as the three dots of somebody at work on an answer. Tilo
       Shell keeps Tilo's mark on its light ground (Bundle/AppIcon.svg), so the two are told
       apart by ground and by figure. build.sh draws every size a bundle carries from this one
       drawing, so no picture is kept in the repository. -->
  <rect width="1024" height="1024" fill="#2a3fd1"/>
  <path fill="#f0e9d8" d="M300 620L236 838Q228 868 256 852L520 690Z"/>
  <rect fill="#f0e9d8" x="162" y="222" width="700" height="470" rx="156"/>
  <circle fill="#9fa6e0" cx="336" cy="457" r="52"/>
  <circle fill="#2a3fd1" cx="512" cy="457" r="62"/>
  <circle fill="#9fa6e0" cx="688" cy="457" r="52"/>
</svg>
