[package]
name = "fs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
bounded-command = { path = "../crates/system/bounded-command" }
atomic-file = { path = "../crates/system/atomic-file" }
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
iroh.workspace = true
iroh-base.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true
automerge.workspace = true
qdoc = { path = "../crates/doc/qdoc" }
collab-types = { path = "../crates/collab/collab-types" }
ed25519-dalek.workspace = true
getrandom.workspace = true
# Keep PDF/video features in the file manager to avoid native decoding
# dependencies in the filesystem daemon.
thumbnail = { path = "../crates/thumbnail" }
tilo-user-identity = { path = "../crates/identity/tilo-user-identity" }
tilo-power-mgmt = { path = "../crates/system/power", default-features = false }
runtime-fs = { path = "../crates/runtime/runtime-fs" }
libc.workspace = true
moka = { version = "0.12.15", features = ["sync"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
hex.workspace = true
blake3.workspace = true
postcard = { workspace = true, features = ["use-std"] }
futures-lite.workspace = true
futures-util.workspace = true
rand.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }

[lints]
workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
fuser.workspace = true

# Shared filesystem and relay data remain available; no native mount provider.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["macos-no-mount"] }
