[package]
name = "fs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../crates/system/atomic-file" }
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
fuser.workspace = true
iroh.workspace = true
iroh-base.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true
automerge.workspace = true
qdoc = { path = "../crates/doc/qdoc" }
collab-types = { path = "../crates/collab/collab-types" }
ed25519-dalek.workspace = true
getrandom.workspace = true
# The shared thumbnail generator + content-addressed cache. Default features
# only (raster images + EPUB covers — pure Rust, no native deps): the OS
# filesystem daemon host-generates the light preview types and never pulls
# pdfium or the gstreamer stack into the image. PDF/video previews are the
# client's job (the file manager builds this crate with those features on).
thumbnail = { path = "../crates/thumbnail" }
# The machine's one device key. The mount derives its iroh node key from
# it rather than minting its own, so the node id names the device.
qos-user-identity = { path = "../crates/identity/qos-user-identity" }
# Bus-free, production battery/AC sampling for speculative-hydration policy.
qos-power-mgmt = { path = "../crates/system/power", default-features = false }
runtime-fs = { path = "../crates/runtime/runtime-fs" }
libc.workspace = true
moka = { version = "0.12.15", features = ["sync"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
hex.workspace = true
blake3.workspace = true
postcard = { workspace = true, features = ["use-std"] }
futures-lite.workspace = true
rand.workspace = true

[dev-dependencies]
# Encode PNG fixtures for the thumbnail tests (the crate itself never decodes
# images — that is the `thumbnail` crate's job).
image = { workspace = true, features = ["png"] }

[lints]
workspace = true
