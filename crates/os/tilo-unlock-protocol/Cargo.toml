[package]
name = "tilo-unlock-protocol"
version = "0.1.0"
edition = "2024"
publish = true
# A desktop's session reaches the server protocol that carries this crate's boot-open report,
# so it is on the client side, which is MIT end to end (LICENSING.md).
license = "MIT"
description = "Wire protocol for unlocking an encrypted Tilo disk with a sibling device's consent."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_unlock_protocol"
path = "src/lib.rs"

# Pure types and pure functions: no I/O, no async runtime, no transport. The
# early-boot client and the sibling service both depend on this crate.
[dependencies]
serde.workspace = true
# How and when early boot opened the system volume.
serde_json.workspace = true
serde_bytes.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# The 4-byte length prefix of every frame, from the one framing crate.
wire-frame = { version = "0.1.0", path = "../../platform/wire-frame" }
# Domain-separated digests of every signed or bound value.
blake3.workspace = true
# Boot keys and the person's root sign with Ed25519.
ed25519-dalek.workspace = true
# HPKE sealing of the sibling half, through the one reviewed sealing crate.
tilo-seal = { version = "0.1.0", path = "../../core/tilo-seal" }
# The boot key's certificate is an ordinary `DeviceCert` the person's root
# signed, so every caller reads it the one way.
tilo-user-identity = { version = "0.1.0", path = "../../core/tilo-user-identity" }
# TPM2 quotes are ECDSA P-256 signatures by the device's attestation key.
p256 = { version = "0.14", features = ["ecdsa"] }
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Fixtures are the exact bytes a TPM wrote, kept as hex.
hex.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
