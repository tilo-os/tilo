[package]
name = "install-plan"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "An install plan for a machine at another place: the choices it makes or leaves open, what its single-use ticket is named by, and where the person's devices keep it."

[dependencies]
install-profile-model = { path = "../install-profile-model" }
tilo-device-identity = { path = "../../collab/tilo-device-identity" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
rand.workspace = true
hex.workspace = true
serde_json.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
