[package]
name = "tilo-connectivity-service"
description = "The session's connectivity service: Wi-Fi, wired, mobile data, airplane mode, the hotspot, VPN profiles and Bluetooth, published as resources whose actions change them through NetworkManager and BlueZ."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
os-actions = { path = "../os-actions" }
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-service = { path = "../../desktop/service" }
# This device's network policy that Tilo keeps itself, beside what NetworkManager holds.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
