[package]
name = "tilo-system-service"
description = "The session's system service: the power mode and the session's power actions, the system update, and the time zone (set, or following the device), published as resources whose actions change them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
# What the disk holds, by category and owner, and the cache cleaner.
tilo-storage-scan = { path = "../storage-scan" }
# The filesystem daemon's storage socket: what this device keeps of each workspace, and the
# changes a person makes to it.
tilo-fs-client = { path = "../../core/tilo-fs-client" }
os-actions = { path = "../os-actions" }
# The protocol the drive service speaks; the service itself is not the session's.
tilo-ntfs-mount = { path = "../ntfs-mount", default-features = false }
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
tilo-actions = { path = "../../core/actions" }
# What is booted, staged and rolled back to, as the deployment status socket lists it.
tilo-deployment-status = { path = "../deployment-status" }
# Following the live update's state as it is written.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
tilo-paths = { path = "../../platform/tilo-paths" }
tilo-system-stats = { path = "../system-stats" }
block-devices = { path = "../block-devices", features = ["udisks"] }
tilo-location = { path = "../../platform/tilo-location" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-formats = { path = "../../ui/tilo-formats" }
tilo-service = { path = "../../desktop/service" }
# The resources' ids, actions and readings' types, which an app shares.
tilo-system-resources = { path = "../../desktop/tilo-system-resources" }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
