[package]
name = "hardware-report"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "What this computer's hardware is, and what the selected Tilo release can say about it"

# Read-only observation of the computer Tilo runs or installs on. The installer
# (on Linux, Windows and macOS) and the running system both read it: the report
# grants nothing, and a change re-probes before it acts.

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(windows)'.dependencies]
# The Windows probe reads the signed drivers through PowerShell, bounded.
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
