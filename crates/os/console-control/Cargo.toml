[package]
name = "console-control"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The action frames a console session app (installer, greeter) that runs outside the Tilo compositor serves"

[lib]
name = "console_control"
path = "src/lib.rs"

# Pure transport and API logic: no ui, winit or rendering dependencies. The
# owning app delivers queued requests to its UI thread itself.
[dependencies]
tilo-action-line = { version = "0.1.0", path = "../../core/action-line" }
tilo-paths.workspace = true
tilo-actions = { path = "../../core/actions" }
serde_json.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
# The console control socket is bound and reached by path.
tilo-files = { path = "../../platform/tilo-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
