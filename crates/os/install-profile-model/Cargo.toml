[package]
name = "install-profile-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
# The app keeps the profile in its resource document: its model and schema
# derive from the plain types here. The standalone media tools take the crate
# without this, so their build resolves no document stack.
model = ["dep:tilo-resource"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# The layouts an install profile may name: plain data, so the media tools that take this crate
# build without the desktop.
tilo-keyboard-catalog = { version = "0.1.0", path = "../../desktop/tilo-keyboard-catalog" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }

[lints]
workspace = true
