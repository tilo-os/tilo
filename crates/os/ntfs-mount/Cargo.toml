[package]
name = "tilo-ntfs-mount"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Consent-guarded NTFS access: the root service that opens a drive only after the person agrees in the shell, its topology-bound remembered choices, and the protocol the shell and Settings speak"

[lib]
name = "ntfs_mount"
path = "src/lib.rs"

[[bin]]
name = "tilo-ntfs-mount"
path = "src/main.rs"
required-features = ["service"]

[features]
default = ["service"]
# The root service. The shell and Settings only speak the protocol and
# depend on this crate without it.
service = ["dep:bounded-command", "dep:tilo-sandbox-core", "dep:tilo-peer-facts"]

[dependencies]
# Waits on the driver and checker with a deadline, without polling.
bounded-command = { path = "../../platform/bounded-command", optional = true }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-peer-facts = { path = "../../system/peer-facts", optional = true }
tilo-sandbox-core = { path = "../../platform/sandbox-core", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
