[package]
autotests = false
name = "tilo-device-steps"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The device's root steps for tilo-vm: overlay layers, generations and sessions, one oneshot unit per step"

[lib]
name = "tilo_device_steps"

# What each step's oneshot unit runs, and what the device's daemon asks for the steps it offers.
[[bin]]
name = "tilo-device-step"
path = "src/main.rs"

[dependencies]
os-actions = { path = "../../system/os-actions" }
launcher = { path = "../../packaging/launcher" }
package-store = { path = "../../packaging/package-store" }
runtime-bundle = { path = "../../packaging/runtime-bundle" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
tilo-files = { path = "../../platform/tilo-files" }
base64.workspace = true
# The content store names a step's bytes by blake3; tree-sync compares files by it.
blake3.workspace = true
jiff.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process", "stdio"] }
serde.workspace = true
# The display settings contract the Settings app uses, for --outputs layouts.
settings-store = { path = "../../system/settings-store" }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
# Parses the account user's package registry from a descriptor opened without following links.
toml.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-device-protocol = { path = "../tilo-device-protocol" }
# Onboarding's controls and the walk through them, shared with the legacy stream.
onboarding-walk = { path = "../../session/onboarding-walk" }
tilo-identity = { path = "../../runtime/tilo-identity" }
uuid.workspace = true
zeroize.workspace = true
tilo-device-identity = { version = "0.1.0", path = "../../collab/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
