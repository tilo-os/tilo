[package]
name = "tilo-printing"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "Typed CUPS integration: queues, jobs and printing through the device's print service."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_printing"
path = "src/lib.rs"

[features]
# Following the print service's queue and job changes: a host's system service turns it on, over
# D-Bus. An app process asks for the queues when it shows them and links no bus.
follow = ["dep:zbus", "dep:tilo-rt", "dep:tilo-machine", "dep:futures-util", "dep:tokio"]

[dependencies]
# Every shell-out is bounded: `ipptool` and `lp` are the print service's own clients.
bounded-command = { package = "tilo-bounded-command", version = "0.1.0", path = "../../platform/bounded-command" }
tracing.workspace = true
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "time"] }
tilo-rt = { version = "0.1.0", path = "../../platform/tilo-rt", optional = true }
# A follow asks the machine's own daemons only when the session owns the machine.
tilo-machine = { version = "0.1.0", path = "../../platform/tilo-machine", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, optional = true, features = ["tokio"] }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
