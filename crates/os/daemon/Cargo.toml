[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-daemon"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The `tilo-runtime` program: this computer's one Tilo daemon, the core's device daemon with the optional subsystems (image model, suspend holds, radio wake reads) mounted on it."

[lib]
name = "tilo_daemon"
path = "src/lib.rs"

[[bin]]
name = "tilo-runtime"
path = "src/bin/tilo-runtime.rs"

# The daemon a walk under Wine runs: the program above, allowed to start a tilolang process
# unconfined where Windows has no AppContainer. Built only with test-support, which nothing that
# ships enables (tools/policy/check_test_support_shipping.py).
[[bin]]
name = "tilo-runtime-unconfined-test"
path = "src/bin/tilo-runtime-unconfined-test.rs"
required-features = ["test-support"]

# The native SDK app the process tests install as a development build (`tests/sdk_app.rs`). It
# is no part of the daemon; the packages that ship install `tilo-runtime` alone.
[[bin]]
name = "tilo-sdk-app"
path = "src/bin/tilo-sdk-app.rs"

# The daemon's own features, as the program is built with them.
[features]
# NEVER SHIP THIS: the developer environment overrides of the daemon it runs
# (tools/policy/check_dev_overrides_contract.py).
dev-overrides = ["tilo-runtime/dev-overrides"]
# A machine that keeps a public workspace runs the apps and agents that answer in it.
agents = ["tilo-runtime/agents"]
# A test's daemon starts the test build of the session as its person's shell.
test-support = ["tilo-runtime/test-support"]

# The integration tests: one binary, its files included as modules by `tests/it.rs`.
[[test]]
name = "it"
path = "tests/it.rs"

# A test of its own: it installs the process's app surface set, as the daemon's program does,
# and a binary of its own keeps that from deciding the other tests' writes.
[[test]]
name = "system_records"
path = "tests/system_records.rs"

[dependencies]
# What the profile's session left for processes outside it, which this process reads
# where no host installed its settings.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
tilo-member-types.workspace = true
# The host keychain its secrets and device proofs live in: a process with no app connection.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets", features = ["host-keyring"] }
tilo-runtime = { path = "../../core/tilo-runtime" }
# The collaboration client the SDK app the process tests install uses, without the toolkit: an
# app's own connection to its workspace.
collaboration = { package = "tilo-collaboration", path = "../../core/collaboration", features = ["native", "broker-transport"] }
tilo-actions = { path = "../../core/actions", features = ["answer-reads"] }
tilo-workspace-service = { path = "../../core/tilo-workspace-service" }
# The language runtime the workspace service reads and changes tilolang apps' records through,
# and the styles it offers: the core names no language, and this program mounts this one.
tilolang-workspace = { path = "../../lang/tilolang-workspace" }
# The device's image model, registered on the daemon's dispatch.
tilo-vision-service = { path = "../../services/vision" }
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
tilo-server-protocol = { path = "../../core/tilo-server-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# The device VPN's tunnel, dialled and answered on the daemon's endpoint: it holds the device key,
# so only it dials as this device. A shell's VPN link is a socket of this device.
device-vpn = { package = "tilo-device-vpn", path = "../device-vpn", default-features = false, features = ["tunnel"] }
tilo-endpoint-reachability = { path = "../../core/endpoint-reachability" }
tilo-socket = { path = "../../platform/tilo-socket", features = ["tokio"] }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
iroh.workspace = true
hex.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-action-services = { version = "0.1.0", path = "../../core/action-services" }
tilo-action-line = { version = "0.1.0", path = "../../core/action-line" }
# The display the apps a language test's daemon starts draw on: a headless compositor, as a
# nested session's own, publishing its name where the daemon reads it.
tilo-compositor = { path = "../../desktop/compositor" }

[target.'cfg(target_os = "linux")'.dependencies]
# What a radio says of waking its machine, read as the OS actions read it.
os-actions = { path = "../os-actions" }
# A request from another of the person's devices holds suspend off while it runs.
tilo-power-mgmt = { path = "../power" }
zbus = { workspace = true, features = ["tokio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

# The person's devices' fabric, which the daemon's speakers travel is checked by: the desktop
# network stack's envelope model, which a phone's daemon does not carry.
[target.'cfg(not(target_os = "android"))'.dependencies]
tilo-network-actor = { path = "../../desktop/network-actor" }
postcard.workspace = true

[dev-dependencies]
tilo-action-types.workspace = true
# The runtime's own seams for a test that serves a connector's connection as the app it runs, and
# the developer overrides a debug build honours anyway: the timed tests run an optimized build,
# whose daemon finds the launcher the run built where `TILO_LAUNCHER_BIN` names it.
tilo-runtime = { path = "../../core/tilo-runtime", features = ["test-support", "dev-overrides"] }
# The workspaces' accounts, as the tests keep one of their own.
accounts = { package = "tilo-accounts", path = "../../integrations/accounts", features = ["person"] }
zeroize.workspace = true
# The signed revocation entry a test hands the devices record, as the root signs it.
postcard.workspace = true
# The workspace service with the agents that read and change the built-in apps' records. Those
# records are the language runtime's, so the tests that drive them run here, beside the daemon
# that links the runtime and mounts it.
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["test-support", "agents"] }
tilo-workspace-records = { path = "../../core/workspace-records" }
tilo-person-services = { path = "../../core/person-services", features = ["test-support", "agents"] }
tilo-app-host = { path = "../../core/app-host", features = ["test-support", "agents"] }
tilo-action-calls = { path = "../../core/action-calls" }
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
tilo-remote-actions = { path = "../../core/remote-actions" }
# The catalogue an installed app's manifest is read from, as a connector's is.
package-store = { package = "tilo-package-store", path = "../../core/package-store" }
tilo-agent-session = { path = "../../core/agent-session" }
# The environment record a fresh workspace's Terminal makes, as the shell runtime tests read it.
tilo-environment = { path = "../../core/environment" }
tilo-automation = { path = "../../core/automation" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-device-identity = { path = "../../core/tilo-device-identity" }
# Where a profile's daemon listens, derived as every client derives it: the process tests reach
# a profile's daemon over the socket it names.
tilo-api = { path = "../../core/tilo-api" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["model", "host"] }
tilo-ui-model = { path = "../../ui/ui-model" }
# The development build the process tests install: its manifest, and the action they hand it to
# the device with.
tilo-app-package = { path = "../../core/tilo-app-package" }
package-actions = { path = "../../core/package-actions" }
tilo-model-gateway = { path = "../../integrations/model-gateway", default-features = false, features = ["host-backend"] }
# The wire a member's write travels to the workspace's host in, as a device speaks it.
tilo-neighbour-wire = { path = "../../core/neighbour-wire" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-resource-store = { path = "../../core/resource-store" }
tilo-user-identity = { path = "../../core/tilo-user-identity" }
# The wire an early boot asks a device of its person for its disk-unlock half with, and what a
# device publishes of the enrolments it answers.
tilo-unlock-protocol = { path = "../../core/tilo-unlock-protocol" }
tilo-workspace-agent = { path = "../../sdk/tilo-workspace-agent" }
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
jiff.workspace = true
uuid.workspace = true
tilo-action-policy = { path = "../../core/action-policy" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-identity = { path = "../../core/tilo-identity" }
tilo-automerge-isolate.workspace = true
tilo-paths.workspace = true
tilo-machine.workspace = true
anyhow.workspace = true
libc.workspace = true
rand.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The device VPN's test build, with the in-memory stack its exit routes into.
device-vpn = { package = "tilo-device-vpn", path = "../device-vpn", default-features = false, features = ["tunnel", "test-support"] }
# A server on this machine's loopback, which a test's device relays through, and the tilolang
# packages a test's device installs, built from the tree's sources, with the runtimes they run on.
test-server = { path = "../../../tools/test-server", features = ["apps"] }
runtime-bundle = { package = "tilo-runtime-bundle", path = "../../core/runtime-bundle" }
# The collaboration wire the refusal is read on, as a program that attaches by hand speaks it.
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab", default-features = false }
# The calendar bridge the daemon runs, and the calendar server a test keeps on loopback.
tilolang-calendar = { path = "../../integrations/tilolang-calendar", features = ["test-support"] }
# The mail bridge the daemon runs, and the mail server a test keeps on loopback.
tilolang-mail = { path = "../../integrations/tilolang-mail", features = ["test-support"] }
# Another of the person's devices, asking the daemon over the device link as their laptop does.
tilo-peer-state = { path = "../../core/tilo-peer-state" }
# The daemon's own log, handed the layers the harness writes.
tilo-startup-metrics = { path = "../../platform/startup-metrics" }
# The MCP session a test's agent runs on the daemon, as `tilo mcp` serves its client.
tilo-mcp = { path = "../../core/tilo-mcp", features = ["test-support"] }
# A device's shell session, which the daemon's shell runs attach to.
tilo-session-client = { path = "../../core/session-client" }
# `tilo do` as a person types it, reaching the daemon's one socket.
tilo-control = { path = "../../desktop/control-cli" }
# The desktop layout and its ownership, which the session's windows are read as.
tilo-desktop-model = { path = "../../desktop/desktop-model" }
# The Files record a test's device keeps, and the tree its writes are read back from.
fs-protocol = { package = "tilo-fs-protocol", path = "../../core/fs-protocol" }
# A migration's fixture profile, which the migration tests read.
tilo-migrate = { path = "../../import/migrate", features = ["fixture"] }
# The keys a moved device's secrets are sealed with, written as a device writes them.
tilo-seal = { path = "../../core/tilo-seal" }
# The content store's chunks, which a file's content is read back from.
tilo-fs = { path = "../../core/fs" }
launcher = { path = "../../core/launcher" }
# ush's shell is Linux's, so the daemon's shell runs are driven where it builds.
ush = { path = "../../vm/ush", features = ["quic"] }
automerge.workspace = true
tilo-automerge.workspace = true
getrandom.workspace = true
http-body-util = "0.1.3"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `tilo-secrets` is named for its `host-keyring` feature alone: the feature links the process's
# keychain backend, and no line of this crate calls the store itself.
ignored = ["tilo-secrets"]
