[package]
name = "imager-backend"
version = "0.1.0"
description = "Native installation actors with portable frontend contracts"
edition = "2024"
publish = false
license.workspace = true

[features]
test-support = ["dep:tilo-install-helpers", "dep:tilo-test-env"]
flatpak-media-writer = ["block-devices/udisks", "dep:zbus"]
# The guided setup's destination side on the live installer medium
# (`destination`): disks, the privileged install, network, power and the
# medium's profile. imager's `destination` feature enables it.
destination = [
    "dep:tilo-connectivity-service",
    "dep:tilo-power-mgmt",
    "dep:console-control",
    "dep:tilo-install-helpers",
    "dep:tilo-lock",
]

[dependencies]
# The host keychain its secrets and device proofs live in: a process with no app connection.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets", features = ["host-keyring"] }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-unlock-protocol = { path = "../../core/tilo-unlock-protocol" }
tilo-test-env = { path = "../../../tools/test-env", optional = true }
tempfile.workspace = true
base64.workspace = true
zeroize.workspace = true
block-devices = { path = "../block-devices" }
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
# The exclusive lock on a target disk or image while it is written.
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
crc32fast.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
staging-handoff-model = { path = "../../../apps/staging-handoff-model" }
install-profile-model = { path = "../install-profile-model", features = ["model"] }
# The destination side (`destination`).
# The device's connectivity, as the network step reads and changes it: the
# system's service, before there is a person whose settings it could keep.
tilo-connectivity-service = { path = "../connectivity-service", optional = true }
tilo-power-mgmt = { path = "../power", default-features = false, optional = true }
console-control = { path = "../console-control", optional = true }
tilo-lock = { path = "../../platform/tilo-lock", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
tilo-process = { path = "../../platform/tilo-process" }
libc.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
block-devices = { path = "../block-devices", features = ["udisks"] }
tilo-install-helpers = { path = "../install-helpers", optional = true }
zbus = { workspace = true, optional = true, features = ["tokio", "blocking-api"] }
tilo-clock = { path = "../../platform/tilo-clock" }

[target.'cfg(windows)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `tilo-secrets` is named for its `host-keyring` feature alone: the feature links the process's
# keychain backend, and no line of this crate calls the store itself.
ignored = ["tilo-secrets"]
