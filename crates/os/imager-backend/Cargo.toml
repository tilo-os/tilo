[package]
name = "imager-backend"
version = "0.1.0"
description = "Native installation actors with portable frontend contracts"
edition = "2024"
publish = false
license.workspace = true

[features]
test-support = ["dep:tilo-install-helpers", "dep:tilo-test-env", "dep:tilo-oauth", "tilo-migrate/test-support"]
flatpak-media-writer = ["block-devices/udisks", "dep:zbus"]
# The guided setup's destination side on the live installer medium
# (`destination`): disks, the privileged install, network, power, online
# accounts and the medium's profile. imager's `destination` feature enables it.
destination = [
    "dep:os-actions",
    "dep:tilo-power-mgmt",
    "dep:console-control",
    "dep:tilo-install-helpers",
    "dep:tilo-lock",
    "tilo-dav/oauth",
]

[dependencies]
tilo-resource = { path = "../../core/tilo-resource" }
tilo-unlock-protocol = { path = "../tilo-unlock-protocol" }
tilo-test-env = { path = "../../../tools/test-env", optional = true }
tilo-seal = { path = "../../core/tilo-seal" }
tempfile.workspace = true
base64.workspace = true
accounts = { path = "../../integrations/accounts", features = ["person"] }
# The accounts vault and the bounded reads it shares with the migration engine.
tilo-migrate = { path = "../../import/migrate" }
account-credentials = { path = "../../integrations/account-credentials" }
zeroize.workspace = true
block-devices = { path = "../block-devices" }
bounded-command = { path = "../../platform/bounded-command" }
# The exclusive lock on a target disk or image while it is written.
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
crc32fast.workspace = true
url.workspace = true
tilo-dav = { path = "../../integrations/tilo-dav" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
staging-handoff-model = { path = "../../../apps/staging-handoff-model" }
install-profile-model = { path = "../install-profile-model", features = ["model"] }
# The destination side (`destination`).
os-actions = { path = "../os-actions", optional = true }
tilo-power-mgmt = { path = "../power", default-features = false, optional = true }
console-control = { path = "../console-control", optional = true }
tilo-lock = { path = "../../platform/tilo-lock", optional = true }
# The live installer's account fixtures for the imager's tests (`test-support`).
tilo-oauth = { path = "../../integrations/tilo-oauth", features = ["fake"], optional = true }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
tilo-process = { path = "../../platform/tilo-process" }
libc.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
block-devices = { path = "../block-devices", features = ["udisks"] }
tilo-install-helpers = { path = "../install-helpers", optional = true }
zbus = { workspace = true, optional = true, features = ["tokio", "blocking-api"] }
tilo-clock = { path = "../../platform/tilo-clock" }

[target.'cfg(windows)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
# The destination namespace checks recognise the fixture roots the tests build in.
tilo-migrate = { path = "../../import/migrate", features = ["test-support"] }
tilo-oauth = { path = "../../integrations/tilo-oauth", features = ["fake"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
