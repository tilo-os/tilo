[package]
name = "tilo-boot-order"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Dual boot: enlists a booted Tilo after Windows in the firmware boot order, after checking every EFI fact, without changing the default."

[lib]
name = "tilo_boot_order"
path = "src/lib.rs"

[[bin]]
name = "tilo-boot-order"
path = "src/main.rs"

[[bin]]
name = "tilo-default-start"
path = "src/default_start_main.rs"

[dependencies]
# No-follow opens of EFI variables and the effective user, without FFI.
rustix = { workspace = true, features = ["fs", "process", "std"] }
# The command line as argparse read it.
tilo-pycompat = { path = "../tilo-pycompat" }
serde = { workspace = true }
serde_json = { workspace = true }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
# The EFI load-option and boot-number records, shared with the imager and the installer.
staging-handoff-model = { path = "../../../apps/staging-handoff-model" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
