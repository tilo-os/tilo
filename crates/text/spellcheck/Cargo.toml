[package]
name = "tilo-spellcheck"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Tilo's spelling engine: tokenize, check, and suggest corrections, with an embedded English list and in-process Hunspell dictionaries"
repository.workspace = true
homepage.workspace = true

[lib]
name = "spellcheck"
path = "src/lib.rs"

[features]
# The dictionaries (the embedded English list, Hunspell) are not linked into
# the checks: the program fetches their code the first time something checks
# spelling and hands it over (`defer_dictionaries`, `install_dictionaries`).
# The browser desktop uses this to keep them out of its start module.
lazy-dictionaries = []

[dependencies]
tilo-paths.workspace = true
# Hunspell dictionaries (.aff/.dic) checked in-process, and the legacy
# 8-bit encodings many of them declare with `SET`.
spellbook = "0.4"
encoding_rs = "0.8"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
