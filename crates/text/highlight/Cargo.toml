[package]
name = "tilo-highlight"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The vocabulary of syntax highlighting: token kinds, spans, and the grammar set the toolkit highlights code with."

[lib]
name = "tilo_highlight"
path = "src/lib.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
