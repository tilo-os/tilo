[package]
name = "tilo-emoji-catalogue"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The emoji catalogue as the toolkit's shared emoji picker and reaction strip read it, for every program that shows them"

[dependencies]
emoji = { path = "../emoji" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
