[package]
name = "pim-lines"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "RFC 5545/6350 content-line codec shared by iCalendar and vCard: folding, parameters and TEXT escaping."

# Pure string handling; no dependencies.
[dependencies]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
