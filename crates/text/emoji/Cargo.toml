[package]
name = "emoji"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo's emoji catalogue: Unicode groups, localised search, skin tones, gender variants, recents and word suggestions"

# Data is checked in under data/ (regenerated by tools/regenerate.py) and
# embedded at compile time: English as plain text, every translation deflated
# by build.rs and inflated the first time its locale is used. serde is only
# for the recents model.
[dependencies]
miniz_oxide.workspace = true
serde.workspace = true
# Name and keyword search.
tilo-search = { path = "../../sdk/search" }
tracing.workspace = true

[build-dependencies]
miniz_oxide.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
