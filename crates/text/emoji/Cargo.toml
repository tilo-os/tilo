[package]
name = "emoji"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo's emoji catalogue: Unicode groups, localised search, skin tones, gender variants, recents and word suggestions"

# Data is checked in under data/ (regenerated by tools/regenerate.py) and
# embedded at compile time; serde is only for the recents model.
[dependencies]
serde.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
