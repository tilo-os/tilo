[package]
name = "migration-sources"
version = "0.1.0"
description = "Reading another computer's Outline, Linear, Forgejo and mail accounts and its Thunderbird profiles, for the installer and for a laptop CLI"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "migration_sources"
path = "src/lib.rs"

[features]
# The sample Thunderbird profile the end-to-end proofs import.
fixture = []
# Recognise the directories tests build their fixtures in, so destination
# namespace checks do not refuse the machine's own temporary directories.
test-support = []

[dependencies]
accounts = { path = "../../system/accounts", features = ["person"] }
# What a typo-free edit to the workspace's accounts record is.
tilo-resource = { path = "../../sdk/tilo-resource" }
base64.workspace = true
blake3.workspace = true
# Calendar's wall-time formats and dates.
jiff.workspace = true
# Pinned, no-follow directory access and its destination namespace protection.
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
hex.workspace = true
mail-parser = "0.11.4"
# RFC 5545/6350 content lines for the vCard and iCalendar Thunderbird keeps.
pim-lines = { path = "../../text/pim-lines" }
reqwest = { workspace = true, features = ["blocking"] }
# Thunderbird's address books and local calendars are SQLite; the bundled
# engine keeps a laptop build from needing the system library.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Thunderbird's saved passwords (NSS: key4.db, logins.json), read so they move
# to the person's vault; the one reviewed home of that cryptography.
tilo-seal = { path = "../../system/tilo-seal" }
tempfile.workspace = true
tilo-net = { workspace = true, features = ["blocking"] }
# The stored RRULE spelling and the time-zone names a calendar keeps.
tilo-recurrence = { version = "0.1.0", path = "../../sdk/tilo-recurrence" }
# Whole-or-not-at-all writes of the entries the inbox keeps.
tilo-files = { path = "../../platform/tilo-files" }
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# The system's own lookup of the familiar folders (`xdg-user-dir`, the Windows shell).
bounded-command = { path = "../../system/bounded-command" }

[target.'cfg(target_os = "linux")'.dependencies]
tilo-paths.workspace = true
# The key a Chromium-family browser keeps its `v11` passwords under, in the system keyring.
tilo-secrets = { path = "../../platform/tilo-secrets" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
tilo-process = { path = "../../platform/tilo-process" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# A local service that answers slowly, so a fetch's request count and wall time can be checked.
test-http = { path = "../../../tools/test-http" }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[[example]]
name = "sample_thunderbird_profile"
required-features = ["fixture"]
