[package]
name = "media"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = []
# Real GStreamer decode: `playbin` diverts video through
# `videoconvert ! appsink(RGBA)` for decoded frames and routes audio to a real
# system sink (`autoaudiosink`) — the audible + visible path. Off by default so
# hermetic builds, `--shots` and CI need no gstreamer-1.0 dev stack, no codecs
# and no media pipeline; the synthesized-frame fallback keeps those green.
# Enable on a host that has the gstreamer stack: `--features decode`.
decode = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Lets `encode` consult the real GStreamer registry when picking an encoder.
# The preference order and the bitrate-unit table in `encode` are pure and
# always compiled; this feature is only what allows the crate to *look* at
# which elements are installed, rather than assume. A consumer that encodes
# (the video editor's export) turns it on; one that only decodes does not need
# it, and `decode` already links gstreamer so both together add nothing.
encode = ["dep:gstreamer"]

[dependencies]
# Transport CRDT. A tiny automerge document carries follow-the-host playback
# state (playing / position / rate / epoch) between peers so a joiner follows
# the host with drift correction. Same pin as `ui` so a single copy resolves.
automerge.workspace = true

# Decode diagnostics: which decoder was plugged, why a hardware path was
# refused, what `QOS_MEDIA_HWDEC` / `QOS_MEDIA_HWENC` were read as. Same pin the
# rest of the workspace resolves, so log filtering behaves identically.
tracing.workspace = true

# The audio graph client reads `pw-dump`'s JSON to enumerate the
# PipeWire/WirePlumber node graph (devices + per-application streams). Same pin
# the rest of the workspace resolves, so no second copy links.
serde_json.workspace = true

# Real decode stack — only linked under `--features decode`. Same pins as
# `apps/tube` / `apps/camera` so no second gstreamer copy resolves.
#
# `v1_24` is required, not cosmetic: `VideoInfoDmaDrm` (which parses a
# `drm-format` caps field into a fourcc + modifier) and `AppSinkCallbacks::
# propose_allocation` (which is what lets the sink advertise `GstVideoMeta`, so
# a decoder will negotiate `memory:DMABuf` at all) both appeared in GStreamer
# 1.24. The build container and the OS image both ship 1.26.
gstreamer = { workspace = true, optional = true, features = ["v1_24"] }
gstreamer-app = { workspace = true, optional = true, features = ["v1_24"] }
gstreamer-video = { workspace = true, optional = true, features = ["v1_24"] }

[dev-dependencies]
# The decode probe example prints pipeline diagnostics; the same subscriber the
# rest of the workspace uses, so log filtering behaves identically.
tracing-subscriber.workspace = true

[lints]
workspace = true
