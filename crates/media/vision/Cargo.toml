[package]
name = "tilo-vision"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Bounded, capability-gated local visual analysis for Tilo media apps."

[dependencies]
agent-provider-config = { path = "../../agent/provider-config" }
tilo-model-gateway = { path = "../../agent/model-gateway" }
base64.workspace = true
hex.workspace = true
image = { workspace = true, features = ["jpeg"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
