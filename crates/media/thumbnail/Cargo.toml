[package]
name = "tilo-thumbnail"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared thumbnail generation and content-addressed caching for files."

# Shared thumbnail generator and content-addressed cache for the FUSE host,
# file manager, pickers, and document apps.
#
# Kept free of `vello`/`wgpu`/`ui` on purpose: the FUSE daemon links this crate
# to host-generate previews, and it must never pull a GPU stack into the OS
# image. Generation yields raw RGBA + encoded PNG bytes; the UI layer converts
# to `peniko::ImageData` at the edge.

[lib]
name = "thumbnail"
path = "src/lib.rs"

[features]
default = []
# Video keyframe extraction through the shared GStreamer media engine; off by
# default to keep hermetic builds free of the GStreamer stack.
video = ["dep:media", "media/decode"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Crash-safe replacement of on-disk thumbnails.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# Shared decode/downscale primitive; the workspace uses one `DynamicImage` type.
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# EPUB cover extraction from ZIP/OPF containers, under the shared zip-bomb bounds.
bounded-zip = { version = "0.1.0", path = "../../doc/bounded-zip", features = ["epub"] }
# Content addressing (same hash the rest of Tilo uses end-to-end).
blake3.workspace = true
# The system content store the encoded previews are kept in.
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false, features = ["dir"] }
# The per-user preview cache location.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
# The staged compute request a batch job reads.
serde_json.workspace = true

# Optional decoders — see [features] above.
media = { version = "0.1.0", package = "tilo-media", path = "../../platform/tilo-media", optional = true }

[dev-dependencies]
tempfile.workspace = true
# Builds EPUB fixtures in tests.
zip.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
