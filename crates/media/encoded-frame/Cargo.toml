[package]
name = "encoded-frame"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The semantic contract of a first-party encoded video frame: codec identity, frame metadata, bounds, validation and the reference-chain admission the callstream and MoQ video profiles share."

[lib]
name = "encoded_frame"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
