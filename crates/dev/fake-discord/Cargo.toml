[package]
name = "fake-discord"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A scriptable stand-in for Discord's REST API, CDN and gateway on loopback, for the Discord connector's tests"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
percent-encoding.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "getrandom", "ring"] }
workspace-hack = { version = "0.1" }
tilo-clock = { path = "../../platform/tilo-clock" }
# The fake voice server: transport encryption (tilo-seal), DAVE as
# Discord's MLS external sender (openmls, the generation davey builds on)
# with each fake voice user a davey session, and Opus for the tones it
# says and hears.
davey.workspace = true
getrandom.workspace = true
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
opus = "0.4"
tilo-seal = { path = "../../system/tilo-seal" }

[lints]
workspace = true
