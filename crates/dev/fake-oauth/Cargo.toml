[package]
name = "fake-oauth"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A stand-in for a provider's sign-in page on loopback, for walking the browser sign-in a server finishes, with no real account"

[dependencies]
# The fake authorization server and its profile endpoint, as the sign-in's
# tests use it.
tilo-oauth = { path = "../../system/tilo-oauth", features = ["fake"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
