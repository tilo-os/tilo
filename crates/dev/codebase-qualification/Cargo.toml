[package]
name = "codebase-qualification"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Qualifies fs, history and collaboration on the real working set"

[lib]
name = "codebase_qualification"
path = "src/lib.rs"

[[test]]
# The qualification run itself: a benchmark, so it is only built when asked
# for by name. It has no skip path — a run either measures this tree or fails.
name = "qualification"
path = "tests/qualification.rs"
required-features = ["benchmark"]

[features]
# The workspace plane the harness drives: the filesystem daemon's namespace,
# content store and history. Without it only the manifest and the reference
# measurements build.
default = ["filesystem"]
# Builds the qualification run. It measures the live tree and prints its
# receipt, so it is never part of an ordinary test build.
benchmark = ["filesystem"]
filesystem = ["dep:fs", "dep:fs-protocol", "dep:iroh-blobs", "dep:collab-types"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
collab-types = { version = "0.1.0", path = "../../collab/collab-types", optional = true }
fs = { package = "tilo-fs", version = "0.1.0", path = "../../system/fs", optional = true }
fs-protocol = { version = "0.1.0", path = "../../system/fs-protocol", optional = true }
iroh-blobs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
