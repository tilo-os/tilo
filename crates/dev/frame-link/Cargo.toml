[package]
name = "frame-link"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Configurable-latency / throughput / drop shim for encoded-frame streams. The reusable primitive behind flatpak-share-demo (encode → shim → decode → side-by-side MP4) and any future test that wants to feed a real encoder/decoder pair through a synthetic-network layer."

[lib]
name = "frame_link"
path = "src/lib.rs"

[[bin]]
name = "flatpak-share-demo"
path = "src/bin/flatpak-share-demo.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The library uses only the standard library and tracing. The demo binary also
# depends on the compositor's encoder, shared-surface decoder and recording
# muxer (all in the video-streaming stack) and the toolkit's text stack.
tracing.workspace = true

# Demo-only dependencies. The demo and library share this workspace crate.
tilo-callstream = { path = "../../collab/tilo-callstream", features = ["surface-decoder", "recording"] }
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime"] }
cosmic-text = { workspace = true, features = ["fontconfig", "swash", "std"] }
tracing-subscriber = { workspace = true, features = ["registry", "fmt", "env-filter"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
