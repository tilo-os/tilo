[package]
name = "test-http"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-process HTTP/1.1 responder for tests: scripted replies, recorded requests, std only."

# Test fixtures only; deliberately free of dependencies so every crate can take
# it as a dev-dependency without widening its build.
[dependencies]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
