[package]
name = "tilo-room-load"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless load for a public room host: many browser guests joining, moving cursors and chatting over the relay's HTTPS routes."

[[bin]]
name = "tilo-room-load"
path = "src/main.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-browser-peer = { path = "../../browser/tilo-browser-peer", default-features = false }
# The relay as the room service builds it, agents included: a governor
# authoring the seeded chat is one of its agents-only host actions.
tilo-relay = { path = "../../hosting/tilo-relay", features = ["web", "agents"] }
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-automerge-isolate.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
collab-types = { path = "../../collab/collab-types" }
automerge.workspace = true
tilo-automerge.workspace = true
tokio = { workspace = true, features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
base64.workspace = true
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
