# Generated by tools/ci/workspace_unify.py: run `python3 tools/ci/workspace_unify.py --write`.
# Every library the workspace builds, its members' and the crates they use, with the features the
# whole workspace resolves for it, so that a cargo family's command, which names this package too,
# builds each as one unit.
[package]
name = "workspace-unify"
version = "0.0.0"
edition = "2024"
publish = false
description = "Makes every member resolve its features as the whole workspace does, whatever selection builds it; builds nothing"

build = "build.rs"

[features]
never = []

[[bin]]
name = "workspace-unify"
path = "main.rs"
required-features = ["never"]
test = false
bench = false
doc = false

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
