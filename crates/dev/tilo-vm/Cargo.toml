[package]
name = "tilo-vm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Host CLI for Tilo dev VMs: per-agent slots, layer swaps and driving"

[lib]
name = "tilo_vm"

[[bin]]
name = "tilo-vm"
path = "src/main.rs"

[dependencies]
quick-xml.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-paths.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tilo-app-package = { path = "../../packaging/tilo-app-package" }
tilo-vm-protocol = { path = "../tilo-vm-protocol" }
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../test-env" }

[lints]
workspace = true
