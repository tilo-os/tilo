[package]
name = "qos-dev-template-smoke"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# cargo-machete does not inspect build-script references or sources brought in
# with include!. These dependencies compile generated and template fixtures.
[package.metadata.cargo-machete]
ignored = ["qos-dev", "serde", "serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui = { package = "qos-app", path = "../../app/qos-app" }

[build-dependencies]
qos-dev = { path = "../qos-dev" }

[lints]
workspace = true
