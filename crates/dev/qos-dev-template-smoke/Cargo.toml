[package]
name = "qos-dev-template-smoke"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# cargo-machete does not inspect build-script crate references. This build
# dependency renders the component fixtures compiled by src/lib.rs.
[package.metadata.cargo-machete]
ignored = ["qos-dev"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui = { path = "../../../ui" }

[build-dependencies]
qos-dev = { path = "../qos-dev" }

[lints]
workspace = true
