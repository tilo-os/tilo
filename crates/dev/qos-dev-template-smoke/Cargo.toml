[package]
name = "qos-dev-template-smoke"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui = { path = "../../../ui" }

[build-dependencies]
qos-dev = { path = "../qos-dev" }

# The smoke crate compiles sources emitted by qos-dev through `include!`, so
# cargo-machete cannot observe these dependencies in the crate's handwritten
# source or its build script even though removing them breaks the compile.
[package.metadata.cargo-machete]
ignored = ["qos-actions", "qos-dev", "serde", "serde_json"]

[lints]
workspace = true
