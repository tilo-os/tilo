[package]
name = "tilo-test-env"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Serialised, self-restoring process environment, XDG fixtures, scenarios and hang-bounded waits for tests"

# Test support only: depend on this from [dev-dependencies], never from a
# production dependency table.

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tempfile.workspace = true

[features]
# `FakeDocumentNet`: a `FakeNet` whose devices carry Automerge changes. Off by
# default, so a package that only needs the environment does not link a CRDT;
# `document` is what a package whose devices carry a document enables.
document = ["dep:automerge", "dep:serde_json", "dep:tilo-automerge"]

[dependencies.automerge]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[dependencies.tilo-automerge]
workspace = true
optional = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
