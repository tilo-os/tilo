[package]
name = "click-test-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A minimal Wayland client that reports pointer and key events, for the shell's sandbox and desktop tests"

# Its own package, not a binary of the shell's: a binary target links its
# package's library, so every shell edit rebuilt and relinked this client
# although it uses none of the shell.
[[bin]]
name = "click_test_client"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.20.0"
wayland-client.workspace = true
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }

[dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
