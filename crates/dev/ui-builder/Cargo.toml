[package]
name = "tilo-ui-builder"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Native visual editor for Tilo serialized UI graphs"

[[bin]]
name = "tilo-ui-builder"
path = "src/main.rs"

[dependencies]
tilo-files = { path = "../../platform/tilo-files" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
