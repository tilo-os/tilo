[package]
name = "tilo-copy-lint"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Source scans that keep English copy literals out of UI builders and Fluent catalogues in step, for tests"

# Test support only: depend on this from [dev-dependencies], never from a
# production dependency table.

[dependencies]
fluent.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
