[package]
name = "tilo-vmd"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Dev-image daemon that owns overlay layers, generations and sessions"

[lib]
name = "tilo_vmd"

[[bin]]
name = "tilo-vmd"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tilo-vm-protocol = { path = "../tilo-vm-protocol" }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
