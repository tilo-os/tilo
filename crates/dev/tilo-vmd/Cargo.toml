[package]
autotests = false
name = "tilo-vmd"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Dev-image daemon that owns overlay layers, generations and sessions"

[lib]
name = "tilo_vmd"

[[bin]]
name = "tilo-vmd"
path = "src/main.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-advisory-lock = { path = "../../system/advisory-lock" }
tilo-atomic-file = { path = "../../system/atomic-file" }
base64.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
# The display settings contract the Settings app uses, for --outputs layouts.
settings-store = { path = "../../system/settings-store" }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tilo-vm-protocol = { path = "../tilo-vm-protocol" }
uuid.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
