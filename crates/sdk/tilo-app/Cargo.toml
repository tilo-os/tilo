[package]
name = "tilo-app"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = ["native", "broker-transport"]
# The native desktop runner and host services; see `tilo-ui`'s `native`.
native = ["ui-core/native"]
# The collaboration manager's built-in broker transport; see `tilo-ui`'s
# `broker-transport`.
broker-transport = ["ui-core/broker-transport"]
test-support = ["ui-core/test-support"]
webview-adblock = ["ui-core/webview-adblock"]
webview-wpe = ["ui-core/webview-wpe"]
dmabuf-import = ["ui-core/dmabuf-import"]
gpu-video = ["ui-core/gpu-video"]
mpris = ["ui-core/mpris"]
portal = ["ui-core/portal"]
# Optional native presentation diagnostics shared by app entrypoints.
presentation-feedback = ["ui-core/presentation-feedback"]
notifications = ["ui-core/notifications"]

[dependencies]
ui-core = { package = "tilo-ui", path = "../ui-core", default-features = false }
# The resource layer the framework binds views to; re-exported so the
# `#[resource]` and `#[derive(Model)]` expansions resolve through the prelude.
tilo-resource = { path = "../tilo-resource" }
tilo-actions = { path = "../../collab/actions" }
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true

[lints]
workspace = true
