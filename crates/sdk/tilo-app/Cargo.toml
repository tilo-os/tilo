[package]
autotests = false
name = "tilo-app"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Tilo application SDK: one app source for Linux, macOS and the web."

# The SDK selects the platform here, and only here: the runner is a
# target-scoped dependency, so an app's `ui = { package = "tilo-app", … }`
# builds for Linux, macOS and wasm32 unchanged. With resolver 2 the features
# below that name the native runner enable nothing on wasm32, where that
# dependency does not exist.
[features]
# Every OS affordance is on by default: the native runner, collaboration over
# the broker, desktop media controls, notifications and GPU video frames. An
# app depends on `tilo-app` and gets all of them; it never picks features to
# get the affordances. On the web the native runner is not linked and these
# select nothing: the platform crates choose each target's backends.
#
# A headless tool that wants only the toolkit opts out with
# `default-features = false` and names what it keeps.
default = ["native", "broker-transport", "mpris", "gpu-video"]
# The native desktop runner and host services; see `tilo-runner-native`.
native = ["dep:tilo-runner-native"]
# The collaboration manager's built-in broker transport; see `tilo-ui`'s
# `broker-transport`. Native only.
broker-transport = ["tilo-runner-native?/broker-transport"]
test-support = ["ui-core/test-support", "tilo-resource/test-support"]
# `chrono`'s dates and times as model values (`tilo_resource`'s `chrono`).
chrono = ["tilo-resource/chrono"]
# Backend features of the native runner; on wasm32 they have no effect.
webview-adblock = ["tilo-runner-native?/webview-adblock"]
dmabuf-import = ["tilo-runner-native?/dmabuf-import"]
gpu-video = ["tilo-runner-native?/gpu-video"]
mpris = ["tilo-runner-native?/mpris"]
# The session's priority contacts over the desktop bus.
priority-contacts = ["tilo-runner-native?/priority-contacts"]
# Optional native presentation diagnostics shared by app entrypoints.
presentation-feedback = ["tilo-runner-native?/presentation-feedback"]
# The Windows DX12 shader cache; see `tilo-ui`. Like `presentation-feedback`,
# it builds only against the workspace's patched wgpu-hal.
dx12-shader-cache = ["tilo-runner-native?/dx12-shader-cache"]

[dependencies]
registry-types = { version = "0.1.0", path = "../../packaging/registry-types" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
ui-core = { version = "0.1.0", package = "tilo-ui", path = "../ui-core", default-features = false }
# The resource layer the framework binds views to; re-exported so the
# `#[resource]` and `#[derive(Model)]` expansions resolve through the prelude.
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# The link grammar `share-link` renders.
tilo-reference = { version = "0.1.0", path = "../../collab/reference" }
tilo-history = { version = "0.1.0", path = "../tilo-history" }
# Portable feedback review, capture and durable delivery contracts.
tilo-feedback = { version = "0.1.0", path = "../../collab/feedback" }
# The default search provider over a resource's entries.
tilo-search = { version = "0.1.0", path = "../search" }
# Merging a collaborator's change in tests, the way sync does.
tilo-automerge.workspace = true
# Files for apps: the portable replacement for `std::fs`, re-exported as `ui::files`.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# The history verbs' typed payload.
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
# The content store a host lends the app (`ViewCx::content`), in every build;
# the native build below adds its directory store for `render`.
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"

# Per-input cost against resource size; reads the framework's phase profiler.
[[example]]
name = "framework-scaling"
required-features = ["test-support"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `render` stores the picture it answers with.
tilo-content = { version = "0.1.0", path = "../../system/content" }
tilo-runner-native = { version = "0.1.0", path = "../runner-native", default-features = false, optional = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
