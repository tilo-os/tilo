[package]
name = "tilo-rich-text"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The SDK rich-text editor: the toolkit's block editor bound to tilo-doc's rich-text resource through the app framework"

[dependencies]
# The framework the editor takes part in (surfaces, dispatcher, live state)
# and the toolkit's block editor it presents the document with.
ui = { package = "tilo-app", path = "../tilo-app", default-features = false }
# The document model and its action vocabulary: every edit is a
# `RichTextAction`, the one path editors, agents and scripts share.
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-document = { path = "../../doc/tilo-document" }
tracing.workspace = true
# The owning resource's action a field edit travels in is serialized for replay.
serde.workspace = true

# The workspace-hack's native feature set does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../tilo-app", features = ["test-support"] }

[lints]
workspace = true
