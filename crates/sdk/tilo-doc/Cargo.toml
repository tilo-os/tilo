[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-doc"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Rich-text and spreadsheet document resources for Tilo"
repository.workspace = true
homepage.workspace = true

[features]
default = ["model"]
# The document resources: the modules that read and write Automerge documents through
# `tilo-resource`, and the actions that change them. A layout-only consumer (text breaks,
# paragraphs and paging) turns it off.
model = ["dep:automerge", "dep:tilo-automerge", "dep:tilo-resource", "dep:tilo-actions", "dep:tilo-content"]
# Hooks for tests that compare the bulk import path with the op-by-op reference.
bulk-instrumentation = []

[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
automerge = { workspace = true, optional = true }
tilo-automerge = { workspace = true, optional = true }
blake3.workspace = true
# Binary inputs (images, binary package parts) are referenced by content address; the bytes live
# in the caller's content store.
tilo-content = { version = "0.1.0", path = "../../core/content", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Ordering keys, history, batched writes and diffs shared by every resource.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }
# The anchor a change's text is named by, which an action's step carries.
tilo-actions = { version = "0.1.0", path = "../../core/actions", optional = true }
# Line-break opportunities and hyphenation, shared by every setter of text into a measure
# (the reader's pages and PDF export).
unicode-linebreak = "0.1.5"
icu_segmenter = "2.3"
unic-langid.workspace = true
# TeX/Liang hyphenation; the common languages here, every language natively (below).
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "english", "german"] }

[[test]]
name = "it"
path = "tests/it.rs"
required-features = ["model"]

[[bin]]
name = "tilo-doc-text"
path = "src/bin/tilo-doc-text.rs"
required-features = ["model"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Hyphenation patterns for every language. The browser build carries English and German only:
# the rest would add about 1 MB to the browser before anything runs.
hypher = { version = "0.1.7", features = ["full"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
