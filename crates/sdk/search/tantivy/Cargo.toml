[package]
name = "tilo-search-tantivy"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The engine of Tilo's search layer: tantivy with Tilo's tokenizers and ranked queries, and DiskIndex."

# tilo-search links this unless its `lazy-engine` leaves it to a library
# opened on first use: libtilo_search_engine.so in the shared runtime
# (crates/runtime/engines/search), a module of its own in the browser.

[lib]
name = "tilo_search_tantivy"
path = "src/lib.rs"

[features]
# `DiskIndex`, a persistent index in an mmap'ed directory. Native only.
disk = ["tantivy/mmap"]
# A way for the search layer's tests to fail a commit half way.
test-support = []

[dependencies]
tilo-search-model = { version = "0.1.0", path = "../model" }
# The engine. Default features add on-disk compression, mmap and the
# stemmers, none of which an in-memory index of short fields uses.
tantivy = { version = "0.22", default-features = false }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The native tests cover `DiskIndex` too.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tilo-search-tantivy = { path = ".", features = ["disk"] }

[package.metadata.cargo-machete]
# The self dev-dependency only turns on `disk` for the tests.
ignored = ["tilo-search-tantivy"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
