[package]
name = "tilo-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tilo's search layer: tantivy with Tilo's folding, tiers and ranking"

[package.metadata.cargo-machete]
# The self dev-dependency only turns on `disk` for the tests.
ignored = ["tilo-search"]

[features]
# `DiskIndex`, a persistent index in an mmap'ed directory. Native only.
disk = ["tantivy/mmap"]

[dependencies]
# The engine. Default features add on-disk compression, mmap and the
# stemmers, none of which an in-memory index of short fields uses.
tantivy = { version = "0.22", default-features = false }
# ICU word breaking, so words are found in scripts written without spaces.
icu_segmenter = "2.3"
# Compatibility decomposition behind folding: `ｃａｆé` finds `cafe`.
unicode-normalization = "0.1.25"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The native tests cover `DiskIndex` too.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tilo-search = { path = ".", features = ["disk"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
