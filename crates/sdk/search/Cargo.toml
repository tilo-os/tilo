[package]
name = "tilo-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tilo's search layer: tantivy with Tilo's folding, tiers and ranking"

[package.metadata.cargo-machete]
# The engine is named only without `lazy-engine`, the engine loader only
# with it; tilo-search-tantivy's test-support only reaches the tests.
ignored = ["tilo-search-tantivy", "tilo-engine-loader"]

[features]
# `DiskIndex`, a persistent index in an mmap'ed directory. Native only.
disk = ["tilo-search-tantivy/disk"]
# The engine (tantivy) is not linked into `SearchIndex`: it arrives when
# something first searches an index too large to answer from its records.
# The browser desktop hands over a loader that fetches its code as a module
# of its own (`defer_engine`, `install_engine`); natively the search layer
# opens libtilo_search_engine.so, the runtime's engine library, whose own
# build turns this on (crates/runtime/engines/search), so the shared runtime
# every app maps leaves tantivy and its stemmers out.
lazy-engine = ["dep:tilo-engine-loader"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-search-model = { version = "0.1.0", path = "model" }
# The engine: named, and linked, only without `lazy-engine` (rustc links no
# crate the code does not name).
tilo-search-tantivy = { version = "0.1.0", path = "tantivy" }
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Opens the engine library on first use (`lazy-engine`).
tilo-engine-loader = { version = "0.1.0", path = "../../runtime/engine-loader", optional = true }

[dev-dependencies]
tempfile.workspace = true
# The tests look inside the engine, and fail its commits on purpose.
tilo-search-tantivy = { version = "0.1.0", path = "tantivy", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
