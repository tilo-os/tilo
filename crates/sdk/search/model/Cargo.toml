[package]
name = "tilo-search-model"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The records, ranking and matching of Tilo's search layer, and the seam to its engine."

# What tilo-search and its engine (tilo-search-tantivy) share. The search
# layer's index lives above both, so a build can name the engine or leave it
# to a library opened on first use (tilo-search's `lazy-engine`).

[lib]
name = "tilo_search_model"
path = "src/lib.rs"

[dependencies]
# ICU word breaking, so words are found in scripts written without spaces.
icu_segmenter = "2.3"
# Compatibility decomposition behind folding: `ｃａｆé` finds `cafe`.
unicode-normalization = "0.1.25"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
