[package]
name = "tilo-resource-macros"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Procedural macros for tilo-resource."

# `#[derive(Model)]` and `#[resource]`: the declarations behind the resource
# layer's golden path. Generated code only calls `tilo_resource`'s public API.

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
