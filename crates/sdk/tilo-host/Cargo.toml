[package]
name = "tilo-host"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Host services a Tilo UI process borrows from whatever hosts it."

# Host services: the clock, background work, clipboard, file choosers, URI
# handlers, speech, notifications, media sessions, location and screen
# capture a UI process borrows from its host. The user-mediated services'
# traits and backends live in their platform crates (`tilo-clipboard`, …);
# `HostServices` is the per-app registry of them. It knows nothing about widgets, layout or documents; `tilo-ui`
# re-exports it under the same module paths.

[features]
# Thread-local chooser and URI backends a test selects for scoped requests.
test-support = ["tilo-dialogs/test-support", "tilo-clock/test-support"]
# The native desktop services (`native::services`): each platform crate's
# system backend, speech, and the backends below. Without it the crate is the
# host vocabulary only, and a host installs its own `host::HostServices`.
native = ["dep:tokio", "dep:jni", "dep:ndk-context", "dep:tilo-files", "dep:tilo-model-client"]
# Screen capture through the XDG Desktop Portal. Linux only: the native
# runner turns it on for Linux targets, and it enables nothing elsewhere.
# File choosers, OpenURI and location are platform crates' (`tilo-dialogs`,
# `tilo-location`), selected per target without a feature.
portal = ["native", "dep:ashpd"]
# The X11 clipboard, for development builds on an X11 host (see the
# toolkit's `x11`).
x11 = ["tilo-clipboard/x11"]
# Desktop media integration: the system's now-playing controls on macOS,
# MPRIS (`org.mpris.MediaPlayer2`) on the Unix session bus elsewhere. zbus
# runs on the workspace's tokio backend; the server lives on its own thread
# with a private runtime.
mpris = ["native", "dep:zbus", "dep:tilo-media"]

[dependencies]
tilo-model-client = { default-features = false, features = ["runtime-client"], version = "0.1.0", path = "../../agent/model-client", optional = true }
agent-provider-config = { version = "0.1.0", path = "../../agent/provider-config" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The authenticated host updates the app process's portable network hints.
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", default-features = false }
# Bounded reads of the host-selected read-only policy projection.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", optional = true }
hex.workspace = true
# PNG and JPEG encoding for every app (`png`, `jpeg`): written here, in the
# shared runtime, so an app that encodes an image does not instantiate the
# encoders' generic code into its own binary.
image = { workspace = true, features = ["png", "jpeg"] }
tilo-rt.workspace = true
# Only the native backends run futures on tokio.
tokio = { workspace = true, optional = true, features = ["full"] }
# The `time` module: the clock types and reads on every target.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tracing.workspace = true
tilo-tts = { version = "0.1.0", path = "../../system/tts" }
unic-langid.workspace = true
winit.workspace = true
# The clipboard vocabulary and each target's clipboard.
tilo-clipboard.workspace = true
# File choosers and URI opening, with each target's backend.
tilo-dialogs.workspace = true
# User notifications, with each target's backend.
tilo-notify.workspace = true
# Device location, with each target's backend.
tilo-location.workspace = true
# The system's now-playing controls where the platform has its own (macOS).
tilo-media = { version = "0.1.0", path = "../../platform/tilo-media", optional = true }
# App-scoped secrets, with each target's store.
tilo-secrets.workspace = true

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
# MPRIS needs a Unix session bus; p2p supports hermetic tests.
zbus = { workspace = true, optional = true, features = ["p2p", "tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true, features = ["screencast"] }

[lints]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# The Android backends call the framework through the activity's JVM, which
# `ndk-context` holds for the process (android-activity installs it).
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }
# winit's Android backend refuses to compile without an activity flavour.
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
