[package]
name = "tilo-model-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "An app's model as a WebAssembly module: the guest side of the document host's model ABI."

[lib]
name = "tilo_model_guest"
path = "src/lib.rs"

# The model modules an app's package carries build this for wasm32
# (`apps/*-model-wasm`), sharing the workspace's lock and target directory so
# its dependencies compile once across apps. Built with `--cfg
# tilo_model_guest`, the resource layer's documents are the device's.

[dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }

# A model's actions reach rand_core 0.6, the RustCrypto generation hpke-rs's
# p256 still takes (tilo-actions keeps an action's large parts as sealed
# content). It draws from getrandom 0.2, which builds for wasm32 only with a
# backend named; a module's is the same as for getrandom 0.4 below.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["custom"] }

# The workspace-hack's native feature set does not build for wasm32 (it turns
# on getrandom's browser backend, mio, ...): only a native build (its tests)
# takes it (tools/policy/check_wasm_workspace_hack.py).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
