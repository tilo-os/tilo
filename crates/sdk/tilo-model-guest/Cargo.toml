[package]
name = "tilo-model-guest"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "A Rust app's model and verbs, built as the WebAssembly module the document host runs: the record's document through host imports, and nothing else."

# docs/architecture/apps.md §2: an app's model and verbs run in the system's document host,
# as a WebAssembly module with no imports beyond the host's. A Rust app's model is the same
# kinds of types with the same verbs as a tilolang package's (one-app-model.md), so its
# module imports one table and exports one function per record.
#
# This crate is the half that is linked into the app's module: it holds the document for the
# length of a call and runs the model's verbs, and everything that is not the model's own
# determinism — the clock, entropy, who invokes — the host supplies. Nothing here names the
# toolkit, the session, a key or a transport.

[lib]
name = "tilo_model_guest"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
base64.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
tilo-model-abi = { version = "0.1.0", path = "../tilo-model-abi" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The module draws a new document's actor id and the ids an action mints through getrandom,
# whose custom backend this crate answers with the host's entropy import (`src/lib.rs`).
getrandom = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
