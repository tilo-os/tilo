[package]
name = "tilo-model-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "An app's model as a WebAssembly module: the guest side of the document host's model ABI."

[lib]
name = "tilo_model_guest"
path = "src/lib.rs"

# Not a member of the repository's workspace: built only for wasm32, by the
# app that ships its model (`apps/*-model-wasm/build.sh`). Its dependencies
# name the same automerge fork the resource layer does, so the two are one
# crate in the module.
[workspace]

[dependencies]
automerge = { package = "tilo-automerge-fork", version = "0.12.0", path = "../../../vendor/automerge" }
base64 = "0.22.1"
blake3 = "1.8.5"
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-actions = { path = "../../collab/actions" }
tilo-resource = { path = "../tilo-resource" }
uuid = { version = "1.23.1", default-features = false }
