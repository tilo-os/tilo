[package]
name = "tilo-model-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "An app's model as a WebAssembly module: the guest side of the document host's model ABI."

[lib]
name = "tilo_model_guest"
path = "src/lib.rs"

# The model modules an app's package carries build this for wasm32
# (`apps/*-model-wasm`), sharing the workspace's lock and target directory so
# its dependencies compile once across apps. Built with `--cfg
# tilo_model_guest`, the resource layer's documents are the device's.

[dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
# A module writes what it answers as JSON; the device writes its requests in
# the compact form (`wire`), which it encodes from JSON.
serde_json = "1.0"
tilo-actions = { path = "../../collab/actions" }
tilo-resource = { path = "../tilo-resource" }

[lints]
workspace = true
