[package]
name = "tilo-app-window"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "A tilolang app's window in the toolkit: the generic adapter, the shell composition and the toolkit's widgets, built from the component patches an app instance sends and reporting what the person did."

[dependencies]
tilo-permissions.workspace = true
tilo-action-line = { version = "0.1.0", path = "../../core/action-line" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { version = "0.1.0", package = "tilo-ui-app", path = "../../ui/ui-app", default-features = false, features = ["model"] }
tilo-rich-edit = { version = "0.1.0", path = "../../ui/tilo-rich-edit" }
# Dates and clocks as the person set them: how a day or a time reads in a sentence, said the
# same way a window's toolkit says it and an app process without the toolkit does.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
tilo-render-protocol = { version = "0.1.0", path = "../../ui/tilo-render-protocol" }
# The page a window shows: its engine, one reader of the engine's events, and the answers to
# the app's page calls.
tilo-page-engine = { version = "0.1.0", path = "../../engines/page-engine" }
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview" }
# The actions the window's app publishes for its command palette.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
# The named scopes a frame's work is counted in (`ui.bind`): what a test reads to see that a
# still frame binds no control again.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A view's sound, and the file a package ships for it: staged natively, a blob URL on a page.
media = { version = "0.1.0", package = "tilo-media", path = "../../engines/tilo-media" }

[dev-dependencies]
# Its own tests drive a page without Chromium.
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview", features = ["test-support"] }
tilo-ui-graph = { version = "0.1.0", path = "../../ui/ui-graph" }
# A content store in memory, as the device's holds a chosen file's bytes.
tilo-content = { version = "0.1.0", path = "../../core/content" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui-app", path = "../../ui/ui-app", features = ["test-support", "model"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# A view's song or video is a Tilo content address (`tilo-blob://…`): the window reads its bytes
# from the device's content store and stages a file the toolkit plays. A page's media element has
# no such store, so this is native only.
tilo-content-device = { version = "0.1.0", path = "../../core/content-device" }

[[example]]
name = "component-catalogue"
path = "examples/component_catalogue.rs"
