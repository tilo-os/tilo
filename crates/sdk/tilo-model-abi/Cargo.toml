[package]
name = "tilo-model-abi"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The imports a Rust app's model module calls and the exports it answers: the document host's ABI, named once for the module and the host that runs it."

# docs/architecture/apps.md §2: an app's model and verbs run as a WebAssembly module with no
# imports beyond the host's. The module (`tilo-model-guest`) and the host that runs it
# (`tilo-model-host`) build apart — one for wasm32, one into the session — so the names they
# agree on are here, with nothing else, and neither can drift from the other.

[lib]
name = "tilo_model_abi"
path = "src/lib.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
