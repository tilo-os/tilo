[package]
autotests = false
name = "tilo-resource"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The resource layer: typed resource state stored in a CRDT, typed replayable
# actions over it, deterministic ids and order, history and replay. It knows
# nothing about rendering, widgets or windows. The UI toolkit uses its
# document-generic history; `tilo-app` binds resources to views.

[dependencies]
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tilo-automerge.workspace = true
uuid.workspace = true
# Wall-clock time that also works in the browser (wasm32) build.
web-time = "1"
tilo-actions = { path = "../../collab/actions" }
tilo-resource-macros = { path = "../tilo-resource-macros" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
