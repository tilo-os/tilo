[package]
name = "tilo-settings-model"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The settings' typed schema, the theme names and the shared sections as resource models, buildable for WebAssembly"

# What settings are, as data: where a typed setting lives and how far it travels, which kind of
# device reads it, the looks and presets a theme is named by, and the sections every app reads.
# It has no store and no window; settings-store keeps the document and the toolkit draws it.

# The settings' records are the settings app's, not a dependent app's: an app that reads the
# schema holds no record of its own (crates/lang/tilo-app-builder/src/resource_kinds.rs).
[package.metadata.tilo]
apps = ["settings"]

[lib]
name = "settings_model"
path = "src/lib.rs"

[features]
default = ["model"]
# The sections as resource models: the `Model` derives on the plain section types and the
# `settings.text-assistance` record the store keeps. A crate that only reads the schema, the
# theme names, the plain section types and the installed settings source turns it off and
# carries no resource model.
model = ["dep:tilo-resource"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
unicode-normalization = "0.1.25"
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
