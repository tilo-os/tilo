[package]
name = "tilo-ui-paint"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license = "MIT"
description = "The drawing layer under Tilo's components and theme: the scene, shapes, colour and pictures"

[dependencies]
vello.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
