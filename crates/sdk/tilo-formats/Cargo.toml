[package]
name = "tilo-formats"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dates, times and clocks as the person set them: the format styles and their rendering, without the toolkit."

[lib]
name = "tilo_formats"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["std", "clock"] }
# The styles are resource fields (`locale` in the settings), so they keep the model derive.
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
