[package]
name = "tilo-component-scan"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Reads a crate of Tilo widgets' sources for its described components, for its build script."

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32, and the
# toolkit names this crate for its wasm32 test builds.
workspace-hack = { version = "0.1" }
