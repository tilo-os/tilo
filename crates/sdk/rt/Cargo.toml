[package]
name = "tilo-rt"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The one async runtime model for Tilo processes: an app runtime off the UI thread, bounded daemon runtimes, a CPU pool and a file-I/O pool."

[lib]
name = "tilo_rt"
path = "src/lib.rs"

# Kept to tokio and rayon: every app, daemon and CLI links this, so it must not
# pull a UI stack or a network stack into a process that has neither.
[dependencies]
rayon = "1.12.0"
thiserror.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }

# tokio supports only sync, macros, io-util, rt and time on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
