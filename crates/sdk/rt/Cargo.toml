[package]
name = "tilo-rt"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The one async runtime model for Tilo processes: an app runtime off the UI thread, bounded daemon runtimes, a CPU pool and a file-I/O pool."

[lib]
name = "tilo_rt"
path = "src/lib.rs"

# Kept to tokio and rayon: every app, daemon and CLI links this, so it must not
# pull a UI stack or a network stack into a process that has neither.
[dependencies]
rayon = "1.12.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
