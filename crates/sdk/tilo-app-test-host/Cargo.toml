[package]
autotests = false
name = "tilo-app-test-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "Headless test host for Tilo apps: a window opened as the workspace broker hosts it, deciding the actions of records another workspace holds."

[dependencies]
tilo-permissions.workspace = true
tilo-app = { path = "../tilo-app", default-features = false, features = ["test-support"] }
# What the workspace broker says of an action a window shows, in the workspace holding its record.
tilo-broker-core = { path = "../../core/broker-core" }
tilo-desktop-model = { path = "../../desktop/desktop-model" }
# The person's settings as the session keeps them: resources of their workspace, here in memory.
settings-sections = { path = "../../desktop/settings-sections", features = ["test-support"] }
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
# What answers a window's calls to a provider a test serves it, as the runner installs it for an app.
tilo-action-calls = { version = "0.1.0", path = "../../core/action-calls", features = ["answer-reads"] }

[dev-dependencies]
collaboration = { package = "tilo-collaboration", path = "../../core/collaboration" }
tilo-action-types.workspace = true
tilo-member-types.workspace = true
tilo-app = { path = "../tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
# The workspace a chain test's devices keep their records in.
uuid.workspace = true
# What the tests read and write beside the app, as the SDK itself does.
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
collab-admission = { package = "tilo-collab-admission", path = "../../core/collab-admission" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tilo-automerge.workspace = true
tilo-content = { path = "../../core/content" }
tilo-history = { path = "../tilo-history" }
tilo-reference = { path = "../../core/reference" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
# The toolkit's collaboration over a real socket, which the collaboration tests drive.
ui-core = { package = "tilo-ui-app", path = "../../ui/ui-app", default-features = false, features = ["broker-transport", "model"] }
# The collaboration host the real-socket tests stand up: it speaks the collaboration wire and keeps
# each channel's record as the device's store does, answering the store's record commands.
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros"] }
# The workspace policy and the person's key the co-editing test signs its moderation with.
tilo-action-policy = { path = "../../core/action-policy" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
automerge.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The unified feature set is native.
workspace-hack = { version = "0.1" }
