[package]
name = "tilo-runner-web"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The web runner of the Tilo app SDK: registers an app for the browser runtime to mount. `tilo-app` selects it on wasm32."
repository.workspace = true
homepage.workspace = true

[dependencies]
ui-core = { version = "0.1.0", package = "tilo-ui", path = "../ui-core", default-features = false }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
