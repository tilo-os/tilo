[package]
name = "tilo-font-catalog"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Tilo's pinned font catalog: its manifest, where it is installed, and verification of its files against their pinned hashes"
repository.workspace = true
homepage.workspace = true

[features]
# The catalog's recorded faces (`faces`): what fontdb reads of each file,
# written when a catalog is built and read by processes that set text.
faces = ["dep:fontdb", "dep:serde_json"]

[dependencies]
serde.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
toml.workspace = true
fontdb = { version = "0.23", default-features = false, features = ["std", "fs"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# `fstatvfs` and `geteuid`: whether a catalog file sits on read-only storage
# this user cannot change (`Trust`).
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
