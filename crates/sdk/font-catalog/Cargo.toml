[package]
name = "tilo-font-catalog"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Tilo's pinned font catalog: its manifest, where it is installed, and verification of its files against their pinned hashes"
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
