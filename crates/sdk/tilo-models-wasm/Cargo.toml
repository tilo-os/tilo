[package]
name = "tilo-models-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Every app's model linked into one WebAssembly module, which wasm-split cuts into the model runtime the apps share and one small module per app."

# Built only for wasm32, by tools/ci/app-models.sh, in the release profile a
# model module is sized with (opt-level z, no unwinding), with the symbol table
# and the linker's relocations kept: wasm-split reads its call graph from them
# and drops both from what it writes.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# Every app that keeps a model, one guest crate each (`apps/<app>-model-wasm`).
# tools/ci/app-models.sh fails when an app's guest crate is missing here.
[dependencies]
activity-model-wasm = { path = "../../../apps/activity-model-wasm" }
assistant-model-wasm = { path = "../../../apps/assistant-model-wasm" }
backups-model-wasm = { path = "../../../apps/backups-model-wasm" }
camera-model-wasm = { path = "../../../apps/camera-model-wasm" }
console-model-wasm = { path = "../../../apps/console-model-wasm" }
db-client-model-wasm = { path = "../../../apps/db-client-model-wasm" }
diffmerge-model-wasm = { path = "../../../apps/diffmerge-model-wasm" }
disk-usage-model-wasm = { path = "../../../apps/disk-usage-model-wasm" }
firewall-model-wasm = { path = "../../../apps/firewall-model-wasm" }
git-client-model-wasm = { path = "../../../apps/git-client-model-wasm" }
hex-editor-model-wasm = { path = "../../../apps/hex-editor-model-wasm" }
logs-model-wasm = { path = "../../../apps/logs-model-wasm" }
maps-model-wasm = { path = "../../../apps/maps-model-wasm" }
poker-model-wasm = { path = "../../../apps/poker-model-wasm" }
publisher-model-wasm = { path = "../../../apps/publisher-model-wasm" }
remote-model-wasm = { path = "../../../apps/remote-model-wasm" }
scratchpad-model-wasm = { path = "../../../apps/scratchpad-model-wasm" }

# The workspace-hack's native feature set does not build for wasm32 (it turns
# on getrandom's browser backend, mio, ...), and a model module is only ever
# built for wasm32 (tools/policy/check_wasm_workspace_hack.py).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
