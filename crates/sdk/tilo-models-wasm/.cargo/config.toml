# What each guest crate's own `.cargo/config.toml` says (no JavaScript glue,
# getrandom's custom backend), and two things this build adds:
# `tilo_model_split`, under which `tilo_model_guest::model!` names each app's
# entry by its app, and the linker's relocations, which wasm-split reads the
# call graph from.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg",
    "tilo_no_js",
    "--cfg",
    'getrandom_backend="custom"',
    "--cfg",
    "tilo_model_split",
    "-Clink-arg=--emit-relocs",
]
