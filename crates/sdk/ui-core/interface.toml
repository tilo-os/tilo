# App ↔ shell: what an app and the session shell say on the shell-ui
# connection the launcher hands the app.
name = "shell-ui"
version = 17
version_const = "crates/sdk/ui-core/src/floating_surface.rs:FLOATING_SURFACE_PROTOCOL_VERSION"
encoding = "json"
served_to_apps = true
sources = [
    "crates/sdk/ui-core/src/floating_surface.rs",
    "crates/sdk/ui-core/src/pick_wire.rs",
    "crates/sdk/ui-core/src/room_sync.rs",
    "crates/sdk/ui-core/src/window_toolbar.rs",
    "crates/sdk/ui-core/src/window_share.rs",
    "crates/sdk/ui-core/src/widget/toast.rs",
    "crates/sdk/ui-core/src/widget/find_bar.rs",
    "crates/sdk/ui-core/src/window_door.rs",
    "crates/sdk/ui-core/src/action_locus.rs",
    "crates/sdk/ui-core/src/shared_selection.rs",
    "crates/sdk/ui-core/src/theme_document.rs",
    "crates/sdk/ui-core/src/tokens/palette.rs",
    "crates/sdk/ui-core/src/tokens/selector.rs",
    "crates/system/settings-store/src/device_displays.rs",
    "crates/collab/actions/src/context.rs",
    "crates/collab/actions/src/selection.rs",
    "crates/collab/actions/src/interaction.rs",
    "crates/collab/actions/src/outcome.rs",
]
roots = ["FloatingSurfaceClientMessage", "FloatingSurfaceHostMessage", "WindowRequest"]

[opaque]
Value = "serde_json::Value: any JSON value"
Uuid = "uuid::Uuid: 16 bytes, written as its hyphenated text"

