<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Tilo UX bench</title><style>
body{font:16px/1.5 system-ui;margin:0;background:#f5f6f8;color:#202530}main{max-width:1200px;margin:auto;padding:32px}h1{font-size:32px;margin-bottom:8px}section{background:white;border:1px solid #d1d7e0;padding:24px;margin:24px 0;border-radius:12px}img{width:100%;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.bad{color:#9b162c}.good{color:#126539}button,select{font:inherit;padding:8px}label{margin-right:12px}.picture{position:relative}.box{position:absolute;border:2px solid #f12650;box-sizing:border-box;pointer-events:none}small{color:#4e5869}li{margin:8px 0}
</style><main><h1 id="title"></h1><p id="goal"></p><h2 id="status"></h2><p id="counts"></p><ul id="failures"></ul><div id="frames"></div><section><h2>Coverage and limits</h2><ul id="coverage"></ul></section><details><summary>Input trace and measurements</summary><pre id="trace"></pre></details></main>
<script>const report=REPORT_DATA;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
document.getElementById('title').textContent=report.scenario.name;
document.getElementById('goal').textContent=report.scenario.goal;
const status=document.getElementById('status');status.textContent=report.passed?'PASS':'FAIL';status.className=report.passed?'good':'bad';
document.getElementById('counts').textContent=`${report.counts.clicks}/${report.scenario.budget.clicks} clicks · ${report.counts.keys}/${report.scenario.budget.keys} keys · ${report.counts.wheel_events} wheel events · ${report.counts.semantic_actions} semantic invocations`;
for(const text of report.failures)document.getElementById('failures').append(el('li',text));
for(const text of report.coverage)document.getElementById('coverage').append(el('li',text));
for(const frame of report.frames){const s=el('section');s.append(el('h2',frame.name));const picture=el('div');picture.className='picture';const img=el('img');img.src=frame.screenshot;img.alt=frame.name;picture.append(img);s.append(picture);
const select=el('select');select.append(el('option','Highlight a target'));for(const name of Object.keys(frame.targets)){const option=el('option',name);option.value=name;select.append(option);}select.onchange=()=>{picture.querySelectorAll('.box').forEach(n=>n.remove());const r=frame.targets[select.value];if(!r)return;const b=el('div');b.className='box';const [w,h]=report.scenario.viewport;Object.assign(b.style,{left:100*r[0]/w+'%',top:100*r[1]/h+'%',width:100*r[2]/w+'%',height:100*r[3]/h+'%'});picture.append(b);};s.append(select);
for(const m of frame.checks){const p=el('pre',`${m.passed?'PASS':'FAIL'} ${JSON.stringify(m.check)}\nObserved: ${JSON.stringify(m.observed)}`);p.className=m.passed?'good':'bad';s.append(p);}const a=el('a','Inspection JSON');a.href=frame.name+'.inspection.json';s.append(a);const resources=el('a',' · Resources and actions');resources.href=frame.name+'.resources.json';s.append(resources);const state=el('pre',JSON.stringify(frame.state,null,2));s.append(state);document.getElementById('frames').append(s);}
document.getElementById('trace').textContent=JSON.stringify(report.trace,null,2);
</script></html>
