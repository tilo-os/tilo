[package]
name = "runtime-dylib"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Opt-in dynamic-library build of the Tilo runtime SDK and UI toolkit. Produces libruntime_dylib.so so thin apps can link the toolkit (and libstd) dynamically via -C prefer-dynamic instead of baking it into every binary."

# A Rust `dylib` requires `panic = "unwind"` and is incompatible with fat LTO,
# unlike the workspace's normal release profile. This standalone wrapper pulls
# the runtime SDK into one dylib and is built only with the opt-in `thin-app`
# profile; thin apps link it with `-C prefer-dynamic`.
[lib]
name = "runtime_dylib"
path = "src/lib.rs"
crate-type = ["dylib"]

# What belongs here: the SDK an app links (the toolkit and `tilo-app`) and
# crates several shipped apps share; the async runtime the toolkit
# runs on and the HTTP client several apps ask (`tilo-rt`, `tilo-net`) are
# shared the same way, re-exported from `lib.rs` so an app links them here.
# What never does: OS daemons and other OS-internal crates (the FUSE
# filesystem, the sandbox launcher, the app host, the install CLI), light
# crates only one app uses, and engines a few apps use, which have their own
# library under crates/engines/loadable/ (Typst, Spotify playback, Canvas's
# painting engines, the YouTube client of Music and Tube, account credentials,
# IMAP and WebDAV for Mail, Settings and Calendar, the time-zone database for
# Calendar and Clocks, the contact directory for Contacts, Mail and Messages,
# the PDF engine for PDF Viewer, Files and Print Centre, the FUSE
# presentation for Imager), and a
# bundled C library apps call themselves (SQLite: this library exports no C
# symbols, so an app whose own code calls sqlite3_* could not link). Code the
# toolkit reaches for every app but only on a particular use is an engine
# the toolkit opens on first use (the search engine, the syntax grammars, the
# ad-block compiler; tilo-engine-loader). Nor does it carry a table of
# pointers where one without is possible (mime_guess, bip39's wordlist,
# regex-syntax's and pulldown-cmark's tables are laid out as offsets). Every
# app process maps this library, so a
# crate here costs every app its relocations and dirty pages; an app that
# needs one of those links it itself, or loads its engine library, and gets
# only the code it calls. tools/policy/check_runtime_dylib_surface.py fails
# when a denied crate re-enters the graph, through any dependency or feature.
[dependencies]
# The UI toolkit and its rendering graph are included in the shared dylib.
# `portal` covers apps that open host files through the XDG portal.
# This must be the superset used by every thin app in the default collection.
# A Rust dylib's exported symbol names contain the dependency crate hash; if an
# app enables a UI feature absent here, Cargo builds a second `ui` instance and
# the app can link successfully but fail at runtime with undefined symbols.
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["portal", "webview-adblock", "dmabuf-import", "gpu-video", "mpris", "model"], default-features = false }
# The apps the runtime library carries present only what changed, through Tilo's wgpu-hal.
tilo-presentation = { path = "../../platform/tilo-presentation", features = ["vulkan-damage"] }
# The web engine client the toolkit's WebView displays: code that talks to a web engine
# names it through the runtime instead of linking its own copy.
tilo-webview = { path = "../../engines/tilo-webview" }
# Apps bind resources, actions and native presentation through this public SDK.
# Keep its dispatcher and runner in the runtime alongside the internal toolkit.
tilo-app = { path = "../tilo-app" }
# Desktop policy and control-surface vocabulary shared by the toolkit and the
# apps that configure the desktop.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
desktop-policy = { package = "tilo-default-apps", path = "../../desktop/default-apps" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-actions = { path = "../../core/actions" }
tilo-identity-client = { path = "../../core/tilo-identity-client" }
tilo-user-identity = { path = "../../core/tilo-user-identity" }
runtime-fs = { package = "tilo-fs-client", path = "../../core/tilo-fs-client" }
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
# Only the gateway's client: its daemon (`service`) runs the models and the
# provider clients, and no app process maps them.
tilo-model-client = { path = "../model-client", default-features = false }
media = { package = "tilo-media", path = "../../engines/tilo-media" }
tilo-files = { path = "../../platform/tilo-files" }
# The async runtime the toolkit runs on, and the HTTP client the model client
# asks: both are linked here already, and re-exported so an app that uses them
# (the agent's web tools, Ebook's catalogue, Mail, Feeds) links them from here
# rather than carrying a copy each.
tilo-rt = { path = "../../platform/tilo-rt" }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
# Versioned format/network engines used by system apps. Keeping these in the
# runtime bundle lets tapps contain policy and UI while the replaceable engine
# implementations are stored once per runtime generation.
vte = "0.15.0"
roxmltree.workspace = true
xattr = "1.6.1"
# The SSH client's curve: Remote and Git Client verify P-384 host keys through
# russh and ssh-key, so it is one copy here, with the primeorder and
# crypto-bigint under it.
p384 = { version = "0.14", default-features = false }
# File types by extension, for the apps that name them (Files, Mail).
tilo-mime = { path = "../../platform/tilo-mime" }
registry-types = { package = "tilo-registry-types", path = "../../core/registry-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["portal", "webview-adblock", "dmabuf-import", "gpu-video", "mpris", "model"] }

[lints]
workspace = true
