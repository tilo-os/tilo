[package]
name = "account-credentials"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Online account credentials: Tilo's OAuth client registrations, OAuth sign-in and refresh for Mail and cloud storage, Nextcloud Login Flow v2, iCloud sessions, and the short-lived handoff to the storage daemon."

[lib]
name = "account_credentials"
path = "src/lib.rs"

# What the installer asks of this build's credential store: the protected-grant
# protocol it speaks.
[[bin]]
name = "tilo-account-credential"
path = "src/bin/tilo-account-credential.rs"
required-features = ["store"]

[[test]]
name = "helper"
path = "tests/helper.rs"
required-features = ["store"]

# The unofficial subscription sign-ins against the live services; ignored
# in ordinary runs, run by the `nightly-live-sign-in` check.
[[test]]
name = "live_sign_in_contracts"
path = "tests/live_sign_in_contracts.rs"
required-features = ["store"]

[[test]]
name = "icloud_auth"
path = "tests/icloud_auth.rs"
required-features = ["store"]

[features]
default = ["store"]
# The credential store itself: sign-in, sealing, refresh and the daemon handoff,
# with the HTTPS client and the storage providers it resolves new accounts
# against. Without it the crate is the client registrations and provider
# descriptors only, for builds that must stay free of the TLS/HTTP stack.
hints = ["dep:tilo-seal", "dep:serde_json", "dep:url", "dep:zeroize", "dep:sha2"]
# Signing in with Hugging Face for model downloads, and renewing that
# sign-in: what the model manager needs, without the credential store.
hugging-face = ["tilo-oauth/client", "dep:serde_json"]
store = [
    "hints",
    "hugging-face",
    "dep:browser-continuity-core",
    "dep:tilo-seal",
    "tilo-oauth/client",
    "dep:tilo-net",
    "dep:reqwest",
    "dep:serde_json",
    "dep:url",
    "dep:zeroize",
    "dep:sha2",
    "dep:cloud-source",
    "dep:tilo-workspace-records",
    "dep:cloud-source-gdrive",
    "dep:cloud-source-onedrive",
    "dep:cloud-source-dropbox",
    "dep:cloud-source-icloud",
    "dep:tilo-crypto",
    "dep:base64",
    "dep:uuid",
]

[dependencies]
browser-continuity-core = { package = "tilo-browser-continuity-core", path = "../../core/browser-continuity-core", optional = true }
accounts = { package = "tilo-accounts", path = "../accounts", features = ["person"] }
tilo-seal = { path = "../../core/tilo-seal", optional = true }
tilo-oauth = { path = "../tilo-oauth", default-features = false }
serde.workspace = true
tracing.workspace = true
tilo-net = { path = "../../platform/tilo-net", optional = true, features = ["blocking"] }
reqwest = { workspace = true, optional = true, features = ["blocking", "form", "json"] }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Resolving a new account's storage (drive ids, team roots) once at sign-in,
# and iCloud's web sign-in behind `icloud::ICloudAuth`.
cloud-source = { package = "tilo-cloud-source", path = "../cloud-source", optional = true }
# A drive's sign-in in the shape a device's mount is handed it: the workspace's own answer
# type (`DriveCredential::mount_credential`).
tilo-workspace-records = { path = "../../core/workspace-records", optional = true }
cloud-source-gdrive = { package = "tilo-cloud-source-gdrive", path = "../cloud-source-gdrive", optional = true }
cloud-source-onedrive = { package = "tilo-cloud-source-onedrive", path = "../cloud-source-onedrive", optional = true }
cloud-source-dropbox = { package = "tilo-cloud-source-dropbox", path = "../cloud-source-dropbox", optional = true }
cloud-source-icloud = { package = "tilo-cloud-source-icloud", path = "../cloud-source-icloud", optional = true }
# iCloud's web sign-in (`icloud::auth`): Apple's SRP-6a from the crypto
# crate, base64 on the wire and a frame id per sign-in.
tilo-crypto = { path = "../../core/tilo-crypto", default-features = false, features = ["srp"], optional = true }
base64 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# The file-backed secret store a test names with `TILO_SECRETS_DIR` stands in
# for a keyring that answers.
tilo-secrets.workspace = true
cloud-source-onedrive = { package = "tilo-cloud-source-onedrive", path = "../cloud-source-onedrive", features = ["fake-server"] }
cloud-source-dropbox = { package = "tilo-cloud-source-dropbox", path = "../cloud-source-dropbox", features = ["fake-server"] }
cloud-source-icloud = { package = "tilo-cloud-source-icloud", path = "../cloud-source-icloud", features = ["fake-server"] }
tilo-test-env = { path = "../../../tools/test-env" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-oauth = { path = "../tilo-oauth", features = ["fake"] }
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }
tempfile.workspace = true
agent-provider-config = { package = "tilo-agent-provider-config", path = "../provider-config" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
