[package]
name = "tilo-agent-turn"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One agent turn over the workspace's MCP tools: the tools listed are the model's, each call it makes is answered by them (in process on a server, or by the device's session for an agent in a process of its own), until the model answers, its person stops it or its bounds are reached."

[dependencies]
tilo-action-services = { version = "0.1.0", path = "../../core/action-services", features = ["test-support"] }
# The model's neutral request and answer.
agent-provider-config = { package = "tilo-agent-provider-config", path = "../provider-config" }
# The provider an agent's process reaches the session's actions by, carried over whatever link
# the process has to its host.
tilo-session-actions = { path = "../../core/session-actions" }
tilo-actions = { path = "../../core/actions" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-lock = { path = "../../platform/tilo-lock" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
