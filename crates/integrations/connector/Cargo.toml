[package]
name = "tilo-connector"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "How a workspace host talks to a connector's outside worker, and the host-private log of the events it reports"

[features]
# Builds the scripted stand-in worker the process tests start.
test-worker = []

[dependencies]
tilo-files = { path = "../../platform/tilo-files" }
tilo-actions = { path = "../../core/actions" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-live = { path = "../../core/tilo-live", features = ["relay", "app_call"] }
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "sync", "time", "macros"] }
tilo-secrets = { path = "../../platform/tilo-secrets" }
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame", features = ["tokio"] }
tilo-clock = { path = "../../platform/tilo-clock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-action-line = { version = "0.1.0", path = "../../core/action-line" }
tilo-action-line-serve = { path = "../../core/action-line-serve" }
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
blake3.workspace = true
key-group = { package = "tilo-key-group", path = "../../core/key-group" }
# Real Opus frames for the speakers a call mixes.
opus = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tilo-test-env = { path = "../../../tools/test-env" }

[[bin]]
name = "scripted-connector-worker"
path = "tests/bin/scripted_worker.rs"
test = false
required-features = ["test-worker"]

[lints]
workspace = true
