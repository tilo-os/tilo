[package]
name = "tilolang-mail"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The mail origin of tilolang packages: the logic that keeps a package's imap types in step with a mail server, and the connector that speaks IMAP and SMTP, run by the system in a process of its own and reached over a socket."

# The renamed self dev-dependency only turns on `test-support` for this package's tests.
[package.metadata.cargo-machete]
ignored = ["mail-test-support"]

[dependencies]
# Mail's model and its IMAP and SMTP engine.
mail-engine = { path = "../mail-engine", optional = true }
# The workspace's accounts and their sign-ins, as the device's dispatch tells the connector
# them.
accounts = { package = "tilo-accounts", path = "../accounts", optional = true }
# The app's own reading of the workspace's accounts and their secrets, over its connection to
# the device's dispatch.
tilo-actions = { path = "../../core/actions", optional = true }
tilo-remote-actions = { version = "0.1.0", path = "../../core/remote-actions" }
# The calls the connector makes of the workspace's accounts, bound at build time to the surface
# their service publishes.
tilo-resource-macros = { path = "../../core/tilo-resource-macros", optional = true }
tilolang-tilo = { path = "../../lang/tilolang-tilo" }
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
tilo-content = { path = "../../core/content", optional = true }
# This device's content store, which the files messages carry are kept in: the store the app's
# window reads them from.
tilo-content-device = { path = "../../core/content-device", optional = true }
# Whether the device is online: an unreachable mail server is tried again when the network
# comes back, followed on a thread of its own.
tilo-net = { path = "../../platform/tilo-net", optional = true }
# The descriptors the session hands the connector: one per instance that attaches.
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal", optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
jiff.workspace = true
# The formatted alternative of what a message says: the Markdown the composer edits, rendered
# as the document system renders one.
tilo-doc-codecs = { path = "../../engines/tilo-doc-codecs", default-features = false, features = [
    "html",
    "markdown",
] }
uuid.workspace = true
tracing.workspace = true
# The language runtime the harness runs the test package on (`test-support`).
tilolang-runtime = { path = "../../lang/tilolang-runtime", optional = true }
# The stand-in mail server a test signs in to, with its own certificate (`test-support`).
tilo-account-probe = { path = "../account-probe", optional = true }
rustls = { workspace = true, optional = true }

[features]
default = ["engine"]
# The connector itself, in native code with the network and the credentials: the engine, the
# connector process's loop. A tilolang host needs none of it: its
# origins reach the connector over a socket.
engine = [
    "dep:mail-engine",
    "dep:tilo-content",
    "dep:tilo-content-device",
    "dep:tilo-net",
    "dep:runtime-portal",
    "dep:accounts",
    "dep:tilo-actions",
    "dep:tilo-resource-macros",
    "dep:tokio",
]
# The harness other tests of the connector run: a package's records over a real store, the
# origin over the engine, and a stand-in mail server on loopback. Tests and development runs
# only.
test-support = [
    "engine",
    "dep:tilolang-runtime",
    "dep:tilo-account-probe",
    "dep:rustls",
    "mail-engine/test-support",
    "tilo-account-probe/test-support",
]

[dev-dependencies]
# Turns on `test-support` for this package's own tests. The key must not be the package name.
mail-test-support = { package = "tilolang-mail", path = ".", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
# The connector's connections: Unix sockets, and pipes on Windows.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
