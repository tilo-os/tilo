[package]
name = "tilolang-calendar"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The calendar origin of tilolang packages: the iCalendar format a calendar server's entries speak, the logic that keeps a package's caldav types in step with such a server, and the connector that speaks CalDAV, run by the system in a process of its own and reached over a socket."

[dependencies]
# The workspace's accounts and their sign-ins, as the session tells the connector them.
accounts = { package = "tilo-accounts", path = "../accounts", optional = true }
# The descriptors the session hands the connector: one per instance that attaches.
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal", optional = true }
tilo-dav = { path = "../tilo-dav", default-features = false, features = ["client"], optional = true }
# The rich text an entry's notes are kept as.
tilo-document = { path = "../../sdk/tilo-document" }
# The iCalendar content lines: folding, parameter quoting and TEXT escaping.
pim-lines = { path = "../../engines/pim-lines" }
# A wall time and its instant: how an entry is written and read, as a device and its servers
# agree about them.
tilo-formats = { path = "../../ui/tilo-formats" }
# RRULE/EXDATE expansion and the one fold/gap wall-time policy, shared with every other
# iCalendar consumer.
tilo-recurrence = { path = "../../engines/tilo-recurrence" }
# The resource layer the moved event, task and calendar shapes are declared in.
tilo-resource = { path = "../../core/tilo-resource" }
# Whether the device is online: an unreachable calendar server is tried again when the network
# comes back, followed on a thread of its own.
tilo-net = { path = "../../platform/tilo-net", optional = true }
tilolang-tilo = { path = "../../lang/tilolang-tilo" }
# The stable hash a detached occurrence and its master share their resource identity by.
fnv.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
jiff.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["engine"]
# The connector itself, in native code with the network and the credentials: the CalDAV engine
# and the connector process's loop. A tilolang host needs none of it: its origins reach the
# connector over a socket.
engine = [
    "dep:accounts",
    "dep:runtime-portal",
    "dep:tilo-dav",
    "dep:tilo-net",
    "dep:tokio",
]

[dev-dependencies]
tilo-action-policy = { path = "../../core/action-policy" }
tilo-resource = { path = "../../core/tilo-resource", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
# The connector's connections: Unix sockets, and pipes on Windows.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
