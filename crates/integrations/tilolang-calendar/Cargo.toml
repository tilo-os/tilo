[package]
name = "tilolang-calendar"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The calendar origin of tilolang packages: the logic that keeps a package's caldav types in step with a calendar server, and the connector that speaks CalDAV, run by the system in a process of its own and reached over a socket."

[dependencies]
# The workspace's accounts and their sign-ins, as the session tells the connector them.
accounts = { path = "../../system/accounts", optional = true }
# The iCalendar reader and writer, and the event a server's entry holds: the same code the
# Calendar app reads and writes its records with.
calendar-model = { path = "../../../apps/calendar-model", optional = true }
# The descriptors the session hands the connector: one per instance that attaches.
runtime-portal = { path = "../../runtime/runtime-portal", optional = true }
tilo-dav = { path = "../../system/tilo-dav", default-features = false, features = ["client"], optional = true }
# The rich text an entry's notes are kept as.
tilo-document = { path = "../../doc/tilo-document", optional = true }
# Whether the device is online: an unreachable calendar server is tried again when the network
# comes back, followed on a thread of its own.
tilo-net = { path = "../../platform/tilo-net", optional = true }
tilolang-tilo = { path = "../../platform/tilolang-tilo" }
tokio = { workspace = true, features = ["rt"], optional = true }
jiff.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["engine"]
# The connector itself, in native code with the network and the credentials: the CalDAV engine
# and the connector process's loop. A tilolang host needs none of it: its origins reach the
# connector over a socket.
engine = [
    "dep:accounts",
    "dep:calendar-model",
    "dep:runtime-portal",
    "dep:tilo-dav",
    "dep:tilo-document",
    "dep:tilo-net",
    "dep:tokio",
]

[dev-dependencies]
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-test-env = { path = "../../../tools/test-env" }
test-http = { path = "../../../tools/test-http" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
