[package]
name = "tilo-mail-session"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A mail account's session with its servers: what Mail reads, sends and marks over IMAP and SMTP, in the app's connector."

[dependencies]
# The account and secret shapes the session reads; nothing here keeps either.
accounts = { package = "tilo-accounts", path = "../accounts" }
# The same clients Mail uses: async-imap, the message codecs, and the SMTP
# client (lettre).
async-imap.workspace = true
mail-parser = "0.11.4"
mail-builder = "0.4.4"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs", "tokio1"] }
# The secured IMAP connection, opened as the sign-in probe opened it when the
# account was added: TLS from the first byte or upgraded with STARTTLS.
tilo-account-probe = { path = "../account-probe" }
# Certificate roots and the TLS client configuration, as every other app's
# outbound connection makes them.
tilo-net = { path = "../../platform/tilo-net" }
rustls.workspace = true
# The sessions' own runtime has workers of its own: a session kept between
# two requests lives on it, whichever thread asks.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }
# The shapes a folder read, a search and a send are asked and answered in.
serde = { workspace = true, features = ["derive"] }
futures-util.workspace = true
serde_json.workspace = true
# A deadline that is the same clock on every machine, a page included.
web-time = "1"

[dev-dependencies]
# The stand-in mail server a test signs in to over XOAUTH2, with its own
# certificate: no real password, no real server.
tilo-account-probe = { path = "../account-probe", features = ["test-support"] }
# Waits bounded by the test's own deadline.
tilo-test-env = { path = "../../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
