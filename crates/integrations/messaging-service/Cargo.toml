[package]
name = "tilo-messaging-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The person's messaging accounts as their own process: Signal, WhatsApp, SMS and Tilo enrollment and the running accounts, served to Messages over an authenticated socket."

[lib]
name = "tilo_messaging_service"
path = "src/lib.rs"

[[bin]]
name = "tilo-messaging"
path = "src/main.rs"
required-features = ["service"]

[features]
default = ["service"]
# The service itself; without it, the crate is the link to the session the
# compositor answers.
service = [
    "dep:launcher",
    "dep:package-store",
    "dep:tilo-messaging-protocol",
    "dep:tilo-identity",
    "dep:collab-types",
    "dep:tilo-files",
    "dep:tilo-paths",
    "dep:tilo-rt",
    "dep:tilo-resource",
    "dep:tilo-secret-vault",
    "dep:bounded-command",
    "dep:hex",
    "dep:uuid",
    "dep:blake3",
    "dep:zbus",
    "dep:libc",
    "dep:rustix",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/time",
    "tokio/macros",
]

# Explicit native RAM ownership qualification of the Signal working profile:
# needs a qualified tmpfs backing or permission to create a noswap fixture in
# a private mount namespace.
signal-profile-native-test = []

[dependencies]
# What the profile's session left for processes outside it, which this process reads
# where no host installed its settings.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
accounts = { package = "tilo-accounts", path = "../accounts", features = ["person"] }
serde.workspace = true
serde_json.workspace = true
tilo-contact-directory = { path = "../../core/tilo-contact-directory" }
tilo-messaging = { path = "../tilo-messaging", features = ["service-client"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
zeroize.workspace = true
tilo-user-identity = { path = "../../core/tilo-user-identity" }
launcher = { path = "../../core/launcher", optional = true }
package-store = { package = "tilo-package-store", path = "../../core/package-store", features = ["store"], optional = true }
tilo-messaging-protocol = { path = "../messaging-protocol", default-features = false, features = ["signal-broker", "whatsapp-sdk", "sms-dbus"], optional = true }
tilo-identity = { path = "../../core/tilo-identity", optional = true }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types", optional = true }
tilo-files = { path = "../../platform/tilo-files", optional = true }
tilo-paths = { workspace = true, optional = true }
tilo-rt = { workspace = true, optional = true }
tilo-resource = { path = "../../core/tilo-resource", optional = true }
tilo-secret-vault = { path = "../../core/secret-vault", optional = true }
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command", optional = true }
hex = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
blake3 = { workspace = true, optional = true }
zbus = { workspace = true, features = ["tokio"], optional = true }
libc = { workspace = true, optional = true }
rustix = { workspace = true, features = ["net", "process"], optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
tempfile.workspace = true
ed25519-dalek.workspace = true

[lints]
workspace = true
