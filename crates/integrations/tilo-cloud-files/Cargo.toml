[package]
name = "tilo-cloud-files"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Credential-free cloud file access"

[target.'cfg(not(unix))'.dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack unifies native features, including sockets and OS randomness.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
runtime-fs = { package = "tilo-fs-client", path = "../../runtime/tilo-fs-client" }

[lints]
workspace = true
