[package]
name = "compat-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo broker for default-deny Wine, UMU/Proton, and Windows VM launches"

[lib]
name = "compat_service"
path = "src/lib.rs"

[dependencies]
tilo-advisory-lock = { path = "../../system/advisory-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
collab-types = { path = "../../collab/collab-types" }
compat-catalogue = { path = "../compat-catalogue" }
launcher = { path = "../../packaging/launcher" }
wire-frame = { path = "../../system/wire-frame" }
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
windows-vm = { path = "../windows-vm" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
