[package]
name = "durable-store"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Keyed, host-acknowledged durable storage for application records and views."
repository.workspace = true
homepage.workspace = true

[lib]
name = "durable_store"
path = "src/lib.rs"

[features]
# The shared behavioural suite every `DurableStore` implementation must pass.
# Enabled by implementations' dev-dependencies, never by production builds.
conformance = []

# Deliberately no filesystem, thread or CRDT dependencies: the seam must be
# implementable by any host, including ones that persist through something
# other than a local filesystem.
[dependencies]
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
