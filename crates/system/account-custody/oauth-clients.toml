# Tilo's public OAuth client registrations: one client per provider, shared
# by every app that signs in with it (Settings for cloud storage, Mail for
# Gmail and Outlook).
#
# These are the values each provider's developer console issued to Tilo as an
# installed app. None of them is confidential: an installed app cannot keep a
# secret (RFC 8252 §8.5), and PKCE binds every authorization code to the
# device that asked for it.
#
# An environment variable overrides each value at runtime, then at build
# time (TILO_OAUTH_{GOOGLE,MICROSOFT,DROPBOX,SPOTIFY,OPENAI,GITHUB,HUGGINGFACE}_CLIENT_ID and
# TILO_OAUTH_GOOGLE_CLIENT_SECRET), so private deployments can bring their
# own registration. An empty `client_id` with no override is the "not
# configured" state Settings and Mail show for that provider.
#
# Scopes are per use of the client, not per provider: `files` is what cloud
# storage asks for, `mail` what IMAP and SMTP (XOAUTH2) ask for, `models`
# what the model gateway asks for to call hosted agent models,
# `model_downloads` what the model manager downloads weights with. A use
# with no scopes is not offered for that provider.
#
# Every sign-in redirects to `http://127.0.0.1:<port>/oauth`, unless its
# entry names the `redirect_host` and `redirect_path` its issuer registered.

[google]
# Google Cloud console, OAuth client of type "Desktop app". Desktop clients
# accept a loopback redirect on any port and path; nothing is registered.
client_id = "765058527434-b02qovqoi7lb7cbq872s8ec5ueaovjru.apps.googleusercontent.com"
# Google's token endpoint requires the secret it issues to Desktop clients on
# the code exchange and every refresh.
client_secret = "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"

[google.scopes]
files = ["https://www.googleapis.com/auth/drive"]
# Full IMAP and SMTP access; Gmail offers no narrower scope for either.
mail = ["https://mail.google.com/"]
# Google's CalDAV endpoint requires the calendar scope (not calendar.events).
# No Drive, Gmail or Contacts permission is needed to read/write calendars.
calendar = ["https://www.googleapis.com/auth/calendar"]
# Vertex AI's OpenAI-compatible endpoint and listing the person's Cloud
# projects; Vertex AI offers no narrower OAuth scope. Granted on its own,
# never together with `files` or `mail`.
models = ["https://www.googleapis.com/auth/cloud-platform"]

[microsoft]
# Microsoft Entra app registration, "Accounts in any organizational directory
# and personal Microsoft accounts", public client. Registered redirect URI
# (platform "Mobile and desktop applications", added through the manifest's
# `replyUrlsWithType` as type `InstalledClient`, because the portal refuses
# http loopback URIs): http://127.0.0.1/oauth. Microsoft ignores the port of
# a loopback redirect but matches its host and path.
client_id = "4859a21d-e6df-4983-8725-2dc20060103b"

[microsoft.scopes]
# Graph identity and Exchange mail need different audience access tokens.
# Consent to identity separately, then request mail; never combine their scopes.
identity = ["offline_access", "User.Read"]
# `offline_access` makes Microsoft issue the refresh token.
files = ["offline_access", "Files.ReadWrite.All", "User.Read"]
# Exchange Online's IMAP and SMTP AUTH resources, not Microsoft Graph.
mail = [
    "offline_access",
    "https://outlook.office.com/IMAP.AccessAsUser.All",
    "https://outlook.office.com/SMTP.Send",
]

[dropbox]
# Dropbox App Console app key, PKCE without an app secret. Dropbox matches
# redirect URIs exactly, port included, so each port below is registered as
# http://127.0.0.1:<port>/oauth. When all of them are taken, Dropbox shows the
# code on its own page and Settings asks for it to be pasted.
client_id = "uzpownxibaxmz18"
redirect_ports = [47651, 47652, 47653]
paste_code_fallback = true

[dropbox.scopes]
files = [
    "account_info.read",
    "files.metadata.read",
    "files.metadata.write",
    "files.content.read",
    "files.content.write",
]

[spotify]
# Public PKCE registration supplied by the distributor; never borrow another
# application's identity. Register http://127.0.0.1:47654/oauth exactly.
client_id = "fc7bc68792734157a2c9857cba652df7"
redirect_ports = [47654]

[spotify.scopes]
music = ["user-follow-read", "user-follow-modify", "user-read-private", "user-library-read", "user-library-modify", "playlist-read-private", "playlist-read-collaborative", "playlist-modify-private", "playlist-modify-public", "user-read-playback-state", "user-modify-playback-state"]
music_streaming = ["streaming", "user-read-private"]

[openai]
# Signing in with a ChatGPT account, to use its subscription for agent
# models. OpenAI offers no client registration for ChatGPT subscriptions to
# other applications, so this is the public client of OpenAI's own Codex CLI,
# used the way Codex uses it; the person signs in on OpenAI's page and sees
# that client named. OpenAI matches its registered redirect exactly, host and
# path included. An unofficial integration: OpenAI may change or close it at
# any time. The `nightly-live-chatgpt` check signs nothing in but watches
# that this client, its redirect and the backend still answer as expected,
# and Settings says when a sign-in or a request stops working.
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
redirect_ports = [1455]
redirect_host = "localhost"
redirect_path = "/auth/callback"

[openai.scopes]
# `offline_access` yields the refresh token.
models = ["openid", "profile", "email", "offline_access"]

[github]
# Signing in with GitHub, to use a Copilot subscription for agent models.
# GitHub issues Copilot tokens only to the editors it supports, so this is
# the public client id GitHub's Copilot editor extensions sign in with, by
# device code (no redirect is registered). Unofficial, like the ChatGPT
# sign-in above.
client_id = "Iv1.b507a08c87ecfe98"

[github.scopes]
models = ["read:user"]

[huggingface]
# Hugging Face OAuth app, public client (no secret). Registered redirect URIs:
# http://localhost/callback and http://127.0.0.1/callback; Hugging Face
# accepts any port on a loopback redirect. Its scopes allow reading the
# person's profile and the gated models they were granted, for the model
# manager's downloads. It has no `inference-api` scope, so hosted Hugging
# Face inference still takes an access token typed as an API key.
client_id = "3c6f0f73-efd1-47c9-ab21-55f84fcd7dab"
redirect_path = "/callback"

[huggingface.scopes]
model_downloads = ["openid", "profile", "gated-repos"]
