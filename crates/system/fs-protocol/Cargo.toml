[package]
name = "fs-protocol"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The collaborative filesystem's wire records and local control protocols: file records, versions, mutation transactions, file invites and the share/recipient control sockets."

[lib]
name = "fs_protocol"
path = "src/lib.rs"

# Pure types + pure functions, no I/O. Signed payloads canonicalise and sign
# through collab-types' `canonical` and `crypto` primitives; collab-types never
# depends on this crate.

[dependencies]
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
wire-frame = { version = "0.1.0", path = "../wire-frame" }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
getrandom.workspace = true
postcard = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32; the
# browser's web desktop reaches this crate through the toolkit.
workspace-hack = { version = "0.1" }
