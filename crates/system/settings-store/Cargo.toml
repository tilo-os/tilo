[package]
name = "settings-store"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The shared Tilo desktop settings file: one resolver, one forgiving read, one atomic write."

[lib]
name = "settings_store"
path = "src/lib.rs"

[dependencies]
hex.workspace = true
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock" }
tilo-rt = { version = "0.1.0", path = "../../platform/tilo-rt" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1.25"
# Spec-correct `XDG_CONFIG_HOME` resolution (absolute, non-empty, else
# `$HOME/.config`), shared with every other reader of the settings file.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# Directory watch behind `watch_settings`; only long-lived readers opt in.
notify = { workspace = true, optional = true }

[features]
watch = ["dep:notify"]

[dev-dependencies]
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
