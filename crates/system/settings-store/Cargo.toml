[package]
name = "settings-store"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "settings_store"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Resolves `$HOME` for the XDG fallback. `dirs::config_dir()` is deliberately
# NOT used to locate the config root — see the module docs for why its
# handling of a relative `XDG_CONFIG_HOME` differs from the XDG basedir spec.
dirs.workspace = true
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true

[lints]
workspace = true
