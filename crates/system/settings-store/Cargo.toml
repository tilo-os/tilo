[package]
name = "settings-store"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "settings_store"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Spec-correct `XDG_CONFIG_HOME` resolution (absolute, non-empty, else
# `$HOME/.config`), shared with every other reader of the settings file.
xdg-paths = { path = "../xdg-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }

[dev-dependencies]
atomic-file = { path = "../atomic-file", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
