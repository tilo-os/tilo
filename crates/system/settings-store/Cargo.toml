[package]
name = "settings-store"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The Tilo desktop settings: the person's and the device's Automerge documents, one forgiving read, one holder per profile."

[lib]
name = "settings_store"
path = "src/lib.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
hex.workspace = true
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock" }
tilo-rt = { version = "0.1.0", path = "../../platform/tilo-rt" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
serde.workspace = true
serde_json.workspace = true
# A copy's payload bytes inside the JSON document.
base64.workspace = true
# The person's and the device's settings documents.
automerge.workspace = true
# Changes another process made, taken whole or not at all.
tilo-automerge = { version = "0.1.0", path = "../../doc/tilo-automerge" }
tracing.workspace = true
unicode-normalization = "0.1.25"
# Spec-correct `XDG_CONFIG_HOME` resolution (absolute, non-empty, else
# `$HOME/.config`), shared with every other reader of the settings file.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# Where the documents live: their files, the holder's lock, the follower's
# watch and the holder's door.
tilo-settings-records = { version = "0.1.0", path = "../../platform/tilo-settings-records" }
# The sections' types as models, so an app edits them by path.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource", optional = true }

[features]
# Directory watches: a follower noticing the holder's saves at once, and the
# identity and dictionary directories.
watch = ["tilo-files/watch", "tilo-settings-records/watch"]
model = ["dep:tilo-resource"]

[dev-dependencies]
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# Thread-scoped wall-clock scopes for the tests that place a row in time.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
