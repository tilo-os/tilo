[package]
name = "tinker"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Unprivileged overlay work layers: a real root shell and a real package manager, scoped to a discardable layer instead of the host."

[lib]
name = "tinker"
path = "src/lib.rs"

[[bin]]
name = "tinker"
path = "src/main.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-paths.workspace = true
anyhow = { workspace = true }
bounded-command = { path = "../bounded-command" }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
