[package]
name = "ssh-agent-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Connect to the user's SSH agent on any platform"

[dependencies]
russh = { version = "0.65.1", default-features = false, features = ["ring"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
