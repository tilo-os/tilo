[package]
name = "tilo-bluez"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "tilo_bluez"
path = "src/lib.rs"

# BlueZ over D-Bus: adapter control, discovery, pairing, trust and removal,
# plus the `org.bluez.Agent1` pairing agent BlueZ calls back into to display
# or confirm a passkey.
#
# This uses D-Bus directly rather than `bluetoothctl`. A pairing agent is a
# D-Bus object the daemon invokes methods on — there is no CLI shape for
# "BlueZ asks us a question and blocks on the answer", so the whole pairing
# flow has to speak the bus directly.
#
# Split the same way as `tilo-power-mgmt`: a pure model + state core that is
# unit-testable without a bus, and a thin async zbus layer over it.

[dependencies]
futures-util.workspace = true
tracing = "0.1"
# Match `shell`'s zbus pin (4, tokio, no async-io default) so the workspace
# lock collapses to one copy.
zbus = { workspace = true, features = ["tokio"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full", "test-util"] }
# A fake `BlueZ` served over a socket pair.
zbus = { workspace = true, features = ["tokio", "p2p"] }

[lints]
workspace = true
