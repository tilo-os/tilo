[package]
name = "tilo-dav"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "WebDAV/CalDAV client: bounded multistatus parsing, request bodies and a blocking client on Tilo's TLS defaults."

[dependencies]
roxmltree.workspace = true
reqwest = { workspace = true, optional = true, features = ["blocking"] }
tilo-net = { path = "../tilo-net", optional = true, features = ["blocking"] }
zeroize = { workspace = true, optional = true }

[features]
default = ["client"]
# The blocking HTTP client. Without it the crate is the parser and request
# bodies only, for builds that must stay free of the TLS/HTTP stack.
client = ["dep:reqwest", "dep:tilo-net", "dep:zeroize"]

[dev-dependencies]
test-http = { path = "../../dev/test-http" }

[lints]
workspace = true
