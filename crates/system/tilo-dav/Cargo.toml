[package]
name = "tilo-dav"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebDAV/CalDAV client: bounded multistatus parsing, request bodies, and blocking and async clients on Tilo's TLS defaults."

[dependencies]
accounts = { path = "../accounts", optional = true }
account-custody = { path = "../account-custody", optional = true }
serde_json = { workspace = true, optional = true }
quick-xml.workspace = true
roxmltree.workspace = true
reqwest = { workspace = true, optional = true, features = ["blocking"] }
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = ["client"]
# Credential custody and origin-bound calendar access; refresh is blocking.
oauth = ["client", "net", "dep:accounts", "dep:account-custody", "dep:serde_json"]
# Explicit trusted loopback fixture, never an implicit production override.
test-support = ["oauth"]
# The blocking HTTP client. Without it the crate is the parser and request
# bodies only, for builds that must stay free of the TLS/HTTP stack.
client = ["dep:reqwest", "dep:tilo-net", "tilo-net/blocking", "dep:zeroize"]
# The async client on `tilo_net`, for Linux, macOS and the web.
net = ["dep:tilo-net", "tilo-net/http", "dep:zeroize"]

[dev-dependencies]
tempfile.workspace = true
test-http = { path = "../../dev/test-http" }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
