[package]
name = "os-actions"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "os_actions"
path = "src/lib.rs"

# Pure shell-out wrappers around brightnessctl / wpctl / nmcli /
# bluetoothctl / powerprofilesctl. No GUI or compositor deps — this crate
# exists so the `shell` compositor and the standalone `settings` app can
# both drive the same hardware controls without cross-depending. See the
# crate docstring in `src/lib.rs` for the design intent.

[dependencies]
bounded-command = { path = "../bounded-command" }
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rand_core.workspace = true
thiserror.workspace = true
tilo-crypto = { path = "../tilo-crypto" }
# Bluetooth is the one control here that cannot be a shell-out: a scan lives
# as long as its D-Bus connection, and pairing needs an agent object BlueZ
# calls back into. See src/bluez.rs.
tilo-bluez = { path = "../tilo-bluez" }
tilo-power-mgmt = { path = "../power" }
tilo-rt.workspace = true
zbus = { workspace = true, features = ["tokio"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Fixture sysfs trees for testing the backlight reader/writer against
# representative directory layouts.
tempfile = { workspace = true }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
