[package]
name = "os-actions"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "os_actions"
path = "src/lib.rs"

# Pure shell-out wrappers around brightnessctl / wpctl / nmcli /
# bluetoothctl / powerprofilesctl. No GUI or compositor deps — this crate
# exists so the `shell` compositor and the standalone `settings` app can
# both drive the same hardware controls without cross-depending. See the
# crate docstring in `src/lib.rs` for the design intent.

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# Bluetooth is the one control here that cannot be a shell-out: a scan lives
# as long as its D-Bus connection, and pairing needs an agent object BlueZ
# calls back into. See src/bluez.rs.
qos-bluez = { path = "../qos-bluez" }
qos-power-mgmt = { path = "../power" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "time"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Fixture sysfs trees, so the backlight reader/writer is tested against
# real directory layouts rather than a mocked filesystem.
tempfile = { workspace = true }

[lints]
workspace = true
