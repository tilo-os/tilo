[package]
name = "os-actions"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "os_actions"
path = "src/lib.rs"

# Hardware controls shared by the shell compositor and the Settings app: the
# NetworkManager, BlueZ, power and audio D-Bus clients, plus the few tools that
# have no library behind them (brightnessctl, fwupdmgr, iw). No GUI or
# compositor deps — this crate exists so the `shell` compositor and the
# standalone `settings` app can both drive the same hardware controls without
# cross-depending. See the crate docstring in `src/lib.rs` for the design intent.

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Change watches on the extension status and brightness memory directories.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
uuid.workspace = true
bounded-command = { path = "../bounded-command" }
# The default audio device controls the dispatcher drives.
media = { package = "tilo-media", path = "../../platform/tilo-media" }
libc.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
getrandom.workspace = true
# WireGuard key pairs for tunnels Settings sets up (src/network_settings.rs).
tilo-seal = { path = "../tilo-seal" }
base64.workspace = true
rand_core.workspace = true
thiserror.workspace = true
tilo-crypto = { path = "../tilo-crypto" }
# Bluetooth is the one control here that cannot be a shell-out: a scan lives
# as long as its D-Bus connection, and pairing needs an agent object BlueZ
# calls back into. See src/bluez.rs.
tilo-bluez = { path = "../tilo-bluez" }
# Every network read and change goes through the one NetworkManager client
# every OS reader shares.
tilo-nm = { path = "../tilo-nm" }
tilo-power-mgmt = { path = "../power" }
tilo-rt.workspace = true
runtime-portal = { path = "../../runtime/runtime-portal", default-features = false }
zbus = { workspace = true, features = ["tokio"] }
# Following a service's signals (src/bus_follow.rs).
futures-util.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Fixture sysfs trees for testing the backlight reader/writer against
# representative directory layouts.
tempfile = { workspace = true }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
