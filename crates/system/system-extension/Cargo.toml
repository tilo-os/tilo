[package]
name = "system-extension"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Signed, pinned desired-state transactions for optional qOS system extensions."

[lib]
name = "system_extension"
path = "src/lib.rs"

[dependencies]
atomic-file = { path = "../atomic-file" }
ed25519-dalek.workspace = true
hex.workspace = true
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
