[package]
name = "system-extension"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Signed, pinned desired-state transactions for optional Tilo system extensions."

[lib]
name = "system_extension"
path = "src/lib.rs"

[[bin]]
name = "tilo-system-extension-manager"
path = "src/bin/tilo-system-extension-manager.rs"

[dependencies]
tilo-atomic-file = { path = "../atomic-file" }
bounded-command = { path = "../bounded-command" }
ed25519-dalek.workspace = true
hex.workspace = true
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
