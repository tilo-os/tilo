[package]
name = "tilo-clock"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Unix-time helpers and an injectable millisecond Clock with fixed and manual test clocks."

[lib]
name = "tilo_clock"
path = "src/lib.rs"

# A std-only leaf: apps, daemons and protocol crates all read the time, so it
# must not pull anything in.
[dependencies]

# The browser runtime's only clock is the page's.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time = "1"

[lints]
workspace = true
