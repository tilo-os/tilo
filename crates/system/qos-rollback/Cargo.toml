[package]
name = "qos-rollback"
version = "0.1.0"
edition = "2024"
description = "Bounded rollback protection: a TPM2 NV monotonic counter holding the oldest bootable generation, plus per-generation sealed LUKS2 keyslots."

[lib]
name = "qos_rollback"
path = "src/lib.rs"

[[bin]]
name = "qos-rollback"
path = "src/bin/qos-rollback.rs"

[dependencies]
# The TPM and cryptsetup are driven through their command-line tools rather than
# through tss-esapi/libcryptsetup bindings. Two reasons, both practical:
#   * the OS image already needs `tpm2-tools` and `cryptsetup` present for
#     recovery-mode work, so there is no new dependency to ship;
#   * the build host is image-based and carries none of the native development
#     headers (see CLAUDE.md), so linking libtss2/libcryptsetup would force a
#     layered host or a build-container-only build for a component that has to
#     be buildable everywhere.
# Every external invocation goes through `exec::Runner`, so the decision logic
# stays unit-testable without a TPM.
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
zeroize.workspace = true

tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
