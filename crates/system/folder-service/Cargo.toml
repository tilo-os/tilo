[package]
name = "tilo-folder-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
hex.workspace = true
qos-ntfs-protocol = { path = "../../session/qos-ntfs-protocol" }
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_Memory", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
