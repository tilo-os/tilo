[package]
name = "atomic-file"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Crash-safe file replacement: temp file, fsync, rename, fsync the directory."

[lib]
name = "atomic_file"
path = "src/lib.rs"

[features]
default = []
test-support = ["windows-sys/Win32_System_LibraryLoader", "windows-sys/Win32_System_SystemInformation"]

# Every crate that persists anything needs this, so native dependencies stay
# narrowly target-scoped and this remains a small framework leaf.

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "directory_commit_probe"
required-features = ["test-support"]

[lints]
workspace = true
