[package]
name = "tilo-atomic-file"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Crash-safe file replacement: temp file, fsync, rename, fsync the directory."

[lib]
name = "atomic_file"
path = "src/lib.rs"

# Every crate that persists anything needs this, including ones that must not
# pay for automerge or the CLI SDK, so native dependencies stay narrowly
# target-scoped and this remains a small framework leaf unless a caller opts
# into `json`.
[features]
default = []
json = ["dep:serde", "dep:serde_json"]
test-support = ["windows-sys/Win32_System_LibraryLoader", "windows-sys/Win32_System_SystemInformation"]

[dependencies]
# `FileLease` holds its native lock through the workspace's single lock guard.
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_System_SystemServices"] }

[dev-dependencies]
# The package's own tests and its probe example exercise the test-support
# hooks; enabling them here runs those tests whenever the package is tested,
# not only when a dependant happens to unify the feature in.
tilo-atomic-file = { path = ".", features = ["test-support"] }
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[[example]]
name = "directory_commit_probe"
required-features = ["test-support"]
test = true

[lints]
workspace = true
