[package]
name = "atomic-file"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Crash-safe file replacement: temp file, fsync, rename, fsync the directory."

[lib]
name = "atomic_file"
path = "src/lib.rs"

# Deliberately no default dependencies. Every crate that persists anything
# needs this, including ones that must not pay for automerge or the CLI SDK, so
# it stays a std-only leaf unless a caller opts into `json`.
[features]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
