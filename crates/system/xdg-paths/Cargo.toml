[package]
name = "xdg-paths"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user base and content directories resolved by the XDG Base Directory and xdg-user-dirs rules, plus per-app subdirectories."

[lib]
name = "xdg_paths"
path = "src/lib.rs"

# Deliberately std-only on Unix: every app and service that stores anything
# resolves one of these directories, so this stays a leaf. Windows asks the
# shell for its known folders, which follow redirection and cannot be spoofed
# through the environment.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[lints]
workspace = true
