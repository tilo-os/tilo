[package]
name = "tilo-device-vpn"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Your devices as a VPN: the root helper that owns TUN devices, routes, DNS, forwarding and nftables for a tunnel, its typed protocol, and the tunnel itself as QUIC datagrams between a person's devices"

[lib]
name = "device_vpn"
path = "src/lib.rs"

[[bin]]
name = "tilo-device-vpn"
path = "src/main.rs"
required-features = ["service"]

# Needs `ip`, `nft`, `unshare` and /dev/net/tun: skipped without them, except
# where TILO_REQUIRE_TUN promises them (t's device-vpn-namespaces check).
[[test]]
name = "netns_tunnel"
path = "tests/netns_tunnel.rs"
required-features = ["service", "test-support"]

[features]
default = ["service"]
# The root helper. The shell speaks its protocol and depends on this crate
# without it.
service = ["dep:tilo-seat-peer"]
# The tunnel between two of a person's devices, over their iroh connection.
tunnel = ["dep:iroh", "dep:tokio", "dep:bytes", "dep:postcard", "dep:tracing"]
# An in-memory packet device for tests of code that runs a tunnel.
test-support = ["tunnel"]

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-seat-peer = { path = "../seat-peer", optional = true }
iroh = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"], optional = true }
bytes = { workspace = true, optional = true }
postcard = { workspace = true, features = ["alloc"], optional = true }
tracing = { workspace = true, optional = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
iroh.workspace = true

[lints]
workspace = true
