[package]
name = "secret-vault"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Sealed local secret vaults: XChaCha20-Poly1305 files and the custody of their key"

[lib]
name = "secret_vault"
path = "src/lib.rs"

[dependencies]
private-fs = { path = "../private-fs" }
bounded-command = { path = "../bounded-command" }
tracing.workspace = true
# `tilo-seal` seals the vault and mints its keys; `zeroize` wipes key
# material read from custody and decrypted plaintext.
tilo-seal = { path = "../tilo-seal" }
zeroize.workspace = true
# The Secret Service stores the vault key as lower-case hex.
hex.workspace = true

[target.'cfg(windows)'.dependencies]
# Serializes key creation between processes.
advisory-lock = { path = "../advisory-lock" }
# Draws a fresh key before DPAPI protects it.
getrandom.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
