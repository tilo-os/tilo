[package]
name = "tilo-power-mgmt"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tilo power management: suspend on idle, lid and power-key handling."

[lib]
name = "tilo_power_mgmt"
path = "src/lib.rs"

[features]
default = ["service"]
service = [
    "dep:tilo-files",
    "dep:bounded-command",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:settings-store",
    "dep:tokio",
    "dep:tracing",
    "dep:zbus",
    "dep:tilo-xdg-paths",
]

# Power management for the compositor: suspend-on-idle, lid / power-key
# policy, suspend inhibitors, and battery thresholds, over systemd-logind +
# UPower. Split into a pure policy core (unit-testable without a bus) and a
# thin zbus actuator. Depended on by `shell`; the Settings pane shares
# only the on-disk JSON contract, not a code dependency.

[dependencies]
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-xdg-paths = { version = "0.1.0", path = "../xdg-paths", optional = true }
bounded-command = { version = "0.1.0", path = "../../../crates/system/bounded-command", optional = true }
tracing = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# One owner for ~/.config/tilo/settings.json — path resolution, forgiving reads
# and non-destructive writes, shared with every other reader of that file.
settings-store = { version = "0.1.0", path = "../../../crates/system/settings-store", optional = true }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", optional = true }
# Match `shell`'s zbus pin (4, tokio, no async-io default) so the workspace
# lock collapses to one copy.
zbus = { workspace = true, features = ["tokio"], optional = true }
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "sync"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
# Fixture power-supply trees for the sysfs battery reader, so its parsing
# is tested against representative directory layouts.
tempfile = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
