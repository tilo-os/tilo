[package]
name = "cloud-source"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The provider interface behind mounted cloud accounts: items, change feeds, ranged reads, resumable uploads, revisions and a conformance suite."

# Provider crates (WebDAV/Nextcloud, Google Drive, OneDrive, Dropbox, iCloud
# Drive) implement `CloudSource`; the storage daemon consumes it. This crate
# stays free of HTTP and TLS so both sides can depend on it cheaply.
[dependencies]
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# Endpoint checks for mount configurations (`is_secure_endpoint`).
url.workspace = true

[features]
# The provider conformance suite (`cloud_source::conformance`). Provider
# crates enable it from [dev-dependencies] and run it against their fake
# server.
conformance = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
