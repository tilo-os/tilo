[package]
name = "tilo-fs"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable content-addressed storage and the default Tilo filesystem service."

[package.metadata.cargo-machete]
# Used only as `#[serde(with = "serde_bytes")]`, a string machete does not read.
ignored = ["serde_bytes"]

[lib]
name = "fs"
path = "src/lib.rs"

[[example]]
name = "android_hydration_fixture"
required-features = ["filesystem"]

# The content plane is portable. Filesystem projection, mounting and service
# protocols remain enabled by default for the OS; app-only consumers opt out.
[features]
default = ["filesystem"]
# The document-media capability over the content store, without the mount.
document-media = ["dep:runtime-fs"]
filesystem = [
    "dep:clap",
    "dep:iroh",
    "dep:iroh-base",
    "dep:iroh-gossip",
    "dep:tilo-endpoint-reachability",
    "dep:automerge",
    "dep:tilo-automerge",
    "dep:tilo-automerge-isolate",
    "dep:tilo-doc",
    "dep:tilo-doc-codecs",
    "dep:tilo-content",
    "dep:collab-types",
    "dep:fs-protocol",
    "dep:ed25519-dalek",
    "dep:tilo-thumbnail",
    "dep:tilo-user-identity",
    "dep:tilo-advisory-lock",
    "dep:tilo-power-mgmt",
    "dep:tilo-nm",
    "document-media",
    "dep:libc",
    "dep:rustix",
    "dep:serde_bytes",
    "dep:serde_json",
    "dep:toml",
    "dep:uuid",
    "dep:thiserror",
    "dep:rand",
    "dep:getrandom",
    "dep:fuser",
    "dep:fs-native",
    "dep:accounts",
    "dep:cloud-source",
    "dep:cloud-source-dav",
    "dep:cloud-source-gdrive",
    "dep:cloud-source-onedrive",
    "dep:cloud-source-dropbox",
    "dep:cloud-source-icloud",
    "dep:notify",
    "dep:zeroize",
    "dep:wire-frame",
]

[[bin]]
name = "fs"
path = "src/main.rs"
required-features = ["filesystem"]

[[test]]
name = "workspace_startup"
path = "tests/workspace_startup.rs"
required-features = ["filesystem"]

[[test]]
name = "collab_release_matrix"
path = "tests/collab_release_matrix.rs"
required-features = ["filesystem"]

[[test]]
name = "corruption_matrix"
path = "tests/corruption_matrix.rs"
required-features = ["filesystem"]

[[test]]
name = "exact_share_process_fuse"
path = "tests/exact_share_process_fuse.rs"
required-features = ["filesystem"]

[[test]]
name = "held_memory"
path = "tests/held_memory.rs"
required-features = ["filesystem"]

[[test]]
name = "document_media_footprint"
path = "tests/document_media_footprint.rs"
required-features = ["filesystem"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["filesystem"]

[[test]]
name = "performance_gate"
path = "tests/performance_gate.rs"
required-features = ["filesystem"]

[[test]]
name = "native_tier1"
path = "tests/native_tier1.rs"
required-features = ["filesystem"]

[[test]]
name = "iroh_idle"
path = "tests/iroh_idle.rs"
required-features = ["filesystem"]

[[test]]
name = "native_sync_bench"
path = "tests/native_sync_bench.rs"
required-features = ["filesystem"]

[[test]]
name = "cloud_mount"
path = "tests/cloud_mount.rs"
required-features = ["filesystem"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
iroh-base = { workspace = true, optional = true }
iroh-blobs.workspace = true
# The content format (chunking, manifests) and the pieces of iroh-blobs
# the content store builds its file-backed provider from.
fs-content = { version = "0.1.0", path = "../fs-content" }
bao-tree = { workspace = true }
irpc = { workspace = true }
ref-cast = { workspace = true }
iroh-gossip = { workspace = true, optional = true }
tilo-endpoint-reachability = { version = "0.1.0", path = "../endpoint-reachability", optional = true }
automerge = { workspace = true, optional = true }
tilo-automerge = { workspace = true, optional = true }
# Conflict members can come from peers: the tilo-doc merge decodes them only here.
tilo-automerge-isolate = { version = "0.1.0", path = "../../doc/tilo-automerge-isolate", optional = true }
tilo-doc = { version = "0.1.0", path = "../../doc/tilo-doc", optional = true }
tilo-content = { version = "0.1.0", path = "../content", optional = true, features = ["device"] }
tilo-doc-codecs = { version = "0.1.0", path = "../../doc/tilo-doc-codecs", optional = true, default-features = false, features = ["markdown", "html", "rtf", "docx", "odt"] }
collab-types = { version = "0.1.0", path = "../../collab/collab-types", optional = true }
fs-protocol = { version = "0.1.0", path = "../fs-protocol", optional = true }
getrandom = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
# The shared thumbnail generator + content-addressed cache. Default features
# only (raster images + EPUB covers — pure Rust, no native deps): the OS
# filesystem daemon host-generates the light preview types and never pulls
# pdfium or the gstreamer stack into the image. PDF/video previews are the
# client's job (the file manager builds this crate with those features on).
tilo-thumbnail = { version = "0.1.0", path = "../../media/thumbnail", optional = true }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The machine's one device key. The mount derives its iroh node key from
# it rather than minting its own, so the node id names the device.
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity", optional = true }
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock", optional = true }
# Bus-free, production battery/AC sampling for speculative-hydration policy.
tilo-power-mgmt = { version = "0.1.0", path = "../power", default-features = false, optional = true }
# NetworkManager's connectivity and primary-connection metering, followed by
# signal, for the same policy.
tilo-nm = { version = "0.1.0", path = "../tilo-nm", optional = true }
runtime-fs = { version = "0.1.0", path = "../../runtime/runtime-fs", optional = true }
libc = { workspace = true, optional = true }
rustix = { workspace = true, features = ["process"], optional = true }
moka.workspace = true
serde.workspace = true
serde_bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tempfile.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
tilo-rt.workspace = true
hex.workspace = true
blake3.workspace = true
postcard = { workspace = true, features = ["use-std"] }
futures-util.workspace = true
rand = { workspace = true, optional = true }
redb.workspace = true
# Cloud accounts as mounted folders: the account store and credential
# handoff, the provider interface and the providers.
accounts = { version = "0.1.0", path = "../accounts", optional = true }
cloud-source = { version = "0.1.0", path = "../cloud-source", optional = true }
cloud-source-dav = { version = "0.1.0", path = "../cloud-source-dav", optional = true }
cloud-source-gdrive = { version = "0.1.0", path = "../cloud-source-gdrive", optional = true }
cloud-source-onedrive = { version = "0.1.0", path = "../cloud-source-onedrive", optional = true }
cloud-source-dropbox = { version = "0.1.0", path = "../cloud-source-dropbox", optional = true }
cloud-source-icloud = { version = "0.1.0", path = "../cloud-source-icloud", optional = true }
notify = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
tracing.workspace = true
wire-frame = { version = "0.1.0", path = "../wire-frame", optional = true, features = ["tokio", "postcard"] }

[dev-dependencies]
tilo-automerge = { workspace = true, features = ["heap-probe"] }
image = { workspace = true, features = ["png"] }
tilo-test-env = { path = "../../dev/test-env" }
# A loopback relay for the idle endpoint test (tests/iroh_idle.rs).
iroh-relay = { version = "1.0.3", features = ["server"] }
cloud-source-dav = { version = "0.1.0", path = "../cloud-source-dav", features = ["fake-server"] }
cloud-source-gdrive = { version = "0.1.0", path = "../cloud-source-gdrive", features = ["fake-server"] }
cloud-source-dropbox = { version = "0.1.0", path = "../cloud-source-dropbox", features = ["fake-server"] }

[lints]
workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
fuser = { workspace = true, optional = true }

# The Tier 1 native data plane: fanotify journal, Btrfs capture epochs and
# pre-content placeholders. Linux-only kernel interfaces.
[target.'cfg(target_os = "linux")'.dependencies]
fs-native = { version = "0.1.0", path = "../fs-native", optional = true }

# Shared filesystem and relay data remain available; no native mount provider.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["macos-no-mount"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
