[package]
name = "host-info"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Facts about the host operating system (processes, network) for portable Tilo apps"

[target.'cfg(target_os = "linux")'.dependencies]
bounded-command = { path = "../bounded-command" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
