[package]
name = "tilo-content"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Content-addressed binary storage for apps: the explicit, secondary alternative to versioned resources"
repository.workspace = true
homepage.workspace = true

[features]
# Content in a local directory (`DirBackend`, `ContentStore::in_dir`, `ContentStore::local_for_app`).
# Code that only names content (documents, codecs) turns it off and needs no file system.
# The device content store, a client of the filesystem daemon, is not here but in
# `tilo-content-device`: this crate must stay below the daemon's protocol crates,
# which the resource layer's stored types sit beneath.
default = ["dir"]
dir = ["dep:tilo-advisory-lock", "dep:tilo-clock", "dep:tilo-files", "dep:tilo-paths"]

[dependencies]
tilo-content-types = { version = "0.1.0", path = "../content-types" }
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock", optional = true }
blake3.workspace = true
thiserror.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", optional = true }
tracing.workspace = true
# Where files have no native path (a browser page), content in the profile's app files.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", optional = true }
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
