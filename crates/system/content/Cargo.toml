[package]
name = "tilo-content"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Content-addressed binary storage for apps: the explicit, secondary alternative to versioned resources"

[features]
# Content in a local directory (`DirBackend`, `ContentStore::in_dir`, `ContentStore::for_app`).
# Code that only names content (documents, codecs) turns it off and needs no file system.
default = ["dir", "device"]
dir = ["dep:advisory-lock", "dep:xdg-paths"]
# The device content store through the launcher's capability (`ContentStore::device`), which
# `ContentStore::for_app` prefers when the process was handed one. Unix only.
device = ["dir", "dep:runtime-fs"]

[dependencies]
advisory-lock = { path = "../advisory-lock", optional = true }
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
xdg-paths = { path = "../xdg-paths", optional = true }
runtime-fs = { path = "../../runtime/runtime-fs", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
