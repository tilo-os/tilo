[package]
name = "tilo-system-stats"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The typed system information service: machine load, running apps and a limited process list, pushed to subscribed apps by the session."

# The session (the compositor) hosts the service and reads the kernel's
# reporting interfaces; apps hold a connection the launcher authenticated and
# never see /proc of anything outside their sandbox.

[lib]
name = "tilo_system_stats"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
wire-frame = { path = "../wire-frame" }
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
