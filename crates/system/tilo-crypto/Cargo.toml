[package]
name = "tilo-crypto"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Small Rust-native cryptographic helpers used by Tilo system tooling"

[lib]
name = "tilo_crypto"
path = "src/lib.rs"

[[bin]]
name = "tilo-crypto"
path = "src/main.rs"

[features]
default = ["tls-fixture"]
tls-fixture = []

[dependencies]
authenticode = { version = "0.6", features = ["object", "std"] }
# authenticode 0.6 hashes PE images through digest 0.10's `Update` trait and
# has no release on the digest 0.11 / der 0.8 generation, so its digest input
# comes from the matching sha2 release.
authenticode-sha2 = { package = "sha2", version = "0.10" }
base64.workspace = true
cms = "0.2"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["alloc", "pem"] }
ed25519-dalek.workspace = true
# The crate's one randomness source: RSA key generation takes a rand_core
# 0.10 RNG over it, and seeds and identifiers are filled from it directly.
getrandom.workspace = true
hex.workspace = true
libc.workspace = true
object = { version = "0.39", default-features = false, features = ["pe", "read_core", "unaligned"] }
p256 = { version = "0.14", features = ["pem"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Only for its blinded RSA PKCS#1 signer (see `sign_rsa_pkcs1_ring`):
# RustCrypto's private RSA operation is affected by RUSTSEC-2023-0071.
ring = "0.17"
rsa = { version = "=0.10.0-rc.18", features = ["encoding", "sha2"] }
sha-crypt = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true
spki = "0.7"
time = { version = "0.3", features = ["formatting", "macros"] }
x509-cert = { version = "0.2", features = ["pem"] }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
