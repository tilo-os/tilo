[package]
name = "tilo-seal"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The one reviewed home for Tilo's public-key sealing (HPKE) and at-rest envelopes"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_seal"
path = "src/lib.rs"

# This is the only crate allowed to depend on raw AEAD/KEM crates
# (`tools/policy/check_crypto_dependencies.py`). Every other crate seals
# through the typed API here.
[dependencies]
# RFC 9180 HPKE. The same implementation (and Rust-Crypto backend) OpenMLS
# already uses, so sealing adds no new cryptographic code to the build.
hpke-rs = { version = "0.7", default-features = false, features = ["rustcrypto", "std"] }
hpke-rs-crypto = { version = "0.7", default-features = false, features = ["std"] }
hpke-rs-rust-crypto = { version = "0.7", default-features = false, features = ["std"] }
# At-rest AEAD with 192-bit random nonces.
chacha20poly1305.workspace = true
# Password-derived keys.
argon2.workspace = true
# The fixed password KDF of Chromium's Linux OSCrypt cookie format.
pbkdf2.workspace = true
sha1 = "0.11"
# Rclone's obscure password format: AES-256-CTR over a published key.
ctr = "0.10.1"
base64.workspace = true
# Key identifiers, the HKDF steps of formats this crate still reads, and
# the HKDF + AES-GCM wraps a browser computes with WebCrypto.
hkdf = "0.13"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
sha2.workspace = true
# The Secret Service's session transport (`secret_service`): the RFC 2409
# Oakley group, AES-128-CBC and PKCS#7, as the specification fixes them.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
num-bigint = "0.4"
getrandom.workspace = true
hex.workspace = true
subtle = "2.6"
zeroize.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
