[package]
name = "cloud-source-onedrive"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OneDrive, OneDrive for Business and SharePoint document libraries as a cloud-source provider over Microsoft Graph: delta feed, ranged reads, upload sessions, versions, share links."

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
chrono = { workspace = true, features = ["std"] }
cloud-source = { version = "0.1.0", path = "../cloud-source" }
base64.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", features = ["blocking"] }
# The in-memory Graph server behind `fake-server`.
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
test-http = { version = "0.1.0", path = "../../dev/test-http", optional = true }

[features]
# `cloud_source_onedrive::fake::FakeGraph`, an in-memory Microsoft Graph
# drive on the shared test responder, for this crate's conformance run and
# the storage daemon's end-to-end tests. Test support only.
fake-server = ["dep:hex", "dep:sha2", "dep:test-http"]

[dev-dependencies]
cloud-source = { path = "../cloud-source", features = ["conformance"] }
# The conformance run needs the fake server of this very crate.
cloud-source-onedrive = { path = ".", features = ["fake-server"] }
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
