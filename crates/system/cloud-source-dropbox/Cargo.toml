[package]
name = "cloud-source-dropbox"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dropbox accounts as a cloud-source provider: API v2 listings and cursor feed, long-poll, content_hash, revisions, upload sessions, ranged reads, share links and quota."

[dependencies]
chrono = { workspace = true, features = ["std"] }
cloud-source = { version = "0.1.0", path = "../cloud-source" }
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# The in-memory Dropbox API behind `fake-server`.
test-http = { version = "0.1.0", path = "../../dev/test-http", optional = true }

[features]
# `cloud_source_dropbox::fake::FakeDropbox`, an in-memory Dropbox API v2 on
# the shared test responder, for this crate's conformance run and the
# storage daemon's end-to-end tests. Test support only.
fake-server = ["dep:test-http"]

[dev-dependencies]
cloud-source = { path = "../cloud-source", features = ["conformance"] }
# The conformance run needs the fake server of this very crate.
cloud-source-dropbox = { path = ".", features = ["fake-server"] }
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
