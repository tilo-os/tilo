[package]
name = "tilo-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The `tilo` command: apps, the desktop's actions, and this device."

[[bin]]
name = "tilo"
path = "src/main.rs"

[dependencies]
# Everything here drives tools the image already carries — bootc, bootctl,
# systemctl, and /usr/libexec/tilo-deployment. Nothing links against a system
# library, so this builds on a host with no development headers, which is the
# constraint that shaped tilo-rollback the same way.
anyhow.workspace = true
# A hosted workspace's files come down in base64 pieces (`tilo files get`).
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
# Reads the session's GPU health record for `tilo system health --gpu`.
serde_json.workspace = true
# The cleanup policy (/etc/tilo/cache-gc.toml), its record, the locks tilo-vm and the test
# fixture generators hold, and free space for the policy's floor.
serde.workspace = true
toml.workspace = true
tilo-advisory-lock = { path = "../advisory-lock" }
# The cleanup record, replaced atomically and durably.
tilo-files = { path = "../../platform/tilo-files" }
rustix = { workspace = true, features = ["fs", "std"] }
tilo-paths.workspace = true
# The desktop's apps and actions (`tilo open`, `tilo action`, `tilo do`): the
# control protocol's one client, shared with tilo-control.
tilo-control = { path = "../../session/control-cli" }
# `tilo settings`: the profile's settings, held or followed.
settings-store = { path = "../settings-store" }
# `tilo login` and `tilo mcp`: this computer as one of the person's devices,
# certified by the root their browser tab holds, in their workspace.
tilo-browser-peer = { path = "../../browser/tilo-browser-peer" }
# Documents are applied in a confined worker: this program started again as
# it, which `main` hands over to first thing.
tilo-automerge-isolate.workspace = true
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# HTTPS to a site and a host, as every client of the relay makes its requests.
tilo-relay-client = { path = "../../hosting/tilo-relay-client" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
# Reads the PEM certificates a test names for HTTPS to trust (`tilo login`).
rustls.workspace = true
ed25519-dalek.workspace = true
postcard.workspace = true
hex.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# `tilo mcp`: the runtime's own MCP projection of a workspace, its actions
# asked of the workspace's host through this device's session, as the person
# their workspaces name.
tilo-runtime = { path = "../../runtime/tilo-runtime" }
collab-types = { path = "../../collab/collab-types" }
# `tilo mcp` asks the host to open the record its agent acts in as a window,
# and narrates what its actions are doing on the live plane.
tilo-actions = { path = "../../collab/actions" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
