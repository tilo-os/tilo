[package]
name = "tilo-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The `tilo` command: apps, the desktop's actions, and this device."

[[bin]]
name = "tilo"
path = "src/main.rs"

[dependencies]
# Everything here drives tools the image already carries — bootc, bootctl,
# systemctl, and /usr/libexec/tilo-deployment. Nothing links against a system
# library, so this builds on a host with no development headers, which is the
# constraint that shaped tilo-rollback the same way.
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
# Reads the session's GPU health record for `tilo system health --gpu`.
serde_json.workspace = true
# The cleanup policy (/etc/tilo/cache-gc.toml), its record, the locks tilo-vm and the test
# fixture generators hold, and free space for the policy's floor.
serde.workspace = true
toml.workspace = true
tilo-advisory-lock = { path = "../advisory-lock" }
rustix = { workspace = true, features = ["fs", "std"] }
workspace-hack = { version = "0.1" }
tilo-paths.workspace = true
# The desktop's apps and actions (`tilo open`, `tilo action`, `tilo do`): the
# control protocol's one client, shared with tilo-control.
tilo-control = { path = "../../session/control-cli" }

[dev-dependencies]
tempfile.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
