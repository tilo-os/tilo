[package]
name = "tilo-libvirt-domain"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "libvirt vocabulary shared by Tilo's virtual machines: connections, domain states and device XML."

[lib]
name = "libvirt_domain"
path = "src/lib.rs"

[dependencies]
bounded-command = { path = "../bounded-command" }
quick-xml.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
