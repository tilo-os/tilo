[package]
name = "tilo-endpoint-reachability"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Hold an iroh endpoint's relays back until something needs the device dialable, and find the person's devices on the local network."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_endpoint_reachability"
path = "src/lib.rs"

[features]
# `test_support::local_relay`: a loopback relay for tests that need a home relay.
test-support = ["dep:iroh-relay"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The person's relay setting, which every endpoint of a device reads through `relays`.
settings-store = { version = "0.1.0", path = "../settings-store" }
iroh.workspace = true
iroh-relay = { version = "1.0.3", features = ["server"], optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The local network's announcements: said and heard on every network the device is on (src/lan.rs).
swarm-discovery = "0.6.5"
data-encoding.workspace = true
# iroh's address-lookup trait hands a lookup's results back as this stream.
n0-future = "0.3.2"
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The settings document a test scopes its thread to.
serde_json.workspace = true
iroh-relay = { version = "1.0.3", features = ["server"] }
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
