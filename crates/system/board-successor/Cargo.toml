[package]
name = "tilo-board-successor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Board update selection: follows the board's release hint only to a digest the pinned Cosign key signed, with provenance and freshness that bind it."

[lib]
name = "tilo_board_successor"
path = "src/lib.rs"

[[bin]]
name = "tilo-board-successor"
path = "src/main.rs"

[dependencies]
# Verifiers run with bounded output and a deadline, killed with their tree.
bounded-command = { path = "../bounded-command" }
# sigaction for SIGTERM/SIGINT, so a stopped service kills its verifier.
libc.workspace = true
regex.workspace = true
serde_json.workspace = true
# The private 0700 directory holding the copied pull credentials.
tempfile.workspace = true
tilo-pycompat = { path = "../tilo-pycompat" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true

[dev-dependencies]
base64.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
