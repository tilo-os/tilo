[package]
name = "bounded-command"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Deadline and byte-bounded subprocess capture for Tilo trust boundaries"
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
