[package]
name = "desktop-policy-host"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Desktop policy on the host: personal defaults in settings, the published mimeapps list and the storage scanner."

[dependencies]
desktop-policy = { version = "0.1.0", path = "../desktop-policy" }
tilo-paths.workspace = true
# Which packages are installed and where their trees are.
package-store = { version = "0.1.0", path = "../../packaging/package-store" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# A person's default apps are a section of their settings.
settings-store = { version = "0.1.0", path = "../settings-store" }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
