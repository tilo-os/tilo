[package]
name = "app-state"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Canonical per-package persistence for a qOS app's Automerge document."

[lib]
name = "app_state"
path = "src/lib.rs"

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
# Path resolution is NOT re-invented here: `package_id` and
# `standalone_state_dir` come from the CLI SDK, which is also what
# `cli::resolve_workspace_path` falls back to. One resolver, two callers.
cli = { path = "../../runtime/cli" }

automerge.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# `flock(2)` for the single-writer guard around the actor sidecar.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[lints]
workspace = true
