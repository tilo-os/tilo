[package]
name = "tilo-app-state"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Canonical per-package persistence for a Tilo app's Automerge document."
repository.workspace = true
homepage.workspace = true

[lib]
name = "app_state"
path = "src/lib.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The canonical gate and the single-writer guard around the actor sidecar.
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# Path resolution is NOT re-invented here: `app_id` and
# `standalone_state_dir` come from the CLI SDK, which is also what
# `cli::resolve_workspace_path` falls back to. One resolver, two callers.
tilo-cli-kit = { version = "0.1.0", path = "../../runtime/cli" }
# The storage seam `FsStore` implements and `DocWriter` persists through.
durable-store = { version = "0.1.0", path = "../durable-store" }
# The typed id of the app whose document a store holds.
tilo-app-id.workspace = true
# The home directory bounds how far up directory syncs reach.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# The clock that also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

automerge.workspace = true
# Binds a load hint to the exact document bytes it was made for.
blake3.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Compare volume/file identities through live Windows handles.
same-file = "1.0.6"

[dev-dependencies]
durable-store = { path = "../durable-store", features = ["conformance"] }
tempfile.workspace = true
serial_test.workspace = true
# The counting allocator behind `heap::held`: what one unit and one document hold.
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tilo-test-env = { path = "../../dev/test-env" }

[[bench]]
name = "record_cost"
path = "benches/record_cost.rs"
harness = false

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enable Automerge's own browser entropy and clock support.
automerge = { workspace = true, features = ["wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
