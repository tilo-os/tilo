[package]
name = "fs-native"
version = "0.1.0"
edition = "2024"
autotests = false
publish = true
license.workspace = true
description = "Native local data plane: fanotify change journal, Btrfs capture epochs, incremental FastCDC manifests and pre-content placeholder hydration."
repository.workspace = true
homepage.workspace = true

[lib]
name = "fs_native"
path = "src/lib.rs"

# Capability report and the local benchmark suite. Both run against a real
# store volume; neither is needed by the library.
[[bin]]
name = "tilo-fs-native"
path = "src/bin/tilo-fs-native/main.rs"

[dependencies]
hex.workspace = true
blake3.workspace = true
fs-content = { version = "0.1.0", path = "../fs-content" }
libc.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
