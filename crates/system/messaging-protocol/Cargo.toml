[package]
name = "tilo-messaging-protocol"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Account-bound messaging protocol codecs; no transport credentials or app policy"

[features]
default = ["whatsapp-sdk", "sms-dbus", "signal-broker"]
signal-broker = ["dep:tokio", "dep:tilo-messaging", "dep:tilo-contact-directory", "dep:tilo-resource"]
whatsapp-sdk = ["dep:whatsapp-rust", "dep:tokio", "dep:futures-util", "dep:reqwest", "dep:tilo-net", "dep:rustls", "dep:rustls-native-certs", "dep:tokio-tungstenite"]
sms-dbus = ["dep:zbus", "dep:tokio", "dep:chrono", "dep:futures-util"]

[dependencies]
tilo-messaging = { path = "../../platform/tilo-messaging", optional = true }
tilo-contact-directory = { path = "../../platform/tilo-contact-directory", optional = true }
tilo-resource = { path = "../../sdk/tilo-resource", optional = true }
accounts = { path = "../accounts" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
uuid.workspace = true
tilo-files = { path = "../../platform/tilo-files" }
tilo-secret-vault = { path = "../secret-vault" }
tilo-advisory-lock = { path = "../advisory-lock" }
tilo-secrets = { path = "../../platform/tilo-secrets" }
tilo-clock = { path = "../../platform/tilo-clock" }
workspace-hack = { version = "0.1" }
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-runtime"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["tokio"], optional = true }
chrono = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tilo-net = { workspace = true, features = ["http"], optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }

[dev-dependencies]
buffa-build = "=0.9.2"
messages = { path = "../../../apps/messages" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true

[[test]]
name = "hosted_messages"
required-features = ["signal-broker"]
