[package]
name = "tilo-desktop-entry"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license = "AGPL-3.0-only"
description = "freedesktop.org desktop-entry parser and application scanner"

[lib]
name = "desktop_entry"
path = "src/lib.rs"

[[bin]]
name = "tilo-desktop-scan"
path = "src/bin/tilo-desktop-scan.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
thiserror = { workspace = true }
url.workspace = true
tilo-paths.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
