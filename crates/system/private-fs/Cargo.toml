[package]
name = "private-fs"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "User-owned private files with native ownership and access checks"

[dependencies]
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
