[package]
name = "tilo-tts"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT OR Apache-2.0"
description = "Tilo text-to-speech engine for the built-in screen reader: speech-dispatcher (SSIP) primary backend, espeak-ng subprocess fallback, null recording mock, and an interrupt-aware speech queue."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tts"
path = "src/lib.rs"

# License posture (see src/lib.rs for the full note):
#
# Tilo code links ONLY permissive crates. The speech engines themselves
# (speech-dispatcher, espeak-ng, Piper) are GPL but are reached as
# *separate processes* — speech-dispatcher over its SSIP socket, espeak-ng
# as a subprocess. The socket / process boundary means their GPL imposes
# no licensing constraint on this crate or anything that links it.
#
# `ssip-client` (the only TTS dependency we link) is MIT OR Apache-2.0.

[dependencies]
thiserror.workspace = true
tracing.workspace = true
bounded-command = { version = "0.1.0", path = "../bounded-command" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
# Pure-Rust speech-dispatcher SSIP client. MIT OR Apache-2.0 — no C
# linkage, no GPL propagation (speech-dispatcher sits behind the socket).
ssip-client = "0.10"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bounded-command = { version = "0.1.0", path = "../bounded-command" }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
