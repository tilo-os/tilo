[package]
name = "swipe"
version = "0.1.0"
edition = "2024"
publish.workspace = true
# Wraps the FUTO swipe-library (GPL-3.0-or-later) + ExecuTorch via a C-ABI
# shim. Tilo is AGPL-3.0-only; GPL-3.0 section 13 permits the combination.
license.workspace = true

[package.metadata.cargo-machete]
# build.rs uses cc to compile the libinput gesture bridge.
ignored = ["cc"]

[build-dependencies]
cc = "1"

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
