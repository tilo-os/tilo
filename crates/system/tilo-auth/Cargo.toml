[package]
name = "tilo-auth"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One secret per person and one early-boot unlock: user keys and their TPM, passphrase and recovery wrappers, the sibling unlock, the sign-in daemon and the boot tool"

[lib]
name = "tilo_auth"
path = "src/lib.rs"

[[bin]]
name = "tilo-authd"
path = "src/bin/tilo-authd.rs"
required-features = ["service"]

[[bin]]
name = "tilo-auth"
path = "src/bin/tilo-auth.rs"
required-features = ["service"]

[[test]]
name = "mechanism"
path = "tests/mechanism.rs"
required-features = ["service"]

[[test]]
name = "daemon"
path = "tests/daemon.rs"
required-features = ["service"]

[[test]]
name = "peer_enrol"
path = "tests/peer_enrol.rs"
required-features = ["service"]

[[test]]
name = "attestation"
path = "tests/attestation.rs"
required-features = ["service"]

[features]
default = ["service"]
# Everything but the wire protocol and its client. The PAM module, which is
# loaded into every process that authenticates, builds without it.
service = [
    "dep:anyhow",
    "dep:base64",
    "dep:clap",
    "dep:ed25519-dalek",
    "dep:futures",
    "dep:getrandom",
    "dep:hex",
    "dep:hmac",
    "dep:iroh",
    "dep:iroh-base",
    "dep:libc",
    "dep:postcard",
    "dep:rustix",
    "dep:settings-store",
    "dep:sha2",
    "dep:tempfile",
    "dep:tilo-ask-password",
    "dep:tilo-clock",
    "dep:tilo-identity",
    "dep:tilo-nm",
    "dep:tilo-rollback",
    "dep:tilo-seal",
    "dep:tilo-unlock-protocol",
    "dep:tilo-device-identity",
    "dep:tilo-user-identity",
    "dep:tokio",
    "dep:unicode-normalization",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
zeroize = { workspace = true, features = ["serde"] }

anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# The peer network the sibling unlock reaches the owner's devices over,
# directly or through a relay.
iroh = { workspace = true, optional = true }
iroh-base = { workspace = true, optional = true }
# The kernel keyring calls of the boot handoff, which no safe wrapper covers.
libc = { workspace = true, optional = true }
# The socket peer's credentials, which decide what it may ask.
rustix = { workspace = true, optional = true, features = ["net", "process"] }
postcard = { workspace = true, optional = true, features = ["alloc"] }
# The sign-in comforts and their clamping, defined beside the settings they
# carry to the login screens.
settings-store = { path = "../settings-store", optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tilo-ask-password = { path = "../ask-password", optional = true }
# When this boot's volume opened, in the note the booted system reads.
tilo-clock = { path = "../../platform/tilo-clock", optional = true }
# The client binds the service socket through the safe path, with or without the service.
tilo-files = { path = "../../platform/tilo-files" }
# This device's fleet of the person's devices, and the device's own key:
# whom to ask for an enrolment when this device holds no root.
tilo-identity = { path = "../../runtime/tilo-identity", optional = true }
tilo-device-identity = { path = "../../collab/tilo-device-identity", optional = true }
tilo-user-identity = { path = "../../collab/tilo-user-identity", optional = true }
# Where NetworkManager keeps an unlock network's saved connection.
tilo-nm = { path = "../tilo-nm", optional = true }
# The TPM and cryptsetup are driven through tilo-rollback's runner, sealing
# parent and keyslot helpers, so there is one way this OS talks to them.
tilo-rollback = { path = "../tilo-rollback", optional = true }
tilo-seal = { path = "../tilo-seal", optional = true }
# The strength rule for a secret no TPM throttles, shared with the installer.
tilo-unlock-protocol = { path = "../../collab/tilo-unlock-protocol", optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "signal", "time"] }
unicode-normalization = { version = "0.1.25", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tilo-test-env = { path = "../../../tools/test-env", features = ["iroh-relay"] }

[lints]
workspace = true
