[package]
name = "tilo-net"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo's network client defaults: one TLS crypto provider and one trust source."

[dependencies]
rustls.workspace = true
# Resolves to `crates/system/tilo-native-certs` through the workspace patch.
rustls-native-certs.workspace = true
reqwest = { workspace = true, optional = true }

[features]
# HTTP client builders on the same provider and trust source.
http = ["dep:reqwest"]
blocking = ["http", "reqwest/blocking"]

[lints]
workspace = true
