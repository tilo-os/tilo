[package]
name = "accounts"
version = "0.1.0"
edition = "2024"

[lib]
name = "accounts"
path = "src/lib.rs"

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libc.workspace = true
# Resolves the per-user config root ($XDG_CONFIG_HOME/qos) the same way the
# Settings app does, so every app agrees on one directory.
dirs.workspace = true

# --- Encryption-at-rest for the secret vault --------------------------
# Credentials are long-lived bearer secrets, so the vault is sealed on disk
# with XChaCha20-Poly1305 (a 192-bit-nonce AEAD) under a 256-bit key — the
# exact pattern the authenticator (totp) vault already uses. `getrandom`
# draws the key + per-write nonce from the OS CSPRNG; `zeroize` wipes the
# decrypted plaintext + derived key bytes from the heap. All three are
# already resolved in the shared workspace lockfile, so this adds no
# registry fetch. default-features are off so chacha's optional RNG surface
# is not pulled — randomness comes from `getrandom` directly.
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
