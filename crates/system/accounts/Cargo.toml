[package]
name = "accounts"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The shared online-accounts model and store: one account list and one sealed credential vault for every Tilo app."
repository.workspace = true
homepage.workspace = true

[lib]
name = "accounts"
path = "src/lib.rs"

[dependencies]
hex.workspace = true
tilo-advisory-lock = { version = "0.1.0", path = "../advisory-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# Credentials are long-lived bearer secrets, so the vault is sealed on disk
# with XChaCha20-Poly1305 under a 256-bit key held by Secret Service, DPAPI
# or an owner-only local file; the shared crate owns both the format and
# the key custody.
tilo-secret-vault = { version = "0.1.0", path = "../secret-vault" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Resolves the per-user config root ($XDG_CONFIG_HOME/tilo) the same way the
# Settings app does, so every app agrees on one directory.
tilo-xdg-paths = { version = "0.1.0", path = "../xdg-paths" }
# The vault in a browser page, which has no native config directory.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }

# getrandom's `SysRng` draws generated passwords from the OS CSPRNG;
# `zeroize` wipes decrypted plaintext from the heap.
getrandom.workspace = true
zeroize.workspace = true
uuid.workspace = true
url.workspace = true
# The storage daemon reads short-lived credentials through the cloud source
# interface; the credential helper runs as a bounded child process.
cloud-source = { version = "0.1.0", path = "../cloud-source" }
bounded-command = { version = "0.1.0", path = "../../../crates/system/bounded-command" }

[dev-dependencies]
# Tests stage and inspect key files through the vault's own private-file
# checks, and edit Windows ACLs through a bounded `icacls` call.
private-fs = { path = "../private-fs" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
