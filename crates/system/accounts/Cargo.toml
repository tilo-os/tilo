[package]
name = "accounts"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "accounts"
path = "src/lib.rs"

[dependencies]
private-fs = { path = "../private-fs" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
bounded-command = { path = "../../../crates/system/bounded-command" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Resolves the per-user config root ($XDG_CONFIG_HOME/tilo) the same way the
# Settings app does, so every app agrees on one directory.
dirs.workspace = true

# --- Encryption-at-rest for the secret vault --------------------------
# Credentials are long-lived bearer secrets, so the vault is sealed on disk
# with XChaCha20-Poly1305 (a 192-bit-nonce AEAD) under a 256-bit key — the
# exact pattern the authenticator (totp) vault already uses. `rand_core`'s
# OsRng draws the key + per-write nonce from the OS CSPRNG; `zeroize` wipes
# the decrypted plaintext + derived key bytes from the heap. All three are
# already resolved in the shared workspace lockfile, so this adds no
# registry fetch. default-features are off so chacha's optional RNG surface
# is not pulled — randomness comes from OsRng directly.
chacha20poly1305.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
zeroize.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lints]
workspace = true
