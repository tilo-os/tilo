[package]
name = "tilo-sandbox-core"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Landlock ruleset construction and seccomp-bpf deny-list compilation shared by every Tilo confinement path."
repository.workspace = true
homepage.workspace = true

[lib]
name = "sandbox_core"
path = "src/lib.rs"

# A leaf on purpose. The launcher must not depend on the compositor, and the
# app runtime must not depend on packaging; both confine processes with the
# primitives here, so one implementation sits below all of them.

[features]
# Kernel probes used by dependants' tests to prove a compiled filter is
# enforced, not merely produced. Never enabled by a production build.
test-support = []

[dependencies]
libc.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }
tempfile.workspace = true

[lints]
workspace = true
