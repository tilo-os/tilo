[package]
autotests = false
name = "env-tools"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Builds tool images for environments: resolves packages against an env-runtime, installs them in a build sandbox and seals what they add."

[lib]
name = "env_tools"
path = "src/lib.rs"

[[bin]]
name = "tilo-env-tools"
path = "src/main.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-files = { path = "../../platform/tilo-files" }
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
tilo-app-package = { path = "../../core/tilo-app-package" }
# The publisher key file.
registry-types = { package = "tilo-registry-types", path = "../../core/registry-types" }
tilo-environment = { path = "../../core/environment" }
# The build sandbox reaches its runtime's repositories and nothing else.
tilo-egress = { path = "../../core/egress" }
package-store = { package = "tilo-package-store", path = "../../core/package-store", features = ["store"] }

anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xattr = "1.6.1"
tilo-paths.workspace = true
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
