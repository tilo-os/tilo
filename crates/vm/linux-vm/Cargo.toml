[package]
name = "linux-vm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user Linux VMs: one unprivileged libvirt domain per guest OS, woken on launch and snapshotted when idle."

[lib]
name = "linux_vm"
path = "src/lib.rs"

[features]
# Waking a domain and keeping its windows behind an app keeper, in the program a VM machine
# serves with. A server that places sessions on those machines reads only their control
# requests, so it leaves this off and links no Wayland server.
default = ["supervisor"]
supervisor = ["dep:tilo-app-keeper"]

[[bin]]
name = "tilo-linux-vm"
path = "src/main.rs"
required-features = ["supervisor"]

# The privileged helper of a hosted-VM host (`hosted::jail`).
[[bin]]
name = "tilo-hosted-jail"
path = "src/jail_main.rs"

# `serde_bytes` is named only inside `#[serde(with = "serde_bytes")]`, an
# attribute string an unused-dependency scan does not read.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
collab-types = { path = "../../core/collab-types" }
tilo-action-policy = { path = "../../core/action-policy" }
blake3.workspace = true
# A refusal carries the host contract's typed reason and next steps.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
fnv.workspace = true
# The material a browser environment's session is started with, and the
# endpoint address it names the server by: one type the server and this host
# both build against.
iroh-base.workspace = true
tilo-server-protocol = { version = "0.1.0", path = "../../core/tilo-server-protocol" }
linux-vm-protocol = { path = "../linux-vm-protocol" }
libc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
tilo-app-id.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-libvirt-domain = { path = "../libvirt-domain" }
tilo-paths = { path = "../../platform/tilo-paths" }
tilo-sandbox-core = { path = "../../platform/sandbox-core" }
wire-frame = { path = "../../platform/wire-frame", features = ["postcard"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
tilo-desktop-entry = { path = "../../desktop/desktop-entry" }
# A device certificate, for a material's device.
tilo-user-identity = { version = "0.1.0", path = "../../core/tilo-user-identity" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A share's guest side, mounted over the host side it talks to.
linux-vm-agent = { path = "../linux-vm-agent" }

[target.'cfg(target_os = "linux")'.dependencies]
# The VM's window forwarder runs behind an app keeper, written into the keepers' registry.
tilo-app-keeper = { path = "../../desktop/app-keeper", optional = true }
# The VM network's bridge filter, over the same nf_tables encoder as a
# sandbox's egress filter.
tilo-egress = { path = "../../core/egress" }
