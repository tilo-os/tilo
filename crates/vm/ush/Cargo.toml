[package]
autotests = false
name = "ush"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Application runtime that hosts a shell: a guest built from an environment record, read-only images, brokered permissions."

[lib]
name = "ush"
path = "src/lib.rs"

[[bin]]
name = "tilo-ush"
path = "src/main.rs"

[features]
# `hosted_vm::test_host`: a host selling Linux VMs, with no hypervisor and
# no payment provider, for other crates' tests.
test-host = []
# `environment_terminals::quic`: a terminal stream carried over an iroh
# connection, for the hosts that serve it.
quic = ["dep:iroh", "dep:tokio"]
# The developer environment overrides, so a development session reads the
# system store it ships (`TILO_APPS_SYSTEM_DIR`) rather than the machine's, as
# the session and the launcher already do. Never ship it.
dev-overrides = ["package-store/dev-overrides"]
# `records::testing`: Terminal's documents served as the device's daemon serves them, for tests
# that run with no daemon.
test-workspace = []

[dependencies]
getrandom.workspace = true
iroh = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"], optional = true }
tilo-clock = { path = "../../platform/tilo-clock" }
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
sha2.workspace = true
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal" }
# The native editor's frames and socket, which Terminal's client drives the prompt over.
tilo-process = { path = "../../platform/tilo-process", features = ["native-editor"] }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-action-policy = { path = "../../core/action-policy" }
# The shell a session runs: POSIX sh and bash's common features, with
# Tilo's own commands in-process.
ush-shell = { path = "../ush-shell" }
# The shell's host on the Tilo side, outside every guest.
ush-tilo = { path = "../ush-tilo" }
# The environment record a guest is built from, and the tool builder boundary.
tilo-environment = { path = "../environment" }
# Two sessions of one environment never carry the same file action out twice.
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
# Atomic writes of the host-shell decisions.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# Builds the tool images `pkg install` adds.
env-tools = { path = "../env-tools" }
tilo-resource = { path = "../../core/tilo-resource" }
# What a `write` or `append` names by reference is kept in Tilo's content
# store, in a directory of the environment's own.
tilo-content = { path = "../../core/content" }
automerge.workspace = true
tilo-automerge.workspace = true
# Images are tapp packages the package store materialises read-only.
package-store = { package = "tilo-package-store", path = "../../core/package-store", features = ["store"] }
# Images a node did not ship (a server's), from the OCI registry CI
# publishes them to.
tilo-oci-images = { path = "../oci-images" }
tilo-app-package = { path = "../../core/tilo-app-package" }
semver.workspace = true
# This device's certificate names the key its tool images are trusted by; the
# user's fleet says which other devices' images are trusted.
tilo-user-identity = { path = "../../core/tilo-user-identity" }
hex.workspace = true
# Landlock ruleset installation and seccomp deny-list compilation, shared
# with the application launcher.
tilo-sandbox-core = { path = "../../platform/sandbox-core" }
# The guest's own network namespace: a DNS stub that answers only the
# record's NetHost grants, and nftables that admit only what it answered.
tilo-egress = { path = "../../core/egress" }
# Installed Linux apps become commands in every guest (`LinuxVmLaunch`);
# a hosted workspace's programs run in its own VM (`hosted_vm`). The keeper
# that wakes a VM's windows belongs to the VM's own program, so this side
# leaves the `supervisor` feature off and links no Wayland server.
linux-vm = { path = "../linux-vm", default-features = false }
linux-vm-protocol = { path = "../linux-vm-protocol" }
# The hosted VM a workspace asks for: its environment and the size it runs at.
tilo-server-protocol = { path = "../../core/tilo-server-protocol" }

anyhow.workspace = true
tilo-paths.workspace = true
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# A hosted VM's typed refusal, carried in a Terminal mark as base64 JSON.
base64.workspace = true
tilo-actions = { path = "../../core/actions" }
# A held command follows the host's plans file as its account answer does.
tilo-server-account = { path = "../../core/tilo-server-account" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-machine.workspace = true
ush = { path = ".", features = ["test-workspace"] }
# The real guest agent behind a fake VM link: a hosted program's terminal
# server is tested against what serves it in the VM.
linux-vm-agent = { path = "../linux-vm-agent" }
ed25519-dalek.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
