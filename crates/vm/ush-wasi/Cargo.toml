[package]
name = "ush-wasi"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tier 2 of ush: a WebAssembly (WASI preview 1) program run by the shell's own host, its files the environment's grants and its writes the environment's actions."

[lib]
name = "ush_wasi"
path = "src/lib.rs"

[dependencies]
ush-shell = { path = "../ush-shell" }
# The engine and the limits every guest in Tilo runs under.
tilo-wasm-host = { path = "../../runtime/tilo-wasm-host" }
wasmi = { version = "1.1", default-features = false, features = ["simd", "std"] }
getrandom.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The programs the tests run, written as WAT.
wat = "1"

[lints]
workspace = true
