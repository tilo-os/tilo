[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "linux-vm-agent"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The agent inside a Tilo Linux VM guest: launches apps, relays stdio, mounts shares."

[lib]
name = "linux_vm_agent"
path = "src/lib.rs"

[[bin]]
name = "tilo-linux-vm-agent"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
linux-vm-protocol = { path = "../linux-vm-protocol" }
libc.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-desktop-entry = { path = "../../system/desktop-entry" }
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mount", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true
# The agent's socket is bound through the helper that reaches any path length.
tilo-files = { path = "../../platform/tilo-files" }
