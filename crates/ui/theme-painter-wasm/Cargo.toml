[package]
name = "tilo-theme-painter-wasm"
version = "0.1.0"
edition = "2024"
publish = true
# The toolkit links it into every app that is not the thin runtime, so it is MIT with the
# SDK (LICENSING.md).
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "The interpreter (wasmi) a theme's painter set loaded from wasm runs on: fuel-bounded, memory-capped, no imports."
repository.workspace = true
homepage.workspace = true

# The code the runtime leaves out. The toolkit names it in every build but
# the thin one; there the painter engine (crates/engines/loadable/theme-painter)
# links it into its own library, which the toolkit opens the first time a
# theme names a painter set.
[dependencies]
# The painter interface the module implements and the bytes it exchanges.
tilo-theme-sdk = { version = "0.1.0", path = "../theme-sdk" }
# The interpreter, its limits and its failures: one wasm host layer for every host.
tilo-wasm-host = { version = "0.1.0", path = "../../core/tilo-wasm-host", default-features = false }
wasmi = { version = "1.1", default-features = false, features = ["std"] }
# A call's guest state is behind a lock: one call at a time on one module.
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The compiled tier: a painter set whose module the device's daemon compiled runs as machine
# code, deserialized here with wasmtime's runtime (no compiler is linked). A set the daemon did
# not compile, and every browser, runs on the interpreter above.
wasmtime = { version = "50.0.0", default-features = false, features = ["runtime", "std"] }
tilo-wasm-aot = { version = "0.1.0", path = "../../platform/tilo-wasm-aot" }
tracing.workspace = true

[dev-dependencies]
# The modules the tests refuse and bound, written as WAT.
wat = "1"
# The compiler that makes the artifact a device's daemon would, so a set is tested on both.
tilo-wasm-aot = { path = "../../platform/tilo-wasm-aot", features = ["compile"] }
tempfile.workspace = true

[lints]
workspace = true
