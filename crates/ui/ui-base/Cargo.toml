[package]
name = "tilo-ui-base"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
autoexamples = false
repository.workspace = true
homepage.workspace = true
description = "The Tilo UI toolkit's base: the widget contract, layout, paint, text, theming, input, accessibility and presence every widget is built on."

[package.metadata.cargo-machete]
# wgpu-hal is referenced through vello's wgpu re-export; the direct optional
# dependency marks `presentation-feedback`, which uses the Metal observer of
# the patched HAL (vendor/wgpu-hal).
# getrandom02 only selects the browser entropy backend for transitive crypto.
# serde_bytes is named only inside `#[serde(with = "serde_bytes")]`.
ignored = ["wgpu-hal", "getrandom02", "serde_bytes"]

[features]
default = ["native", "broker-transport"]
# Tilo's model: its records and actions over them (tilo-resource), the synced
# documents' types and the permission context over them (tilo-collab-types,
# tilo-permissions), and the app layer built on them: the app runner's sync,
# history and undo, presence, search and the resource-backed views. Without
# it the crate is a UI toolkit that knows nothing about Tilo. `tilo-app` turns
# it on.
model = ["dep:tilo-permissions", "dep:collab-types", "dep:tilo-resource", "dep:tilo-reference", "settings-model/model", "tilo-actions/document-read"]
# The native runner and its services: the winit event loop with its
# AccessKit adapter, the Wayland clipboard, the OS URI handler, startup
# warmup, the system appearance a standalone app follows, and the
# `ui::native` backends. Without it the crate is the portable
# toolkit — widgets, state, layout, rendering and the headless host — and a
# host supplies its own clipboard and speech (`tilo_clipboard::install_resolver`,
# `tts::install_speaker_resolver`).
native = ["local-daemons", "tilo-process/native", "dep:tilo-appearance", "tilo-appearance/host-portals", "dep:accesskit_winit", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:windows", "dep:accesskit_android", "dep:jni", "dep:ndk-context", "syntax-definitions", "tokio/full"]
# X11 windows (winit's X11 backend), for development builds on an X11 host:
# `cargo run -p <app> --features ui/x11` (through `tilo-app`'s `x11`). Every
# Tilo app runs as a Wayland client in its sandbox, so the shared runtime
# leaves X11 (x11rb, x11-dl) out. winit's X11 backend comes through
# tilo-winit-x11, which the workspace hack's analysis skips
# (.config/hakari.toml).
x11 = ["dep:tilo-winit-x11"]
# two-face's grammars for the code editor's highlighting (about 0.9 MB of
# data). Without it every language highlights as plain text; the browser
# toolkit core leaves it out.
syntax-definitions = ["tilo-highlight-grammars/syntax-definitions"]
# The grammar set is not linked: the code editor's highlighter opens it from
# libtilo_highlight_engine.so the first time code is highlighted. The engine
# library's own build (crates/engines/loadable/highlight) turns this on, so the
# shared runtime every app maps leaves syntect and the grammars out; any
# other build links them.
lazy-highlight = []
# The interpreter a theme's painter sets run on is not linked: `part_paint`
# opens it from libtilo_theme_painter_engine.so the first time a theme names
# a set. The engine library's own build (crates/engines/loadable/theme-painter)
# turns this on, so the shared runtime every app maps leaves wasmi out; any
# other build links it.
lazy-painter = []
# Clients of the local session daemons: the runtime portal's inherited
# service descriptors and the runtime identity service with its on-disk
# identity. Without it the host installs a `local_identity::LocalIdentitySource`
# (default: none). Settings are not guarded here: the toolkit reads the
# source its host installed, else the fallback its starter registered.
local-daemons = []
# The collaboration manager's built-in transport, which the toolkit's host
# (`tilo-ui`) runs; the toolkit base only keeps its runtime.
broker-transport = ["local-daemons", "tokio/full"]
# An integration test links the library once, without its `cfg(test)`: the
# fixtures a test draws with ([`headless::Driver::mount`], the pinned font
# catalogue) come with it.
test-support = ["tilo-clock/test-support"]
presentation-feedback = ["dep:wgpu-hal"]
# Persist DXC-compiled shaders between runs on Windows. It needs the patched
# wgpu-hal (vendor/wgpu-hal), which crates.io does not have, so it stays off
# for apps built on the published SDK.
dx12-shader-cache = []
# Zero-copy DMA-BUF -> wgpu texture import via Vulkan external memory
# (`dmabuf_import`). Shared by the WebView's rendered pages and the video
# decoder's hardware frames — both hand over a GPU buffer as a dmabuf. Pulls
# `ash` for the raw-Vulkan interop, so it stays opt-in for builds that need
# neither. It needs Tilo's wgpu-hal (vendor/wgpu-hal) for the queue's wait semaphores and foreign
# external memory, which crates.io does not have, so it stays off for apps built on the
# published SDK.
dmabuf-import = ["dep:ash"]
# Zero-copy GPU video frames: the dmabuf import above for a hardware
# decoder's output. Plane upload and the YUV->RGB conversion (`gpu_video`)
# are always built; without this, frames are uploaded instead.
gpu-video = ["dmabuf-import"]

[dependencies]
tilo-permissions = { workspace = true, optional = true }
tilo-member-types.workspace = true
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# Sorts without a copy of std's sort per call site, which kept the web
# shell's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
# Initials, as the login and boot sign-in screens draw them too.
tilo-face = { version = "0.1.0", path = "../../platform/tilo-face" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-mime = { version = "0.1.0", path = "../../platform/tilo-mime" }
# What this target's build offers, for portable code that offers less on the web.
tilo-platform-caps = { version = "0.1.0", path = "../../platform/tilo-platform-caps" }
fnv.workspace = true
# The host services the toolkit reaches, each in its platform crate under the toolkit's module
# path: background work and wakes, the clipboard, file choosers and URI opening,
# notifications and secrets.
tilo-clipboard.workspace = true
tilo-dialogs.workspace = true
tilo-notify.workspace = true
tilo-secrets.workspace = true
tilo-ui-paint = { version = "0.1.0", path = "../ui-paint" }
# The part painter interface every painter set draws through (`part_paint`).
tilo-theme-sdk = { version = "0.1.0", path = "../theme-sdk" }
# The interpreter a theme's painter sets loaded from wasm run on
# (`part_paint::wasm`): fuel-bounded, memory-capped, no imports. Named only
# while `lazy-painter` is off; the engine library carries it otherwise.
tilo-theme-painter-wasm = { version = "0.1.0", path = "../theme-painter-wasm" }
# The emoji catalogue the toolkit's picker, reaction strip and text fields
# read: a text field resolves `:name:` without the app naming a catalogue
# crate, and every app's field offers emoji by default. A workspace's own
# emoji are added to it (`workspace_emoji`), never a replacement for it.
emoji = { package = "tilo-emoji", version = "0.1.0", path = "../emoji" }
# The system's light/dark, accent, contrast and motion preferences, which a
# standalone app outside Tilo OS follows (`host_appearance`).
tilo-appearance = { version = "0.1.0", path = "../../platform/tilo-appearance", optional = true }
tilo-advisory-lock = { version = "0.1.0", path = "../../platform/advisory-lock" }
# Presentation feedback, and the input vocabulary a toolkit and a web engine share: a
# field's purpose and fingerprint, its editing history and deferred edits, and the
# modifier keys.
tilo-presentation = { version = "0.1.0", path = "../../platform/tilo-presentation", features = ["gpu-damage"] }
# Frames drawn by the workspace's render service instead of a GPU in the app
# (`render_thread::remote`); its transport exists only on Linux, its vocabulary
# everywhere.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process" }
# A software adapter's frames are rasterized on the CPU and uploaded, native
# or in a page (`crate::cpu_raster`).
tilo-cpu-raster = { version = "0.1.0", path = "../tilo-cpu-raster" }
tilo-ui-graph = { version = "0.1.0", path = "../ui-graph" }
tilo-ui-macros = { version = "0.1.0", path = "../ui-macros" }
tilo-font-catalog = { version = "0.1.0", path = "../../platform/font-catalog" }
settings-model = { package = "tilo-settings-model", version = "0.1.0", path = "../../sdk/settings-model", default-features = false }
# Dates, clocks and numbers as the person set them, without the toolkit, so a host
# that has no toolkit answers the same as a window (tilo-formats).
tilo-formats = { version = "0.1.0", path = "../tilo-formats" }
# `storage`: app files through tilo-files in tilo-paths' per-app locations.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["json"] }
tilo-paths.workspace = true
# Parses the portal's returned file URIs. Non-optional:
# `portal::to_local_path` is the file-access rule — a URI naming a remote
# host must not resolve to a local path — and must be testable in every
# build configuration.
url.workspace = true
# The two halves of `uri`: RFC 3986 percent-decoding and the
# x-www-form-urlencoded dialect that also reads `+` as a space.
percent-encoding.workspace = true
form_urlencoded.workspace = true
# First-frame marks are shared with the greeter's startup metrics capture.
tilo-startup-metrics = { version = "0.1.0", path = "../../platform/startup-metrics" }
automerge.workspace = true
tilo-spellcheck = { version = "0.1.0", path = "../spellcheck" }
# Grammar-backed highlighting (`widget::code_editor::syntax`): the token
# vocabulary, and the grammar set (syntect over two-face's extended syntax
# set), linked unless `lazy-highlight` opens it from its engine library.
tilo-highlight = { version = "0.1.0", path = "../highlight" }
tilo-highlight-grammars = { version = "0.1.0", path = "../highlight-grammars" }
tracing.workspace = true
# The app log reads RUST_LOG (`launch::app_log`): an app built outside this
# workspace gets no env-filter from the workspace-hack.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zeroize.workspace = true
cosmic-text = { workspace = true, features = ["fontconfig", "peniko", "swash", "std"] }
# Keep this aligned with cosmic-text: text painting needs the font's complete
# variation-axis order to translate CSS-like axis values for Vello.
skrifa = "0.44.0"
pollster.workspace = true
rustc-hash.workspace = true

# Match wgpu-hal's ash version so Vulkan handles can pass through
# `create_texture_from_hal`.
ash = { version = "0.38", optional = true }
taffy = { workspace = true, features = ["content_size"] }
# The portable toolkit needs tasks and channels only; tokio refuses its
# socket, file and thread features on wasm, so `native` and
# `broker-transport` enable them.
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tilo-rt.workspace = true
vello.workspace = true
# A theme's own surface shader (`tokens::shader`) is checked as WGSL when the
# theme is read: naga is the same front end wgpu runs, re-exported by it, so
# the check is the compiler's and no second copy of the grammar is linked.
naga = { version = "29", default-features = false, features = ["wgsl-in"] }
# `scene_parts` splits and compares encoded scene streams; widget tests also
# pin paint contracts on draw tags without rendering pixels.
vello_encoding.workspace = true
libc.workspace = true
wgpu.workspace = true
winit.workspace = true
tilo-winit-x11 = { version = "0.1.0", path = "../winit-x11", optional = true }
fluent.workspace = true
tilo-headless-schema = { version = "0.1.0", path = "../../platform/headless-schema" }
unic-langid.workspace = true
# UAX #14 opportunities shared by editor geometry and clamped-label wrapping.
# cosmic-text uses the same crate internally; naming it directly lets toolkit
# code that must mirror shaped rows avoid ASCII-space heuristics.
unicode-linebreak = "0.1.5"
# UAX #9 levels, for apps that lay out bidirectional text themselves (Ebook's
# pages); cosmic-text uses the same crate. See text_break::bidi_info.
unicode-bidi = "0.3.18"
# Confusable skeletons: a bot's shown name that looks like a workspace member's
# is labelled with its service.
unicode-normalization = "0.1.25"
# ICU grapheme clusters, plus dictionary/LSTM segmentation for scripts whose
# word boundaries cannot be inferred from whitespace (Thai, Lao, Khmer,
# Myanmar, CJK); natively only, see text_break.rs.
icu_segmenter = "2.3"
# TeX/Liang hyphenation patterns with language-specific minima. The same
# implementation is already used by the workspace's Typst document engine;
# making it direct lets UI paragraphs opt in without runtime dictionary I/O.
# Every language natively; see the wasm32 table for the browser's subset.
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "english", "german"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
# PNG and JPEG encoding for every app (`png`, `jpeg`): written here, in the
# shared runtime, so an app that encodes an image does not instantiate the
# encoders' generic code into its own binary.
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tilo-image-codec = { version = "0.1.0", path = "../../platform/image-codec" }
jiff.workspace = true
# Shared collaboration types used by the history/conflict/channel widgets and
# by the signed wire envelopes carried by
# `CollabRequest::SignedSyncIncremental` /
# `CollabEvent::SignedCRDTIncremental`.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types", optional = true }
# The document engine's line breaks, paragraphs and paging, which text layout
# reads in every build. With `model` (its `model` feature), `history_source`
# also materialises past versions with `tilo_doc::snapshot::at` and writes each
# history row's summary from its structural snapshot diff.
tilo-text-layout = { version = "0.1.0", path = "../../platform/text-layout" }
# Version history, stamped commits and replay of any document.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["local"] }
# Every catalogue and text index is a tantivy index through the shared
# search layer.
tilo-search = { version = "0.1.0", path = "../../platform/search" }
# The plain names a widget carries of an action, an invocation, a presence and a
# resource.
tilo-action-types = { version = "0.1.0", path = "../../platform/action-types" }
# The Tilo ACTION model: serializable, replayable CRDT-mutation actions + the
# nested Resource tree apps publish. `action_palette` +
# the `App` resource-collection hook build on it to make Ctrl+K scope to the
# focused app instance's open resources and dispatch their exported actions.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
# What a reference in rich text refers to: a person, or the catalogue's resource reference.
tilo-reference = { version = "0.1.0", path = "../../core/reference", optional = true }
# Who may invoke which action: grants over the published tree.
# Other people's presence and the colour they wear, as the toolkit draws them.
tilo-presence = { version = "0.1.0", path = "../../platform/tilo-presence" }
# Who sits at this device: the identity a host installs, read with or without the model.
tilo-local-identity = { version = "0.1.0", path = "../../platform/local-identity" }
# Direct dep on the Ed25519 implementation `tilo-collab-types` uses so
# the toolkit can name its `SigningKey` without reaching into the
# tilo-collab-types private module path. Pinned
# to the same major as `tilo-collab-types`.
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# `widget::qr` paints pairing and invite payloads. `qrcode` is a small (no
# transitive deps), pure-Rust QR encoder that produces a module-matrix we
# paint with Vello.
qrcode.workspace = true
sha2.workspace = true
# SIMD compiler fingerprinting and integrity for the private DX12 cache.
blake3.workspace = true
unicode-script = "=0.5.8"
# Emoji presentation decides when the browser must fetch the colour emoji face.
unicode-properties = "=0.1.4"
postcard = { workspace = true, features = ["alloc", "use-std"] }
hex.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
# OS randomness comes from getrandom through its `rand_core` adapter.
rand_core.workspace = true
# Accessibility: AccessKit is the cross-platform a11y schema. On Windows,
# macOS, iOS and Android a window's winit adapter publishes its tree to the
# platform's accessibility service from the process that draws it. On Linux a
# window sends the same tree to the session over its shell-ui connection and
# the session is the one AT-SPI2 exporter (`crates/desktop/session/src/a11y.rs`),
# so no app process holds a D-Bus connection or links zbus. That is why the
# Linux-only `accesskit_unix` feature is not enabled here: the adapter falls
# back to its empty platform implementation on Linux.
# The `serde` feature carries a window's tree and the actions a client asks
# back over the shell-ui protocol. `accesskit_winit` 0.34 targets winit
# 0.30.x — the same pin as the `winit` dep above. See
# `crates/ui/ui-core/src/accesskit_bridge.rs` (tree builder + role/action mapping) and the
# adapter wiring in `crates/ui/ui-app/src/app.rs`.
accesskit = { version = "0.25.0", features = ["serde"] }
# Built on tilo-winit, so it shares the toolkit's winit types when published.
accesskit_winit = { package = "tilo-accesskit-winit", version = "0.34.0", path = "../../../vendor/accesskit_winit", optional = true, default-features = false, features = ["rwh_06"] }
# Accessibility: the built-in screen reader (`ui::screen_reader`) speaks
# focus / value / live-region narration through the offline Tilo TTS engine.
# `default_speaker()` never panics (falls back to `NullSpeaker` when no speech
# stack is installed), so depending on this is safe in headless builds.
tilo-tts = { version = "0.1.0", path = "../../platform/tts" }

[target.'cfg(windows)'.dependencies]
# The menu bar and Jump List History and Search live in (`host_chrome/windows.rs`).
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]

[dev-dependencies]
# The menus and materials a document editor opens, drawn as the toolkit draws them.
tilo-rich-edit = { path = "../tilo-rich-edit", features = ["test-support"] }
# Hand-written painter modules for the wasm host's refusal and budget tests.
wat = "1"
# The Bauhaus theme's painter, run natively through the host to check its
# shipped document and how the toolkit draws it.
tilo-theme-bauhaus = { path = "../themes/bauhaus" }
# The compiler that produces the artifact a device's daemon makes for a theme's changed module,
# so the compiled painter path is measured beside the interpreter's.
tilo-wasm-aot = { path = "../../platform/tilo-wasm-aot", features = ["compile"] }
# The headless driver's fixtures are behind `test-support`;
# enabling it here runs the integration tests that drive them whenever the
# package is tested, not only when a dependant happens to unify the feature in.
# The defaults stay with the package's selection: a wasm32 test build asked for
# without them (the page's toolkit core) must not take the native runner's.
tilo-ui-base = { path = ".", default-features = false, features = ["test-support"] }
# The closure-built action host the driver's job tests answer calls with.
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
# Deterministic swapchain lifecycle tests, without a display or GPU.
wgpu = { workspace = true, features = ["custom", "noop"] }
serial_test.workspace = true
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# The `diag!` tests reproduce the crash they prevent: they need `dup2` to point
# the process's stderr at a pipe, and the child's exit signal to assert SIGABRT.
# `widget::file_picker::tests` build a real on-disk tree to exercise the
# `std::fs::read_dir` path. Already pulled in by shell as a regular
# dev-dep; pinning here for the leaf-test build.
tempfile.workspace = true
# Tests whose interface is the process environment (launcher variables such
# as `TILO_SVC_COLLAB_FD`) set it through `ScopedEnv`, which restores the
# prior value and serialises every such test in the process.
tilo-test-env = { path = "../../../tools/test-env" }
# Paused-clock tests of the collaboration endpoints' deadlines.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# Soft-keyboard input reaches the runner through the activity's
# `TiloTextInput` view (`app/android_text_input`).
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }
# TalkBack reads the AccessKit tree through a node provider injected into the
# NativeActivity's window (`accesskit_android_adapter.rs`). accesskit_winit's
# own Android glue expects GameActivity's `mSurfaceView`, so the injecting
# adapter is driven directly. `embedded-dex` carries its Java delegate inside
# the library, so the APK needs no extra class.
accesskit_android = { version = "0.8.0", optional = true, features = ["embedded-dex"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { version = "29", default-features = false, features = ["metal"], optional = true }
# The menu bar and title-bar search field History and Search live in
# (`host_chrome/macos.rs`). The generation arboard already brings in.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSObject", "NSProcessInfo", "NSString"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSSearchField",
    "NSSearchToolbarItem",
    "NSText",
    "NSTextField",
    "NSToolbar",
    "NSToolbarItem",
    "NSView",
    "NSWindow",
], optional = true }

# Private files need an OS; the browser supplies them through its host instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Hyphenation patterns for every language. The browser toolkit core keeps
# English and German only (the common table): the rest would add about 1 MB
# downloaded before anything runs; other languages there are not hyphenated.
hypher = { version = "0.1.7", features = ["full"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# Browser entropy for the portable wasm32 build. These select third-party
# platform backends only; toolkit behaviour stays behind the `native` feature.
# The page's clock and time zone come from `tilo-clock`, which asks the browser
# rather than carrying a time-zone database into the bundle.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
# The RustCrypto stack under key-group and the identity ceremony draws entropy
# through getrandom 0.2, which needs its JS backend named in the browser.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }

# wasm32 without atomics runs on one thread; this lets the renderer keep its
# compile-time `Send` checks. The browser host must still render on the page's
# thread instead of spawning `ui-render`.
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
