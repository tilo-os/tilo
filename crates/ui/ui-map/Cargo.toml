[package]
name = "tilo-ui-map"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "The map for the Tilo UI toolkit: children placed at points on a surface that pans and zooms, as a retained widget."

[features]
# The hooks the app runner's tests read from outside a widget.
test-support = ["tilo-ui/test-support"]

# `tilo-component-scan` is read by build.rs, which an unused-dependency scan does not read.
[package.metadata.cargo-machete]
ignored = ["tilo-component-scan"]

[dependencies]
tilo-ui-base = { version = "0.1.0", path = "../ui-base", default-features = false }
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false }
tilo-cpu-raster = { version = "0.1.0", path = "../tilo-cpu-raster" }
taffy = { workspace = true, features = ["content_size"] }
vello.workspace = true
winit.workspace = true

[build-dependencies]
tilo-component-scan = { version = "0.1.0", path = "../tilo-component-scan" }

[dev-dependencies]
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false, features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
