[package]
name = "tilo-ui-nav"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "The window shell of the Tilo UI toolkit: a sidebar of places, an overview, the content and an inspector, side by side while they fit and one at a time when they do not."

[features]
# The hooks the app runner's tests read from outside a widget.
test-support = ["tilo-ui/test-support"]
native = ["tilo-ui/native"]

# `tilo-component-scan` is read by build.rs, which an unused-dependency scan does not read.
[package.metadata.cargo-machete]
ignored = ["tilo-component-scan"]

[dependencies]
tilo-ui-base = { version = "0.1.0", path = "../ui-base", default-features = false }
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false }
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
settings-model = { package = "tilo-settings-model", version = "0.1.0", path = "../../sdk/settings-model", default-features = false }
automerge.workspace = true
tracing.workspace = true
taffy = { workspace = true, features = ["content_size"] }
vello.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-actions = { version = "0.1.0", path = "../../core/actions" }

[build-dependencies]
tilo-component-scan = { version = "0.1.0", path = "../tilo-component-scan" }

[dev-dependencies]
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false, features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
