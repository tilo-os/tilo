[package]
name = "tilo-ui-math"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Structured mathematical typesetting for Tilo: the expression tree, its TeX and Typst forms, box layout and drawing, and the gaps an editor inserts at."

[dependencies]
tilo-ui-base = { version = "0.1.0", path = "../ui-base", default-features = false }
vello.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
