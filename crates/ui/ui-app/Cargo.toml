[package]
name = "tilo-ui-app"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
autoexamples = false
repository.workspace = true
homepage.workspace = true
description = "The Tilo UI app runner: the App that drives a widget tree in a window, its headless driver, launch, the action palette and frame profiling, over the tilo-ui toolkit."

[package.metadata.cargo-machete]
# serde_bytes is named only inside `#[serde(with = "serde_bytes")]`.
ignored = ["serde_bytes"]

[features]
default = ["native"]
# Each feature is the toolkit's of the same name (see tilo-ui), plus what the runner takes for it.
model = ["tilo-ui/model", "tilo-ui-base/model", "dep:runtime-collab", "dep:collaboration", "dep:collab-types", "dep:tilo-resource", "dep:tilo-reference"]
# The native runner: the winit event loop with its AccessKit adapter, the platform chrome and
# the OS search hand-off.
native = ["tilo-ui/native", "tilo-ui-nav/native", "tilo-ui-base/native", "dep:accesskit_winit", "dep:tilo-host-search", "dep:objc2", "dep:objc2-app-kit", "dep:windows", "dep:jni", "dep:ndk-context", "tokio/full"]
x11 = ["tilo-ui/x11"]
syntax-definitions = ["tilo-ui/syntax-definitions"]
lazy-highlight = ["tilo-ui/lazy-highlight"]
lazy-painter = ["tilo-ui/lazy-painter"]
# The toolkit's clients of the session daemons.
local-daemons = ["tilo-ui/local-daemons"]
# The toolkit's `WebView` widget and the device's content store (see tilo-ui).
webview = ["tilo-ui/webview"]
content = ["tilo-ui/content"]
# The Tilo host a Rust app's process runs under: the launcher (`launch::run`) that attaches it
# to the session's daemons and hands it its content store, the settings file it follows, and
# the page frames it traces, with everything of the toolkit's `host`. Tilo's own apps and the
# shell turn it on; the published default links none of it. It belongs to the Rust-app
# framework and goes with it.
host = ["native", "model", "local-daemons", "broker-transport", "webview", "content", "tilo-ui/host", "dep:runtime-portal", "dep:settings-store", "dep:tilo-content-device", "dep:tilo-webview"]
broker-transport = ["tilo-ui/broker-transport", "local-daemons", "tokio/full"]
# The headless driver's fixtures, for the tests above the runner.
test-support = ["tilo-ui/test-support", "tilo-ui-base/test-support", "collaboration?/test-support", "runtime-collab?/settings-host"]
realtime-video = ["tilo-ui/realtime-video"]
decode = ["tilo-ui/decode"]
presentation-feedback = ["tilo-ui/presentation-feedback"]
dx12-shader-cache = ["tilo-ui/dx12-shader-cache"]
webview-adblock = ["tilo-ui/webview-adblock"]
lazy-adblock = ["tilo-ui/lazy-adblock"]
dmabuf-import = ["tilo-ui/dmabuf-import"]
gpu-video = ["tilo-ui/gpu-video"]
mpris = ["native", "tilo-ui/mpris"]
portal = ["native", "tilo-ui/portal"]
host-portals = ["tilo-ui/host-portals"]

[dependencies]
tilo-ui-nav = { version = "0.1.0", path = "../ui-nav" }
tilo-permissions.workspace = true
tilo-action-types.workspace = true
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false }
# The frame pipeline the runner drives: the render worker, retained targets, strips and pipeline caches.
tilo-ui-render = { version = "0.1.0", path = "../ui-render", default-features = false }
tilo-ui-base = { version = "0.1.0", path = "../ui-base", default-features = false }
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-content = { version = "0.1.0", path = "../../core/content", default-features = false }
# The launcher hands an app its content-store capability (`launch`).
tilo-content-device = { version = "0.1.0", path = "../../core/content-device", optional = true }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["json"] }
tilo-headless-schema = { version = "0.1.0", path = "../../platform/headless-schema" }
tilo-image-codec = { version = "0.1.0", path = "../../platform/image-codec" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-presentation = { version = "0.1.0", path = "../../platform/tilo-presentation", features = ["gpu-damage"] }
# The open-file limit and Android activity a launched app process starts with.
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process" }
# The network's state the shell tells a floating window (`app::floating`).
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net" }
tilo-rt.workspace = true
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-startup-metrics = { version = "0.1.0", path = "../../platform/startup-metrics" }
# The page frames a window traces (`host`).
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview", optional = true }
settings-model = { package = "tilo-settings-model", version = "0.1.0", path = "../../sdk/settings-model", default-features = false }
settings-store = { package = "tilo-settings-store", version = "0.1.0", path = "../../desktop/settings", optional = true }
runtime-collab = { package = "tilo-runtime-collab", version = "0.1.0", path = "../../core/runtime-collab", default-features = false, optional = true }
collaboration = { package = "tilo-collaboration", version = "0.1.0", path = "../../core/collaboration", optional = true }
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types", optional = true }
runtime-portal = { package = "tilo-runtime-portal", version = "0.1.0", path = "../../core/runtime-portal", optional = true }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }
tilo-reference = { version = "0.1.0", path = "../../core/reference", optional = true }
# A host search result the OS wakes this app for goes to the runtime.
tilo-host-search = { version = "0.1.0", path = "../../integrations/tilo-host-search", optional = true }
accesskit = { version = "0.25.0", features = ["serde"] }
# Built on tilo-winit, so it shares the toolkit's winit types when published.
accesskit_winit = { package = "tilo-accesskit-winit", version = "0.34.0", path = "../../../vendor/accesskit_winit", optional = true, default-features = false, features = ["rwh_06"] }
automerge.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
jiff.workspace = true
libc.workspace = true
pollster.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
taffy = { workspace = true, features = ["content_size"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
# The app log reads RUST_LOG (`launch::app_log`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true
vello.workspace = true
winit.workspace = true
zeroize.workspace = true
# `#[serde(with = "serde_bytes")]` on a continuation's carried bytes.
serde_bytes.workspace = true
# Accessibility: the built-in screen reader (`ui::screen_reader`) speaks
# focus / value / live-region narration through the offline Tilo TTS engine.
# `default_speaker()` never panics (falls back to `NullSpeaker` when no speech
# stack is installed), so depending on this is safe in headless builds.
tilo-tts = { version = "0.1.0", path = "../../platform/tts" }

[target.'cfg(windows)'.dependencies]
# The jump list and menu bar the native runner installs on its window.
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# Soft-keyboard input reaches the runner through the activity's `TiloTextInput` view
# (`app/android_text_input`).
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar and title-bar search the native runner installs on its window.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSView"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tilo-member-types.workspace = true
# The integration tests drive the runner through its `test-support` fixtures. The dev
# dependencies turn the toolkit's `model` on, so the runner takes it too: its model code
# names the toolkit's model-only items.
tilo-ui-app = { path = ".", default-features = false, features = ["test-support", "model", "host"] }
serial_test.workspace = true
# The headless driver and its fixtures are behind `test-support`.
tilo-ui = { path = "../ui-core", default-features = false, features = ["test-support"] }
tilo-ui-base = { path = "../ui-base", features = ["test-support"] }
# The menus and materials a document editor opens, drawn as the toolkit draws them.
tilo-rich-edit = { path = "../tilo-rich-edit", features = ["test-support"] }
# The charts and stat tiles the runner's tests mount, and the registry its component tests build.
tilo-ui-charts = { path = "../ui-charts", features = ["test-support"] }
tilo-ui-nav = { path = "../ui-nav", features = ["test-support"] }
tilo-ui-map = { path = "../ui-map", features = ["test-support"] }
# The closure-built action host the driver's job tests answer calls with.
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
# The manager's fixtures the App-driven collaboration tests drive.
collaboration = { package = "tilo-collaboration", path = "../../core/collaboration", features = ["test-support"] }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
# The settings capability the shell hands an app, served by the fake broker.
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab", features = ["settings-host"] }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-doc = { path = "../../sdk/tilo-doc", default-features = false }
# The synthesized engine a video player test plays.
media = { package = "tilo-media", path = "../../engines/tilo-media" }
tilo-theme-sdk = { path = "../theme-sdk" }
tilo-theme-painter-wasm = { path = "../theme-painter-wasm" }
# The compiler that produces the artifact a device's daemon makes for a theme's changed module,
# so the compiled painter path is measured beside the interpreter's.
tilo-wasm-aot = { path = "../../platform/tilo-wasm-aot", features = ["compile"] }
# Hand-written painter modules for the wasm host's refusal and budget tests.
wat = "1"
# Tests whose interface is the process environment set it through `ScopedEnv`.
tilo-test-env = { path = "../../../tools/test-env" }
# The broker's admission ack the manager tests wait on wakes through it.
tokio = { workspace = true, features = ["sync", "test-util"] }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
# The loopback page address the browser text input probe is handed.
url.workspace = true
# The draw-tag counts a card's paint asserts on.
vello_encoding.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[[example]]
name = "browser-text-input-qualification"
path = "examples/browser_text_input_qualification.rs"
required-features = ["host"]

[[example]]
name = "page-menus"
path = "examples/page_menus.rs"
required-features = ["native"]

[[example]]
name = "action-presence"
path = "examples/action_presence.rs"
required-features = ["native"]

[[example]]
name = "startup-frame-probe"
path = "examples/startup_frame_probe.rs"
required-features = ["native"]
