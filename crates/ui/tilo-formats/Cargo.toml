[package]
name = "tilo-formats"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Dates, times and clocks as the person set them: the format styles and their rendering, without the toolkit."

[lib]
name = "tilo_formats"
path = "src/lib.rs"

[features]
# The styles as resource fields (`locale` in the settings): the `Model` derive that names them
# in a resource's schema. A crate that only formats dates and money leaves it off and carries
# no resource model.
model = ["dep:tilo-resource"]

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
# The styles are resource fields (`locale` in the settings, feature `model`), so they keep the
# model derive when it is on.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
