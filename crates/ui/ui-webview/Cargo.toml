[package]
name = "tilo-ui-webview"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "Painting a web engine's pages for the Tilo UI toolkit: the frames a page streams, drawn into a view, and the engine a window shows them with."

[features]
# Brave/EasyList filter-list → WebKit content-blocker JSON compiler
# (`tilo_webview::adblock`). Off by default: only the browser app (and any
# other app embedding a WebView with built-in blocking) pays for the
# adblock-rust dependency.
webview-adblock = ["tilo-webview/webview-adblock"]
# The compiler is not linked: `tilo_webview::adblock` opens it from
# libtilo_adblock_engine.so the first time an app compiles lists. The engine
# library's own build (crates/engines/loadable/adblock) turns this on, so the
# shared runtime every app maps leaves adblock-rust out; any other build links
# the compiler.
lazy-adblock = ["webview-adblock", "tilo-webview/lazy-adblock"]
# The engine client reaches the session's daemons (its runtime portal).
local-daemons = ["tilo-webview/local-daemons"]

[dependencies]
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false }
tilo-ui-base = { version = "0.1.0", path = "../ui-base", default-features = false }
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview" }
tilo-page-engine = { version = "0.1.0", path = "../../engines/page-engine" }
tilo-paint-stream = { version = "0.1.0", path = "../../engines/paint-stream" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
base64.workspace = true
blake3.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true

[dev-dependencies]
tilo-ui = { version = "0.1.0", path = "../ui-core", default-features = false, features = ["test-support"] }
# Its own tests drive a page without Chromium.
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
image = { workspace = true, features = ["png"] }
serial_test.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
