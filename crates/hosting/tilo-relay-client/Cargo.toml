[package]
name = "tilo-relay-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Client side of the Tilo host + relay: the length-prefixed frame codec both ends of the relay stream use."
license = "MIT OR Apache-2.0"

# The relay session and co-edit clients live in `tilo-relay`, next to the
# delivery, join and transport records they speak. The daemon and its clients
# share this frame codec, so the wire logic exists once.
[dependencies]
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
postcard = { workspace = true, features = ["use-std"] }
wire-frame = { path = "../../system/wire-frame", features = ["postcard", "tokio"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
