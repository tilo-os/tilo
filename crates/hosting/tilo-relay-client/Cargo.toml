[package]
name = "tilo-relay-client"
version = "0.1.0"
edition = "2024"
publish = true
description = "Client side of the Tilo host + relay every peer shares: the frame codec both ends of a relay stream use, the co-edit payloads, device certification and the device-signer seam."
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true

# The relay session and co-edit clients live in `tilo-relay-session`, next to
# the delivery, join and transport records they speak. This crate holds what a
# browser peer needs as well: the frame codec, the co-edit payloads, the
# signer seam and (with `iroh`) the certification dialer.
[dependencies]
tilo-relay-protocol = { version = "0.1.0", path = "../tilo-relay-protocol" }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity" }
iroh = { workspace = true, optional = true }
iroh-base.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
ed25519-dalek.workspace = true
rand.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
thiserror.workspace = true
wire-frame = { version = "0.1.0", path = "../../system/wire-frame", features = ["postcard", "tokio"] }
# A wall clock that does not panic in a browser.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The HTTPS link's send and poll pumps, on tokio natively and on the page's
# event loop in a browser.
n0-future = "0.3"
hex.workspace = true

[features]
default = ["iroh"]
# The iroh dialers: certification and remote environments over their ALPNs.
iroh = ["dep:iroh"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
