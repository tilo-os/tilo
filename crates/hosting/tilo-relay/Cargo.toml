[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-relay"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Tilo host + relay daemon: authenticated iroh transport for workspace CRDT ops, pins WorkspaceDirectory, store-and-forwards for offline peers."
license = "MIT OR Apache-2.0"

[lib]
name = "tilo_relay"
path = "src/lib.rs"

[features]
# Test-only hooks and helpers: the checkpoint-prefix fault marker, the store's
# test barriers, and the replay and staging entry points the host's tests
# drive the store through.
test-support = ["tilo-room-host/test-support"]
# Agents on the host: `dev --agents` / `run --agents` run an agent supervisor
# (tilo-agent-participant, which links every web app) as the app-serving
# plane. Needs the browser listener for steering from pages.
agents = ["web", "tilo-room-host/agents", "dep:tilo-agent-participant", "dep:tilo-session-host", "dep:tilo-secrets", "dep:tilo-moderation", "dep:tilo-resource", "dep:tilo-workspace-emoji", "dep:ui", "dep:chat", "dep:discord", "dep:tilo-connector", "dep:tilo-automation", "dep:tilo-bot-directory", "dep:app-cli", "dep:ush", "dep:legacy-vm"]
web = ["tilo-room-host/web", "dep:tilo-live", "dep:tilo-net", "dep:agent-provider-config", "dep:base64", "dep:hyper", "dep:hyper-util", "dep:http-body", "dep:http-body-util", "dep:tokio-rustls", "dep:rustls", "dep:rcgen", "dep:sha2", "dep:bytes"]

[[bin]]
name = "tilo-relay"
path = "src/main.rs"

[[bin]]
name = "tilo-relay-admin"
path = "src/admin.rs"

[[bin]]
name = "tilo-enroll"
path = "src/enroll.rs"

[[bin]]
name = "tilo-home-peer-control"
path = "src/home_peer_control/main.rs"

# The host / relay daemon.
#
# `tilo-relay` is the WAN transport + host tier of the sync/host model:
# an authenticated iroh endpoint that any of the user's devices dial
# to publish workspace-CRDT deltas + presence, receives, persists,
# and fans out to every other connected peer bound to the same
# workspace. If a target peer is offline the update is buffered on
# disk under `pending/<peer_id>/` and delivered on next connect.
#
# Design axioms:
# - Same identity model as devices — the relay holds a device
#   keypair + a signed cert (capability `can_act_as_host`) issued by
#   the user's root. Every inbound peer must present a valid cert
#   chaining to the same user identity.
# - Mostly a store-and-forward peer, not a passive one. Device deltas are
#   received, retained and forwarded, but the host also originates, under
#   its own device key:
#   - governance commits for the rooms it governs (`rooms*`);
#   - its retained `IdentityHello` certificate frame (`compaction`);
#   - folded snapshots of unsealed document channels (`compaction`).
#   It reads the desktop's peer-sync messages inside co-edit bodies to
#   decide retention, replay and compaction: document frames, checkpoint
#   kinds and audiences through the injected `payloads::ShellPayloads`
#   (`tilo_room_host::payloads`); it refuses document
#   changes an app's surface does not allow (`surfaces`). Sealed document
#   content stays opaque.
# - Multi-host by construction — several relays bound to the same
#   workspace merge like any other automerge peers.
# - Fully in-process testable — `Relay::start` binds a random-port
#   iroh endpoint so the integration tests spin up two relays + N
#   peers without any external service.
[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-paths.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-automerge-isolate.workspace = true
# Remote-action vocabulary: the relay routes these frames between devices and,
# only when an app-serving plane is supplied, answers them through ActionHost.
tilo-actions = { path = "../../collab/actions" }
# Handshake and wire messages plus the mesh, configuration, registry and
# metrics records shared with the relay's clients; re-exported so the daemon's
# own module paths stay unchanged.
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
# Both ends of every relay stream use its frame codec.
tilo-relay-client = { path = "../tilo-relay-client" }
# The session clients (relay, co-edit, anti-entropy, room administration and
# workspace join): the daemon dials other relays with them and re-exports them
# under its historic paths. Clients depend on that crate, not on this one.
tilo-relay-session = { path = "../tilo-relay-session" }
# Delivery, private-action, agent-read, v2 live and join records the relay carries.
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
# Iroh 1.0.x — pinned to the same versions the `fs/` crate uses so
# they share a single build of the transport across the workspace.
# iroh gives us stable node ids + NAT hole punching + n0-hosted relay
# fallback out of the box, so the relay is reachable from any device
# without extra infrastructure. `crates/system/fs/` already depends on iroh-blobs, so
# unifying on iroh here means one transport stack across CRDT-op fanout
# and content hydration.
iroh.workspace = true
iroh-base.workspace = true
# The packet relay this host runs for the pages it serves.
iroh-relay = { version = "1.0.3", features = ["server"] }

# Identity + workspace directory + cert-chain verification.
tilo-user-identity = { path = "../../collab/tilo-user-identity" }

# Workspace CRDT (same version as identity + shell).
automerge.workspace = true
tilo-automerge.workspace = true

# Wire encoding — postcard for the framed messages exchanged over
# the ALPN. Same encoding the identity crate uses so byte layouts
# stay compatible.
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
# Install bodies carry certificates' canonical encoding as base64.
base64 = { workspace = true, optional = true }

# Signing / hashing — reused for the connection-level nonce challenge.
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
# Enrollment envelopes are sealed through the one reviewed sealing crate.
tilo-seal = { path = "../../system/tilo-seal" }
# Content addresses the room keeps bytes under.
tilo-content = { path = "../../system/content", default-features = false }
zeroize.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true

# Runtime + config.
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
thiserror.workspace = true

# Observability.
tracing.workspace = true

# Systemd sd_notify for `Type=notify` — best-effort, silently no-ops
# outside a systemd session.
sd-notify.workspace = true

# The browser listener (feature `web`): HTTPS for the durable plane, device
# certification and the pages' calls.
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# The pages' live plane: the WebTransport listener beside the HTTPS one, and
# the relay that copies its sealed bytes (admission preface, moq-lite, and the
# same relay the native carrier reaches over iroh).
tilo-live = { path = "../../collab/tilo-live", features = ["relay", "iroh"], optional = true }
# SHA-256 of the live listener's certificate, which a page pins.
sha2 = { workspace = true, optional = true }
# Who-is-here lines may be summarised by a model provider the operator
# configures, in the dialects shared with the model gateway.
tilo-net = { path = "../../platform/tilo-net", features = ["http", "proxy-host"], optional = true }
agent-provider-config = { path = "../../agent/provider-config", optional = true }
tilo-agent-participant = { path = "../../agent/agent-participant", optional = true }
# The workspaces' shells a host serving their records runs: ush's own
# commands here, Linux programs in the workspace's hosted VM.
ush = { path = "../../runtime/ush", optional = true }
legacy-vm = { path = "../../runtime/legacy-vm", optional = true }
# Who may close, move or rename what is on a room's shared desktop, and the
# strips a persistent room's shared desktop starts with.
tilo-desktop-model = { path = "../../session/desktop-model" }
# A persistent public room keeps its owner and spectator roots in the host's
# secret store.
tilo-secrets = { path = "../../platform/tilo-secrets", optional = true }
# The persistent room's moderation agent and its model provider.
tilo-moderation = { path = "../../collab/moderation", features = ["host"], optional = true }
# A persistent public room's chat opens with the operator's channels.
chat = { path = "../../../apps/chat", optional = true, default-features = false }
discord = { path = "../../../apps/discord", optional = true }
tilo-connector = { path = "../../agent/connector", optional = true }
tilo-automation = { path = "../../collab/automation", optional = true }
tilo-bot-directory = { path = "../../packaging/bot-directory", optional = true }
app-cli = { path = "../../packaging/app-cli", optional = true }
tilo-resource = { path = "../../sdk/tilo-resource", optional = true }
# The workspace's emoji, which a bot's program may be told of.
tilo-workspace-emoji = { path = "../../platform/tilo-workspace-emoji", optional = true }
# The room's default record id, the one members' first windows open.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", optional = true }
# Read existing signed document envelopes through the shared, read-only cipher.
tilo-session-host = { path = "../../session/host", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The host keeps its workspaces' content in directories, one per workspace.
tilo-content = { path = "../../system/content", features = ["dir"] }
bounded-command = { path = "../../system/bounded-command" }
launcher = { path = "../../packaging/launcher" }
# Installed packages and their integrity records.
package-store = { path = "../../packaging/package-store" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
# App surfaces, fetched by hash from the registry's reviewed payload blobs.
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
libc.workspace = true
sd-notify.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# The daemon's bounded runtime.
tilo-rt.workspace = true
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
# `watch`: the daemon follows membership files `tilo-relay-admin` edits.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# Home-peer configuration is one signed filesystem bundle; the relay imports
# its workspace tickets rather than asking the operator to duplicate ids.
tilo-fs = { path = "../../system/fs" }
# A workspace's files as the record that carries them: the relay reads a
# governed workspace's tree to learn which content its files are made of.
fs-protocol = { path = "../../system/fs-protocol" }
# The scope of a room's document media, which an offloaded action's inputs
# and outputs are.
runtime-fs = { path = "../../runtime/runtime-fs" }
# The workspace-join exchange every governor answers, over this relay's rooms.
collab-types = { path = "../../collab/collab-types" }
# A node takes part in the encrypted channels of the rooms it governs, through
# the one channel service every device runs.
channel-crypto = { path = "../../collab/channel-crypto" }
neighbour-wire = { path = "../../collab/neighbour-wire" }
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
# The room host every device runs, which the relay embeds. Every relay build
# follows the sealed records of the workspaces it governs and opens them with
# the channels' keys it holds there, whether or not it serves pages.
tilo-room-host = { path = "../tilo-room-host", features = ["web"] }
# Retained-store primitives the workspace store keeps its retained data with.
# Owners pre-admit people by the SHA-256 of a token someone else hands them.
sha2.workspace = true
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
runtime-identity = { path = "../../runtime/runtime-identity" }
# Nearby pairing redeems enrollment tokens through the identity host's one
# redemption: its issuer checks, nonce store and device fleet.
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
socket2 = "0.6"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The TLS tests write a PEM pair and read it back.
rcgen.workspace = true
# The room host's fixtures: a certified test host and the devices around it.
tilo-room-host = { path = "../tilo-room-host", features = ["test-support"] }
tilo-desktop-model = { path = "../../session/desktop-model" }
tokio = { workspace = true, features = ["test-util"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
# The offloadable action the offload journey runs: a batch of thumbnails.
tilo-thumbnail = { path = "../../media/thumbnail" }
# The app that publishes it, whose handler is its local run, and the content
# store that handler keeps its outputs in.
photos = { path = "../../../apps/photos" }
tilo-content = { path = "../../system/content" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tilo-runtime = { path = "../../runtime/tilo-runtime" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# The persistent room test's page fetches over the room's plain listener.
hyper = { version = "1", features = ["client", "http1"] }
# The fetch proxy test's target.
test-http = { path = "../../dev/test-http" }

[[test]]
name = "it"
path = "tests/it.rs"

# Its own binary: it installs a counting global allocator.
[[test]]
name = "held_memory"
path = "tests/held_memory.rs"

# Examples that carry unit tests build as test targets too, so `cargo test`
# and the CI test jobs run those tests.
# What an active collaborator costs a relay in CPU, memory and egress:
# the scheduled lane's `hosting` group (tools/ci/perf-scheduled.sh).
# An example, not a binary, so relay images that build `--bins` leave it out.
[[example]]
name = "relay_load"
test = true

# A one-off: moves a host's content into one store per workspace at the
# upgrade that gave each workspace its own.
[[example]]
name = "move_relay_content"
required-features = ["web"]
test = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
