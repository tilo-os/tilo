[package]
name = "tilo-front-door"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The MCP front door of hosted Tilo: OAuth 2.1 for agents, sign-in with a device of the person, scope consent, revocable grants and API keys, and the agent surface served for each session over the grant's own session with the relay."
license = "MIT OR Apache-2.0"

[dependencies]
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ed25519-dalek.workspace = true
iroh-base.workspace = true
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
tilo-session-host = { path = "../../session/host" }
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
# HTTPS to the relay and the site, as every client of the relay makes its requests.
tilo-relay-client = { path = "../tilo-relay-client" }
tilo-relay-session = { path = "../tilo-relay-session" }
tilo-runtime = { path = "../../runtime/tilo-runtime" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
