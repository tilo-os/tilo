[package]
name = "tilo-relay-store"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Retained-store primitives a Tilo workspace host keeps a workspace's on-disk store with: bounded spill sorting, counted durable barriers and retained frame decoding."
license = "MIT OR Apache-2.0"

[features]
# One-shot barriers and fault injection scoped to a temporary store, and the
# per-thread barrier counters tests assert on. Off in every shipped build.
test-support = ["dep:tokio"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Retained frames are relay envelopes carrying co-edit payloads.
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
tilo-relay-client = { path = "../tilo-relay-client" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { path = "../../platform/tilo-files" }
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
blake3.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# The test barriers report through a oneshot channel.
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
