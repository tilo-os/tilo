[package]
name = "tilo-delivery-protocol"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Wire contract of Tilo's browser-facing delivery: the signed transport descriptor and its session authentication, the bootstrap exchange, the private action vocabulary, the v2 live envelope and the workspace join contract."
license = "MIT OR Apache-2.0"

# Browsers, the action broker and both hosts speak these records without
# linking the relay daemon. Keep this crate wasm-clean: no filesystem, process,
# endpoint or runtime dependencies. The Iroh join transport is in
# `tilo-relay-session` (client) and `tilo-relay` (host).
[package.metadata.cargo-machete]
# getrandom 0.3 is a feature-only edge that selects JS entropy for transitive
# WASM cryptography.
ignored = ["getrandom03"]

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-actions = { path = "../../collab/actions" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-relay-client = { path = "../tilo-relay-client" }
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
iroh-base = { workspace = true, features = ["key"] }
serde.workspace = true
serde_bytes.workspace = true
# Private and catalogue leaves are checked by exact re-encoding, which needs
# insertion-ordered JSON maps on every target, wasm32 included.
serde_json = { workspace = true, features = ["preserve_order"] }
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
getrandom.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
thiserror.workspace = true
web-time = { version = "1", features = ["serde"] }
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
tilo-automerge-isolate.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
