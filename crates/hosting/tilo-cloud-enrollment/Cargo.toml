[package]
name = "tilo-cloud-enrollment"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Hosted-enrollment protocol a browser owner speaks to a Tilo Cloud Store: serialized custody, enrollment and first membership exchange"

# The browser runtime drives it in wasm32 and the Cloud host tests it against
# the actual Store. Keep it wasm-clean: no filesystem, process or runtime
# dependencies.
[dependencies]
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-room = { path = "../../collab/tilo-room" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
