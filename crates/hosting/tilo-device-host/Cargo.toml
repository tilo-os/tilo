[package]
name = "tilo-device-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[features]
test-support = ["tilo-workspace-host/test-support"]
media = ["tilo-workspace-host/media"]
[dependencies]
tilo-workspace-host = { path = "../tilo-workspace-host" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
web-time = { version = "1", features = ["serde"] }
tilo-automerge-isolate.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
workspace-hack = { version = "0.1" }
[dev-dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
rcgen.workspace = true
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-browser-runtime = { path = "../../browser/tilo-browser-runtime" }
tilo-desktop-model = { path = "../../session/desktop-model" }
# Proposed documents are real notebooks, as the owner checks them.
notes = { path = "../../../apps/notes" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
collab-types = { path = "../../collab/collab-types" }
# Seals an edit the way an endpoint holding channel keys would.
channel-crypto = { path = "../../collab/channel-crypto" }
tilo-actions = { path = "../../collab/actions" }
tilo-automerge.workspace = true
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-relay = { path = "../tilo-relay" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-test-env = { path = "../../dev/test-env" }
ed25519-dalek.workspace = true
iroh.workspace = true
iroh-base.workspace = true
libc.workspace = true
postcard = { workspace = true, features = ["use-std"] }
rustls.workspace = true
tilo-moq = { path = "../tilo-moq", features = ["relay"] }
url.workspace = true
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }

# Examples that carry unit tests build as test targets too, so `cargo test`
# and the CI test jobs run those tests.
[[example]]
name = "inspect-effect-receipt"
test = true
