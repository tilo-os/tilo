<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#16181c">
<title>Tilo · Reading group</title>
<!-- A guest's join link: the browser runtime bundle, a fresh device of the
     room certified with the link's ticket, then the room's Writer document
     full screen. No account; the device key stays in
     this browser, and this browser renders everything. -->
<style>html,body{margin:0;height:100%;background:#16181c;overflow:hidden;overscroll-behavior:none}#surface{position:fixed;inset:0}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:16px system-ui;color:#c9ccd3;text-align:center;padding:0 24px}</style>
<div id="surface"></div><div id="status">Joining the reading group…</div>
<script type="module">
import {joinRoom, parseJoinLink, useRegistry, WRITER} from './rooms.mjs';
const status = document.querySelector('#status');
const link = parseJoinLink();
try {
  await useRegistry();
  const peer = await joinRoom({...link, label: 'Phone',
    onStatus: snapshot => { if (snapshot.phase === 'failed') status.textContent = `Couldn’t join: ${snapshot.error}`; }});
  await peer.whenReady();
  if (link.record) await peer.whenRecord(WRITER, link.record);
  const mount = await peer.mountDesktop(document.querySelector('#surface'),
    link.record ? {app: WRITER, record: link.record, author: 'Guest'} : {app: WRITER, author: 'Guest'});
  status.hidden = true;
  globalThis.tiloRoom = {peer, mount};
} catch (error) {
  status.textContent = `Couldn’t join: ${error?.message ?? error}`;
  console.error(error);
}
</script>
