[package]
name = "tilo-cloud-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
chrono.workspace = true
launcher = { path = "../../packaging/launcher" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
runtime-identity = { path = "../../runtime/runtime-identity" }
runtime-collab = { path = "../../runtime/runtime-collab" }
tilo-model-gateway = { path = "../../agent/model-gateway" }
tilo-agent-control-protocol = { path = "../../agent/control-protocol" }
tilo-agent-control-service = { path = "../../agent/control-service" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = {workspace=true, features=["use-std"]}
ed25519-dalek.workspace = true
rand.workspace = true
blake3.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json"] }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
tilo-advisory-lock = { path = "../../system/advisory-lock" }
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
url.workspace = true
zeroize.workspace = true
libc.workspace = true
uuid.workspace = true
automerge.workspace = true
tilo-automerge-isolate.workspace = true
tokio = {workspace=true,features=["macros","rt-multi-thread","signal","time"]}
tracing.workspace = true
tracing-subscriber = {workspace=true, features=["env-filter"]}
iroh.workspace = true
iroh-base.workspace = true
web-time = "1"
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-peer-state = {path="../../collab/tilo-peer-state"}
tilo-workspace-host = { path = "../tilo-workspace-host", features = ["media"] }
tilo-moq = {path="../tilo-moq", features=["relay"]}
tilo-action-broker = {path="../../collab/tilo-action-broker"}
tilo-desktop-model = { path = "../../session/desktop-model" }
collab-types = {path="../../collab/collab-types"}
tilo-actions = { path = "../../collab/actions" }
tilo-relay = { path = "../tilo-relay" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-atomic-file = {path="../../system/atomic-file"}
private-fs = { path = "../../system/private-fs" }
tilo-secret-vault = { path = "../../system/secret-vault" }
tilo-seal = { path = "../../system/tilo-seal" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
word-processor = {path="../../../apps/word-processor"}
chat = {path="../../../apps/chat",default-features=false}
qdoc = {path="../../doc/qdoc"}
workspace-hack = { version = "0.1" }
[dev-dependencies]
# The browser owner's side of hosted enrollment, driven against the Store.
tilo-cloud-enrollment = { path = "../tilo-cloud-enrollment" }
# Seals an edit the way an endpoint holding channel keys would.
channel-crypto = { path = "../../collab/channel-crypto" }
tilo-automerge.workspace = true
tilo-action-broker = {path="../../collab/tilo-action-broker", features=["test-support"]}
tilo-atomic-file = {path="../../system/atomic-file", features=["test-support"]}
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
moq-net.workspace = true
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }
rustls.workspace = true
