[package]
name = "tilo-relay-session"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Client side of a Tilo relay session: the authenticated relay client, the co-edit session, anti-entropy, room administration and workspace join clients, without the relay daemon."
license = "MIT OR Apache-2.0"

# Everything a device needs to talk to a relay, and nothing the relay needs to
# be one. The daemon (`tilo-relay`) depends on this crate and re-exports it
# under its historic paths; clients (the shell, the action broker, the
# runtime and joined rooms) depend on this crate alone, so a daemon edit does
# not rebuild them. Keep it free of the daemon's native stack: no launcher,
# package store, environments, filesystem or tokio "full".
#
# getrandom (0.4 and 0.3) are feature-only edges that select JS entropy for
# transitive WASM cryptography.
[package.metadata.cargo-machete]
ignored = ["getrandom", "getrandom03"]

[dependencies]
# Handshake, wire messages and live frames shared with the daemon.
tilo-relay-protocol = { path = "../tilo-relay-protocol" }
# Frame codec, co-edit payloads and the device-signer seam.
tilo-relay-client = { path = "../tilo-relay-client" }
# Delivery v2/v3, private actions and the workspace join contract.
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# Shared typed private task mailbox and report payloads.
tilo-actions = { path = "../../collab/actions" }
# The join contract and governed member rows the room and join clients carry.
tilo-workspace-join = { path = "../../collab/workspace-join" }
# Co-edit bodies are neighbour messages; presence slots classify them.
neighbour-wire = { path = "../../collab/neighbour-wire" }
tilo-clock = { path = "../../platform/tilo-clock" }
iroh.workspace = true
iroh-base.workspace = true
n0-future = "0.3.2"
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "io-util", "rt", "time", "test-util"] }
# Builds the toolkit presence bodies the pointer pacing tests classify.
collab-types = { path = "../../collab/collab-types" }
tilo-automerge-isolate.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
