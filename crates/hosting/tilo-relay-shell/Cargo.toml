[package]
name = "tilo-relay-shell"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The desktop's peer-sync vocabulary as a Tilo workspace host reads it: the payload seam the relay core asks about opaque co-edit bodies, its NeighbourMsg adapter, and the browser legacy-window bridge."
license = "MIT OR Apache-2.0"

# The relay core (`tilo-relay`) never names `NeighbourMsg`: it asks
# `ShellPayloads` about a co-edit body, and the adapter its embedder injects
# answers. `NeighbourPayloads` is the desktop's adapter; `Relay::start` wires
# it. Everything here that decodes or originates a desktop message keeps the
# bytes and derivations the host used before it moved, so retained data is
# judged exactly as it was.

[features]
# The legacy-window bridge re-publishes desktop windows on the browser live
# plane, so it links the moq relay stack only for hosts that serve browsers.
web = ["dep:tilo-moq", "dep:tilo-relay-protocol", "dep:tilo-relay-session", "dep:bytes", "dep:hex", "dep:tracing"]

[dependencies]
# Signed document envelopes the seam hands the core.
collab-types = { path = "../../collab/collab-types" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# The desktop's peer-sync messages and the one host-retention classifier.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
postcard = { workspace = true, features = ["use-std"] }
blake3.workspace = true
tilo-moq = { path = "../tilo-moq", features = ["relay"], optional = true }
tilo-relay-protocol = { path = "../tilo-relay-protocol", optional = true }
# Presence bodies carry their author (`AttributedPresence`).
tilo-relay-session = { path = "../tilo-relay-session", optional = true }
bytes = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
moq-net.workspace = true
# Bounded waits for the live relay in the bridge tests.
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
