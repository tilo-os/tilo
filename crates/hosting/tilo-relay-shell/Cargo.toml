[package]
name = "tilo-relay-shell"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The desktop's peer-sync vocabulary as a Tilo workspace host reads it: the payload seam the relay core asks about opaque co-edit bodies."
license = "MIT OR Apache-2.0"

# The relay core (`tilo-relay`) never names `NeighbourMsg` or the desktop's
# retention kinds: it asks `ShellPayloads` about a co-edit body, and
# `NeighbourPayloads` is the desktop's adapter. Everything here keeps the bytes
# and derivations the host used before it moved, so retained data is judged
# exactly as it was.

[dependencies]
# Signed document envelopes the seam hands the core.
collab-types = { path = "../../collab/collab-types" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# The channel handle a framed message names its author by.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# The desktop's peer-sync messages and the host-retention classifier.
neighbour-wire = { path = "../../collab/neighbour-wire" }
postcard = { workspace = true, features = ["use-std"] }
blake3.workspace = true
workspace-hack = { version = "0.1" }

[lints]
workspace = true
