[package]
name = "tilo-workspace-host"
description = "Host core shared by Tilo's device and Cloud workspace hosts."
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[features]
test-support = ["tilo-action-broker/test-support", "tilo-relay/test-support"]
media = ["dep:tilo-moq", "dep:url", "dep:quinn", "dep:web-transport-quinn"]
[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
tempfile.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek.workspace = true
blake3.workspace = true
# Precompressed immutable asset variants (already in the lockfile).
brotli = { version = "8.0.2", default-features = false, features = ["std"] }
hex.workspace = true
uuid.workspace = true
libc.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["full"] }
bytes.workspace = true
hyper = { version = "1.8.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "http1", "http2", "tokio"] }
http-body-util = "0.1.3"
rustls.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
iroh.workspace = true
iroh-base.workspace = true
iroh-relay = { version = "1.0.3", features = ["server"] }
web-time = { version = "1", features = ["serde"] }
atomic-file = { path = "../../system/atomic-file" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-automerge-isolate.workspace = true
tilo-automerge.workspace = true
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-relay = { path = "../tilo-relay" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
tilo-desktop-model = { path = "../../session/desktop-model" }
notes = { path = "../../../apps/notes" }
calculator = { path = "../../../apps/calculator" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
collab-types = { path = "../../collab/collab-types" }
channel-crypto = { path = "../../collab/channel-crypto" }
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
tilo-actions = { path = "../../collab/actions" }
runtime-collab = { path = "../../runtime/runtime-collab" }
runtime-identity = { path = "../../runtime/runtime-identity" }
tilo-moq = { path = "../tilo-moq", features = ["relay"], optional = true }
url = { workspace = true, optional = true }
quinn = { version = "0.11.9", default-features = false, features = ["platform-verifier", "runtime-tokio", "bloom", "rustls-ring"], optional = true }
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"], optional = true }
workspace-hack = { version = "0.1" }
[dev-dependencies]
moq-net.workspace = true
atomic-file = { path = "../../system/atomic-file", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
tilo-test-env = { path = "../../dev/test-env" }
hyper = { version = "1.8.1", features = ["client"] }
rcgen.workspace = true
# The native device's media control, driven against the actual grant service.
tilo-native-media-control = { path = "../../session/tilo-native-media-control" }
