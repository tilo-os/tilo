[package]
name = "qos-session-peer"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[features]
test-support = ["tilo-host/test-support"]
media = ["tilo-host/media"]
[dependencies]
tilo-host = { path = "../tilo-host" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
web-time = { version = "1", features = ["serde"] }
tilo-automerge-isolate.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
[dev-dependencies]
moq-net.workspace = true
atomic-file = { path = "../../system/atomic-file", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
hyper = { version = "1.8.1", features = ["client"] }
rcgen.workspace = true
qdoc = { path = "../../doc/qdoc" }
qos-browser-runtime = { path = "../../browser/qos-browser-runtime" }
qos-action-broker = { path = "../../collab/qos-action-broker" }
qos-desktop = { path = "../../session/qos-desktop" }
qos-peer-state = { path = "../../collab/qos-peer-state" }
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
tilo-automerge.workspace = true
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-relay = { path = "../tilo-relay" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
ed25519-dalek.workspace = true
iroh.workspace = true
iroh-base.workspace = true
libc.workspace = true
postcard = { workspace = true, features = ["use-std"] }
rustls.workspace = true
qos-moq = { path = "../qos-moq", features = ["relay"] }
url.workspace = true
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }
