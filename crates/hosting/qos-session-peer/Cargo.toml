[package]
name = "qos-session-peer"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[features]
test-support = ["qos-action-broker/test-support", "tilo-relay/test-support"]
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
libc.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
iroh.workspace = true
iroh-base.workspace = true
iroh-relay = { version = "1.0.3", features = ["server"] }
web-time = { version = "1", features = ["serde"] }
atomic-file = { path = "../../system/atomic-file" }
qos-peer-state = { path = "../../collab/qos-peer-state" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-relay = { path = "../tilo-relay" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
qos-desktop = { path = "../../session/qos-desktop" }
notes = { path = "../../../apps/notes" }
calculator = { path = "../../../apps/calculator" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
collab-types = { path = "../../collab/collab-types" }
qos-action-broker = { path = "../../collab/qos-action-broker" }
tilo-actions = { path = "../../collab/actions" }
runtime-collab = { path = "../../runtime/runtime-collab" }
runtime-identity = { path = "../../runtime/runtime-identity" }
[dev-dependencies]
qdoc = { path = "../../doc/qdoc" }
tempfile.workspace = true
qos-browser-runtime = { path = "../../browser/qos-browser-runtime" }
