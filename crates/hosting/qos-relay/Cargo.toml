[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "qos-relay"
version = "0.1.0"
edition = "2024"
description = "qOS host + relay daemon: authenticated iroh transport for workspace CRDT ops, pins WorkspaceDirectory, store-and-forwards for offline peers."
license = "MIT OR Apache-2.0"

[lib]
name = "qos_relay"
path = "src/lib.rs"

[[bin]]
name = "qos-relay"
path = "src/main.rs"

[[bin]]
name = "qos-relay-admin"
path = "src/admin.rs"

# The host / relay daemon.
#
# `qos-relay` is the WAN transport + host tier of the sync/host model:
# an authenticated iroh endpoint that any of the user's devices dial
# to publish workspace-CRDT deltas + presence, receives, persists,
# and fans out to every other connected peer bound to the same
# workspace. If a target peer is offline the update is buffered on
# disk under `pending/<peer_id>/` and delivered on next connect.
#
# Design axioms:
# - Same identity model as devices — the relay holds a device
#   keypair + a signed cert (capability `can_act_as_host`) issued by
#   the user's root. Every inbound peer must present a valid cert
#   chaining to the same user identity.
# - Passive CRDT peer — the relay never *originates* mutations, only
#   receives, stores, and forwards.
# - Multi-host by construction — several relays bound to the same
#   workspace merge like any other automerge peers.
# - Fully in-process testable — `Relay::start` binds a random-port
#   iroh endpoint so the integration tests spin up two relays + N
#   peers without any external service.
[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
# Iroh 1.0.x — pinned to the same versions the `fs/` crate uses so
# they share a single build of the transport across the workspace.
# iroh gives us stable node ids + NAT hole punching + n0-hosted relay
# fallback out of the box, so the relay is reachable from any device
# without extra infrastructure. `fs/` already depends on iroh-blobs, so
# unifying on iroh here means one transport stack across CRDT-op fanout
# and content hydration.
iroh.workspace = true
iroh-base.workspace = true

# Identity + workspace directory + cert-chain verification.
qos-user-identity = { path = "../../identity/qos-user-identity" }

# Workspace CRDT (same version as identity + shell).
automerge.workspace = true

# Wire encoding — postcard for the framed messages exchanged over
# the ALPN. Same encoding the identity crate uses so byte layouts
# stay compatible.
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
bytes.workspace = true

# Signing / hashing — reused for the connection-level nonce challenge.
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
blake3.workspace = true
hex.workspace = true
uuid.workspace = true

# Runtime + config.
tokio = { workspace = true, features = ["full"] }
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Observability.
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Systemd sd_notify for `Type=notify` — best-effort, silently no-ops
# outside a systemd session.
sd-notify.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
