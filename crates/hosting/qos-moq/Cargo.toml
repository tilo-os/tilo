[package]
name = "qos-moq"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
relay = ["dep:moq-native", "dep:moq-net", "dep:bytes", "dep:tokio", "dep:url", "dep:serde", "dep:serde_json"]

[dependencies]
thiserror.workspace = true
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
url = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
moq-native = { path = "../../../vendor/moq/rs/moq-native", default-features = false, features = ["quinn", "ring"], optional = true }
moq-net = { path = "../../../vendor/moq/rs/moq-net", optional = true }

[dev-dependencies]
serde_json.workspace = true
# Only for examples/wt_stream_signal_repro.rs (Chromium WebTransport crash reproducer).
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }
rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "moq-proof"
path = "src/bin/moq-proof.rs"
required-features = ["relay"]

[[example]]
name = "wt_stream_signal_repro"
path = "examples/wt_stream_signal_repro.rs"

[[test]]
name = "relay"
required-features = ["relay"]

[[test]]
name = "client_admission"
required-features = ["relay"]

[[test]]
name = "relay_goaway"
required-features = ["relay"]

[lints]
workspace = true
