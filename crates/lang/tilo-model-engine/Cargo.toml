[package]
name = "tilo-model-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The device's side of an app's model as a WebAssembly module: the ABI, the engine call and its answers."

[lib]
name = "tilo_model_engine"
path = "src/lib.rs"

[dependencies]
# The documents a model module reads and writes are this side's.
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The action framework executes here, natively: binding, envelopes, history
# entries, commits and replay.
tilo-actions = { path = "../../core/actions" }
# What the module reads and answers.
tilo-model-guest = { path = "../../sdk/tilo-model-guest" }
tilo-resource = { path = "../../core/tilo-resource" }
tilolang-runtime = { path = "../tilolang-runtime", default-features = false }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
