[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: their resources in the device's store, the published surface, and the UI graph translation."

[features]
# Shared agreement test harness (`instance::testing`) driving every `Platform` implementer through
# the same table of dates, times, clocks, week starts and localized date parsing.
test-support = ["tilo-clock/test-support"]

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
automerge.workspace = true
# The id a run's changes name, one for every change of the action and its calls.
uuid.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-service = { path = "../../desktop/service" }
# The person's layout as a shell reads it, which the shell's hosts write into its `Layout` root.
tilo-desktop-model = { path = "../../desktop/desktop-model" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../../ui/tilo-render-protocol" }
# A Rust app's views, drawn by the same host as a package's (one-app-model.md §2).
tilo-view = { version = "0.1.0", path = "../../sdk/tilo-view" }
tilo-doc = { path = "../../sdk/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# The one link grammar a resource's `share-link` renders, which the page reads back.
tilo-reference = { version = "0.1.0", path = "../../core/reference" }
tilolang = { path = "../tilolang" }
# The wall clock, which also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["local"] }
# Dates, times and clocks as the person set them: formatted once on `Platform` so every host
# writes a day, a moment and a clock the same way.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
# The interpreter alone in a browser page, where the compiled tier cannot run.
tilolang-runtime = { path = "../tilolang-runtime", default-features = false }
# The history verbs a store answers, and the names history speaks of its writers in.
collaboration = { version = "0.1.0", path = "../../core/collaboration" }
# The resource types and document ids the workspace's records are known by.
collab-types = { version = "0.1.0", path = "../../core/collab-types" }
# The device's one store, which every resource of an app is kept in and read from.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
wire-frame = { version = "0.1.0", path = "../../platform/wire-frame" }
# The native records an app keeps for its whole workspace, whose surfaces a package keeping
# them publishes beside its own.
tilo-workspace-emoji = { version = "0.1.0", path = "../../sdk/tilo-workspace-emoji" }
moderation-model = { version = "0.1.0", path = "../../../apps/moderation-model" }

[dev-dependencies]
# The system's mention notices, read from a workspace holding tilolang rich text.
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../core/collab-types" }
# The fake broker a workspace's committed read is served from in the tests.
collaboration = { version = "0.1.0", path = "../../core/collaboration", features = ["test-support", "broker-transport", "native"] }
# The archives an app exports, read back as a person who unzips them finds them.
bounded-zip = { path = "../../engines/bounded-zip" }
tempfile.workspace = true
uuid.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The toolkit's words, as the session's hosts read them: what the tests' published
# types are labelled in.
tilo-app-window = { version = "0.1.0", path = "../../sdk/tilo-app-window" }
# The palette, a native app whose actions it lists beside a tilolang app's, and the content
# index a paragraph of a rich text is found in.
tilo-desktop-search = { path = "../../desktop/desktop-search", features = ["indexes"] }
passwords = { path = "../../../apps/passwords" }
# The YouTube connector's service, faked at the boundary where the app hands its effects over:
# the real origin writes a test's own answers into the client's records. No network, no client.
tilolang-youtube = { path = "../../integrations/tilolang-youtube", default-features = false }
# The sample mail server Mail's seed stands on, taken in through the real mail origin.
tilolang-mail = { path = "../../integrations/tilolang-mail", default-features = false }
# The automation matching a change: what a received message's change fires.
tilo-automation = { version = "0.1.0", path = "../../core/automation" }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "rust_types"
path = "tests/rust_types.rs"


[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The compiled tier, on every device that can run it.
tilolang-runtime = { path = "../tilolang-runtime", features = ["wasmtime"] }
