[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "Tilo platform integration for tilolang apps: their resources in the device's store, the published surface, and the UI graph translation."
repository.workspace = true
homepage.workspace = true

[features]
# Shared agreement test harness (`instance::testing`) driving every `Platform` implementer through
# the same table of dates, times, clocks, week starts and localized date parsing.
test-support = ["tilo-clock/test-support"]

[dependencies]
tilo-action-types.workspace = true
tilo-member-types.workspace = true
tilo-action-services = { version = "0.1.0", path = "../../core/action-services" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# The id a run's changes name, one for every change of the action and its calls.
uuid.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# The one compiled surface form: what the host generates and every receiver reads.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
tracing.workspace = true
tilo-actions = { version = "0.1.0", path = "../../core/actions", features = ["answer-reads"] }
# History's sentences: the one reader every app's versions are said by.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
# The person's layout as a shell reads it, which the shell's hosts write into its `Layout` root.
tilo-desktop-model = { version = "0.1.0", path = "../../desktop/desktop-model" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../../ui/tilo-render-protocol" }
# A Rust app's views, drawn by the same host as a package's (one-app-model.md §2).
tilo-view = { version = "0.1.0", path = "../../sdk/tilo-view" }
tilo-doc = { version = "0.1.0", path = "../../sdk/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# The environments Terminal keeps for its workspace: their record kind, as the model declares it.
tilo-environment = { version = "0.1.0", path = "../../core/environment" }
# The one link grammar a resource's `share-link` renders, which the page reads back.
tilo-reference = { version = "0.1.0", path = "../../core/reference" }
tilolang = { version = "0.1.0", path = "../tilolang" }
# The wall clock, which also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-local-time = { version = "0.1.0", path = "../../platform/local-time" }
tilolang-engine = { version = "0.1.0", path = "../tilolang-engine" }
# Dates, times and clocks as the person set them: formatted once on `Platform` so every host
# writes a day, a moment and a clock the same way.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
# The interpreter alone in a browser page, where the compiled tier cannot run.
tilolang-runtime = { version = "0.1.0", path = "../tilolang-runtime", default-features = false }
# The wake a followed reading rings: the same handle the session's watch takes.
tilo-rt.workspace = true
# The resource types and document ids the workspace's records are known by.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types" }
# The device's one store, which every resource of an app is kept in and read from.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
wire-frame = { package = "tilo-wire-frame", version = "0.1.0", path = "../../platform/wire-frame" }
# The workspace's emoji, a native record an app keeps for its whole workspace, whose surface a
# package keeping it publishes beside its own (the moderation record's surface is the file beside
# its model, which this host reads without linking that app's crate).
tilo-workspace-emoji = { version = "0.1.0", path = "../../core/tilo-workspace-emoji" }

[dev-dependencies]
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
# The system's mention notices, read from a workspace holding tilolang rich text.
ui = { package = "tilo-ui-app", path = "../../ui/ui-app", default-features = false, features = ["model"] }
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types" }
# The archives an app exports, read back as a person who unzips them finds them.
bounded-zip = { package = "tilo-bounded-zip", path = "../../engines/bounded-zip" }
tempfile.workspace = true
# The region and formats section's own defaults, which a page's seed of them is held to.
tilo-locale = { version = "0.1.0", path = "../../platform/tilo-locale" }
uuid.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The toolkit's words, as the session's hosts read them: what the tests' published
# types are labelled in.
tilo-app-window = { version = "0.1.0", path = "../../sdk/tilo-app-window" }
# The palette, a native app whose actions it lists beside a tilolang app's, and the content
# index a paragraph of a rich text is found in.
tilo-desktop-search = { path = "../../desktop/desktop-search", features = ["indexes"] }
# The device's search index the palette reads, as the daemon keeps it.
tilo-workspace-search = { path = "../../core/workspace-search" }
# The YouTube connector's service, faked at the boundary where the app hands its effects over:
# the real origin writes a test's own answers into the client's records. No network, no client.
tilolang-youtube = { path = "../../integrations/tilolang-youtube", default-features = false }
# The sample mail server Mail's seed stands on, taken in through the real mail origin.
tilolang-mail = { path = "../../integrations/tilolang-mail", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "rust_types"
path = "tests/rust_types.rs"


[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# An origin's connection to its connector (`origin::remote`): Unix sockets, and pipes on Windows.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
# The compiled tier, on every device that can run it.
tilolang-runtime = { version = "0.1.0", path = "../tilolang-runtime", features = ["wasmtime"] }
