[package]
name = "tilo-app-builder"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "Tilo apps written in Rust: scaffold, check, build for each platform, package and publish them; the `tilolang` command runs it"
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fluent.workspace = true
fluent-syntax.workspace = true
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
image = { workspace = true, features = ["png"] }
tilo-app-id.workspace = true
tilo-app-package = { version = "0.1.0", path = "../../core/tilo-app-package" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# Inside a Tilo session, `dev` hands the app the session's services (the
# shell's file chooser, the model gateway) named for it as the launcher does,
# and the clipboard, the session's or this computer's own.
runtime-portal = { version = "0.1.0", package = "tilo-runtime-portal", path = "../../core/runtime-portal" }
tilo-clipboard = { version = "0.1.0", path = "../../platform/tilo-clipboard", features = ["os"] }
# What the sandboxed loader finds of a native app's libraries.
tilo-sandbox-core = { version = "0.1.0", path = "../../platform/sandbox-core" }
# The Android APK packs the app's tilolang packages, compiled and bundled as a tilolang host
# reads them.
tilolang-tilo = { version = "0.1.0", path = "../tilolang-tilo" }
runtime-bundle = { version = "0.1.0", package = "tilo-runtime-bundle", path = "../../core/runtime-bundle" }
blake3.workspace = true
tilo-caps = { version = "0.1.0", path = "../../sdk/tilo-caps" }
# History's message convention, which `check` lists missing messages by.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
# The form a surface is kept by, whose hash `install-app` names.
# Compiles the `surface.toml` an author writes into the one form the system ships and addresses.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
sha2.workspace = true
registry-types = { version = "0.1.0", package = "tilo-registry-types", path = "../../core/registry-types" }
app-registry = { version = "0.1.0", package = "tilo-app-registry", path = "../../core/app-registry" }
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["watch"] }
bounded-command = { version = "0.1.0", package = "tilo-bounded-command", path = "../../platform/bounded-command" }
# The capability evidence table deserializes into typed entries.
serde.workspace = true
serde_json.workspace = true
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
tempfile.workspace = true
toml.workspace = true
tilo-ui-graph = { version = "0.1.0", path = "../../ui/ui-graph" }
tilo-headless-schema = { version = "0.1.0", path = "../../platform/headless-schema" }
# `tilolang push` names each of its actions' invocations.
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
serde_yaml = "0.9"
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# A framework app's surface, reported in process as its binary's `--surface`.
messages = { path = "../../../apps/messages" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

