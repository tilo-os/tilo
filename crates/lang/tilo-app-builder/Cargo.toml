[package]
name = "tilo-app-builder"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo apps written in Rust: scaffold, check, build for each platform, package and publish them; the `tilolang` command runs it"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fluent.workspace = true
fluent-syntax.workspace = true
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
image = { workspace = true, features = ["png"] }
tilo-app-id.workspace = true
tilo-app-package = { path = "../../core/tilo-app-package" }
tilo-resource = { path = "../../core/tilo-resource" }
# Inside a Tilo session, `dev` hands the app the shell's file chooser the
# way the launcher does.
launcher = { path = "../../core/launcher" }
# The Android APK packs the app's tilolang packages, compiled and bundled as a tilolang host
# reads them.
tilolang-tilo = { path = "../tilolang-tilo" }
runtime-bundle = { path = "../../core/runtime-bundle" }
blake3.workspace = true
tilo-caps = { path = "../../sdk/tilo-caps" }
# History's message convention, which `check` lists missing messages by.
tilo-history = { path = "../../sdk/tilo-history" }
tilo-actions = { path = "../../core/actions" }
# The form a surface is kept by, whose hash `install-app` names.
collab-types = { path = "../../core/collab-types" }
sha2.workspace = true
registry-types = { path = "../../core/registry-types" }
app-registry = { path = "../../core/app-registry" }
tilo-paths = { path = "../../platform/tilo-paths" }
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
bounded-command = { path = "../../platform/bounded-command" }
# The capability evidence table deserializes into typed entries.
serde.workspace = true
serde_json.workspace = true
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
tempfile.workspace = true
toml.workspace = true
tilo-ui-graph = { path = "../../ui/ui-graph" }
tilo-headless-schema = { path = "../../ui/headless-schema" }
# `tilolang push`: the workspace's governance actions reached through its
# action API, as a key of the developer's, as `tilo` reaches it.
tilo-api = { path = "../../core/tilo-api" }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
serde_yaml = "0.9"
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# A framework app's surface, reported in process as its binary's `--surface`.
messages = { path = "../../../apps/messages" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

