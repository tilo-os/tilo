[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilolang-cli"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "The tilolang command: create, check, run, build, package and publish Tilo apps, written in tilolang or in Rust."
repository.workspace = true
homepage.workspace = true

# What authors type: `tilolang new`, `tilolang dev`, `tilolang package`.
[[bin]]
name = "tilolang"
path = "src/main.rs"

[lib]
name = "tilolang_cli"
path = "src/lib.rs"

# The command's integration tests: one binary, its files included as modules by `tests/it.rs` (a
# file per binary linked the command, the toolkit and the app window once each).
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# What the profile's session left for processes outside it, which this process reads
# where no host installed its settings.
settings-store = { package = "tilo-settings-store", version = "0.1.0", path = "../../desktop/settings" }
# The commands of an app written in Rust, and the ones every app shares (`src/cli.rs`).
tilo-app-builder = { version = "0.1.0", path = "../tilo-app-builder" }
anyhow.workspace = true
clap.workspace = true
# `check` reads the PNGs a responsive acceptance run left.
image = { workspace = true, features = ["png"] }
libc.workspace = true
# `publish` and `apply`: the registry the packages go to.
app-registry = { version = "0.1.0", package = "tilo-app-registry", path = "../../core/app-registry" }
# `ui`: the serialized screens it edits.
tilo-ui-graph = { version = "0.1.0", path = "../../ui/ui-graph" }
tilo-advisory-lock = { version = "0.1.0", path = "../../platform/advisory-lock" }
# Tilo's fonts, prepared once on a machine that has neither Tilo nor a checkout, for the apps the
# command runs and the bundles it builds.
tilo-font-catalog = { version = "0.1.0", path = "../../platform/font-catalog", features = ["prepare"] }
jiff.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
runtime-portal = { version = "0.1.0", package = "tilo-runtime-portal", path = "../../core/runtime-portal" }
runtime-interface = { package = "tilo-runtime-interface", version = "0.1.0", path = "../../core/runtime-interface" }
# `dev` outside a checkout: the tilolang runtime bundle of the Tilo installed here, where its
# launcher finds it.
runtime-bundle = { version = "0.1.0", package = "tilo-runtime-bundle", path = "../../core/runtime-bundle" }
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# The publisher key, written whole beside its place before it is linked there.
tempfile.workspace = true
tilo-app-package = { version = "0.1.0", path = "../../core/tilo-app-package" }
# The publisher key file.
registry-types = { version = "0.1.0", package = "tilo-registry-types", path = "../../core/registry-types" }
tilolang = { version = "0.1.0", path = "../tilolang" }
tilolang-tilo = { version = "0.1.0", path = "../tilolang-tilo" }
# The window with nothing on screen `layout-check` lays out, and the platform it stands on.
tilolang-window = { version = "0.1.0", path = "../tilolang-window" }
# The person the layout is checked for: their language, staged over the machine's.
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process", features = ["native"] }
# Rebuilding on every saved source.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["watch"] }
toml.workspace = true
tilo-paths.workspace = true
tilo-machine.workspace = true
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { version = "0.1.0", package = "tilo-ui-app", path = "../../ui/ui-app", default-features = false, features = ["model"] }
# The app window's half of a window and the patch protocol to it: what `layout-check` lays out.
tilo-app-window = { version = "0.1.0", path = "../../sdk/tilo-app-window" }
tilo-render-protocol = { version = "0.1.0", path = "../../ui/tilo-render-protocol" }
# `tilolang profile --times`: the named scopes the framework marks, timed per interaction.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# The window actions every app publishes, as collab-types declares them.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types" }

[dev-dependencies]
# The outside-repository journey publishes into a real registry on loopback.
registry-server = { path = "../../core/registry-server" }
tokio = { workspace = true, features = ["rt"] }
blake3.workspace = true
tilo-rich-edit = { path = "../../ui/tilo-rich-edit" }
tilo-test-env = { path = "../../../tools/test-env" }
# What an agent's action is, as the frame draws it on the control that runs it.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
launcher = { path = "../../core/launcher" }

[lints]
workspace = true

[features]
# Explicit expensive real generated-app/toolkit/package qualification.
native-sdk-qualification = []

[[test]]
name = "native-sdk"
path = "tests/native_sdk.rs"
required-features = ["native-sdk-qualification"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { version = "0.1.0", package = "tilo-ui-app", path = "../../ui/ui-app", features = ["model", "host"] }
