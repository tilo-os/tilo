[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilolang-cli"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The tilolang tool: check, format and lock packages, build each into a signed Tilo app (.tapp), and run them as apps in a nested Tilo session."

# What authors type: `tilolang build`, `tilolang run`.
[[bin]]
name = "tilolang"
path = "src/main.rs"

[lib]
name = "tilolang_cli"
path = "src/lib.rs"

# The command's integration tests: one binary, its files included as modules by `tests/it.rs` (a
# file per binary linked the command, the toolkit and the app window once each).
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
jiff.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
runtime-portal = { path = "../../runtime/runtime-portal" }
bounded-command = { path = "../../platform/bounded-command" }
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# The publisher key, written whole beside its place before it is linked there.
tempfile.workspace = true
tilo-app-package = { path = "../../packaging/tilo-app-package" }
# The publisher key file.
registry-types = { path = "../../packaging/registry-types" }
tilolang = { path = "../tilolang" }
tilolang-tilo = { path = "../tilolang-tilo" }
# The platform a window with nothing on screen stands on, which `layout-check` lays out over.
tilolang-web = { path = "../tilolang-web" }
# The person the layout is checked for: their language, staged over the machine's.
tilo-process = { path = "../../platform/tilo-process", features = ["native"] }
# Rebuilding on every saved source.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# The generations a saved build is published into for the running app (`src/dev.rs`).
tilo-app-module = { version = "0.1.0", path = "../tilo-app-module" }
toml.workspace = true
# `tilolang repl`: Tilo's API as the person, through the client `tilo` uses.
tilo-api = { path = "../../server/tilo-api" }
# This computer's login, which the REPL acts as.
tilo-device-identity = { path = "../../collab/tilo-device-identity" }
tilo-paths.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
# The app window's half of a window and the patch protocol to it: what `layout-check` lays out.
tilo-app-window = { path = "../../sdk/tilo-app-window" }
tilo-render-protocol = { path = "../../ui/tilo-render-protocol" }
# `tilolang profile --times`: the named scopes the framework marks, timed per interaction.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }

[dev-dependencies]
tilo-rich-edit = { path = "../../ui/tilo-rich-edit" }
tilo-test-env = { path = "../../../tools/test-env" }
# What an agent's action is, as the frame draws it on the control that runs it.
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
collab-types = { path = "../../collab/collab-types" }
launcher = { path = "../../packaging/launcher" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core" }
