[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilolang-cli"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The tilolang command: create, check, run, build, package and publish Tilo apps, written in tilolang or in Rust."

# What authors type: `tilolang new`, `tilolang dev`, `tilolang package`.
[[bin]]
name = "tilolang"
path = "src/main.rs"

[lib]
name = "tilolang_cli"
path = "src/lib.rs"

# The command's integration tests: one binary, its files included as modules by `tests/it.rs` (a
# file per binary linked the command, the toolkit and the app window once each).
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# The commands of an app written in Rust, and the ones every app shares (`src/cli.rs`).
tilo-app-builder = { path = "../tilo-app-builder" }
anyhow.workspace = true
clap.workspace = true
# `check` reads the PNGs a responsive acceptance run left.
image = { workspace = true, features = ["png"] }
libc.workspace = true
# `publish` and `apply`: the registry the packages go to.
app-registry = { path = "../../core/app-registry" }
# `ui`: the serialized screens it edits.
tilo-ui-graph = { path = "../../ui/ui-graph" }
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
jiff.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
runtime-portal = { path = "../../core/runtime-portal" }
bounded-command = { path = "../../platform/bounded-command" }
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# The publisher key, written whole beside its place before it is linked there.
tempfile.workspace = true
tilo-app-package = { path = "../../core/tilo-app-package" }
# The publisher key file.
registry-types = { path = "../../core/registry-types" }
tilolang = { path = "../tilolang" }
tilolang-tilo = { path = "../tilolang-tilo" }
# The sample answers of the outside services a staged scenario stands on, taken in through the
# services' origins as a seeded workspace takes them in.
tilolang-mail = { path = "../../integrations/tilolang-mail", default-features = false }
tilolang-youtube = { path = "../../integrations/tilolang-youtube", default-features = false }
# The window with nothing on screen `layout-check` lays out, and the platform it stands on.
tilolang-window = { path = "../tilolang-window" }
# The person the layout is checked for: their language, staged over the machine's.
tilo-process = { path = "../../platform/tilo-process", features = ["native"] }
# Rebuilding on every saved source.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# The generations a saved build is published into for the running app (`src/dev.rs`).
tilo-app-module = { version = "0.1.0", path = "../tilo-app-module" }
toml.workspace = true
tilo-paths.workspace = true
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
# The app window's half of a window and the patch protocol to it: what `layout-check` lays out.
tilo-app-window = { path = "../../sdk/tilo-app-window" }
tilo-render-protocol = { path = "../../ui/tilo-render-protocol" }
# `tilolang profile --times`: the named scopes the framework marks, timed per interaction.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }

[dev-dependencies]
# The outside-repository journey publishes into a real registry on loopback.
registry-server = { path = "../../core/registry-server" }
tokio = { workspace = true, features = ["rt"] }
runtime-bundle = { path = "../../core/runtime-bundle" }
blake3.workspace = true
tilo-rich-edit = { path = "../../ui/tilo-rich-edit" }
tilo-test-env = { path = "../../../tools/test-env" }
# What an agent's action is, as the frame draws it on the control that runs it.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
collab-types = { path = "../../core/collab-types" }
launcher = { path = "../../core/launcher" }

[lints]
workspace = true

[features]
# Explicit expensive real generated-app/toolkit/package qualification.
native-sdk-qualification = []

[[test]]
name = "native-sdk"
path = "tests/native_sdk.rs"
required-features = ["native-sdk-qualification"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core" }
