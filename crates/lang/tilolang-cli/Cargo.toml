[package]
name = "tilolang-cli"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The tilolang tool: check, format and lock packages, build each into a signed Tilo app (.tapp), and run them as apps in a nested Tilo session."

# What authors type: `tilolang build`, `tilolang run`.
[[bin]]
name = "tilolang"
path = "src/main.rs"

[lib]
name = "tilolang_cli"
path = "src/lib.rs"

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
runtime-portal = { path = "../../runtime/runtime-portal" }
bounded-command = { path = "../../system/bounded-command" }
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# The publisher key, written whole beside its place before it is linked there.
tempfile.workspace = true
tilo-app-package = { path = "../../packaging/tilo-app-package" }
# The publisher key file.
registry-types = { path = "../../packaging/registry-types" }
tilolang = { path = "../tilolang" }
tilolang-tilo = { path = "../../platform/tilolang-tilo" }
# Rebuilding on every saved source.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# The generations a saved build is published into for the running app (`src/dev.rs`).
tilo-app-module = { version = "0.1.0", path = "../../platform/tilo-app-module" }
toml.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# The UI host's half of a window and the patch protocol to it: what `layout-check` lays out.
tilo-ui-host = { path = "../../platform/tilo-ui-host" }
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }
collab-types = { path = "../../collab/collab-types" }
launcher = { path = "../../packaging/launcher" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
