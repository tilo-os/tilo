[package]
name = "tilolang-web"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Tilolang in a browser page: compile packages from their files, run an app over its scenario and show its window as semantic HTML, and the two-peer playground over one source."

[lib]
# `cdylib` is the page's module (wasm-bindgen); `rlib` is what its tests link.
crate-type = ["cdylib", "rlib"]

[dependencies]
tilolang = { version = "0.1.0", path = "../tilolang" }
tilolang-runtime = { version = "0.1.0", path = "../tilolang-runtime", default-features = false }
# The platform's packages and the native apps' surfaces a package compiles against, and the
# links a window's resources mint.
tilolang-tilo = { version = "0.1.0", path = "../tilolang-tilo" }
# The window `tilo-layout-check` lays out: an app's instance staged with a scenario, its
# views laid out by the toolkit.
tilolang-window = { version = "0.1.0", path = "../tilolang-window" }
# The page a laid-out window is written as, and the code editor's colours for tilolang.
ui = { version = "0.1.0", package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
# The pinned startup fonts a page hands its windows.
tilo-font-catalog = { version = "0.1.0", path = "../../platform/font-catalog" }
serde.workspace = true
serde_json.workspace = true
# A file a page opens the app with, whose bytes its JSON answer carries.
base64.workspace = true
wasm-bindgen = "=0.2.108"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
