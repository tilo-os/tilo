[package]
autotests = false
name = "tilolang-process"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang app process, the one sandbox for app code: the binary of the tilolang runtime bundle. It runs a workspace's instances of a tilolang app on their broker connections, a task's programs, an app's windows and its origin connectors."

[lib]
name = "tilolang_process"
path = "src/lib.rs"

[[bin]]
name = "tilolang-process"
path = "src/main.rs"

[features]
# What the launcher runs for an app's launch (the entrypoint of every tilolang package): the app's
# windows, drawn by the toolkit, and its origin connectors. A build without it (a task's programs
# beside `tilo`, a server) runs instances and programs alone and links no toolkit.
app-launch = [
    "dep:ui",
    "dep:tilo-app-window",
    "dep:media",
    "dep:tilo-failure",
    "dep:tilo-app-module",
    "dep:tilolang-music",
    "dep:tilolang-youtube",
    "tilolang-mail/engine",
    "dep:tilo-backups-engine",
    "dep:tilolang-calendar",
    "dep:tilo-feeds",
    "dep:video-edit",
    "dep:video-picture",
    "dep:passwords-engine",
    "dep:tilo-printing",
    "dep:tilo-tiles",
    "dep:code-engine",
    "dep:accounts",
    "dep:tilo-maps-engine",
]
# The toolkit and `libstd` linked from the Tilo runtime's one shared library, as every thin app
# links them: the runtime bundle's build, and `tilolang dev`'s, whose window maps a rebuild of this
# crate's code in place.
thin = ["app-launch", "dep:runtime-dylib"]
# The fake broker a test or example runs an instance against, in place of the
# session's: the tests of this crate and of the apps it hosts, and its examples.
test-support = []

[dependencies]
# What `web.get` and `web.post` reach through, on every device: the general network client.
tilo-network-client = { version = "0.1.0", path = "../../platform/tilo-network-client" }
tilolang-tilo = { path = "../tilolang-tilo" }
# The disk usage analyzer's device work: a folder measured, answered for `so.tilo.disk-usage`.
tilo-disk-usage = { path = "../../engines/disk-usage" }
# The App Publisher's device work: this machine's signing key and the registry, answered for
# `so.tilo.publisher`.
publisher-engine = { path = "../../engines/publisher-engine" }
# The database engine the Database Client asks by name: the drivers, kept off the app's side.
tilo-db = { version = "0.1.0", path = "../../engines/tilo-db" }
# A tilolang app as a session service: the history its records answer.
tilolang-service = { path = "../tilolang-service" }
# Each instance's connection to its workspace, opened by the session for that app's launch.
collaboration = { package = "tilo-collaboration", version = "0.1.0", path = "../../core/collaboration", features = ["native", "broker-transport"] }
# The workspace's store, which every resource of an app is kept in: its commands and answers.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
# The API the session hands instances over.
runtime-portal = { package = "tilo-runtime-portal", version = "0.1.0", path = "../../core/runtime-portal" }
# The patch connection to each instance's window, and the sealed memfd its module comes in.
tilo-render-protocol = { version = "0.1.0", path = "../../ui/tilo-render-protocol" }
# The immutable buffers a module and a task's apps arrive in: a sealed memfd, or a section on
# Windows.
tilo-shm = { version = "0.1.0", path = "../../platform/tilo-shm" }
# The host's connections: Unix sockets, and pipes on Windows.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
# The engines this process opens from its runtime bundle instead of linking: an app's typesetting
# and the rest, mapped only by the apps that ask them.
tilo-engine-loader = { version = "0.1.0", path = "../../core/engine-loader" }
# The page a shown view is written to, and the desktop page's address.
tilo-server-protocol = { path = "../../core/tilo-server-protocol" }
# The device's preview cache: what `File.thumbnail` answers.
tilo-thumbnail = { version = "0.1.0", path = "../../engines/thumbnail" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# Dates and clocks as the person set them, which the session hands over the API: the toolkit
# writes them the same way, so a sentence here and a view there read alike.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
tilo-wake.workspace = true
# The platform's phrases the standard library's frames say, without the toolkit.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
# The device's clock, which is the person's: the same clock their window's dates and days read
# by, so what an instance writes as today is the day their window shows it under.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# One rule for which language a locale names, shared with the packs.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# What the person may do in an app, as the session hands it with each instance.
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
# The workspace's document of each person's own state, which every app of the workspace opens: its
# id, its document, and the changes that arrive for it.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types" }
automerge.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
tilo-startup-metrics = { version = "0.1.0", path = "../../core/tilo-startup-metrics" }
uuid.workspace = true
# The device's network, which an app's `web.get` and `web.post` reach once per request.
tilo-tiles = { version = "0.1.0", path = "../../engines/tilo-tiles", optional = true }
# Maps' device work: the areas it keeps for offline use, answered for `so.tilo.maps`.
tilo-maps-engine = { version = "0.1.0", path = "../../engines/maps-engine", optional = true }
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", default-features = false, features = ["blocking"] }
# The mail origin, reaching the connector process the system runs for the app.
tilolang-mail = { path = "../../integrations/tilolang-mail", default-features = false }
# The code editor's language servers (`app-launch`), run as its held connections in the app's
# own connection process.
code-engine = { path = "../../engines/code-engine", optional = true }
# The account sign-ins a held connection releases a vault item through (`app-launch`).
accounts = { package = "tilo-accounts", path = "../../integrations/accounts", optional = true }
# The calendar origin (`app-launch`): the connector process the system runs for a hosted Calendar.
tilolang-calendar = { path = "../../integrations/tilolang-calendar", optional = true }
# The device's content store, which an app's files are kept in, and the person's own chooser.
tilo-content = { version = "0.1.0", path = "../../core/content" }
# The device's drawing engine: a Canvas artwork drawn, carried and brought over its file.
tilo-canvas-engine = { version = "0.1.0", path = "../../engines/canvas-engine" }
# The one PDF reader: what the device's PDF engine answers a package's `pdf.*` with.
tilo-pdf-reader = { version = "0.1.0", path = "../../engines/pdf" }
# The scanner the Print Centre's engine runs, and the text and PDF a scanned page becomes.
tilo-capture = { path = "../../engines/tilo-capture", features = ["scanner"] }
# A picture's size and kind, read without decoding it, for Photos.
tilo-image-codec = { version = "0.1.0", path = "../../engines/tilo-image-codec" }
tilo-ocr = { path = "../../engines/ocr" }
tilo-doc-pdf = { path = "../../engines/tilo-doc-pdf" }
image = { workspace = true, features = ["png"] }
# The archives a package makes of its folder's entries and unpacks again, in pure Rust.
tilo-archive = { version = "0.1.0", path = "../../engines/tilo-archive" }
tilo-content-device = { version = "0.1.0", path = "../../core/content-device" }
tilo-dialogs = { version = "0.1.0", path = "../../platform/tilo-dialogs" }
# The person's clipboard, over the connection the session opens for each instance: what an app
# copies and pastes, since its process holds no display of its own.
tilo-clipboard = { version = "0.1.0", path = "../../platform/tilo-clipboard" }
# Presence as every window decodes it: who is where in a document, and who is writing there.
ui-core = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
# An app's windows (`app-launch`): the toolkit's framework, the app window's half of each window,
# what a window keeps of the person's own data, and later builds `tilolang dev` publishes. The
# app process is not the native runner: the session runs the window's host, and this process
# reaches every host service through a connection, never a portal of its own.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", optional = true, default-features = false }
tilo-app-window = { path = "../../sdk/tilo-app-window", optional = true }
tilo-failure = { path = "../../platform/tilo-failure", optional = true }
# The device's own folders, watched the way the platform watches them: inotify, FSEvents or
# ReadDirectoryChangesW where it has one, and a poll only where it has not.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
notify.workspace = true
tilo-app-module = { version = "0.1.0", path = "../tilo-app-module", optional = true }
# YouTube as an outside origin: the connector role the process runs when the launcher starts it
# as one, and a window without a session reaching that connector. YouTube's client lives in the
# connector's engine library, so this process links none of it.
tilolang-youtube = { path = "../../integrations/tilolang-youtube", default-features = false, features = [
    "connector",
], optional = true }
# YouTube's Grayjay link: the Noise handshake and exchanges with a Grayjay device, whose key is
# the app's own secret in the platform's store.
# A music catalogue as an outside origin: the connector role the process runs when the launcher
# starts it as one, and a window without a session reaching that connector. The catalogue's
# clients live in the connector's engine library, so this process links none of them.
tilolang-music = { path = "../../integrations/tilolang-music", default-features = false, features = [
    "connector",
], optional = true }
runtime-dylib = { path = "../../sdk/runtime-dylib", optional = true }

[dev-dependencies]
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }
# The fake broker these tests and examples run instances against, as the apps'
# tests do (`src/testing.rs`).
# Keyed apart from the package's own name: a thin build's `tilolang-process/thin` names the package.
tilolang-process-tests = { package = "tilolang-process", path = ".", features = ["test-support", "app-launch"] }
tilolang-tilo = { path = "../tilolang-tilo", features = ["test-support"] }
# The person's clock held at a moment, and the zone the test's process reads: a day is only
# today's or tomorrow's against a clock and a zone a test says.
jiff.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["test-support"] }
# A named zone read from the database built into Tilo, as the runtime resolves the host's zone.
tilo-recurrence = { version = "0.1.0", path = "../../engines/tilo-recurrence" }
tilo-test-env = { path = "../../../tools/test-env" }
collaboration = { package = "tilo-collaboration", version = "0.1.0", path = "../../core/collaboration", features = ["test-support", "broker-transport", "native"] }
tilolang = { path = "../tilolang" }
# The session's persistent search index, and the source a search reads it through: a tilolang
# app's published entries are found by a word of their text through it.
tilo-desktop-search = { path = "../../desktop/desktop-search", features = ["indexes"] }
# The device's search index the palette reads, as the daemon keeps it.
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["apps"] }
# The native app's data home a test grants the host, as the session does.
tempfile.workspace = true
# The replies the test's broker awaits from the instance's action directory.
tokio = { workspace = true, features = ["sync"] }
# An app's windows as the framework runs them, in the headless frame harness. The tests host
# them the way the session does, so they take the toolkit without the native runner.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", default-features = false, features = ["test-support"] }
# The headless test host the tests open the app in, as a person's device hosts it.
tilo-app-test-host = { path = "../../sdk/tilo-app-test-host" }
# Mail's engine, and the stand-in IMAP and SMTP servers Mail's windows run against.
mail-engine = { path = "../../integrations/mail-engine", features = ["test-support"] }
tilo-account-probe = { path = "../../integrations/account-probe", features = ["test-support"] }
# The pictures a page is sent are PNGs as `data:` addresses (`tests/window/gallery_html.rs`).
base64.workspace = true
# The address a clip plays at (`tests/window/video_decode.rs`), as the declared player opens it.
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["decode"] }

# One test binary for the host, every file under tests/ a module of it, and one for an app's
# windows (`tests/window`).
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "window"
path = "tests/window/it.rs"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# The host's wake and stop, events its wait watches beside its pipes.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The window plays a playback's outputs through the one host, so the cast stacks link here.
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["cast"], optional = true }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
# The Video Editor's editing and picture engines (`app-launch`): what it asks for a probe, a
# still, a waveform, a colour and a render, through `video_engine`.
# The Backups app's engine: the snapshots this device keeps of a folder, verified and restored.
tilo-backups-engine = { version = "0.1.0", path = "../../engines/tilo-backups-engine", optional = true }
# The Feeds app's engine: its feeds read away from the frame, and OPML read and written.
tilo-feeds = { path = "../../engines/feeds", optional = true }
video-edit = { package = "tilo-video-edit", path = "../../engines/video-edit", default-features = false, optional = true }
video-picture = { package = "tilo-video-picture", path = "../../engines/video-picture", default-features = false, features = ["decode", "gst"], optional = true }
# The Print Centre's printers and print jobs, through the system's print service.
tilo-printing = { path = "../../os/printing", optional = true }
# The Passwords app's own engine: this device's secret vault, its app permissions, browser CSV
# files and encrypted backups.
passwords-engine = { path = "../../engines/passwords-engine", optional = true }
# A video a view declares plays in the app's window (`app-launch`): on Linux decoded by the system's
# GStreamer, on an Apple silicon Mac by the decoders the tilolang runtime package carries beside
# this binary (dist/macos/build-app.sh). An Intel Mac's slice and Windows build without one.
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["decode"], optional = true }
