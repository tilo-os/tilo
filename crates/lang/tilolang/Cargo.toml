[package]
name = "tilolang"
version = "0.1.0"
edition = "2024"
publish = true
# Anyone may compile tilolang into their own program, open source or not: the compiler is MIT
# with the rest of what an app is built from (LICENSING.md).
license = "MIT"
description = "Compiler for tilolang, the Tilo app language: parser, canonical printer, ids lock, type and effect checker, wasm backend and package metadata."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilolang"
path = "src/lib.rs"

# Compiles the standard library a tilolang runtime bundle carries (`lib/tilo.std.wasm`).
[[bin]]
name = "tilolang-std"
path = "src/bin/tilolang-std.rs"

[dependencies]
# The tokens, spans and reference literals its parser reads, which the toolkit's editor shares.
tilolang-lex = { version = "0.1.0", path = "../tilolang-lex" }
serde = { workspace = true }
serde_json = { workspace = true }
# A text counts, cuts and matches in graphemes: one reading for the runtime's `Text` methods,
# the index's length of a text column and search's identifier patterns.
unicode-segmentation = "1.12"
# The toolkit's component descriptions, read as the package `ui`.
tilo-ui-graph = { version = "0.1.0", path = "../../ui/ui-graph" }
wasm-encoder = "0.252"
# Reads back every module the backend emits, so a mismatch between what the checker types and what
# the import table or a function signature says fails where it is made, not on the device that loads it.
wasmparser = { version = "0.252", default-features = false, features = ["std", "validate", "features", "simd"] }
# Who an actor value names: the identity type every crate shares.
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
# The clock that also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# One rule for which language a locale names, shared with the packs.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# What a declared name is called in a sentence, which a package's catalogue is written from.
tilo-words = { version = "0.1.0", path = "../../core/tilo-words" }

# The toolkit's code editor brings the compiler into the browser bundle, and
# the workspace-hack's native feature set does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
# A target's cases are the phases of one test (`scenario!`).
tilo-test-env = { path = "../../../tools/test-env" }
# Reads the toolkit's sources for the widgets it describes, as its registry's build does.
tilo-component-scan = { version = "0.1.0", path = "../../ui/tilo-component-scan" }

[lints]
workspace = true
