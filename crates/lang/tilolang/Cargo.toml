[package]
name = "tilolang"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Compiler for tilolang, the Tilo app language: parser, canonical printer, ids lock, type and effect checker, wasm backend and package metadata."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilolang"
path = "src/lib.rs"

# The compiler's command line, under its full name and its short one. `tilolang` is the host
# app's binary: the full build tool, which adds `run`.
[[bin]]
name = "tilolangc"
path = "src/main.rs"

[[bin]]
name = "tlc"
path = "src/main.rs"

[dependencies]
# The tokens, spans and reference literals its parser reads, which the toolkit's editor shares.
tilolang-lex = { version = "0.1.0", path = "../tilolang-lex" }
serde = { workspace = true }
serde_json = { workspace = true }
# A text counts, cuts and matches in graphemes: one reading for the runtime's `Text` methods,
# the index's length of a text column and search's identifier patterns.
unicode-segmentation = "1.12"
# The toolkit's component descriptions, read as the package `ui`.
tilo-ui-graph = { version = "0.1.0", path = "../../dev/ui-graph" }
wasm-encoder = "0.252"
# The clock that also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# One rule for which language a locale names, shared with the packs.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }

# The toolkit's code editor brings the compiler into the browser bundle, and
# the workspace-hack's native feature set does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
wasmparser = { version = "0.252", default-features = false, features = ["std", "validate", "features", "simd"] }

[lints]
workspace = true
