[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilolang-runtime"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Wasm host for tilolang apps: handle table, host ABI, action transactions, run journal, view trees and an Automerge reference store."
repository.workspace = true
homepage.workspace = true

# One test binary for the crate's integration tests, whose files it includes as
# modules: a file per binary linked the whole crate once each.
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# A seeded hasher several times faster than SipHash, for the read cache and index keyed by
# resource ids.
foldhash = { version = "0.1", default-features = false, features = ["std"] }
automerge.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
tilolang = { version = "0.1.0", path = "../tilolang" }
# What an app is called: the one id type every crate naming one shares.
tilo-app-id.workspace = true
# `RichText` values and fields are tilo-doc's rich text: one rich-text model for every app.
tilo-doc = { version = "0.1.0", path = "../../sdk/tilo-doc" }
# A document as the Markdown an editor shows and writes, and the bounded reader of the archives
# a person imports.
tilo-doc-codecs = { version = "0.1.0", path = "../../engines/tilo-doc-codecs", default-features = false, features = [
    "markdown",
    "book",
    "docx",
    "odt",
    "rtf",
    "epub",
    "html",
] }
# A document written as a PDF, through the pages every PDF export draws.
tilo-doc-pdf = { version = "0.1.0", path = "../../engines/tilo-doc-pdf" }
bounded-zip = { package = "tilo-bounded-zip", version = "0.1.0", path = "../../engines/bounded-zip" }
# Spreadsheet files and their values, for the sheet bindings: an engine with no toolkit.
tilo-sheet = { version = "0.1.0", path = "../../engines/tilo-sheet" }
# Presentation files and the deck they hold, for the presentation bindings: no toolkit.
tilo-deck = { version = "0.1.0", path = "../../engines/tilo-deck" }
# The zone a wall-clock time is read in, and how a wall time that falls in a change of clocks
# resolves, so a time of day survives one on every device.
tilo-recurrence = { version = "0.1.0", path = "../../engines/tilo-recurrence" }
# Days and moments.
jiff.workspace = true
# A reference inside rich text is the catalogue's resource reference, in the one form every app writes.
tilo-reference = { version = "0.1.0", path = "../../core/reference" }
# Order keys of placed items (`place`): the fractional keys every collection orders by.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# Which document a resource id lives in: the store's rule, which names the documents a view reads.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
# Why an app declined an edit: the reason a window tells the person in their own language.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
serde.workspace = true
serde_json.workspace = true
# A draw comes from the system's CSPRNG, on the device the invocation runs on.
getrandom.workspace = true
# A reply's body that is not text is kept in the journal as base64.
base64.workspace = true
# `grep` and `read(matching:)` in agents' programs.
regex.workspace = true
thiserror.workspace = true
# The interpreter. `engine.rs` is the only module that names it.
wasmi = { version = "1.1", default-features = false, features = ["std"] }
# The clock that also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# Engine construction, the call's limits, the refuel and the one text of a failure: shared with
# every other wasm host in the tree.
tilo-wasm-host = { version = "0.1.0", path = "../../core/tilo-wasm-host", default-features = false }
# Why a module stays on wasmi or was not kept on disk.
tracing.workspace = true
# Compiled modules are written beside their place in the disk cache, then renamed into it.
tempfile.workspace = true
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# What a file is called, and the most it may hold: one reading of a file's media type and size,
# shared with the window that hands a dropped file over.
tilo-content-types = { version = "0.1.0", path = "../../core/content-types" }
# The one image codec: what a file's pixels are decoded and encoded with, on the device.
tilo-image-codec = { version = "0.1.0", path = "../../engines/tilo-image-codec" }
# The device's spelling: the dictionaries a text field checks with, so what a program asks of
# `Text.misspelled()` is what the field beside it draws.
spellcheck = { package = "tilo-spellcheck", version = "0.1.0", path = "../../ui/spellcheck" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native targets only: wasmtime maps executable memory, which no browser has.
# The compiled tier: apps start on wasmi while Cranelift compiles their modules, then run
# compiled (`engine/tiering.rs`). Winch is there to compare engines (`tilolang bench --engine`,
# docs/tilolang-engines.md).
wasmtime = { version = "50.0.0", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "winch",
] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[features]
# Every shipped build runs the tiered engine; without the feature, wasmi alone.
default = ["wasmtime"]
wasmtime = ["dep:wasmtime"]

[dev-dependencies]
# The database engine the Database Client asks by name, driven end to end by its test. No version:
# the crate is not published, and Cargo leaves a versionless dev-dependency out of the package.
tilo-db = { path = "../../engines/tilo-db" }
# A scenario's cases are the phases of one test (`scenario!`).
tilo-test-env = { path = "../../../tools/test-env" }
# The platform's packages (the device, the session) an app compiles against in its test.
tilolang-tilo = { path = "../tilolang-tilo" }
wat = "1"
# The hex editor's device work, answered by the crate a session registers.
hex-engine = { path = "../../engines/hex-engine" }
diffmerge-engine = { path = "../../engines/diffmerge-engine" }
# The chip design app's device work, answered by the crate a session registers.
tilo-chip-design-engine = { path = "../../engines/tilo-chip-design-engine" }
# YouTube's Grayjay link, and the Grayjay side of a pairing a test runs in this process.
tilolang-grayjay = { path = "../../integrations/tilolang-grayjay", features = ["testing"] }
totp-engine = { path = "../../engines/totp-engine" }
# A picture a test hands the Authenticator: a setup link drawn as a QR code, as a PNG.
qrcode = { workspace = true }
image = { workspace = true, features = ["png"] }
tilo-content = { path = "../../core/content" }
tilo-wake = { path = "../../platform/tilo-wake" }

[lints]
workspace = true
