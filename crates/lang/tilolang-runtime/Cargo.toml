[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilolang-runtime"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Wasm host for tilolang apps: handle table, host ABI, action transactions, run journal, view trees and an Automerge reference store."

# One test binary for the crate's integration tests, whose files it includes as
# modules: a file per binary linked the whole crate once each.
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# A seeded hasher several times faster than SipHash, for the read cache and index keyed by
# resource ids.
foldhash = { version = "0.1", default-features = false, features = ["std"] }
automerge.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
tilolang = { path = "../tilolang" }
# `RichText` values and fields are tilo-doc's rich text: one rich-text model for every app.
tilo-doc = { path = "../../doc/tilo-doc" }
# A document as the Markdown an editor shows and writes, and the bounded reader of the archives
# a person imports.
tilo-doc-codecs = { path = "../../doc/tilo-doc-codecs", default-features = false, features = [
    "markdown",
] }
bounded-zip = { path = "../../doc/bounded-zip" }
# The zone a wall-clock time is read in, and how a wall time that falls in a change of clocks
# resolves, so a time of day survives one on every device.
tilo-recurrence = { path = "../../sdk/tilo-recurrence" }
# Days and moments.
chrono = { workspace = true, features = ["std"] }
# The zone database, for the person's zone as a named zone.
chrono-tz = "0.10.4"
# A reference inside rich text is the catalogue's resource reference, in the one form every app writes.
tilo-reference = { path = "../../collab/reference" }
# Order keys of placed items (`place`): the fractional keys every collection orders by.
tilo-resource = { path = "../../sdk/tilo-resource" }
serde.workspace = true
serde_json.workspace = true
# A draw comes from the system's CSPRNG, on the device the invocation runs on.
getrandom.workspace = true
# A reply's body that is not text is kept in the journal as base64.
base64.workspace = true
# `grep` and `read(matching:)` in agents' programs.
regex.workspace = true
thiserror.workspace = true
# The interpreter. `engine.rs` is the only module that names it.
wasmi = { version = "1.1", default-features = false, features = ["std"] }
# The compiled tier: apps start on wasmi while Cranelift compiles their modules, then run
# compiled (`engine/tiering.rs`). Winch is there to compare engines (`tilolang bench --engine`,
# docs/tilolang-engines.md).
wasmtime = { version = "50.0.0", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "winch",
] }
# Why a module stays on wasmi or was not kept on disk.
tracing.workspace = true
# Compiled modules are written beside their place in the disk cache, then renamed into it.
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[features]
# Every shipped build runs the tiered engine; without the feature, wasmi alone.
default = ["wasmtime"]
wasmtime = ["dep:wasmtime"]

[dev-dependencies]
wat = "1"

[lints]
workspace = true
