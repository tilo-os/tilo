[package]
name = "qos-browser-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
postcard = { workspace = true, features = ["alloc", "use-std"] }
web-time = { version = "1", features = ["serde"] }
ed25519-dalek.workspace = true
qos-user-identity = { path = "../../identity/qos-user-identity" }
qos-peer-state = { path = "../../collab/qos-peer-state" }
ui = { path = "../../../ui" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
qdoc = { path = "../../doc/qdoc" }
qos-actions = { path = "../../collab/actions" }
futures = { workspace = true, features = ["std", "async-await"] }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
wgpu.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
qos-relay = { path = "../../hosting/qos-relay" }
iroh.workspace = true
iroh-base.workspace = true
uuid.workspace = true
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "console"] }
[dev-dependencies]
tempfile.workspace = true
