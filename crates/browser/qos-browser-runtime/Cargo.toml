[package]
name = "qos-browser-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
qos-agent-control-protocol = { path = "../../agent/control-protocol" }
tilo-relay = { path = "../../hosting/tilo-relay" }
uuid.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
web-time = { version = "1", features = ["serde"] }
ed25519-dalek.workspace = true
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
qos-peer-state = { path = "../../collab/qos-peer-state" }
collab-types = { path = "../../collab/collab-types" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
qos-desktop = { path = "../../session/qos-desktop" }
notes = { path = "../../../apps/notes" }
calculator = { path = "../../../apps/calculator" }
taffy.workspace = true
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
qdoc = { path = "../../doc/qdoc" }
tilo-actions = { path = "../../collab/actions" }
futures = { workspace = true, features = ["std", "async-await"] }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
wgpu.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh.workspace = true
iroh-base.workspace = true
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "console"] }
[dev-dependencies]
tempfile.workspace = true
