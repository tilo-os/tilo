<!doctype html><meta charset="utf-8"><title>Certified qOS peer proof</title>
<style>body{font:14px system-ui;background:#17191d;color:#f1f2f5;margin:24px}button{padding:10px;margin:4px}pre{white-space:pre-wrap}#desktop{width:900px;height:640px}</style>
<h1>Certified qOS peer connection</h1><button id="connect">Connect certified peer</button><button id="close">Disconnect peer</button><button id="writer">Mount shared Writer</button><button id="chat">Mount shared Chat</button><button id="reconnect">Reconnect peer</button><button id="abort">Fail next commit</button><button id="retry">Retry persistence</button><button id="inspect">Inspect rendered document and actors</button><pre id="status">Not connected</pre><div id="desktop"></div>
<script type="module">
import {connectPeer} from './peer.mjs';
let peer,mount;const status=document.querySelector('#status');
const report=value=>status.textContent=JSON.stringify(value,null,2);
document.querySelector('#connect').onclick=async()=>{try{if(peer)await peer.dispose();report({phase:'authenticating'});peer=await connectPeer({onStatus:report});report(peer.getSnapshot());}catch(error){report({phase:'failed',error:String(error)});}};
document.querySelector('#close').onclick=async()=>{try{await mount?.cleanup();mount=null;await peer?.dispose();peer=null;report({phase:'closed'});}catch(error){report({phase:'failed',error:String(error)});}};
document.querySelector('#reconnect').onclick=async()=>{try{await peer?.reconnect();}catch(error){report({...peer?.getSnapshot(),error:String(error)});}};
document.querySelector('#abort').onclick=()=>peer?.failNextWrite();
document.querySelector('#retry').onclick=async()=>{try{await peer?.retryPersistence();}catch(error){report({...peer?.getSnapshot(),error:String(error)});}};
document.querySelector('#inspect').onclick=async()=>{const durable=await peer?.durableState();report({...peer?.getSnapshot(),rendered:mount?.state(),durable:durable?.map(row=>({key:row.key,actor:row.actor?Array.from(row.actor):null,revision:row.revision,byteLength:row.bytes.length}))});};
for(const app of ['writer','chat'])document.querySelector(`#${app}`).onclick=async()=>{try{if(!peer)throw Error('Connect first');await mount?.cleanup();mount=await peer.mountDesktop(document.querySelector('#desktop'),{app,instance:app==='writer'?1:2,onStatus:value=>{document.querySelector('#desktop').dataset.phase=value.phase;}});}catch(error){report({...peer?.getSnapshot(),mountError:String(error)});}};
</script>
