<!doctype html><meta charset="utf-8"><title>qOS shared browser renderer proof</title>
<style>body{margin:0;background:#171b21;color:#eee;font:14px system-ui}header{padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:7px 12px}#hosts{display:flex;gap:10px;padding:10px}.host{height:640px;width:900px;min-width:0;border:1px solid #576577;resize:both;overflow:hidden}pre{padding:12px;max-height:250px;overflow:auto;white-space:pre-wrap}#status{padding:10px}h1{font-size:18px;margin:0}input{width:120px}</style>
<header><h1>qOS shared renderer · local rendering proof</h1><select id="app"><option value="writer">Writer</option><option value="chat">Chat</option></select><button id="mount">Mount</button><button id="close">Unmount</button><button id="peer">Add second mount</button><button id="remount">Remount and stale cleanup</button><button id="fail-write">Abort next persistence transaction</button><button id="flush">Retry persistence</button><button id="retry-close">Retry retained close</button><button id="recovery-status">Inspect retained close</button><button id="lose">Destroy GPU device</button><button id="recover">Recover GPU</button><button id="durable">Inspect durable bytes</button><button id="pixels">Probe rendered pixels</button><button id="shutdown">Terminal shutdown</button><button id="restart">Recreate host</button></header>
<div id="status" role="status">Loading actual qOS WASM…</div><div id="hosts"><div id="primary" class="host"></div></div><pre id="diagnostics"></pre><pre id="document"></pre>
<script type="module">
import {mountDesktop,shutdown,retryPendingRecovery,pendingRecoveryCount,pendingComponentCloseCount} from './host.mjs';
let mounted,second,old,state={};const failures=[];
const status=document.querySelector('#status'),diag=document.querySelector('#diagnostics'),doc=document.querySelector('#document');
function report(update){if(update.persistence==='failed'||update.phase==='failed')failures.push({at:new Date().toISOString(),...update});state={...state,...update};status.textContent=update.phase==='failed'?`FAILED: ${update.error}`:`${state.phase??'loading'} · frames ${state.frames??0} · persistence ${state.persistence??'pending'}`;diag.textContent=JSON.stringify({...state,failureHistory:failures,semantics:state.semantics?`${document.querySelectorAll('[data-qos-semantic]').length} DOM nodes`:null,document:undefined},null,2);if(state.document)doc.textContent=JSON.stringify(state.document,null,2);}
async function mount(){report({phase:'initializing'});mounted=await mountDesktop(document.querySelector('#primary'),{app:document.querySelector('#app').value,instance:document.querySelector('#app').value==='writer'?1:2,onStatus:report});}
const action=(id,fn)=>document.querySelector(id).onclick=()=>Promise.resolve().then(fn).catch(error=>report({phase:'failed',error:String(error)}));
action('#mount',mount);action('#close',async()=>{await mounted?.cleanup();mounted=null;});
action('#peer',async()=>{const target=document.createElement('div');target.className='host';target.id='secondary';document.querySelector('#hosts').append(target);second=await mountDesktop(target,{app:document.querySelector('#app').value,instance:3,onStatus:update=>{target.dataset.status=update.phase??target.dataset.status;}});report({secondMount:second.state()?.phase});});
action('#remount',async()=>{old=mounted;await mount();await old?.cleanup();report({staleCleanup:'ignored',newMountAlive:document.querySelectorAll('#primary canvas').length===1});});
action('#retry-close',async()=>{await retryPendingRecovery();report({retainedCloses:pendingRecoveryCount(),componentCloses:pendingComponentCloseCount()});});action('#recovery-status',()=>report({retainedCloses:pendingRecoveryCount(),componentCloses:pendingComponentCloseCount()}));
action('#fail-write',()=>{mounted.failNextWrite();report({nextPersistence:'will abort'});});action('#flush',()=>mounted.flush());action('#lose',()=>mounted.destroyDevice());action('#recover',()=>mounted.recover());action('#durable',async()=>report({durable:await mounted.durableState()}));action('#pixels',async()=>report({texturePixels:await mounted.probePixels()}));action('#shutdown',async()=>{await shutdown();report({phase:'shutdown complete'});});action('#restart',mount);
await mount().catch(error=>report({phase:'failed',error:String(error)}));
</script>
