[package]
name = "tilo-browser-runtime"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The Tilo UI runtime in the browser: real application components rendered with Vello on a WebGPU canvas."
repository.workspace = true
homepage.workspace = true

# Build the page bundle with `scripts/build.sh`; see WEB_RUNTIME.md.

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is browser-only. Native workspace builds compile an empty library.
[target.'cfg(target_arch = "wasm32")'.dependencies]
accounts = { version = "0.1.0", path = "../../system/accounts", features = ["person"] }
# The page is the host: neither the native desktop runner nor the collab
# broker transport is linked.
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tilo-automerge.workspace = true
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
# The person's settings sections, which this page keeps as their session does.
settings-sections = { version = "0.1.0", path = "../../system/settings-sections" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# The model service clients, and the page's own model service with the
# gateway's provider dialects.
tilo-model-gateway = { default-features = false, version = "0.1.0", path = "../../agent/model-gateway" }
# The provider administration interface the page's deferred client implements.
agent-provider-config = { version = "0.1.0", path = "../../agent/provider-config" }
zeroize.workspace = true
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-app = { version = "0.1.0", path = "../../sdk/tilo-app", default-features = false }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# The person's record on their host: the devices Settings lists.
tilo-relay-session = { version = "0.1.0", path = "../../hosting/tilo-relay-session" }
# The content windows' records reference (pictures, attachments), kept in
# the profile's app files — which outlive the page, so an upload a draft names
# is still here when the draft is sent — and asked of the workspace when
# missing.
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false, features = ["dir"] }
# The one link grammar, exported to the page as parseLink/formatLink.
tilo-reference = { version = "0.1.0", path = "../../collab/reference" }
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# The desk's own document, run by the same rules the native session runs.
tilo-session-core = { version = "0.1.0", path = "../../session/core" }
# The session's sync, which keeps who is here on every host: the page says its
# own word through it and reads the members back from its board.
tilo-session = { version = "0.1.0", path = "../../session/session" }
tilo-desktop-surface = { version = "0.1.0", path = "../../session/desktop-surface" }
tilo-desktop-search = { version = "0.1.0", path = "../../session/desktop-search" }
# The native shell's chrome widgets: top bar, backdrop, launchpad.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
tilo-desktop = { version = "0.1.0", path = "../../session/desktop" }
# The report transport the page's feedback delivery files through.
tilo-feedback-transport = { version = "0.1.0", path = "../../collab/feedback-transport" }
# The workspace directory's sheet, and the reads and joins behind it: the
# session's own, over the page's `fetch`.
tilo-sheets = { version = "0.1.0", path = "../../session/sheets" }
tilo-workspace-directory = { version = "0.1.0", path = "../../session/workspace-directory" }
# The invitation behind a short link, opened from what a site's shelf keeps.
tilo-workspace-join = { version = "0.1.0", path = "../../collab/workspace-join" }
serde.workspace = true
serde_json.workspace = true
# Warnings and errors reach the console (src/console_log.rs).
tracing.workspace = true
vello.workspace = true
# The DOM presentation: the scene as HTML elements instead of a canvas.
tilo-cpu-raster = { version = "0.1.0", path = "../../sdk/tilo-cpu-raster" }
wgpu.workspace = true
winit.workspace = true
web-time = "1"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = [
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "console",
] }
# The certified peer over WebTransport, its live plane and the participant's client.
tilo-session-client = { version = "0.1.0", path = "../../session/client", features = ["toolkit"] }
# The identity layer's device side: certification, pairing, the sign-in proof.
tilo-relay-client = { version = "0.1.0", path = "../../hosting/tilo-relay-client", features = ["dial"] }
tilo-peer-state = { version = "0.1.0", path = "../../collab/tilo-peer-state" }
# The channel engine's vault namespace: the page keeps its channel vault key
# in the same secret store the session's own vault uses.
tilo-channels = { version = "0.1.0", path = "../../collab/channels" }
# The picture sources and layers a call of the page encodes and shows.
tilo-live = { version = "0.1.0", path = "../../collab/tilo-live", features = ["plane"] }
# Which records a join does not replay, so a mount asks for them.
neighbour-wire = { version = "0.1.0", path = "../../collab/neighbour-wire" }
# The browser's decoder for another device's window pictures (src/window_pictures.rs).
tilo-media = { version = "0.1.0", path = "../../platform/tilo-media" }
tilo-relay-protocol = { version = "0.1.0", path = "../../hosting/tilo-relay-protocol" }
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity" }
ed25519-dalek.workspace = true
hex.workspace = true
# Request ids for the invitations the page asks its host to make.
getrandom = { workspace = true, features = ["wasm_js"] }
uuid.workspace = true
url.workspace = true
postcard = { workspace = true, features = ["use-std"] }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[features]
default = []
# The bundling crate supplies the Activity pane's code through
# `defer_activity_pane`, which the browser desktop fetches as its own module
# the first time someone opens Activity. Without it the pane is linked in.
deferred-activity = []
# The bundling crate supplies the model service's clients (`MODEL_CLIENTS`),
# which the browser desktop fetches as their own module
# the first time a window asks a model or opens provider settings. Without it
# they are linked in.
deferred-model-clients = []
# The bundling crate registers the Feedback composer as an application
# fetched the first time it opens, and hands its code over through
# `install_feedback_composer`. Without it the composer is linked in.
deferred-feedback-composer = []
# Feedback's custody and delivery (`FEEDBACK`) are fetched once the page is
# configured with a destination: the bundling crate splits them out and hands
# them over. Without it they are linked in.
deferred-feedback = []
# The bundling crate supplies the code that shows a mount as HTML
# (`DOM_CODE`), which the browser desktop fetches as its own module the
# first time a page asks for `dom: true`, with the toolkit's code that only a
# page shows (`ui::composition::HTML_CODE`). Without it the code is linked in.
deferred-dom-presenter = ["ui/lazy-html-faces"]
# The bundling crate supplies the directory and invite sheets' and the
# shortcut guide's code (`SHEETS`), which the browser desktop fetches as its
# own module the first time the person opens one. Without it they are linked
# in.
deferred-sheets = []
# The bundling crate supplies what a person's agents on a host ask them
# (`QUESTIONS`): the approver session and the question sheet it fills, which
# the browser desktop fetches as its own module the first time a page holding
# someone's root is asked to answer. Without it they are linked in.
deferred-questions = []
# The bundling crate supplies the keeper of the person's settings sections
# (`SETTINGS_KEEPER`), which the browser desktop fetches as its own module as
# the page starts. Without it the keeper and the sections' models are linked
# in.
deferred-settings-keeper = []
# The bundling crate supplies the renderer's maker (`RENDERER_CODE`): vello's
# shaders and the code compiling them, which the browser desktop fetches as
# its own module while the first frames rasterize on the CPU. Without it they
# are linked in.
deferred-renderer = []

[dependencies]
# The host's endpoint address, as the page receives and dials it.
iroh-base = { workspace = true }
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# What the page hands every window it mounts, prepared on the host for its
# tests (src/person_records.rs, src/content_open.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tracing.workspace = true
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# What the page tells a person about a chord it cannot serve (src/fixed_chords.rs).
tilo-desktop-surface = { version = "0.1.0", path = "../../session/desktop-surface" }
# The desk's arranging actions in the page (src/arranging.rs).
tilo-session-core = { version = "0.1.0", path = "../../session/core" }
tilo-desktop-search = { version = "0.1.0", path = "../../session/desktop-search" }
serde.workspace = true
serde_json.workspace = true
# Another device's window pictures, as its track brings them (src/window_pictures.rs).
tilo-live = { version = "0.1.0", path = "../../collab/tilo-live" }
# The input a person gives another device's window, as the wire encodes it.
neighbour-wire = { version = "0.1.0", path = "../../collab/neighbour-wire" }
postcard = { workspace = true, features = ["use-std"] }
# The device list's keys as text, as the page's own module writes them.
hex.workspace = true

# The person's settings the page keeps, and Settings' window changing them
# (src/kept_settings.rs).
tilo-app = { version = "0.1.0", path = "../../sdk/tilo-app", features = ["test-support"] }
settings-sections = { version = "0.1.0", path = "../../system/settings-sections" }
# Which appearance mode follows the system (src/page_theme.rs).
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
settings = { path = "../../../apps/settings", default-features = false }
tilo-test-env = { path = "../../dev/test-env" }
