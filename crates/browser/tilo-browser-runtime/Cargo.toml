[package]
name = "tilo-browser-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]

# The default build is the web toolkit core: toolkit, host and catalog, no
# applications and no Cloud peer stack. Apps arrive as side modules built by
# `scripts/build-web-runtime.sh` (see WEB_RUNTIME.md).
[features]
default = []
# Compile the catalog's apps into the module, as the Cloud frontend's build does.
static-apps = ["dep:notes", "dep:calculator", "dep:ebook", "dep:word-processor", "dep:chat"]
# The certified peer, its iroh transport, delivery, onboarding and MoQ media:
# what the Cloud frontend's canonical desktop needs, not a standalone app.
cloud = ["dep:iroh", "dep:iroh-base"]
# Link as the dynamic-linking main module that app side modules load against:
# every symbol, the function table and the stack pointer exported, the table
# growable, and the side-module registration entry points.
dylink = []

[dependencies]
hex.workspace = true
tilo-agent-control-protocol = { path = "../../agent/control-protocol" }
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
uuid.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
web-time = { version = "1", features = ["serde"] }
ed25519-dalek.workspace = true
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# The hosted-enrollment protocol the Cloud owner facade drives.
tilo-cloud-enrollment = { path = "../../hosting/tilo-cloud-enrollment" }
collab-types = { path = "../../collab/collab-types" }
tilo-desktop = { path = "../../session/desktop" }
tilo-desktop-model = { path = "../../session/desktop-model" }
notes = { path = "../../../apps/notes", optional = true }
calculator = { path = "../../../apps/calculator", optional = true }
ebook = { path = "../../../apps/ebook", optional = true }
taffy.workspace = true
word-processor = { path = "../../../apps/word-processor", optional = true }
chat = { path = "../../../apps/chat", default-features = false, optional = true }
qdoc = { path = "../../doc/qdoc" }
# Content hashes for the page-delivered assets it admits.
tilo-content = { path = "../../system/content", default-features = false }
tilo-actions = { path = "../../collab/actions" }
futures = { workspace = true, features = ["std", "async-await"] }
automerge.workspace = true
tilo-automerge-isolate.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
wgpu.workspace = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# Natively the catalogue always holds its apps: the relay and the workspace
# and device hosts admit desktops that open them, and the fixture
# (`fixture_seed`, `fixture_writer_insert`) seeds Writer and Chat documents.
# Only the wasm32 web core leaves them to side modules.
notes = { path = "../../../apps/notes" }
calculator = { path = "../../../apps/calculator" }
ebook = { path = "../../../apps/ebook" }
word-processor = { path = "../../../apps/word-processor" }
chat = { path = "../../../apps/chat", default-features = false }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# In the browser the toolkit is the portable build: the page is the host, so
# neither the native desktop runner nor the collab broker transport is linked.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
# The app-facing SDK facade, with the features apps enable on wasm32, so its
# framework, resource layer and statics exist once, in the core.
tilo-app = { path = "../../sdk/tilo-app", default-features = false }
iroh = { workspace = true, optional = true }
iroh-base = { workspace = true, optional = true }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "console"] }
[dev-dependencies]
tempfile.workspace = true
tilo-automerge.workspace = true

[package.metadata.cargo-machete]
# The wasm32 build pulls iroh for its browser transport features; machete
# cannot see target-specific feature-only dependencies. tilo-app is linked
# into the web core for side modules and is not referenced by name.
ignored = ["iroh", "tilo-app"]
