<!doctype html>
<meta charset="utf-8">
<title>Tilo web app (development)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:13px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{padding:6px 12px;opacity:.8;white-space:pre-wrap}
  #surface{min-height:0}
</style>
<header id="status">loading the core…</header>
<div id="surface"></div>
<script type="module">
// The page `tilo-app dev --platform web` and `tilo-app build --platform web`
// serve: the web core, the app from ./apps/, and nothing else. It mounts the
// app on the record it had before, so a rebuild reloads the page into the same
// document with the new code: the document lives in the page's storage, not in
// the module. Under `tilo-app dev` it follows the server's build generation,
// which changes only once a build is complete; from any other server it
// follows the module's digest in app.json.
import {mountDesktop, setAppResolver} from './host.mjs';
import {createDirectoryResolver} from './app-directory.mjs';
const status = document.getElementById('status');
const say = text => {status.textContent = text;};
setAppResolver(createDirectoryResolver({baseURL: new URL('./', location.href)}).resolveApp);
const index = await (await fetch('./apps/index.json', {cache: 'no-store'})).json();
const [app] = Object.keys(index.apps);
const moduleDigest = async () => (await (await fetch(`./${index.apps[app]}`, {cache: 'no-store'})).json()).module.sha256;
const loaded = await moduleDigest();
const key = `tilo-dev:${app}`;
const saved = JSON.parse(localStorage.getItem(key) ?? '{}');
const reloads = saved.digest && saved.digest !== loaded ? (saved.reloads ?? 0) + 1 : saved.reloads ?? 0;
window.tiloDev = {app, digest: loaded, reloads, record: saved.record};
const started = performance.now();
const requested = Number(sessionStorage.getItem(`${key}:reload-requested`));
sessionStorage.removeItem(`${key}:reload-requested`);
try {
  const mount = await mountDesktop(document.getElementById('surface'), {
    app,
    ...(saved.record ? {record: saved.record} : {newDocument: true}),
    onStatus: state => {if (state.phase === 'failed') say(`${app}: ${state.error}`);},
  });
  window.mount = mount;
  window.tiloDev.record = mount.record;
  localStorage.setItem(key, JSON.stringify({record: mount.record, digest: loaded, reloads}));
  window.tiloDev.mountMs = Math.round(performance.now() - started);
  // From the reload's request to this mount, across the navigation.
  if (requested) window.tiloDev.reloadMs = Date.now() - requested;
  say(`${app} (module ${loaded.slice(0, 12)}) presented in ${window.tiloDev.mountMs} ms` +
    (reloads ? `; reloaded ${reloads}×, same record` : '') +
    (requested ? `; ${window.tiloDev.reloadMs} ms from reload` : ''));
} catch (error) {
  say(`${app}: ${error.message ?? error}`);
}
const reload = () => {
  sessionStorage.setItem(`${key}:reload-requested`, String(Date.now()));
  location.reload();
};
const generation = async () => {
  const response = await fetch('./__tilo-dev/build', {cache: 'no-store'});
  return response.ok ? (await response.json()).generation : undefined;
};
const served = await generation().catch(() => undefined);
setInterval(async () => {
  try {
    if (served !== undefined ? await generation() !== served : await moduleDigest() !== loaded) reload();
  } catch {
    // A server restarting or a manifest mid-rebuild; the next poll sees it.
  }
}, served !== undefined ? 250 : 1000);
</script>
