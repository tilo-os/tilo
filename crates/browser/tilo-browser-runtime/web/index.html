<script>
(()=>{
// The entry pages' first script, inlined verbatim into each so it runs
// before any module loads: a link's secrets (invite, ticket, token, pair,
// install, link) leave the address bar here, so copying the URL, a crash report
// or a later share-link never sees them. They stay in page memory for admission to
// read once. This only splits off the six known keys; the Rust parser
// reads everything else. Secrets that are not the trailing parameters in
// grammar order are still removed, and flagged, so admission refuses the
// link instead of acting on one Tilo did not write.
var hash=location.hash,mark=hash.indexOf('?'),found={},order=['invite','ticket','token','pair','install','link'],last=-1,bad=false;
if(mark>=0){
 var keep=[],parts=hash.slice(mark+1).split('&');
 for(var i=0;i<parts.length;i++){
  var part=parts[i],eq=part.indexOf('='),name=eq<0?part:part.slice(0,eq),slot=order.indexOf(name);
  if(slot<0){if(last>=0)bad=true;keep.push(part);continue;}
  if(slot<=last)bad=true;
  last=slot;found[name]=part.slice(eq+1);
 }
 if(last>=0){
  history.replaceState(history.state,'',location.pathname+location.search+hash.slice(0,mark)+(keep.length?'?'+keep.join('&'):''));
 }
}
if(bad)found.malformed=true;
Object.defineProperty(globalThis,'__tiloLinkSecrets',{value:Object.freeze(found),configurable:true});
})();
</script>
<script>
(()=>{
// The entry pages' way out while their modules load, inlined verbatim into
// each after the link scrubber: before the arrival screen (arrival.mjs)
// runs, nothing else on the page can say that loading stopped. A module
// that fails to load (a dropped connection, a deploy replacing the files)
// stops the page: it says so, and Try again reloads it. One still not
// running after a while offers Try again while it keeps loading.
var root=document.documentElement,wait=20000;
addEventListener('error',function(event){
 var target=event.target;
 if(!target||target.tagName!=='SCRIPT'||root.dataset.arrivalProgress!==undefined)return;
 root.dataset.arrival='stopped';root.dataset.entry='failed';
 var status=document.getElementById('status');
 if(status)status.textContent='Tilo could not load. Check your connection, then try again.';
},true);
setTimeout(function(){if(root.dataset.arrivalProgress===undefined)root.setAttribute('data-arrival-stalled','');},wait);
addEventListener('click',function(event){if(event.target&&event.target.id==='arrival-retry')location.reload();});
})();
</script>
<script>
// The page's first graphics adapter request starts the browser's GPU

// load, and the renderer check (webgpu-safety.mjs) takes the answer.
// ?unsafeWebKitGPU=0 asks for nothing: the check may refuse WebGPU then.
if(navigator.gpu&&!/[?&]unsafeWebKitGPU=0(&|$)/.test(location.search))globalThis.__tiloAdapter=navigator.gpu.requestAdapter().catch(function(){return null;});
</script>
