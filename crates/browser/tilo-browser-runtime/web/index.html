<!doctype html>
<html lang="en" data-arrival="load">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>Tilo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M10.98 31.85 Q10.979892448752274 27.96648782251284 14.4 26.12 L20.26 22.97 Q24.843373493975903 20.50602409638554 24.84 25.71 L24.84 74.29 Q24.843373493975903 79.49397590361446 20.26 77.03 L14.4 73.88 Q10.979892448752274 72.03351217748715 10.98 68.15 Z' fill='%239fa6e0'/%3E%3Cpath d='M89.02 31.85 Q89.02010755124772 27.96648782251284 85.6 26.12 L79.74 22.97 Q75.1566265060241 20.50602409638554 75.16 25.71 L75.16 74.29 Q75.1566265060241 79.49397590361446 79.74 77.03 L85.6 73.88 Q89.02010755124772 72.03351217748715 89.02 68.15 Z' fill='%239fa6e0'/%3E%3Crect x='29' y='16' width='42' height='68' rx='6' fill='%232a3fd1'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(()=>{
// The entry pages' first script, inlined verbatim into each so it runs
// before any module loads: a link's secrets (invite, ticket, token, pair,
// install) leave the address bar here, so copying the URL, a crash report
// or a later share-link never sees them. They stay in page memory for admission to
// read once. This only splits off the five known keys; the Rust parser
// reads everything else. Secrets that are not the trailing parameters in
// grammar order are still removed, and flagged, so admission refuses the
// link instead of acting on one Tilo did not write.
var hash=location.hash,mark=hash.indexOf('?'),found={},order=['invite','ticket','token','pair','install'],last=-1,bad=false;
if(mark>=0){
 var keep=[],parts=hash.slice(mark+1).split('&');
 for(var i=0;i<parts.length;i++){
  var part=parts[i],eq=part.indexOf('='),name=eq<0?part:part.slice(0,eq),slot=order.indexOf(name);
  if(slot<0){if(last>=0)bad=true;keep.push(part);continue;}
  if(slot<=last)bad=true;
  last=slot;found[name]=part.slice(eq+1);
 }
 if(last>=0){
  history.replaceState(history.state,'',location.pathname+location.search+hash.slice(0,mark)+(keep.length?'?'+keep.join('&'):''));
 }
}
if(bad)found.malformed=true;
Object.defineProperty(globalThis,'__tiloLinkSecrets',{value:Object.freeze(found),configurable:true});
})();
</script>
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; background: #121214; color: #ddd; font: 14px system-ui, sans-serif; }
    #surface { height: 100%; }
    /* Until the desktop is up, #status is placed by the arrival rules below;
       after, it speaks to screen readers only, and the desktop is the whole
       page. */
    #bar { display: contents; }
    [data-arrival=done] #bar { display: block; position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .tilo-entry-card { position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: min(360px, calc(100vw - 32px)); display: grid; gap: 20px; padding: 24px; border-radius: 14px; background: #1c1d21; border: 1px solid #2c2e34; box-shadow: 0 12px 40px rgb(0 0 0 / 45%); }
    .tilo-entry-card p { margin: 0; line-height: 1.5; color: #e6e6e9; }
    .tilo-entry-card button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #34363d; background: transparent; color: #d4d4d8; cursor: pointer; }
    .tilo-entry-card button:hover { background: #26282e; }
    .tilo-entry-card button.tilo-entry-primary { border-color: transparent; background: #f2f2f4; color: #121214; font-weight: 500; }
    .tilo-entry-card button.tilo-entry-primary:hover { background: #ffffff; }
    .tilo-entry-actions { display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 8px; }
    .tilo-entry-options { display: grid; gap: 6px; }
    .tilo-entry-options button { text-align: left; }
    /* While the page asks something, the arrival screen behind it waits too:
       no breathing mark, line, bar or note that the network is slow. */
    body:has(.tilo-entry-card) :is(#arrival > *, #arrival-note, #arrival-bar, #status) { visibility: hidden; }
    .tilo-entry-card label { display: grid; gap: 6px; }
    .tilo-entry-card input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #3a3d44; background: #14161a; color: inherit; }
    .tilo-entry-card .tilo-entry-error { margin: 0; color: #ff8a80; }
    /* Arrival: until the desktop draws its first frame, the page is the
       desktop's own ground with Tilo's mark (the brand's dark variant, as
       the desktop's top bar draws it, `paint_tilo_mark`), breathing slowly. Below, from the
       first second on, one rotating line (a joke or a tip) over a thin bar,
       the one sign of progress, moved by the real steps of getting in
       (arrival.mjs). The step notes in #status stay for screen readers
       only; anything else said there (a pairing code, a failure) takes the
       line's place, as does a note when the network is slow. A failure
       leaves only its words and a way to try again. Then the screen fades
       and the desktop is under it. Steps come from entry-page.mjs
       (`data-arrival`). */
    #arrival { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; background: #121214; transition: opacity 360ms ease-out, visibility 0s linear 360ms; }
    #arrival > svg { display: block; margin-bottom: 16px; animation: tilo-breathe 5s ease-in-out infinite; }
    @keyframes tilo-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    [data-arrival=stopped] #arrival > svg { visibility: hidden; }
    [data-arrival=done] #arrival { opacity: 0; visibility: hidden; }
    #arrival > p, #arrival-note, html:not([data-arrival=done]) #status { position: fixed; z-index: 2; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); width: min(36em, calc(100% - 48px)); margin: 0; text-align: center; line-height: 1.5; color: #c4c4cc; }
    #arrival > p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 240ms ease-out; }
    #arrival > p.shown { opacity: 1; }
    #arrival > p .label { color: #9b9ba3; margin-right: .5em; }
    #arrival-bar { position: fixed; left: 50%; top: calc(50% + 58px); width: 96px; margin-left: -48px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    #arrival-bar > span { display: block; height: 100%; background: #6c6c76; transform-origin: left; transform: scaleX(var(--progress, 0)); transition: transform 200ms linear; }
    #arrival-retry { display: none; position: fixed; z-index: 2; left: 50%; top: calc(50% + 80px); transform: translateX(-50%); font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: #4a7dff; color: white; cursor: pointer; }
    #arrival-retry:focus-visible { outline: 2px solid #9ab4ff; outline-offset: 2px; }
    [data-arrival=stopped]:not([data-entry=refused]):not([data-entry=unsupported]) #arrival-retry { display: block; }
    html:not([data-arrival=done]):not([data-arrival=stopped]):not([data-arrival-status]) #status { width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .tilo-entry-card { z-index: 3; }
    @media (prefers-reduced-motion: reduce) {
      #arrival { transition: none; }
      #arrival > svg { animation: none; }
      #arrival > p, #arrival-bar > span { transition: none; }
    }
  </style>
</head>
<body>
  <div id="surface"></div>
  <div id="arrival" aria-hidden="true"><svg viewBox="0 0 100 100" width="44" height="44"><path d="M10.98 31.85 Q10.979892448752274 27.96648782251284 14.4 26.12 L20.26 22.97 Q24.843373493975903 20.50602409638554 24.84 25.71 L24.84 74.29 Q24.843373493975903 79.49397590361446 20.26 77.03 L14.4 73.88 Q10.979892448752274 72.03351217748715 10.98 68.15 Z" fill="#3b4376"/><path d="M89.02 31.85 Q89.02010755124772 27.96648782251284 85.6 26.12 L79.74 22.97 Q75.1566265060241 20.50602409638554 75.16 25.71 L75.16 74.29 Q75.1566265060241 79.49397590361446 79.74 77.03 L85.6 73.88 Q89.02010755124772 72.03351217748715 89.02 68.15 Z" fill="#3b4376"/><rect x="29" y="16" width="42" height="68" rx="6" fill="#6f82ff"/></svg><p id="arrival-line"></p><span id="arrival-bar" hidden><span></span></span></div>
  <p id="arrival-note" role="status" hidden></p>
  <button id="arrival-retry" type="button">Try again</button>
  <div id="bar"><span id="status" role="status">Loading Tilo…</span></div>
  <script type="module">
    // A Tilo link under this entry: desktop mode. The route is in the
    // fragment and never reaches the server; see docs/architecture/web-routing.md.
    import {startEntryPage} from './entry-page.mjs';
    await startEntryPage({mode: 'desktop'});
  </script>
</body>
</html>
