<!doctype html>
<meta charset="utf-8">
<title>Tilo web runtime: open a file in an app</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
  header input[type=text]{width:22em}
  header input[type=number]{width:4em}
  main{display:grid;grid-template-columns:390px 1fr;gap:12px;padding:0 12px 12px;min-height:0}
  main>div{min-height:0;border:1px solid #333;border-radius:8px;overflow:hidden}
  #status{opacity:.8;white-space:pre-wrap;flex-basis:100%}
</style>
<header>
  <strong>Open a file</strong>
  <label>EPUB URL <input id="url" type="text"></label>
  <button id="open-url">Open URL</button>
  <label>or a file <input id="file" type="file" accept=".epub,application/epub+zip"></label>
  <span>|</span>
  <label>chapter <input id="chapter" type="number" min="0" value="3"></label>
  <label>blocks <input id="start" type="number" min="0" value="1">–<input id="end" type="number" min="0" value="2"></label>
  <button id="highlight" disabled>Select &amp; highlight on the phone</button>
  <span id="status">loading…</span>
</header>
<main><div id="phone"></div><div id="laptop"></div></main>
<script type="module">
// Development fixture for MountOptions.open (build-web-dev.sh copies it next
// to index.html). The phone mount opens the EPUB; the laptop mount passes the
// phone's record and no file, and must show the same book and annotations.
// ?open=URL (default ./odyssey.epub, which the developer places in the output
// directory; never committed) opens on load; ?app= names another app.
import {mountDesktop,setAppResolver} from './host.mjs';
import {createDirectoryResolver} from './app-directory.mjs';
setAppResolver(createDirectoryResolver({baseURL:new URL('./',location.href)}).resolveApp);
const $=id=>document.getElementById(id);
const lines=[];
const say=text=>{lines.push(text);$('status').textContent=lines.slice(-6).join('\n');console.log(text);};
const params=new URLSearchParams(location.search);
const app=params.get('app')??'so.tilo.ebook';
$('url').value=params.get('open')??'./odyssey.epub';
let phone,laptop,run=0;
window.tilo={};
async function open(file){
  const current=++run;
  await laptop?.cleanup();await phone?.cleanup();phone=laptop=undefined;$('highlight').disabled=true;
  const started=performance.now();
  say(`opening ${file.name??file.url} in ${app}…`);
  try{
    phone=await mountDesktop($('phone'),{app,newDocument:true,author:'Phone reader',instance:1,open:file,
      onStatus:state=>{if(state.opened)say(`opened as ${state.opened.resource} (${state.opened.mediaType})`);if(state.phase==='failed')say(`phone failed: ${state.error}`);}});
    if(current!==run)return;
    say(`phone presented in ${Math.round(performance.now()-started)} ms; record ${phone.record}`);
    laptop=await mountDesktop($('laptop'),{app,record:phone.record,author:'Laptop reader',instance:2,
      onStatus:state=>{if(state.phase==='failed')say(`laptop failed: ${state.error}`);}});
    if(current!==run)return;
    window.tilo={phone,laptop,book:phone.opened?.resource};
    const actions=phone.actions(phone.opened?.resource).filter(a=>a.address.resource===phone.opened?.resource).map(a=>a.address.action);
    say(`laptop presented on the same record; book actions: ${actions.join(', ')}`);
    $('highlight').disabled=!phone.opened?.resource;
  }catch(error){say(`${error.code?error.code+': ':''}${error.message??error}`);}
}
$('open-url').onclick=()=>open({url:$('url').value});
$('file').onchange=async()=>{const file=$('file').files[0];if(file)await open({bytes:new Uint8Array(await file.arrayBuffer()),name:file.name,mediaType:file.type||undefined});};
$('highlight').onclick=()=>{
  const book=phone.opened.resource;
  const args={chapter:Number($('chapter').value),start_block:Number($('start').value),end_block:Number($('end').value)};
  try{
    phone.invokeAction(book,'select-passage',args);
    phone.invokeAction(book,'highlight-selection',{});
    const highlights=laptop.actions(book).filter(a=>a.resource_kind==='ebook.highlight'&&a.address.action==='open');
    say(`highlighted ${JSON.stringify(args)}; the laptop lists ${highlights.length} highlight(s): ${highlights.map(a=>a.resource_label.slice(0,60)).join(' | ')}`);
  }catch(error){say(`${error.code?error.code+': ':''}${error.message??error}`);}
};
if(params.get('open')!=='')await open({url:$('url').value});
</script>
