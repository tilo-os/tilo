<!doctype html>
<meta charset="utf-8">
<title>Tilo web runtime: a local desktop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
  main{display:grid;grid-template-columns:390px 1fr;gap:12px;padding:0 12px 12px;min-height:0}
  main>div{min-height:0;border:1px solid #333;border-radius:8px;overflow:hidden}
  main.expanded{grid-template-columns:1fr}
  main.expanded #phone{display:none}
  #status{opacity:.8;white-space:pre-wrap;flex-basis:100%}
</style>
<header>
  <strong>Local desktop</strong>
  <button id="expand" disabled>Expand into the desktop</button>
  <button id="writer" disabled>Open Writer</button>
  <button id="permissions" disabled>Workspace permissions</button>
  <span id="status">loading…</span>
</header>
<main><div id="phone"></div><div id="desktop"></div></main>
<script type="module">
// Development fixture for MountOptions.local (build-web-dev.sh copies it next
// to index.html). A phone mount opens an EPUB in Books; "Expand" mounts the
// page's own desktop with that record in a window, beside an empty workspace,
// and the desktop links Writer from ./apps/ when it is opened. ?open=URL
// (default ./odyssey.epub, placed by the developer, never committed).
import {mountDesktop,setAppResolver} from './host.mjs';
import {createDirectoryResolver} from './app-directory.mjs';
setAppResolver(createDirectoryResolver({baseURL:new URL('./',location.href)}).resolveApp);
const $=id=>document.getElementById(id);
const lines=[];
const say=text=>{lines.push(text);$('status').textContent=lines.slice(-6).join('\n');console.log(text);};
const params=new URLSearchParams(location.search);
const shared={profile:'local-desktop-fixture',device:'visitor',room:'4d5e6f70-8192-4a3b-8c4d-5e6f70819203',author:'Visitor'};
const tilo=window.tilo={};
try{
  tilo.phone=await mountDesktop($('phone'),{app:'so.tilo.ebook',newDocument:true,open:{url:params.get('open')??'./odyssey.epub'},...shared,
    onStatus:state=>{if(state.phase==='failed')say(`phone failed: ${state.error}`);}});
  tilo.book=tilo.phone.opened?.resource;
  say(`Books opened ${tilo.book}; record ${tilo.phone.record}`);
  $('expand').disabled=false;
}catch(error){say(`${error.code?error.code+': ':''}${error.message??error}`);}
tilo.expand=async()=>{
  document.querySelector('main').classList.add('expanded');
  tilo.desktop=await mountDesktop($('desktop'),{app:'desktop',...shared,instance:2,
    onStatus:state=>{if(state.phase==='failed')say(`desktop failed: ${state.error}`);},
    local:{workspaces:[
      {title:'Reading',strips:[{title:'Odyssey',windows:[{app:'so.tilo.ebook',record:tilo.phone.record,focused:true}]}],
        members:[{name:'Ada',access:'comment'},{name:'Scribe',agent:true,access:'read'}],
        grants:[{app:'so.tilo.word-processor',access:'read',over:'so.tilo.ebook'}]},
      {title:'Writing'},
    ]}});
  tilo.nav=tilo.desktop.navigation;
  tilo.nav.subscribe(snapshot=>say(`${snapshot.entries.length} window(s); focused ${snapshot.active?.tab??'none'} in workspace ${snapshot.activeWorkspace}`));
  $('writer').disabled=$('permissions').disabled=false;
  say('desktop presented');
};
$('expand').onclick=()=>tilo.expand().catch(error=>say(String(error)));
$('writer').onclick=()=>tilo.desktop.openApp('so.tilo.word-processor').catch(error=>say(String(error)));
$('permissions').onclick=()=>{const {generation,activeWorkspace}=tilo.nav.getSnapshot();tilo.nav.dispatch({kind:'workspace-settings',generation,workspace:activeWorkspace,tab:'permissions'}).catch(error=>say(String(error)));};
</script>
