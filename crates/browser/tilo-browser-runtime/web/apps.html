<!doctype html>
<meta charset="utf-8">
<title>Tilo web runtime: apps as side modules</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
  #surface{min-height:0}
  #status{opacity:.8;white-space:pre-wrap}
</style>
<header>
  <strong>Tilo web runtime</strong>
  <span id="apps"></span>
  <span id="status">loading the core…</span>
</header>
<div id="surface"></div>
<script type="module">
// Development fixture: the core with no apps compiled in, every app resolved
// from ./apps/ (build-web-dev.sh). ?apps=so.tilo.ebook,so.tilo.word-processor
// names what to preload; the first one is mounted.
import {applications,mountDesktop,preloadApps,setAppResolver} from './host.mjs';
import {createDirectoryResolver} from './app-directory.mjs';
const status=document.getElementById('status');
const say=text=>{status.textContent=text;};
const directory=createDirectoryResolver({baseURL:new URL('./',location.href)});
setAppResolver(directory.resolveApp);
const index=await (await fetch('./apps/index.json')).json();
const requested=(new URLSearchParams(location.search).get('apps')??Object.keys(index.apps).join(',')).split(',').filter(Boolean);
for(const app of Object.keys(index.apps)){
  const button=document.createElement('button');button.textContent=app;button.onclick=()=>open(app);
  document.getElementById('apps').append(button);
}
const started=performance.now();
const preloaded=preloadApps(requested).then(ids=>say(`linked ${ids.join(', ')} in ${Math.round(performance.now()-started)} ms`),error=>say(String(error)));
let mount;
async function open(app){
  await mount?.cleanup();mount=undefined;
  say(`mounting ${app}…`);
  try{
    mount=await mountDesktop(document.getElementById('surface'),{app,newDocument:true,onStatus:state=>{if(state.phase==='failed')say(`${app}: ${state.error}`);}});
    window.mount=mount;
    say(`${app} presented; installed: ${(await applications()).map(a=>a.id).join(', ')}`);
  }catch(error){say(`${app}: ${error.message??error}`);}
}
await preloaded;
if(requested[0])await open(requested[0]);
</script>
