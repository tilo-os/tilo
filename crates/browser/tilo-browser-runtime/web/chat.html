<!doctype html>
<meta charset="utf-8">
<title>Tilo web runtime: a person and an agent in Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
  main{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0;padding:0 8px 8px}
  main>div{min-height:0;border:1px solid #333}
  #status{opacity:.8;white-space:pre-wrap}
</style>
<header>
  <strong>Chat: you and an agent</strong>
  <button id="reply" disabled>Agent: answer new messages</button>
  <span id="status">loading…</span>
</header>
<main><div id="you"></div><div id="agent"></div></main>
<script type="module">
// Development fixture (build-web-dev.sh): two Chat mounts of one room, the
// right one an agent. "Agent: answer new messages" reads what arrived since
// the last answer through the action door and replies to each person's
// message; window.you and window.agent are the mounts.
import {mountDesktop,setAppResolver} from './host.mjs';
import {createDirectoryResolver} from './app-directory.mjs';
const say=text=>{document.getElementById('status').textContent=text;};
setAppResolver(createDirectoryResolver({baseURL:new URL('./',location.href)}).resolveApp);
const room={app:'so.tilo.chat',profile:'chat-demo',device:'chat-demo-device',room:'0b5f1c2e-9d7a-4c55-8a1e-3f1d2c4b5a69'};
const failed=state=>{if(state.phase==='failed')say(state.error);};
try{
  window.you=await mountDesktop(document.getElementById('you'),{...room,author:'Visitor',instance:1,onStatus:failed});
  window.agent=await mountDesktop(document.getElementById('agent'),{...room,author:'agent-task:reading',agent:'Reading agent',instance:2,onStatus:failed});
}catch(error){say(error.message??String(error));throw error;}
const general='chat.channel:c_general';
const seen=new Set(agent.actions(general).filter(a=>a.resource_kind==='chat.message').map(a=>a.address.resource));
window.newMessages=()=>[...new Set(agent.actions(general).filter(a=>a.resource_kind==='chat.message').map(a=>a.address.resource))]
  .filter(id=>!seen.has(id)&&seen.add(id)).map(id=>agent.invokeAction(id,'read').output.value);
window.answer=()=>{
  const answered=[];
  for(const message of newMessages()){
    if(message.agent)continue;
    agent.invokeAction(general,'post',{value:`You asked: “${message.text}”. Let me look in the book.`});
    const reply=newMessages().find(m=>m.mine);
    if(reply)agent.invokeAction(`chat.message:${reply.id}`,'set-work',{state:'done',did:'Read the question',steps:[{resource:`chat.message:${message.id}`,label:'Read message',outcome:'applied'}]});
    answered.push(message);
  }
  say(answered.length?`answered ${answered.map(m=>`${m.authorName}: ${m.text}`).join('; ')}`:'nothing new');
  return answered;
};
const button=document.getElementById('reply');button.disabled=false;button.onclick=()=>answer();
say('both mounts presented');
window.ready=true;
</script>
