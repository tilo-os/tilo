<!doctype html>
<meta charset="utf-8">
<title>Tilo web runtime: core and apps from a registry</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px system-ui;background:#16181d;color:#e8e8ea;display:grid;grid-template-rows:auto auto 1fr;height:100vh}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
  #log{margin:0;padding:0 12px 8px;font:12px ui-monospace,monospace;opacity:.85;white-space:pre-wrap;max-height:9em;overflow:auto}
  #surface{min-height:0}
</style>
<header><strong>Tilo web runtime from a registry</strong><span id="apps"></span></header>
<pre id="log"></pre>
<div id="surface"></div>
<script type="module">
// Development fixture (WEB_RUNTIME.md, "Loading from a registry"): the core
// and every app come from a signed registry, verified in the page, cached in
// Cache Storage. ./registry.json is written by tools/web/local-registry.sh.
// ?apps=a,b names the session to restore (all preloaded in one batch; the
// first is mounted); the default is every app the registry publishes.
import {applications,configureRuntime,mountDesktop,preloadApps,runtimeAbiId,setAppResolver} from './host.mjs';
import init,* as bindings from './registry_verifier.js';
import {createVerifier} from './registry-verifier.mjs';
import {createRegistryClient} from './registry-client.mjs';
const logEl=document.getElementById('log');
const started=performance.now();
const log=text=>{logEl.textContent+=`${String(Math.round(performance.now()-started)).padStart(5)} ms  ${text}\n`;logEl.scrollTop=logEl.scrollHeight;};
try{
  const config=await (await fetch('./registry.json',{cache:'no-store'})).json();
  await init({module_or_path:new URL('./registry_verifier_bg.wasm',import.meta.url)});
  const registry=createRegistryClient({baseUrl:config.baseUrl,ownerKeyHex:config.ownerKeyHex,runtimeAbi:config.runtimeAbi,verifier:createVerifier(bindings)});
  const session=(new URLSearchParams(location.search).get('apps')?.split(',').filter(Boolean))??config.apps;
  log(`registry ${config.baseUrl}, owner ${config.ownerKeyHex.slice(0,16)}…; session: ${session.join(', ')}`);
  // One task: the core and the whole session join one registry batch (one
  // snapshot, all thin tapps, then all blobs concurrently).
  const core=registry.resolveRuntime();
  const glue=core.then(({assets})=>{
    const name=[...assets.keys()].find(key=>key.endsWith('tilo_browser_runtime.js'));
    if(!name)throw Error('the registry core carries no glue asset');
    return assets.get(name);
  });
  configureRuntime({glue,module:core.then(({module})=>module)});
  setAppResolver(registry.resolveApp);
  const restored=preloadApps(session);
  core.then(({abi})=>log(`core verified: ${abi}`),error=>log(`core: ${error.message}`));
  log(`core running: ${await runtimeAbiId()}`);
  const ids=await restored.catch(error=>{for(const [id,reason] of error.failed??[])log(`${id}: ${reason.message??reason}`);return error.installed??[];});
  log(`session linked: ${ids.join(', ')}; snapshot #${await registry.sequence()}`);
  for(const app of config.apps){
    const button=document.createElement('button');button.textContent=app;button.onclick=()=>open(app);
    document.getElementById('apps').append(button);
  }
  let mount;
  async function open(app){
    await mount?.cleanup();mount=undefined;
    try{
      mount=await mountDesktop(document.getElementById('surface'),{app,newDocument:true,onStatus:state=>{if(state.phase==='failed')log(`${app}: ${state.error}`);}});
      window.mount=mount;
      log(`${app} presented; installed: ${(await applications()).map(a=>a.id).join(', ')}`);
    }catch(error){log(`${app}: ${error.message??error}`);}
  }
  if(ids[0])await open(ids[0]);
}catch(error){log(`failed: ${error.message??error}`);console.error(error);}
</script>
