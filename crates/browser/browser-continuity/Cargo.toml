[package]
name = "browser-continuity"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded reviewed browser migration plans and optional read-only source capture"

[features]
native = ["dep:blake3", "dep:tilo-files", "dep:cap-primitives", "dep:cap-fs-ext", "dep:ed25519-dalek"]

[dependencies]
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
tilo-files = { path = "../../platform/tilo-files", optional = true }
cap-primitives = { version = "3.4.6", optional = true }
cap-fs-ext = { version = "3.4.6", optional = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
