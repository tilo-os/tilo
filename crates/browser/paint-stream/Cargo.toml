[package]
name = "tilo-paint-stream"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A web page as a layered display list: the engine runs on the host, every client draws the list with its own Vello and text stack. Format, keyed patches, and conversion from an engine's layout snapshot."

# Portable: the host converts and diffs, the WASM client applies and draws.
[dependencies]
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
usvg = { version = "0.47", default-features = false, optional = true }

[features]
# Convert SVG images to vector items (`svg::drawing`). The host enables it;
# a client that only draws does not need it.
svg = ["dep:usvg"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
