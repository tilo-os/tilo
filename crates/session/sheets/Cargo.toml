[package]
name = "tilo-sheets"
description = "The sheets the desktop shows over everything, as ordinary apps the shell hosts: the power menu, the question about a display change, the Super+P display sheet, the shortcut guide, the public workspace directory, workspace settings and the questions the shell asks on an app's or a service's behalf (portal, authentication and network-secret sheets)."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
zeroize = { workspace = true }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
