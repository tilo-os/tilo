[package]
name = "tilo-sheets"
description = "The sheets the desktop shows over everything, as ordinary apps the shell hosts: the power menu."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
