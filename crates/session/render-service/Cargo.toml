[package]
name = "tilo-render-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A workspace's render service: the one process that draws toolkit apps on the GPU. Validates each app's scenes, rasterizes them with vello into dma-bufs the compositor imports like any client buffer, and keeps every app's memory and pixels apart."

[dependencies]
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["dmabuf-import"], default-features = false }
vello.workspace = true
pollster.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tilo-rt.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["dmabuf-import"] }

[target.'cfg(target_os = "linux")'.dependencies]
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
rustix = { workspace = true, features = ["event", "fs", "mm", "net", "process", "std"] }
libc.workspace = true
tilo-sandbox-core = { path = "../../system/sandbox-core" }

[dev-dependencies]
rustix = { workspace = true, features = ["fs"] }
tilo-font-catalog = { version = "0.1.0", path = "../../sdk/font-catalog" }

[lints]
workspace = true
