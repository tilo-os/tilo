[package]
name = "tilo-service"
description = "A session service as the session hosts it: the resources it publishes, their readings, the actions it carries out, and the worker its device calls run on."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
zeroize.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
