<!doctype html>
<meta charset="utf-8">
<title>Tilo call participant</title>
<!-- One participant of voice_browsers.rs: the page's call client
     (web/voice.mjs) over the fixture's session, which joins and beats as the
     page's own peer session does. -->
<script type="module">
import {createPeerVoice} from './web/voice-peer.mjs';
import {createVoiceControls} from './web/voice-controls.mjs';
import {createBrowserAudio} from './web/voice-audio.mjs';

const who = new URL(location.href).searchParams.get('who');
const workspace = await (await fetch('/api/room')).text();
// The device this page's frames name: the host that bridges it into the call.
const device = await (await fetch('/api/host')).text();
const api = (path, method = 'GET') => fetch(`/api/${who}/${path}`, {method, cache: 'no-store'});
// Only the certified session crosses this fixture proxy. Call control, the
// pictures the page publishes on its call's plane (and the layers it shows,
// and the keyframes it asks for), and all audio/capture/codec code are the
// production browser modules.
const certified = {
  voiceJoin: (_, call) => {void api(`join/${call}`, 'POST');},
  voiceLeave: () => {void api('leave', 'POST');},
  voiceCalls: () => {void api('calls', 'POST');},
  voiceCall: (_, operation, request) => {void fetch(`/api/${who}/call/${request}`, {method: 'POST', body: operation, cache: 'no-store'});},
  // The microphone's frames, which the page publishes on its workspace's live
  // plane: this fixture holds no plane, so it counts them instead.
  callAudio: (_, frames) => {window.publishedFrames = (window.publishedFrames ?? 0) + JSON.parse(frames).length;},
  // What the page makes and reads of the call's pictures, posted to the
  // fixture that holds the plane: each as it is made, never on a timer.
  callPictures: (_, pictures) => {void fetch(`/api/${who}/pictures`, {method: 'POST', body: pictures, cache: 'no-store'});},
  callShowing: (_, shown) => {void fetch(`/api/${who}/showing`, {method: 'POST', body: shown, cache: 'no-store'});},
  callPictureRestart: (_, device, source) => {void fetch(`/api/${who}/keyframe/${device}/${source}`, {method: 'POST', cache: 'no-store'});},
};

// Frames the call played here, by the device that sent them, and the most
// anyone was heard speaking.
const played = {};
const speechCounts = {};
const reports = [];
// How often the audio worklet reported levels, and the loudest any publisher
// measured: a call that plays frames still reports nothing without them.
const levels = {messages: 0, max: {}, captureMax: 0};
const resources = {contexts: [], streams: [], workers: []};
const environment = {
  AudioContext: class extends AudioContext {constructor(options) {super(options); resources.contexts.push(this);}},
  AudioWorkletNode, AudioEncoder, AudioDecoder, AudioData, EncodedAudioChunk,
  Worker: class extends Worker {
    constructor(...args) {super(...args); resources.workers.push(this);}
    terminate() {this.stopped = true; super.terminate();}
  },
  navigator: {mediaDevices: {async getUserMedia(options) {
    const stream = await navigator.mediaDevices.getUserMedia(options);
    resources.streams.push(stream); return stream;
  }}},
};
const factory = createBrowserAudio({environment, onReport: report => reports.push(`${report.stage}: ${report.error ?? report.type}`)});
const audio = {start(options) {
  return factory.start({...options, onLevels(measured) {
    levels.messages += 1;
    levels.captureMax = Math.max(levels.captureMax, measured.capture);
    for (const [publisher, rms] of measured.publishers) {
      levels.max[publisher] = Math.max(levels.max[publisher] ?? 0, rms);
      if (rms > 0.015) speechCounts[publisher] = (speechCounts[publisher] ?? 0) + 1;
    }
    options.onLevels(measured);
  }}).then(session => {
    const play = session.play.bind(session);
    session.play = frame => {
      const taken = play(frame);
      if (taken) played[frame.publisherId] = (played[frame.publisherId] ?? 0) + 1;
      return taken;
    };
    return session;
  });
}};
const peerVoice = createPeerVoice({peer: () => certified, workspace, device, audio, onReport: report => reports.push(`${report.type}: ${report.error?.message ?? ''}`)});
const voice = peerVoice.call;
const controls = createVoiceControls({voice: peerVoice, workspace});
const act = command => controls.execute({app: 'so.tilo.chat', workspace, record: '', instance: '1', command: {version: 1, intent: 0, command}});
(async () => {
  for (;;) {
    const events = await (await api('events')).json();
    peerVoice.pump(JSON.stringify(events));
    if (!events.length) await new Promise(resolve => setTimeout(resolve, 20));
  }
})();
const heardSpeaking = new Set();
voice.subscribe(state => {
  for (const participant of state.participants) if (participant.speaking) heardSpeaking.add(participant.self ? 'self' : participant.device);
});
Object.assign(window, {voice, act, played, reports, levels, heardSpeaking, speechCounts, resources, reconnect: () => api('reconnect', 'POST'), ready: true});
</script>
