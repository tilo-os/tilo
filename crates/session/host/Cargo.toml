[package]
name = "tilo-session-host"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "A participant's host of a workspace: relay-mediated device certification, the certified relay session with its commit outbox and reconnect replay, the live presence plane, and SessionHealth v1, for a page, an agent or a program."
repository.workspace = true
homepage.workspace = true

# Portable: the same code runs natively (tests, headless peers) and in the
# page. The page supplies the device signer (WebCrypto) and persistence
# (IndexedDB) through the `DeviceSigner` and `PeerStore` seams.
[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Asking another device's actions through this session is the session's own role, written once for
# every host that asks one.
tilo-session-core = { path = "../../session/core" }
tilo-relay-client = { version = "0.1.0", path = "../../hosting/tilo-relay-client", features = ["iroh"] }
tilo-relay-protocol = { version = "0.1.0", path = "../../hosting/tilo-relay-protocol" }
# The iroh session client the page and native peers reach the host with.
tilo-relay-session = { version = "0.1.0", path = "../../hosting/tilo-relay-session" }
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity" }
# Signed document envelopes, exactly as native peers exchange them.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
neighbour-wire = { version = "0.1.0", path = "../../collab/neighbour-wire" }
iroh = { workspace = true }
iroh-base = { workspace = true }
n0-future = "0.3"
web-time = "1"
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tokio = { workspace = true, features = ["sync", "macros"] }
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
hex.workspace = true
rand.workspace = true
blake3.workspace = true
# The toolkit adapter: `CollabTransport` for `CollaborationManager::with_transport`.
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false, optional = true }
# The browser is a channel member device, as native peers are.
channel-crypto = { version = "0.1.0", path = "../../collab/channel-crypto" }
# The channel engine every participant runs, here as a reader.
tilo-channels = { version = "0.1.0", path = "../../collab/channels" }
uuid.workspace = true
# The live plane's names, tracks and voice objects, and the carrier client the
# page runs over its iroh session.
tilo-live = { version = "0.1.0", path = "../../collab/tilo-live", features = ["plane", "iroh"] }
# `moq-lite` itself: the page's live session is a publisher and a subscriber.
moq-net = { workspace = true }
bytes.workspace = true
# Each joined workspace's replica: the workspace's governance as native devices
# admit it, held in the engine's owner native devices hold theirs in
# (`replica`), its record kept as JSON in the page's store.
tilo-peer-state = { version = "0.1.0", path = "../../collab/tilo-peer-state" }
# Whether a joined workspace shares its members' layout, read off its replica's
# workspace document.
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# The signed hint a workspace's governance keeps of its host's address.
tilo-delivery-protocol = { version = "0.1.0", path = "../../hosting/tilo-delivery-protocol" }
serde_json.workspace = true
# A participant's client: the trait its presence frames travel on, which this session carries.
tilo-session-client = { path = "../../session/client" }
# The action host another device of a workspace is, reached through the
# session (`session_actions`).
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }

[features]
default = []
toolkit = ["dep:ui"]

[dev-dependencies]
# The host a test asks through the page's door, as a session's device answers it.
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
# A test that must hold the wall clock of its whole process (and the
# helper threads reading it) takes the process to itself.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["test-support"] }
tilo-automerge-isolate.workspace = true
test-http = { path = "../../dev/test-http" }
tilo-relay = { path = "../../hosting/tilo-relay", features = ["web", "test-support"] }
# The fetch proxy's host side, as the page's test of it drives it.
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net" }
# A relay listener on loopback, as the live plane's acceptance test drives it.
tilo-live = { path = "../../collab/tilo-live", features = ["plane", "relay", "iroh"] }
# The call's native side sends and hears a real tone, as a call does.
opus = "0.4"
automerge.workspace = true
tilo-automerge.workspace = true
# A session's codec negotiation, run against the host's advert for its
# browser members (no GStreamer: the pure negotiation only).
tilo-media = { path = "../../platform/tilo-media" }
iroh.workspace = true
url.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
tilo-paths.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tilo-test-env = { path = "../../dev/test-env", features = ["tokio"] }
# The broker's verdict, for the browser's to be checked against.
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
# A call's voice channel is a real Chat channel, written by Chat's own model.
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
# A refused commit reaches the app that made it, mounted headlessly.
tilo-app = { path = "../../sdk/tilo-app", features = ["test-support"] }
uuid.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# A login code is a Tilo link, read under the grammar the page writes it with.
tilo-reference = { version = "0.1.0", path = "../../collab/reference" }
uuid.workspace = true
