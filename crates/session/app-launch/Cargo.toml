[package]
name = "tilo-app-launch"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Starting an application from the desktop: the launch vocabulary, each app's environment, host entry kinds, document and link routing, and crash reporting."

# What the desktop starts and how: a Tilo package through `tilo-launcher`, the
# machine's own applications through their desktop entries, and the workspace and
# environment either is given. Nothing here draws; the session owns the loop
# and hands over what this crate plans and spawns.

[features]
# The seam a session's tests report an ending through, for the apps it did
# not start itself.
test-support = []

[dependencies]
# The machine's own applications: their entries, entry kinds and launch plans.
# Reading a downloaded `AppImage`'s own name and artwork needs its image.
desktop-entry = { version = "0.1.0", package = "tilo-desktop-entry", path = "../../system/desktop-entry", features = ["appimage"] }
# An installed app read through the signed manifest it was admitted with.
app-catalogue = { path = "../../packaging/app-catalogue" }
# The workspace's grants, as the launcher's capability file carries them, and
# the policy the person's authority in it is projected from.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# Publishing the projection the launcher binds, and holding it for as long as
# the session vouches for it.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
blake3.workspace = true
# A record's id: what one is, and the URI that asks an app to open it.
collaboration = { version = "0.1.0", path = "../../collab/collaboration" }
# The extended attributes a workspace mount answers a record's path on.
host-fs = { path = "../../system/host-fs" }
fs-protocol = { path = "../../system/fs-protocol" }
# The downloaded programs' registry: the session resource, its actions and
# the worker they run on.
tilo-actions = { path = "../../collab/actions" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-service = { path = "../service" }
# The log target an app's own output is relayed under, which the session log
# always keeps.
tilo-startup-metrics = { version = "0.1.0", path = "../../system/tilo-startup-metrics" }
tilo-lock = { path = "../../platform/tilo-lock" }
tilo-paths.workspace = true
# The type a document's path names, for the app that claims it.
tilo-mime = { version = "0.1.0", path = "../../platform/tilo-mime" }
# The signed manifest an installed app was admitted with.
tilo-app-package = { path = "../../packaging/tilo-app-package" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# The window door an app's later windows are asked for on, and the release a
# launch takes it with.
runtime-portal = { path = "../../runtime/runtime-portal", default-features = false }
launcher = { path = "../../packaging/launcher" }
# A tilolang window's instance, handed to the host of its workspace and author:
# the installation verified as a launch verifies it, its module sealed, its
# publisher's key, and where windows kept its record before.
package-store = { path = "../../packaging/package-store", features = ["store"] }
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }
tilo-app-state = { path = "../../system/app-state" }
hex.workspace = true
# The window request the door carries, as the app reads it.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# A record a window kept, written as its own process writes it, read back
# where its host keeps it.
automerge.workspace = true
durable-store = { path = "../../system/durable-store" }
# The subscriber a test reads what an app wrote back through.
tracing-subscriber = { workspace = true }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
