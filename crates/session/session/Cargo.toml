[package]
name = "tilo-session"
description = "The native Tilo session: the compositor hosting the desktop every host shows (the desk under the windows, the top bar, overview and menus above them), the window policy of its strips, and the desktop's surface apps."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-session"
path = "src/main.rs"

# A surface app the tests start the way the session starts a panel: it reads
# what the session publishes and changes it, and reports both in a file. Never
# installed — the image names the binaries it carries.
[[bin]]
name = "tilo-surface-probe"
path = "tests/bin/surface_probe.rs"
test = false

# The session's loop walks no path after startup. The audit watches the
# process's main thread, and `libtest` runs every test on a thread of its own,
# so this target is the process's `main` driving the session itself.
[[test]]
name = "main_thread_reads"
path = "tests/main_thread_reads.rs"
harness = false

[features]
# Stamps the developer-entry build marker into the binary so the package's
# developer session entry can tell a session someone deliberately built from
# any other executable before logging into it. Inert unless this is a debug
# build, so a `--release --features dev-session` never carries it: the marker
# is the entire content of the feature.
dev-session = []

[target.'cfg(target_os = "linux")'.dependencies]
# The surface apps' sockets are handed to their children as descriptors.
libc.workspace = true
tilo-compositor = { path = "../compositor" }
image = { workspace = true, features = ["png"] }
# An application's themed icon is an SVG as often as a PNG.
resvg = { version = "0.47", default-features = false }
tilo-surface-host = { path = "../surface-host" }
tilo-desktop = { path = "../desktop" }
tilo-desktop-model = { path = "../desktop-model" }
tilo-desktop-surface = { path = "../desktop-surface" }
# The desk's window policy, whose tab calls an app's asks are answered with.
tilo-desktop-policy = { path = "../desktop-policy" }
desktop-policy = { path = "../../system/desktop-policy", default-features = false }
tilo-desktop-search = { path = "../desktop-search", features = ["indexes", "settings", "catalogue"] }
tilo-dictation = { path = "../dictation" }
app-catalogue = { path = "../../packaging/app-catalogue" }
# What the session binary's search reads of the device: the installed apps,
# the machine's own, the person's search choices.
tilo-installed-apps = { path = "../../packaging/installed-apps" }
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
settings-store = { path = "../../system/settings-store", features = ["watch"] }
# The pictures the desk shows: the image's own, and the person's.
tilo-wallpapers = { path = "../../platform/tilo-wallpapers" }
# The registries' listing as this device last accepted it, for the apps a
# person can get.
app-cli = { path = "../../packaging/app-cli" }
# Following the directories search's lists are read from.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# What the person picks in the emoji picker is remembered between sessions.
emoji = { path = "../../text/emoji" }
tilo-durable-writer = { path = "../../platform/tilo-durable-writer" }
# The records the workspaces on this device hold: the room indexes search
# reads them from, as the apps that write them keep them, and the document
# store the reference bringing one here is written into.
tilo-app-state = { path = "../../system/app-state" }
# The records' framework as an app window opens one: the workspace's emoji is
# Chat's record, and the settings tab reads and changes it the same way.
tilo-app = { path = "../../sdk/tilo-app" }
durable-store = { path = "../../system/durable-store" }
automerge.workspace = true
# Where this device keeps its state: the root the record indexes are under.
tilo-cli-kit = { path = "../../runtime/cli" }
tilo-paths.workspace = true
# The person's accessibility settings: the assists, the colour filter and
# the magnifier the compositor applies.
tilo-accessibility-settings = { path = "../../platform/tilo-accessibility-settings" }
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-actions = { path = "../../collab/actions" }
tilo-quick-settings = { path = "../quick-settings" }
# The capture studio the session shows over the desktop, and the recorder
# that feeds it the compositor's frames.
tilo-capture-studio = { path = "../capture-studio" }
tilo-notification-banners = { path = "../notification-banners" }
tilo-onboarding-host = { path = "../onboarding-host" }
tilo-sheets = { path = "../sheets" }
# The wireless display sheet speaks the projector service's control socket; the
# sender stacks themselves (Miracast, GStreamer) stay in the service.
tilo-projector = { path = "../../system/projector", default-features = false }
# A projection's frames are the share streams' encode: the desktop as the
# compositor draws it, through the one real-time encoder.
tilo-window-share = { path = "../window-share" }
# The directory of public workspaces a site serves: what joins list and
# what a site's door and directory answer.
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# What a door's invitation is verified as before a workspace is joined: only
# a grant signed for this person's key joins it.
tilo-workspace-join = { path = "../../collab/workspace-join" }
tilo-clock = { path = "../../platform/tilo-clock" }
# The models an agent may plan with: the person's own provider settings.
agent-provider-config = { path = "../../agent/provider-config" }
# The sanctioned blocking HTTP client, which installs the crypto provider.
tilo-net = { path = "../../platform/tilo-net", features = ["blocking", "json"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
toml.workspace = true
url.workspace = true
# Who is here: the session's own membership of each workspace's room, on the
# collaboration plane's peer actor.
tilo-network-actor = { path = "../network-actor" }
# This device's rooms: the state of every workspace it joined, held beside the
# desk, the enrollment a join redeems its invitation with, and who saved a
# shortcut by the proof of a device of theirs.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# The workspace join exchange, over the endpoint the invitation's host names.
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
# The web grammar of a workspace link, which says what a pasted link joins.
tilo-reference = { path = "../../collab/reference" }
# This device's relays wait in the collaboration endpoint until a workspace
# it shows has someone else in it, and its key is published only then.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
neighbour-wire = { path = "../../collab/neighbour-wire" }
collab-types = { path = "../../collab/collab-types" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
# The identity record the launcher bound and the person's own: the directories
# whose changes a worker follows.
runtime-identity = { path = "../../runtime/runtime-identity" }
iroh.workspace = true
postcard = { workspace = true, features = ["use-std"] }
hex.workspace = true
os-actions = { path = "../../system/os-actions" }
tilo-service = { path = "../service" }
# The broker that serves the socket this session's apps speak on, and the
# provider seam it asks for what the services publish.
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
# The shortcuts a person saved and the triggers that start them without
# anyone invoking them.
tilo-automation = { path = "../../collab/automation" }
# A schedule's fire time is claimed by one of the person's devices, ranked by
# the same hash everywhere.
sha2.workspace = true
# The MCP projection of the action host, which the agent door serves a
# program of this login through once the person admits it.
tilo-runtime = { path = "../../runtime/tilo-runtime" }
uuid.workspace = true
# The kernel-attested custody of an executing app process a launch is
# admitted by.
runtime-portal = { path = "../../runtime/runtime-portal" }
# The wire the apps speak to the session's services, and where the launcher
# hands out its socket.
runtime-collab = { path = "../../runtime/runtime-collab" }
launcher = { path = "../../packaging/launcher" }
# The machine's power: the idle, lid, key and battery policy and the service
# over logind that acts on it.
tilo-session-power = { path = "../power-service" }
tilo-power-mgmt = { path = "../../system/power" }
# The records of a session that stopped, and the news of one that did.
tilo-crash-records = { path = "../crash-records" }
# The watchdog that ends a session whose main loop stopped for good.
tilo-liveness = { path = "../liveness" }
# The room left on the person's filesystems, for the storage notice.
rustix = { workspace = true, features = ["fs"] }
# Planning and starting the apps the person opens.
tilo-app-launch = { path = "../app-launch" }
# The udisks2 names the removable media are read and ejected by. The
# blocking client is left out: this session speaks to the bus itself.
block-devices = { path = "../../system/block-devices" }
futures-util.workspace = true
tilo-connectivity-service = { path = "../connectivity-service" }
tilo-system-service = { path = "../system-service" }
tilo-settings-service = { path = "../settings-service" }
# The sound resource's specs, for the audio service the session starts.
tilo-audio-service = { path = "../audio-service", default-features = false }
# The desktop services the session starts on the buses; screen shares
# stream the frames the session captured.
tilo-portal = { path = "../portal", features = ["pipewire"] }
# The files a person chooses for apps: the session mounts the store the
# portal grants through, so every launcher finds an app's view to bind.
tilo-documents = { path = "../../system/documents", features = ["mount"] }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-notifications-service = { path = "../notifications-service" }
tilo-polkit-agent = { path = "../polkit-agent" }
tilo-network-secret-agent = { path = "../network-secret-agent" }
# The person's other devices: what was copied here is shared through
# the same fabric as everything else that follows them.
tilo-device-fabric = { path = "../device-fabric" }
# The speaker groups and remote audio those devices carry: the session pumps
# them on the fabric's pass and answers Settings from them.
tilo-speaker-service = { path = "../speaker-service" }
# The person's VPN profiles: a kill-switch profile that drops blocks this
# device's traffic, decided here and carried out by the root helper.
tilo-device-vpn = { path = "../../system/device-vpn", default-features = false, features = ["session"] }
tilo-bluetooth-agent = { path = "../bluetooth-agent" }
tilo-tray-host = { path = "../tray-host" }
tilo-bluez = { path = "../../system/tilo-bluez" }
# The desktop's event sounds (a notification's ring, a screenshot's click).
media = { package = "tilo-media", path = "../../platform/tilo-media" }
# The login screens' comforts go to tilo-authd over its socket protocol.
tilo-auth = { path = "../../system/tilo-auth", default-features = false }
# Checks a password for the lock screen, through the unlock helper.
bounded-command = { path = "../../system/bounded-command" }
zeroize.workspace = true
chrono = { workspace = true, default-features = true }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# The line framing an app's shell-ui connection speaks.
wire-frame = { path = "../../system/wire-frame" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
tracing.workspace = true
xkeysym = "0.2.1"
zbus = { workspace = true, features = ["tokio"] }
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The resource effects the tests' own questions are declared with.
tilo-resource = { path = "../../sdk/tilo-resource" }
# Reporting an ending to a session's apps as its spawner would, with the
# memory cause a launcher remembers.
tilo-app-launch = { path = "../app-launch", features = ["test-support"] }
# The stand-in logind and UPower a power test serves over a socket pair.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
zbus = { workspace = true, features = ["tokio", "p2p"] }
tilo-test-env = { path = "../../dev/test-env" }
# A site's entry and directory served over loopback, for what joins list.
test-http = { path = "../../dev/test-http" }
# A host's key, signing the invitation a test's door answers with.
ed25519-dalek.workspace = true
# A site's workspace as a site runs it: the host on this machine that
# governs the room a join enrolls into, folding what its pages write, and
# the page of its person that recorded there first.
tilo-relay = { path = "../../hosting/tilo-relay", features = ["web"] }
tilo-browser-peer = { path = "../../browser/tilo-browser-peer" }
# The worker a host admits the records of its members through.
tilo-automerge-isolate.workspace = true
sha2.workspace = true
# What `NetworkManager` says, fed in rather than read from a bus.
tilo-nm = { path = "../../system/tilo-nm" }
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability", features = ["test-support"] }
futures-util.workspace = true
tempfile.workspace = true
tilo-copy-lint = { path = "../../dev/copy-lint" }
tilo-audio-service = { path = "../audio-service" }
tilo-onboarding = { path = "../onboarding" }
# The prepared-setup and journal fixtures: what a device holds before setup runs.
tilo-onboarding-host = { path = "../onboarding-host", features = ["test-support"] }
tilo-quick-settings = { path = "../quick-settings", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
# The sheets' apps mounted for a person, so a test presses a control of one
# as the person's own gesture.
tilo-app = { path = "../../sdk/tilo-app", features = ["test-support"] }
wayland-client.workspace = true
wayland-protocols = { version = "0.32.12", features = ["client"] }
# A display tool speaking `wlr-output-management` to the session's compositor.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[lints]
workspace = true
