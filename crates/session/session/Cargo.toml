[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-session"
description = "The native Tilo session: the compositor hosting the desktop every host shows (the desk under the windows, the top bar, overview and menus above them), the window policy of its strips, and the desktop's surface apps."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-session"
path = "src/main.rs"

# A surface app the tests start the way the session starts a panel: it reads
# what the session publishes and changes it, and reports both in a file. Never
# installed — the image names the binaries it carries.
[[bin]]
name = "tilo-surface-probe"
path = "tests/bin/surface_probe.rs"
test = false

# The session's integration tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

# The session's loop walks no path after startup. The audit watches the
# process's main thread, and `libtest` runs every test on a thread of its own,
# so this target is the process's `main` driving the session itself.
[[test]]
name = "main_thread_reads"
path = "tests/main_thread_reads.rs"
harness = false

[features]
# Stamps the developer-entry build marker into the binary so the package's
# developer session entry can tell a session someone deliberately built from
# any other executable before logging into it. Inert unless this is a debug
# build, so a `--release --features dev-session` never carries it: the marker
# is the entire content of the feature.
dev-session = []
# Lets a release binary of a dev image open the test-control socket
# `$TILO_TEST_CONTROL` names, which `tilo-vm` and the capture harnesses drive a
# desktop through. A production image never builds it (tools/policy/
# check_dev_overrides_contract.py).
dev-overrides = []
# Publishes a Rust app's (Tube's, Chat's) resources and views in a development session, so a
# shell draws them live: Tube's sample catalogue and Chat's demo conversation, with the views a
# `#[view]` declares, never the live worker. A shot of a Rust app's view on the canvas builds
# with it (`--features dev-rust-views`); a production image never does.
dev-rust-views = ["dep:tube", "chat/samples"]
# The session's search sources (`search::SEARCH_FEED`) are handed over by the
# bundling crate, with the desktop's search engine, rather than linked: the
# browser desktop fetches them as their own module.
lazy-search-feed = []

[dependencies]
# A window's page reaches this session as the paint stream its app encoded.
base64.workspace = true
# The MLS vault's master key: the Secret Service, the Keychain, the page's
# IndexedDB, or the store a headless machine names with `TILO_SECRETS_DIR`.
tilo-secrets.workspace = true
# The surface apps' sockets are handed to their children as descriptors.
# The certificate a device was approved with, kept where the identity helper
# reads it once and taken away after.
# A joined workspace's records are untrusted bytes: a worker process of this
# executable decodes them, and `main` serves that worker.
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-desktop = { path = "../desktop" }
# The participant's own client of the collaboration plane: the boards of who is here and this
# device's own word, which this session hosts with its own endpoint.
tilo-session-client = { path = "../client" }
# The roles every host runs: the desk's document and the arrangement it holds.
tilo-session-core = { path = "../core" }
tilo-desktop-model = { path = "../desktop-model" }
# The desk's window policy, whose tab calls an app's asks are answered with.
tilo-desktop-policy = { path = "../desktop-policy" }
# This device's identity: the certificate it presents and the key it signs with, from the store its
# host keeps them in.
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
# The action broker's half every host runs: what a step is taken by, the step seam, the route.
tilo-broker-core = { path = "../../collab/broker-core" }
tilo-desktop-surface = { path = "../desktop-surface" }
# Settings' pages are every desktop's own, the page's included: its search offers them wherever
# the session runs.
tilo-desktop-search = { path = "../desktop-search", features = ["settings"] }
settings-store = { path = "../../system/settings-store" }
# Following the directories search's lists are read from.
tilo-files = { path = "../../platform/tilo-files" }
durable-store = { path = "../../system/durable-store" }
automerge.workspace = true
tilo-paths.workspace = true
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-actions = { path = "../../collab/actions" }
# The directory of public workspaces a site serves: what joins list and
# what a site's door and directory answer.
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# A browser environment's session asks its relay to enter the workspace it was handed, the way a
# member device does.
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
tilo-clock = { path = "../../platform/tilo-clock" }
toml.workspace = true
url.workspace = true
# The key this device signs its own changes of a workspace with, as the
# broker's owner commits ask for it.
ed25519-dalek.workspace = true
# This device's workspaces: the state of every one it joined, held beside
# the desk, the enrollment a join redeems its invitation with, and who saved
# a shortcut by the proof of a device of theirs.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# What a message sent from a window's box carries beside its words: the
# references and files the window attached, as the app that keeps them reads
# them.
tilo-reference = { path = "../../collab/reference" }
# What a report is before it is filed: the reviewed submission a channel's
# `submit-feedback` files, the same one a browser's feedback sheet sends.
tilo-feedback = { path = "../../collab/feedback" }
neighbour-wire = { path = "../../collab/neighbour-wire" }
collab-types = { path = "../../collab/collab-types" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
postcard = { workspace = true, features = ["use-std"] }
hex.workspace = true
# The prefix hash of a transfer that starts at the top of its object.
blake3.workspace = true
tilo-service = { path = "../service" }
# The content a record references, kept under this session's state and served
# to the apps that read the record.
tilo-content = { path = "../../system/content" }
# The MLS vault's master key: the Secret Service on Linux, the Keychain on
# macOS, or the store a headless machine names with `TILO_SECRETS_DIR`.
# A fresh vault master key is drawn from getrandom's `SysRng`.
getrandom.workspace = true
# This device's channels: the groups its records are sealed in, and the keys an endpoint reads one
# with. Every host runs the engine; where its state is kept is the host's.
tilo-channels = { path = "../../collab/channels" }
channel-crypto = { path = "../../collab/channel-crypto" }
rand_core.workspace = true
# A schedule's fire time is claimed by one of the person's devices, ranked by
# the same hash everywhere, and the vault derives its channel state key.
sha2.workspace = true
uuid.workspace = true
futures-util.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The workspaces' live plane: a sealed `moq-lite` session per workspace over
# this session's own endpoint, and the relay role a member serves for the
# others.
tilo-live = { path = "../../collab/tilo-live", features = ["plane"] }
# The endpoint every device dials: presence names a publisher and where it is reached with it, on
# every host.

zeroize.workspace = true
chrono = { workspace = true, default-features = true }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
# The sheets the desktop shows over everything: the offers an action
# publishes and the effects a person answers with.
# The records the workspaces on this device hold: the workspace indexes
# search reads them from, as the apps that write them keep them.
tilo-app-state = { path = "../../system/app-state" }
tilo-sheets = { path = "../sheets" }
# The shortcuts a person saved and the triggers that start them without
# anyone invoking them.
tilo-automation = { path = "../../collab/automation" }
tilo-startup-metrics = { version = "0.1.0", path = "../../system/tilo-startup-metrics" }
# The public workspaces sites list, their doors, and where a join stands.
tilo-workspace-directory = { path = "../workspace-directory" }
# The models a session's own questions run on, and the person's provider settings: the same
# gateway an app asks, reached on every host.
agent-provider-config = { path = "../../agent/provider-config" }
tilo-rt = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The toolkit's native half: the winit runner, the host services and the
# broker transport, which only a desktop host runs.
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# The live plane over this session's own iroh endpoint: native only.
tilo-live = { path = "../../collab/tilo-live", features = ["relay", "iroh"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
# A Rust app's views and resources, published in a development session only
# (`dev-rust-views`): the sample catalogue, never the live worker.
tube = { path = "../../../apps/tube", default-features = false, features = ["samples"], optional = true }
desktop-policy = { path = "../../system/desktop-policy", default-features = false }
tilo-dictation = { path = "../dictation" }
# What the session binary's search reads of the device: the installed apps,
# the machine's own, the person's search choices.
# The session's own app store, read as the launcher reads it: a development session seeds the
# tilolang apps it installed (`crate::seeded_apps`).
package-store = { path = "../../packaging/package-store" }
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
# The filesystem daemon's content store, as this desktop session reaches it:
# what names an agent as the cause of the writes Files made for a person.
runtime-fs = { package = "tilo-fs-client", version = "0.1.0", path = "../../runtime/tilo-fs-client" }
tilo-durable-writer = { path = "../../platform/tilo-durable-writer" }
# The records' framework as an app window opens one: the workspace's emoji is
# Chat's record, and the settings tab reads and changes it the same way.
tilo-app = { path = "../../sdk/tilo-app" }
# The conversations this session's agents answer in: what Chat keeps of a
# workspace, read here the way the app reads it, so this session runs an agent
# on a turn a person's message started.
chat = { path = "../../../apps/chat", default-features = false }
# Where a login's time went, when `TILO_STARTUP_METRICS_PATH` asks
# (`tools/perf/startup_marks.py` reads it).
# The person's accessibility settings: the assists, the colour filter and
# the magnifier the compositor applies.
tilo-accessibility-settings = { path = "../../platform/tilo-accessibility-settings" }
tilo-quick-settings = { path = "../quick-settings" }
tilo-activities = { path = "../activities" }
tilo-notification-banners = { path = "../notification-banners" }
tilo-onboarding-host = { path = "../onboarding-host" }
# What a door's invitation is verified as before a workspace is joined: only
# a grant signed for this person's key joins it.
tilo-workspace-join = { path = "../../collab/workspace-join" }
# The address an invitation names, signed: this device's own endpoint, for a
# link it makes into a workspace it holds.
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
# The person's account with the host the session runs on, read live.
tilo-host-account = { path = "../../hosting/tilo-host-account" }
# The session asks the model gateway as Activity, the way an app it starts
# does, for the history's descriptions and group names.
tilo-model-client = { path = "../../agent/model-client", features = ["runtime-client"] }
# Who is here: the session's own membership of each workspace, on the
# collaboration plane's peer actor.
tilo-network-actor = { path = "../network-actor" }
# A host's own questions to a member, asked on the collaboration endpoint:
# what an agent asks before it acts on a workspace, answered by the person.
tilo-relay-client = { path = "../../hosting/tilo-relay-client" }
# The person's workspace list, as their keys read it and the hosts of their
# workspaces keep it.
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
# This device's relays wait in the collaboration endpoint until a workspace
# it shows has someone else in it, and its key is published only then.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
# The device's certificate authority the broker admits a join with: the
# identity store's selected identity and the devices it certifies now.
tilo-identity-authority = { path = "../identity-authority" }
# The person's accounts and the vault their secrets are sealed in: the session
# is the only holder of either, and answers Browser, Settings and Mail from
# them on the apps' own routes.
accounts = { path = "../../system/accounts" }
account-custody = { path = "../../system/account-custody" }
# The website session a selected custody entry holds, and what it opens.
browser-continuity = { path = "../../browser/browser-continuity" }
# The machine's readings, served to the apps the launcher connects at the
# socket they dial.
tilo-system-stats = { path = "../../system/system-stats" }
# The broker that serves the socket this session's apps speak on, and the
# provider seam it asks for what the services publish. Its channel encryption
# service governs the sealed channels a workspace's content is carried in.
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
# A branch of a workspace takes an app's own copy of a record into the
# workspace's, as every incoming change is taken in.
tilo-automerge = { path = "../../doc/tilo-automerge" }
# The person's other devices: what was copied here is shared through
# the same fabric as everything else that follows them.
tilo-device-fabric = { path = "../device-fabric" }
# The fabric's portable vocabulary: who a device is, the stamp a fact carries, fresh ids.
tilo-fabric-core = { path = "../../collab/fabric-core" }
# A sibling device's half of this device's disk key: the unlock exchange an
# early-boot client speaks, and the sealed halves each device holds of the
# other.
tilo-unlock-protocol = { path = "../../collab/tilo-unlock-protocol" }
# The sealed envelope a sibling half is carried in.
tilo-seal = { path = "../../system/tilo-seal" }
# The desktop's event sounds (a notification's ring, a screenshot's click).
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["voice", "pipewire", "realtime"] }
tilo-compositor = { path = "../compositor" }
# The session's own profiler: what its frame went on, recorded on the owner's
# request and read from the same door.
tilo-frame-metrics = { path = "../frame-metrics" }
# Each display's colour, as the compositor reads it from the sink.
tilo-color-pipeline = { path = "../color-pipeline" }
image = { workspace = true, features = ["png"] }
# An application's themed icon is an SVG as often as a PNG.
resvg = { version = "0.47", default-features = false }
tilo-surface-host = { path = "../surface-host" }
# The shell's package (`apps/tl/shell`), compiled as the session starts, and the desk's
# action vocabulary.
tilolang-tilo = { path = "../../platform/tilolang-tilo" }
# The outside origins the session's own services keep records in step with: the mail and
# YouTube connectors' clients, and the registry that makes an origin's connector reachable
# (`tilolang_tilo::origin::remote`).
tilolang-mail = { path = "../../platform/tilolang-mail", default-features = false }
tilolang-youtube = { path = "../../platform/tilolang-youtube" }
# The toolkit's words, which what a package the session runs publishes reads through.
tilo-ui-host = { path = "../../platform/tilo-ui-host" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
app-catalogue = { path = "../../packaging/app-catalogue" }
# The pictures the desk shows: the image's own, and the person's.
tilo-wallpapers = { path = "../../platform/tilo-wallpapers" }
# The registries' listing as this device last accepted it, for the apps a
# person can get.
app-cli = { path = "../../packaging/app-cli" }
# The login's own password check, when the machine's unlock helper is not
# installed: the conversation greetd admitted this session through.
greetd-client = { path = "../greetd-client" }
# The host's own filesystem moves a paste depends on: a rename that never
# overwrites a name, and the Trash a replaced name goes to.
host-fs = { path = "../../system/host-fs" }
# Where this device keeps its state: the root the record indexes are under.
tilo-cli-kit = { path = "../../runtime/cli" }
# The capture studio the session shows over the desktop, and the recorder
# that feeds it the compositor's frames.
tilo-capture-studio = { path = "../capture-studio" }
# The wireless display sheet speaks the projector service's control socket; the
# sender stacks themselves (Miracast, GStreamer) stay in the service.
tilo-projector = { path = "../../system/projector", default-features = false }
# A projection's frames are the share streams' encode: the desktop as the
# compositor draws it, through the one real-time encoder.
tilo-window-share = { path = "../window-share" }
# The sanctioned blocking HTTP client, which installs the crypto provider.
tilo-net = { path = "../../platform/tilo-net", features = ["blocking", "json"] }
# The identity record the launcher bound and the person's own: the directories
# whose changes a worker follows.
runtime-identity = { path = "../../runtime/runtime-identity" }
os-actions = { path = "../../system/os-actions" }
# The person's `network-usage` section, which this device's traffic totals are
# counted into, and the readings its verb takes.
settings-sections = { path = "../../system/settings-sections" }
# The calls an app joins: which channel, who is in it, and this device's
# own call as presence carries it.
tilo-native-media = { path = "../native-media" }
# The MCP projection of the action host, which the agent door serves a
# program of this login through once the person admits it.
tilo-runtime = { path = "../../runtime/tilo-runtime" }
# The host of an agent task's programs, which the door runs for each
# connection that sends one, and the sealed memfd its modules come in.
tilolang-host = { path = "../../platform/tilolang-host" }
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }
# The render service an app hands its frames to, started by this session as
# a mode of its own binary.
tilo-render-service = { path = "../render-service" }
# The kernel-attested custody of an executing app process a launch is
# admitted by.
runtime-portal = { path = "../../runtime/runtime-portal" }
# The wire the apps speak to the session's services, and where the launcher
# hands out its socket.
runtime-collab = { path = "../../runtime/runtime-collab" }
launcher = { path = "../../packaging/launcher" }
# The machine's power: the idle, lid, key and battery policy and the service
# over logind that acts on it.
tilo-session-power = { path = "../power-service" }
tilo-power-mgmt = { path = "../../system/power" }
# The records of a session that stopped, and the news of one that did.
tilo-crash-records = { path = "../crash-records" }
# The session's own log: its stderr, filtered as `RUST_LOG` says, and a crash
# record for every panic.
tilo-session-logging = { path = "../session-logging" }
# The runs of what people ask this session's agents to do: what the agent
# composer and a run's window follow, and what the broker delivers a run on.
# The watchdog that ends a session whose main loop stopped for good.
tilo-liveness = { path = "../liveness" }
# The room left on the person's filesystems, for the storage notice.
rustix = { workspace = true, features = ["fs", "process"] }
# Planning and starting the apps the person opens.
tilo-app-launch = { path = "../app-launch" }
# The udisks2 names the removable media are read and ejected by. The
# blocking client is left out: this session speaks to the bus itself.
block-devices = { path = "../../system/block-devices" }
tilo-connectivity-service = { path = "../connectivity-service" }
tilo-system-service = { path = "../system-service" }
tilo-settings-service = { path = "../settings-service" }
# The sound resource's specs, for the audio service the session starts.
tilo-audio-service = { path = "../audio-service", default-features = false }
# The desktop services the session starts on the buses; screen shares
# stream the frames the session captured.
tilo-portal = { path = "../portal", features = ["pipewire"] }
# The files a person chooses for apps: the session mounts the store the
# portal grants through, so every launcher finds an app's view to bind.
tilo-documents = { path = "../../system/documents", features = ["mount"] }
tilo-notifications-service = { path = "../notifications-service" }
tilo-polkit-agent = { path = "../polkit-agent" }
tilo-network-secret-agent = { path = "../network-secret-agent" }
# What a screenshot sent to another device is staged into: the same private
# spool, and the same resumable transfer, Files uses.
tilo-nearby-service = { path = "../nearby-service" }
# The speaker groups and remote audio those devices carry: the session pumps
# them on the fabric's pass and answers Settings from them.
tilo-speaker-service = { path = "../speaker-service" }
# The person's VPN profiles: a kill-switch profile that drops blocks this
# device's traffic, decided here and carried out by the root helper.
tilo-device-vpn = { path = "../../system/device-vpn", default-features = false, features = ["session"] }
tilo-bluetooth-agent = { path = "../bluetooth-agent" }
# The session's own surfaces (the desk, the bar, the switcher, the panels and
# the sheets) published over AT-SPI2: one AccessKit Unix adapter per surface,
# carrying the semantic tree the toolkit already builds. The tokio feature
# keeps its D-Bus executor on the workspace's single async runtime.
accesskit_unix = { version = "0.23.0", default-features = false, features = ["tokio"] }
tilo-tray-host = { path = "../tray-host" }
tilo-bluez = { path = "../../system/tilo-bluez" }
# The login screens' comforts go to tilo-authd over its socket protocol.
tilo-auth = { path = "../../system/tilo-auth", default-features = false }
# Checks a password for the lock screen, through the unlock helper.
bounded-command = { path = "../../system/bounded-command" }
# The line framing an app's shell-ui connection speaks.
wire-frame = { path = "../../system/wire-frame" }
xkeysym = "0.2.1"
zbus = { workspace = true, features = ["tokio"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The surface apps' sockets are handed to their children as descriptors.
libc.workspace = true
# The certificate a device was approved with, kept where the identity helper
# reads it once and taken away after.
tempfile.workspace = true
# A joined workspace's records are untrusted bytes: a worker process of this
# executable decodes them, and `main` serves that worker.
tilo-automerge-isolate.workspace = true
# Search reads the device's installed apps and the person's choices, and
# follows the directories its lists name.
tilo-desktop-search = { path = "../desktop-search", features = ["indexes", "settings", "catalogue"] }
settings-store = { path = "../../system/settings-store", features = ["watch"] }
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }

[dev-dependencies]
pollster.workspace = true
# A Rust app's views, drawn by the shell as it draws a tilolang app's (one-app-model.md §2):
# the sample catalogue's channels and videos, never the live worker.
tube = { path = "../../../apps/tube", default-features = false, features = ["samples"] }
# A development session's tilolang apps, built into signed `.tapp`s the tests install into
# their own app store: the same packages a development session installs.
tilolang-cli = { path = "../../lang/tilolang-cli" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
package-store = { path = "../../packaging/package-store", features = ["store"] }
# The events the actor hands the session, which its own tests hand the sync
# directly: the membership epoch on them is the actor's to mint.
tilo-network-actor = { path = "../network-actor", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A paste killed mid-transfer: the crash test's child process ends on a
# signal, as a power cut ends a machine.
libc.workspace = true
# A call's tone and played samples with no device stack: a test hears the
# same encoder, lane and playout a device's call uses.
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["voice", "test-support"] }
# Reporting an ending to a session's apps as its spawner would, with the
# memory cause a launcher remembers.
tilo-app-launch = { path = "../app-launch", features = ["test-support"] }
# The stand-in logind and UPower a power test serves over a socket pair.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
zbus = { workspace = true, features = ["tokio", "p2p"] }
tilo-test-env = { path = "../../dev/test-env" }
# The log a test's people write while it runs.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# A site's entry and directory served over loopback, for what joins list.
test-http = { path = "../../dev/test-http" }
# The broker's certified-connection context, for driving a service the way
# the broker admits Files.
tilo-action-broker = { path = "../../collab/tilo-action-broker", features = ["test-support"] }
# A site's workspace as a site runs it: the host on this machine that
# governs the workspace a join enrolls into, folding what its pages write,
# and the page of its person that recorded there first.
tilo-relay = { path = "../../hosting/tilo-relay", features = ["web"] }
# What `NetworkManager` says, fed in rather than read from a bus.
tilo-nm = { path = "../../system/tilo-nm" }
# The other device's tunnel and this one's, in memory, for what a route
# carries.
tilo-device-vpn = { path = "../../system/device-vpn", default-features = false, features = ["test-support"] }
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability", features = ["test-support"] }
# A relay host on this machine's loopback, which is what a test's devices relay through.
test-relay = { path = "../../dev/test-relay" }
futures-util.workspace = true
tilo-copy-lint = { path = "../../dev/copy-lint" }
# The threshold signature material a test identity key is made of, as the
# identity host's key holds it.
threshold-identity = { path = "../../collab/threshold-identity" }
tilo-audio-service = { path = "../audio-service" }
tilo-onboarding = { path = "../onboarding" }
# The prepared-setup and journal fixtures: what a device holds before setup runs.
tilo-onboarding-host = { path = "../onboarding-host", features = ["test-support"] }
tilo-quick-settings = { path = "../quick-settings", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
# The sheets' apps mounted for a person, so a test presses a control of one
# as the person's own gesture.
tilo-app = { path = "../../sdk/tilo-app", features = ["test-support"] }
wayland-client.workspace = true
# What a scanner reads from a code the session draws: the invite sheet's
# test decodes the invitation back out of its QR.
rqrr = { workspace = true, default-features = true }
# The text a field asks a keyboard for, as an app's toolkit speaks it.
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
# A display tool speaking `wlr-output-management` to the session's compositor.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The mount's own namespace, and the document its tree record is read as: a
# test runs the files daemon's writer against a session, as a mount does.
fs = { package = "tilo-fs", path = "../../system/fs", default-features = false, features = ["filesystem"] }
fs-protocol = { path = "../../system/fs-protocol" }
# The input method a text field's client runs for the seat, as the person's
# on-screen keyboard does.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# The action host a test's answering device runs its actions through, and the
# certified workspace two of one person's devices ask each other in.
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
tilo-peer-state = { path = "../../collab/tilo-peer-state", features = ["test-support"] }
# A change another device's app wrote, read back into a record: a receiver's
# way of taking changes, which the session's own code uses too.
tilo-automerge = { path = "../../doc/tilo-automerge" }
# A `wl_shm` client that commits once per key and times each key on its own
# clock: the app side of the key-latency measurement, which a compositor
# without a GPU import can still show.
smithay-client-toolkit = "0.20.0"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web has no system random source; the page supplies the browser's.
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh.workspace = true