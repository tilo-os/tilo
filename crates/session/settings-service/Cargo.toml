[package]
name = "tilo-settings-service"
description = "The session's settings service: the person's settings sections kept whether or not Settings is open, and every setting people look for by name published as an action that flips, picks or sets it."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# The providers the person set up, and the model agents answer with: the
# reading and the choice this service publishes over both provider sections.
agent-provider-config = { path = "../../integrations/provider-config", features = ["model"] }
serde.workspace = true
serde_json.workspace = true
settings-sections = { path = "../../system/settings-sections" }
settings-store = { path = "../../system/settings-store" }
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-service = { path = "../../desktop/service" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
