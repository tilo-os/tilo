[package]
name = "console-control"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilo-control action protocol served by a console session app (installer, greeter) that runs outside the Tilo compositor"

[lib]
name = "console_control"
path = "src/lib.rs"

# Pure transport + door logic: no ui, winit or rendering dependencies. The
# owning app delivers queued requests to its UI thread itself.
[dependencies]
tilo-paths.workspace = true
tilo-actions = { path = "../../collab/actions" }
serde_json.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["process"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
