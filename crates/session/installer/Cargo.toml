[package]
name = "installer"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "installer"
path = "src/lib.rs"

[[bin]]
name = "qos-installer"
path = "src/main.rs"

[dependencies]
# Mirrors the dep set used by the `ui`-based system apps (greeter /
# file-explorer): the toolkit plus the trait crates its `Widget` impls
# reference directly.
ui = { path = "../../../ui" }
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing-subscriber.workspace = true
os-actions = { path = "../../system/os-actions" }
zeroize.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
