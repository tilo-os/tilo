[package]
name = "installer"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "installer"
path = "src/lib.rs"

[features]
# Honour the developer environment overrides (`TILO_LIVE_TRIAL_STATE`) in a
# release build, exactly as a debug build does. See `live_desktop`.
#
# NEVER SHIP THIS. It lets the process be told that the live medium's trial
# state is somewhere else, which is how a test drives the real wizard against a
# temporary medium. A published medium runs a release binary without this
# feature, where the variable is inert.
dev-overrides = []

[[bin]]
name = "tilo-installer"
path = "src/main.rs"

[[bin]]
name = "tilo-live-trial-session"
path = "src/bin/tilo-live-trial-session.rs"

[dependencies]
accounts = { path = "../../system/accounts" }
account-custody = { path = "../../system/account-custody" }
calendar = { path = "../../../apps/calendar", default-features = false, features = ["live"] }
tilo-dav = { path = "../../system/tilo-dav", features = ["oauth"] }
tilo-seal = { path = "../../system/tilo-seal" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Mirrors the dep set used by the `ui`-based system apps (greeter /
# file-explorer): the toolkit plus the trait crates its `Widget` impls
# reference directly.
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing-subscriber.workspace = true
os-actions = { path = "../../system/os-actions" }
block-devices = { path = "../../system/block-devices" }
bounded-command = { path = "../../system/bounded-command" }
libc.workspace = true
tilo-power-mgmt = { path = "../../system/power", default-features = false }
zeroize.workspace = true
tempfile.workspace = true
url.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
uuid.workspace = true
tilo-actions = { path = "../../collab/actions" }
console-control = { path = "../console-control" }
install-profile-model = { path = "../install-profile-model" }
staging-handoff-model = { path = "../../../apps/staging-handoff-model" }
# The hardware probe and its report schema, shared with Tilo Imager so both
# doors observe a machine the same way and say the same thing about it.
imager-backend = { path = "../../platform/imager-backend" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-oauth = { path = "../../system/tilo-oauth", features = ["fake"] }
# The capacity test asks the same compiled rule that `tilo-guided-partition`
# delegates to, so a reviewed write extent is checked against production.
tilo-install-helpers = { path = "../../system/install-helpers" }
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }

[lints]
workspace = true
