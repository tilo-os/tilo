[package]
name = "tilo-speaker-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Speaker groups and remote audio across one person's devices: the groups, their timed playback routes, acoustic calibration, and the Settings api to them."

[lib]
name = "tilo_speaker_service"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
getrandom.workspace = true
hex.workspace = true
postcard.workspace = true
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["realtime", "voice", "pipewire"] }
rand_core.workspace = true
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab" }
tilo-actions = { path = "../../core/actions" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-resource = { path = "../../core/tilo-resource" }
serde.workspace = true
serde_json.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-network-actor = { path = "../../desktop/network-actor" }
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["apps"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false, features = ["model"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core" }

[dev-dependencies]
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
