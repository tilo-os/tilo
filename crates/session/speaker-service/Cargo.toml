[package]
name = "tilo-speaker-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Speaker groups and remote audio across one person's devices: the groups, their timed playback routes, acoustic calibration, and the Settings door to them."

[lib]
name = "tilo_speaker_service"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
getrandom.workspace = true
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime", "voice", "pipewire"] }
rand_core.workspace = true
runtime-collab = { path = "../../runtime/runtime-collab" }
serde_json.workspace = true
tilo-device-fabric = { path = "../device-fabric" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-network-actor = { path = "../network-actor" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", }

[dev-dependencies]
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["test-support"] }
postcard = { workspace = true, features = ["alloc"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
