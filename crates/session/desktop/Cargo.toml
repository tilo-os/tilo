[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

# One test binary for the crate's integration tests, whose files it includes as
# modules: a file per binary linked the whole crate once each.
[[test]]
name = "it"
path = "tests/it.rs"

[features]
# This desktop presents another device's shared window, so the surface
# decodes it into a tile. A screenless host that links this crate only for a
# contract it holds (an agent's member, with the receipt transport)
# turns it off and links no media stack.
default = ["peer-view"]
peer-view = ["tilo-desktop-surface/peer-view"]

[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
automerge.workspace = true
blake3.workspace = true
hex.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
collab-types = { path = "../../core/collab-types" }
tilo-actions = { path = "../../core/actions" }
tilo-action-policy = { path = "../../core/action-policy" }
tilo-app = { path = "../../sdk/tilo-app", default-features = false }
tilo-desktop-model = { path = "../../desktop/desktop-model" }
tilo-desktop-surface = { path = "../desktop-surface", default-features = false }
# Where each person here stands, as following reads them.
tilo-session-core = { path = "../../desktop/session-core" }
tilo-desktop-search = { path = "../../desktop/desktop-search" }
tilo-resource = { path = "../../core/tilo-resource" }
desktop-policy = { path = "../../desktop/default-apps", default-features = false }
tilo-app-id = { path = "../../core/tilo-app-id" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-failure = { path = "../../platform/tilo-failure" }
# The models an agent may plan with: the person's own provider settings.
agent-provider-config = { path = "../../integrations/provider-config" }
ed25519-dalek.workspace = true
# The bar's clock reads the weekday of the local time.
jiff.workspace = true
# The system monitor widget shows the session's own readings of the machine.
tilo-system-stats = { path = "../../os/system-stats" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
tilo-copy-lint = { path = "../../../tools/copy-lint" }
test-document-app = { path = "../../../tools/test-document-app" }
# The six windows the browser's launch demo opens, for the typing measurement
# (`tests/typing_desktop`, `examples/typing_perf`): what a keystroke in one of
# them costs with the others open beside it.
slides = { path = "../../../apps/slides" }
tilo-tts = { path = "../../engines/tts" }
tilo-activities = { path = "../activities" }
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false, features = ["test-support"] }

# The palette's proof that it stands over the windows: the compositor's own
# host of a widget tree, with the pixels it drew.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-shell-surface = { path = "../shell-surface" }
tilo-compositor = { path = "../../desktop/compositor" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ui = { package = "tilo-ui", path = "../../ui/ui-core" }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The browser runtime builds the desktop in wasm32 on the portable toolkit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
