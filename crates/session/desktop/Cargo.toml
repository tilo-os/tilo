[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

# One test binary for the crate's integration tests, whose files it includes as
# modules: a file per binary linked the whole crate once each.
[[test]]
name = "it"
path = "tests/it.rs"

[features]
# This desktop presents another device's shared window, so the surface
# decodes it into a tile. A screenless host that links this crate only for a
# contract it holds (an agent's participant, with the receipt transport)
# turns it off and links no media stack.
default = ["peer-view"]
peer-view = ["tilo-desktop-surface/peer-view"]
# The profile card is not linked into the desktop that holds it: the program
# fetches its code the first time a card opens and hands it over
# (`profile_card::PROFILE_CARD`); a quiet panel stands under the avatar until
# then. The browser desktop uses this to keep it out of its start module.
lazy-profile-card = []

[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
automerge.workspace = true
blake3.workspace = true
hex.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
tilo-action-policy = { path = "../../collab/action-policy" }
uuid.workspace = true
tilo-app = { path = "../../sdk/tilo-app", default-features = false }
tilo-desktop-model = { path = "../desktop-model" }
tilo-desktop-surface = { path = "../desktop-surface", default-features = false }
tilo-desktop-search = { path = "../desktop-search" }
# A report's transport and the profile custody a desktop installs.
tilo-feedback-transport = { path = "../../collab/feedback-transport" }
tilo-resource = { path = "../../sdk/tilo-resource" }
desktop-policy = { path = "../../system/desktop-policy", default-features = false }
tilo-clock = { path = "../../platform/tilo-clock" }
# The models an agent may plan with: the person's own provider settings.
agent-provider-config = { path = "../../agent/provider-config" }
ed25519-dalek.workspace = true
durable-store = { path = "../../system/durable-store" }
# The emoji picker's catalogue, search, skin tones and recents.
emoji = { path = "../../text/emoji" }
# The bar's clock reads the weekday of the local time.
chrono.workspace = true
# The system monitor widget shows the session's own readings of the machine.
tilo-system-stats = { path = "../../system/system-stats" }
# The same catalogue for the toolkit's shared picker, which the window bars'
# reaction pickers open.
tilo-emoji-catalogue = { path = "../../text/emoji-catalogue" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
tilo-copy-lint = { path = "../../dev/copy-lint" }
word-processor = { path = "../../../apps/word-processor" }
tilo-app-state = { path = "../../system/app-state" }
tempfile.workspace = true
notes = { path = "../../../apps/notes" }
# The six windows the browser's launch demo opens, for the typing measurement
# (`tests/typing_desktop`, `examples/typing_perf`): what a keystroke in one of
# them costs with the others open beside it.
sheets = { path = "../../../apps/sheets" }
calendar = { path = "../../../apps/calendar" }
calculator = { path = "../../../apps/calculator" }
slides = { path = "../../../apps/slides" }
tilo-tts = { path = "../../system/tts" }
tilo-activities = { path = "../activities" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false, features = ["test-support"] }

# The palette's proof that it stands over the windows: the compositor's own
# host of a widget tree, with the pixels it drew.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-surface-host = { path = "../surface-host" }
tilo-compositor = { path = "../compositor" }
tilo-session-core = { path = "../core" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The browser runtime builds the desktop in wasm32 on the portable toolkit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
