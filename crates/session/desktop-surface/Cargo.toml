[package]
name = "tilo-desktop-surface"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The portable desktop surface: tilo-desktop-model's strips, window groups and tabs as tilo-ui widgets, and the versioned navigation contract hosts expose."
repository.workspace = true
homepage.workspace = true

# The part of the shell's desktop that does not need a compositor: it builds
# on the portable `tilo-ui` build, so a browser page and the native shell can
# present the same model. Hosts supply tab contents through `TileSource`.

[features]
# Another device's shared window, decoded into its tile on this desktop. On by
# default for every desktop that draws windows; a screenless host that links
# this surface (a relay, an agent's participant) turns it off and links neither
# the media stack nor a decoder.
default = ["peer-view"]
peer-view = [
    "dep:neighbour-wire",
    "dep:tilo-callstream",
    "dep:tilo-media",
    "dep:tilo-color-pipeline",
    "dep:tilo-window-share",
    "dep:postcard",
]
# Leave the notification centre's code out of what the program starts
# with: it fetches it the first time the centre opens
# (`NOTIFICATION_CENTRE`).
lazy-notification-centre = []

[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
tilo-desktop-model = { version = "0.1.0", path = "../desktop-model" }
tilo-desktop-search = { version = "0.1.0", path = "../desktop-search" }
# Whether a grant an app holds is live now is a question about the clock.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The locator another device hands over, which a now-playing card offers to
# continue here. The portable decode only: a browser builds this too, and the
# media stack's realtime part is the native section's.
tilo-media = { version = "0.1.0", path = "../../platform/tilo-media", default-features = false }
serde.workspace = true
# The bar's clock reads the weekday of the local time.
chrono.workspace = true
hex.workspace = true
serde_json.workspace = true
# The workspace history pane reads causal documents and draws with the
# toolkit's renderer and input types.
automerge.workspace = true
tilo-automerge.workspace = true
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
blake3.workspace = true
uuid.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true

[dev-dependencies]
tilo-copy-lint = { path = "../../dev/copy-lint" }
# The integration tests count named scopes on the frame path.
tilo-resource = { path = "../../sdk/tilo-resource", features = ["test-support"] }
# Members' pointers are placed through the live plane's layout mapping
# against the windows and strip a desktop shows.
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# Another device's shared window: the wire it arrives on, the decoder that
# turns its units into pictures, the colour that tone-maps an HDR stream to
# this display, and the share's own rule for the input a viewer sends back.
# All four run the media stack, which has no wasm32 build and which a host
# without a screen (a relay, an agent's participant) never presents. They are
# the `peer-view` feature's, so such a host links this surface without them.
neighbour-wire = { version = "0.1.0", path = "../../collab/neighbour-wire", optional = true }
tilo-callstream = { version = "0.1.0", path = "../../collab/tilo-callstream", features = ["surface-decoder"], optional = true }
tilo-media = { version = "0.1.0", path = "../../platform/tilo-media", features = ["realtime"], optional = true }
tilo-color-pipeline = { version = "0.1.0", path = "../color-pipeline", optional = true }
# The share's registry and input vocabulary; the owner side's dmabuf staging
# (the one part that holds a host graphics stack) is not a viewer's.
tilo-window-share = { version = "0.1.0", path = "../window-share", default-features = false, optional = true }
# The input a viewer sends back is the wire's own encoding.
postcard = { workspace = true, optional = true }
# What the players on the session bus are, as the audio service publishes
# them: the now-playing reading is made from it. No browser has that bus, and
# no browser build links it.
audio = { package = "tilo-audio-service", version = "0.1.0", path = "../audio-service", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Search's palette is drawn and answered by the chrome over the windows: the
# keyboard tests drive it there, over the desk they hold.
tilo-desktop = { path = "../desktop" }
# The window-group tests reach a group's tab bar, which the toolkit offers
# tests in every profile through `test-support`.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false, features = ["test-support"] }
# The tests encode their own frames with the crate's encoder, as a sharing
# device does, and read the input events back off the wire.
tilo-callstream = { path = "../../collab/tilo-callstream", features = ["surface-decoder"] }
