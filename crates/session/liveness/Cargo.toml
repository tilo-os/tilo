[package]
name = "tilo-liveness"
description = "Whether the compositor's main loop is still turning, answered from threads of its own: heartbeats, every thread's state and backtraces, and the main thread's file-walk audit."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The thread dump records each thread's stack from its signal handler without
# allocating, and symbolizes it on the answering thread.
backtrace.workspace = true
# The heartbeat wakes the compositor's loop through one of its ping sources:
# the calloop smithay's loop is built on.
calloop = "0.14"
durable-store = { path = "../../system/durable-store" }
libc.workspace = true
# A dump names its frames from the executable's symbol table, read on the
# spot: resolving them through the debug information took longer than a hung
# compositor's watchdog can wait (src/symtab.rs).
object = { version = "0.39", default-features = false, features = ["elf", "read_core", "std"] }
rustc-demangle = "0.1"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies]
# A judged hang ends the process at once, without unwinding or flushing.
libc.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
