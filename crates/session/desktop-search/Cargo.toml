[package]
name = "tilo-desktop-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Desktop search shared by the native shell and the portable desktop surface: result kinds, the cross-provider ranking, portable providers and the palette session."
repository.workspace = true
homepage.workspace = true

# Builds on the portable `tilo-ui` build so the browser desktop and the native
# shell rank, group and present search results with one implementation.

[dependencies]
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
