[package]
name = "tilo-desktop-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Desktop search shared by the native shell and the portable desktop surface: result kinds, the cross-provider ranking, portable providers and the palette session."
repository.workspace = true
homepage.workspace = true

# Builds on the portable `tilo-ui` build so the browser desktop and the native
# shell rank, group and present search results with one implementation.

[features]
# Leave the search's code out of what the program starts with: it fetches
# it on first use (`DESKTOP_SEARCH`).
lazy-search = []
# The session's on-disk indexes: what apps publish of their content, and
# the bodies of the person's files. Native only.
indexes = ["dep:tilo-action-policy", "dep:tilo-files", "dep:tilo-lock", "dep:tilo-paths", "dep:tilo-reference", "dep:tempfile", "dep:tilo-search", "dep:tracing", "dep:walkdir"]
# Settings' pages and the settings on them, from Settings' own index.
# Native only.
settings = ["dep:settings-store"]
# The apps a person can get, from the catalogue the Store reads. Native
# only.
catalogue = ["dep:app-catalogue"]

[dependencies]
# Every Tilo app's manifest metadata: where it runs, its names and keywords.
app-fleet = { version = "0.1.0", path = "../../packaging/app-fleet" }
ui = { version = "0.1.0", package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
app-catalogue = { version = "0.1.0", path = "../../packaging/app-catalogue", optional = true }
settings-store = { version = "0.1.0", path = "../../system/settings-store", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy", optional = true }
# The watch that keeps the person's file names current.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["watch"], optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock", optional = true }
tilo-paths = { workspace = true, optional = true }
tilo-reference = { version = "0.1.0", path = "../../collab/reference", optional = true }
tilo-search = { version = "0.1.0", path = "../../sdk/search", features = ["disk"], optional = true }
tracing = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
serial_test.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
