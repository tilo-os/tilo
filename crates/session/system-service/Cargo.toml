[package]
name = "tilo-system-service"
description = "The session's system service: the power mode and the session's power actions, the system update, and the time zone (set, or following the device), published as resources whose actions change them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
bounded-command = { path = "../../platform/bounded-command" }
os-actions = { path = "../../system/os-actions" }
serde.workspace = true
serde_json.workspace = true
settings-store = { path = "../../system/settings-store" }
tilo-actions = { path = "../../core/actions" }
# What is booted, staged and rolled back to, as the deployment status socket lists it.
tilo-deployment-status = { path = "../../os/deployment-status" }
# Following the live update's state as it is written.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
tilo-location = { path = "../../platform/tilo-location" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-service = { path = "../service" }
# The resources' ids, actions and readings' types, which an app shares.
tilo-system-resources = { path = "../../platform/tilo-system-resources" }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
