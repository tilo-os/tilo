[package]
name = "tilo-control"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "tilo-control: drive a running Tilo desktop through its control sockets"

# Where the control sockets live, shared with the compositor that binds them.
[lib]
name = "tilo_control"
path = "src/lib.rs"

# A client of the control protocol only: no compositor, ui or rendering
# dependencies, so every image ships it at the cost of a small binary.
[[bin]]
name = "tilo-control"
path = "src/main.rs"

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-paths.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
