[package]
name = "qos-power"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "qos-power"
path = "src/main.rs"

[dependencies]
# Kept deliberately tiny — this is a systemd notify daemon that watches
# a single sysfs file. No async runtime, no serde, no clap.
notify = { workspace = true, features = ["macos_kqueue"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
