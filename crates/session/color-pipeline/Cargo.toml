[package]
name = "tilo-color-pipeline"
description = "The compositor's colour maths: SDR to HDR output encoding, HDR tone mapping, the HDR surface composite and its shaders, display capabilities and software dimming."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# Colorimetry and HDR10 metadata are the neighbour protocol's vocabulary.
neighbour-wire = { path = "../../collab/neighbour-wire" }
# The SDR white the person may choose is the settings' range.
settings-store = { path = "../../system/settings-store" }
# A display's colour is part of what the session publishes of its displays.
serde.workspace = true
# The session publishes it with its displays, so it describes itself as a reading.
tilo-resource = { path = "../../sdk/tilo-resource" }
vello.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
os-actions = { path = "../../system/os-actions" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }

[lints]
workspace = true
