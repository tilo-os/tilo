[package]
name = "tilo-portal"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The session's xdg-desktop-portal backend: file chooser, screenshots, settings, access and inhibit, asking the person through the session's questions"

[dependencies]
tilo-actions = { path = "../../collab/actions" }
tilo-service = { path = "../service" }
# Portal notifications are the session's notifications daemon's.
tilo-notifications-service = { path = "../notifications-service" }
tilo-resource = { path = "../../sdk/tilo-resource" }
# Holds taken for an app are the session's own inhibitions.
tilo-power-mgmt = { path = "../../system/power", default-features = false }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-accessibility-settings = { path = "../../platform/tilo-accessibility-settings" }
# The writable-folder choice the app-side chooser asks with.
tilo-dialogs.workspace = true
tilo-files = { path = "../../platform/tilo-files", features = ["json"] }
tilo-lockdown-policy = { path = "../tilo-lockdown-policy" }
tilo-paths.workspace = true
# Naming an unsandboxed requester by the installed app it runs.
tilo-desktop-entry = { path = "../../system/desktop-entry" }
# The person's default apps, for the links the portal opens.
desktop-policy = { path = "../../system/desktop-policy", default-features = false }
percent-encoding.workspace = true
base64.workspace = true
tilo-content-types = { path = "../../system/content-types" }
tilo-wallpapers = { path = "../../platform/tilo-wallpapers" }
# App master secrets: sealed legacy store, the device proof the Secret
# Service asks of its managers.
tilo-seal = { path = "../../system/tilo-seal" }
tilo-secrets = { path = "../../platform/tilo-secrets" }
hex.workspace = true
# Print jobs go to `lp` as argv, bounded in time and output.
bounded-command = { path = "../../system/bounded-command" }
rand.workspace = true
zeroize.workspace = true
rustix = { workspace = true, features = ["process"] }
settings-store = { path = "../../system/settings-store", features = ["watch"] }
# The theme the legacy toolkits' appearance keys are projected from.
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
futures-util.workspace = true
# EIS, the transport of the input portals: a server per session.
reis = { version = "0.7.1", features = ["calloop"] }
calloop = "0.14"
hex.workspace = true
uuid.workspace = true
# The producer side of screen share streams, for a session feeding them
# frames it captured.
pipewire = { version = "0.10.1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync"] }
tracing.workspace = true
url.workspace = true
zbus = { workspace = true, features = ["tokio"] }
workspace-hack = { version = "0.1" }

[features]
pipewire = ["dep:pipewire"]

[dev-dependencies]
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
