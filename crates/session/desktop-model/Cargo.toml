[package]
autotests = false
name = "tilo-desktop-model"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The canonical Tilo desktop model shared by every host."

# The canonical desktop model: workspaces, strips, window groups, tabs and the
# people and permissions attached to them. Pure data and pure functions — no
# compositor, toolkit, transport, async runtime or host filesystem, so every
# host (native compositor, headless peer, anything else) shares one model.
# `tools/policy/check_desktop_model_dependencies.py` enforces that list.

[dependencies]
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
automerge.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
desktop-policy = { version = "0.1.0", path = "../../system/desktop-policy", default-features = false }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-automation = { version = "0.1.0", path = "../../collab/automation" }
uuid.workspace = true
web-time = "1"

[dev-dependencies]
# Tests take a peer's changes in the way production does (clippy.toml).
tilo-automerge.workspace = true
# The binary form owner commits carry task records in.
postcard = { workspace = true, features = ["alloc"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
