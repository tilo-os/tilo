[package]
name = "greeter"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "greeter"
path = "src/lib.rs"

[[bin]]
name = "tilo-greeter"
path = "src/main.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Mirrors the dep set used by the in-tree `ui`-based apps
# (file-explorer / terminal): the toolkit plus the trait crates its
# `Widget` impls reference directly.
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tilo-startup-metrics = { version = "0.1.0", path = "../../system/tilo-startup-metrics" }
zeroize.workspace = true
bounded-command = { path = "../../system/bounded-command" }
greetd-client = { path = "../greetd-client" }
console-control = { path = "../console-control" }
serde_json.workspace = true
settings-store = { path = "../../system/settings-store" }
wayland-client.workspace = true
wayland-protocols-wlr = { version = "0.3.10", features = ["client"] }
rustix = { workspace = true, features = ["event"] }
# The sign-in screen's clock reads local time, as the lock screen's does.
chrono = { workspace = true, features = ["clock", "std"] }
# Battery level and charging state for the status corner, read from sysfs.
tilo-power-mgmt = { path = "../../system/power", default-features = false }
workspace-hack = { version = "0.1" }
tilo-paths.workspace = true
# A person's face, as the boot sign-in screen draws it too (`boot_look`).
tilo-face = { version = "0.1.0", path = "../../platform/tilo-face" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }
tempfile.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }

[lints]
workspace = true
