[package]
name = "greeter"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "greeter"
path = "src/lib.rs"

[[bin]]
name = "tilo-greeter"
path = "src/main.rs"

[dependencies]
# Mirrors the dep set used by the in-tree `ui`-based apps
# (file-explorer / terminal): the toolkit plus the trait crates its
# `Widget` impls reference directly.
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
bounded-command = { path = "../../system/bounded-command" }
# greetd's wire protocol. `sync-codec` pulls in the blocking
# `SyncCodec` (`Request::write_to` / `Response::read_from` over
# `std::io::{Read,Write}`) — no async runtime needed for a login box.
greetd_ipc = { version = "0.10", features = ["sync-codec"] }

[dev-dependencies]

[lints]
workspace = true
