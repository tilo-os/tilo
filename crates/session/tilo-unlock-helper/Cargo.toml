[package]
name = "tilo-unlock-helper"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Privileged in-session password-verify helper the compositor spawns to unlock a locked session via PAM."

[[bin]]
name = "tilo-unlock-helper"
path = "src/main.rs"

[dependencies]
# libc provides dlopen/dlsym/malloc/strdup. libpam is loaded at runtime
# rather than linked at build time (no `-lpam` or pam-devel is needed): the module is
# loaded at runtime with dlopen("libpam.so.0"), which is always present on
# a PAM system. This keeps the helper buildable on hosts without pam-devel
# and keeps the OS image's compile-time deps unchanged.
libc = "0.2"
workspace-hack = { version = "0.1" }

[lints]
workspace = true
