[package]
name = "tilo-session-core"
description = "The session's roles that every host runs: the layout's own document and, as they move here, the layout it holds."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
automerge.workspace = true
# The pointer shapes a surface asks for: the same type the toolkit and the compositor name, so one
# shape crosses the boundary unconverted.
cursor-icon = "1"
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-desktop-model = { path = "../desktop-model" }
# The layout as the surfaces draw it and the person arranges it: the handle the layout changes
# and the search text typed on the canvas places through.
tilo-desktop-search = { path = "../desktop-search" }
# The live session's members, as every surface reads them, and the tiles pointers land on.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The presence track's schedule and the tiles its pointers land on, as the page's own live session
# already runs them.
tilo-live = { path = "../../collab/tilo-live", features = ["live_session"] }
# The undo log and the clock are the toolkit's shared, portable parts.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
# The layout's actions and the items it publishes are declared with the resource macros.
tilo-resource = { path = "../../sdk/tilo-resource" }
# A request another device answers, and the lock that holds what waits for it.
# A place found by text whose search answers later says why when it places nothing: the person
# typed it, so a refusal the row did not show is told.
tracing.workspace = true
# The desktop's model ([`desktop`]): what a notice says as a session service tells it, the sorted
# lists, the locks and the clock its records read, the media locator a now-playing card continues,
# the workspace history's causal documents and file versions, and the grants an app holds.
tilo-service = { version = "0.1.0", path = "../service" }
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-media = { version = "0.1.0", path = "../../platform/tilo-media", default-features = false }
hex.workspace = true
tilo-automerge.workspace = true
fs-protocol = { version = "0.1.0", path = "../../system/fs-protocol" }
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
tilo-app-id = { version = "0.1.0", path = "../../platform/tilo-app-id" }
blake3.workspace = true
uuid.workspace = true
web-time = "1"
# The sweep that answers requests past their deadline, on the page's own thread.

# The hack unifies the workspace's native features; this crate also builds for
# wasm32, where it would drag mio in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
# What the players on the session bus are, as the audio service publishes them: the now-playing
# reading is made from it. No browser has that bus.
audio = { package = "tilo-audio-service", version = "0.1.0", path = "../audio-service", default-features = false }

[dev-dependencies]
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
tilo-copy-lint = { path = "../../dev/copy-lint" }
tilo-resource = { path = "../../sdk/tilo-resource", features = ["test-support"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
