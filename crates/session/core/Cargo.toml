[package]
name = "tilo-session-core"
description = "The session's roles that every host runs: the desk's own document and, as they move here, the arrangement it holds."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-desktop-model = { path = "../desktop-model" }
# The desk as the surfaces draw it and the person arranges it: the handle the arrangement changes
# and the search text typed on the canvas places through.
tilo-desktop-search = { path = "../desktop-search" }
tilo-desktop-surface = { path = "../desktop-surface", default-features = false }
# The plane's members, as every surface reads them, and the tiles pointers land on.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The presence plane's schedule and the tiles its pointers land on, as the page's own plane
# already runs them.
tilo-live = { path = "../../collab/tilo-live", features = ["plane"] }
# The undo log and the clock are the toolkit's shared, portable parts.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }

# The hack unifies the workspace's native features; this crate also builds for
# wasm32, where it would drag mio in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
