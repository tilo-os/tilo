[package]
name = "tilo-session-core"
description = "The session's roles that every host runs: the desk's own document and, as they move here, the arrangement it holds."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
automerge.workspace = true
# The pointer shapes a surface asks for: the same type the toolkit and the compositor name, so one
# shape crosses the seam unconverted.
cursor-icon = "1"
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-desktop-model = { path = "../desktop-model" }
# The desk as the surfaces draw it and the person arranges it: the handle the arrangement changes
# and the search text typed on the canvas places through.
tilo-desktop-search = { path = "../desktop-search" }
tilo-desktop-surface = { path = "../desktop-surface", default-features = false }
# The plane's members, as every surface reads them, and the tiles pointers land on.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The presence plane's schedule and the tiles its pointers land on, as the page's own plane
# already runs them.
tilo-live = { path = "../../collab/tilo-live", features = ["plane"] }
# The undo log and the clock are the toolkit's shared, portable parts.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
# The event sounds a notice makes, played by the host that shows it.
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
# A request another device answers, and the lock that holds what waits for it.
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# A place found by text whose search answers later says why when it places nothing: the person
# typed it, so a refusal the row did not show is told.
tracing.workspace = true
web-time = "1"
# The sweep that answers requests past their deadline, on the page's own thread.
n0-future = "0.3"

# The hack unifies the workspace's native features; this crate also builds for
# wasm32, where it would drag mio in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
