[package]
name = "tilo-surface-host"
description = "Runs the shell's surface apps (top bar, launcher, panels) inside the compositor's process: drives each toolkit app, draws its frames on the GPU as the compositor's layers and hands it the input that lands on them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tilo-compositor = { path = "../compositor" }
tilo-desktop-policy = { path = "../desktop-policy" }
tilo-desktop-surface = { path = "../desktop-surface" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
# Where a machine with no GPU adapter draws a surface's frames.
tilo-cpu-raster = { version = "0.1.0", path = "../../sdk/tilo-cpu-raster" }
vello.workspace = true
winit.workspace = true
# The buffers the compositor shows (memory render buffers).
serde_json.workspace = true
tracing.workspace = true
# Files dropped on an app arrive as `file:` URIs.
url.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
tilo-topbar = { path = "../topbar" }

[lints]
workspace = true
