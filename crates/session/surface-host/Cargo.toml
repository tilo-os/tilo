[package]
name = "tilo-surface-host"
description = "Runs the shell's surface apps (top bar, launcher, panels) inside the compositor's process: drives each toolkit app, draws its frames on the GPU as the compositor's layers and hands it the input that lands on them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tilo-compositor = { path = "../compositor" }
tilo-desktop-policy = { path = "../desktop-policy" }
tilo-desktop-surface = { path = "../desktop-surface" }
# The arrangement's readings, which every host's arrangement holds.
tilo-session-core = { path = "../core" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
vello.workspace = true
winit.workspace = true
# The buffers the compositor shows (memory render buffers).
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
# A tilolang shell's parts: its views run in an instance, drawn through the UI host's half
# of a window, over a record of the shell's own (`shell_part`).
tilolang-tilo = { path = "../../platform/tilolang-tilo" }
# The render node a GPU is named by, as the compositor names it.
tilo-presentation = { path = "../../platform/tilo-presentation" }
tilo-ui-host = { path = "../../platform/tilo-ui-host" }
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }
# Frames drawn on the GPU are delivered in the dma-bufs apps' frames are.
tilo-render-service = { path = "../render-service" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-action-policy = { path = "../../collab/action-policy" }
# The shell is an installed package, as every app is: the session reads it from the person's
# app store, and this build's copy only stands in where the store holds none (shell.md §6).
app-catalogue = { path = "../../packaging/app-catalogue" }
package-store = { path = "../../packaging/package-store" }
chrono = { workspace = true, features = ["std"] }
# Files dropped on an app arrive as `file:` URIs.
url.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
# What a tab holds, as the desk's own tree keeps it.
tilo-desktop-model = { path = "../desktop-model" }
# A room's records as the session publishes them, for the places that compose their views.
tilo-service = { path = "../service" }

[lints]
workspace = true
