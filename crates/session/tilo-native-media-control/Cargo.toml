[package]
name = "tilo-native-media-control"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Native device side of media control: HTTP session proofs, grants, relay and presence over delivery v3, signed only through a borrowed owner view"

[dependencies]
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
tilo-room = { path = "../../collab/tilo-room" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
collab-types = { path = "../../collab/collab-types" }
ed25519-dalek.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
automerge.workspace = true
tilo-automerge-isolate.workspace = true
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
uuid.workspace = true

[lints]
workspace = true
