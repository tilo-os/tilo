[package]
name = "tilo-vision-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The device's image model as actions: describe, read text, name what a picture shows, find faces, and the library analysis job the system index reads"

[dependencies]
tilo-actions = { path = "../../collab/actions" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-service = { path = "../service" }
tilo-lock = { path = "../../platform/tilo-lock" }
tilo-content = { path = "../../system/content" }
tilo-content-device = { path = "../../system/content-device" }
tilo-image-codec = { path = "../../platform/tilo-image-codec" }
tilo-model-client = { path = "../../agent/model-client", default-features = false }
tilo-ocr = { path = "../../media/ocr" }
tilo-vision = { path = "../../media/vision" }
agent-provider-config = { path = "../../integrations/provider-config" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
# The connection this session's service holds to the model gateway, made as
# the launcher makes one for an app it starts.
launcher = { path = "../../packaging/launcher" }
runtime-portal = { path = "../../runtime/runtime-portal" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
