[package]
name = "qos-ntfs-helper"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
qos-ntfs-protocol = { path = "../qos-ntfs-protocol" }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
wire-frame = { path = "../../system/wire-frame" }

[lints]
workspace = true

[[bin]]
name = "qos-ntfs-probe"
path = "src/main.rs"

[[bin]]
name = "qos-ntfs-image-test"
path = "src/bin/image_test.rs"
