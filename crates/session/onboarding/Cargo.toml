[package]
name = "tilo-onboarding"
description = "First use as an app the shell hosts: creating or bringing back an identity, its backup, a prepared setup and the transfers it carries over, the media formats offer and the tour."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
zeroize.workspace = true

[dev-dependencies]
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
