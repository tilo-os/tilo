[package]
name = "tilo-notification-banners"
description = "The desktop's notification banners as an app: the banner stack and the machine-wide banners, their actions, and the feed the desktop lends them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-notification-banners"
path = "src/main.rs"

[dependencies]
tilo-desktop = { path = "../desktop" }
# A framework app: the banners' resource, effects and surface.
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
vello.workspace = true
winit.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
base64.workspace = true
image = { workspace = true, features = ["png"] }
tilo-compositor = { path = "../compositor" }
# The session that starts the banners, and the headless presentation it runs.
tilo-session = { path = "../session" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
