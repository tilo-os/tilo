[package]
name = "tilo-session-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "What a session service publishes: its resources and actions, and the questions it asks the person at the device"

[dependencies]
tilo-actions = { path = "../../collab/actions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
zeroize.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
