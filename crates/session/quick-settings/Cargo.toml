[package]
name = "tilo-quick-settings"
description = "The desktop's Quick Settings panel as an app: its resource, effects and views, the readings the desktop lends it, and the device status line the top bar shares."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-quick-settings"
path = "src/main.rs"

[features]
# The radio dispatcher fixture and the panel's test hooks, for the shell's
# tests that drive the panel inside a whole chrome.
test-support = []

[dependencies]
# The sound the audio service reads and publishes, and the client side of
# its lines for what plays.
audio = { package = "tilo-audio-service", path = "../audio-service", default-features = false }
# What the radios, the links and the networks are, as the connectivity
# service publishes them.
connectivity = { package = "tilo-connectivity-service", path = "../connectivity-service" }
os-actions = { path = "../../system/os-actions" }
media = { package = "tilo-media", path = "../../platform/tilo-media" }
serde.workspace = true
settings-store = { path = "../../system/settings-store", features = ["watch"] }
# The readings the power service publishes are the battery's and the sleep
# policy's own shapes.
tilo-power-mgmt = { path = "../../system/power", features = ["service"] }
# The one now-playing reading, which the desk's music widget, the lock
# screen's card and the bar's pill show as this panel does.
tilo-desktop-surface = { path = "../desktop-surface", default-features = false }
tracing.workspace = true
# A framework app: the panel's resource, effects and views.
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The audio service the session hosts, as a test's own: a card in memory.
audio = { package = "tilo-audio-service", path = "../audio-service", features = ["service"] }
image = { workspace = true, features = ["png"] }
serde_json.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-compositor = { path = "../compositor" }
tilo-quick-settings = { path = ".", features = ["test-support"] }
tilo-service = { path = "../service" }
# The session that starts the panel, and the headless presentation it runs.
tilo-session = { path = "../session" }
tilo-test-env = { path = "../../dev/test-env" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }
# What an external reader asks the panel's accessibility tree over AT-SPI2,
# and the buses and processes the test reads it across.
atspi-proxies = { version = "0.13.0", default-features = false, features = ["wrappers", "tokio"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
zbus = { workspace = true, features = ["tokio"] }
tempfile.workspace = true

[lints]
workspace = true
