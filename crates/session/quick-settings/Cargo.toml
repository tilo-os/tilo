[package]
name = "tilo-quick-settings"
description = "The desktop's Quick Settings panel: its page, sections and state, and the device status line the top bar shares."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# The radio dispatcher fixture and the panel's test hooks, for the shell's
# tests that drive the panel inside a whole chrome.
test-support = []

[dependencies]
os-actions = { path = "../../system/os-actions" }
parking_lot.workspace = true
settings-store = { path = "../../system/settings-store", features = ["watch"] }
tilo-desktop = { path = "../desktop" }
tilo-power-mgmt = { path = "../../system/power" }
tracing.workspace = true
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
vello.workspace = true
winit.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The panel's pixel tests rasterise a page on the CPU.
tilo-cpu-raster = { path = "../../sdk/tilo-cpu-raster" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }

[lints]
workspace = true
