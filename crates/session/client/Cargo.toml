[package]
name = "tilo-session-client"
description = "A participant's client of the collaboration plane: the workspaces it takes part in, who is here in each, and this device's own word on them, over whatever transport the host brings."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# The answer to a command, which a page awaits and a program waits on.
oneshot.workspace = true
# The desk's model: the workspaces a participant takes part in, and the windows presence places
# people in.
tilo-desktop-model = { path = "../desktop-model" }
# The toolkit's clock and presence vocabulary, which a participant's face is drawn with on every
# host.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { path = "../../collab/collab-types" }
# The workspace's live plane: the board of who is here, and the tracks presence travels on.
tilo-live = { path = "../../collab/tilo-live", features = ["plane"] }
# This device's workspaces as its host keeps them, and where a device hosting one is reached.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# The certificates that say which person a device belongs to, and their revocations.
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# What members say on a workspace's plane.
neighbour-wire = { path = "../../collab/neighbour-wire" }
tilo-clock = { path = "../../platform/tilo-clock" }
# How a workspace numbers itself on the plane.
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# Why a session's entry or a member's question to its host found no answer.
tilo-relay-client = { path = "../../hosting/tilo-relay-client", default-features = false }
# What asking another device's actions hears back.
tilo-session-core = { path = "../core" }
# The action a message from another member is, and the claims access answers it with, holding
# every message to the workspace's own policy.
tilo-action-policy = { path = "../../collab/action-policy" }
# This device's channels: the groups its workspaces' sealed records are in, and the governance that
# settles who reads each one.
tilo-channels = { path = "../../collab/channels" }
channel-crypto = { path = "../../collab/channel-crypto" }
# The channel state and ingress gates a workspace's sealed records are held to, as the broker keeps
# them on every host.
tilo-broker-core = { path = "../../collab/broker-core" }
# The vault's master key: the platform secret store, or the sealed file store a headless machine
# names.
tilo-secrets.workspace = true
tilo-paths.workspace = true
# A freshly drawn vault key.
getrandom.workspace = true
sha2.workspace = true
zeroize.workspace = true
rand_core.workspace = true
serde_json.workspace = true
# This device signs its workspaces' commits with its own key.
ed25519-dalek.workspace = true
blake3.workspace = true
# The map beside every board.
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The id a membership command is asked under.
uuid.workspace = true
# This device's identity: the certificate it presents and the key it signs with, from the store
# its host keeps them in.
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
# The endpoint every device dials: presence names a publisher and where it is reached with it.
iroh-base.workspace = true
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
hex.workspace = true
tracing.workspace = true

[dev-dependencies]
web-time = { version = "1", features = ["serde"] }
# A state directory for an engine, and a vault root for the channel state kept in it.
tempfile.workspace = true
# A workspace's documents are automerge, which a test binary serves from its own workers.
tilo-automerge-isolate.workspace = true
# A fresh node key for each fixture device that answers on the network.
tilo-test-env = { path = "../../dev/test-env" }

[target.'cfg(target_os = "linux")'.dependencies]
# Where a workspace's own host is reached, as an invitation names it for the joiner.
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
# A vault key an earlier build left with `secret-tool`, moved into the platform store.
bounded-command = { path = "../../system/bounded-command" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh.workspace = true
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web has no system random source; the page supplies the browser's.
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
