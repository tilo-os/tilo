[package]
name = "tilo-frame-metrics"
description = "The compositor's frame-loop instrumentation: per-tick phase timings, present pacing, input-to-present latency, CPU traces and on-demand profiles."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-paths.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
