[package]
name = "tilo-notifications-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The org.freedesktop.Notifications daemon: what apps send, handed to the session"

[dependencies]
tilo-actions = { path = "../../collab/actions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-service = { path = "../service" }
# The installed Flatpaks a sender's sandbox metadata is checked against.
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
# Ends an ongoing notification when its sender leaves the bus.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing.workspace = true
zbus = { workspace = true, features = ["tokio"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-copy-lint = { path = "../../dev/copy-lint" }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
zbus = { workspace = true, features = ["p2p", "tokio"] }

[lints]
workspace = true
