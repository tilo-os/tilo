tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
tilo-control = { path = "../control-cli" }
ed25519-dalek.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

