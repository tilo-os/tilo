[package]
name = "install-plan"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "An install plan for a machine at another place: the choices it makes or leaves open, the single-use token it enrolls with, and where the person's devices keep it."

[dependencies]
