[package]
name = "tilo-wayland-ext"
description = "Wayland extension protocols the compositor implements outside smithay's handlers (color-management-v1), and the EDID parsing behind them."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# Colorimetry and HDR10 metadata are the neighbour protocol's vocabulary, so a
# shared surface keeps the description its client attached.
neighbour-wire = { path = "../../collab/neighbour-wire" }
# A monitor's identity, read from its EDID, is the key a saved display
# layout follows between ports.
settings-store = { path = "../../system/settings-store" }
# The colour a display reports is the colour pipeline's to describe; this
# crate only parses the bytes that carry it.
tilo-color-pipeline = { path = "../color-pipeline" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
wayland-protocols = { version = "0.32.12", features = ["server", "staging"] }

[lints]
workspace = true
