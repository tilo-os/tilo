[package]
name = "tilo-audio-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The session's audio and media helper as its own process: persistent audio transforms, hotplug follow and pause, the device events the compositor sounds, and the one MPRIS client that follows and drives media players."

[lib]
name = "tilo_audio_service"
path = "src/lib.rs"

[[bin]]
name = "tilo-audio"
path = "src/main.rs"
required-features = ["service"]

[features]
# The helper itself. The compositor depends on the library without it, for
# the line format and the handoff rules alone.
default = ["service"]
service = [
    "dep:futures-util",
    "dep:image",
    "dep:settings-store",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zbus",
    "dep:libc",
]

[dependencies]
base64.workspace = true
blake3.workspace = true
media = { package = "tilo-media", path = "../../platform/tilo-media" }
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
futures-util = { workspace = true, optional = true }
image = { workspace = true, features = ["jpeg", "png", "webp"], optional = true }
settings-store = { path = "../../system/settings-store", features = ["watch"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
zbus = { workspace = true, features = ["tokio"], optional = true }
libc = { workspace = true, optional = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# The idle-thread check that proves the worker sleeps with no timer.
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
