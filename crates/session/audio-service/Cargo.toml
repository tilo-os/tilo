[package]
name = "tilo-audio-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The session's audio as its own process: the sound resource (outputs, inputs, volume) and its actions, persistent audio transforms, hotplug follow and pause, and the device arrival and departure events the compositor sounds."

[lib]
name = "tilo_audio_service"
path = "src/lib.rs"

[[bin]]
name = "tilo-audio"
path = "src/main.rs"
required-features = ["service"]

[features]
# The helper itself. The session depends on the library without it, for the
# line formats and the sound resource's specs alone.
default = ["service"]
service = [
    "dep:media",
    "dep:settings-store",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zbus",
    "dep:libc",
]

[dependencies]
media = { package = "tilo-media", path = "../../platform/tilo-media", optional = true }
settings-store = { path = "../../system/settings-store", features = ["watch"], optional = true }
serde_json.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
zbus = { workspace = true, features = ["tokio", "blocking-api"], optional = true }
libc = { workspace = true, optional = true }
serde.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-resource = { path = "../../sdk/tilo-resource" }
# The sound resource, served to the session over lines (`--serve`).
tilo-service = { path = "../service" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The idle-thread check that proves the worker sleeps with no timer.
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
