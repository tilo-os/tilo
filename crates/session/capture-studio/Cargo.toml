[package]
name = "tilo-capture-studio"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The capture studio: taking a screenshot, recording the screen into a file and keeping the replay buffer, as an app whose actions anyone can invoke."

[lib]
name = "tilo_capture_studio"
path = "src/lib.rs"

[[bin]]
name = "tilo-capture-studio"
path = "src/main.rs"

[dependencies]
# The encoder and the muxer are the shared media stack's: a recording is the
# same encode a share stream uses, written to a file instead of a peer.
tilo-callstream = { path = "../../collab/tilo-callstream", features = ["recording"] }
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime"] }
# The studio is an overlay app the session opens and closes: it shares that
# presentation with the session the way every sheet does.
tilo-sheets = { path = "../sheets" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
vello.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
# A test drives the receipt's frames at instants it chooses, so animation
# cannot move what is on screen between two of them.
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }

[lints]
workspace = true
