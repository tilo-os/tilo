[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "shell"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# Explicit native RAM custody qualification: requires a qualified tmpfs backing
# or permission to create a noswap fixture in a private mount namespace.
signal-profile-native-test = []
netns-e2e = []
# Integration-only native broker fixtures. This forwards the shared broker's
# equally gated fixture entry point; ordinary shell spawning never selects it.
test-support = ["tilo-action-broker/test-support", "dep:tilo-net", "ui/test-support"]
# When set, the hosted-mode compositor (`shell --backend winit`) binds
# the TILO_TEST_CONTROL Unix socket the same way the headless backend
# does. A background thread reads JSON commands and injects equivalent
# `ui::UserEvent`s into the App via winit's `EventLoopProxy`. Disable
# in production builds to drop the test surface (`--no-default-features
# --features ...`).
default = ["hosted-test-control"]
hosted-test-control = []
# Stamps a build marker into the binary (see `compositor::dev_env`) so the
# host session RPM's *developer* entry can tell a deliberately-built dev
# compositor from any other executable before logging into it. Non-default,
# and inert unless `debug_assertions` or `dev-overrides` is also on, so a plain
# `--release --features dev-session` build never carries the marker. It enables
# no behaviour on its own — the marker is the entire content of the feature.
dev-session = []
# Honour the developer environment overrides (`TILO_TEST_CONTROL`,
# `TILO_TEST_STATE_DUMP`, `TILO_LOCK_TEST_PASSWORD`, `TILO_UNLOCK_HELPER`,
# `TILO_LAUNCHER_BIN`, the app/runtime overlay forwarding) in a release build,
# exactly as a debug build does. See `compositor::dev_env`.
#
# NEVER SHIP THIS. A `dev-overrides` binary accepts a fixed lock-screen
# password from its environment and opens a socket that drives the session as
# the user. It exists only so dev VM images can run release-speed binaries
# that harnesses can still drive. `tools/policy/check_dev_overrides_contract.py`
# fails the policy suite if a production image build enables it.
dev-overrides = ["tilo-identity-host/throwaway-test-identity"]
# Honour `TILO_AGENT_CONTROL` on the headless backend: a socket serving the
# input, clipboard and screenshot subset of the control protocol, for a hosted
# machine an agent drives (no local person, no lock screen). Non-default and
# independent of `dev-overrides`; desktop and OS images never enable it.
agent-control = []

[[bin]]
name = "network-boundary-fixture"
path = "tests/fixtures/network-boundary.rs"
test = false
bench = false
required-features = ["test-support"]

[dependencies]
# Read the app SDK snapshot only in the owned native boundary fixture.
tilo-net = { path = "../../platform/tilo-net", optional = true }

agent-provider-config = { path = "../../agent/provider-config" }
fnv.workspace = true
tilo-advisory-lock = { path = "../../system/advisory-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
# The governor's per-application open action a hosted room's launches use.
tilo-desktop = { path = "../desktop" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-automerge-isolate.workspace = true
tilo-moq = { path = "../../hosting/tilo-moq", features = ["relay"] }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { path = "../../platform/tilo-files", features = ["json"] }
bounded-command = { path = "../../system/bounded-command" }
# The MLS vault's master and signer keys: Secret Service or Keychain.
tilo-secrets.workspace = true
# Owner- and link-checked private files (sandboxed app logs, crash reports).
private-fs = { path = "../../system/private-fs" }
tempfile.workspace = true
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../system/settings-store", features = ["watch"] }
notify.workspace = true
tilo-paths.workspace = true
# Where the control sockets live, shared with the `tilo-control` client.
tilo-control = { path = "../control-cli" }
# The emoji picker's catalogue, search, skin tones and recents.
emoji = { path = "../../text/emoji" }
# Remembered network secrets (802.1X, VPN, SIM PIN) are sealed here, never
# written to settings.
tilo-secret-vault = { path = "../../system/secret-vault" }
# The speech backend the toolkit screen reader uses, for narrating chrome.
tilo-tts = { path = "../../system/tts" }
tilo-startup-metrics = { path = "../../system/tilo-startup-metrics" }
desktop-policy = { path = "../../system/desktop-policy" }
# Canonical desktop model: workspaces, strips, groups, tabs, permissions.
tilo-desktop-model = { path = "../desktop-model" }
tilo-desktop-search = { path = "../desktop-search" }
# Durable lockdown policy behind the Lockdown portal and native media gates.
tilo-lockdown-policy = { path = "../tilo-lockdown-policy" }
tokio = { workspace = true, features = ["full"] }
tilo-rt.workspace = true

serde.workspace = true
# `raw_value`: the control socket splices a tree serialised once into its reply.
serde_json = { workspace = true, features = ["raw_value"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
# Every sealing construction (per-device envelopes, the portal store) goes
# through the reviewed tilo-seal crate.
tilo-seal = { path = "../../system/tilo-seal" }
rustls.workspace = true
rcgen.workspace = true
chrono = { workspace = true, default-features = true }
uuid.workspace = true
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
qcms.workspace = true

iroh.workspace = true
iroh-base.workspace = true
iroh-gossip.workspace = true
iroh-mdns-address-lookup.workspace = true
bytes.workspace = true
blake3.workspace = true

# Structured error type for DRM backend construction. Bubbles up clean error
# messages to the binary entry point instead of
# panicking — the host machine (Gnome already holds the seat) needs the
# `--backend drm` path to fail cleanly with a useful diagnostic.
thiserror.workspace = true
# File URIs and percent-encoded URI parts.
url.workspace = true
percent-encoding.workspace = true
# XML escaping for the recent-files bookmarks.
quick-xml.workspace = true

ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["dmabuf-import"] }

tilo-actions = { path = "../../collab/actions" }
console-control = { path = "../console-control" }
tilo-automation = { path = "../../collab/automation" }
# The record/room-index store. The compositor keeps one document per room
# listing which records that room holds, in the same store shape (atomic
# writes, single-writer lock, debounced writer) an app's own state uses.
tilo-app-state = { path = "../../system/app-state" }
# The store the apps the shell mounts in-process keep their records in.
durable-store = { path = "../../system/durable-store" }
# Errors a host-made collaboration connection reports.
runtime-portal = { path = "../../runtime/runtime-portal" }
# `data_home()` — where per-user state lives, which is also where the
# records apps wrote are found.
tilo-cli-kit = { path = "../../runtime/cli" }
terminal = { path = "../../../apps/terminal" }
messages = { path = "../../../apps/messages" }
passwords = { path = "../../../apps/passwords" }
tilo-messaging = { path = "../../platform/tilo-messaging" }
accounts = { path = "../../system/accounts" }
tilo-contact-directory = { path = "../../platform/tilo-contact-directory" }
tilo-messaging-protocol = { path = "../../system/messaging-protocol", default-features = false, features = ["signal-broker", "whatsapp-sdk", "sms-dbus"] }
file-explorer = { path = "../../../apps/file-explorer" }
browser = { path = "../../../apps/browser" }
notes = { path = "../../../apps/notes" }
code-editor = { path = "../../../apps/code-editor" }
word-processor = { path = "../../../apps/word-processor" }
# The document-format registry. The shell asks it whether a path is an
# editable document; which installed app opens it comes from the app
# manifests, not from here.
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-content = { path = "../../system/content", features = ["device"] }
tilo-doc-codecs = { path = "../../doc/tilo-doc-codecs", default-features = false }
tilo-resource = { path = "../../sdk/tilo-resource" }
mime_guess.workspace = true
# Shared OS-action shell-outs (brightnessctl/wpctl/nmcli/bluetoothctl/
# powerprofilesctl). Kept outside `shell::shell::quick_settings::actions` so the
# Settings app can call the same bindings without depending on the
# compositor. Quick Settings keeps only dispatcher aliases and fixture policy.
os-actions = { path = "../../system/os-actions" }
# Session-owned balance/mono policy and PipeWire graph enumeration. Settings
# persists intent; the compositor is the single long-lived actuator. Also the
# video stack for shared surfaces, projection and recording: `realtime` is
# the GStreamer encoder/decoder, which picks hardware first, then
# royalty-free software, then Cisco's openh264 binary loaded by the system.
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime", "voice", "pipewire"] }
# Recording muxes the encoder's access units through `appsrc`; the same pin
# as `media`, so one copy resolves.
gstreamer-app = { workspace = true, features = ["v1_24"] }
hex.workspace = true
sha2.workspace = true
xattr = "1.6.1"
# Power management: suspend-on-idle, lid / power-key policy, suspend
# inhibitors, and battery thresholds over systemd-logind + UPower. The pure
# policy core is unit-testable without a bus; the service actuates via zbus.
tilo-power-mgmt = { path = "../../system/power" }

winit.workspace = true
# XKB keysym values for the media keys winit reports only as raw keysyms.
xkeysym = "0.2.1"
# Publishes `Xft.dpi` on each workspace's X server.
x11rb = { version = "0.13", default-features = false }
pollster.workspace = true
sysinfo.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
taffy.workspace = true
vello.workspace = true
# Compare replacement image patches while retaining every other scene command.
vello_encoding.workspace = true
parking_lot.workspace = true

libc.workspace = true

# Peer invitations are base64-url wrapped signed JSON tickets containing the
# owner's stable iroh EndpointAddr.
base64.workspace = true
tilo-projector = { path = "../../system/projector" }
zbus = { workspace = true, features = ["tokio", "p2p", "blocking-api"] }

tilo-bluez = { path = "../../system/tilo-bluez" }
# The status bar follows NetworkManager's signals instead of `nmcli monitor`.
tilo-nm = { path = "../../system/tilo-nm" }
image ={ workspace = true, features = ["jpeg", "png", "webp"] }
# The shared preview decoder behind drag previews.
tilo-thumbnail = { path = "../../media/thumbnail" }
# Host applications ship SVG icons; rasterised at the size chrome paints them.
resvg = { version = "0.47", default-features = false }
# The broker validates inbound `SignedOp` envelopes against the
# channel's role table before fan-out; the Iroh actor carries them
# via `NeighbourMsg::AppCrdtIncrementalSigned`. The contract types and
# the validator live in `tilo-collab-types`.
collab-types = { path = "../../collab/collab-types" }
# The neighbour wire vocabulary (`NeighbourMsg`) and its retention rules,
# shared with every other peer that speaks the collaboration protocol.
neighbour-wire = { path = "../../collab/neighbour-wire" }
channel-crypto = { path = "../../collab/channel-crypto" }
# The reusable video-streaming stack (H.264 encode/decode, per-share frame
# transport substrate, throttle). `network::{encoder,surface_stream,streaming}`
# re-export from here so the compositor's surface streaming and the chat call
# app share a single copy of the codec + wire format.
tilo-callstream = { path = "../../collab/tilo-callstream" }
# `firstboot` provisions a fresh single-device identity at first login
# via `threshold-identity::ThresholdIdentity::bootstrap_single_device_seed`,
# which yields the raw dalek-compatible seed + pubkey that the
# on-disk identity record (loaded by `runtime-identity`) needs.
threshold-identity = { path = "../../collab/threshold-identity" }
# Host-side identity lifecycle: new records are moved into Secret Service (or
# the explicitly reported private-file fallback) before the ceremony returns.
runtime-identity = { path = "../../runtime/runtime-identity" }
# Length-prefixed framing for the identity, pairing and collaboration sockets.
wire-frame = { path = "../../system/wire-frame", features = ["postcard", "tokio"] }
# Identity key generation draws from getrandom's `SysRng`; `rand_core`
# names the RNG traits ed25519-dalek and threshold-identity take.
getrandom.workspace = true
rand_core.workspace = true
# The shell serves the SDK-facing Cap'n Proto broker interface
# natively. `runtime-collab` provides the generated schema types and
# the SDK-side client wrappers we reuse in tests; `runtime-portal`
# supplies the connected-fd lift + service-fd lookup.
runtime-collab = { path = "../../runtime/runtime-collab" }
# Document media: content an app asks the shell to open in another app is read
# from the filesystem daemon's content store through that app's scope.
runtime-fs = { path = "../../runtime/runtime-fs" }
# The shared runtime daemon; `runtime_host::Session` supplies its services.
tilo-runtime = { path = "../../runtime/tilo-runtime" }
# The app identity service: broker, registry, device fleet, provisioning.
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
# Launching installed applications: the shell reads the app registry and
# package manifests through this crate's types, then execs its
# `tilo-launcher` binary to build the actual bwrap + seccomp + Landlock
# sandbox. Library-only use here — see `shell::shell::launcher` for why
# the sandbox itself is built by the binary rather than in-process.
launcher = { path = "../../packaging/launcher" }
# Names a legacy VM's forwarded windows (`legacy.<guest>.<app id>`).
legacy-agent-protocol = { path = "../../runtime/legacy-agent-protocol" }
# The wire of the shell's own file choosers, served to apps with no portal.
tilo-dialogs.workspace = true
package-store = { path = "../../packaging/package-store" }
tilo-installed-apps = { path = "../../packaging/installed-apps" }

# The host's own applications: `.desktop` entries the compositor reads
# so a Flatpak or a distribution binary is launchable and searchable.
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
# User root identity + device cert + revocation. See
# `network::identity` for the peer-side wiring: on connect we
# expect the remote to present its device pubkey + cert; we validate
# the cert against the workspace owner's root key and cross-check
# the revocation list before accepting any of the peer's CRDT ops.
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# Answers boot-time disk-unlock requests from the person's other devices.
tilo-unlock-protocol = { path = "../../collab/tilo-unlock-protocol" }
# Mesh placement, home-peer registrations and relay shard ids.
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# The authenticated relay client and co-edit session (`RelayClient`,
# `RelayCoeditSession`) that carry workspace deltas through a home or
# provider host, plus room administration and the workspace join client.
# The relay daemon itself (`tilo-relay`) is a dev-dependency only.
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
# The native durable owner of enrolled rooms, kept inside the state file.
tilo-joined-room = { path = "../../collab/tilo-joined-room" }
# `network::identity` verifies raw Ed25519 signatures directly
# against a peer's device pubkey (as recovered from their
# DeviceCert). Same version + features shape as the dev-deps entry
# below so cargo collapses to one copy in the lockfile.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
capnp.workspace = true
capnp-rpc.workspace = true
# The polkit agent cancels an authentication conversation.
tokio-util.workspace = true
# capnp-rpc speaks futures-io; `io` supplies its buffered reader/writer.
futures-util = { workspace = true, features = ["io"] }
# The shell re-serialises signed op envelopes and presence keys onto
# the capnp wire; `postcard` matches what apps and the ui toolkit
# already use for the same envelopes / keys.
postcard = { workspace = true, features = ["alloc"] }

# Search infrastructure.
# `walkdir` powers the files provider's name-index walker + the content
# indexer.
walkdir.workspace = true
tar.workspace = true
# Tilo's search layer: the providers' retained indexes, and the files
# provider's on-disk content index.
tilo-search = { path = "../../sdk/search", features = ["disk"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Native Store publication through the same certified session fixture as Browser.
store = { path = "../../../apps/store" }
# Private feedback acceptance invokes the actual Chat action and receipt adapter.
chat = { path = "../../../apps/chat", default-features = false }
# Real native editor instances in certified multi-device continuity fixtures.
tilo-app = { path = "../../sdk/tilo-app", features = ["test-support"] }

greeter = { path = "../greeter" }
# Private native-pair acceptance uses the governed host's real voice relay.
tilo-relay = { path = "../../hosting/tilo-relay", features = ["agents"] }
# Signs the TPM quotes the disk-unlock auto-approval tests verify.
p256 = { version = "0.14", features = ["ecdsa"] }
tilo-copy-lint = { path = "../../dev/copy-lint" }
# Pairing-broker tests talk to a local broker on a loaded runner; the
# toolkit's test support bounds that exchange only against a hang.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["test-support"] }
# Parses the locale catalogues the way the runtime does, so a German entry
# that would silently fall back to English fails a test.
fluent.workspace = true
runtime-portal = { path = "../../runtime/runtime-portal" }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-action-broker = { path = "../../collab/tilo-action-broker", features = ["test-support"] }
tilo-joined-room = { path = "../../collab/tilo-joined-room", features = ["test-support"] }
tilo-startup-metrics = { path = "../../system/tilo-startup-metrics", features = ["test-support"] }
collab-fixtures = { path = "../../collab/collab-fixtures" }
# A browser in the room a node governs, for the node's own session to share
# sealed records with.
tilo-browser-peer = { path = "../../browser/tilo-browser-peer" }
tilo-agent-participant = { path = "../../agent/agent-participant" }
rand_chacha.workspace = true
pollster.workspace = true
wgpu.workspace = true
# Serializes tests that share process-wide state (environment variables,
# static registries).
serial_test.workspace = true
# Scoped, restoring environment changes for tests whose interface is the
# environment itself.
tilo-test-env = { path = "../../dev/test-env" }
# Naga is the WGSL parser/validator wgpu already pulls in transitively.
# `tests/hdr_tonemap_shader.rs` uses it to spot-check the tone-map
# WGSL kernel at test time so a shader edit doesn't silently break the
# GPU path in production. Pinned to the same minor as wgpu 29 so Cargo
# collapses to one copy in the workspace lock.
naga = { version = "29", features = ["wgsl-in"] }
# Client side of the wlr output-management protocols, to drive the
# compositor the way wlr-randr and kanshi do.
wayland-protocols-wlr = { version = "0.3.10", features = ["client"] }
# Client side of input-method-v2 and text-input-v3, to drive the compositor
# the way a composing input method and a text field do.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }

[[test]]
name = "it"
path = "tests/it.rs"

# Examples that carry unit tests build as test targets too, so `cargo test`
# and the CI test jobs run those tests.
[[example]]
name = "runtime-mcp-inspect"
test = true

[[example]]
name = "shared-runtime-proof"
test = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook-registry = "1.4.8"
# Tilo owns the producer side of portal ScreenCast streams.  `pipewire-rs`
# talks to the session daemon directly; sandboxed apps only receive a remote
# after the portal has granted a session.
pipewire = "0.10.1"
smithay-client-toolkit = "0.20.0"
wayland-client.workspace = true
wayland-scanner = "0.31.11"
# The stand-in text input that lets the input method reach the shell's own
# fields (`compositor::shell_text_input`).
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
# The compositor's own input method connection, which commits text the
# shell inserts (a picked emoji) while no trusted input method owns the seat.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# No `backend_winit`: the hosted backend drives its window itself
# (`compositor/backend/winit.rs`), and Smithay's backend matches every winit
# event, so it would not build against the fork's `WindowEvent::PenSample`.
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    # DRM/KMS + libseat + udev + libinput backend for running on a bare TTY.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
] }
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
# `ui::App` publishes ordinary app windows through `accesskit_winit`. The
# compositor owns no winit application window, so its trusted chrome (including
# OOBE and the desktop tour) uses AccessKit's native Unix/AT-SPI adapter.
accesskit_unix = { version = "0.23.0", default-features = false, features = ["tokio"] }
# EIS is the protocol transport required by InputCapture.  The calloop
# feature lets its socket state live beside the compositor event loop.
reis = { version = "0.7.1", features = ["calloop"] }
# Session-lock unlock reuses the greeter's greetd/PAM conversation
# (`greetd_client::verify_password` — verify credentials without starting a
# session) so login and unlock share one non-leaky auth path.
greetd-client = { path = "../greetd-client" }
# Session-owned Windows compatibility broker. The shell supplies the trusted
# launcher registry and fresh workspace capability authority.
compat-service = { path = "../../windows/compat-service" }
windows-vm = { path = "../../windows/windows-vm" }
# The shell runtime's policy, where the person's allow for Terminal's Host
# target (the device's own shell) is recorded.
ush = { path = "../../runtime/ush" }
# The DRM backend rasterizes on the CPU where the GPU cannot run vello's
# compute pipeline (Mali Bifrost under panvk).
tilo-cpu-raster = { path = "../../sdk/tilo-cpu-raster" }
