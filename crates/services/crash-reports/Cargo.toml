[package]
name = "tilo-crash-reports"
description = "What ended this computer's session: a private report for each panic and each main loop the watchdog judged hung, the kernel's report of the computer itself stopping, and the reports listed and read through the host's api."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
# A report's file name starts with its local time, and a list sorts by it.
jiff.workspace = true
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }
# The reports are private files of this user's, created and read as such.
tilo-files = { path = "../../platform/tilo-files" }
tilo-paths.workspace = true
# `journalctl` for the reports the kernel kept across a reset.
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
tilo-actions = { path = "../../core/actions" }
# The reports a session service publishes.
tilo-service = { path = "../../desktop/service" }
# A report is a resource of a declared type.
tilo-resource = { path = "../../core/tilo-resource" }
# A report's time reads in the person's own date style.
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false, features = ["model"] }
# The reports' facts as Settings, an agent and a script read them.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A kept stop is known by the digest of its log, so reading the same ones at
# every start keeps each once.
blake3.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["model", "host"] }

[dev-dependencies]
# The canonical compiled form of the surface this crate publishes.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
