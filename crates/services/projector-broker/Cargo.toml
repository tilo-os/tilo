[package]
name = "tilo-projector-broker"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
tilo-projector = { path = "../projector" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
hex.workspace = true
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-paths.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fcast-sender-sdk.workspace = true
mdns-sd.workspace = true
getrandom.workspace = true
rand.workspace = true
tokio.workspace = true
tilo-rt.workspace = true
zbus = { workspace = true, features = ["tokio", "p2p"] }
miracast = { workspace = true, optional = true, features = ["networkmanager", "gstreamer"] }
ashpd = { workspace = true, optional = true, features = ["screencast"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[features]
# Miracast sessions link GStreamer; without the feature a Miracast receiver
# can be discovered but not connected to.
default = ["miracast"]
miracast = ["dep:miracast", "dep:ashpd"]

[dev-dependencies]
prost = "0.14.4"
google-cast-protocol = "0.1.0"
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18.1"
sha2.workspace = true
rand_core.workspace = true
rsa = { version = "=0.10.0-rc.18", features = ["encoding", "sha2"] }
rcgen.workspace = true
tokio-rustls = { workspace = true }
rustls-pki-types = "1.14"
futures-util.workspace = true
tilo-callstream = { path = "../../engines/tilo-callstream" }
tilo-test-env = { path = "../../../tools/test-env" }
time = "0.3"

[[bin]]
name = "tilo-projector"
path = "src/main.rs"

[lints]
workspace = true
