[package]
name = "tilo-projector"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
tilo-files = { path = "../../platform/tilo-files" }
tilo-paths.workspace = true
wire-frame = { path = "../../platform/wire-frame", features = ["postcard"] }
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
