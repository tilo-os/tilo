[package]
name = "tilo-vision-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The device's image model: bounds and encodes a picture, calls the model, and publishes describe, read text, name what a picture shows, find faces and the library analysis the system index reads"

[dependencies]
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-service = { path = "../../desktop/service" }
tilo-lock = { path = "../../platform/tilo-lock" }
tilo-content = { path = "../../core/content" }
tilo-content-device = { path = "../../core/content-device" }
# The blob service the device's daemon serves, which the image model reads a picture's bytes from.
runtime-fs = { package = "tilo-runtime-fs", path = "../../core/runtime-fs" }
tilo-image-codec = { path = "../../engines/tilo-image-codec" }
tilo-model-client = { path = "../../sdk/model-client", default-features = false }
tilo-ocr = { path = "../../engines/ocr" }
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
base64.workspace = true
hex.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
# The connection this device's service holds to the model gateway, made as
# the launcher makes one for an app it starts.
launcher = { path = "../../core/launcher" }
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal" }

[dev-dependencies]
# The canonical compiled form of the surface this crate publishes.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
