[package]
name = "tilo-continuity"
description = "What continues across a person's devices: the clipboard, notifications, Wi-Fi passphrases and Bluetooth accessories, each a service of actions over the device fabric, under the person's Continuity switches."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
os-actions = { path = "../../system/os-actions" }
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
settings-store = { path = "../../system/settings-store" }
thiserror.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-clipboard = { version = "0.1.0", path = "../../platform/tilo-clipboard" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-fabric = { path = "../../core/tilo-fabric" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-seal = { path = "../../system/tilo-seal" }
tracing.workspace = true
zeroize.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-fabric = { path = "../../core/tilo-fabric", features = ["test-support"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
