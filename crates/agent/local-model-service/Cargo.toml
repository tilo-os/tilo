[package]
name = "local-model-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Verified, content-addressed local-model runtime service for Tilo."

# Fast quality reports cc unused despite build.rs using it for compiler
# discovery and C++ bridge compilation; retain that required build dependency.
[package.metadata.cargo-machete]
ignored = ["cc"]

[features]
default = ["whisper"]
whisper = []
# Explicit isolated native qualification; never selected by normal consumers.
nemo-review = []
# Isolated public-module interpretation; never selected by the speech worker.
whistle-wasm-review = []
# Explicit private-pipe qualification; no production worker or catalogue admission.
whistle-v8-review = []
whistle-aot-review = []
# Production handler requires the immutable image runtime and signed weights.
# Preparing a package does not enable this feature or admit a catalogue entry.
whistle-aot = ["whisper"]

[[bin]]
name = "tilo-speech-worker"
path = "src/bin/tilo-speech-worker.rs"
required-features = ["whisper"]

[[example]]
name = "speech_qualify"
required-features = ["whisper"]

[[example]]
name = "speech_benchmark"
required-features = ["whisper"]

[[example]]
name = "nemo_speech_worker"
required-features = ["nemo-review"]

[[example]]
name = "whistle_wasm_review"
required-features = ["whistle-wasm-review"]

[[example]]
name = "whistle_v8_worker_review"
required-features = ["whistle-v8-review"]

[[example]]
name = "whistle_aot_review"
required-features = ["whistle-aot-review"]

[[example]]
name = "whistle_aot_worker_review"
required-features = ["whistle-aot-review"]

[[example]]
name = "whistle_aot_image_review"
required-features = ["whistle-aot"]

[lib]
name = "local_model_service"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-manager"
path = "src/main.rs"

[dependencies]
tilo-paths.workspace = true
agent-provider-config = { path = "../provider-config" }
system-extension = { path = "../../system/system-extension" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
bounded-command = { path = "../../system/bounded-command" }
serde.workspace = true
serde_json.workspace = true
wire-frame = { path = "../../system/wire-frame" }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
tilo-advisory-lock = { path = "../../system/advisory-lock" }
thiserror.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../platform/tilo-net", features = ["blocking"] }
clap.workspace = true
ed25519-dalek.workspace = true
libc.workspace = true
zeroize.workspace = true
tilo-sandbox-core = { path = "../../system/sandbox-core" }
tar.workspace = true
zstd.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
wasmi = { version = "=1.1.0", default-features = false, features = ["std", "simd"] }
tempfile.workspace = true

[build-dependencies]
cc = "=1.2.56"

[lints]
workspace = true
