[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-agent-session"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "An agent in a workspace: its own certified device and root-signed delegation, apps driven through the same resource/action API a person uses, durable edits in the host's order, and a live cursor every member sees."

[lib]
name = "tilo_agent_session"
path = "src/lib.rs"

# The member's integration tests: one binary, its files included as
# modules by `tests/it.rs` (a file per binary linked the whole crate and
# started its own app workers once each).
[[test]]
name = "it"
path = "tests/it.rs"

[features]
# What tests drive the service with: a part held back from it ([`workspace_actions::held_back`]).
test-support = []

[dependencies]
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Each record is a framework member of its app's resource kind; the
# published tree is the action API.
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The host's state file is replaced whole, never half-written.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-actions = { path = "../../collab/actions" }
# A bot's record events: the dispatcher's event shape and its reader of
# recorded entries, shared with the shell.
tilo-automation = { path = "../../collab/automation" }
# The kinds of work a transform's model is chosen by.
agent-provider-config = { path = "../../integrations/provider-config" }
# The apps an agent can open in a browser session: those whose manifests declare
# the web platform.
activity = { path = "../../../apps/activity" }
api-tester = { path = "../../../apps/api-tester" }
assistant = { path = "../../../apps/assistant" }
camera = { path = "../../../apps/camera", default-features = false, features = ["live-capture"] }
canvas = { path = "../../../apps/canvas" }
chip-design = { path = "../../../apps/chip-design" }
clocks = { path = "../../../apps/clocks" }
tilo-console = { path = "../../../apps/console" }
diffmerge = { path = "../../../apps/diffmerge" }
feeds = { path = "../../../apps/feeds" }
file-explorer = { path = "../../../apps/file-explorer", default-features = false, features = [] }
hex-editor = { path = "../../../apps/hex-editor" }
maps = { path = "../../../apps/maps" }
messages = { path = "../../../apps/messages" }
model-providers = { path = "../../../apps/model-providers" }
music = { path = "../../../apps/music", default-features = false, features = [] }
passwords = { path = "../../../apps/passwords" }
poker = { path = "../../../apps/poker" }
scratchpad = { path = "../../../apps/scratchpad" }
settings = { path = "../../../apps/settings", default-features = false, features = [] }
sheets = { path = "../../../apps/sheets" }
shortcuts = { path = "../../../apps/shortcuts" }
slides = { path = "../../../apps/slides" }
snippets = { path = "../../../apps/snippets" }
speed-test = { path = "../../../apps/speed-test" }
terminal = { path = "../../../apps/terminal", default-features = false, features = [] }
themes = { path = "../../../apps/themes" }
totp = { path = "../../../apps/totp" }
typst-editor = { path = "../../../apps/typst-editor" }
video-editor = { path = "../../../apps/video-editor", default-features = false, features = [] }
video-player = { path = "../../../apps/video-player", default-features = false, features = [] }
weather = { path = "../../../apps/weather" }
word-processor = { path = "../../../apps/word-processor" }
# The member's client: the certified relay session (iroh for a host-side agent) with its live
# live session, the same code a browser page runs, and the board of who is here and the agent's own word
# on it.
tilo-session-client = { path = "../../session/client", features = ["toolkit"] }
# The identity layer's device side: the host an agent's session dials, and the signer it holds.
tilo-server-client = { path = "../../server/tilo-server-client" }
# A device on the live session is named by its endpoint id.
iroh-base.workspace = true
tilo-server-protocol = { path = "../../server/tilo-server-protocol" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
collab-types = { path = "../../collab/collab-types" }
# An agent's presence is the workspace's own ([`neighbour_wire`]): the same
# frames a browser and a native shell say theirs in.
neighbour-wire = { path = "../../collab/neighbour-wire" }
# The keys a workspace's sealed record is opened with, and the live track a presence frame took.
key-group = { path = "../../collab/key-group" }
tilo-live = { path = "../../collab/tilo-live" }
postcard = { workspace = true, features = ["use-std"] }
automerge.workspace = true
tilo-automerge.workspace = true
# The shared desktop an agent puts the views it works in on.
tilo-desktop-model = { path = "../../session/desktop-model" }
# The workspace's canvas on its front page: the shell's package, run and written as HTML as
# a page shows an app.
tilolang-tilo = { path = "../../lang/tilolang-tilo" }
tilolang-web = { path = "../../lang/tilolang-web" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
blake3.workspace = true
getrandom.workspace = true
# The requests and answers of the model calls a host's agents make.
tilo-model-gateway = { default-features = false, features = ["host-backend"], path = "../../integrations/model-gateway" }
# Agents' sessions do their I/O on the host's runtime, or one of their own.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
# App workers: an app's code runs in a confined process of this executable,
# spoken to over framed messages; what it returns is admitted through the
# isolate before the host signs it.
wire-frame = { path = "../../platform/wire-frame", features = ["postcard"] }
tilo-automerge-isolate = { path = "../../doc/tilo-automerge-isolate" }
# The content records reference: lent to a record's view, held in memory in
# its worker, carried between the two by hash.
tilo-content = { version = "0.1.0", path = "../../system/content" }
# The workspace tree a put file becomes a node of, written as its mount writes it.
tilo-fs = { package = "tilo-fs", path = "../../system/fs", features = ["tree-sync"] }
fs-protocol = { path = "../../system/fs-protocol" }
fs-content = { path = "../../system/fs-content" }
# What an uploaded file is, from its first bytes: the media type the store
# keeps it under.
tilo-content-types = { path = "../../system/content-types" }
# Where a large upload's bytes wait until its last piece arrives: a file of
# the host's, never the host's memory.
tempfile.workspace = true
# A workspace's content store is kept under the workspace's id.
uuid.workspace = true
# The render service's side of `tilo-video-render`, the confined helper an
# agent's video renders run in (the helper itself is its binary).
tilo-video-render = { path = "../../engines/video-render", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
# The worker's confinement: detach, resource limits and, on macOS, Seatbelt.
tilo-sandbox = { path = "../../platform/tilo-sandbox" }

[target.'cfg(target_os = "linux")'.dependencies]
# The worker's Landlock ruleset and seccomp filters, from the shared
# primitives every confinement path uses.
tilo-sandbox-core = { path = "../../platform/sandbox-core" }
seccompiler.workspace = true
libc.workspace = true
# A connector app, mounted only where a workspace's host runs its worker.
discord = { path = "../../../apps/discord" }


[dev-dependencies]
# The page holder a test reads a peer's workspace through: the workspace service's document
# core over the replica the peer's session admits into, as a page reads it.
tilo-workspace-service = { path = "../../server/tilo-workspace-service", features = ["device-keys", "session-pages", "fixture-servers"] }
# The crate's own test support, for its integration tests.
tilo-agent-session = { path = ".", features = ["test-support"] }
tilo-session-actions = { path = "../../session/session-actions" }
# The session a page's desktop serves its windows, which carries what the workspace's server
# keeps to that server. The peer view is off: a server drives apps and decodes no other device's
# window, and its media stack would be compiled into every test and into the api-on-server
# example the SDKs run.
tilo-desktop-surface = { path = "../../session/desktop-surface", default-features = false }
# What a test puts in the workspace in pieces, as a page sends it.
base64.workspace = true
# The content hash a test names a file it puts in a peer's folder by, as the shared
# session test support writes it.
iroh-blobs.workspace = true
# The meeting times a test writes into a calendar.
jiff.workspace = true
# Documents the tests write and read back as a Word or Markdown file.
tilo-doc-codecs = { path = "../../engines/tilo-doc-codecs" }
tilo-doc = { path = "../../sdk/tilo-doc" }
# The desktop broker's admission, which the host's decisions are held to.
tilo-action-policy = { path = "../../collab/action-policy" }
# The demo workspace and the helpers that write a chat as its people would.
# Text a test lays out uses the pinned catalog, never the fonts the machine
# running it has installed.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }
accounts = { path = "../../integrations/accounts", features = ["person"] }
tempfile.workspace = true
tilo-paths.workspace = true
# An installed app's package, and the module it carries: the packaged-model
# test installs Tasks into a server that never built it.
tilo-app-package = { path = "../../packaging/tilo-app-package" }
tilo-model-engine = { path = "../../lang/tilo-model-engine" }
tilo-server = { path = "../../server/tilo-server", features = ["agents", "test-support"] }
# The workspace's machine secrets.
tilo-environment = { path = "../../vm/environment" }
# The API server, driven through its HTTP routes against the relay.
tilo-api = { path = "../../server/tilo-api", features = ["test-support"] }
# A message with large attachments, split as `tilo migrate` splits one.
# A device's endpoint on this machine's loopback relay, as a person's device dials.
test-server = { path = "../../../tools/test-server" }
# A hosted Terminal session's stream, dialled as a device dials it, and a host selling Linux
# machines whose programs a test reads back.
ush = { path = "../../vm/ush", features = ["quic", "test-host"] }
test-http = { path = "../../../tools/test-http" }
# Opens an invitation's link as a page does, asking the workspace's host for it.
tilo-workspace-directory = { path = "../../session/workspace-directory" }
# `tilolang repl`, driven in process against a workspace the server hosts.
tilolang-cli = { path = "../../lang/tilolang-cli" }
iroh.workspace = true
# The session client's test support (its host fixture), included by path.
tilo-net = { path = "../../platform/tilo-net" }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls.workspace = true
rustls.workspace = true
sha2.workspace = true
bytes.workspace = true
tilo-test-env = { path = "../../../tools/test-env", features = ["tokio"] }
# The tools a hosted agent's turn works through, asked as a turn asks them.
tilo-mcp = { path = "../../runtime/tilo-mcp" }
tokio = { workspace = true, features = ["full"] }
# Reads the links the host mints back the way a page does.
tilo-reference = { path = "../../collab/reference" }
# The desktop's search over a workspace's record index, as a person finds a record.
tilo-desktop-search = { path = "../../session/desktop-search" }
# The subscriber the `api-on-server` example traces with.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[package.metadata.cargo-machete]
# Used by the session client's test support, which the tests include by path.
ignored = ["bytes", "hyper-util", "rustls", "tokio-rustls"]
[lints]
workspace = true
