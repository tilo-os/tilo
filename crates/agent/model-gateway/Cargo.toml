[package]
name = "qos-model-gateway"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user qOS gateway for hosted agent model providers."

[lib]
name = "qos_model_gateway"
path = "src/lib.rs"

[[bin]]
name = "qos-model-gateway"
path = "src/main.rs"

[dependencies]
agent-provider-config = { path = "../provider-config" }
accounts = { path = "../../system/accounts" }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
clap.workspace = true
libc.workspace = true

[lints]
workspace = true
