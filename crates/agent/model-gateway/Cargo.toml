[package]
name = "tilo-model-gateway"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user Tilo gateway for hosted agent model providers."

[lib]
name = "tilo_model_gateway"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-gateway"
path = "src/main.rs"

[dependencies]
agent-provider-config = { path = "../provider-config" }
accounts = { path = "../../system/accounts" }
reqwest = { workspace = true, features = ["blocking", "json"] }
tilo-net = { path = "../../system/tilo-net", features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
wire-frame = { path = "../../system/wire-frame" }
clap.workspace = true
libc.workspace = true
base64.workspace = true
url.workspace = true

[lints]
workspace = true
