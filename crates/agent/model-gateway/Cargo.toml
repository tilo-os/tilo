[package]
name = "tilo-model-gateway"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user Tilo gateway for hosted agent model providers."

[lib]
name = "tilo_model_gateway"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-gateway"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "tilo-model-http"
path = "src/http_main.rs"
required-features = ["server"]

[[example]]
name = "local-tool-acceptance"
required-features = ["server"]

[[test]]
name = "socket_activation"
path = "tests/socket_activation.rs"
required-features = ["server"]

[features]
default = []
runtime-client = ["tilo-model-client/runtime-client"]
# Hosted-provider relay and HTTP adapter, without in-process inference.
server = [
    "dep:tilo-clock",
    "dep:accounts",
    "dep:account-custody",
    "dep:settings-store",
    "dep:reqwest",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tilo-rt",
    "dep:clap",
    "dep:base64",
    "dep:rig-core",
    "dep:bytes",
    "dep:futures-util",
    "dep:tilo-files",
    "dep:service-handoff",
    "dep:rustix",
]
# Trusted host CLIs share the server's provider transport and credential policy.
host-backend = ["server"]
# Desktop gateway only: load installed segmentation models in this process.
local-models = ["server", "dep:tilo-segment", "dep:local-model-service", "dep:image"]

[dependencies]
tilo-model-client = { version = "0.1.0", path = "../model-client", default-features = false }
libc.workspace = true
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
hex.workspace = true

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
wire-frame = { path = "../../system/wire-frame" }
tilo-files = { optional = true, path = "../../platform/tilo-files" }
url.workspace = true
agent-provider-config = { path = "../provider-config" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tilo-clock = { path = "../../platform/tilo-clock", optional = true }
accounts = { path = "../../system/accounts", optional = true }
# Custody refreshes the Google grant sealed by Settings; no API key is stored.
account-custody = { path = "../../system/account-custody", optional = true }
settings-store = { path = "../../system/settings-store", optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
hyper = { optional = true, version = "1", features = ["server", "http1"] }
hyper-util = { optional = true, version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
tilo-rt = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
# The launcher handoff this gateway reads, from the one contract both ends
# compile.
service-handoff = { path = "../../runtime/service-handoff", features = ["tokio"], optional = true }
clap = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# Provider wire encoding, response normalization and SSE decoding. Transport
# remains the gateway's explicitly configured, non-retrying HTTP client.
rig-core = { optional = true, version = "=0.44.0", default-features = false }
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

workspace-hack = { version = "0.1" }
# The subject of a picture is found here, with the segmentation model the
# person installed, so no app holds the model or its runtime.
tilo-segment = { optional = true, path = "../../media/segment", features = ["infer"] }
local-model-service = { optional = true, path = "../local-model-service" }
image = { optional = true, workspace = true, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }
