[package]
name = "tilo-model-gateway"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user Tilo gateway for hosted agent model providers."

[lib]
name = "tilo_model_gateway"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-gateway"
path = "src/main.rs"

[dependencies]
agent-provider-config = { path = "../provider-config" }
tilo-feedback-review = { path = "../../collab/feedback-review" }
accounts = { path = "../../system/accounts" }
# Signed-in provider accounts (Azure OpenAI): custody hands out their
# access tokens through Tilo's one OAuth client registration.
account-custody = { path = "../../system/account-custody" }
reqwest = { workspace = true, features = ["json"] }
tilo-net = { path = "../../system/tilo-net", features = ["http"] }
tilo-rt.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
clap.workspace = true
libc.workspace = true
base64.workspace = true
url.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
