[package]
name = "tilo-model-gateway"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user Tilo gateway for hosted agent model providers."

[lib]
name = "tilo_model_gateway"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-gateway"
path = "src/main.rs"

[[bin]]
name = "tilo-model-http"
path = "src/http_main.rs"

[dependencies]
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
hex.workspace = true

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
wire-frame = { path = "../../system/wire-frame" }
libc.workspace = true
tilo-files = { path = "../../platform/tilo-files" }
# Loopback admission of device-local models is shared with apps discovering them.
url.workspace = true
# The provider protocol names travel in the client's requests too.
agent-provider-config = { path = "../provider-config" }

# The gateway itself. Off the desktop the library is only the client, which
# reports the gateway unavailable (there is no launcher descriptor to use).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
accounts = { path = "../../system/accounts" }
reqwest = { workspace = true, features = ["json"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tilo-rt.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
clap.workspace = true
base64.workspace = true
# Provider wire encoding, response normalization and SSE decoding. Transport
# remains the gateway's explicitly configured, non-retrying HTTP client.
rig-core = { version = "=0.44.0", default-features = false }
bytes.workspace = true
futures-util.workspace = true

workspace-hack = { version = "0.1" }
# The subject of a picture is found here, with the segmentation model the
# person installed, so no app holds the model or its runtime.
tilo-segment = { path = "../../media/segment", features = ["infer"] }
local-model-service = { path = "../local-model-service" }
image = { workspace = true, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
