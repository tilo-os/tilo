[package]
name = "agent-provider-config"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Portable, secret-safe model-provider configuration for Tilo agents."

[lib]
name = "agent_provider_config"
path = "src/lib.rs"

[dependencies]
settings-store = { path = "../../system/settings-store" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
xdg-paths = { path = "../../system/xdg-paths" }
atomic-file = { path = "../../system/atomic-file" }
sha2.workspace = true
hex.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
