[package]
name = "tilo-agent-participant"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "An agent as a first-class session participant: its own certified device and root-signed delegation, apps driven through the same resource/action door a person uses, durable edits in the host's order, and a live cursor every participant sees."

[lib]
name = "tilo_agent_participant"
path = "src/lib.rs"

[dependencies]
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Each record is a framework participant of its app's resource kind; the
# published tree is the door.
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The dates a step's computed arguments (`{{= workday(…) }}`) work with.
chrono.workspace = true
# The patterns a step's argument takes a part of a value out with
# (`{{…|match:INV-\d+}}`): matched in linear time, compiled size bounded.
regex.workspace = true
tilo-actions = { path = "../../collab/actions" }
# A report's authenticated transport and the signed receipt an agent's
# participant answers for.
tilo-feedback-transport = { path = "../../collab/feedback-transport" }
# A bot's record events: the dispatcher's event shape and its reader of
# recorded entries, shared with the shell.
tilo-automation = { path = "../../collab/automation" }
# `apps/agent`'s model planner: action discovery tools over a catalogue, and
# the chooser that asks through tilo-model-gateway.
agent = { path = "../../../apps/agent" }
# The apps an agent can open in a browser session: the browser desktop's
# registry, generated from the app manifests.
# generated apps: begin (tools/web/generate_web_desktop.py)
activity = { path = "../../../apps/activity" }
api-tester = { path = "../../../apps/api-tester" }
calculator = { path = "../../../apps/calculator" }
calendar = { path = "../../../apps/calendar", default-features = false, features = [] }
camera = { path = "../../../apps/camera", default-features = false, features = ["live-capture"] }
canvas = { path = "../../../apps/canvas" }
chat = { path = "../../../apps/chat", default-features = false, features = [] }
chip-design = { path = "../../../apps/chip-design" }
clocks = { path = "../../../apps/clocks" }
tilo-console = { path = "../../../apps/console" }
contacts = { path = "../../../apps/contacts" }
diffmerge = { path = "../../../apps/diffmerge" }
ebook = { path = "../../../apps/ebook" }
feeds = { path = "../../../apps/feeds" }
hex-editor = { path = "../../../apps/hex-editor" }
maps = { path = "../../../apps/maps" }
messages = { path = "../../../apps/messages" }
model-providers = { path = "../../../apps/model-providers" }
music = { path = "../../../apps/music", default-features = false, features = [] }
notes = { path = "../../../apps/notes" }
passwords = { path = "../../../apps/passwords" }
pdf-viewer = { path = "../../../apps/pdf-viewer" }
photos = { path = "../../../apps/photos" }
poker = { path = "../../../apps/poker" }
scratchpad = { path = "../../../apps/scratchpad" }
sheets = { path = "../../../apps/sheets" }
shortcuts = { path = "../../../apps/shortcuts" }
slides = { path = "../../../apps/slides" }
snippets = { path = "../../../apps/snippets" }
speed-test = { path = "../../../apps/speed-test" }
tasks = { path = "../../../apps/tasks" }
themes = { path = "../../../apps/themes" }
totp = { path = "../../../apps/totp" }
tube = { path = "../../../apps/tube", default-features = false, features = [] }
typst-editor = { path = "../../../apps/typst-editor" }
video-editor = { path = "../../../apps/video-editor", default-features = false, features = [] }
video-player = { path = "../../../apps/video-player", default-features = false, features = [] }
weather = { path = "../../../apps/weather" }
word-processor = { path = "../../../apps/word-processor" }
# generated apps: end
# Apps an agent's worker holds that a browser page cannot mount
# (`apps::agent_only_apps`). Mail's account engine is built in (main's Mail
# does not build without `live`) but idle: a worker holds no account and
# reaches no network.
mail = { path = "../../../apps/mail" }
# The participant's client: the certified relay session (iroh for a host-side agent) with its live
# plane, the same code a browser page runs, and the board of who is here and the agent's own word
# on it.
tilo-session-client = { path = "../../session/client", features = ["toolkit"] }
# The identity layer's device side: the host an agent's session dials, and the signer it holds.
tilo-relay-client = { path = "../../hosting/tilo-relay-client" }
tilo-session-core = { path = "../../session/core" }
# A device on the plane is named by its endpoint id.
iroh.workspace = true
iroh-base.workspace = true
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
collab-types = { path = "../../collab/collab-types" }
# An agent's presence is the workspace's own ([`neighbour_wire`]): the same
# frames a browser and a native shell say theirs in.
neighbour-wire = { path = "../../collab/neighbour-wire" }
# The keys a workspace's sealed record is opened with, and the live track a presence frame took.
channel-crypto = { path = "../../collab/channel-crypto" }
tilo-live = { path = "../../collab/tilo-live" }
postcard = { workspace = true, features = ["use-std"] }
automerge.workspace = true
tilo-automerge.workspace = true
# The shared desktop an agent puts the views it works in on.
tilo-desktop-model = { path = "../../session/desktop-model" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
blake3.workspace = true
getrandom.workspace = true
# An OpenAI-compatible model endpoint, called from the agent's own thread,
# shaped for its target (a plain provider or Tilo Cloud's metered endpoint).
tilo-model-gateway = { default-features = false, features = ["host-backend"], path = "../model-gateway" }
# Agents' sessions do their I/O on the host's runtime, or one of their own.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
# App workers: an app's code runs in a confined process of this executable,
# spoken to over framed messages; what it returns is admitted through the
# isolate before the host signs it.
wire-frame = { path = "../../system/wire-frame", features = ["postcard"] }
tilo-automerge-isolate = { path = "../../doc/tilo-automerge-isolate" }
# The content records reference: lent to a record's view, held in memory in
# its worker, carried between the two by hash.
tilo-content = { version = "0.1.0", path = "../../system/content" }
# Pictures shown to a planning model: sent base64-encoded, and decoded and
# shrunk only in a confined worker (`worker::shrink_picture`).
base64.workspace = true
# A workspace's content store is kept under the workspace's id.
uuid.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The render service's side of `tilo-video-render`, the confined helper an
# agent's video renders run in (the helper itself is its binary).
tilo-video-render = { path = "../../media/video-render", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
# The worker's confinement: detach, resource limits and, on macOS, Seatbelt.
tilo-sandbox = { path = "../../platform/tilo-sandbox" }

[target.'cfg(target_os = "linux")'.dependencies]
# The worker's Landlock ruleset and seccomp filters, from the shared
# primitives every confinement path uses.
tilo-sandbox-core = { path = "../../system/sandbox-core" }
seccompiler.workspace = true
libc.workspace = true
# A connector app, mounted only where a workspace's host runs its worker.
discord = { path = "../../../apps/discord" }
# Terminal's session records, whose commands a workspace's host runs.
terminal = { path = "../../../apps/terminal" }


[dev-dependencies]
# The desktop broker's admission, which the host's decisions are held to.
tilo-broker-core = { path = "../../collab/broker-core" }
tilo-action-policy = { path = "../../collab/action-policy" }
# The demo workspace and the helpers that write a chat as its people would.
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
# Text a test lays out uses the pinned catalog, never the fonts the machine
# running it has installed.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", features = ["test-support"] }
tilo-crypto = { path = "../../system/tilo-crypto", features = ["tls-fixture"] }
accounts = { path = "../../system/accounts", features = ["person"] }
tempfile.workspace = true
tilo-paths.workspace = true
tilo-relay = { path = "../../hosting/tilo-relay", features = ["agents", "test-support"] }
# The MCP front door, driven through its HTTP routes against the relay.
tilo-front-door = { path = "../../hosting/tilo-front-door" }
test-http = { path = "../../dev/test-http" }
# Opens an invitation's link as a page does, from the site's shelf.
tilo-workspace-directory = { path = "../../session/workspace-directory" }
# The MCP projection `tilo mcp` serves, driven over a device's session.
tilo-runtime = { path = "../../runtime/tilo-runtime" }
iroh.workspace = true
# The session client's test support (its host fixture), included by path.
tilo-net = { path = "../../platform/tilo-net" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls.workspace = true
rustls.workspace = true
sha2.workspace = true
bytes.workspace = true
tilo-test-env = { path = "../../dev/test-env", features = ["tokio"] }
tokio = { workspace = true, features = ["full"] }
# Reads the links the host mints back the way a page does.
tilo-reference = { path = "../../collab/reference" }
# Writes the Word files an agent uploads, and reads Writer's documents.
tilo-doc-codecs = { path = "../../doc/tilo-doc-codecs" }
tilo-doc = { path = "../../doc/tilo-doc" }
# The desktop's search over a workspace's record index, as a person finds a record.
tilo-desktop-search = { path = "../../session/desktop-search" }
# The campaign benchmark's `TILO_BENCH_TRACE`.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[package.metadata.cargo-machete]
# Used by the session client's test support, which the tests include by path.
ignored = ["bytes", "http-body-util", "hyper", "hyper-util", "rustls", "sha2", "tilo-net", "tokio-rustls"]

[lints]
workspace = true
