[package]
name = "tilo-agent-turn"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One agent turn over the workspace's MCP tools: the tools an McpServer lists are the model's, each call it makes goes through the server's tools/call, until the model answers, its person stops it or its bounds are reached."

[dependencies]
# The tools every agent works through, and the model's neutral request and answer.
tilo-mcp = { path = "../../runtime/tilo-mcp" }
agent-provider-config = { path = "../provider-config" }
# The provider an agent's process reaches the session's actions by, carried over whatever link
# the process has to its host.
tilo-session-actions = { path = "../../session/session-actions" }
tilo-actions = { path = "../../collab/actions" }
collab-types = { path = "../../collab/collab-types" }
tilo-lock = { path = "../../platform/tilo-lock" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }

[lints]
workspace = true
