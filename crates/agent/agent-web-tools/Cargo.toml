[package]
name = "tilo-agent-web-tools"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The agent's two web tools, `search_web` and `read_page`: the definitions the model reads, the arguments they bind, and the answer one call returns. `libtilo_agent_web_engine.so` ships them; a build with no engine to load links them itself."

[lib]
name = "tilo_agent_web_tools"
path = "src/lib.rs"

[features]
# Ask a server on this machine instead of the web, and read from it: what the
# tools' own tests and the agent's do.
fixture-servers = ["tilo-web-search/fixture-servers"]

[dependencies]
agent-provider-config = { path = "../provider-config" }
# The workspace's content store a body that is not text is kept in.
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
tilo-web-search = { path = "../../platform/tilo-web-search" }
tilo-rt = { path = "../../platform/tilo-rt" }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
serde_json.workspace = true

[dev-dependencies]
# The engine answers the tools' own tests ask instead of the web.
tilo-web-search = { path = "../../platform/tilo-web-search", features = ["fixture-servers"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
