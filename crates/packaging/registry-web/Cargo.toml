[package]
name = "registry-web"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "registry_web"
path = "src/lib.rs"

# What a browser checks before it runs an app from a registry: the
# owner-signed snapshot (with an anti-rollback checkpoint), the version it
# selects for its runtime ABI and wasm features, and the signed tapp of that
# version down to the list of payload blobs to fetch. Builds for
# `wasm32-unknown-unknown` without wasm-bindgen, web-sys or getrandom.

[dependencies]
registry-types = { path = "../registry-types" }
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tilo-app-package = { path = "../tilo-app-package" }
tempfile.workspace = true

[lints]
workspace = true
