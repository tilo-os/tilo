[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "install"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One-shot install / launch / list / remove for Tilo packages."

[[bin]]
name = "tilo-install"
path = "src/main.rs"

[lib]
name = "install"
path = "src/lib.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
fnv.workspace = true
tilo-paths.workspace = true
tilo-app-package = { path = "../tilo-app-package" }
# The one installed-package registry and content store, shared with the
# launcher, the shell and the app host.
package-store = { path = "../package-store", features = ["store"] }
runtime-bundle = { path = "../runtime-bundle" }
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
semver.workspace = true
# `update` resolves a newer version through the signed registry index
# and downloads it over iroh-blobs. Same crate the app-host daemon
# uses, so there is one implementation of "fetch and verify a tapp".
app-registry = { path = "../app-registry" }
tilo-rt.workspace = true
workspace-hack = { version = "0.1" }

# Registers the runtime's GNOME Shell and KRunner search providers.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tilo-os-search = { path = "../../runtime/os-search" }

[dev-dependencies]
getrandom.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true
# A sealed runtime needs a filesystem with fs-verity; the test says so where
# there is none.
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
