[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "install"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One-shot install / launch / list / remove for Tilo packages."

[[bin]]
name = "tilo-install"
path = "src/main.rs"

[lib]
name = "install"
path = "src/lib.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
fnv.workspace = true
tilo-paths.workspace = true
tilo-app-package = { path = "../tilo-app-package" }
# The one installed-package registry and content store, shared with the
# launcher, the shell and the app host.
package-store = { path = "../package-store", features = ["store"] }
runtime-bundle = { path = "../runtime-bundle" }
clap.workspace = true
hex.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
semver.workspace = true
# `update` resolves a newer version through the same signed catalogue the
# Store and `app update` use, and downloads its payload blobs from the
# registry that served it.
app-cli = { path = "../app-cli" }
app-registry = { path = "../app-registry" }
# The sidecar contract the PATH shim reads; its library half has no
# dependencies beyond serde.
cli-shim = { path = "../cli-shim" }
workspace-hack = { version = "0.1" }

# Registers the runtime's GNOME Shell and KRunner search providers.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tilo-os-search = { path = "../../runtime/os-search" }

[dev-dependencies]
getrandom.workspace = true
ed25519-dalek.workspace = true
registry-types = { path = "../registry-types" }
registry-client = { path = "../registry-client" }
blake3.workspace = true
test-http = { path = "../../dev/test-http" }
tempfile.workspace = true
# A sealed runtime needs a filesystem with fs-verity; the test says so where
# there is none.
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
