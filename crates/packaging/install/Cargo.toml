[package]
name = "install"
version = "0.1.0"
edition = "2024"
description = "One-shot install / launch / list / remove for qOS packages."

[[bin]]
name = "qos-install"
path = "src/main.rs"

[lib]
name = "install"
path = "src/lib.rs"

[dependencies]
pkg = { path = "../pkg" }
runtime-bundle = { path = "../runtime-bundle" }
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tar.workspace = true

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
tempfile.workspace = true
