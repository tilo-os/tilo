[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "install"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One-shot install / launch / list / remove for Tilo packages."

[[bin]]
name = "tilo-install"
path = "src/main.rs"

[lib]
name = "install"
path = "src/lib.rs"

[dependencies]
xdg-paths = { path = "../../system/xdg-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
tilo-app-package = { path = "../tilo-app-package" }
runtime-bundle = { path = "../runtime-bundle" }
clap.workspace = true
hex.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
semver.workspace = true
# `update` resolves a newer version through the signed registry index
# and downloads it over iroh-blobs. Same crate the app-host daemon
# uses, so there is one implementation of "fetch and verify a tapp".
app-registry = { path = "../app-registry" }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
getrandom.workspace = true
tar.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
