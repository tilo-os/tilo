[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "install"
version = "0.1.0"
edition = "2024"
description = "One-shot install / launch / list / remove for qOS packages."

[[bin]]
name = "qos-install"
path = "src/main.rs"

[lib]
name = "install"
path = "src/lib.rs"

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
pkg = { path = "../pkg" }
runtime-bundle = { path = "../runtime-bundle" }
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tar.workspace = true
blake3.workspace = true
semver.workspace = true
# `update` resolves a newer version through the signed registry index
# and downloads it over iroh-blobs. Same crate the app-host daemon
# uses, so there is one implementation of "fetch and verify a qpkg".
app-registry = { path = "../app-registry" }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
