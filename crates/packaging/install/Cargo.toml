[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "install"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One-shot install / launch / list / remove for Tilo packages."

[[bin]]
name = "tilo-install"
path = "src/main.rs"

[features]
# Honour the developer-only environment overrides (`package_store::dev_env`)
# in a release build: the session's system store and publisher list, by which
# a developer session installs its own builds. Shipped images never enable it.
dev-overrides = ["package-store/dev-overrides", "package-service/dev-overrides"]

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-paths.workspace = true
tilo-app-package = { path = "../tilo-app-package" }
# The one installed-package registry and content store, shared with the
# launcher, the shell and the app host.
package-store = { path = "../package-store", features = ["store"] }
runtime-bundle = { path = "../runtime-bundle" }
# Every change is the package service's action: sent to the person's service while the
# device runs, made in this process for the store an image build names.
package-service = { path = "../package-service" }
package-service-client = { path = "../package-service-client" }
clap.workspace = true
hex.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
getrandom.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true
toml.workspace = true
test-http = { path = "../../../tools/test-http" }
# A sealed runtime needs a filesystem with fs-verity; the test says so where
# there is none.
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
