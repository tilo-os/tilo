[package]
name = "app-registry"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "qOS app registry protocol — signed registry index (app-id → versions), iroh-blobs content transport, target selection, and the fail-closed resolve/verify/fetch path the app-host and pkg-cli share."

[lib]
name = "app_registry"
path = "src/lib.rs"

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
pkg = { path = "../pkg" }

# Content-addressed blob transport — the SAME stack the FUSE filesystem
# uses, so a qpkg blob is downloaded once and deduped across every app.
iroh.workspace = true
iroh-base.workspace = true
iroh-blobs.workspace = true

# The index document is fetched over HTTPS (static/self-hostable); the
# blob is fetched over iroh. Both async.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
# rustls-tls only (no openssl / native-tls) to match the rest of the tree.
reqwest = { workspace = true, features = ["rustls-tls"] }

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
hex.workspace = true
blake3.workspace = true
bytes.workspace = true
tar.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
semver.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
