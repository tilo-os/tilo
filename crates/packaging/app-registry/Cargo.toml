[package]
name = "app-registry"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Payload blobs and fail-closed .tapp verification for the Tilo app registry: HTTP(S) and local registry directories, compressed twins, chunked objects."

[lib]
name = "app_registry"
path = "src/lib.rs"

[dependencies]
tilo-app-package = { path = "../tilo-app-package" }

# Payload transport: HTTPS from a registry server, or a directory registry on
# this machine. Both are async over the same bounded reads.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# rustls-tls only (no openssl / native-tls) to match the rest of the tree.
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
reqwest.workspace = true
bytes.workspace = true
blake3.workspace = true
hex.workspace = true
anyhow.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
