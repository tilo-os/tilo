[package]
name = "app-registry"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Client edges of the Tilo app registry: fail-closed .tapp verification and payload blobs fetched from a registry server over HTTPS."

[lib]
name = "app_registry"
path = "src/lib.rs"

[dependencies]
tilo-app-package = { path = "../tilo-app-package" }
# Payload blobs come from the registry server over HTTPS; rustls-tls only
# (no openssl / native-tls) to match the rest of the tree.
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
reqwest.workspace = true

hex.workspace = true
blake3.workspace = true
bytes.workspace = true
anyhow.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
