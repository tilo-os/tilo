[package]
name = "runtime-bundle"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Produce and verify Tilo runtime bundles (content-addressed loader + libc set for sandboxed apps)."

# A "runtime bundle" is a directory containing the minimal set of host
# files a dynamically-linked Tilo app needs to `execve()` inside the
# sandbox: the loader, libc, libgcc_s + friends, and (optionally)
# /etc/ld.so.cache. Bundles are content-addressed via a BLAKE3 root
# hash written into `bundle.toml` alongside the payload. The launcher
# mounts a bundle at `/usr/lib/tilo-runtime/<v>/` and sets
# `LD_LIBRARY_PATH` accordingly.

[[bin]]
name = "tilo-runtime-bundle"
path = "src/main.rs"

[lib]
name = "runtime_bundle"
path = "src/lib.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
# Installs share the bundle root's collection lock; a collection holds it alone.
tilo-advisory-lock = { path = "../../system/advisory-lock" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
blake3.workspace = true
sha2.workspace = true
tilo-paths.workspace = true
hex.workspace = true
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The bundle-root override is process-wide environment; tests scope and
# serialise their changes to it.
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
