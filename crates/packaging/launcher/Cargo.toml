[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "launcher"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo application launcher. Reads a package manifest, constructs a
# bubblewrap-based sandbox per its declarations (bubblewrap + Landlock
# + seccomp), passes well-known service sockets in via SCM_RIGHTS, and
# execs the entrypoint binary inside the sandbox.
#
# This crate carries a minimal in-tree `MinimalManifest` decoder while the
# canonical package schema is consumed through the `pkg` dependency below.

[[bin]]
name = "tilo-launcher"
path = "src/main.rs"

[lib]
name = "launcher"
path = "src/lib.rs"

[features]
# Honour the developer-only environment overrides (`src/dev_env.rs`) in a
# release build. Debug builds always honour them; shipped images never enable
# this.
dev-overrides = []

[dependencies]
clap.workspace = true
serde.workspace = true
# Also how `gpu.rs` reads an EGL vendor / Vulkan ICD manifest's
# `library_path` to match an installed driver to the compositor's
# chosen render node.
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
runtime-bundle = { path = "../runtime-bundle" }
# The canonical manifest schema. The launcher still carries its own
# `MinimalManifest` decoder, but security-relevant enums that both
# sides must agree on (portal policy) come from here rather than
# being duplicated.
tilo-app-package = { path = "../tilo-app-package" }
# The capability vocabulary. Workspace grants arrive as `CapOverride`
# records and are evaluated with the same fail-closed decision function
# the compositor and the filesystem use — a launcher-local permission
# type would be a second vocabulary to drift out of sync.
collab-types = { path = "../../collab/collab-types" }
uuid.workspace = true
# Host applications: the `.desktop` entries already installed on the
# machine. Kept in its own crate because nothing about it is Tilo
# packaging — it is the freedesktop format, and the compositor's search
# providers read it directly too.
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
# Resolves the explicit active identity selector and hosts its per-app signing
# broker. Private records are never mounted into the sandbox.
runtime-identity = { path = "../../runtime/runtime-identity" }
# Landlock ruleset construction and the baseline seccomp filter. A leaf
# crate, so the launcher still depends on nothing in the compositor.
sandbox-core = { path = "../../system/sandbox-core" }

[dev-dependencies]
# `HOME` / `XDG_CONFIG_HOME` are process-wide, so the tests that set them
# have to be serialised against each other across modules. Same pattern
# (and same crate) the shell uses for its static-state tests.
serial_test.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true
# Kernel probes proving the resolved seccomp profile is what the kernel enforces.
sandbox-core = { path = "../../system/sandbox-core", features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
