[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

# qOS application launcher. Reads a package manifest, constructs a
# bubblewrap-based sandbox per its declarations (bubblewrap + Landlock
# + seccomp), passes well-known service sockets in via SCM_RIGHTS, and
# execs the entrypoint binary inside the sandbox.
#
# This crate intentionally ships a minimal in-tree `MinimalManifest`
# shim: the canonical `qos-pkg` crate is being built in parallel. When
# it lands, swap `MinimalManifest` for the real type as a follow-up.

[[bin]]
name = "qos-launcher"
path = "src/main.rs"

[lib]
name = "launcher"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
runtime-bundle = { path = "../runtime-bundle" }
# The canonical manifest schema. The launcher still carries its own
# `MinimalManifest` decoder, but security-relevant enums that both
# sides must agree on (portal policy) come from here rather than
# being duplicated.
pkg = { path = "../pkg" }
# The capability vocabulary. Workspace grants arrive as `CapOverride`
# records and are evaluated with the same fail-closed decision function
# the compositor and the filesystem use — a launcher-local permission
# type would be a second vocabulary to drift out of sync.
collab-types = { path = "../../collab/collab-types" }

[dev-dependencies]
tempfile = "3"
# `HOME` / `XDG_CONFIG_HOME` are process-wide, so the tests that set them
# have to be serialised against each other across modules. Same pattern
# (and same crate) the shell uses for its static-state tests.
serial_test = "3"
