[package]
name = "app-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "What software this machine can open but has not installed yet, and how to get it."

[lib]
name = "app_cli"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
atomic-file = { path = "../../system/atomic-file" }
bounded-command = { path = "../../system/bounded-command" }
# The registry wire format + the per-entry publisher signature check.
registry-types = { path = "../registry-types" }
# Read side of the `tilo-install` registry — the same list the desktop
# enumerates installed apps from, so "available" is exactly "not in
# there".
launcher = { path = "../launcher" }
# Canonical application tapp wire-size ceiling; catalogue downloads enforce
# the same boundary as the installer rather than duplicating a number.
tilo-app-package = { path = "../tilo-app-package" }
clap.workspace = true
dirs.workspace = true
hex.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
# Explicitly install the workspace-standard ring provider at startup.
rustls.workspace = true

[dev-dependencies]
# The end-to-end test packs, publishes, and installs a .tapp.
app-registry = { path = "../app-registry" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
tempfile.workspace = true

[lints]
workspace = true
