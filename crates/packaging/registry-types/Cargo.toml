[package]
name = "registry-types"
version = "0.1.0"
edition = "2024"

[lib]
name = "registry_types"
path = "src/lib.rs"

# Wire types for the qOS app registry — the semi-federated
# marketplace that advertises `.qpkg` bundles. This crate defines
# the JSON shapes (`RegistryHandshake`, `RegistryEntry`,
# `EntryChangeRequest`) plus the canonical byte encoding the
# publisher signs over. Zero I/O and zero HTTP so both the
# self-hostable server and the on-device registry client can
# share the same types without pulling in a runtime.
#
# The canonical form for a publisher signature is
# `blake3("qos-registry-entry-v1\0" || postcard(entry-without-sig))`,
# mirroring the domain-separation pattern used by
# `crates/packaging/pkg::trust`.

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
postcard     = { version = "1", features = ["use-std"] }
blake3       = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex          = "0.4"
thiserror    = "1"

[dev-dependencies]
rand = "0.8"
