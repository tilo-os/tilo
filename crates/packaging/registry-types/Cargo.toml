[package]
name = "registry-types"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "registry_types"
path = "src/lib.rs"

# Wire types for the Tilo app registry — the semi-federated
# marketplace that advertises `.tapp` bundles. This crate defines
# the JSON shapes (`RegistryHandshake`, `RegistryEntry`,
# `EntryChangeRequest`) plus the canonical byte encoding the
# publisher signs over. Zero I/O and zero HTTP so both the
# self-hostable server and the on-device registry client can
# share the same types without pulling in a runtime.
#
# The canonical form for a publisher signature is
# `blake3("tilo-registry-entry-v1\0" || postcard(entry-without-sig))`,
# mirroring the domain-separation pattern used by
# `crates/packaging/tilo-app-package::trust`.

[dependencies]
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
getrandom.workspace = true

[lints]
workspace = true
