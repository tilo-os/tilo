[package]
name = "app-fleet"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "What every Tilo app's signed manifest says about it, compiled in: names, keywords, platforms, documents and closed actions."
repository.workspace = true
homepage.workspace = true

[lib]
name = "app_fleet"
path = "src/lib.rs"

# Data only, so the browser desktop links it as readily as the native shell.
[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
