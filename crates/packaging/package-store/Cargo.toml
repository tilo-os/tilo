[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "package-store"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "The device's installed packages: one registry of installed and preinstalled packages, and installs whose payload bytes live in the fs content store and are materialised once by reflink."
repository.workspace = true
homepage.workspace = true

[features]
# Readers (the launcher, the shell, settings) need only the registry and the
# catalogue. Installing, removing and collecting garbage additionally needs
# the content store.
default = []
# Honour the developer-only environment overrides (`package_store::dev_env`)
# in a release build. Debug builds always honour them; shipped images never
# enable this.
dev-overrides = []
# Launch leases on payload trees (`package_store::lease`): the launcher holds
# one per launch, and the store's removals respect them.
lease = ["dep:tilo-advisory-lock"]
store = [
    "lease",
    "dep:tilo-files",
    "dep:bytes",
    "dep:tilo-fs",
    "dep:iroh-blobs",
    "dep:tempfile",
    "dep:tilo-clock",
    "dep:tokio",
    "dep:tilo-user-identity",
]

[dependencies]
tilo-paths.workspace = true
tilo-app-package = { version = "0.1.0", path = "../tilo-app-package" }
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# The store's exclusive lock across processes, and launch leases.
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock", optional = true }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", optional = true }
bytes = { workspace = true, optional = true }
# The content store. Only its portable content plane is used here; the
# filesystem daemon stays out of the dependency graph.
tilo-fs = { version = "0.1.0", path = "../../system/fs", default-features = false, optional = true }
iroh-blobs = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
# Whose devices may publish images for the user: their identity's fleet.
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity", optional = true }

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"
required-features = ["store"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
