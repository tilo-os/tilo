# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# Store package formats: a package's archive (`.tapp`) and the manifest it
# signs, as a publisher writes them and a device installs them, and the
# registry's catalogue as a device reads it: full and compact snapshots,
# version indexes and channel authorizations, each carrying this version in
# its `protocol` field.
name = "package"
version = 2
version_const = "crates/packaging/registry-types/src/lib.rs:PACKAGE_FORMAT_VERSION"
encoding = "json"
served_to_apps = false
sources = [
    "crates/packaging/tilo-app-package/src/manifest.rs",
    "crates/packaging/tilo-app-package/src/tapp.rs",
    "crates/packaging/tilo-app-package/src/id.rs",
    "crates/packaging/registry-types/src/snapshot.rs",
    "crates/packaging/registry-types/src/compact.rs",
    "crates/packaging/registry-types/src/entry.rs",
]
roots = ["Manifest", "Header", "SignedRegistrySnapshot", "CompactRegistrySnapshot", "RegistryVersionIndex"]

