[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-app-package"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Tilo package format (.tapp): manifest, signing and verification."

[lib]
name = "tilo_app_package"
path = "src/lib.rs"

# The foundation crate for Tilo packages (.tapp). Defines the manifest
# schema, the BLAKE3 content-addressed package id, the thin and full
# `.tapp` archive codec, and the pack/unpack/sign/verify operations. Used by all
# package kinds (app, service, format-provider, plugin, runtime) and
# by both the native loader and the Flatpak packager.

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-xdg-paths = { version = "0.1.0", path = "../../../crates/system/xdg-paths" }
# Threshold-shared Ed25519 identity. Signing goes through the
# identity's group key; verify is a regular Ed25519 verify against
# the group public key, so callers only need the verifying-key
# bytes — not the threshold machinery — to verify a .tapp.
threshold-identity = { version = "0.1.0", path = "../../collab/threshold-identity" }
# Re-uses the canonical-bytes encoder + Ed25519 newtypes so the
# signed-bytes shape matches the rest of Tilo's signed wire types.
collab-types           = { version = "0.1.0", path = "../../collab/collab-types" }
# Canonical registry target spellings, shared with the manifest's `[target]`.
registry-types = { version = "0.1.0", path = "../registry-types" }

blake3.workspace = true
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
hex.workspace = true
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
tar.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
