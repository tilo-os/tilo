[package]
name = "app-catalogue"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The one catalogue of installable apps the Store and desktop search share: Tilo packages from the registries, Flathub from cached AppStream metadata, and the block list."

[lib]
name = "app_catalogue"
path = "src/lib.rs"

# No GUI, no HTTP: both the Store app and the desktop shell link this, and
# the shell reads it on a worker thread. Network refreshes stay where they
# already happen (`app list`, the hourly `tilo-app-update` run, Flatpak's
# own AppStream update); this crate only reads what they leave on disk.
[dependencies]
# What each Tilo app's manifest says, for apps not on this device.
app-fleet = { path = "../app-fleet" }
# The installed half: the registry of installed packages, each read through
# the signed manifest it was admitted with.
package-store = { path = "../package-store" }
tilo-app-package = { path = "../tilo-app-package" }
# What an app is called in a language: the one lookup every surface naming it shares.
collab-types = { path = "../../collab/collab-types" }
# The ids an app's records were kept under before it was renamed.
tilo-action-policy = { path = "../../collab/action-policy" }
# What an app is called: the one id type every surface naming it shares.
tilo-app-id.workspace = true
# File types, MIME types and URI schemes as the installed manifest claims
# them, in the one vocabulary the desktop resolves opens with.
desktop-policy = { path = "../../system/desktop-policy", default-features = false }
# `CatalogueApp`, the `app list --json` row a Tilo entry is made from.
registry-types = { path = "../registry-types" }
tilo-paths.workspace = true
flate2.workspace = true
quick-xml.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
