[package]
name = "app-catalogue"
version = "0.1.0"
edition = "2024"
description = "What software this machine can open but has not installed yet, and how to get it."

[lib]
name = "app_catalogue"
path = "src/lib.rs"

[[bin]]
name = "qos-catalogue"
path = "src/main.rs"

[dependencies]
# The registry wire format + the per-entry publisher signature check.
registry-types = { path = "../registry-types" }
# Read side of the `qos-install` registry — the same list the desktop
# enumerates installed apps from, so "available" is exactly "not in
# there".
launcher = { path = "../launcher" }
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
# Explicit rustls provider — the tree carries both ring + aws-lc-rs and
# rustls 0.23 won't auto-disambiguate. Matches `store`.
rustls.workspace = true

[dev-dependencies]
# The end-to-end test packs and publishes a real .qpkg, then installs it
# with the real installer — no part of the path is stubbed.
pkg = { path = "../pkg" }
app-registry = { path = "../app-registry" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
tempfile.workspace = true

[lints]
workspace = true
