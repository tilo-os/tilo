[package]
name = "runtime-update"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Self-update for the macOS Tilo.app: a signed release feed, then a same-signer bundle swap."

# Linux installs the runtime from distribution repositories and apps update
# through the registry, so only the macOS bundle updates itself. The feed,
# signature and swap are plain data and filesystem operations that build and
# test everywhere; fetching, code-signature checks and the daemon restart are
# `cfg(target_os = "macos")`.

[[bin]]
name = "tilo-runtime-update"
path = "src/main.rs"

[dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
