[package]
name = "app-fs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "FUSE3 driver that page-fault streams Tilo package payloads from a content-addressed blob store."

[lib]
name = "app_fs"
path = "src/lib.rs"

[dependencies]
fuser.workspace = true
blake3.workspace = true
moka.workspace = true
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
clap = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "tilo-app-mount"
path = "src/bin/tilo-app-mount.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
