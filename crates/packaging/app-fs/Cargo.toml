[package]
name = "app-fs"
version = "0.1.0"
edition = "2024"
description = "FUSE3 driver that page-fault streams qOS package payloads from a content-addressed blob store."

[lib]
name = "app_fs"
path = "src/lib.rs"

[dependencies]
fuser.workspace = true
blake3.workspace = true
lru = "0.16.3"
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
clap = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "qos-app-mount"
path = "src/bin/qos-app-mount.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile.workspace = true
hex.workspace = true

[lints]
workspace = true
