[package]
name = "registry-server"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "registry_server"
path = "src/lib.rs"

[[bin]]
name = "tilo-registry-server"
path = "src/main.rs"

# Self-hostable HTTP registry for `.tapp` bundles. Serves the
# `RegistryHandshake`, entry index, and a signed-POST endpoint so
# publishers can add / update / delete their own entries. Owner
# controls a `publishers.toml` allowlist; TLS is deliberately out
# of scope — deployments put the server behind nginx or Caddy.

[dependencies]
advisory-lock = { path = "../../system/advisory-lock" }
xdg-paths = { path = "../../system/xdg-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
registry-types = { path = "../registry-types" }
app-registry = { path = "../app-registry" }
tilo-app-package = { path = "../tilo-app-package" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "time", "io-util"] }
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
bytes.workspace = true
anyhow.workspace = true
blake3 = { workspace = true }
zeroize.workspace = true
# Moderation fetches run in the deployed container. Use its maintained CA
# bundle so newly issued public certificates do not depend on the root set
# compiled into an older pinned application image.
reqwest = { workspace = true, features = ["blocking", "json"] }
tilo-net = { path = "../../system/tilo-net", features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
getrandom.workspace = true
tempfile.workspace = true

[lints]
workspace = true
