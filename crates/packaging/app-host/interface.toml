# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ app host: the `app-host` service the launcher hands the Store and
# Settings, and nothing else. The Store's resources and actions (postcard
# calls, `crate::wire`) and Settings' language-pack requests (length-prefixed
# JSON) share its socket and its one number, apart from the runtime interface
# every app speaks. Checked by postcard's rules, the stricter of the two.
name = "app-host"
version = 5
version_const = "crates/packaging/app-host/src/lib.rs:APP_HOST_INTERFACE_VERSION"
encoding = "postcard"
served_to_apps = true
sources = [
    "crates/runtime/runtime-portal/src/runtime_request.rs",
    "crates/packaging/app-host/src/wire.rs",
    "crates/packaging/app-host/src/client.rs",
]
roots = ["Request", "Response", "Call", "Reply"]

[opaque]

[schema]
