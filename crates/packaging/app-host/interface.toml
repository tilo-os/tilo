# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ app host: the `app-host` service the launcher hands the Store, the
# Browser and Settings, and nothing else. The Store's package-management door
# (Cap'n Proto) and the runtime and language-pack requests (length-prefixed
# JSON) share its socket and its one number, apart from the runtime interface
# every app speaks.
name = "app-host"
version = 3
version_const = "crates/packaging/app-host/src/lib.rs:APP_HOST_INTERFACE_VERSION"
encoding = "json"
served_to_apps = true
sources = ["crates/runtime/runtime-portal/src/runtime_request.rs"]
roots = ["Request", "Response"]
capnp = ["crates/packaging/app-host/schema/app-host.capnp"]

[opaque]

[schema]
"OfferedLanguage" = "struct"
"OfferedLanguage.installed" = "bool"
"OfferedLanguage.locale" = "String"
"Phase" = "enum external"
"Phase::downloading" = "unit"
"Phase::installing" = "unit"
"Phase::preparing" = "unit"
"Request" = "enum internal tag=request"
"Request::ensure" = "struct"
"Request::ensure.runtime" = "String"
"Request::install_language_pack" = "struct"
"Request::install_language_pack.locale" = "String"
"Request::language_packs" = "unit"
"Request::relaunch" = "struct"
"Request::relaunch.uri" = "Option<String> optional"
"Response" = "enum internal tag=state"
"Response::failed" = "struct"
"Response::failed.message" = "String"
"Response::installed" = "unit"
"Response::installing" = "struct"
"Response::installing.phase" = "Phase"
"Response::installing.received" = "u64"
"Response::installing.total" = "Option<u64> optional"
"Response::language_packs" = "struct"
"Response::language_packs.offered" = "Vec<OfferedLanguage>"
"Response::refused" = "struct"
"Response::refused.message" = "String"
"Response::relaunched" = "unit"
