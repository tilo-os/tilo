[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "app-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo app host — the privileged door to the device package store over a Cap'n Proto control socket: verified installs for the Store, pin, remove, launch and size-pressure eviction."

[[bin]]
name = "tilo-app-host"
path = "src/main.rs"

[lib]
name = "app_host"
path = "src/lib.rs"

[features]
# Honour the developer-only environment overrides (`src/dev_env.rs`, and the
# system store's in `package-store`) in a release build. Debug builds always
# honour them; shipped images never enable this.
dev-overrides = ["package-store/dev-overrides"]

[dependencies]
tilo-xdg-paths = { path = "../../system/xdg-paths" }
bounded-command = { path = "../../system/bounded-command" }
tilo-app-package = { path = "../tilo-app-package" }
# The one package registry and store; this daemon keeps none of its own.
package-store = { path = "../package-store", features = ["store"] }
app-registry = { path = "../app-registry" }
runtime-portal = { path = "../../runtime/runtime-portal" }

# Cap'n Proto RPC for the control socket, matching format-host.
capnp.workspace = true
capnp-rpc.workspace = true

# Async runtime + transport.
tokio = { workspace = true, features = ["macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
# capnp-rpc speaks futures-io; `io` supplies its buffered reader/writer.
futures-util = { workspace = true, features = ["io"] }

# Daemon plumbing.
clap.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
tempfile.workspace = true

# systemd notify (sd_notify); missing environment variables are tolerated.
sd-notify.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
getrandom.workspace = true
tokio = { workspace = true, features = ["full"] }
ed25519-dalek.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[bench]]
name = "install_timing"
path = "benches/install_timing.rs"
harness = false

[lints]
workspace = true
