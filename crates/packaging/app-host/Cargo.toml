[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "app-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo app host — content-addressed package store + Cap'n Proto control socket. Resolves package_id → manifest + payload-root for the launcher, tracks Pinned vs LRU, runs size-pressure GC."

[package.metadata.cargo-machete]
# Invoked by build.rs to compile the Cap'n Proto schema.
ignored = ["capnpc"]

[[bin]]
name = "tilo-app-host"
path = "src/main.rs"

[lib]
name = "app_host"
path = "src/lib.rs"

[features]
# Honour the developer-only environment overrides (`src/dev_env.rs`) in a
# release build. Debug builds always honour them; shipped images never enable
# this.
dev-overrides = []

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
bounded-command = { path = "../../system/bounded-command" }
tilo-app-package = { path = "../tilo-app-package" }
app-registry = { path = "../app-registry" }
runtime-portal = { path = "../../runtime/runtime-portal" }

# Cap'n Proto RPC for the control socket, matching format-host.
capnp.workspace = true
capnp-rpc.workspace = true

# Async runtime + transport.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

# Daemon plumbing.
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
tempfile.workspace = true

# systemd notify (sd_notify); missing environment variables are tolerated.
sd-notify.workspace = true

[build-dependencies]
capnpc.workspace = true

[dev-dependencies]
getrandom.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["full"] }
ed25519-dalek.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[bench]]
name = "install_timing"
path = "benches/install_timing.rs"
harness = false

[lints]
workspace = true
