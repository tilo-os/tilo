[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "app-host"
version = "0.1.0"
edition = "2024"
description = "qOS app host — content-addressed package store + Cap'n Proto control socket. Resolves package_id → manifest + payload-root for the launcher, tracks Pinned vs LRU, runs size-pressure GC."

[[bin]]
name = "qos-app-host"
path = "src/main.rs"

[lib]
name = "app_host"
path = "src/lib.rs"

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../../crates/system/atomic-file" }
pkg = { path = "../pkg" }
app-registry = { path = "../app-registry" }

# Cap'n Proto RPC for the control socket, matching format-host.
capnp.workspace = true
capnp-rpc.workspace = true

# Async runtime + transport.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

# Daemon plumbing.
clap.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
parking_lot.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tar.workspace = true

# systemd notify (sd_notify) — best-effort; we degrade if env vars missing.
sd-notify.workspace = true

[build-dependencies]
capnpc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
ed25519-dalek.workspace = true
rand.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
