[package]
name = "registry-web-bindgen"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# JavaScript bindings for `registry-web`, built with
# `crates/browser/web-registry-client/build-verifier.sh`. Everything that
# decides trust lives in `registry-web`; this crate only converts types.

[lib]
name = "registry_web_bindgen"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
registry-web = { path = "../registry-web" }
serde_json.workspace = true
wasm-bindgen = "=0.2.108"

[lints]
workspace = true
