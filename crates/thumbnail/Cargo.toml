[package]
name = "thumbnail"
version = "0.1.0"
edition = "2024"

# The one shared thumbnail generator + content-addressed cache for qOS. The FUSE
# filesystem host-generates previews as metadata, the file manager and pickers
# request them off-thread, and system apps (ebook, video_editor, pdf_viewer)
# reuse the same decode paths instead of each rolling their own.
#
# Kept free of `vello`/`wgpu`/`ui` on purpose: the FUSE daemon links this crate
# to host-generate previews, and it must never pull a GPU stack into the OS
# image. Generation yields raw RGBA + encoded PNG bytes; the UI layer converts
# to `peniko::ImageData` at the edge.

[features]
default = []
# Real PDF first-page rasterisation via pdfium (dynamically loads libpdfium at
# runtime; falls back to a type badge when the library is absent). Pure-Rust to
# BUILD — no native build dep — so enabling it never breaks a hermetic compile.
pdf = ["dep:pdfium-render"]
# Real video keyframe extraction through the shared `media` GStreamer engine.
# Off by default so hermetic builds, `--shots` and CI need no gstreamer stack.
video = ["dep:media", "media/decode"]

[dependencies]
# The shared decode + downscale primitive (the same 0.25 line every app uses, so
# `DynamicImage` unifies to one type across the workspace).
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# EPUB covers: a container is a ZIP with an OPF manifest pointing at a cover
# image — the same reader the ebook app uses, lifted to the shared crate.
zip.workspace = true
roxmltree = "0.20"
# Content addressing (same hash the rest of qOS uses end-to-end).
blake3.workspace = true
# In-memory LRU in front of the on-disk cache.
moka = { version = "0.12.15", features = ["sync"] }
hex.workspace = true
serde = { workspace = true, features = ["derive"] }

# Optional decoders — see [features] above.
pdfium-render = { version = "0.8.37", optional = true }
media = { path = "../media", optional = true }

[dev-dependencies]
tempfile.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[lints]
workspace = true
