[package]
name = "compat-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo broker for default-deny Wine, UMU/Proton, and Windows VM launches"

[features]
# Lets a test of a crate that serves the service plan launches on a computer
# without the Windows runtime payloads.
test-support = []

[lib]
name = "compat_service"
path = "src/lib.rs"

[dependencies]
tilo-permissions = { version = "0.1.0", path = "../../core/permissions" }
tilo-actions = { path = "../../core/actions" }
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
# Who is on the other end of the launcher's socket: the kernel's account of the caller.
tilo-peer-facts = { path = "../../core/peer-facts" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
compat-catalogue = { path = "../compat-catalogue" }
launcher = { path = "../../core/launcher" }
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows-vm = { path = "../windows-vm" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
