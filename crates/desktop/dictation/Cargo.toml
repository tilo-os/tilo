[package]
name = "tilo-dictation"
description = "Dictation in the session: a local recognizer over the microphone, allowed once per dictation by the person, whose text is committed into the field they were in"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "tilo_dictation"

[dependencies]
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
blake3.workspace = true
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
media = { package = "tilo-media", path = "../../engines/tilo-media" }
serde.workspace = true
serde_json.workspace = true
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings", features = ["watch"] }
tilo-accessibility-settings = { path = "../tilo-accessibility-settings" }
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-service = { path = "../service" }
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
