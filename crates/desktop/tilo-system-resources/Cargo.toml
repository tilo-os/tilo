[package]
name = "tilo-system-resources"
description = "What the session's system resources are, as an app and the session share them: their ids, their actions and the readings' types. Reading or changing the machine is the session's system service's."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
tilo-resource = { path = "../../core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
