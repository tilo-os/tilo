[package]
autotests = false
name = "tilo-desktop-model"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The canonical Tilo desktop model shared by every host."

# The canonical desktop model: workspaces, strips, window groups, tabs and the
# people and permissions attached to them. Pure data and pure functions — no
# compositor, toolkit, transport, async runtime or host filesystem, so every
# host (native compositor, headless peer, anything else) shares one model.
# `tools/policy/check_crate_graph.py` enforces that list.

[dependencies]
tilo-member-types.workspace = true
# Which apps' windows open a record each member keeps as their own, as their manifests declare.
app-fleet = { package = "tilo-app-fleet", version = "0.1.0", path = "../app-fleet" }
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
automerge.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../../core/collab-types" }
desktop-policy = { package = "tilo-default-apps", version = "0.1.0", path = "../default-apps", default-features = false }
hex.workspace = true
# A window's own state is sealed to its readers' key group.
key-group = { package = "tilo-key-group", version = "0.1.0", path = "../../core/key-group" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-app-id.workspace = true
tilo-automation = { version = "0.1.0", path = "../../core/automation" }
uuid.workspace = true

[dev-dependencies]
# A window's state round-trips as the tilolang runtime's typed values.
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
# Tests take a peer's changes in the way production does (clippy.toml).
tilo-automerge.workspace = true
# `scenario!`: the cases of one subject in one test function.
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
