[package]
name = "tilo-render-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A workspace's render service: the one process that draws toolkit apps on the GPU. Validates each app's scenes, rasterizes them with vello into dma-bufs the compositor imports like any client buffer, and keeps every app's memory and pixels apart."

[dependencies]
tilo-render-protocol = { path = "../../ui/tilo-render-protocol" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["dmabuf-import", "model"], default-features = false }
vello.workspace = true
pollster.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tilo-rt.workspace = true
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tilo-font-catalog = { version = "0.1.0", path = "../../platform/font-catalog" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["dmabuf-import", "model", "host"] }

[target.'cfg(target_os = "linux")'.dependencies]
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
rustix = { workspace = true, features = ["event", "fs", "mm", "net", "process", "std", "time"] }
libc.workspace = true
tilo-sandbox-core = { path = "../../platform/sandbox-core" }
# The session-wide budget of extra devices a CPU driver's warm-up compiles on.
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
# The runtime bundles the apps run on carry the product font catalog.
runtime-bundle = { package = "tilo-runtime-bundle", path = "../../core/runtime-bundle" }

[dev-dependencies]
rustix = { workspace = true, features = ["fs"] }
# The service starts as a process of its own, outside every other test's environment scope.
tilo-test-env = { path = "../../../tools/test-env" }

# The service runs as a process of its own, started the way the session starts it: this target's
# `main` is that process too, which `libtest` would not let it be.
[[test]]
name = "started"
path = "tests/started.rs"
harness = false

[lints]
workspace = true
