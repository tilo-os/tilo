[package]
name = "tilo-control"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "tilo-control: drive a running Tilo desktop through its control sockets"
repository.workspace = true
homepage.workspace = true

# Where the control sockets live, shared with the compositor that binds them.
[lib]
name = "tilo_control"
path = "src/lib.rs"

# A client of the control protocol only: no compositor, ui or rendering
# dependencies, so every image ships it at the cost of a small binary.
[[bin]]
name = "tilo-control"
path = "src/main.rs"

[dependencies]
libc.workspace = true
# An answer reads in the order the action gave its fields.
serde_json = { workspace = true, features = ["preserve_order"] }
tilo-paths.workspace = true
# Where this computer's daemon listens, which answers the frames with or without a desktop.
tilo-machine.workspace = true
# The action model's frames, which `tilo do` and `tilo open` send, and the
# published tree's own picking of an action by name.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
# The console control socket is reached by path: a Unix socket, or a named pipe on Windows.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-actions = { path = "../../core/actions", features = ["test-support"] }

[lints]
workspace = true
