[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-app-keeper"
description = "Keeps one app's Wayland windows open while the desktop restarts: a small Wayland server for the app that mirrors its windows to the desktop as one client, holds them while the desktop is away and recreates them on the next one."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-app-keeper"
path = "src/bin/tilo-app-keeper.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[features]
# Lets a test make the keeper break the desktop's protocol on purpose, to
# prove how a fault is held and reported.
test-support = []

[target.'cfg(target_os = "linux")'.dependencies]
# The app's side: a Wayland server with smithay's protocol state (surfaces,
# shared memory, dma-bufs, xdg-shell, outputs) and no renderer.
# Its `xwayland` feature binds an X11 display (`--x11`); the X server is xwayland-satellite.
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "xwayland"] }
# The desktop's side: one ordinary Wayland client.
wayland-client = { workspace = true }
wayland-protocols = { version = "0.32.12", features = ["client", "server", "unstable", "staging"] }
# The KDE spelling of window decorations, which lives outside wayland-protocols.
wayland-protocols-misc = { version = "0.3.10", features = ["client"] }
serde.workspace = true
serde_json.workspace = true
# The rules an app's colour-management requests are checked by, the compositor's own.
tilo-color-params = { path = "../color-params" }
# The names text goes by for X11 and Wayland programs: a kept X11 program's copy is offered
# under the Wayland ones too, as the compositor offers its own X11 programs' copies.
tilo-x11-transfer = { path = "../x11-transfer" }
# The control socket's frames: the length prefix every session socket uses.
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
# A socket in a directory of any depth.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# Wall-clock milliseconds for synthetic pointer events.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# Who is on the other end of the control socket: the kernel's account of the caller.
tilo-peer-facts = { path = "../../core/peer-facts" }
libc.workspace = true
# The descriptor the session hands with Attach (SCM_RIGHTS).
rustix = { workspace = true, features = ["net", "fs", "process", "event", "rand", "pipe"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The registry: where keepers live, and a fresh directory's name.
tilo-paths.workspace = true
# When the app started, which the session checks it against before it takes it back.
tilo-process = { path = "../../platform/tilo-process" }
uuid.workspace = true
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-app-keeper = { path = ".", features = ["test-support"] }
tilo-compositor = { path = "../compositor", features = ["test-support"] }
# The colour a window's description says, as the desktop reads it back.
neighbour-wire = { package = "tilo-neighbour-wire", path = "../../core/neighbour-wire" }
# A child started under the environment lock, outside every other test's scope.
tilo-test-env = { path = "../../../tools/test-env" }
tempfile.workspace = true
wayland-client = { workspace = true }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
# An X client of the keeper's own X11 display.
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true
