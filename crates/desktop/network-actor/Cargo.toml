[package]
name = "tilo-network-actor"
description = "The desktop's peer-to-peer transport: the iroh actor that keeps workspace links, sessions with the person's own devices, direct links and a person's private device connection."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# The hooks the shell's tests reach the actor through: test membership
# epochs, captured governance warnings, and no content-peer
# registration with a filesystem daemon that is not running.
test-support = []

[dependencies]
blake3.workspace = true
bytes.workspace = true
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom.workspace = true
hex.workspace = true
libc.workspace = true
iroh.workspace = true
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["realtime"] }
neighbour-wire = { package = "tilo-neighbour-wire", path = "../../core/neighbour-wire" }
os-actions = { path = "../../os/os-actions" }
postcard = { workspace = true, features = ["alloc"] }
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab" }
serde.workspace = true
serde_json.workspace = true
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
thiserror.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-delivery-protocol = { path = "../../core/tilo-delivery-protocol" }
tilo-desktop-model = { path = "../desktop-model" }
tilo-endpoint-reachability = { path = "../../core/endpoint-reachability" }
# Who a device is and the revision a fact carries, as every host reads them.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
tilo-identity = { path = "../../core/tilo-identity" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-peer-state = { path = "../../core/tilo-peer-state" }
tilo-server-protocol = { path = "../../core/tilo-server-protocol" }
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["apps"] }
tilo-rt.workspace = true
tilo-seal = { path = "../../core/tilo-seal" }
tilo-session-client = { path = "../../core/session-client" }
tilo-unlock-protocol = { path = "../../core/tilo-unlock-protocol" }
tilo-user-identity = { path = "../../core/tilo-user-identity" }
# The join contract's transport hint, named where it is owned.
tilo-workspace-join = { path = "../../core/workspace-join" }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
# Workspace sync states, as apps are told them.
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame", features = ["tokio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core" }

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
fnv.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
tempfile.workspace = true
tilo-peer-state = { path = "../../core/tilo-peer-state", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
