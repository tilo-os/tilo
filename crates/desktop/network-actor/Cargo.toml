[package]
name = "tilo-network-actor"
description = "Who a device is and what the person's devices say to each other: the portable vocabulary a device, a stamp and an exchange are named by."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# Kept for the callers that name it: the transport lives in the device's daemon now.
test-support = []

[dependencies]
blake3.workspace = true
getrandom.workspace = true
hex.workspace = true
libc.workspace = true
iroh.workspace = true
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["realtime"] }
neighbour-wire = { package = "tilo-neighbour-wire", path = "../../core/neighbour-wire" }
postcard = { workspace = true, features = ["alloc"] }
runtime-collab = { package = "tilo-runtime-collab", path = "../../core/runtime-collab" }
serde.workspace = true
thiserror.workspace = true
tilo-desktop-model = { path = "../desktop-model" }
tilo-identity = { path = "../../core/tilo-identity" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-resource = { path = "../../core/tilo-resource" }
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["apps"] }
tracing.workspace = true
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }

[dev-dependencies]

[lints]
workspace = true
