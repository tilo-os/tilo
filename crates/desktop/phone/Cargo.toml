[package]
name = "tilo-phone"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo on a phone: the device daemon run in the app's own process, and the tilolang shell's phone form shown over it."

[lib]
name = "tilo_phone"
path = "src/lib.rs"

# The tilolang apps the APK carries: `tilolang build --platform android` compiles each and packs
# its bundle into `assets/tilo/apps`.
[package.metadata.tilo-app]
tilolang = ["../../../apps/tl/notes", "../../../apps/tl/chat"]
# The APK serves the person's workspace files to Android's own picker: its manifest carries the
# documents provider whose native side this library exports.
workspace-files = true
# Pushes reach the phone while its app is closed, through a UnifiedPush distributor: the APK's
# manifest declares the connector's receiver, and its Rust opens every push with the device's key.
unified-push = true

[features]
# A thin build links the toolkit dynamically, so `tilolang dev` reloads the app in place.
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-action-services = { version = "0.1.0", path = "../../core/action-services" }
runtime-dylib = { path = "../../../crates/sdk/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../../crates/sdk/tilo-app" }
# The device daemon, started on the app's own threads: Android runs no daemon process of its own.
tilo-runtime = { path = "../../../crates/core/tilo-runtime" }
# What the daemon's capabilities are on a phone: the subsystems it mounts at its start.
tilo-daemon = { path = "../../../crates/os/daemon" }
# The shell, compiled from its sources as every host compiles it, and the platform's packages.
tilolang-tilo = { path = "../../../crates/lang/tilolang-tilo" }
tilo-app-window = { path = "../../../crates/sdk/tilo-app-window" }
tilo-render-protocol = { path = "../../../crates/ui/tilo-render-protocol" }
tilo-paths = { path = "../../../crates/platform/tilo-paths" }
tilo-machine = { path = "../../../crates/platform/tilo-machine" }
# The type of a file the workspace holds, by its name, as a file picker shows it.
tilo-mime = { path = "../../../crates/platform/tilo-mime" }
# The platform a window with no session stands on: the packages it loads, its words and clock.
tilolang-window = { path = "../../../crates/lang/tilolang-window" }
# An app the person opens runs in tilolang-process's in-process window.
tilolang-process = { path = "../../../crates/lang/tilolang-process", features = ["app-launch"] }
# The app's own signed package manifest, which the APK it runs from carries: what says which
# runtime build it links.
tilo-app-package = { path = "../../../crates/core/tilo-app-package" }
anyhow.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }
# What a person is told, as every Tilo surface names it: the log's records and the words a
# notification shows.
tilo-actions = { path = "../../../crates/core/actions" }
# What the phone shows the person was told through, and the notifier its notification links are.
tilo-process-services = { version = "0.1.0", path = "../../sdk/tilo-process-services" }
# The phone's own push key and the `aes128gcm` a push is opened with, which RFC 8291 encrypts
# with a P-256 agreement, HKDF-SHA256 and AES-128-GCM.
p256 = { version = "0.14", features = ["ecdh"] }
ring = "0.17.14"
hex.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Android's documents API reaches the phone's device through the app's own Java classes, and the
# push receiver hands a push over decrypted (`Java_so_tilo_android_TiloPush_nativePush`).
jni = "0.21.1"
# The app's context, which the file provider hands over for the Keystore when no activity runs.
tilo-process = { path = "../../../crates/platform/tilo-process" }

[dev-dependencies]
# The Android receiver's JNI entry is type-checked by the unit tests.
jni = "0.21.1"
tempfile.workspace = true
# The phone's places, set as its launch sets them and put back after the test.
tilo-test-env = { path = "../../../tools/test-env" }
# The person's laptop that prints the phone's ticket, and the server it enters.
tilo-api = { path = "../../../crates/core/tilo-api", features = ["test-support"] }
tilo-device-identity = { path = "../../../crates/core/tilo-device-identity" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The person's server the phone signs in to, and the `keep_app_file` that hands it a package
# without a device's session.
test-server = { path = "../../../tools/test-server" }
tilo-workspace-service = { path = "../../../crates/core/tilo-workspace-service", features = ["files", "test-support", "agents"] }
tilo-person-services = { path = "../../../crates/core/person-services", features = ["test-support", "agents"] }
tilo-app-host = { path = "../../../crates/core/app-host", features = ["files", "test-support", "agents"] }
# The host's WebPush sender, which reaches a push service on this machine in tests, and the
# teller that hands it what waits for a person with nothing of theirs looking.
tilo-server = { path = "../../../crates/core/tilo-server", features = ["web", "test-support", "agents"] }
# A push service on this machine, which the sender is told to trust.
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tilo-server-protocol = { path = "../../../crates/core/tilo-server-protocol" }
tilo-user-identity = { path = "../../../crates/core/tilo-user-identity" }
tilo-clock = { path = "../../../crates/platform/tilo-clock" }
ed25519-dalek.workspace = true
iroh.workspace = true
# Notes, built from the tree and installed into the workspace the phone joins.
tilolang-cli = { path = "../../../crates/lang/tilolang-cli" }
# A workspace that runs Notes: its package, installed through the workspace's published action.
tilo-actions = { path = "../../../crates/core/actions" }
hex.workspace = true
# The server's Automerge workers are this test binary, started again.
tilo-automerge-isolate.workspace = true
# Clocks' records, written as another device of the person's writes them, and the language the
# person's server runs.
tilolang-workspace = { path = "../../../crates/lang/tilolang-workspace" }
# The store commands the person's server is asked what it keeps of the phone's own window with.
collab-types = { package = "tilo-collab-types", path = "../../../crates/core/collab-types" }

[lints]
workspace = true
