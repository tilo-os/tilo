[package]
name = "tilo-phone"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo on a phone: the device daemon run in the app's own process, and the tilolang shell's phone form shown over it."

[lib]
name = "tilo_phone"
path = "src/lib.rs"

# The tilolang apps the APK carries: `tilolang build --platform android` compiles each and packs
# its bundle into `assets/tilo/apps`.
[package.metadata.tilo-app]
tilolang = ["../../../apps/tl/notes", "../../../apps/tl/chat"]

[features]
# A thin build links the toolkit dynamically, so `tilolang dev` reloads the app in place.
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../../crates/sdk/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../../crates/sdk/tilo-app" }
# The device daemon, started on the app's own threads: Android runs no daemon process of its own.
tilo-runtime = { path = "../../../crates/core/tilo-runtime" }
# What the daemon's capabilities are on a phone: the subsystems it mounts at its start.
tilo-daemon = { path = "../../../crates/os/daemon" }
# The shell, compiled from its sources as every host compiles it, and the platform's packages.
tilolang-tilo = { path = "../../../crates/lang/tilolang-tilo" }
tilo-app-window = { path = "../../../crates/sdk/tilo-app-window" }
tilo-render-protocol = { path = "../../../crates/ui/tilo-render-protocol" }
tilo-paths = { path = "../../../crates/platform/tilo-paths" }
# The platform a window with no session stands on: the packages it loads, its words and clock.
tilolang-window = { path = "../../../crates/lang/tilolang-window" }
# An app the person opens runs in tilolang-process's in-process window.
tilolang-process = { path = "../../../crates/lang/tilolang-process", features = ["app-launch"] }
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# The phone's places, set as its launch sets them and put back after the test.
tilo-test-env = { path = "../../../tools/test-env" }
# The person's laptop that prints the phone's ticket, and the server it enters.
tilo-api = { path = "../../../crates/core/tilo-api", features = ["test-support"] }
tilo-device-identity = { path = "../../../crates/core/tilo-device-identity" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The person's server the phone signs in to, and the `keep_app_file` that hands it a package
# without a device's session.
test-server = { path = "../../../tools/test-server" }
tilo-workspace-service = { path = "../../../crates/core/tilo-workspace-service", features = ["test-support"] }
tilo-server-protocol = { path = "../../../crates/core/tilo-server-protocol" }
tilo-user-identity = { path = "../../../crates/core/tilo-user-identity" }
tilo-clock = { path = "../../../crates/platform/tilo-clock" }
ed25519-dalek.workspace = true
iroh.workspace = true
# Notes, built from the tree and installed into the workspace the phone joins.
tilolang-cli = { path = "../../../crates/lang/tilolang-cli" }
# A workspace that runs Notes: its package, installed through the workspace's published action.
tilo-app-package = { path = "../../../crates/core/tilo-app-package" }
tilo-actions = { path = "../../../crates/core/actions" }
hex.workspace = true
# The server's Automerge workers are this test binary, started again.
tilo-automerge-isolate.workspace = true

[lints]
workspace = true
