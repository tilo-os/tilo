[package]
name = "tilo-desktop-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
readme = "../../../docs/crates/supporting-crate.md"
description = "Desktop search shared by the native shell and the portable desktop surface: result kinds, the cross-provider ranking, portable providers and the palette session."
repository.workspace = true
homepage.workspace = true

# Builds on the portable `tilo-ui` build so the browser desktop and the native
# shell rank, group and present search results with one implementation.

[features]
# The session's on-disk indexes: what apps publish of their content, and
# the bodies of the person's files. Native only.
indexes = ["dep:tilo-action-policy", "dep:tilo-files", "dep:tilo-lock", "dep:tilo-paths", "dep:tilo-reference", "dep:tempfile", "dep:tilo-search", "dep:tracing", "dep:walkdir"]
# Settings' pages and the settings on them, from Settings' own index: the page
# finds the pages its own Settings shows.
settings = ["dep:settings-store"]
# The apps a person can get, from the catalogue the Store reads. Native
# only.
catalogue = ["dep:app-catalogue"]

[dependencies]
# Where choosing a notice lands, as a search hit opens it.
tilo-service = { version = "0.1.0", path = "../service" }
# Exchange-rate conversion shared with the confined network-answers helper;
# without `fetch`, search links no HTTP client and no sandbox.
tilo-net-answers = { version = "0.1.0", path = "../../integrations/net-answers", default-features = false }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# Every Tilo app's manifest metadata: where it runs, its names and keywords.
app-fleet = { version = "0.1.0", path = "../app-fleet" }
ui = { version = "0.1.0", package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
# An app id written as words for a person, the one spelling every surface naming an app or a
# member uses.
collaboration = { version = "0.1.0", path = "../../core/collaboration" }
app-catalogue = { version = "0.1.0", path = "../../core/app-catalogue", optional = true }
settings-store = { version = "0.1.0", path = "../../system/settings-store", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy", optional = true }
# The watch that keeps the person's file names current.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["watch"], optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock", optional = true }
tilo-paths = { workspace = true, optional = true }
tilo-reference = { version = "0.1.0", path = "../../core/reference", optional = true }
tilo-search = { version = "0.1.0", path = "../../engines/search", features = ["disk"], optional = true }
tracing = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
serial_test.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
