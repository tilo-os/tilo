tilolang-mail = { path = "../../integrations/tilolang-mail", default-features = false }
tilolang-youtube = { path = "../../integrations/tilolang-youtube" }
tilolang-music = { path = "../../integrations/tilolang-music" }
tilolang-calendar = { path = "../../integrations/tilolang-calendar", default-features = false }
# The toolkit's words, which what a package the session runs publishes reads through.
tilo-app-window = { path = "../../sdk/tilo-app-window" }
# `tilolang check` and build as the session's own commands over a package in the person's
# workspace: a style is written, checked and installed as any app is (`shell.md` §6).
tilolang-cli = { path = "../../lang/tilolang-cli" }
app-catalogue = { path = "../../core/app-catalogue" }
# The pictures the shell shows: the image's own, and the person's.
tilo-wallpapers = { path = "../tilo-wallpapers" }
# The registries' listing as this device last accepted it, for the apps a
# person can get.
app-cli = { path = "../../os/app-cli" }
# The login's own password check, when the machine's unlock helper is not
# installed: the conversation greetd admitted this session through.
greetd-client = { path = "../../os/greetd-client" }
# The host's own filesystem moves a paste depends on: a rename that never
