tilolang-process = { path = "../../lang/tilolang-process" }
# The page track and window-share tests drive a synchronous web engine.
tilo-webview = { version = "0.1.0", path = "../../engines/tilo-webview" }
# A check that answers a sheet as the person does asks the questions service the
# sheets show, and reads its answer back.
tilo-service = { path = "../service" }
# The manager an app's window joins its workspace's record with: a test speaks as the window.
collaboration = { path = "../../core/collaboration" }
# A notebook as a page's store holds it, read for what Notes tells search it holds: the page's
# search finds a note by its title and its words.
# A development session's tilolang apps, built into signed `.tapp`s the tests install into
# their own app store: the same packages `dist/dev/shell-run.sh` installs. `tilolang-cli` and
# `package-store`'s writer are normal dependencies of the session (a person's own style is
# written, checked and installed the same way), so a test needs nothing extra here.
tilo-app-package = { path = "../../core/tilo-app-package" }
# The events the actor hands the session, which its own tests hand the sync
# directly: the membership epoch on them is the actor's to mint.
tilo-network-actor = { path = "../network-actor", features = ["test-support"] }
# What a person types at their desktop: `tilo do` lists the catalogue and runs one
# action over the control socket the session serves here.
tilo-control = { path = "../control-cli" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The runtimes a device runs tilolang apps' windows on, signed and installed as a device's own
# store holds them: Chat's windows run on them as they do on a person's computer.
runtime-bundle = { path = "../../core/runtime-bundle" }
# A Windows program that shows through X11, as a Proton program does: the stand-in draws its
# window on the X11 display its keeper serves.
x11rb = { version = "0.13", default-features = false }
# A paste killed mid-transfer: the crash test's child process ends on a
# signal, as a power cut ends a machine.
libc.workspace = true
# A call's tone and played samples with no device stack: a test hears the
# same encoder, stream and playout a device's call uses.
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["voice", "test-support"] }
# Reporting an ending to a session's apps as its spawner would, with the
# memory cause a launcher remembers.
tilo-app-launch = { path = "../app-launch", features = ["test-support"] }
# A Windows program's launch planned on a computer without the Windows payloads,
# and the catalogue that routes it.
compat-service = { path = "../../compat/compat-service", features = ["test-support"] }
compat-catalogue = { path = "../../compat/compat-catalogue" }
windows-vm = { path = "../../compat/windows-vm" }
# The stand-in logind and UPower a power test serves over a socket pair.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
# A packet relay on this machine's loopback, for two of the person's devices
# enrolling a machine in one process.
iroh-relay = { version = "1.0.3", features = ["server"] }
zbus = { workspace = true, features = ["tokio", "p2p"] }
tilo-test-env = { path = "../../../tools/test-env" }
# The log a test's people write while it runs.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# A site's entry and directory served over loopback, for what joins list.
test-http = { path = "../../../tools/test-http" }
# The broker's certified-connection context, for driving a service the way
# the broker admits Files.
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["apps", "test-support"] }
# A site's workspace as a site runs it: the host on this machine that
# governs the workspace a join enrolls into, folding what its pages write,
# and the page of its person that recorded there first.
tilo-server = { path = "../../core/tilo-server", features = ["web"] }
# What `NetworkManager` says, fed in rather than read from a bus.
tilo-nm = { path = "../../os/tilo-nm" }
# The other device's tunnel and this one's, in memory, for what a route
# carries.
tilo-device-vpn = { path = "../../os/device-vpn", default-features = false, features = ["test-support"] }
tilo-endpoint-reachability = { path = "../../core/endpoint-reachability", features = ["test-support"] }
# A server host on this machine's loopback, which is what a test's devices relay through.
test-server = { path = "../../../tools/test-server", features = ["questions"] }
futures-util.workspace = true
tilo-copy-lint = { path = "../../../tools/copy-lint" }
tilo-audio-service = { path = "../../os/audio-service" }
tilo-onboarding = { path = "../onboarding" }
tilo-quick-settings = { path = "../../session/quick-settings", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["test-support"] }
# The sheets' apps mounted for a person, so a test presses a control of one
# as the person's own gesture.
tilo-app = { path = "../../sdk/tilo-app", features = ["test-support"] }
wayland-client.workspace = true
# What a scanner reads from a code the session draws: the invite sheet's
# test decodes the invitation back out of its QR.
rqrr = { workspace = true, default-features = true }
# The text a field asks a keyboard for, as an app's toolkit speaks it.
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
# A display tool speaking `wlr-output-management` to the session's compositor.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The document a tree record is read as: a test runs the files daemon's writer
# against a session, as a mount does.
fs-protocol = { path = "../../core/fs-protocol" }
# The input method a text field's client runs for the seat, as the person's
# on-screen keyboard does.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# The action host a test's answering device runs its actions through, and the
# certified workspace two of one person's devices ask each other in.
tilo-actions = { path = "../../core/actions", features = ["test-support"] }
tilo-peer-state = { path = "../../core/tilo-peer-state", features = ["test-support"] }
# A change another device's app wrote, read back into a record: a receiver's
# way of taking changes, which the session's own code uses too.
tilo-automerge = { path = "../../core/tilo-automerge" }
# A `wl_shm` client that commits once per key and times each key on its own
# clock: the app side of the key-latency measurement, which a compositor
# without a GPU import can still show.
smithay-client-toolkit = "0.20.0"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web has no system random source; the page supplies the browser's.
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh.workspace = true