settings-sections = { path = "../../system/settings-sections" }
# The calls an app joins: which channel, who is in it, and this device's
# own call as presence carries it.
tilo-native-media = { path = "../native-media" }
# The MCP projection of the action host, which the MCP server serves a
# program of this login through once the person admits it.
tilo-runtime = { path = "../../core/tilo-runtime" }
tilo-mcp = { path = "../../core/tilo-mcp" }
# The files daemon's link to the network: the session answers and dials for it
# on the device's endpoint (`fs::net`).
fs = { package = "tilo-fs", path = "../../core/fs", default-features = false, features = ["filesystem"] }
tilo-render-protocol = { path = "../../ui/tilo-render-protocol" }
# The render service an app hands its frames to, started by this session as
# a mode of its own binary.
tilo-render-service = { path = "../render-service" }
# The kernel-attested ownership of an executing app process a launch is
