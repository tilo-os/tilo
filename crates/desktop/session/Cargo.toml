tilo-liveness = { path = "../liveness" }
# The room left on the person's filesystems, for the storage notice.
rustix = { workspace = true, features = ["fs", "process"] }
# Planning and starting the apps the person opens.
tilo-app-launch = { path = "../app-launch" }
# The Windows compatibility service the Windows Apps manager reaches.
compat-service = { path = "../../compat/compat-service" }
# The udisks2 names the removable media are read and ejected by. The
# blocking client is left out: this session speaks to the bus itself.
block-devices = { path = "../../os/block-devices" }
tilo-connectivity-service = { path = "../../os/connectivity-service" }
tilo-system-service = { path = "../../os/system-service" }
tilo-settings-service = { path = "../../session/settings-service" }
# The sound resource's specs and system sound cues, for the audio service the session starts.
tilo-audio-service = { path = "../../os/audio-service", default-features = false, features = ["sounds"] }
# The desktop services the session starts on the buses; screen shares
