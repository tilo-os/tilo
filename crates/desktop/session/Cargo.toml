[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-session"
description = "The native Tilo session: the compositor hosting the desktop it owns and the tilolang shell that draws it, the window policy that places each window in the shell's wells, and the session's own surfaces."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[[bin]]
name = "tilo-session"
path = "src/main.rs"

# A surface app the tests start the way the session starts a panel: it reads
# what the session publishes and changes it, and reports both in a file. Never
# installed — the image names the binaries it carries.
[[bin]]
name = "tilo-surface-probe"
path = "tests/bin/surface_probe.rs"
test = false

# The session's integration tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

# The session's loop walks no path after startup. The audit watches the
# process's main thread, and `libtest` runs every test on a thread of its own,
# so this target is the process's `main` driving the session itself.
[[test]]
name = "main_thread_reads"
path = "tests/main_thread_reads.rs"
harness = false

[features]
# Stamps the developer-entry build marker into the binary so the package's
# developer session entry can tell a session someone deliberately built from
# any other executable before logging into it. Inert unless this is a debug
# build, so a `--release --features dev-session` never carries it: the marker
# is the entire content of the feature.
dev-session = []
# Lets a release binary of a dev image open the test-control socket
# `$TILO_TEST_CONTROL` names, which `tilo-vm` and the capture harnesses drive a
# desktop through. A production image never builds it (tools/policy/
# check_dev_overrides_contract.py). Its `provision_test_identity` op mints the
# throwaway identity, so the feature carries the identity crate's minting too: a
# session built on its own (a component swap) mints as a dev image's does.
dev-overrides = ["tilo-identity/throwaway-test-identity"]
# Starts a test's session in the test's own process as the daemon's shell
# (`shell_session::start_in_process`), on a link the daemon made for it. A
# production session never builds it: the daemon starts its shell itself.
test-support = ["tilo-runtime/test-support"]

[dependencies]
anyhow.workspace = true
# A branch of a workspace takes an app's own copy of a record into the
# workspace's, as every incoming change is taken in; a record read again takes
# in what was appended to it since.
tilo-automerge = { path = "../../core/tilo-automerge" }
# A window's page reaches this session as the paint stream its app encoded.
base64.workspace = true
# The MLS vault's master key: the Secret Service, the Keychain, the page's
# IndexedDB, or the store a headless machine names with `TILO_SECRETS_DIR`.
tilo-secrets.workspace = true
# The surface apps' sockets are handed to their children as descriptors.
# The certificate a device was approved with, kept where the identity helper
# reads it once and taken away after.
# A joined workspace's records are untrusted bytes: a worker process of this
# executable decodes them, and `main` serves that worker.
tilo-resource = { path = "../../core/tilo-resource" }
# The records' framework as an app window opens one: the workspace's emoji is
# Chat's record, and the settings tab reads and changes it the same way; a
# page reads each record it holds for what its app tells search
# (`record_index::hosted_entries`).
tilo-app = { path = "../../sdk/tilo-app" }
# The member's own client of the peer network: the boards of who is here and this
# device's own word, which this session hosts with its own endpoint.
tilo-session-client = { path = "../../core/session-client" }
tilo-session-actions = { path = "../../core/session-actions" }
# The roles every host runs: the shell's document and the layout it holds.
tilo-session-core = { path = "../session-core" }
tilo-desktop-model = { path = "../desktop-model" }
# The shell's window policy, whose tab calls an app's asks are answered with.
tilo-desktop-policy = { path = "../window-placement" }
# This device's identity: the certificate it presents and the key it signs with, from the store its
# host keeps them in.
tilo-identity = { path = "../../core/tilo-identity" }
tilo-identity-client = { path = "../../core/tilo-identity-client" }
# The action broker's half every host runs: what a step is taken by, the step service, the route.
tilo-broker-core = { path = "../../core/broker-core" }
# Settings' pages are every desktop's own, the page's included: its search offers them wherever
# the session runs.
tilo-desktop-search = { path = "../desktop-search", features = ["settings"] }
settings-store = { path = "../../system/settings-store" }
settings-model = { path = "../../sdk/settings-model" }
# Following the directories search's lists are read from.
tilo-files = { path = "../../platform/tilo-files" }
durable-store = { path = "../../system/durable-store" }
automerge.workspace = true
tilo-paths.workspace = true
# This process's id and kernel start time, which the desktop's ready record names.
tilo-process = { path = "../../platform/tilo-process" }
tilo-action-policy = { path = "../../core/action-policy" }
tilo-actions = { path = "../../core/actions" }
# The directory of public workspaces a site serves: what joins list and
# what a site's entry and directory answer.
tilo-server-protocol = { path = "../../core/tilo-server-protocol" }
# A browser environment's session asks its server to enter the workspace it was handed, the way a
# member device does.
tilo-clock = { path = "../../platform/tilo-clock" }
toml.workspace = true
url.workspace = true
# The key this device signs its own changes of a workspace with, as the
# broker's owner commits ask for it.
ed25519-dalek.workspace = true
# This device's workspaces: the state of every one it joined, held beside
# the shell, the enrollment a join redeems its invitation with, and who saved
# a shortcut by the proof of a device of theirs.
tilo-peer-state = { path = "../../core/tilo-peer-state" }
# What a message sent from a window's box carries beside its words: the
# references and files the window attached, as the app that keeps them reads
# them.
tilo-reference = { path = "../../core/reference" }
neighbour-wire = { path = "../../core/neighbour-wire" }
collab-types = { path = "../../core/collab-types" }
# The workspace's folder, as the record its files' versions are: the history
# reads it wherever the session runs, a page included.
fs-protocol = { path = "../../core/fs-protocol" }
tilo-user-identity = { path = "../../core/tilo-user-identity" }
postcard = { workspace = true, features = ["use-std"] }
hex.workspace = true
# The prefix hash of a transfer that starts at the top of its object.
blake3.workspace = true
tilo-service = { path = "../service" }
# The content a record references, kept under this session's state and served
# to the apps that read the record.
tilo-content = { path = "../../core/content" }
# The MLS vault's master key: the Secret Service on Linux, the Keychain on
# macOS, or the store a headless machine names with `TILO_SECRETS_DIR`.
# A fresh vault master key is drawn from getrandom's `SysRng`.
getrandom.workspace = true
# This device's channels: the groups its records are sealed in, and the keys an endpoint reads one
# with. Every host runs the engine; where its state is kept is the host's.
tilo-workspace-keys = { path = "../../core/workspace-keys" }
key-group = { path = "../../core/key-group" }
# A schedule's fire time is claimed by one of the person's devices, ranked by
# the same hash everywhere, and the vault derives its channel state key.
sha2.workspace = true
uuid.workspace = true
futures-util.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# The workspaces' live session: a sealed `moq-lite` session per workspace over
# this session's own endpoint, and the relay role a member serves for the
# others.
tilo-live = { path = "../../core/tilo-live", features = ["live_session"] }
# The endpoint every device dials: presence names a publisher and where it is reached with it, on
# every host.

zeroize.workspace = true
jiff.workspace = true
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
# The sheets the desktop shows over everything: the offers an action
# publishes and the effects a person answers with.
# The records the workspaces on this device hold: the workspace indexes
# search reads them from, as the apps that write them keep them.
tilo-app-state = { path = "../../system/app-state" }
tilo-sheets = { path = "../sheets" }
# The shortcuts a person saved and the triggers that start them without
# anyone invoking them.
tilo-automation = { path = "../../core/automation" }
tilo-startup-metrics = { version = "0.1.0", path = "../../core/tilo-startup-metrics" }
# The public workspaces sites list, their entries, and where a join stands.
tilo-workspace-directory = { path = "../../core/workspace-directory" }
# The models a session's own questions run on, and the person's provider settings: the same
# gateway an app asks, reached on every host.
agent-provider-config = { path = "../../integrations/provider-config" }
tilo-rt = { workspace = true }
# The system's media controls: one board over every Playback the apps here play.
tilo-media-controls = { path = "../../services/media-controls" }
tokio = { workspace = true, features = ["sync"] }
# The shell's chooser protocol: the socket the launcher hands an app, and what the session
# answers on it.
tilo-dialogs = { path = "../../platform/tilo-dialogs" }
# Asking the person a question blocks a thread of the chooser's own until they answer.
pollster.workspace = true
tracing.workspace = true
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }

[target.'cfg(target_os = "linux")'.dependencies]
# The device's image model as the session's actions: its model gateway connection and the
# library analysis search reads, which only a Linux desktop session hosts.
tilo-vision-service = { path = "../../services/vision" }
# The apps the session runs itself keep their resources in the workspace's store, whose
# commands are answered by this device's own workspace service.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
# The toolkit's native half: the winit runner, the host services and the
# broker transport, which only a desktop host runs.
ui = { package = "tilo-ui", path = "../../ui/ui-core" }
# The live session over this session's own iroh endpoint: native only.
tilo-live = { path = "../../core/tilo-live", features = ["relay", "iroh"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "sync", "macros", "time"] }
# Tilo's API, which the session serves its own person's programs on this computer.
tilo-api = { path = "../../core/tilo-api" }
# Which app opens a file or a link: the workspace's and the person's default apps, and this
# machine's own `mimeapps.list`, resolved in that order.
desktop-policy = { path = "../default-apps" }
tilo-dictation = { path = "../dictation" }
# What the session binary's search reads of the device: the installed apps,
# the machine's own, the person's search choices.
# The session's own app store, read as the launcher reads it: a development session seeds the
# tilolang apps it installed (`crate::seeded_apps`), and a style a person owns is installed
# into it from their workspace (`crate::style_packages`), which needs the store's writer.
package-store = { path = "../../core/package-store", features = ["store"] }
desktop-entry = { package = "tilo-desktop-entry", path = "../desktop-entry" }
# Where a login's time went, when `TILO_STARTUP_METRICS_PATH` asks
# (`tools/perf/startup_marks.py` reads it).
# The person's accessibility settings: the assists, the colour filter and
# the magnifier the compositor applies.
tilo-accessibility-settings = { path = "../tilo-accessibility-settings" }
tilo-quick-settings = { path = "../../session/quick-settings" }
tilo-onboarding-session = { path = "../onboarding-session" }
# What an entry's invitation is verified as before a workspace is joined: only
# a grant signed for this person's key joins it.
tilo-workspace-join = { path = "../../core/workspace-join" }
# The address an invitation names, signed: this device's own endpoint, for a
# link it makes into a workspace it holds.
tilo-delivery-protocol = { path = "../../core/tilo-delivery-protocol" }
# The person's account with the host the session runs on, read live.
tilo-server-account = { path = "../../core/tilo-server-account" }
# The session asks the model gateway as Activity, the way an app it starts
# does, for the history's descriptions and group names.
tilo-model-client = { path = "../../sdk/model-client", features = ["runtime-client"] }
# Who is here: the session's own membership of each workspace, on the
# peer network's peer actor.
tilo-network-actor = { path = "../network-actor" }
# This device's own workspace service: the one a server runs, holding the workspaces this
# device founds.
tilo-workspace-service = { path = "../../core/tilo-workspace-service", features = ["agents", "apps", "files"] }
# A host's own questions to a member, asked on the collaboration endpoint:
# what an agent asks before it acts on a workspace, answered by the person.
tilo-server-client = { path = "../../core/tilo-server-client" }
# The person's workspace list, as their keys read it and the hosts of their
# workspaces keep it.
# This device's relays wait in the collaboration endpoint until a workspace
# it shows has someone else in it, and its key is published only then.
tilo-endpoint-reachability = { path = "../../core/endpoint-reachability" }
# The device's certificate authority the broker admits a join with: the
# identity store's selected identity and the devices it certifies now.
tilo-identity-authority = { path = "../../core/identity-authority" }
# The person's accounts and the vault their secrets are sealed in: the session
# is the only holder of either, and answers Browser, Settings and Mail from
# them on the apps' own routes.
accounts = { path = "../../integrations/accounts", features = ["person"] }
account-credentials = { path = "../../integrations/account-credentials" }
# The workspace's contact directory, which Contacts keeps and the session publishes as
# `contacts:tilo.contacts.identities`, one record every member reads and changes (contacts.rs).
tilo-contact-directory = { path = "../../integrations/tilo-contact-directory" }
# The sign-ins and calendar look-ups adding an account makes, made here for Settings, whose
# sandbox has no network (services::accounts).
tilo-account-probe = { path = "../../integrations/account-probe" }
# The website session a selected ownership entry holds, and what it opens.
browser-continuity = { path = "../../import/browser-continuity" }
# The machine's readings, served to the apps the launcher connects at the
# socket they dial.
tilo-system-stats = { path = "../../os/system-stats" }
# The broker that serves the socket this session's apps speak on, and the
# provider service it asks for what the services publish. Its channel encryption
# service governs the sealed channels a workspace's content is carried in.
# The person's other devices: what was copied here is shared through
# the same fabric as everything else that follows them.
# The fabric's portable vocabulary: who a device is, the stamp a fact carries, fresh ids.
# A sibling device's half of this device's disk key: the unlock exchange an
# early-boot client speaks, and the sealed halves each device holds of the
# other.
tilo-unlock-protocol = { path = "../../os/tilo-unlock-protocol" }
# The sealed envelope a sibling half is carried in.
tilo-seal = { path = "../../core/tilo-seal" }
# The desktop's event sounds (a notification's ring, a screenshot's click), and the decoder a
# tilolang app's window plays its song or video on: the window is drawn here from the app's
# patches, so the decode a native media app used to enable for itself is enabled here once.
media = { package = "tilo-media", path = "../../engines/tilo-media", features = ["voice", "pipewire", "realtime", "decode"] }
tilo-compositor = { path = "../compositor" }
# The clipboard an app's process reaches over its connection to this session.
tilo-clipboard = { path = "../../platform/tilo-clipboard" }
# The session's own profiler: what its frame went on, recorded on the owner's
# request and read from the same socket.
tilo-frame-metrics = { path = "../frame-metrics" }
# Each display's colour, as the compositor reads it from the sink.
tilo-color-pipeline = { path = "../color-pipeline" }
# Another device's shared window: the decoder that turns the units of its stream into pictures.
tilo-callstream = { path = "../../engines/tilo-callstream", features = ["surface-decoder"] }
image = { workspace = true, features = ["png"] }
# An application's themed icon is an SVG as often as a PNG.
resvg = { version = "0.47", default-features = false }
tilo-shell-surface = { path = "../../session/shell-surface" }
# The shell's package (`apps/tl/shell`), compiled as the session starts, and the shell's
# action vocabulary.
tilolang-tilo = { path = "../../lang/tilolang-tilo" }
# The outside origins the session's own services keep records in step with: the mail, YouTube,
# music and calendar connectors' clients, and the registry that makes an origin's connector
