[package]
name = "tilo-service"
description = "A session service as the session hosts it: the resources it publishes, their readings, the actions it carries out, and the worker its device calls run on."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../core/actions", features = ["asks"] }
# The event sounds a notice makes, played where it is shown.
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
# The content store a service's documents keep their large parts in.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-content = { path = "../../core/content" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-resource = { path = "../../core/tilo-resource" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
