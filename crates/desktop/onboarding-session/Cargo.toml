[package]
name = "tilo-onboarding-session"
description = "The session side of first use: the identity ceremony and its storage, first-boot provisioning, adding this computer with a code, and the ownership of their secrets."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# Views the tests of the session that hosts setup build without a real login.
test-support = []

[dependencies]
anyhow.workspace = true
automerge.workspace = true
os-actions = { path = "../../os/os-actions" }
taffy.workspace = true
tilo-actions = { path = "../../core/actions" }
# Adding this computer with a code calls this computer's daemon, as `tilo login` does.
tilo-api = { path = "../../core/tilo-api" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false, features = ["model"] }
vello.workspace = true
winit.workspace = true
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom.workspace = true
hex.workspace = true
libc.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings", features = ["watch"] }
tempfile.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files", features = ["json", "watch"] }
tilo-identity = { path = "../../core/tilo-identity" }
tilo-identity-client = { path = "../../core/tilo-identity-client" }
# An acknowledgement is a declared action of setup's document.
tilo-resource = { path = "../../core/tilo-resource" }
tilo-paths.workspace = true
# The `tracing` target the session log keeps whatever `RUST_LOG` says: every
# certificate renewal a join depends on is reported under it.
tilo-startup-metrics = { version = "0.1.0", path = "../../platform/startup-metrics" }
tilo-user-identity = { path = "../../core/tilo-user-identity" }
tracing.workspace = true
zeroize.workspace = true
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity" }

[dev-dependencies]
tilo-api = { path = "../../core/tilo-api", features = ["test-support"] }
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }
# The device's daemon a test's machine runs: what its programs read the device through.
tilo-device-identity = { version = "0.1.0", path = "../../core/tilo-device-identity", features = ["test-support"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["test-support", "model"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
tilo-ui-base = { version = "0.1.0", path = "../../ui/ui-base", default-features = false }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["model"] }
