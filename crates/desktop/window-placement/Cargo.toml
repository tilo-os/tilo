[package]
name = "tilo-desktop-policy"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The desktop's window policy: native windows as tabs of the desktop's strips."

# Where a compositor's windows go, which has focus and which the person
# closed, answered by the desktop the session holds: a window is a tab of its
# strips, grouped and focused through the same model the browser desktop runs.
# Compositor-neutral: windows are plain ids and rects.

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
ui = { version = "0.1.0", package = "tilo-ui", path = "../../ui/ui-core", default-features = false }
tilo-desktop-model = { version = "0.1.0", path = "../desktop-model" }
tilo-desktop-search = { version = "0.1.0", path = "../desktop-search" }
tilo-session-core = { path = "../session-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }

[lints]
workspace = true
