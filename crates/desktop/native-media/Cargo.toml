[package]
name = "tilo-native-media"
description = "The session's voice calls: which channel an app's call is in, who is in each channel, and this device's own call as presence says it"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "tilo_native_media"

[dependencies]
# The closed local call controls: requests an app sends, the status it reads.
tilo-actions = { path = "../../core/actions" }
tilo-app-host = { path = "../../core/app-host" }
tilo-lock = { path = "../../platform/tilo-lock" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
