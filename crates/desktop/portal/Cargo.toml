[package]
name = "tilo-portal"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The session's xdg-desktop-portal backend: file chooser, screenshots, settings, access and inhibit, asking the person through the session's questions"

[dependencies]
tilo-actions = { path = "../../core/actions" }
# How long an answer stands: the lifetime every permission prompt offers.
tilo-action-policy = { path = "../../core/action-policy" }
# The person's device answers, kept in their own store, and the devices they name.
tilo-peer-state = { path = "../../core/tilo-peer-state" }
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-service = { path = "../service" }
# Portal notifications are the session's notifications daemon's.
tilo-notifications-service = { path = "../notifications-service" }
tilo-resource = { path = "../../core/tilo-resource" }
# The privacy reading a view of another language reads names each kept answer by the consent
# resource it is, whose declared type and verb live beside that reading.
tilo-device-surfaces = { path = "../device-surfaces" }
# Holds taken for an app are the session's own inhibitions.
tilo-power-mgmt = { path = "../../os/power", default-features = false }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-accessibility-settings = { path = "../tilo-accessibility-settings" }
# The writable-folder choice the app-side chooser asks with.
tilo-dialogs.workspace = true
tilo-files = { path = "../../platform/tilo-files", features = ["json"] }
tilo-paths.workspace = true
# Naming an unsandboxed requester by the installed app it runs.
tilo-desktop-entry = { path = "../desktop-entry" }
# The person's default apps, for the links the portal opens.
desktop-policy = { package = "tilo-default-apps", path = "../default-apps", default-features = false }
percent-encoding.workspace = true
base64.workspace = true
tilo-content-types = { path = "../../core/content-types" }
tilo-wallpapers = { path = "../tilo-wallpapers" }
# App master secrets: the device proof the Secret Service asks of its
# managers.
tilo-secrets = { path = "../../platform/tilo-secrets", features = ["host-keyring"] }
hex.workspace = true
# Print jobs go to `lp` as argv, bounded in time and output.
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
rand.workspace = true
zeroize.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings", features = ["watch"] }
# The theme the legacy toolkits' appearance keys are projected from.
ui = { package = "tilo-ui", path = "../../ui/ui-core", default-features = false, features = ["model"] }
futures-util.workspace = true
# EIS, the transport of the input portals: a server per session.
reis = { version = "0.7.1", features = ["calloop"] }
calloop = "0.14"
uuid.workspace = true
# The producer side of screen share streams, for a session feeding them
# frames it captured.
pipewire = { version = "0.10.1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync"] }
tracing.workspace = true
url.workspace = true
zbus = { workspace = true, features = ["tokio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../ui/ui-core" }

[features]
pipewire = ["dep:pipewire"]

[dev-dependencies]
# The portal names a manifest can declare, which the backend's table must use.
tilo-app-package = { path = "../../core/tilo-app-package" }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
# The bus the tests run on, which starts without the caller's user database.
tilo-test-env = { path = "../../../tools/test-env" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
