[package]
name = "app-fleet"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "What every Tilo app's signed manifest says about it, compiled in: names, keywords, platforms, documents and closed actions."
repository.workspace = true
homepage.workspace = true

[features]
# Each app's whole signed `surface.toml` compiled in: what a server that runs a hosted
# workspace's programs compiles them against. An app and the web desktop need only the
# metadata above, and leave it off.
surfaces = []

[lib]
name = "app_fleet"
path = "src/lib.rs"

# Data only, so the browser desktop links it as readily as the native shell.
[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
