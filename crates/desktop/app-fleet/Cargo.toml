[package]
name = "tilo-app-fleet"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "What the policy reads of every Tilo app's signed manifest, compiled in: whose its windows are, and its private, sealed and system-kept records."
repository.workspace = true
homepage.workspace = true

[lib]
name = "app_fleet"
path = "src/lib.rs"

# Data only, so the browser desktop links it as readily as the native shell.
[dependencies]
tilo-app-id.workspace = true

# `build.rs` reads each app's committed `fleet.json`: JSON in, Rust out, no app compiled.
[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
