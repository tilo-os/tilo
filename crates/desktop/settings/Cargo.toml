[package]
name = "settings-store"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The Tilo desktop settings: each section a resource of the workspace, read through typed keys that never fail."

[lib]
name = "settings_store"
path = "src/lib.rs"

[dependencies]
# A setting's verb is the setter its field's surface names (`set-<field>`).
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The display publisher's lease, which tells a live compositor from a stale snapshot.
tilo-advisory-lock = { version = "0.1.0", path = "../../platform/advisory-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-platform-caps = { version = "0.1.0", path = "../../platform/tilo-platform-caps" }
serde.workspace = true
serde_json.workspace = true
# A copy's payload bytes inside the JSON document.
base64.workspace = true
tracing.workspace = true
unicode-normalization = "0.1.25"
# Spec-correct `XDG_CONFIG_HOME` resolution (absolute, non-empty, else
# `$HOME/.config`), shared with every other reader of the settings file.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# The system locale that stands in when the person has chosen no language.
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process", features = ["native"] }
# The sections' types as models, so an app edits them by path.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource", optional = true }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }
settings-model = { version = "0.1.0", path = "../../sdk/settings-model" }
# The workspace store the sections are resources of: its commands, stamps and versions.
tilo-resource-store = { version = "0.1.0", path = "../../core/resource-store" }
collab-types = { version = "0.1.0", path = "../../core/collab-types", optional = true }
# The invocation one change's writes share.
uuid.workspace = true

[features]
# Directory watches: the identity and dictionary directories.
watch = ["tilo-files/watch"]
model = ["dep:tilo-resource"]
# Settings over the person's and the device owner's workspaces in memory, for tests.
test-support = ["dep:collab-types"]

[dev-dependencies]
# The settings surface, read as every holder reads it.
collab-types = { path = "../../core/collab-types" }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# Thread-scoped wall-clock scopes for the tests that place a row in time.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
# A process outside the session changes a setting by its setter, which the session runs through
# its control socket as it runs `tilo do`.
tilo-control = { version = "0.1.0", path = "../../desktop/control-cli" }
