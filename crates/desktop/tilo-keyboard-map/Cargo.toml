[package]
name = "tilo-keyboard-map"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Bounded physical key and symbol observations from installed native keyboard metadata."

[features]
# Read the layouts installed on this device, through libxkbcommon. A build without it answers
# `Unsupported`, as one on a system with no provider does.
default = ["native"]
native = ["dep:xkbcommon"]

[dependencies]
tilo-keyboard-engine = { path = "../../engines/keyboard" }
ui = { package = "tilo-app", version = "0.1.0", path = "../../sdk/tilo-app" }
# xkeyboard-config's rules, read for the layouts this device installs.
quick-xml.workspace = true
vello.workspace = true
winit.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = { version = "0.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native workspace feature unification must never reach a web bundle.
workspace-hack = { version = "0.1" }
