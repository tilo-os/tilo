[package]
name = "settings-sections"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The person's and the device's settings sections: their resource models, and the session's service that publishes each and sets it field by field"

[lib]
name = "settings_sections"
path = "src/lib.rs"

[dependencies]
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config", features = ["model"] }
# The providers' keys, kept in this device's sealed vault: what a key is
# written to and read from, never part of the settings document.
automerge.workspace = true
# The calendar a data period is counted by.
jiff.workspace = true
desktop-policy = { package = "tilo-default-apps", path = "../../desktop/default-apps" }
serde.workspace = true
serde_json.workspace = true
settings-store = { package = "tilo-settings-store", path = "../settings", features = ["model"] }
settings-model = { package = "tilo-settings-model", path = "../../sdk/settings-model" }
tilo-accessibility-settings = { path = "../../desktop/tilo-accessibility-settings", features = ["model"] }
tilo-app-id.workspace = true
# Every app's commands with the keys it gives them, which the shortcuts table lists to move.
tilo-app-fleet = { path = "../app-fleet" }
tilo-locale = { path = "../../platform/tilo-locale" }
# The shipped wallpapers a wallpaper choice is checked against.
tilo-wallpapers = { version = "0.1.0", path = "../../desktop/tilo-wallpapers" }
ui = { package = "tilo-app", path = "../../sdk/tilo-app" }
# The session's settings service: each section published with a setter per field.
tilo-actions = { path = "../../core/actions" }
tilo-resource = { path = "../../core/tilo-resource" }
# The one canonical encoding of the compiled surface this crate publishes.
tilo-canonical-json = { version = "0.1.0", path = "../../platform/tilo-canonical-json" }
tilo-service = { path = "../../desktop/service" }
tilo-lock = { path = "../../platform/tilo-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
tracing.workspace = true
# The workspace store the sections are kept in: its commands, stamps and versions.
tilo-resource-store = { path = "../../core/resource-store" }
# The store's history, records and commands the sections write through.
collab-types = { package = "tilo-collab-types", path = "../../core/collab-types" }
# The invocation one change's writes share.
uuid.workspace = true
# The device's installed packages: the theme packages Appearance offers, and the one it applies.
package-store = { package = "tilo-package-store", path = "../../core/package-store" }
# Where a process reads the machine code the device compiled: the store an applied theme's
# painter sets are drawn from.
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal" }

[features]
# Settings over the person's and the device owner's workspaces in memory, for tests.
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The settings over the person's and the device owner's workspaces in memory, with their history.
# The settings over workspaces in memory, for the tests of what reads and sets them.
settings-sections = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# Where the test's device keeps its store and the compiled modules under its data home.
tilo-paths = { path = "../../platform/tilo-paths" }
# A theme bundle's painter module built in the test, and the store the device compiles it into.
wat = "1"
tilo-theme-sdk = { version = "0.1.0", path = "../../ui/theme-sdk" }
tilo-wasm-aot = { path = "../../platform/tilo-wasm-aot", features = ["compile"] }
# The registry the install writes, so the test lays out what an install leaves.
package-store = { package = "tilo-package-store", path = "../../core/package-store", features = ["store"] }
# A view of another language reading the sections and setting them through their setters.
tilolang-tilo = { path = "../../lang/tilolang-tilo" }

[lints]
workspace = true
