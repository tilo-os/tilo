[package]
name = "hex-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The hex editor's device work: a file read as bytes, the edits a person typed applied to them, a pattern found and the bytes around a place read as numbers"

[dependencies]
tilolang-tilo = { path = "../../lang/tilolang-tilo" }
# A file's bytes are kept where every device of the workspace reads them by their address.
tilo-resource = { path = "../../core/tilo-resource" }
serde.workspace = true
serde_json.workspace = true
# The bytes a file's content travels as, when a save asks where it goes.
base64.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
tilo-content = { path = "../../core/content" }
tilo-wake = { path = "../../platform/tilo-wake" }

[lints]
workspace = true
