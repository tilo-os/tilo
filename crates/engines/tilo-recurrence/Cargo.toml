[package]
name = "tilo-recurrence"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "RFC 5545 recurrence rules shared by Tilo apps and the language runtime: RRULE/EXDATE text, expansion in a named zone, and the repeat presets a picker shows."

[dependencies]
jiff.workspace = true
# Recurrence is authored in a named zone, so a series keeps its wall-clock
# time across that zone's daylight-saving transitions. Shipping the transition
# database with the rule means every peer expands a stored rule identically,
# whatever the host's zoneinfo says.
jiff-tzdb.workspace = true
# The same database from its engine library beside the runtime, which a
# release build links instead of the static one (see the `runtime-engine`
# feature).
tilo-timezone-engine = { path = "../loadable/timezone", optional = true }
# A repeat is a value in a resource: its variants are the stored names.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# The fixed date and time text a rule is written in.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }

[features]
# Read zones from the time-zone database's engine library in the runtime
# bundle (libtilo_timezone_engine.so, crates/engines/loadable/timezone) instead
# of the static copy. An app enables it with its own `runtime-engine` feature.
runtime-engine = ["dep:tilo-timezone-engine", "tilo-timezone-engine/thin"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
