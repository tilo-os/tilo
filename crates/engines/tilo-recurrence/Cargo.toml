[package]
name = "tilo-recurrence"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "RFC 5545 recurrence rules shared by Tilo apps and the language runtime: RRULE/EXDATE text, expansion in a named zone, and the repeat presets a picker shows."
repository.workspace = true
homepage.workspace = true

[dependencies]
jiff.workspace = true
# Recurrence is authored in a named zone, so a series keeps its wall-clock
# time across that zone's daylight-saving transitions. Shipping the transition
# database with the rule means every peer expands a stored rule identically,
# whatever the host's zoneinfo says. In a thin release build an app that
# links the database's engine library (crates/engines/loadable/timezone)
# takes this crate from that library rather than carrying its own copy:
# rustc links a crate a linked dylib already holds from that dylib.
jiff-tzdb.workspace = true
# A repeat is a value in a resource: its variants are the stored names.
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
# The fixed date and time text a rule is written in.
tilo-formats = { version = "0.1.0", path = "../../ui/tilo-formats" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
