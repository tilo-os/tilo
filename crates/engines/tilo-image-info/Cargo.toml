[package]
name = "tilo-image-info"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "What an image's own metadata says: its upright size, when it was taken, which way its pixels are turned, and where it was taken."

[dependencies]
# EXIF is a container's concern, read before any pixel is decoded.
kamadak-exif = "0.6.1"
# The size an image's header names, without decoding it.
imagesize = { version = "0.14", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
