[package]
name = "discord-bridge"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "What a Discord event or a workspace change means for both sides: the plans the Discord app's verbs run"

[dependencies]
discord-wire = { path = "../discord-wire", features = ["resource"] }
serde.workspace = true
serde_json.workspace = true
# The guild's own model, and the vocabulary an op's arguments carry.
tilo-actions = { version = "0.1.0", path = "../../core/actions" }
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
