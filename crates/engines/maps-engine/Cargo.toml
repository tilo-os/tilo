[package]
name = "tilo-maps-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Maps' device work: the map's imagery kept for offline use, listed and removed as the areas a person saved"

[dependencies]
tilo-tiles = { version = "0.1.0", path = "../tilo-tiles" }
tilolang-engine = { path = "../../lang/tilolang-engine" }
# Where the device is, asked of the platform: the location portal, CoreLocation, the browser.
tilo-location = { version = "0.1.0", path = "../../platform/tilo-location" }
# The app's one async runtime, which the platform's location request runs on.
tilo-rt.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace-hack = { version = "0.1" }

[lints]
workspace = true
