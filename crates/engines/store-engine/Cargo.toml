[package]
name = "tilo-store-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The App Store's device work: the catalogues it reads and the changes it makes, answered for `so.tilo.store` by name."

[dependencies]
app-cli = { path = "../../os/app-cli" }
package-store = { package = "tilo-package-store", path = "../../core/package-store" }
package-actions = { path = "../../core/package-actions" }
registry-types = { package = "tilo-registry-types", path = "../../core/registry-types" }
tilo-app-package = { path = "../../core/tilo-app-package" }
tilo-automation = { path = "../../core/automation" }
tilo-bot-directory = { path = "../../integrations/bot-directory" }
tilo-content = { path = "../../core/content" }
# The content store the app's record lends its window.
tilo-resource = { path = "../../core/tilo-resource" }
tilo-desktop-entry = { path = "../../desktop/desktop-entry" }
tilolang-engine = { path = "../../lang/tilolang-engine" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
hex.workspace = true
tracing.workspace = true
tilo-net = { path = "../../platform/tilo-net", features = ["blocking"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
getrandom.workspace = true
tempfile.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The stand-in daemon's endpoint, which a test points at its scratch runtime.
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
