[package]
name = "local-model-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Verified, content-addressed local-model runtime service for Tilo."

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs-sys"]
# Explicit isolated native qualification; never selected by normal consumers.
nemo-review = []
# Isolated public-module interpretation; never selected by the speech worker.
whistle-wasm-review = []
# Explicit private-pipe qualification; no production worker or catalogue admission.
whistle-v8-review = []
whistle-aot-review = []
# Production handler requires the immutable image runtime and signed weights.
# Preparing a package does not enable this feature or admit a catalogue entry.
whistle-aot = ["whisper"]
# Public PCM detector review only; no worker/capture or catalogue activation.
audio-evidence-review = ["whisper"]

[[example]]
name = "speech_activity_review"
required-features = ["audio-evidence-review"]

[[bin]]
name = "tilo-speech-worker"
path = "src/bin/tilo-speech-worker.rs"
required-features = ["whisper"]

[[example]]
name = "speech_qualify"
required-features = ["whisper"]

[[example]]
name = "speech_benchmark"
required-features = ["whisper"]

[[example]]
name = "nemo_speech_worker"
required-features = ["nemo-review"]

[[example]]
name = "whistle_wasm_review"
required-features = ["whistle-wasm-review"]

[[example]]
name = "whistle_v8_worker_review"
required-features = ["whistle-v8-review"]

[[example]]
name = "whistle_aot_review"
required-features = ["whistle-aot-review"]

[[example]]
name = "whistle_aot_worker_review"
required-features = ["whistle-aot-review"]

[[example]]
name = "whistle_aot_image_review"
required-features = ["whistle-aot"]

[lib]
name = "local_model_service"
path = "src/lib.rs"

[[bin]]
name = "tilo-model-manager"
path = "src/main.rs"

[dependencies]
tilo-paths.workspace = true
tilo-machine.workspace = true

agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
# Signing in with Hugging Face by device code from a terminal: the token is kept as the
# model provider's key through the published `models` actions.
account-credentials = { path = "../../integrations/account-credentials", default-features = false, features = ["hugging-face"] }
# The one dispatch: the published `models` actions a terminal sign-in calls as the person.
tilo-actions = { path = "../../core/actions" }
# Those actions, bound at build time to the surface the service that keeps them publishes.
tilo-resource-macros = { path = "../../core/tilo-resource-macros" }
# The signed desired-state half of the extension helper.
tilo-extension = { path = "../../os/extension-helper" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
serde.workspace = true
serde_json.workspace = true
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
sha2.workspace = true
sha1 = "0.11"
hex.workspace = true
getrandom.workspace = true
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
thiserror.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../platform/tilo-net", features = ["blocking"] }
clap.workspace = true
ed25519-dalek.workspace = true
libc.workspace = true
zeroize.workspace = true
tilo-sandbox-core = { path = "../../platform/sandbox-core" }
tar.workspace = true
zstd.workspace = true
whisper-rs-sys = { version = "=0.15.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The gateway the end-to-end test starts follows the settings it writes here.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
wasmi = { version = "=1.1.0", default-features = false, features = ["std", "simd"] }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The terminal client's tests answer through an action provider.
tilo-actions = { path = "../../core/actions", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
# Who is on the other end of the service's socket: the kernel's account of the caller.
tilo-peer-facts = { path = "../../core/peer-facts" }
# Hands the model file a person chose to the service as a descriptor.
runtime-portal = { package = "tilo-runtime-portal", path = "../../core/runtime-portal", default-features = false }
