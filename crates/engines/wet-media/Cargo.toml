[package]
name = "tilo-wet-media"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "Deterministic simulations of real paint (watercolour, oil) over vector marks: the same marks give the same pixels on every machine."
repository.workspace = true
homepage.workspace = true

# Deterministic wet-media simulation (watercolour, oil) over vector marks.
# Kept free of the UI and GPU stacks: every member re-simulates the same
# marks into the same pixels, and a headless host can render a painting.

[dependencies]
# Presets and mark inputs are shareable data.
serde.workspace = true
serde_json.workspace = true
# Per-mark seeds and raster fingerprints.
blake3.workspace = true
# Row-parallel simulation steps.
rayon = "1.12.0"
# The stroke geometry a mark lays its paint along, shared with the toolkit's preview.
tilo-paint-strokes = { version = "0.1.0", path = "../paint-strokes" }
# Anti-aliased coverage of mark outlines.
tiny-skia = "0.12"

[dev-dependencies]
# The swatches example writes what the engines paint.
png = "0.18"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
