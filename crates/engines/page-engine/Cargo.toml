[package]
name = "tilo-page-engine"
version = "0.1.0"
description = "The page a window shows, one request at a time: a window's engine, the page's own answers, and the events its view shows"
repository.workspace = true
homepage.workspace = true
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"

[dependencies]
# The engine client: the page protocol's requests and answers, and the engine's events.
tilo-webview = { version = "0.1.0", path = "../tilo-webview" }
serde_json.workspace = true
# Where a saved download's request waits, in this process, for the app's download to redeem it.
tilo-engine-loader = { version = "0.1.0", path = "../../core/engine-loader" }
base64.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Its own tests drive a page without Chromium.
tilo-webview = { version = "0.1.0", path = "../tilo-webview", features = ["test-support"] }

[lints]
workspace = true
