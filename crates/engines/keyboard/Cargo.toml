[package]
name = "tilo-keyboard-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The on-screen keyboard's own work: layouts, tap targets, prediction, autocorrection and swipe decoding"

[[example]]
name = "swipe_eval"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
swipe = { path = "../swipe" }
emoji = { package = "tilo-emoji", path = "../../ui/emoji" }
spellcheck = { package = "tilo-spellcheck", path = "../../ui/spellcheck" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
