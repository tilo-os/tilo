[package]
name = "tilo-remote-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The Remote app's device work as a loadable engine library beside the shared runtime: libtilo_remote_engine.so, shipped in the runtime bundle and opened the first time so.tilo.remote opens an SSH shell or a VNC desktop."

# A runtime engine: code one app needs that no other app should map. It is a Rust dylib chained
# on libruntime_dylib.so, built in the same Cargo graph as the runtime and the apps
# (os/scripts/build-thin-apps.sh), shipped under the runtime bundle's lib/, and opened through
# tilo-engine-loader the first time the app calls it.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib that links another
# Rust dylib needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh gives it.
# Any other build of this crate is an empty library.
[lib]
name = "tilo_remote_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot build this library
# without either a binary that needs it or `--lib` for every app. build-thin-apps.sh runs it to
# prove the engine loads and runs against the runtime it ships with.
[[bin]]
name = "tilo-remote-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-remote",
    "dep:tilo-terminal",
    "dep:tilo-content",
    "dep:tilo-engine-loader",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../../sdk/runtime-dylib", optional = true }
tilo-remote = { path = "../../tilo-remote", optional = true }
# The shared terminal a session's grid is drawn from, and what a session's own store keeps.
tilo-terminal = { path = "../../tilo-terminal", optional = true }
tilo-content = { path = "../../../core/content", default-features = false, optional = true }
# The one way an engine library is declared and opened.
tilo-engine-loader = { version = "0.1.0", path = "../../../core/engine-loader", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# Optional like everything else: an empty build must not link the hack's whole dependency set
# into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
