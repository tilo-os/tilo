[package]
name = "tilo-adblock-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The WebView's filter-list compiler (adblock-rust) as an engine library beside the shared runtime: libtilo_adblock_engine.so, which the toolkit opens the first time an app compiles ad-block lists."

# The page painter is named for its `lazy-adblock` feature alone: `thin` turns it
# on so the runtime built in that graph opens this library instead of linking the
# compiler. Nothing here writes `tilo_ui_webview::`, so an unused-dependency scan
# can only see the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["tilo-ui-webview"]

# A runtime engine the toolkit opens on first use rather than one an app
# names DT_NEEDED: `tilo_webview::adblock` loads it through tilo-engine-loader
# the first time an app (the browser) compiles filter lists, so no app maps it
# at exec and every app but the browser never maps it at all. Like every
# engine it is a Rust dylib chained on libruntime_dylib.so, built in the same
# Cargo graph (os/scripts/build-thin-apps.sh) and shipped under the runtime
# bundle's lib/.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib
# that links another Rust dylib needs `-C prefer-dynamic`, which only
# tools/ci/rustc-thin-app-wrapper.sh gives it. `thin` also turns on the
# page painter's `lazy-adblock`, so the runtime built in that graph opens this
# library instead of linking the compiler. Any other build is an empty
# library.
[lib]
name = "tilo_adblock_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime: build-thin-apps.sh runs it to prove the engine
# loads and runs against the runtime it ships with.
[[bin]]
name = "tilo-adblock-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-ui-webview",
    "tilo-ui-webview/lazy-adblock",
    "dep:tilo-content-blocker",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../../sdk/runtime-dylib", optional = true }
# The page painter the runtime carries, to turn on its `lazy-adblock`.
tilo-ui-webview = { path = "../../../ui/ui-webview", optional = true }
tilo-content-blocker = { path = "../../content-blocker", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
