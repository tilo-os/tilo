[package]
name = "tilo-theme-painter-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A theme's painter sets loaded from wasm, as an engine library beside the shared runtime on the wasm engine's interpreter: libtilo_theme_painter_engine.so, which the toolkit opens the first time a theme names a set."

# A runtime engine the toolkit opens on first use rather than one an app names
# DT_NEEDED: `part_paint` loads it through tilo-engine-loader the first time a
# theme names a painter set that is not built in, so no app maps it at exec.
# Like every engine it is a Rust dylib chained on libruntime_dylib.so, built in
# the same Cargo graph (os/scripts/build-thin-apps.sh) and shipped under the
# runtime bundle's lib/.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib
# that links another Rust dylib needs `-C prefer-dynamic`, which only
# tools/ci/rustc-thin-app-wrapper.sh gives it. `thin` also turns on the
# toolkit's `lazy-painter`, so the runtime built in that graph opens this
# library instead of linking the interpreter. Any other build is an empty
# library.
[lib]
name = "tilo_theme_painter_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime: build-thin-apps.sh runs it to prove the engine
# loads and runs against the runtime it ships with.
[[bin]]
name = "tilo-theme-painter-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-ui",
    "tilo-ui/lazy-painter",
    "dep:tilo-theme-sdk",
    "dep:tilo-theme-painter-wasm",
    "dep:tilo-wasm-engine",
    "tilo-wasm-engine/thin",
    "dep:wat",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../../runtime/runtime-dylib", optional = true }
# The toolkit the runtime carries, only to turn on its `lazy-painter`.
tilo-ui = { path = "../../../sdk/ui-core", optional = true, default-features = false }
# The painter interface the entry answers in, and the bytes the check's module
# exchanges.
tilo-theme-sdk = { version = "0.1.0", path = "../../../sdk/theme-sdk", optional = true }
# The interpreter.
tilo-theme-painter-wasm = { version = "0.1.0", path = "../../../sdk/theme-painter-wasm", optional = true }
# The interpreter itself, which the Typst engine loads too.
tilo-wasm-engine = { path = "../wasm", optional = true }
# The check's painter module, written as WAT in its binary.
wat = { version = "1", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[package.metadata.cargo-machete]
# Named only to turn on its `lazy-painter` in the runtime's build, and `wat`
# only by the check binary.
ignored = ["tilo-ui", "wat"]

[lints]
workspace = true
