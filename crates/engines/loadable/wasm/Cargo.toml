[package]
name = "tilo-wasm-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The wasm interpreter (wasmi) and a painter set's guest on it, as an engine library beside the shared runtime: libtilo_wasm_engine.so, which the theme painter and Typst engines chain on."

# Two engines interpret wasm: a theme's painter sets (libtilo_theme_painter_engine.so)
# and Typst's plugins (libtilo_typst_engine.so). Both chain on this library, so the
# bundle holds one copy of the interpreter and no app maps it until one of them loads.
# Like every engine it is a Rust dylib chained on libruntime_dylib.so, built in the
# same Cargo graph (os/scripts/build-thin-apps.sh) and shipped under the runtime
# bundle's lib/.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib that
# links another Rust dylib needs `-C prefer-dynamic`, which only
# tools/ci/rustc-thin-app-wrapper.sh gives it. Any other build is an empty library.
[lib]
name = "tilo_wasm_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime: build-thin-apps.sh runs it to prove the engine loads
# and runs against the runtime it ships with.
[[bin]]
name = "tilo-wasm-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = ["dep:runtime-dylib", "dep:wasmi", "dep:tilo-theme-painter-wasm", "dep:workspace-hack"]

[dependencies]
runtime-dylib = { path = "../../../sdk/runtime-dylib", optional = true }
wasmi = { version = "1.1", default-features = false, features = ["std"], optional = true }
# A theme's painter set as a wasm guest: the painter engine's code that is the interpreter's,
# kept here beside it.
tilo-theme-painter-wasm = { version = "0.1.0", path = "../../../ui/theme-painter-wasm", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
