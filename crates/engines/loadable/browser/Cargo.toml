[package]
name = "tilo-browser-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The Browser's device work as a loadable engine library beside the shared runtime: libtilo_browser_engine.so, opened in the Browser's own process the first time it downloads a file, which it fetches into the person's Downloads as a job that outlives the page's window."

# A runtime engine: code one app needs that no other app should map. It is a
# Rust dylib chained on libruntime_dylib.so, built in the same Cargo graph as
# the runtime and the apps (os/scripts/build-thin-apps.sh), shipped under the
# runtime bundle's lib/, and opened through tilo-engine-loader the first time
# the app calls it.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib
# that links another Rust dylib needs `-C prefer-dynamic`, which only
# tools/ci/rustc-thin-app-wrapper.sh gives it. Any other build of this crate is
# an empty library; its tests build the download itself against the same
# crates as dev-dependencies.
[lib]
name = "tilo_browser_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: build-thin-apps.sh
# runs it to prove the engine loads and runs against the runtime it ships with.
[[bin]]
name = "tilo-browser-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-net",
    "dep:tilo-rt",
    "dep:tilo-paths",
    "dep:host-fs",
    "dep:tokio",
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_json",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../../sdk/runtime-dylib", optional = true }
# The request and its streamed body.
tilo-net = { workspace = true, features = ["http"], optional = true }
# The job's own thread drives its request.
tilo-rt = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "macros"], optional = true }
# The person's Downloads folder.
tilo-paths = { workspace = true, optional = true }
# A finished file takes a name nothing holds yet, and never replaces one.
host-fs = { path = "../../../core/host-fs", optional = true }
percent-encoding = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
# The one way an engine library is declared and opened.
tilo-engine-loader = { version = "0.1.0", path = "../../../core/engine-loader" }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[dev-dependencies]
tilo-net = { workspace = true, features = ["http"] }
tilo-rt.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tilo-paths.workspace = true
host-fs = { path = "../../../core/host-fs" }
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
test-http = { package = "tilo-test-http", path = "../../../../tools/test-http" }

[lints]
workspace = true
