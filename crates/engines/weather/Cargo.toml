[package]
name = "tilo-weather"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The Weather app's engine: Open-Meteo's forecast, air quality and place search, with no UI."

[lib]
name = "tilo_weather"
path = "src/lib.rs"

[dependencies]
# The addresses the app asks and the flat shape it reads their answers in.
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The device's network: the one HTTP client.
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", default-features = false, features = ["blocking"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
