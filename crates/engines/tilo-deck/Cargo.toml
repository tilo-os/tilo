[package]
name = "tilo-deck"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "A deck's engine: the slides, their elements and words, and the .odp and .pptx interchange, with no toolkit."
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_deck"
path = "src/lib.rs"

[dependencies]
# The bounded archive reader an import uses, before any part is parsed.
bounded-zip = { package = "tilo-bounded-zip", version = "0.1.0", path = "../bounded-zip" }
# The XML entity helpers the office readers share.
# The XML attribute and character-reference reads the presentation formats share, and the
# zip limits a handed file is bounded by.
tilo-doc-codecs = { version = "0.1.0", path = "../tilo-doc-codecs", default-features = false, features = ["office"] }
# The image sniffing a bundled picture's media type comes from.
tilo-content-types = { version = "0.1.0", path = "../../core/content-types" }
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
quick-xml.workspace = true

[lints]
workspace = true

[dev-dependencies]
# A scenario's cases are the phases of one test (`scenario!`).
tilo-test-env = { path = "../../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
