[package]
name = "format-host"
version = "0.1.0"
edition = "2021"
description = "qOS format-provider router daemon. Hosts WASM Component Model providers via wasmtime and serves a Cap'n Proto RPC interface."

[dependencies]
format-provider-wit = { path = "../format-provider-wit" }

# Wasmtime 46 ships component-model + the on-disk compilation cache out of the
# box. We rely on epoch-based interruption + ResourceLimiter for per-call
# wallclock + memory caps.
wasmtime = { version = "46", default-features = false, features = [
    "cranelift",
    "component-model",
    "cache",
    "runtime",
    "std",
    "addr2line",
    "demangle",
    "parallel-compilation",
    "wat",
] }
wasmtime-wasi = { version = "46" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

# Cap'n Proto RPC for the on-disk router socket. capnp 0.26 is the latest
# stable release as of mid-2026, matching capnp-rpc 0.26.
capnp.workspace = true
capnp-rpc.workspace = true
capnp-futures.workspace = true

serde.workspace = true
toml.workspace = true
dirs.workspace = true
parking_lot.workspace = true
notify = { workspace = true, default-features = true }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
capnpc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
wat = "1"
