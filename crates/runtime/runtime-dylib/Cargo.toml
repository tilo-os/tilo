[package]
name = "runtime-dylib"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Opt-in dynamic-library build of the Tilo runtime SDK and UI toolkit. Produces libruntime_dylib.so so thin apps can link the toolkit (and libstd) dynamically via -C prefer-dynamic instead of baking it into every binary."

# A Rust `dylib` requires `panic = "unwind"` and is incompatible with fat LTO,
# unlike the workspace's normal release profile. This standalone wrapper pulls
# the runtime SDK into one dylib and is built only with the opt-in `thin-app`
# profile; thin apps link it with `-C prefer-dynamic`.
[lib]
name = "runtime_dylib"
path = "src/lib.rs"
crate-type = ["dylib"]

# What belongs here: the SDK an app links (the toolkit, `tilo-app`, the CLI
# kit) and crates several shipped apps share. What never does: OS daemons and
# other OS-internal crates (the FUSE filesystem, the sandbox launcher, the app
# host, the install CLI), light crates only one app uses, and engines a few
# apps use, which have their own library under crates/runtime/engines/
# (Typst, Spotify playback, Canvas's painting engines, the YouTube client of
# Music and Tube, account custody, IMAP and WebDAV for Mail, Settings and
# Calendar, the time-zone database for Calendar and Clocks, the contact
# directory for Contacts, Mail and Messages, the PDF engine for PDF Viewer,
# Files, Writer and Print Centre), and a bundled C library apps call
# themselves (SQLite: this library exports no C symbols, so an app whose own
# code calls sqlite3_* could not link). Every app process maps this library, so a
# crate here costs every app its relocations and dirty pages; an app that
# needs one of those links it itself, or loads its engine library, and gets
# only the code it calls. tools/policy/check_runtime_dylib_surface.py fails
# when a denied crate re-enters the graph, through any dependency or feature.
[dependencies]
tilo-cli-kit = { path = "../cli" }
# The UI toolkit and its rendering graph are included in the shared dylib.
# `portal` covers apps that open host files through the XDG portal.
# This must be the superset used by every thin app in the default collection.
# A Rust dylib's exported symbol names contain the dependency crate hash; if an
# app enables a UI feature absent here, Cargo builds a second `ui` instance and
# the app can link successfully but fail at runtime with undefined symbols.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["portal", "webview-adblock", "dmabuf-import", "gpu-video", "mpris"] }
# Apps bind resources, actions and native presentation through this public SDK.
# Keep its dispatcher and runner in the runtime alongside the internal toolkit.
tilo-app = { path = "../../sdk/tilo-app" }
# Desktop policy and control-surface vocabulary shared by the toolkit and the
# apps that configure the desktop.
settings-store = { path = "../../system/settings-store" }
desktop-policy = { path = "../../system/desktop-policy" }
tilo-desktop-entry = { path = "../../system/desktop-entry" }
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
os-actions = { path = "../../system/os-actions" }
runtime-identity = { path = "../runtime-identity" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
runtime-fs = { path = "../runtime-fs" }
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
tilo-bluez = { path = "../../system/tilo-bluez" }
accounts = { path = "../../system/accounts" }
agent-provider-config = { path = "../../agent/provider-config" }
# Only the gateway's client: its daemon (`service`) runs the models and the
# provider clients, and no app process maps them.
tilo-model-gateway = { path = "../../agent/model-gateway", default-features = false }
media = { package = "tilo-media", path = "../../platform/tilo-media" }
tilo-files = { path = "../../platform/tilo-files" }
# The rich-text document engine and its editor: the office apps, Notes, Chat,
# Calendar, Ebook and PDF Viewer each carried a copy of about 300 KB.
tilo-document = { path = "../../doc/tilo-document" }
tilo-rich-text = { path = "../../sdk/tilo-rich-text" }
# Versioned format/network engines used by system apps. Keeping these in the
# runtime bundle lets tapps contain policy and UI while the replaceable engine
# implementations are stored once per runtime generation.
vte = "0.15.0"
# Document codecs (Notes, Files, Mail, the office apps, ...). Apps choose the
# codec features; the union is built here once. The WebDAV client is not here:
# its calendar sign-in reaches account custody, so Calendar and Settings load
# it from the accounts engine.
tilo-doc-codecs = { path = "../../doc/tilo-doc-codecs", default-features = false }
# Without PDF pages: those come from the PDF engine (crates/runtime/engines/pdf),
# which the apps that read PDFs hand to the thumbnailer.
tilo-thumbnail = { path = "../../media/thumbnail" }
roxmltree.workspace = true
xattr = "1.6.1"
# File types by extension, for the apps that name them (Files, Mail).
tilo-mime = { path = "../../platform/tilo-mime" }
registry-types = { path = "../../packaging/registry-types" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
