[package]
name = "runtime-dylib"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Opt-in dynamic-library build of the Tilo runtime SDK and UI toolkit. Produces libruntime_dylib.so so thin apps can link the toolkit (and libstd) dynamically via -C prefer-dynamic instead of baking it into every binary."

# A Rust `dylib` requires `panic = "unwind"` and is incompatible with fat LTO,
# unlike the workspace's normal release profile. This standalone wrapper pulls
# the runtime SDK into one dylib and is built only with the opt-in `thin-app`
# profile; thin apps link it with `-C prefer-dynamic`.
[lib]
name = "runtime_dylib"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
runtime = { path = "../runtime" }
tilo-cli-kit = { path = "../cli" }
# The UI toolkit and its rendering graph are included in the shared dylib.
# `portal` covers apps that open host files through the XDG portal.
# This must be the superset used by every thin app in the default collection.
# A Rust dylib's exported symbol names contain the dependency crate hash; if an
# app enables a UI feature absent here, Cargo builds a second `ui` instance and
# the app can link successfully but fail at runtime with undefined symbols.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["portal", "webview-adblock", "dmabuf-import", "gpu-video", "mpris"] }
# Heavy document engines belong in the versioned runtime rather than each tapp.
typst = "0.15"
typst-render = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
tiny-skia = "0.12"
comemo = "0.5"
# Versioned live-service engines shared by shipped apps and loaded only for
# their feature-gated paths.
tilo-callstream = { path = "../../collab/tilo-callstream" }
rustypipe.workspace = true
iroh.workspace = true
# Desktop-owned service implementations are shared runtime code, not app
# payload. Settings composes all of these control surfaces and would otherwise
# statically repeat several megabytes of the same implementations in its tapp.
settings-store = { path = "../../system/settings-store" }
desktop-policy = { path = "../../system/desktop-policy" }
launcher = { path = "../../packaging/launcher" }
tilo-desktop-entry = { path = "../../system/desktop-entry" }
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
os-actions = { path = "../../system/os-actions" }
runtime-identity = { path = "../runtime-identity" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
runtime-fs = { path = "../runtime-fs" }
# The collaborative filesystem and content store linked by Files and
# Scratchpad, stored once here rather than in both tapps.
tilo-fs = { path = "../../system/fs" }
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
tilo-bluez = { path = "../../system/tilo-bluez" }
runtime-portal-xdg = { path = "../runtime-portal-xdg" }
accounts = { path = "../../system/accounts" }
# Cloud-account custody (OAuth, Nextcloud Login Flow, iCloud sessions) and the
# IMAP client are shared by Settings and Mail; linked statically they were
# about a sixth of Settings' tapp.
account-custody = { path = "../../system/account-custody" }
tilo-oauth = { path = "../../system/tilo-oauth" }
async-imap.workspace = true
agent-provider-config = { path = "../../agent/provider-config" }
tilo-model-gateway = { path = "../../agent/model-gateway" }
media = { package = "tilo-media", path = "../../platform/tilo-media" }
tilo-files = { path = "../../platform/tilo-files" }
# Versioned format/network engines used by system apps. Keeping these in the
# runtime bundle lets tapps contain policy and UI while the replaceable engine
# implementations are stored once per runtime generation.
chrono-tz = "0.10.4"
vte = "0.15.0"
tilo-pdf = { path = "../../platform/tilo-pdf" }
tilo-thumbnail = { path = "../../media/thumbnail", features = ["pdf"] }
roxmltree.workspace = true
xattr = "1.6.1"
mime_guess.workspace = true
app-cli = { path = "../../packaging/app-cli" }
app-host = { path = "../../packaging/app-host" }
registry-types = { path = "../../packaging/registry-types" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
