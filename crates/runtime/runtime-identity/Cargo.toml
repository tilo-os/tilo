[package]
name = "runtime-identity"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Broker-backed identity signing for Tilo apps."

# Tilo runtime — user-identity signing client and host-side lifecycle store.
# Packaged apps receive a connected broker descriptor and never a key path;
# TILO_USER_IDENTITY remains only as an unsandboxed-development compatibility
# route.
#
# In single-device (1-of-1) mode signing is done locally via
# ed25519-dalek. Threshold-mode (t > 1) signing requires a
# multi-device orchestrator and returns
# NotAvailable::ThresholdSigningNotSupported — the intended v1
# UX is that only the primary device signs directly and secondary
# devices use the FROST round-trip via `tilo-threshold-identity`.

[lib]
name = "runtime_identity"
path = "src/lib.rs"

[dependencies]
tilo-xdg-paths = { version = "0.1.0", path = "../../system/xdg-paths" }
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
getrandom.workspace = true
tilo-atomic-file = { version = "0.1.0", path = "../../system/atomic-file" }
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
wire-frame = { version = "0.1.0", path = "../../system/wire-frame", features = ["postcard", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[target.'cfg(unix)'.dependencies]
tilo-atomic-file = { version = "0.1.0", path = "../../system/atomic-file" }
serde_bytes.workspace = true
serde_json.workspace = true
ed25519-dalek = { workspace = true, features = ["serde"] }
threshold-identity = { version = "0.1.0", path = "../../collab/threshold-identity" }
hex.workspace = true
libc.workspace = true
zeroize.workspace = true
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
# Signing secrets in the system secret store: the Secret Service on Linux,
# the Keychain on macOS.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }
rand_core.workspace = true

[target.'cfg(unix)'.dev-dependencies]
tilo-atomic-file = { version = "0.1.0", path = "../../system/atomic-file", features = ["test-support"] }
tempfile.workspace = true
# Reproduces malformed `secret_bytes` records written by an earlier identity
# ceremony, so the loader rejects those records.
sha2.workspace = true
serial_test.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
