[package]
name = "runtime-identity"
version = "0.1.0"
edition = "2024"

# qOS runtime — user-identity signing client and host-side lifecycle store.
# Packaged apps receive a connected broker descriptor and never a key path;
# QOS_USER_IDENTITY remains only as an unsandboxed-development compatibility
# route.
#
# In single-device (1-of-1) mode signing is done locally via
# ed25519-dalek. Threshold-mode (t > 1) signing requires a
# multi-device orchestrator and returns
# NotAvailable::ThresholdSigningNotSupported — the intended v1
# UX is that only the primary device signs directly and secondary
# devices use the FROST round-trip via `qos-threshold-identity`.

[lib]
name = "runtime_identity"
path = "src/lib.rs"

[dependencies]
runtime-portal = { path = "../runtime-portal" }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
ed25519-dalek = { workspace = true, features = ["serde"] }
hex.workspace = true
libc.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Reproduces the exact bogus `secret_bytes` an earlier identity
# ceremony wrote, so the loader's refusal is tested against the real
# historical shape rather than an invented one.
sha2.workspace = true
serial_test.workspace = true

[lints]
workspace = true
