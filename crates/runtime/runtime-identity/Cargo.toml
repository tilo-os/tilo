[package]
name = "runtime-identity"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Host identity custody, recovery and broker lifecycle."

[lib]
name = "runtime_identity"
path = "src/lib.rs"

[dependencies]
tilo-identity-client = { version = "0.1.0", path = "../tilo-identity-client" }
tilo-paths.workspace = true
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
getrandom.workspace = true
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
wire-frame = { version = "0.1.0", path = "../../system/wire-frame", features = ["postcard", "tokio"] }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[target.'cfg(unix)'.dependencies]
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
serde_bytes.workspace = true
serde_json.workspace = true
ed25519-dalek = { workspace = true, features = ["serde"] }
threshold-identity = { version = "0.1.0", path = "../../collab/threshold-identity" }
hex.workspace = true
libc.workspace = true
zeroize.workspace = true
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
# Derives the person's secret-sync key from the root.
blake3.workspace = true
# Signing secrets in the system secret store: the Secret Service on Linux,
# the Keychain on macOS.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }
rand_core.workspace = true

[target.'cfg(unix)'.dev-dependencies]
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["test-support"] }
tempfile.workspace = true
# Reproduces malformed `secret_bytes` records written by an earlier identity
# ceremony, so the loader rejects those records.
sha2.workspace = true
serial_test.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
