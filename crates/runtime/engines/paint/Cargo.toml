[package]
name = "tilo-paint-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Canvas's painting engines (wet-media simulation, subject mattes) as an engine library beside the shared runtime: libtilo_paint_engine.so, shipped in the runtime bundle and loaded only by Canvas."

# A runtime engine: code one app needs that no other app should map. It is a
# Rust dylib chained on libruntime_dylib.so, built in the same Cargo graph as
# the runtime and the apps (os/scripts/build-thin-apps.sh), shipped under the
# runtime bundle's lib/ and named DT_NEEDED only by the app that uses it.
#
# Everything sits behind `thin`, which only that build enables (through the
# app's `runtime-engine` feature): a Rust dylib that links another Rust dylib
# needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh
# gives it. Any other build of this crate is an empty library.
[lib]
name = "tilo_paint_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot
# build this library without either a binary that needs it or `--lib` for
# every app. build-thin-apps.sh runs it to prove the engine loads and runs
# against the runtime it ships with.
[[bin]]
name = "tilo-paint-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-wet-media",
    "dep:tilo-subject",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
tilo-wet-media = { path = "../../../media/wet-media", optional = true }
tilo-subject = { path = "../../../platform/tilo-subject", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
