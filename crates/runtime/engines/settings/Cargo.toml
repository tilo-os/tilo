[package]
name = "tilo-settings-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Settings itself (the app's library: its window, effects and panes) and the libraries only Settings uses (the settings sections as resource models, the model-provider administration panel, the NTFS mount protocol, the wallpaper catalogue, the accessibility settings, the PC keyboard outlines, the time-zone globe) as an engine library beside the shared runtime: libtilo_settings_engine.so, shipped in the runtime bundle and loaded only by Settings."

# A runtime engine: code few apps need that no other app should map. It is a
# Rust dylib chained on libruntime_dylib.so, built in the same Cargo graph as
# the runtime and the apps (os/scripts/build-thin-apps.sh), shipped under the
# runtime bundle's lib/ and named DT_NEEDED only by the apps that use it.
#
# Everything sits behind `thin`, which only that build enables (through the
# apps' `runtime-engine` feature): a Rust dylib that links another Rust dylib
# needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh
# gives it. Any other build of this crate is an empty library.
[lib]
name = "tilo_settings_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot
# build this library without either a binary that needs it or `--lib` for
# every app. build-thin-apps.sh runs it to prove the engine loads and runs
# against the runtime it ships with.
[[bin]]
name = "tilo-settings-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:provider-settings-ui",
    "dep:tilo-ntfs-mount",
    "dep:tilo-wallpapers",
    "dep:tilo-accessibility-settings",
    "dep:tilo-pc-keyboard-geometry",
    "dep:tilo-zone-globe",
    "dep:settings-sections",
    "dep:settings",
    "dep:ui",
    "tilo-accounts-engine/thin",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
# The features Settings builds them with (apps/settings/Cargo.toml): one copy
# of each in the thin graph, or the app's symbols would name a crate hash this
# library does not export. Model Providers links the administration panel
# itself and never loads this library.
provider-settings-ui = { path = "../../../sdk/provider-settings-ui", optional = true }
tilo-ntfs-mount = { path = "../../../system/ntfs-mount", default-features = false, optional = true }
tilo-wallpapers = { path = "../../../platform/tilo-wallpapers", optional = true }
tilo-accessibility-settings = { path = "../../../platform/tilo-accessibility-settings", features = ["model"], optional = true }
tilo-pc-keyboard-geometry = { path = "../../../platform/pc-keyboard-geometry", optional = true }
tilo-zone-globe = { path = "../../../platform/zone-globe", optional = true }
settings-sections = { path = "../../../system/settings-sections", optional = true }
# Settings' library: the window, its effects and every pane. The app's
# binary is one call into this library (apps/settings/src/main.rs), so the
# app's package stays far below the package size limit; Settings' code ships
# in the runtime bundle and changes with it.
settings = { path = "../../../../apps/settings", optional = true }
# The SDK entry the app's binary calls (`ui::engine_main!`).
ui = { package = "tilo-app", path = "../../../sdk/tilo-app", optional = true }
# Account custody and the IMAP client, which Settings uses, come from
# their own engine library: one copy of each in the app's process.
tilo-accounts-engine = { path = "../accounts", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
