[package]
name = "tilo-agent-web-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The agent's web tools (the search and page reader, their two tool definitions, Tilo's HTTP client and the runtime they run on) as an engine library beside the shared runtime: libtilo_agent_web_engine.so, shipped in the runtime bundle and loaded only by the agent."

# A runtime engine: code few apps need that no other app should map. It is a
# Rust dylib chained on libruntime_dylib.so, built in the same Cargo graph as
# the runtime and the apps (os/scripts/build-thin-apps.sh), shipped under the
# runtime bundle's lib/ and named DT_NEEDED only by the apps that use it.
#
# Everything sits behind `thin`, which only that build enables (through the
# apps' `runtime-engine` feature): a Rust dylib that links another Rust dylib
# needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh
# gives it. Any other build of this crate is an empty library.
[lib]
name = "tilo_agent_web_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot
# build this library without either a binary that needs it or `--lib` for
# every app. build-thin-apps.sh runs it to prove the engine loads and runs
# against the runtime it ships with.
[[bin]]
name = "tilo-agent-web-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-agent-web-tools",
    "dep:tilo-web-search",
    "dep:tilo-rt",
    "dep:url",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
# The two tools themselves (crates/agent/agent-web-tools): the definitions the
# model reads, the arguments they bind and the answer one call returns.
tilo-agent-web-tools = { path = "../../../agent/agent-web-tools", optional = true }
# The features the agent builds it with: one of each in the thin graph, or the
# app's symbols would name a crate hash this library does not export.
tilo-web-search = { path = "../../../platform/tilo-web-search", optional = true }
# The runtime the tools wait on, provided by libruntime_dylib.so.
tilo-rt = { path = "../../../platform/tilo-rt", optional = true }
# The self-check's page addresses.
url = { workspace = true, optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
