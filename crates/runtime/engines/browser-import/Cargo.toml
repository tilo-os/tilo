[package]
name = "tilo-browser-import-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Importing bookmarks and history from another browser's profile (browser-continuity's capture, with SQLite for Chromium's and Firefox's databases) as an engine library beside the shared runtime: libtilo_browser_import_engine.so, shipped in the runtime bundle and loaded only by Browser."

# A runtime engine: code few apps need that no other app should map. It is a
# Rust dylib chained on libruntime_dylib.so, built in the same Cargo graph as
# the runtime and the apps (os/scripts/build-thin-apps.sh), shipped under the
# runtime bundle's lib/ and named DT_NEEDED only by the apps that use it.
#
# Everything sits behind `thin`, which only that build enables (through the
# apps' `runtime-engine` feature): a Rust dylib that links another Rust dylib
# needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh
# gives it. Any other build of this crate is an empty library.
[lib]
name = "tilo_browser_import_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot
# build this library without either a binary that needs it or `--lib` for
# every app. build-thin-apps.sh runs it to prove the engine loads and runs
# against the runtime it ships with.
[[bin]]
name = "tilo-browser-import-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:browser-continuity",
    "dep:rusqlite",
    "dep:tempfile",
    "dep:workspace-hack",
    "dep:browser-parts",
    "dep:tilo-browser-sessions",
    "tilo-accounts-engine/thin",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
# The features Browser builds it with (`native`, the capture from granted
# profiles): one browser-continuity in the thin graph, or the app's symbols
# would name a crate hash this library does not export.
browser-continuity = { workspace = true, features = ["native"], optional = true }
# The SQLite browser-continuity reads profiles with; only the self-check names
# it, to write the database it reads back.
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }
tempfile = { workspace = true, optional = true }
# The parts of Browser people rarely use (extensions, site controls, site
# capabilities) and the website-session codec check: the app's package
# carries the browsing itself.
browser-parts = { path = "../../../../apps/browser-parts", optional = true }
tilo-browser-sessions = { path = "../../../platform/tilo-browser-sessions", optional = true }
# Account custody, which the session codecs use, comes from its own engine
# library: one copy in the app's process.
tilo-accounts-engine = { path = "../accounts", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
