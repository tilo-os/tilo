[package]
name = "tilo-search-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The search layer's engine (tantivy, with its stemmers and codecs) as an engine library beside the shared runtime: libtilo_search_engine.so, which the toolkit opens the first time an app searches a large index."

# A runtime engine the toolkit opens on first use rather than one an app
# names DT_NEEDED: tilo-search loads it through tilo-engine-loader the first
# time a search index too large to answer from its records commits or is
# searched (a file listing, a mailbox, the body text of notes), so an app
# that only searches its palette's short lists never maps it. Like every
# engine it is a Rust dylib chained on libruntime_dylib.so, built in the same
# Cargo graph (os/scripts/build-thin-apps.sh) and shipped under the runtime
# bundle's lib/.
#
# Everything sits behind `thin`, which only that build enables: a Rust dylib
# that links another Rust dylib needs `-C prefer-dynamic`, which only
# tools/ci/rustc-thin-app-wrapper.sh gives it. `thin` also turns on
# tilo-search's `lazy-engine`, so the runtime built in that graph opens this
# library instead of linking tantivy. Any other build is an empty library.
[lib]
name = "tilo_search_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime: build-thin-apps.sh runs it to prove the engine
# loads and runs against the runtime it ships with.
[[bin]]
name = "tilo-search-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:tilo-search",
    "tilo-search/lazy-engine",
    "dep:tilo-search-tantivy",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
# The search layer the runtime carries, for the engine's types and to turn
# on its `lazy-engine`.
tilo-search = { path = "../../../sdk/search", optional = true }
tilo-search-tantivy = { path = "../../../sdk/search/tantivy", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
