[package]
name = "tilo-typst-engine"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Typst as an engine library beside the shared runtime: libtilo_typst_engine.so, shipped in the runtime bundle and loaded only by Typst Editor."

# A runtime engine: code one app needs that is too heavy for that
# app's tapp, and that no other app should map. It is a Rust dylib chained on
# libruntime_dylib.so, built in the same Cargo graph as the runtime and the
# apps (os/scripts/build-thin-apps.sh), shipped under the runtime bundle's
# lib/ and named DT_NEEDED only by the app that uses it.
#
# Everything sits behind `thin`, which only that build enables (through the
# app's `runtime-engine` feature): a Rust dylib that links another Rust dylib
# needs `-C prefer-dynamic`, which only tools/ci/rustc-thin-app-wrapper.sh
# gives it. Any other build of this crate is an empty library.
[lib]
name = "tilo_typst_engine"
path = "src/lib.rs"
crate-type = ["dylib"]

# Built with every runtime, whichever apps a release selects: Cargo cannot
# build this library without either a binary that needs it or `--lib` for
# every app. build-thin-apps.sh runs it to prove the engine loads and runs
# against the runtime it ships with.
[[bin]]
name = "tilo-typst-engine-check"
path = "src/check.rs"
required-features = ["thin"]

[features]
thin = [
    "dep:runtime-dylib",
    "dep:typst",
    "dep:typst-render",
    "dep:typst-pdf",
    "dep:typst-layout",
    "dep:typst-assets",
    "dep:comemo",
    "dep:workspace-hack",
]

[dependencies]
runtime-dylib = { path = "../../runtime-dylib", optional = true }
typst = { version = "0.15", optional = true }
typst-render = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-assets = { version = "0.15", features = ["fonts"], optional = true }
comemo = { version = "0.5", optional = true }
# Optional like everything else: an empty build must not link the hack's whole
# dependency set into a shared object.
workspace-hack = { version = "0.1", optional = true }

[lints]
workspace = true
