[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "runtime-collab"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# qOS runtime — broker (collaboration) client. Talks to the in-tree
# the session's broker over a Unix-socket Cap'n Proto channel passed
# in by the launcher as QOS_SVC_COLLAB_FD.

[package.metadata.cargo-machete]
# Invoked by build.rs to compile the Cap'n Proto schema.
ignored = ["capnpc"]

[lib]
name = "runtime_collab"
path = "src/lib.rs"

[build-dependencies]
capnpc.workspace = true

[dependencies]
runtime-portal = { path = "../runtime-portal" }
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
