[package]
name = "runtime-collab"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The Tilo collaboration wire and the client that speaks it."

# Tilo runtime collaboration client. Speaks the collaboration wire to the
# session over the Unix socket passed in as TILO_SVC_COLLAB_FD.

[lib]
name = "runtime_collab"
path = "src/lib.rs"

[features]
default = ["client"]
# The wire client and the Unix-socket transport. Without it only the
# portable vocabulary compiles (the wire's messages, action directory, nearby
# transfer, Wi-Fi continuity, task runs, presence and workspace-control
# types).
client = ["dep:runtime-portal", "dep:tokio", "dep:ed25519-dalek", "wire-frame/tokio"]
# An app's settings calls answered from a `settings_store::SettingsSource`, for
# the hosts that hand one to each app.
settings-host = ["client", "dep:settings-store"]
# Explicit root-only kernel/certificate qualification fixtures.
native-retained-qualification = ["client"]

[dependencies]
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
registry-types = { version = "0.1.0", path = "../../packaging/registry-types" }
# Only the session vocabulary and the engine launch boundary: this crate is
# in libruntime_dylib.so, and browser-continuity's capture (with SQLite) must
# never be unified into it.
browser-continuity-core.workspace = true
blake3.workspace = true
zeroize.workspace = true
# Signed retained proofs use the current canonical personal/device identity.
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity" }
ed25519-dalek = { workspace = true, optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
uuid.workspace = true
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The typed action vocabulary the exported surface and directory rows hold;
# only this crate's codec turns it into wire text.
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# Where content a record references has got to, as collaboration events say.
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false }
runtime-portal = { version = "0.1.0", path = "../runtime-portal", optional = true }
# `net` (the Unix-socket transport) is added for non-WASM targets below.
tokio = { workspace = true, optional = true, features = ["rt", "io-util", "macros", "sync"] }
settings-store = { version = "0.1.0", path = "../../system/settings-store", optional = true }
serde.workspace = true
serde_json.workspace = true
# A call's pictures travel in the local media lane's JSON as base64.
base64.workspace = true
postcard = { workspace = true, features = ["use-std"] }
# The collaboration wire's framing (`wire`).
wire-frame = { version = "0.1.0", path = "../../system/wire-frame", features = ["postcard"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["net"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
# Marks the inherited connection close-on-exec.
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
