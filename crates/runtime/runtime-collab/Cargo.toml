[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "runtime-collab"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cap'n Proto client for the Tilo collaboration service."

# Tilo runtime collaboration-broker client. Connects to the session broker
# over the Unix-socket Cap'n Proto channel passed in as TILO_SVC_COLLAB_FD.

[lib]
name = "runtime_collab"
path = "src/lib.rs"

[features]
default = ["client"]
# The Cap'n Proto broker client: generated bindings, the RPC runtime and the
# Unix-socket transport. Without it only the portable vocabulary compiles
# (action directory, nearby transfer, Wi-Fi continuity, task runs, presence
# and workspace-control types), for code that speaks the broker's language
# through some other transport.
client = ["dep:runtime-portal", "dep:capnp", "dep:capnp-rpc", "dep:tokio", "dep:tokio-util"]
# The `AppSettings` capability over a `settings_store::SettingsSource`, for
# the hosts that hand one to each app.
settings-host = ["client", "dep:settings-store"]

[dependencies]
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The typed action vocabulary the exported surface and directory rows hold;
# only this crate's codec turns it into wire text.
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
runtime-portal = { version = "0.1.0", path = "../runtime-portal", optional = true }
capnp = { workspace = true, optional = true }
capnp-rpc = { workspace = true, optional = true }
# `net` (the Unix-socket transport) is added for non-WASM targets below.
tokio = { workspace = true, optional = true, features = ["rt", "io-util", "macros", "sync"] }
tokio-util = { workspace = true, optional = true }
settings-store = { version = "0.1.0", path = "../../system/settings-store", optional = true }
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[[test]]
name = "it"
path = "tests/it.rs"
required-features = ["client"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["net"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
