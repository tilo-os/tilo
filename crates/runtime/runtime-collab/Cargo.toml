[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "runtime-collab"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime collaboration-broker client. Connects to the session broker
# over the Unix-socket Cap'n Proto channel passed in as TILO_SVC_COLLAB_FD.

[lib]
name = "runtime_collab"
path = "src/lib.rs"

[features]
default = ["client"]
# The Cap'n Proto broker client: generated bindings, the RPC runtime and the
# Unix-socket transport. Without it only the portable vocabulary compiles
# (action directory, nearby transfer, Wi-Fi continuity, task runs, presence
# and workspace-control types), for code that speaks the broker's language
# through some other transport.
client = ["dep:runtime-portal", "dep:capnp", "dep:capnp-rpc", "dep:tokio", "dep:tokio-util"]

[dependencies]
runtime-portal = { path = "../runtime-portal", optional = true }
capnp = { workspace = true, optional = true }
capnp-rpc = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "io-util", "macros", "sync"] }
tokio-util = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[[test]]
name = "it"
path = "tests/it.rs"
required-features = ["client"]

[lints]
workspace = true
