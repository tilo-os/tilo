[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "runtime-collab"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime collaboration-broker client. Connects to the session broker
# over the Unix-socket Cap'n Proto channel passed in as TILO_SVC_COLLAB_FD.

[lib]
name = "runtime_collab"
path = "src/lib.rs"

[dependencies]
runtime-portal = { path = "../runtime-portal" }
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
