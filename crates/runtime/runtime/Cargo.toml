[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime — umbrella crate. Apps link against `runtime` and
# use the re-exported modules (`collab`, `fs`, `identity`, `portal`).
# Sub-crates can also be depended on individually if an app wants
# only one of the surfaces (e.g. an app that only reads files should
# depend on `runtime-fs` directly to avoid pulling in
# ed25519-dalek).

[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
runtime-portal = { path = "../runtime-portal" }
runtime-portal-xdg = { path = "../runtime-portal-xdg" }
runtime-collab = { path = "../runtime-collab" }
runtime-fs = { path = "../runtime-fs" }
runtime-identity = { path = "../runtime-identity" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
