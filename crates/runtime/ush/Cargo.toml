[package]
autotests = false
name = "ush"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Application runtime that hosts a shell: a guest built from an environment record, read-only images, brokered permissions."

[lib]
name = "ush"
path = "src/lib.rs"

[[bin]]
name = "tilo-ush"
path = "src/main.rs"

[dependencies]
tilo-clock = { path = "../../platform/tilo-clock" }
runtime-portal = { path = "../runtime-portal" }
collab-types = { path = "../../collab/collab-types" }
# The environment record a guest is built from, and the tool builder seam.
tilo-environment = { path = "../environment" }
# Atomic writes of the host-shell decisions.
tilo-files = { path = "../../platform/tilo-files" }
# Builds the tool images `pkg install` adds.
env-tools = { path = "../env-tools" }
tilo-resource = { path = "../../sdk/tilo-resource" }
# The record is stored as Terminal stores its own records.
tilo-app-state = { path = "../../system/app-state" }
durable-store = { path = "../../system/durable-store" }
# Images are tapp packages the package store materialises read-only.
package-store = { path = "../../packaging/package-store", features = ["store"] }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
semver.workspace = true
# This device's key signs the tool images its builder makes; the user's
# fleet says which other devices' images are trusted.
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
hex.workspace = true
# Landlock ruleset installation and seccomp deny-list compilation, shared
# with the application launcher.
tilo-sandbox-core = { path = "../../system/sandbox-core" }
# Installed legacy apps become commands in every guest (`LegacyLaunch`).
legacy-vm = { path = "../legacy-vm" }

anyhow.workspace = true
tilo-xdg-paths = { path = "../../system/xdg-paths" }
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
ed25519-dalek.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
