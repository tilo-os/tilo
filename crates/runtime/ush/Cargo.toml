[package]
autotests = false
name = "ush"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Application runtime that hosts a shell: read-only host base, user-owned overlay layers, brokered permissions."

[lib]
name = "ush"
path = "src/lib.rs"

[[bin]]
name = "tilo-ush"
path = "src/main.rs"

[dependencies]
fnv.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
runtime-portal = { path = "../runtime-portal" }
collab-types = { path = "../../collab/collab-types" }
bounded-command = { path = "../../system/bounded-command" }
# Landlock ruleset installation and seccomp deny-list compilation, shared
# with the application launcher.
tilo-sandbox-core = { path = "../../system/sandbox-core" }
tilo-files = { path = "../../platform/tilo-files" }
# Installed legacy apps become commands in every guest (`LegacyLaunch`).
legacy-vm = { path = "../legacy-vm" }

anyhow.workspace = true
tilo-xdg-paths = { path = "../../system/xdg-paths" }
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
