[package]
name = "runtime-fs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime — workspace filesystem client. Talks to the launcher's
# in-process fs proxy over a Unix-socket Cap'n Proto channel passed
# in by the launcher as TILO_SVC_FS_FD.

[package.metadata.cargo-machete]
# Invoked by build.rs to compile the Cap'n Proto schema.
ignored = ["capnpc"]

[lib]
name = "runtime_fs"
path = "src/lib.rs"

[build-dependencies]
capnpc.workspace = true

[dependencies]
advisory-lock = { path = "../../system/advisory-lock" }
atomic-file = { path = "../../system/atomic-file" }
blake3.workspace = true
cap-std = "3.4.6"
rustix = { workspace = true, features = ["fs"] }
uuid.workspace = true
runtime-portal = { path = "../runtime-portal" }
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync"] }
tokio-util.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
wire-frame = { path = "../../system/wire-frame", features = ["postcard"] }

[dev-dependencies]
atomic-file = { path = "../../system/atomic-file", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
