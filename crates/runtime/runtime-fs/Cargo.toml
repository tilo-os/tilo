[package]
autotests = false
name = "runtime-fs"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cap'n Proto client for the Tilo workspace filesystem proxy."

# Tilo runtime — workspace filesystem client. Talks to the launcher's
# in-process fs proxy over a Unix-socket Cap'n Proto channel passed
# in by the launcher as TILO_SVC_FS_FD.

[lib]
name = "runtime_fs"
path = "src/lib.rs"

[dependencies]
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
blake3.workspace = true
cap-std = "3.4.6"
rustix = { workspace = true, features = ["fs"] }
uuid.workspace = true
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
wire-frame = { version = "0.1.0", path = "../../system/wire-frame", features = ["postcard", "tokio"] }

[dev-dependencies]
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
