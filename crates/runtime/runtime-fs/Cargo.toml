[package]
name = "runtime-fs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# qOS runtime — workspace filesystem client. Talks to the launcher's
# in-process fs proxy over a Unix-socket Cap'n Proto channel passed
# in by the launcher as QOS_SVC_FS_FD.

[lib]
name = "runtime_fs"
path = "src/lib.rs"

[build-dependencies]
capnpc.workspace = true

[dependencies]
runtime-portal = { path = "../runtime-portal" }
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync"] }
tokio-util.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[lints]
workspace = true
