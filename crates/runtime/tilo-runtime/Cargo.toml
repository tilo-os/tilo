[package]
name = "tilo-runtime"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The per-user shared runtime daemon: private profile, native endpoint, app attachment and the MCP projection of the action host."

# Deliberately free of the compositor: the desktop session supplies its
# services through `RuntimeServices`, and `standalone` hosts the shared broker
# and identity service itself, so this crate and its `tilo-runtime`
# executable build on stock macOS and on Linux without a Wayland stack.

[lib]
name = "tilo_runtime"
path = "src/lib.rs"

[features]
# Honour the developer environment overrides, in the crates this host reads a
# device's installed packages and identity through, exactly as a dev build of
# the desktop does. NEVER SHIP THIS: it accepts fixed credentials from the
# environment (tools/policy/check_dev_overrides_contract.py).
dev-overrides = [
  "tilo-identity-host/throwaway-test-identity",
  "package-store/dev-overrides",
  "launcher/dev-overrides",
]

[[bin]]
name = "tilo-runtime"
path = "src/bin/tilo-runtime.rs"

# The host a Tilo login runs, which `runtime_portal::native` finds by this
# name inside a login: the same services, under the name the login looks for.
[[bin]]
name = "tilo-runtime-mcp"
path = "src/bin/tilo-runtime-mcp.rs"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-paths.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-advisory-lock = { path = "../../system/advisory-lock" }
tilo-files = { path = "../../platform/tilo-files" }
anyhow.workspace = true
automerge.workspace = true
base64.workspace = true
# Seals and opens the channel state this device keeps for its encrypted routes.
channel-crypto = { path = "../../collab/channel-crypto" }
blake3.workspace = true
# The bytes and content addresses a joined workspace's files hydrate with.
bytes.workspace = true
chrono = { workspace = true, features = ["std"] }
collab-types = { path = "../../collab/collab-types" }
fs-protocol = { path = "../../system/fs-protocol" }
ed25519-dalek.workspace = true
# The random key sealing the channel state.
getrandom.workspace = true
hex.workspace = true
futures-util.workspace = true
# The endpoint joined rooms sync over, keyed by this device's key.
iroh.workspace = true
# The relays that endpoint uses, as the person set them, held back until
# something needs this device reachable.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
iroh-blobs.workspace = true
# The launcher's manifest view, service names and developer-override gate;
# its binary builds every Linux app sandbox.
launcher = { path = "../../packaging/launcher" }
libc.workspace = true
package-store = { path = "../../packaging/package-store" }
# The installed applications this runtime launches, read through their signed
# manifests.
app-catalogue = { path = "../../packaging/app-catalogue" }
postcard = { workspace = true, features = ["alloc"] }
rand_core.workspace = true
# Existing certified Join encoder; no new wire schema or credential.
runtime-collab = { path = "../runtime-collab", default-features = false }
runtime-fs = { path = "../runtime-fs" }
runtime-identity = { path = "../runtime-identity" }
serde.workspace = true
serde_json.workspace = true
tilo-action-broker = { path = "../../collab/tilo-action-broker" }
tilo-actions = { path = "../../collab/actions" }
tilo-automerge-isolate.workspace = true
tilo-desktop-model = { path = "../../session/desktop-model" }
# The document-media capability over the content store, and the workspace
# files mirrored into a folder where nothing mounts them.
tilo-fs = { package = "tilo-fs", path = "../../system/fs" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
tilo-identity-host = { path = "../tilo-identity-host" }
# The surface an app under development names (`app_surface`), and the
# runtime's own words (consent prompt, device grants), from Fluent. The
# broker links it on every platform already.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
# The one per-user index the host's own search reads.
tilo-os-search = { path = "../os-search" }
# The native request an app hands a host search result back with.
tilo-host-search = { path = "../../platform/tilo-host-search" }
# What a device says of itself when another device of its workspace offers it
# work: whether it runs the app, and how it is powered.
tilo-power-mgmt = { path = "../../system/power" }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
# The neighbour wire messages joined rooms exchange.
neighbour-wire = { path = "../../collab/neighbour-wire" }
# The room host every device runs, which the profile's own room is placed on.
tilo-room-host = { path = "../../hosting/tilo-room-host" }
# The content store app surfaces are read from.
tilo-content = { path = "../../system/content" }
# The apps' store: the device content store when the launcher handed one over.
tilo-content-device = { path = "../../system/content-device" }
# The workspace store this device holds for the workspaces it belongs to, and
# the admission door it answers with: the engine's own membership.
# The relay session a joined room syncs through.
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
# A workspace host's signed address, which a key enters a workspace at.
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
tilo-relay-client = { path = "../../hosting/tilo-relay-client" }
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
# The offload route a session's action door places offloadable actions
# through: the compute session with the home relay, placement and the
# room-scoped route (`tilo_relay::offload`). Its tests also start real relays.
tilo-relay = { path = "../../hosting/tilo-relay" }
tilo-rt.workspace = true
# `tilo mcp`'s agent says its word on the person's session as a client of the workspace's board.
tilo-session-client = { path = "../../session/client" }
tilo-session-core = { path = "../../session/core" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true

# Mounts the workspace files where this user can mount FUSE.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true
# The member that takes work runs its workspaces' shells: ush's own commands
# in process, and Linux programs in the local hosted-VM service.
ush = { path = "../ush" }

# App Sandbox or Seatbelt: how every app launches on stock macOS.
[target.'cfg(target_os = "macos")'.dependencies]
launcher-macos = { path = "../../packaging/launcher-macos" }
# The file chooser a confined app asks this runtime to show.
tilo-dialogs = { path = "../../platform/tilo-dialogs" }
# The device grants, as actions on the runtime's console socket.
console-control = { path = "../../session/console-control" }
# The camera and microphone a confined app asks this runtime to capture.
tilo-capture = { path = "../../platform/tilo-capture", features = ["camera", "microphone"] }
# The login Keychain keeps the channel-state key.
tilo-secrets = { path = "../../platform/tilo-secrets" }

[dev-dependencies]
# The attachment an app makes to the host this runtime serves, which the
# process-boundary tests drive as an app inside a login does.
runtime-portal = { path = "../runtime-portal" }
# The channel fixtures owner tests seal writes with.
tilo-action-broker = { path = "../../collab/tilo-action-broker", features = ["test-support"] }
# The join protocol a runtime joins rooms over.
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
# The governor whose rooms a runtime joins.
tilo-peer-state = { path = "../../collab/tilo-peer-state", features = ["test-support"] }
# Signs the installed-package fixtures the launch path verifies.
ed25519-dalek.workspace = true
# The cluster of a person's own records, which their store's key is.
collab-types = { path = "../../collab/collab-types" }
tempfile.workspace = true
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-test-env = { path = "../../dev/test-env" }
# A relay on this machine's loopback, which is what a test's devices relay through.
test-relay = { path = "../../dev/test-relay" }
# Paused time drives the watch lease's expiry.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
