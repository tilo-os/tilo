[package]
name = "legacy-vm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Per-user legacy VMs: one unprivileged libvirt domain per guest OS, woken on launch and snapshotted when idle."

[lib]
name = "legacy_vm"
path = "src/lib.rs"

[[bin]]
name = "tilo-legacy"
path = "src/main.rs"

# The privileged helper of a hosted-VM host (`hosted::jail`).
[[bin]]
name = "tilo-hosted-jail"
path = "src/jail_main.rs"

[dependencies]
collab-types = { path = "../../collab/collab-types" }
# A refusal carries the host contract's typed reason and next steps.
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
fnv.workspace = true
# The material a browser environment's session is started with, and the
# endpoint address it names the relay by: one type the relay and this host
# both build against.
iroh-base.workspace = true
tilo-relay-protocol = { version = "0.1.0", path = "../../hosting/tilo-relay-protocol" }
legacy-agent-protocol = { path = "../legacy-agent-protocol" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tilo-advisory-lock = { path = "../../system/advisory-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-libvirt-domain = { path = "../../system/libvirt-domain" }
tilo-paths = { path = "../../platform/tilo-paths" }
tilo-sandbox-core = { path = "../../system/sandbox-core" }
wire-frame = { path = "../../system/wire-frame", features = ["postcard"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-desktop-entry = { path = "../../system/desktop-entry" }
# A device certificate, for a material's device.
tilo-user-identity = { version = "0.1.0", path = "../../collab/tilo-user-identity" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The VM network's bridge filter, over the same nf_tables encoder as a
# sandbox's egress filter.
tilo-egress = { path = "../egress" }
