# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ runtime: the session services the launcher connects an app to
# (collaboration, the filesystem and its document media, the identity
# broker, shell-owned tools), one number for all of them. The app host is an
# interface of its own (crates/packaging/app-host/interface.toml).
name = "runtime"
version = 12
version_const = "crates/runtime/runtime-portal/src/lib.rs:RUNTIME_INTERFACE_VERSION"
encoding = "postcard"
served_to_apps = true
sources = [
    "crates/runtime/tilo-identity-client/src/lib.rs",
    "crates/runtime/tilo-identity-client/src/profile.rs",
    "crates/runtime/runtime-portal/src/tools.rs",
    "crates/runtime/runtime-collab/src/wire.rs",
    "crates/runtime/runtime-collab/src/lib.rs",
    "crates/runtime/runtime-collab/src/action_directory.rs",
    "crates/runtime/runtime-collab/src/room_status.rs",
    "crates/collab/collab-types/src/channel.rs",
    "crates/collab/collab-types/src/presence/payload.rs",
    "crates/collab/collab-types/src/inbound.rs",
    "crates/collab/collab-types/src/peer.rs",
    "crates/collab/collab-types/src/history.rs",
    "crates/collab/collab-types/src/op.rs",
    "crates/collab/collab-types/src/identity.rs",
    "crates/collab/collab-types/src/claim.rs",
    "crates/collab/collab-types/src/crypto.rs",
    "crates/collab/collab-types/src/role.rs",
    "crates/collab/collab-types/src/presence/hue.rs",
    "crates/collab/actions/src/key.rs",
    "crates/collab/actions/src/framework.rs",
    "crates/collab/actions/src/entry.rs",
    "crates/system/content/src/lib.rs",
]
roots = ["Request", "Response", "ToolRequest", "ToolReply", "Call", "HostFrame"]
capnp = [
    "crates/runtime/tilo-fs-client/schema/fs.capnp",
    "crates/runtime/tilo-fs-client/schema/blobs.capnp",
]

