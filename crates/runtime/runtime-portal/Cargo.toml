[package]
name = "runtime-portal"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Service discovery and connected-transport plumbing for Tilo runtime services."

# Tilo runtime — portal foundation: env-driven service discovery and the
# connected streams a launcher hands its children, with the descriptor
# lane that rides them. All higher-level service clients (collab, fs,
# identity) sit on top of this crate.

[lib]
name = "runtime_portal"
path = "src/lib.rs"

[dependencies]
sha2.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# tokio 1.x. We use the runtime + net + io + macros features only;
# heavy features like `signal` or `full` belong in the binary.
tokio = { workspace = true, features = ["rt", "io-util", "macros", "sync"] }
thiserror.workspace = true
# The `tools` service speaks newline-delimited JSON.
serde.workspace = true
serde_json.workspace = true
# The install requests are length-prefixed frames like every other stream
# protocol. Framing is plain `Read`/`Write`, so the messages read and write on
# every target; only the client's transport is a Unix socket.
wire-frame = { version = "0.1.0", path = "../../system/wire-frame" }

[target.'cfg(unix)'.dependencies]
# Caller-private atomic publication through the existing canonical file API.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
libc.workspace = true
# `fcntl(F_GETFD)` probes whether a fd is open before handing it to tokio.
rustix = { workspace = true, features = ["net", "process"] }
# Whether the process runs inside a Tilo login, to pick the host to attach to.
tilo-paths.workspace = true
# Service descriptors are Unix sockets; other hosts report `NotAvailable`.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }
tempfile.workspace = true

[[test]]
name = "native"
path = "tests/native.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The browser has no local service sockets; `local_socket::Stream` is still
# a tokio stream type there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["io-util"] }
