[package]
name = "runtime-portal"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Service discovery and connected-transport RPC plumbing for Tilo runtime services."

# Tilo runtime — portal foundation: env-driven service discovery and a
# thin wrapper that lifts a connected Unix-socket file descriptor into
# a tokio-backed Cap'n Proto RPC client. All higher-level service
# clients (collab, fs, identity) sit on top of this crate.

[lib]
name = "runtime_portal"
path = "src/lib.rs"

[features]
default = ["rpc"]
# `CapnpClient` and the service-opening helpers. Without it the crate is the
# discovery half only — `service_fd`, `is_tilo_native`, `NotAvailable` and the
# native attachment metadata — for callers such as `cli` that never speak RPC.
rpc = ["dep:capnp", "dep:capnp-rpc", "dep:tokio", "dep:tokio-util"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Pinned: capnp 0.26 ships with capnp-rpc 0.26 and capnpc 0.26. The
# whole 0.26 line shares a generator + RPC ABI.
capnp = { workspace = true, optional = true }
capnp-rpc = { workspace = true, optional = true }
# tokio 1.x. We use the runtime + net + io + macros features only;
# heavy features like `signal` or `full` belong in the binary.
tokio = { workspace = true, optional = true, features = ["rt", "io-util", "macros", "sync"] }
tokio-util = { workspace = true, optional = true }
thiserror.workspace = true
# The `tools` service speaks newline-delimited JSON.
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# `fcntl(F_GETFD)` probes whether a fd is open before handing it to tokio.
rustix = { workspace = true, features = ["net", "process"] }
# Whether the process runs inside a Tilo login, to pick the host to attach to.
tilo-paths.workspace = true
# Service descriptors are Unix sockets; other hosts report `NotAvailable`.
tokio = { workspace = true, optional = true, features = ["net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
getrandom.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tilo-test-env = { path = "../../dev/test-env" }

[[test]]
name = "native"
path = "tests/native.rs"
required-features = ["rpc"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The browser has no local service sockets; `local_socket::Stream` is still
# a tokio stream type there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["io-util"] }
