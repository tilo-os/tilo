[package]
name = "tilo-fs-client"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Capability clients and wire types for Tilo filesystem services."

[dependencies]
blake3.workspace = true
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }
tokio = { workspace = true, features = ["rt", "io-util", "macros", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
wire-frame = { version = "0.1.0", path = "../../platform/wire-frame", features = ["postcard", "tokio"] }

[target.'cfg(unix)'.dependencies]
# The daemon's socket is bound and reached by path.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
tilo-paths.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["net"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
