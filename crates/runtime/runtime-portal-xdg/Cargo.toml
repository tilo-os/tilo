[package]
name = "runtime-portal-xdg"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime XDG portal client for file chooser, screencast, notifications,
# secret service, and open-uri operations. Calls return
# `PortalError::NotAvailable` when no D-Bus session bus is reachable.
#
# The layer passes response state through from `ashpd`; apps needing deeper
# portal semantics can depend on `ashpd` directly.

[lib]
name = "runtime_portal_xdg"
path = "src/lib.rs"

[dependencies]
# ashpd uses the tokio backend to match the rest of the Tilo runtime stack;
# default features are disabled to drop async-std.
ashpd = { workspace = true, features = ["file_chooser", "notification", "open_uri", "screencast", "secret"] }
# tokio powers the sync wrapper; apps with an existing runtime should use the
# `*_async` variants.
tokio = { workspace = true, features = ["rt", "net", "macros", "sync"] }
thiserror.workspace = true
# For the URL type in `OpenUri::open`.
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
