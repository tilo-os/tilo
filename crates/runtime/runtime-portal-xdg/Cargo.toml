[package]
name = "runtime-portal-xdg"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# Tilo runtime XDG portal client for screencast, notifications and the secret
# portal. File choosing and open-uri live in `ui::portal`. Calls return
# `PortalError::NotAvailable` when no D-Bus session bus is reachable.
#
# The layer passes response state through from `ashpd`; apps needing deeper
# portal semantics can depend on `ashpd` directly.

[lib]
name = "runtime_portal_xdg"
path = "src/lib.rs"

[dependencies]
# ashpd uses the tokio backend to match the rest of the Tilo runtime stack;
# default features are disabled to drop async-std.
ashpd = { workspace = true, features = ["notification", "screencast", "secret"] }
# The sync wrappers wait on the process's shared app runtime; async callers
# use the `*_async` variants directly.
tilo-rt.workspace = true
thiserror.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
