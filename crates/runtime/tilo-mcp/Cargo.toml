[package]
name = "tilo-mcp"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The MCP projection of an action host, and the APIs an MCP client reaches a desktop or another device through."

[features]
# Hosts whose answers a test checks: the runtime's daemon tests serve them too.
test-support = ["dep:tilo-test-env", "dep:tilo-resource"]

[dependencies]
# What every Tilo app publishes (its surface), for the apps a hosted workspace's programs compile
# against: data only, no app links the server that serves them.
app-fleet = { path = "../../packaging/app-fleet", features = ["surfaces"] }
base64.workspace = true
blake3.workspace = true
collab-types = { path = "../../collab/collab-types" }
ed25519-dalek.workspace = true
fs-protocol = { path = "../../system/fs-protocol" }
hex.workspace = true
iroh.workspace = true
libc.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# A task's programs run in a tilolang host of this process: the host itself, and the sealed blob
# its apps arrive in.
runtime-portal = { path = "../../runtime/runtime-portal" }
tilo-render-protocol = { path = "../../platform/tilo-render-protocol" }
tilolang-host = { path = "../../platform/tilolang-host" }
serde.workspace = true
serde_json.workspace = true
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-actions = { path = "../../collab/actions" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-content = { path = "../../system/content" }
tilo-delivery-protocol = { path = "../../hosting/tilo-delivery-protocol" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-paths.workspace = true
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol" }
tilo-relay-session = { path = "../../hosting/tilo-relay-session" }
tilo-resource = { path = "../../sdk/tilo-resource", optional = true }
tilo-rt.workspace = true
tilo-session-client = { path = "../../session/client" }
tilo-test-env = { path = "../../dev/test-env", optional = true }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
# A test checks the agent id it forms is one a workspace admits.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
