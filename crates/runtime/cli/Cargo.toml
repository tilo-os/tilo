[package]
name = "tilo-cli-kit"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "SDK helpers for Tilo CLI apps — stdio, workspace paths, terminal-aware output."
repository.workspace = true
homepage.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

# Thin wrappers over the runtime crates so CLI apps can
# focus on their own logic rather than plumbing. Works both when
# the launcher's environment is present (TILO_WORKSPACE_*,
# TILO_SVC_FS_FD, ...) and when the app is running standalone —
# in the latter case, `resolve_workspace_path` returns a
# fallback under $XDG_DATA_HOME / ~/.local/share.

[dependencies]
# The CLI helpers only need the shared availability error/session probe on
# every host. Avoid linking the other runtime crates: that would drag the
# Unix service clients and identity store into native host applications which
# merely reuse `standalone_state_dir`.
runtime-portal   = { version = "0.1.0", path = "../runtime-portal", default-features = false }
tilo-paths.workspace = true

anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
# Direct service-FD access is a Unix capability. Native Windows callers keep
# the same path helpers and gracefully run without an RPC filesystem client.
runtime-fs       = { package = "tilo-fs-client", version = "0.1.0", path = "../tilo-fs-client" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
