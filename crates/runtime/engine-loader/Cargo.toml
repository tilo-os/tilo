[package]
name = "tilo-engine-loader"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Opens a runtime engine library the first time the toolkit uses it, instead of at every app's exec."

[lib]
name = "tilo_engine_loader"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
