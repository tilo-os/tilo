[package]
name = "tilo-user-identity"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The human-facing identity layer for Tilo."

[package.metadata.cargo-machete]
# This feature-only edge selects JS entropy for transitive WASM cryptography.
ignored = ["getrandom"]

[lib]
name = "tilo_user_identity"
path = "src/lib.rs"

[[bin]]
name = "tilo-image-trust"
path = "src/bin/tilo-image-trust.rs"

[[bin]]
name = "tilo-device-key-init"
path = "src/bin/tilo-device-key-init.rs"

# User root identity + device certificates + revocation for Tilo.
#
# Introduces the human-facing identity layer: a single Ed25519 root
# keypair per user certifies per-device Ed25519 keys via signed
# `DeviceCert`s that carry capabilities, an optional expiry, and a
# human-readable label. A workspace is owned by a *user identity*
# (not a device); any device presenting a valid cert chaining to the
# owner identity has owner permissions. A revocation list published
# in the user's identity CRDT lets a lost or stolen device be killed;
# peers reject its changes going forward.
#
# The workspace directory itself lives inside this crate as a
# bounded Automerge document (`WorkspaceDirectory`) that syncs
# device-to-device via authenticated incremental deltas.
#
# Wire format is pinned via canonical postcard byte-encoding and a
# fixed BLAKE3-hashed preimage constant per signed type; see
# `signing_preimage.rs`. Neither the constants nor the byte layout
# may change without a version bump.

[dependencies]
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).

# Ed25519 signing/verification. Same version + features used across
# the collab crates (`collab-types`, `threshold-identity`) so the
# `SigningKey`/`VerifyingKey` types are interchangeable.
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }

# The RNG shape ed25519-dalek 2.x consumes (`rand_core` 0.6). Kept
# in lockstep with `collab-types` to avoid rand-version drift.

# BLAKE3 for hashing the signing preimage (`preimage_constant ||
# postcard(view_without_signature)`). Ed25519 signs the 32-byte
# hash, so the on-wire signature is decoupled from payload size —
# a property the design pins explicitly for the DeviceCert and
# RevocationEntry ABI.
blake3.workspace = true

# Lower-case hex names the per-user key files.
hex.workspace = true

# Canonical wire encoding for everything that gets signed. Same
# choice as `collab-types`; postcard is little-endian +
# varint-encoded with no field-reorder leeway, so signatures are
# byte-for-byte reproducible across peers.
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
postcard = { workspace = true, features = ["alloc"] }

# Workspace-directory CRDT. Kept in-doc rather than as a separate
# collab-types Space because directory shape (workspaces, member
# devices, host assignments, pins, revocations) is user-scoped, not
# workspace-scoped.
automerge.workspace = true
tilo-automerge.workspace = true

# Error plumbing (matches collab-types).
thiserror.workspace = true
libc.workspace = true
zeroize.workspace = true

# Dalek scrubs `SigningKey` on drop; this also scrubs the transient file,
# stack, and serialization buffers used before/after that owned key exists.

# Base32 for the enrollment-token wire form. Crockford variant
# (no ambiguity between 0/O or 1/l/I) so a user can read the token
# out loud without garble; the alphabet is declared at compile time.
data-encoding.workspace = true
# The browser-computed wrap of a root envelope.
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
data-encoding-macro.workspace = true

# The login Keychain keeps a Tilo runtime's device key on macOS. On Linux a
# process that read the device key proves it to the Secret Service, which
# cannot read a non-dumpable process's executable.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# Isolated on-disk fixtures for the persistence-round-trip tests
# so we do not touch /var/lib/tilo on the developer's machine.
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
