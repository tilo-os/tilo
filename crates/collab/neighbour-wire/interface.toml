# Device ↔ device: the certified handshake, the relay session's frames and
# the peer-sync messages they carry between two devices and their hosts.
name = "peer"
version = 37
version_const = "crates/collab/neighbour-wire/src/lib.rs:PEER_PROTOCOL_VERSION"
encoding = "postcard"
served_to_apps = false
sources = [
    "crates/hosting/tilo-relay-protocol/src/auth.rs",
    "crates/hosting/tilo-relay-protocol/src/transport.rs",
    "crates/hosting/tilo-relay-protocol/src/entering.rs",
    "crates/hosting/tilo-relay-protocol/src/directory.rs",
    "crates/hosting/tilo-relay-protocol/src/workspaces.rs",
    "crates/hosting/tilo-delivery-protocol/src/transport_v2.rs",
    "crates/hosting/tilo-delivery-protocol/src/transport_v2/delta.rs",
    "crates/hosting/tilo-delivery-protocol/src/transport_v2/presence.rs",
    "crates/collab/neighbour-wire/src/lib.rs",
    "crates/collab/neighbour-wire/src/actions.rs",
    "crates/collab/neighbour-wire/src/offer.rs",
    "crates/collab/neighbour-wire/src/colorimetry.rs",
    "crates/collab/neighbour-wire/src/hdr_metadata.rs",
    "crates/collab/actions/src/record_sync.rs",
    "crates/collab/neighbour-wire/src/retention.rs",
    "crates/collab/neighbour-wire/src/unit_chain.rs",
    "crates/collab/tilo-user-identity/src/cert.rs",
    "crates/collab/collab-types/src/channel.rs",
    "crates/hosting/tilo-relay-protocol/src/voice.rs",
    "crates/collab/collab-types/src/mls_governance.rs",
    "crates/collab/tilo-user-identity/src/directory.rs",
    "crates/collab/actions/src/outcome.rs",
    "crates/collab/tilo-user-identity/src/revocation.rs",
    "crates/collab/collab-types/src/op.rs",
    "crates/collab/collab-types/src/identity.rs",
    "crates/collab/collab-types/src/claim.rs",
    "crates/collab/collab-types/src/crypto.rs",
    "crates/collab/actions/src/key.rs",
    "crates/collab/actions/src/framework.rs",
    "crates/collab/actions/src/contract.rs",
    "crates/collab/actions/src/entry.rs",
