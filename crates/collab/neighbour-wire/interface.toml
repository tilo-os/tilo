    "crates/collab/collab-types/src/peer.rs",
    "crates/collab/collab-types/src/presence/shell.rs",
]
roots = ["Hello", "HelloAck", "HelloAck2", "EnterStep", "EnterProof", "EnvelopeV2", "NeighbourMsg", "DeviceAction", "SignedDeviceAction", "PlaneFrame", "State"]

[opaque]
Uuid = "uuid::Uuid: 16 bytes"
Value = "serde_json::Value: any JSON value, carried as its text"
RemoteActionMessage = "tilo_actions::remote::RemoteActionMessage: the action-host vocabulary, carried as opaque postcard bytes and versioned by the relay transport's remote-action envelope"

