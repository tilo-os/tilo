[package]
name = "neighbour-wire"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Peer-sync wire vocabulary exchanged between Tilo peers: the NeighbourMsg envelope and the pure helpers that classify it."

[lib]
name = "neighbour_wire"
path = "src/lib.rs"

# Pure types and pure functions: no I/O, no async runtime, no transport.
# Any peer that speaks the collaboration protocol (the compositor, a
# headless host) depends on this crate rather than on the compositor.
[dependencies]
serde.workspace = true
# Signed document envelopes, presence and artifact ids ride inside messages.
collab-types = { path = "../collab-types" }
# Device certificates and revocations for identity announcements.
tilo-user-identity = { path = "../tilo-user-identity" }
# Host retention channels are BLAKE3 digests of the message route; an
# invitation's id is the BLAKE3 digest of its bearer string.
blake3.workspace = true
# Invitations are signed by, and dial, an Iroh endpoint.
iroh-base = { workspace = true, features = ["key"] }
# Validates the key material an invitation pins; signs admissions.
ed25519-dalek.workspace = true
# The signed invitation payload, and the production codec the golden-byte
# tests pin every variant's encoding with.
postcard = { workspace = true, features = ["alloc"] }
# The bearer encoding of an invitation.
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
