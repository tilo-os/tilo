[package]
name = "neighbour-wire"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Peer-sync wire vocabulary exchanged between Tilo peers: the NeighbourMsg envelope and the pure helpers that classify it."
repository.workspace = true
homepage.workspace = true

[lib]
name = "neighbour_wire"
path = "src/lib.rs"

# Pure types and pure functions: no I/O, no async runtime, no transport.
# Any peer that speaks the collaboration protocol (the compositor, a
# headless host) depends on this crate rather than on the compositor.
[dependencies]
serde.workspace = true
# Signed document envelopes, presence and artifact ids ride inside messages.
collab-types = { version = "0.1.0", path = "../collab-types" }
# Device certificates and revocations for identity announcements.
tilo-user-identity = { version = "0.1.0", path = "../tilo-user-identity" }
# Host retention channels are BLAKE3 digests of the message route.
blake3.workspace = true

[dev-dependencies]
# The production codec; tests pin every variant's exact encoding.
postcard = { workspace = true, features = ["alloc"] }
serde_json.workspace = true
uuid.workspace = true
# Signs the governance fixtures the retention tests classify.
ed25519-dalek.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
