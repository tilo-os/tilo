[package]
name = "tilo-device-identity"
version = "0.1.0"
edition = "2024"
publish.workspace = true
# Client side: a device's own key and certificates, reached from the app SDK.
license = "MIT"
description = "Where a device keeps its identity: its key in one keystore, its certificates, the revocations it trusts, and a copied machine's re-key journal."

[lib]
name = "tilo_device_identity"
path = "src/lib.rs"

[[bin]]
name = "tilo-image-trust"
path = "src/bin/tilo-image-trust.rs"

[[bin]]
name = "tilo-device-key-init"
path = "src/bin/tilo-device-key-init.rs"

[dependencies]
# Signing keys are the material this crate reads and writes; certificates and
# revocations stay `tilo-user-identity`'s pure types.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom.workspace = true
tilo-user-identity = { version = "0.1.0", path = "../tilo-user-identity" }

# Crash-safe file replacement (temp + fsync + rename + dir fsync) and the
# bounded private reads every identity file goes through.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# The one lock Tilo takes on the update transaction, re-validated through an
# inherited descriptor.
tilo-advisory-lock = { version = "0.1.0", path = "../../platform/advisory-lock" }

# `prctl(PR_SET_DUMPABLE)`, `openat2` and the wall-clock timerfd.
libc.workspace = true
hex.workspace = true
# The re-key journal and the revocation file are postcard-encoded.
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# Where a device's login dials its server (`login::ServerAddress`).
iroh-base = { workspace = true, features = ["key"] }

# A device's key is either a group-private file read by two uids (the OS
# layout) or, where only the user's own runtime reads it, a login Keychain
# item; on Linux a process that read the key proves it to the Secret Service,
# which cannot read a non-dumpable process's executable.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# This computer as one of the person's devices (`login::Place`): its errors and the state
# directory it is kept in.
anyhow.workspace = true
tilo-paths.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Isolated on-disk fixtures so the persistence tests never touch
# /var/lib/tilo on the developer's machine.
tilo-test-env = { path = "../../../tools/test-env" }
tempfile.workspace = true

[lints]
workspace = true
