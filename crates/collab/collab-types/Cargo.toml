[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "collab-types"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The cryptographic identifiers and wire types of Tilo Spaces."

[package.metadata.cargo-machete]
# Used only as `#[serde(with = "serde_bytes")]`, a string machete does not read.
ignored = ["serde_bytes"]

[lib]
name = "collab_types"
path = "src/lib.rs"

# Cryptographic foundation for Tilo Spaces and Channels:
# Identity, Attestation, Role presets, SignedOp
# envelope, ChannelEvent governance log, deterministic
# canonical-bytes serialisation, Ed25519 signing primitives, and the
# inbound-op validator. Pure types + pure functions — no I/O, no async,
# no compositor dependency. See `src/lib.rs` for the wire contract.

[dependencies]
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# Sorts without a copy of std's sort per call site (presence colours).
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
# The hue someone wears until they choose one, as every surface derives it.
tilo-face = { version = "0.1.0", path = "../../platform/tilo-face" }
getrandom.workspace = true
web-time = { version = "1", features = ["serde"] }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
serde.workspace = true
serde_bytes.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# Compaction-checkpoint prefix hashing uses SHA-256
# (already pulled in transitively by some Iroh features but kept
# direct here so the dep is explicit) so the digest is 32 bytes
# without needing a separate blake3 dep.
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# `caps::net::EgressPolicy::from_grants` names the grants it ignores.
tracing.workspace = true
uuid.workspace = true
# The action a change claims, named as the executor names it.
tilo-actions = { version = "0.1.0", path = "../actions" }
# A capability is a stored value of the records that keep grants.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
automerge.workspace = true
tilo-automerge.workspace = true
# The app surface a receiver decides claims against, read from surface.toml.
toml.workspace = true
blake3.workspace = true
# A continuation's claim is read from its action's JSON payload.
serde_json.workspace = true

[dev-dependencies]

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
