[package]
name = "collab-types"
version = "0.1.0"
edition = "2024"
[lib]
name = "collab_types"
path = "src/lib.rs"

# Cryptographic foundation for qOS Spaces and Channels:
# Identity, Attestation, Role/OpClass permission tables, SignedOp
# envelope, ChannelEvent governance log, deterministic
# canonical-bytes serialisation, Ed25519 signing primitives, and the
# inbound-op validator. Pure types + pure functions — no I/O, no async,
# no compositor dependency. Built as the foundation for Phase 3 wire
# enforcement and beyond. See `src/lib.rs` and the
# `2026-06-29-spaces-channels-and-cryptographic-roles.md` spec.

[dependencies]
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
serde.workspace = true
serde_bytes.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# Phase 6 compaction-checkpoint prefix hashing. We pick SHA-256
# (already pulled in transitively by some libp2p features but kept
# direct here so the dep is explicit) so the digest is 32 bytes
# without needing a separate blake3 dep.
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
