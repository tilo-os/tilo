[package]
name = "tilo-peer-state"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# Used only as `#[serde(with = "serde_bytes")]`, a string machete does not read.
ignored = ["serde_bytes"]

[dependencies]
tilo-actions = { path = "../actions" }
fnv.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
# Untrusted automerge bytes are decoded in isolated workers first.
tilo-automerge-isolate.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
uuid.workspace = true
hex.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
web-time = { version = "1", features = ["serde"] }
collab-types = { path = "../collab-types" }
tilo-desktop-model = { path = "../../session/desktop-model" }
tilo-action-policy = { path = "../action-policy" }
# The shared neighbour wire vocabulary (`NeighbourMsg`, colorimetry, HDR metadata).
neighbour-wire = { path = "../neighbour-wire" }
tilo-user-identity = { path = "../tilo-user-identity" }
# The workspace invitation and join contract, re-exported as `join`.
tilo-workspace-join = { path = "../workspace-join" }
# A bot's program is parsed and its grant checked against its steps.
tilo-automation = { path = "../automation" }
# A bot installed from the directory names the listing it came from.
registry-types = { path = "../../packaging/registry-types" }

[dev-dependencies]
# The sanctioned patch-log-free way to take changes into an AutoCommit (clippy.toml).
tilo-automerge.workspace = true
# Real channel content keys for the sealed compaction tests.
channel-crypto = { path = "../channel-crypto" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
