[package]
name = "collab-bridge"
version = "0.1.0"
edition = "2024"
description = "qOS collab-bridge: Cap'n Proto SDK surface (runtime-collab) in front of the shell's legacy serde-JSON CollabRequest/CollabEvent broker."

[[bin]]
name = "qos-collab-bridge"
path = "src/main.rs"

[lib]
name = "collab_bridge"
path = "src/lib.rs"

[dependencies]
runtime-collab = { path = "../../runtime/runtime-collab" }
collab-types = { path = "../collab-types" }

capnp.workspace = true
capnp-rpc.workspace = true

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v5"] }
postcard = { workspace = true, features = ["use-std"] }

clap.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sd-notify.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
runtime-portal = { path = "../../runtime/runtime-portal" }
