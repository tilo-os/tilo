[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "Standalone libp2p gossipsub relay for the qOS collaboration mesh."
license = "MIT OR Apache-2.0"

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "qos-relay"
path = "src/main.rs"

# Phase 9 of `docs/superpowers/specs/2026-06-29-spaces-channels-and-cryptographic-roles.md`.
#
# Wire-format compatibility with the in-shell network actor is non-
# negotiable, so the libp2p version + transport features (tcp, noise,
# yamux, gossipsub, mdns) are pinned to the **exact same** versions the
# shell uses (`shell/Cargo.toml`). The relay additionally enables
# `kad` (DHT bootstrap), `quic` (QUIC transport), `identify`, `ping`
# and `metrics` (Prometheus counters) — features the shell doesn't
# need but that the public-facing relay does.
[dependencies]
libp2p = { workspace = true, features = ["kad", "identify", "ping", "quic", "metrics"] }
tokio = { workspace = true, features = ["full"] }
clap.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
globset = "0.4"
prometheus-client = "0.22"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
