[package]
name = "tilo-broker-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "The action broker's session-facing half on every host: what a step is taken by, the steps a host serves, the receipts a caller reads, and the route an app's traffic is addressed on."

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# The single home of a channel id's encoding, and the channel types it names.
collab-types = { version = "0.1.0", path = "../collab-types" }
# The owner a host's session keeps its workspaces in, and the key it signs their commits with.
tilo-peer-state = { version = "0.1.0", path = "../tilo-peer-state" }
# A person's certificates and revocations, as the authority checks the roles hold them.
tilo-user-identity = { version = "0.1.0", path = "../tilo-user-identity" }
# What an installed package's signed manifest offers, as the launcher lists it.
tilo-app-package = { version = "0.1.0", path = "../../packaging/tilo-app-package" }
# The device's keymap, as a host describes its shortcuts from.
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
# The collaboration vocabulary a service answers in — its wire messages, task runs, presence and
# control types — without the native client transport.
runtime-collab = { version = "0.1.0", path = "../../runtime/runtime-collab", default-features = false }
tracing.workspace = true
# The wall clock a policy question is decided at, as every host reads it.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
uuid.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[dev-dependencies]
# The task-run tests apply changes the way a workspace's origin does.
tilo-automerge = { version = "0.1.0", path = "../../doc/tilo-automerge" }
# The task-run tests read workspaces through the isolated automerge workers a test binary serves.
tilo-automerge-isolate.workspace = true
automerge.workspace = true
tilo-peer-state = { version = "0.1.0", path = "../tilo-peer-state", features = [
    "test-support",
] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The unified feature set is native (its tokio pulls mio, which refuses wasm32).
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser entropy for the crypto the action vocabulary pulls in.
getrandom = { workspace = true, features = ["wasm_js"] }
