[package]
name = "tilo-broker-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "The action broker's session-facing half on every host: what a step is taken by, the steps a host serves, the receipts a caller reads, and the route an app's traffic is addressed on."

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# The single home of a channel id's encoding, and the channel types it names.
collab-types = { version = "0.1.0", path = "../collab-types" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The unified feature set is native (its tokio pulls mio, which refuses wasm32).
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser entropy for the crypto the action vocabulary pulls in.
getrandom = { workspace = true, features = ["wasm_js"] }
