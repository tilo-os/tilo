[package]
name = "tilo-broker-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "The action broker's session-facing half on every host: what a step is taken by, the steps a host serves, the receipts a caller reads, and the route an app's traffic is addressed on."

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
# The single home of a channel id's encoding, and the channel types it names.
collab-types = { version = "0.1.0", path = "../collab-types" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
