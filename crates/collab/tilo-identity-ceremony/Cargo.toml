[package]
name = "tilo-identity-ceremony"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The identity record a ceremony writes and the store it keeps it in."

[dependencies]
runtime-identity = { package = "tilo-identity-client", path = "../../runtime/tilo-identity-client" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
collab-types = { version = "0.1.0", path = "../collab-types" }
threshold-identity = { version = "0.1.0", path = "../threshold-identity" }
tilo-clock = { path = "../../platform/tilo-clock" }
chrono = { workspace = true, features = ["clock", "std"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }

[lints]
workspace = true
