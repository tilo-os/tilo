[package]
name = "tilo-live"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The live plane: a moq-lite session per device per scope, a relay that copies sealed bytes and admits from certificates and the roster, the sealing of every frame under its scope's keys, and the tilo-voice/1 and tilo-video/1 object profiles."
license.workspace = true

[features]
default = []
# One participant's sealed session in one scope: the namespace of one device
# in one scope, the tracks within it and their delivery, the sealing under
# the scope's channel keys, and the admission a participant runs on it.
# Builds for the page, which publishes and reads them itself.
plane = ["dep:moq-net", "dep:hex", "dep:n0-future"]
# The relay: the copying and admitting half, which runs on the device that
# serves a plane.
relay = ["plane", "dep:bytes", "dep:tokio", "dep:serde_json"]
# The carrier over a direct iroh connection, the one every device dials, a
# page included: the client half only (`plane`), so it builds for the browser.
# The listening half a device that serves a plane runs is `relay`'s.
iroh = ["plane", "dep:iroh", "dep:bytes", "dep:serde_json"]

[dependencies]
# The scope of a track is a channel of an app's record.
collab-types = { version = "0.1.0", path = "../collab-types" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
thiserror.workspace = true
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# A frame names its stream in a lane's handshake; a carrier's handshake is
# serde too.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
moq-net = { workspace = true, optional = true }
# Plain future polling: the client carrier runs in a page as it does natively.
n0-future = { version = "0.3", optional = true }
hex = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
# A track is sealed and opened under the scope's channel keys, as a call's
# frames are: the sealing is this crate's, and the keys are the channel's.
channel-crypto = { version = "0.1.0", path = "../channel-crypto" }
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tilo-test-env = { path = "../../dev/test-env" }
tempfile.workspace = true

[[test]]
name = "live_native"
required-features = ["relay", "iroh"]

[[test]]
name = "live_plane"
required-features = ["relay", "iroh"]

[lints]
workspace = true
