[package]
name = "qos-peer-state"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[dependencies]
qos-agent-control-protocol = { path = "../../agent/control-protocol" }
flate2.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
uuid.workspace = true
hex.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
web-time = { version = "1", features = ["serde"] }
collab-types = { path = "../collab-types" }
# The shared neighbour wire vocabulary (`NeighbourMsg`, colorimetry, HDR metadata).
neighbour-wire = { path = "../neighbour-wire" }
tilo-user-identity = { path = "../tilo-user-identity" }

[dev-dependencies]
# The sanctioned patch-log-free way to take changes into an AutoCommit (clippy.toml).
tilo-automerge.workspace = true

[lints]
workspace = true
