[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "threshold-identity"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "threshold_identity"
path = "src/lib.rs"

# FROST-based threshold-shared Ed25519 identity for qOS.
#
# Phase 8 of the `2026-06-29-spaces-channels-and-cryptographic-roles.md`
# spec: a single Ed25519 keypair representing a human, whose secret half
# is split across the user's devices via FROST-Ed25519. Threshold-produced
# signatures are byte-compatible with standard Ed25519 verification so
# `qos-collab-types::verify_event` does not need to know about
# threshold-ness.
#
[dependencies]
# Sibling crate — interop target for verify_event compatibility.
collab-types = { path = "../collab-types" }

# FROST-Ed25519 (RFC 9591 ciphersuite). The `serialization` feature
# brings in `Signature::serialize`/`deserialize`, `VerifyingKey::serialize`,
# `KeyPackage::serialize`/`deserialize`, etc. — needed for both the
# wire types (round-1 / round-2 messages traveling over Iroh) and
# the recovery-share encoder. `serialization` implies `serde`.
frost-ed25519 = { version = "3", features = ["serialization"] }

# RNG primitives. `rand` 0.8 because frost-ed25519 3.0 still consumes
# `rand_core` 0.6. `rand_chacha` provides a deterministic ChaCha RNG
# used in the tests' fixed-seed setup.
rand.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true

# Standard wire-serialisation stack (mirrors qos-collab-types).
serde.workspace = true
serde_bytes.workspace = true

# Error plumbing.
thiserror.workspace = true

# BIP39 mnemonic encoder/decoder for the paper recovery share. Default
# wordlist is English (2048 words, 11 bits/word; 24 words → 256 bits
# of entropy + 8-bit checksum). Fixed at 2.x to avoid breaking changes.
bip39.workspace = true

# SHA-512 for the pairing-transcript hash (matches the hash
# function used in FROST(Ed25519, SHA-512), which is already a
# transitive dep via frost-ed25519).
sha2.workspace = true

# `ed25519-dalek` holds the single-device (1-of-1) key. A frost
# `SigningKey` stores a signing scalar, not the seed `ed25519-dalek`
# expands via SHA-512 to reach that scalar — and every reader of the
# on-disk identity record loads its 32 secret bytes through
# `SigningKey::from_bytes`, i.e. as a seed. Storing the dalek key means
# the bytes this crate exports for persistence are the bytes that
# reconstruct the same key, so a persisted identity can sign for its
# own recorded public key. Threshold mode (t ≥ 2) stays entirely
# inside frost.
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }

[dev-dependencies]
# Same dep that qos-collab-types uses for ArtifactId / ChannelId /
# SpaceId UUIDs; we mint a few in the SignedOp interop test.
uuid.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
