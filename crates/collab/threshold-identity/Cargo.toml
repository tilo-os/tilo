[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "threshold-identity"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FROST threshold-shared Ed25519 identity for Tilo."

[lib]
name = "threshold_identity"
path = "src/lib.rs"

# FROST-based threshold-shared Ed25519 identity for Tilo.
#
# A single Ed25519 keypair represents a human while its secret half
# is split across the user's devices via FROST-Ed25519. Threshold-produced
# signatures are byte-compatible with standard Ed25519 verification so
# `tilo-collab-types::verify_event` does not need to know about
# threshold-ness.
#
[dependencies]
# Sibling crate — interop target for verify_event compatibility.
collab-types = { version = "0.1.0", path = "../collab-types" }

# FROST-Ed25519 (RFC 9591 ciphersuite). The `serialization` feature
# brings in `Signature::serialize`/`deserialize`, `VerifyingKey::serialize`,
# `KeyPackage::serialize`/`deserialize`, etc. — needed for both the
# wire types (round-1 / round-2 messages traveling over Iroh) and
# the recovery-share encoder. `serialization` implies `serde`.
frost-ed25519 = { version = "3", features = ["serialization"] }

# RNG traits for the public API (rand_core 0.10, shared with
# ed25519-dalek). frost-ed25519 3.0 still consumes rand_core 0.6; it is
# reached only through frost's own re-export (see `src/rng.rs`).
# `rand_chacha` seeds the never-observed placeholder key packages.
rand_chacha.workspace = true
rand_core.workspace = true

# Standard wire-serialisation stack (mirrors tilo-collab-types).
serde.workspace = true
serde_bytes.workspace = true

# Error plumbing.
thiserror.workspace = true

# The paper recovery share's BIP39 checksum (`src/bip39.rs`: the English
# wordlist, 11 bits a word; 24 words carry 256 bits of entropy and an 8-bit
# checksum).
sha2.workspace = true

# `ed25519-dalek` holds the single-device (1-of-1) key. A frost
# `SigningKey` stores a signing scalar, not the seed `ed25519-dalek`
# expands via SHA-512 to reach that scalar — and every reader of the
# on-disk identity record loads its 32 secret bytes through
# `SigningKey::from_bytes`, i.e. as a seed. Storing the dalek key means
# the bytes this crate exports for persistence are the bytes that
# reconstruct the same key, so a persisted identity can sign for its
# own recorded public key. Threshold mode (t ≥ 2) stays entirely
# inside frost.
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
zeroize.workspace = true

[dev-dependencies]
# Same dep that tilo-collab-types uses for ArtifactId / ChannelId /
# SpaceId UUIDs; we mint a few in the SignedOp interop test.
uuid.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
