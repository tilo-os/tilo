[package]
name = "tilo-actions"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Tilo action model: resources, the actions on them, and their registry."

[lib]
name = "tilo_actions"
path = "src/lib.rs"

# Serializable, replayable CRDT mutations, the nested Resource tree apps
# publish, and dispatch that either executes locally (`ClientLocal`) or routes
# to a host (`ServerPreferred`). This is a pure state layer with no `ui`,
# `winit`, or rendering dependencies.

[dependencies]
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
hex.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
chrono = { workspace = true, features = ["std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
regex = "1"
uuid = { version = "1.23.1", features = ["v4", "serde", "js"] }
thiserror.workspace = true
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
