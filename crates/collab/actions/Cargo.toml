[package]
name = "tilo-actions"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The Tilo action model: resources, the actions on them, and their registry."

[lib]
name = "tilo_actions"
path = "src/lib.rs"

# Serializable, replayable CRDT mutations, the nested Resource tree apps
# publish, and dispatch that either executes locally (`ClientLocal`) or routes
# to a host (`ServerPreferred`). This is a pure state layer with no `ui`,
# `winit`, or rendering dependencies.

[features]
# `remote::TestHost`, a closure-built action host for other crates' tests.
test-support = []

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# What a skill's selector reads over a published resource.
tilo-selector = { version = "0.1.0", path = "../../platform/tilo-selector" }
# What a type's noun is called in a sentence, shared with the compiler that writes an app's
# catalogue.
tilo-words = { version = "0.1.0", path = "../../text/tilo-words" }
hex.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
chrono = { workspace = true, features = ["std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# JSON Schema patterns are ECMA-262, whose `\d`, `\w` and `\b` are ASCII as
# here; the full `regex` engine would sit in the browser start module.
regex-lite.workspace = true
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
thiserror.workspace = true
blake3.workspace = true
# Appearance names are compared and stored NFC-normalized.
unicode-normalization = "0.1.25"
# An avatar is checked by its sniffed image type.
tilo-content-types = { version = "0.1.0", path = "../../system/content-types" }
# The window whose code records an action keeps its large parts in that
# window's content store.
tilo-wake = { version = "0.1.0", path = "../../platform/tilo-wake" }
# The large parts of a recorded action are kept, sealed, as content.
tilo-content = { version = "0.1.0", path = "../../system/content", default-features = false }
tracing.workspace = true

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

# A browser page draws invocation ids from `crypto.getRandomValues`; a
# `tilo_no_js` build has no page and takes getrandom's configured backend.
[target.'cfg(all(target_family = "wasm", target_os = "unknown", not(tilo_no_js)))'.dependencies]
uuid = { version = "1.23.1", features = ["js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown", tilo_no_js))'.dependencies]
uuid = { version = "1.23.1", features = ["rng-getrandom"] }
