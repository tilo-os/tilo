[package]
name = "tilo-call-lane"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "A call's media lane between two devices: the frames one device sends, how they are sealed under the channel's content keys, who may send them, the connections they travel on, and the bridge that carries a page into the call."

[features]
default = ["lanes"]
# The native lanes: connections on an endpoint, the pictures they carry, and
# the bridge. A page takes this crate without them, for the frames alone.
lanes = ["dep:iroh", "dep:media", "dep:bytes", "dep:tilo-lock", "dep:tracing", "dep:tokio"]

[lib]
name = "tilo_call_lane"
path = "src/lib.rs"

[dependencies]
# The channel's per-epoch content keys, and the per-stream keys derived from
# them; key material never leaves that crate.
channel-crypto = { version = "0.1.0", path = "../channel-crypto" }
# A call is a channel of an app's record, named by its id.
collab-types = { version = "0.1.0", path = "../collab-types" }
# The counter-nonce AEAD the frames are sealed with.
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
# The real-time H.264 encoder a camera or screen picture is encoded with, and
# the camera capture it comes from.
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime"], optional = true }
# A lane is a connection on the session's endpoint.
iroh = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# The handshake both devices say each other's call on.
serde.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
tokio = { workspace = true, features = ["sync"], optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock", optional = true }
# What a picture layer was encoded with, and why one could not be.
tracing = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# The tests build real MLS groups, as a channel's members do.
collab-types = { version = "0.1.0", path = "../collab-types" }
# The tone is real Opus, as a call's microphone sends it.
opus = "0.4"
# A receiver's playout is the call's own jitter buffer.
media = { package = "tilo-media", path = "../../platform/tilo-media" }
tilo-test-env = { path = "../../dev/test-env" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
