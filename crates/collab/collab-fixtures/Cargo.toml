[package]
name = "collab-fixtures"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "collab_fixtures"
path = "src/lib.rs"

# Signed test fixtures for `collab-types`. Integration tests use the same
# canonicalisation and signing path as production to build valid
# `RoleAttestation` and `SignedOp` values.
#
# Depend on it from `[dev-dependencies]` only: nothing here belongs in a
# shipped binary.

[dependencies]
collab-types = { path = "../collab-types" }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
