[package]
name = "tilo-action-policy"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Who may invoke which action: grants over the published tree and the one function that decides them."

[lib]
name = "tilo_action_policy"
path = "src/lib.rs"

# Pure data and pure functions: every door, every host, the relay and the
# browser decide with this crate; tilo-clock's types accept the browser's
# wall clock as well as the native one.

[dependencies]
serde.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
