[package]
name = "tilo-enrollment"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The one enrollment: the messages a machine and a device of its person exchange, the answer that device gives, and how both travel over the internet."

[lib]
name = "tilo_enrollment"
path = "src/lib.rs"

[dependencies]
rand.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-server-client = { version = "0.1.0", path = "../../server/tilo-server-client" }
tilo-user-identity = { path = "../tilo-user-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
blake3.workspace = true
collab-types = { path = "../collab-types" }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
getrandom.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-base.workspace = true
libc.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6", default-features = false, features = ["all"] }
tilo-device-identity = { path = "../tilo-device-identity" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-identity = { path = "../../runtime/tilo-identity" }
tilo-identity-client = { path = "../../runtime/tilo-identity-client" }
tilo-server-protocol = { path = "../../server/tilo-server-protocol" }
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "io-util", "macros"] }
tracing.workspace = true
zeroize.workspace = true
workspace-hack = { version = "0.1" }
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
