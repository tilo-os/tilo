[package]
name = "tilo-automation"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shortcuts: typed pipelines over Tilo's action door."

[lib]
name = "tilo_automation"
path = "src/lib.rs"

# Shortcuts: typed pipelines of actions, checked against the descriptors the
# action door publishes and run through `tilo_actions::remote::ActionHost`.
# Pure data and logic with no I/O, no runtime and no UI dependency.

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
collab-types = { version = "0.1.0", path = "../collab-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
