[package]
name = "tilo-automation"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Shortcuts: typed pipelines over Tilo's action door."

[lib]
name = "tilo_automation"
path = "src/lib.rs"

# Shortcuts: typed pipelines of actions, checked against the descriptors the
# action door publishes and run through `tilo_actions::remote::ActionHost`.
# Pure data and logic with no I/O, no runtime and no UI dependency.

[dependencies]
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-actions = { version = "0.1.0", path = "../actions" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
# How a Shortcuts draft stores a step's bindings, condition and transform and
# a shortcut's triggers (`model`): as values of the resource layer.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource", optional = true }

[features]
model = ["dep:tilo-resource"]

[lints]
workspace = true
