[package]
name = "tilo-unlock-protocol"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Wire protocol for unlocking an encrypted Tilo disk with a sibling device's consent."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_unlock_protocol"
path = "src/lib.rs"

# Pure types and pure functions: no I/O, no async runtime, no transport. The
# early-boot client and the sibling service both depend on this crate.
[dependencies]
serde.workspace = true
serde_bytes.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# Domain-separated digests of every signed or bound value.
blake3.workspace = true
# Boot keys and the person's root sign with Ed25519.
ed25519-dalek.workspace = true
# HPKE sealing of the sibling half, through the one reviewed sealing crate.
tilo-seal = { version = "0.1.0", path = "../../system/tilo-seal" }
# TPM2 quotes are ECDSA P-256 signatures by the device's attestation key.
p256 = { version = "0.14", features = ["ecdsa"] }
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
