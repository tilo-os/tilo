[package]
name = "frame-link"
version = "0.1.0"
edition = "2024"
description = "Configurable-latency / throughput / drop shim for encoded-frame streams. The reusable primitive behind flatpak-share-demo (encode → shim → decode → side-by-side MP4) and any future test that wants to feed a real encoder/decoder pair through a synthetic-network layer."

[lib]
name = "frame_link"
path = "src/lib.rs"

[[bin]]
name = "flatpak-share-demo"
path = "src/bin/flatpak-share-demo.rs"

[dependencies]
# The library is deliberately dependency-light: stdlib + tracing spans so
# callers that only want the shim don't pay for encode/decode/font
# machinery. The demo binary sits in the same crate but pulls in the real
# shell types (encoder/decoder/SharedFlatpakSession) + a font rasteriser
# so the "wired against production types" contract holds.
tracing.workspace = true

# Demo-only dependencies. Kept in `[dependencies]` (not gated behind a
# feature) because the whole crate lives in the qOS workspace: `shell` is
# built anyway, and cargo dedupes so there's no marginal cost. Downstream
# consumers of the library who don't want the demo can depend on this
# crate with `default-features = false` — but the practical case is that
# nothing outside this workspace will pull it.
shell = { path = "../../../shell", default-features = false }
ab_glyph = "0.2"
tracing-subscriber = { workspace = true, features = ["registry", "fmt", "env-filter"] }

[dev-dependencies]
proptest.workspace = true
