[package]
name = "tilo-action-broker"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
[features]
test-support = ["dep:tilo-test-env"]
[dependencies]
# Certified native test fixtures retain real host signing custody and private journals.
tilo-test-env = { path = "../../dev/test-env", optional = true }
zeroize.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../action-policy" }
# Kernel-authenticated custody of the executing native service peer.
runtime-portal = { path = "../../runtime/runtime-portal" }
tilo-paths.workspace = true
tilo-advisory-lock = { path = "../../system/advisory-lock" }
# Saves the launchable action catalogue across restarts.
tilo-files = { path = "../../platform/tilo-files", features = ["json"] }
wire-frame = { path = "../../system/wire-frame", features = ["tokio"] }
launcher = { path = "../../packaging/launcher" }
# The actions an installed app's signed manifest offers while it is closed.
tilo-app-package = { path = "../../packaging/tilo-app-package" }
parking_lot.workspace = true
automerge.workspace = true
runtime-identity = { package = "tilo-identity-client", path = "../../runtime/tilo-identity-client" }
registry-types = { path = "../../packaging/registry-types" }
# The host's pinned registry configuration, never an app-supplied trust anchor.
app-cli = { path = "../../packaging/app-cli" }
tilo-net = { path = "../../platform/tilo-net", features = ["blocking"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
# The broker thread is a panic boundary the session restarts.
tilo-rt.workspace = true
futures = { workspace = true, default-features = true }
ed25519-dalek.workspace = true
hex.workspace = true
blake3.workspace = true
# Content addresses: how they are derived and what shape they have.
tilo-content = { path = "../../system/content", default-features = false }
libc.workspace = true

runtime-collab = { path = "../../runtime/runtime-collab", features = ["settings-host"] }
tilo-desktop-model = { path = "../../session/desktop-model" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { path = "../collab-types" }
channel-crypto = { path = "../channel-crypto" }
# The channel service's governance messages and wall clock.
neighbour-wire = { path = "../neighbour-wire" }
tilo-clock = { path = "../../platform/tilo-clock" }
# The identity service hands apps their route keys from the channel service.
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
tilo-actions = { path = "../actions" }
# The broker's half every host runs: the step seam, the route, the receipts.
tilo-broker-core = { path = "../broker-core" }
# The channel engine every host runs: this broker enforces its channels' plaintext gates.
tilo-channels = { path = "../channels" }
# Shortcuts: checking, running and describing them at the action door.
tilo-automation = { path = "../automation" }
# The device keymap a shortcut's keyboard trigger is checked against.
settings-store = { path = "../../system/settings-store" }
tilo-peer-state = { path = "../tilo-peer-state" }
tilo-user-identity = { path = "../tilo-user-identity" }
iroh.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }
[dev-dependencies]
# The channel engine's tests read what its gates refuse through this broker.
tilo-channels = { path = "../channels", features = ["test-support"] }
runtime-identity-host = { package = "runtime-identity", path = "../../runtime/runtime-identity" }
# The disclosure regression reaches the real verifier and durable registry store over HTTPS.
registry-server = { path = "../../packaging/registry-server" }
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Paused time: the process-binding tests prove no clock decides a launch.
tokio = { workspace = true, features = ["test-util"] }
tilo-peer-state = { path = "../tilo-peer-state", features = ["test-support"] }
iroh.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
# A test holds its own thread's wall time; other tests keep the real one.
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }
word-processor = { path = "../../../apps/word-processor" }
tilo-resource = { path = "../../sdk/tilo-resource" }
settings = { path = "../../../apps/settings" }
store = { path = "../../../apps/store" }
app-framework = { package = "tilo-app", path = "../../sdk/tilo-app" }
ed25519-dalek.workspace = true
tilo-automerge.workspace = true
tilo-automerge-isolate.workspace = true
[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
