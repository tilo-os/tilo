[package]
name = "qos-reference"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "qos_reference"
path = "src/lib.rs"

# Pure state layer — no `ui`, `winit` or render deps — so the toolkit, any app
# and an out-of-process participant can all build on it.

[dependencies]
qos-actions = { path = "../actions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# A direct room's id is derived from its pair of members rather than negotiated;
# `blake3` is the digest and `uuid` renders it in the shape room ids are parsed
# as everywhere else.
uuid = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
