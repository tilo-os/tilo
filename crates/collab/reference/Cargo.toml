[package]
name = "qos-reference"
version = "0.1.0"
edition = "2024"

[lib]
name = "qos_reference"
path = "src/lib.rs"

# Saying something ABOUT a thing: a durable, machine-readable reference to one
# resource, plus the remark that carries it and the destination it is delivered
# to. Pure state layer — no `ui`, no `winit`, no render deps — so the toolkit,
# any app, and an out-of-process agent can all build on it. See `src/lib.rs`.

[dependencies]
qos-actions = { path = "../actions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# A direct room's identity is derived from the pair of people in it, so both
# ends compute it without negotiating (see `src/direct.rs`). `uuid` renders that
# derivation in the one shape every room id in the stack is parsed as; `blake3`
# is the digest — both are already resolved in the workspace lock.
uuid = { workspace = true }
blake3 = { workspace = true }
