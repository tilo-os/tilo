[package]
name = "tilo-channels"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "This device's side of every encrypted collaboration channel: its groups, the governance that settles them against the access policy, and the keys an endpoint of the device reads a sealed record with."

[features]
# Fixtures a host's channel tests drive: an in-memory workspace transport and a fixed policy.
test-support = []

[dependencies]
channel-crypto = { version = "0.1.0", path = "../channel-crypto" }
collab-types = { version = "0.1.0", path = "../collab-types" }
# The channel governance messages and the workspace transport's message shape.
neighbour-wire = { version = "0.1.0", path = "../neighbour-wire" }
tilo-desktop-model = { version = "0.1.0", path = "../../session/desktop-model" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
# The identity wire a route's keys are answered on, and the policy announcements a group's re-check
# waits on.
tilo-identity-host = { version = "0.1.0", path = "../../runtime/tilo-identity-host" }
runtime-identity = { package = "tilo-identity-client", version = "0.1.0", path = "../../runtime/tilo-identity-client" }
ed25519-dalek.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
# Crash-safe, owner-only state replacement on a host's own store.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
pollster.workspace = true
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
