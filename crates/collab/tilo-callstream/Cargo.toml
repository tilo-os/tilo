[package]
name = "tilo-callstream"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo reusable video-streaming stack: encode/decode through the shared media stack, per-subscriber frame transport substrate, and the throttled screen/camera share composition shared by the compositor's collab surface streaming and the chat call app."

[lib]
name = "tilo_callstream"
path = "src/lib.rs"

[dependencies]
# Encode and decode through the shared GStreamer media stack, which picks
# hardware first, then royalty-free software, then Cisco's openh264 binary.
media = { package = "tilo-media", path = "../../platform/tilo-media", features = ["realtime"] }
thiserror.workspace = true
tracing = "0.1"
workspace-hack = { version = "0.1" }

[lints]
workspace = true
