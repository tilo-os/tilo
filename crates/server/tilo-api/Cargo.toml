[package]
name = "tilo-api"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The Tilo API server: OAuth 2.1 for agents, sign-in with a device of the person, scope consent, revocable grants and API keys, and the agent surface served for each session over the grant's own session with the server."
license = "MIT OR Apache-2.0"

[features]
# A test hands the API the receivers it starts on its own machine, to stand in for the public
# internet where a webhook is posted. A test target turns it on; no program of a site holds it.
test-support = []

[dependencies]
# The client's errors, as the programs that call it report them.
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
schemars = { version = "1.2", features = ["derive"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ed25519-dalek.workspace = true
iroh.workspace = true
# The relays the grant's endpoint dials the person's devices through.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
# Which host serves a call: the same ranking the workspace's devices use.
neighbour-wire = { path = "../../collab/neighbour-wire" }
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
tilo-session-client = { path = "../../session/client" }
# The worker that decides a workspace's governance: the sessions here admit it.
tilo-automerge-isolate.workspace = true
tilo-session-actions = { path = "../../session/session-actions" }
tilo-server-protocol = { path = "../tilo-server-protocol" }
# HTTPS to the server and the site, as every client of the server makes its requests.
tilo-server-client = { path = "../tilo-server-client" }
tilo-server-session = { path = "../tilo-server-session" }
tilo-mcp = { path = "../../runtime/tilo-mcp" }
# A workspace one of the person's devices keeps is asked of that device over its action
# service (`actions::RemoteDevice`), signed by the key.
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# A content put's address is the BLAKE3 hash of the file's bytes.
blake3.workspace = true
# This computer's login (`client::device`): where it is kept, with this computer's one device
# key and its certificates.
tilo-paths.workspace = true
tilo-device-identity = { path = "../../collab/tilo-device-identity" }
tilo-identity = { path = "../../runtime/tilo-identity" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
# The lock that keeps one daemon per device, which a command reads to see whether one is there.
tilo-advisory-lock = { path = "../../system/advisory-lock" }
# A workspace's name as a folder name, composed as macOS and Linux read it back.
unicode-normalization = "0.1.25"
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# A call this computer's login answers names itself while it runs, so a process that
# stops answering says which call held it (`tilo_rt::stall`).
tilo-rt = { path = "../../platform/tilo-rt" }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tilo-mcp = { path = "../../runtime/tilo-mcp", features = ["test-support"] }
tilo-enrollment = { path = "../../collab/tilo-enrollment" }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
