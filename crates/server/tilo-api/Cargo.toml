[package]
name = "tilo-api"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The Tilo API server: OAuth 2.1 for agents, sign-in with a device of the person, scope consent, revocable grants and API keys, and the agent surface served for each session over the grant's own session with the server."
license = "MIT OR Apache-2.0"

[dependencies]
# The client's errors, as the programs that call it report them.
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
schemars = { version = "1.2", features = ["derive"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ed25519-dalek.workspace = true
iroh-base.workspace = true
iroh.workspace = true
# The relays the grant's endpoint dials the person's devices through.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
# Which host serves a call: the same ranking the workspace's devices use.
neighbour-wire = { path = "../../collab/neighbour-wire" }
collab-types = { path = "../../collab/collab-types" }
tilo-actions = { path = "../../collab/actions" }
tilo-session-client = { path = "../../session/client" }
tilo-session-actions = { path = "../../session/session-actions" }
tilo-server-protocol = { path = "../tilo-server-protocol" }
# HTTPS to the server and the site, as every client of the server makes its requests.
tilo-server-client = { path = "../tilo-server-client" }
tilo-server-session = { path = "../tilo-server-session" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-mcp = { path = "../../runtime/tilo-mcp" }
tilo-device-mcp = { path = "../../runtime/device-mcp" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# This computer's login (`client::device`): where it is kept, its certificates as kept.
tilo-paths.workspace = true
postcard.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-files = { path = "../../platform/tilo-files" }
tilo-net = { path = "../../platform/tilo-net", features = ["http"] }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
# The link an invitation is handed over as: sealed onto the site's shelf.
tilo-workspace-directory = { path = "../../session/workspace-directory" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
