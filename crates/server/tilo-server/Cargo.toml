[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-server"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Tilo host + relay daemon: authenticated iroh transport for workspace CRDT ops, pins WorkspaceDirectory, store-and-forwards for offline peers."
license = "MIT OR Apache-2.0"

[lib]
name = "tilo_server"
path = "src/lib.rs"

[features]
# Test-only hooks and helpers: the checkpoint-prefix fault marker, the store's
# test barriers, and the replay and staging entry points the host's tests
# drive the store through.
test-support = ["tilo-workspace-service/test-support"]
# The workspaces' records and roster agents on the host (`--workspace-documents`):
# tilo-agent-session, which links every web app, as the app-serving protocol.
agents = ["web", "tilo-workspace-service/agents", "tilo-workspace-service/files", "dep:tilo-agent-session", "dep:tilo-session-client", "dep:tilo-secrets", "dep:collaboration", "dep:chat", "dep:ush", "dep:linux-vm", "dep:tilo-server-account", "dep:tilo-mcp", "dep:tilo-workspace-agent", "dep:tilo-sheets"]
web = ["tilo-workspace-service/device-keys", "dep:tilo-live", "dep:tilo-net", "dep:base64", "dep:hyper", "dep:hyper-util", "dep:http-body", "dep:http-body-util", "dep:tokio-rustls", "dep:rustls", "dep:rcgen", "dep:sha2", "dep:bytes", "dep:futures", "dep:hmac", "dep:ring"]

[[bin]]
name = "tilo-server"
path = "src/main.rs"

# The host / server daemon.
#
# `tilo-server` is the WAN transport + host tier of the sync/host model:
# an authenticated iroh endpoint that any of the user's devices dial
# to publish workspace-CRDT deltas + presence, receives, persists,
# and fans out to every other connected peer bound to the same
# workspace. If a target peer is offline the update is buffered on
# disk under `pending/<peer_id>/` and delivered on next connect.
#
# Design axioms:
# - Same identity model as devices — the server holds a device
#   keypair + a signed cert issued by the user's root. Every inbound
#   peer must present a valid cert chaining to the same user identity.
# - Mostly a store-and-forward peer, not a passive one. Device deltas are
#   received, retained and forwarded, but the host also originates, under
#   its own device key:
#   - governance commits for the workspaces it governs (`workspaces*`);
#   - its retained `IdentityHello` certificate frame (`compaction`);
#   - folded snapshots of unsealed document channels (`compaction`).
#   It reads the desktop's peer-sync messages inside co-edit bodies to
#   decide retention, replay and compaction: document frames, checkpoint
#   kinds and audiences through the injected `payloads::ShellPayloads`
#   (`tilo_workspace_service::payloads`); it refuses document
#   changes an app's surface does not allow (`surfaces`). Sealed document
#   content stays opaque.
# - Multi-host by construction — several relays bound to the same
#   workspace merge like any other automerge peers.
# - Fully in-process testable — `Server::start` binds a random-port
#   iroh endpoint so the integration tests spin up two relays + N
#   peers without any external service.
[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-paths.workspace = true
tilo-clock = { path = "../../platform/tilo-clock", features = ["local"] }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-automerge-isolate.workspace = true
# Remote-action vocabulary: the server routes these frames between devices and,
# only when an app action server is supplied, answers them through ActionProvider.
tilo-actions = { path = "../../collab/actions" }
# Handshake and wire messages plus the mesh, configuration, registry and
# metrics records shared with the server's clients; re-exported so the daemon's
# own module paths stay unchanged.
tilo-server-protocol = { path = "../tilo-server-protocol" }
# Both ends of every server stream use its frame codec.
tilo-server-client = { path = "../tilo-server-client" }
# The session clients (server, co-edit, anti-entropy, workspace administration and
# workspace join): the daemon dials other relays with them and re-exports them
# under its historic paths. Clients depend on that crate, not on this one.
tilo-server-session = { path = "../tilo-server-session" }
# Delivery, private-action, agent-read, v2 live and join records the server carries.
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
# Iroh 1.0.x — pinned to the same versions the `fs/` crate uses so
# they share a single build of the transport across the workspace.
# iroh gives us stable node ids + NAT hole punching + n0-hosted relay
# fallback out of the box, so the server is reachable from any device
# without extra infrastructure. `crates/system/fs/` already depends on iroh-blobs, so
# unifying on iroh here means one transport stack across CRDT-op fanout
# and content hydration.
iroh.workspace = true
iroh-base.workspace = true
# The packet relay this host runs for the pages it serves.
iroh-relay = { version = "1.0.3", features = ["server"] }

# Identity + workspace directory + cert-chain verification.
tilo-user-identity = { path = "../../collab/tilo-user-identity" }

# Workspace CRDT (same version as identity + shell).
automerge.workspace = true
tilo-automerge.workspace = true

# Wire encoding — postcard for the framed messages exchanged over
# the ALPN. Same encoding the identity crate uses so byte layouts
# stay compatible.
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
# Install bodies carry certificates' canonical encoding as base64.
base64 = { workspace = true, optional = true }

# Signing / hashing — reused for the connection-level nonce challenge.
getrandom.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
# Enrollment envelopes are sealed through the one reviewed sealing crate.
tilo-seal = { path = "../../system/tilo-seal" }
# Content addresses the workspace keeps bytes under.
tilo-content = { path = "../../system/content", default-features = false }
zeroize.workspace = true
blake3.workspace = true
hex.workspace = true
# A planned machine's disk rule and open choices are the installer's own
# model, so a plan the person's devices write is one the installer reads.
install-profile-model = { path = "../../session/install-profile-model" }
# A server's rollback floor moves by approvals the person's floor key signs.
tilo-rollback = { path = "../../system/tilo-rollback" }
# How this boot's system volume opened, as early boot noted it.
tilo-unlock-protocol = { path = "../../collab/tilo-unlock-protocol" }
tilo-crypto = { path = "../../system/tilo-crypto", default-features = false }
uuid.workspace = true

# Runtime + config.
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
thiserror.workspace = true

# Observability.
tracing.workspace = true

# Systemd sd_notify for `Type=notify` — best-effort, silently no-ops
# outside a systemd session.
sd-notify.workspace = true

# The browser listener (feature `web`): HTTPS for the durable protocol, device
# certification and the pages' calls.
hyper = { version = "1", features = ["client", "server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# The workspaces' live session: the relay that copies its sealed bytes
# (admission preface and moq-lite) for every device, a page included, which
# reaches it over iroh.
tilo-live = { path = "../../collab/tilo-live", features = ["relay", "iroh"], optional = true }
# SHA-256 of the development certificate, which a page pins.
sha2 = { workspace = true, optional = true }
# Web Push to a person's browsers (`web_push`): P-256 agreement and signing,
# HKDF and AES-GCM, from the crate TLS already builds.
ring = { version = "0.17", optional = true }
# The fetch proxy a page's apps reach the web through, and the mail the entry
# page sends over HTTPS.
tilo-net = { path = "../../platform/tilo-net", features = ["http", "json", "proxy-host"], optional = true }
# The entry's mail outbox awaits a send in its own future.
futures = { workspace = true, optional = true }
# The keyed hash of a visitor's address the entry's wait-list windows count.
hmac = { workspace = true, optional = true }
tilo-agent-session = { path = "../../agent/agent-session", optional = true }
# The workspaces' shells a host serving their records runs: ush's own
# commands here, Linux programs in the workspace's hosted VM.
ush = { path = "../../vm/ush", optional = true, features = ["quic"] }
linux-vm = { path = "../../vm/linux-vm", optional = true, default-features = false }
# What the host's account standing is read from: its plans file and the
# log of the Browser page actions this host ran for it.
tilo-server-account = { path = "../tilo-server-account", optional = true }
# Who may close, move or rename what is on a workspace's shared desktop, and the
# strips a persistent workspace's shared desktop starts with.
tilo-desktop-model = { path = "../../session/desktop-model" }
# A persistent public workspace keeps its owner and spectator roots in the host's
# secret store.
tilo-secrets = { path = "../../platform/tilo-secrets", optional = true }
# The shared question sheet's words and pictures: a page draws an agent's
# question in the same words a native session's sheet does.
tilo-sheets = { path = "../../session/sheets", optional = true }
# A persistent public workspace's chat opens with the operator's channels.
chat = { path = "../../../apps/chat", optional = true, default-features = false }
# The admin workspace's record of the person's servers, and its actions.
tilo-resource = { path = "../../sdk/tilo-resource" }
# Who the agents a workspace's host runs are (the workspace's record of its agents), and the
# tools an agent on a machine of the workspace acts through (the MCP server's agent surface).
tilo-workspace-agent = { path = "../../platform/tilo-workspace-agent", optional = true }
tilo-mcp = { path = "../../runtime/tilo-mcp", optional = true }
# The workspace's default resource identity, permissions and the collaboration wire's types.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", optional = true }
# Read existing signed document envelopes through the shared, read-only cipher.
tilo-session-client = { path = "../../session/client", optional = true }
tilo-app-id = { version = "0.1.0", path = "../../platform/tilo-app-id" }
tilo-device-identity = { version = "0.1.0", path = "../../collab/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The host keeps its workspaces' content in directories, one per workspace.
tilo-content = { path = "../../system/content", features = ["dir"] }
launcher = { path = "../../packaging/launcher" }
# Installed packages and their integrity records.
package-store = { path = "../../packaging/package-store", features = ["store"] }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
# App surfaces, fetched by hash from the registry's reviewed payload blobs.
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
libc.workspace = true
sd-notify.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# The daemon's bounded runtime.
tilo-rt.workspace = true
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { path = "../../platform/tilo-files" }
# Home-peer configuration is one signed filesystem bundle; the server imports
# its workspace tickets rather than asking the operator to duplicate ids.
tilo-fs = { path = "../../system/fs" }
# A workspace's files as the record that carries them: the server reads a
# governed workspace's tree to learn which content its files are made of.
fs-protocol = { path = "../../system/fs-protocol" }
# A file the folder mount wrote is a manifest of chunks: a link to it reads
# the manifest to stream its chunks in order.
fs-content = { path = "../../system/fs-content" }
# The checksum each member of a folder's zip carries.
crc32fast.workspace = true
# The scope of a workspace's document media, which an offloaded action's inputs
# and outputs are.
runtime-fs = { path = "../../runtime/runtime-fs" }
# The workspace-join exchange every governor answers, over this server's workspaces.
collab-types = { path = "../../collab/collab-types" }
# A node takes part in the encrypted channels of the workspaces it governs, through
# the one channel service every device runs.
key-group = { path = "../../collab/key-group" }
neighbour-wire = { path = "../../collab/neighbour-wire" }
tilo-workspace-keys = { path = "../../collab/workspace-keys" }
# The workspace host every device runs, which the server embeds. Every server build
# follows the sealed records of the workspaces it governs and opens them with
# the channels' keys it holds there, whether or not it serves pages.
tilo-workspace-service = { path = "../tilo-workspace-service", features = ["device-keys"] }
# Waiting for this machine to be reached through a relay before it says it is.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
# Retained-store primitives the workspace store keeps its retained data with.
# Owners pre-admit people by the SHA-256 of a token someone else hands them.
sha2.workspace = true
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wire-frame = { path = "../../platform/wire-frame", features = ["tokio"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# A host selling the workspaces' VMs, which keeps what each program it starts was given.
ush = { path = "../../vm/ush", features = ["quic", "test-host"] }
# The live session a workspace's session publishes on, as the hosted Browser
# tests open one to prove an environment whose session is on it is here.
tilo-live = { path = "../../collab/tilo-live", features = ["relay", "iroh"] }
# A folder's link streams a zip: the tests read it back as a file manager does.
zip.workspace = true
# The workspace host's fixtures: a certified test host and the devices around it.
# The tests author a workspace's record through the host's app action server
# (`author_workspace_record`), which the `agents` feature carries: asking for it here
# keeps them building on their own, rather than only when another crate in the
# same build turns it on.
tilo-workspace-service = { path = "../tilo-workspace-service", features = ["test-support", "agents", "session-pages"] }
install-plan = { path = "../../session/install-plan" }
tilo-desktop-model = { path = "../../session/desktop-model" }
tokio = { workspace = true, features = ["test-util"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
# Text a test lays out uses the pinned catalog, never the fonts the machine
# running it has installed.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", features = ["test-support"] }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# A Linux turn's takeover is proven past its claim's minute with the process's wall clock pinned.
tilo-clock = { path = "../../platform/tilo-clock", features = ["local", "test-support"] }
# The offloadable action the offload journey runs: a batch of thumbnails.
tilo-thumbnail = { path = "../../media/thumbnail" }
# The app that publishes it, whose handler is its local run, and the content
# store that handler keeps its outputs in.
photos = { path = "../../../apps/photos" }
tilo-content = { path = "../../system/content" }
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tilo-runtime = { path = "../../runtime/tilo-runtime" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# The persistent workspace test's page fetches over the workspace's plain listener.
hyper = { version = "1", features = ["client", "http1"] }
# The fetch proxy test's target.
test-http = { path = "../../../tools/test-http" }
# Nearby pairing redeems enrollment tokens through the identity host's one
# redemption, and the machine tests mint their tokens with the identity crate.
tilo-enrollment = { path = "../../collab/tilo-enrollment" }
tilo-identity = { path = "../../runtime/tilo-identity" }
# The packet relay on this machine's loopback these tests run their hosts and devices on, and
# the keys no two runs share: no test reaches a relay or directory out on the internet.
test-server = { path = "../../../tools/test-server" }

[[test]]
name = "it"
path = "tests/it.rs"

# Its own binary: it installs a counting global allocator.
[[test]]
name = "held_memory"
path = "tests/held_memory.rs"

# Examples that carry unit tests build as test targets too, so `cargo test`
# and the CI test jobs run those tests.
# What an active member costs a server in CPU, memory and egress:
# the scheduled job's `hosting` group (tools/ci/perf-scheduled.sh).
# An example, not a binary, so server images that build `--bins` leave it out.
[[example]]
name = "server_load"
test = true

# A one-off: moves a host's content into one store per workspace at the
# upgrade that gave each workspace its own.
[[example]]
name = "move_server_content"
required-features = ["web"]
test = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }
