[package]
name = "tilo-workspace-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The workspace service every Tilo device runs and the server embeds: workspace governance, the member session stack, the retained store beneath it, and on a device the apps it serves."
license = "MIT OR Apache-2.0"

[lib]
name = "tilo_workspace_service"
path = "src/lib.rs"

[features]
# The fixtures the service's tests and its embedders' tests build on: a
# certified test service and the devices around it, plus the store's test hooks.
test-support = ["tilo-server-store/test-support", "dep:tilo-test-env"]
# Agents on the host: workspaces keep apps' confined replicas and hand their
# records' channel keys to pages.
agents = ["web", "dep:tilo-agent-session", "dep:tilo-secrets", "dep:collaboration", "dep:chat", "dep:calendar", "dep:tilo-model-gateway"]
# Pages reach the host: it follows the records its members write sealed and
# opens them with the channels' keys it holds as a key holder.
web = []

# A device serves its apps: their wire, launch, actions, invocation journal and consent.
apps = ["dep:app-cli", "dep:futures", "dep:launcher", "dep:parking_lot", "dep:registry-types", "dep:reqwest", "dep:runtime-collab", "dep:runtime-identity", "dep:runtime-portal", "dep:rustix", "dep:tilo-advisory-lock", "dep:tilo-app-package", "dep:tilo-broker-core", "dep:tilo-identity", "dep:tilo-paths", "dep:tilo-rt", "dep:tilo-workspace-keys", "dep:collaboration", "dep:wire-frame", "dep:zeroize", "postcard/alloc", "tilo-files/json"]

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../../collab/action-policy" }
tilo-clock = { path = "../../platform/tilo-clock" }
web-time = { version = "1", features = ["serde"] }
tilo-peer-state = { path = "../../collab/tilo-peer-state" }
tilo-automerge-isolate.workspace = true
tilo-actions = { path = "../../collab/actions" }
tilo-server-protocol = { path = "../tilo-server-protocol" }
tilo-server-client = { path = "../tilo-server-client" }
tilo-server-session = { path = "../tilo-server-session" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
iroh.workspace = true
iroh-base.workspace = true
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
getrandom.workspace = true
tilo-content = { path = "../../system/content", default-features = false }
# The address this host answers at once its endpoint reached a relay, which is
# what its workspaces' governance names of it.
tilo-endpoint-reachability = { path = "../../system/endpoint-reachability" }
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["full"] }
n0-future = "0.3.2"
thiserror.workspace = true
tracing.workspace = true
tilo-desktop-model = { path = "../../session/desktop-model" }
# The toolkit-free Fluent catalogue the name it gives a workspace is read from.
tilo-history = { path = "../../sdk/tilo-history" }
libc.workspace = true
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
collab-types = { path = "../../collab/collab-types" }
key-group = { path = "../../collab/key-group" }
neighbour-wire = { path = "../../collab/neighbour-wire" }
tilo-server-store = { path = "../tilo-server-store" }
sha2.workspace = true
tilo-agent-session = { path = "../../agent/agent-session", optional = true }
# A person's own provider, asked through the gateway's transport with the key
# their vault keeps: the wires, the stream reading and the price table are its.
tilo-model-gateway = { path = "../../agent/model-gateway", default-features = false, features = ["host-backend"], optional = true }
tilo-secrets = { path = "../../platform/tilo-secrets", optional = true }
chat = { path = "../../../apps/chat", optional = true, default-features = false }
# A person's calendars on their host are read, expanded and filed by the
# Calendar app's own code, so a device and its host agree about time.
calendar = { path = "../../../apps/calendar", optional = true, default-features = false }
tilo-automation = { path = "../../collab/automation" }
# Resource identity, permissions and invocation leases: the model below the toolkit.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", optional = true }
tilo-app-id = { version = "0.1.0", path = "../../platform/tilo-app-id" }

# The apps a device serves ([features] apps).
zeroize = { workspace = true, optional = true }
runtime-portal = { path = "../../runtime/runtime-portal", optional = true }
tilo-paths = { workspace = true, optional = true }
tilo-advisory-lock = { path = "../../system/advisory-lock", optional = true }
wire-frame = { path = "../../system/wire-frame", features = ["tokio"], optional = true }
launcher = { path = "../../packaging/launcher", optional = true }
tilo-app-package = { path = "../../packaging/tilo-app-package", optional = true }
parking_lot = { workspace = true, optional = true }
runtime-identity = { package = "tilo-identity-client", path = "../../runtime/tilo-identity-client", optional = true }
registry-types = { path = "../../packaging/registry-types", optional = true }
app-cli = { path = "../../packaging/app-cli", optional = true }
reqwest = { workspace = true, features = ["blocking", "json"], optional = true }
tilo-rt = { workspace = true, optional = true }
futures = { workspace = true, default-features = true, optional = true }
runtime-collab = { path = "../../runtime/runtime-collab", features = ["settings-host"], optional = true }
tilo-identity = { path = "../../runtime/tilo-identity", optional = true }
tilo-broker-core = { path = "../../collab/broker-core", optional = true }
tilo-workspace-keys = { path = "../../collab/workspace-keys", optional = true }
tilo-test-env = { path = "../../dev/test-env", optional = true }
tilo-device-identity = { version = "0.1.0", path = "../../collab/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# A host's workspaces keep their content in directories.
tilo-content = { path = "../../system/content", features = ["dir"] }
# The person's own accounts and model providers, kept beside their
# workspace: the shared account store and vault, the settings document the
# model configuration lives in, and the sign-in probes that reach a server a
# page cannot.
accounts = { path = "../../system/accounts" }
agent-provider-config = { path = "../../agent/provider-config" }
settings-store = { path = "../../system/settings-store" }
tilo-account-probe = { path = "../../platform/account-probe" }
# The calendar servers of the accounts a person keeps here.
tilo-dav = { path = "../../system/tilo-dav" }
tilo-mail-session = { path = "../../platform/mail-session" }
# The one request a person's model providers make from here: a provider's own
# list of models, asked with the key the vault keeps, through the client the
# fetch proxy guards its own requests with.
tilo-net = { path = "../../platform/tilo-net", features = ["http", "proxy-host", "blocking"] }
# What the agents on this server learned about a person: the type the list
# is kept as, and the verbs that change it.
tilo-resource = { path = "../../sdk/tilo-resource" }
tilo-workspace-agent = { path = "../../platform/tilo-workspace-agent" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
# A dispatcher that answers as an app's own host: what a device's action service asks
# through, and what a workspace's host answers beside it.
tilo-actions = { path = "../../collab/actions", features = ["test-support"] }
# A direct link a test makes a reader fall behind, with the frames it hears
# bounded by the test rather than by what a live link holds.
tilo-peer-state = { path = "../../collab/tilo-peer-state", features = ["test-support"] }
# The store's continuity tests count each thread's heap.
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# The provider servers a person's key is shown to and their model is asked at
# in tests, on loopback, each speaking its provider's wire.
test-http = { path = "../../dev/test-http" }
# `iroh-relay`: the loopback relay a fixture host's endpoint takes as its home, so a
# host opens without waiting out the probe of an endpoint that reaches none.
tilo-test-env = { path = "../../dev/test-env", features = ["iroh-relay"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-server-store = { path = "../tilo-server-store", features = ["test-support"] }
chat = { path = "../../../apps/chat", default-features = false, features = ["samples"] }
ui = { package = "tilo-ui", path = "../../sdk/ui-core" }

# The apps the device serves, tested against.
tilo-workspace-keys = { path = "../../collab/workspace-keys", features = ["test-support"] }
runtime-identity-host = { package = "runtime-identity", path = "../../runtime/runtime-identity" }
registry-server = { path = "../../packaging/registry-server" }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }
word-processor = { path = "../../../apps/word-processor" }
tilo-resource = { path = "../../sdk/tilo-resource" }
settings = { path = "../../../apps/settings" }
store = { path = "../../../apps/store" }
app-framework = { package = "tilo-app", path = "../../sdk/tilo-app" }

# The person's own store carried to their other devices: the links and the
# broker route that hands their apps the records are the device build's
# (`apps`), so this test is compiled only when a device serves apps.
[[test]]
name = "personal_links"
path = "tests/personal_links.rs"
required-features = ["apps"]

[lints]
workspace = true
