[package]
name = "tilo-pdf"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo's PDF engine API: rendering, text layer, selection, search, forms, annotations and export, parsed in a sandboxed helper process"

[lib]
name = "tilo_pdf"
path = "src/lib.rs"

[[bin]]
name = "tilo-pdf-helper"
path = "src/bin/tilo-pdf-helper.rs"

[features]
default = []
# `Engine::open_blob`: open a document from qdoc's content-addressed store.
blobstore = ["dep:qdoc"]
# Only for `examples/gen_fixtures.rs`, which typesets the test fixtures.
fixture-gen = ["dep:typst", "dep:typst-pdf", "dep:typst-layout", "dep:typst-assets"]

[dependencies]
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
thiserror.workspace = true
blake3.workspace = true
libc.workspace = true
memmap2 = "0.9.10"
unicode-normalization = "0.1.25"
unicode-bidi = "0.3.18"
# The workspace's postcard framing and SCM_RIGHTS transport, shared with the
# other Tilo services rather than re-implemented here.
wire-frame = { path = "../../system/wire-frame", features = ["postcard"] }
runtime-portal = { path = "../../runtime/runtime-portal" }
# Landlock and seccomp for the helper process.
sandbox-core = { path = "../../system/sandbox-core" }
# The one engine behind the API, loaded dynamically (never bundled). Only the
# raw C API is used; the high-level wrapper's image support and global lock
# are not needed.
pdfium-render = { version = "0.8.37", default-features = false, features = ["pdfium_latest"] }
# Appearance text: shaping, subset embedding and object writing for the
# annotations pdfium cannot draw, and reading back its output to finish them
# — all inside the sandboxed helper.
harfrust = "0.5.2"
skrifa = "0.40.0"
subsetter = { version = "0.2.6", features = ["variable-fonts"] }
pdf-writer = "0.15.0"
hayro-syntax = { version = "0.7.2", default-features = false, features = ["std"] }
flate2.workspace = true
# Decodes images wrapped as pages — inside the sandboxed helper.
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
qdoc = { path = "../qdoc", optional = true }
typst = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-assets = { version = "0.15", features = ["fonts"], optional = true }

[[example]]
name = "gen_fixtures"
required-features = ["fixture-gen"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
