[package]
name = "format-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo format-provider router daemon. Hosts WASM Component Model providers via wasmtime and serves a Cap'n Proto RPC interface."

[package.metadata.cargo-machete]
# Invoked by build.rs to compile the Cap'n Proto schema.
ignored = ["capnpc"]

[dependencies]
format-provider-wit = { path = "../format-provider-wit" }

# Use Wasmtime's component model, compilation cache, epoch interruption, and
# resource limiter for per-call wallclock and memory caps.
wasmtime = { version = "46", default-features = false, features = [
    "cranelift",
    "component-model",
    "cache",
    "runtime",
    "std",
    "addr2line",
    "demangle",
    "parallel-compilation",
    "wat",
] }
wasmtime-wasi = { version = "46" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

# Cap'n Proto RPC for the on-disk router socket; keep capnp and capnp-rpc
# on the same release line.
capnp.workspace = true
capnp-rpc.workspace = true

serde.workspace = true
toml.workspace = true
xdg-paths = { path = "../../system/xdg-paths" }
notify = { workspace = true, default-features = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
capnpc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
wat = "1"

[lints]
workspace = true
