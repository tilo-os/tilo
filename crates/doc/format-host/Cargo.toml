[package]
name = "format-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo format-provider router daemon. Runs sandboxed WebAssembly providers under wasmi and serves a Cap'n Proto RPC interface."

[dependencies]
format-provider-abi = { path = "../format-provider-abi" }

# Interpreter for provider modules: fuel metering and a store limiter give
# deterministic per-call CPU and memory caps without a JIT.
wasmi = { version = "1.1", default-features = false, features = ["std"] }
# Host entropy for the providers' `tilo_fp.fill_random` import.
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util.workspace = true
futures = { workspace = true, default-features = true }

# Cap'n Proto RPC for the on-disk router socket; keep capnp and capnp-rpc
# on the same release line.
capnp.workspace = true
capnp-rpc.workspace = true

serde.workspace = true
toml.workspace = true
tilo-paths.workspace = true
notify.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
wat = "1"

[lints]
workspace = true
