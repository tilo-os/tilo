[package]
name = "qdoc-html"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Semantic HTML export/preview for qdoc DocSnapshot documents (qOS)"

[dependencies]
qdoc = { path = "../qdoc" }
# No base64 crate: data-URI encoding is hand-rolled in `base64.rs` (~30 LOC) so
# adding qdoc-html stays lockfile-stable, matching qdoc-pdf's "no new deps" stance.

[lints]
workspace = true
