[package]
name = "format-provider-abi"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Core-WebAssembly ABI shared by the Tilo format host and format-provider guests."

[features]
# Route `getrandom` 0.3 (pulled in by automerge and rand) to the host's
# `tilo_fp.fill_random` import. Guests enabling it must build with
# `--cfg getrandom_backend="custom"`.
entropy = ["dep:getrandom03"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3", optional = true }

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.1" }
