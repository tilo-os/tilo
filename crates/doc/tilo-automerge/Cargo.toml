[package]
name = "tilo-automerge"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Apply incoming Automerge changes to an AutoCommit without keeping patch events nothing reads."

[package.metadata.cargo-machete]
# The automerge resource-limit suites under vendor/automerge/tests are
# compiled into this crate's tests by path; machete does not follow them.
ignored = ["flate2", "serde_json"]

[lib]
name = "tilo_automerge"
path = "src/lib.rs"

[features]
# A per-thread counting allocator for tests that pin what a document holds.
heap-probe = []

[dependencies]
automerge.workspace = true

[dev-dependencies]
tilo-automerge = { path = ".", features = ["heap-probe"] }
# The automerge 0.12 bounded-admission suites (vendor/automerge/tests/resource_limits_*.rs)
# run from here, because the vendored crate is excluded from the workspace.
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true

[lints]
workspace = true
