[package]
name = "tilo-automerge"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Apply incoming Automerge changes without keeping patch events nothing reads, and read typed values out of a document."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_automerge"
path = "src/lib.rs"

[features]
# A per-thread counting allocator for tests that pin what a document holds.
heap-probe = []

[dependencies]
automerge.workspace = true

[dev-dependencies]
tilo-automerge = { path = ".", features = ["heap-probe"] }
# The unpatched release the fork is taken from: tests/map_apply.rs checks the
# fork applies changes exactly as it does.
upstream-automerge = { package = "automerge", version = "=0.12.0" }

[lints]
workspace = true
