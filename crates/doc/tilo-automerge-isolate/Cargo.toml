[package]
name = "tilo-automerge-isolate"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Decode and apply untrusted Automerge bytes in memory- and time-limited worker processes"

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
automerge.workspace = true
thiserror.workspace = true
tilo-automerge.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
tilo-sandbox-core = { path = "../../system/sandbox-core" }
seccompiler.workspace = true

[dev-dependencies]
flate2.workspace = true
hex.workspace = true
sha2.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
