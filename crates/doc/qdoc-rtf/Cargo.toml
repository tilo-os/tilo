[package]
name = "qdoc-rtf"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "RTF (Rich Text Format) export for qdoc DocSnapshot documents (qOS)"

[dependencies]
qdoc = { path = "../qdoc" }
# No new deps: RTF is a plain-text control-word format we emit by hand, matching
# qdoc-html/qdoc-pdf's "stay lockfile-stable" stance.

[lints]
workspace = true
