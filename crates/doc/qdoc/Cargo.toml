[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "qdoc"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "CRDT-native canonical document model and format-provider API for Tilo"

[dependencies]
automerge.workspace = true
# HTML import and export carry images as `data:…;base64,` URIs.
base64.workspace = true
blake3.workspace = true
# Zip-bomb and XXE defence for every office package codec.
bounded-zip = { path = "../bounded-zip" }
pulldown-cmark = { version = "0.12", default-features = false }
zip.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
