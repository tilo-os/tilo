[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "qdoc"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Rich-text and spreadsheet document resources for Tilo"

[features]
# Hooks for tests that compare the bulk import path with the op-by-op reference.
bulk-instrumentation = []

[dependencies]
web-time = { version = "1", features = ["serde"] }
automerge.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
