[package]
name = "qdoc-pdf"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Paginated PDF export for qdoc DocSnapshot documents (Tilo)"

[dependencies]
qdoc = { path = "../qdoc" }
# Image decode for `image` blocks. PDF export supports PNG/JPEG; disabling
# defaults avoids pulling every codec into the shared graph.
image = { workspace = true, default-features = false, features = ["jpeg", "png"] }
# Flate compression for image XObject pixel data.
flate2.workspace = true

[lints]
workspace = true
