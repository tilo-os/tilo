[package]
name = "tilo-doc-pdf"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Paginated PDF export for qdoc DocSnapshot documents (Tilo)"

[dependencies]
tilo-doc = { path = "../tilo-doc" }
tilo-content = { path = "../../system/content", default-features = false }
# Image decode for `image` blocks. PDF export supports PNG/JPEG; disabling
# defaults avoids pulling every codec into the shared graph.
image = { workspace = true, default-features = false, features = ["jpeg", "png"] }
# Flate compression for image XObject pixel data.
flate2.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
