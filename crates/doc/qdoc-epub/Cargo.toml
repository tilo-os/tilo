[package]
name = "qdoc-epub"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "EPUB 3 export for qdoc DocSnapshot documents (qOS)"

[dependencies]
qdoc = { path = "../qdoc" }
# Reuse the HTML export engine for inline/block markup + escaping; we wrap its
# fragment output in well-formed XHTML.
qdoc-html = { path = "../qdoc-html" }
# ZIP container for the EPUB OCF package; shared with qdoc's docx/odt codecs.
zip.workspace = true

[lints]
workspace = true
