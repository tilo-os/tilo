[package]
name = "tilo-app-module"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Later builds of a running app whose payload is its module: the directory each generation is published into, and the file that names the current one."

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
