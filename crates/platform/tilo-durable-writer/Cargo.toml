[package]
name = "tilo-durable-writer"
description = "Durable session state written off the frame thread: latest-wins, ordered writes on one thread, with flush barriers."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# Counts the writes a thread submits, for tests of code that writes through it.
test-support = []

[dependencies]
parking_lot.workspace = true
tilo-files = { path = "../tilo-files" }
tracing.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
