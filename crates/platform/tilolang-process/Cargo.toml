[package]
autotests = false
name = "tilolang-process"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang app process: one process per workspace and author, without the toolkit, running each of that author's tilolang apps in that workspace as an instance on its own broker connection."

[lib]
name = "tilolang_process"
path = "src/lib.rs"

[[bin]]
name = "tilolang-process"
path = "src/main.rs"

[features]
# The fake broker a test or example runs an instance against, in place of the
# session's: the tests of this crate and of the apps it hosts, and its examples.
test-support = []

[dependencies]
tilolang-tilo = { path = "../tilolang-tilo" }
# Each instance's connection to its workspace, opened by the session for that app's launch.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["native", "broker-transport"] }
# The workspace's store, which every resource of an app is kept in: its commands and answers.
tilo-resource-store = { version = "0.1.0", path = "../../collab/resource-store" }
# The API the session hands instances over.
runtime-portal = { version = "0.1.0", path = "../../runtime/runtime-portal" }
# The patch connection to each instance's window, and the sealed memfd its module comes in.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# Dates and clocks as the person set them, which the session hands over the API: the toolkit
# writes them the same way, so a sentence here and a view there read alike.
tilo-formats = { version = "0.1.0", path = "../../sdk/tilo-formats" }
tilo-wake.workspace = true
# The platform's phrases the standard library's frames say, without the toolkit.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
# What an earlier, native app of a package's id kept on this device: read once, never written,
# for the package's one-time conversion of its records.
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tilo-app-state = { version = "0.1.0", path = "../../system/app-state" }
# The person's date and time, read in their zone: what `today` is and what a day reads as.
jiff.workspace = true
# The device's clock, which is the person's: the same clock their window's dates and days read
# by, so what an instance writes as today is the day their window shows it under.
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
# One rule for which language a locale names, shared with the packs.
tilo-paths = { version = "0.1.0", path = "../tilo-paths" }
serde_json.workspace = true
# What the person may do in an app, as the session hands it with each instance.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The workspace's document of each person's own state, which every app of the workspace opens: its
# id, its document, and the changes that arrive for it.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
automerge.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
tilo-startup-metrics = { version = "0.1.0", path = "../../system/tilo-startup-metrics" }
uuid.workspace = true
# The device's network, which an app's `web.get` and `web.post` reach once per request.
tilo-net = { version = "0.1.0", path = "../tilo-net", default-features = false, features = ["blocking"] }
# The mail origin, reaching the connector process the system runs for the app.
tilolang-mail = { path = "../tilolang-mail", default-features = false }
# The device's content store, which an app's files are kept in, and the person's own chooser.
tilo-content = { version = "0.1.0", path = "../../system/content" }
tilo-content-device = { version = "0.1.0", path = "../../system/content-device" }
tilo-dialogs = { version = "0.1.0", path = "../tilo-dialogs" }
# The person's clipboard, over the connection the session opens for each instance: what an app
# copies and pastes, since its process holds no display of its own.
tilo-clipboard = { version = "0.1.0", path = "../tilo-clipboard" }
# Presence as every window decodes it: who is where in a document, and who is writing there.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }

[dev-dependencies]
# The fake broker these tests and examples run instances against, as the apps'
# tests do (`src/testing.rs`).
tilolang-process = { path = ".", features = ["test-support"] }
# The person's clock held at a moment, and the zone the test's process reads: a day is only
# today's or tomorrow's against a clock and a zone a test says.
tilo-clock = { version = "0.1.0", path = "../tilo-clock", features = ["test-support"] }
# A named zone read from the database built into Tilo, as the runtime resolves the host's zone.
tilo-recurrence = { version = "0.1.0", path = "../../sdk/tilo-recurrence" }
tilo-test-env = { path = "../../../tools/test-env" }
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
tilolang = { path = "../../lang/tilolang" }
# The session's persistent search index, and the source a search reads it through: a tilolang
# app's published entries are found by a word of their text through it.
tilo-desktop-search = { path = "../../session/desktop-search", features = ["indexes"] }
# The native app's data home a test grants the host, as the session does.
tempfile.workspace = true
# The replies the test's broker awaits from the instance's action directory.
tokio = { workspace = true, features = ["sync"] }

# One test binary: every file under tests/ is a module of it.
[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
