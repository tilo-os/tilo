[package]
name = "tilo-account-probe"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Bounded connection probes for the mail, calendar and DAV accounts a person adds: the server really accepts the sign-in, over verified TLS, before anything keeps the credential."

[lib]
name = "tilo_account_probe"
path = "src/lib.rs"
doctest = false

[features]
# The stand-in mail server with real sockets, for a crate's own tests to
# sign in to: it takes one made-up login and no real password, and answers
# on a runtime of its own.
test-support = ["dep:rcgen", "tokio/sync", "tokio/macros", "tokio/rt-multi-thread"]

[dependencies]
# The account and secret shapes the probes read; nothing here keeps either.
accounts = { path = "../../system/accounts" }
# The same clients the apps use: async-imap as Mail does, the shared bounded
# DAV client as Calendar does.
async-imap.workspace = true
tilo-dav = { path = "../../system/tilo-dav" }
# Certificate roots and the TLS client configuration, as every other app's
# outbound connection makes them.
tilo-net = { path = "../tilo-net" }
# What a mail domain says of its servers: the names it gives the domain name
# system, and the settings document it publishes.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
roxmltree.workspace = true
rustls.workspace = true
# The SMTP sign-in is spoken by hand, a line at a time, so the probe carries
# no mail transport: only the encoding its `AUTH` exchange is written in.
base64.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util"] }
tokio-rustls.workspace = true
serde_json.workspace = true
# A deadline that is the same clock on every host, a page included.
web-time = "1"
# The stand-in's own certificate, where a test build serves one.
rcgen = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# The session's end of the connections it makes for Settings (`connect`): a Nextcloud
# sign-in is the account-credentials login flow, and the messages are serde's.
account-credentials = { path = "../../system/account-credentials" }
serde.workspace = true
zeroize.workspace = true
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
test-http = { path = "../../../tools/test-http" }
# The stand-in's certificate, in this crate's own tests.
rcgen.workspace = true
# The stand-in's own runtime, in this crate's tests and its program; paused time for the
# connection race.
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "test-util"] }
# The stand-in's mailbox is read in its tests by the client a host's mail session uses.
futures-util.workspace = true

[lints]
workspace = true
