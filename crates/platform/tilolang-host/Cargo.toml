[package]
name = "tilolang-host"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang host: one process per workspace and author, without the toolkit, running each of that author's tilolang apps in that workspace as an instance on its own broker connection."

[lib]
name = "tilolang_host"
path = "src/lib.rs"

[[bin]]
name = "tilolang-host"
path = "src/main.rs"

[dependencies]
tilolang-tilo = { path = "../tilolang-tilo", features = ["record"] }
# Each instance's connection to its workspace, opened by the session for that app's launch.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["native", "broker-transport"] }
# The door the session hands instances over.
runtime-portal = { version = "0.1.0", path = "../../runtime/runtime-portal" }
# The patch connection to each instance's window, and the sealed memfd its module comes in.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# Dates and clocks as the person set them, which the session hands over the door: the toolkit
# writes them the same way, so a sentence here and a view there read alike.
tilo-formats = { version = "0.1.0", path = "../../sdk/tilo-formats" }
tilo-wake.workspace = true
# The platform's phrases the standard library's frames say, without the toolkit.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tilo-app-state = { version = "0.1.0", path = "../../system/app-state" }
# The person's date and time, read in their zone: what `today` is and what a day reads as.
chrono = { workspace = true, features = ["std", "clock"] }
# The device's clock, which is the person's: the same clock their window's dates and days read
# by, so what an instance writes as today is the day their window shows it under.
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
serde_json.workspace = true
# A record the door hands over travels as base64 on the program connection.
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc.workspace = true
tilo-startup-metrics = { version = "0.1.0", path = "../../system/tilo-startup-metrics" }
uuid.workspace = true
# The device's network, which an app's `web.get` and `web.post` reach once per request.
tilo-net = { version = "0.1.0", path = "../tilo-net", default-features = false, features = ["blocking"] }
# The mail origin, reaching the connector process the system runs for the app.
tilolang-mail = { path = "../tilolang-mail", default-features = false }
# The device's content store, which an app's files are kept in, and the person's own chooser.
tilo-content = { version = "0.1.0", path = "../../system/content" }
tilo-content-device = { version = "0.1.0", path = "../../system/content-device" }
tilo-dialogs = { version = "0.1.0", path = "../tilo-dialogs" }

[dev-dependencies]
# The person's clock held at a moment, and the zone the test's process reads: a day is only
# today's or tomorrow's against a clock and a zone a test says.
tilo-clock = { version = "0.1.0", path = "../tilo-clock", features = ["test-support"] }
tilo-test-env = { path = "../../dev/test-env" }
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
tilolang = { path = "../../lang/tilolang" }
# The session's persistent search index, and the source a search reads it through: a tilolang
# app's published entries are found by a word of their text through it.
tilo-desktop-search = { path = "../../session/desktop-search", features = ["indexes"] }
automerge.workspace = true
tilo-automerge.workspace = true
tempfile.workspace = true
# The replies the test's broker awaits from the instance's action directory.
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
