[package]
name = "tilo-typst-fonts"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typst's bundled fonts on every target: embedded in native builds, served by the host to a page by name."

[lib]
name = "tilo_typst_fonts"
path = "src/lib.rs"

# A page fetches the fonts as host data (`HOST_FONTS`) instead of carrying
# megabytes of font tables in its module; every other build embeds them. The
# dependency is the same on every target all the same: the page never calls
# `typst_assets::fonts()`, so the linker drops the tables there. One feature
# set everywhere keeps typst-assets out of the workspace-hack, which is linked
# into the shared runtime every app maps; the fonts belong to Typst's engine
# library (crates/runtime/engines/typst).
[dependencies]
typst-assets = { version = "0.15", features = ["fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
