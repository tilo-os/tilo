[package]
name = "tilo-mime"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A file's MIME type by its extension, from a table the loader never relocates."

[lib]
name = "tilo_mime"
path = "src/lib.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
