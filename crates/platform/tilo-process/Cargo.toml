[package]
name = "tilo-process"
version = "0.1.0"
edition = "2024"
# Published: the SDK's platform layer (tools/sdk/publish_check.py).
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The current process and, later, child processes: one API on Linux, macOS and the web, where there are none."

[lints]
workspace = true

[features]
native-editor = ["dep:runtime-portal"]
# Independent jobs (`job`): a child process in a cgroup of its own below its
# app's, through the session's app spawner.
jobs = ["dep:runtime-portal"]

[dependencies]
runtime-portal = { version = "0.1.0", path = "../../runtime/runtime-portal", default-features = false, optional = true }
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }

[target.'cfg(unix)'.dependencies]
# Reading the login shell's PATH, bounded in time and size.
bounded-command = { version = "0.1.0", path = "../../system/bounded-command" }
# The rendezvous lock and the socket wait.
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
# The owner-only service connect's deadline.
socket2 = { version = "0.6", default-features = false, features = ["all"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
