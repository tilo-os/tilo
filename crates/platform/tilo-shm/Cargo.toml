[package]
name = "tilo-shm"
version = "0.1.0"
edition = "2024"
# Published: the SDK's platform layer (tools/sdk/publish_check.py).
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Anonymous shared memory between processes: a sealed memfd on Linux, unlinked POSIX shared memory on macOS, and the read-only view of either."

[lib]
name = "tilo_shm"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
memmap2 = "0.9.10"

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
