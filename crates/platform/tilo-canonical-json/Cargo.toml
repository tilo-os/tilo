[package]
name = "tilo-canonical-json"
version = "0.1.0"
edition = "2024"
# Published: the SDK's platform layer (tools/sdk/publish_check.py).
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Canonical compact JSON encoding with object keys sorted by UTF-8 bytes."

[lib]
name = "tilo_canonical_json"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Sorts without a copy of std's sort on wasm32, keeping the browser start module small.
tilo-sort = { version = "0.1.0", path = "../tilo-sort" }

[dev-dependencies]
# Preserve insertion order in unit tests so unsorted maps exercise the stack
# and scratch sort paths even when this crate is tested on its own.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
