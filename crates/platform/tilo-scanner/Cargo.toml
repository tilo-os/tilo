[package]
name = "tilo-scanner"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Document scanners, one page at a time as PNG, through SANE"

# SANE's `scanimage`, run with a deadline and a cap on what it prints.
[target.'cfg(target_os = "linux")'.dependencies]
bounded-command = { package = "tilo-bounded-command", path = "../bounded-command" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
