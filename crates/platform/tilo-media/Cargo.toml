
[package]
name = "tilo-media"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Playback, decode, encode and the audio graph: GStreamer and PipeWire on Linux and macOS, the page's media elements and WebCodecs on the web."
build = "build.rs"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_media"
path = "src/lib.rs"

# The GStreamer and PipeWire features select native backends. On the web
# they compile to nothing (see build.rs): an app can keep `decode` in its
# default features and still build for the browser, where the page's media
# elements decode instead.
[features]
default = []
# Opus voice capture/playback without the video decoder stack.
voice = ["dep:gstreamer", "dep:gstreamer-app"]
# GStreamer decode: `playbin` diverts video through
# `videoconvert ! appsink(RGBA)` and routes audio to `autoaudiosink`. Off by
# default so hermetic builds, `--shots`, and CI do not require GStreamer.
# Enable on a host that has the gstreamer stack: `--features decode`.
decode = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Lets `encode` consult the GStreamer registry when picking an encoder.
# The preference order and the bitrate-unit table in `encode` are pure and
# always compiled; this feature is only what allows the crate to *look* at
# which elements are installed, rather than assume. A consumer that encodes
# (the video editor's export) turns it on; one that only decodes does not need
# it, and `decode` already links gstreamer so both together add nothing.
encode = ["dep:gstreamer"]
# The real-time encoder and decoder (`realtime`): screen sharing, calls and
# recording. Links the same GStreamer stack as `decode`; without it the
# real-time constructors report `RealtimeError::NotCompiled`, so a consumer
# that only sometimes needs video compiles without the gstreamer dev stack.
realtime = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Native PipeWire playback and capture streams (`pw_stream`). Off by default so
# consumers that only enumerate the audio graph do not link libpipewire; the
# stream logic and its backend trait compile either way.
pipewire = ["dep:pipewire"]
# Test builds of this crate and its dependents: startup waits use the shared
# test hang bound instead of the shipping budget.
test-support = ["dep:tilo-test-env"]

[dependencies]
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-files = { version = "0.1.0", path = "../tilo-files" }
blake3.workspace = true
serde.workspace = true
hex.workspace = true
url.workspace = true

# Decode diagnostics: which decoder was plugged, why a hardware path was
# refused, what `TILO_MEDIA_HWDEC` / `TILO_MEDIA_HWENC` were read as. Same pin the
# rest of the workspace resolves, so log filtering behaves identically.
tracing.workspace = true

# The audio graph client reads `pw-dump`'s JSON to enumerate the
# PipeWire/WirePlumber node graph (devices + per-application streams). Same pin
# the rest of the workspace resolves, so no second copy links.
serde_json.workspace = true

# Deconvolution and spectra for acoustic speaker calibration.
rustfft.workspace = true
# The playhead clock and the handoff freshness checks: `std::time::Instant`
# panics in the browser.
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
# Config, data and cache homes for the echo-cancel client, sound themes and
# the extensions stamp: the same XDG resolution every other platform crate uses.
tilo-paths = { version = "0.1.0", path = "../tilo-paths" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Decode stack — only linked under `--features decode`. Same pins as
# `apps/tube` / `apps/camera` so no second gstreamer copy resolves.
#
# `v1_24` is required, not cosmetic: `VideoInfoDmaDrm` (which parses a
# `drm-format` caps field into a fourcc + modifier) and `AppSinkCallbacks::
# propose_allocation` (which is what lets the sink advertise `GstVideoMeta`, so
# a decoder will negotiate `memory:DMABuf` at all) both appeared in GStreamer
# 1.24. The build container and the OS image both ship 1.26.
gstreamer = { workspace = true, optional = true, features = ["v1_24"] }
gstreamer-app = { workspace = true, optional = true, features = ["v1_24"] }
gstreamer-video = { workspace = true, optional = true, features = ["v1_24"] }
tilo-test-env = { version = "0.1.0", path = "../../dev/test-env", optional = true }

# Native audio streams — only linked under `--features pipewire`. Same pin as
# the shell's screen-cast producer so one copy resolves; `v0_3_50` exposes the
# graph's requested frame count and the resampler's buffered frames, which the
# playback timing needs.
bounded-command = { version = "0.1.0", path = "../../system/bounded-command" }
libc.workspace = true
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_50"] }

# The system's now-playing entry and media keys.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

# The page's media elements, canvas readback and the Media Session API,
# pinned to the versions the browser runtime links.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"

[dev-dependencies]
# The decode probe example prints pipeline diagnostics; the same subscriber the
# rest of the workspace uses, so log filtering behaves identically.
tracing-subscriber.workspace = true
tilo-test-env = { version = "0.1.0", path = "../../dev/test-env" }
tempfile.workspace = true
tilo-advisory-lock = { path = "../../system/advisory-lock" }

[lints]
workspace = true
