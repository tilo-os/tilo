[package]
name = "tilo-files"
version = "0.1.0"
edition = "2024"
# Published: the SDK's platform layer (tools/sdk/publish_check.py).
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Files inside capability-scoped roots on Linux, macOS and the web: crash-safe replacement, no-clobber creation and renames, advisory locks, and the browser's origin-private file system."

[lib]
name = "tilo_files"
path = "src/lib.rs"

# The native backends are the workspace's crash-safe write, lock and
# private-file crates; everything else is std, the two platform leaves it
# speaks in, and the system calls std does not expose.
[dependencies]
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
tilo-paths = { version = "0.1.0", path = "../tilo-paths" }
tilo-atomic-file = { version = "0.1.0", path = "../../system/atomic-file" }
tilo-advisory-lock = { version = "0.1.0", path = "../../system/advisory-lock" }
private-fs = { version = "0.1.0", path = "../../system/private-fs" }

# Native change notification (inotify, FSEvents), for `Dir::watch` on native
# directories. Off by default so persisting crates stay free of it.
[features]
watch = ["dep:notify"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
notify = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `flock(2)`, `FD_CLOEXEC` and `renameat2`/`renameatx_np` without hand-written FFI.
rustix = { workspace = true, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
# `path_identity`'s file URLs.
url.workspace = true

# The browser's origin-private file system and Web Locks, pinned to the
# versions the browser runtime links so a page carries one copy.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = [
    "Blob",
    "BroadcastChannel",
    "File",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "MessageEvent",
    "StorageManager",
    "WritableStream",
] }

[dev-dependencies]
tempfile.workspace = true

# Run in headless Chrome by `web/run.mjs`; natively an empty library.
[[example]]
name = "web_probe"
crate-type = ["cdylib"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
