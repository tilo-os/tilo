[package]
name = "tilo-render-protocol"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Scene transport between Tilo apps and the workspace's render service: frame records, vello encodings by resource id, the validator every scene passes before a GPU sees it, and the shared memory and control channel they travel on."

# `serde_bytes` is named only inside `#[serde(with = "serde_bytes")]`, an
# attribute string an unused-dependency scan does not read.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
# What a window's command palette offers: the actions its app publishes, as the session's
# action directory lists them.
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
peniko = "0.6.1"
postcard = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tilo-ui-graph = { version = "0.1.0", path = "../../dev/ui-graph" }
vello_encoding = { workspace = true, features = ["bump_estimate"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "mm", "net", "std"] }
# Anonymous shared memory, sealed where the system can seal it: the one implementation every
# process boundary of the workspace hands immutable bytes over.
tilo-sandbox = { version = "0.1.0", path = "../tilo-sandbox" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = "0.1"

[dev-dependencies]
proptest.workspace = true
vello.workspace = true
vello_encoding.workspace = true
tilo-font-catalog = { version = "0.1.0", path = "../../sdk/font-catalog" }

[lints]
workspace = true
