[package]
name = "tilo-accessibility-settings"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The person's accessibility assists: the one model Settings edits and the compositor and shell read."

[lib]
name = "tilo_accessibility_settings"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
# The choices as atoms of the record Settings defines with `accessibility_settings!`.
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource", optional = true }

[features]
model = ["dep:tilo-resource", "settings-store/model"]

[package.metadata.cargo-machete]
# Used only inside `settings_store::labelled_choice!` expansions, which derive
# `tilo_resource::Model` here under the `model` feature; machete reads no macro output.
ignored = ["tilo-resource"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
