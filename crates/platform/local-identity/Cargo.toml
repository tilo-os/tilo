[package]
name = "tilo-local-identity"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Who sits at this device: the process's one identity boundary and the source a host installs."

[lib]
name = "tilo_local_identity"
path = "src/lib.rs"

# Plain values and one registry: a toolkit built without Tilo's model has no
# source installed and so no local identity. The native source, which reads the
# workspace identity service a launcher bound, lives with the collab client
# (`collaboration::local_identity`), where its identity client is at hand.
[dependencies]
tilo-lock = { version = "0.1.0", path = "../tilo-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32, and the toolkit
# links this crate in the browser.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
