[package]
name = "tilo-written-view"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A written view as a widget: a view a person or an agent wrote in the app language, run in an instance of its own over what the workspace's apps publish and drawn through the app window's half of a window, wherever an app places it."

[dependencies]
# The boundary an app places a written view through (`ui::written_view`), the toolkit the view's
# widgets are, and the session's action API its readings and its actions go through.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", default-features = false }
# The instance the view runs in, and the packages the workspace's apps read as.
tilolang-tilo = { path = "../tilolang-tilo" }
# The window's half: the toolkit's widgets, built from the component patches the instance sends.
tilo-app-window = { version = "0.1.0", path = "../tilo-app-window" }
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# Every app's published surface, as its package ships it: what a view names an app by and reads
# its record as. Compiled in here only, so a program that fetches this crate's code on first
# use carries no surface at its start.
app-fleet = { version = "0.1.0", path = "../../packaging/app-fleet", features = ["surfaces"] }
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
