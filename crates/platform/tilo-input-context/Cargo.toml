[package]
name = "tilo-input-context"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded focused-field action metadata over Tilo's authenticated Wayland input-method service."

[features]
native-client = ["client", "wayland-client/system"]
client = ["dep:wayland-client", "dep:wayland-scanner", "dep:wayland-backend"]
server = ["dep:wayland-server", "dep:wayland-scanner", "dep:wayland-backend"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
wayland-client = { workspace = true, optional = true }
wayland-server = { version = "=0.31.13", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-scanner = { version = "0.31", optional = true }

[lints]
workspace = true

# poll(2) for `wait`: an input method sleeps on its socket outside the client lock.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Keep native feature unification out of browser metadata builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
