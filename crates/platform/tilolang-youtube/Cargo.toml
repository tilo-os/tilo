[package]
name = "tilolang-youtube"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The YouTube origin of tilolang packages: keeps a package's youtube types in step with YouTube, through the InnerTube client the platform ships."

[dependencies]
tilolang-tilo = { path = "../tilolang-tilo" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
# The door an instance attaches to the connector over, and the descriptors the session hands
# both (`runtime_portal::origin_connector`).
runtime-portal = { path = "../../runtime/runtime-portal", optional = true }
# YouTube's own client, as Tube and Music reach it: each query compiled once beside rustypipe.
tilo-innertube = { path = "../tilo-innertube", optional = true }
rustypipe = { workspace = true, features = ["rustls-no-provider"], optional = true }
# The app runtime rustypipe's connections live on, and its TLS provider.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", optional = true }
# The device's network: YouTube's queries, and the pictures an answer names, fetched here
# because the app's window never has one.
tilo-net = { path = "../tilo-net", default-features = false, features = ["blocking"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[features]
default = ["live", "connector"]
# The InnerTube client, and the connector process that holds it: the network the tilolang
# host never has. A build without it, or a session with no connector running, answers from a
# test's own service instead.
live = ["dep:tilo-innertube", "dep:rustypipe", "dep:ui", "dep:tilo-net"]
# The connector process's loop: the door it takes instances from, and the socket each reaches
# it over (`tilo-launcher run --tilolang-connector youtube`).
connector = ["dep:runtime-portal"]

[dev-dependencies]
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
