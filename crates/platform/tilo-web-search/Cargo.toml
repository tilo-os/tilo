[package]
name = "tilo-web-search"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Keyless web search and page reading on the device: several public search engines asked at once and merged, and pages reduced to readable text, with every download bounded."

[lib]
name = "tilo_web_search"
path = "src/lib.rs"

[dependencies]
# Tilo's one TLS stack and trust source for every request.
tilo-net = { version = "0.1.0", path = "../tilo-net", features = ["http"] }
# Engines are asked at once; each gets a deadline, and a fetch resolves its
# host first to refuse local addresses.
tokio = { workspace = true, features = ["time", "net"] }
futures-util.workspace = true
serde.workspace = true
# Google's search element answers with JSON.
serde_json.workspace = true
url.workspace = true
# Bing wraps result links in base64url.
base64.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }

[lints]
workspace = true
