[package]
name = "tilo-host-search"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Hands a result the host operating system's search asks an app to open to the Tilo runtime the app attached to."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_host_search"
path = "src/lib.rs"

[dependencies]
tracing.workspace = true
workspace-hack = { version = "0.1" }

# Spotlight continues a chosen result in the bundle's app, as a user activity.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-core-spotlight = { version = "0.3", default-features = false, features = ["std", "CSSearchableItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserActivity"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
