[package]
name = "tilo-spotify"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
native = ["dep:librespot", "dep:gstreamer", "dep:gstreamer-app", "dep:tokio", "dep:tilo-clock", "dep:tilo-rt"]

[dependencies]
librespot = { version = "=0.8.0", optional = true, default-features = false, features = ["rustls-tls-native-roots"] }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tilo-clock = { path = "../tilo-clock", optional = true }
tilo-rt = { path = "../tilo-rt", optional = true }
account-custody = { path = "../../system/account-custody" }
accounts = { path = "../../system/accounts" }

[lints]
workspace = true
