[package]
name = "imager-backend"
version = "0.1.0"
description = "Native installation and migration actors with portable frontend contracts"
edition = "2024"
publish = false
license.workspace = true

[features]
capture-worker = []
capture-worker-applications = ["capture-worker"]
host-media-writer = []
native-slack-qualification = ["installation", "dep:zbus"]
native-capture-qualification = ["installation", "flatpak-media-writer", "launcher/native-home-alias-qualification"]
test-support = ["dep:tilo-install-helpers", "dep:tilo-test-env"]
flatpak-media-writer = ["block-devices/udisks", "dep:zbus"]
# The guided installation's capture of the old system's Discord session from
# its Chromium Local Storage, the only reader of LevelDB. LevelDB is C++, so it
# links libstdc++, which the signed app runtime does not carry: the Tilo app
# (the image writer, imager's default build) must not link it. imager's
# `installation` feature enables this one.
installation = ["dep:leveldb-sys"]

[dependencies]
ed25519-dalek.workspace = true
tilo-resource = { path = "../../sdk/tilo-resource" }
tar.workspace = true
wire-frame = { path = "../../system/wire-frame" }
tilo-unlock-protocol = { path = "../../collab/tilo-unlock-protocol" }
tilo-user-identity = { path = "../../collab/tilo-user-identity" }
tilo-identity-host = { path = "../../runtime/tilo-identity-host" }
runtime-identity = { path = "../../runtime/runtime-identity" }
runtime-collab = { path = "../../runtime/runtime-collab" }
tilo-test-env = { path = "../../dev/test-env", optional = true }
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { workspace = true, features = ["blocking"] }
tilo-seal = { path = "../../system/tilo-seal" }
tilo-ntfs-protocol = { path = "../../session/tilo-ntfs-protocol" }
tempfile.workspace = true
base64.workspace = true
browser-continuity = { workspace = true, features = ["native"] }
blake3.workspace = true
cap-std = "3.4.6"
accounts = { path = "../../system/accounts" }
account-custody = { path = "../../system/account-custody" }
zeroize.workspace = true
block-devices = { path = "../../system/block-devices" }
bounded-command = { path = "../../system/bounded-command" }
crc32fast.workspace = true
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
url.workspace = true
cloud-source-dav = { path = "../../system/cloud-source-dav" }
tilo-dav = { path = "../../system/tilo-dav" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
uuid.workspace = true
staging-handoff-model = { path = "../../../apps/staging-handoff-model" }
install-profile-model = { path = "../../session/install-profile-model" }
workspace-hack = { version = "0.1" }
tilo-paths = { path = "../../platform/tilo-paths" }

[target.'cfg(unix)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
tilo-process = { path = "../../platform/tilo-process" }
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
tilo-advisory-lock = { path = "../../system/advisory-lock" }

[target.'cfg(target_os = "linux")'.dependencies]
block-devices = { path = "../../system/block-devices", features = ["udisks"] }
glib = "=0.21.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
leveldb-sys = { version = "=2.0.9", features = ["snappy"], optional = true }
desktop-entry = { package = "tilo-desktop-entry", path = "../../system/desktop-entry" }
tilo-install-helpers = { path = "../../system/install-helpers", optional = true }
zbus = { workspace = true, optional = true, features = ["tokio", "blocking-api"] }
tilo-clock = { path = "../../platform/tilo-clock" }
runtime-portal = { path = "../../runtime/runtime-portal", default-features = false }
fs-native = { path = "../../system/fs-native" }
launcher = { path = "../../packaging/launcher" }
runtime-bundle = { path = "../../packaging/runtime-bundle" }
tilo-app-package = { path = "../../packaging/tilo-app-package" }
package-store = { path = "../../packaging/package-store" }
tilo-secrets.workspace = true
runtime-fs = { path = "../../runtime/runtime-fs" }
# The FUSE presentation the target projection worker serves.
runtime-fs-fuse = { path = "../../runtime/runtime-fs-fuse" }
fuser.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
tilo-files = { path = "../../platform/tilo-files" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tilo-oauth = { path = "../../system/tilo-oauth", features = ["fake"] }
runtime-identity = { path = "../../runtime/runtime-identity" }
test-http = { path = "../../dev/test-http" }
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
