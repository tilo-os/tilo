[package]
name = "tilo-cloud-files"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Credential-free cloud file access and identity-anchored independent imports"

[dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack unifies native features, including sockets and OS randomness.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
runtime-fs = { path = "../../runtime/runtime-fs" }
host-fs = { path = "../../system/host-fs" }
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
uuid.workspace = true
chrono = { workspace = true, default-features = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
