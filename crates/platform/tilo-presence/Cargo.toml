[package]
name = "tilo-presence"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Where a person's presence is and the colour they wear, as plain values the collaboration model's wire carries and the toolkit draws."

[lib]
name = "tilo_presence"
path = "src/lib.rs"

# Plain values: the toolkit draws other people's cursors, selections and faces from these
# without linking the collaboration model or the policy; a member says who wears a colour
# through `WearsHue`.
[dependencies]
blake3 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
# A presence key's digest is the postcard encoding of the key, hashed.
postcard = { workspace = true, features = ["alloc"] }
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
# The hue someone wears until they choose one, as every surface derives it.
tilo-face = { version = "0.1.0", path = "../tilo-face" }

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
