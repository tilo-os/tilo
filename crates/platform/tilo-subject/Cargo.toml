[package]
name = "tilo-subject"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A picture's subject, found by the on-device model through the model gateway, and its edge refined to the picture."

[dependencies]
# The model runs in the model gateway; this crate only asks it.
tilo-model-client = { path = "../../agent/model-client", default-features = false }
# The matte, and refining an edge and defringing, which run in the app.
tilo-segment = { path = "../../media/segment" }
base64.workspace = true
hex.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
