[package]
name = "tilo-messaging"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Portable host-owned messaging account metadata boundary"

[features]
# The person's Tilo messages through the private conversations of their
# room (`room`), for a host without a native messaging host: a web page.
room = ["dep:tilo-relay-protocol", "dep:uuid"]

[dependencies]
tilo-relay-protocol = { path = "../../hosting/tilo-relay-protocol", optional = true }
uuid = { workspace = true, optional = true }
tilo-contact-directory = { path = "../tilo-contact-directory" }
zeroize.workspace = true
accounts = { path = "../../system/accounts", features = ["person"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../sdk/tilo-resource" }

[lints]
workspace = true
