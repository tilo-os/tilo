# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ messaging service: the `messaging` service the launcher hands
# Messages (its accounts and enrollment) and Passwords (the permission
# requests the service makes), and nothing else. Length-prefixed JSON calls,
# replies and events (crates/platform/tilo-messaging/src/service), apart from
# the runtime interface every app speaks.
name = "messaging"
version = 1
version_const = "crates/platform/tilo-messaging/src/service/wire.rs:PROTOCOL"
encoding = "json"
served_to_apps = true
sources = [
    "crates/platform/tilo-messaging/src/service/wire.rs",
    "crates/platform/tilo-messaging/src/service/link.rs",
    "crates/platform/tilo-messaging/src/account.rs",
    "crates/platform/tilo-messaging/src/enrollment.rs",
    "crates/platform/tilo-messaging/src/groups.rs",
    "crates/platform/tilo-messaging/src/history.rs",
    "crates/platform/tilo-messaging/src/router.rs",
    "crates/platform/tilo-messaging/src/sending.rs",
    "crates/platform/tilo-messaging/src/setup.rs",
    "crates/platform/tilo-contact-directory/src/routing.rs",
    "crates/system/accounts/src/secrets.rs",
]
roots = ["Handoff", "Frame", "Call", "Reply", "Event"]

[opaque]
"Id" = "tilo_resource::Id, a string"
"Zeroizing" = "zeroize::Zeroizing, its contents as they are"

