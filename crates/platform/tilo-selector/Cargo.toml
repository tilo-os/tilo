[package]
name = "tilo-selector"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Which resources a skill is for: resource kinds and conditions, as a value and as text."

[lib]
name = "tilo_selector"
path = "src/lib.rs"

# A selector names kinds of resource and the words a resource says in its
# published fields. The same reading sits under the resource model and under
# the action catalogue, so it depends on neither.

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
