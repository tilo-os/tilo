[package]
name = "tilolang-mail"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The mail origin of tilolang packages: the logic that keeps a package's imap types in step with a mail server, and the connector that speaks IMAP and SMTP, run by the system in a process of its own and reached over a socket."

[dependencies]
# The IMAP and SMTP protocol code of native Mail, and the settings' account store.
mail = { path = "../../../apps/mail" }
tilolang-tilo = { path = "../tilolang-tilo" }
tilo-content = { path = "../../system/content" }
# Whether the device is online: an unreachable mail server is tried again when the network
# comes back, followed on a thread of its own.
tilo-net = { path = "../tilo-net" }
# The descriptors the session hands the connector: one per instance that attaches.
runtime-portal = { path = "../../runtime/runtime-portal" }
settings-store = { path = "../../system/settings-store" }
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["std"] }
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
# The test IMAP and SMTP servers the connector's tests run against.
mail = { path = "../../../apps/mail", features = ["fake-servers"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
