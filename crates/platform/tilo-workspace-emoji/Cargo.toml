[package]
name = "tilo-workspace-emoji"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A workspace's own emoji: the room record every app of the workspace draws `:name:` from"

[dependencies]
automerge.workspace = true
base64.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }

[lints]
workspace = true
