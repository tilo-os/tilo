[package]
name = "tilo-appearance"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The desktop's appearance preferences on every target: light or dark, the accent colour, increased contrast and reduced motion."

[lib]
name = "tilo_appearance"
path = "src/lib.rs"

[dependencies]
tracing.workspace = true

# The XDG Settings portal on the session bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A fake portal on a socket pair, served from a test runtime.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
zbus = { workspace = true, features = ["p2p", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSColor", "NSColorSpace", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
