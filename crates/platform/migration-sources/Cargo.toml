[package]
name = "migration-sources"
version = "0.1.0"
description = "Reading another computer's Outline, Linear and mail accounts and its Thunderbird profiles, for the installer and for a laptop CLI"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "migration_sources"
path = "src/lib.rs"

[features]
# The sample Thunderbird profile the end-to-end proofs import.
fixture = []
# Recognise the directories tests build their fixtures in, so destination
# namespace checks do not refuse the machine's own temporary directories.
test-support = []

[dependencies]
accounts = { path = "../../system/accounts" }
base64.workspace = true
blake3.workspace = true
# Calendar's wall-time formats and dates.
chrono.workspace = true
# Pinned, no-follow directory access and its destination namespace protection.
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
hex.workspace = true
mail-parser = "0.11.4"
# RFC 5545/6350 content lines for the vCard and iCalendar Thunderbird keeps.
pim-lines = { path = "../../text/pim-lines" }
reqwest = { workspace = true, features = ["blocking"] }
# Thunderbird's address books and local calendars are SQLite; the bundled
# engine keeps a laptop build from needing the system library.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tilo-net = { workspace = true, features = ["blocking"] }
# The stored RRULE spelling and the time-zone names a calendar keeps.
tilo-recurrence = { version = "0.1.0", path = "../../sdk/tilo-recurrence" }
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
tilo-process = { path = "../tilo-process" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../dev/test-env" }

[lints]
workspace = true
