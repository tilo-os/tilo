[package]
name = "tilo-capture"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Camera, microphone, screen and document-scanner capture with one API on Linux, macOS and the web: GStreamer (v4l2 / AVFoundation) and the ScreenCast portal natively, getUserMedia and getDisplayMedia in the browser."
build = "build.rs"

[lib]
name = "tilo_capture"
path = "src/lib.rs"

# Capability features. Each selects its native backend and compiles to
# nothing extra on the web, where the page's media devices serve all of them.
[features]
default = []
camera = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
microphone = ["dep:gstreamer", "dep:gstreamer-app"]
screen = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:ashpd", "dep:tilo-rt"]
scanner = ["dep:os-actions"]
# Synthetic devices (`broker::synthetic`), for dependents' tests.
test-support = []

[dependencies]
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
tilo-rt = { path = "../tilo-rt", optional = true }

# Capture descriptors pass between an app and its host.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The ScreenCast portal picks the monitor or window; SANE scans documents.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true, features = ["screencast"] }
os-actions = { path = "../../system/os-actions", optional = true }

# The page's media devices, pinned to the versions the browser runtime links.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
