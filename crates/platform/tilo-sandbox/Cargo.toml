[package]
name = "tilo-sandbox"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
readme = "../../../docs/crates/supporting-crate.md"
description = "Confined helper processes: Landlock + seccomp on Linux, Seatbelt on macOS, unsupported on the web."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_sandbox"
path = "src/lib.rs"

[dependencies]
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock rulesets and the seccomp parser policy.
tilo-sandbox-core = { version = "0.1.0", path = "../sandbox-core" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The confine probes prove a confined helper can still create sealed memory.
tilo-shm = { path = "../tilo-shm" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
