[package]
name = "tilo-settings-records"
version = "0.1.0"
edition = "2024"
# Published: the SDK's platform layer (tools/sdk/publish_check.py).
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Where a profile's settings documents live: their files, the lock of the one process that holds them, the watch a follower keeps on them and the holder's door for other processes' writes."

[lib]
name = "tilo_settings_records"
path = "src/lib.rs"

[dependencies]
tilo-files = { version = "0.1.0", path = "../tilo-files" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
tilo-lock = { version = "0.1.0", path = "../tilo-lock" }
tilo-paths = { version = "0.1.0", path = "../tilo-paths" }

[features]
# A follower notices the holder's saves at once instead of on its next read.
watch = ["tilo-files/watch"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
