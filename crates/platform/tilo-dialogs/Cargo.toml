[package]
name = "tilo-dialogs"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "File choosers, opening files with their app, and opening URIs on Linux, macOS and the web."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_dialogs"
path = "src/lib.rs"

[features]
# Test backends for scoped choosers and URI opening, for dependents' tests.
test-support = []

[dependencies]
# Outcomes are delivered from the app runtime or a host callback and wake the
# event loop that asked; reading and writing picked files runs as background
# work.
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
tracing.workspace = true
# Parses returned file URIs. `portal::to_local_path` is the file-access rule
# — a URI naming a remote host must not resolve to a local path — and is
# tested on every target.
url.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW`/`O_DIRECTORY` when opening a chosen file or folder.
libc.workspace = true
# The session shell's chooser service speaks newline-delimited JSON.
serde.workspace = true
serde_json.workspace = true

# The XDG Desktop Portal. Selected by target, not by a feature: every Linux
# app chooses files through the portal, which is where the sandbox's
# file-access grant is made.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["file_chooser", "open_uri", "wallpaper"] }
# Opens URIs on an unsandboxed desktop that runs no portal.
open.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
open = { workspace = true, features = ["shellexecute-on-windows"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
mime_guess.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"

[dev-dependencies]
tempfile.workspace = true

# `examples/pick.rs` runs the main run loop the panels live on.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
