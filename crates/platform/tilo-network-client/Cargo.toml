[package]
name = "tilo-network-client"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The general network client of tilolang packages: the HTTP requests an app's code sends, any method, queries, headers, bodies and secret references, bounded in time and size, as jobs its person can stop."

[dependencies]
# The device's network, once per request, and its own limits on how long one may take.
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", default-features = false, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
# The device's own store for the credentials a request signs in with.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }

[dev-dependencies]
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
