[package]
name = "tilo-clipboard"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "The clipboard on Linux, macOS and the web: text, images and the primary selection, over the connection an app's session serves it on."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_clipboard"
path = "src/lib.rs"

[dependencies]
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
# The framing every socket protocol in the tree uses: one length prefix, then its payload.
wire-frame = { version = "0.1.0", path = "../../system/wire-frame" }

# An image an app copies is offered as PNG.
[target.'cfg(unix)'.dependencies]
image = { workspace = true, features = ["png"] }

# The page's clipboard: trusted clipboard events and a synchronous copy.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
js-sys = "=0.3.85"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Bounds the clipboard events' waits.
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
