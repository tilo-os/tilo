[package]
name = "tilo-clipboard"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "The clipboard on Linux, macOS and the web: text, images and the primary selection, behind the connection an app's session or launcher serves it on."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_clipboard"
path = "src/lib.rs"

[features]
# The OS clipboard on Linux (`arboard`: Wayland's data-control protocol and its
# X11 fallback), for the launcher that serves an app's clipboard on a person's
# own desktop. Every Tilo app runs as a Wayland client in its sandbox and talks
# to that service, so the shared runtime leaves it out.
os = ["dep:arboard"]

[dependencies]
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
# The framing every socket protocol in the tree uses: one length prefix, then its payload.
wire-frame = { version = "0.1.0", path = "../../system/wire-frame" }
tracing.workspace = true

# `arboard` is the protocol for a client without focus: data-control on Wayland
# (falling back to X11/XWayland), `NSPasteboard` on macOS and the Windows
# clipboard. The launcher is the one process that owns the selection for an app.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arboard = { workspace = true, features = ["image-data"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["image-data", "wayland-data-control"], optional = true }

# The page's clipboard: trusted clipboard events and a synchronous copy.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
js-sys = "=0.3.85"

[dev-dependencies]
# Bounds the clipboard events' waits.
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# An image an app copies is offered as PNG, and the OS clipboard's images are
# read and written as RGBA8.
image = { workspace = true, features = ["png", "jpeg", "webp"] }
