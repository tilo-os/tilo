[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: their resources in the device's store, the published surface, and the UI graph translation."

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
automerge.workspace = true
# The id a run's changes name, one for every change of the action and its calls.
uuid.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-service = { path = "../../session/service" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
# A Rust app's views, drawn by the same host as a package's (one-app-model.md §2).
tilo-view = { version = "0.1.0", path = "../tilo-view" }
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# The one link grammar a resource's `share-link` renders, which the page reads back.
tilo-reference = { version = "0.1.0", path = "../../collab/reference" }
tilolang = { path = "../../lang/tilolang" }
# The wall clock, which also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
# The interpreter alone in a browser page, where the compiled tier cannot run.
tilolang-runtime = { path = "../../lang/tilolang-runtime", default-features = false }
# The history verbs a store answers, and the names history speaks of its writers in.
collaboration = { version = "0.1.0", path = "../../collab/collaboration" }
# The resource types and document ids the workspace's records are known by.
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The device's one store, which every resource of an app is kept in and read from.
tilo-resource-store = { version = "0.1.0", path = "../../collab/resource-store" }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
wire-frame = { version = "0.1.0", path = "../../system/wire-frame" }

[dev-dependencies]
# The system's mention notices, read from a workspace holding tilolang rich text.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The fake broker a workspace's committed read is served from in the tests.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
# The archives an app exports, read back as a person who unzips them finds them.
bounded-zip = { path = "../../doc/bounded-zip" }
tempfile.workspace = true
uuid.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
# The toolkit's words, as the session's hosts read them: what the tests' published
# types are labelled in.
tilo-app-window = { version = "0.1.0", path = "../tilo-app-window" }
# The palette, a native app whose actions it lists beside a tilolang app's, and the content
# index a paragraph of a rich text is found in.
tilo-desktop-search = { path = "../../session/desktop-search", features = ["indexes"] }
calculator = { path = "../../../apps/calculator" }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "rust_types"
path = "tests/rust_types.rs"


[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The compiled tier, on every device that can run it.
tilolang-runtime = { path = "../../lang/tilolang-runtime", features = ["wasmtime"] }
