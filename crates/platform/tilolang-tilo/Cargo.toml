[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: dynamic records in the room record, replayable actions, the published surface, and the UI graph translation."

[dependencies]
automerge.workspace = true
chrono = { workspace = true, features = ["std"] }
crc32fast.workspace = true
# The index each package's records are listed and searched from: B-trees in one file, read
# from snapshots that later commits leave as they were.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-automerge.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# A `RichText` field is the platform's rich-text field: tilo-doc's rich text, edited by its actions.
tilo-document = { path = "../../doc/tilo-document" }
tilolang = { path = "../../lang/tilolang" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
# The collab client an instance commits to its room through, without the toolkit.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", optional = true }
# The room record's on-disk copy and its writer, and who wrote a step (`instance::room`).
tilo-app-state = { version = "0.1.0", path = "../../system/app-state", optional = true }
durable-store = { version = "0.1.0", path = "../../system/durable-store", optional = true }
collab-types = { version = "0.1.0", path = "../../collab/collab-types", optional = true }
# The platform's history sentences, which the host's history verbs speak in.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history", optional = true }

[features]
# The instance's commit path to its room through the collab client
# (`instance::room`), without the toolkit.
room = [
    "dep:collaboration",
    "collaboration/native",
    "dep:tilo-app-state",
    "dep:durable-store",
    "dep:collab-types",
    "dep:tilo-history",
]
[dev-dependencies]
# The system's mention notices, read from a room holding tilolang rich text.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The fake broker a room's committed read is served from in the tests.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
tilo-app-state = { version = "0.1.0", path = "../../system/app-state" }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tempfile.workspace = true
uuid.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "budgets"
path = "tests/budgets.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
