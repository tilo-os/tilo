[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: dynamic records in the room record, replayable actions, the published surface, and the UI graph translation."

[dependencies]
automerge.workspace = true
chrono = { workspace = true, features = ["std"] }
crc32fast.workspace = true
# The index each package's records are listed and searched from: B-trees in one file, read
# from snapshots that later commits leave as they were.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-automerge.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# Tilo's search layer: what search finds resources by their texts through.
tilo-search = { version = "0.1.0", path = "../../sdk/search" }
tilolang = { path = "../../lang/tilolang" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
# The collab client an instance commits to its room through, without the toolkit.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", optional = true }

[features]
# The instance's commit path to its room through the collab client
# (`instance::room`), without the toolkit.
room = ["dep:collaboration"]
# Lets `tilolang bench --engine cranelift|winch` run on wasmtime (docs/tilolang-engines.md).
wasmtime = ["tilolang-runtime/wasmtime"]

[dev-dependencies]
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
uuid.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "budgets"
path = "tests/budgets.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
