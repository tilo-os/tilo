[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: dynamic documents in the workspace document, replayable actions, the published surface, and the UI graph translation."

[dependencies]
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
automerge.workspace = true
# The id a run's changes name, one for every change of the action and its calls.
uuid.workspace = true
chrono = { workspace = true, features = ["std"] }
crc32fast.workspace = true
# The index each package's documents are listed and searched from: B-trees in one file, read
# from snapshots that later commits leave as they were.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-automerge.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
# The document's content store, where an action too large to record whole keeps its parts, and
# the wake scope of the window whose code records them.
tilo-content = { version = "0.1.0", path = "../../system/content" }
tilo-wake.workspace = true
tilo-service = { path = "../../session/service" }
# The one notice type, and the boundary a device shows it through.
tilo-session-core = { path = "../../session/core" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
# A Rust app's views, drawn by the same host as a package's (one-app-model.md §2).
tilo-view = { version = "0.1.0", path = "../tilo-view" }
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# A `RichText` field is the platform's rich-text field: tilo-doc's rich text, edited by its actions.
tilo-document = { path = "../../doc/tilo-document" }
tilolang = { path = "../../lang/tilolang" }
# The wall clock, which also reads in a browser page, where std has none.
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
# The interpreter alone in a browser page, where the compiled tier cannot run.
tilolang-runtime = { path = "../../lang/tilolang-runtime", default-features = false }
# The collab client an instance commits to its workspace through, without the toolkit, and the
# history verbs every document answers (`history`).
collaboration = { version = "0.1.0", path = "../../collab/collaboration" }
# The workspace document's on-disk copy and its writer, and who wrote a step (`instance::document`).
tilo-app-state = { version = "0.1.0", path = "../../system/app-state", optional = true }
durable-store = { version = "0.1.0", path = "../../system/durable-store", optional = true }
# Each member's own document of a package declaring `resources: .own` (`member_document_of`).
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The platform's history sentences, which the host's history verbs speak in.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history" }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }

[features]
# The instance's commit path to its workspace document through the collab client
# (`instance::document`), without the toolkit.
document = [
    "collaboration/native",
    "dep:tilo-app-state",
    "dep:durable-store",
]
[dev-dependencies]
# The tests drive the instance's commit path (`instance::document`) whatever else the build has
# turned on.
tilolang-tilo = { path = ".", features = ["document"] }
# The system's mention notices, read from a workspace holding tilolang rich text.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The fake broker a workspace's committed read is served from in the tests.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
# The archives an app exports, read back as a person who unzips them finds them.
bounded-zip = { path = "../../doc/bounded-zip" }
tilo-app-state = { version = "0.1.0", path = "../../system/app-state" }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tempfile.workspace = true
uuid.workspace = true
tilo-test-env = { path = "../../dev/test-env" }
# The toolkit's words, as the session's hosts read them: what the tests' published
# types are labelled in.
tilo-ui-host = { version = "0.1.0", path = "../tilo-ui-host" }
# The palette, and a native app whose actions it lists beside a tilolang app's.
tilo-desktop-search = { path = "../../session/desktop-search" }
calculator = { path = "../../../apps/calculator" }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "upgrade_it"
path = "tests/upgrade_it.rs"

[[test]]
name = "budgets"
path = "tests/budgets.rs"

[[test]]
name = "rust_types"
path = "tests/rust_types.rs"

[[bench]]
name = "index_units"
path = "benches/index_units.rs"
harness = false

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The compiled tier, on every device that can run it.
tilolang-runtime = { path = "../../lang/tilolang-runtime", features = ["wasmtime"] }
