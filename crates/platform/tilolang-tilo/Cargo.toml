[package]
autotests = false
name = "tilolang-tilo"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo platform integration for tilolang apps: dynamic records in the workspace record, replayable actions, the published surface, and the UI graph translation."

[dependencies]
automerge.workspace = true
# The id a run's changes name, one for every change of the action and its calls.
uuid.workspace = true
chrono = { workspace = true, features = ["std"] }
crc32fast.workspace = true
# The index each package's records are listed and searched from: B-trees in one file, read
# from snapshots that later commits leave as they were.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tilo-automerge.workspace = true
tilo-actions = { version = "0.1.0", path = "../../collab/actions" }
tilo-service = { path = "../../session/service" }
# The one notice type, and the seam a device shows it through.
tilo-session-core = { path = "../../session/core" }
# The one policy what the runtime invokes is decided by.
tilo-action-policy = { version = "0.1.0", path = "../../collab/action-policy" }
# The patch protocol an instance sends its window over.
tilo-render-protocol = { version = "0.1.0", path = "../tilo-render-protocol" }
# A Rust app's views, drawn by the same host as a package's (one-app-model.md §2).
tilo-view = { version = "0.1.0", path = "../tilo-view" }
tilo-doc = { path = "../../doc/tilo-doc" }
tilo-resource = { version = "0.1.0", path = "../../sdk/tilo-resource" }
# A `RichText` field is the platform's rich-text field: tilo-doc's rich text, edited by its actions.
tilo-document = { path = "../../doc/tilo-document" }
tilolang = { path = "../../lang/tilolang" }
tilolang-runtime = { path = "../../lang/tilolang-runtime" }
# The collab client an instance commits to its workspace through, without the toolkit.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", optional = true }
# The workspace record's on-disk copy and its writer, and who wrote a step (`instance::record`).
tilo-app-state = { version = "0.1.0", path = "../../system/app-state", optional = true }
durable-store = { version = "0.1.0", path = "../../system/durable-store", optional = true }
collab-types = { version = "0.1.0", path = "../../collab/collab-types", optional = true }
# The platform's history sentences, which the host's history verbs speak in.
tilo-history = { version = "0.1.0", path = "../../sdk/tilo-history", optional = true }

[features]
# The instance's commit path to its workspace record through the collab client
# (`instance::record`), without the toolkit.
record = [
    "dep:collaboration",
    "collaboration/native",
    "dep:tilo-app-state",
    "dep:durable-store",
    "dep:collab-types",
    "dep:tilo-history",
]
[dev-dependencies]
# The system's mention notices, read from a workspace holding tilolang rich text.
ui = { package = "tilo-ui", path = "../../sdk/ui-core", default-features = false }
collab-types = { version = "0.1.0", path = "../../collab/collab-types" }
# The fake broker a workspace's committed read is served from in the tests.
collaboration = { version = "0.1.0", path = "../../collab/collaboration", features = ["test-support", "broker-transport", "native"] }
# The archives an app exports, read back as a person who unzips them finds them.
bounded-zip = { path = "../../doc/bounded-zip" }
tilo-app-state = { version = "0.1.0", path = "../../system/app-state" }
durable-store = { version = "0.1.0", path = "../../system/durable-store" }
tempfile.workspace = true
uuid.workspace = true
# The toolkit's words, as the session's hosts read them: what the tests' published
# types are labelled in.
tilo-ui-host = { version = "0.1.0", path = "../tilo-ui-host" }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "upgrade_it"
path = "tests/upgrade_it.rs"

[[test]]
name = "budgets"
path = "tests/budgets.rs"

[[test]]
name = "words"
path = "tests/words.rs"

[[test]]
name = "rust_types"
path = "tests/rust_types.rs"

[[bench]]
name = "index_units"
path = "benches/index_units.rs"
harness = false

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
