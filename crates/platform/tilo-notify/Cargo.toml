[package]
name = "tilo-notify"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "User notifications on Linux, macOS and the web: what an app shows its session over its connection, and what each platform keeps."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_notify"
path = "src/lib.rs"

[features]
# The desktop's own notification portal and the freedesktop notification service, over the
# session bus, for a runner hosting an app on a foreign desktop. An app process inside Tilo
# reaches its session's notifier over the socket the launcher hands it (`service`) and never
# enables this: no sandboxed app speaks D-Bus.
host-portals = ["dep:zbus"]

[dependencies]
# Scheduled notifications name their time on the platform clock.
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
tracing.workspace = true
jiff.workspace = true

[target.'cfg(unix)'.dependencies]
# The notification service an app's session serves it, over the socket the launcher hands it: one
# length-prefixed JSON message per frame.
serde.workspace = true
serde_json.workspace = true
wire-frame = { package = "tilo-wire-frame", version = "0.1.0", path = "../wire-frame" }
tilo-socket = { version = "0.1.0", path = "../tilo-socket" }

# The notification portal (a foreign desktop's shell implements it), else the
# freedesktop notification service, on the session bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, optional = true, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(windows)'.dependencies]
url.workspace = true
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

# The Notifications API while the page is open.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["console"] }


[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
