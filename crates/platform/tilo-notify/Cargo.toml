[package]
name = "tilo-notify"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "User notifications on Linux, macOS and the web: show, replace by tag, withdraw, and schedule where the platform keeps them."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_notify"
path = "src/lib.rs"

[dependencies]
# Scheduled notifications name their time on the platform clock.
tilo-platform-caps = { version = "0.1.0", path = "../tilo-platform-caps" }
tilo-clock = { version = "0.1.0", path = "../tilo-clock" }
tilo-rt = { version = "0.1.0", path = "../tilo-rt" }
tracing.workspace = true
chrono.workspace = true

# The notification portal (the Tilo shell implements it), else the
# freedesktop notification service, on the session bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(windows)'.dependencies]
url.workspace = true
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

# The Notifications API while the page is open.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["console"] }


[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
