[package]
name = "tilo-app-registry"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "The Tilo app registry protocol on the client side: fail-closed .tapp verification, payload blobs, and a publisher's keys, signed entries and uploads."
repository.workspace = true
homepage.workspace = true

[lib]
name = "app_registry"
path = "src/lib.rs"

[dependencies]
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-app-package = { version = "0.1.0", path = "../tilo-app-package" }
registry-types = { package = "tilo-registry-types", version = "0.1.0", path = "../registry-types" }
# The kept form of a package's surface, whose hash a registry version names.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
tilo-automation = { version = "0.1.0", path = "../automation" }
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }
# Payload blobs and publisher uploads come from the registry server over
# HTTPS; rustls-tls only (no openssl / native-tls) to match the rest of the
# tree.
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tilo-net = { version = "0.1.0", path = "../../platform/tilo-net", features = ["blocking", "http"] }
reqwest = { workspace = true, features = ["blocking", "json"] }

ed25519-dalek = { workspace = true, features = ["rand_core"] }
getrandom.workspace = true
hex.workspace = true
blake3.workspace = true
bytes.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
