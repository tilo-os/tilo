[package]
name = "tilo-fs-client"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Capability clients and wire types for Tilo filesystem services."

[dependencies]
blake3.workspace = true
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }
tokio = { workspace = true, features = ["rt", "io-util", "macros", "net", "sync", "time"] }
# The connection a client drives: a local socket on Unix, a named pipe on Windows.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
wire-frame = { version = "0.1.0", path = "../../platform/wire-frame", features = ["postcard", "tokio"] }

[target.'cfg(unix)'.dependencies]
# The storage and cloud services' sockets, reached by path.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
tilo-paths.workspace = true
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
