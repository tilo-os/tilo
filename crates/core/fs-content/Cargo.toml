[package]
name = "tilo-fs-content"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The storage daemon's content format: size-tiered FastCDC chunking, BLAKE3 chunk hashes and self-describing HashSeq manifests, with the legacy format still readable."

[dependencies]
blake3.workspace = true
fastcdc.workspace = true
serde.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The package is published as tilo-fs-content; code names it by its library.
[lib]
name = "fs_content"
