[package]
autotests = false
name = "tilo-resource"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "The Tilo resource layer: typed, hierarchical app resources."

# The resource layer: typed resource state stored in a CRDT, typed replayable
# actions over it, deterministic ids and order, history and replay. It knows
# nothing about rendering, widgets or windows. The UI toolkit uses its
# document-generic history; `tilo-app` binds resources to views.

# The app SDK: the kinds it declares are the framework's, which no app lists as
# its own (crates/lang/tilo-app-builder/src/resource_kinds.rs).
[package.metadata.tilo]
framework = true

[features]
# The store a replica without a window records into is the actions' own.
test-support = ["tilo-actions/test-support"]

[dependencies]
tilo-action-types.workspace = true
tilo-member-types.workspace = true
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# Sorts without a copy of std's sort per call site, which kept the web
# desktop's start module large.
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true
tilo-automerge.workspace = true
uuid.workspace = true
jiff.workspace = true
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# A capability names the app its sandbox belongs to.
tilo-content = { version = "0.1.0", path = "../content", default-features = false }
tilo-resource-macros = { version = "0.1.0", path = "../tilo-resource-macros" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The tests record into the store a replica without a window keeps, which is
# behind `test-support`; the revision's own test build turns it on.
tilo-resource = { path = ".", features = ["test-support"] }
hex.workspace = true
# The tests are a window: they register the store their code records in.
tilo-wake.workspace = true
# The scenarios the tests of one subject are folded into.
tilo-test-env = { path = "../../../tools/test-env" }
tilo-surface-compile = { path = "../tilo-surface-compile" }
# A doc example declares a record the surface can and cannot describe.
serde.workspace = true
