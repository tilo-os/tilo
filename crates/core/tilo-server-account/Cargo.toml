[package]
name = "tilo-server-account"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A server's offers to a person's account, read from what its hosted-VM service admits by and has metered, and followed as they change."

[dependencies]
jiff.workspace = true
# The hosted-VM service's control requests and metering; the keeper that wakes
# its windows is the VM program's, so this reads the crate without `supervisor`.
linux-vm = { path = "../../vm/linux-vm", default-features = false }
serde.workspace = true
serde_json.workspace = true
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# The sizes the plans a test sets up allow.
tilo-server-protocol = { path = "../tilo-server-protocol" }

[lints]
workspace = true
