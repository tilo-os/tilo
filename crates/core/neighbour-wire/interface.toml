    "crates/core/actions/src/framework.rs",
    "crates/core/actions/src/contract.rs",
    "crates/core/actions/src/entry.rs",
    "crates/core/collab-types/src/role.rs",
    "crates/core/action-policy/src/grant.rs",
    "crates/core/collab-types/src/workspace_id.rs",
    "crates/core/collab-types/src/peer.rs",
    "crates/core/collab-types/src/presence/shell.rs",
]
roots = ["Hello", "HelloAck", "HelloAck2", "HelloRefused", "NeighbourMsg", "DeviceAction", "SignedDeviceAction", "ActionServiceFrame", "crates/core/neighbour-wire/src/placement.rs:Answer", "crates/core/collab-types/src/op.rs:Run", "crates/core/collab-types/src/op.rs:RunRef"]

[opaque]
Uuid = "uuid::Uuid: 16 bytes"
Acting = "tilo_action_policy::Acting: who made a change, carried as the JSON text its history entry writes (ChangeClaim.invoker)"
Value = "serde_json::Value: any JSON value, carried as its text"
RemoteActionMessage = "tilo_actions::remote::RemoteActionMessage: the action-host vocabulary, carried as opaque postcard bytes and versioned by the server transport's remote-action envelope"
SignedInvocation = "tilo_actions::remote::SignedInvocation: the caller's own signed statement — the address, the hash of the arguments, the signature and the certificate — carried as its own wire form, never the arguments"

