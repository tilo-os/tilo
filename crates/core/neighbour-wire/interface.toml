    "crates/core/neighbour-wire/src/lib.rs",
    "crates/core/neighbour-wire/src/actions.rs",
    "crates/core/neighbour-wire/src/colorimetry.rs",
    "crates/core/neighbour-wire/src/hdr_metadata.rs",
    "crates/core/actions/src/document_sync.rs",
    "crates/core/neighbour-wire/src/retention.rs",
    "crates/core/neighbour-wire/src/unit_chain.rs",
    "crates/core/neighbour-wire/src/content.rs",
    "crates/core/tilo-user-identity/src/cert.rs",
    "crates/core/collab-types/src/artifact.rs",
