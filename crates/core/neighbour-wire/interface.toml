# Device ↔ device: the certified handshake to a host and the peer-sync
# messages two devices and their hosts exchange.
name = "peer"
version = 72
version_const = "crates/core/neighbour-wire/src/lib.rs:PEER_PROTOCOL_VERSION"
encoding = "postcard"
served_to_apps = false
sources = [
    "crates/core/tilo-server-protocol/src/auth.rs",
    "crates/core/tilo-server-protocol/src/transport.rs",
    "crates/core/tilo-server-protocol/src/refusal.rs",
