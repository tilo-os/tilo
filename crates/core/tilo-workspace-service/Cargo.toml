[package]
name = "tilo-workspace-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The workspace service every Tilo device runs and the server embeds: workspace governance, the member session stack, the device store beneath it, and on a device the apps it serves."
license = "MIT OR Apache-2.0"

[lib]
name = "tilo_workspace_service"
path = "src/lib.rs"

[features]
# The fixtures the service's tests and its embedders' tests build on: a
# certified test service and the devices around it, plus the store's test
# hooks and the identity store's, which the evidence those fixtures certify needs.
test-support = ["tilo-peer-state/test-support", "dep:tilo-test-env", "dep:tilo-surface-compile", "tilo-account-probe/test-support", "dep:rustls", "dep:tilo-identity", "tilo-identity/test-support"]
# Agents on the host: workspaces keep apps' confined replicas and hand their
# records' channel keys to pages, and the agents themselves run here
# ([`agents`]). Their turns write tilolang records through the store an app's window
# writes through, so they serve apps too.
agents = ["apps", "device-keys", "dep:tilo-broker-core", "dep:tilo-agent-session", "dep:collaboration", "dep:ui", "dep:tilo-model-gateway", "dep:tilo-environment", "dep:tilo-identity", "tilo-clock/local"]
# A device's own workspace service and the key service beside it: what every device and
# the server open, whether or not they serve apps. A key holder keeps the records its members
# write sealed and opens them with the channels' keys it holds.
device-keys = ["dep:tilo-workspace-keys", "dep:tilo-identity"]
# Content a record references, reaching the devices that may read it: what a host serves
# for its workspaces' records, with or without apps on top.
content = ["dep:tilo-broker-core", "dep:tilo-workspace-search"]
# A workspace's file tree held in the device's own service, its bytes on the records' route.
files = ["content", "dep:tilo-fs", "dep:fs-protocol", "dep:iroh-blobs", "dep:bytes", "dep:rustix", "dep:ui"]
# A session client's pages, read through the document core over the replica its engine admits
# into: what a session's tests read their workspace through.
session-pages = ["device-keys", "dep:tilo-session-client"]

# A device serves its apps: their wire, launch, actions, invocation journal and consent.
apps = ["dep:launcher", "dep:browser-continuity-core", "tilo-actions/asks", "dep:rustix", "dep:tilo-app-package", "content", "dep:tilo-identity", "device-keys", "dep:collaboration", "postcard/alloc", "tilo-files/json"]

[dependencies]
# The surface fixtures a test builds declare (test support): what the service stores is the compiled form.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile", optional = true }
# What a Bluetooth address is, for the record of the person's accessories.
tilo-bluetooth-address = { path = "../bluetooth-address" }
# The device's one store, which apps write and read their resources in.
tilo-resource-store = { version = "0.1.0", path = "../resource-store" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../action-policy" }
# Signs the evidence of the calls this host admits, as this device.
tilo-invocation-journal = { path = "../invocation-journal" }
# The device's search index, which `search#find` is answered from.
tilo-workspace-search = { path = "../workspace-search", optional = true }
tilo-clock = { path = "../../platform/tilo-clock" }
# Where the desktop service keeps its key, and where a workspace's files appear in the Files
# mount, which its access list names.
tilo-paths.workspace = true
web-time = { version = "1", features = ["serde"] }
tilo-peer-state = { path = "../tilo-peer-state" }
tilo-automerge-isolate.workspace = true
tilo-actions = { path = "../actions", features = ["answer-reads", "document-read"] }
tilo-remote-actions = { version = "0.1.0", path = "../remote-actions" }
tilo-invocations = { version = "0.1.0", path = "../invocations" }
# Where Nearby Send hands a file to an AirDrop receiver: the descriptors its helper inherits.
launcher = { path = "../launcher", optional = true }
tilo-server-protocol = { path = "../tilo-server-protocol" }
# A short invitation link names this host as every link names one.
tilo-reference = { path = "../reference" }
# What a planned machine's installation is to become: the destinations, disk
# rules and open choices its entry carries.
install-profile-model = { path = "../../os/install-profile-model" }
tilo-server-client = { path = "../tilo-server-client" }
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
tilo-user-identity = { path = "../tilo-user-identity" }
# The Wi-Fi passphrases the person's devices share are sealed to each of them.
tilo-seal = { path = "../tilo-seal" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true
getrandom.workspace = true
tilo-content = { path = "../content", default-features = false }
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
form_urlencoded.workspace = true
# A page drives no sockets or files: the link, the filesystem and the process
# are a native device's, and their drivers are target dependencies of their own.
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
thiserror.workspace = true
tracing.workspace = true
tilo-desktop-model = { path = "../../desktop/desktop-model" }
tilo-session-client = { path = "../session-client", optional = true }
# The toolkit-free Fluent catalogue the name it gives a workspace is read from.
tilo-history = { path = "../../sdk/tilo-history" }
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
key-group = { package = "tilo-key-group", path = "../key-group" }
neighbour-wire = { package = "tilo-neighbour-wire", path = "../neighbour-wire" }
sha2.workspace = true
tilo-agent-session = { path = "../agent-session", optional = true }
# A person's own provider, asked through the gateway's transport with the key
# their vault keeps: the wires, the stream reading and the price table are its.
tilo-model-gateway = { path = "../../integrations/model-gateway", default-features = false, features = ["host-backend"], optional = true }
ui = { package = "tilo-ui", path = "../../ui/ui-core", optional = true, features = ["model"] }
# Shortcuts and the events they fire on: what a saved shortcut holds, as its triggers and steps.
tilo-automation = { path = "../automation" }
# Resource identity, permissions and invocation leases: the model below the toolkit.
collaboration = { package = "tilo-collaboration", version = "0.1.0", path = "../collaboration", optional = true }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }

# The apps a device serves ([features] apps).
zeroize.workspace = true
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame", features = ["tokio"] }
tilo-app-package = { path = "../tilo-app-package", optional = true }
tilo-rt.workspace = true
futures = { workspace = true, default-features = true }
runtime-collab = { package = "tilo-runtime-collab", path = "../runtime-collab", features = ["settings-host"] }
tilo-identity = { path = "../tilo-identity", optional = true }
tilo-broker-core = { path = "../broker-core", optional = true }
tilo-workspace-keys = { path = "../workspace-keys", optional = true }
tilo-test-env = { path = "../../../tools/test-env", optional = true }
tilo-device-identity = { version = "0.1.0", path = "../tilo-device-identity" }
# The file tree's sync, which [features] files runs over this service's member copies.
tilo-fs = { package = "tilo-fs", path = "../fs", features = ["tree-sync"], optional = true }
fs-protocol = { package = "tilo-fs-protocol", path = "../fs-protocol", optional = true }
iroh-blobs = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The device's link, its files and its processes: what a page reaches through
# its own host instead, and holds over its own durable store.
iroh.workspace = true
iroh-base.workspace = true
n0-future = "0.3.2"
# Signs with an ssh key the vault keeps, inside this server (`vault.item:<id>#sign`).
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
# The address this host answers at once its endpoint reached a relay, which is
# what its workspaces' governance names of it.
tilo-endpoint-reachability = { path = "../endpoint-reachability" }
# A host's workspaces keep their files on a disk.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# The broker's local socket: a Unix socket, or a named pipe on Windows.
tilo-socket = { path = "../../platform/tilo-socket", features = ["tokio"] }
# The journal of the calls a host admits, whose evidence it signs as this device.
tilo-invocation-journal = { path = "../invocation-journal" }
# A host's device runs the runtime its own tasks drive.
tokio = { workspace = true, features = ["full"] }
# The certificates a test's mail server presents, which `trust_mail_servers` trusts.
rustls = { workspace = true, optional = true }
# The module a device installed, which a record's search reads the app through.
runtime-portal = { package = "tilo-runtime-portal", path = "../runtime-portal" }
tilo-app-package = { path = "../tilo-app-package" }
# The model runtime a package's module links against, fetched from the
# registry that offers the runtime bundle the package names when this host's
# image carries another release's.
app-cli = { path = "../../os/app-cli" }
# The default collection's app ids, compiled in: the apps a workspace made here starts with.
# Their compiled surfaces too, so the service judges the records of the programs a host runs
# against what every app of its workspace publishes.
fleet-catalogue = { package = "tilo-fleet-catalogue", version = "0.1.0", path = "../fleet-catalogue", features = ["surfaces"] }
# The releases this device's package cache already holds: a default app no registry answered for.
package-store = { package = "tilo-package-store", path = "../package-store" }
# A host's workspaces keep their content in directories.
tilo-content = { path = "../content", features = ["dir"] }
# The person's own accounts and model providers, kept beside their
# workspace: the shared account store and vault, the settings document the
# model configuration lives in, and the sign-in probes that reach a server a
# page cannot.
accounts = { package = "tilo-accounts", path = "../../integrations/accounts", features = ["person"] }
# Which vault items a workspace's machine hands its programs: a Terminal document.
tilo-environment = { path = "../../vm/environment", optional = true }
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
tilo-account-probe = { path = "../../integrations/account-probe" }
# The client registrations, token renewal and Nextcloud login flow a
# provider's own page leaves a person's account signed in with.
account-credentials = { path = "../../integrations/account-credentials", features = ["store"] }
# The sign-in a cloud mount is handed, in the shape the accounts answer it.
cloud-source = { package = "tilo-cloud-source", path = "../../integrations/cloud-source" }
# The cookies of a website session Browser opens a site with.
browser-continuity-core = { package = "tilo-browser-continuity-core", path = "../browser-continuity-core", optional = true }
tilo-oauth = { path = "../../integrations/tilo-oauth" }
# The calendar servers of the accounts a person keeps here.
tilo-dav = { path = "../../integrations/tilo-dav" }
# A device's cloud-storage mounts: sync now, pause and resume, read from the
# service that mounts them on this device.
tilo-fs-client = { path = "../tilo-fs-client" }
# The one request a person's model providers make from here: a provider's own
# list of models, asked with the key the vault keeps, through the client the
# fetch proxy guards its own requests with.
tilo-net = { path = "../../platform/tilo-net", features = ["http", "proxy-host", "blocking"] }
# What the agents on this server learned about a person: the type the list
# is kept as, and the verbs that change it.
tilo-resource = { path = "../tilo-resource" }
tilo-workspace-agent = { path = "../../sdk/tilo-workspace-agent" }
# The workspace resources the person's shell changes through their typed actions: a
# workspace's emoji and contact directory.
tilo-workspace-emoji = { path = "../tilo-workspace-emoji" }
tilo-contact-directory = { path = "../tilo-contact-directory" }
# A person's region and formats, kept as the `locale` settings section reads them.
tilo-formats = { path = "../../ui/tilo-formats" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
# Compiles the surface this crate publishes for the test that holds its file to it.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
# The launcher end of the handoffs the broker tests drive.
launcher = { path = "../launcher" }
# The stand-in authorization server a sign-in test walks the browser through.
tilo-oauth = { path = "../../integrations/tilo-oauth", features = ["fake"] }
# A fake OpenAI sign-in and model providers, for signing in on the real path.
fake-model-providers = { path = "../../../tools/fake-model-providers" }
# A dispatcher that answers as an app's own host: what a device's action service asks
# through, and what a workspace's host answers beside it.
tilo-actions = { path = "../actions", features = ["test-support"] }
tilo-workspace-search = { path = "../workspace-search", features = ["test-support"] }
# A direct link a test makes a reader fall behind, with the frames it hears
# bounded by the test rather than by what a live link holds.
tilo-peer-state = { path = "../tilo-peer-state", features = ["test-support"] }
# The store's continuity tests count each thread's heap.
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# The provider servers a person's key is shown to and their model is asked at
# in tests, on loopback, each speaking its provider's wire.
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }
# `iroh-relay`: the loopback relay a fixture host's endpoint takes as its home, so a
# host opens without waiting out the probe of an endpoint that reaches none.
tilo-test-env = { path = "../../../tools/test-env" }
# A loopback relay for the endpoints these tests start.
tilo-test-relay = { path = "../../../tools/test-relay" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# A test's mail server answers over real sockets, and the tester trusts its
# certificate, which no authority signed.
tilo-account-probe = { path = "../../integrations/account-probe", features = ["test-support"] }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["model"] }

# The apps the device serves, tested against.
tilo-workspace-keys = { path = "../workspace-keys", features = ["test-support"] }
tilo-identity = { path = "../tilo-identity", features = ["test-support"] }
rustls = { workspace = true }
tilo-clock = { path = "../../platform/tilo-clock", features = ["test-support"] }
tilo-resource = { path = "../tilo-resource" }

[lints]
workspace = true
