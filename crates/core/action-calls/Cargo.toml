[package]
name = "tilo-action-calls"
description = "Answering action calls against a provider: serving each request a peer sends, holding the answers that wait for an invocation to move, and the log that runs each invocation once."
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_action_calls"
path = "src/lib.rs"

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
tilo-actions = { path = "../actions", features = ["document-read", "answer-reads"] }
tilo-action-policy = { path = "../action-policy" }
tilo-test-env = { path = "../../../tools/test-env" }
serde = { version = "1.0", features = ["derive", "rc"] }
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
postcard = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
