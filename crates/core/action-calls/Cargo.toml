[package]
name = "tilo-action-calls"
description = "Answering action calls against a provider: serving each request a peer sends, holding the answers that wait for an invocation to move, and the log that runs each invocation once."
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_action_calls"
path = "src/lib.rs"

[features]
# Answering record reads on the async runtime of the process that asked: a follow's wait for a
# write runs out on a timer of it. A build that carries no runtime (an app's model module) leaves
# it off and answers a posted read as a provider that reads no records.
answer-reads = ["dep:tilo-rt"]

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
serde_json = { version = "1.0", features = ["raw_value"] }
# A reading's revision is the hash of what it reads.
blake3.workspace = true

[dev-dependencies]
tilo-actions = { path = "../actions", features = ["document-read", "answer-reads"] }
tilo-action-policy = { path = "../action-policy" }
tilo-test-env = { path = "../../../tools/test-env" }
tilo-rt = { version = "0.1.0", path = "../../platform/tilo-rt" }
automerge.workspace = true
serde = { version = "1.0", features = ["derive", "rc"] }
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
postcard = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

# A read is answered on a task of the runtime that asked, and its wait for a write is a timer of
# it (`answer-reads`). A `tilo_no_js` build (an app's model module) has no page, so no runtime: it
# serves no reads.
[target.'cfg(not(tilo_no_js))'.dependencies]
tilo-rt = { version = "0.1.0", path = "../../platform/tilo-rt", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
