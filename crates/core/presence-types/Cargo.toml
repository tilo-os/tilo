[package]
name = "tilo-presence-types"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Where a person's presence is and the colour they wear, as plain values."

[lib]
name = "tilo_presence_types"
path = "src/lib.rs"

# Plain values: the toolkit draws presence from them without the collaboration
# model, and the model's wire types are built on them.
[dependencies]
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["alloc"] }
blake3.workspace = true
hex.workspace = true
web-time = { version = "1", features = ["serde"] }
# The hue someone wears until they choose one, as every surface derives it.
tilo-face = { version = "0.1.0", path = "../../platform/tilo-face" }
# A member's hue is derived from who they are.
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32, where the toolkit
# reads these values.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# `scenario!`: one test function holds the cases of one subject.
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
