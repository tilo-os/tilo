# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ package service: the service the launcher hands the Store and Settings, and
# nothing else, and the person's own terminal (`tilo-install`, `app`) reaches. All
# speak postcard calls on its socket: the Store's resources and actions, Settings'
# language packs, whose operations only Settings may call, and the changes to the
# package store only the person's terminal may make. Its own number, apart from the
# runtime interface every app speaks.
name = "package-service"
version = 7
version_const = "crates/core/package-service/src/lib.rs:PACKAGE_SERVICE_INTERFACE_VERSION"
encoding = "postcard"
served_to_apps = true
sources = [
    "crates/core/package-service-client/src/wire.rs",
    "crates/core/package-service-client/src/client.rs",
]
roots = ["Call", "Frame", "Handoff", "Progress"]

[opaque]

