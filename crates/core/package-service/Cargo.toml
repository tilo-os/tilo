[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "package-service"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo package service — the privileged service over the device package store on a control socket: verified installs for the Store, pin, remove, launch and size-pressure eviction."

[[bin]]
name = "tilo-package-service"
path = "src/main.rs"
required-features = ["service"]

[lib]
name = "package_service"
path = "src/lib.rs"

[features]
# The daemon: the package store with its content store, installs, remote
# fetch and the control socket. The Store app depends on this crate with
# `default-features = false` and gets only the client side (the typed client,
# the wire and local-archive review), so an app never compiles the
# privileged service it talks to, and the shared app runtime never carries it.
default = ["service"]
service = [
    "package-store/store",
    "dep:bounded-command",
    "dep:app-cli",
    "dep:runtime-bundle",
    "dep:clap",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:libc",
    "dep:tempfile",
    "dep:sd-notify",
    "dep:app-registry",
    "dep:tilo-clock",
    "dep:semver",
    "dep:tilo-os-search",
]
test-support = ["dep:tilo-test-env"]
# Honour the developer-only environment overrides (`package_store::dev_env`)
# in a release build. Debug builds always honour them; shipped images never
# enable this.
dev-overrides = ["service", "package-store/dev-overrides"]

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-paths.workspace = true
tilo-files = { path = "../../platform/tilo-files" }
bounded-command = { path = "../../platform/bounded-command", optional = true }
tilo-app-package = { path = "../tilo-app-package" }
# The one package registry; the daemon (`service`) also writes its store and
# keeps none of its own.
package-store = { path = "../package-store" }
# The wire and the typed client, which `app` shares without depending on the service.
package-service-client = { path = "../package-service-client" }
# Payload blobs a thin package does not carry, from a registry server.
app-registry = { path = "../app-registry", optional = true }
tilo-clock = { path = "../../platform/tilo-clock", optional = true }
# The version requirement an update resolves against.
semver = { workspace = true, optional = true }
app-cli = { path = "../../os/app-cli", optional = true }
runtime-bundle = { path = "../runtime-bundle", optional = true }
runtime-portal = { path = "../runtime-portal", default-features = false }

# Async runtime + transport.
tokio = { workspace = true, features = ["macros", "io-util", "time", "sync"] }
wire-frame = { path = "../../platform/wire-frame", features = ["tokio", "postcard"] }

# Daemon plumbing.
clap = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
libc = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# Bounds the test transport's waits (`test-support`).
tilo-test-env = { path = "../../../tools/test-env", optional = true }

# systemd notify (sd_notify); missing environment variables are tolerated.
sd-notify = { workspace = true, optional = true }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sockets, files, signals and child processes: tokio builds none of them for
# wasm32, where the web desktop links the client's types with Settings.
tokio = { workspace = true, features = ["net", "fs", "signal", "process"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Registers the runtime's GNOME Shell and KRunner search providers after an install.
tilo-os-search = { path = "../../integrations/os-search", optional = true }

[dev-dependencies]
getrandom.workspace = true
tokio = { workspace = true, features = ["full"] }
ed25519-dalek.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"
required-features = ["service"]

[[bench]]
name = "install_timing"
path = "benches/install_timing.rs"
harness = false
required-features = ["service"]

[lints]
workspace = true
