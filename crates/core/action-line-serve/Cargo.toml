[package]
name = "tilo-action-line-serve"
description = "Answering the line wire as a provider: a line, a whole connection that keeps its uploads and waits between lines, and the shells an app's own connection carries."
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_action_line_serve"
path = "src/lib.rs"

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-calls = { version = "0.1.0", path = "../action-calls" }
tilo-action-line = { version = "0.1.0", path = "../action-line" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
serde_json = { version = "1.0", features = ["raw_value"] }
tracing.workspace = true

[dev-dependencies]
tilo-actions = { path = "../actions", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
blake3.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
