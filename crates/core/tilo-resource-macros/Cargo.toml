[package]
name = "tilo-resource-macros"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Procedural macros for tilo-resource."

# `#[derive(Model)]` and `#[resource]`: the declarations behind the resource
# layer's golden path. Generated code only calls `tilo_resource`'s public API.

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# `extra-traits`: the effect derive compares types (`PartialEq` on `syn::Type`), which the
# workspace gets from other crates but a build of the published crate does not.
syn = { version = "2", features = ["full", "extra-traits"] }
# `committed_surface!` reads an app's `surface.toml` while it builds.
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
