[package]
name = "tilo-permissions"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Who may do what in a workspace as a window asks it: the permission context over the workspace's grants and an app's sandbox, and what the host says of the actions a window shows."

# Pure data and pure evaluation over it: a window, the collab client and a host all decide with
# this crate, which reads nothing and holds no connection.

[dependencies]
tilo-action-types.workspace = true
tilo-member-types.workspace = true
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-actions = { version = "0.1.0", path = "../actions" }
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }
