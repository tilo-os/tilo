# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# App ↔ runtime: the session services the launcher connects an app to
# (collaboration, the filesystem and its document media, the identity
# broker, shell-owned tools), one number for all of them.
name = "runtime"
version = 37
version_const = "crates/core/runtime-portal/src/lib.rs:RUNTIME_INTERFACE_VERSION"
encoding = "postcard"
served_to_apps = true
sources = [
    "crates/core/tilo-identity-client/src/lib.rs",
    "crates/core/tilo-identity-client/src/profile.rs",
    "crates/core/runtime-portal/src/tools.rs",
    "crates/core/runtime-collab/src/wire.rs",
    "crates/core/runtime-collab/src/wire/shell.rs",
    "crates/core/runtime-collab/src/lib.rs",
    "crates/core/runtime-collab/src/shown_actions.rs",
    "crates/core/runtime-collab/src/action_directory.rs",
    "crates/core/runtime-collab/src/workspace_status.rs",
    "crates/core/collab-types/src/artifact.rs",
    "crates/core/collab-types/src/presence/payload.rs",
    "crates/core/collab-types/src/presence/bridged.rs",
    "crates/core/collab-types/src/inbound.rs",
    "crates/core/collab-types/src/peer.rs",
    "crates/core/collab-types/src/history.rs",
    "crates/core/collab-types/src/op.rs",
    "crates/core/collab-types/src/workspace_id.rs",
    "crates/core/collab-types/src/identity.rs",
    "crates/core/collab-types/src/claim.rs",
    "crates/core/collab-types/src/crypto.rs",
    "crates/core/collab-types/src/role.rs",
    "crates/core/collab-types/src/member.rs",
    "crates/core/action-policy/src/member.rs",
    "crates/core/action-policy/src/person.rs",
    "crates/core/action-policy/src/kind.rs",
    "crates/core/tilo-app-id/src/lib.rs",
    "crates/core/action-policy/src/grant.rs",
    "crates/core/collab-types/src/presence/hue.rs",
    "crates/core/actions/src/key.rs",
    "crates/core/actions/src/framework.rs",
    "crates/core/actions/src/entry.rs",
    "crates/core/content/src/lib.rs",
    "crates/core/collab-types/src/presence/shell.rs",
    "crates/core/tilo-fs-client/src/wire.rs",
    "crates/core/tilo-fs-client/src/lib.rs",
    "crates/core/tilo-fs-client/src/blobs.rs",
    "crates/core/tilo-fs-client/src/directory_types.rs",
    "crates/core/tilo-fs-client/src/entry_name.rs",
]
roots = ["Request", "Response", "ToolRequest", "ToolReply", "Call", "HostFrame", "FsRequest", "FsReply"]
# The shell-owned tools (`tools.rs`) are length-prefixed JSON on their own socket;
# the rest of this interface is postcard. Both share the interface's one version and
# are checked by the stricter rules, but a field left out of a JSON message is only
# left out, so only the postcard roots pin what a compact encoding carries.
json_roots = ["Request", "Response", "ToolRequest", "ToolReply"]

# The keywords a declared shape may use (an action's argument, its result): an
# app writes its declarations in them and the programs of the runtime check a
# call against what was written, so a word one side does not know is a call
# refused. No type carries them: each list is recorded a line a word, and a
# list that changes needs a higher version as a type that changes does.
words = [
    "crates/core/actions/src/params.rs:SCHEMA_ASSERTIONS",
    "crates/core/actions/src/params.rs:SCHEMA_ANNOTATIONS",
]

[opaque]
Uuid = "uuid::Uuid: 16 bytes"
Acting = "tilo_action_policy::Acting: who made a change, carried as the JSON text its history entry writes (ChangeClaim.invoker)"
EntryName = "one native filename component, serialized as its raw bytes"
Zeroizing = "zeroize::Zeroizing<String>: the text inside, wiped from memory once dropped"
SHELL_SECRET_BYTES = "the length of a one-use shell or vouch secret: 32"

