[package]
name = "tilo-server-protocol"
version = "0.1.0"
edition = "2024"
publish = true
description = "Shared value types of the Tilo server: the handshake and wire messages, mesh roles and placement, server configuration, home-peer registrations, workspace shard ids and the metrics snapshot."
license = "MIT OR Apache-2.0"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

# Clients of the server (the shell, Settings, Remote) read and write these
# records without linking the daemon. Keep this crate free of the server's
# transport, storage and sandbox dependencies: the frame codec belongs in
# `tilo-server-client`, the iroh endpoint, runtime and storage in `tilo-server`.
[dependencies]
# Crash-safe replacement of the metrics snapshot.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
# One rule for which language a locale names, shared with the packs.
tilo-paths = { version = "0.1.0", path = "../../platform/tilo-paths" }
# Certificates embedded in home-peer registrations and checked by the
# trust policy.
tilo-user-identity = { version = "0.1.0", path = "../tilo-user-identity" }
# The page's window link: a local stream, a Unix socket or a named pipe.
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
# `EndpointAddr` in mesh profiles and home-peer registrations.
iroh-base = { workspace = true, features = ["key"] }
serde.workspace = true
# What a person does on a page's element, in the page's one vocabulary.
tilo-headless-schema = { version = "0.1.0", path = "../../platform/headless-schema" }
# The call a page's view asks the browser to carry, in the vocabulary every call speaks.
runtime-collab = { package = "tilo-runtime-collab", version = "0.1.0", path = "../runtime-collab" }
# Signatures in handshake and delta messages travel as one byte string.
serde_bytes.workspace = true
serde_json.workspace = true
# A window shown on a page answers its device in frames, as a page's stream carries them.
wire-frame = { package = "tilo-wire-frame", version = "0.1.0", path = "../../platform/wire-frame" }
# The handshake signs and verifies challenge nonces with device keys.
ed25519-dalek.workspace = true
toml.workspace = true
thiserror.workspace = true
# Live frames have one canonical encoding the host re-checks before relaying.
postcard = { workspace = true, features = ["alloc"] }
# Live frames are sealed with their record's channel content keys.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
# The invocation a caller signs, beside the request it covers.
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-workspace-records = { path = "../workspace-records" }
# The work a member's delegation lets a server take, as the grants it names.
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# The peer protocol version the handshake carries and checks.
neighbour-wire = { package = "tilo-neighbour-wire", version = "0.1.0", path = "../neighbour-wire" }
# Agent and bot delegations and workspace shard ids, re-exported unchanged.
tilo-workspace-join = { version = "0.1.0", path = "../workspace-join" }
# How the boot opened its system volume, which the status reports.
tilo-unlock-protocol = { version = "0.1.0", path = "../tilo-unlock-protocol" }
blake3.workspace = true
hex.workspace = true
uuid.workspace = true
# A secret typed for a host's question is wiped once it is dropped.
zeroize.workspace = true

# Browser peers mint ids from JavaScript's entropy source.
tilo-device-identity = { version = "0.1.0", path = "../tilo-device-identity" }

[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
tempfile.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
