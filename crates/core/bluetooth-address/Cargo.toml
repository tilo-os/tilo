[package]
name = "tilo-bluetooth-address"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "What a Bluetooth address is: six colon-separated hex octets, as the radio and the record of a person's accessories both read one."

[lib]
name = "tilo_bluetooth_address"
path = "src/lib.rs"

# A std-only leaf: the record of a person's accessories and the BlueZ actions both check an
# address with it, so it pulls nothing in.
[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
