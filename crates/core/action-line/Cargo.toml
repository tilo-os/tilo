[package]
name = "tilo-action-line"
description = "One action frame per line: how a local socket carries the action wire, the client that asks on it, and the connection a launcher hands the programs it starts."
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_action_line"
path = "src/lib.rs"

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
hex.workspace = true
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tracing.workspace = true

[dev-dependencies]
tilo-action-services = { path = "../action-services", features = ["test-support"] }
tilo-test-env = { path = "../../../tools/test-env" }
blake3.workspace = true

[lints]
workspace = true

# A line client's connection is this login's local socket: a Unix socket, or a named pipe on Windows.
[target.'cfg(any(unix, windows))'.dependencies]
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
