[package]
name = "tilo-endpoint-reachability"
version = "0.1.0"
edition = "2024"
publish = true
license.workspace = true
description = "Hold an iroh endpoint's relays back until something needs the device dialable, and find the workspace's devices on the local network without telling anyone else."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_endpoint_reachability"
path = "src/lib.rs"

[features]
# `holders()`, which a test reads to say why the relays did not rest.
test-support = []

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The person's relay setting, which every endpoint of a device reads through `relays`.
settings-store = { version = "0.1.0", path = "../../system/settings-store" }
iroh.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
# The local network's sealed probes and replies (src/lan.rs): only the device a probe asks for opens
# it, and only the asker opens the reply.
tilo-seal = { version = "0.1.0", path = "../tilo-seal" }
tilo-user-identity = { version = "0.1.0", path = "../tilo-user-identity" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
ed25519-dalek.workspace = true
blake3.workspace = true
postcard = { workspace = true, features = ["alloc"] }
hex.workspace = true
serde_json.workspace = true
# The probes' multicast group, joined per network, on a port several sessions share.
socket2 = "0.6"
# iroh's address-lookup trait hands a lookup's results back as this stream.
n0-future = "0.3.2"
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Whether the clock is synchronised to a time source, before a probe sends its epoch.
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# The tests' home relay is a loopback one no test shares.
tilo-test-env = { path = "../../../tools/test-env", features = ["iroh-relay"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
