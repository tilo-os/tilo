[package]
name = "tilo-identity"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The app identity service: the identity broker apps sign through, the identity registry, the person's devices, and collaboration identity provisioning."

# No compositor: the desktop session and the standalone runtime both host it,
# each supplying its workspaces and channel service through the broker's traits.

[lib]
name = "tilo_identity"
path = "src/lib.rs"

[features]
# Compiles the throwaway test identity into a release build (dev images only).
throwaway-test-identity = []
# A device trust another crate's tests fill in themselves.
test-support = []

[dependencies]
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-paths.workspace = true
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
tilo-files = { path = "../../platform/tilo-files", features = ["json", "watch"] }
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
collab-admission = { package = "tilo-collab-admission", path = "../collab-admission" }
tilo-action-policy = { path = "../action-policy" }
# The action context the broker's tests record changes under.
tilo-actions = { path = "../actions" }
# The pairing code every screen of a pairing shows (`certification_ceremony::pairing_code`).
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core", "serde"] }
getrandom.workspace = true
hex.workspace = true
jiff.workspace = true
zeroize.workspace = true
libc.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# The public identity protocol the broker and the store share.
tilo-identity-client = { version = "0.1.0", path = "../tilo-identity-client" }
# Secret Service / Keychain providers for a secured identity.
tilo-secrets = { version = "0.1.0", path = "../../platform/tilo-secrets" }
serde_bytes.workspace = true
rand_core.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-desktop-model = { path = "../../desktop/desktop-model" }
tilo-server-protocol = { path = "../tilo-server-protocol" }
# The `tracing` target the session log keeps whatever `RUST_LOG` says, under
# which every certificate renewal a join depends on is reported.
tilo-startup-metrics = { version = "0.1.0", path = "../tilo-startup-metrics" }
tilo-user-identity = { path = "../tilo-user-identity" }
tilo-seal = { path = "../tilo-seal" }
tracing.workspace = true
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame", features = ["postcard"] }
tilo-device-identity = { version = "0.1.0", path = "../tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Compiles the surfaces its tests register.
tilo-surface-compile = { version = "0.1.0", path = "../tilo-surface-compile" }
tempfile.workspace = true
# A commenter's comment, as the change a notes window makes.
automerge.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[target.'cfg(unix)'.dev-dependencies]
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
# Reproduces malformed `secret_bytes` records written by an earlier identity
# ceremony, so the loader rejects those records.
sha2.workspace = true
serial_test.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
