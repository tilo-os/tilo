[package]
name = "tilo-agent-session"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "An agent in a workspace: its own certified device and root-signed delegation, apps driven through the same resource/action API a person uses, durable edits in the host's order, and a live cursor every member sees."

[lib]
name = "tilo_agent_session"
path = "src/lib.rs"

[dependencies]
tilo-action-services = { version = "0.1.0", path = "../action-services" }
tilo-peer-state = { path = "../tilo-peer-state" }
# Each record is a framework member of its app's resource kind; the
# published tree is the action API.
ui = { package = "tilo-app", path = "../../sdk/tilo-app", default-features = false }
tilo-actions = { path = "../actions" }
# A bot's record events: the dispatcher's event shape and its reader of
# recorded entries, shared with the shell.
tilo-automation = { path = "../automation" }
# The kinds of work a transform's model is chosen by.
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../integrations/provider-config" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
# Agents' sessions do their I/O on the host's runtime, or one of their own.
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The bounds and fixtures a unit test waits and builds with.
tilo-test-env = { path = "../../../tools/test-env", features = ["tokio"] }
# The grants a shortcut step's turn runs under, as a workspace decides them.
tilo-action-policy = { path = "../action-policy" }

[lints]
workspace = true
