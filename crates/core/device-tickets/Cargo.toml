[package]
name = "tilo-device-tickets"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "Issuing and serving tickets for a new computer, and naming and revoking the person's devices, as every device of theirs does it."
license = "MIT OR Apache-2.0"

[lib]
name = "tilo_device_tickets"
path = "src/lib.rs"

[features]
# The fixtures an embedder's tests issue tickets with.
test-support = ["tilo-workspace-service/test-support", "tilo-peer-state/test-support"]

[dependencies]
tilo-workspace-service = { path = "../tilo-workspace-service" }
tilo-action-services = { version = "0.1.0", path = "../action-services" }
accounts = { package = "tilo-accounts", path = "../../integrations/accounts", features = ["person"] }
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
tilo-device-identity = { version = "0.1.0", path = "../tilo-device-identity" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-peer-state = { path = "../tilo-peer-state" }
tilo-user-identity = { path = "../tilo-user-identity" }
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
futures = { workspace = true, default-features = true }
hex.workspace = true
iroh.workspace = true
iroh-base.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
workspace-hack = { version = "0.1" }

[lints]
workspace = true
