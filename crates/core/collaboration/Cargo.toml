[package]
name = "tilo-collaboration"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The collab client without the toolkit: what a process that commits to a Tilo workspace links, and the toolkit (`ui::collaboration`) builds on."

[features]
default = []
# The local session runtime: the identity the launcher bound, read through
# the identity client.
local-daemons = ["dep:runtime-portal", "dep:tilo-identity-client"]
# A native launch: the manager joins its workspace on the connection the launcher
# (or the shell, for a window it opened) handed the process.
native = ["local-daemons"]
# The collaboration manager's built-in transport: the collaboration wire's
# client on a worker thread (`broker`). Without it the manager is
# driven only through `CollaborationManager::with_transport`, and
# `CollaborationManager::new` starts disabled.
broker-transport = ["local-daemons", "runtime-collab/client", "tokio/full"]
# The fixtures the toolkit's own tests drive the manager, its committed reads
# and native construction with: the fake broker the tests stand up.
test-support = ["dep:tilo-test-env", "dep:tracing-subscriber", "runtime-collab/settings-host"]

[dependencies]
tilo-permissions.workspace = true
tilo-action-types.workspace = true
tilo-member-types.workspace = true
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
key-group = { package = "tilo-key-group", version = "0.1.0", path = "../key-group" }
# The members' content secret a record's content is sealed under.
tilo-seal = { version = "0.1.0", path = "../tilo-seal" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
# The clock (`crate::time`), background work and wake routing
# (`crate::background`, `crate::wake`), as the toolkit reads them.
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-rt.workspace = true
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
automerge.workspace = true
tilo-automerge.workspace = true
# Content a record references, carried on its route.
tilo-content = { version = "0.1.0", path = "../content", default-features = false }
# The channel settings the shell hands an app (personal dictionary).
settings-store = { package = "tilo-settings-store", version = "0.1.0", path = "../../desktop/settings" }
settings-model = { package = "tilo-settings-model", version = "0.1.0", path = "../../sdk/settings-model" }
registry-types = { package = "tilo-registry-types", version = "0.1.0", path = "../registry-types" }
tilo-startup-metrics = { version = "0.1.0", path = "../../platform/startup-metrics" }
serde.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
thiserror.workspace = true
rand_core.workspace = true
zeroize.workspace = true
tilo-test-env = { version = "0.1.0", path = "../../../tools/test-env", optional = true }
tracing-subscriber = { workspace = true, optional = true }
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# A document's history as versions, and what the schema genesis is: the
# steps undo reads (`history_source`).
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
tilo-doc = { version = "0.1.0", path = "../../sdk/tilo-doc" }
# The actor a handle writes as from one device (`history_source::authors`).
sha2.workspace = true
# The local document action report is the broker SDK's vocabulary.
runtime-collab = { package = "tilo-runtime-collab", version = "0.1.0", path = "../runtime-collab", default-features = false }
runtime-portal = { package = "tilo-runtime-portal", version = "0.1.0", path = "../runtime-portal", optional = true }
tilo-identity-client = { version = "0.1.0", path = "../tilo-identity-client", optional = true }
# The host inputs (who this process is, where its files live), as the toolkit
# reads them, without the toolkit's host services.
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Who sits at this device, below the collab client and the toolkit alike.
tilo-local-identity = { version = "0.1.0", path = "../../platform/local-identity" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
# A file's durable record id is the `user.tilo.document-id` attribute
# `tilo-files` keeps; record ids hash paths with a fixed FNV-1a.
tilo-files = { version = "0.1.0", path = "../../platform/tilo-files" }
fs-protocol = { package = "tilo-fs-protocol", version = "0.1.0", path = "../fs-protocol" }
blake3.workspace = true
hex.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-automerge = { workspace = true, features = ["heap-probe"] }
runtime-collab = { package = "tilo-runtime-collab", path = "../runtime-collab", features = ["settings-host"] }
tracing-subscriber.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The tests read the toolkit's host inputs from the process environment.
tilo-process = { version = "0.1.0", path = "../../platform/tilo-process", features = ["native"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { workspace = true, features = ["wasm_js"] }

# The package is published as tilo-collaboration; code names it by its library.
[lib]
name = "collaboration"
