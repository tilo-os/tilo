[package]
name = "tilo-reference"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
description = "Addresses of things in documents: a selection in any app carried as a resource reference beside the text, so whoever reads it knows what \"this\" meant."
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_reference"
path = "src/lib.rs"

# Pure state layer — no `ui`, `winit` or render deps — so the toolkit, any app
# and an out-of-process member can all build on it.

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
# A reference is a stored value of the records that keep one.
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
# The app a link opens, named as every other crate names it.
tilo-app-id.workspace = true
automerge = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tilo-automerge = { path = "../tilo-automerge" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
