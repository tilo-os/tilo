[package]
name = "tilo-surface-compile"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Writes an app's surface.toml from what its code publishes, and compiles it into the canonical compiled surface the system commits, addresses, hashes and sends."

[lib]
name = "tilo_surface_compile"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-canonical-json = { version = "0.1.0", path = "../../platform/tilo-canonical-json" }
toml.workspace = true
sha2.workspace = true
tilo-actions = { version = "0.1.0", path = "../actions" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The pinned address of a compiled surface.
blake3.workspace = true
hex.workspace = true
