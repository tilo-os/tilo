[package]
name = "tilo-resource-plain"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Resource vocabulary that needs no store or CRDT: text splices, search scopes, item kinds, emoji names."

[lib]
name = "tilo_resource_plain"
path = "src/lib.rs"

