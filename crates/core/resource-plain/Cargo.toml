[package]
name = "tilo-resource-plain"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Resource vocabulary that needs no store or CRDT: text splices, search scopes, item kinds, emoji names, catalogue keys, history entry ids, profiling scopes."

[lib]
name = "tilo_resource_plain"
path = "src/lib.rs"

# A leaf: the toolkit reads these without Tilo's model, and `tilo-resource` publishes them.
[dependencies]
serde.workspace = true
# The history entry id spells itself as the activity wire does.
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32: an app's model
# module links this crate, and the hack's `getrandom/wasm_js` breaks its custom backend.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
