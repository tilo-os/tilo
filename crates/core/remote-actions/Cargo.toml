[package]
name = "tilo-remote-actions"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The remote action machinery only its hosts and processes need, beside the types tilo-actions keeps: the asked records a host keeps, and an app's sign-in reads."

[lib]
name = "tilo_remote_actions"
path = "src/lib.rs"

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-services = { version = "0.1.0", path = "../action-services" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
hex.workspace = true
blake3.workspace = true
serde_json.workspace = true
zeroize.workspace = true
serde = { version = "1.0", features = ["derive"] }

# An app's sign-in reads go over its device's local socket: a Unix socket, or a named pipe on
# Windows.
[target.'cfg(any(unix, windows))'.dependencies]
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }

[dev-dependencies]
# The tests read documents as JSON and answer reads on a runtime, as tilo-actions' own do.
tilo-actions = { path = "../actions", features = ["document-read", "answer-reads"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
