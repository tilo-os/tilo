[package]
autotests = false
name = "tilo-resource-store"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The resource store: every resource of a workspace in documents it places itself, indexed in the commit that changes it, with paged, filtered and counted queries, whichever language declared it."

[dependencies]
# How a document id names its reader set, which every device and server reads the same way.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
# The surface an app publishes from its typed model: the collections and fields it stores.
tilo-actions = { version = "0.1.0", path = "../actions" }
# A committed document, read in the stored layout its surface declares.
automerge.workspace = true
# The index's snapshot of a document, which a start reads instead of the document.
serde.workspace = true
postcard = { workspace = true, features = ["alloc"] }
# The action a change names, in the change's message.
serde_json.workspace = true
# Bytes in a command or reply travel as base64 text.
base64.workspace = true
# A document's history: its versions and the action each names, and how a step is grouped.
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
# Whether a version is the schema's genesis rather than anyone's step.
tilo-doc = { version = "0.1.0", path = "../../sdk/tilo-doc" }
tilo-sort = { version = "0.1.0", path = "../../platform/tilo-sort" }
# What wrote a change, when a device recorded a writer beside it.
fs-protocol = { package = "tilo-fs-protocol", version = "0.1.0", path = "../fs-protocol" }
# Actors are named by their bytes in hex.
hex.workspace = true
# A history feed names the run it was read in.
uuid.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[[bench]]
name = "write_rate"
path = "benches/write_rate.rs"
harness = false

[lints]
workspace = true
