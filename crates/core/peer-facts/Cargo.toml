[package]
name = "tilo-peer-facts"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Who is on the other end of a local socket: the kernel's account of the caller, the process that opened it, its executable, and whether it shares this process's namespaces"

[lib]
name = "peer_facts"
path = "src/lib.rs"

[dependencies]
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tilo-files = { path = "../../platform/tilo-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
# Which account the reader runs as, in its tests.
rustix = { workspace = true, features = ["process"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
