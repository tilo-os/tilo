[package]
name = "tilo-live"
version = "0.1.0"
edition = "2024"
publish.workspace = true
description = "The live session: a moq-lite session per device per scope, a relay that copies sealed bytes and admits from certificates and the roster, the sealing of every frame under its scope's keys, and the tilo-voice/1 and tilo-video/1 object profiles."
license.workspace = true

[features]
default = []
# One device's sealed session in one scope: the namespace of one device
# in one scope, the tracks within it and their delivery, the sealing under
# the scope's channel keys, and the admission a device runs on it.
# Builds for the page, which publishes and reads them itself.
live_session = ["dep:moq-net", "dep:hex", "dep:n0-future"]
# An app's call lane: the call one app's connection carries into a workspace's call, published
# through the session the device's daemon holds.
# A bridged call's speakers are mixed into the one stream its service takes.
app_call = ["live_session", "mix", "dep:tilo-actions", "dep:tokio", "tokio/rt"]
# Several speakers' Opus frames as one stream, a frame every 20 ms. libopus is built from source
# by opusic-sys (cmake).
mix = ["dep:opus"]
# The relay: the copying and admitting half, which runs on the device that
# serves a live session.
relay = ["live_session", "dep:bytes", "dep:tokio", "dep:serde_json"]
# The carrier over a direct iroh connection, the one every device dials, a
# page included: the client half only (`live_session`), so it builds for the browser.
# The listening half a device that serves a live session runs is `relay`'s.
iroh = ["live_session", "dep:iroh", "dep:bytes", "dep:serde_json"]

[dependencies]
# The scope of a track is a channel of an app's record.
collab-types = { package = "tilo-collab-types", version = "0.1.0", path = "../collab-types" }
# An app's call lane speaks the action wire its connection carries, and the call's own messages.
tilo-actions = { path = "../actions", optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# Presence stamps and the clock a call bridge keeps its frames by.
tilo-clock = { path = "../../platform/tilo-clock" }
thiserror.workspace = true
bytes = { workspace = true, optional = true }
# The relay's copying and admission run on whatever executor the host drives them from, so the
# crate asks tokio only for its channels and timers; a runtime is the caller's.
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "sync", "time"] }
# A frame names its stream in a stream's handshake; a carrier's handshake is
# serde too.
serde = { workspace = true, features = ["derive"] }
# What a shared window's viewers and host say to each other is one postcard value per object.
postcard = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, optional = true }
moq-net = { workspace = true, optional = true }
# Plain future polling: the client carrier runs in a page as it does natively.
n0-future = { version = "0.3", optional = true }
hex = { workspace = true, optional = true }
opus = { version = "0.4", optional = true }
# A track is sealed and opened under the scope's channel keys, as a call's
# frames are: the sealing is this crate's, and the keys are the channel's.
key-group = { package = "tilo-key-group", version = "0.1.0", path = "../key-group" }
tilo-seal = { version = "0.1.0", path = "../tilo-seal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = { workspace = true, optional = true }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A page reaches a server that takes no WebTransport (one behind a NAT) through its packet
# relay, over iroh's browser endpoint: relay-only, no UDP. Its live session rides that too.
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
serde_json.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "live_native"
required-features = ["relay", "iroh"]

[[test]]
name = "live_session"
required-features = ["relay", "iroh"]

[[test]]
name = "live_link"
required-features = ["relay", "iroh"]

[[test]]
name = "link_call"
required-features = ["relay", "iroh"]

[lints]
workspace = true
