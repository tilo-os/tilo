[package]
name = "launcher-windows"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Confinement for Tilo apps on Windows: an AppContainer of each app's own, granted only its declared paths, in a job its starter holds."

# The Linux launcher (`crates/core/launcher`) is bubblewrap, Landlock and
# seccomp, and `launcher-macos` a Seatbelt profile; this is the same decision's
# Windows mechanism. Everything here is Windows code: on other platforms the
# crate is empty.

[lib]
name = "launcher_windows"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
runtime-portal = { version = "0.1.0", path = "../runtime-portal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

[target.'cfg(windows)'.dev-dependencies]
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
tempfile.workspace = true

[lints]
workspace = true
