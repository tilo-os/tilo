[package]
name = "package-service-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Package service's wire and typed client: how the Store, Settings, `app` and `tilo-install` reach the device's package store."

[dependencies]
hex.workspace = true
tilo-paths.workspace = true
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }
tilo-app-package = { path = "../tilo-app-package" }
# The rows the client lists, read from the one package registry.
package-store = { path = "../package-store" }
runtime-portal = { path = "../runtime-portal", default-features = false }
tokio = { workspace = true, features = ["macros", "io-util", "time", "sync"] }
wire-frame = { path = "../../platform/wire-frame", features = ["tokio", "postcard"] }
serde_json.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sockets: tokio builds none for wasm32, where the web desktop links the
# client's types with Settings.
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
