[package]
name = "tilo-fleet-catalogue"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "What every Tilo app's signed manifest tells people about it, compiled in: names, keywords, platforms, documents, closed actions and surfaces."
repository.workspace = true
homepage.workspace = true

[features]
# Each app's whole signed `surface.toml` compiled in: what a server that runs a hosted
# workspace's programs compiles them against. An app and the web desktop need only the
# metadata, and leave it off.
surfaces = []

[lib]
name = "fleet_catalogue"
path = "src/lib.rs"

[dependencies]
tilo-app-id.workspace = true

# `build.rs` reads each app's committed `fleet.json`: JSON in, Rust out, no app compiled.
[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
