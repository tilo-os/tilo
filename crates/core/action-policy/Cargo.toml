[package]
name = "tilo-action-policy"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Who may invoke which action: grants over the published tree and the one function that decides them."

[lib]
name = "tilo_action_policy"
path = "src/lib.rs"

# Pure data and pure functions: every action API, every host, the server and the
# browser decide with this crate; tilo-clock's types accept the browser's
# wall clock as well as the native one.

[dependencies]
tilo-member-types.workspace = true
blake3 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["rc"] }
# A direct conversation's id names its members as JSON.
serde_json.workspace = true
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
# A member says who wears its presence colour.
tilo-presence = { version = "0.1.0", path = "../../platform/tilo-presence" }
# The record kinds the apps' manifests declare private (`[resources] private`).
app-fleet = { package = "tilo-app-fleet", version = "0.1.0", path = "../../desktop/app-fleet" }
uuid.workspace = true

# A conversation id is a v4 id. A browser page fills it from `crypto.getRandomValues` through
# uuid's js feature; a `tilo_no_js` build has no page and takes getrandom's configured backend,
# which a model build answers itself, so no wasm-bindgen glue reaches a model runtime.
[target.'cfg(all(target_family = "wasm", target_os = "unknown", not(tilo_no_js)))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown", tilo_no_js))'.dependencies]
uuid = { workspace = true, features = ["rng-getrandom"] }

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
