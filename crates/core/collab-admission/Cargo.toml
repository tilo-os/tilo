[package]
autotests = false
name = "tilo-collab-admission"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Deciding received document ops by the untrusted changes they carry."

[lib]
name = "collab_admission"
path = "src/lib.rs"

[dependencies]
tilo-action-types.workspace = true
tilo-member-types.workspace = true
tilo-collab-types = { version = "0.1.0", path = "../collab-types" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-actions = { version = "0.1.0", path = "../actions" }
automerge.workspace = true
tilo-automerge-isolate.workspace = true
web-time = "1"

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
postcard = { workspace = true, features = ["alloc"] }
uuid.workspace = true
# `scenario!`: one test function holds the cases of one subject.
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
