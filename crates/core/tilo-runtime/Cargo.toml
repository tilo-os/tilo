[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "tilo-runtime"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "This computer's one Tilo daemon: the login's device, private profile, native endpoint, app attachment and the MCP projection of the action host."

# Deliberately free of the compositor: `device` hosts the shared broker and
# identity service itself, so this crate builds on stock macOS and on Linux
# without a Wayland stack. The `tilo-runtime` executable is crates/os/daemon,
# which mounts the optional subsystems on it ([`device::capabilities`]).

[lib]
name = "tilo_runtime"
path = "src/lib.rs"

[features]
# Honour the developer environment overrides, in the crates this host reads a
# device's installed packages and identity through, exactly as a dev build of
# the desktop does. NEVER SHIP THIS: it accepts fixed credentials from the
# environment (tools/policy/check_dev_overrides_contract.py).
dev-overrides = ["tilo-identity/throwaway-test-identity", "package-store/dev-overrides", "launcher/dev-overrides"]
# A machine that keeps a public workspace runs the apps and agents that answer in
# it: the server's agent session, which links every web app.
agents = ["dep:linux-vm"]
# Lets a test hand a session it runs in its own process the shell's end of a link the daemon
# made ([`daemon::Running::link_shell`]), a test's daemon start the test build of the session
# as its person's shell ([`daemon::TEST_SHELL_ENV`]), which is not installed beside it, and a
# test start a host that keeps more on its own endpoint ([`device::keep::server::Server::start`]).
# A production start never builds it: its shell is the session installed beside the daemon, and
# what it keeps it keeps on the daemon's endpoint. It also gives an embedder's tests the fixtures
# they issue tickets for a new computer with ([`device::issuing::test_support`]).
test-support = ["tilo-workspace-service/test-support", "tilo-peer-state/test-support"]

# The integration tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

# What an active member costs a server in CPU, memory and egress: the scheduled job's `server`
# group (tools/ci/perf-scheduled.sh). An example, not a binary, so images that build `--bins`
# leave it out; its unit tests run as a test target. It starts its server as a test does.
[[example]]
name = "server_load"
test = true
required-features = ["test-support"]

[dependencies]
futures = { workspace = true, default-features = true }
if-addrs = { version = "0.15.0", default-features = false }
iroh-base.workspace = true
tilo-action-services = { version = "0.1.0", path = "../action-services", features = ["test-support"] }
tilo-action-line = { version = "0.1.0", path = "../action-line" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-action-policy = { path = "../action-policy" }
tilo-paths.workspace = true
tilo-machine.workspace = true

# The secret stores a moved device's keys are read from and forgotten in once moved.
tilo-seal = { path = "../tilo-seal" }
tilo-secrets.workspace = true
tilo-clock = { path = "../../platform/tilo-clock" }
# Where this device is, read here and answered as the device's own action (src/device/location.rs).
tilo-location = { path = "../../platform/tilo-location" }
tilo-advisory-lock = { path = "../../platform/advisory-lock" }
# `watch`: a development device follows reinstalls of the apps its tilolang hosts run.
tilo-files = { path = "../../platform/tilo-files", features = ["watch"] }
# The API socket the daemon serves on its tokio runtime.
tilo-socket = { path = "../../platform/tilo-socket", features = ["tokio"] }
# A secret a person copies from the vault goes to their session's clipboard, from here.
tilo-clipboard = { version = "0.1.0", path = "../../platform/tilo-clipboard" }
anyhow.workspace = true
automerge.workspace = true
# Seals and opens the channel state this device keeps for its encrypted routes.
key-group = { package = "tilo-key-group", path = "../key-group" }
# The hint a joining device is handed of the server it enters its workspace through.
tilo-delivery-protocol = { path = "../tilo-delivery-protocol" }
# Bounds the lines a tilolang process writes to its stderr.
wire-frame = { package = "tilo-wire-frame", path = "../../platform/wire-frame" }
blake3.workspace = true
# The bytes and content addresses a joined workspace's files hydrate with.
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
fs-protocol = { package = "tilo-fs-protocol", path = "../fs-protocol" }
ed25519-dalek.workspace = true
# The random key sealing the channel state.
getrandom.workspace = true
hex.workspace = true
# A secret the old keeper hands the vault is wiped from this process's memory.
zeroize.workspace = true
futures-util.workspace = true
# The endpoint joined workspaces sync over, keyed by this device's key.
iroh.workspace = true
# The relays that endpoint uses, as the person set them, held back until
# something needs this device reachable.
tilo-endpoint-reachability = { path = "../endpoint-reachability" }
iroh-blobs.workspace = true
package-store = { package = "tilo-package-store", path = "../package-store" }
# The tilolang hosts this device runs: the link each is handed (which the
# process-boundary tests also drive as an app inside a login does), the sealed
# module, and the log targets a launch's latency and an app's output are kept
# under.
runtime-portal = { package = "tilo-runtime-portal", path = "../runtime-portal" }
tilo-render-protocol = { path = "../../ui/tilo-render-protocol" }
tilo-startup-metrics = { path = "../../platform/startup-metrics" }
# The installed applications this runtime launches, read through their signed
# manifests.
app-catalogue = { path = "../app-catalogue" }
# Existing certified Join encoder; no new wire schema or credential.
runtime-collab = { package = "tilo-runtime-collab", path = "../runtime-collab", default-features = false }
runtime-fs = { package = "tilo-runtime-fs", path = "../runtime-fs" }
tilo-identity-client = { path = "../tilo-identity-client" }
serde.workspace = true
serde_json.workspace = true
# The digests a check's receipt carries of what the host observed.
sha2.workspace = true
tilo-actions = { path = "../actions", features = ["answer-reads", "document-read"] }
tilo-remote-actions = { version = "0.1.0", path = "../remote-actions" }
tilo-invocations = { version = "0.1.0", path = "../invocations" }
# The app id of the one app this device's server settings are read and changed for.
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
# The resource layer: this device's server settings are published as one of this device's typed
# resources, with the actions that change them.
tilo-resource = { version = "0.1.0", path = "../tilo-resource" }
# Where a workspace's resources open on the web: the entry the server that keeps it announces,
# which its apps mint a resource's link under.
tilo-reference = { version = "0.1.0", path = "../reference" }
tilo-automerge-isolate.workspace = true
tilo-desktop-model = { path = "../../desktop/desktop-model" }
# The document-media capability over the content store, and the workspace
# files mirrored into a folder where nothing mounts them.
tilo-fs = { package = "tilo-fs", path = "../fs", features = ["tree-sync"] }
tilo-app-package = { path = "../tilo-app-package" }
tilo-identity = { path = "../tilo-identity" }
# The surface an app under development names (`app_surface`), and the
# runtime's own words (consent prompt, device grants), from Fluent. The
# broker links it on every platform already.
# The one per-user index the host's own search reads.
tilo-os-search = { path = "../../integrations/os-search" }
# The native request an app hands a host search result back with.
tilo-host-search = { path = "../../integrations/tilo-host-search" }
tilo-peer-state = { path = "../tilo-peer-state" }
# The record commands Terminal's environments are read and written with.
tilo-resource-store = { path = "../resource-store" }
# The neighbour wire messages joined workspaces exchange.
neighbour-wire = { package = "tilo-neighbour-wire", path = "../neighbour-wire" }
# The workspace host every device runs, which the profile's own workspace is placed on. Its agents
# are the ones this machine runs for the workspaces it holds, on every platform it serves.
tilo-workspace-service = { path = "../tilo-workspace-service", features = ["agents", "apps", "device-keys", "files"] }
tilo-workspace-records = { path = "../workspace-records" }
tilo-person-services = { path = "../person-services", features = ["agents", "apps", "device-keys"] }
tilo-app-host = { path = "../app-host", features = ["agents", "files"] }
# The device's search index, which `search#find` is answered from.
tilo-workspace-search = { path = "../workspace-search" }
# The host services the broker is built with, the person's own devices among them.
tilo-broker-core = { path = "../broker-core" }
# An app's records are founded and written through a confined worker of this executable.
tilo-agent-session = { path = "../agent-session" }
# The person's saved chords, which a shortcut's keyboard trigger may not take.
settings-store = { package = "tilo-settings-store", path = "../../desktop/settings" }
# The groups a device's key service settles, and what their members seal is checked against.
tilo-workspace-keys = { path = "../workspace-keys" }
# The relay of the workspaces this device serves, and the person's desktop session's links into
# it or on to another device's.
tilo-live = { path = "../tilo-live", features = ["relay", "iroh", "app_call"] }
# This computer's login, the daemon's place, and Tilo's API the daemon serves as the device.
tilo-api = { path = "../tilo-api" }
# The one migration engine, served as this device's actions.
tilo-migrate = { path = "../../import/migrate" }
rand.workspace = true
# The content store app surfaces are read from.
# The apps' store: the device content store when the launcher handed one over.
tilo-content = { path = "../content" }
tilo-content-device = { path = "../content-device" }
# The workspace store this device holds for the workspaces it belongs to, and
# the admission API it answers with: the engine's own membership.
tilo-session-actions = { path = "../session-actions" }
# A workspace host's signed address, which a key enters a workspace at.
tilo-server-client = { path = "../tilo-server-client" }
tilo-unlock-protocol = { path = "../tilo-unlock-protocol" }
postcard.workspace = true
tilo-server-protocol = { path = "../tilo-server-protocol" }
tilo-rt.workspace = true
# The errors a compute job fails with.
thiserror.workspace = true
# `tilo mcp`'s agent says its word on the person's session as a client of the workspace's board.
tilo-session-client = { path = "../session-client" }
tilo-mcp = { path = "../tilo-mcp" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-user-identity = { path = "../tilo-user-identity" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true

# Mounts the workspace files where this user can mount FUSE.
tilo-device-identity = { version = "0.1.0", path = "../tilo-device-identity" }
# The toolkit the Unix launch edge and its surface files are read with.
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["model"] }
# What a device whose machine is a server keeps beyond its own copies (`device::keep`): the
# packet relay it is reached through and runs, and the web listener its pages, certification
# and entry are served on.
iroh-relay = { version = "1.0.3", features = ["server"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body = "1"
http-body-util = "0.1"
bytes.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
# A server's development certificate, which a page pins.
rcgen.workspace = true
# Web Push to a person's browsers: P-256 agreement and signing, HKDF and AES-GCM, from the crate
# TLS already builds; certificates' canonical encoding in install bodies.
ring = "0.17"
base64.workspace = true
# The keyed hash of a visitor's address the entry's wait-list windows count.
hmac.workspace = true
# The fetch proxy a page's apps reach the web through, the page's WebTransport, and the mail
# the entry sends over HTTPS.
tilo-net = { path = "../../platform/tilo-net", features = ["http", "json", "proxy-host"] }
# The page's face (Tilo Sans), whose web cuts a server serves beside its pages.
tilo-font-catalog = { path = "../../platform/font-catalog", features = ["web"] }
# A file the folder mount wrote is a manifest of chunks, which a kept workspace's content
# and its branches read.
fs-content = { package = "tilo-fs-content", path = "../fs-content" }
tilo-automerge.workspace = true
# How much of the disk holding a server's state is free.
host-fs = { path = "../host-fs" }
# A planned machine's disk rule and open choices are the installer's own model.
install-profile-model = { path = "../../os/install-profile-model" }
# A server's rollback floor moves by approvals the person's floor key signs.
tilo-rollback = { path = "../../os/tilo-rollback" }
tilo-crypto = { path = "../tilo-crypto", default-features = false }
# What a server's account standing is read from, and the machine sizes the Browser page actions
# it counts are billed at (`agents`).
linux-vm = { path = "../../vm/linux-vm", optional = true, default-features = false }

# The launcher's manifest view, service names and developer-override check;
# its binary builds every Linux app sandbox.
launcher = { path = "../launcher" }
# The device's package cache: its published actions are this library's changes.
package-actions = { path = "../package-actions" }
# What a capture's `--headless-drive` spec writes, which its launch is granted.
tilo-headless-schema = { version = "0.1.0", path = "../../platform/headless-schema" }
# The repositories a version the workspaces run is fetched from.
app-cli = { path = "../../os/app-cli" }
# The surface a package carries, checked against the one the workspace records.
app-registry = { package = "tilo-app-registry", path = "../app-registry" }
# Whether a package names a runtime build, which the cache installs before the app.
registry-types = { package = "tilo-registry-types", path = "../registry-types" }
# Where a fetched package is staged before the cache installs it.
tempfile.workspace = true
# How long a runtime build nothing runs on is kept before the cache collects it.
runtime-bundle = { package = "tilo-runtime-bundle", path = "../runtime-bundle" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# Who is on the other end of a connection: the kernel's account and process at the other end.
tilo-peer-facts = { path = "../peer-facts" }
# The log a daemon keeps trims, and the socket it stops taking connections at.
rustix = { workspace = true, features = ["fs", "net", "std"] }

# The shell an app opens where Linux's shell runtime does not run: this computer's own login
# shell, on a pty (ConPTY on Windows).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
portable-pty = { version = "0.9.0" }

# Every tilolang process a Windows device starts runs in an AppContainer of its app's own.
[target.'cfg(windows)'.dependencies]
launcher-windows = { path = "../launcher-windows" }
# The workspace's trust list, read through the desktop's action API.
tilo-control = { path = "../../desktop/control-cli" }
# What powers the machine: whether an app's long-lived connection runs now.
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The one compiler in the device: each tilolang module is compiled here, ahead of the process
# that runs it, and cached by module, wasmtime version, configuration and target. The processes
# it hands modules to link wasmtime's runtime alone.
tilo-wasm-aot = { path = "../../platform/tilo-wasm-aot", features = ["compile"] }

[target.'cfg(target_os = "linux")'.dependencies]
fleet-catalogue = { package = "tilo-fleet-catalogue", version = "0.1.0", path = "../fleet-catalogue", features = ["surfaces"] }
fuser.workspace = true
# The desktop's daemon runs the checks its projects' hosts approved, and a check's commands are
# ush's own: a device with no Linux shell to run them with carries none of it.
ush = { path = "../../vm/ush", features = ["quic"] }
# The environment record a workspace's machine is: the daemon reads the records its workspace
# keeps as any other record of it, and publishes them to the apps it serves.
tilo-environment = { path = "../environment" }

# App Sandbox or Seatbelt: how every app launches on stock macOS.
[target.'cfg(target_os = "macos")'.dependencies]
# The workspace's trust list, read through the desktop's action API.
tilo-control = { path = "../../desktop/control-cli" }
launcher-macos = { path = "../launcher-macos" }
# The file chooser a confined app asks this runtime to show, and the one this runtime serves a
# hosted app: the files a person chooses for it, kept by reference.
tilo-dialogs = { path = "../../platform/tilo-dialogs" }
# The camera and microphone a confined app asks this runtime to capture.
tilo-capture = { path = "../../engines/tilo-capture", features = ["camera", "microphone"] }
# The runtimes Tilo.app carries install through the one installer on first start.
package-store = { package = "tilo-package-store", path = "../package-store", features = ["store"] }

[dev-dependencies]
# What a server keeps, as its tests exercise it: a folder's zip read back, a page's fetch, the
# surfaces its changes are decided against, the content an app reaches its store with, and
# the offloadable action and machine plan its journeys run.
zip.workspace = true
# The load example's command line.
clap.workspace = true
test-http = { package = "tilo-test-http", path = "../../../tools/test-http" }
tilo-surface-compile = { path = "../tilo-surface-compile" }
tilo-fs-client = { path = "../tilo-fs-client" }
tilo-thumbnail = { path = "../../engines/thumbnail" }
install-plan = { path = "../../os/install-plan" }
tilo-web-search = { path = "../../integrations/tilo-web-search", features = ["fixture-servers"] }
tilo-automerge = { workspace = true, features = ["heap-probe"] }
tilo-files = { path = "../../platform/tilo-files", features = ["test-support"] }
tilo-clock = { path = "../../platform/tilo-clock", features = ["local", "test-support"] }
ui = { package = "tilo-ui", path = "../../ui/ui-core", features = ["test-support", "model"] }
tilo-mcp = { path = "../tilo-mcp", features = ["test-support"] }
# The action provider the workspace tests answer with.
tilo-actions = { path = "../actions", features = ["test-support"] }
# The channel fixtures owner tests seal writes with.
tilo-workspace-service = { path = "../tilo-workspace-service", features = ["agents", "apps", "device-keys", "files", "session-pages", "test-support"] }
tilo-person-services = { path = "../person-services", features = ["test-support"] }
tilo-app-host = { path = "../app-host", features = ["agents", "files", "test-support"] }
# The join protocol a runtime joins workspaces over.
# The host whose workspaces a runtime joins.
tilo-peer-state = { path = "../tilo-peer-state", features = ["test-support"] }
# Signs the installed-package fixtures the launch path verifies.
ed25519-dalek.workspace = true
# The signed catalogue a follower test's registry serves.
registry-types = { package = "tilo-registry-types", path = "../registry-types" }
# The cluster of a person's own records, which their store's key is.
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }
# The environment record ush makes in a test's workspace.
tilo-environment = { path = "../environment" }
# The Thunderbird profile a migration test's home holds.
tilo-migrate = { path = "../../import/migrate", features = ["fixture"] }
# Builds the tilolang apps a test's device has installed, and the runtime bundles they run on.
tilolang-cli = { path = "../../lang/tilolang-cli" }
runtime-bundle = { package = "tilo-runtime-bundle", path = "../runtime-bundle" }
# A server on this machine's loopback, which is what a test's devices relay through.
test-server = { path = "../../../tools/test-server" }
# The integration tests start hosts that keep more on their own endpoints, as test-server does.
tilo-runtime = { path = ".", features = ["test-support"] }
# Paused time drives the watch lease's expiry.
tokio = { workspace = true, features = ["test-util"] }

# A host selling the workspaces' VMs, which keeps what each program it starts was given.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ush = { path = "../../vm/ush", features = ["quic", "test-host"] }

[lints]
workspace = true
