[package]
name = "tilo-actions"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The Tilo action model: resources, the actions on them, and their registry."

[lib]
name = "tilo_actions"
path = "src/lib.rs"

# Serializable, replayable CRDT mutations, the nested Resource tree apps
# publish, and dispatch that either executes locally (`ClientLocal`) or routes
# to a host (`ServerPreferred`). This is a pure state layer with no `ui`,
# `winit`, or rendering dependencies.

[features]
# `remote::TestProvider`, a closure-built action host for other crates' tests.
test-support = []
# A host driving calls off an async runtime enables this: its state reads run on a blocking thread.
off-worker = ["dep:tokio"]
# The questions a program outside Tilo asks the person at the device (`asks`): the channel the
# session receives them on.
asks = ["dep:tokio"]

[dependencies]
# The ask channel's queue and its one answer per question (`asks`), on every target.
tokio = { workspace = true, features = ["sync"], optional = true }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-failure = { version = "0.1.0", path = "../../platform/tilo-failure" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
# What a skill's selector reads over a published resource.
tilo-selector = { version = "0.1.0", path = "../tilo-selector" }
# What a type's noun is called in a sentence, shared with the compiler that writes an app's
# catalogue.
tilo-words = { version = "0.1.0", path = "../tilo-words" }
hex.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
jiff.workspace = true
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# JSON Schema patterns are ECMA-262, whose `\d`, `\w` and `\b` are ASCII as
# here; the full `regex` engine would sit in the browser start module.
regex-lite.workspace = true
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
thiserror.workspace = true
blake3.workspace = true
# Appearance names are compared and stored NFC-normalized.
unicode-normalization = "0.1.25"
# An avatar is checked by its sniffed image type.
tilo-content-types = { version = "0.1.0", path = "../content-types" }
# The window whose code records an action keeps its large parts in that
# window's content store.
tilo-wake = { version = "0.1.0", path = "../../platform/tilo-wake" }
# The large parts of a recorded action are kept, sealed, as content.
tilo-content = { version = "0.1.0", path = "../content", default-features = false }
tracing.workspace = true
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
tilo-canonical-json = { version = "0.1.0", path = "../../platform/tilo-canonical-json" }
# What a person types for a secret take is wiped from memory once handed over.
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
postcard = { workspace = true, features = ["alloc"] }
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

# A browser page draws invocation ids from `crypto.getRandomValues`; a
# `tilo_no_js` build has no page and takes getrandom's configured backend.
[target.'cfg(all(target_family = "wasm", target_os = "unknown", not(tilo_no_js)))'.dependencies]
uuid = { version = "1.23.1", features = ["js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown", tilo_no_js))'.dependencies]
uuid = { version = "1.23.1", features = ["rng-getrandom"] }

# A line client's connection is this login's local socket: a Unix socket, or a named pipe on Windows.
[target.'cfg(any(unix, windows))'.dependencies]
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }

# A provider's synchronous read of an invocation's state may wait on a device: only a host with
# `off-worker` enables tokio and runs it on a blocking thread, so the runtime carries the answer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt"], optional = true }
