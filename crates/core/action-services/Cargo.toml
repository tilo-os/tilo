[package]
name = "tilo-action-services"
description = "The actions of the services a device and a workspace run: the apps and files it keeps, the environments and windows they run in, and the tools and tasks it hands an agent."
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "tilo_action_services"
path = "src/lib.rs"

[features]
# `test_provider::TestProvider`, a closure-built action host for other crates' tests.
test-support = []

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
# The stores a workspace keeps beside its records: what each of their actions writes and which
# answer a secret.
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
hex.workspace = true
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tracing.workspace = true
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }
postcard = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# A browser page draws invocation ids from `crypto.getRandomValues`; a
# `tilo_no_js` build has no page and takes getrandom's configured backend.
[target.'cfg(all(target_family = "wasm", target_os = "unknown", not(tilo_no_js)))'.dependencies]
uuid = { version = "1.23.1", features = ["js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown", tilo_no_js))'.dependencies]
uuid = { version = "1.23.1", features = ["rng-getrandom"] }
