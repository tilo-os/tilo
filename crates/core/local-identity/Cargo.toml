[package]
name = "tilo-local-identity"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "Who sits at this device: the process's one identity boundary and the source a host installs."

[lib]
name = "tilo_local_identity"
path = "src/lib.rs"

[features]
# The workspace identity service the launcher bound the process to, read when
# no host installed a source.
local-daemons = ["dep:runtime-portal", "dep:tilo-identity-client"]

[dependencies]
hex.workspace = true
tracing.workspace = true
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
runtime-portal = { package = "tilo-runtime-portal", version = "0.1.0", path = "../runtime-portal", optional = true }
tilo-identity-client = { version = "0.1.0", path = "../tilo-identity-client", optional = true }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true
