[package]
autotests = false
name = "tilo-egress"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "DNS-allowlisted egress for a sandbox's own network namespace: a DNS stub that answers only granted names, and nftables that admit only the addresses it answered."

[lib]
name = "tilo_egress"
path = "src/lib.rs"

[dependencies]
tilo-permissions = { version = "0.1.0", path = "../permissions" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
# The host release its package manager asks for, read from os-release.
tilo-os-release = { version = "0.1.0", path = "../../platform/os-release" }
# The DNS stub's stop signal: an eventfd its threads block on with their socket.
bounded-command = { package = "tilo-bounded-command", path = "../../platform/bounded-command" }
# The grant grammar and the policy over it, shared with the launcher's egress proxy.
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
libc.workspace = true
rustix = { workspace = true, features = ["net", "std"] }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
thiserror.workspace = true
tracing.workspace = true
tilo-paths.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../../tools/test-env" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
