[package]
name = "tilo-contact-directory"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The workspace's contact directory and explicitly confirmed messaging endpoints"

[dependencies]
serde_json.workspace = true
# The object a migration rewrites a person's hints in.
automerge.workspace = true
serde.workspace = true
tilo-resource = { path = "../../core/tilo-resource" }
uuid.workspace = true
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true

[dev-dependencies]
# The canonical compiled form of the surface this crate publishes.
tilo-surface-compile = { version = "0.1.0", path = "../../core/tilo-surface-compile" }
