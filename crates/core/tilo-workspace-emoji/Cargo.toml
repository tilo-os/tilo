[package]
name = "tilo-workspace-emoji"
version = "0.1.0"
edition = "2024"
# Published: every app window of the SDK opens it (tools/sdk/publish_check.py).
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "A workspace's own emoji: the workspace record every app draws `:name:` from"

[dependencies]
automerge.workspace = true
base64.workspace = true
serde_json.workspace = true
tilo-resource = { version = "0.1.0", path = "../../core/tilo-resource" }
tilo-app-id = { version = "0.1.0", path = "../../core/tilo-app-id" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-action-types.workspace = true
tilo-action-policy = { version = "0.1.0", path = "../../core/action-policy" }
tilo-actions = { version = "0.1.0", path = "../../core/actions" }

[lints]
workspace = true
