[package]
name = "tilo-session-actions"
description = "Another device's actions, asked through this device's session with the workspace's host: an action provider over whatever session a host brings."
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
collab-types = { package = "tilo-collab-types", path = "../collab-types" }
tilo-actions = { path = "../actions", features = ["answer-reads"] }
tilo-action-calls = { version = "0.1.0", path = "../action-calls", features = ["answer-reads"] }
tilo-clock = { path = "../../platform/tilo-clock" }
tilo-content-types = { path = "../content-types" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }
tilo-server-protocol = { path = "../tilo-server-protocol" }
n0-future = "0.3"
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
tilo-actions = { path = "../actions", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
