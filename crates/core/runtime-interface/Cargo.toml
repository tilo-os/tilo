[package]
name = "tilo-runtime-interface"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "The app ↔ runtime interface's version, and the typed requests an app makes of the shell's tools."

[lib]
name = "runtime_interface"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-app-id = { version = "0.1.0", path = "../tilo-app-id" }
tilo-content-types = { version = "0.1.0", path = "../content-types" }
tilo-lock = { version = "0.1.0", path = "../../platform/tilo-lock" }

[target.'cfg(any(unix, windows))'.dependencies]
tilo-socket = { version = "0.1.0", path = "../../platform/tilo-socket" }

[dev-dependencies]
tilo-test-env = { path = "../../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
