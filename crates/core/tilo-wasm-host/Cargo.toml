[package]
name = "tilo-wasm-host"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
description = "The wasm host layer every guest in Tilo executes on: per-call fuel, memory and table limits, module loading, one failure type, and the rule that an instance whose call failed is never called again."
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror.workspace = true
# The interpreter: every host's engine, and the browser build's only one. SIMD is named here
# because this crate decides the engine's feature set: without it a guest's module is refused
# because wasmi has no SIMD at all, and the native builds' set would otherwise depend on which
# other crates a run links (the model service turns it on). Named, the shared engine can turn
# relaxed SIMD off on every target.
wasmi = { version = "1.1", default-features = false, features = ["simd", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The modules the tests bound and refuse, written as WAT.
wat = "1"

[lints]
workspace = true
