[package]
name = "tilo-invocations"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
readme = "../../../docs/crates/supporting-crate.md"
repository.workspace = true
homepage.workspace = true
description = "A device's one record of each invocation it was asked for: who asked, what, how it stands, and the provider it runs at."

[lib]
name = "tilo_invocations"
path = "src/lib.rs"

[dependencies]
tilo-actions = { version = "0.1.0", path = "../actions" }
tilo-action-policy = { version = "0.1.0", path = "../action-policy" }
tilo-clock = { version = "0.1.0", path = "../../platform/tilo-clock" }
hex.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
