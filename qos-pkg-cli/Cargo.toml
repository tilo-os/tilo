[package]
name = "qos-pkg-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qos-pkg"
path = "src/main.rs"

# CLI driver for `qos-pkg`. Pack a payload + manifest into a
# `.qpkg` file, sign / verify / inspect / unpack it. The .qpkg
# file format is a tarball with the following entries:
#
# ```
# qpkg.toml                # tiny header naming the PackageId and format
# signed-root              # the 173-byte signed-root blob
# manifest.toml            # the manifest (UTF-8 TOML)
# collection.qcl           # the encoded payload Collection (binary)
# blobs/<hex>              # each payload blob, named by its BLAKE3 hex hash
# ```
#
# The tar layout is convention-only — it is NOT what the package
# id covers (the id covers the signed-root blob, which transitively
# binds the manifest hash, collection hash, and per-file hashes).
# So the tar archive can be rebuilt by anyone holding the four
# in-band blobs and the .qpkg's PackageId.

[dependencies]
qos-pkg = { path = "../qos-pkg" }

anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex         = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tar         = "0.4"
toml        = "0.8"

[dev-dependencies]
tempfile = "3"
