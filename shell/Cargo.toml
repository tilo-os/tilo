[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs-next = "2.0"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = "0.32"
libp2p = { version = "0.56", features = ["tcp", "dns", "websocket", "noise", "yamux", "mdns", "gossipsub", "tokio", "macros"] }
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "backend_winit",
    "renderer_glow",
    "desktop",
    # Phase 5 Task 5.1: real DRM/KMS + libseat + udev + libinput
    # backend for running on a bare TTY. See
    # `shell/src/compositor/backend/drm/` for the implementation
    # and `docs/superpowers/plans/2026-05-02-real-wayland-compositor.md`
    # (Phase 5) for design intent.
    "backend_drm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
] }
# Phase 5 Task 5.1: structured error type for DRM backend construction.
# Bubbles up clean error messages to the binary entry point instead of
# panicking — the host machine (Gnome already holds the seat) needs the
# `--backend drm` path to fail cleanly with a useful diagnostic.
thiserror = "2"
calloop-wayland-source = "0.4"
rand = "0.10.0"
ui = { path = "../ui" }
terminal = { path = "../apps/terminal" }
file-explorer = { path = "../apps/file-explorer" }
winit = "0.30.13"
# Compositor Phase 4 follow-up: the native winit backend bypasses smithay's
# glow renderer in favor of vello-on-wgpu directly (`backend/winit.rs`).
# Vello's `RenderContext::create_surface` is async, so we need a blocking
# executor inside the synchronous `WinitBackend::new`. `pollster` is already
# pulled in as a dev-dep at the same version, so Cargo collapses to a single
# copy in the lock.
pollster = "0.4.0"
sysinfo = "0.32"
# Direct deps needed by in-shell widgets (browser_stub, etc.) that implement
# `ui::widget::Widget`. Versions are pinned to match ui's Cargo.toml.
automerge = "0.7.4"
taffy = "0.9.2"
vello = "0.2.1"
# Phase 2 of `docs/superpowers/plans/2026-05-02-per-workspace-sandbox-permissions.md`:
# host-side compiler for the per-workspace seccomp-bpf deny-list. Pinned to the
# latest 0.5.x to track upstream sock_filter / TargetArch shape (x86_64,
# aarch64, riscv64). Linux-only crate — sandbox callers gate at runtime.
seccompiler = "0.5"
# Direct libc dep so we can name the SYS_* and AF_PACKET constants required by
# the deny-list filter without going through seccompiler's re-export. ui
# already pulls libc transitively, so Cargo collapses to one copy in the lock.
libc = "0.2"
# Phase 3 Task 3.3 of `docs/superpowers/plans/2026-05-02-peer-sync-end-to-end.md`:
# `network::invite` encodes / decodes signed peer-invite tokens as base64-url
# wrapped JSON, with the owner's libp2p PeerId rendered as base58. Both crates
# are already pulled in transitively by libp2p; pinning them here is a one-line
# Cargo edit and avoids relying on transitive re-exports of unrelated deps.
base64 = "0.22"
bs58 = "0.5"
# Phase 4 of `docs/superpowers/plans/2026-05-02-peer-sync-end-to-end.md`:
# software H.264 encode/decode for foreign-surface streaming between peers.
# `source` feature builds Cisco's OpenH264 in-tree (vs. dlopen'ing the system
# copy), which keeps the test image self-contained — bootc is immutable so we
# can't rely on a runtime-installed `libopenh264.so`.
openh264 = { version = "0.9", features = ["source"] }
# Sandbox Phase 4.3 (`docs/superpowers/plans/2026-05-02-per-workspace-sandbox-permissions.md`):
# `portal::serve` registers the `org.freedesktop.impl.portal.{FileChooser,
# ScreenCast,Access}` backend interfaces over D-Bus so xdg-desktop-portal can
# route sandboxed-app requests into our per-workspace grant model. We pin to
# `4` because `dark-light` (a transitive of `iced`) already locks zbus to
# 4.4.x — staying on the same major avoids a duplicate compile + runtime
# copy of the entire async-task stack zbus drags in.
zbus = { version = "4", default-features = false, features = ["tokio", "p2p"] }
# Real-input e2e Phase 4: `test_control::Command::Snapshot` encodes the
# `OffscreenRenderer::render_rgba` result as a PNG on disk. Previously a
# dev-dep used by `tests/e2e_shell_flows.rs`; the snapshot executor is in
# the runtime path so we promote it. Cargo collapses to a single copy
# either way — moving the entry is zero compile-time cost.
png = "0.17"

[dev-dependencies]
wayland-client = "0.31"
tokio-test = "0.4"
# Offscreen headless renderer used by `tests/e2e_shell_flows.rs`. Versions
# mirror ui so Cargo collapses to a single copy in the workspace lock.
pollster = "0.4.0"
wgpu = "0.20"
# Scene-encoding inspection used by `tests/concept_parity_spec.rs` to walk
# `Scene::encoding().draw_data` for solid-colour brushes and image-paint
# tags without round-tripping pixels through wgpu. Same minor version as
# the `vello = "0.2.1"` runtime dep; Cargo collapses to a single copy.
vello_encoding = "0.2.1"
# Tempdir helper for `network::behaviour::load_or_create_keypair` tests so we
# never write a real key to `/var/lib/qos-fs/peer-key` from the test suite.
tempfile = "3"
# `tests/portal_test.rs` joins the server- and client-side handshake of an
# in-process p2p zbus pair via `futures_util::try_join!`. Already pulled in
# transitively (libp2p, zbus, tokio) — pinning it here is just for the
# `try_join!` macro at the test-fixture call site.
futures-util = "0.3"
# Serializes the 8 `apply_grants`-calling tests in `sandbox::profile`
# that share a process-wide `SCAN_MEMO` static. Without this, parallel
# `cargo test` races on the memo's walk-counter and surfaces as a
# flaky `apply_grants_dev_scan_is_memoised` failure.
serial_test = "3"

# Real-input e2e Phase 5: the `qos-control` CLI is a thin wrapper over the
# `QOS_TEST_CONTROL` JSON socket — humans and shell scripts use it instead
# of writing `socat | jq` pipelines. Cargo would auto-discover the binary
# from `src/bin/qos-control.rs` anyway, but the explicit entry pins the
# name + path so a future `src/bin/` reshuffle doesn't silently rename it.
# Spec: `docs/superpowers/specs/2026-05-16-real-input-e2e-design.md`,
# "Component 3".
[[bin]]
name = "qos-control"
path = "src/bin/qos-control.rs"
