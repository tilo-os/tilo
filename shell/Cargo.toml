[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[features]
# When set, the hosted-mode compositor (`shell --backend winit`) binds
# the QOS_TEST_CONTROL Unix socket the same way the headless backend
# does. A background thread reads JSON commands and injects equivalent
# `ui::UserEvent`s into the App via winit's `EventLoopProxy`. Disable
# in production builds to drop the test surface (`--no-default-features
# --features ...`).
default = ["hosted-test-control", "hdr-decode"]
hosted-test-control = []
# VA-API hardware H.264 encoder for Intel iGPU / AMD Radeon / ARM SoCs.
# Opt-in — pulls in `ffmpeg-next` + libavcodec so the shell still
# compiles on hosts without `ffmpeg-devel`. The backend calls
# `h264_vaapi` (libavcodec) with an `av_hwdevice_ctx_create`d VAAPI
# device on the render node.
vaapi = ["ffmpeg-next"]
# NVIDIA NVENC hardware H.264 encoder. Opt-in for NVIDIA-only OS-image
# variants — same `ffmpeg-next` dep as vaapi, different codec probe
# (`h264_nvenc`). If libavcodec wasn't built against NVENC the probe
# reports unavailable and Auto falls through to openh264.
nvenc = ["ffmpeg-next"]
# HEVC Main10 receive-side decoder for HDR PeerView. Default-on because
# a peer streaming HDR content wouldn't have anywhere for its bytes to
# go without it. Pulls in `ffmpeg-next` for libavcodec's HEVC decoder;
# the tone-map + display-probe machinery is always compiled — only the
# decoder side is feature-gated because software HEVC decode is the one
# piece that needs libavcodec.
hdr-decode = ["ffmpeg-next"]
# Stamps a build marker into the binary (see `compositor::dev_env`) so the
# host session RPM's *developer* entry can tell a deliberately-built dev
# compositor from any other executable before logging into it. Non-default,
# and inert unless `debug_assertions` is also on, so a `--release` build never
# carries the marker whatever features it was given. It enables no behaviour
# on its own — the marker is the entire content of the feature.
dev-session = []

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../crates/system/atomic-file" }
# One owner for ~/.config/qos/settings.json.
settings-store = { path = "../crates/system/settings-store" }
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
once_cell.workspace = true
chrono = { workspace = true, default-features = true }
uuid.workspace = true
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
dirs.workspace = true
smithay-client-toolkit = "0.20.0"
wayland-client.workspace = true
wayland-protocols = "0.32.12"
libp2p.workspace = true
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "backend_winit",
    "renderer_glow",
    "desktop",
    # Phase 5 Task 5.1: real DRM/KMS + libseat + udev + libinput
    # backend for running on a bare TTY. See
    # `shell/src/compositor/backend/drm/` for the implementation
    # and `docs/superpowers/plans/2026-05-02-real-wayland-compositor.md`
    # (Phase 5) for design intent.
    "backend_drm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
] }
# Phase 5 Task 5.1: structured error type for DRM backend construction.
# Bubbles up clean error messages to the binary entry point instead of
# panicking — the host machine (Gnome already holds the seat) needs the
# `--backend drm` path to fail cleanly with a useful diagnostic.
thiserror.workspace = true
calloop-wayland-source = "0.4.1"

ui = { path = "../ui" }
# The record/room-index store. The compositor keeps one document per room
# listing which records that room holds, in the same store shape (atomic
# writes, single-writer lock, debounced writer) an app's own state uses.
app-state = { path = "../crates/system/app-state" }
# `data_home()` — where per-user state lives, which is also where the
# records apps wrote are found.
cli = { path = "../crates/runtime/cli" }
terminal = { path = "../apps/terminal" }
file-explorer = { path = "../apps/file-explorer" }
# The document-format registry. The shell asks it whether a path is an
# editable document; which installed app opens it comes from the app
# manifests, not from here.
qdoc = { path = "../crates/doc/qdoc" }
# Shared OS-action shell-outs (brightnessctl/wpctl/nmcli/bluetoothctl/
# powerprofilesctl). Lifted out of `shell::shell::qs_actions` so the
# Settings app can call the same bindings without depending on the
# compositor. The module at the old path now re-exports from this crate.
os-actions = { path = "../crates/system/os-actions" }
# Power management: suspend-on-idle, lid / power-key policy, suspend
# inhibitors, and battery thresholds over systemd-logind + UPower. The pure
# policy core is unit-testable without a bus; the service actuates via zbus.
qos-power-mgmt = { path = "../crates/system/power" }
# Session-lock unlock reuses the greeter's greetd/PAM conversation
# (`greetd_client::verify_password` — verify credentials without starting a
# session) so login and unlock share one non-leaky auth path.
greeter = { path = "../crates/session/greeter" }
winit.workspace = true
# Compositor Phase 4 follow-up: the native winit backend bypasses smithay's
# glow renderer in favor of vello-on-wgpu directly (`backend/winit.rs`).
# Vello's `RenderContext::create_surface` is async, so we need a blocking
# executor inside the synchronous `WinitBackend::new`. `pollster` is already
# pulled in as a dev-dep at the same version, so Cargo collapses to a single
# copy in the lock.
pollster.workspace = true
sysinfo.workspace = true
# Direct deps needed by in-shell widgets (browser_stub, etc.) that implement
# `ui::widget::Widget`. Versions are pinned to match ui's Cargo.toml.
automerge.workspace = true
taffy.workspace = true
vello.workspace = true
# C-3 WorkspaceTreeHandle unification: shared `Arc<parking_lot::RwLock<WorkspaceTree>>`
# across compositor / portal / peer-sync (one source of truth, no diverging clones).
# Already a transitive via wgpu — pinning here is one-line and keeps Cargo
# collapsed to a single copy in the workspace lock.
qos-startup-metrics = { path = "../crates/system/qos-startup-metrics" }
parking_lot.workspace = true
# Phase 2 of `docs/superpowers/plans/2026-05-02-per-workspace-sandbox-permissions.md`:
# host-side compiler for the per-workspace seccomp-bpf deny-list. Pinned to the
# latest 0.5.x to track upstream sock_filter / TargetArch shape (x86_64,
# aarch64, riscv64). Linux-only crate — sandbox callers gate at runtime.
seccompiler.workspace = true
# Direct libc dep so we can name the SYS_* and AF_PACKET constants required by
# the deny-list filter without going through seccompiler's re-export. ui
# already pulls libc transitively, so Cargo collapses to one copy in the lock.
libc.workspace = true
# Landlock per-capability in-kernel FS/net enforcement (`plan/security.md`
# §7.1). Applied by the `__sandbox-exec` launcher shim AFTER bwrap sets up
# the namespace, so it layers on top of bwrap + seccomp + netns. Linux-only;
# best-effort at runtime (degrades silently on kernels without Landlock).
landlock.workspace = true
# Phase 3 Task 3.3 of `docs/superpowers/plans/2026-05-02-peer-sync-end-to-end.md`:
# `network::invite` encodes / decodes signed peer-invite tokens as base64-url
# wrapped JSON, with the owner's libp2p PeerId rendered as base58. Both crates
# are already pulled in transitively by libp2p; pinning them here is a one-line
# Cargo edit and avoids relying on transitive re-exports of unrelated deps.
base64.workspace = true
bs58 = "0.5.1"
# Phase 4 of `docs/superpowers/plans/2026-05-02-peer-sync-end-to-end.md`:
# software H.264 encode/decode for foreign-surface streaming between peers.
# `source` feature builds Cisco's OpenH264 in-tree (vs. dlopen'ing the system
# copy), which keeps the test image self-contained — bootc is immutable so we
# can't rely on a runtime-installed `libopenh264.so`.
openh264.workspace = true
# Hardware H.264 encode (VA-API / NVENC) via libavcodec. Opt-in behind
# the `vaapi` / `nvenc` features. `default-features = false` +
# `features = ["codec", "software-scaling"]` pulls only libavcodec +
# libswscale (no libavformat / libavfilter / libavdevice) so the compile
# cost is bounded. The h264_vaapi encoder needs an `av_hwdevice_ctx_create`d
# VAAPI device on `/dev/dri/renderD*`; libswscale handles the RGBA→NV12
# CPU-side conversion before uploading to a VA-API surface.
#
# Why not `cros-libva`: it selects `log/release_max_level_debug` and
# `ssip-client` (already in-tree for accessibility) selects
# `log/release_max_level_info` — mutually exclusive Cargo features on
# the `log` crate. `ffmpeg-next` has no `log` dependency, so it side-
# steps the conflict entirely.
ffmpeg-next = { version = "8", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }
# Sandbox Phase 4.3 (`docs/superpowers/plans/2026-05-02-per-workspace-sandbox-permissions.md`):
# `portal::serve` registers the `org.freedesktop.impl.portal.{FileChooser,
# ScreenCast,Access}` backend interfaces over D-Bus so xdg-desktop-portal can
# route sandboxed-app requests into our per-workspace grant model. We pin to
# `4` because `dark-light` (a transitive of `iced`) already locks zbus to
# 4.4.x — staying on the same major avoids a duplicate compile + runtime
# copy of the entire async-task stack zbus drags in.
zbus = { workspace = true, features = ["tokio", "p2p"] }
# Real-input e2e Phase 4: `test_control::Command::Snapshot` encodes the
# `OffscreenRenderer::render_rgba` result as a PNG on disk. Previously a
# dev-dep used by `tests/e2e_shell_flows.rs`; the snapshot executor is in
# the runtime path so we promote it. Cargo collapses to a single copy
# either way — moving the entry is zero compile-time cost.
png.workspace = true
# Phase 3 of `2026-06-29-spaces-channels-and-cryptographic-roles.md`:
# the broker validates inbound `SignedOp` envelopes against the
# channel's role table before fan-out; the libp2p actor carries them
# via `NeighbourMsg::AppCrdtIncrementalSigned`. The contract types and
# the validator live in `qos-collab-types`.
collab-types = { path = "../crates/collab/collab-types" }
# The reusable video-streaming stack (H.264 encode/decode, per-share frame
# transport substrate, throttle). `network::{encoder,surface_stream,streaming}`
# re-export from here so the compositor's surface streaming and the chat call
# app share a single copy of the codec + wire format.
qos-callstream = { path = "../crates/collab/qos-callstream" }
# `firstboot` provisions a fresh single-device identity at first login
# via `threshold-identity::ThresholdIdentity::bootstrap_single_device_seed`,
# which yields the raw dalek-compatible seed + pubkey that the
# on-disk identity record (loaded by `runtime-identity`) needs.
threshold-identity = { path = "../crates/collab/threshold-identity" }
# `firstboot` calls `rand_core::OsRng` for identity key generation.
# Version matched to `threshold-identity`'s direct dep (rand_core 0.6,
# which frost-ed25519 consumes) so the workspace collapses to one copy.
rand_core = { workspace = true, features = ["getrandom"] }
# The shell serves the SDK-facing Cap'n Proto broker interface
# natively. `runtime-collab` provides the generated schema types and
# the SDK-side client wrappers we reuse in tests; `runtime-portal`
# supplies the connected-fd lift + service-fd lookup.
runtime-collab = { path = "../crates/runtime/runtime-collab" }
runtime-portal = { path = "../crates/runtime/runtime-portal" }
# Launching installed applications: the shell reads the app registry and
# package manifests through this crate's types, then execs its
# `qos-launcher` binary to build the actual bwrap + seccomp + Landlock
# sandbox. Library-only use here — see `shell::shell::launcher` for why
# the sandbox itself is built by the binary rather than in-process.
launcher = { path = "../crates/packaging/launcher" }
# The host's own applications: `.desktop` entries the compositor reads
# so a Flatpak or a distribution binary is launchable and searchable.
desktop-entry = { package = "qos-desktop-entry", path = "../crates/system/desktop-entry" }
# User root identity + device cert + revocation. See
# `network::identity` for the peer-side wiring: on connect we
# expect the remote to present its device pubkey + cert; we validate
# the cert against the workspace owner's root key and cross-check
# the revocation list before accepting any of the peer's CRDT ops.
qos-user-identity = { path = "../crates/identity/qos-user-identity" }
# `network::identity` verifies raw Ed25519 signatures directly
# against a peer's device pubkey (as recovered from their
# DeviceCert). Same version + features shape as the dev-deps entry
# below so cargo collapses to one copy in the lockfile.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
capnp.workspace = true
capnp-rpc.workspace = true
tokio-util.workspace = true
futures = { workspace = true, default-features = true }
# The shell re-serialises signed op envelopes and presence keys onto
# the capnp wire; `postcard` matches what apps and the ui toolkit
# already use for the same envelopes / keys.
postcard = { workspace = true, features = ["alloc"] }

# Search infrastructure.
# `walkdir` powers the files provider's name-index walker + the tantivy
# content indexer.
walkdir.workspace = true
# tantivy is the BM25 content index behind the files provider's
# full-text search. `mmap` avoids reading the whole segment file into
# RAM for each query; disabling default features drops the parquet
# writer, ICU tokenizer, and other extras we don't need for a
# home-directory index.
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }

[dev-dependencies]
wayland-client.workspace = true
tokio-test = "0.4"
# Canonical-bytes encoder for Phase 3 wire-format round-trip tests in
# `src/network/protocol.rs`. `qos-collab-types` already uses this for
# signing; the test verifies `NeighbourMsg::AppCrdtIncrementalSigned`
# survives the same codec.
postcard = { workspace = true, features = ["alloc"] }
# `ed25519-dalek` is now pulled in as a top-level dep (see above),
# for the `network::identity` module. Broker integration tests use
# the same lockfile copy for their `SigningKey` fixtures.
# The headline "everything composes" integration test
# (`tests/everything_composes.rs`) exercises Phases 3 + 6 + 7 + 8 in a
# single end-to-end flow — threshold-signed, MLS-encrypted op crossing
# the broker, validated, decrypted, then compacted.
channel-crypto = { path = "../crates/collab/channel-crypto" }
# Signed `RoleAttestation` / `SignedOp` fixtures shared by every wire-format
# integration test here. Was six drifting copies of the same signing ceremony
# pasted across tests/; now one crate that only test targets can see.
collab-fixtures = { path = "../crates/collab/collab-fixtures" }
# Deterministic RNG used by the FROST signing fixture in
# `tests/everything_composes.rs`. The alias is historical: it was added
# when shell also carried a `rand = "0.10.1"` runtime dep. That dep was
# never used and has been dropped, so this now resolves to the same
# `rand` 0.8 the rest of the workspace signs with.
rand_08 = { package = "rand", version = "0.8" }
rand_chacha.workspace = true
# Test-only: exercise a round-trip through the on-disk identity
# schema `runtime-identity::load` reads. Not a runtime dep — the
# firstboot provisioning path writes JSON directly to avoid pulling
# in an SDK-layer crate that reads back the file it just wrote.
runtime-identity = { path = "../crates/runtime/runtime-identity" }
# Offscreen headless renderer used by `tests/e2e_shell_flows.rs`. Versions
# mirror ui so Cargo collapses to a single copy in the workspace lock.
pollster.workspace = true
wgpu.workspace = true
# Scene-encoding inspection used by `tests/concept_parity_spec.rs` to walk
# `Scene::encoding().draw_data` for solid-colour brushes and image-paint
# tags without round-tripping pixels through wgpu. Same minor version as
# the `vello = "0.2.1"` runtime dep; Cargo collapses to a single copy.
vello_encoding.workspace = true
# Tempdir helper for `network::behaviour::load_or_create_keypair` tests so we
# never write a real key to `/var/lib/qos-fs/peer-key` from the test suite.
tempfile.workspace = true
# `tests/portal_test.rs` joins the server- and client-side handshake of an
# in-process p2p zbus pair via `futures_util::try_join!`. Already pulled in
# transitively (libp2p, zbus, tokio) — pinning it here is just for the
# `try_join!` macro at the test-fixture call site.
futures-util.workspace = true
# Serializes the 8 `apply_grants`-calling tests in `sandbox::profile`
# that share a process-wide `SCAN_MEMO` static. Without this, parallel
# `cargo test` races on the memo's walk-counter and surfaces as a
# flaky `apply_grants_dev_scan_is_memoised` failure.
serial_test.workspace = true
# Naga is the WGSL parser/validator wgpu already pulls in transitively.
# `tests/hdr_tonemap_shader.rs` uses it to spot-check the tone-map
# WGSL kernel at test time so a shader edit doesn't silently break the
# GPU path in production. Pinned to the same minor as wgpu 29 so Cargo
# collapses to one copy in the workspace lock.
naga = { version = "29", features = ["wgsl-in"] }

# Real-input e2e Phase 5: the `qos-control` CLI is a thin wrapper over the
# `QOS_TEST_CONTROL` JSON socket — humans and shell scripts use it instead
# of writing `socat | jq` pipelines. Cargo would auto-discover the binary
# from `src/bin/qos-control.rs` anyway, but the explicit entry pins the
# name + path so a future `src/bin/` reshuffle doesn't silently rename it.
# Spec: `docs/superpowers/specs/2026-05-16-real-input-e2e-design.md`,
# "Component 3".
[[bin]]
name = "qos-control"
path = "src/bin/qos-control.rs"
