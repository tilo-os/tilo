[package]
name = "quick-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs-next = "2.0"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = "0.32"
libp2p = { version = "0.56", features = ["tcp", "dns", "websocket", "noise", "yamux", "mdns", "gossipsub", "tokio", "macros"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "backend_winit", "desktop"] }
calloop-wayland-source = "0.4"
rand = "0.10.0"
quick-ui = { path = "../quick-ui" }
winit = "0.30.13"
sysinfo = "0.32"
# Direct deps needed by in-shell widgets (browser_stub, etc.) that implement
# `quick_ui::widget::Widget`. Versions are pinned to match quick-ui's Cargo.toml.
automerge = "0.7.4"
taffy = "0.9.2"
vello = "0.2.1"

[dev-dependencies]
wayland-client = "0.31"
tokio-test = "0.4"
