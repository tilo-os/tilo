[package]
name = "quick-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.13", features = ["tokio", "canvas", "image", "svg"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs-next = "2.0"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = "0.32"
libp2p = { version = "0.56", features = ["tcp", "dns", "websocket", "noise", "yamux", "mdns", "gossipsub", "tokio", "macros"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "backend_winit", "desktop"] }
calloop-wayland-source = "0.4"
rand = "0.10.0"

[dev-dependencies]
wayland-client = "0.31"
tokio-test = "0.4"
