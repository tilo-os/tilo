[package]
name = "tilo-security-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
landlock = "0.4"
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

collab-types = { path = "../crates/collab/collab-types" }
tilo-app-package = { path = "../crates/packaging/tilo-app-package" }
launcher = { path = "../crates/packaging/launcher" }
tilo-user-identity = { path = "../crates/collab/tilo-user-identity" }

[[bin]]
name = "tapp_ingress"
path = "fuzz_targets/tapp_ingress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "collab_invite_chain"
path = "fuzz_targets/collab_invite_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_wire"
path = "fuzz_targets/identity_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sandbox_policy"
path = "fuzz_targets/sandbox_policy.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# The fuzz workspace resolves the same patched crates as the main workspace:
# Rustls roots through tilo-native-certs (no OpenSSL path probing).
[patch.crates-io]
rustls-native-certs = { path = "../crates/system/tilo-native-certs" }
