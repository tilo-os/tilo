[package]
name = "qos-security-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

collab-types = { path = "../crates/collab/collab-types" }
pkg = { path = "../crates/packaging/pkg" }
qos-user-identity = { path = "../crates/identity/qos-user-identity" }

[[bin]]
name = "qpkg_ingress"
path = "fuzz_targets/qpkg_ingress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "collab_invite_chain"
path = "fuzz_targets/collab_invite_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_wire"
path = "fuzz_targets/identity_wire.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
