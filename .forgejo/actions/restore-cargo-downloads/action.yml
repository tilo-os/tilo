name: Restore Cargo downloads
description: Restore the shared registry and Git dependency cache under $CARGO_HOME without affecting correctness.

inputs:
  lockfile:
    description: Workspace-relative lockfile used by this source checkout.
    required: false
    default: Cargo.lock

outputs:
  cache-key:
    description: Exact download cache key, also used by explicit save steps.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether the exact Cargo.lock cache key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  paths:
    description: The cached download directories, for the matching save step.
    value: ${{ steps.home.outputs.paths }}

runs:
  using: composite
  steps:
    # The job image's CARGO_HOME, or Cargo's default.
    - id: home
      shell: sh
      env:
        LOCKFILE: ${{ inputs.lockfile }}
      run: |
        source=$(dirname "$LOCKFILE")
        printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
        home=${CARGO_HOME:-$HOME/.cargo}
        printf 'paths<<EOF\n%s/registry/index\n%s/registry/cache\n%s/git/db\n%s/target/font-artifacts\n%s/target/ntfs-source\nEOF\n' \
          "$home" "$home" "$home" "$source" "$source" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: ${{ steps.home.outputs.paths }}
        key: cargo-deps-${{ hashFiles(inputs.lockfile) }}-${{ hashFiles(format('{0}/crates/sdk/ui-core/assets/fonts/manifest.toml', steps.home.outputs.source), format('{0}/crates/sdk/ui-core/assets/fonts/artifacts.json', steps.home.outputs.source)) }}-${{ hashFiles(format('{0}/crates/session/tilo-ntfs-helper/vendor/ntfs-3g.lock', steps.home.outputs.source)) }}
        restore-keys: cargo-deps-

    - name: Prepare source fonts for offline builds
      if: hashFiles(format('{0}/crates/sdk/ui-core/assets/fonts/manifest.toml', steps.home.outputs.source)) != ''
      shell: bash
      env:
        SOURCE: ${{ steps.home.outputs.source }}
      run: |
        source=$(realpath "$SOURCE")
        if python3 -c 'import pathlib,sys; sys.exit("def prepared_root(" not in pathlib.Path(sys.argv[1]).read_text())' "$source/tools/font-catalog.py"; then
          python3 "$source/tools/font-catalog.py" root "$source/crates/sdk/ui-core/assets/fonts" --scope fixtures
          printf 'TILO_FONT_ASSET_CACHE=%s/target/font-artifacts\nTILO_FONT_ASSETS_OFFLINE=1\n' "$source" >> "$GITHUB_ENV"
        else
          python3 "$source/tools/font-catalog.py" verify "$source/crates/sdk/ui-core/assets/fonts" --scope fixtures
        fi

    - name: Prepare pinned NTFS source for offline builds
      if: hashFiles(format('{0}/crates/session/tilo-ntfs-helper/source_artifact.py', steps.home.outputs.source)) != ''
      shell: bash
      env:
        SOURCE: ${{ steps.home.outputs.source }}
      run: |
        source=$(realpath "$SOURCE")
        python3 "$source/crates/session/tilo-ntfs-helper/source_artifact.py"
        printf 'TILO_NTFS_SOURCE_CACHE=%s/target/ntfs-source\nTILO_NTFS_SOURCE_OFFLINE=1\n' "$source" >> "$GITHUB_ENV"
