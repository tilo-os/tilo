name: Restore Cargo downloads
description: Restore the shared registry and Git dependency cache without affecting correctness.

outputs:
  cache-hit:
    description: Whether the exact Cargo.lock cache key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: |
          /cargo-home/registry/index
          /cargo-home/registry/cache
          /cargo-home/git/db
        key: cargo-deps-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-
