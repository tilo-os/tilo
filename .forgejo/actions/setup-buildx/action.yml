name: Set up buildx with the runner pool's registries
description: >-
  Start a docker-container buildx builder whose buildkitd.toml combines the
  runner pool's registry configuration (/etc/buildkit/buildkitd.toml, when
  the pool provides one: pull-through mirrors with upstream fallback and
  the pool's layer-cache registry) with the caller's own daemon settings.
  Exports TILO_LAYER_CACHE_REGISTRY, the registry that holds this pool's
  BuildKit layer caches (registry.tilo.so when the pool names none, which
  needs a registry.tilo.so login before any cache export).

inputs:
  driver-opts:
    description: Extra docker-container driver options, one per line.
    required: false
    default: ""
  buildkitd-config-inline:
    description: Additional buildkitd.toml tables for this builder.
    required: false
    default: ""
  persistent:
    description: >-
      Keep this builder's BuildKit state (layers and RUN cache mounts) in the
      runner slot's Docker store for the slot's next job of the same trust
      class and configuration. Only a push to main (directly, or through a
      workflow it calls) is trusted, so a pull request never writes state a
      main build reads. Publications build from a fresh builder: leave this
      false for them.
    required: false
    default: "false"
  max-parallelism:
    description: BuildKit's [worker.oci] max-parallelism; empty leaves its default.
    required: false
    default: ""
  max-used-space:
    description: How much state a persistent builder keeps between jobs.
    required: false
    default: "30GB"

outputs:
  name:
    description: Name of the created builder.
    value: ${{ steps.buildx.outputs.name }}

runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        EXTRA_CONFIG: ${{ inputs.buildkitd-config-inline }}
        DRIVER_OPTS: ${{ inputs.driver-opts }}
        PERSISTENT: ${{ inputs.persistent }}
        MAX_PARALLELISM: ${{ inputs.max-parallelism }}
        MAX_USED_SPACE: ${{ inputs.max-used-space }}
        TRUST: ${{ (github.event_name == 'push' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main' && 'trusted' || 'untrusted' }}
      run: |
        set -euo pipefail
        config="$(mktemp "${RUNNER_TEMP:-/tmp}/buildkitd.XXXXXX.toml")"
        if [[ -r /etc/buildkit/buildkitd.toml ]]; then
          cp /etc/buildkit/buildkitd.toml "$config"
        else
          : > "$config"
        fi
        printf '\n%s\n' "$EXTRA_CONFIG" >> "$config"
        if grep -q '^\[worker\.oci\]' "$config"; then
          echo "::error::set [worker.oci] through the max-parallelism and max-used-space inputs"; exit 1
        fi
        [[ -z $MAX_PARALLELISM || $MAX_PARALLELISM =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid max-parallelism"; exit 1; }
        [[ $MAX_USED_SPACE =~ ^[1-9][0-9]*GB$ ]] || { echo "::error::invalid max-used-space"; exit 1; }
        worker=""
        [[ -z $MAX_PARALLELISM ]] || worker+="  max-parallelism = $MAX_PARALLELISM"$'\n'
        name=
        if [[ $PERSISTENT == true ]]; then
          # Bound the state kept between jobs; the slot's store also holds
          # images and a Rust target tree.
          worker+="  gc = true"$'\n'"  reservedSpace = \"2GB\""$'\n'"  maxUsedSpace = \"$MAX_USED_SPACE\""$'\n'"  minFreeSpace = \"30GB\""$'\n'
        fi
        [[ -z $worker ]] || printf '\n[worker.oci]\n%s' "$worker" >> "$config"
        if [[ $PERSISTENT == true ]]; then
          # A builder's configuration is fixed when its container starts, so
          # the name covers it; the slot's DinD maintenance keeps tilo-* state.
          digest=$( { cat "$config"; printf '%s' "$DRIVER_OPTS"; } | sha256sum | cut -c1-12)
          name="tilo-$TRUST-$digest"
          echo "::notice::persistent BuildKit builder $name"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        registry="${CI_LAYER_CACHE_REGISTRY:-registry.tilo.so}"
        [[ $registry =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]] || {
          echo "::error::invalid layer-cache registry: $registry"; exit 1;
        }
        echo "TILO_LAYER_CACHE_REGISTRY=$registry" >> "$GITHUB_ENV"
        echo "path=$config" >> "$GITHUB_OUTPUT"
        echo "::notice::BuildKit registries: $(grep -c '^\[registry' "$config" || true) pool entries; layer cache in $registry"
    - id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        driver: docker-container
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config: ${{ steps.config.outputs.path }}
        name: ${{ steps.config.outputs.name }}
        # Removes the builder container at the end of the job but keeps its
        # state volume, which the next job's builder of this name mounts.
        keep-state: ${{ inputs.persistent == 'true' }}
