name: Set up buildx with the runner pool's registries
description: >-
  Start a docker-container buildx builder whose buildkitd.toml combines the
  runner pool's registry configuration (/etc/buildkit/buildkitd.toml, when
  the pool provides one: a pull-through mirror of code.tilo.so with
  upstream fallback and the pool's layer-cache registry) with the caller's
  own daemon settings. Exports TILO_LAYER_CACHE_REGISTRY, the registry that
  holds this pool's BuildKit layer caches (code.tilo.so when the pool
  names none).

inputs:
  driver-opts:
    description: Extra docker-container driver options, one per line.
    required: false
    default: ""
  buildkitd-config-inline:
    description: Additional buildkitd.toml tables for this builder.
    required: false
    default: ""

outputs:
  name:
    description: Name of the created builder.
    value: ${{ steps.buildx.outputs.name }}

runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        EXTRA_CONFIG: ${{ inputs.buildkitd-config-inline }}
      run: |
        set -euo pipefail
        config="$(mktemp "${RUNNER_TEMP:-/tmp}/buildkitd.XXXXXX.toml")"
        if [[ -r /etc/buildkit/buildkitd.toml ]]; then
          cp /etc/buildkit/buildkitd.toml "$config"
        else
          : > "$config"
        fi
        printf '\n%s\n' "$EXTRA_CONFIG" >> "$config"
        registry="${CI_LAYER_CACHE_REGISTRY:-code.tilo.so}"
        [[ $registry =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]] || {
          echo "::error::invalid layer-cache registry: $registry"; exit 1;
        }
        echo "TILO_LAYER_CACHE_REGISTRY=$registry" >> "$GITHUB_ENV"
        echo "path=$config" >> "$GITHUB_OUTPUT"
        echo "::notice::BuildKit registries: $(grep -c '^\[registry' "$config" || true) pool entries; layer cache in $registry"
    - id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        driver: docker-container
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config: ${{ steps.config.outputs.path }}
