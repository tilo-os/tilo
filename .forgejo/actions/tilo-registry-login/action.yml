name: Log in to registry.tilo.so
description: >-
  Log a container client in to registry.tilo.so with the job's Forgejo Actions
  ID token. Requires `enable-openid-connect: true` on the job. Pulls are
  anonymous; only pushes need this.

inputs:
  registry:
    description: Registry host.
    default: registry.tilo.so
  audience:
    description: ID token audience the token service accepts.
    default: registry.tilo.so
  client:
    description: Container client to log in (docker, podman, buildah or skopeo).
    default: docker

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TILO_REGISTRY: ${{ inputs.registry }}
        TILO_REGISTRY_AUDIENCE: ${{ inputs.audience }}
        TILO_REGISTRY_CLIENT: ${{ inputs.client }}
      run: ${{ github.action_path }}/login.sh
