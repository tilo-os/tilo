name: Install checksum-pinned Cosign
description: Restore, verify, install, and persist the reviewed native Cosign binary.

inputs:
  cache-architecture:
    description: Architecture component used to isolate the native binary cache.
    required: true

runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: os/external-assets/cosign-cache
        key: cosign-v2.5.2-${{ inputs.cache-architecture }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
        restore-keys: cosign-v2.5.2-${{ inputs.cache-architecture }}-
    - shell: bash
      env:
        TILO_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
      run: ./os/dev/install-cached-cosign.sh
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: os/external-assets/cosign-cache
        key: cosign-v2.5.2-${{ inputs.cache-architecture }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
