name: Prepare Rust build
description: Ensure native build tools, restore Cargo downloads, and configure the optional remote compiler cache.

inputs:
  slot-cache:
    description: >-
      Mount the runner slot's persistent target/ and Cargo downloads
      (tools/ci/slot_cache.py). The job must mount the slot-cache volume of
      its trust class at /ci-slot-cache, and end with `slot_cache.py seal`.
    required: false
    default: "false"

outputs:
  cargo-cache-hit:
    description: Whether the exact Cargo.lock download cache was restored.
    value: ${{ steps.cargo-downloads.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Builder images created before the NTFS reader landed do not contain the
    # GNU build system needed to bootstrap its pinned source archive. Keep this
    # fallback until every runner has consumed a rebuilt Containerfile.builder;
    # on current images it is an inexpensive command check.
    - name: Ensure pinned NTFS build dependencies
      shell: bash
      run: |
        if test -d crates/session/tilo-ntfs-helper && ! command -v autoreconf >/dev/null; then
          dnf install -y autoconf automake libtool libgcrypt-devel
        fi

    # Before the download restore, which then fills the slot's registry with
    # whatever it lacks. Only a push to main is trusted; its volume is never
    # one a pull request or another branch wrote.
    - name: Mount the runner slot's Rust caches
      if: inputs.slot-cache == 'true'
      shell: bash
      env:
        SLOT_CACHE_TRUST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'trusted' || 'untrusted' }}
      run: python3 tools/ci/slot_cache.py mount --trust "$SLOT_CACHE_TRUST"

    - name: Restore Cargo downloads
      id: cargo-downloads
      uses: ./.forgejo/actions/restore-cargo-downloads

    - name: Configure optional compiler cache
      shell: bash
      run: bash tools/ci/sccache.sh prepare
