name: Merge the pull request onto its base branch
description: >-
  On a pull request, merge the checked-out head with its base branch (main, or
  the lower branch of a stack) so the job tests the result that would land.
  Every job of a run merges the same base commit (the select job's), so they
  test one tree. Outside pull requests this does nothing.

inputs:
  main:
    description: Base commit to merge; empty merges the base branch's current tip.
    required: false
    default: ""
outputs:
  main:
    description: The merged base commit, or empty outside pull requests.
    value: ${{ steps.merge.outputs.main }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      env:
        MAIN: ${{ inputs.main }}
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: bash "$GITHUB_ACTION_PATH/merge-main.sh"
