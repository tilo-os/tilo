name: Set up the Windows ARM64 cross toolchain
description: >-
  Prepare an ARM64 Linux runner to build aarch64-pc-windows-msvc binaries with
  cargo-xwin: LLVM's MSVC-compatible drivers, the Rust target, a cached
  cargo-xwin, and the shared compiler cache.

runs:
  using: composite
  steps:
    - name: Install LLVM's MSVC-compatible drivers and the Rust target
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        if ! command -v clang >/dev/null \
            || { ! command -v lld-link >/dev/null && ! command -v lld-link-18 >/dev/null; }; then
          if command -v dnf >/dev/null; then
            sudo dnf install -y clang lld
          elif command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          else
            echo 'No supported LLVM package manager on ARM64 runner' >&2
            exit 1
          fi
        fi
        bin="$RUNNER_TEMP/llvm-bin"
        mkdir -p "$bin"
        # Ubuntu's clang package omits the clang-cl link; Clang selects the
        # MSVC driver mode from this executable name.
        command -v clang-cl >/dev/null \
          || ln -s "$(command -v clang-18 || command -v clang)" "$bin/clang-cl"
        for tool in lld-link llvm-lib llvm-rc llvm-dlltool; do
          if ! command -v "$tool" >/dev/null \
              && path="$(command -v "${tool}-18")"; then
            ln -s "$path" "$bin/$tool"
          fi
        done
        export PATH="$bin:$PATH"
        printf '%s\n' "$bin" >> "$GITHUB_PATH"
        command -v clang-cl
        command -v lld-link
        command -v llvm-lib
        rustup target add aarch64-pc-windows-msvc

    # The runner image has no compiler cache client. Install the same
    # checksum-pinned sccache the builder images carry; the runner already
    # provides its backend configuration.
    - name: Materialize the pinned compiler-cache client
      uses: ./.forgejo/actions/cache-github-assets
      with:
        key: sccache-client-v1-aarch64
        assets: sccache-v0.17.0-aarch64-unknown-linux-musl.tar.gz
    - name: Enable the shared compiler cache
      shell: bash
      run: |
        set -euo pipefail
        name=sccache-v0.17.0-aarch64-unknown-linux-musl
        tar -xzf "os/external-assets/cache/$name.tar.gz" -C "$RUNNER_TEMP"
        printf '%s\n' "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
        # shellcheck disable=SC1091
        source tools/ci/compiler_cache_env.sh
        PATH="$RUNNER_TEMP/$name:$PATH" bash tools/ci/sccache.sh prepare

    - id: xwin
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: ~/.cache/tilo-ci-tools/cargo-xwin-0.23.1
        key: cargo-xwin-0.23.1-aarch64
    - name: Install the pinned cargo-xwin
      shell: bash
      run: |
        set -euo pipefail
        root="$HOME/.cache/tilo-ci-tools/cargo-xwin-0.23.1"
        if ! "$root/bin/cargo-xwin" --version >/dev/null 2>&1; then
          cargo install --locked cargo-xwin --version 0.23.1 --root "$root"
        fi
        printf '%s\n' "$root/bin" >> "$GITHUB_PATH"
    - if: steps.xwin.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: ~/.cache/tilo-ci-tools/cargo-xwin-0.23.1
        key: cargo-xwin-0.23.1-aarch64
