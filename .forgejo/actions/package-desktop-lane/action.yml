name: Package qOS desktop lane
description: Build and install-test all desktop package formats for one native architecture.

inputs:
  active:
    description: Whether the desktop dependency selector chose this component.
    required: true
  architecture:
    description: Debian architecture name (amd64 or arm64).
    required: true
  targets:
    description: Newline-separated distro, image, and revision tuples.
    required: true

runs:
  using: composite
  steps:
    - name: Desktop component unaffected
      if: inputs.active != 'true'
      shell: bash
      run: echo 'No desktop dependency changed; native packaging is skipped.'

    - name: Restore checksum-pinned GitHub build inputs
      if: inputs.active == 'true'
      id: github-assets-cache
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: os/external-assets/cache
        key: desktop-external-inputs-${{ hashFiles('os/external-assets/github-assets.tsv') }}
        restore-keys: |
          github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          github-assets-all-v1-

    - name: Materialize the architecture-specific compiler cache client
      if: inputs.active == 'true'
      shell: bash
      run: |
        case '${{ inputs.architecture }}' in
          amd64) target=x86_64-unknown-linux-musl ;;
          arm64) target=aarch64-unknown-linux-musl ;;
          *) printf 'unsupported package architecture: %s\n' '${{ inputs.architecture }}' >&2; exit 1 ;;
        esac
        os/dev/cache-github-assets.sh "sccache-v0.17.0-${target}.tar.gz"

    - name: Save checksum-pinned compiler input immediately
      if: inputs.active == 'true' && steps.github-assets-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: os/external-assets/cache
        key: desktop-external-inputs-${{ hashFiles('os/external-assets/github-assets.tsv') }}

    - name: Build four native ABI payloads and install-test five userspaces
      if: inputs.active == 'true'
      env:
        QOS_LANE_TARGETS: ${{ inputs.targets }}
      shell: bash
      run: |
        status=0
        while IFS='|' read -r distro image revision; do
          [[ -n $distro ]] || continue
          echo "::group::$distro / ${{ inputs.architecture }}"
          if ! dist/ci/run-package-job.sh \
              "$distro" "$image" "${{ inputs.architecture }}" "$revision"; then
            status=1
          fi
          echo "::endgroup::"
        done <<<"$QOS_LANE_TARGETS"
        exit "$status"

    - name: Upload Arch artifacts
      if: always() && inputs.active == 'true'
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: arch-${{ inputs.architecture }}
        path: dist/ci-output/arch-${{ inputs.architecture }}/*
        if-no-files-found: error

    - name: Upload Nix artifacts
      if: always() && inputs.active == 'true'
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: nix-${{ inputs.architecture }}
        path: dist/ci-output/nix-${{ inputs.architecture }}/*
        if-no-files-found: error

    - name: Upload Ubuntu artifacts
      if: always() && inputs.active == 'true'
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: ubuntu-24.04-${{ inputs.architecture }}
        path: dist/ci-output/ubuntu-24.04-${{ inputs.architecture }}/*
        if-no-files-found: error

    - name: Upload Debian artifacts
      if: always() && inputs.active == 'true'
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: debian-13-${{ inputs.architecture }}
        path: dist/ci-output/debian-13-${{ inputs.architecture }}/*
        if-no-files-found: error

    - name: Upload Fedora artifacts
      if: always() && inputs.active == 'true'
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: fedora-44-${{ inputs.architecture }}
        path: dist/ci-output/fedora-44-${{ inputs.architecture }}/*
        if-no-files-found: error
