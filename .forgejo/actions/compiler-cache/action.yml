name: Compiler cache
description: >-
  Select the runner compiler cache, or this repository's cache when the runner
  injects none, and point Cargo at it. The job passes the repository cache key
  as FALLBACK_AWS_ACCESS_KEY_ID and FALLBACK_AWS_SECRET_ACCESS_KEY; without a
  usable cache it compiles normally.

runs:
  using: composite
  steps:
    - name: Select the compiler cache
      shell: bash
      run: bash tools/ci/compiler_cache_env.sh

    - name: Configure optional compiler cache
      shell: bash
      run: bash tools/ci/sccache.sh prepare
