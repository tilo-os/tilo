name: Release / System extension manifests

# Resolves every downloadable system extension (tools/extensions/*/recipe.toml)
# for published OS images, and publishes one signed manifest per extension,
# architecture and base package fingerprint
# (os/usr/share/tilo/system-extensions/README.md, "Downloaded system
# extensions"):
#
#   <generic packages>/tilo-extension-<id>/<arch>-<fingerprint>/manifest.json[.sig]
#   <generic packages>/tilo-extension-<id>/<arch>-<fingerprint>/manifest-r<revision>.json[.sig]
#
# The resolver runs inside each image on its native architecture: the image's
# own rpm database is the base and its own dnf5 and rpmkeys fetch and check the
# upstream packages. That lane holds no signing credentials. A separate job
# signs each manifest with the OS release key and publishes it, only from main.
#
# Triggers:
#   schedule           daily: mirrors drop superseded builds and publishers ship
#                      updates, so every published channel is resolved again;
#                      a resolution that changes nothing publishes nothing
#   workflow_dispatch  the images to resolve; Release / OS requests this for
#                      each image it publishes. Dispatched from another ref it
#                      resolves and keeps the manifests as artifacts only.
#
# Release / OS starts this by dispatch rather than as a reusable workflow:
# Forgejo gives no OIDC credentials to expanded reusable jobs, so a called
# workflow could not sign.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated OS images: registry.tilo.so/tilo/{tilo,tilo-ci,tilo-vm} by :tag or @sha256:... (an index resolves every architecture it holds). Empty resolves tilo:latest, tilo-vm:latest and tilo-vm:main-ci."
        required: false
        default: ""

concurrency:
  # One publisher per base at a time: a manifest revision must only grow.
  group: tilo-extension-manifests
  cancel-in-progress: false

jobs:
  plan:
    runs-on: runner
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lanes: ${{ steps.plan.outputs.lanes }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Install OCI inspection tooling
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends jq skopeo
          elif command -v dnf >/dev/null; then
            sudo -n dnf install -y jq skopeo
          else
            echo '::error::planning runner must provide apt-get or dnf'
            exit 1
          fi
      - name: Pin each image's native children by digest
        id: plan
        env:
          INPUT_IMAGES: ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail
          images=(${INPUT_IMAGES:-})
          explicit=true
          if [[ ${#images[@]} -eq 0 ]]; then
            explicit=false
            images=(registry.tilo.so/tilo/tilo:latest registry.tilo.so/tilo/tilo-vm:latest
                    registry.tilo.so/tilo/tilo-vm:main-ci)
          fi
          declare -A runners=([x86_64]=runner-large [aarch64]=runner-large-arm64)
          lanes='[]'
          for image in "${images[@]}"; do
            [[ $image =~ ^(registry\.tilo\.so/tilo/tilo(-ci|-vm)?)(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]] || {
              echo "::error::not a published OS image: $image"
              exit 1
            }
            repository=${BASH_REMATCH[1]}
            if ! raw=$(skopeo inspect --raw "docker://$image" 2>/dev/null); then
              if [[ $explicit == true ]]; then
                echo "::error::$image does not exist"
                exit 1
              fi
              echo "::notice::$image is not published; skipping it"
              continue
            fi
            if jq -e '.manifests' <<< "$raw" >/dev/null; then
              children=$(jq -c '[.manifests[] | select(.platform.os == "linux")
                | {platform: .platform.architecture, digest: .digest}]' <<< "$raw")
            else
              digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
              platform=$(skopeo inspect "docker://$repository@$digest" | jq -er .Architecture)
              children=$(jq -cn --arg platform "$platform" --arg digest "$digest" '[{platform:$platform,digest:$digest}]')
            fi
            while read -r platform digest; do
              case "$platform" in
                amd64) arch=x86_64 ;;
                arm64) arch=aarch64 ;;
                *) echo "::notice::$image holds a $platform child; no extension lane serves it"; continue ;;
              esac
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image names child $digest"; exit 1; }
              lanes=$(jq -c --arg arch "$arch" --arg runner "${runners[$arch]}" \
                --arg image "$repository@$digest" --arg source "$image" \
                '. + [{arch:$arch,runner:$runner,image:$image,source:$source,key:($arch + "-" + ($image | split("@sha256:")[1][0:16]))}]' \
                <<< "$lanes")
            done < <(jq -r '.[] | "\(.platform) \(.digest)"' <<< "$children")
          done
          lanes=$(jq -c 'unique_by(.image) | sort_by(.key)' <<< "$lanes")
          publish=false
          [[ $GITHUB_REF == refs/heads/main ]] && publish=true
          {
            echo "lanes=$(jq length <<< "$lanes")"
            echo "matrix=$(jq -c '{include:.}' <<< "$lanes")"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          jq -r '.[] | "::notice::\(.arch): \(.image) (\(.source))"' <<< "$lanes"

  resolve:
    needs: plan
    if: needs.plan.outputs.lanes != '0'
    strategy:
      # Each image publishes on its own; one failing must not hold back another.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      OUT: ${{ github.workspace }}/extension-manifests/${{ matrix.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the image's native architecture
        run: ./os/dev/assert-native-arch.sh "$ARCH"
      - name: Install Podman
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get -o Acquire::Retries=3 update
            sudo -n apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              e2fsprogs fuse-overlayfs jq podman slirp4netns uidmap util-linux
          elif command -v dnf >/dev/null; then
            sudo -n dnf --setopt=retries=3 install -y \
              e2fsprogs fuse-overlayfs jq podman shadow-utils slirp4netns util-linux
          else
            echo '::error::native runner must provide apt-get or dnf'
            exit 1
          fi
      - name: Use a native overlay store for the OS image
        env:
          TILO_PODMAN_STORE_SIZE: 40G
        run: |
          set -euo pipefail
          bash os/dev/ci-prepare-disk-devices.sh --kata-job
          bash os/dev/ci-native-podman-store.sh
      - name: Resolve every extension inside the image
        run: |
          set -euo pipefail
          podman pull "$IMAGE"
          case "$(podman image inspect "$IMAGE" --format '{{.Architecture}}')" in
            amd64) [[ $ARCH == x86_64 ]] ;;
            arm64) [[ $ARCH == aarch64 ]] ;;
            *) false ;;
          esac || { echo "::error::$IMAGE is not a native $ARCH image"; exit 1; }
          mkdir -p "$OUT"
          for recipe in tools/extensions/*/recipe.toml; do
            id=$(basename "$(dirname "$recipe")")
            podman run --rm --network host --security-opt label=disable \
              --volume "$PWD/tools/extensions:/extensions:ro" --volume "$OUT:/out" \
              --entrypoint python3 "$IMAGE" /extensions/resolve.py resolve \
              --recipe "/extensions/$id/recipe.toml" --image "$IMAGE" --out "/out/$id.json"
            python3 tools/extensions/resolve.py check "$OUT/$id.json"
          done
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: extension-manifests-${{ matrix.key }}
          path: extension-manifests/${{ matrix.key }}
          if-no-files-found: error

  publish:
    needs: [plan, resolve]
    # Publish every lane that resolved, even when another failed.
    if: ${{ always() && needs.plan.outputs.publish == 'true' && needs.plan.outputs.lanes != '0' }}
    runs-on: runner
    timeout-minutes: 30
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        continue-on-error: true
        with:
          path: extension-manifests
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Install publication tooling
        run: |
          set -euo pipefail
          command -v jq >/dev/null && exit 0
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends jq
          else
            sudo -n dnf install -y jq
          fi
      - name: Sign and publish each resolved manifest
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TILO_PACKAGE_PUBLIC_BASE_URL: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          os/dev/require-cosign-authority.sh
          mapfile -t manifests < <(find extension-manifests -type f -name '*.json' -print 2>/dev/null | LC_ALL=C sort)
          [[ ${#manifests[@]} -gt 0 ]] || { echo '::error::no lane resolved a manifest'; exit 1; }
          failed=0
          for manifest in "${manifests[@]}"; do
            tools/extensions/publish.sh "$manifest" || failed=1
          done
          exit "$failed"
