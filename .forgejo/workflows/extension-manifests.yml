name: Release / System extension manifests

# Resolves every downloadable system extension (tools/extensions/*/recipe.toml)
# for published OS images, and publishes one signed manifest per extension,
# architecture and base package fingerprint
# (os/usr/share/tilo/system-extensions/README.md, "Downloaded system
# extensions"):
#
#   <generic packages>/tilo-extension-<id>/<arch>-<fingerprint>/manifest.json[.sig]
#   <generic packages>/tilo-extension-<id>/<arch>-<fingerprint>/manifest-r<revision>.json[.sig]
#
# The resolver runs inside each image on its native architecture: the image's
# own rpm database is the base and its own dnf5 and rpmkeys fetch and check the
# upstream packages. That lane holds no signing credentials. A separate job
# signs each manifest with the extension-manifest key and publishes it, only
# from main.
#
# Triggers:
#   schedule           daily: mirrors drop superseded builds and publishers ship
#                      updates, so every published channel is resolved again;
#                      a resolution that changes nothing publishes nothing
#   workflow_dispatch  the images to resolve; Release / OS requests this for
#                      each release it promotes (development images wait for
#                      the daily run). Dispatched from another ref it
#                      resolves and keeps the manifests as artifacts only.
#
# Release / OS starts this by dispatch rather than as a reusable workflow:
# Forgejo gives no OIDC credentials to expanded reusable jobs, so a called
# workflow could not sign.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated OS images: registry.tilo.so/tilo/{tilo,tilo-ci,tilo-vm} by :tag or @sha256:... (an index resolves every architecture it holds). Empty resolves tilo:latest, tilo-vm:latest and tilo-vm:main-ci."
        required: false
        default: ""
      publish:
        description: "Promote the signed manifest into the client feed. False produces a signed CI artifact only."
        type: boolean
        default: true
      expected_content_sha256:
        description: "Reviewed media-codecs content hash from resolve.py content-sha256; required for sign-only, binds the image and artifact set."
        required: false
        default: ""

concurrency:
  # One publisher per base at a time: a manifest revision must only grow.
  group: tilo-extension-manifests
  cancel-in-progress: false

jobs:
  plan:
    runs-on: runner
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lanes: ${{ steps.plan.outputs.lanes }}
      publish: ${{ steps.plan.outputs.publish }}
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - name: Install OCI inspection tooling
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends jq skopeo
          elif command -v dnf >/dev/null; then
            sudo -n dnf install -y jq skopeo
          else
            echo '::error::planning runner must provide apt-get or dnf'
            exit 1
          fi
      - name: Pin each image's native children by digest
        id: plan
        env:
          INPUT_IMAGES: ${{ github.event.inputs.images }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          EXPECTED_CONTENT_SHA256: ${{ github.event.inputs.expected_content_sha256 }}
        run: |
          set -euo pipefail
          images=(${INPUT_IMAGES:-})
          explicit=true
          promote=${INPUT_PUBLISH:-true}
          [[ $promote == true || $promote == false ]] || { echo '::error::publish must be true or false'; exit 1; }
          if [[ $promote == false || -n $EXPECTED_CONTENT_SHA256 ]]; then
            [[ ${#images[@]} == 1 && ${images[0]} == *@sha256:* && $EXPECTED_CONTENT_SHA256 =~ ^[0-9a-f]{64}$ ]] \
              || { echo '::error::qualification requires one immutable image and a reviewed content hash'; exit 1; }
          fi
          if [[ ${#images[@]} -eq 0 ]]; then
            explicit=false
            images=(registry.tilo.so/tilo/tilo:latest registry.tilo.so/tilo/tilo-vm:latest
                    registry.tilo.so/tilo/tilo-vm:main-ci)
          fi
          declare -A runners=([x86_64]=runner-large [aarch64]=runner-large-arm64)
          lanes='[]'
          for image in "${images[@]}"; do
            [[ $image =~ ^(registry\.tilo\.so/tilo/tilo(-ci|-vm)?)(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]] || {
              echo "::error::not a published OS image: $image"
              exit 1
            }
            repository=${BASH_REMATCH[1]}
            if ! raw=$(skopeo inspect --raw "docker://$image" 2>/dev/null); then
              if [[ $explicit == true ]]; then
                echo "::error::$image does not exist"
                exit 1
              fi
              echo "::notice::$image is not published; skipping it"
              continue
            fi
            if jq -e '.manifests' <<< "$raw" >/dev/null; then
              children=$(jq -c '[.manifests[] | select(.platform.os == "linux")
                | {platform: .platform.architecture, digest: .digest}]' <<< "$raw")
            else
              digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
              platform=$(skopeo inspect "docker://$repository@$digest" | jq -er .Architecture)
              children=$(jq -cn --arg platform "$platform" --arg digest "$digest" '[{platform:$platform,digest:$digest}]')
            fi
            while read -r platform digest; do
              case "$platform" in
                amd64) arch=x86_64 ;;
                arm64) arch=aarch64 ;;
                *) echo "::notice::$image holds a $platform child; no extension lane serves it"; continue ;;
              esac
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image names child $digest"; exit 1; }
              lanes=$(jq -c --arg arch "$arch" --arg runner "${runners[$arch]}" \
                --arg image "$repository@$digest" --arg source "$image" \
                '. + [{arch:$arch,runner:$runner,image:$image,source:$source,key:($arch + "-" + ($image | split("@sha256:")[1][0:16]))}]' \
                <<< "$lanes")
            done < <(jq -r '.[] | "\(.platform) \(.digest)"' <<< "$children")
          done
          lanes=$(jq -c 'unique_by(.image) | sort_by(.key)' <<< "$lanes")
          if [[ -n $EXPECTED_CONTENT_SHA256 && $(jq length <<< "$lanes") != 1 ]]; then
            echo '::error::reviewed qualification must resolve exactly one native image'
            exit 1
          fi
          publish=false
          [[ $GITHUB_REF == refs/heads/main ]] && publish=true
          {
            echo "lanes=$(jq length <<< "$lanes")"
            echo "matrix=$(jq -c '{include:.}' <<< "$lanes")"
            echo "publish=$publish"
            echo "promote=$promote"
          } >> "$GITHUB_OUTPUT"
          jq -r '.[] | "::notice::\(.arch): \(.image) (\(.source))"' <<< "$lanes"

  resolve:
    needs: plan
    if: needs.plan.outputs.lanes != '0'
    strategy:
      # Each image publishes on its own; one failing must not hold back another.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      OUT: ${{ github.workspace }}/extension-manifests/${{ matrix.key }}
      EXPECTED_CONTENT_SHA256: ${{ github.event.inputs.expected_content_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the image's native architecture
        run: ./os/dev/assert-native-arch.sh "$ARCH"
      - name: Install Podman
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get -o Acquire::Retries=3 update
            sudo -n apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              e2fsprogs fuse-overlayfs jq podman slirp4netns uidmap util-linux
          elif command -v dnf >/dev/null; then
            sudo -n dnf --setopt=retries=3 install -y \
              e2fsprogs fuse-overlayfs jq podman shadow-utils slirp4netns util-linux
          else
            echo '::error::native runner must provide apt-get or dnf'
            exit 1
          fi
      - name: Use a native overlay store for the OS image
        env:
          TILO_PODMAN_STORE_SIZE: 40G
        run: |
          set -euo pipefail
          bash os/dev/ci-prepare-disk-devices.sh --kata-job
          bash os/dev/ci-native-podman-store.sh
      - name: Resolve every extension inside the image
        run: |
          set -euo pipefail
          podman pull "$IMAGE"
          case "$(podman image inspect "$IMAGE" --format '{{.Architecture}}')" in
            amd64) [[ $ARCH == x86_64 ]] ;;
            arm64) [[ $ARCH == aarch64 ]] ;;
            *) false ;;
          esac || { echo "::error::$IMAGE is not a native $ARCH image"; exit 1; }
          mkdir -p "$OUT"
          for recipe in tools/extensions/*/recipe.toml; do
            id=$(basename "$(dirname "$recipe")")
            [[ -z $EXPECTED_CONTENT_SHA256 || $id == media-codecs ]] || continue
            podman run --rm --network host --security-opt label=disable \
              --volume "$PWD/tools/extensions:/extensions:ro" --volume "$OUT:/out" \
              --entrypoint python3 "$IMAGE" /extensions/resolve.py resolve \
              --recipe "/extensions/$id/recipe.toml" --image "$IMAGE" --out "/out/$id.json"
            qualification=()
            [[ -z $EXPECTED_CONTENT_SHA256 ]] || qualification=(--expected-content-sha256 "$EXPECTED_CONTENT_SHA256")
            python3 tools/extensions/resolve.py check "$OUT/$id.json" "${qualification[@]}"
          done
      # Prebuilt, Tilo-built sysext images are not resolved from upstream
      # repositories: build-image.yml publishes the image and a descriptor per
      # commit (publish-windows-compat); this pins them for this image's base.
      - name: Pin the Windows compatibility system extension for this image
        if: ${{ env.EXPECTED_CONTENT_SHA256 == '' }}
        env:
          PACKAGE_BASE: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          base=${PACKAGE_BASE%/}
          revision=$(podman image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ $revision =~ ^[0-9a-f]{40}$ ]] || { echo "::notice::$IMAGE names no source revision; no Windows compatibility system extension"; exit 0; }
          descriptor=$(mktemp)
          status=$(curl --silent --show-error --retry 3 --output "$descriptor" --write-out '%{http_code}' \
            "$base/tilo-windows-compat-image/$ARCH-$revision/descriptor.json")
          if [[ $status == 404 ]]; then
            echo "::notice::no Windows compatibility system extension was published for $revision"
            exit 0
          fi
          [[ $status == 200 ]] || { echo "::error::reading the descriptor answered HTTP $status"; exit 1; }
          fingerprint=$(podman run --rm --security-opt label=disable \
            --volume "$PWD/tools/extensions:/extensions:ro" \
            --entrypoint python3 "$IMAGE" /extensions/resolve.py fingerprint)
          sha256=$(jq -er .sha256 "$descriptor")
          python3 tools/extensions/sysext_image.py manifest --id windows-compat --descriptor "$descriptor" \
            --url "$base/tilo-windows-compat-image/$ARCH-$sha256/tilo-windows-compat.raw" \
            --fingerprint "$fingerprint" --image "$IMAGE" --arch "$ARCH" --out "$OUT/windows-compat.json"
          python3 tools/extensions/resolve.py check "$OUT/windows-compat.json"
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: extension-manifests-${{ matrix.key }}
          path: extension-manifests/${{ matrix.key }}
          if-no-files-found: error

  publish:
    needs: [plan, resolve]
    # Publish every lane that resolved, even when another failed.
    if: ${{ always() && needs.plan.outputs.publish == 'true' && needs.plan.outputs.lanes != '0' }}
    runs-on: runner
    timeout-minutes: 30
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        continue-on-error: true
        with:
          path: extension-manifests
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Install publication tooling
        run: |
          set -euo pipefail
          command -v jq >/dev/null && exit 0
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends jq
          else
            sudo -n dnf install -y jq
          fi
      - name: Sign and publish each resolved manifest
        env:
          # The extension-manifest key, not the OS release key: devices verify
          # manifests only against keys/extensions.pub. The role trusts only
          # tilo/tilo main with this audience, which no other workflow requests.
          COSIGN_KEY_REF: awskms:///arn:aws:kms:us-east-1:125650147312:key/60953e72-5a65-4651-af19-cb4b9e10572d
          AWS_SIGNING_ROLE_ARN: arn:aws:iam::125650147312:role/TiloForgejoExtensionManifestSigner
          TILO_SIGNING_AUDIENCE: tilo-extension-manifests
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TILO_PACKAGE_PUBLIC_BASE_URL: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
          TILO_EXPECTED_EXTENSION_CONTENT_SHA256: ${{ github.event.inputs.expected_content_sha256 }}
          PROMOTE: ${{ needs.plan.outputs.promote }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          (
            public_key=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/tilo-extension-public-key.XXXXXX")
            trap 'rm -f -- "$public_key"' EXIT
            if ! cosign public-key --key "$COSIGN_KEY_REF" > "$public_key"; then
              echo '::error::could not retrieve the KMS extension-manifest public key; see the Cosign identity/KMS error above'
              exit 1
            fi
            cmp --silent keys/extensions.pub "$public_key" \
              || { echo '::error::the KMS extension-manifest key does not match keys/extensions.pub'; exit 1; }
          )
          mapfile -t manifests < <(find extension-manifests -type f -name '*.json' -print 2>/dev/null | LC_ALL=C sort)
          [[ ${#manifests[@]} -gt 0 ]] || { echo '::error::no lane resolved a manifest'; exit 1; }
          failed=0
          for manifest in "${manifests[@]}"; do
            mode=()
            [[ $PROMOTE == true ]] || mode=(--sign-only)
            tools/extensions/publish.sh "${mode[@]}" "$manifest" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: ${{ success() && needs.plan.outputs.promote == 'false' }}
        with:
          name: extension-manifests-signed-qualification
          path: extension-manifests/
          if-no-files-found: error
