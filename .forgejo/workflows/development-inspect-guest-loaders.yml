name: Development / inspect retained guest loaders
on:
  workflow_dispatch:
concurrency:
  group: development-inspect-guest7532
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: runner-disk-100g-arm64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Inspect public files without guest execution
        run: |
          command -v readelf docker python3
          python3 os/tests/test_guest_loader_inspection.py
          python3 os/dev/inspect-retained-guest-loaders.py --output "$RUNNER_TEMP/guest-loader-inspection"
      - name: Retain small public diagnostics
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: guest7532-loaders-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guest-loader-inspection/
          retention-days: 7
