name: Dev / runtime-macos

# The per-user runtime (`tilo-runtime`) is the Tilo host on machines without
# the Tilo desktop, stock macOS first. Its library, standalone services and
# `tilo-runtime` executable must keep building there, which no Linux lane
# observes. It requests no OIDC token and runs on the persistent development
# runner (`macos-aarch64`), never on the ephemeral release label
# `imager-macos-aarch64`, so release-signing credentials are never minted for it.
# The paths between the generated markers are exactly tilo-runtime's dependency
# closure, written by tools/policy/check_workflow_package_paths.py --write and
# checked by that script's step in the repository policy suite: the one Mac only
# sees changes that can break it, and a dependency added to the runtime cannot
# leave this lane behind by being forgotten here.
on:
  push:
    branches: ["main"]
    paths:
      - ".cargo/config.toml"
      - ".forgejo/workflows/dev-runtime-macos.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      # Generated: the package's dependency closure (tools/policy/check_workflow_package_paths.py --write)
