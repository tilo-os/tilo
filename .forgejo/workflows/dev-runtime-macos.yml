# One Mac serves every macOS job: a newer commit replaces the run of the one
# before, on a pull request and on main alike.
concurrency:
  group: dev-runtime-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-aarch64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/stable-source
      - name: Check the runtime, its tests and executable on macOS
        working-directory: ${{ env.SRC }}
        run: cargo check -p tilo-runtime --all-targets --locked
