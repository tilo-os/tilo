name: Dev / runtime-macos

# The per-user runtime (`tilo-runtime`) is the Tilo host on machines without
# the Tilo desktop, stock macOS first. Its library, standalone services and
# `tilo-runtime` executable must keep building there, which no Linux lane
# observes. It requests no OIDC token: the macOS runners' release-signing
# credentials are never minted for it.
# Manual only: no macOS runner serves imager-macos-aarch64. When one is
# registered, add a pull_request trigger whose paths cover tilo-runtime's
# dependency closure (tools/policy/check_workflow_package_paths.py audits it).
on:
  workflow_dispatch:

jobs:
  check:
    # Disabled: no runner serves the imager-macos-* labels yet.
    if: false
    runs-on: imager-macos-aarch64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the runtime, its tests and executable on macOS
        run: cargo check -p tilo-runtime --all-targets --locked
