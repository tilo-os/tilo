name: Dev / runtime-macos

# The per-user runtime (`tilo-runtime`) is the Tilo host on machines without
# the Tilo desktop, stock macOS first. Its library, standalone services and
# `tilo-runtime` executable must keep building there, which no Linux lane
# observes. It requests no OIDC token and runs on the persistent development
# runner (`macos-aarch64`), never on the ephemeral release label
# `imager-macos-aarch64`, so release-signing credentials are never minted for it.
# The paths cover tilo-runtime's dependency closure
# (tools/policy/check_workflow_package_paths.py audits it).
on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/config.toml"
      - ".forgejo/workflows/dev-runtime-macos.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "vendor/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/config.toml"
      - ".forgejo/workflows/dev-runtime-macos.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "vendor/**"
  workflow_dispatch:

# One Mac serves every macOS job: a newer commit replaces the run of the one
# before, on a pull request and on main alike.
concurrency:
  group: dev-runtime-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-aarch64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Check the runtime, its tests and executable on macOS
        run: cargo check -p tilo-runtime --all-targets --locked
