name: CI / nightly

# This is the coverage backstop for dependency-aware pull-request CI. Every
# Cargo package and every target is checked, every test is executed and the
# security fuzz targets run daily.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  fuzz:
    needs: builder
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      # cargo-fuzz needs nightly sanitizer instrumentation. Tool and compiler
      # are pinned so a moving installer cannot change the security gate.
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-25 --profile minimal
          cargo +nightly-2026-08-25 install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz tapp ingress, invite chains, identity wire formats and sandbox policy
        run: |
          for target in tapp_ingress collab_invite_chain identity_wire sandbox_policy; do
            cargo +nightly-2026-08-25 fuzz run "$target" -- -max_total_time=900 -timeout=10
          done

  # Formatting has its own job. As a step ahead of the tests, one unformatted
  # file stopped every test, check and certification from running, so a
  # formatting slip hid all real results for as long as it stayed on main.
  formatting:
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:966b27dabfda95813588c06e38479de91e206f7179ae2c6230bff7f59e7466fc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Check complete workspace formatting
        # Workspace members only: --all also formats path dependencies, and
        # the vendor/ forks must stay byte-identical to their upstream trees.
        run: cargo fmt --check

  complete:
    strategy:
      fail-fast: false
      matrix:
        # The whole-workspace target tree does not fit beside a generic
        # slot's caches; the disk classes have room for it.
        include:
          - arch: x86_64
            runner: runner-disk-100g
          - arch: aarch64
            runner: runner-disk-100g-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      # Visual goldens are meaningful only when fonts, Mesa and the software
      # renderer are byte-for-byte identical to the reviewed refresh job.
      # Advance this digest together with dev-visual-baselines.yml.
      image: registry.tilo.so/tilo/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
    env:
      CARGO_HOME: /cargo-home
      # Both disk-class slots have the memory for four compiler processes;
      # one left the aarch64 workspace build alone at 130 minutes.
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # Keep dev and test fingerprints compatible. The all-target check and
      # example links can then reuse dependencies emitted by nextest instead
      # of rebuilding the workspace merely to add unused CI debuginfo.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.${{ matrix.arch }}.json
      WGPU_ADAPTER_NAME: llvmpipe
      XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
      # Property tests that default to a short run for pull requests read
      # this and search the full case count once a day. 256 is proptest's
      # own default, so tests without an explicit count are unaffected.
      PROPTEST_CASES: "256"
      # The builder image carries the encoders and muxers the footage tests
      # need, so their absence here is a failure, not a skip.
      TILO_REQUIRE_MEDIA: "1"
      # llvmpipe is always present here: a GPU test that cannot get an
      # adapter is a failure, not a skip.
      TILO_REQUIRE_GPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Read the shared test filters
        run: python3 tools/ci/nextest_filters.py >> "$GITHUB_ENV"

      - name: Prepare Rust build caches
        id: rust-build
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare headless runtime
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          test -r "$VK_DRIVER_FILES"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      # This golden-pinned image predates the audio fixture. Install only new
      # packages or replace the audio daemon: never update fonts, Mesa or libraries.
      # A dependency requiring an existing package upgrade must fail the job.
      - name: Ensure isolated audio test dependency
        run: bash tools/ensure-headless-audio.sh

      # The same image predates the private session bus tests (tilo-os-search)
      # and the launcher's bus-filter tests (xdg-dbus-proxy).
      - name: Ensure session-bus test tools
        run: bash tools/ci/ensure-session-bus-tools.sh

      # Pinned/older builders may predate native PDF capture coverage. Stage
      # only the verified runtime; leave Mesa, fonts and OS packages unchanged.
      # Where the runner's kernel can enforce Landlock, the PDF helper's
      # sandbox is also required rather than allowed to stand down.
      - name: Ensure native PDF capture dependency
        run: |
          asset=$(bash tools/ci/install-pdfium.sh --asset-name)
          ./os/dev/cache-github-assets.sh "$asset"
          library=$(bash tools/ci/install-pdfium.sh os/external-assets/cache /usr os/external-assets/github-assets.tsv)
          printf 'TILO_PDFIUM_LIB=%s\n' "$library" >> "$GITHUB_ENV"
          bash tools/ci/require-pdf-sandbox.sh

      # The governed browser voice test drives two real Chromium profiles, as
      # in check.yml. Installing it adds packages and upgrades none in the
      # pinned image, so the renderer behind the visual goldens is unchanged.
      - name: Prepare governed browser voice fixture
        run: |
          dnf install -y --setopt=install_weak_deps=False chromium
          printf 'CHROME=%s\n' "$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          npm ci --prefix scripts/moq-browser
          node scripts/moq-browser/build.mjs

      - name: Workspace membership guard
        run: ./scripts/check-workspace-complete.sh

      # Build/run tests first so the following checks can reuse emitted
      # rlibs/rmeta instead of compiling metadata before codegen.
      # Every test run uses LANG=C.UTF-8, TZ=UTC and a fresh HOME/XDG tree
      # (tools/test-env.sh, through tools/with-test-environment.sh).
      - name: Run every workspace test
        id: workspace-tests
        env:
          TILO_REQUIRE_AUDIO: "1"
        run: >-
          bash tools/ci/measure.sh "nightly workspace nextest" --
          bash scripts/ci-run.sh "cargo nextest --workspace" --
          bash tools/test-env.sh cargo nextest run --workspace --locked --profile ci
          -E "not ($GOLDEN_FILTER)"

      # Both nextest runs below write target/nextest/ci/junit.xml; keep each
      # run's report. The ci profile does not retry; the summary still lists
      # slow tests and any case that only passed on a retry.
      - name: Report retried workspace tests
        if: always()
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/workspace.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "nightly workspace (${{ matrix.arch }})" target/ci/junit/workspace.xml

      # This reuses the artifacts compiled above and executes the same number
      # of tests as before. A separate job would duplicate the workspace build;
      # running at the tail makes llvmpipe/lavapipe idle without extra CPU.
      # This and the checks below also run when the workspace suite failed,
      # so every nightly reports each suite's own result.
      - name: Verify visual goldens on an idle renderer
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        run: >-
          bash tools/ci/measure.sh "nightly isolated visual goldens" --
          bash scripts/ci-run.sh "cargo nextest visual goldens" --
          bash tools/test-env.sh cargo nextest run --workspace --locked --profile ci
          -E "$GOLDEN_FILTER"

      - name: Report retried visual goldens
        if: always()
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/visual-goldens.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "nightly visual goldens (${{ matrix.arch }})" target/ci/junit/visual-goldens.xml

      # The fast and complete workspace suites stay deterministic. This one
      # intentionally queries third-party music services; retain its coverage
      # nightly without making ordinary pushes depend on external uptime.
      - name: Probe live music search and stream resolution
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        continue-on-error: true
        run: >-
          bash tools/ci/measure.sh "nightly live music integration" --
          cargo nextest run -p music --locked --profile ci --run-ignored all
          -E 'test(live_search_and_stream_resolve_through_the_app)'

      - name: Check every workspace target
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        run: >-
          bash tools/ci/measure.sh "nightly all-target check" --
          bash scripts/ci-run.sh "cargo check --workspace --all-targets" --
          cargo check --workspace --locked --all-targets

      # Source-level protocol checks prevent an app from opting out, but only
      # the laid-out production root can prove that visible effect controls
      # resolve to live resources/actions (and that no stale or legacy binding
      # remains). tilo-app builds the graphical apps as one Cargo graph, then
      # runs every binary's deterministic --native-audit entry point.
      - name: Certify every production app action surface
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        run: >-
          bash tools/ci/measure.sh "nightly native app certification" --
          bash scripts/ci-run.sh "tilo-app certify --workspace" --
          cargo run --locked -p tilo-app-cli --bin tilo-app -- certify --workspace

      # `cargo check --all-targets` type-checks examples but neither links nor
      # runs their test harnesses. Reuse the test-profile artifacts above to do
      # both here, once per day rather than in a separate job or on every pull
      # request.
      - name: Test every workspace example
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        run: >-
          bash tools/ci/measure.sh "nightly workspace examples" --
          bash scripts/ci-run.sh "cargo test --workspace --examples" --
          bash tools/with-test-environment.sh
          cargo test --workspace --examples --locked

      # Ignored tests whose requirement this runner meets: the shell ones
      # spawn a real headless compositor (llvmpipe), format-host needs the
      # Markdown codec built as a wasm32-wasip2 component. FUSE-only ignored
      # tests run in ci-filesystem.yml. Newly enabled: a failure is listed in the
      # job summary but does not fail the run until the lane has passed here.
      - name: Run ignored tests this runner supports
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        continue-on-error: true
        env:
          IGNORED_FILTER: >-
            (package(shell) and (test(headless_examples_smoke::full_loop_writes_two_pngs) or test(session_lock_e2e::))) or
            (package(format-host) and binary(integration))
        run: |
          rustup target add wasm32-wasip2
          cargo build --locked --release --target wasm32-wasip2 \
            --manifest-path crates/doc/tilo-doc-codec-markdown-wasm/Cargo.toml
          bash tools/ci/measure.sh "nightly ignored tests" -- \
            bash scripts/ci-run.sh "cargo nextest --run-ignored only" -- \
            bash tools/with-test-environment.sh \
            cargo nextest run --workspace --locked --profile ci --run-ignored only \
            --test-threads 1 -E "$IGNORED_FILTER"

      - name: Report ignored tests
        if: ${{ !cancelled() && steps.workspace-tests.outcome != 'skipped' }}
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/ignored.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "nightly ignored tests (${{ matrix.arch }})" target/ci/junit/ignored.xml

      - name: Save test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: nextest-junit-nightly-${{ matrix.arch }}
          path: target/ci/junit
          retention-days: 14
          if-no-files-found: warn

      - name: Save Cargo downloads
        if: always() && steps.rust-build.outputs.cargo-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
