# This workflow has never been run: no Windows laptop or native runner is currently available.
# This disabled manual scaffold is useful future work, not qualification evidence.
# Future use requires an owned disposable Windows NTFS VM, a non-admin identity,
# and the one-job launcher in tools/ci/runners/imager-ephemeral-windows.ps1.
# Destroy that VM after its one job; never use a persistent privileged runner.
# Only synthetic private regular-file fixtures: no physical-drive or firmware writes.
# This is not full destructive Windows replacement or real-provider OneDrive/Steam
# qualification. Those require further dedicated fixtures and separate evidence.
name: Deferred native Windows imager fixtures (disabled)
on:
  workflow_dispatch:
jobs:
  native-fixtures:
    if: ${{ false }}
    runs-on: imager-windows-x86_64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Future native private fixtures only
        shell: pwsh
        run: tools/ci/run-imager-windows-native.ps1
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: deferred-windows-fixture-evidence
          path: ${{ runner.temp }}/imager-windows-evidence/*
          retention-days: 3
          if-no-files-found: error
