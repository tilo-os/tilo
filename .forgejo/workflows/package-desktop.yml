name: Package the qOS desktop session

# Native builds are intentional: the compositor links the distribution's
# graphics/input stack and cannot be safely produced by a generic cross image.
# All work runs on the existing `runner` pool. amd64 containers execute
# directly; ARM64 containers are exported into a per-job PRoot/QEMU userspace,
# with no runner-global binfmt registration. Pull requests build and
# install-test the affected release payload. Version tags additionally publish
# the verified artifacts to Forgejo releases and its native package registries.
on:
  pull_request:
    branches: [main]
    paths:
      - "dist/**"
      - "flake.nix"
      - "flake.lock"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "shell/**"
      - "crates/packaging/launcher/**"
      - "crates/session/qos-unlock-helper/**"
      - ".forgejo/workflows/package-desktop.yml"
  push:
    branches: ["codex/package-desktop-release"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  validate:
    runs-on: runner
    outputs:
      diagnostic: ${{ steps.preflight.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Validate packaging inputs before allocating native builders
        id: preflight
        shell: bash
        run: |
          set -uo pipefail
          diagnostic=success
          if ! bash -n dist/*.sh dist/*/*.sh dist/ci/proot-apt-key dist/arch/PKGBUILD; then
            diagnostic=bash-syntax
          elif ! cc -fsyntax-only -Wall -Wextra -Werror dist/ci/qemu-argv0-wrapper.c; then
            diagnostic=qemu-wrapper-compile
          elif ! test "$(<dist/VERSION)" = "$(sed -n 's/^pkgver=//p' dist/arch/PKGBUILD)"; then
            diagnostic=arch-version-drift
          elif ! grep -Fxq "%{!?qos_version:%global qos_version $(<dist/VERSION)}" dist/rpm/qos-session.spec; then
            diagnostic=rpm-version-drift
          elif ! dist/ci/run-dev-session-test.sh; then
            diagnostic=dev-session-contract
          elif ! dist/ci/run-payload-contract-tests.sh; then
            diagnostic=payload-contract
          elif ! os/tests/portal_config_validity.sh; then
            diagnostic=portal-contract
          fi
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
      - name: Record the branch preflight diagnostic
        if: github.ref == 'refs/heads/codex/package-desktop-release'
        shell: bash
        env:
          PREFLIGHT_DIAGNOSTIC: ${{ steps.preflight.outputs.diagnostic }}
        run: |
          git config user.name 'qOS Forgejo CI'
          git config user.email 'qos@noreply.code.sandbox.example'
          git fetch origin refs/notes/qos-package-preflight:refs/notes/qos-package-preflight || true
          git notes --ref=qos-package-preflight add -f \
            -m "diagnostic=$PREFLIGHT_DIAGNOSTIC run=$GITHUB_RUN_ID sha=$GITHUB_SHA" \
            "$GITHUB_SHA"
          git push origin refs/notes/qos-package-preflight
      - name: Enforce packaging preflight result
        shell: bash
        env:
          PREFLIGHT_DIAGNOSTIC: ${{ steps.preflight.outputs.diagnostic }}
        run: |
          if [[ $PREFLIGHT_DIAGNOSTIC != success ]]; then
            echo "packaging preflight failed: $PREFLIGHT_DIAGNOSTIC" >&2
            exit 1
          fi

  package:
    needs: validate
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Package builds are CPU-heavy and share the pool with main's checks.
      max-parallel: 2
      matrix:
        include:
          - id: ubuntu-24.04
            distro: ubuntu-24.04
            image: docker.io/library/ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316
            revision: 1+ubuntu24.04
            arch: amd64
          - id: ubuntu-24.04
            distro: ubuntu-24.04
            image: docker.io/library/ubuntu@sha256:95fa486768020359141f1318720f43e7982ef926c792891d984aef9aaf05e7ea
            revision: 1+ubuntu24.04
            arch: arm64
          - id: debian-13
            distro: debian-13
            image: docker.io/library/debian@sha256:6788062a1b42ac281f053ac876170b79a3eaed5d61383b8ed7eaca6c6965f3b1
            revision: 1+deb13
            arch: amd64
          - id: debian-13
            distro: debian-13
            image: docker.io/library/debian@sha256:0aa0908407cce3da2a90c1d80acc6ca5ca57401ed63eecfa8149b7ba3cc40829
            revision: 1+deb13
            arch: arm64
          - id: fedora-44
            distro: fedora-44
            image: registry.fedoraproject.org/fedora@sha256:f98ed268d20699492eb8b9688b36dac864227accf4570b22cd03888dffd3c91b
            revision: ""
            arch: amd64
          - id: fedora-44
            distro: fedora-44
            image: registry.fedoraproject.org/fedora@sha256:260eeddffc3fa8c1ba71b31cabe08a8b635cbc52d1559e536fca13b2bb9e1721
            revision: ""
            arch: arm64
          - id: arch
            distro: arch
            image: docker.io/menci/archlinuxarm@sha256:dbb3df8941d78f13e4277cec63beeac61096b474864974cfeff64efebd1aa81c
            revision: ""
            arch: amd64
          - id: arch
            distro: arch
            image: docker.io/menci/archlinuxarm@sha256:e08f0be5d8da6c22c165026036508aabd91b004f972dd84799d76a7fdb911ccb
            revision: ""
            arch: arm64
          - id: nix
            distro: nix
            image: docker.io/nixos/nix@sha256:f6f7814c2224dad18b14479fed5f0620be65d54625a4b97ae8b24b407e1b43a2
            revision: ""
            arch: amd64
          - id: nix
            distro: nix
            image: docker.io/nixos/nix@sha256:6cda09ae2a6c6c234c5be16dbb196a08d7e07dd74e6246baabc37a81cc2db87e
            revision: ""
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
      - name: Record when this branch target starts on a runner
        if: github.ref == 'refs/heads/codex/package-desktop-release'
        run: |
          git config user.name 'qOS Forgejo CI'
          git config user.email 'qos@noreply.code.sandbox.example'
          note_ref="refs/notes/qos-package-${{ matrix.id }}-${{ matrix.arch }}"
          git fetch origin "$note_ref:$note_ref" || true
          git notes --ref="${note_ref#refs/notes/}" add -f \
            -m "state=started at=$(date -u +%FT%TZ) run=$GITHUB_RUN_ID sha=$GITHUB_SHA" \
            "$GITHUB_SHA"
          git push origin "$note_ref"
      - name: Build and install-test in the target userspace
        id: package-build
        run: >-
          dist/ci/run-package-job.sh
          "${{ matrix.distro }}"
          "${{ matrix.image }}"
          "${{ matrix.arch }}"
          "${{ matrix.revision }}"
      - uses: actions/upload-artifact@v4
        id: artifact-upload
        if: always()
        with:
          name: ${{ matrix.id }}-${{ matrix.arch }}
          path: dist/ci-output/${{ matrix.id }}-${{ matrix.arch }}/*
          if-no-files-found: error
      - name: Record this matrix target's terminal result
        if: always() && github.ref == 'refs/heads/codex/package-desktop-release'
        env:
          BUILD_OUTCOME: ${{ steps.package-build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.artifact-upload.outcome }}
        run: |
          git config user.name 'qOS Forgejo CI'
          git config user.email 'qos@noreply.code.sandbox.example'
          detail=none
          failure_file="dist/ci-output/${{ matrix.id }}-${{ matrix.arch }}/CI_FAILURE"
          if [[ -f $failure_file ]]; then
            detail=$({
              head -n 1 "$failure_file"
              grep -Ei 'error:|failed|not found|conflict|cannot ' "$failure_file" | tail -n 6 || true
              tail -n 6 "$failure_file"
            } | tr '\n' ' ' | cut -c1-1500)
          fi
          note_ref="refs/notes/qos-package-${{ matrix.id }}-${{ matrix.arch }}"
          git fetch origin "$note_ref:$note_ref" || true
          git notes --ref="${note_ref#refs/notes/}" add -f \
            -m "state=terminal at=$(date -u +%FT%TZ) build=$BUILD_OUTCOME upload=$UPLOAD_OUTCOME detail=$detail run=$GITHUB_RUN_ID sha=$GITHUB_SHA" \
            "$GITHUB_SHA"
          git push origin "$note_ref"

  report-branch-result:
    if: always() && github.ref == 'refs/heads/codex/package-desktop-release'
    needs: [validate, package]
    runs-on: runner
    permissions:
      contents: write
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      VALIDATE_DIAGNOSTIC: ${{ needs.validate.outputs.diagnostic }}
      PACKAGE_RESULT: ${{ needs.package.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
      - name: Record an observable CI receipt without touching a branch
        run: |
          git config user.name 'qOS Forgejo CI'
          git config user.email 'qos@noreply.code.sandbox.example'
          git fetch origin refs/notes/qos-package-ci:refs/notes/qos-package-ci || true
          git notes --ref=qos-package-ci add -f \
            -m "validate=$VALIDATE_RESULT diagnostic=$VALIDATE_DIAGNOSTIC package=$PACKAGE_RESULT run=$GITHUB_RUN_ID sha=$GITHUB_SHA" \
            "$GITHUB_SHA"
          git push origin refs/notes/qos-package-ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check release version and create checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(<dist/VERSION)"
          dist/ci/verify-release-artifacts.sh release "$version"
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Publish package-manager repositories
        env:
          QOS_FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: dist/ci/publish-forgejo-packages.sh release "${GITHUB_REF_NAME#v}"
      - name: Publish checksummed, install-tested artifacts
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          release-dir: release
          override: true
          release-notes: "qOS desktop session ${{ github.ref_name }}. Every attached package was built and install-tested inside its target distribution and architecture userspace."
