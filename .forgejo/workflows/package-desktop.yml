name: Release / desktop

# Native builds are intentional: the compositor links the distribution's
# graphics/input stack and cannot be safely produced by a generic cross image.
# The amd64 package set runs serially on the dedicated `qos-package` label.
# Release tags add the native ARM64 runner; ordinary changes retain one amd64
# lane. Pull requests build and install-test the affected release payload.
# Version tags additionally publish
# the verified artifacts to Forgejo releases and its native package registries.
on:
  pull_request:
    branches: [main]
    paths:
      - "dist/**"
      - "flake.nix"
      - "flake.lock"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "shell/**"
      - "crates/packaging/launcher/**"
      - "crates/session/qos-unlock-helper/**"
      - ".forgejo/workflows/package-desktop.yml"
      - "docs/install-contract.json"
      - "scripts/check-install-contract.py"
  push:
    branches: ["main", "codex/package-desktop-release"]
    tags: ["desktop-v*"]
    paths:
      - "dist/**"
      - "flake.nix"
      - "flake.lock"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "shell/**"
      - "crates/packaging/launcher/**"
      - "crates/session/qos-unlock-helper/**"
      - ".forgejo/workflows/package-desktop.yml"
      - "docs/install-contract.json"
      - "scripts/check-install-contract.py"
  workflow_dispatch:
    inputs:
      full_native:
        description: "Also build and install-test the complete native ARM64 package set."
        type: boolean
        required: false
        default: false

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  validate:
    runs-on: runner
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate packaging inputs before allocating native builders
        id: preflight
        shell: bash
        run: |
          set -uo pipefail
          diagnostic=success
          if ! python3 scripts/check-install-contract.py; then
            diagnostic=install-contract
          elif ! bash -n dist/*.sh dist/*/*.sh dist/ci/proot-apt-key dist/arch/PKGBUILD; then
            diagnostic=bash-syntax
          elif ! cc -fsyntax-only -Wall -Wextra -Werror dist/ci/qemu-argv0-wrapper.c; then
            diagnostic=qemu-wrapper-compile
          elif ! test "$(<dist/VERSION)" = "$(sed -n 's/^pkgver=//p' dist/arch/PKGBUILD)"; then
            diagnostic=arch-version-drift
          elif ! grep -Fxq "%{!?qos_version:%global qos_version $(<dist/VERSION)}" dist/rpm/qos-session.spec; then
            diagnostic=rpm-version-drift
          elif ! dist/ci/run-dev-session-test.sh; then
            diagnostic=dev-session-contract
          elif ! dist/ci/run-payload-contract-tests.sh; then
            diagnostic=payload-contract
          elif ! os/tests/portal_config_validity.sh; then
            diagnostic=portal-contract
          fi
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
      - name: Enforce packaging preflight result
        shell: bash
        env:
          PREFLIGHT_DIAGNOSTIC: ${{ steps.preflight.outputs.diagnostic }}
        run: |
          if [[ $PREFLIGHT_DIAGNOSTIC != success ]]; then
            echo "packaging preflight failed: $PREFLIGHT_DIAGNOSTIC" >&2
            exit 1
          fi
      - name: Select native release lanes
        id: lanes
        env:
          FULL_NATIVE: ${{ github.event.inputs.full_native }}
        shell: bash
        run: |
          targets=$(cat <<'EOF'
          arch|docker.io/menci/archlinuxarm@sha256:dbb3df8941d78f13e4277cec63beeac61096b474864974cfeff64efebd1aa81c|
          nix|docker.io/nixos/nix@sha256:f6f7814c2224dad18b14479fed5f0620be65d54625a4b97ae8b24b407e1b43a2|
          ubuntu-24.04|docker.io/library/ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316|1+ubuntu24.04
          debian-13|docker.io/library/debian@sha256:6788062a1b42ac281f053ac876170b79a3eaed5d61383b8ed7eaca6c6965f3b1|1+deb13
          fedora-44|registry.fedoraproject.org/fedora@sha256:f98ed268d20699492eb8b9688b36dac864227accf4570b22cd03888dffd3c91b|
          EOF
          )
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* || ${FULL_NATIVE:-false} == true ]]; then
            architectures='[{"arch":"amd64","runner":"qos-package-optimized"},{"arch":"arm64","runner":"runner-arm64"}]'
          else
            architectures='[{"arch":"amd64","runner":"qos-package-optimized"}]'
          fi
          matrix=$(jq -cn --arg targets "$targets" --argjson architectures "$architectures" '{include:[
            $architectures[] as $architecture
            | ($targets | split("\n")[] | select(length > 0) | split("|")) as $target
            | $architecture + {distro:$target[0],image:$target[1],revision:$target[2]}
          ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    name: package / ${{ matrix.distro }} / ${{ matrix.arch }}
    # The amd64 matrix entry uses the measured optimized package class; native
    # ARM64 tags and explicit full-native runs retain their ARM runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    # Every target is an independent one-job Kata VM. The placement broker,
    # rather than a workflow-wide parallelism knob, admits as many as current
    # CPU and memory headroom can safely hold.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Restore checksum-pinned GitHub build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: desktop-external-inputs-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
            github-assets-all-v1-
      - name: Materialize the architecture-specific compiler cache client
        shell: bash
        run: |
          case '${{ matrix.arch }}' in
            amd64) target=x86_64-unknown-linux-musl ;;
            arm64) target=aarch64-unknown-linux-musl ;;
            *) printf 'unsupported package architecture: %s\n' '${{ matrix.arch }}' >&2; exit 1 ;;
          esac
          os/dev/cache-github-assets.sh "sccache-v0.17.0-${target}.tar.gz"
      - name: Save checksum-pinned compiler input immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: desktop-external-inputs-${{ hashFiles('os/external-assets/github-assets.tsv') }}
      - name: Build and install-test target userspace
        env:
          # Runner-level cache credentials must never enter pull-request code.
          QOS_ENABLE_REMOTE_CACHE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        shell: bash
        run: |
          dist/ci/run-package-job.sh \
            '${{ matrix.distro }}' \
            '${{ matrix.image }}' \
            '${{ matrix.arch }}' \
            '${{ matrix.revision }}'
      # Forgejo's native artifact service implements the v3 protocol. Upstream
      # v4 targets GitHub's Artifact API v2 and fails on this Forgejo instance.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: ${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/ci-output/${{ matrix.distro }}-${{ matrix.arch }}/*
          if-no-files-found: error

  publish-os-payload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: runner
    enable-openid-connect: true
    steps:
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release
      - name: Publish immutable desktop payloads and advance their channels
        env:
          DESKTOP_AUDIENCE: ${{ vars.QOS_DESKTOP_RELEASE_AUDIENCE }}
          CONTINUOUS_OS_RELEASE: ${{ vars.QOS_CONTINUOUS_OS_RELEASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n ${DESKTOP_AUDIENCE:-} ]] || {
            printf 'QOS_DESKTOP_RELEASE_AUDIENCE is required\n' >&2
            exit 1
          }
          jwt=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DESKTOP_AUDIENCE" \
            | jq -er .value)
          echo "::add-mask::$jwt"
          owner=${GITHUB_REPOSITORY%%/*}
          package_api="$GITHUB_SERVER_URL/api/packages/$owner/generic"
          version="0.0.0-$GITHUB_SHA"
          variable_api="${GITHUB_API_URL:-$GITHUB_SERVER_URL/api/v1}/repos/$GITHUB_REPOSITORY/actions/variables"
          put_immutable() {
            local file=$1 url=$2 response status remote
            response=$(mktemp "$RUNNER_TEMP/qos-desktop-response.XXXXXX")
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $jwt" \
              --request PUT --upload-file "$file" "$url")
            case "$status" in
              200|201|204) ;;
              409)
                remote=$(mktemp "$RUNNER_TEMP/qos-existing-desktop.XXXXXX")
                curl --fail --silent --show-error --retry 3 --retry-all-errors \
                  --header "Authorization: Bearer $jwt" "$url" --output "$remote"
                cmp --silent "$file" "$remote"
                ;;
              *) cat "$response" >&2; exit 1 ;;
            esac
          }
          update_variable() {
            local name=$1 value=$2 endpoint status method
            endpoint="$variable_api/$name"
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $jwt" "$endpoint")
            case "$status" in 200) method=PUT ;; 404) method=POST ;; *) return 1 ;; esac
            curl --fail --silent --show-error --request "$method" \
              --header "Authorization: Bearer $jwt" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg value "$value" '{value:$value}')" "$endpoint"
          }
          shopt -s nullglob
          found=0
          for bundle in release/fedora-44-*/qos-desktop-os-*.tar.gz; do
            found=1
            arch=${bundle##*qos-desktop-os-}
            arch=${arch%.tar.gz}
            digest_file="$bundle.sha256"
            (cd "$(dirname "$bundle")" && sha256sum --check --strict "${digest_file##*/}")
            url="$package_api/qos-desktop-os/$version/${bundle##*/}"
            put_immutable "$bundle" "$url"
            put_immutable "$digest_file" "$url.sha256"
            digest=$(awk '{print $1}' "$digest_file")
            upper=${arch^^}
            update_variable "QOS_DESKTOP_PAYLOAD_URL_$upper" "$url"
            update_variable "QOS_DESKTOP_PAYLOAD_SHA256_$upper" "$digest"
            if [[ $arch == x86_64 ]]; then
              update_variable QOS_DESKTOP_PAYLOAD_URL "$url"
              update_variable QOS_DESKTOP_PAYLOAD_SHA256 "$digest"
            fi
          done
          [[ $found == 1 ]]
          if [[ ${CONTINUOUS_OS_RELEASE:-0} == 1 ]]; then
            dispatch_api="${GITHUB_API_URL:-$GITHUB_SERVER_URL/api/v1}/repos/$GITHUB_REPOSITORY/actions/workflows/build-image.yml/dispatches"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $jwt" \
              --header 'Content-Type: application/json' \
              --data '{"ref":"main","inputs":{"with_browser":"1","publish":"true"}}' \
              "$dispatch_api"
            echo '::notice::requested continuous desktop/OS integration release'
          fi

  release-guard:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: validate
    runs-on: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
      - name: Require this exact commit to be checked on main
        shell: bash
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/notes/qos-check-ci:refs/notes/qos-check-ci
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          receipt=$(git notes --ref=qos-check-ci show "$GITHUB_SHA")
          grep -Eq '^select=success affected=success run=[0-9]+ sha='"$GITHUB_SHA"'$' \
            <<<"$receipt"

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [package, release-guard]
    runs-on: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release
      - name: Flatten per-target artifact directories
        run: |
          find release -mindepth 2 -type f -print0 | while IFS= read -r -d '' artifact; do
            target="release/${artifact##*/}"
            test ! -e "$target"
            mv "$artifact" "$target"
          done
          find release -mindepth 1 -type d -empty -delete
      - name: Check release version and create checksums
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          test "$version" = "$(<dist/VERSION)"
          dist/ci/verify-release-artifacts.sh release "$version" amd64,arm64
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Publish package-manager repositories
        env:
          QOS_FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: dist/ci/publish-forgejo-packages.sh release "${GITHUB_REF_NAME#desktop-v}"
      - name: Publish checksummed, install-tested artifacts
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: release
          override: true
          release-notes: "qOS desktop session ${{ github.ref_name }}. Every attached package was built and install-tested inside its target distribution and architecture userspace."
