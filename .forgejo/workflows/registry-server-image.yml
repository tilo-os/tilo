name: Release / registry server image

# The public registry is deployed by digest. Pull requests build and exercise
# the exact production image without writing to the registry; main publishes
# one immutable x86_64 tag and a digest receipt for the GitOps repository.
on:
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/packaging/registry-server/**"
      - "crates/packaging/registry-types/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/tilo-app-package/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/system/atomic-file/**"
      - "crates/system/tilo-native-certs/**"
      - "vendor/genawaiter-proc-macro/**"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
      - ".forgejo/workflows/registry-server-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/packaging/registry-server/**"
      - "crates/packaging/registry-types/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/tilo-app-package/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/system/atomic-file/**"
      - "crates/system/tilo-native-certs/**"
      - "vendor/genawaiter-proc-macro/**"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
      - ".forgejo/workflows/registry-server-image.yml"

concurrency:
  group: registry-server-image-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  applicability:
    uses: ./.forgejo/workflows/applicability.yml
    with:
      workflow: .forgejo/workflows/registry-server-image.yml

  build-test-publish:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        true
      }}
    runs-on: runner
    timeout-minutes: 90
    env:
      IMAGE_REPOSITORY: registry.tilo.so/tilo/tilo-registry-server
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # The production cluster is amd64 today. Add arm64 as a separately tested
      # native child before publishing a multi-platform index under this name.
      IMAGE_PLATFORM: linux/amd64
    steps:
      - name: Checkout the exact image source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Materialize the pinned compiler-cache client
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: registry-server-sccache-v1
          assets: sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz

      # Prefer the runner's compiler cache. When that set is incomplete, use
      # this repository's cache secret. A build with neither compiles without it.
      - name: Bind the runner compiler cache
        id: compiler-cache
        env:
          FALLBACK_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          FALLBACK_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/ci/compiler_cache_env.sh
          for name in SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_USE_SSL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            value="${!name:-}"
            if [[ -z $value || $value == *$'\n'* ]]; then
              {
                echo 'bucket='
                echo 'endpoint='
                echo 'region='
                echo 'use_ssl='
                echo 'secret-envs='
              } >> "$GITHUB_OUTPUT"
              echo "::notice::runner compiler cache is not configured; compiling without it"
              exit 0
            fi
          done
          {
            printf 'bucket=%s\n' "$SCCACHE_BUCKET"
            printf 'endpoint=%s\n' "$SCCACHE_ENDPOINT"
            printf 'region=%s\n' "$SCCACHE_REGION"
            printf 'use_ssl=%s\n' "$SCCACHE_S3_USE_SSL"
            echo 'secret-envs<<TILO_COMPILER_CACHE_SECRETS'
            echo 'aws_access_key_id=AWS_ACCESS_KEY_ID'
            echo 'aws_secret_access_key=AWS_SECRET_ACCESS_KEY'
            echo 'TILO_COMPILER_CACHE_SECRETS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up the pinned BuildKit frontend
        uses: ./.forgejo/actions/setup-buildx
        with:
          # Layers and the cargo registry/target cache mounts stay on the
          # runner slot; only main pushes, which publish, use the trusted builder.
          persistent: true

      # Only the layer cache export uses this login; it ends before the
      # smoke test runs pull-request code.
      - name: Log in for the layer cache
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image without publication
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: crates/packaging/registry-server/container/Containerfile
          build-contexts: |
            github-assets=os/external-assets/cache
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: false
          load: true
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            SCCACHE_BUCKET=${{ steps.compiler-cache.outputs.bucket }}
            SCCACHE_ENDPOINT=${{ steps.compiler-cache.outputs.endpoint }}
            SCCACHE_REGION=${{ steps.compiler-cache.outputs.region }}
            SCCACHE_S3_USE_SSL=${{ steps.compiler-cache.outputs.use_ssl }}
          secret-envs: ${{ steps.compiler-cache.outputs.secret-envs }}
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_REVISION }}
          # Pull requests read the main cache and write only their own.
          cache-from: |
            type=registry,ref=${{ env.TILO_LAYER_CACHE_REGISTRY }}/tilo/tilo-registry-server-buildcache:main
            ${{ github.event_name == 'pull_request' && format('type=registry,ref={0}/tilo/tilo-registry-server-buildcache:pr-{1}', env.TILO_LAYER_CACHE_REGISTRY, github.event.number) || '' }}
          cache-to: type=registry,ref=${{ env.TILO_LAYER_CACHE_REGISTRY }}/tilo/tilo-registry-server-buildcache:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }},mode=max,ignore-error=true

      - name: Log out before running the image
        run: docker logout registry.tilo.so

      - name: Exercise the non-root read-only runtime and health endpoint
        run: >-
          bash crates/packaging/registry-server/container/test-image.sh
          "$IMAGE_REPOSITORY:sha-$SOURCE_REVISION"
          "$SOURCE_REVISION"

      - name: Log in for main publication
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact image that passed the smoke test
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        id: publish
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:sha-$SOURCE_REVISION"
          output=$(docker push "$image" 2>&1)
          printf '%s\n' "$output"
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' <<<"$output" | tail -1)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Write the deployment digest receipt
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p registry-server-image-receipt
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "sha-$SOURCE_REVISION" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg platform "$IMAGE_PLATFORM" \
            '{schemaVersion:1,repository:$repository,tag:$tag,digest:$digest,image:$image,sourceRevision:$sourceRevision,platform:$platform}' \
            > registry-server-image-receipt/registry-server-image.json
          jq -e \
            --arg digest "$IMAGE_DIGEST" \
            --arg source "$SOURCE_REVISION" \
            '.schemaVersion == 1 and .digest == $digest and .sourceRevision == $source' \
            registry-server-image-receipt/registry-server-image.json >/dev/null
          printf '### Registry server image\n\n`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the immutable digest receipt
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: registry-server-image-receipt
          path: registry-server-image-receipt/registry-server-image.json
          if-no-files-found: error
