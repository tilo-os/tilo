name: CI / Windows ARM64 imager handoff

# Build the Windows ARM64 firmware helper in CI even when a native Windows
# runner is unavailable. The downloaded test executable runs on the target
# host with file-backed firmware variables before any physical write.
on:
  workflow_dispatch:

jobs:
  final-bootnext:
    runs-on: runner-arm64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Windows ARM64 cross toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          if ! command -v clang >/dev/null || ! command -v lld-link >/dev/null; then
            if command -v dnf >/dev/null; then
              sudo dnf install -y clang lld
            elif command -v apt-get >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y clang lld
            else
              echo 'No supported LLVM package manager on ARM64 runner' >&2
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          ln -s "$(command -v clang-18 || command -v clang)" "$RUNNER_TEMP/llvm-bin/clang-cl"
          ln -s "$(command -v lld-link-18 || command -v lld-link)" "$RUNNER_TEMP/llvm-bin/lld-link"
          printf '%s\n' "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
          rustup target add aarch64-pc-windows-msvc
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Build Windows adapter, app, and focused test executable
        run: |
          set -euo pipefail
          # cc-rs otherwise selects clang's GNU driver for ring, while
          # cargo-xwin supplies MSVC /imsvc flags.
          export CC_aarch64_pc_windows_msvc=clang-cl
          export CXX_aarch64_pc_windows_msvc=clang-cl
          cargo xwin test -p imager --lib --locked --release \
            --target aarch64-pc-windows-msvc --no-run
          cargo xwin build -p imager --bin imager --locked --release \
            --target aarch64-pc-windows-msvc
      - name: Package exact-source handoff and tests
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/aarch64-pc-windows-msvc/release/imager.exe out/imager.exe
          mapfile -t tests < <(find target/aarch64-pc-windows-msvc/release/deps \
            -maxdepth 1 -name 'imager-*.exe' | sort)
          test "${#tests[@]}" -eq 1
          cp "${tests[0]}" out/imager-tests.exe
          (cd out && sha256sum imager.exe imager-tests.exe > sha256.txt)
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: imager-windows-arm64-handoff-${{ github.sha }}
          path: out/
          if-no-files-found: error
