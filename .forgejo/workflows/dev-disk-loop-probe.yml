name: Probe / Dev disk loop nodes
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: runner-disk-100g-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Probe partition nodes in Kata
        shell: bash
        run: |
          set -euo pipefail
          bash os/dev/ci-prepare-disk-devices.sh --kata-job
          scratch=$(mktemp -d)
          loop=''
          holder_pid=''
          cleanup() {
            if [[ -n $holder_pid ]]; then
              printf 'release\n' >&"${HOLDER[1]}" || true
              wait "$holder_pid" || true
            fi
            if [[ -n $loop ]]; then sudo -n losetup -d "$loop"; fi
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          truncate -s 128M "$scratch/probe.raw"
          python3 - "$scratch/probe.raw" <<'PY'
          import struct
          import sys

          mbr = bytearray(512)
          for index, first_lba in enumerate((2048, 67584)):
              struct.pack_into('<B3sB3sII', mbr, 446 + index * 16,
                               0, b'\0' * 3, 0x83, b'\0' * 3,
                               first_lba, 65536)
          mbr[510:] = b'\x55\xaa'
          with open(sys.argv[1], 'r+b') as disk:
              disk.write(mbr)
          PY
          loop=$(sudo -n losetup -fP --show "$scratch/probe.raw")
          coproc HOLDER { sudo -n python3 -u os/dev/hold-loop-partition-nodes.py "$loop"; }
          holder_pid=$!
          IFS= read -r ready <&"${HOLDER[0]}"
          [[ $ready == READY ]]
          sudo -n mkfs.ext4 -q "${loop}p2"
          mkdir "$scratch/mnt"
          sudo -n mount "${loop}p2" "$scratch/mnt"
          mountpoint -q "$scratch/mnt"
          sudo -n umount "$scratch/mnt"
          echo '::notice::Kata file-backed two-partition mount passed'
