name: Build / CI builder

# Publishes registry.tilo.so/tilo/tilo-builder, which check.yml runs in. Weekly so
# the base and the package set stay current; on dispatch, and whenever the
# inputs that define the environment change.

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: ["main"]
    paths:
      - "dist/ci/install-build-deps.sh"
      - "os/Containerfile.builder"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - ".forgejo/actions/cache-github-assets/**"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/require-cosign-authority.sh"
      - "os/dev/install-aws-cli.sh"
      - "os/dev/promote-native-index.py"
      - "os/dev/builder-canary-inputs.py"
      - "rust-toolchain.toml"
      - "crates/system/advisory-lock/**"
      - "crates/workspace-hack/**"
      - "vendor/wayland-backend/**"
      - "tools/ci/check-build-env.sh"
      - "tools/ci/install-android-ndk.sh"
      - "tools/ci/builder_workflow_plan.py"
      - "tools/ci/install-pdfium.sh"
      - "tools/ci/measure.sh"
      - "tools/ci/native-mold-linker.sh"
      - "tools/ci/sccache-canary.sh"
      - "tools/ci/sccache.sh"
      - "tools/ci/resolve_promoted_builder.py"
      - "tools/ci/verify-native-mold.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/actions/restore-cargo-downloads/**"
      - ".forgejo/workflows/build-ci-builder.yml"
  workflow_dispatch:
    inputs:
      cache_revision:
        description: 'Optional full commit SHA whose candidate buildcache may accelerate this build; all acceptance gates still run'
        required: false
        type: string

concurrency:
  group: build-builder-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:966b27dabfda95813588c06e38479de91e206f7179ae2c6230bff7f59e7466fc
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Choose native build or promoted-builder qualification
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 -I tools/ci/builder_workflow_plan.py

  signing-preflight:
    needs: plan
    if: needs.plan.outputs.mode == 'build'
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Require non-exportable builder signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: os/dev/require-cosign-authority.sh

  build:
    needs: [plan, signing-preflight]
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        needs.plan.outputs.mode == 'build' && needs.signing-preflight.result == 'success'
      }}
    strategy:
      fail-fast: false
      # Forgejo's package-blob insert is not race-safe when native jobs upload
      # an identical layer concurrently. Builder rebuilds are rare; serialize
      # only their registry writers while routine qualification reuses images.
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner
          - arch: aarch64
            platform: linux/arm64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    enable-openid-connect: true
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Select an optional candidate buildcache
        env:
          REQUESTED_CACHE_REVISION: ${{ github.event.inputs.cache_revision }}
        run: |
          set -euo pipefail
          revision="${REQUESTED_CACHE_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::cache_revision must be a full lowercase Git SHA'
            exit 1
          }
          printf 'BUILDER_CACHE_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"

      - name: Materialize checksum-verified GitHub build inputs
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: github-assets-all-v1

      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image bakes the toolchain the workspace pins, so a job cannot
      # silently compile with a different one.
      - name: Read the pinned toolchain
        run: |
          ch=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          [ -n "$ch" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "RUST_CHANNEL=$ch" >> "$GITHUB_ENV"
          echo "building for toolchain $ch"

      # The runner provides docker, not podman.
      - name: Set up buildx
        uses: ./.forgejo/actions/setup-buildx

      # The Containerfile runs tools/ci/check-build-env.sh during the build, so a
      # missing native dependency fails here rather than in every later job.
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: registry.tilo.so/tilo/tilo-builder:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=tilo-builder-${{ matrix.arch }}
            type=gha,scope=tilo-builder-candidate-${{ env.BUILDER_CACHE_REVISION }}-${{ matrix.arch }}

      # Forgejo's registry can reject the same blob when BuildKit pushes the
      # image and cache concurrently. Reuse the completed local BuildKit graph,
      # but give each registry exporter its own action invocation.
      - name: Export build cache
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: registry.tilo.so/tilo/tilo-builder:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=tilo-builder-${{ matrix.arch }}
            type=gha,scope=tilo-builder-candidate-${{ env.BUILDER_CACHE_REVISION }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ github.ref == 'refs/heads/main' && format('tilo-builder-{0}', matrix.arch) || format('tilo-builder-candidate-{0}-{1}', github.sha, matrix.arch) }},mode=max,ignore-error=true

      - name: Install checksum-pinned Cosign
        run: ./os/dev/install-cached-cosign.sh
      - name: Sign and describe the native builder
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          CHILD_ARCH: ${{ matrix.arch }}
          CHILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          ref="registry.tilo.so/tilo/tilo-builder@${CHILD_DIGEST}"
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          mkdir -p native-child
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("native-child/child.json").write_text(json.dumps({
              "architecture": os.environ["CHILD_ARCH"],
              "digest": os.environ["CHILD_DIGEST"],
              "sourceRevision": os.environ["GITHUB_SHA"],
          }))
          PY
      - name: Upload the native child descriptor
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: builder-native-${{ matrix.arch }}-${{ github.run_attempt }}
          path: native-child/
          if-no-files-found: error

  images:
    # Forgejo's run_attempt counts each job separately. Consumers must use
    # producer artifacts, not reconstruct an image tag from their own attempt.
    needs: [plan, build]
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        ((needs.plan.outputs.mode == 'build' && needs.build.result == 'success') ||
         (needs.plan.outputs.mode == 'reuse' && needs.build.result == 'skipped'))
      }}
    runs-on: runner
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: needs.plan.outputs.mode == 'build'
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: native-candidates
      - name: Resolve exact successful native producer attempts
        id: built
        if: needs.plan.outputs.mode == 'build'
        run: |
          python3 os/tests/test_builder_candidate_workflow.py
          python3 os/tests/native_index_promotion.py
          python3 os/dev/builder-canary-inputs.py matrix native-candidates
      - name: Install checksum-pinned Cosign
        if: needs.plan.outputs.mode == 'reuse'
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Set up registry inspection
        if: needs.plan.outputs.mode == 'reuse'
        uses: ./.forgejo/actions/setup-buildx
      - name: Resolve the signed promoted native builders
        id: reused
        if: needs.plan.outputs.mode == 'reuse'
        run: python3 -I tools/ci/resolve_promoted_builder.py
      - name: Select the canary matrix
        id: select
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BUILT_MATRIX: ${{ steps.built.outputs.matrix }}
          REUSED_MATRIX: ${{ steps.reused.outputs.matrix }}
        run: |
          set -euo pipefail
          case "$MODE" in
            build) matrix=$BUILT_MATRIX ;;
            reuse) matrix=$REUSED_MATRIX ;;
            *) echo '::error::invalid builder plan mode'; exit 1 ;;
          esac
          test -n "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  # Two separate, fresh job containers prove that an object written by the
  # first compiler process is read back from the runners' remote cache by
  # another.
  # A unique prefix makes the first run cold without deleting or
  # disturbing the production cache. The package is deliberately small: this
  # is a cache-path assertion, not another workspace build.
  cache-cold:
    needs: images
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.image }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/tilo-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      CANDIDATE_ARCH: ${{ matrix.arch }}
      CANDIDATE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: ./.forgejo/actions/restore-cargo-downloads
      - name: Create a fresh cold cache receipt
        run: python3 os/dev/builder-canary-inputs.py cold cold-receipt
      - name: Enable remote compiler cache
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          bash tools/ci/sccache.sh prepare
      - name: Populate a new remote cache namespace
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci/measure.sh "sccache cold canary" -- \
            cargo build -p tilo-advisory-lock --locked
          bash tools/ci/sccache-canary.sh cold
      - name: Save Cargo downloads
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
      - name: Retain only successful cold acceptance
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: builder-cache-cold-${{ matrix.arch }}-${{ github.run_attempt }}
          path: cold-receipt/
          if-no-files-found: error

  cache-warm:
    needs: [images, cache-cold]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.image }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/tilo-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      CANDIDATE_ARCH: ${{ matrix.arch }}
      CANDIDATE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: cold-receipts
      - name: Select the exact successful cold namespace
        run: python3 os/dev/builder-canary-inputs.py warm cold-receipts
      - name: Enable remote compiler cache
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          bash tools/ci/sccache.sh prepare
      - name: Require remote hits from a fresh compiler process
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci/measure.sh "sccache warm canary" -- \
            cargo build -p tilo-advisory-lock --locked
          bash tools/ci/sccache-canary.sh warm
      - name: Retain only successful warm acceptance
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: builder-cache-warm-${{ matrix.arch }}-${{ github.run_attempt }}
          path: warm-receipt/
          if-no-files-found: error

  accept-builder:
    timeout-minutes: 20
    needs: [plan, build, images, cache-cold, cache-warm]
    if: >-
      ${{
        always() && needs.plan.result == 'success' && needs.images.result == 'success' &&
        needs.cache-cold.result == 'success' && needs.cache-warm.result == 'success' &&
        ((needs.plan.outputs.mode == 'reuse' && needs.build.result == 'skipped') ||
         (needs.plan.outputs.mode == 'build' && needs.build.result == 'success'))
      }}
    runs-on: runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: acceptance-receipts
      - name: Verify the exact native identities used by both canaries
        env:
          CANDIDATE_MATRIX: ${{ needs.images.outputs.matrix }}
        run: python3 os/dev/builder-canary-inputs.py verify acceptance-receipts

  promote-builder:
    timeout-minutes: 60
    needs: [plan, build, images, accept-builder]
    if: >-
      ${{
        always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'build' &&
        needs.build.result == 'success' && needs.images.result == 'success' &&
        needs.accept-builder.result == 'success'
      }}
    runs-on: runner
    enable-openid-connect: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preserve native identities for publication
        env:
          CANDIDATE_MATRIX: ${{ needs.images.outputs.matrix }}
        run: python3 os/dev/builder-canary-inputs.py descriptors native-children
      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install publication tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends software-properties-common
            sudo -n add-apt-repository --yes universe
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends curl unzip podman skopeo
          else
            sudo -n dnf install -y curl unzip podman skopeo
          fi
          bash ./os/dev/install-aws-cli.sh
      - name: Verify and publish the tested native builder index
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          BUILDER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          # Index assembly needs manifest metadata, not mounted image layers.
          # Use an isolated VFS store inside the containerized runner; its
          # overlay root cannot host another unconfigured overlay store.
          storage="$(mktemp -d "$RUNNER_TEMP/tilo-builder-manifests.XXXXXX")"
          trap 'rm -rf -- "$storage"' EXIT
          export CONTAINERS_STORAGE_CONF="$storage/storage.conf"
          printf '[storage]\ndriver = "vfs"\ngraphroot = "%s/graph"\nrunroot = "%s/run"\n' \
            "$storage" "$storage" > "$CONTAINERS_STORAGE_CONF"
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          # Feature builds are candidates. Only main may advance shared builder
          # aliases after the native/cache acceptance gates.
          tags=(--tag "candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$BUILDER_REF" = refs/heads/main ]; then
            tags=(--tag "$GITHUB_SHA" --tag "$channel" --tag latest)
          fi
          python3 os/dev/promote-native-index.py \
            --repository registry.tilo.so/tilo/tilo-builder \
            "${tags[@]}" \
            --revision "$GITHUB_SHA" --descriptors native-children \
            --signing-key "$COSIGN_KEY_REF" --output builder-index.txt
          cat builder-index.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the immutable builder reference
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: builder-index-${{ github.sha }}
          path: builder-index.txt
          if-no-files-found: error
