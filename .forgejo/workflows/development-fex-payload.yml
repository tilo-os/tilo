name: Build / ARM FEX payload

on:
  workflow_dispatch:
    inputs:
      buildroot_candidate:
        description: "Optional previously published ARM buildroot digest to reuse after a failed FEX build"
        required: false
        type: string
      sdk_candidate:
        description: "Optional previously published x86 SDK digest to reuse after a failed FEX build"
        required: false
        type: string
      payload_candidate:
        description: "Optional CI-built unsigned payload digest to recover after a signing-only failure"
        required: false
        type: string
      payload_repository_revision:
        description: "Original repository commit that built payload_candidate"
        required: false
        type: string
      payload_build_run_id:
        description: "Original Forgejo run ID that built payload_candidate"
        required: false
        type: string

# These candidates are CI-built, digest-addressed and retained. They are not
# release-accepted: the SDK resolves live Fedora RPMs and translated Wine,
# Proton and GPU execution still require separate tests.
concurrency:
  group: development-fex-payload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  buildroot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: runner-large-arm64
    timeout-minutes: 90
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build native ARM toolchain candidate
        id: publish
        env:
          BUILDROOT_CANDIDATE: ${{ inputs.buildroot_candidate }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          if [[ -n "$BUILDROOT_CANDIDATE" ]]; then
            [[ "$BUILDROOT_CANDIDATE" =~ ^registry\.tilo\.so/tilo/tilo-fex-buildroot-candidate@sha256:[0-9a-f]{64}$ ]] || {
              echo '::error::buildroot_candidate must be a retained immutable ARM buildroot digest'; exit 1;
            }
            docker buildx imagetools inspect --raw "$BUILDROOT_CANDIDATE" \
              | jq -e '.schemaVersion == 2 and (.config.digest | test("^sha256:[0-9a-f]{64}$"))' >/dev/null
            echo "ref=$BUILDROOT_CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "::notice::reusing previously published ARM buildroot $BUILDROOT_CANDIDATE"
            exit 0
          fi
          source os/base-snapshot.env
          bash os/dev/cache-github-assets.sh nasm-2.16.03.tar.xz
          tag="registry.tilo.so/tilo/tilo-fex-buildroot-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/arm64 --push --provenance=false \
            --metadata-file buildroot-metadata.json --file os/Containerfile.fex-buildroot \
            --build-arg "BASE_REF=$BASE_REF" \
            --build-context github-assets=os/external-assets/cache \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' buildroot-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-buildroot-candidate@$digest" >> "$GITHUB_OUTPUT"

  sdk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: runner-large
    timeout-minutes: 90
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build native x86 development SDK candidate
        id: publish
        env:
          SDK_CANDIDATE: ${{ inputs.sdk_candidate }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if [[ -n "$SDK_CANDIDATE" ]]; then
            [[ "$SDK_CANDIDATE" =~ ^registry\.tilo\.so/tilo/tilo-fex-x86-sdk-candidate@sha256:[0-9a-f]{64}$ ]] || {
              echo '::error::sdk_candidate must be a retained immutable x86 SDK digest'; exit 1;
            }
            docker buildx imagetools inspect --raw "$SDK_CANDIDATE" \
              | jq -e '.schemaVersion == 2 and (.config.digest | test("^sha256:[0-9a-f]{64}$"))' >/dev/null
            echo "ref=$SDK_CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "::notice::reusing previously published SDK $SDK_CANDIDATE"
            exit 0
          fi
          source os/base-snapshot.env
          tag="registry.tilo.so/tilo/tilo-fex-x86-sdk-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/amd64 --push --provenance=false \
            --metadata-file sdk-metadata.json --file os/Containerfile.fex-x86-sdk \
            --build-arg "BASE_REF=$BASE_REF" \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' sdk-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-x86-sdk-candidate@$digest" >> "$GITHUB_OUTPUT"

  payload:
    needs: [buildroot, sdk]
    runs-on: runner-large-arm64
    timeout-minutes: 180
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build verified portable FEX candidate
        id: publish
        env:
          FEX_BUILDROOT_REF: ${{ needs.buildroot.outputs.ref }}
          FEX_X86_SDK_REF: ${{ needs.sdk.outputs.ref }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.payload_candidate }}
          FEX_PAYLOAD_REPOSITORY_REVISION: ${{ inputs.payload_repository_revision }}
          FEX_PAYLOAD_BUILD_RUN_ID: ${{ inputs.payload_build_run_id }}
          BUILDROOT_CANDIDATE: ${{ inputs.buildroot_candidate }}
          SDK_CANDIDATE: ${{ inputs.sdk_candidate }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          [[ "$FEX_BUILDROOT_REF" =~ ^registry\.tilo\.so/tilo/tilo-fex-buildroot-candidate@sha256:[0-9a-f]{64}$ ]]
          [[ "$FEX_X86_SDK_REF" =~ ^registry\.tilo\.so/tilo/tilo-fex-x86-sdk-candidate@sha256:[0-9a-f]{64}$ ]]
          if [[ -n "$FEX_PAYLOAD_CANDIDATE" ]]; then
            [[ "$FEX_PAYLOAD_CANDIDATE" =~ ^registry\.tilo\.so/tilo/tilo-fex-payload-candidate@sha256:[0-9a-f]{64}$ \
               && "$FEX_PAYLOAD_REPOSITORY_REVISION" =~ ^[0-9a-f]{40}$ \
               && "$FEX_PAYLOAD_BUILD_RUN_ID" =~ ^[1-9][0-9]*$ \
               && "$BUILDROOT_CANDIDATE" == "$FEX_BUILDROOT_REF" \
               && "$SDK_CANDIDATE" == "$FEX_X86_SDK_REF" ]] || {
              echo '::error::payload recovery requires the exact digest, original revision/run, and retained input digests'; exit 1;
            }
            original_tag="registry.tilo.so/tilo/tilo-fex-payload-candidate:${FEX_PAYLOAD_REPOSITORY_REVISION}-${FEX_PAYLOAD_BUILD_RUN_ID}"
            tag_pull="$(docker pull --platform linux/arm64 "$original_tag")"
            grep -Fx "Digest: ${FEX_PAYLOAD_CANDIDATE##*@}" <<< "$tag_pull"
            docker pull --platform linux/arm64 "$FEX_PAYLOAD_CANDIDATE"
            test "$(docker image inspect --format '{{.Architecture}}' "$FEX_PAYLOAD_CANDIDATE")" = arm64
            test "$(docker image inspect --format '{{index .Config.Labels "org.tilo.development-only"}}' "$FEX_PAYLOAD_CANDIDATE")" = true
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$FEX_PAYLOAD_CANDIDATE")" = "$FEX_PAYLOAD_REPOSITORY_REVISION"
            container="$(docker create "$FEX_PAYLOAD_CANDIDATE" /bin/true)"
            docker cp "$container:/usr/lib/tilo/fex/inputs.env" "$RUNNER_TEMP/fex-inputs.env"
            docker cp "$container:/usr/lib/tilo/fex/source.txt" "$RUNNER_TEMP/fex-source.txt"
            docker cp "$container:/usr/lib/tilo/fex/payload-inventory.json" "$RUNNER_TEMP/fex-payload-inventory.json"
            docker rm "$container"
            grep -Fx "FEX_BUILDROOT_REF=$FEX_BUILDROOT_REF" "$RUNNER_TEMP/fex-inputs.env"
            grep -Fx "FEX_X86_SDK_REF=$FEX_X86_SDK_REF" "$RUNNER_TEMP/fex-inputs.env"
            source os/external-assets/fex-source.env
            grep -Fx "FEX source revision: $FEX_SOURCE_REVISION" "$RUNNER_TEMP/fex-source.txt"
            jq -e '.schema_version == 1 and .validation == "installation-layout-only" and (.files | length > 0)' \
              "$RUNNER_TEMP/fex-payload-inventory.json" >/dev/null
            echo "ref=$FEX_PAYLOAD_CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "::notice::recovered CI-built FEX payload $FEX_PAYLOAD_CANDIDATE from run $FEX_PAYLOAD_BUILD_RUN_ID"
            exit 0
          fi
          [[ -z "$FEX_PAYLOAD_REPOSITORY_REVISION" && -z "$FEX_PAYLOAD_BUILD_RUN_ID" ]] || {
            echo '::error::original payload revision/run require payload_candidate'; exit 1;
          }
          echo "::notice::ARM runner CPUs=$(nproc); memory=$(awk '/^MemTotal:/ {print $2 " KiB"}' /proc/meminfo); Docker=$(docker info --format 'CPUs={{.NCPU}} memory={{.MemTotal}} bytes')"
          docker_memory_bytes="$(docker info --format '{{.MemTotal}}')"
          [[ "$docker_memory_bytes" =~ ^[0-9]+$ ]]
          payload_jobs=2
          if (( $(nproc) >= 4 && docker_memory_bytes >= 17179869184 )); then
            payload_jobs=4
          fi
          echo "::notice::FEX payload build jobs=$payload_jobs (bounded by runner CPUs and 16 GiB Docker memory)"
          bash os/dev/fetch-fex-source.sh "$RUNNER_TEMP/fex-source"
          tag="registry.tilo.so/tilo/tilo-fex-payload-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/arm64 --push --provenance=false \
            --metadata-file fex-metadata.json --file os/Containerfile.fex-payload \
            --build-arg "FEX_BUILDROOT_REF=$FEX_BUILDROOT_REF" \
            --build-arg "FEX_X86_SDK_REF=$FEX_X86_SDK_REF" \
            --build-arg "BUILD_JOBS=$payload_jobs" \
            --build-context "fex-source=$RUNNER_TEMP/fex-source" \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' fex-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-payload-candidate@$digest" >> "$GITHUB_OUTPUT"
      - name: Install pinned Cosign
        run: bash os/dev/install-cached-cosign.sh
      - name: Sign candidate and record its limited provenance
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          FEX_BUILDROOT_REF: ${{ needs.buildroot.outputs.ref }}
          FEX_X86_SDK_REF: ${{ needs.sdk.outputs.ref }}
          FEX_PAYLOAD_REF: ${{ steps.publish.outputs.ref }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.payload_candidate }}
          FEX_PAYLOAD_REPOSITORY_REVISION: ${{ inputs.payload_repository_revision }}
          FEX_PAYLOAD_BUILD_RUN_ID: ${{ inputs.payload_build_run_id }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          source_revision="${FEX_PAYLOAD_REPOSITORY_REVISION:-$GITHUB_SHA}"
          build_run_id="${FEX_PAYLOAD_BUILD_RUN_ID:-$GITHUB_RUN_ID}"
          jq -n --arg source "$source_revision" --arg buildroot "$FEX_BUILDROOT_REF" \
            --arg sdk "$FEX_X86_SDK_REF" --arg payload "$FEX_PAYLOAD_REF" \
            --arg run "$build_run_id" --arg signer_run "$GITHUB_RUN_ID" \
            --arg recovered "$FEX_PAYLOAD_CANDIDATE" '{
              buildDefinition: {
                buildType: "https://tilo.sh/buildtypes/development-fex-payload/v1",
                externalParameters: {developmentOnly: true, runtimeAcceptanceVerified: false,
                  recoveredUnsignedCandidate: ($recovered != "")},
                resolvedDependencies: [
                  {uri: ("git+ssh://code.tilo.so/tilo/tilo@" + $source)},
                  {uri: $buildroot}, {uri: $sdk}
                ]
              },
              runDetails: {
                builder: {id: "https://code.tilo.so/tilo/forgejo/actions/development-fex-v1"},
                metadata: {invocationId: $run, signingInvocationId: $signer_run, output: $payload}
              }
            }' > fex-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$FEX_PAYLOAD_REF"
          cosign attest --yes --key "$COSIGN_KEY_REF" \
            --predicate fex-provenance.json --type slsaprovenance1 "$FEX_PAYLOAD_REF"
          cosign verify --key keys/cosign.pub "$FEX_PAYLOAD_REF" >/dev/null
          cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$FEX_PAYLOAD_REF" >/dev/null
          echo "::notice::CI-signed development FEX candidate: $FEX_PAYLOAD_REF"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: development-fex-payload-${{ github.sha }}-${{ github.run_id }}
          path: |
            fex-metadata.json
            fex-provenance.json
          if-no-files-found: warn
