name: Release / apps

# Apps are a component boundary. A change to one app builds that app, while
# shared runtime/UI code remains covered by the affected-package test graph.
# Tagged/manual releases produce both native architectures and publish
# immutable qpkg collections to Forgejo's generic package registry. OS and
# desktop releases can consume a named collection without rebuilding app
# sources.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "ui/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "release/app-collections.toml"
      - "dist/apps/**"
      - "os/scripts/build-thin-apps.sh"
      - "tools/app_release.py"
      - "tools/assemble_app_collection.py"
      - "dist/apps/assemble-collection.sh"
      - ".forgejo/workflows/release-apps.yml"
  push:
    branches: [main]
    tags: ["apps-v*", "app-*-v*"]
    paths:
      - "apps/**"
      - "crates/**"
      - "ui/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "release/app-collections.toml"
      - "dist/apps/**"
      - "os/scripts/build-thin-apps.sh"
      - "tools/app_release.py"
      - "tools/assemble_app_collection.py"
      - "dist/apps/assemble-collection.sh"
      - ".forgejo/workflows/release-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Space/comma-separated app directory names; empty selects the collection."
        required: false
        default: ""
      collection:
        description: "Named set from release/app-collections.toml."
        required: false
        default: "default"
      architectures:
        description: "Native architectures to publish (x86_64, aarch64, or both); empty selects both."
        required: false
        default: ""
      publish:
        description: "Publish immutable bundles to the Forgejo package registry."
        type: boolean
        required: false
        default: false

concurrency:
  group: release-apps-${{ github.ref }}
  # A main run may be the one that republishes the complete collection after
  # a shared runtime/toolkit change. Cancelling it when the next app commit
  # lands loses that information: the successor diffs only against its direct
  # parent, builds a partial app set, and can never combine it with the older
  # collection because their runtime roots differ. Serialize main releases so
  # every published collection advances in commit order; only supersede PR
  # validation, where no channel state is mutated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: runner
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      packages: ${{ steps.plan.outputs.packages }}
      features: ${{ steps.plan.outputs.features }}
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      collection: ${{ steps.plan.outputs.collection }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select only the affected apps or requested collection
        id: plan
        shell: bash
        env:
          REQUESTED_APPS: ${{ github.event.inputs.apps }}
          REQUESTED_COLLECTION: ${{ github.event.inputs.collection }}
          REQUESTED_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          MAIN_ARCHITECTURES: ${{ vars.QOS_APP_MAIN_ARCHITECTURES }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          case "$GITHUB_REF" in
            refs/tags/app-*-v*) args+=(--tag "$GITHUB_REF_NAME") ;;
            refs/tags/apps-v*) args+=(--collection "${REQUESTED_COLLECTION:-default}") ;;
            *)
              if [[ -n ${REQUESTED_APPS:-} ]]; then
                args+=(--apps "$REQUESTED_APPS")
              elif [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
                args+=(--collection "${REQUESTED_COLLECTION:-default}")
              elif [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
                # A published collection is one atomic runtime ABI boundary.
                # Rebuild every member on main so a failed earlier publication
                # cannot leave the channel permanently incompatible with later
                # partial app updates.
                args+=(--collection default)
              else
                base='${{ github.event.pull_request.base.sha }}'
                [[ -n $base && $base != null ]] || base='${{ github.event.before }}'
                if [[ -z $base || $base == 0000000000000000000000000000000000000000 ]]; then
                  args+=(--collection default)
                else
                  args+=(--base "$base")
                fi
              fi
              ;;
          esac
          python3 tools/app_release.py "${args[@]}" | tee app-release-plan.json
          collection=
          case "$GITHUB_REF" in
            refs/tags/apps-v*) collection=${REQUESTED_COLLECTION:-default} ;;
            refs/tags/app-*-v*) ;;
            refs/heads/main) collection=default ;;
            *)
              if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
                collection=${REQUESTED_COLLECTION:-default}
              fi
              ;;
          esac
          echo "collection=$collection" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* \
                || ( $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ) \
                || ${REQUESTED_PUBLISH:-false} == true ]]; then
            matrix=$(python3 tools/app_release.py --architecture-matrix \
              --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" \
              --architectures "$REQUESTED_ARCHITECTURES" \
              --main-architectures "$MAIN_ARCHITECTURES")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF != refs/heads/main ]]; then
              printf 'manual app publication is restricted to main\n' >&2
              exit 1
            fi
            if [[ $GITHUB_REF != refs/heads/main ]]; then
              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"x86_64","runner":"runner"}]}' >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          case "$GITHUB_REF" in
            refs/tags/*) version=$GITHUB_REF_NAME ;;
            *) version="0.0.0-${GITHUB_SHA}" ;;
          esac
          [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    if: needs.plan.outputs.count != '0'
    needs: plan
    name: apps / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # App feature sets include native media, graphics and portal bindings.
    # Keep those system headers in the versioned CI builder image instead of
    # resolving distro packages independently in every release job.
    container:
      image: code.podesta.ai/qos/qos-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # v2 retires a malformed archive written by the original app namespace.
      QOS_SCCACHE_KEY_PREFIX: quickdesktop/apps/v2/${{ matrix.arch }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate native architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"
      - name: Restore Cargo downloads
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-
      - name: Prepare compiler cache
        run: bash tools/ci-sccache.sh prepare
      - name: Build and verify selected qpkgs once for this architecture
        env:
          QOS_RELEASE_APPS: ${{ needs.plan.outputs.apps }}
          QPKG_PUBLISHER_IDENTITY: ${{ secrets.QPKG_PUBLISHER_IDENTITY }}
          RUNTIME_BUNDLE_SIGNING_KEY: ${{ secrets.RUNTIME_BUNDLE_SIGNING_KEY }}
        run: |
          if [[ -n ${QPKG_PUBLISHER_IDENTITY:-} ]]; then
            identity="$RUNNER_TEMP/qos-app-publisher.json"
            (umask 077; printf '%s' "$QPKG_PUBLISHER_IDENTITY" > "$identity")
            export QPKG_PUBLISHER_IDENTITY_FILE="$identity"
          elif [[ '${{ needs.plan.outputs.publish }}' == true ]]; then
            printf 'QPKG_PUBLISHER_IDENTITY is required for publication\n' >&2
            exit 1
          fi
          if [[ -n ${RUNTIME_BUNDLE_SIGNING_KEY:-} ]]; then
            runtime_identity="$RUNNER_TEMP/qos-runtime-publisher.json"
            (umask 077; printf '%s' "$RUNTIME_BUNDLE_SIGNING_KEY" > "$runtime_identity")
            export RUNTIME_BUNDLE_IDENTITY_FILE="$runtime_identity"
          elif [[ '${{ needs.plan.outputs.publish }}' == true ]]; then
            printf 'RUNTIME_BUNDLE_SIGNING_KEY is required for publication\n' >&2
            exit 1
          fi
          cleanup_identities() {
            [[ -z ${identity:-} ]] || rm -f "$identity"
            [[ -z ${runtime_identity:-} ]] || rm -f "$runtime_identity"
          }
          trap cleanup_identities EXIT
          build_log=$(mktemp "$RUNNER_TEMP/qos-app-build.XXXXXX")
          if ! dist/apps/package-apps.sh 2> >(tee "$build_log" >&2); then
            if ! grep -Eq 'truncated or malformed archive|failed to read object file' "$build_log"; then
              exit 1
            fi
            echo '::warning::discarding malformed compiler-cache output and rebuilding it once'
            find target/thin-app target/release -mindepth 1 -depth -delete 2>/dev/null || true
            SCCACHE_RECACHE=1 dist/apps/package-apps.sh
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-apps-${{ matrix.arch }}
          path: |
            dist/app-release/qpkg/*.qpkg
            dist/app-release/runtime/**
            dist/app-release/SHA256SUMS
            dist/app-release/index.json
          if-no-files-found: error
      - name: Report compiler-cache effectiveness
        if: always()
        run: bash tools/ci-sccache.sh report || true

  publish:
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.count != '0'
    needs: [plan, build]
    runs-on: runner
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release
      - name: Publish reusable qpkgs and assemble immutable collections
        env:
          MAIN_AUDIENCE: ${{ vars.QOS_APP_RELEASE_MAIN_AUDIENCE }}
          TAG_AUDIENCE: ${{ vars.QOS_APP_RELEASE_TAG_AUDIENCE }}
          VERSION: ${{ needs.plan.outputs.version }}
          COLLECTION: ${{ needs.plan.outputs.collection }}
          PRIOR_X86_URL: ${{ vars.QOS_APP_COLLECTION_URL_X86_64 || vars.QOS_APP_COLLECTION_URL }}
          PRIOR_X86_SHA256: ${{ vars.QOS_APP_COLLECTION_SHA256_X86_64 || vars.QOS_APP_COLLECTION_SHA256 }}
          PRIOR_ARM64_URL: ${{ vars.QOS_APP_COLLECTION_URL_AARCH64 }}
          PRIOR_ARM64_SHA256: ${{ vars.QOS_APP_COLLECTION_SHA256_AARCH64 }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            audience=$TAG_AUDIENCE
          else
            audience=$MAIN_AUDIENCE
          fi
          [[ -n $audience ]] || { printf 'app release Authorized Integration audience is required\n' >&2; exit 1; }
          jwt=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -er .value)
          echo "::add-mask::$jwt"
          owner=${GITHUB_REPOSITORY%%/*}
          package_api="$GITHUB_SERVER_URL/api/packages/$owner/generic"

          put_immutable() {
            local file=$1 url=$2 response remote
            response=$(mktemp "$RUNNER_TEMP/qos-package-response.XXXXXX")
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $jwt" \
              --request PUT --upload-file "$file" "$url")
            case "$status" in
              200|201|204) echo "published ${file##*/}" ;;
              409)
                remote=$(mktemp "$RUNNER_TEMP/qos-existing-package.XXXXXX")
                curl --fail --silent --show-error --retry 3 --retry-all-errors \
                  --header "Authorization: Bearer $jwt" "$url" --output "$remote"
                cmp --silent "$file" "$remote" || {
                  printf 'immutable package version conflicts: %s\n' "$url" >&2
                  exit 1
                }
                echo "already published identically: ${file##*/}"
                ;;
              *) cat "$response" >&2; exit 1 ;;
            esac
          }

          # Every app/version/architecture is independently addressable. A
          # one-app update uploads one qpkg; collection assembly below fetches
          # all unchanged members instead of rebuilding them.
          for index in release/*/index.json; do
            while IFS=$'\t' read -r name version file; do
              qpkg="${index%/index.json}/qpkg/$file"
              test -f "$qpkg"
              put_immutable "$qpkg" \
                "$package_api/qos-app-$name/$VERSION/$file"
            done < <(jq -r '.apps[] | [.name,.version,.file] | @tsv' "$index")
          done

          [[ -n ${COLLECTION:-} ]] || exit 0
          collection_plan="$RUNNER_TEMP/qos-collection-plan.json"
          python3 tools/app_release.py --collection "$COLLECTION" > "$collection_plan"
          source_epoch=$(git log -1 --format=%ct)
          channel_url=
          channel_sha=
          for index in release/*/index.json; do
            arch=$(jq -er '.architecture | select(. == "x86_64" or . == "aarch64")' "$index")
            qpkg_dir="$RUNNER_TEMP/qos-collection-$arch"
            mkdir -p "$qpkg_dir"
            prior_url=
            prior_sha=
            # Both continuous pushes and explicitly publishing manual runs on
            # main may replace one app in the immutable prior collection.
            # Tags remain self-contained release boundaries and rebuild their
            # complete requested set instead of depending on a moving channel.
            if [[ $GITHUB_REF == refs/heads/main ]]; then
              case "$arch" in
                x86_64) prior_url=$PRIOR_X86_URL; prior_sha=$PRIOR_X86_SHA256 ;;
                aarch64) prior_url=$PRIOR_ARM64_URL; prior_sha=$PRIOR_ARM64_SHA256 ;;
              esac
            fi
            if [[ -n $prior_url ]]; then
              [[ $prior_sha =~ ^[0-9a-fA-F]{64}$ ]]
              prior="$RUNNER_TEMP/qos-prior-$arch.tar.gz"
              prior_dir="$RUNNER_TEMP/qos-prior-$arch"
              mkdir -p "$prior_dir"
              curl --fail --silent --show-error --retry 3 --retry-all-errors \
                --header "Authorization: Bearer $jwt" "$prior_url" --output "$prior"
              printf '%s  %s\n' "$prior_sha" "$prior" | sha256sum --check --strict
              while IFS= read -r member; do
                if [[ $member == qpkg/ || $member == runtime/ || $member == index.json || $member == SHA256SUMS \
                      || $member =~ ^qpkg/[A-Za-z0-9][A-Za-z0-9._+-]*\.qpkg$ \
                      || $member =~ ^runtime(/[A-Za-z0-9][A-Za-z0-9._+-]*)+/?$ ]]; then
                  continue
                fi
                printf 'unexpected prior collection member: %s\n' "$member" >&2
                exit 1
              done < <(tar -tzf "$prior")
              tar --extract --gzip --file "$prior" --directory "$prior_dir" \
                --no-same-owner --no-same-permissions
              if find "$prior_dir/qpkg" "$prior_dir/runtime" -type l -o \( ! -type f ! -type d \) | grep -q .; then
                printf 'prior app collection contains links or special files\n' >&2
                exit 1
              fi
              built_count=$(jq -r '.apps | length' "$index")
              collection_count=$(jq -r '.catalog | length' "$collection_plan")
              if (( built_count < collection_count )); then
                new_manifest=$(find "${index%/index.json}/runtime/qos-runtime" \
                  -mindepth 2 -maxdepth 2 -name bundle.toml -type f -print -quit)
                prior_manifest=$(find "$prior_dir/runtime/qos-runtime" \
                  -mindepth 2 -maxdepth 2 -name bundle.toml -type f -print -quit)
                new_root=$(sed -n 's/^root_hash *= *"\([0-9a-fA-F]\{64\}\)".*/\1/p' "$new_manifest")
                prior_root=$(sed -n 's/^root_hash *= *"\([0-9a-fA-F]\{64\}\)".*/\1/p' "$prior_manifest")
                if [[ -z $new_root || ${new_root,,} != ${prior_root,,} ]]; then
                  printf 'shared runtime changed; the full collection must be rebuilt\n' >&2
                  exit 1
                fi
              fi
              cp "$prior_dir"/qpkg/*.qpkg "$qpkg_dir/"
            fi
            while IFS=$'\t' read -r name version; do
              file="$name-$version-$arch.qpkg"
              built="${index%/index.json}/qpkg/$file"
              if [[ -f $built ]]; then
                find "$qpkg_dir" -maxdepth 1 -type f -name "$name-*-$arch.qpkg" -delete
                cp "$built" "$qpkg_dir/$file"
              fi
              test -f "$qpkg_dir/$file" || {
                printf 'collection member %s was neither rebuilt nor reusable\n' "$file" >&2
                exit 1
              }
            done < <(jq -r '.catalog[] | [.name,.version] | @tsv' "$collection_plan")
            out="dist/app-collections/$arch"
            QOS_APP_COLLECTION_PLAN="$collection_plan" \
              QOS_APP_ARCH="$arch" QOS_APP_QPKG_DIR="$qpkg_dir" \
              QOS_APP_RUNTIME_DIR="${index%/index.json}/runtime" \
              QOS_APP_COLLECTION_OUT="$out" SOURCE_DATE_EPOCH="$source_epoch" \
              dist/apps/assemble-collection.sh
            bundle="$out/qos-apps-$arch.tar.gz"
            digest_file="$bundle.sha256"
            bundle_url="$package_api/qos-app-collections/$VERSION/${bundle##*/}"
            put_immutable "$bundle" "$bundle_url"
            put_immutable "$digest_file" \
              "$package_api/qos-app-collections/$VERSION/${digest_file##*/}"
            if [[ $arch == x86_64 ]]; then
              channel_url=$bundle_url
              channel_sha=$(awk '{print $1}' "$digest_file")
            else
              arm64_channel_url=$bundle_url
              arm64_channel_sha=$(awk '{print $1}' "$digest_file")
            fi
          done

          # Keep the OS input channel current after a successful default/main
          # collection publish. The package URL remains immutable; only these
          # two repository variables move.
          if [[ $GITHUB_REF == refs/heads/main && $COLLECTION == default ]]; then
            [[ -n $channel_url && $channel_sha =~ ^[0-9a-f]{64}$ ]]
            variable_api="${GITHUB_API_URL:-$GITHUB_SERVER_URL/api/v1}/repos/$GITHUB_REPOSITORY/actions/variables"
            update_variable() {
              local name=$1 value=$2 endpoint status method
              endpoint="$variable_api/$name"
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --header "Authorization: Bearer $jwt" "$endpoint")
              case "$status" in 200) method=PUT ;; 404) method=POST ;; *) return 1 ;; esac
              curl --fail --silent --show-error --request "$method" \
                --header "Authorization: Bearer $jwt" \
                --header 'Content-Type: application/json' \
                --data "$(jq -cn --arg value "$value" '{value:$value}')" "$endpoint"
            }
            update_variable QOS_APP_COLLECTION_URL "$channel_url"
            update_variable QOS_APP_COLLECTION_SHA256 "$channel_sha"
            update_variable QOS_APP_COLLECTION_URL_X86_64 "$channel_url"
            update_variable QOS_APP_COLLECTION_SHA256_X86_64 "$channel_sha"
            if [[ -n ${arm64_channel_url:-} ]]; then
              update_variable QOS_APP_COLLECTION_URL_AARCH64 "$arm64_channel_url"
              update_variable QOS_APP_COLLECTION_SHA256_AARCH64 "$arm64_channel_sha"
            fi
            echo '::notice::advanced the default OS app-collection channel'
          fi
