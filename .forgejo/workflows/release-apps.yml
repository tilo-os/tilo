name: Release / apps

# Pull requests start no jobs here; CI covers their builds. Main publishes only
# affected tapps and reuses unchanged members of the prior immutable collection.
# Tags remain credential-free validation inputs only until a trusted
# default-branch controller or server-enforced tag policy can authorize them.
on:
  push:
    branches: [main]
    tags: ["apps-v*", "app-*-v*"]
    paths:
      - "apps/**"
      - "crates/**"
      - "crates/sdk/ui-core/**"
      - ".cargo/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "dist/apps/app-collections.toml"
      - "dist/apps/**"
      - "os/scripts/build-thin-apps.sh"
      - "os/scripts/bake-runtime-bundle.sh"
      - "os/scripts/verify-elf-hardening.sh"
      - "os/Containerfile.builder"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "tools/apps/**"
      - "tools/canonical_verifier_bundle.py"
      - "tools/assemble_verified_apps.py"
      - "tools/app_packaging_qualification.py"
      - "tools/app_packaging_plan.py"
      - "tools/ci/__init__.py"
      - "tools/ci/workspace_graph.py"
      - "tools/ci/runner_labels.py"
      - "tools/ci/check-build-env.sh"
      - "tools/ci/app_release_history.py"
      - "tools/ci/python.py"
      - "tools/ci/resolve_builder.py"
      - "tools/ci/images.toml"
      - "tools/ci/rustc-thin-app-wrapper.sh"
      - "tools/ci/sccache.sh"
      - "dist/apps/assemble-collection.sh"
      - ".forgejo/actions/restore-cargo-downloads/**"
      - ".forgejo/workflows/release-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Space/comma-separated app directory names; empty selects the collection."
        required: false
        default: ""
      collection:
        description: "Named set from dist/apps/app-collections.toml."
        required: false
        default: "default"
      architectures:
        description: "Native architectures to publish (x86_64, aarch64, or both); empty selects both."
        required: false
        default: ""
      verify_final_receipt:
        description: "Qualify final merged receipt using independently pinned publication trust policy."
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish immutable bundles to the Forgejo package registry."
        type: boolean
        required: false
        default: false
      coordinator_intent:
        description: "Disabled qualification coordinator intent; always publish=false."
        required: false
        default: ""
      builder_image:
        description: "Qualification-only immutable builder image."
        required: false
        default: ""
      baseline_sha:
        description: "Prior independently verified packaging source; empty builds full collection."
        required: false
        default: ""
      baseline_run_id:
        description: "Exact previously verified packaging run for authenticated artifact lookup."
        required: false
        default: ""
      coordinator_policy_sha256:
        description: "Trusted external coordinator policy identity."
        required: false
        default: ""
      baseline_receipt_sha256:
        description: "Qualification baseline verification proof digest."
        required: false
        default: ""
      baseline_evidence:
        description: "Canonical verified baseline proof, bound to baseline_receipt_sha256."
        required: false
        default: ""

concurrency:
  group: release-apps-${{ github.ref }}
  # Published collections advance in commit order.
  cancel-in-progress: false

jobs:
  tag-validation:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: runner-quality
    timeout-minutes: 15
    steps:
      - name: Keep app tags visible without executing tagged repository code
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/app-*-v*|refs/tags/apps-v*) ;;
            *) printf 'unsupported app tag: %s\n' "$GITHUB_REF" >&2; exit 1 ;;
          esac
          printf 'app tag publication is disabled pending trusted default-branch authorization\n'

  coordinator-preguard:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: docker.io/library/python:3.13-alpine@sha256:1a63a53928ce53d2b0baf08092a703f4840ac5dfbd61fd48802dbf48e08c801e
    steps:
      - name: Fetch and run the exact bounded preguard source closure
        env:
          SOURCE_TOKEN: ${{ github.token }}
          COORDINATOR_ENABLED: ${{ vars.TILO_APP_COORDINATOR_QUALIFICATION }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          BASELINE_RECEIPT_SHA256: ${{ github.event.inputs.baseline_receipt_sha256 }}
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
          BASELINE_EVIDENCE: ${{ github.event.inputs.baseline_evidence }}
          COORDINATOR_POLICY_SHA256: ${{ github.event.inputs.coordinator_policy_sha256 }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          REQUESTED_APPS: ${{ github.event.inputs.apps }}
          REQUESTED_COLLECTION: ${{ github.event.inputs.collection }}
          REQUESTED_ARCHITECTURES: ${{ github.event.inputs.architectures }}
        run: |
          root=$(python3 -I - <<'PY'
          # BEGIN coordinator preguard bootstrap
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tempfile
          from urllib.parse import quote, urlencode, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          RAW_ROOT = 'https://code.tilo.so/api/v1/repos/tilo/tilo/raw/'
          FILES = (
              ('tools/app_packaging_qualification.py', 3650, 'c6fd766344d1b18d9c365b2f667627d2102df741a8ab1d1e18e7304240e14063'),
              ('tools/app_packaging_contract.py', 4099, 'f0a5862a39aca5fd0a61bd7915ca87c0915420989c056df3c64151ab9b70989b'),
              ('tools/ci/__init__.py', 61, 'd4ca8c8ec9228fafe30fae7d4532c4ac4455661dc92f75d2428f9d7779dba462'),
              ('tools/ci/python.py', 4403, '5a665e38b0097d5cf0d5a5aecd31fbe35597b80313bdaa5322d95d3a60c71968'),
              ('tools/ci/resolve_builder.py', 7983, '58824c0b8a8cb969bae988379de273dad5e9948726299c553c4ab1b55f203e68'),
              ('tools/ci/images.toml', 1669, '119eb714107c17077517670487460a66748cfe062ef261a2b6b6ca40e7b7effa'),
          )

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('preguard source redirects are forbidden')

          def fetch_one(opener, root, sha, token, relative, size, digest):
              path = PurePosixPath(relative)
              if path.is_absolute() or '..' in path.parts or str(path) != relative or not relative.startswith('tools/'):
                  raise ValueError('invalid preguard source path')
              query = urlencode({'ref': sha})
              url = RAW_ROOT + quote(relative, safe='/') + '?' + query
              request = Request(url, headers={'Authorization': 'token ' + token, 'Accept': 'application/octet-stream'})
              with opener.open(request, timeout=20) as response:
                  if response.status != 200 or response.geturl() != url:
                      raise ValueError('unexpected preguard source response')
                  expected_origin = urlparse(RAW_ROOT)
                  observed = urlparse(response.geturl())
                  if (observed.scheme, observed.netloc) != (expected_origin.scheme, expected_origin.netloc):
                      raise ValueError('preguard source origin changed')
                  payload = response.read(size + 1)
              if len(payload) != size or hashlib.sha256(payload).hexdigest() != digest:
                  raise ValueError('preguard source size or hash mismatch')
              destination = (root / Path(*path.parts)).resolve()
              if root.resolve() not in destination.parents:
                  raise ValueError('preguard destination escaped its root')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)

          def main():
              sha = os.environ.get('GITHUB_SHA', '')
              token = os.environ.get('SOURCE_TOKEN', '')
              if not re.fullmatch('[0-9a-f]{40}', sha) or not token or '\n' in token or '\r' in token:
                  raise ValueError('exact source identity and scoped token required')
              root = Path(tempfile.mkdtemp(prefix='coordinator-preguard-', dir=os.environ.get('RUNNER_TEMP')))
              opener = build_opener(NoRedirect())
              for entry in FILES:
                  fetch_one(opener, root, sha, token, *entry)
              print(root)

          if __name__ == '__main__':
              main()
          # END coordinator preguard bootstrap
          PY
          )
          cd "$root"
          exec env -i \
            PATH="$PATH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" \
            COORDINATOR_ENABLED="$COORDINATOR_ENABLED" \
            COORDINATOR_INTENT="$COORDINATOR_INTENT" \
            REQUESTED_BUILDER="$REQUESTED_BUILDER" \
            BASELINE_SHA="$BASELINE_SHA" \
            BASELINE_RECEIPT_SHA256="$BASELINE_RECEIPT_SHA256" \
            BASELINE_RUN_ID="$BASELINE_RUN_ID" \
            BASELINE_EVIDENCE="$BASELINE_EVIDENCE" \
            COORDINATOR_POLICY_SHA256="$COORDINATOR_POLICY_SHA256" \
            REQUESTED_PUBLISH="$REQUESTED_PUBLISH" \
            REQUESTED_APPS="$REQUESTED_APPS" \
            REQUESTED_COLLECTION="$REQUESTED_COLLECTION" \
            REQUESTED_ARCHITECTURES="$REQUESTED_ARCHITECTURES" \
            sh -c 'python3 -I tools/ci/python.py tools/app_packaging_qualification.py --preflight && printf "coordinator preguard accepted exact source closure\n"'

  plan:
    if: "!startsWith(github.ref, 'refs/tags/')"
    needs: coordinator-preguard
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:281af08d34010af96f97630aa5fde224b6ca02b130aff553ceb3d297d44fca7d
    outputs:
      builder_image: ${{ steps.builder.outputs.image }}
      apps: ${{ steps.plan.outputs.apps }}
      packages: ${{ steps.plan.outputs.packages }}
      features: ${{ steps.plan.outputs.features }}
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      collection: ${{ steps.plan.outputs.collection }}
      complete: ${{ steps.plan.outputs.complete }}
      prior_x86_url: ${{ steps.plan.outputs.prior_x86_url }}
      prior_x86_sha256: ${{ steps.plan.outputs.prior_x86_sha256 }}
      prior_arm64_url: ${{ steps.plan.outputs.prior_arm64_url }}
      prior_arm64_sha256: ${{ steps.plan.outputs.prior_arm64_sha256 }}
    steps:
      - name: Disable automatic Git maintenance in the disposable job container
        # Git 2.54 maintenance can rewrite shallow history between fetches.
        # Checkout copies this global config before its first fetch.
        run: git config --global maintenance.auto false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          # Planning starts at the exact event tree. The history helper then
          # deepens only immutable comparison tips or one observed main tip.
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve one immutable builder for every architecture
        id: builder
        env:
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
        run: python3 -I tools/ci/python.py tools/ci/resolve_builder.py
      - name: Prepare exact release comparison history
        if: "github.event_name != 'workflow_dispatch' || (github.event.inputs.coordinator_intent != '' && github.event.inputs.baseline_sha != '')"
        # This step intentionally uses only the pinned job image and inline
        # commands. PR-controlled checkout tools never receive SOURCE_TOKEN.
        env:
          SOURCE_TOKEN: ${{ github.token }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          COLLECTION_SOURCE: ${{ vars.TILO_APP_COLLECTION_SOURCE }}
        run: |
          set -euo pipefail
          base=
          if [[ -n ${COORDINATOR_INTENT:-} ]]; then
            base=${BASELINE_SHA:-}
          elif [[ $GITHUB_EVENT_NAME == push ]]; then
            base=${COLLECTION_SOURCE:-}
          fi
          [[ $base != null ]] || base=
          if [[ -z $base || $base == 0000000000000000000000000000000000000000 ]]; then
            unset SOURCE_TOKEN
            exit 0
          fi
          [[ $base =~ ^[0-9a-f]{40}$ && $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          origin=$(/usr/bin/git remote get-url origin)
          [[ $GITHUB_SERVER_URL =~ ^https://[a-z0-9.-]+$ ]]
          [[ $origin == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" || \
             $origin == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" ]] || {
            printf 'checkout origin is not %s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >&2
            exit 1
          }
          token=$SOURCE_TOKEN
          unset SOURCE_TOKEN
          credential=$(printf 'x-access-token:%s' "$token" | \
            /usr/bin/env -u SOURCE_TOKEN /usr/bin/base64 -w0)
          unset token
          auth=(/usr/bin/env -u SOURCE_TOKEN GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential")
          connected=false
          for depth in 2 32 128 512 2048; do
            # A concurrent shallow-file update can make a fetch fail even
            # after transferring both tips. Both targets are immutable.
            for attempt in 1 2; do
              if "${auth[@]}" /usr/bin/git fetch --no-tags --no-write-fetch-head \
                  --depth="$depth" origin \
                  "+$base:refs/ci/app-release-base" \
                  "+$GITHUB_SHA:refs/ci/app-release-head"; then
                break
              fi
              [[ $attempt == 1 ]] || exit 1
              sleep 1
            done
            [[ $(/usr/bin/git rev-parse refs/ci/app-release-base) == "$base" ]]
            [[ $(/usr/bin/git rev-parse refs/ci/app-release-head) == "$GITHUB_SHA" ]]
            /usr/bin/git cat-file -e "$base^{commit}"
            /usr/bin/git cat-file -e "$GITHUB_SHA^{commit}"
            if /usr/bin/git merge-base "$base" "$GITHUB_SHA" >/dev/null; then
              connected=true
              break
            fi
          done
          unset credential auth
          if ! $connected; then
            printf 'cannot establish bounded release comparison\n' >&2
            # Main then rebuilds the whole collection.
            [[ $GITHUB_EVENT_NAME == push ]] || exit 1
          fi
      - name: Validate prepared nonpublishing coordinator qualification
        env:
          COORDINATOR_ENABLED: ${{ vars.TILO_APP_COORDINATOR_QUALIFICATION }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          BASELINE_RECEIPT_SHA256: ${{ github.event.inputs.baseline_receipt_sha256 }}
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
          BASELINE_EVIDENCE: ${{ github.event.inputs.baseline_evidence }}
          COORDINATOR_POLICY_SHA256: ${{ github.event.inputs.coordinator_policy_sha256 }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          REQUESTED_APPS: ${{ github.event.inputs.apps }}
          REQUESTED_COLLECTION: ${{ github.event.inputs.collection }}
          REQUESTED_ARCHITECTURES: ${{ github.event.inputs.architectures }}
        run: python3 -I tools/ci/python.py tools/app_packaging_qualification.py
      - name: Select only the affected apps or requested collection
        id: plan
        shell: bash
        env:
          REQUESTED_APPS: ${{ github.event.inputs.apps }}
          REQUESTED_COLLECTION: ${{ github.event.inputs.collection }}
          REQUESTED_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          MAIN_ARCHITECTURES: ${{ vars.TILO_APP_MAIN_ARCHITECTURES }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          COLLECTION_SOURCE: ${{ vars.TILO_APP_COLLECTION_SOURCE }}
          COLLECTION_BUILDER: ${{ vars.TILO_APP_COLLECTION_BUILDER }}
          BUILDER: ${{ steps.builder.outputs.image }}
          PRIOR_X86_URL: ${{ vars.TILO_APP_COLLECTION_URL_X86_64 || vars.TILO_APP_COLLECTION_URL }}
          PRIOR_X86_SHA256: ${{ vars.TILO_APP_COLLECTION_SHA256_X86_64 || vars.TILO_APP_COLLECTION_SHA256 }}
          PRIOR_ARM64_URL: ${{ vars.TILO_APP_COLLECTION_URL_AARCH64 }}
          PRIOR_ARM64_SHA256: ${{ vars.TILO_APP_COLLECTION_SHA256_AARCH64 }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          # Publication reuses exactly the collection this selection was made
          # against, never one a later run moved the channel to.
          {
            echo "prior_x86_url=${PRIOR_X86_URL:-}"
            echo "prior_x86_sha256=${PRIOR_X86_SHA256:-}"
            echo "prior_arm64_url=${PRIOR_ARM64_URL:-}"
            echo "prior_arm64_sha256=${PRIOR_ARM64_SHA256:-}"
          } >> "$GITHUB_OUTPUT"
          # Whether this selection covers every change since the published
          # collection's source, so publishing may record this commit as it.
          complete=false
          use_base() {
            python3 -I tools/ci/python.py tools/ci/app_release_history.py \
              fetch-base "$1" "$GITHUB_SHA" || return 1
            args+=(--base "$1")
          }
          if [[ -n ${COORDINATOR_INTENT:-} ]]; then
            if [[ -n ${BASELINE_SHA:-} ]]; then
              use_base "$BASELINE_SHA"
            else
              args+=(--collection "${REQUESTED_COLLECTION:-default}")
            fi
          elif [[ -n ${REQUESTED_APPS:-} ]]; then
            args+=(--apps "$REQUESTED_APPS")
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            args+=(--collection "${REQUESTED_COLLECTION:-default}")
            complete=true
          elif [[ $GITHUB_EVENT_NAME == push ]]; then
            # Main publishes the default collection below. Select the tapps
            # affected since the published collection's source, so unchanged
            # immutable members are reused and runs superseded in the queue
            # lose nothing; without a usable source, or when the published
            # collection's runtime came from another builder, rebuild them all.
            complete=true
            base=$(python3 -I tools/ci/python.py tools/apps/app_release.py \
              --prior-collection-base --collection-source "${COLLECTION_SOURCE:-}" \
              --collection-builder "${COLLECTION_BUILDER:-}" --builder "${BUILDER:-}")
            if ! [[ $base =~ ^[0-9a-f]{40}$ ]] || ! use_base "$base"; then
              args+=(--collection default)
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          python3 -I tools/ci/python.py tools/apps/app_release.py "${args[@]}" | tee app-release-plan.json
          collection=
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            collection=default
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            collection=${REQUESTED_COLLECTION:-default}
          fi
          echo "collection=$collection" >> "$GITHUB_OUTPUT"
          if [[ ( $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ) \
                || ${REQUESTED_PUBLISH:-false} == true ]]; then
            matrix=$(python3 -I tools/ci/python.py tools/apps/app_release.py --architecture-matrix \
              --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" \
              --architectures "$REQUESTED_ARCHITECTURES" \
              --main-architectures "$MAIN_ARCHITECTURES")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF != refs/heads/main ]]; then
              printf 'manual app publication is restricted to main\n' >&2
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            matrix=$(python3 -I tools/ci/python.py tools/apps/app_release.py --architecture-matrix \
              --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" \
              --architectures "$REQUESTED_ARCHITECTURES")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          version="0.0.0-${GITHUB_SHA}"
          [[ $version =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Retain trusted coordinator plan provenance
        if: github.event.inputs.coordinator_intent != ''
        env:
          COORDINATOR_ENABLED: ${{ vars.TILO_APP_COORDINATOR_QUALIFICATION }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          COORDINATOR_POLICY_SHA256: ${{ github.event.inputs.coordinator_policy_sha256 }}
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
          RESOLVED_BUILDER: ${{ steps.builder.outputs.image }}
          REQUESTED_APPS: ${{ github.event.inputs.apps }}
          REQUESTED_COLLECTION: ${{ github.event.inputs.collection }}
          REQUESTED_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          REQUESTED_PUBLISH: ${{ github.event.inputs.publish }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
          BASELINE_EVIDENCE: ${{ github.event.inputs.baseline_evidence }}
          BASELINE_RECEIPT_SHA256: ${{ github.event.inputs.baseline_receipt_sha256 }}
        run: python3 -I tools/ci/python.py tools/app_packaging_plan.py
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: github.event.inputs.coordinator_intent != ''
        with:
          name: coordinator-plan-${{ github.run_attempt }}
          path: coordinator-plan.json
          if-no-files-found: error

  authorize-publish:
    needs: plan
    runs-on: runner-quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.plan.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authorize the immutable main event source without release credentials
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          [[ $GITHUB_REF == refs/heads/main ]]
          [[ $GITHUB_EVENT_NAME == push || $GITHUB_EVENT_NAME == workflow_dispatch ]]
          # Registry transitions enforce per-app/per-target version monotonicity.
          # Advancing main must not invalidate an already-running immutable build.

  build:
    # PR compilation belongs to the focused CI lane. Packaging remains available
    # through workflow_dispatch (publish=false) before requesting publication.
    if: "github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.count != '0'"
    needs: [plan, authorize-publish]
    name: apps / ${{ matrix.arch }}
    runs-on: ${{ matrix.build_runner }}
    timeout-minutes: 180
    # App feature sets include native media, graphics and portal bindings.
    # Keep those system headers in the versioned CI builder image instead of
    # resolving distro packages independently in every release job.
    container:
      image: ${{ needs.plan.outputs.builder_image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # v2 retires a malformed archive written by the original app namespace.
      TILO_SCCACHE_KEY_PREFIX: tilo/apps/v2/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          # The plan already selected the build inputs; compilation needs only
          # the immutable event tree.
          fetch-depth: 1
          persist-credentials: false
      - name: Validate native architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"
      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads
      # The runner's compiler cache (infra docs/ci-caching.md). Pull request
      # jobs write only their own scope; the shared scope a main build reads
      # is written only by trusted events of users who can push to this
      # repository. Signing secrets never reach the compile step below.
      - name: Prepare compiler cache
        run: bash tools/ci/sccache.sh prepare
      - name: Build and verify selected tapps once for this architecture
        env:
          TILO_RELEASE_APPS: ${{ needs.plan.outputs.apps }}
          TILO_APP_RELEASE_SOURCE: ${{ needs.plan.outputs.publish == 'true' && github.sha || '' }}
          TILO_APP_RELEASE_SEQUENCE: ${{ needs.plan.outputs.publish == 'true' && github.run_number || '' }}
          TILO_APP_COMPILE_ONLY: "1"
        run: |
          # Every core compiles, bounded by memory: 2 GiB per job is what the
          # smaller runners have always given this graph.
          cpus=$(nproc)
          if read -r quota period 2>/dev/null < /sys/fs/cgroup/cpu.max && [[ $quota != max ]]; then
            cpus=$(( (quota + period - 1) / period ))
          fi
          memory=$(( $(sed -n 's/^MemTotal: *\([0-9]*\) kB$/\1/p' /proc/meminfo) << 10 ))
          if read -r limit 2>/dev/null < /sys/fs/cgroup/memory.max && [[ $limit =~ ^[0-9]+$ ]]; then
            (( limit < memory )) && memory=$limit
          fi
          jobs=$(( memory / (2 << 30) ))
          (( jobs > cpus )) && jobs=$cpus
          (( jobs < 1 )) && jobs=1
          export CARGO_BUILD_JOBS=$jobs
          echo "::notice::cargo jobs: $jobs of $cpus CPUs, $(( memory >> 30 )) GiB"
          build_log=$(mktemp "$RUNNER_TEMP/tilo-app-build.XXXXXX")
          if ! dist/apps/package-apps.sh 2> >(tee "$build_log" >&2); then
            if ! grep -Eq 'truncated or malformed archive|failed to read object file' "$build_log"; then
              exit 1
            fi
            echo '::warning::discarding malformed compiler-cache output and rebuilding it once'
            find target/thin-app target/release -mindepth 1 -depth -delete 2>/dev/null || true
            SCCACHE_RECACHE=1 dist/apps/package-apps.sh
          fi
          [[ -z ${RUSTC_WRAPPER:-} ]] || "$RUSTC_WRAPPER" --show-stats || true
      - name: Package and sign selected tapps
        env:
          TILO_RELEASE_APPS: ${{ needs.plan.outputs.apps }}
          TILO_APP_RELEASE_SOURCE: ${{ needs.plan.outputs.publish == 'true' && github.sha || '' }}
          TILO_APP_RELEASE_SEQUENCE: ${{ needs.plan.outputs.publish == 'true' && github.run_number || '' }}
          TAPP_PUBLISHER_IDENTITY: ${{ needs.plan.outputs.publish == 'true' && secrets.TAPP_PUBLISHER_IDENTITY || '' }}
          RUNTIME_BUNDLE_SIGNING_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.RUNTIME_BUNDLE_SIGNING_KEY || '' }}
        run: |
          if [[ -n ${TAPP_PUBLISHER_IDENTITY:-} ]]; then
            identity="$RUNNER_TEMP/tilo-app-publisher.json"
            (umask 077; printf '%s' "$TAPP_PUBLISHER_IDENTITY" > "$identity")
            export TAPP_PUBLISHER_IDENTITY_FILE="$identity"
          elif [[ '${{ needs.plan.outputs.publish }}' == true ]]; then
            printf 'TAPP_PUBLISHER_IDENTITY is required for publication\n' >&2
            exit 1
          fi
          if [[ -n ${RUNTIME_BUNDLE_SIGNING_KEY:-} ]]; then
            runtime_identity="$RUNNER_TEMP/tilo-runtime-publisher.json"
            (umask 077; printf '%s' "$RUNTIME_BUNDLE_SIGNING_KEY" > "$runtime_identity")
            export RUNTIME_BUNDLE_IDENTITY_FILE="$runtime_identity"
          elif [[ '${{ needs.plan.outputs.publish }}' == true ]]; then
            printf 'RUNTIME_BUNDLE_SIGNING_KEY is required for publication\n' >&2
            exit 1
          fi
          unset TAPP_PUBLISHER_IDENTITY RUNTIME_BUNDLE_SIGNING_KEY
          cleanup_identities() {
            [[ -z ${identity:-} ]] || rm -f "$identity"
            [[ -z ${runtime_identity:-} ]] || rm -f "$runtime_identity"
          }
          trap cleanup_identities EXIT
          dist/apps/package-apps.sh
          # The publish job reuses this already-built CLI to create signed
          # registry mutations from the final tapp bytes.
          install -m 0755 target/release/tilo-app-package dist/app-release/tilo-app-package
      - name: Generate unpublished receipt with canonical verifiers
        # Runs for publish=false too. Uses tools compiled by package-apps.sh;
        # adds no build, credentials, registry write or channel promotion.
        env:
          RECEIPT_ARCH: ${{ matrix.arch }}
        run: |
          python3 tools/apps/create_app_receipt.py \
            --collection dist/app-release \
            --pkg-binary target/release/tilo-app-package \
            --runtime-binary target/release/tilo-runtime-bundle \
            --signers dist/app-release/work/receipt-signers.json \
            --source-sha "$GITHUB_SHA" --architecture "$RECEIPT_ARCH"
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: tilo-apps-${{ matrix.arch }}
          path: |
            dist/app-release/tapp/*.tapp
            dist/app-release/runtime/**
            dist/app-release/SHA256SUMS
            dist/app-release/index.json
            dist/app-release/publication-receipt.json
            dist/app-release/verification-policy.json
            dist/app-release/tilo-app-package
          if-no-files-found: error
          # Read only by this run's qualify-collection and publish jobs; the
          # cross-run baseline is final-app-collection-<arch>.
          retention-days: 1
  qualify-collection:
    # Coordinator guard keeps this qualification disabled; no publisher OIDC.
    if: github.event.inputs.coordinator_intent != '' && needs.plan.outputs.publish == 'false' && needs.build.result == 'success'
    needs: [plan, build]
    runs-on: ${{ fromJSON(needs.plan.outputs.matrix).include[0].runner }}
    timeout-minutes: 60
    container:
      image: ${{ needs.plan.outputs.builder_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: release
      - name: Assemble and verify without publication
        env:
          FORGEJO_ARTIFACT_TOKEN: ${{ github.token }}
          VERIFIER_BUNDLE_READ_TOKEN: ${{ secrets.TILO_VERIFIER_BUNDLE_READ_TOKEN }}
          FINAL_RECEIPT_POLICY: ${{ vars.TILO_APP_FINAL_RECEIPT_POLICY }}
          FINAL_RECEIPT_POLICY_SHA256: ${{ vars.TILO_APP_FINAL_RECEIPT_POLICY_SHA256 }}
          COORDINATOR_INTENT: ${{ github.event.inputs.coordinator_intent }}
          COORDINATOR_POLICY_SHA256: ${{ github.event.inputs.coordinator_policy_sha256 }}
          BASELINE_EVIDENCE: ${{ github.event.inputs.baseline_evidence }}
          BASELINE_RECEIPT_SHA256: ${{ github.event.inputs.baseline_receipt_sha256 }}
          BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          BUILDER_IMAGE: ${{ needs.plan.outputs.builder_image }}
          COLLECTION: ${{ needs.plan.outputs.collection }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SELECTED_APPS: ${{ needs.plan.outputs.apps }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/final-policy.json"
          printf '%s' "$FINAL_RECEIPT_POLICY" > "$policy"
          baseline="$RUNNER_TEMP/baseline-proof.json"
          printf '%s' "$BASELINE_EVIDENCE" > "$baseline"
          plan="$RUNNER_TEMP/final-collection-plan.json"
          python3 -I tools/ci/python.py tools/apps/app_release.py --collection "$COLLECTION" > "$plan"
          tools="$RUNNER_TEMP/platform-verifiers"
          python3 -I tools/ci/python.py tools/canonical_verifier_bundle.py fetch \
            --trust-policy "$policy" --trust-policy-sha256 "$FINAL_RECEIPT_POLICY_SHA256" \
            --builder-image "$BUILDER_IMAGE" --output "$tools"
          while read -r arch; do
            python3 -I tools/ci/python.py tools/assemble_verified_apps.py \
              --built "release/tilo-apps-$arch" --plan "$plan" --selected-apps "$SELECTED_APPS" \
              --output "dist/qualified-apps/$arch" --work "$RUNNER_TEMP/qualified-apps-$arch" \
              --pkg-binary "$tools/tilo-app-package" --runtime-binary "$tools/tilo-runtime-bundle" \
              --trust-policy "$policy" --trust-policy-sha256 "$FINAL_RECEIPT_POLICY_SHA256" \
              --source-sha "$GITHUB_SHA" --builder-image "$BUILDER_IMAGE" \
              --collection "$COLLECTION" --architecture "$arch" --intent "$COORDINATOR_INTENT" \
              --run-id "$GITHUB_RUN_ID" --qualifier-attempt "$GITHUB_RUN_ATTEMPT" --source-epoch "$(git log -1 --format=%ct)" \
              --coordinator-policy-sha256 "$COORDINATOR_POLICY_SHA256" \
              --baseline-proof "$baseline" --baseline-proof-sha256 "$BASELINE_RECEIPT_SHA256" \
              --baseline-source "$BASELINE_SHA"
          done < <(jq -r '.include[].arch' <<< "$MATRIX")
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: contains(github.event.inputs.architectures, 'x86_64')
        with:
          name: final-app-collection-x86_64
          path: |
            dist/qualified-apps/x86_64/tilo-apps-x86_64.tar.gz
            dist/qualified-apps/x86_64/final-publication-receipt.json
            dist/qualified-apps/x86_64/assembly-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: contains(github.event.inputs.architectures, 'aarch64')
        with:
          name: final-app-collection-aarch64
          path: |
            dist/qualified-apps/aarch64/tilo-apps-aarch64.tar.gz
            dist/qualified-apps/aarch64/final-publication-receipt.json
            dist/qualified-apps/aarch64/assembly-provenance.json
          if-no-files-found: error

  publish:
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.count != '0'
    needs: [plan, authorize-publish, build]
    # Execute tools from the first selected native architecture. Those tools can
    # verify either target archive without executing its application payloads.
    runs-on: ${{ fromJSON(needs.plan.outputs.matrix).include[0].runner }}
    container:
      # This public, immutable image is pulled before any release authorization.
      # It contains no compiler or build toolchain and needs no registry secret.
      image: registry.tilo.so/tilo/tilo-release-tools@sha256:2a7292af48bf8074e27f95661a293b2c48c420c5522d465da7fb31b6e22562fa
    timeout-minutes: 60
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Publication derives its source epoch from this exact commit and
          # reuses prior collections over HTTPS; it needs no Git history.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: release
      - name: Publish reusable tapps and assemble immutable collections
        env:
          VERIFY_FINAL_RECEIPT: ${{ github.event.inputs.verify_final_receipt }}
          VERIFIER_BUNDLE_READ_TOKEN: ${{ secrets.TILO_VERIFIER_BUNDLE_READ_TOKEN }}
          BUILDER_IMAGE: ${{ needs.plan.outputs.builder_image }}
          # Independently provisioned policy; never use uploaded verification-policy.json.
          FINAL_RECEIPT_POLICY: ${{ vars.TILO_APP_FINAL_RECEIPT_POLICY }}
          FINAL_RECEIPT_POLICY_SHA256: ${{ vars.TILO_APP_FINAL_RECEIPT_POLICY_SHA256 }}
          MAIN_AUDIENCE: ${{ vars.TILO_APP_RELEASE_MAIN_AUDIENCE }}
          VERSION: ${{ needs.plan.outputs.version }}
          COLLECTION: ${{ needs.plan.outputs.collection }}
          COMPLETE: ${{ needs.plan.outputs.complete }}
          PRIOR_X86_URL: ${{ needs.plan.outputs.prior_x86_url }}
          PRIOR_X86_SHA256: ${{ needs.plan.outputs.prior_x86_sha256 }}
          PRIOR_ARM64_URL: ${{ needs.plan.outputs.prior_arm64_url }}
          PRIOR_ARM64_SHA256: ${{ needs.plan.outputs.prior_arm64_sha256 }}
          TILO_PACKAGE_PUBLIC_BASE_URL: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
          TILO_REGISTRY_URL: ${{ vars.TILO_REGISTRY_URL || 'https://apps.tilo.so' }}
          TAPP_PUBLISHER_IDENTITY: ${{ secrets.TAPP_PUBLISHER_IDENTITY }}
        run: tools/apps/publish-collections.sh
