name: Maintenance / inspect RPM signing client

on:
  workflow_dispatch:

jobs:
  inspect:
    # Same class as the protected Desktop signing job; no signing capability.
    runs-on: runner
    enable-openid-connect: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record public operator-client metadata only
        env:
          TILO_RPM_SIGNING_FINGERPRINT: ${{ vars.TILO_RPM_SIGNING_FINGERPRINT }}
        run: |
          python3 dist/rpm/inspect-signing-client.py > rpm-signing-inspection.json
          cat rpm-signing-inspection.json
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: rpm-signing-client-metadata-${{ github.run_id }}
          path: rpm-signing-inspection.json
          if-no-files-found: error
          retention-days: 7
