name: Release / local model catalog

# Explicit catalog publication only; ordinary app pushes do not build or sign.
on:
  workflow_dispatch:

concurrency:
  group: local-model-catalog-release
  cancel-in-progress: false

jobs:
  builder:
    if: github.ref == 'refs/heads/main'
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: resolve
        run: python3 -I tools/ci/python.py tools/ci/resolve_builder.py

  compiler:
    needs: builder
    runs-on: runner
    timeout-minutes: 20
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/prepare-rust-build
      - name: Build the catalog compiler without signing credentials
        run: cargo build --locked -p local-model-service --bin tilo-model-catalog
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: local-model-catalog-compiler
          path: target/debug/tilo-model-catalog
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [builder, compiler]
    if: github.ref == 'refs/heads/main'
    runs-on: runner
    timeout-minutes: 10
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: local-model-catalog-compiler
          path: catalog-compiler
      - name: Reproduce the reviewed signed image inputs and publish
        env:
          MODEL_SIGNING_SEED: ${{ secrets.TILO_MODEL_CATALOG_SIGNING_KEY }}
          PACKAGE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          umask 077
          release_dir=$(mktemp -d)
          release_dir=$(realpath "$release_dir")
          trap 'rm -rf "$release_dir"' EXIT
          mkdir "$release_dir/artifacts"
          cp dist/local-models/catalog-source.json "$release_dir/source.json"
          jq -e '.production == true and .runtimes == [] and .recommendation == ""
            and (.models | length) == 1 and .models[0].id == "u2net-subject"
            and .models[0].artifact.file == "artifacts/u2net.onnx"' "$release_dir/source.json"
          model_url=$(jq -er '.models[0].artifact.url' "$release_dir/source.json")
          license_url=$(jq -er '.models[0].license_url' "$release_dir/source.json")
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$release_dir/artifacts/u2net.onnx" "$model_url"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$release_dir/artifacts/LICENSE" "$license_url"
          (cd "$release_dir/artifacts" && sha256sum -c "$GITHUB_WORKSPACE/dist/local-models/u2net-subject/model-files.sha256")
          test "$(stat --format='%s' "$release_dir/artifacts/u2net.onnx")" = 175997641
          test "$(stat --format='%s' "$release_dir/artifacts/LICENSE")" = 11357
          printf '%s\n' "$MODEL_SIGNING_SEED" > "$release_dir/signing-key"
          unset MODEL_SIGNING_SEED
          chmod +x catalog-compiler/tilo-model-catalog
          catalog-compiler/tilo-model-catalog --source "$release_dir/source.json" \
            --signing-key "$release_dir/signing-key" \
            --catalog-out "$release_dir/catalog.json" --trust-out "$release_dir/keys.json"
          rm "$release_dir/signing-key"
          cmp "$release_dir/catalog.json" os/usr/share/tilo/system-extensions/local-model-catalog.json
          cmp "$release_dir/keys.json" os/usr/share/tilo/system-extensions/local-model-keys.json
          version=$(sha256sum "$release_dir/catalog.json" | awk '{print $1}')
          base="https://code.tilo.so/api/packages/tilo/generic/tilo-local-model-catalog/$version"
          for file in catalog.json keys.json; do
            if curl --fail --silent --show-error --proto '=https' \
                --output "$release_dir/existing-$file" "$base/$file"; then
              cmp "$release_dir/$file" "$release_dir/existing-$file"
            else
              curl --fail --silent --show-error --proto '=https' \
                --header "Authorization: token $PACKAGE_TOKEN" \
                --upload-file "$release_dir/$file" "$base/$file"
            fi
            curl --fail --silent --show-error --proto '=https' \
              --output "$release_dir/published-$file" "$base/$file"
            cmp "$release_dir/$file" "$release_dir/published-$file"
          done
          printf 'Published reviewed catalog %s from %s\n' "$version" "$GITHUB_SHA"
