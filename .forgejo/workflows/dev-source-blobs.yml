name: Dev / source blob batching

# Explicit comparison only. Both auditors inspect the same committed source
# tree, in both orders. No compilation, publication, or protected note writes.
on:
  workflow_dispatch:
    inputs:
      order:
        description: 'Audit order; dispatch both orders for qualification.'
        type: choice
        default: baseline-first
        options: [baseline-first, candidate-first]
      baseline:
        description: 'Full repository commit containing the original auditor.'
        type: string
        default: cc3f8733cc304af1a1a09aae826ec78a4f31b178

jobs:
  compare:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:f84f99fb5586335f3850c06c7daaf26a12903c4cb29513b9a9c95a9f266f56f1
    steps:
      - name: Disable automatic Git maintenance
        run: git config --global maintenance.auto false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false

      - name: Compare complete blob inspections
        shell: bash
        env:
          ORDER: ${{ github.event.inputs.order }}
          BASELINE: ${{ github.event.inputs.baseline }}
        run: |
          set -euo pipefail
          [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$BASELINE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASELINE"
          fi
          python3 - <<'PYTHON'
          import importlib.util, json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          source = 'tools/policy/check_source_content.py'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'])
          baseline = {'__name__': 'baseline_auditor', '__file__': str(root / source)}
          original = subprocess.check_output(['git', 'show', os.environ['BASELINE'] + ':' + source])
          exec(compile(original, source, 'exec'), baseline)
          spec = importlib.util.spec_from_file_location('candidate_auditor', root / source)
          candidate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(candidate)
          auditors = {'baseline': baseline['audit'], 'candidate': candidate.audit}
          order = os.environ['ORDER']
          assert order in ('baseline-first', 'candidate-first')
          variants = ['baseline', 'candidate'] if order == 'baseline-first' else ['candidate', 'baseline']
          cgroup = pathlib.Path('/sys/fs/cgroup')
          def cpu():
              values = (cgroup / 'cpu.stat').read_text().split()
              return int(values[values.index('usage_usec') + 1])
          rows, results = [], []
          for variant in variants:
              started, before = time.monotonic(), cpu()
              result = auditors[variant](root)
              rows.append({'variant': variant, 'wall_seconds': round(time.monotonic() - started, 6),
                           'cpu_seconds': round((cpu() - before) / 1000000, 6),
                           'cumulative_job_peak_bytes': int((cgroup / 'memory.peak').read_text())})
              results.append(result)
          assert results[0] == results[1], 'auditors disagree on inspected blobs or diagnostics'
          assert not results[0][0] and results[0][1] > 0, 'source audit did not qualify'
          evidence = {'source_sha': head, 'baseline_auditor_sha': os.environ['BASELINE'],
                      'order': order, 'inspected_blobs': results[0][1],
                      'cpu_max': (cgroup / 'cpu.max').read_text().strip(),
                      'memory_max': (cgroup / 'memory.max').read_text().strip(), 'measurements': rows}
          report = json.dumps(evidence, indent=2)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + report + '\n```\n')
          PYTHON

      - name: Run unchanged and extended source-content contracts
        run: python3 -m unittest discover -s tools/tests -p test_source_content.py
