name: Dev / causal policy profile

# Explicit-only observations. Profiler time includes instrumentation overhead;
# never use it as an unprofiled speedup or compiler-cache benchmark.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Existing policy target to profile without removing checks.'
        type: choice
        default: app-resource-action
        options: [app-resource-action, app-portability, policy-tests]

jobs:
  profile:
    runs-on: runner-quality
    timeout-minutes: 20
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:e2d8ed58b06103e01cc9010c58989d07d3a966f0599774911a5c23bc9065844a
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Disable automatic Git maintenance
        run: git config --global maintenance.auto false
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false
      - name: Restore Cargo downloads
        if: github.event.inputs.target == 'policy-tests'
        uses: ./.forgejo/actions/restore-cargo-downloads
      - name: Record actual allocation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'cpu_max=%s\nmemory_max=%s\n' "$(cat /sys/fs/cgroup/cpu.max)" "$(cat /sys/fs/cgroup/memory.max)"
      - name: Profile existing target
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: bash tools/ci/measure.sh 'policy profile tests' -- python3 tools/ci/profile_policy.py --target "$TARGET"
