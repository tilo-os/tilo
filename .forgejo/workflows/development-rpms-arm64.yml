name: Development / ARM64 RPM candidate

# This produces a development-only, immutable ARM64 repository for a selected
# source revision. It deliberately does not sign or promote a production RPM
# index, update os/rpms-snapshot.env, or dispatch an OS build.
on:
  workflow_dispatch:

concurrency:
  group: development-rpms-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    runs-on: runner-arm64
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false

      - name: Require a native ARM64 build host
        run: ./os/dev/assert-native-arch.sh aarch64

      - name: Restore checksum-verified external build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable external build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save checksum-verified external inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Derive the ARM64 package set
        run: |
          set -euo pipefail
          grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"
          roots="$RUNNER_TEMP/development-rpms-arm64-roots.txt"
          ./os/dev/derive-rpm-package-set.py --arch aarch64 | sort -u > "$roots"
          test -s "$roots"
          packages="$(tr '\n' ' ' < "$roots")"
          package_count="$(wc -l < "$roots")"
          package_manifest_sha256="$(sha256sum "$roots" | cut -d' ' -f1)"
          {
            echo "PACKAGES=$packages"
            echo "PACKAGE_COUNT=$package_count"
            echo "PACKAGE_MANIFEST_SHA256=$package_manifest_sha256"
          } >> "$GITHUB_ENV"

      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up buildx for native snapshot construction
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build and push the development ARM64 RPM repository
        id: rpms
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.rpms
          platforms: linux/arm64
          push: true
          tags: code.podesta.ai/qos/tilo-development-rpms-aarch64:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
            PACKAGES=${{ env.PACKAGES }}
          provenance: false

      - name: Write candidate receipt
        env:
          RPM_DIGEST: ${{ steps.rpms.outputs.digest }}
        run: |
          set -euo pipefail
          case "$RPM_DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          candidate="code.podesta.ai/qos/tilo-development-rpms-aarch64@$RPM_DIGEST"
          docker buildx imagetools inspect "$candidate" >/dev/null
          export CANDIDATE="$candidate"
          mkdir -p "$RUNNER_TEMP/development-rpms-arm64"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schema': 1,
              'purpose': 'tilo-development-arm-rpm-candidate',
              'architecture': 'aarch64',
              'source_revision': os.environ['GITHUB_SHA'],
              'base_ref': os.environ['BASE_REF'],
              'reference': os.environ['CANDIDATE'],
              'package_count': int(os.environ['PACKAGE_COUNT']),
              'package_manifest_sha256': os.environ['PACKAGE_MANIFEST_SHA256'],
              'offline_closure_verified': True,
              'production_signed': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'development-rpms-arm64', 'receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print('RPMS_CANDIDATE=' + receipt['reference'])
          PY

      - name: Retain the public candidate receipt
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: development-rpms-aarch64-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/development-rpms-arm64/receipt.json
          if-no-files-found: warn
          retention-days: 14
