name: CI / browser capacity trial
on:
  workflow_dispatch:
concurrency:
  group: browser-capacity-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  WASM_BINDGEN_VERSION: "0.2.108"
jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - id: resolve
        run: python3 tools/ci/resolve_builder.py
  compare:
    needs: [builder]
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CDP_PORT: "9333"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/prepare-rust-build
      - name: Web toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
          command -v node || dnf install -y nodejs
      - name: Build exact production desktop bundle
        run: |
          cargo build --locked -p tilo-app-cli --bin tilo-app
          target/debug/tilo-app build --target web --bundle desktop apps/calculator
      - name: Headless Chromium for Testing
        run: |
          dnf install -y nss atk at-spi2-atk cups-libs libdrm libXcomposite libXdamage \
            libXrandr mesa-libgbm pango alsa-lib libxkbcommon || true
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Compare full sweeps two then three then two browsers
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/tilo-app/web/calculator/bundle
          (cd "$bundle" && python3 -m http.server 7878 --bind 127.0.0.1) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          python3 - <<'PYMEASURE'
          import json, os, pathlib, subprocess, threading, time
          root = pathlib.Path('/sys/fs/cgroup')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'capacity-trial'
          out.mkdir()
          apps = [app['id'] for app in json.loads(pathlib.Path('target/tilo-app/web/calculator/bundle/apps.json').read_text())['applications']] + ['desktop']
          def value(name):
              return (root / name).read_text().strip()
          def counters(name):
              return {key: int(number) for key, number in (line.split() for line in value(name).splitlines())}
          # Fail if the existing container's accounting cannot be read. Never reset its
          # counters or change its limits. Peak below is sampled memory.current, not the
          # cumulative memory.peak from the preceding build.
          limits = {'memory_max': value('memory.max'), 'cpu_max': value('cpu.max')}
          print('CAPACITY_LIMITS ' + json.dumps(limits), flush=True)
          for sweep, shards in enumerate((2, 3, 2), 1):
              shots = out / f'sweep-{sweep}-shots'
              shots.mkdir()
              before_cpu, before_events = counters('cpu.stat'), counters('memory.events')
              samples = [int(value('memory.current'))]
              stop = threading.Event()
              def sample():
                  while not stop.wait(.25):
                      samples.append(int(value('memory.current')))
              sampler = threading.Thread(target=sample)
              sampler.start()
              started = time.monotonic()
              environment = dict(os.environ, TILO_WEB_SMOKE_SHARDS=str(shards), SHOTS_DIR=str(shots))
              try:
                  with (out / f'sweep-{sweep}.log').open('w') as log:
                      result = subprocess.run(['node', 'crates/browser/tilo-web-desktop/scripts/smoke.mjs', 'http://127.0.0.1:7878', *apps], env=environment, stdout=log, stderr=subprocess.STDOUT)
              finally:
                  stop.set()
                  sampler.join()
              after_cpu, after_events = counters('cpu.stat'), counters('memory.events')
              receipt = {'sweep': sweep, 'shards': shards, 'apps': len(apps), 'elapsed_s': round(time.monotonic() - started, 3), 'exit': result.returncode, 'memory_current_sampled_max_bytes': max(samples), 'samples': len(samples), 'cpu_delta': {key: number - before_cpu.get(key, 0) for key, number in after_cpu.items()}, 'memory_events_delta': {key: number - before_events.get(key, 0) for key, number in after_events.items()}, 'limits': limits}
              (out / f'sweep-{sweep}.json').write_text(json.dumps(receipt, indent=2) + '\n')
              print('CAPACITY_RESULT ' + json.dumps(receipt), flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PYMEASURE
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: browser-capacity-trial
          path: ${{ runner.temp }}/capacity-trial
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true
