name: Release / canonical verifier bundles

# Platform maintenance only. Produces reviewable artifacts, never package uploads
# or trust-policy changes. Application pushes do not rebuild these tools.
on:
  workflow_dispatch:
    inputs:
      builder_image:
        description: 'Optional qualified immutable tilo-builder index; empty resolves the current index once.'
        required: false
        default: ''

concurrency:
  group: canonical-verifier-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve one compatible immutable builder
        id: resolve
        env:
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
        run: python3 -I tools/ci/python.py tools/ci/resolve_builder.py

  bundle:
    needs: builder
    name: canonical verifiers / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ${{ needs.builder.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      VERIFIER_ARCH: ${{ matrix.arch }}
      BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Build and bundle only canonical verifier tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "$VERIFIER_ARCH"
          cargo build --release --locked -p tilo-app-package-cli -p runtime-bundle
          target/release/tilo-app-package --help >/dev/null
          target/release/tilo-runtime-bundle --help >/dev/null
          mkdir -p target/verifier-bundle target/verifier-repeat
          for directory in target/verifier-bundle target/verifier-repeat; do
            python3 -I tools/ci/python.py tools/canonical_verifier_bundle.py produce \
              --pkg-binary target/release/tilo-app-package \
              --runtime-binary target/release/tilo-runtime-bundle \
              --builder-image "$BUILDER_IMAGE" --source-sha "$GITHUB_SHA" \
              --architecture "$VERIFIER_ARCH" --output "$directory/$VERIFIER_ARCH.tar.gz"
          done
          cmp "target/verifier-bundle/$VERIFIER_ARCH.tar.gz" "target/verifier-repeat/$VERIFIER_ARCH.tar.gz"
          cmp "target/verifier-bundle/$VERIFIER_ARCH.tar.descriptor.json" "target/verifier-repeat/$VERIFIER_ARCH.tar.descriptor.json"
      - name: Retain unpublished platform bundle and descriptor
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: canonical-verifiers-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/verifier-bundle/${{ matrix.arch }}.tar.gz
            target/verifier-bundle/${{ matrix.arch }}.tar.descriptor.json
