name: Release / internal install cycle

# USB-free installation VM round trip (design spec §9): a real retained
# Fedora on one OVMF disk stages the internal installer bundle with the real
# Imager helper, BootNext starts the staged installer, the installed Tilo boots
# once and reclaims the staging space, and a cold boot returns to Fedora with
# its firmware order, loaders and partitions intact. Negative scenarios cover
# an interrupted helper, `remove`, and a foreign BootNext.
#
# This manual run builds the live installer from a signed, published OS image
# exactly like release-imager.yml's medium lane. That lane runs the same
# os/dev/ci-internal-install-cycle.sh in its `internal-install-cycle` job on the
# medium it has just built and boot-tested.
#
# The retained OS is Fedora Cloud Base (x86_64, UEFI qcow2) pinned by URL and
# SHA-256, from the inputs or the repository variables
# TILO_INTERNAL_CYCLE_FEDORA_URL / TILO_INTERNAL_CYCLE_FEDORA_SHA256. Nothing
# else is downloaded unpinned; a missing pin fails the job.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "round-trip, interrupt-resume, remove, boot-next-busy, or all"
        type: choice
        options: [all, round-trip, interrupt-resume, remove, boot-next-busy]
        default: all
      fedora_image_url:
        description: "Fedora Cloud Base x86_64 UEFI qcow2 URL; empty uses vars.TILO_INTERNAL_CYCLE_FEDORA_URL."
        type: string
        default: ""
      fedora_image_sha256:
        description: "SHA-256 of that image; empty uses vars.TILO_INTERNAL_CYCLE_FEDORA_SHA256."
        type: string
        default: ""
      published_os_image:
        description: "Signed Tilo manifest-list digest; empty uses vars.TILO_INSTALLER_OS_IMAGE."
        type: string
        default: ""

concurrency:
  group: internal-install-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle:
    timeout-minutes: 480
    # Native x86_64 host with /dev/kvm, DRI and Podman, like the medium lane.
    runs-on: imager-linux-x86_64
    env:
      FEDORA_URL: ${{ github.event.inputs.fedora_image_url || vars.TILO_INTERNAL_CYCLE_FEDORA_URL }}
      FEDORA_SHA256: ${{ github.event.inputs.fedora_image_sha256 || vars.TILO_INTERNAL_CYCLE_FEDORA_SHA256 }}
      SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
      TILO_PUBLISHED_OS_IMAGE: ${{ github.event.inputs.published_os_image || vars.TILO_INSTALLER_OS_IMAGE }}
      TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY: ${{ vars.TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY }}
      TILO_EXPECTED_OS_SOURCE_REVISION: ${{ github.sha }}
      REGISTRY_AUTH_FILE: /tmp/tilo-registry-auth-internal-cycle-${{ github.run_id }}-${{ github.run_attempt }}.json
      # The catalog accepts only imager-vMAJOR.MINOR.PATCH; the test bundle and
      # the test imager are bound to this run-local tag and never published.
      TILO_INTERNAL_CYCLE_RELEASE_TAG: imager-v0.0.${{ github.run_number }}
      TILO_INTERNAL_CYCLE_RUN_ID: dispatch-${{ github.run_id }}-${{ github.run_attempt }}
      TILO_INTERNAL_CYCLE_STORAGE_ROOT: /var/tmp/tilo-internal-cycle-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
      TILO_INTERNAL_BUNDLE_OWNER: ${{ vars.IMAGER_INTERNAL_BUNDLE_OWNER || 'qos' }}
      TILO_ACCEL: kvm
      TILO_DISTROBOX: ""
      TILO_MEM: "8192"
      TILO_INTERNAL_CYCLE_MAX_INSTALL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require a native x86_64 KVM host
        run: ./os/dev/assert-native-arch.sh x86_64
      - name: Install VM, export and build dependencies
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends \
              btrfs-progs capnproto curl dosfstools e2fsprogs fdisk imagemagick jq mtools \
              openssh-client ovmf qemu-system-gui qemu-system-x86 qemu-utils socat \
              tesseract-ocr util-linux zstd
          elif command -v dnf >/dev/null; then
            sudo -n dnf install -y btrfs-progs capnproto curl dosfstools e2fsprogs edk2-ovmf ImageMagick \
              jq mtools openssh-clients qemu-device-display-virtio-vga-gl qemu-img \
              qemu-system-x86-core qemu-ui-egl-headless qemu-ui-opengl socat tesseract util-linux zstd
          else
            printf 'unsupported runner OS for the internal install cycle\n' >&2
            exit 1
          fi
          command -v btrfs capnp curl jq mcopy mkfs.vfat qemu-img qemu-system-x86_64 scp sfdisk \
            socat ssh ssh-keygen tesseract zstd >/dev/null
          command -v magick >/dev/null || command -v convert >/dev/null
          qemu-system-x86_64 -display help | grep -Fq egl-headless
          qemu-system-x86_64 -device help | grep -Fq virtio-vga-gl
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          compgen -G '/dev/dri/renderD*' >/dev/null
      - name: Install the checksum-pinned image-signature verifier
        run: |
          set -euo pipefail
          ./os/dev/cache-github-assets.sh
          ./os/dev/install-cached-cosign.sh
      - name: Build the live installer from a published OS
        env:
          TILO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TILO_PUBLISHED_OS_IMAGE" || {
            echo '::error::set TILO_INSTALLER_OS_IMAGE to a signed, digest-pinned Tilo release'
            exit 1
          }
          test -n "$TILO_REGISTRY_TOKEN"
          umask 077
          printf '%s' "$TILO_REGISTRY_TOKEN" | podman login \
            --authfile "$REGISTRY_AUTH_FILE" code.sandbox.example \
            --username '${{ github.actor }}' --password-stdin
          trap 'rm -f -- "$REGISTRY_AUTH_FILE"' EXIT
          ./os/dev/use-published-image.sh "$TILO_PUBLISHED_OS_IMAGE" >/dev/null
          ./os/dev/build-custom-installer.sh
      # See os/dev/build-internal-cycle-imager.sh for how the test imager's
      # compiled-in catalog is made to name the exported bundle.
      - name: Run the VM round trip and its negative scenarios
        run: ./os/dev/ci-internal-install-cycle.sh os/output/installer/qcow2/disk.qcow2 dist/internal-cycle
      - name: Remove VM storage
        if: always()
        run: sudo -n rm -rf "$TILO_INTERNAL_CYCLE_STORAGE_ROOT"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: tilo-internal-install-cycle-x86_64
          path: dist/internal-cycle
          if-no-files-found: error
