name: Build & push qOS image

# Builds the bootc OS container image (multi-stage: compiles the Rust
# workspace in-image, see os/Containerfile) and pushes it to the
# code.podesta.ai registry so installed systems can `bootc upgrade` from
# code.podesta.ai/qos/qos:latest.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: runner
    steps:
      - name: Checkout (with submodules — the in-image build needs the sources)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # The automatic job token is scoped to qos/qos only; the sibling
          # submodule repos (qos/shell, qos/ui, qos/fs, qos/apps) need a token
          # with org-wide read, so reuse the REGISTRY_TOKEN PAT for checkout.
          token: ${{ secrets.REGISTRY_TOKEN }}

      # Only log in when we actually push (not on PRs — keep creds out of
      # untrusted PR contexts; PRs build-only to catch Containerfile breakage).
      - name: Log in to the code.podesta.ai registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: code.podesta.ai/qos/qos
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      # Build the multi-stage bootc image. Context is the repo root so the
      # builder stage can COPY the whole workspace (incl. submodules); the
      # Containerfile lives in os/. push:false on PRs discards the image.
      - name: Build (and push if not a PR) the qOS image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: os/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
