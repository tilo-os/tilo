name: Build qOS image (publish on tags + dispatch)

# Builds the bootc OS container image (multi-stage, see os/Containerfile).
# CADENCE: relevant image-input changes and a weekly backstop BUILD ONLY
# (verify it builds + is reproducible — no registry churn or queue flooding).
# Cargo changes are already compiled by check.yml and nightly.yml; rebuilding
# the complete bootc image for every source-only commit duplicates that work.
# The signed image is
# pushed to code.sandbox.example/qos/qos:latest ONLY on a version tag (v*) or a
# manual run, so `bootc upgrade` tracks deliberate releases, not every commit.

on:
  schedule:
    # Keep the heavyweight image build away from Sunday's static-quality run.
    - cron: "0 5 * * 6"
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "os/**"
      - "keys/**"
      - "docs/recovery.md"
      - "docs/security/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".forgejo/workflows/build-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "os/**"
      - "keys/**"
      - "docs/recovery.md"
      - "docs/security/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".forgejo/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      with_browser:
        description: "Include the browser + WPE WebKit engine stage (0 = omit, ~45min faster)"
        required: false
        default: "1"

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: runner
    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Private repo checkout: reuse the REGISTRY_TOKEN PAT.
          token: ${{ secrets.REGISTRY_TOKEN }}

      # Cheap fail-fast before the expensive podman build: no crate silently
      # dropped from the workspace (that once orphaned 37 apps).
      - name: Workspace membership guard
        run: ./scripts/check-workspace-complete.sh

      # Log in on EVERY build: the build installs from the private, digest-pinned
      # frozen RPM repo (RPMS_REF), pulled as a stage — so even build-only runs
      # (main pushes / PRs) need registry read. Pushing the image still only
      # happens on tags/dispatch (below).
      - name: Log in to the code.sandbox.example registry
        uses: docker/login-action@v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Pin the base image the build starts FROM. It is a mirror in our own
      # registry rather than quay.io because upstream deletes the manifest a
      # digest points at within about a day — see os/base-snapshot.env.
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      # Pin the frozen RPM repo the build installs from (cross-time reproducible).
      # Only the RPMS_REF= line — $GITHUB_ENV has no comment syntax, so the file's
      # leading `#` lines would corrupt the env (RPMS_REF ended up empty).
      - name: Load RPMS_REF (frozen package snapshot)
        run: grep '^RPMS_REF=' os/rpms-snapshot.env >> "$GITHUB_ENV"

      # Pin the qos-kernel image the build swaps into kernel-core.  Same
      # digest-pinning + strip-comments-strategy as RPMS_REF.
      - name: Load KERNEL_RPMS_REF (qos-kernel image)
        run: grep '^KERNEL_RPMS_REF=' os/kernel-snapshot.env >> "$GITHUB_ENV"

      # Deterministic timestamp for reproducible builds: the HEAD commit time.
      # buildkit rewrites layer/image timestamps to SOURCE_DATE_EPOCH, and the
      # builder stage honours it for the compile.
      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The generation number sealed into the UKI's command line, which bounded
      # rollback binds every unseal to. It has to advance by exactly one per
      # published image: the retention window is arithmetic on it, and the floor is
      # a TPM NV counter that costs one write per step (qos-rollback refuses an
      # advance of more than 64). So it is read from the published series — every
      # published image carries a `gen<N>` tag, and the next number is max + 1 —
      # rather than from a timestamp, a commit count, or a counter file that can
      # drift from what was actually published.
      #
      # This runs on build-only runs too, even though they publish nothing: the
      # resolution is then exercised on every push instead of only at release time,
      # which is when a broken series would otherwise be discovered.
      - name: Resolve the image generation from the published series
        env:
          # Explicit credentials rather than the auth file `docker login` left
          # behind: the runner writes a credsStore entry the file itself does not
          # carry, so a lookup finds a file with no credential in it and the read
          # fails as "authentication required".
          QOS_REGISTRY_CREDS: ${{ github.actor }}:${{ secrets.REGISTRY_TOKEN }}
        run: |
          gen="$(./os/dev/next-generation.sh)"
          echo "QOS_GENERATION=$gen" >> "$GITHUB_ENV"
          echo "::notice::building generation $gen"

      # Set up buildx with the docker-container driver — the default `docker`
      # driver doesn't support cache export (the registry-backed cache we
      # need to survive across ephemeral runners).
      - name: Set up buildx (docker-container driver for cache export)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: code.sandbox.example/qos/qos
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            # workflow_dispatch off a non-main branch — without this, the metadata
            # step emits zero tags and the push fails "tag is needed". Derives a
            # "<branch>-<sha>" tag so a manual dispatch from a feature branch still
            # produces a discoverable image without polluting the `latest` channel.
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            # The generation tag is what makes the series self-recording: the next
            # build reads these back to learn which numbers are taken. It is only
            # ever pushed on a run that publishes, so a number is consumed exactly
            # when an image carrying it becomes reachable.
            type=raw,value=gen${{ env.QOS_GENERATION }}

      # Build the multi-stage bootc image. Publishing deliberately happens only
      # after the sealed image has been installed and booted below. On a release
      # run buildx writes an OCI archive for that gate; ordinary build-only runs
      # exercise the complete build and registry cache without retaining output.
      - name: Build the qOS image
        id: build
        uses: docker/build-push-action@v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/Containerfile
          push: false
          outputs: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'type=oci,dest=/var/tmp/qos-image.tar' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # QOS_WITH_BROWSER: a manual run can omit the browser + its WPE WebKit
          # engine stage, which is ~45 of the ~60 minutes a cold build takes.
          # Everything the boot chain needs is still built, so boot verification
          # doesn't have to wait on the engine. Pushes and PRs carry no inputs,
          # so the `||` keeps them on the full image — this must never resolve
          # to empty, `FROM wpe-builder-` is not a stage.
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
            KERNEL_RPMS_REF=${{ env.KERNEL_RPMS_REF }}
            QOS_WITH_BROWSER=${{ github.event.inputs.with_browser || '1' }}
            QOS_GENERATION=${{ env.QOS_GENERATION }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://forgejo-sccache-minio.forgejo.svc.cluster.local:9000
            SCCACHE_REGION=auto
            SCCACHE_S3_KEY_PREFIX=quickdesktop/image/v1
            SCCACHE_S3_USE_SSL=false
          # The runner injects these two environment variables from a
          # least-privilege Kubernetes Secret. BuildKit exposes them only to
          # the Rust compile RUN; they never enter an image layer or build arg.
          secret-envs: |
            aws_access_key_id=AWS_ACCESS_KEY_ID
            aws_secret_access_key=AWS_SECRET_ACCESS_KEY
          # buildkit clamps layer timestamps to SOURCE_DATE_EPOCH for
          # reproducible image digests.
          provenance: false
          # Registry-backed layer cache — each run gets a fresh
          # forgejo-runner container, so buildkit's local storage is
          # always empty. Without this, every failed rebuild redoes
          # all 65 stage-3 sub-steps + the rust compile from scratch
          # (~8 min). With it, only the layers past the fix rerun
          # (~1-2 min).  mode=max exports intermediate layer caches
          # too, not just the final image.
          cache-from: type=registry,ref=code.sandbox.example/qos/qos-buildcache:latest
          cache-to: type=registry,ref=code.sandbox.example/qos/qos-buildcache:latest,mode=max

      - name: Reseal, install, boot, and publish the verified image
        id: release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 60
        env:
          QOS_IMAGE: localhost/qos:release-candidate
          QOS_RUN: /var/tmp/qos-projection-vm
          QOS_OUTPUT: /var/tmp/qos-projection-image
          QOS_USER: tester
          QOS_PASS: quickdesktop
          QOS_SKIP_BUILD: "1"
          # TCG is substantially slower than KVM, so give the greeter up to 20
          # minutes on Kata runners. Developer hosts with /dev/kvm still use KVM.
          QOS_BOOT_WAIT_ATTEMPTS: "600"
          # CI has the tools directly in its job container; the developer
          # default enters a named distrobox that does not exist on runners.
          QOS_DISTROBOX: ""
          QOS_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          sudo -n true || {
            echo "::error::disk installation requires the runner's passwordless, Kata-confined sudo"
            exit 1
          }

          # This is the only workflow that needs disk/firmware tooling. Keep it
          # out of the general runner image and install it only for deliberate
          # release validation; --no-install-recommends bounds download and
          # unpack cost. The image build itself is not repeated.
          export DEBIAN_FRONTEND=noninteractive
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends \
            btrfs-progs dosfstools fuse-overlayfs openssh-client ovmf podman \
            qemu-system-x86 qemu-utils slirp4netns socat sshpass sudo systemd \
            uidmap util-linux
          command -v podman qemu-img qemu-system-x86_64 sshpass socat systemd-repart >/dev/null

          printf '%s' "$QOS_REGISTRY_TOKEN" | podman login code.sandbox.example \
            --username "${{ github.actor }}" --password-stdin
          podman load --input /var/tmp/qos-image.tar
          first_tag="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed -n '1p')"
          test -n "$first_tag"
          podman tag "$first_tag" "$QOS_IMAGE"
          # Keep the installed machine on the public release channel, not on
          # the temporary localhost tag used only for resealing.
          export QOS_TARGET_IMGREF="$first_tag"

          # bootc currently requires a stable two-pass composefs UKI seal. The
          # end-to-end helper performs that convergence and then creates qcow2;
          # calling disk-image.sh directly would only exercise the rejected
          # first pass and could never prove the published image bootable.
          mkdir -p "$QOS_OUTPUT" "$QOS_RUN"
          ./os/dev/build-image.sh
          export QOS_DISK="$QOS_OUTPUT/qcow2/disk.qcow2"
          trap './os/dev/vm.sh stop || true' EXIT
          ./os/dev/vm.sh boot --2d
          ./os/dev/vm.sh wait
          ./os/dev/vm.sh login "$QOS_USER" "$QOS_PASS"
          for attempt in $(seq 1 60); do
            if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              ./os/dev/vm.sh serial | tail -120
              exit 1
            fi
            sleep 2
          done
          ./os/dev/vm.sh ssh /usr/libexec/qos/projection-boot-check.sh

          # Only the exact image that passed installation and boot receives a
          # public tag. Every tag points at the same manifest digest.
          digest_file="$(mktemp /var/tmp/qos-push-digest.XXXXXX)"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            podman tag "$QOS_IMAGE" "$tag"
            podman push --digestfile "$digest_file" "$tag"
          done <<'TAGS'
          ${{ steps.meta.outputs.tags }}
          TAGS
          digest="$(tr -d '[:space:]' < "$digest_file")"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::published boot-verified image $digest"

      # Sign the pushed image with cosign (security plan §9). The signature
      # lets installed systems verify provenance before `bootc upgrade` applies
      # an image (see os/etc/containers/policy.json + the update path). Signs by
      # digest so the signature is bound to the exact image, not a mutable tag.
      # Skipped on PRs (the image isn't pushed; nothing to sign).
      - name: Install cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Own-key signing → no public sigstore/Rekor upload (offline-friendly,
          # doesn't leak digests to the public log). The signature is stored as a
          # cosign attachment in the registry; the image's policy.json verifies it
          # against cosign.pub with --insecure-ignore-tlog semantics. A *self-hosted*
          # transparency log (security plan §9) is a separate follow-up.
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            "code.sandbox.example/qos/qos@${{ steps.release.outputs.digest }}"

      # SBOM (security plan §9): generate an SPDX inventory of the image and
      # attach it as a SIGNED in-toto attestation, so consumers can audit exactly
      # what shipped + verify it came from us.
      - name: Generate SBOM (syft → SPDX)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: anchore/sbom-action@v0
        with:
          image: code.sandbox.example/qos/qos@${{ steps.release.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # Skip the workflow-artifact upload: forgejo's action runner doesn't
          # implement the GitHub Actions Artifact API v2 that upload-artifact@v4
          # (which sbom-action calls internally) requires. The SBOM only needs
          # to reach the next step's cosign attest — no artifact upload needed.
          upload-artifact: false
          # Same for release assets — we don't cut GitHub releases on forgejo.
          upload-release-assets: false

      - name: Attest the SBOM to the image (signed)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest --yes --tlog-upload=false \
            --predicate sbom.spdx.json --type spdxjson \
            --key env://COSIGN_PRIVATE_KEY \
            "code.sandbox.example/qos/qos@${{ steps.release.outputs.digest }}"
