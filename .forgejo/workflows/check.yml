name: CI / affected packages

# Main is allowed to be unstable, so a commit is never gated before it lands;
# this workflow measures pushes after the fact, one window of commits at a time.
# Each push plans from the head of the newest earlier push run on main whose
# window really ran, so a window covers every commit whose own run was dropped,
# and a newer push makes an older waiting run skip instead of leaving fifteen
# runs queued behind one another (see the `supersede` job).
# `stable` is moved by hand when a release is cut; nothing here writes it.
#
# Affected reverse dependencies are checked on native x86; changed packages,
# their direct dependants (up to one shard's cost, REVERSE_TEST_COST_BUDGET) and
# contract suites are tested there too. Full native coverage, both
# architectures and the aarch64 artifact builds remain mandatory in
# ci-nightly.yml; this workflow is the short feedback path.
# Manual dispatch validates the complete workspace on both native architectures.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      builder_image:
        description: 'Optional immutable tested builder index (registry.tilo.so/tilo/tilo-builder@sha256:...)'
        required: false
        type: string

concurrency:
  # One run per pushed commit. The forge does not cancel one push's run for a
  # later one: a shard may already be testing, and a run's window of commits is
  # planned as a whole. Superseding is the `supersede` job's business below,
  # which only drops runs that never reached a runner and only after the plan
  # base has moved below their commits.
  group: check-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  # Match the test profile below. Cargo keeps dev/test artifacts in the same
  # target tree, but a different debuginfo setting gives them different
  # fingerprints and recompiles the dependency graph for the all-target pass.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  # Cache availability changes speed, never correctness or mergeability.
  # Deny warnings through per-target flags. Cargo joins these with the
  # target rustflags in .cargo/config.toml (x86-64-v3, frame pointers,
  # hardening); RUSTFLAGS would replace them, giving these builds different
  # codegen, and different pixels, from nightly and local builds.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
  WGPU_BACKEND: vulkan
  # Every runner may expose a different physical adapter. Goldens are rendered
  # with Mesa's CPU Vulkan driver, so make all headless GPU tests use that same
  # adapter and fail instead of silently selecting runner hardware.
  WGPU_ADAPTER_NAME: llvmpipe

jobs:
  # The window decision, before anything expensive starts. Main takes a push
  # every couple of minutes and a full run needs five large runner slots for
  # about an hour, so without this the queue grows and never drains: about
  # fifteen runs used to wait behind one another and the newest head never got a
  # slot. tools/ci/push_window.py asks the Forgejo API about this workflow's push
  # runs on main:
  #   * is a newer run still going to run? Then those commits are its business
  #     and this run skips every job -- a clean success, not a failure, because
  #     nothing here was tested and nothing was lost.
  #   * is an older run still waiting to start? Then it is cancelled: this run's
  #     plan starts below it, so its commits are measured here.
  #   * is an older run executing? Then this run waits for it, so main runs one
  #     window at a time, with a deadline past which it starts beside it -- two
  #     windows at once is the most this can cost.
  # `base` is where this run's plan starts. A dispatch is nobody's duplicate and
  # keeps its full-workspace plan.
  supersede:
    # The native class, not the quality one: this job can wait 45 minutes for an
    # executing window, and the quality label serves a single runner that the
    # sweeps and the lint gate need while it waits. The job itself is a checkout
    # and an API conversation.
    runs-on: runner
    # The bounded wait for an executing window, plus the API calls around it.
    timeout-minutes: 50
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    outputs:
      superseded: ${{ steps.window.outputs.superseded }}
      base: ${{ steps.window.outputs.base }}
    steps:
      - name: Check out the window decision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Decide this run's window of commits
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          # Cancelling a run writes to this repository, and the run's own token
          # may not carry that; a refusal falls back to the repository token.
          CI_SPARE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          POLL_SECONDS: '30'
          # 45 minutes: long enough for most windows to finish before this one
          # starts, short enough that a stuck run costs one window of latency.
          WAIT_SECONDS: '2700'
        run: python3 tools/ci/push_window.py

  builder:
    needs: [supersede]
    # A superseded run keeps every job skipped; only the decision job above ran.
    if: needs.supersede.outputs.superseded != 'true'
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:585b2dacdaa651cb37ea66a57ec8203301d3724726f1b8c700ee55d2438ef728
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout public-trust context fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the CI builder before starting job containers
        id: resolve
        env:
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
        run: python3 tools/ci/resolve_builder.py
      - name: Verify named public-trust contexts with Docker BuildKit
        env:
          DOCKER_BUILDKIT: "1"
        run: bash os/tests/named_public_trust_context.sh docker

  select:
    # Selection uses its pinned tools image and needs no builder result.
    # Leave admission to the scheduler instead of serializing independent jobs.
    needs: [supersede]
    if: needs.supersede.outputs.superseded != 'true'
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      clippy_matrix: ${{ steps.plan.outputs.clippy_matrix }}
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      check_required: ${{ steps.plan.outputs.check_required }}
      base: ${{ steps.plan.outputs.base }}
      main: ${{ steps.merge.outputs.main }}
      full: ${{ steps.plan.outputs.full }}
      rust_required: ${{ steps.plan.outputs.rust_required }}
      security_required: ${{ steps.plan.outputs.security_required }}
      suites_required: ${{ steps.plan.outputs.suites_required }}
      suites: ${{ steps.plan.outputs.suites }}
      vendored_required: ${{ steps.plan.outputs.vendored_required }}
      vendored_crates: ${{ steps.plan.outputs.vendored_crates }}
      pins_required: ${{ steps.plan.outputs.pins_required }}
      pins: ${{ steps.plan.outputs.pins }}
      android_required: ${{ steps.plan.outputs.android_required }}
      android_packages: ${{ steps.plan.outputs.android_packages }}
      wasm_required: ${{ steps.plan.outputs.wasm_required }}
      wasm_packages: ${{ steps.plan.outputs.wasm_packages }}
      web_examples: ${{ steps.plan.outputs.web_examples }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      workspace_count: ${{ steps.plan.outputs.workspace_count }}
      estimated_cost: ${{ steps.plan.outputs.estimated_cost }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Checkout head for change selection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch main and tags
        shell: bash
        run: |
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/*:refs/tags/* || true

      # A dispatch may run on any ref, so it merges that ref onto main first.
      # A push to main already is main's tip and needs no merge.
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main

      - name: Workspace membership guard
        run: ./scripts/check-workspace-complete.sh

      - name: Repository layout guard
        run: python3 tools/policy/check_repository_layout.py

      # From the merged tree, so the plan follows its rules and not those of a
      # pull request's own, possibly older, workflow file.
      - name: Select and balance affected packages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_BASE: ${{ needs.supersede.outputs.base }}
          PULL_REQUEST_BASE: ${{ steps.merge.outputs.main }}
          PUSH_BEFORE: ${{ github.event.before }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: bash tools/ci/select.sh

  # Shell, image-configuration, and workflow policy cannot be selected through
  # Cargo's dependency graph. Run these checks beside selection so they do not
  # delay selection. Native pull-request work waits for this boundary to pass;
  # pushes retain every selected native result even when this boundary fails.
  # Pull requests containing only audited prose or self-tested quality helpers
  # may omit this independent suite.
  # The boundary invariants run five fixture binaries built from the merged
  # tree. Build
  # them where the compiler and cache are warm: the checks themselves are
  # mostly text, but their first cold build on a 2-CPU lane spent a 30-minute
  # timeout inside one invariant and reported no result at all.
  security-fixtures:
    if: needs.select.outputs.security_required == 'true'
    needs: [builder, select]
    # The native class, not the large one: the shell shard holds a large
    # runner for up to two hours, and the boundary fixtures queued behind it
    # for longer than a whole run, which starved the boundary and the
    # aggregate behind it. Six crates compile here through the shared cache,
    # two jobs at a time so the linker stays inside the native limit.
    runs-on: runner
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout security fixture sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the security fixture binaries
        run: |
          cargo build --locked -p tilo-image-policy-check -p tilo-crypto \
            -p tilo-esp-write -p tilo-board-successor
          cargo build --locked -p tilo-install-helpers --bin tilo-staging-handoff

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: security-fixtures
          path: |
            target/debug/tilo-image-policy-check
            target/debug/tilo-crypto
            target/debug/tilo-esp-write
            target/debug/tilo-board-successor
            target/debug/tilo-staging-handoff
          if-no-files-found: error
          retention-days: 1

  # Stands beside the compile matrix, not in front of it (see the note above
  # `test`); `checks` requires its success, so it is still a gate on the run.
  security:
    if: needs.select.outputs.security_required == 'true'
    needs: [select, security-fixtures]
    runs-on: runner-quality
    timeout-minutes: 60
    env:
      # The complete suite passes in the quality lane's 2 CPU / 5 GiB job limit
      # once its fixtures are built (security-fixtures); t declares the same
      # check as a 1-core, minutes-long job.
      CARGO_BUILD_JOBS: '2'
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    steps:
      - name: Checkout security boundary inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: security-fixtures
          path: target/debug

      - name: Use the fixture binaries the builder produced
        run: |
          for binary in tilo-image-policy-check tilo-crypto tilo-esp-write \
                        tilo-board-successor tilo-staging-handoff; do
            chmod 0755 "target/debug/$binary"
          done
          printf 'TILO_IMAGE_POLICY_CHECK_BIN=%s/target/debug/tilo-image-policy-check\n' "$PWD" >> "$GITHUB_ENV"
          printf 'TILO_CRYPTO_BIN=%s/target/debug/tilo-crypto\n' "$PWD" >> "$GITHUB_ENV"
          printf 'TILO_ESP_WRITE_BIN=%s/target/debug/tilo-esp-write\n' "$PWD" >> "$GITHUB_ENV"
          printf 'TILO_BOARD_SUCCESSOR_BIN=%s/target/debug/tilo-board-successor\n' "$PWD" >> "$GITHUB_ENV"
          printf 'TILO_STAGING_HANDOFF_BIN=%s/target/debug/tilo-staging-handoff\n' "$PWD" >> "$GITHUB_ENV"

      # ci-fast carries the native fixture tools (os/Containerfile.ci-fast);
      # check them explicitly so EFI/RPM tests cannot skip.
      - name: Ensure invariant test tooling
        run: |
          for tool in cargo cc modinfo clang ld.lld rpmbuild rpmkeys jq systemd-escape fc-match; do
            command -v "$tool" >/dev/null || { echo "missing invariant tool: $tool" >&2; exit 1; }
          done
          python3 -c 'import PIL'
          fc-match -f '%{family}' 'Noto Sans' | grep -Fq 'Noto Sans'
          test -n "$(find /etc/pki/rpm-gpg -maxdepth 1 -name 'RPM-GPG-KEY-fedora-*-primary' -print -quit)"

      - name: Security boundary invariants
        run: bash tools/run-security-boundary-invariants.sh

  # Hermetic test suites outside Cargo (tools/ci/suites.toml), selected by the
  # paths they read. They need no builder image and run beside the Rust jobs.
  suites:
    # Keep admission tied to the completed selector, even when unrelated
    # native jobs are intentionally skipped for non-compiling inputs.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.suites_required == 'true' }}
    needs: [select]
    runs-on: runner-quality
    timeout-minutes: 20
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare fonts for offline suites
        uses: ./.forgejo/actions/prepare-font-assets

      - name: Prepare pinned NTFS source for offline suites
        run: |
          python3 crates/session/tilo-ntfs-helper/source_artifact.py
          printf 'TILO_NTFS_SOURCE_CACHE=%s/target/ntfs-source\nTILO_NTFS_SOURCE_OFFLINE=1\n' "$PWD" >> "$GITHUB_ENV"

      # The live transport suites import the MoQ library, generated from the
      # @moq/net pinned in scripts/moq-browser/package-lock.json as the
      # browser runtime build does; it is never committed. ci-fast ships node
      # without npm. A stalled registry fetch can fail npm ci after minutes of
      # silence, so print its errors and retry a failed install from a clean
      # tree.
      - name: Prepare pinned MoQ library for offline suites
        if: contains(needs.select.outputs.suites, 'live-fake-relay.test.mjs') || contains(needs.select.outputs.suites, 'live-transport.test.mjs')
        run: |
          dnf install -y --setopt=install_weak_deps=False npm
          for attempt in 1 2 3; do
            if npm ci --prefix scripts/moq-browser --no-audit --no-fund --loglevel=error --fetch-timeout=60000; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci for scripts/moq-browser failed after $attempt attempts" >&2
              exit 1
            fi
            echo "::notice::npm ci for scripts/moq-browser failed; retrying ($attempt/3)"
            rm -rf scripts/moq-browser/node_modules
            sleep $((attempt * 5))
          done
          node scripts/moq-browser/build.mjs

      - name: Run selected suites
        id: suites-run
        env:
          SUITES: ${{ needs.select.outputs.suites }}
        run: |
          # Declared paths contain no whitespace; split the list into arguments.
          # shellcheck disable=SC2086
          bash tools/ci/measure.sh "path-selected suites" -- \
            python3 tools/ci/suites.py run --jobs 2 $SUITES

  # The compile jobs below do not wait for the security boundary. It used to
  # gate them so a red boundary would not spend native slots, but the boundary
  # suite runs the whole repository's invariant scripts and one slow or hung
  # invariant then leaves test/check/clippy permanently blocked ("incomplete
  # matrix"), which hides every product result in the run. The boundary is
  # still required: the `checks` aggregate fails the run when it fails or is
  # skipped unexpectedly.
  # Tests and the Clippy gate run as parallel jobs rather than one after
  # another on one runner. Test jobs are sharded by recorded test time, Clippy
  # by structural cost (tools/ci/affected_packages.py). Clippy type-checks
  # every target it lints, so on x86_64 it is also the shard's all-target
  # check; architectures that are not linted run a standalone check job
  # instead. The jobs share compiler outputs through sccache; each keeps its
  # own target tree. The `checks` aggregate below requires all of them.
  test:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.rust_required == 'true' }}
    needs: [builder, select]
    # Linking a shard's test binaries is the memory peak of the whole check:
    # the kernel killed a whole-workspace shard's build on both architectures
    # at the native class's 16 GiB job limit (exit 137, ~100 packages each).
    # The planner therefore names the class in `matrix.runner`:
    # tools/ci/affected_packages.py asks for runner-large / runner-large-arm64
    # when a shard's own links exceed the native class (a whole-workspace
    # shard, or one carrying the tree's largest test link).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      cleanup-shared-libraries: ${{ steps.cleanup.outputs.shared-libraries }}
    env:
      # Compiling and linking a shard's tests is the memory peak of the check.
      # The native x86 class's 16 GiB job limit took a 22-package shard at
      # eight concurrent links (killed 678 s in, exit 137: apps/agent,
      # tilo-relay and tilo-room-host together), so the native class keeps
      # four; the large class (36 GiB) keeps eight. The native ARM slot has
      # memory for one of the largest test links but not four, and the large
      # ARM slot four: ci-nightly builds the whole arm workspace that way.
      CARGO_BUILD_JOBS: >-
        ${{ (contains(matrix.runner, 'large') && (matrix.arch == 'aarch64' && '4' || '8'))
            || (matrix.arch == 'aarch64' && '1' || '4') }}
    strategy:
      fail-fast: false
      max-parallel: 8
      # Forgejo removes an empty matrix job entirely, leaving its aggregate
      # blocked. Keep one inert row when Rust is inapplicable; the job-level
      # condition skips it without consuming a runner.
      matrix: ${{ fromJSON(needs.select.outputs.rust_required == 'true' && needs.select.outputs.matrix || '{"include":[{"runner":"runner"}]}') }}
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      # From the merged tree: its package names are the ones nextest sees.
      - name: Read the shared test filters
        run: python3 tools/ci/nextest_filters.py >> "$GITHUB_ENV"

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Check native architecture
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      # Everything the shard needs beyond the builder image (audio, the X11
      # bridge, PDFium, Chromium, the imager filesystem, the installer
      # fixture), prepared by the merged tree's script rather than by steps of
      # this file: a pull request runs its own head's copy of this workflow,
      # so a requirement added here as a step would never reach one branched
      # before it, while main's tests would already demand it.
      - name: Prepare the shard's test environment
        env:
          TEST_PACKAGES: ${{ matrix.test_packages }}
          SCOPED_TESTS: ${{ matrix.scoped_tests }}
        run: bash tools/ci/prepare-test-shard.sh

      # `--tests` builds the targets whose tests run: libraries, binaries and
      # integration tests. Examples are type-checked by Clippy and built by
      # nightly; linking them here tested nothing.
      #
      # nextest's ci profile sets up the suite's runtime environment where the
      # tests run (.config/nextest.toml: lavapipe, headless audio, the NTFS
      # fixtures for a run with their consumer), and every test binary runs in
      # a fresh HOME/XDG tree with LANG=C.UTF-8 and TZ=UTC
      # (tools/cargo-runner.sh), as with nightly and runs outside CI. This shard
      # provides llvmpipe and an audio endpoint, so a test that finds either
      # missing fails instead of skipping.
      - name: Test shard ${{ matrix.shard }}
        if: matrix.test_packages != ''
        env:
          # The builder image carries the encoders and muxers the footage
          # tests need, so their absence here is a failure, not a skip.
          TILO_REQUIRE_MEDIA: "1"
          TILO_REQUIRE_AUDIO: "1"
          TILO_REQUIRE_GPU: "1"
        run: >-
          bash tools/ci/measure.sh "test shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "cargo nextest (affected shard ${{ matrix.shard }})" --
          bash tools/ci/nextest.sh cargo nextest run --locked --profile ci --tests ${{ matrix.test_packages }}
          -E "not ($GOLDEN_FILTER)${{ github.event_name == 'pull_request' && ' and not ($PUSH_ONLY_FILTER)' || '' }}"

      # Each nextest phase writes the same ci-profile JUnit path. Preserve
      # its report before a later phase starts, including on test failure.
      - name: Report affected tests of shard ${{ matrix.shard }}
        if: always() && matrix.test_packages != ''
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/affected.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "affected shard ${{ matrix.shard }} (${{ matrix.arch }})" target/ci/junit/affected.xml

      # The shard's visual goldens, run after its suite has drained so the
      # software renderer is idle, as nightly does. They compare only on the
      # image they were rendered on; once the builder has moved on they wait
      # for a refresh (nightly fails until then) instead of failing every pull
      # request that touches a rendering package.
      - name: Visual goldens of shard ${{ matrix.shard }}
        if: matrix.test_packages != ''
        env:
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
          TILO_REQUIRE_GPU: "1"
        run: |
          # The packages with goldens (.config/nextest-filters.toml).
          case " ${{ matrix.test_packages }} " in
            *" -p shell "*|*" -p tilo-ui "*|*" -p ebook "*) ;;
            *) exit 0 ;;
          esac
          if ! bash tools/ci/golden-image.sh check "$BUILDER_IMAGE" 2>goldens-image.txt; then
            echo "::warning::$(tr '\n' ' ' < goldens-image.txt)"
            exit 0
          fi
          bash tools/ci/measure.sh "visual goldens shard ${{ matrix.shard }}" -- \
            bash scripts/ci-run.sh "cargo nextest visual goldens (shard ${{ matrix.shard }})" -- \
            cargo nextest run --locked --profile ci --tests \
            ${{ matrix.test_packages }} --no-tests=pass -E "$GOLDEN_FILTER"

      - name: Report visual goldens of shard ${{ matrix.shard }}
        if: always() && matrix.test_packages != ''
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/visual-goldens.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "visual goldens shard ${{ matrix.shard }} (${{ matrix.arch }})" target/ci/junit/visual-goldens.xml

      # The shard's test executables are done with; Certify links the apps'
      # own binaries from the same rlibs, and a wide shard does not fit both
      # in a runner's store. Shared libraries can also have executable mode:
      # keep procedural macros and native dylibs for the later Cargo steps.
      - name: Free the test executables of shard ${{ matrix.shard }}
        id: cleanup
        if: matrix.test_packages != ''
        run: |
          libraries=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x \( -name '*.so' -o -name '*.so.*' \) -printf '.' | wc -c)
          printf 'shared-libraries=%s\n' "$libraries" >> "$GITHUB_OUTPUT"
          find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.so' ! -name '*.so.*' -delete

      # The shard's affected graphical apps through the same production-root
      # native audit the nightly runs for every app, so a change that breaks
      # an app's Tilo-native contract fails here, not overnight.
      - name: Certify affected apps of shard ${{ matrix.shard }}
        if: matrix.test_packages != '' && matrix.certify == true
        env:
          TILO_REQUIRE_GPU: "1"
        run: >-
          bash tools/ci/measure.sh "certify affected apps shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "tilo-app certify (affected shard ${{ matrix.shard }})" --
          cargo run --locked -p tilo-app-cli --bin tilo-app -- certify --workspace ${{ matrix.test_packages }}

      # The saved headless scenarios of each selected example, through the
      # example's own binary with the native audit: what `tilo-app check`
      # runs as its scenario stage.
      - name: Example scenarios of shard ${{ matrix.shard }}
        if: contains(matrix.test_packages, '-p example-') || contains(matrix.test_packages, '-p tilo-app-cli')
        env:
          TILO_REQUIRE_GPU: "1"
        run: >-
          bash tools/ci/measure.sh "example scenarios shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "tilo-app scenario run (examples, shard ${{ matrix.shard }})" --
          bash tools/test-env.sh bash tools/ci/example-scenarios.sh ${{ matrix.test_packages }}

      # A package reached only through outside inputs its manifest entry
      # scopes (tools/ci/suites.toml) runs just the tests that read them, with
      # the same environment; preserve their report alongside the shard's.
      - name: Scoped reader tests of shard ${{ matrix.shard }}
        if: matrix.scoped_tests != ''
        env:
          SCOPED_TESTS: ${{ matrix.scoped_tests }}
          TILO_REQUIRE_MEDIA: "1"
          TILO_REQUIRE_AUDIO: "1"
          TILO_REQUIRE_GPU: "1"
        run: >-
          bash tools/ci/measure.sh "scoped reader tests shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "cargo nextest (scoped reader tests, shard ${{ matrix.shard }})" --
          python3 tools/ci/run_scoped_tests.py

      - name: Report scoped reader tests of shard ${{ matrix.shard }}
        if: always() && matrix.scoped_tests != ''
        run: |
          mkdir -p target/ci/junit
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/ci/junit/scoped.xml
          fi
          python3 tools/ci/nextest_report.py \
            --label "scoped reader tests shard ${{ matrix.shard }} (${{ matrix.arch }})" target/ci/junit/scoped.xml

      - name: Save test results of shard ${{ matrix.shard }}
        if: always() && (matrix.test_packages != '' || matrix.scoped_tests != '')
        continue-on-error: true
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nextest-junit-${{ matrix.arch }}-${{ matrix.shard }}
          path: target/ci/junit
          retention-days: 14
          if-no-files-found: warn

  check:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.rust_required == 'true' && needs.select.outputs.check_required == 'true' }}
    needs: [builder, select]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: ${{ matrix.arch == 'aarch64' && '1' || '4' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.rust_required == 'true' && needs.select.outputs.check_required == 'true' && needs.select.outputs.check_matrix || '{"include":[{"runner":"runner"}]}') }}
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare build runtime
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          mkdir -p /tmp/tilo-xdg-runtime
          chmod 700 /tmp/tilo-xdg-runtime

      - name: Check all targets in shard ${{ matrix.shard }}
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
        run: >-
          bash tools/ci/measure.sh "check shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "cargo check (affected shard ${{ matrix.shard }})" --
          python3 tools/ci/compiler_inputs.py --output target/ci/compiler-inputs.json --
          check --locked --all-targets ${{ matrix.packages }}

      # Without its default `native` feature, tilo-ui is the portable toolkit
      # that another host embeds with its own services. Keep that build
      # compiling whenever the toolkit is affected.
      - name: Check the portable toolkit build
        if: contains(format('{0} ', matrix.packages), '-p tilo-ui ')
        run: >-
          bash tools/ci/measure.sh "check portable tilo-ui" --
          bash scripts/ci-run.sh "cargo check (tilo-ui without native)" --
          cargo check --locked -p tilo-ui --no-default-features --lib

      # `tilo-app` turns every OS affordance on by default; a headless tool
      # opts out with `default-features = false`. Keep that opt-out compiling.
      - name: Check the headless app framework build
        if: contains(format('{0} ', matrix.packages), '-p tilo-app ')
        run: >-
          bash tools/ci/measure.sh "check headless tilo-app" --
          bash scripts/ci-run.sh "cargo check (tilo-app without default features)" --
          cargo check --locked -p tilo-app --no-default-features --lib

      - name: Save observed compiler inputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: compiler-inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: target/ci/compiler-inputs.json
          retention-days: 7
          if-no-files-found: warn

  clippy:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.rust_required == 'true' }}
    needs: [builder, select]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '8'
    outputs:
      cargo-download-cache-hit: ${{ steps.rust-build.outputs.cargo-cache-hit }}
      cargo-download-cache-key: ${{ steps.rust-build.outputs.cargo-cache-key }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.rust_required == 'true' && needs.select.outputs.clippy_matrix || '{"include":[{"runner":"runner"}]}') }}
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare Rust build caches
        id: rust-build
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare build runtime
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          mkdir -p /tmp/tilo-xdg-runtime
          chmod 700 /tmp/tilo-xdg-runtime

      # Every workspace member satisfies the workspace lint table, so any
      # Clippy diagnostic in the selected packages (or the workspace members
      # they build on) fails this exact SHA. Compilation deliberately stays
      # here rather than in the pre-commit hook: local hooks are bypassable and
      # must remain fast enough to keep their formatting, secret, and
      # staged-diff checks useful. The release-app workflow separately
      # compiles the shipped thin-app feature; `--all-features` is
      # deliberately invalid here because some features link native SDKs
      # that exist only in the OS image builder.
      - name: Clippy shard ${{ matrix.shard }}
        if: matrix.arch == 'x86_64'
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
        run: >-
          bash tools/ci/measure.sh "clippy shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "Clippy (affected shard ${{ matrix.shard }})" --
          tools/ci/clippy-check.sh ${{ matrix.packages }}

      # Without its default `native` feature, tilo-ui is the portable toolkit
      # that another host embeds with its own services. Keep that build
      # compiling whenever the toolkit is affected.
      - name: Check the portable toolkit build
        if: contains(format('{0} ', matrix.packages), '-p tilo-ui ')
        run: >-
          bash tools/ci/measure.sh "check portable tilo-ui" --
          bash scripts/ci-run.sh "cargo check (tilo-ui without native)" --
          cargo check --locked -p tilo-ui --no-default-features --lib

      - name: Save observed Clippy inputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: clippy-inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: target/ci/clippy-*-inputs.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save Cargo downloads
        if: always() && matrix.shard == 1 && steps.rust-build.outputs.cargo-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.rust-build.outputs.cargo-cache-paths }}
          key: ${{ steps.rust-build.outputs.cargo-cache-key }}

  # Apps with an Android host example (docs/android.md), linted for both
  # Android ABIs whenever they are selected, which includes every change to
  # the SDK crates they build on. Lint only: an APK needs the Android SDK
  # platform and build tools, and the host code paths it would add run only on
  # a device. The NDK's host tools are x86_64-only.
  android:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.android_required == 'true' }}
    needs: [builder, select]
    runs-on: runner
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
      CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
      CC_aarch64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
      CXX_aarch64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
      AR_aarch64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
      CC_x86_64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
      CXX_x86_64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang++
      AR_x86_64_linux_android: /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      # A no-op on builders built from the current recipe.
      - name: Ensure the Android NDK and Rust targets
        run: bash tools/ci/install-android-ndk.sh

      - name: Clippy Android apps
        env:
          PACKAGES: ${{ needs.select.outputs.android_packages }}
        run: |
          # shellcheck disable=SC2086
          bash tools/ci/clippy-android.sh $PACKAGES

  # Browser crates (anything built on wasm-bindgen) and their cfg(wasm32)
  # code paths, which no native job compiles, type-checked; and the selected
  # web-capable examples, built for the web. The browser bundle build and its
  # tests run elsewhere.
  wasm:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.wasm_required == 'true' }}
    needs: [builder, select]
    # wasm32 output is host-independent; main still qualifies it on x86.
    # The portable label admits only qualified x86 general and ARM large slots.
    runs-on: runner
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -D warnings
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Verify native wasm-check runner architecture
        env:
          EXPECTED_ARCH: ${{ github.event_name == 'push' && 'x86_64' || runner.arch }}
        run: bash tools/ci/assert-native-runner.sh "$EXPECTED_ARCH"

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      # A no-op on builders built from the current recipe.
      - name: Ensure the wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown

      # The selected browser crates with their default features, then the
      # browser's own builds as it builds them.
      - name: Clippy browser crates and builds for wasm32
        env:
          PACKAGES: ${{ needs.select.outputs.wasm_packages }}
        run: |
          # shellcheck disable=SC2086
          bash tools/ci/check-wasm.sh $PACKAGES

      # `tilo-app build --platform web` for every selected web-capable
      # example, against one web core.
      - name: Build web-capable examples for the web
        if: needs.select.outputs.web_examples != ''
        env:
          WEB_EXAMPLES: ${{ needs.select.outputs.web_examples }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          bash tools/ci/measure.sh "web examples" -- \
            bash scripts/ci-run.sh "tilo-app build --platform web (examples)" -- \
            bash tools/ci/build-web-examples.sh $WEB_EXAMPLES

  # Vendored crates that carry Tilo patches are path dependencies outside the
  # workspace: the jobs above build them but never run their own tests. Run
  # them when their files change (VENDORED_TEST_CRATES in
  # tools/ci/affected_packages.py); ci-nightly.yml runs every one.
  vendored:
    if: ${{ !cancelled() && needs.builder.result == 'success' && needs.select.result == 'success' && needs.select.outputs.vendored_required == 'true' }}
    needs: [builder, select]
    runs-on: runner
    timeout-minutes: 45
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Test the selected vendored crates
        env:
          CRATES: ${{ needs.select.outputs.vendored_crates }}
        run: |
          set -euo pipefail
          test -n "$CRATES"
          # shellcheck disable=SC2086
          bash tools/ci/measure.sh "vendored crate tests" -- \
            bash scripts/ci-run.sh "Vendored crate tests" -- \
            bash tools/ci/test-vendored-crates.sh $CRATES

  pins:
    if: needs.select.outputs.pins_required == 'true'
    needs: [select]
    runs-on: runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Merge onto the tested main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.select.outputs.main }}
      - name: Install verification tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if ! command -v skopeo >/dev/null || ! command -v jq >/dev/null; then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends skopeo jq
            else
              sudo -n dnf install -y skopeo jq
            fi
          fi
      - name: Verify the changed snapshot pins
        env:
          PINS: ${{ needs.select.outputs.pins }}
        run: |
          set -euo pipefail
          read -r -a pins <<< "$PINS"
          ./os/dev/verify-snapshot-pins.sh "${pins[@]}"

  checks:
    # A superseded run has nothing to aggregate; it still finishes successfully.
    if: ${{ always() && needs.supersede.outputs.superseded != 'true' }}
    needs: [supersede, builder, select, security, test, check, clippy, android, wasm, suites, vendored, pins]
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    steps:
      - name: Require applicable checks and explain intentional non-applicability
        id: aggregate
        env:
          BUILDER_RESULT: ${{ needs.builder.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          CHECK_REQUIRED: ${{ needs.select.outputs.check_required }}
          SUITES_RESULT: ${{ needs.suites.result }}
          SUITES_REQUIRED: ${{ needs.select.outputs.suites_required }}
          VENDORED_RESULT: ${{ needs.vendored.result }}
          VENDORED_REQUIRED: ${{ needs.select.outputs.vendored_required }}
          PINS_RESULT: ${{ needs.pins.result }}
          PINS_REQUIRED: ${{ needs.select.outputs.pins_required }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_REQUIRED: ${{ needs.select.outputs.android_required }}
          WASM_RESULT: ${{ needs.wasm.result }}
          WASM_REQUIRED: ${{ needs.select.outputs.wasm_required }}
          EVENT_NAME: ${{ github.event_name }}
          SECURITY_REQUIRED: ${{ needs.select.outputs.security_required }}
          RUST_REQUIRED: ${{ needs.select.outputs.rust_required }}
          SELECTED_COUNT: ${{ needs.select.outputs.selected_count }}
        shell: bash
        run: |
          set -euo pipefail
          # The shard's test and Clippy jobs, and the standalone check where
          # the selector requires one, pass together or are skipped together;
          # any other combination is a failure.
          case "$TEST_RESULT:$CLIPPY_RESULT:$CHECK_REQUIRED:$CHECK_RESULT" in
            success:success:true:success|success:success:false:skipped) AFFECTED_RESULT=success ;;
            skipped:skipped:false:skipped) AFFECTED_RESULT=skipped ;;
            *) AFFECTED_RESULT=failure ;;
          esac
          test "$BUILDER_RESULT" = success
          test "$SELECT_RESULT" = success
          case "$EVENT_NAME:$SECURITY_REQUIRED:$SECURITY_RESULT" in
            *:true:success)
              ;;
            pull_request:false:skipped)
              echo 'Security checks not applicable: audited pull-request-only inputs.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Security checks failed, were skipped unexpectedly, or selection outputs are invalid.'
              exit 1
              ;;
          esac
          case "$SUITES_REQUIRED:$SUITES_RESULT" in
            true:success) ;;
            false:skipped)
              echo 'Path-selected suites not applicable: no declared suite inputs changed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Path-selected suites failed or applicability is invalid.'
              exit 1
              ;;
          esac
          case "$VENDORED_REQUIRED:$VENDORED_RESULT" in
            true:success) ;;
            false:skipped) ;;
            *)
              echo '::error::Vendored crate tests failed or applicability is invalid.'
              exit 1
              ;;
          esac
          case "$ANDROID_REQUIRED:$ANDROID_RESULT" in
            true:success) ;;
            false:skipped) ;;
            *)
              echo '::error::Android app checks failed or applicability is invalid.'
              exit 1
              ;;
          esac
          case "$WASM_REQUIRED:$WASM_RESULT" in
            true:success) ;;
            false:skipped) ;;
            *)
              echo '::error::Browser crate wasm32 checks failed or applicability is invalid.'
              exit 1
              ;;
          esac
          case "$EVENT_NAME:$PINS_REQUIRED:$PINS_RESULT" in
            pull_request:true:success)
              echo 'Snapshot pins verified: signed and bound to this source; Rust and security suites run on main after the merge.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *:false:skipped) ;;
            *)
              echo '::error::Snapshot pin verification failed or applicability is invalid.'
              exit 1
              ;;
          esac
          case "$RUST_REQUIRED:$SELECTED_COUNT:$AFFECTED_RESULT" in
            false:0:skipped)
              echo 'Rust checks not applicable: audited non-compiling inputs.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            true:*:success)
              [[ "$SELECTED_COUNT" =~ ^[1-9][0-9]*$ ]]
              echo "Rust checks passed for $SELECTED_COUNT selected packages." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Required checks failed, were skipped unexpectedly, or selection outputs are invalid.'
              exit 1
              ;;
          esac
