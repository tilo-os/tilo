name: CI / affected packages

# Pull requests and pushes compile/test only packages touched by the change and
# their transitive workspace dependants. Full target and test coverage remains
# mandatory in nightly.yml; this job is the short feedback path.
# Manual dispatch validates the complete workspace on both native architectures.
on:
  push:
    # Temporary branch triggers while desktop packaging and ARM support are being
    # validated without changing main.
    branches: ["main", "codex/package-desktop-release", "codex/arm64-platform-support"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      builder_image:
        description: 'Optional immutable tested builder index (code.sandbox.example/qos/tilo-builder@sha256:...)'
        required: false
        type: string

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: /cargo-home
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  # Match the test profile below. Cargo keeps dev/test artifacts in the same
  # target tree, but a different debuginfo setting gives them different
  # fingerprints and recompiles the dependency graph for the all-target pass.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  # Cache availability changes speed, never correctness or mergeability.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  RUSTFLAGS: "-D warnings"
  WGPU_BACKEND: vulkan
  # Every runner may expose a different physical adapter. Goldens are rendered
  # with Mesa's CPU Vulkan driver, so make all headless GPU tests use that same
  # adapter and fail instead of silently selecting runner hardware.
  WGPU_ADAPTER_NAME: llvmpipe
  # Software-Vulkan goldens are intentionally exercised by nightly.yml after
  # its parallel suite has drained. Under the affected-package shards their
  # atomic rasterisation changes with runner load, producing repeatable false
  # pixel deltas even though the same canonical image passes while isolated.
  GOLDEN_FILTER: >-
    (package(ui) and test(typography_visual_regression::)) or
    (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline))) or
    (package(shell) and (test(e2e_shell_flows::) or test(sidebar_wheel_disc_snapshot::)))

jobs:
  builder:
    runs-on: runner
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve the CI builder before starting job containers
        id: resolve
        env:
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
        shell: bash
        run: |
          set -euo pipefail
          image=code.sandbox.example/qos/tilo-builder:latest
          if [ -n "$REQUESTED_BUILDER" ]; then
            [[ "$REQUESTED_BUILDER" =~ ^code\.podesta\.ai/qos/tilo-builder@sha256:[0-9a-f]{64}$ ]] || {
              echo '::error::builder_image must be an immutable tilo-builder SHA-256 reference'
              exit 1
            }
            image="$REQUESTED_BUILDER"
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Checkout public-trust context fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Verify named public-trust contexts with Docker BuildKit
        env:
          DOCKER_BUILDKIT: "1"
        run: bash os/tests/named_public_trust_context.sh docker

  select:
    needs: builder
    runs-on: runner
    timeout-minutes: 15
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.plan.outputs.base }}
      full: ${{ steps.plan.outputs.full }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      workspace_count: ${{ steps.plan.outputs.workspace_count }}
      estimated_cost: ${{ steps.plan.outputs.estimated_cost }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Checkout head for change selection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0

      - name: Fetch comparison base
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ] || \
             [ '${{ github.ref }}' = 'refs/heads/codex/package-desktop-release' ]; then
            # Refresh main explicitly so the release gate always compares the
            # complete branch diff against the current integration branch.
            git fetch origin \
              +refs/heads/main:refs/remotes/origin/main
          else
            base='${{ github.event.pull_request.base.sha }}'
            if [ -z "$base" ] || [ "$base" = "null" ]; then
              base='${{ github.event.before }}'
            fi
            if [ -n "$base" ] &&
               [ "$base" != "0000000000000000000000000000000000000000" ] &&
               ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch origin "$base"
            fi
          fi

      - name: Workspace membership guard
        run: ./scripts/check-workspace-complete.sh

      # The image may lag a newly required check tool.
      - name: Ensure invariant test tooling
        run: |
          command -v jq >/dev/null || dnf install -y jq
          python3 -c 'import PIL' 2>/dev/null || dnf install -y python3-pillow

      # These boundaries are mostly shell, image configuration, and workflow
      # policy, so Cargo's affected-package graph cannot select them. Keep the
      # cheap executable invariants on every PR instead of waiting for a release.
      - name: Security boundary invariants
        run: |
          python3 scripts/check-install-contract.py
          bash os/tests/kernel_hardening_invariants.sh
          bash os/tests/kernel_architecture.sh
          python3 os/tests/hardware_profile_test.py
          python3 os/tests/uki_hardware_profile.py
          python3 os/tests/image_build_profile.py
          python3 os/tests/native_index_promotion.py
          python3 os/tests/test_builder_candidate_workflow.py
          python3 os/tests/test_rpm_snapshot_architecture.py
          python3 os/tests/test_fex_payload.py
          python3 os/tests/test_fex_patches.py
          python3 os/tests/test_windows_guest_contract.py
          python3 os/tests/test_windows_guest_payload.py
          python3 os/tests/test_windows_guest_dxvk.py
          python3 os/tests/test_windows_provider.py
          python3 os/tests/test_rpm_snapshot_boundaries.py
          python3 os/tests/test_windows_dxvk_load_evidence.py
          python3 os/tests/test_wine_rpm_contract.py
          python3 os/tests/test_fetch_wine_source.py
          python3 os/tests/test_wine_mock_producer.py
          python3 os/tests/test_wine_ci_cleanup.py
          python3 os/tests/test_wine_rpm_merge.py
          python3 os/tests/imager_media_profiles.py
          python3 apps/imager/packaging/test_generate_winget.py
          bash os/tests/kernel_module_signing_test.sh
          bash os/tests/boot_performance_gate_test.sh
          bash os/tests/no_openssl_runtime.sh
          bash os/tests/media_subprocess_invariants.sh
          bash os/tests/os_actions_subprocess_invariants.sh
          bash os/tests/packaging_subprocess_invariants.sh
          bash os/tests/shell_subprocess_invariants.sh
          bash os/tests/fs_subprocess_invariants.sh
          bash os/tests/disks_subprocess_invariants.sh
          bash os/tests/secret_service_subprocess_invariants.sh
          bash os/tests/secureboot_signing_test.sh
          bash os/tests/image_trust_update_gate.sh
          bash os/tests/update_subprocess_invariants.sh
          bash os/tests/release_security_invariants.sh
          bash os/tests/selinux_policy_store_invariants.sh
          bash os/tests/first_boot_service_readiness.sh
          bash os/tests/release_freshness_security.sh
          bash os/tests/installer_target_invariants.sh
          bash os/tests/rollback-initrd-hook.sh
          bash os/tests/tilo_root_discovery.sh
          bash os/tests/authenticode_envelope.sh
          bash os/tests/installer_guided_alongside.sh
          bash os/tests/installer_boot_menu.sh
          bash os/tests/live_recovery.sh
          bash os/tests/boot_ux_invariants.sh
          bash os/tests/greeter_auth_security.sh
          bash os/tests/repair_mode.sh
          bash os/tests/installer_profile_transport.sh
          bash os/tests/imager_release_invariants.sh
          bash os/tests/imager_broker_credentials.sh
          bash os/tests/imager_ephemeral_runner.sh
          bash os/tests/imager_ephemeral_runner_windows.sh
          bash os/tests/imager_linux_release_trust.sh
          bash os/tests/wpe_reproducibility_invariants.sh
          bash os/tests/generation_series_security.sh
          bash os/tests/system_extension_invariants.sh
          bash os/tests/tinker_subprocess_invariants.sh
          bash os/tests/local_model_catalog_invariants.sh
          bash os/tests/release_pipeline_invariants.sh

      - name: Select and balance affected packages
        id: plan
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          selection_args=()
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            # Dispatch has no pull-request base or push-before SHA. Do not
            # silently reduce an acceptance run to the last commit's changes.
            base=origin/main
            selection_args+=(--full)
          elif [ '${{ github.ref }}' = 'refs/heads/codex/package-desktop-release' ]; then
            # Every iteration must cover the complete release diff. Comparing
            # only with github.event.before would forget changes from earlier
            # branch pushes and could produce a misleading exact-SHA receipt.
            base=origin/main
          elif [ -z "$base" ] || [ "$base" = "null" ]; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] \
              || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=HEAD^
          fi
          echo "base=$(git rev-parse "$base^{commit}")" >> "$GITHUB_OUTPUT"
          python3 tools/ci_select.py --base "$base" --shards 2 "${selection_args[@]}" \
            --github-output "$GITHUB_OUTPUT" | tee ci-plan.json
          {
            echo '```json'
            cat ci-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  affected:
    needs: [builder, select]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0

      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Prepare headless runtime and compiler cache
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          driver="/usr/share/vulkan/icd.d/lvp_icd.$(uname -m).json"
          test -r "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          mkdir -p /tmp/tilo-xdg-runtime
          chmod 700 /tmp/tilo-xdg-runtime
          bash tools/ci-sccache.sh prepare

      # Build and run tests first. The resulting rlibs/rmeta are then reusable
      # by the all-target check; doing this in the opposite order makes rustc
      # perform metadata-only work before doing codegen for the same crates.
      # app-catalogue's registry integration tests execute the real installer;
      # it is deliberately not a Rust dependency, so an affected-only Cargo
      # invocation does not otherwise produce that binary.
      - name: Build installer used by app-catalogue integration tests
        if: contains(matrix.packages, '-p app-catalogue')
        run: >-
          bash tools/ci-measure.sh "build tilo-install test fixture" --
          bash scripts/ci-run.sh "cargo build (tilo-install test fixture)" --
          cargo build --locked -p install

      - name: Test shard ${{ matrix.shard }}
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
        run: >-
          bash tools/ci-measure.sh "test shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "cargo nextest (affected shard ${{ matrix.shard }})" --
          cargo nextest run --locked --profile ci ${{ matrix.packages }}
          -E "not ($GOLDEN_FILTER)"

      - name: Check all targets in shard ${{ matrix.shard }}
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
        run: >-
          bash tools/ci-measure.sh "check shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "cargo check (affected shard ${{ matrix.shard }})" --
          cargo check --locked --all-targets ${{ matrix.packages }}

      # Lint the exact same reverse-dependency closure at the selected base and
      # at HEAD. Historical diagnostics in an otherwise untouched dependant do
      # not make an unrelated change impossible to merge, while compiler errors
      # and every newly introduced Clippy site still fail this exact SHA.
      #
      # Compilation deliberately stays here rather than in the pre-commit
      # hook: local hooks are bypassable and must remain fast enough to keep
      # their formatting, secret, and staged-diff checks useful. This is the
      # authoritative, base-aware lint gate.
      - name: Clippy shard ${{ matrix.shard }}
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
        run: >-
          bash tools/ci-measure.sh "clippy shard ${{ matrix.shard }}" --
          bash scripts/ci-run.sh "Clippy diagnostic diff (affected shard ${{ matrix.shard }})" --
          tools/clippy-diff.sh '${{ needs.select.outputs.base }}' ${{ matrix.packages }}

      - name: Report remote compiler-cache effectiveness
        if: always()
        run: |
          echo "### sccache shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci-sccache.sh report 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # One writer avoids two shards racing to create the same immutable key.
      - name: Save Cargo downloads
        if: always() && matrix.shard == 1 && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}

  report-check-result:
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/codex/package-desktop-release')
    needs: [select, affected]
    runs-on: runner
    timeout-minutes: 10
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      AFFECTED_RESULT: ${{ needs.affected.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
      - name: Record an observable CI receipt without touching a branch
        run: |
          git config user.name 'Tilo Forgejo CI'
          git config user.email 'tilo@noreply.code.sandbox.example'
          git fetch origin refs/notes/tilo-check-ci:refs/notes/tilo-check-ci || true
          git notes --ref=tilo-check-ci add -f \
            -m "select=$SELECT_RESULT affected=$AFFECTED_RESULT run=$GITHUB_RUN_ID sha=$GITHUB_SHA" \
            "$GITHUB_SHA"
          git push origin refs/notes/tilo-check-ci
