name: Check + test the whole workspace

# Fast feedback that EVERY crate compiles + its tests pass — the image build only
# compiles the OS binaries, so without this the ~45 apps could (and did) rot
# undetected. Runs on push/PR to main; the heavier image build stays separate.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: runner
    container:
      # Prebuilt by build-builder-image.yml: the native dependencies, the
      # pinned toolchain and nextest. Previously every run dnf-installed ~30
      # packages first.
      image: code.sandbox.example/qos/qos-builder:latest
      # The runner pulls the job container before any step runs, so a
      # docker/login-action step inside the job is too late for a private image.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Workspace membership guard (no crate silently dropped)
        run: ./scripts/check-workspace-complete.sh

      # nextest builds every test target and runs each test in its own process.
      # `cargo check --workspace` used to run first; it compiled the tree a
      # second time for artifacts this step cannot reuse.
      #
      # --locked: a fresh resolve pulls a pre-release ed25519-dalek stack
      # through iroh that does not compile, failing inside a dependency rather
      # than anywhere this repo touches.
      - name: cargo nextest run --workspace
        env:
          # Headless GPU via llvmpipe; live network tests self-skip unless opted in.
          WGPU_BACKEND: vulkan
          # Bound peak memory: parallel rustc linking test binaries otherwise
          # OOM-kills the runner mid-compile. Test-profile debuginfo has no
          # effect on pass/fail.
          CARGO_BUILD_JOBS: "4"
          CARGO_PROFILE_TEST_DEBUG: "0"
          # A wayland socket has to be bound somewhere, and smithay's
          # `ListeningSocket::bind_auto` puts it in the runtime dir. There is
          # no login session in this container to set one, so the compositor's
          # handshake tests failed with `RuntimeDirNotSet` before reaching
          # anything they check. Providing the directory lets them bind a real
          # socket and run for real.
          XDG_RUNTIME_DIR: /tmp/qos-xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo nextest run --workspace --locked --profile ci

      # Examples are not test targets, so nextest does not build them. The
      # dependency rlibs it just produced make this close to free.
      - name: cargo build --workspace --examples
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo build --workspace --examples --locked
