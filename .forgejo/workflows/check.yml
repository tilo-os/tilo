name: Check + test the whole workspace

# Fast feedback that EVERY crate compiles + its tests pass — the image build only
# compiles the OS binaries, so without this the ~45 apps could (and did) rot
# undetected. Runs on push/PR to main; the heavier image build stays separate.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: runner
    container:
      image: quay.io/fedora/fedora:42
    steps:
      # First, because the fedora container ships neither node (which
      # actions/checkout needs) nor the Rust build deps. capnproto is required by
      # runtime-collab's build.rs; the Vulkan driver lets the GPU tests run headless.
      - name: Install deps (node for checkout, capnproto for runtime-collab, build + Vulkan)
        run: |
          dnf install -y \
            nodejs \
            rust cargo sccache capnproto \
            gcc gcc-c++ make cmake perl perl-FindBin python3 git \
            clang clang-devel pkgconf-pkg-config \
            libxkbcommon-devel wayland-devel \
            libseat-devel libinput-devel systemd-devel libdrm-devel \
            mesa-libgbm-devel mesa-libGL-devel mesa-libEGL-devel \
            pipewire-devel \
            ffmpeg-free-devel libva-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            openssl-devel sqlite-devel zlib-ng-compat-devel \
            fontconfig-devel freetype-devel harfbuzz-devel expat-devel \
            nasm \
            vulkan-loader mesa-vulkan-drivers \
          && dnf clean all

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Workspace membership guard (no crate silently dropped)
        run: ./scripts/check-workspace-complete.sh

      # The browser is in here too: its WPE WebKit engine sits behind the
      # non-default `wpe` feature, so the default build is hermetic and needs
      # no native WebKit stack.
      #
      # GStreamer is NOT hermetic any more, despite the comment in Cargo.toml
      # that says the dev stack is never needed here. Two crates now enable it
      # from their default features — `camera` (default = ["live-capture"]) and
      # `video_editor` (default = ["decode"] -> media/decode) — so a plain
      # `cargo check --workspace` wants gstreamer-1.0, and every run of this job
      # has failed on the missing .pc file since those defaults changed. The
      # headers are installed above; the alternative, taking those features back
      # off by default, is a product decision rather than a CI one.
      #
      # --locked: a fresh resolve of this tree pulls a pre-release ed25519-dalek
      # stack through iroh that does not compile, and it fails inside a
      # dependency rather than anywhere this repo touches. --locked makes an
      # out-of-date lockfile say so instead.
      - name: cargo check --workspace (every app + crate must compile)
        env:
          RUSTC_WRAPPER: sccache
          CARGO_BUILD_JOBS: "4"
        run: cargo check --workspace --locked

      - name: cargo test --workspace
        env:
          RUSTC_WRAPPER: sccache
          # Headless GPU via llvmpipe; live network tests self-skip unless opted in.
          WGPU_BACKEND: vulkan
          # Bound peak memory: a workspace-wide test build otherwise fans out to
          # ~30 parallel rustc linking full-debuginfo test binaries and OOM-kills
          # the runner mid-compile. Cap parallelism and drop test-profile
          # debuginfo (no effect on pass/fail) — full coverage, bounded RAM.
          CARGO_BUILD_JOBS: "4"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace --locked --no-fail-fast
