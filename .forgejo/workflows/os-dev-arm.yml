name: Build / OS dev (aarch64)

# Explicit main dev-image request. Keep one build per architecture and skip
# requests for a superseded main commit. Use os-dev.yml to target another ref
# or select multiple architectures.
on:
  workflow_dispatch:

concurrency:
  group: os-dev-aarch64-main
  cancel-in-progress: false

jobs:
  newest:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:f84f99fb5586335f3850c06c7daaf26a12903c4cb29513b9a9c95a9f266f56f1
    outputs:
      build: ${{ steps.newest.outputs.build }}
    steps:
      - id: newest
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(curl -fsS -H "Authorization: token $TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/branches/main" | jq -er .commit.id)"
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head; its run builds aarch64"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: newest
    if: needs.newest.outputs.build == 'true'
    uses: ./.forgejo/workflows/build-image.yml
    with:
      arches: '["aarch64"]'
    secrets: inherit
