name: Build / kernel

# Rebuilds Fedora's kernel with the Tilo config fragment. Pull requests
# validate the build; pushes to main, version tags and manual dispatches publish
# the resulting RPM image and propose the kernel pin.
#
# Every build dependency and the Fedora SRPM come from the signed native kernel
# buildroot pinned in os/kernel-buildroot-snapshot.env
# (build-buildroots.yml). Kernel provenance binds that buildroot, not
# the OS frozen RPM snapshot, so only kernel inputs trigger a rebuild here.
# tilo-crypto is filtered to the signing sources the kernel Containerfile
# copies; TLS fixture code stays behind the default tls-fixture feature and
# is covered by check.yml / ci-development-signing.yml instead.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "os/kernel/**"
      - "os/kernel-buildroot-snapshot.env"
      - "crates/system/tilo-crypto/Cargo.toml"
      - "crates/system/tilo-crypto/src/lib.rs"
      - "crates/system/tilo-crypto/src/main.rs"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - ".forgejo/actions/cache-github-assets/**"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/open-snapshot-pr.py"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/build-kernel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "os/kernel/**"
      - "os/kernel-buildroot-snapshot.env"
      - "crates/system/tilo-crypto/Cargo.toml"
      - "crates/system/tilo-crypto/src/lib.rs"
      - "crates/system/tilo-crypto/src/main.rs"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - ".forgejo/actions/cache-github-assets/**"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/open-snapshot-pr.py"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/build-kernel.yml"
  workflow_dispatch:

concurrency:
  group: build-kernel-${{ (startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main')) && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main')) }}

jobs:
  signing-preflight:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
    runs-on: runner-quality
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Bind kernel signing authority to pinned release identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: os/dev/require-cosign-authority.sh

  build-and-push-kernel:
    needs: signing-preflight
    if: >-
      ${{
        always() &&
        (needs.signing-preflight.result == 'success' || needs.signing-preflight.result == 'skipped')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner-disk-100g
            kernel_build_jobs: 6
          - arch: aarch64
            platform: linux/arm64
            runner: runner-disk-100g-arm64
            kernel_build_jobs: 4
    runs-on: ${{ matrix.runner }}
    enable-openid-connect: true
    # Finish before the existing three-hour runner/server deadline, leaving
    # room for cleanup and reporting. Measure/cache builds within this budget.
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Require the selected native kernel architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"

      # The build FROMs the signed kernel buildroot for its toolchain
      # (rpm-build, kernel-devel, gcc, ...) and the Fedora kernel SRPM, which
      # anyone may pull. Only publication logs in, to push the image and
      # refresh the layer cache.
      - name: Log in to registry.tilo.so
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ matrix.arch }}

      # The native buildroot pin. Its signature, architecture and recorded
      # base are checked before BuildKit can build FROM it.
      - name: Verify the signed native kernel buildroot
        run: |
          set -euo pipefail
          . os/kernel-buildroot-snapshot.env
          case '${{ matrix.arch }}' in
            x86_64) ref="$KERNEL_BUILDROOT_X86_64_REF"; expected_arch=amd64 ;;
            aarch64) ref="$KERNEL_BUILDROOT_AARCH64_REF"; expected_arch=arm64 ;;
          esac
          [[ "$ref" =~ ^registry\.tilo\.so/tilo/tilo-kernel-buildroot@sha256:[0-9a-f]{64}$ ]] || {
            printf 'no digest-pinned native kernel buildroot for %s; run build-buildroots\n' '${{ matrix.arch }}' >&2
            exit 1
          }
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          docker pull --quiet "$ref" >/dev/null
          actual_arch="$(docker image inspect --format '{{.Architecture}}' "$ref")"
          [ "$actual_arch" = "$expected_arch" ] || {
            printf 'kernel buildroot architecture is %s, expected %s\n' "$actual_arch" "$expected_arch" >&2
            exit 1
          }
          base="$(docker run --rm --network=none --entrypoint cat "$ref" /usr/lib/tilo/kernel-buildroot-base)"
          [[ "$base" =~ ^registry\.tilo\.so/tilo/fedora-bootc@sha256:[0-9a-f]{64}$ ]]
          {
            echo "KERNEL_BUILDROOT_REF=$ref"
            echo "KERNEL_BUILDROOT_BASE_REF=$base"
          } >> "$GITHUB_ENV"

      # Reproducible: buildkit rewrites layer timestamps + the kernel's
      # KBUILD_BUILD_TIMESTAMP to SOURCE_DATE_EPOCH (see os/kernel/Containerfile).
      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The sccache client is architecture-specific, so is the cache key.
      - name: Materialize checksum-pinned kernel inputs
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: kernel-assets-v3-${{ matrix.arch }}
          path: os/external-assets/kernel-cache
          assets: >-
            v4l2loopback-0.15.3-a7e4a4d.tar.gz
            sccache-v0.17.0-${{ matrix.arch }}-unknown-linux-musl.tar.gz

      # The runner's compiler cache (infra docs/ci-caching.md). Pull requests
      # read and write it (their own scope, plus main's). Every other run
      # publishes a kernel that signed OS images install, so it never reads
      # the cache: it compiles every object and writes them (populate), which
      # is where pull requests' hits come from.
      - name: Bind the runner compiler cache
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [[ -z ${ACTIONS_CACHE_URL:-} || -z ${ACTIONS_RUNTIME_TOKEN:-} ]]; then
            printf '%s\n' KERNEL_COMPILER_CACHE=off KERNEL_REQUIRE_COMPILER_CACHE=0 KERNEL_COMPILER_CACHE_SECRETS= >> "$GITHUB_ENV"
            echo "::notice::this slot provides no compiler cache; compiling the kernel without it"
            exit 0
          fi
          if [[ $PULL_REQUEST == true ]]; then
            printf '%s\n' KERNEL_COMPILER_CACHE=shared KERNEL_REQUIRE_COMPILER_CACHE=1 >> "$GITHUB_ENV"
          else
            printf '%s\n' KERNEL_COMPILER_CACHE=populate KERNEL_REQUIRE_COMPILER_CACHE=0 >> "$GITHUB_ENV"
            echo '::notice::publication: compiling every kernel object and writing it to the compiler cache, reading none'
          fi
          {
            echo 'KERNEL_COMPILER_CACHE_SECRETS<<TILO_COMPILER_CACHE_SECRETS'
            echo 'actions_cache_url=ACTIONS_CACHE_URL'
            echo 'actions_runtime_token=ACTIONS_RUNTIME_TOKEN'
            echo 'TILO_COMPILER_CACHE_SECRETS'
          } >> "$GITHUB_ENV"

      # The shared setup gives the builder the runner pool's registries.
      - name: Set up buildx
        uses: ./.forgejo/actions/setup-buildx
        with:
          driver-opts: |
            memory=9g
            memory-swap=9g

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: registry.tilo.so/tilo/tilo-kernel
          tags: |
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-${{ matrix.arch }}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pr-${{ github.event.number }}-${{ matrix.arch }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=dispatch-${{ github.sha }}-${{ matrix.arch }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}

      - name: Start kernel build timing
        run: echo "KERNEL_BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # A shared Docker daemon can still hold this commit's image from an
      # earlier attempt; the registry-push retry below must never publish it.
      - name: Discard any earlier local image for this commit
        run: docker image rm -f 'registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}' >/dev/null 2>&1 || true

      # Publication runs push; pull requests only build and load. A failure
      # always reaches the next step, which retries only a publication push
      # of a completed build and otherwise fails the job.
      - name: Build the tilo-kernel image (push only on tags/dispatch)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/kernel/Containerfile
          build-contexts: |
            github-assets=os/external-assets/kernel-cache
          platforms: ${{ matrix.platform }}
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
          # Every other tag here can be pushed again by a rerun or a later run,
          # and the registry drops a manifest that loses its last tag. The
          # run- and attempt-unique tag keeps each published digest reachable.
          tags: |
            ${{ steps.meta.outputs.tags }}
            registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}
            registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            KERNEL_BUILDROOT_REF=${{ env.KERNEL_BUILDROOT_REF }}
            KERNEL_BUILD_JOBS=${{ matrix.kernel_build_jobs }}
            TILO_COMPILER_CACHE=${{ env.KERNEL_COMPILER_CACHE }}
            TILO_REQUIRE_COMPILER_CACHE=${{ env.KERNEL_REQUIRE_COMPILER_CACHE }}
          secret-envs: ${{ env.KERNEL_COMPILER_CACHE_SECRETS }}
          # A published kernel imports no layer cache: no uncached rebuild
          # checks it, and the cache tag is writable by other jobs. Publishing
          # runs refresh the cache that pull requests then consume.
          cache-from: ${{ github.event_name == 'pull_request' && format('type=gha,scope=kernel-{0}', matrix.arch) || '' }}
          # PRs consume the shared cache but do not update it: exporting cache
          # work can outlive a successful compile and exhaust the runner's
          # hard deadline. Main/tag/dispatch builds refresh final-stage
          # dependencies only; mode=max duplicates the multi-GiB source tree.
          # ignore-error: a cache write failure must not fail a build whose
          # image was already pushed; the next run simply starts colder.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=kernel-{0},mode=min,ignore-error=true', matrix.arch) || '' }}
          provenance: false

      # The build step never fails the job itself (continue-on-error), so
      # this runs whenever the build ran and is skipped with it otherwise.
      - name: Report kernel build resource metrics
        if: ${{ steps.build.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          cpu_max=unavailable
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            cpu_max=$(tr ' ' '/' < /sys/fs/cgroup/cpu.max)
          fi
          elapsed_seconds=$(( $(date +%s) - KERNEL_BUILD_STARTED_AT ))
          {
            echo "## Kernel build resources (${{ matrix.arch }})"
            echo ""
            echo "- configured jobs: ${{ matrix.kernel_build_jobs }}"
            echo "- visible CPUs: $(nproc)"
            echo "- cgroup cpu.max: $cpu_max"
            echo "- elapsed seconds: $elapsed_seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reached only when the build step failed. Pull request builds do not
      # push, so their failure is always fatal. The image is loaded before
      # buildx pushes it, so a present local image means the compile
      # succeeded and only the registry write failed; an absent one is a real
      # build failure and stays fatal.
      - name: Retry the registry push of the completed build
        id: push-retry
        if: ${{ steps.build.outcome == 'failure' }}
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
          LOCAL_IMAGE: registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}
          UNIQUE_TAG: registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ "$PUBLISH" = true ] || {
            echo '::error::the kernel image build failed'
            exit 1
          }
          docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1 || {
            echo '::error::the kernel image build failed before producing an image'
            exit 1
          }
          digest=''
          for attempt in 1 2 3; do
            if log="$(docker push "$LOCAL_IMAGE" 2>&1)"; then
              printf '%s\n' "$log"
              digest="$(printf '%s\n' "$log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1)"
              break
            fi
            printf '%s\n' "$log" >&2
            [ "$attempt" -lt 3 ] || { echo '::error::registry push failed after 3 attempts'; exit 1; }
            sleep $((attempt * 30))
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::registry push did not report a manifest digest'
            exit 1
          }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$LOCAL_IMAGE" "$tag"
            for attempt in 1 2 3; do
              docker push "$tag" && break
              [ "$attempt" -lt 3 ] || { echo "::error::could not push $tag"; exit 1; }
              sleep $((attempt * 30))
            done
          done <<< "$UNIQUE_TAG
          $PUBLISH_TAGS"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve the published kernel digest
        id: published
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RETRY_DIGEST: ${{ steps.push-retry.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$BUILD_OUTCOME" = success ]; then digest="$BUILD_DIGEST"; else digest="$RETRY_DIGEST"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::no published kernel manifest digest'
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install native kernel acceptance tools
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            aarch64)
              apt_qemu=qemu-system-arm
              fedora_qemu=qemu-system-aarch64
              apt_firmware=qemu-efi-aarch64
              fedora_firmware=edk2-aarch64
              ;;
            x86_64)
              apt_qemu=qemu-system-x86
              fedora_qemu=qemu-system-x86
              apt_firmware=ovmf
              fedora_firmware=edk2-ovmf
              ;;
            *) exit 2;;
          esac
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends gcc libc6-dev binutils cpio gzip kmod python3 rpm rpm2cpio zstd dosfstools mtools "$apt_qemu" "$apt_firmware"
          else
            sudo -n dnf install -y gcc glibc-devel binutils cpio gzip kmod python3 rpm zstd dosfstools mtools "$fedora_qemu" "$fedora_firmware"
          fi

      - name: Boot the packaged native kernel and verify module signatures
        run: |
          set -euo pipefail
          mkdir kernel-repo
          container=$(docker create 'registry.tilo.so/tilo/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}' /bin/true)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container":/repo/. kernel-repo/
          shopt -s nullglob
          packages=(kernel-repo/tilo-kernel-core-*.rpm)
          test "${#packages[@]}" -eq 1
          bash os/kernel/tests/test-rpm.sh "${packages[0]}" kernel-acceptance

      - name: Preserve kernel acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: kernel-acceptance-${{ matrix.arch }}
          path: |
            kernel-repo/tilo-kernel-core-*.rpm
            kernel-acceptance/serial.log
            kernel-acceptance/inputs.json
            kernel-acceptance/rpm.sha256
          if-no-files-found: warn
          # Evidence for this run's failure triage only.
          retention-days: 1

      - name: Prove firmware rejects unsigned EFI and executes the signed image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/tilo-secureboot-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # The same compiler-cache mode as the kernel build, so the probe
          # reuses its compile.
          cache_secrets=()
          if [[ $KERNEL_COMPILER_CACHE != off ]]; then
            cache_secrets=(--secret id=actions_cache_url,env=ACTIONS_CACHE_URL
                           --secret id=actions_runtime_token,env=ACTIONS_RUNTIME_TOKEN)
          fi
          docker buildx build --file os/kernel/Containerfile \
            --target secureboot-probe-inputs \
            --build-context github-assets=os/external-assets/kernel-cache \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --build-arg "KERNEL_BUILDROOT_REF=$KERNEL_BUILDROOT_REF" \
            --build-arg "KERNEL_BUILD_JOBS=${{ matrix.kernel_build_jobs }}" \
            --build-arg "TILO_COMPILER_CACHE=$KERNEL_COMPILER_CACHE" \
            --build-arg "TILO_REQUIRE_COMPILER_CACHE=$KERNEL_REQUIRE_COMPILER_CACHE" \
            "${cache_secrets[@]}" \
            --output "type=local,dest=$probe" .
          TILO_KERNEL_PATH="$probe/vmlinuz" \
          TILO_GEN_INIT_CPIO="$probe/gen_init_cpio" \
          TILO_CRYPTO_BIN="$probe/tilo-crypto" \
          TILO_SECUREBOOT_VM_APP="$probe/secureboot_vm_app.efi" \
          TILO_SECUREBOOT_VM_ARCH="${{ matrix.arch }}" \
          TILO_SECUREBOOT_VM_WORK_ROOT="$RUNNER_TEMP" \
            bash os/tests/secureboot_vm_probe.sh

      # Use the same non-exportable release identity and transparency policy as
      # the OS image. The OS image build verifies this signature before it
      # `dnf swap`s the kernel in — see os/etc/containers/policy.json for
      # the trust root.
      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          ref="registry.tilo.so/tilo/tilo-kernel@${{ steps.published.outputs.digest }}"
          digest='${{ steps.published.outputs.digest }}'
          jq -n \
            --arg source "git+ssh://code.tilo.so/tilo/tilo@$GITHUB_SHA" \
            --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg buildroot "$KERNEL_BUILDROOT_REF" \
            --arg base "$KERNEL_BUILDROOT_BASE_REF" \
            --arg epoch "$SOURCE_DATE_EPOCH" '
              {
                buildDefinition: {
                  buildType: "https://tilo.sh/buildtypes/kernel-rpm/v1",
                  externalParameters: {architecture: $architecture},
                  internalParameters: {
                    sourceDateEpoch: ($epoch | tonumber),
                    expectedReleaseDigest: $digest
                  },
                  resolvedDependencies: [
                    {uri: $source}, {uri: $buildroot}, {uri: $base}
                  ]
                },
                runDetails: {
                  builder: {id: "https://code.tilo.so/tilo/forgejo/actions/kernel-release-v1"},
                  metadata: {invocationId: env.GITHUB_RUN_ID}
                }
              }
            ' > kernel-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign attest --yes --key "$COSIGN_KEY_REF" \
            --predicate kernel-provenance.json --type slsaprovenance1 "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$ref")"
          printf '%s' "$provenance" | jq -e \
            --arg source "$GITHUB_SHA" --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg buildroot "$KERNEL_BUILDROOT_REF" '
              [(if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
              | any(
                  .buildDefinition.buildType == "https://tilo.sh/buildtypes/kernel-rpm/v1"
                  and .buildDefinition.externalParameters.architecture == $architecture
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?;
                    .uri == ("git+ssh://code.tilo.so/tilo/tilo@" + $source))
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $buildroot)
                )
            ' >/dev/null

      - name: Report the new digest to commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
        run: |
          ref="registry.tilo.so/tilo/tilo-kernel@${{ steps.published.outputs.digest }}"
          # Promotion reads KERNEL_RPMS_X86_64_REF / KERNEL_RPMS_AARCH64_REF.
          variable="KERNEL_RPMS_$(printf '%s' '${{ matrix.arch }}' | tr '[:lower:]' '[:upper:]')_REF"
          case "$variable" in
            KERNEL_RPMS_X86_64_REF|KERNEL_RPMS_AARCH64_REF) ;;
            *) echo "::error::unexpected kernel pin variable $variable"; exit 1 ;;
          esac
          mkdir -p refs
          printf '%s=%s\n' "$variable" "$ref" > "refs/${{ matrix.arch }}.env"
          echo "::notice::tilo-kernel ${{ matrix.arch }} published. Set os/kernel-snapshot.env to: $variable=$ref"
          {
            echo "## tilo-kernel published"
            echo ""
            echo 'Commit this to `os/kernel-snapshot.env`:'
            echo ""
            echo '```'
            echo "$variable=$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve native digest for atomic promotion
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: tilo-kernel-${{ matrix.arch }}
          path: refs/${{ matrix.arch }}.env
          # Read by this run's pin job.
          retention-days: 1

      - name: Revoke local registry login
        if: ${{ always() }}
        run: docker logout registry.tilo.so >/dev/null 2>&1 || true

  promote-native-kernels:
    needs: build-and-push-kernel
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
    runs-on: runner
    timeout-minutes: 60
    env:
      KERNEL_SNAPSHOT_INPUTS: |
        os/kernel
        os/kernel-buildroot-snapshot.env
        crates/system/tilo-crypto/Cargo.toml
        crates/system/tilo-crypto/src/lib.rs
        crates/system/tilo-crypto/src/main.rs
        os/external-assets/github-assets.tsv
        os/dev/assert-native-arch.sh
        os/dev/open-snapshot-pr.py
        .forgejo/workflows/build-kernel.yml
    steps:
      - name: Checkout main for atomic pin promotion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          filter: blob:none
      - name: Download both verified native references
        uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: refs
      # Ordering against main's pin reads the source commit from the pinned
      # kernels' signed provenance.
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64
      - name: Propose both kernel pins atomically through protected main
        env:
          # The automatic job token pushes the branch. Neither it nor
          # REGISTRY_TOKEN may use the pull-request API (Forgejo answers 404),
          # so open the PR with RELEASE_TOKEN, which has repository scope; a PR
          # opened by a real account also triggers its own required checks.
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          x86="$(find refs -type f -name x86_64.env -print -quit)"
          arm="$(find refs -type f -name aarch64.env -print -quit)"
          test -n "$x86" && test -n "$arm"
          . "$x86"
          . "$arm"
          for ref in "$KERNEL_RPMS_X86_64_REF" "$KERNEL_RPMS_AARCH64_REF"; do
            [[ "$ref" =~ ^registry\.tilo\.so/tilo/tilo-kernel@sha256:[0-9a-f]{64}$ ]]
          done
          [ "$KERNEL_RPMS_X86_64_REF" != "$KERNEL_RPMS_AARCH64_REF" ] || {
            printf 'native kernel builds unexpectedly produced one shared manifest\n' >&2
            exit 1
          }
          # A kernel pin binds only its own signed buildroot, so it is
          # consistent on its own: it lands on the current main tip whenever it
          # comes from a later commit than main's pin, even if kernel inputs
          # moved during the build. Each such move triggered its own push run
          # of this workflow, queued behind this one, which supersedes it.
          # The source commit of a pinned kernel is the one its signed
          # provenance names; an unreadable pin is replaced.
          kernel_source() {
            cosign verify-attestation --key keys/cosign.pub --type slsaprovenance1 "$1" 2>/dev/null \
              | jq -r '[(if type == "array" then .[] else . end) | .payload | @base64d | fromjson
                  | .predicate.buildDefinition.resolvedDependencies[]?.uri
                  | capture("^git\\+ssh://code\\.tilo\\.so/tilo/tilo@(?<commit>[0-9a-f]{40})$").commit]
                  | unique | if length == 1 then .[0] else empty end' 2>/dev/null || true
          }
          # Succeeds when a pin built from $1 is older than this run's source.
          older_than_this_run() {
            [ -z "$1" ] || { [ "$1" != "$GITHUB_SHA" ] \
              && git merge-base --is-ancestor "$1" "$GITHUB_SHA" 2>/dev/null; }
          }
          git fetch --no-tags origin main
          mapfile -t inputs < <(printf '%s' "$KERNEL_SNAPSHOT_INPUTS")
          if ! git diff --quiet "$GITHUB_SHA..FETCH_HEAD" -- "${inputs[@]}"; then
            echo '::notice::kernel inputs moved on main during the build; the push runs they triggered follow this one'
          fi
          pinned="$(git show FETCH_HEAD:os/kernel-snapshot.env | sed -n 's/^KERNEL_RPMS_X86_64_REF=//p')"
          pinned_source=''
          [ -z "$pinned" ] || pinned_source="$(kernel_source "$pinned")"
          if ! older_than_this_run "$pinned_source"; then
            printf 'main already pins kernels from %s, not older than %s; refusing to regress\n' \
              "$pinned_source" "$GITHUB_SHA" >&2
            exit 1
          fi
          git checkout --detach FETCH_HEAD
          printf '%s\n' \
            '# Per-architecture Tilo kernel RPM repositories, signed and pinned by digest.' \
            '# Updated atomically by build-kernel.yml after both native builds verify.' \
            "KERNEL_RPMS_X86_64_REF=$KERNEL_RPMS_X86_64_REF" \
            "KERNEL_RPMS_AARCH64_REF=$KERNEL_RPMS_AARCH64_REF" \
            > os/kernel-snapshot.env
          git config user.name 'Tilo CI'
          git config user.email 'ci@tilo.invalid'
          git add os/kernel-snapshot.env
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(os): refresh native kernel snapshots'
          snapshot_digest="$(sha256sum os/kernel-snapshot.env | awk '{print $1}')"
          [[ "$snapshot_digest" =~ ^[0-9a-f]{64}$ ]]
          branch="automation/kernel-snapshot-${snapshot_digest:0:16}"
          remote_tip="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if ! git push --force-with-lease="refs/heads/$branch:$remote_tip" \
              origin "HEAD:refs/heads/$branch" 2> push.log; then
            cat push.log >&2
            if grep -Fq 'stale info' push.log; then
              echo "::error::$branch moved on the remote during promotion (lease lost); rerun to adopt it"
            else
              echo "::error::Forgejo refused the snapshot pin push to $branch (see the git output above)"
            fi
            exit 1
          fi
          cat push.log >&2
          # This pin supersedes every open kernel pin pull request built from
          # an earlier commit: merging one of those later would only regress.
          superseded=()
          git fetch --no-tags --prune origin '+refs/heads/automation/*:refs/remotes/origin/automation/*'
          while IFS= read -r candidate; do
            [ "$candidate" != "$branch" ] || continue
            candidate_ref="$(git show "origin/$candidate:os/kernel-snapshot.env" 2>/dev/null \
              | sed -n 's/^KERNEL_RPMS_X86_64_REF=//p')" || continue
            [ -n "$candidate_ref" ] || continue
            if older_than_this_run "$(kernel_source "$candidate_ref")"; then
              superseded+=(--supersede "$candidate")
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' \
            'refs/remotes/origin/automation/kernel-snapshot-*')
          python3 os/dev/open-snapshot-pr.py \
            --server "$GITHUB_SERVER_URL" --repository "$GITHUB_REPOSITORY" \
            --branch "$branch" --snapshot-digest "$snapshot_digest" "${superseded[@]}" \
            kernel --x86-ref "$KERNEL_RPMS_X86_64_REF" \
            --arm-ref "$KERNEL_RPMS_AARCH64_REF" | tee -a "$GITHUB_STEP_SUMMARY"
