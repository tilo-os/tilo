name: Snapshot / kernel

# Rebuilds Fedora's kernel with the Tilo config fragment. Pull requests
# validate the build; pushes to main, version tags and manual dispatches publish
# the resulting RPM image and propose the kernel pin.
#
# snapshot-rpms.yml also calls this workflow with a freshly published RPMS_REF.
# Such a run builds against that snapshot and proposes the RPM and kernel pins
# in one pull request, because kernel provenance binds RPMS_REF. A push that
# such a snapshot run will cover, or that only lands both pins, does not
# rebuild here.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "tools/ci/workflow_applicability.py"
      - "os/kernel/**"
      - "crates/system/tilo-crypto/**"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/derive-rpm-package-set.py"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/open-snapshot-pr.py"
      - "os/dev/login-registry-with-retry.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/build-kernel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "os/kernel/**"
      - "crates/system/tilo-crypto/**"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/derive-rpm-package-set.py"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/open-snapshot-pr.py"
      - "os/dev/login-registry-with-retry.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/build-kernel.yml"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
  workflow_dispatch:
    inputs:
      rpms_ref:
        description: Signed frozen RPM index to build against after a snapshot handoff
        required: false
        type: string
  workflow_call:
    inputs:
      rpms_ref:
        description: Signed frozen RPM index to build against and pin with the kernels
        required: true
        type: string
      publish:
        # Only snapshot-rpms.yml on main passes true. Publication (signing,
        # pushing tags, opening the pin pull request) also still requires
        # refs/heads/main, so no other caller can publish through this call.
        description: Sign, publish and propose the pins built by this call
        required: false
        default: false
        type: boolean

concurrency:
  group: build-kernel-${{ (startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main')) && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main')) }}

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/build-kernel.yml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before native work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/build-kernel.yml

  # Decide whether a push to main needs its own kernel publication.
  rebuild:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.rpms_ref }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      # Shallow: only this push and its predecessor are compared.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      # snapshot-rpms.yml runs for the same push when it touches a snapshot
      # input, and refreshes when the inputs differ from the pinned snapshot's
      # source. The same script answers both questions here.
      - name: Skip pushes whose kernels another run provides
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          needed=true
          reason='kernel inputs changed'
          snapshot_changed() {
            GITHUB_OUTPUT='' python3 os/dev/rpm-snapshot-inputs.py "$@" --head "$GITHUB_SHA" \
              | grep -Fq '"changed": true'
          }
          if git fetch --quiet --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
              && changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; then
            if [ "$(printf '%s\n' "$changed" | LC_ALL=C sort -u)" = "$(printf 'os/kernel-snapshot.env\nos/rpms-snapshot.env')" ]; then
              needed=false
              reason='this push only lands RPM and kernel pins built together'
            elif snapshot_changed --base "$BEFORE" && snapshot_changed --since-pin; then
              needed=false
              reason='snapshot-rpms.yml refreshes the RPM snapshot and rebuilds the kernels against it'
            fi
          else
            reason='cannot compare this push with its predecessor'
          fi
          echo "::notice::kernel rebuild needed=$needed: $reason"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  signing-preflight:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Bind kernel signing authority to pinned release identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          resolved="$RUNNER_TEMP/kernel-release-signing-authority.pub"
          cosign public-key --key "$COSIGN_KEY_REF" > "$resolved"
          cmp --silent keys/cosign.pub "$resolved" || {
            echo '::error::kernel KMS/HSM authority does not match keys/cosign.pub'
            exit 1
          }

  build-and-push-kernel:
    needs: [rebuild, signing-preflight, applicability]
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        (needs.rebuild.result == 'skipped' || needs.rebuild.outputs.needed == 'true') &&
        (needs.signing-preflight.result == 'success' || needs.signing-preflight.result == 'skipped')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner-disk-100g
            kernel_build_jobs: 6
          - arch: aarch64
            platform: linux/arm64
            runner: runner-disk-100g-arm64
            kernel_build_jobs: 4
    runs-on: ${{ matrix.runner }}
    enable-openid-connect: true
    # Finish before the existing three-hour runner/server deadline, leaving
    # room for cleanup and reporting. Measure/cache builds within this budget.
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require the selected native kernel architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"

      # The build FROMs the frozen RPM repo for its toolchain (rpm-build,
      # kernel-devel, gcc, ...) and the Fedora kernel SRPM.  Log in on every
      # run — build-only PRs also need registry read.
      - name: Log in to code.podesta.ai
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | \
            os/dev/login-registry-with-retry.sh \
              docker code.podesta.ai "$REGISTRY_USERNAME"

      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ matrix.arch }}

      # Same mirrored base as the OS image — the modules have to link against
      # the userspace the image ships (os/base-snapshot.env).
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      # A snapshot-rpms.yml call supplies the index it just published; every
      # other run builds against the pinned one. Either is verified below.
      - name: Load RPMS_REF (frozen package snapshot)
        env:
          CALLER_RPMS_REF: ${{ inputs.rpms_ref }}
        run: |
          if [ -n "$CALLER_RPMS_REF" ]; then
            echo "RPMS_REF=$CALLER_RPMS_REF" >> "$GITHUB_ENV"
          else
            grep '^RPMS_REF=' os/rpms-snapshot.env >> "$GITHUB_ENV"
          fi

      - name: Verify the signed RPM snapshot input
        run: |
          set -euo pipefail
          [[ "$RPMS_REF" =~ ^code\.podesta\.ai/qos/rpms@sha256:[0-9a-f]{64}$ ]] || {
            printf 'RPMS_REF is not the digest-pinned Tilo RPM repository\n' >&2
            exit 1
          }
          cosign verify --key keys/cosign.pub "$RPMS_REF" >/dev/null
          digest="${RPMS_REF##*@}"
          ./os/dev/derive-rpm-package-set.py --arch x86_64 | LC_ALL=C sort -u > package-roots-amd64.txt
          ./os/dev/derive-rpm-package-set.py --arch aarch64 | LC_ALL=C sort -u > package-roots-arm64.txt
          package_set_sha256="$(cat package-roots-amd64.txt package-roots-arm64.txt | LC_ALL=C sort -u | sha256sum | cut -d' ' -f1)"
          package_amd64_sha256="$(sha256sum package-roots-amd64.txt | cut -d' ' -f1)"
          package_arm64_sha256="$(sha256sum package-roots-arm64.txt | cut -d' ' -f1)"
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$RPMS_REF")"
          printf '%s' "$provenance" | jq -e --arg digest "$digest" \
            --arg base "$BASE_REF" --arg package_set_sha256 "$package_set_sha256" \
            --arg package_amd64_sha256 "$package_amd64_sha256" \
            --arg package_arm64_sha256 "$package_arm64_sha256" '
              [(if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
              | any(
                  ((.buildDefinition.buildType == "https://tilo.sh/buildtypes/frozen-rpm-index/v1")
                    or (.buildDefinition.buildType | endswith("/buildtypes/frozen-rpm-index/v1")))
                  and .buildDefinition.externalParameters.architectures == ["amd64", "arm64"]
                  and .buildDefinition.externalParameters.packageSetSha256 == $package_set_sha256
                  and .buildDefinition.externalParameters.packageSetSha256ByArchitecture
                    == {amd64: $package_amd64_sha256, arm64: $package_arm64_sha256}
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $base)
                )
            ' >/dev/null || {
              printf 'frozen RPM provenance does not bind its package set, digest, base, and architectures\n' >&2
              exit 1
            }

      # Reproducible: buildkit rewrites layer timestamps + the kernel's
      # KBUILD_BUILD_TIMESTAMP to SOURCE_DATE_EPOCH (see os/kernel/Containerfile).
      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Restore checksum-pinned kernel inputs
        id: kernel-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/kernel-cache
          key: kernel-assets-v2-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            kernel-assets-v2-
            kernel-assets-v1-

      - name: Materialize immutable kernel inputs
        env:
          TILO_GITHUB_ASSET_CACHE: os/external-assets/kernel-cache
        run: |
          ./os/dev/cache-github-assets.sh v4l2loopback-0.15.3-a7e4a4d.tar.gz \
            "sccache-v0.17.0-${{ matrix.arch }}-unknown-linux-musl.tar.gz"

      - name: Save checksum-pinned kernel inputs immediately
        if: steps.kernel-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/kernel-cache
          key: kernel-assets-v2-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      # Every CI pool provides the same S3 compiler cache and a bucket-scoped
      # credential. The kernel compile requires it, so a dead cache fails
      # instead of silently compiling the whole tree again.
      - name: Bind the runner compiler cache
        run: |
          set -euo pipefail
          for name in SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_USE_SSL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            value="${!name:-}"
            if [[ -z $value || $value == *$'\n'* ]]; then
              echo "::error::runner compiler cache setting $name is missing"
              exit 1
            fi
          done
          {
            printf 'KERNEL_SCCACHE_BUCKET=%s\n' "$SCCACHE_BUCKET"
            printf 'KERNEL_SCCACHE_ENDPOINT=%s\n' "$SCCACHE_ENDPOINT"
            printf 'KERNEL_SCCACHE_REGION=%s\n' "$SCCACHE_REGION"
            printf 'KERNEL_SCCACHE_S3_USE_SSL=%s\n' "$SCCACHE_S3_USE_SSL"
          } >> "$GITHUB_ENV"

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          driver-opts: |
            memory=9g
            memory-swap=9g

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.podesta.ai/qos/tilo-kernel
          tags: |
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-${{ matrix.arch }}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pr-${{ github.event.number }}-${{ matrix.arch }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=dispatch-${{ github.sha }}-${{ matrix.arch }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main' }}

      - name: Start kernel build timing
        run: echo "KERNEL_BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # A shared Docker daemon can still hold this commit's image from an
      # earlier attempt; the registry-push retry below must never publish it.
      - name: Discard any earlier local image for this commit
        run: docker image rm -f 'code.podesta.ai/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}' >/dev/null 2>&1 || true

      # Publication runs push; pull requests only build and load. A failure
      # always reaches the next step, which retries only a publication push
      # of a completed build and otherwise fails the job.
      - name: Build the tilo-kernel image (push only on tags/dispatch)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/kernel/Containerfile
          build-contexts: |
            github-assets=os/external-assets/kernel-cache
          platforms: ${{ matrix.platform }}
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            code.podesta.ai/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
            KERNEL_BUILD_JOBS=${{ matrix.kernel_build_jobs }}
            SCCACHE_BUCKET=${{ env.KERNEL_SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.KERNEL_SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.KERNEL_SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.KERNEL_SCCACHE_S3_USE_SSL }}
            TILO_REQUIRE_COMPILER_CACHE=1
          secret-envs: |
            aws_access_key_id=AWS_ACCESS_KEY_ID
            aws_secret_access_key=AWS_SECRET_ACCESS_KEY
          cache-from: type=registry,ref=code.podesta.ai/qos/tilo-kernel-buildcache:${{ matrix.arch }}
          # PRs consume the shared cache but do not update it: exporting cache
          # work can outlive a successful compile and exhaust the runner's
          # hard deadline. Main/tag/dispatch builds refresh final-stage
          # dependencies only; mode=max duplicates the multi-GiB source tree.
          # ignore-error: a cache write failure must not fail a build whose
          # image was already pushed; the next run simply starts colder.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=code.podesta.ai/qos/tilo-kernel-buildcache:{0},mode=min,ignore-error=true', matrix.arch) || '' }}
          provenance: false

      # The build step never fails the job itself (continue-on-error), so
      # this runs whenever the build ran and is skipped with it otherwise.
      - name: Report kernel build resource metrics
        if: ${{ steps.build.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          cpu_max=unavailable
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            cpu_max=$(tr ' ' '/' < /sys/fs/cgroup/cpu.max)
          fi
          elapsed_seconds=$(( $(date +%s) - KERNEL_BUILD_STARTED_AT ))
          {
            echo "## Kernel build resources (${{ matrix.arch }})"
            echo ""
            echo "- configured jobs: ${{ matrix.kernel_build_jobs }}"
            echo "- visible CPUs: $(nproc)"
            echo "- cgroup cpu.max: $cpu_max"
            echo "- elapsed seconds: $elapsed_seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reached only when the build step failed. Pull request builds do not
      # push, so their failure is always fatal. The image is loaded before
      # buildx pushes it, so a present local image means the compile
      # succeeded and only the registry write failed; an absent one is a real
      # build failure and stays fatal.
      - name: Retry the registry push of the completed build
        id: push-retry
        if: ${{ steps.build.outcome == 'failure' }}
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
          LOCAL_IMAGE: code.podesta.ai/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ "$PUBLISH" = true ] || {
            echo '::error::the kernel image build failed'
            exit 1
          }
          docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1 || {
            echo '::error::the kernel image build failed before producing an image'
            exit 1
          }
          digest=''
          for attempt in 1 2 3; do
            if log="$(docker push "$LOCAL_IMAGE" 2>&1)"; then
              printf '%s\n' "$log"
              digest="$(printf '%s\n' "$log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1)"
              break
            fi
            printf '%s\n' "$log" >&2
            [ "$attempt" -lt 3 ] || { echo '::error::registry push failed after 3 attempts'; exit 1; }
            sleep $((attempt * 30))
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::registry push did not report a manifest digest'
            exit 1
          }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$LOCAL_IMAGE" "$tag"
            for attempt in 1 2 3; do
              docker push "$tag" && break
              [ "$attempt" -lt 3 ] || { echo "::error::could not push $tag"; exit 1; }
              sleep $((attempt * 30))
            done
          done <<< "$PUBLISH_TAGS"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve the published kernel digest
        id: published
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RETRY_DIGEST: ${{ steps.push-retry.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$BUILD_OUTCOME" = success ]; then digest="$BUILD_DIGEST"; else digest="$RETRY_DIGEST"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::no published kernel manifest digest'
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install native kernel acceptance tools
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            aarch64)
              apt_qemu=qemu-system-arm
              fedora_qemu=qemu-system-aarch64
              apt_firmware=qemu-efi-aarch64
              fedora_firmware=edk2-aarch64
              ;;
            x86_64)
              apt_qemu=qemu-system-x86
              fedora_qemu=qemu-system-x86
              apt_firmware=ovmf
              fedora_firmware=edk2-ovmf
              ;;
            *) exit 2;;
          esac
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends gcc libc6-dev binutils cpio gzip kmod python3 rpm rpm2cpio zstd dosfstools mtools "$apt_qemu" "$apt_firmware"
          else
            sudo -n dnf install -y gcc glibc-devel binutils cpio gzip kmod python3 rpm zstd dosfstools mtools "$fedora_qemu" "$fedora_firmware"
          fi

      - name: Boot the packaged native kernel and verify module signatures
        run: |
          set -euo pipefail
          mkdir kernel-repo
          container=$(docker create 'code.podesta.ai/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}' /bin/true)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container":/repo/. kernel-repo/
          shopt -s nullglob
          packages=(kernel-repo/tilo-kernel-core-*.rpm)
          test "${#packages[@]}" -eq 1
          bash os/kernel/tests/test-rpm.sh "${packages[0]}" kernel-acceptance

      - name: Preserve kernel acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: kernel-acceptance-${{ matrix.arch }}
          path: |
            kernel-repo/tilo-kernel-core-*.rpm
            kernel-acceptance/serial.log
            kernel-acceptance/inputs.json
            kernel-acceptance/rpm.sha256
          if-no-files-found: warn

      - name: Prove firmware rejects unsigned EFI and executes the signed image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/tilo-secureboot-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx build --file os/kernel/Containerfile \
            --target secureboot-probe-inputs \
            --build-context github-assets=os/external-assets/kernel-cache \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --build-arg "BASE_REF=$BASE_REF" \
            --build-arg "RPMS_REF=$RPMS_REF" \
            --build-arg "KERNEL_BUILD_JOBS=${{ matrix.kernel_build_jobs }}" \
            --build-arg "SCCACHE_BUCKET=$KERNEL_SCCACHE_BUCKET" \
            --build-arg "SCCACHE_ENDPOINT=$KERNEL_SCCACHE_ENDPOINT" \
            --build-arg "SCCACHE_REGION=$KERNEL_SCCACHE_REGION" \
            --build-arg "SCCACHE_S3_USE_SSL=$KERNEL_SCCACHE_S3_USE_SSL" \
            --build-arg TILO_REQUIRE_COMPILER_CACHE=1 \
            --secret id=aws_access_key_id,env=AWS_ACCESS_KEY_ID \
            --secret id=aws_secret_access_key,env=AWS_SECRET_ACCESS_KEY \
            --output "type=local,dest=$probe" .
          TILO_KERNEL_PATH="$probe/vmlinuz" \
          TILO_GEN_INIT_CPIO="$probe/gen_init_cpio" \
          TILO_CRYPTO_BIN="$probe/tilo-crypto" \
          TILO_SECUREBOOT_VM_APP="$probe/secureboot_vm_app.efi" \
          TILO_SECUREBOOT_VM_ARCH="${{ matrix.arch }}" \
          TILO_SECUREBOOT_VM_WORK_ROOT="$RUNNER_TEMP" \
            bash os/tests/secureboot_vm_probe.sh

      # Use the same non-exportable release identity and transparency policy as
      # the OS image. The OS image build verifies this signature before it
      # `dnf swap`s the kernel in — see os/etc/containers/policy.json for
      # the trust root.
      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          ref="code.podesta.ai/qos/tilo-kernel@${{ steps.published.outputs.digest }}"
          digest='${{ steps.published.outputs.digest }}'
          jq -n \
            --arg source "git+ssh://code.podesta.ai/qos/qos@$GITHUB_SHA" \
            --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg base "$BASE_REF" \
            --arg rpms "$RPMS_REF" \
            --arg epoch "$SOURCE_DATE_EPOCH" '
              {
                buildDefinition: {
                  buildType: "https://tilo.sh/buildtypes/kernel-rpm/v1",
                  externalParameters: {architecture: $architecture},
                  internalParameters: {
                    sourceDateEpoch: ($epoch | tonumber),
                    expectedReleaseDigest: $digest
                  },
                  resolvedDependencies: [
                    {uri: $source}, {uri: $base}, {uri: $rpms}
                  ]
                },
                runDetails: {
                  builder: {id: "https://code.podesta.ai/qos/forgejo/actions/kernel-release-v1"},
                  metadata: {invocationId: env.GITHUB_RUN_ID}
                }
              }
            ' > kernel-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign attest --yes --key "$COSIGN_KEY_REF" \
            --predicate kernel-provenance.json --type slsaprovenance1 "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$ref")"
          printf '%s' "$provenance" | jq -e \
            --arg source "$GITHUB_SHA" --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg base "$BASE_REF" --arg rpms "$RPMS_REF" '
              [(if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
              | any(
                  .buildDefinition.buildType == "https://tilo.sh/buildtypes/kernel-rpm/v1"
                  and .buildDefinition.externalParameters.architecture == $architecture
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?;
                    .uri == ("git+ssh://code.podesta.ai/qos/qos@" + $source))
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $base)
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $rpms)
                )
            ' >/dev/null

      - name: Report the new digest to commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main') }}
        run: |
          ref="code.podesta.ai/qos/tilo-kernel@${{ steps.published.outputs.digest }}"
          # Promotion reads KERNEL_RPMS_X86_64_REF / KERNEL_RPMS_AARCH64_REF.
          variable="KERNEL_RPMS_$(printf '%s' '${{ matrix.arch }}' | tr '[:lower:]' '[:upper:]')_REF"
          case "$variable" in
            KERNEL_RPMS_X86_64_REF|KERNEL_RPMS_AARCH64_REF) ;;
            *) echo "::error::unexpected kernel pin variable $variable"; exit 1 ;;
          esac
          mkdir -p refs
          printf '%s=%s\n' "$variable" "$ref" > "refs/${{ matrix.arch }}.env"
          echo "::notice::tilo-kernel ${{ matrix.arch }} published. Set os/kernel-snapshot.env to: $variable=$ref"
          {
            echo "## tilo-kernel published"
            echo ""
            echo 'Commit this to `os/kernel-snapshot.env`:'
            echo ""
            echo '```'
            echo "$variable=$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve native digest for atomic promotion
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-kernel-${{ matrix.arch }}
          path: refs/${{ matrix.arch }}.env

      - name: Revoke local registry login
        if: ${{ always() }}
        run: docker logout code.podesta.ai >/dev/null 2>&1 || true

  promote-native-kernels:
    needs: build-and-push-kernel
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish)) && github.ref == 'refs/heads/main' }}
    runs-on: runner
    timeout-minutes: 60
    env:
      KERNEL_SNAPSHOT_INPUTS: |
        os/kernel
        crates/system/tilo-crypto
        os/base-snapshot.env
        os/rpms-snapshot.env
        os/dev/assert-native-arch.sh
        os/dev/derive-rpm-package-set.py
        os/dev/open-snapshot-pr.py
        os/dev/login-registry-with-retry.sh
        .forgejo/workflows/build-kernel.yml
    steps:
      - name: Checkout main for atomic pin promotion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Download both verified native references
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: refs
      - name: Propose both kernel pins atomically through protected main
        env:
          # Set when snapshot-rpms.yml called this run. The kernels were built
          # against that new index, so its pin lands in the same pull request.
          CALLER_RPMS_REF: ${{ inputs.rpms_ref }}
          # The automatic job token pushes the branch. Neither it nor
          # REGISTRY_TOKEN may use the pull-request API (Forgejo answers 404),
          # so open the PR with RELEASE_TOKEN, which has repository scope; a PR
          # opened by a real account also triggers its own required checks.
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          x86="$(find refs -type f -name x86_64.env -print -quit)"
          arm="$(find refs -type f -name aarch64.env -print -quit)"
          test -n "$x86" && test -n "$arm"
          . "$x86"
          . "$arm"
          for ref in "$KERNEL_RPMS_X86_64_REF" "$KERNEL_RPMS_AARCH64_REF"; do
            [[ "$ref" =~ ^code\.podesta\.ai/qos/tilo-kernel@sha256:[0-9a-f]{64}$ ]]
          done
          [ "$KERNEL_RPMS_X86_64_REF" != "$KERNEL_RPMS_AARCH64_REF" ] || {
            printf 'native kernel builds unexpectedly produced one shared manifest\n' >&2
            exit 1
          }
          pins=(os/kernel-snapshot.env)
          if [ -n "$CALLER_RPMS_REF" ]; then
            [[ "$CALLER_RPMS_REF" =~ ^code\.podesta\.ai/qos/rpms@sha256:[0-9a-f]{64}$ ]]
            pins=(os/rpms-snapshot.env os/kernel-snapshot.env)
          fi
          # Pin on the current main tip. A standalone kernel pin binds main's
          # RPM pin, so it lands only while every kernel input is unchanged. A
          # combined pin carries its own RPM snapshot, consistent with these
          # kernels: it lands whenever it is newer than main's pin, and if
          # inputs moved meanwhile the next refresh is requested below.
          git fetch --no-tags origin main
          mapfile -t inputs < <(printf '%s' "$KERNEL_SNAPSHOT_INPUTS")
          moved=false
          git diff --quiet "$GITHUB_SHA..FETCH_HEAD" -- "${inputs[@]}" || moved=true
          if [ -z "$CALLER_RPMS_REF" ] && [ "$moved" = true ]; then
            printf 'kernel inputs changed during promotion; refusing stale PR\n' >&2
            exit 1
          fi
          if [ -n "$CALLER_RPMS_REF" ]; then
            if ! python3 os/dev/rpm-snapshot-inputs.py \
                --base "$GITHUB_SHA" --head FETCH_HEAD --require-newer-than-pin; then
              printf 'main already pins an RPM snapshot at least as new as this one\n' >&2
              exit 1
            fi
            python3 os/dev/rpm-snapshot-inputs.py \
              --base "$GITHUB_SHA" --head FETCH_HEAD --require-equivalent || moved=true
          fi
          git checkout --detach FETCH_HEAD
          if [ -n "$CALLER_RPMS_REF" ]; then
            printf '%s\n' \
              '# Digest-pinned frozen RPM repository used by os/Containerfile.' \
              '# Updated by the snapshot-rpms workflow when the package set changes.' \
              "RPMS_REF=$CALLER_RPMS_REF" \
              "RPMS_SOURCE_REVISION=$GITHUB_SHA" > os/rpms-snapshot.env
          fi
          printf '%s\n' \
            '# Per-architecture Tilo kernel RPM repositories, signed and pinned by digest.' \
            '# Updated atomically by build-kernel.yml after both native builds verify.' \
            "KERNEL_RPMS_X86_64_REF=$KERNEL_RPMS_X86_64_REF" \
            "KERNEL_RPMS_AARCH64_REF=$KERNEL_RPMS_AARCH64_REF" \
            > os/kernel-snapshot.env
          git config user.name 'Tilo CI'
          git config user.email 'ci@tilo.invalid'
          git add "${pins[@]}"
          if git diff --cached --quiet; then exit 0; fi
          snapshot_digest="$(cat "${pins[@]}" | sha256sum | awk '{print $1}')"
          [[ "$snapshot_digest" =~ ^[0-9a-f]{64}$ ]]
          if [ -n "$CALLER_RPMS_REF" ]; then
            git commit -m 'build(os): refresh the RPM snapshot and its native kernels'
            branch="automation/rpm-kernel-snapshot-${snapshot_digest:0:16}"
            snapshot=(kernel --rpms-ref "$CALLER_RPMS_REF" --rpms-source-revision "$GITHUB_SHA")
          else
            git commit -m 'build(os): refresh native kernel snapshots'
            branch="automation/kernel-snapshot-${snapshot_digest:0:16}"
            snapshot=(kernel)
          fi
          remote_tip="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if ! git push --force-with-lease="refs/heads/$branch:$remote_tip" \
              origin "HEAD:refs/heads/$branch" 2> push.log; then
            cat push.log >&2
            if grep -Fq 'stale info' push.log; then
              echo "::error::$branch moved on the remote during promotion (lease lost); rerun to adopt it"
            else
              echo "::error::Forgejo refused the snapshot pin push to $branch (see the git output above)"
            fi
            exit 1
          fi
          cat push.log >&2
          # A combined pin supersedes every open automation pin pull request
          # whose RPM snapshot comes from an earlier commit (or records none):
          # merging one of those later would only regress main.
          superseded=()
          if [ -n "$CALLER_RPMS_REF" ]; then
            git fetch --no-tags --prune origin '+refs/heads/automation/*:refs/remotes/origin/automation/*'
            while IFS= read -r candidate; do
              [ "$candidate" != "$branch" ] || continue
              source="$(git show "origin/$candidate:os/rpms-snapshot.env" 2>/dev/null \
                | sed -n 's/^RPMS_SOURCE_REVISION=//p')" || continue
              if [ -z "$source" ] || { [ "$source" != "$GITHUB_SHA" ] \
                  && git merge-base --is-ancestor "$source" "$GITHUB_SHA" 2>/dev/null; }; then
                superseded+=(--supersede "$candidate")
              fi
            done < <(git for-each-ref --format='%(refname:strip=3)' \
              'refs/remotes/origin/automation/rpm-kernel-snapshot-*' \
              'refs/remotes/origin/automation/rpm-snapshot-*' \
              'refs/remotes/origin/automation/kernel-snapshot-*')
          fi
          python3 os/dev/open-snapshot-pr.py \
            --server "$GITHUB_SERVER_URL" --repository "$GITHUB_REPOSITORY" \
            --branch "$branch" --snapshot-digest "$snapshot_digest" "${superseded[@]}" \
            "${snapshot[@]}" --x86-ref "$KERNEL_RPMS_X86_64_REF" \
            --arm-ref "$KERNEL_RPMS_AARCH64_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          # These pins are consistent with each other but older than main's
          # inputs. Request the refresh that catches up; it supersedes this PR.
          if [ "$moved" = true ]; then
            echo '::notice::inputs moved on main during the build; requesting the next snapshot refresh'
            curl --fail --silent --show-error -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" -H 'Content-Type: application/json' \
              --data '{"ref":"main"}' \
              "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/actions/workflows/snapshot-rpms.yml/dispatches" \
              || echo '::warning::could not dispatch snapshot-rpms.yml; dispatch it by hand to catch up'
          fi
