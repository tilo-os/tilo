name: Snapshot / kernel

# Rebuilds Fedora's kernel with the Tilo config fragment. Pushes and pull
# requests validate the build; version tags and manual dispatches publish the
# resulting RPM image.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "os/kernel/**"
      - "crates/system/tilo-crypto/**"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/build-kernel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "os/kernel/**"
      - "crates/system/tilo-crypto/**"
      - "os/tests/kernel_module_signing_test.sh"
      - "os/tests/kernel_runtime_probe.*"
      - "os/tests/secureboot_vm_*"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/build-kernel.yml"
  workflow_dispatch:

concurrency:
  group: build-kernel-${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}

jobs:
  build-and-push-kernel:
    timeout-minutes: 600
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: imager-linux-x86_64
          - arch: aarch64
            runner: imager-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require the selected native kernel architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"

      # The build FROMs the frozen RPM repo for its toolchain (rpm-build,
      # kernel-devel, gcc, ...) and the Fedora kernel SRPM.  Log in on every
      # run — build-only PRs also need registry read.
      - name: Log in to code.sandbox.example
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same mirrored base as the OS image — the modules have to link against
      # the userspace the image ships (os/base-snapshot.env).
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Load RPMS_REF (frozen package snapshot)
        run: grep '^RPMS_REF=' os/rpms-snapshot.env >> "$GITHUB_ENV"

      # Reproducible: buildkit rewrites layer timestamps + the kernel's
      # KBUILD_BUILD_TIMESTAMP to SOURCE_DATE_EPOCH (see os/kernel/Containerfile).
      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.sandbox.example/tilo/tilo-kernel
          tags: |
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-${{ matrix.arch }}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pr-${{ github.event.number }}-${{ matrix.arch }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=dispatch-${{ github.sha }}-${{ matrix.arch }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      # push:true only on tags/dispatch — same guardrail as build-image.yml
      # so main-branch commits verify without touching the registry.
      - name: Build the tilo-kernel image (push only on tags/dispatch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/kernel/Containerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
          cache-from: type=registry,ref=code.sandbox.example/tilo/tilo-kernel-buildcache:${{ matrix.arch }}
          # The kernel builder's intermediate source tree is tens of GiB.
          # Export only final-stage dependencies: mode=max duplicated that
          # tree during export and exhausted the runner after a successful
          # compile.
          cache-to: type=registry,ref=code.sandbox.example/tilo/tilo-kernel-buildcache:${{ matrix.arch }},mode=min
          provenance: false

      - name: Prove firmware rejects unsigned EFI and executes the signed image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/tilo-secureboot-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx build --file os/kernel/Containerfile \
            --target secureboot-probe-inputs \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --build-arg "BASE_REF=$BASE_REF" \
            --build-arg "RPMS_REF=$RPMS_REF" \
            --output "type=local,dest=$probe" .
          TILO_KERNEL_PATH="$probe/vmlinuz" \
          TILO_GEN_INIT_CPIO="$probe/gen_init_cpio" \
          TILO_CRYPTO_BIN="$probe/tilo-crypto" \
          TILO_SECUREBOOT_VM_APP="$probe/secureboot_vm_app.efi" \
          TILO_SECUREBOOT_VM_ARCH="${{ matrix.arch }}" \
          TILO_SECUREBOOT_VM_WORK_ROOT="$RUNNER_TEMP" \
            bash os/tests/secureboot_vm_probe.sh

      # Use the same non-exportable release identity and transparency policy as
      # the OS image. The OS image build verifies this signature before it
      # `dnf swap`s the kernel in — see os/etc/containers/policy.json for
      # the trust root.
      - name: Restore checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        id: cosign-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            cosign-v2.5.2-${{ matrix.arch }}-
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          TILO_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Save checksum-pinned Cosign immediately
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.cosign-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          ref="code.sandbox.example/tilo/tilo-kernel@${{ steps.build.outputs.digest }}"
          digest='${{ steps.build.outputs.digest }}'
          jq -n \
            --arg source "git+ssh://code.sandbox.example/tilo/tilo@$GITHUB_SHA" \
            --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg base "$BASE_REF" \
            --arg rpms "$RPMS_REF" \
            --arg epoch "$SOURCE_DATE_EPOCH" '
              {
                buildDefinition: {
                  buildType: "https://tilo.dev/buildtypes/kernel-rpm/v1",
                  externalParameters: {architecture: $architecture},
                  internalParameters: {
                    sourceDateEpoch: ($epoch | tonumber),
                    expectedReleaseDigest: $digest
                  },
                  resolvedDependencies: [
                    {uri: $source}, {uri: $base}, {uri: $rpms}
                  ]
                },
                runDetails: {
                  builder: {id: "https://code.sandbox.example/tilo/forgejo/actions/kernel-release-v1"},
                  metadata: {invocationId: env.GITHUB_RUN_ID}
                }
              }
            ' > kernel-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign attest --yes --key "$COSIGN_KEY_REF" \
            --predicate kernel-provenance.json --type slsaprovenance1 "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$ref")"
          printf '%s' "$provenance" | jq -e \
            --arg source "$GITHUB_SHA" --arg digest "$digest" \
            --arg architecture '${{ matrix.arch }}' \
            --arg base "$BASE_REF" --arg rpms "$RPMS_REF" '
              [.[].payload | @base64d | fromjson | .predicate]
              | any(
                  .buildDefinition.buildType == "https://tilo.dev/buildtypes/kernel-rpm/v1"
                  and .buildDefinition.externalParameters.architecture == $architecture
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?;
                    .uri == ("git+ssh://code.sandbox.example/tilo/tilo@" + $source))
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $base)
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $rpms)
                )
            ' >/dev/null

      - name: Report the new digest to commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: |
          ref="code.sandbox.example/tilo/tilo-kernel@${{ steps.build.outputs.digest }}"
          variable=KERNEL_RPMS_${{ matrix.arch }}_REF
          mkdir -p refs
          printf '%s=%s\n' "$variable" "$ref" > "refs/${{ matrix.arch }}.env"
          echo "::notice::tilo-kernel ${{ matrix.arch }} published. Set os/kernel-snapshot.env to: $variable=$ref"
          {
            echo "## tilo-kernel published"
            echo ""
            echo 'Commit this to `os/kernel-snapshot.env`:'
            echo ""
            echo '```'
            echo "$variable=$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve native digest for atomic promotion
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-kernel-${{ matrix.arch }}
          path: refs/${{ matrix.arch }}.env

  promote-native-kernels:
    needs: build-and-push-kernel
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: runner
    timeout-minutes: 60
    env:
      KERNEL_SNAPSHOT_INPUTS: |
        os/kernel
        crates/system/tilo-crypto
        os/base-snapshot.env
        os/rpms-snapshot.env
        os/dev/assert-native-arch.sh
        .forgejo/workflows/build-kernel.yml
    steps:
      - name: Checkout main for atomic pin promotion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Download both verified native references
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: refs
      - name: Advance both kernel pins atomically
        run: |
          set -euo pipefail
          x86="$(find refs -type f -name x86_64.env -print -quit)"
          arm="$(find refs -type f -name aarch64.env -print -quit)"
          test -n "$x86" && test -n "$arm"
          . "$x86"
          . "$arm"
          for ref in "$KERNEL_RPMS_X86_64_REF" "$KERNEL_RPMS_AARCH64_REF"; do
            [[ "$ref" =~ ^code\.podesta\.ai/tilo/tilo-kernel@sha256:[0-9a-f]{64}$ ]]
          done
          [ "$KERNEL_RPMS_X86_64_REF" != "$KERNEL_RPMS_AARCH64_REF" ] || {
            printf 'native kernel builds unexpectedly produced one shared manifest\n' >&2
            exit 1
          }
          git fetch --no-tags origin main
          mapfile -t inputs < <(printf '%s' "$KERNEL_SNAPSHOT_INPUTS")
          if ! git diff --quiet "$GITHUB_SHA..origin/main" -- "${inputs[@]}"; then
            printf 'kernel inputs changed while native builds ran; refusing stale promotion\n' >&2
            exit 1
          fi
          printf '%s\n' \
            '# Per-architecture Tilo kernel RPM repositories, signed and pinned by digest.' \
            '# Updated atomically by build-kernel.yml after both native builds verify.' \
            "KERNEL_RPMS_X86_64_REF=$KERNEL_RPMS_X86_64_REF" \
            "KERNEL_RPMS_AARCH64_REF=$KERNEL_RPMS_AARCH64_REF" \
            > os/kernel-snapshot.env
          git config user.name 'Tilo CI'
          git config user.email 'ci@tilo.invalid'
          git add os/kernel-snapshot.env
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'os: refresh native kernel snapshots'
          git pull --rebase origin main
          if ! git diff --quiet "$GITHUB_SHA..origin/main" -- "${inputs[@]}"; then
            printf 'kernel inputs changed during promotion; refusing stale push\n' >&2
            exit 1
          fi
          git push origin HEAD:main
