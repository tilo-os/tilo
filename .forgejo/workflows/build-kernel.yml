name: Snapshot / kernel

# Rebuilds Fedora's kernel with the Tilo config fragment. Pushes and pull
# requests validate the build; version tags and manual dispatches publish the
# resulting RPM image.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "os/kernel/**"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/promote-native-index.py"
      - ".forgejo/workflows/build-kernel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "os/kernel/**"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/promote-native-index.py"
      - ".forgejo/workflows/build-kernel.yml"
  workflow_dispatch:

concurrency:
  group: build-kernel-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}

jobs:
  build-and-push-kernel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner-disk-100g
          - arch: aarch64
            platform: linux/arm64
            runner: runner-disk-100g-arm64
    runs-on: ${{ matrix.runner }}
    # Finish before the existing three-hour runner/server deadline, leaving
    # room for cleanup and reporting. Measure/cache builds within this budget.
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      # The build FROMs the frozen RPM repo for its toolchain (rpm-build,
      # kernel-devel, gcc, ...) and the Fedora kernel SRPM.  Log in on every
      # run — build-only PRs also need registry read.
      - name: Log in to code.sandbox.example
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same mirrored base as the OS image — the modules have to link against
      # the userspace the image ships (os/base-snapshot.env).
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Load RPMS_REF (frozen package snapshot)
        run: grep '^RPMS_REF=' os/rpms-snapshot.env >> "$GITHUB_ENV"

      # Reproducible: buildkit rewrites layer timestamps + the kernel's
      # KBUILD_BUILD_TIMESTAMP to SOURCE_DATE_EPOCH (see os/kernel/Containerfile).
      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          # BuildKit is a sibling of the workflow container. Bound it explicitly
          # within the 10 GiB DinD budget; this margin is not a proven peak.
          # https://docs.docker.com/build/builders/drivers/docker-container/
          driver-opts: |
            memory=9g
            memory-swap=9g

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.sandbox.example/qos/tilo-kernel
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            # workflow_dispatch off a non-main branch — without this, the
            # metadata step emits zero tags and the push fails "tag is
            # needed". Derives a "<branch>-<short-sha>" tag so a manual
            # dispatch from a feature branch still produces a discoverable
            # artifact.
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      # push:true only on tags/dispatch — same guardrail as build-image.yml
      # so main-branch commits verify without touching the registry.
      - name: Build the tilo-kernel image (push only on tags/dispatch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/kernel/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: code.sandbox.example/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
            KERNEL_BUILD_JOBS=2
          cache-from: type=registry,ref=code.sandbox.example/qos/tilo-kernel-buildcache:${{ matrix.arch }}
          # The kernel builder's intermediate source tree is tens of GiB.
          # Export only final-stage dependencies: mode=max duplicated that
          # tree during export and exhausted the runner after a successful
          # compile.
          cache-to: type=registry,ref=code.sandbox.example/qos/tilo-kernel-buildcache:${{ matrix.arch }},mode=min
          provenance: false

      - name: Install native kernel acceptance tools
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            aarch64) apt_qemu=qemu-system-arm; fedora_qemu=qemu-system-aarch64;;
            x86_64) apt_qemu=qemu-system-x86; fedora_qemu=qemu-system-x86;;
            *) exit 2;;
          esac
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends gcc libc6-dev binutils cpio gzip python3 rpm rpm2cpio "$apt_qemu"
          else
            sudo -n dnf install -y gcc glibc-devel binutils cpio gzip python3 rpm "$fedora_qemu"
          fi

      - name: Boot the packaged native kernel and verify module signatures
        run: |
          set -euo pipefail
          mkdir kernel-repo
          container=$(docker create 'code.sandbox.example/qos/tilo-kernel:native-${{ github.sha }}-${{ matrix.arch }}' /bin/true)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container":/repo/. kernel-repo/
          shopt -s nullglob
          packages=(kernel-repo/tilo-kernel-core-*.rpm)
          test "${#packages[@]}" -eq 1
          bash os/kernel/tests/test-rpm.sh "${packages[0]}" kernel-acceptance

      - name: Preserve kernel acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: kernel-acceptance-${{ matrix.arch }}
          path: |
            kernel-acceptance/serial.log
            kernel-acceptance/inputs.json
            kernel-acceptance/rpm.sha256
          if-no-files-found: warn

      # Sign each immutable child before the promotion job verifies both.
      - name: Restore checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        id: cosign-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            cosign-v2.5.2-${{ matrix.arch }}-
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          TILO_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Save checksum-pinned Cosign immediately
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.cosign-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            "code.sandbox.example/qos/tilo-kernel@${{ steps.build.outputs.digest }}"

      - name: Record the signed native child
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          CHILD_ARCH: ${{ matrix.arch }}
          CHILD_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p native-child
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("native-child/child.json").write_text(json.dumps({
              "architecture": os.environ["CHILD_ARCH"],
              "digest": os.environ["CHILD_DIGEST"],
              "sourceRevision": os.environ["GITHUB_SHA"],
          }))
          Path("native-child/tags.txt").write_text(os.environ["RELEASE_TAGS"] + "\n")
          PY

      - name: Upload the native child descriptor
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: kernel-native-${{ matrix.arch }}
          path: native-child/
          if-no-files-found: error

  promote-kernel:
    timeout-minutes: 60
    needs: build-and-push-kernel
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download native child descriptors
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: native-children
      - name: Log in to code.sandbox.example
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Install publication tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends podman skopeo
          else
            sudo -n dnf install -y podman skopeo
          fi
      - name: Verify and promote the complete native index
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cmp native-children/kernel-native-x86_64/tags.txt native-children/kernel-native-aarch64/tags.txt
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [[ "$tag" == code.sandbox.example/qos/tilo-kernel:* ]]
            tags+=(--tag "${tag#code.sandbox.example/qos/tilo-kernel:}")
          done < native-children/kernel-native-x86_64/tags.txt
          python3 os/dev/promote-native-index.py \
            --repository code.sandbox.example/qos/tilo-kernel "${tags[@]}" \
            --revision "$GITHUB_SHA" --descriptors native-children \
            --signing-key env://COSIGN_PRIVATE_KEY --output kernel-index.txt
          echo "KERNEL_RPMS_REF=$(cat kernel-index.txt)" >> "$GITHUB_STEP_SUMMARY"
