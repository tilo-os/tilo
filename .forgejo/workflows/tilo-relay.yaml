name: Release / relay

# Builds the standalone tilo-relay container image (see
# os/containers/tilo-relay/Containerfile). Same publish cadence as
# the full OS image: PRs and pushes to main build-only; a version
# tag (`v*`) or a manual dispatch pushes to the registry.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "apps/calculator/**"
      - "apps/chat/**"
      - "apps/notes/**"
      - "apps/word-processor/**"
      - "crates/browser/qos-browser-runtime/**"
      - "crates/collab/actions/**"
      - "crates/collab/channel-crypto/**"
      - "crates/collab/qos-peer-state/**"
      - "crates/collab/reference/**"
      - "crates/collab/tilo-callstream/**"
      - "crates/dev/headless-schema/**"
      - "crates/dev/ui-graph/**"
      - "crates/doc/qdoc-epub/**"
      - "crates/doc/qdoc-html/**"
      - "crates/doc/qdoc-pdf/**"
      - "crates/doc/qdoc-rtf/**"
      - "crates/media/core/**"
      - "crates/packaging/install-artifacts/**"
      - "crates/runtime/cli/**"
      - "crates/runtime/runtime-collab/**"
      - "crates/runtime/runtime-portal-xdg/**"
      - "crates/sdk/tilo-app/**"
      - "crates/sdk/ui-core/**"
      - "crates/session/qos-desktop/**"
      - "crates/session/qos-ntfs-protocol/**"
      - "crates/system/app-state/**"
      - "crates/system/desktop-policy/**"
      - "crates/system/folder-service/**"
      - "crates/system/tilo-startup-metrics/**"
      - "crates/system/tts/**"
      - "crates/text/spellcheck/**"
      - "vendor/automerge/**"
      - "vendor/hexane/**"
      - "crates/agent/control-protocol/**"
      - "vendor/vello/**"
      - "vendor/vello_encoding/**"
      - "vendor/vello_shaders/**"
      - "vendor/winit/**"
      - "tools/ci/workflow_applicability.py"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keys/cosign.pub"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/dev/verify-rpm-snapshot-package-set.sh"
      - "os/dev/verify-rpm-snapshot-buildkit.py"
      - "os/tests/test_rpm_snapshot_buildkit.py"
      - "crates/hosting/tilo-relay/**"
      - "os/containers/tilo-relay/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/doc/qdoc/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/install/**"
      - "crates/packaging/launcher/**"
      - "crates/packaging/tilo-app-package/**"
      - "crates/packaging/runtime-bundle/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-identity/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/desktop-entry/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "crates/media/thumbnail/**"
      - "crates/system/fs/**"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/tilo-relay.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/calculator/**"
      - "apps/chat/**"
      - "apps/notes/**"
      - "apps/word-processor/**"
      - "crates/browser/qos-browser-runtime/**"
      - "crates/collab/actions/**"
      - "crates/collab/channel-crypto/**"
      - "crates/collab/qos-peer-state/**"
      - "crates/collab/reference/**"
      - "crates/collab/tilo-callstream/**"
      - "crates/dev/headless-schema/**"
      - "crates/dev/ui-graph/**"
      - "crates/doc/qdoc-epub/**"
      - "crates/doc/qdoc-html/**"
      - "crates/doc/qdoc-pdf/**"
      - "crates/doc/qdoc-rtf/**"
      - "crates/media/core/**"
      - "crates/packaging/install-artifacts/**"
      - "crates/runtime/cli/**"
      - "crates/runtime/runtime-collab/**"
      - "crates/runtime/runtime-portal-xdg/**"
      - "crates/sdk/tilo-app/**"
      - "crates/sdk/ui-core/**"
      - "crates/session/qos-desktop/**"
      - "crates/session/qos-ntfs-protocol/**"
      - "crates/system/app-state/**"
      - "crates/system/desktop-policy/**"
      - "crates/system/folder-service/**"
      - "crates/system/tilo-startup-metrics/**"
      - "crates/system/tts/**"
      - "crates/text/spellcheck/**"
      - "vendor/automerge/**"
      - "vendor/hexane/**"
      - "crates/agent/control-protocol/**"
      - "vendor/vello/**"
      - "vendor/vello_encoding/**"
      - "vendor/vello_shaders/**"
      - "vendor/winit/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keys/cosign.pub"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/dev/verify-rpm-snapshot-package-set.sh"
      - "os/dev/verify-rpm-snapshot-buildkit.py"
      - "os/tests/test_rpm_snapshot_buildkit.py"
      - "crates/hosting/tilo-relay/**"
      - "os/containers/tilo-relay/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/doc/qdoc/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/install/**"
      - "crates/packaging/launcher/**"
      - "crates/packaging/tilo-app-package/**"
      - "crates/packaging/runtime-bundle/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-identity/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/desktop-entry/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "crates/media/thumbnail/**"
      - "crates/system/fs/**"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/tilo-relay.yaml"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
  workflow_dispatch:
    inputs:
      require_compiler_cache:
        description: Fail before compiling if the shared compiler cache is unavailable
        type: boolean
        default: false

concurrency:
  group: tilo-relay-image-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/tilo-relay.yaml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before native work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/tilo-relay.yaml

  signing-preflight:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Bind relay signing authority to pinned release identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          resolved="$RUNNER_TEMP/relay-release-signing-authority.pub"
          cosign public-key --key "$COSIGN_KEY_REF" > "$resolved"
          cmp --silent keys/cosign.pub "$resolved" || {
            echo '::error::relay KMS/HSM authority does not match keys/cosign.pub'
            exit 1
          }

  build-and-push:
    needs: [signing-preflight, applicability]
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        (needs.signing-preflight.result == 'success' || needs.signing-preflight.result == 'skipped')
      }}
    runs-on: runner
    timeout-minutes: 120
    enable-openid-connect: true
    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false

      - name: Verify the relay-only Compose contract
        run: bash os/containers/tilo-relay/test-contract.sh

      - name: Restore the pinned compiler-cache client
        id: sccache-asset
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: relay-sccache-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Materialize the pinned compiler-cache client
        run: |
          case "$(uname -m)" in
            x86_64) target=x86_64 ;;
            aarch64) target=aarch64 ;;
            *) echo "unsupported relay architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ./os/dev/cache-github-assets.sh "sccache-v0.17.0-${target}-unknown-linux-musl.tar.gz"

      - name: Save the pinned compiler-cache client
        if: steps.sccache-asset.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: relay-sccache-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Bind the runner compiler-cache configuration
        id: compiler-cache
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_REQUIRE_CACHE: ${{ inputs.require_compiler_cache }}
        run: |
          set -euo pipefail
          require=0
          if [ "${DISPATCH_REQUIRE_CACHE:-false}" = true ]; then
            require=1
          elif [ "${{ github.event_name }}" = pull_request ] &&
               git diff --name-only "$BASE_SHA...HEAD" -- \
                 .forgejo/workflows/tilo-relay.yaml \
                 os/containers/tilo-relay/Containerfile \
                 os/containers/tilo-relay/probe-sccache.py | grep -q .; then
            require=1
          fi
          printf 'required=%s\n' "$require" >> "$GITHUB_OUTPUT"
          if [ "$require" = 1 ]; then
            printf 'nonce=%s-%s\n' "${{ github.run_id }}" "${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          else
            printf 'nonce=\n' >> "$GITHUB_OUTPUT"
          fi

          available=1
          required=(SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_KEY_PREFIX SCCACHE_S3_USE_SSL)
          for name in "${required[@]}"; do
            value="${!name:-}"
            test -n "$value" || available=0
            case "$value" in *$'\n'*|*$'\r'*) available=0 ;; esac
          done
          case "${SCCACHE_ENDPOINT:-}" in https://s3.*.amazonaws.com) ;; *) available=0 ;; esac
          case "${SCCACHE_BUCKET:-}" in podesta-agent-sccache-*) ;; *) available=0 ;; esac
          case "${SCCACHE_S3_KEY_PREFIX:-}" in forgejo-runners/v[0-9]*) ;; *) available=0 ;; esac
          test "${SCCACHE_S3_USE_SSL:-}" = true || available=0
          printf 'configured=%s\n' "$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != 1 ]; then
            echo "::notice::runner compiler cache configuration is absent or unsupported; normal builds compile without it"
            exit 0
          fi
          {
            printf 'bucket=%s\n' "$SCCACHE_BUCKET"
            printf 'endpoint=%s\n' "$SCCACHE_ENDPOINT"
            printf 'region=%s\n' "$SCCACHE_REGION"
            printf 'prefix=%s\n' "$SCCACHE_S3_KEY_PREFIX"
            printf 'use_ssl=%s\n' "$SCCACHE_S3_USE_SSL"
          } >> "$GITHUB_OUTPUT"

      # Login is required on every build (build-only or push): the
      # Containerfile FROMs the private frozen RPM repo, which needs
      # registry auth to pull.
      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same mirrored, digest-pinned base as the OS image — see
      # os/base-snapshot.env for why the base is a mirror and not quay.io.
      - name: Load the pinned BASE_REF
        run: |
          if [ ! -f os/base-snapshot.env ]; then
            echo "::error::os/base-snapshot.env missing — run the mirror-base workflow first"
            exit 1
          fi
          . os/base-snapshot.env
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::BASE_REF not set in os/base-snapshot.env"
            exit 1
          fi
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          echo "base=$BASE_REF"

      - name: Load the pinned RPMS_REF
        run: |
          if [ ! -f os/rpms-snapshot.env ]; then
            echo "::error::os/rpms-snapshot.env missing — run the snapshot-rpms workflow first"
            exit 1
          fi
          . os/rpms-snapshot.env
          if [ -z "${RPMS_REF:-}" ]; then
            echo "::error::RPMS_REF not set in os/rpms-snapshot.env"
            exit 1
          fi
          echo "RPMS_REF=$RPMS_REF" >> "$GITHUB_ENV"
          echo "rpms=$RPMS_REF"

      - name: Set up buildx for registry cache export
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          # The compiler cache is a cluster-local service. The default nested
          # Docker bridge cannot resolve Kubernetes service DNS.
          driver-opts: network=host

      - name: Verify the frozen RPM package set
        env:
          SNAPSHOT_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 os/dev/verify-rpm-snapshot-buildkit.py "$RPMS_REF" --builder "$SNAPSHOT_BUILDER"

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.podesta.ai/qos/tilo-relay
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            # workflow_dispatch off a non-main branch — without this, the metadata
            # step emits zero tags and the push fails "tag is needed". Derives a
            # "<branch>-<sha>" tag so a manual dispatch from a feature branch still
            # produces a discoverable image without polluting the `latest` channel.
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Build the tilo-relay image (push only on tags/dispatch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/containers/tilo-relay/Containerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Source bytes and pinned base/RPM refs invalidate the build. A
          # commit timestamp is not an artifact input and changes on rebase.
          build-args: |
            SOURCE_DATE_EPOCH=0
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
            SCCACHE_BUCKET=${{ steps.compiler-cache.outputs.bucket }}
            SCCACHE_ENDPOINT=${{ steps.compiler-cache.outputs.endpoint }}
            SCCACHE_REGION=${{ steps.compiler-cache.outputs.region }}
            SCCACHE_S3_KEY_PREFIX=${{ steps.compiler-cache.outputs.prefix }}
            SCCACHE_S3_USE_SSL=${{ steps.compiler-cache.outputs.use_ssl }}
            TILO_COMPILER_CACHE_CONFIGURED=${{ steps.compiler-cache.outputs.configured }}
            TILO_REQUIRE_COMPILER_CACHE=${{ steps.compiler-cache.outputs.required }}
            TILO_CACHE_PROBE_NONCE=${{ steps.compiler-cache.outputs.nonce }}
          # The runner injects these least-privilege credentials. BuildKit
          # exposes them only to the compile RUN, never an image layer or arg.
          secret-envs: |
            aws_access_key_id=AWS_ACCESS_KEY_ID
            aws_secret_access_key=AWS_SECRET_ACCESS_KEY
            aws_session_token=AWS_SESSION_TOKEN
          # PR validation must be independent of the mutable publication cache:
          # a partial/corrupt registry export must not prevent source validation,
          # and untrusted heads must never mutate the shared `latest` cache.
          cache-from: ${{ github.event_name != 'pull_request' && 'type=registry,ref=code.podesta.ai/qos/tilo-relay-buildcache:latest' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=code.podesta.ai/qos/tilo-relay-buildcache:latest,mode=max' || '' }}
          provenance: false

      # Optional signing reuses the same key as the OS image so `bootc
      # upgrade` policies can share a trust root. The binary has its own small
      # persistent cache rather than downloading through an installer action.
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          ref="code.podesta.ai/qos/tilo-relay@${{ steps.build.outputs.digest }}"
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
