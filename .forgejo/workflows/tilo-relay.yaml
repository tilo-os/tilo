name: Release / relay

# Builds the standalone tilo-relay container image (see
# os/containers/tilo-relay/Containerfile). Same publish cadence as
# the full OS image: PRs and pushes to main build-only; a version
# tag (`v*`) or a manual dispatch pushes to the registry.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keys/cosign.pub"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/dev/verify-rpm-snapshot-package-set.sh"
      - "crates/hosting/tilo-relay/**"
      - "os/containers/tilo-relay/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/doc/qdoc/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/install/**"
      - "crates/packaging/launcher/**"
      - "crates/packaging/pkg/**"
      - "crates/packaging/runtime-bundle/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-identity/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/desktop-entry/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "crates/media/thumbnail/**"
      - "crates/system/fs/**"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/tilo-relay.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "keys/cosign.pub"
      - "os/base-snapshot.env"
      - "os/rpms-snapshot.env"
      - "os/dev/verify-rpm-snapshot-package-set.sh"
      - "crates/hosting/tilo-relay/**"
      - "os/containers/tilo-relay/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/threshold-identity/**"
      - "crates/doc/qdoc/**"
      - "crates/packaging/app-registry/**"
      - "crates/packaging/install/**"
      - "crates/packaging/launcher/**"
      - "crates/packaging/pkg/**"
      - "crates/packaging/runtime-bundle/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-identity/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/desktop-entry/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "crates/media/thumbnail/**"
      - "crates/system/fs/**"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/tilo-relay.yaml"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
  workflow_dispatch:

concurrency:
  group: tilo-relay-image-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/tilo-relay.yaml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before native work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/tilo-relay.yaml

  signing-preflight:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Bind relay signing authority to pinned release identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          resolved="$RUNNER_TEMP/relay-release-signing-authority.pub"
          cosign public-key --key "$COSIGN_KEY_REF" > "$resolved"
          cmp --silent keys/cosign.pub "$resolved" || {
            echo '::error::relay KMS/HSM authority does not match keys/cosign.pub'
            exit 1
          }

  build-and-push:
    needs: [signing-preflight, applicability]
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        (needs.signing-preflight.result == 'success' || needs.signing-preflight.result == 'skipped')
      }}
    runs-on: runner
    timeout-minutes: 120
    enable-openid-connect: true
    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Verify the relay-only Compose contract
        run: bash os/containers/tilo-relay/test-contract.sh

      # Login is required on every build (build-only or push): the
      # Containerfile FROMs the private frozen RPM repo, which needs
      # registry auth to pull.
      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same mirrored, digest-pinned base as the OS image — see
      # os/base-snapshot.env for why the base is a mirror and not quay.io.
      - name: Load the pinned BASE_REF
        run: |
          if [ ! -f os/base-snapshot.env ]; then
            echo "::error::os/base-snapshot.env missing — run the mirror-base workflow first"
            exit 1
          fi
          . os/base-snapshot.env
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::BASE_REF not set in os/base-snapshot.env"
            exit 1
          fi
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          echo "base=$BASE_REF"

      - name: Load the pinned RPMS_REF
        run: |
          if [ ! -f os/rpms-snapshot.env ]; then
            echo "::error::os/rpms-snapshot.env missing — run the snapshot-rpms workflow first"
            exit 1
          fi
          . os/rpms-snapshot.env
          if [ -z "${RPMS_REF:-}" ]; then
            echo "::error::RPMS_REF not set in os/rpms-snapshot.env"
            exit 1
          fi
          echo "RPMS_REF=$RPMS_REF" >> "$GITHUB_ENV"
          echo "rpms=$RPMS_REF"

      - name: Verify the frozen RPM package set
        run: ./os/dev/verify-rpm-snapshot-package-set.sh docker "$RPMS_REF"

      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.podesta.ai/qos/tilo-relay
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            # workflow_dispatch off a non-main branch — without this, the metadata
            # step emits zero tags and the push fails "tag is needed". Derives a
            # "<branch>-<sha>" tag so a manual dispatch from a feature branch still
            # produces a discoverable image without polluting the `latest` channel.
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Build the tilo-relay image (push only on tags/dispatch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/containers/tilo-relay/Containerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
          cache-from: type=registry,ref=code.podesta.ai/qos/tilo-relay-buildcache:latest
          cache-to: type=registry,ref=code.podesta.ai/qos/tilo-relay-buildcache:latest,mode=max
          provenance: false

      # Optional signing reuses the same key as the OS image so `bootc
      # upgrade` policies can share a trust root. The binary has its own small
      # persistent cache rather than downloading through an installer action.
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          ref="code.podesta.ai/qos/tilo-relay@${{ steps.build.outputs.digest }}"
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
