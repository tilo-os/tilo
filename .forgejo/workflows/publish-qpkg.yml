name: Publish a .qpkg to the app registry

# Builds a qOS app package (.qpkg) and publishes it through the registry
# protocol with `qos-pkg publish`.
#
# CADENCE: pushes/PRs and a plain manual run VERIFY only — they build the
# package and run `qos-pkg publish --dry-run`, which signs the index entry
# and prints its blake3 content-hash without uploading anything (so a diff
# can be reviewed). A version tag (`v*`), or a manual run with
# `dry_run: false`, performs the real publish to the configured registry.
#
# WHAT A PUBLISHER MUST SET (nothing is invented here):
#   secrets.QPKG_PUBLISHER_IDENTITY  (required for a real publish)
#       JSON identity: {"secret_key_hex":"<32-byte hex seed>"}. MUST be the
#       same key that signs the package. Generate/keep it offline.
#   secrets.QPKG_REGISTRY_KEY        (optional)
#       JSON identity of the registry OPERATOR that signs the served index.
#       Only used for a `file://` registry; defaults to the publisher key
#       for single-operator self-hosting.
#   vars.QPKG_REGISTRY               (or the `registry` dispatch input)
#       Target registry: a `file://…` directory (self-hosted) or an
#       `https://…` registry endpoint.
#
# For a real publish to an iroh-served registry the blob must remain
# fetchable — a `file://` target needs a persistent provider node
# (`qos-pkg publish … --serve`, or a standalone registry daemon serving
# the same `blobs/` store). Dry-run needs no infra and is safe anywhere.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "crates/packaging/**"
      - ".forgejo/workflows/publish-qpkg.yml"
  workflow_dispatch:
    inputs:
      registry:
        description: "Target registry (file://… or https://…). Falls back to vars.QPKG_REGISTRY."
        required: false
        default: ""
      dry_run:
        description: "Sign + print the entry without uploading."
        type: boolean
        required: false
        default: true

concurrency:
  group: publish-qpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: runner
    container:
      image: quay.io/fedora/fedora:42
    steps:
      - name: Install deps (node for checkout, Rust, capnproto, build)
        run: |
          dnf install -y \
            nodejs \
            rust cargo capnproto \
            gcc gcc-c++ make cmake perl python3 git \
            clang clang-devel pkgconf-pkg-config \
          && dnf clean all

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build qos-pkg + the example app
        run: cargo build --release -p pkg-cli -p notes-cli

      - name: Assemble the payload + pack the .qpkg
        env:
          QPKG_PUBLISHER_IDENTITY: ${{ secrets.QPKG_PUBLISHER_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p payload/bin
          cp target/release/notes payload/bin/notes
          if [ -n "${QPKG_PUBLISHER_IDENTITY:-}" ]; then
            printf '%s' "$QPKG_PUBLISHER_IDENTITY" > id.json
          else
            # No publisher secret configured — mint an ephemeral key so a
            # dry-run still produces an inspectable, signed entry.
            python3 -c "import secrets,json;print(json.dumps({'secret_key_hex':secrets.token_hex(32)}))" > id.json
          fi
          ./target/release/qos-pkg pack \
            --manifest crates/packaging/notes-cli/manifest.toml \
            --payload payload \
            --identity id.json \
            -o notes.qpkg

      - name: Publish (dry-run to verify, or real publish on a tag / dispatch)
        env:
          QPKG_PUBLISHER_IDENTITY: ${{ secrets.QPKG_PUBLISHER_IDENTITY }}
          QPKG_REGISTRY_KEY: ${{ secrets.QPKG_REGISTRY_KEY }}
          REGISTRY_INPUT: ${{ github.event.inputs.registry }}
          REGISTRY_VAR: ${{ vars.QPKG_REGISTRY }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          REGISTRY="${REGISTRY_INPUT:-}"
          [ -z "$REGISTRY" ] && REGISTRY="${REGISTRY_VAR:-}"

          # Real publish only on a version tag, or a dispatch with dry_run=false
          # AND a publisher secret present. Everything else verifies via dry-run.
          REAL=0
          case "${GITHUB_REF:-}" in refs/tags/v*) REAL=1 ;; esac
          if [ "${DRY_RUN_INPUT:-}" = "false" ]; then REAL=1; fi
          if [ -z "${QPKG_PUBLISHER_IDENTITY:-}" ] || [ -z "$REGISTRY" ]; then REAL=0; fi

          if [ "$REAL" = "1" ]; then
            echo "Publishing notes.qpkg to $REGISTRY"
            EXTRA=""
            if [ -n "${QPKG_REGISTRY_KEY:-}" ]; then
              printf '%s' "$QPKG_REGISTRY_KEY" > registry-key.json
              EXTRA="--registry-key registry-key.json"
            fi
            ./target/release/qos-pkg publish \
              --registry "$REGISTRY" \
              --identity id.json \
              $EXTRA \
              notes.qpkg
          else
            echo "Dry-run: signing the index entry + printing its content hash (no upload)."
            ./target/release/qos-pkg publish \
              --registry "${REGISTRY:-file:///unused}" \
              --identity id.json \
              --dry-run \
              notes.qpkg
          fi
