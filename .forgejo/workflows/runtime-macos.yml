name: CI / runtime on macOS

# The per-user runtime (`tilo-runtime`) is the Tilo host on machines without
# the Tilo desktop, stock macOS first. Its library, standalone services and
# `tilo-runtime` executable must keep building there, which no Linux lane
# observes. Runs only for a pull request whose exact diff reaches the crate's
# workspace dependency closure (tools/policy/check_workflow_package_paths.py
# keeps this list complete), or on demand. It requests no OIDC token: the
# macOS runners' release-signing credentials are never minted for it.
on:
  pull_request:
    branches: ["main"]
    paths:
      - ".forgejo/workflows/runtime-macos.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/calculator/**"
      - "apps/chat/**"
      - "apps/ebook/**"
      - "apps/notes/**"
      - "apps/word-processor/**"
      - "crates/agent/control-protocol/**"
      - "crates/browser/tilo-browser-runtime/**"
      - "crates/collab/actions/**"
      - "crates/collab/automation/**"
      - "crates/collab/channel-crypto/**"
      - "crates/collab/collab-types/**"
      - "crates/collab/neighbour-wire/**"
      - "crates/collab/reference/**"
      - "crates/collab/threshold-identity/**"
      - "crates/collab/tilo-action-broker/**"
      - "crates/collab/tilo-peer-state/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/dev/copy-lint/**"
      - "crates/dev/headless-schema/**"
      - "crates/dev/test-env/**"
      - "crates/dev/test-http/**"
      - "crates/dev/ui-graph/**"
      - "crates/doc/bounded-zip/**"
      - "crates/doc/pdf/**"
      - "crates/doc/qdoc/**"
      - "crates/doc/qdoc-codecs/**"
      - "crates/doc/qdoc-pdf/**"
      - "crates/doc/qdoc-rich-text/**"
      - "crates/doc/tilo-automerge/**"
      - "crates/doc/tilo-automerge-isolate/**"
      - "crates/hosting/tilo-cloud-enrollment/**"
      - "crates/hosting/tilo-delivery-protocol/**"
      - "crates/hosting/tilo-moq/**"
      - "crates/hosting/tilo-relay/**"
      - "crates/hosting/tilo-relay-client/**"
      - "crates/hosting/tilo-relay-protocol/**"
      - "crates/hosting/tilo-workspace-host/**"
      - "crates/media/core/**"
      - "crates/media/thumbnail/**"
      - "crates/packaging/launcher/**"
      - "crates/packaging/package-store/**"
      - "crates/packaging/registry-types/**"
      - "crates/packaging/runtime-bundle/**"
      - "crates/packaging/tilo-app-package/**"
      - "crates/runtime/cli/**"
      - "crates/runtime/runtime-collab/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-identity/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/runtime/tilo-identity-host/**"
      - "crates/runtime/tilo-runtime/**"
      - "crates/sdk/font-catalog/**"
      - "crates/sdk/rt/**"
      - "crates/sdk/tilo-app/**"
      - "crates/sdk/tilo-host/**"
      - "crates/sdk/tilo-rich-text/**"
      - "crates/sdk/tilo-resource/**"
      - "crates/sdk/tilo-resource-macros/**"
      - "crates/sdk/ui-core/**"
      - "crates/session/desktop/**"
      - "crates/session/desktop-model/**"
      - "crates/session/tilo-native-media-control/**"
      - "crates/system/accounts/**"
      - "crates/system/advisory-lock/**"
      - "crates/system/app-state/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/cloud-source/**"
      - "crates/system/cloud-source-dav/**"
      - "crates/system/cloud-source-dropbox/**"
      - "crates/system/cloud-source-gdrive/**"
      - "crates/system/cloud-source-icloud/**"
      - "crates/system/cloud-source-onedrive/**"
      - "crates/system/content/**"
      - "crates/system/desktop-entry/**"
      - "crates/system/desktop-policy/**"
      - "crates/system/durable-store/**"
      - "crates/system/fs/**"
      - "crates/system/fs-content/**"
      - "crates/system/fs-native/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/sandbox-core/**"
      - "crates/system/secret-vault/**"
      - "crates/system/settings-store/**"
      - "crates/system/tilo-clock/**"
      - "crates/system/tilo-dav/**"
      - "crates/system/tilo-native-certs/**"
      - "crates/system/tilo-net/**"
      - "crates/system/tilo-seal/**"
      - "crates/system/tilo-startup-metrics/**"
      - "crates/system/tts/**"
      - "crates/system/wire-frame/**"
      - "crates/system/xdg-paths/**"
      - "crates/text/emoji/**"
      - "crates/text/spellcheck/**"
      - "crates/workspace-hack/**"
      - "vendor/automerge/**"
      - "vendor/git/accesskit-0.25.0/**"
      - "vendor/vello/**"
      - "vendor/vello_encoding/**"
      - "vendor/vello_shaders/**"
      - "vendor/wayland-backend/**"
      - "vendor/web-transport-proto/**"
      - "vendor/web-transport-quinn/**"
      - "vendor/winit/**"
  workflow_dispatch:

concurrency:
  group: runtime-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:966b27dabfda95813588c06e38479de91e206f7179ae2c6230bff7f59e7466fc
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/runtime-macos.yml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before macOS work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/runtime-macos.yml

  check:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true'))
      }}
    runs-on: imager-macos-aarch64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check the runtime, its tests and executable on macOS
        run: cargo check -p tilo-runtime --all-targets --locked
