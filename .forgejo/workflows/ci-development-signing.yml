name: CI / development signing tools

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Native proof to run; full runs every fixture
        type: choice
        options: [full, prediction, retention, prediction-retention, wpe-artifact]
        default: full
  push:
    branches: [main]
    paths:
      - os/dev/verify-development-source.py
      - os/dev/development_boot.py
      - os/dev/development_prediction.py
      - os/tests/test_development_prediction.py
      - os/tests/development_prediction_native.py
      - os/dev/import-development-rootfs.py
      - os/dev/initramfs-trust.py
      - os/dev/complete-initramfs-rebind.py
      - os/dev/installed_material_audit.py
      - os/dev/rebind-development-rootfs.py
      - os/usr/lib/dracut/modules.d/91tilo-rollback/**
      - os/tests/test_rebind_development_rootfs.py
      - os/tests/test_initramfs_trust.py
      - os/tests/initramfs_trust_native.py
      - os/tests/test_complete_initramfs_rebind.py
      - os/dev/rebind-development-trust.py
      - os/tests/test_import_development_rootfs.py
      - os/tests/test_rebind_development_trust.py
      - os/tests/test_development_trust.py
      - os/dev/retain-development-rootfs.py
      - os/tests/test_retain_development_rootfs.py
      - os/tests/development_retention_native.py
      - os/tests/tls_registry_fixture.py
      - os/dev/audit-rootfs-layers.py
      - os/tests/test_rootfs_layer_audit.py
      - os/tests/development_layer_audit_native.py
      - os/tests/development_rebind_native.py
      - os/tests/test_development_boot.py
      - os/tests/test_development_source.py
      - os/dev/development-trust.py
      - os/dev/install-public-trust.py
      - os/dev/hardware_profile.py
      - os/dev/development-signer.py
      - os/dev/setup-development-signer.py
      - os/dev/verify-authenticode-envelope.py
      - os/dev/verify-development-loader.py
      - os/tests/development_source_registry.py
      - os/tests/development_signer.py
      - os/tests/test_development_signer.py
      - os/tests/test_development_loader.py
      - os/tests/development_stage_reuse.py
      - os/dev/sign-development-rootfs.py
      - os/dev/prepare-wpe-stage.py
      - os/tests/test_prepare_wpe_stage.py
      - os/tests/wpe_stage_cache.py
      - os/dev/wpe-stage-artifact.py
      - os/Containerfile.wpe
      - os/tests/test_wpe_stage_artifact.py
      - os/tests/test_wpe_recipe_inputs.py
      - os/tests/development_wpe_artifact_native.py
      - os/dev/private_disk_image.py
      - os/tests/test_private_disk_image.py
      - os/Containerfile.development-loader
      - os/tests/test_sign_development_rootfs.py
      - os/tests/development_rootfs.py
      - os/tests/Containerfile.development-source
      - crates/system/tilo-crypto/**
      - .forgejo/workflows/ci-development-signing.yml

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Require native execution and install pinned Cosign
        run: |
          bash os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          bash os/dev/install-cached-cosign.sh
      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: ./.forgejo/actions/setup-buildx
      - name: Verify with a disposable local registry and private fixture keys
        shell: bash
        env:
          TILO_NATIVE_PROOF: ${{ inputs.proof || 'full' }}
        run: |
          set -euo pipefail
          context=$(mktemp -d)
          image="tilo-development-source-fixture:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          cleanup() {
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf -- "$context"
          }
          trap cleanup EXIT
          mkdir "$context/dev"
          cp os/dev/{verify-development-source.py,development_boot.py,development_prediction.py,development-trust.py,install-public-trust.py,hardware_profile.py,development-signer.py,setup-development-signer.py,verify-authenticode-envelope.py,verify-development-loader.py,sign-development-rootfs.py,private_disk_image.py,prepare-wpe-stage.py} "$context/dev/"
          cp os/tests/{development_source_registry.py,development_signer.py,test_development_signer.py,test_development_loader.py,test_development_boot.py,test_development_prediction.py,development_prediction_native.py,test_development_source.py,development_stage_reuse.py,development_rootfs.py,test_sign_development_rootfs.py,test_private_disk_image.py,test_prepare_wpe_stage.py,wpe_stage_cache.py} "$context/"
          cp os/Containerfile.development-loader "$context/"
          cp os/dev/{retain-development-rootfs.py,import-development-rootfs.py,rebind-development-trust.py,initramfs-trust.py,complete-initramfs-rebind.py,rebind-development-rootfs.py} "$context/dev/"
          cp os/dev/{audit-rootfs-layers.py,installed_material_audit.py} "$context/dev/"
          cp os/dev/wpe-stage-artifact.py "$context/dev/"
          mkdir -p "$context/os" && cp os/Containerfile.wpe "$context/os/"
          cp os/tests/{test_wpe_stage_artifact.py,test_wpe_recipe_inputs.py,development_wpe_artifact_native.py} "$context/"
          cp os/tests/{test_retain_development_rootfs.py,test_import_development_rootfs.py,test_rebind_development_trust.py,test_initramfs_trust.py,initramfs_trust_native.py,test_complete_initramfs_rebind.py,test_rebind_development_rootfs.py,test_development_trust.py,development_retention_native.py,tls_registry_fixture.py,test_tls_registry_fixture.py} "$context/"
          cp os/tests/{test_rootfs_layer_audit.py,development_layer_audit_native.py} "$context/"
          cp os/tests/development_rebind_native.py "$context/"
          mkdir -p "$context/91tilo-rollback"
          cp -a os/usr/lib/dracut/modules.d/91tilo-rollback/. "$context/91tilo-rollback/"
          cp "$(command -v cosign)" "$context/cosign"
          cargo build --locked --release -p tilo-crypto
          cp target/release/tilo-crypto "$context/tilo-crypto"
          cp os/tests/Containerfile.development-source "$context/Containerfile"
          cache="type=gha,scope=development-source-fixture-${{ matrix.arch }}"
          docker buildx build --load --file "$context/Containerfile" --tag "$image" \
            --cache-from "$cache" --cache-to "$cache,mode=max,ignore-error=true" "$context"
          # Nested Podman mounts only inside this disposable CI container.
          # No host directories or credentials are mounted.
          case "$TILO_NATIVE_PROOF" in
            full) docker run --rm --privileged --tmpfs /tmp --tmpfs /run "$image" ;;
            prediction)
              docker run --rm --privileged --tmpfs /tmp --tmpfs /run --entrypoint python3 \
                "$image" /fixture/os/tests/development_prediction_native.py ;;
            retention)
              docker run --rm --privileged --tmpfs /tmp --tmpfs /run --entrypoint bash \
                "$image" -uc 'status=0; for fixture in test_initramfs_trust.py initramfs_trust_native.py test_rebind_development_trust.py test_complete_initramfs_rebind.py test_rebind_development_rootfs.py test_retain_development_rootfs.py test_import_development_rootfs.py development_retention_native.py test_rootfs_layer_audit.py development_layer_audit_native.py development_rebind_native.py; do python3 "/fixture/os/tests/$fixture" || status=1; done; exit "$status"' ;;
            prediction-retention)
              docker run --rm --privileged --tmpfs /tmp --tmpfs /run --entrypoint bash \
                "$image" -uc 'status=0; for fixture in development_prediction_native.py test_initramfs_trust.py initramfs_trust_native.py test_rebind_development_trust.py test_complete_initramfs_rebind.py test_rebind_development_rootfs.py test_retain_development_rootfs.py test_import_development_rootfs.py development_retention_native.py test_rootfs_layer_audit.py development_layer_audit_native.py development_rebind_native.py; do python3 "/fixture/os/tests/$fixture" || status=1; done; exit "$status"' ;;
            wpe-artifact)
              docker run --rm --privileged --tmpfs /tmp --tmpfs /run --entrypoint bash \
                "$image" -euc 'python3 /fixture/os/tests/test_prepare_wpe_stage.py; python3 /fixture/os/tests/test_wpe_stage_artifact.py; python3 -O /fixture/os/tests/test_wpe_stage_artifact.py; python3 /fixture/os/tests/test_wpe_recipe_inputs.py; python3 /fixture/os/tests/development_wpe_artifact_native.py' ;;
            *) echo 'Unknown native proof selection' >&2; exit 2 ;;
          esac
