name: Release / room service image

# The room service is deployed by digest. Pull requests build
# and smoke-test the image without publishing; pushes to main and manual runs
# publish one immutable tag and a digest receipt for the infra repository.
on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "crates/hosting/tilo-room-service/**"
      - "crates/hosting/tilo-relay/**"
      - "crates/hosting/tilo-relay-shell/**"
      - "crates/hosting/tilo-relay-store/**"
      - "crates/hosting/tilo-relay-protocol/**"
      - "crates/browser/tilo-browser-runtime/**"
      - "crates/browser/tilo-web-desktop/**"
      - "apps/chat/**"
      - "apps/discord/**"
      - ".forgejo/workflows/room-service-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/hosting/tilo-room-service/**"
      - "os/scripts/verify-no-cisco-openh264.sh"
      - ".forgejo/workflows/room-service-image.yml"
  workflow_dispatch: {}

concurrency:
  group: room-service-image-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  # The bundle and binaries are built in the CI builder, which has the Rust,
  # wasm and Node toolchains and the shared caches; the image job then only
  # copies them, so the Containerfile never learns to build wasm.
  context:
    needs: [builder]
    runs-on: runner
    timeout-minutes: 120
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Prepare verified fonts for the desktop bundle
        uses: ./.forgejo/actions/prepare-font-assets
      - name: Relay, room service and connector workers
        # Fat LTO over one codegen unit got the relay's link (with the
        # agents feature) killed for memory on the runner; thin LTO keeps
        # these server binaries fast at a fraction of the memory and time.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -euo pipefail
          cargo build --locked --release -p tilo-relay --features agents --bin tilo-relay
          cargo build --locked --release -p tilo-room-service
          mkdir -p context/bin
          cp target/release/tilo-relay target/release/tilo-room-service context/bin/
          # Fonts are looked up beside the executable first; the relay's app
          # workers need them to lay out text.
          # The prepared cache holds the test fixtures; the product fonts may
          # still need their pinned, checksummed download.
          TILO_FONT_ASSETS_OFFLINE=0 python3 tools/font-catalog.py prepare crates/sdk/ui-core/assets/fonts \
            context/bin/fonts --scope product
          # The Discord connector's outside worker ships beside the relay
          # once the workspace has it.
          package=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[]; .name == "discord-worker" and (.kind | index("bin")))) | .name' | head -1)
          if [[ -n $package ]]; then
            cargo build --locked --release -p "$package" --bin discord-worker
            cp target/release/discord-worker context/bin/
          fi
          # The bridge bot's program, installed by path from TILO_ROOMS_BOTS.
          mkdir -p context/bots
          cp apps/discord/bridge/program.json context/bots/discord-bridge.json
      - name: Desktop bundle and pages
        run: |
          set -euo pipefail
          # build.sh reads the workspace metadata offline; crates new since
          # the download cache was saved must be fetched first.
          cargo fetch --locked
          crates/browser/tilo-browser-runtime/scripts/build.sh "$PWD/context/assets" --bundle desktop >/dev/null
          cp crates/hosting/tilo-room-service/web/* context/assets/
          cp crates/hosting/tilo-room-service/container/Containerfile \
            crates/hosting/tilo-room-service/container/Containerfile.dockerignore \
            os/scripts/verify-no-cisco-openh264.sh context/
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: room-service-context
          path: context/
          if-no-files-found: error
          retention-days: 3

  image:
    needs: [context]
    runs-on: runner
    timeout-minutes: 30
    env:
      IMAGE_REPOSITORY: registry.tilo.so/tilo/room-service
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # The production cluster is amd64 today.
      IMAGE_PLATFORM: linux/amd64
      PUBLISH: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: room-service-context
          path: context
      # Artifacts drop the executable bit.
      - run: chmod +x context/bin/*
      - name: Set up the pinned BuildKit frontend
        uses: ./.forgejo/actions/setup-buildx
      - name: Build the image without publication
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: context
          file: context/Containerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: false
          load: true
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_REVISION }}
      - name: Smoke test the image
        run: >-
          bash crates/hosting/tilo-room-service/container/test-image.sh
          "$IMAGE_REPOSITORY:sha-$SOURCE_REVISION"
          "$SOURCE_REVISION"
      - name: Log in for publication
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the smoke test
        if: ${{ env.PUBLISH == 'true' }}
        id: publish
        run: |
          set -euo pipefail
          output=$(docker push "$IMAGE_REPOSITORY:sha-$SOURCE_REVISION" 2>&1)
          printf '%s\n' "$output"
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' <<<"$output" | tail -1)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Write the deployment digest receipt
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p room-service-image-receipt
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "sha-$SOURCE_REVISION" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg platform "$IMAGE_PLATFORM" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_NUMBER" \
            '{schemaVersion:2,repository:$repository,tag:$tag,digest:$digest,image:$image,sourceRevision:$sourceRevision,platform:$platform,
              build:{workflow:$workflow,runId:($runId|tonumber),runNumber:($runNumber|tonumber),url:$runUrl}}' \
            > room-service-image-receipt/room-service-image.json
          printf '### Room service image\n\n`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the immutable digest receipt
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: room-service-image-receipt
          path: room-service-image-receipt/room-service-image.json
          if-no-files-found: error
