name: Development / native installer bootc helper

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to build
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
        required: true

concurrency:
  group: development-installer-bootc-helper-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ${{ inputs.architecture == 'aarch64' && 'runner-disk-100g-arm64' || 'runner-disk-100g' }}
    timeout-minutes: 90
    container:
      image: code.sandbox.example/qos/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_TARGET_DIR: /tmp/installer-bootc-target
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Install the pinned builder's native bootc link dependencies
        run: dnf install -y libzstd-devel ostree-devel openssl-devel && dnf clean all
      - name: Fetch and verify the exact upstream source
        id: source
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh "$ARCHITECTURE"
          python3 os/dev/produce-installer-bootc-helper.py prepare \
            --architecture "$ARCHITECTURE" \
            --source /tmp/installer-bootc-source \
            --state /tmp/installer-bootc-state.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact source and compiler cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
            /tmp/installer-bootc-target
          key: ${{ steps.source.outputs.cache_key }}
      - name: Build only the pinned bootc package
        working-directory: /tmp/installer-bootc-source
        run: cargo build --locked --release -p bootc
      - name: Save exact source and compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
            /tmp/installer-bootc-target
          key: ${{ steps.source.outputs.cache_key }}
      - name: Package and independently verify the bounded artifact
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          python3 os/dev/produce-installer-bootc-helper.py package \
            --architecture "$ARCHITECTURE" \
            --target "$CARGO_TARGET_DIR" \
            --state /tmp/installer-bootc-state.json \
            --output /tmp/installer-bootc-helper
      - name: Retain the helper and provenance receipt
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: installer-bootc-helper-${{ inputs.architecture }}-${{ github.sha }}
          path: /tmp/installer-bootc-helper/
          if-no-files-found: error
          retention-days: 14
