name: CI / filesystem contract

# Select PR relevance immediately. Relevant changes dispatch the separately
# serialized privileged workflow and propagate its exact result into this
# long-standing PR check; unrelated changes never enter the FUSE queue.
on:
  # Forgejo loads pull_request_target workflows from the immutable base. This
  # keeps the dispatch credential outside PR-controlled YAML and Python.
  pull_request_target:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/system/fs/**"
      - "crates/doc/qdoc/**"
      - "crates/media/thumbnail/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "apps/file-explorer/**"
      - "apps/settings/src/panes/device_mesh.rs"
      - "crates/hosting/tilo-relay/**"
      - "crates/collab/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/packaging/launcher/**"
      - "crates/session/shell/**"
      - "crates/sdk/ui-core/**"
      - "scripts/ci-run.sh"
      - "os/usr/libexec/tilo-session"
      - "os/usr/lib/systemd/user/tilo-graphical-session.target"
      - "os/usr/lib/systemd/user/tilo-identity.service"
      - "os/usr/lib/systemd/user/tilo-fs-recipient.service"
      - "os/usr/share/wayland-sessions/shell*.desktop"
      - "os/tests/tilo-session-lifecycle.sh"
      - "os/usr/libexec/tilo-relay-firstboot"
      - "os/usr/lib/systemd/system/tilo-relay.service"
      - "os/usr/lib/systemd/system/tilo-fs-replica.service"
      - "os/containers/tilo-relay/**"
      - ".forgejo/workflows/build-image.yml"
      - ".forgejo/workflows/fs-fuse.yml"
      - ".forgejo/workflows/fs-fuse-executor.yml"
      - "tools/ci/run_fuse_contract.py"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"

concurrency:
  group: fs-fuse-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/fs-fuse.yml
          sparse-checkout-cone-mode: false
          token: ${{ github.token }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before FUSE work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/fs-fuse.yml

  contract:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request_target' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        true
      }}
    runs-on: runner-quality
    timeout-minutes: 190
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/ci/run_fuse_contract.py
          sparse-checkout-cone-mode: false
          token: ${{ github.token }}
      - name: Run the exact filesystem contract in the exclusive lane
        env:
          # Provisioned for the qos-fuse-dispatch service account with only
          # read:repository and write:repository scopes on qos/qos.
          FORGEJO_TOKEN: ${{ secrets.FUSE_CONTRACT_TOKEN }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -I tools/ci/run_fuse_contract.py
