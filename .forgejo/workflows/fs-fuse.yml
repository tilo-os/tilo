name: CI / filesystem contract

on:
  # Capacity relief: main-push validation is covered by nightly/manual runs.
  # push:
  #   branches: ["main"]
  #   paths:
  #     - ".cargo/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "crates/system/fs/**"
  #     - "crates/doc/qdoc/**"
  #     - "crates/doc/bounded-zip/**"
  #     - "crates/media/thumbnail/**"
  #     - "crates/runtime/runtime-fs/**"
  #     - "crates/runtime/runtime-portal/**"
  #     - "crates/system/atomic-file/**"
  #     - "crates/system/bounded-command/**"
  #     - "crates/system/power/**"
  #     - "crates/system/private-fs/**"
  #     - "crates/system/settings-store/**"
  #     - "crates/system/xdg-paths/**"
  #     - "apps/file-explorer/**"
  #     - "apps/settings/src/panes/device_mesh.rs"
  #     - "crates/hosting/tilo-relay/**"
  #     - "crates/hosting/tilo-relay-client/**"
  #     - "crates/hosting/tilo-relay-protocol/**"
  #     - "crates/collab/**"
  #     - "crates/collab/tilo-user-identity/**"
  #     - "crates/packaging/launcher/**"
  #     - "crates/system/sandbox-core/**"
  #     - "crates/session/shell/**"
  #     - "crates/sdk/ui-core/**"
  #     - "scripts/ci-run.sh"
  #     - "tools/ci/focused_test.py"
  #     - "os/usr/libexec/tilo-session"
  #     - "os/usr/lib/systemd/user/tilo-graphical-session.target"
  #     - "os/usr/lib/systemd/user/tilo-identity.service"
  #     - "os/usr/lib/systemd/user/tilo-fs-recipient.service"
  #     - "os/usr/share/wayland-sessions/shell*.desktop"
  #     - "os/tests/tilo-session-lifecycle.sh"
  #     - "os/usr/libexec/tilo-relay-firstboot"
  #     - "os/usr/lib/systemd/system/tilo-relay.service"
  #     - "os/usr/lib/systemd/system/tilo-fs-replica.service"
  #     - "os/containers/tilo-relay/**"
  #     - ".forgejo/workflows/build-image.yml"
  #     - ".forgejo/workflows/fs-fuse.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/system/fs/**"
      - "crates/doc/qdoc/**"
      - "crates/doc/bounded-zip/**"
      - "crates/media/thumbnail/**"
      - "crates/runtime/runtime-fs/**"
      - "crates/runtime/runtime-portal/**"
      - "crates/system/atomic-file/**"
      - "crates/system/bounded-command/**"
      - "crates/system/power/**"
      - "crates/system/private-fs/**"
      - "crates/system/settings-store/**"
      - "crates/system/xdg-paths/**"
      - "apps/file-explorer/**"
      - "apps/settings/src/panes/device_mesh.rs"
      - "crates/hosting/tilo-relay/**"
      - "crates/hosting/tilo-relay-client/**"
      - "crates/hosting/tilo-relay-protocol/**"
      - "crates/collab/**"
      - "crates/collab/tilo-user-identity/**"
      - "crates/packaging/launcher/**"
      - "crates/system/sandbox-core/**"
      - "crates/session/shell/**"
      - "crates/sdk/ui-core/**"
      - "crates/dev/test-env/**"
      - "scripts/ci-run.sh"
      - "tools/ci/focused_test.py"
      - "os/usr/libexec/tilo-session"
      - "os/usr/lib/systemd/user/tilo-graphical-session.target"
      - "os/usr/lib/systemd/user/tilo-identity.service"
      - "os/usr/lib/systemd/user/tilo-fs-recipient.service"
      - "os/usr/share/wayland-sessions/shell*.desktop"
      - "os/tests/tilo-session-lifecycle.sh"
      - "os/usr/libexec/tilo-relay-firstboot"
      - "os/usr/lib/systemd/system/tilo-relay.service"
      - "os/usr/lib/systemd/system/tilo-fs-replica.service"
      - "os/containers/tilo-relay/**"
      - ".forgejo/workflows/build-image.yml"
      - ".forgejo/workflows/fs-fuse.yml"
      - "tools/ci/workflow_applicability.py"
      - "tools/ci/prepare_pr_history.py"
      - "tools/ci/sccache.sh"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  # Each broker runner has its own Kata guest kernel, DinD storage and FUSE
  # device. Replace superseded heavy PR runs, but keep manual and scheduled
  # validation separate and uncancelled. Check/lint use their own commit groups.
  group: fs-fuse-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HOME: /cargo-home
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  RUSTFLAGS: "-D warnings"
  TILO_FS_FUSE_REQUIRED: "1"

jobs:
  applicability:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.sandbox.example/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      applicable: ${{ steps.compare.outputs.applicable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            tools/ci/prepare_pr_history.py
            tools/ci/workflow_applicability.py
            .forgejo/workflows/fs-fuse.yml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Prepare targeted PR history
        run: python3 -I tools/ci/prepare_pr_history.py
      - name: Require an exact relevant PR diff before FUSE work
        id: compare
        run: python3 -I tools/ci/workflow_applicability.py --workflow .forgejo/workflows/fs-fuse.yml

  real-fuse:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        true
      }}
    runs-on: runner
    timeout-minutes: 60
    container:
      image: code.sandbox.example/qos/tilo-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
      options: --device /dev/fuse --cap-add SYS_ADMIN
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require a real kernel FUSE environment
        run: bash scripts/ci-fuse-preflight.sh

      - name: Enable shared compiler cache
        run: bash tools/ci/sccache.sh prepare

      - name: Enforce graphical-session and verified-identity lifecycle
        run: bash os/tests/tilo-session-lifecycle.sh

      # Uses two `tilo-enroll` processes over the LAN UDP path, then dials
      # the transferred home-peer registration after the approving process has
      # exited. Keep this on the privileged/FUSE runner: it is the closest CI
      # analogue of the image's host networking and ownership boundary.
      - name: Enforce ordinary-device enrollment and offline-owner continuity
        run: >-
          bash scripts/ci-run.sh "ordinary device enrollment acceptance" --
          cargo test --locked -p tilo-relay --test it
          personal_device_process::ordinary_device_enrollment_survives_approver_offline_with_home_peer_route
          -- --nocapture --test-threads=1

      - name: Enforce polkit helper ownership and enrollment routing
        run: >-
          bash scripts/ci-run.sh "privileged personal enrollment helper acceptance" --
          cargo test --locked -p tilo-relay --test it
          personal_device_process::privileged_helper_preserves_user_owned_personal_device_projection
          -- --ignored --nocapture --test-threads=1

      - name: Run the complete kernel-path filesystem contract
        run: >-
          bash scripts/ci-run.sh "real FUSE integration" --
          cargo test --locked -p fs --test integration_test -- --nocapture --test-threads=1

      - name: Run the separate-process exact-share and injected-clock lifecycle
        run: >-
          bash scripts/ci-run.sh "real FUSE exact-share lifecycle" --
          cargo test --locked -p fs --test exact_share_process_fuse -- --nocapture --test-threads=1

      - name: Enforce deterministic partition and multi-writer convergence
        run: >-
          bash scripts/ci-run.sh "collaborative-files partition matrix" --
          cargo test --locked -p fs --test collab_release_matrix -- --nocapture --test-threads=1

      - name: Exercise Files against a live collaborative mount
        run: >-
          bash scripts/ci-run.sh "Files live collaborative mount" --
          cargo test --locked -p file-explorer --test live_collaborative_mount -- --nocapture --test-threads=1

      - name: Enforce named delivery and governed identity
        run: |
          bash scripts/ci-run.sh "authenticated named-share delivery" -- cargo test --locked -p fs named_share_delivery --lib -- --nocapture
          bash scripts/ci-run.sh "named-share control wire" -- cargo test --locked -p collab-types share_control --lib -- --nocapture
          bash scripts/ci-run.sh "governed identity projection schema" -- cargo test --locked -p tilo-user-identity projection --lib -- --nocapture
          bash scripts/ci-run.sh "governed room identity projection" -- cargo test --locked -p shell governed_name_and_root_signed_endpoint_project_human_and_device --lib -- --nocapture

      - name: Enforce skew, read-only and atomic-recovery boundaries
        run: |
          bash scripts/ci-run.sh "replica receipt clock skew" -- cargo test --locked -p fs replica_ack::tests::exact_nonce_version_peer_and_freshness_are_bound --lib -- --nocapture
          bash scripts/ci-run.sh "authenticated read-only writer denial" -- cargo test --locked -p fs sync::tests::a_read_only_peer_pulls_updates_but_cannot_author --lib -- --nocapture
          SOURCE_SHA="$(git rev-parse HEAD)" PACKAGE=fs TEST_TARGET= OPERATION=test-lib \
            TEST_NAME=fs::tests::record_publisher_integration_tests::keep_current_and_use_other_append_signed_convergent_resolutions \
            bash scripts/ci-run.sh "Keep Both all-phase restart recovery" -- python3 -I tools/ci/focused_test.py run --root .

      - name: Reject corrupted collaborative state and prove legacy name migration
        run: |
          bash scripts/ci-run.sh "collaborative-files corruption matrix" -- cargo test --locked -p fs --test corruption_matrix -- --nocapture --test-threads=1
          bash scripts/ci-run.sh "bounded durable backup policy" -- cargo test --locked -p fs durable_backup::tests --lib -- --nocapture
          bash scripts/ci-run.sh "signed repository known-good recovery" -- cargo test --locked -p fs record_repository::tests::tampered_primary_recovers_latest_valid_signed_generation_with_evidence --lib -- --nocapture
          bash scripts/ci-run.sh "legacy byte-name migration" -- cargo test --locked -p fs namespace::tests::legacy_string_name_loads_exactly_and_next_rename_persists_bytes --lib -- --nocapture
          bash scripts/ci-run.sh "signed repository tamper refusal" -- cargo test --locked -p fs record_repository::tests::tampered_signed_state_is_rejected_on_restart --lib -- --nocapture
          bash scripts/ci-run.sh "history ancestry corruption refusal" -- cargo test --locked -p fs history::tests::corrupt_heads_are_rejected_on_open --lib -- --nocapture
          bash scripts/ci-run.sh "transaction journal partial-batch refusal" -- cargo test --locked -p fs record_transaction::tests::journal_rejects_partial_or_mutated_participant_batches --lib -- --nocapture
          bash scripts/ci-run.sh "transaction coordinator recovery" -- cargo test --locked -p fs transaction_coordinator::tests::broadcast_failure_recovers_exact_committed_namespace_without_duplicate_history --lib -- --nocapture
          bash scripts/ci-run.sh "availability receipt tamper refusal" -- cargo test --locked -p fs availability::tests::tampered_persisted_receipt_fails_registry_open --lib -- --nocapture

      - name: Enforce deterministic collaborative-files performance SLOs
        env:
          TILO_FS_PERF_GATE: "1"
        run: >-
          bash scripts/ci-run.sh "collaborative-files performance gate" --
          cargo test --locked -p fs --test performance_gate -- --nocapture --test-threads=1

      - name: Report compiler cache effectiveness
        if: always()
        continue-on-error: true
        run: |
          echo '### real-fuse compiler cache' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/sccache.sh report 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # File Explorer's full UI/library harness links the entire toolkit. Building
  # it after the relay, shell, and FUSE harnesses filled the privileged
  # runner's container overlay, then an ordinary tempfile write failed with
  # ENOSPC at test 213/213. Give this non-FUSE suite a fresh container instead
  # of deleting an incomplete subset of Cargo artifacts in the live mount job.
  files-ux:
    needs: applicability
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
         (needs.applicability.result == 'success' && needs.applicability.outputs.applicable == 'true')) &&
        true
      }}
    runs-on: runner
    timeout-minutes: 30
    env:
      TILO_FS_FUSE_REQUIRED: "0"
    container:
      image: code.sandbox.example/qos/tilo-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable shared compiler cache
        run: bash tools/ci/sccache.sh prepare

      - name: Enforce Files collaboration UX in a fresh overlay
        run: >-
          bash scripts/ci-run.sh "Files collaboration UX" --
          cargo test --locked -p file-explorer --lib -- --nocapture --test-threads=1

      - name: Report compiler cache effectiveness
        if: always()
        continue-on-error: true
        run: |
          echo '### files-ux compiler cache' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/sccache.sh report 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
