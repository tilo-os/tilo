name: CI engine canary

# Exercises the CI features qOS jobs rely on, on runners of the
# runner-engine-canary label: Oregon VMs whose Docker engine uses the
# containerd image store, so its own pulls follow the pool's registry mirror.
# Compare with the same jobs on the production engine before moving labels.
on:
  workflow_dispatch:

jobs:
  job-container:
    runs-on: runner-engine-canary
    timeout-minutes: 30
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:0421709ebb8da5831b68fa2280fb639f5671df405824caf09fe8ab0a000f0ca3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: The job container started from a digest-pinned image
        run: |
          set -eu
          test -f .forgejo/workflows/engine-canary.yml
          uname -m
          cat /etc/os-release | head -2

  engine:
    runs-on: runner-engine-canary
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Engine, pulls, volumes, build, save and load
        env:
          IMAGE: code.podesta.ai/qos/ci-control@sha256:904ecdefc18847410a4d449ce186ad5b62a0d864053ee2ff93769f8f591c8071
        run: |
          set -euo pipefail
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker info --format '{{.Driver}} {{json .DriverStatus}}'
          start=$(date +%s)
          docker pull "$IMAGE"
          echo "::notice::pulled $IMAGE in $(( $(date +%s) - start ))s"
          docker run --rm "$IMAGE" true
          docker volume create engine-canary
          docker run --rm -v engine-canary:/data "$IMAGE" sh -c 'echo ok > /data/probe'
          test "$(docker run --rm -v engine-canary:/data "$IMAGE" cat /data/probe)" = ok
          docker volume rm engine-canary
          context="$(mktemp -d)"
          printf 'FROM %s\nRUN echo built > /built\n' "$IMAGE" > "$context/Dockerfile"
          docker build -t localhost/engine-canary:build "$context"
          test "$(docker run --rm localhost/engine-canary:build cat /built)" = built
          docker save localhost/engine-canary:build -o "$RUNNER_TEMP/image.tar"
          docker rmi localhost/engine-canary:build
          docker load -i "$RUNNER_TEMP/image.tar"
          test "$(docker run --rm localhost/engine-canary:build cat /built)" = built
      - name: Set up buildx with the pool's registries
        id: buildx
        uses: ./.forgejo/actions/setup-buildx
      - name: BuildKit build from a mirrored base
        env:
          IMAGE: code.podesta.ai/qos/ci-control@sha256:904ecdefc18847410a4d449ce186ad5b62a0d864053ee2ff93769f8f591c8071
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          printf 'FROM %s\nRUN echo buildkit > /built\n' "$IMAGE" > "$context/Dockerfile"
          docker buildx build --builder "$BUILDER" --load -t localhost/engine-canary:buildx "$context"
          test "$(docker run --rm localhost/engine-canary:buildx cat /built)" = buildkit
