name: Release / imager

# Ordinary commits exercise imager code and release-policy invariants in
# check.yml. This workflow allocates native release hosts only for an explicit
# manual rehearsal or an imager-v* tag. Tags expand to every supported native
# host and fail closed unless packages are signed and, on macOS, notarized.
on:
  push:
    tags: ["imager-v*"]
  workflow_dispatch:
    inputs:
      full_native:
        description: "Build Linux, Windows, and macOS on both architectures instead of the Linux x86_64 smoke lane."
        type: boolean
        required: false
        default: false
      installer_only:
        description: "Run installer-media cycles only; skip host-app packaging and publication jobs."
        type: boolean
        required: false
        default: false
      published_os_image:
        description: "Optional signed Tilo manifest-list digest; empty uses vars.TILO_INSTALLER_OS_IMAGE."
        type: string
        required: false
        default: ""
      lenovo_target_image:
        description: "CI-signed single ARM64 Lenovo child digest for an offline installer-only medium."
        type: string
        required: false
        default: ""
      generic_target:
        description: "Preload the signed generic ARM64 child for a complete VM install and first boot; combine with lenovo_target_image to test both media in one run."
        type: boolean
        required: false
        default: false
      published_os_source_revision:
        description: "Full main-ancestor commit that built both signed offline targets and the generic live base. Required for offline installer-only runs."
        type: string
        required: false
        default: ""

concurrency:
  # Tagged package promotion and the website manifest are mutable "latest"
  # pointers, so tags share a non-cancelling lane. Repeated manual rehearsals
  # on one ref supersede stale queued work when a native host is unavailable.
  group: release-imager-${{ startsWith(github.ref, 'refs/tags/imager-v') && 'promotion' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/imager-v') }}

env:
  # Public binaries live on GitHub, outside the private Forgejo source repository.
  # Override only to pre-created public repositories governed by the same App.
  TILO_RELEASE_SERVER: https://github.com
  TILO_RELEASE_API_URL: https://api.github.com
  TILO_RELEASE_REPOSITORY: ${{ vars.IMAGER_PUBLIC_RELEASE_REPOSITORY || 'tilo-os/releases' }}
  TILO_HOMEBREW_TAP_REPOSITORY: ${{ vars.IMAGER_HOMEBREW_TAP_REPOSITORY || 'tilo-os/homebrew-tilo' }}

jobs:
  plan:
    timeout-minutes: 15
    runs-on: runner
    outputs:
      linux-matrix: ${{ steps.lanes.outputs.linux-matrix }}
      medium-matrix: ${{ steps.lanes.outputs.medium-matrix }}
    steps:
      - name: Select native Linux lanes
        id: lanes
        env:
          FULL_NATIVE: ${{ github.event.inputs.full_native }}
          LENOVO_TARGET_IMAGE: ${{ github.event.inputs.lenovo_target_image }}
          GENERIC_TARGET: ${{ github.event.inputs.generic_target }}
          INSTALLER_ONLY: ${{ github.event.inputs.installer_only }}
          PUBLISHED_OS_SOURCE_REVISION: ${{ github.event.inputs.published_os_source_revision }}
        run: |
          if [[ -n ${LENOVO_TARGET_IMAGE:-} || ${GENERIC_TARGET:-false} == true ]]; then
            [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF == refs/heads/main \
               && ${INSTALLER_ONLY:-false} == true \
               && ${PUBLISHED_OS_SOURCE_REVISION:-} =~ ^[0-9a-f]{40}$ \
               && ( -z ${LENOVO_TARGET_IMAGE:-} \
                    || $LENOVO_TARGET_IMAGE =~ ^code\.tilo\.so/tilo/tilo@sha256:[0-9a-f]{64}$ ) ]] || {
              echo '::error::offline medium requires main, installer_only, an immutable signed target, and a full source revision'; exit 1;
            }
            echo 'linux-matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            # No runner carries the imager fleet's labels any more; the large
            # ARM runners have nested KVM and the disk these media need.
            if [[ -n ${LENOVO_TARGET_IMAGE:-} && ${GENERIC_TARGET:-false} == true ]]; then
              echo 'medium-matrix={"include":[{"arch":"aarch64","runner":"runner-large-arm64","target_profile":"generic"},{"arch":"aarch64","runner":"runner-large-arm64","target_profile":"lenovo-83ed"}]}' >> "$GITHUB_OUTPUT"
            elif [[ ${GENERIC_TARGET:-false} == true ]]; then
              echo 'medium-matrix={"include":[{"arch":"aarch64","runner":"runner-large-arm64","target_profile":"generic"}]}' >> "$GITHUB_OUTPUT"
            else
              echo 'medium-matrix={"include":[{"arch":"aarch64","runner":"runner-large-arm64","target_profile":"lenovo-83ed"}]}' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          [[ -z ${PUBLISHED_OS_SOURCE_REVISION:-} ]] || {
            echo '::error::published_os_source_revision is only for offline installer-only runs'; exit 1;
          }
          if [[ "$GITHUB_REF" == refs/tags/imager-v* || ${FULL_NATIVE:-false} == true ]]; then
            echo 'linux-matrix={"include":[{"arch":"x86_64","runner":"imager-linux-x86_64"},{"arch":"aarch64","runner":"imager-linux-aarch64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'linux-matrix={"include":[{"arch":"x86_64","runner":"imager-linux-x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
            echo 'medium-matrix={"include":[{"arch":"x86_64","runner":"imager-linux-x86_64"},{"arch":"aarch64","runner":"imager-linux-aarch64"}]}' >> "$GITHUB_OUTPUT"
          elif [[ ${FULL_NATIVE:-false} == true ]]; then
            echo 'medium-matrix={"include":[{"arch":"x86_64","runner":"runner-disk-100g"},{"arch":"aarch64","runner":"runner-disk-100g-arm64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'medium-matrix={"include":[{"arch":"x86_64","runner":"runner-disk-100g"}]}' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event.inputs.published_os_source_revision
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Require the pinned source to be an ancestor of dispatched main
        if: github.event.inputs.published_os_source_revision
        env:
          PUBLISHED_OS_SOURCE_REVISION: ${{ github.event.inputs.published_os_source_revision }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_OS_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$PUBLISHED_OS_SOURCE_REVISION^{commit}"
          git merge-base --is-ancestor "$PUBLISHED_OS_SOURCE_REVISION" "$GITHUB_SHA" || {
            echo '::error::pinned OS source is not an ancestor of dispatched main'; exit 1;
          }

  medium:
    timeout-minutes: 180
    # Build and boot-test install media only on architecture-matched native
    # hosts. Tags use the dedicated KVM/DRI fleet; manual rehearsals may use
    # the isolated large-disk fleet with Podman plus software QEMU installed
    # inside the job. The small generic `runner` label is never eligible.
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.medium-matrix) }}
    runs-on: ${{ matrix.runner }}
    enable-openid-connect: true
    env:
      REGISTRY_AUTH_FILE: /tmp/tilo-registry-auth-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}.json
      TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY: ${{ vars.TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY }}
      TILO_PUBLISHED_OS_IMAGE: ${{ github.event.inputs.published_os_image || vars.TILO_INSTALLER_OS_IMAGE }}
      TILO_LENOVO_TARGET_IMAGE: ${{ matrix.target_profile == 'lenovo-83ed' && github.event.inputs.lenovo_target_image || '' }}
      TILO_GENERIC_TARGET: ${{ matrix.target_profile == 'generic' && 'true' || 'false' }}
      # The live medium must boot QEMU virt; the separately signed Lenovo
      # target carries its physical DTB and is staged as an offline payload.
      TILO_HARDWARE_PROFILE: generic
      # A release tag must use an OS release from the identical source commit.
      # Offline media verify the explicitly pinned signed OS source while
      # layering the dispatched main installer code onto that immutable image.
      TILO_EXPECTED_OS_SOURCE_REVISION: ${{ github.event.inputs.published_os_source_revision || (startsWith(github.ref, 'refs/tags/imager-v') && github.sha) || '' }}
      # A manual rehearsal receives no production signing interface. The
      # protected-tag broker is exposed only for the release path that requires
      # newly signed live/target UKIs in the installer overlay.
      TILO_PCR_PREDICTION_SIGNER: ${{ startsWith(github.ref, 'refs/tags/imager-v') && vars.TILO_PCR_PREDICTION_SIGNER || '' }}
      TILO_EFI_SIGNING_CERT_SHA256: ${{ startsWith(github.ref, 'refs/tags/imager-v') && vars.TILO_EFI_SIGNING_CERT_SHA256 || '' }}
      TILO_REQUIRE_PCR_PREDICTION: ${{ startsWith(github.ref, 'refs/tags/imager-v') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Verify installer source descends from signed OS source
        if: matrix.target_profile == 'generic' || matrix.target_profile == 'lenovo-83ed'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" \
            && git merge-base --is-ancestor "$TILO_EXPECTED_OS_SOURCE_REVISION" HEAD || {
            echo '::error::offline installer source is not a descendant of the signed OS source'; exit 1;
          }
      - name: Require the native medium architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"
      - name: Verify documented installation targets
        run: python3 scripts/check-install-contract.py
      - name: Verify offline target transport invariants
        if: matrix.target_profile == 'generic' || matrix.target_profile == 'lenovo-83ed'
        run: python3 -m unittest discover -s os/tests -p installer_offline_target_test.py
      - name: Materialize checksum-verified GitHub build inputs
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: github-assets-all-v1
      - name: Install the checksum-pinned image-signature verifier
        run: ./os/dev/install-cached-cosign.sh
      - name: Install native image-build and full-cycle VM dependencies
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              native_packages='ovmf python3-virt-firmware qemu-system-x86 swtpm'
              qemu_binary=qemu-system-x86_64
              display_device=virtio-vga-gl
              software_display_device=virtio-vga
            else
              native_packages='qemu-efi-aarch64 qemu-system-arm'
              qemu_binary=qemu-system-aarch64
              display_device=virtio-gpu-gl-pci
              software_display_device=virtio-gpu-pci
            fi
            sudo -n apt-get install -y --no-install-recommends \
              clang dosfstools e2fsprogs fdisk imagemagick lld mtools ntfs-3g podman fuse-overlayfs jq \
              qemu-system-gui qemu-utils skopeo slirp4netns socat tesseract-ocr uidmap zstd $native_packages
          elif command -v dnf >/dev/null; then
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              native_packages='edk2-ovmf python3-virt-firmware qemu-device-display-virtio-vga-gl qemu-system-x86-core swtpm'
              qemu_binary=qemu-system-x86_64
              display_device=virtio-vga-gl
              software_display_device=virtio-vga
            else
              native_packages='edk2-aarch64 qemu-device-display-virtio-gpu-pci-gl qemu-system-aarch64-core'
              qemu_binary=qemu-system-aarch64
              display_device=virtio-gpu-gl-pci
              software_display_device=virtio-gpu-pci
            fi
            sudo -n dnf install -y clang dosfstools e2fsprogs ImageMagick lld mtools ntfs-3g util-linux podman fuse-overlayfs slirp4netns jq \
              qemu-img qemu-ui-egl-headless qemu-ui-opengl skopeo socat tesseract zstd $native_packages
          else
            printf 'unsupported runner OS for installer VM cycle\n' >&2
            exit 1
          fi
          command -v clang debugfs ld.lld mattrib mcopy mdir mmd mkfs.ext4 mkfs.ntfs mkfs.vfat \
            mtype ntfscp podman qemu-img "$qemu_binary" sfdisk socat tesseract skopeo jq zstd >/dev/null
          command -v magick >/dev/null || command -v convert >/dev/null
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            command -v swtpm virt-fw-vars >/dev/null
          fi
          "$qemu_binary" -device help | grep -Fq "$software_display_device"
          if [[ "$GITHUB_REF" == refs/tags/imager-v* || -n ${TILO_LENOVO_TARGET_IMAGE:-} || ${TILO_GENERIC_TARGET:-false} == true ]]; then
            "$qemu_binary" -display help | grep -Fq egl-headless
            "$qemu_binary" -device help | grep -Fq "$display_device"
            test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
            compgen -G '/dev/dri/renderD*' >/dev/null
          else
            echo '::notice::manual rehearsal uses QEMU TCG plus the capturable software framebuffer'
          fi
      - name: Verify sparse qcow2 installer profile transport
        run: python3 -m unittest discover -s os/tests -p test_profile_installer_qcow2.py
      - name: Authenticate the native image builder
        env:
          TILO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TILO_REGISTRY_TOKEN"
          umask 077
          printf '%s' "$TILO_REGISTRY_TOKEN" | podman login \
            --authfile "$REGISTRY_AUTH_FILE" code.tilo.so \
            --username '${{ github.actor }}' --password-stdin
      - name: Build the tested Tilo live installer from a published OS
        run: |
          set -euo pipefail
          if [[ -n ${TILO_LENOVO_TARGET_IMAGE:-} || ${TILO_GENERIC_TARGET:-false} == true ]]; then
            test -n "$TILO_PUBLISHED_OS_IMAGE" || {
              echo '::error::offline VM medium needs a signed generic multiarch live base in published_os_image or TILO_INSTALLER_OS_IMAGE'; exit 1;
            }
            generation="$(./os/dev/use-published-image.sh "$TILO_PUBLISHED_OS_IMAGE")"
            target_dir="${RUNNER_TEMP:?}/tilo-ci-offline-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if [[ ${TILO_GENERIC_TARGET:-false} == true ]]; then
              index_raw="$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "docker://$TILO_PUBLISHED_OS_IMAGE")"
              child_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] | if length == 1 then .[0] else error("index must have one ARM64 child") end' <<<"$index_raw")"
              target_image="registry.tilo.so/tilo/tilo@$child_digest"
              target_profile=generic
            else
              target_image="$TILO_LENOVO_TARGET_IMAGE"
              target_profile=lenovo-83ed
            fi
            # The pinned source predates this workflow update. Its target
            # verifier emits the independently checked SLSA revision, so bind
            # that output here rather than relying on newer checkout scripts.
            target_verification_log="${RUNNER_TEMP:?}/tilo-target-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${target_profile}.log"
            if [[ "$target_profile" == generic ]]; then
              ./os/dev/prepare-ci-installer-target.sh "$target_profile" "$target_image" "$target_dir" "$TILO_PUBLISHED_OS_IMAGE" \
                | tee "$target_verification_log"
            else
              ./os/dev/prepare-ci-installer-target.sh "$target_profile" "$target_image" "$target_dir" \
                | tee "$target_verification_log"
            fi
            grep -Fq "verified CI $target_profile target $target_image from source $TILO_EXPECTED_OS_SOURCE_REVISION generation " "$target_verification_log" || {
              echo '::error::signed offline target source differs from pinned OS source'; exit 1;
            }
            export TILO_INSTALLER_OFFLINE_TARGET_DIR="$target_dir"
            printf 'TILO_OFFLINE_TARGET_IMAGE=%s\nTILO_OFFLINE_TARGET_PROFILE=%s\n' "$target_image" "$target_profile" >> "${GITHUB_ENV:?}"
            echo "::notice::signed generic live base generation $generation; distinct signed CI $target_profile offline target: $target_image"
          else
            test -n "$TILO_PUBLISHED_OS_IMAGE" || {
              echo '::error::set TILO_INSTALLER_OS_IMAGE to a signed, digest-pinned multi-architecture Tilo release'
              exit 1
            }
            generation="$(./os/dev/use-published-image.sh "$TILO_PUBLISHED_OS_IMAGE")"
            if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
              echo "::notice::installer source is exact-commit published generation $generation ($TILO_PUBLISHED_OS_IMAGE)"
            else
              echo "::notice::rehearsal overlays $GITHUB_SHA onto verified published generation $generation ($TILO_PUBLISHED_OS_IMAGE)"
            fi
          fi
          # The signed OS already contains the native installer binary. Reuse it
          # while applying this checkout's small installer-only runtime overlay.
          ./os/dev/build-custom-installer.sh --reuse-image-installer
          if [[ -n ${TILO_INSTALLER_OFFLINE_TARGET_DIR:-} ]]; then
            # WHPX consumes the tested qcow2 directly. The legacy imager path
            # converts it to a large raw disk and compresses that second copy;
            # neither raw bytes nor its catalog are used by an offline VM run.
            echo '::notice::offline WHPX target skips redundant raw imager bundle'
          else
            package_args=(os/output/installer/qcow2/disk.qcow2 "${{ matrix.arch }}")
            if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
              apps/imager/packaging/package-install-medium.sh "${package_args[@]}"
            else
              TILO_INSTALLER_RELEASE_TAG="rehearsal-${GITHUB_SHA}" \
              TILO_INSTALLER_VERSION=0.0.0 \
              TILO_INSTALLER_CHANNEL=rehearsal \
                apps/imager/packaging/package-install-medium.sh "${package_args[@]}"
            fi
          fi
      - name: Remove native image registry credentials
        if: always()
        run: rm -f -- "${REGISTRY_AUTH_FILE:?}"
      - name: Build and pin the isolated installer profile encoder
        run: |
          set -euo pipefail
          profile_target="${RUNNER_TEMP:?}/tilo-imager-profile-${{ matrix.arch }}"
          cargo build --release --locked \
            --manifest-path tools/imager-profile/Cargo.toml \
            --target-dir "$profile_target"
          encoder="$profile_target/release/tilo-imager-profile"
          test -f "$encoder" && test ! -L "$encoder" && test -x "$encoder"
          encoder_sha256="$(sha256sum "$encoder" | awk '{print $1}')"
          [[ "$encoder_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'TILO_PROFILE_ENCODER=%s\nTILO_PROFILE_ENCODER_SHA256=%s\n' \
            "$encoder" "$encoder_sha256" >> "${GITHUB_ENV:?}"
      - name: Prepare the release-certificate OVMF variable store
        if: startsWith(github.ref, 'refs/tags/imager-v') && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          test -n "$TILO_PCR_PREDICTION_SIGNER"
          test -n "$TILO_EFI_SIGNING_CERT_SHA256"
          firmware="$(TILO_VM_ARCH=x86_64 TILO_SECBOOT_KEYS=none \
            ./os/dev/vm.sh firmware --tpm)"
          template="$(awk '$1 == "vars" { print $2 }' <<<"$firmware")"
          test -f "$template"
          varstore="${RUNNER_TEMP:?}/tilo-release-vars-${{ github.run_id }}-${{ github.run_attempt }}.qcow2"
          ./os/dev/prepare-release-secureboot-vars.sh \
            "$template" "$varstore" "$TILO_PCR_PREDICTION_SIGNER" \
            "$TILO_EFI_SIGNING_CERT_SHA256"
          printf 'TILO_RELEASE_SECBOOT_VARS=%s\n' "$varstore" >> "${GITHUB_ENV:?}"
      - name: Exercise the complete graphical installation cycle
        env:
          TILO_ACCEL: kvm
          TILO_BOOT_WAIT_ATTEMPTS: "600"
          TILO_DISTROBOX: ""
          TILO_INSTALLER_CYCLE_STORAGE: /var/tmp/tilo-installer-cycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          TILO_INSTALLER_CYCLE_MAX_INSTALL_SECONDS: "3600"
          TILO_MEM: "8192"
          TILO_VM_CYCLE: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          cycle_graphics=()
          if [[ "$GITHUB_REF" == refs/tags/imager-v* || -n ${TILO_LENOVO_TARGET_IMAGE:-} || ${TILO_GENERIC_TARGET:-false} == true ]]; then
            export TILO_ACCEL=kvm
          else
            export TILO_ACCEL=tcg
            cycle_graphics=(--graphics software)
          fi
          if [[ -n ${TILO_OFFLINE_TARGET_IMAGE:-} ]]; then
            export TILO_EXPECTED_INSTALLED_REF="$TILO_OFFLINE_TARGET_IMAGE"
          fi
          if [[ -n ${TILO_LENOVO_TARGET_IMAGE:-} ]]; then
            # QEMU virt can boot the generic installer, then validate that it
            # wrote the exact Lenovo target. The board target's Lenovo DTB
            # cannot boot on QEMU virt; physical boot is a separate gate.
            ./os/dev/test-installer-cycle.sh \
              os/output/installer/qcow2/disk.qcow2 \
              --guided-alongside --install-only \
              --out dist/installer-guided-alongside-cycle
            test "$(cat dist/installer-guided-alongside-cycle/verdict.txt)" = PASS_INSTALL_ONLY
            test -s dist/installer-guided-alongside-cycle/guest-install-proof.json
            test -s dist/installer-guided-alongside-cycle/installed-target-esp-readback.txt
            test -s dist/installer-guided-alongside-cycle/alongside-preservation.txt
            exit 0
          fi
          if [[ ${TILO_GENERIC_TARGET:-false} == true ]]; then
            ./os/dev/test-installer-cycle.sh \
              os/output/installer/qcow2/disk.qcow2 \
              --guided-alongside \
              --out dist/installer-guided-alongside-cycle
            test "$(cat dist/installer-guided-alongside-cycle/verdict.txt)" = PASS
            test -s dist/installer-guided-alongside-cycle/guest-install-proof.json
            test -s dist/installer-guided-alongside-cycle/installed-target-esp-readback.txt
            test -s dist/installer-guided-alongside-cycle/alongside-preservation.txt
            exit 0
          fi
          ./os/dev/test-installer-cycle.sh \
            os/output/installer/qcow2/disk.qcow2 \
            "${cycle_graphics[@]}" \
            --out dist/installer-cycle
          TILO_VM_CYCLE="${TILO_VM_CYCLE}-alongside" \
            ./os/dev/test-installer-cycle.sh \
              os/output/installer/qcow2/disk.qcow2 \
              "${cycle_graphics[@]}" \
              --prepared-alongside \
              --out dist/installer-alongside-cycle
          TILO_VM_CYCLE="${TILO_VM_CYCLE}-guided-alongside" \
            ./os/dev/test-installer-cycle.sh \
              os/output/installer/qcow2/disk.qcow2 \
              "${cycle_graphics[@]}" \
              --guided-alongside \
              --out dist/installer-guided-alongside-cycle
          if [[ "$GITHUB_REF" == refs/tags/imager-v* && "${{ matrix.arch }}" == x86_64 ]]; then
            TILO_VM_CYCLE="${TILO_VM_CYCLE}-software-tpm-pin" \
            TILO_SECBOOT_KEYS="${TILO_RELEASE_SECBOOT_VARS:?}" \
              ./os/dev/test-installer-cycle.sh \
                os/output/installer/qcow2/disk.qcow2 \
                --software-tpm \
                --out dist/installer-software-tpm-pin-cycle
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: tilo-installer-full-cycle-${{ matrix.arch }}-${{ matrix.target_profile || 'standard' }}
          path: |
            dist/installer-cycle
            dist/installer-alongside-cycle
            dist/installer-guided-alongside-cycle
            dist/installer-software-tpm-pin-cycle
          if-no-files-found: error
      # WHPX on Windows consumes qcow2 directly. Compress the exact disk that
      # passed the native ARM64 cycle so the laptop downloads it once and never
      # reconstructs an OS image or repeats a raw-to-qcow2 conversion.
      - name: Package tested signed-target WHPX qcow2
        if: matrix.target_profile == 'generic' || matrix.target_profile == 'lenovo-83ed'
        run: |
          set -euo pipefail
          mkdir -p dist/tilo-installer
          stem="tilo-installer-${TILO_OFFLINE_TARGET_PROFILE:?}-aarch64"
          output="dist/tilo-installer/$stem.qcow2.zst"
          zstd --threads=0 -1 --sparse -f os/output/installer/qcow2/disk.qcow2 -o "$output"
          (cd dist/tilo-installer && sha256sum "$(basename "$output")") > "$output.sha256"
          zstd --decompress --stdout -- "$output" | sha256sum | awk '{print $1}' \
            > "dist/tilo-installer/$stem.qcow2.sha256"
          test "$(cat "dist/tilo-installer/$stem.qcow2.sha256")" = \
            "$(sha256sum os/output/installer/qcow2/disk.qcow2 | awk '{print $1}')"
          jq -n --arg schema tilo.whpx-ci-installer-medium.v1 \
            --arg profile "$TILO_OFFLINE_TARGET_PROFILE" \
            --arg target "$TILO_OFFLINE_TARGET_IMAGE" \
            --arg live_base "$TILO_PUBLISHED_OS_IMAGE" \
            --arg build_revision "$(git rev-parse HEAD)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg qcow2_sha256 "$(cat "dist/tilo-installer/$stem.qcow2.sha256")" \
            --arg archive_sha256 "$(awk '{print $1}' "$output.sha256")" \
            --arg guest_proof_sha256 "$(sha256sum dist/installer-guided-alongside-cycle/guest-install-proof.json | awk '{print $1}')" \
            '{schema:$schema,target_profile:$profile,target_image:$target,live_base_image:$live_base,
              build_revision:$build_revision,run_id:$run_id,run_attempt:$run_attempt,
              qcow2_sha256:$qcow2_sha256,archive_sha256:$archive_sha256,
              guest_proof_sha256:$guest_proof_sha256}' \
            > "dist/tilo-installer/$stem.whpx-source.json"
      - name: Sign and verify WHPX medium identity
        if: matrix.target_profile == 'generic' || matrix.target_profile == 'lenovo-83ed'
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          identity="dist/tilo-installer/tilo-installer-${TILO_OFFLINE_TARGET_PROFILE:?}-aarch64.whpx-source.json"
          cosign sign-blob --yes --key "$COSIGN_KEY_REF" \
            --bundle "$identity.bundle" --output-signature "$identity.sig" "$identity"
          cosign verify-blob --offline --key keys/cosign.pub \
            --bundle "$identity.bundle" --signature "$identity.sig" "$identity"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: matrix.target_profile == 'generic' || matrix.target_profile == 'lenovo-83ed'
        with:
          name: tilo-${{ matrix.target_profile }}-whpx-installer-${{ github.event.inputs.published_os_source_revision || github.sha }}
          path: |
            dist/tilo-installer/tilo-installer-generic-aarch64.qcow2.zst
            dist/tilo-installer/tilo-installer-generic-aarch64.qcow2.zst.sha256
            dist/tilo-installer/tilo-installer-generic-aarch64.qcow2.sha256
            dist/tilo-installer/tilo-installer-generic-aarch64.whpx-source.json
            dist/tilo-installer/tilo-installer-generic-aarch64.whpx-source.json.bundle
            dist/tilo-installer/tilo-installer-generic-aarch64.whpx-source.json.sig
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.qcow2.zst
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.qcow2.zst.sha256
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.qcow2.sha256
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.whpx-source.json
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.whpx-source.json.bundle
            dist/tilo-installer/tilo-installer-lenovo-83ed-aarch64.whpx-source.json.sig
            os/output/installer/qcow2/disk.qcow2.hardware.json
          if-no-files-found: error
      - name: Verify the installer-medium release payload
        run: |
          set -euo pipefail
          medium="tilo-installer-linux-${{ matrix.arch }}.img.zst"
          [[ -z ${TILO_OFFLINE_TARGET_IMAGE:-} ]] || exit 0
          test -s "dist/tilo-installer/$medium"
          test -s "dist/tilo-installer/$medium.sha256"
          test -s "dist/tilo-installer/catalog-${{ matrix.arch }}.json"
          (cd dist/tilo-installer && sha256sum --check "$medium.sha256")
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: matrix.target_profile != 'generic' && matrix.target_profile != 'lenovo-83ed'
        with:
          name: tilo-installer-medium-${{ matrix.arch }}-${{ matrix.target_profile || 'standard' }}
          path: |
            dist/tilo-installer/tilo-installer-linux-${{ matrix.arch }}.img.zst
            dist/tilo-installer/tilo-installer-linux-${{ matrix.arch }}.img.zst.sha256
            dist/tilo-installer/catalog-${{ matrix.arch }}.json
          if-no-files-found: error
      # Internal (USB-free) installer bundle, exported from the same live disk
      # that just passed the installation cycles. Opt-in through the protected
      # repository variable IMAGER_INTERNAL_BUNDLE: unset does nothing, `export`
      # tests and exports on every run, `publish` additionally publishes tagged
      # releases as a Forgejo package and adds the catalog entries.
      - name: Test the internal installer bundle exporter
        if: vars.IMAGER_INTERNAL_BUNDLE == 'export' || vars.IMAGER_INTERNAL_BUNDLE == 'publish'
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              btrfs-progs dosfstools fdisk qemu-utils util-linux
          else
            sudo -n dnf install -y btrfs-progs dosfstools qemu-img util-linux
          fi
          python3 -m unittest discover -s os/tests -p 'internal_bundle_test.py'
          bash os/tests/internal_bundle_catalog.sh
          sudo -n bash os/tests/internal_bundle_export.sh
      - name: Export the internal installer bundle
        if: vars.IMAGER_INTERNAL_BUNDLE == 'export' || vars.IMAGER_INTERNAL_BUNDLE == 'publish'
        env:
          TILO_INTERNAL_BUNDLE_OWNER: ${{ vars.IMAGER_INTERNAL_BUNDLE_OWNER || 'tilo' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
            release_id="$GITHUB_REF_NAME"
          else
            release_id="rehearsal-${GITHUB_SHA}"
          fi
          rm -rf dist/tilo-internal
          os/dev/export-internal-bundle.sh os/output/installer/qcow2/disk.qcow2 \
            "${{ matrix.arch }}" "$release_id" dist/tilo-internal
          ls -l dist/tilo-internal/bundle
      - name: Publish the internal installer bundle
        if: startsWith(github.ref, 'refs/tags/imager-v') && vars.IMAGER_INTERNAL_BUNDLE == 'publish'
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_INTERNAL_BUNDLE_CREDENTIAL_BROKER }}
          TILO_INTERNAL_BUNDLE_OWNER: ${{ vars.IMAGER_INTERNAL_BUNDLE_OWNER || 'tilo' }}
        run: apps/imager/packaging/publish-internal-bundle.sh dist/tilo-internal/bundle
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: startsWith(github.ref, 'refs/tags/imager-v') && vars.IMAGER_INTERNAL_BUNDLE == 'publish'
        with:
          # Only the manifest and its catalog entry: the component images are
          # already published and must not reach the GitHub release.
          name: tilo-internal-catalog-${{ matrix.arch }}
          path: |
            dist/tilo-internal/internal-catalog-${{ matrix.arch }}.json
            dist/tilo-internal/bundle/tilo-internal-installer-${{ matrix.arch }}.json
          if-no-files-found: error

  # USB-free installation VM round trip on the x86_64 medium this run just
  # built and boot-tested (design spec §9). Opt-in with the same repository
  # variable as the bundle export.
  internal-install-cycle:
    timeout-minutes: 180
    needs: medium
    # Needs the dedicated KVM release host, which installer-only rehearsals
    # deliberately do not use.
    if: github.event.inputs.installer_only != 'true' && (vars.IMAGER_INTERNAL_BUNDLE == 'export' || vars.IMAGER_INTERNAL_BUNDLE == 'publish')
    runs-on: imager-linux-x86_64
    env:
      FEDORA_URL: ${{ vars.TILO_INTERNAL_CYCLE_FEDORA_URL }}
      FEDORA_SHA256: ${{ vars.TILO_INTERNAL_CYCLE_FEDORA_SHA256 }}
      SCENARIO: all
      TILO_INTERNAL_CYCLE_RELEASE_TAG: imager-v0.0.${{ github.run_number }}
      TILO_INTERNAL_CYCLE_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      TILO_INTERNAL_CYCLE_STORAGE_ROOT: /var/tmp/tilo-internal-cycle-release-${{ github.run_id }}-${{ github.run_attempt }}
      TILO_INTERNAL_BUNDLE_OWNER: ${{ vars.IMAGER_INTERNAL_BUNDLE_OWNER || 'tilo' }}
      TILO_ACCEL: kvm
      TILO_DISTROBOX: ""
      TILO_MEM: "8192"
      TILO_INTERNAL_CYCLE_MAX_INSTALL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require a native x86_64 KVM host
        run: ./os/dev/assert-native-arch.sh x86_64
      - name: Install internal-cycle VM dependencies
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends \
              btrfs-progs capnproto curl dosfstools e2fsprogs fdisk imagemagick jq mtools \
              openssh-client ovmf qemu-system-gui qemu-system-x86 qemu-utils socat \
              tesseract-ocr util-linux zstd
          elif command -v dnf >/dev/null; then
            sudo -n dnf install -y btrfs-progs capnproto curl dosfstools e2fsprogs edk2-ovmf ImageMagick \
              jq mtools openssh-clients qemu-device-display-virtio-vga-gl qemu-img \
              qemu-system-x86-core qemu-ui-egl-headless qemu-ui-opengl socat tesseract util-linux zstd
          else
            printf 'unsupported runner OS for the internal install cycle\n' >&2
            exit 1
          fi
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: tilo-installer-medium-x86_64
          path: dist/internal-cycle-medium
      - name: Run the VM round trip on the tested medium
        run: |
          set -euo pipefail
          (cd dist/internal-cycle-medium && sha256sum --check --strict tilo-installer-linux-x86_64.img.zst.sha256)
          zstd -d --quiet -o "$TILO_INTERNAL_CYCLE_STORAGE_ROOT.installer.raw" \
            dist/internal-cycle-medium/tilo-installer-linux-x86_64.img.zst
          ./os/dev/ci-internal-install-cycle.sh "$TILO_INTERNAL_CYCLE_STORAGE_ROOT.installer.raw" \
            dist/internal-install-cycle
      - name: Remove internal-cycle VM storage
        if: always()
        run: sudo -n rm -rf "$TILO_INTERNAL_CYCLE_STORAGE_ROOT" "$TILO_INTERNAL_CYCLE_STORAGE_ROOT.installer.raw"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: tilo-internal-install-cycle-x86_64
          path: dist/internal-install-cycle
          if-no-files-found: error

  catalog:
    timeout-minutes: 60
    needs: [plan, medium]
    runs-on: runner
    outputs:
      linux-matrix: ${{ needs.plan.outputs.linux-matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        if: startsWith(github.ref, 'refs/tags/imager-v')
        with:
          path: release-assets
      - name: Assemble the release catalog
        env:
          TILO_INTERNAL_BUNDLE_OWNER: ${{ vars.IMAGER_INTERNAL_BUNDLE_OWNER || 'tilo' }}
          TILO_REQUIRE_INTERNAL_BUNDLE: ${{ vars.IMAGER_INTERNAL_BUNDLE == 'publish' && '1' || '0' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
            apps/imager/packaging/build-release-catalog.sh release-assets
          else
            mkdir -p dist/tilo-installer-catalog
            cp apps/imager/release-catalog.json \
              dist/tilo-installer-catalog/tilo-installer-catalog-v1.json
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-installer-catalog
          path: dist/tilo-installer-catalog/*

  linux:
    timeout-minutes: 180
    if: github.event.inputs.installer_only != 'true'
    needs: catalog
    # Forgejo injects ACTIONS_ID_TOKEN_REQUEST_* only when this native setting
    # is enabled; GitHub's `permissions: id-token: write` is not sufficient.
    enable-openid-connect: true
    strategy:
      matrix: ${{ fromJSON(needs.catalog.outputs.linux-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Materialize checksum-verified AppImage tools
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: imager-linux-tools-${{ matrix.arch }}
          assets: >-
            linuxdeploy-1-alpha-20251107-1-${{ matrix.arch }}.AppImage
            appimagetool-1.9.1-${{ matrix.arch }}.AppImage
            type2-runtime-20251108-${{ matrix.arch }}
          fallback-keys: |
            github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
            github-assets-all-v1-
      - name: Install pinned AppImage tools
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          tool_dir="$RUNNER_TEMP/tilo-imager-tools"
          mkdir -p "$tool_dir"
          install -m 0755 \
            "os/external-assets/cache/linuxdeploy-1-alpha-20251107-1-${arch}.AppImage" \
            "$tool_dir/linuxdeploy"
          install -m 0755 \
            "os/external-assets/cache/appimagetool-1.9.1-${arch}.AppImage" \
            "$tool_dir/appimagetool"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
          printf 'TILO_APPIMAGE_RUNTIME=%s\n' \
            "$GITHUB_WORKSPACE/os/external-assets/cache/type2-runtime-20251108-${arch}" \
            >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: tilo-installer-catalog
          path: release-catalog
      - run: python3 apps/imager/packaging/release-catalog.py release-catalog --copy-to apps/imager/release-catalog.json
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        if: startsWith(github.ref, 'refs/tags/imager-v')
        with:
          # All media are needed: each native lane signs its catalogued boards.
          path: release-medium
      - name: Install native schema compiler
        run: |
          if ! command -v capnp >/dev/null; then
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends capnproto
            elif command -v dnf >/dev/null; then
              dnf install -y capnproto
            else
              printf 'cannot install capnproto: unsupported Linux runner image\n' >&2
              exit 1
            fi
          fi
          capnp --version
      - name: Configure release signing
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_LINUX_CREDENTIAL_BROKER }}
          EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/imager-v*)
              version="${GITHUB_REF_NAME#imager-v}"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                || { printf 'release tag must be imager-vMAJOR.MINOR.PATCH\n' >&2; exit 1; }
              test -n "${CREDENTIAL_BROKER:-}" || {
                printf 'configure IMAGER_LINUX_CREDENTIAL_BROKER; release signing is OIDC-broker-only\n' >&2
                exit 1
              }
              apps/imager/packaging/acquire-release-credentials.sh \
                linux "$CREDENTIAL_BROKER" >> "$GITHUB_ENV"
              [[ "${EXPECTED_FINGERPRINT^^}" =~ ^([A-F0-9]{40}|[A-F0-9]{64})$ ]] \
                || { printf 'configure IMAGER_LINUX_SIGNING_FINGERPRINT with the full release-key fingerprint\n' >&2; exit 1; }
              echo "TILO_REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
              echo "TILO_LINUX_EXPECTED_FINGERPRINT=${EXPECTED_FINGERPRINT^^}" >> "$GITHUB_ENV"
              echo "TILO_REQUIRE_NATIVE_PACKAGES=1" >> "$GITHUB_ENV"
              echo "TILO_VERSION=${GITHUB_REF_NAME#imager-v}" >> "$GITHUB_ENV"
              ;;
          esac
      - run: cargo test -p imager --lib --locked
      - name: Prove the packaged host writer is enabled
        run: cargo test -p imager --lib --locked --features host-media-writer
      - name: Prove the sandboxed UDisks2 writer is enabled
        run: cargo test -p imager --lib --locked --features flatpak-media-writer
      - name: Build the complete native Linux package set
        env:
          TILO_REQUIRE_NATIVE_PACKAGES: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          apps/imager/packaging/package-host.sh
          apps/imager/packaging/package-flatpak.sh
      - name: Sign the directly downloadable installer payloads
        if: startsWith(github.ref, 'refs/tags/imager-v')
        run: |
          set -euo pipefail
          bash apps/imager/packaging/sign-installer-release.sh \
            release-catalog release-medium '${{ matrix.arch }}' dist/tilo-imager
          flatpak="dist/tilo-imager/tilo-imager-linux-${{ matrix.arch }}.flatpak"
          apps/imager/packaging/sign-linux-release-file.sh \
            "$flatpak" "$flatpak.asc"
      - name: Launch the packaged Linux UI offscreen
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          archive="dist/tilo-imager/tilo-imager-linux-${{ matrix.arch }}.tar.gz"
          tar -xzf "$archive" -C "$smoke"
          "$smoke/tilo-imager-linux-${{ matrix.arch }}/tilo-imager" \
            --shots "$smoke/archive.png" --scenario confirm --viewport 1180x820
          test -s "$smoke/archive.png"
          appimage="dist/tilo-imager/tilo-imager-linux-${{ matrix.arch }}.AppImage"
          if [ -f "$appimage" ]; then
            apps/imager/packaging/verify-appimage-runtime.sh \
              "$appimage" "$smoke/appimage"
          elif [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
            printf 'release AppImage is missing\n' >&2
            exit 1
          fi
      # Forgejo does not implement the Artifact API v2 used by v4.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-imager-linux-${{ matrix.arch }}
          path: |
            dist/tilo-imager/tilo-imager-linux-*.tar.gz
            dist/tilo-imager/tilo-imager-linux-*.tar.gz.sha256
            dist/tilo-imager/tilo-imager-linux-*.tar.gz.asc
            dist/tilo-imager/tilo-imager-linux-*.AppImage
            dist/tilo-imager/tilo-imager-linux-*.AppImage.sha256
            dist/tilo-imager/tilo-imager-linux-*.AppImage.asc
            dist/tilo-imager/tilo-imager-linux-*.flatpak
            dist/tilo-imager/tilo-imager-linux-*.flatpak.sha256
            dist/tilo-imager/tilo-imager-linux-*.flatpak.asc
            dist/tilo-imager/tilo-installer-*.asc
          if-no-files-found: error
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: matrix.arch == 'x86_64' && startsWith(github.ref, 'refs/tags/imager-v')
        with:
          name: tilo-imager-linux-release-key
          path: |
            dist/tilo-imager/tilo-release-key.asc
            dist/tilo-imager/tilo-release-key.asc.sha256
            dist/tilo-imager/tilo-release-key.fingerprint
            dist/tilo-imager/tilo-release-key.fingerprint.sha256
          if-no-files-found: error

  windows:
    timeout-minutes: 180
    if: github.event.inputs.installer_only != 'true' && (startsWith(github.ref, 'refs/tags/imager-v') || github.event.inputs.full_native == 'true')
    needs: catalog
    enable-openid-connect: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: imager-windows-x86_64
          - arch: aarch64
            runner: imager-windows-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TILO_WINDOWS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: tilo-installer-catalog
          path: release-catalog
      - shell: powershell
        run: |
          python apps/imager/packaging/release-catalog.py release-catalog --copy-to apps/imager/release-catalog.json
          if ($LASTEXITCODE -ne 0) { throw "Installer catalog selection failed" }
      - name: Require native Windows architecture
        shell: powershell
        run: |
          $Expected = if ($env:TILO_WINDOWS_ARCH -eq 'aarch64') { 12 } else { 9 }
          $Processors = @(Get-CimInstance Win32_Processor)
          if ($Processors.Count -eq 0 -or @($Processors | Where-Object { $_.Architecture -ne $Expected }).Count -ne 0) {
            throw "Windows runner architecture does not match $env:TILO_WINDOWS_ARCH"
          }
      - name: Configure release signing
        shell: powershell
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_WINDOWS_CREDENTIAL_BROKER }}
          EXPECTED_PUBLISHER: ${{ vars.IMAGER_WINDOWS_PUBLISHER }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/imager-v*") {
            $Version = $env:GITHUB_REF_NAME -replace '^imager-v', ''
            if ($Version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "release tag must be imager-vMAJOR.MINOR.PATCH" }
            if (-not $env:CREDENTIAL_BROKER) {
              throw "Configure IMAGER_WINDOWS_CREDENTIAL_BROKER; release signing is OIDC-broker-only"
            }
            & apps/imager/packaging/Acquire-ReleaseCredentials.ps1 broker $env:CREDENTIAL_BROKER |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TILO_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if (-not $env:EXPECTED_PUBLISHER) { throw "Configure IMAGER_WINDOWS_PUBLISHER" }
            if ($env:EXPECTED_PUBLISHER -match "[`r`n]") { throw "Windows publisher policy must be a single line" }
            "TILO_WINDOWS_EXPECTED_PUBLISHER=$env:EXPECTED_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TILO_REQUIRE_NATIVE_PACKAGES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TILO_VERSION=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($env:TILO_RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw "release repository must be OWNER/REPOSITORY" }
            "TILO_RELEASE_BASE_URL=$($env:TILO_RELEASE_SERVER.TrimEnd('/'))/$env:TILO_RELEASE_REPOSITORY/releases/download/$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - shell: powershell
        run: cargo test -p imager --lib --locked --target "$env:TILO_WINDOWS_ARCH-pc-windows-msvc"
      - name: Prove the packaged host writer is enabled
        shell: powershell
        run: cargo test -p imager --lib --locked --features host-media-writer --target "$env:TILO_WINDOWS_ARCH-pc-windows-msvc"
      - name: Build the complete native Windows package set
        shell: powershell
        env:
          TILO_REQUIRE_NATIVE_PACKAGES: "1"
        run: apps/imager/packaging/package-host.ps1 -Architecture $env:TILO_WINDOWS_ARCH
      - name: Verify Windows package architecture boundaries
        shell: powershell
        run: |
          & apps/imager/packaging/test-package-host.ps1
          & apps/imager/packaging/test-package-architecture.ps1
          & tools/tests/windows_runner_architecture.ps1
      - name: Install and launch the packaged Windows UI offscreen
        shell: powershell
        run: |
          $Smoke = Join-Path $env:RUNNER_TEMP "tilo-imager-smoke"
          $Install = Join-Path $Smoke "installed"
          New-Item -ItemType Directory -Force -Path $Smoke | Out-Null
          $Setup = "dist/tilo-imager/tilo-imager-setup-windows-$env:TILO_WINDOWS_ARCH.exe"
          if (Test-Path $Setup) {
            & $Setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$Install"
            if ($LASTEXITCODE -ne 0) { throw "Tilo Imager setup failed" }
            $Binary = Join-Path $Install "tilo-imager.exe"
          } elseif ($env:GITHUB_REF -like "refs/tags/imager-v*") {
            throw "release setup executable is missing"
          } else {
            $Binary = "dist/tilo-imager/tilo-imager-windows-$env:TILO_WINDOWS_ARCH.exe"
          }
          $Shot = Join-Path $Smoke "installed.png"
          & $Binary --shots $Shot --scenario confirm --viewport 1180x820
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $Shot) -or (Get-Item $Shot).Length -eq 0) {
            throw "packaged Tilo Imager did not render its UI"
          }
      - name: Validate the generated WinGet manifest
        if: startsWith(github.ref, 'refs/tags/imager-v')
        shell: powershell
        run: |
          $Winget = (Get-Command winget.exe -ErrorAction Stop).Source
          & $Winget validate --manifest dist/tilo-imager/winget
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation failed" }
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-imager-windows-${{ matrix.arch }}
          path: |
            dist/tilo-imager/tilo-imager-windows-${{ matrix.arch }}.exe
            dist/tilo-imager/tilo-imager-windows-${{ matrix.arch }}.exe.sha256
            dist/tilo-imager/tilo-imager-windows-${{ matrix.arch }}.zip
            dist/tilo-imager/tilo-imager-windows-${{ matrix.arch }}.zip.sha256
            dist/tilo-imager/tilo-imager-setup-windows-${{ matrix.arch }}.exe
            dist/tilo-imager/tilo-imager-setup-windows-${{ matrix.arch }}.exe.sha256
          if-no-files-found: error

  macos:
    timeout-minutes: 180
    if: github.event.inputs.installer_only != 'true' && (startsWith(github.ref, 'refs/tags/imager-v') || github.event.inputs.full_native == 'true')
    needs: catalog
    enable-openid-connect: true
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: imager-macos-x86_64
          - arch: aarch64
            runner: imager-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: tilo-installer-catalog
          path: release-catalog
      - run: python3 apps/imager/packaging/release-catalog.py release-catalog --copy-to apps/imager/release-catalog.json
      - name: Configure release signing
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_MACOS_CREDENTIAL_BROKER }}
          EXPECTED_TEAM_ID: ${{ vars.IMAGER_MAC_TEAM_ID }}
          EXPECTED_CERT_SHA256: ${{ vars.IMAGER_MAC_CERT_SHA256 }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/imager-v*)
              version="${GITHUB_REF_NAME#imager-v}"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                || { printf 'release tag must be imager-vMAJOR.MINOR.PATCH\n' >&2; exit 1; }
              test -n "${CREDENTIAL_BROKER:-}" || {
                printf 'configure IMAGER_MACOS_CREDENTIAL_BROKER; release signing is OIDC-broker-only\n' >&2
                exit 1
              }
              apps/imager/packaging/acquire-release-credentials.sh \
                macos "$CREDENTIAL_BROKER" >> "$GITHUB_ENV"
              echo "TILO_REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
              [[ "${EXPECTED_TEAM_ID:-}" =~ ^[A-Z0-9]{10}$ ]] \
                || { printf 'configure IMAGER_MAC_TEAM_ID\n' >&2; exit 1; }
              cert_fingerprint="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
              cert_fingerprint="${cert_fingerprint//:/}"
              [[ "$cert_fingerprint" =~ ^[A-F0-9]{64}$ ]] \
                || { printf 'configure IMAGER_MAC_CERT_SHA256\n' >&2; exit 1; }
              echo "TILO_MAC_EXPECTED_TEAM_ID=$EXPECTED_TEAM_ID" >> "$GITHUB_ENV"
              echo "TILO_MAC_EXPECTED_CERT_SHA256=$cert_fingerprint" >> "$GITHUB_ENV"
              echo "TILO_REQUIRE_NATIVE_PACKAGES=1" >> "$GITHUB_ENV"
              echo "TILO_VERSION=${GITHUB_REF_NAME#imager-v}" >> "$GITHUB_ENV"
              ;;
          esac
      - run: cargo test -p imager --lib --locked
      - name: Prove the packaged host writer is enabled
        run: cargo test -p imager --lib --locked --features host-media-writer
      - name: Build the complete native macOS package set
        env:
          TILO_REQUIRE_NATIVE_PACKAGES: "1"
        run: apps/imager/packaging/package-host.sh
      - name: Remove temporary macOS signing credentials
        if: always()
        run: |
          set +e
          if [ -n "${TILO_NOTARY_KEYCHAIN_PROFILE:-}" ]; then
            security delete-generic-password -s com.apple.gke.notary.tool \
              -a "$TILO_NOTARY_KEYCHAIN_PROFILE" 2>/dev/null
          fi
          true
      - name: Mount and launch the packaged macOS UI offscreen
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          mountpoint="$smoke/mount"
          mkdir -p "$mountpoint"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet 2>/dev/null || true
            rm -rf "$smoke"
          }
          trap cleanup EXIT
          dmg="dist/tilo-imager/tilo-imager-macos-${{ matrix.arch }}.dmg"
          if [ -f "$dmg" ]; then
            hdiutil attach "$dmg" -quiet -nobrowse -readonly -mountpoint "$mountpoint"
            "$mountpoint/Tilo Imager.app/Contents/MacOS/tilo-imager" \
              --shots "$smoke/dmg.png" --scenario done --viewport 1180x820
            test -s "$smoke/dmg.png"
            if [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
              codesign --verify --deep --strict --verbose=2 \
                "$mountpoint/Tilo Imager.app"
            fi
          elif [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
            printf 'release DMG is missing\n' >&2
            exit 1
          else
            "dist/tilo-imager/Tilo Imager.app/Contents/MacOS/tilo-imager" \
              --shots "$smoke/app.png" --scenario done --viewport 1180x820
            test -s "$smoke/app.png"
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-imager-macos-${{ matrix.arch }}
          path: |
            dist/tilo-imager/tilo-imager-macos-*.zip
            dist/tilo-imager/tilo-imager-macos-*.zip.sha256
            dist/tilo-imager/tilo-imager-macos-*.dmg
            dist/tilo-imager/tilo-imager-macos-*.dmg.sha256
          if-no-files-found: error

  publish:
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: [linux, windows, macos]
    runs-on: runner
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Generate the complete WinGet manifest set
        shell: bash
        run: |
          python3 apps/imager/packaging/generate-winget.py release-assets \
            --version "${GITHUB_REF_NAME#imager-v}" \
            --base-url "${TILO_RELEASE_SERVER%/}/${TILO_RELEASE_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Require the complete native release matrix
        id: enabled-assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tilo-installer-linux-x86_64.img.zst
            tilo-installer-linux-aarch64.img.zst
            tilo-imager-linux-x86_64.AppImage
            tilo-imager-linux-aarch64.AppImage
            tilo-imager-linux-x86_64.tar.gz
            tilo-imager-linux-aarch64.tar.gz
            tilo-imager-linux-x86_64.flatpak
            tilo-imager-linux-aarch64.flatpak
            tilo-imager-windows-x86_64.exe
            tilo-imager-windows-x86_64.zip
            tilo-imager-setup-windows-x86_64.exe
            tilo-imager-windows-aarch64.exe
            tilo-imager-windows-aarch64.zip
            tilo-imager-setup-windows-aarch64.exe
            tilo-imager-macos-x86_64.zip
            tilo-imager-macos-x86_64.dmg
            tilo-imager-macos-aarch64.zip
            tilo-imager-macos-aarch64.dmg
          )
          for name in "${required[@]}"; do
            path="$(find release-assets -type f -name "$name" -print -quit)"
            test -n "$path" || { printf 'missing release artifact: %s\n' "$name" >&2; exit 1; }
            test -s "$path.sha256" || { printf 'missing release digest: %s.sha256\n' "$name" >&2; exit 1; }
            (cd "$(dirname "$path")" && sha256sum --check --strict "$(basename "$path").sha256") \
              || { printf 'invalid release digest: %s.sha256\n' "$name" >&2; exit 1; }
            case "$name" in
              *.img.zst)
                test -s "$(find release-assets -type f -name "$name.asc" -print -quit)" \
                  || { printf 'missing release signature: %s.asc\n' "$name" >&2; exit 1; }
                ;;
              *.AppImage|*.tar.gz|*.flatpak) test -s "$path.asc" \
                || { printf 'missing release signature: %s.asc\n' "$name" >&2; exit 1; } ;;
            esac
          done
          for name in Tilo.Imager.installer.yaml Tilo.Imager.yaml Tilo.Imager.locale.en-US.yaml; do
            test -n "$(find release-assets -type f -name "$name" -print -quit)" \
              || { printf 'missing WinGet manifest: %s\n' "$name" >&2; exit 1; }
          done
      - name: Verify Linux release trust bundle
        env:
          TILO_LINUX_EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: apps/imager/packaging/verify-linux-release.sh release-assets
      - name: Publish signed downloads to the tag release
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_RELEASE_CREDENTIAL_BROKER }}
          TILO_LINUX_EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "${CREDENTIAL_BROKER:-}" || {
            printf 'configure the OIDC credential broker for public release publication\n' >&2
            exit 1
          }
          token_file="$RUNNER_TEMP/tilo-public-release-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          apps/imager/packaging/acquire-release-token.sh \
            release "$CREDENTIAL_BROKER" "$token_file"
          release_token="$(cat "$token_file")"
          revoke() {
            GITHUB_INSTALLATION_TOKEN="$release_token" \
              apps/imager/packaging/revoke-github-installation-token.sh || true
          }
          trap 'revoke; rm -f "$token_file"' EXIT
          GITHUB_RELEASE_TOKEN="$release_token" \
            apps/imager/packaging/publish-github-release.sh release-assets

  homebrew:
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: publish
    runs-on: imager-linux-aarch64
    env:
      TILO_IMAGER_MACOS_ENABLED: "1"
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Publish the Tilo Homebrew tap
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_HOMEBREW_CREDENTIAL_BROKER }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/tilo-homebrew-tap-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -z "${CREDENTIAL_BROKER:-}" ]; then
            printf 'configure the OIDC credential broker for Homebrew publication\n' >&2
            exit 1
          fi
          apps/imager/packaging/acquire-release-token.sh \
            homebrew "$CREDENTIAL_BROKER" "$token_file"
          tap_token="$(cat "$token_file")"
          revoke() {
            GITHUB_INSTALLATION_TOKEN="$tap_token" \
              apps/imager/packaging/revoke-github-installation-token.sh || true
          }
          trap 'revoke; rm -f "$token_file"' EXIT
          HOMEBREW_TAP_TOKEN="$tap_token" \
            apps/imager/packaging/publish-homebrew-tap.sh release-assets

  homebrew-install-test:
    timeout-minutes: 90
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: homebrew
    strategy:
      matrix:
        include:
          - runner: imager-linux-x86_64
            package_kind: formula
          - runner: imager-linux-aarch64
            package_kind: formula
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install and test the published Homebrew package
        env:
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          set -euo pipefail
          command -v brew >/dev/null
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap tilo/tilo https://github.com/tilo-os/homebrew-tilo.git
          if [ "$PACKAGE_KIND" = formula ]; then
            brew install tilo/tilo/tilo-imager
            brew test tilo/tilo/tilo-imager
            brew uninstall tilo-imager
          else
            brew install --cask tilo/tilo/tilo-imager
            brew list --cask tilo-imager >/dev/null
            brew uninstall --cask tilo-imager
          fi

  homebrew-macos-install-test:
    timeout-minutes: 90
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: homebrew
    strategy:
      matrix:
        include:
          - runner: imager-macos-x86_64
            package_kind: cask
          - runner: imager-macos-aarch64
            package_kind: cask
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install and test the published Homebrew package
        env:
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          set -euo pipefail
          command -v brew >/dev/null
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap tilo/tilo https://github.com/tilo-os/homebrew-tilo.git
          if [ "$PACKAGE_KIND" = formula ]; then
            brew install tilo/tilo/tilo-imager
            brew test tilo/tilo/tilo-imager
            brew uninstall tilo-imager
          else
            brew install --cask tilo/tilo/tilo-imager
            brew list --cask tilo-imager >/dev/null
            brew uninstall --cask tilo-imager
          fi

  winget:
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: publish
    runs-on: runner
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Submit Tilo Imager to the public WinGet index
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_WINGET_CREDENTIAL_BROKER }}
          WINGET_GITHUB_USER: ${{ vars.WINGET_GITHUB_USER }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/tilo-winget-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -z "${CREDENTIAL_BROKER:-}" ]; then
            printf 'configure the OIDC credential broker for WinGet publication\n' >&2
            exit 1
          fi
          apps/imager/packaging/acquire-release-token.sh \
            winget "$CREDENTIAL_BROKER" "$token_file"
          WINGET_GITHUB_TOKEN="$(cat "$token_file")" \
            apps/imager/packaging/publish-winget.sh release-assets

  site-downloads:
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: [homebrew-install-test, homebrew-macos-install-test, winget]
    runs-on: runner
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Advance the landing page to this verified release
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_SITE_CREDENTIAL_BROKER }}
          TILO_SITE_GIT_USER: ${{ vars.SITE_RELEASE_USER }}
          TILO_LINUX_SIGNING_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/tilo-site-release-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -z "${CREDENTIAL_BROKER:-}" ]; then
            printf 'configure the OIDC credential broker for website publication\n' >&2
            exit 1
          fi
          apps/imager/packaging/acquire-release-token.sh \
            site "$CREDENTIAL_BROKER" "$token_file"
          TILO_SITE_GIT_TOKEN="$(cat "$token_file")" \
            apps/imager/packaging/publish-site-release.sh
