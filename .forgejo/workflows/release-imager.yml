name: Build qOS Imager host downloads

# Pushes and pull requests continuously prove each native build. An imager-v*
# tag is different: all three jobs require protected platform credentials and
# fail closed unless the resulting package is signed (and notarized on macOS).
on:
  push:
    branches: ["main"]
    tags: ["imager-v*"]
    paths:
      - "apps/imager/**"
      - "ui/**"
      - "crates/runtime/**"
      - "crates/**"
      - "docs/installer-walkthrough.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/release-imager.yml"
      - "docs/install-contract.json"
      - "scripts/check-install-contract.py"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/imager/**"
      - "ui/**"
      - "crates/runtime/**"
      - "crates/**"
      - "docs/installer-walkthrough.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/release-imager.yml"
      - "docs/install-contract.json"
      - "scripts/check-install-contract.py"
  workflow_dispatch:

concurrency:
  # Tagged package promotion and the website manifest are mutable "latest"
  # pointers, so tags share a non-cancelling lane. Branch validation is scoped
  # to its ref and superseded by the next push; an unavailable native runner
  # must not leave stale validations queued ahead of the current commit.
  group: release-imager-${{ startsWith(github.ref, 'refs/tags/imager-v') && 'promotion' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/imager-v') }}

jobs:
  medium:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify documented installation targets
        run: python3 scripts/check-install-contract.py
      - name: Restore checksum-verified GitHub build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-
      - name: Materialize immutable build inputs
        run: ./os/dev/cache-github-assets.sh
      - name: Save checksum-verified build inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
      - name: Install the checksum-pinned image-signature verifier
        run: ./os/dev/install-cached-cosign.sh
      - name: Authenticate the native image builder
        env:
          QOS_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$QOS_REGISTRY_TOKEN"
          printf '%s' "$QOS_REGISTRY_TOKEN" | podman login code.podesta.ai \
            --username '${{ github.actor }}' --password-stdin
      - name: Build the tested qOS live installer
        env:
          QOS_REGISTRY_CREDS: ${{ github.actor }}:${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export QOS_REQUIRE_WPE_SIGNATURE=1
          ./os/dev/build-image.sh
          ./os/dev/build-custom-installer.sh
          apps/imager/packaging/package-install-medium.sh \
            os/output/installer/qcow2/disk.qcow2 "${{ matrix.arch }}"
      - name: Verify the installer-medium release payload
        run: |
          set -euo pipefail
          medium="qos-installer-linux-${{ matrix.arch }}.img.zst"
          test -s "dist/qos-installer/$medium"
          test -s "dist/qos-installer/$medium.sha256"
          test -s "dist/qos-installer/catalog-${{ matrix.arch }}.json"
          (cd dist/qos-installer && sha256sum --check "$medium.sha256")
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-installer-medium-${{ matrix.arch }}
          path: |
            dist/qos-installer/qos-installer-linux-${{ matrix.arch }}.img.zst
            dist/qos-installer/qos-installer-linux-${{ matrix.arch }}.img.zst.sha256
            dist/qos-installer/catalog-${{ matrix.arch }}.json
          if-no-files-found: error

  catalog:
    if: always()
    needs: medium
    runs-on: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        if: startsWith(github.ref, 'refs/tags/imager-v')
        with:
          path: release-assets
      - name: Assemble the release catalog
        run: |
          if [[ "$GITHUB_REF" == refs/tags/imager-v* ]]; then
            apps/imager/packaging/build-release-catalog.sh release-assets
          else
            mkdir -p dist/qos-installer-catalog
            cp apps/imager/release-catalog.json \
              dist/qos-installer-catalog/qos-installer-catalog-v1.json
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-installer-catalog
          path: dist/qos-installer-catalog/*

  linux:
    needs: catalog
    # Forgejo injects ACTIONS_ID_TOKEN_REQUEST_* only when this native setting
    # is enabled; GitHub's `permissions: id-token: write` is not sufficient.
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore checksum-verified AppImage tools
        id: appimage-tools-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: imager-linux-tools-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
            github-assets-all-v1-
      - name: Materialize pinned AppImage tools
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          ./os/dev/cache-github-assets.sh \
            "linuxdeploy-1-alpha-20251107-1-${arch}.AppImage" \
            "appimagetool-1.9.1-${arch}.AppImage" \
            "type2-runtime-20251108-${arch}"
          tool_dir="$RUNNER_TEMP/qos-imager-tools"
          mkdir -p "$tool_dir"
          install -m 0755 \
            "os/external-assets/cache/linuxdeploy-1-alpha-20251107-1-${arch}.AppImage" \
            "$tool_dir/linuxdeploy"
          install -m 0755 \
            "os/external-assets/cache/appimagetool-1.9.1-${arch}.AppImage" \
            "$tool_dir/appimagetool"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
          printf 'QOS_APPIMAGE_RUNTIME=%s\n' \
            "$GITHUB_WORKSPACE/os/external-assets/cache/type2-runtime-20251108-${arch}" \
            >> "$GITHUB_ENV"
      - name: Save checksum-verified AppImage tools immediately
        if: steps.appimage-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: imager-linux-tools-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: qos-installer-catalog
          path: release-catalog
      - run: cp release-catalog/qos-installer-catalog-v1.json apps/imager/release-catalog.json
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        if: startsWith(github.ref, 'refs/tags/imager-v')
        with:
          name: qos-installer-medium-${{ matrix.arch }}
          path: release-medium
      - name: Install native schema compiler
        run: |
          if ! command -v capnp >/dev/null; then
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends capnproto
            elif command -v dnf >/dev/null; then
              dnf install -y capnproto
            else
              printf 'cannot install capnproto: unsupported Linux runner image\n' >&2
              exit 1
            fi
          fi
          capnp --version
      - name: Configure release signing
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_LINUX_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          SIGNING_KEY_B64: ${{ secrets.IMAGER_LINUX_SIGNING_KEY_B64 }}
          SIGNING_KEY_ID: ${{ secrets.IMAGER_LINUX_SIGNING_KEY_ID }}
          EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/imager-v*)
              version="${GITHUB_REF_NAME#imager-v}"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                || { printf 'release tag must be imager-vMAJOR.MINOR.PATCH\n' >&2; exit 1; }
              if [ -n "${CREDENTIAL_BROKER:-}" ]; then
                apps/imager/packaging/acquire-release-credentials.sh \
                  linux "$CREDENTIAL_BROKER" >> "$GITHUB_ENV"
              elif [ "${ALLOW_STATIC_BOOTSTRAP:-}" = 1 ]; then
                test -n "${SIGNING_KEY_B64:-}" && test -n "${SIGNING_KEY_ID:-}"
                signing_key="$RUNNER_TEMP/qos-imager-signing-key.asc"
                test ! -e "$signing_key"
                (umask 077; printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$signing_key")
                gpg --batch --import "$signing_key"
                rm -f "$signing_key"
                echo "QOS_LINUX_SIGNING_KEY=$SIGNING_KEY_ID" >> "$GITHUB_ENV"
              else
                printf 'configure IMAGER_CREDENTIAL_BROKER or explicitly enable static-signing bootstrap\n' >&2
                exit 1
              fi
              [[ "${EXPECTED_FINGERPRINT^^}" =~ ^([A-F0-9]{40}|[A-F0-9]{64})$ ]] \
                || { printf 'configure IMAGER_LINUX_SIGNING_FINGERPRINT with the full release-key fingerprint\n' >&2; exit 1; }
              echo "QOS_REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
              echo "QOS_LINUX_EXPECTED_FINGERPRINT=${EXPECTED_FINGERPRINT^^}" >> "$GITHUB_ENV"
              echo "QOS_REQUIRE_NATIVE_PACKAGES=1" >> "$GITHUB_ENV"
              echo "QOS_VERSION=${GITHUB_REF_NAME#imager-v}" >> "$GITHUB_ENV"
              ;;
          esac
      - run: cargo test -p imager --lib --locked
      - name: Build the complete native Linux package set
        env:
          QOS_REQUIRE_NATIVE_PACKAGES: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: apps/imager/packaging/package-host.sh
      - name: Remove bootstrap Linux signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/qos-imager-signing-key.asc"
      - name: Sign the directly downloadable installer payloads
        if: startsWith(github.ref, 'refs/tags/imager-v')
        run: |
          set -euo pipefail
          medium="release-medium/qos-installer-linux-${{ matrix.arch }}.img.zst"
          apps/imager/packaging/sign-linux-release-file.sh \
            "$medium" "dist/qos-imager/$(basename "$medium").asc"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            catalog=release-catalog/qos-installer-catalog-v1.json
            apps/imager/packaging/sign-linux-release-file.sh \
              "$catalog" "dist/qos-imager/$(basename "$catalog").asc"
          fi
      - name: Launch the packaged Linux UI offscreen
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          archive="dist/qos-imager/qos-imager-linux-${{ matrix.arch }}.tar.gz"
          tar -xzf "$archive" -C "$smoke"
          "$smoke/qos-imager-linux-${{ matrix.arch }}/qos-imager" \
            --shots "$smoke/archive.png" --scenario confirm --viewport 1180x820
          test -s "$smoke/archive.png"
          appimage="dist/qos-imager/qos-imager-linux-${{ matrix.arch }}.AppImage"
          if [ -f "$appimage" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" \
              --shots "$smoke/appimage.png" --scenario done --viewport 1180x820
            test -s "$smoke/appimage.png"
          elif [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
            printf 'release AppImage is missing\n' >&2
            exit 1
          fi
      # Forgejo does not implement the Artifact API v2 used by v4.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-imager-linux-${{ matrix.arch }}
          path: |
            dist/qos-imager/qos-imager-linux-*.tar.gz
            dist/qos-imager/qos-imager-linux-*.tar.gz.sha256
            dist/qos-imager/qos-imager-linux-*.tar.gz.asc
            dist/qos-imager/qos-imager-linux-*.AppImage
            dist/qos-imager/qos-imager-linux-*.AppImage.sha256
            dist/qos-imager/qos-imager-linux-*.AppImage.asc
            dist/qos-imager/qos-installer-*.asc
          if-no-files-found: error
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: matrix.arch == 'x86_64' && startsWith(github.ref, 'refs/tags/imager-v')
        with:
          name: qos-imager-linux-release-key
          path: |
            dist/qos-imager/qos-release-key.asc
            dist/qos-imager/qos-release-key.asc.sha256
            dist/qos-imager/qos-release-key.fingerprint
            dist/qos-imager/qos-release-key.fingerprint.sha256
          if-no-files-found: error

  windows:
    needs: catalog
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    runs-on: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: qos-installer-catalog
          path: release-catalog
      - shell: powershell
        run: Copy-Item release-catalog/qos-installer-catalog-v1.json apps/imager/release-catalog.json
      - name: Configure release signing
        shell: powershell
        env:
          CERT_PFX_B64: ${{ secrets.IMAGER_WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.IMAGER_WINDOWS_CERT_PASSWORD }}
          EXTERNAL_SIGNER: ${{ vars.IMAGER_WINDOWS_SIGNER }}
          CREDENTIAL_BROKER: ${{ vars.IMAGER_WINDOWS_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          EXPECTED_PUBLISHER: ${{ vars.IMAGER_WINDOWS_PUBLISHER }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/imager-v*") {
            $Version = $env:GITHUB_REF_NAME -replace '^imager-v', ''
            if ($Version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "release tag must be imager-vMAJOR.MINOR.PATCH" }
            if ($env:CREDENTIAL_BROKER) {
              & apps/imager/packaging/Acquire-ReleaseCredentials.ps1 broker $env:CREDENTIAL_BROKER |
                Out-File -FilePath $env:GITHUB_ENV -Append
            } elseif ($env:EXTERNAL_SIGNER) {
              & apps/imager/packaging/Acquire-ReleaseCredentials.ps1 signer $env:EXTERNAL_SIGNER |
                Out-File -FilePath $env:GITHUB_ENV -Append
            } elseif ($env:ALLOW_STATIC_BOOTSTRAP -eq "1") {
              if (-not $env:CERT_PFX_B64 -or -not $env:CERT_PASSWORD) { throw "bootstrap PFX secrets are missing" }
              $Pfx = Join-Path $env:RUNNER_TEMP "qos-imager-signing.pfx"
              if (Test-Path -LiteralPath $Pfx) { throw "bootstrap PFX path already exists" }
              [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
              "QOS_WINDOWS_CERT_PFX=$Pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
              "QOS_WINDOWS_CERT_PASSWORD=$env:CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              throw "Configure IMAGER_CREDENTIAL_BROKER or explicitly enable static-signing bootstrap"
            }
            "QOS_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            if (-not $env:EXPECTED_PUBLISHER) { throw "Configure IMAGER_WINDOWS_PUBLISHER" }
            "QOS_WINDOWS_EXPECTED_PUBLISHER=$env:EXPECTED_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Append
            "QOS_REQUIRE_NATIVE_PACKAGES=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "QOS_VERSION=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
            "QOS_RELEASE_BASE_URL=https://code.podesta.ai/qos/qos/releases/download/$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - shell: powershell
        run: cargo test -p imager --lib --locked
      - name: Build the complete native Windows package set
        shell: powershell
        env:
          QOS_REQUIRE_NATIVE_PACKAGES: "1"
        run: apps/imager/packaging/package-host.ps1
      - name: Remove bootstrap Windows signing material
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "qos-imager-signing.pfx") `
            -Force -ErrorAction SilentlyContinue
      - name: Install and launch the packaged Windows UI offscreen
        shell: powershell
        run: |
          $Smoke = Join-Path $env:RUNNER_TEMP "qos-imager-smoke"
          $Install = Join-Path $Smoke "installed"
          New-Item -ItemType Directory -Force -Path $Smoke | Out-Null
          $Setup = "dist/qos-imager/qos-imager-setup-windows-x86_64.exe"
          if (Test-Path $Setup) {
            & $Setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$Install"
            if ($LASTEXITCODE -ne 0) { throw "qOS Imager setup failed" }
            $Binary = Join-Path $Install "qos-imager.exe"
          } elseif ($env:GITHUB_REF -like "refs/tags/imager-v*") {
            throw "release setup executable is missing"
          } else {
            $Binary = "dist/qos-imager/qos-imager-windows-x86_64.exe"
          }
          $Shot = Join-Path $Smoke "installed.png"
          & $Binary --shots $Shot --scenario confirm --viewport 1180x820
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $Shot) -or (Get-Item $Shot).Length -eq 0) {
            throw "packaged qOS Imager did not render its UI"
          }
      - name: Validate the generated WinGet manifest
        if: startsWith(github.ref, 'refs/tags/imager-v')
        shell: powershell
        run: |
          $Winget = (Get-Command winget.exe -ErrorAction Stop).Source
          & $Winget validate --manifest dist/qos-imager/winget
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation failed" }
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-imager-windows
          path: |
            dist/qos-imager/qos-imager-windows-x86_64.exe
            dist/qos-imager/qos-imager-windows-x86_64.exe.sha256
            dist/qos-imager/qos-imager-windows-x86_64.zip
            dist/qos-imager/qos-imager-windows-x86_64.zip.sha256
            dist/qos-imager/qos-imager-setup-windows-x86_64.exe
            dist/qos-imager/qos-imager-setup-windows-x86_64.exe.sha256
            dist/qos-imager/winget/*.yaml
          if-no-files-found: error

  macos:
    needs: catalog
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-x64
          - arch: aarch64
            runner: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: qos-installer-catalog
          path: release-catalog
      - run: cp release-catalog/qos-installer-catalog-v1.json apps/imager/release-catalog.json
      - name: Configure release signing
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_MACOS_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          CERT_P12_B64: ${{ secrets.IMAGER_MAC_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IMAGER_MAC_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.IMAGER_MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.IMAGER_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.IMAGER_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.IMAGER_APPLE_APP_PASSWORD }}
          EXPECTED_TEAM_ID: ${{ vars.IMAGER_MAC_TEAM_ID }}
          EXPECTED_CERT_SHA256: ${{ vars.IMAGER_MAC_CERT_SHA256 }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/imager-v*)
              version="${GITHUB_REF_NAME#imager-v}"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                || { printf 'release tag must be imager-vMAJOR.MINOR.PATCH\n' >&2; exit 1; }
              if [ -n "${CREDENTIAL_BROKER:-}" ]; then
                apps/imager/packaging/acquire-release-credentials.sh \
                  macos "$CREDENTIAL_BROKER" >> "$GITHUB_ENV"
              elif [ "${ALLOW_STATIC_BOOTSTRAP:-}" = 1 ]; then
                test -n "${CERT_P12_B64:-}" && test -n "${CERT_PASSWORD:-}"
                test -n "${SIGNING_IDENTITY:-}" && test -n "${APPLE_ID:-}"
                test -n "${APPLE_TEAM_ID:-}" && test -n "${APPLE_APP_PASSWORD:-}"
                keychain="$RUNNER_TEMP/qos-imager-signing.keychain-db"
                keychain_list="$RUNNER_TEMP/qos-imager-original-keychains"
                p12="$RUNNER_TEMP/qos-imager-signing.p12"
                test ! -e "$p12" && test ! -e "$keychain" && test ! -e "$keychain_list"
                (umask 077; printf '%s' "$CERT_P12_B64" | base64 --decode > "$p12")
                security list-keychains -d user > "$keychain_list"
                security create-keychain -p qos-ci "$keychain"
                security unlock-keychain -p qos-ci "$keychain"
                security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
                rm -f "$p12"
                security set-key-partition-list -S apple-tool:,apple: -s -k qos-ci "$keychain"
                security list-keychains -d user -s "$keychain"
                echo "QOS_MAC_BOOTSTRAP_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
                echo "QOS_MAC_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
                echo "QOS_APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
                echo "QOS_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
                echo "QOS_APPLE_APP_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
              else
                printf 'configure IMAGER_CREDENTIAL_BROKER or explicitly enable static-signing bootstrap\n' >&2
                exit 1
              fi
              echo "QOS_REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
              [[ "${EXPECTED_TEAM_ID:-}" =~ ^[A-Z0-9]{10}$ ]] \
                || { printf 'configure IMAGER_MAC_TEAM_ID\n' >&2; exit 1; }
              cert_fingerprint="${EXPECTED_CERT_SHA256^^}"
              cert_fingerprint="${cert_fingerprint//:/}"
              [[ "$cert_fingerprint" =~ ^[A-F0-9]{64}$ ]] \
                || { printf 'configure IMAGER_MAC_CERT_SHA256\n' >&2; exit 1; }
              echo "QOS_MAC_EXPECTED_TEAM_ID=$EXPECTED_TEAM_ID" >> "$GITHUB_ENV"
              echo "QOS_MAC_EXPECTED_CERT_SHA256=$cert_fingerprint" >> "$GITHUB_ENV"
              echo "QOS_REQUIRE_NATIVE_PACKAGES=1" >> "$GITHUB_ENV"
              echo "QOS_VERSION=${GITHUB_REF_NAME#imager-v}" >> "$GITHUB_ENV"
              ;;
          esac
      - run: cargo test -p imager --lib --locked
      - name: Build the complete native macOS package set
        env:
          QOS_REQUIRE_NATIVE_PACKAGES: "1"
        run: apps/imager/packaging/package-host.sh
      - name: Remove temporary macOS signing credentials
        if: always()
        run: |
          set +e
          rm -f "$RUNNER_TEMP/qos-imager-signing.p12"
          if [ -n "${QOS_NOTARY_KEYCHAIN_PROFILE:-}" ]; then
            security delete-generic-password -s com.apple.gke.notary.tool \
              -a "$QOS_NOTARY_KEYCHAIN_PROFILE" 2>/dev/null
          fi
          keychain_list="$RUNNER_TEMP/qos-imager-original-keychains"
          if [ -f "$keychain_list" ]; then
            original_keychains=()
            while IFS= read -r original; do
              original="${original#\"}"
              original="${original%\"}"
              [ -z "$original" ] || original_keychains+=("$original")
            done < "$keychain_list"
            security list-keychains -d user -s "${original_keychains[@]}"
            rm -f "$keychain_list"
          fi
          security delete-keychain \
            "$RUNNER_TEMP/qos-imager-signing.keychain-db" 2>/dev/null
          true
      - name: Mount and launch the packaged macOS UI offscreen
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          mountpoint="$smoke/mount"
          mkdir -p "$mountpoint"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet 2>/dev/null || true
            rm -rf "$smoke"
          }
          trap cleanup EXIT
          dmg="dist/qos-imager/qos-imager-macos-${{ matrix.arch }}.dmg"
          if [ -f "$dmg" ]; then
            hdiutil attach "$dmg" -quiet -nobrowse -readonly -mountpoint "$mountpoint"
            "$mountpoint/qOS Imager.app/Contents/MacOS/qos-imager" \
              --shots "$smoke/dmg.png" --scenario done --viewport 1180x820
            test -s "$smoke/dmg.png"
            if [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
              codesign --verify --deep --strict --verbose=2 \
                "$mountpoint/qOS Imager.app"
            fi
          elif [[ "${GITHUB_REF:-}" == refs/tags/imager-v* ]]; then
            printf 'release DMG is missing\n' >&2
            exit 1
          else
            "dist/qos-imager/qOS Imager.app/Contents/MacOS/qos-imager" \
              --shots "$smoke/app.png" --scenario done --viewport 1180x820
            test -s "$smoke/app.png"
          fi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: qos-imager-macos-${{ matrix.arch }}
          path: |
            dist/qos-imager/qos-imager-macos-*.zip
            dist/qos-imager/qos-imager-macos-*.zip.sha256
            dist/qos-imager/qos-imager-macos-*.dmg
            dist/qos-imager/qos-imager-macos-*.dmg.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: [linux, windows, macos]
    runs-on: runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Require the complete native release matrix
        shell: bash
        run: |
          set -euo pipefail
          required=(
            qos-installer-linux-x86_64.img.zst
            qos-installer-linux-aarch64.img.zst
            qos-imager-linux-x86_64.AppImage
            qos-imager-linux-aarch64.AppImage
            qos-imager-linux-x86_64.tar.gz
            qos-imager-linux-aarch64.tar.gz
            qos-imager-windows-x86_64.exe
            qos-imager-windows-x86_64.zip
            qos-imager-setup-windows-x86_64.exe
            qos-imager-macos-x86_64.dmg
            qos-imager-macos-aarch64.dmg
            qos-imager-macos-x86_64.zip
            qos-imager-macos-aarch64.zip
          )
          for name in "${required[@]}"; do
            path="$(find release-assets -type f -name "$name" -print -quit)"
            test -n "$path" || { printf 'missing release artifact: %s\n' "$name" >&2; exit 1; }
            test -s "$path.sha256" || { printf 'missing release digest: %s.sha256\n' "$name" >&2; exit 1; }
            (cd "$(dirname "$path")" && sha256sum --check --strict "$(basename "$path").sha256") \
              || { printf 'invalid release digest: %s.sha256\n' "$name" >&2; exit 1; }
            case "$name" in
              *.img.zst)
                test -s "$(find release-assets -type f -name "$name.asc" -print -quit)" \
                  || { printf 'missing release signature: %s.asc\n' "$name" >&2; exit 1; }
                ;;
              *.AppImage|*.tar.gz) test -s "$path.asc" \
                || { printf 'missing release signature: %s.asc\n' "$name" >&2; exit 1; } ;;
            esac
          done
          for name in qOS.Imager.installer.yaml qOS.Imager.yaml qOS.Imager.locale.en-US.yaml; do
            test -n "$(find release-assets -type f -name "$name" -print -quit)" \
              || { printf 'missing WinGet manifest: %s\n' "$name" >&2; exit 1; }
          done
      - name: Verify Linux release trust bundle
        env:
          QOS_LINUX_EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: apps/imager/packaging/verify-linux-release.sh release-assets
      - name: Publish signed downloads to the tag release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          QOS_LINUX_EXPECTED_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: apps/imager/packaging/publish-forgejo-release.sh release-assets

  homebrew:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: publish
    runs-on: macos-arm64
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Publish the qOS Homebrew tap
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_HOMEBREW_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          BOOTSTRAP_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/qos-homebrew-tap-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -n "${CREDENTIAL_BROKER:-}" ]; then
            apps/imager/packaging/acquire-release-token.sh \
              homebrew "$CREDENTIAL_BROKER" "$token_file"
          elif [ "${ALLOW_STATIC_BOOTSTRAP:-}" = 1 ] && [ -n "${BOOTSTRAP_TAP_TOKEN:-}" ]; then
            (umask 077; printf '%s' "$BOOTSTRAP_TAP_TOKEN" > "$token_file")
          else
            printf 'configure the OIDC credential broker for Homebrew publication\n' >&2
            exit 1
          fi
          HOMEBREW_TAP_TOKEN="$(cat "$token_file")" \
            apps/imager/packaging/publish-homebrew-tap.sh release-assets

  homebrew-install-test:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: homebrew
    strategy:
      matrix:
        include:
          - runner: runner
            package_kind: formula
          - runner: runner-arm64
            package_kind: formula
          - runner: macos-x64
            package_kind: cask
          - runner: macos-arm64
            package_kind: cask
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install and test the published Homebrew package
        env:
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          set -euo pipefail
          command -v brew >/dev/null
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap qos/qos https://code.podesta.ai/qos/homebrew-qos.git
          if [ "$PACKAGE_KIND" = formula ]; then
            brew install qos/qos/qos-imager
            brew test qos/qos/qos-imager
            brew uninstall qos-imager
          else
            brew install --cask qos/qos/qos-imager
            brew list --cask qos-imager >/dev/null
            brew uninstall --cask qos-imager
          fi

  winget:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: publish
    runs-on: runner
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: release-assets
      - name: Submit qOS Imager to the public WinGet index
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_WINGET_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          BOOTSTRAP_WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_GITHUB_USER: ${{ vars.WINGET_GITHUB_USER }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/qos-winget-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -n "${CREDENTIAL_BROKER:-}" ]; then
            apps/imager/packaging/acquire-release-token.sh \
              winget "$CREDENTIAL_BROKER" "$token_file"
          elif [ "${ALLOW_STATIC_BOOTSTRAP:-}" = 1 ] && [ -n "${BOOTSTRAP_WINGET_TOKEN:-}" ]; then
            (umask 077; printf '%s' "$BOOTSTRAP_WINGET_TOKEN" > "$token_file")
          else
            printf 'configure the OIDC credential broker for WinGet publication\n' >&2
            exit 1
          fi
          WINGET_GITHUB_TOKEN="$(cat "$token_file")" \
            apps/imager/packaging/publish-winget.sh release-assets

  site-downloads:
    if: startsWith(github.ref, 'refs/tags/imager-v')
    needs: [homebrew-install-test, winget]
    runs-on: runner
    enable-openid-connect: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Advance the landing page to this verified release
        env:
          CREDENTIAL_BROKER: ${{ vars.IMAGER_SITE_CREDENTIAL_BROKER }}
          ALLOW_STATIC_BOOTSTRAP: ${{ vars.IMAGER_ALLOW_STATIC_SIGNING_BOOTSTRAP }}
          BOOTSTRAP_SITE_TOKEN: ${{ secrets.SITE_RELEASE_TOKEN }}
          QOS_SITE_GIT_USER: ${{ vars.SITE_RELEASE_USER }}
          QOS_LINUX_SIGNING_FINGERPRINT: ${{ vars.IMAGER_LINUX_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/qos-site-release-token"
          trap 'rm -f "$token_file"' EXIT
          test ! -e "$token_file"
          if [ -n "${CREDENTIAL_BROKER:-}" ]; then
            apps/imager/packaging/acquire-release-token.sh \
              site "$CREDENTIAL_BROKER" "$token_file"
          elif [ "${ALLOW_STATIC_BOOTSTRAP:-}" = 1 ] && [ -n "${BOOTSTRAP_SITE_TOKEN:-}" ]; then
            (umask 077; printf '%s' "$BOOTSTRAP_SITE_TOKEN" > "$token_file")
          else
            printf 'configure the OIDC credential broker for website publication\n' >&2
            exit 1
          fi
          QOS_SITE_GIT_TOKEN="$(cat "$token_file")" \
            apps/imager/packaging/publish-site-release.sh
