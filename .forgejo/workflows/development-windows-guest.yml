name: Development / assemble retained Windows guest

on:
  workflow_dispatch:
    inputs:
      buildroot_candidate:
        description: Immutable native x86-64 Fedora 44 Wine tools image
        required: true
        type: string
        default: code.sandbox.example/qos/wine-tools@sha256:2a85681f640ebfbe0a15e6e92bd181b13bc674f10ca98b136fed448a754d12d8
      wine_pair_candidate:
        description: Immutable wine-paired image; required unless reusing signed Wine
        required: false
        type: string
      signed_wine_candidate:
        description: Optional retained development-signed Wine image
        required: false
        type: string
      signed_wine_key_sha256:
        description: Independent public-key SHA256; required with retained signed Wine
        required: false
        type: string
      guest_rpms_candidate:
        description: Optional retained complete guest RPM snapshot; must match Wine and key
        required: false
        type: string

concurrency:
  group: development-windows-guest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: runner-disk-100g
    timeout-minutes: 90
    env:
      WINDOWS_GUEST_BUILDROOT_REF: ${{ inputs.buildroot_candidate }}
      WINE_PAIR_REF: ${{ inputs.wine_pair_candidate }}
      DEVELOPMENT_WINE_REF: ${{ inputs.signed_wine_candidate }}
      DEVELOPMENT_WINE_KEY_SHA256: ${{ inputs.signed_wine_key_sha256 }}
      WINDOWS_GUEST_RPMS_REF: ${{ inputs.guest_rpms_candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate native packaging inputs
        run: |
          bash os/dev/assert-native-arch.sh x86_64
          python3 os/dev/run-development-windows-guest.py --validate-only
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Sign retained Wine, freeze dependencies and assemble guest
        run: python3 os/dev/run-development-windows-guest.py
      - name: Retain public inputs and payload identities
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: development-windows-guest-${{ github.sha }}-${{ github.run_id }}
          path: guest-evidence/
          if-no-files-found: warn
