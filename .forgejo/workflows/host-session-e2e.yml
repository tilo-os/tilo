name: Dev / host-desktop session VM

# The tilo-session RPMs on stock Fedora 44 (the Cloud image) under KVM, run as
# a person runs them: dnf install, a gnome-keyring Secret Service unlocked on
# the user's bus, the identity provisioned there, SDDM autologin into the
# packaged tilo.desktop, then Settings, Notes, Files and Terminal opened
# through search on the VM's keyboard. The compositor must survive each app
# (dist/session/vm-e2e/run.py, dist/session/README.md "VM test").
#
# Release / desktop calls this after its package lane with that run's
# fedora-44-amd64 artifact. A dispatch or a pull request changing the test
# builds those RPMs from its own commit first (`rpms`), with the same command
# and image as the package lane, so the test never depends on another run's
# short-lived artifacts.
#
# Runner: runner-disk-100g, the Kata runners with KVM the legacy guest and
# dev disk boots use. No GPU: Tilo renders with lavapipe onto virtio-gpu.
on:
  workflow_call:
    inputs:
      rpm-artifact:
        description: "Name of this run's artifact holding the fedora-44 RPMs."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      rpm-source-run:
        description: "Optional public Tilo API run ID holding accepted RPMs; skips compilation."
        required: false
        default: ""
      rpm-source-commit:
        description: "Exact full source commit required with rpm-source-run."
        required: false
        default: ""
      apps:
        description: "Comma-separated package ids to open; empty: all (so.tilo.settings, so.tilo.notes, so.tilo.file-explorer, so.tilo.terminal)."
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "dist/session/vm-e2e/**"
      - ".forgejo/workflows/host-session-e2e.yml"

concurrency:
  group: host-session-e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # resolve-builder.yml's job, inline: Release / desktop calls this workflow,
  # and a called workflow does not call another.
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            tools/ci/resolve_builder.py
            tools/ci/images.toml
          sparse-checkout-cone-mode: false
      - name: Resolve the CI builder
        id: resolve
        run: python3 tools/ci/resolve_builder.py

  # The fedora-44 amd64 RPMs of this commit, when no caller passed them; a
  # caller's RPMs make this a no-op on the quality lane. (Skipping the job
  # instead would skip host-session too, or need an always() condition that a
  # caller's skipped jobs would then pass.)
  rpms:
    runs-on: ${{ (inputs.rpm-artifact || inputs.rpm-source-run) && 'runner-quality' || 'runner-large' }}
    timeout-minutes: 120
    env:
      TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY: ${{ vars.TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY }}
    steps:
      - name: Validate explicit RPM replay source
        env:
          RPM_SOURCE_RUN: ${{ inputs.rpm-source-run }}
          RPM_SOURCE_COMMIT: ${{ inputs.rpm-source-commit }}
        run: |
          set -euo pipefail
          if [[ -n ${RPM_SOURCE_RUN:-} || -n ${RPM_SOURCE_COMMIT:-} ]]; then
            [[ ${RPM_SOURCE_RUN:-} =~ ^[1-9][0-9]{0,18}$ && ${RPM_SOURCE_COMMIT:-} =~ ^[0-9a-f]{40}$ ]] || {
              echo '::error::RPM replay requires both a positive API run ID and a full source commit'
              exit 1
            }
          fi
      # Fail before checkout, runtime download and compilation if the existing
      # independent app-store authority is not configured. Caller RPMs have
      # already passed the package lane's staging checks.
      - name: Validate the app-store registry owner
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        run: |
          set -euo pipefail
          owner=${TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY:-}
          [[ $owner =~ ^[0-9a-fA-F]{64}$ && $owner != $(printf '0%.0s' {1..64}) ]] || {
            echo '::error::TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY must be a non-placeholder 32-byte hex key'
            exit 1
          }
      # A full clone, as the package lane takes (dist/ci/run-package-job.sh).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate RPM lint exception paths before building
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        run: python3 dist/rpm/test-rpmlint-config.py
      - name: Fetch the env-runtime environment image
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        run: bash dist/ci/fetch-package-env-runtime.sh
      - name: Build and install-test the Fedora 44 RPMs
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        env:
          TILO_CARGO_JOBS: "6"
        run: |
          set -euo pipefail
          IFS='|' read -r distro image revision < <(dist/ci/package-targets.sh amd64 fedora-44)
          dist/ci/run-package-job.sh "$distro" "$image" amd64 "$revision"
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: ${{ !inputs.rpm-artifact && !inputs.rpm-source-run }}
        with:
          name: fedora-44-amd64
          path: dist/ci-output/fedora-44-amd64/*
          if-no-files-found: error
          retention-days: 7
      # Failed RPMs are diagnostic inputs only, never the accepted artifact
      # consumed by host-session. Collection is capped at three RPMs / 4 GiB.
      - name: Retain source-bound RPMs after packaging failure
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: ${{ failure() && !inputs.rpm-artifact && !inputs.rpm-source-run }}
        with:
          name: failed-fedora-44-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ci-output/fedora-44-amd64/failed-rpms/*
          if-no-files-found: warn
          retention-days: 2

  host-session:
    needs: [builder, rpms]
    runs-on: runner-disk-100g
    timeout-minutes: 75
    # The CI builder (Fedora, with the node the actions need); QEMU comes
    # from its packages, as in Dev / VM acceptance.
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      WORK: /var/tmp/host-session-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install QEMU and the test's tools
        run: |
          set -euo pipefail
          dnf --setopt=retries=3 install -y \
            qemu-system-x86-core qemu-device-display-virtio-vga qemu-device-display-virtio-gpu \
            qemu-img openssh-clients xorriso python3 curl
          command -v qemu-system-x86_64 qemu-img ssh scp ssh-keygen xorriso >/dev/null

      - name: Require a native x86-64 runner with KVM
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          [[ ! -e /dev/kvm ]] || chmod 0666 /dev/kvm
          python3 os/dev/probe-kvm.py x86_64 || {
            echo '::error::this runner cannot create a KVM VM; the session test never runs under TCG'
            exit 1
          }

      # The RPMs are uploaded with upload-artifact v4 (one zip); only a v4
      # download (Forgejo's build) unpacks them.
      - name: Take this run's RPMs
        if: ${{ !inputs.rpm-source-run }}
        uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: ${{ inputs.rpm-artifact || 'fedora-44-amd64' }}
          path: /var/tmp/host-session-e2e/rpms

      - name: Take the exact source-pinned RPMs for VM-only replay
        if: ${{ inputs.rpm-source-run }}
        env:
          RPM_SOURCE_RUN: ${{ inputs.rpm-source-run }}
          RPM_SOURCE_COMMIT: ${{ inputs.rpm-source-commit }}
        run: python3 dist/ci/fetch-host-session-rpms.py "$RPM_SOURCE_RUN" "$RPM_SOURCE_COMMIT" "$WORK/rpms"

      - name: Record this run's RPMs
        if: ${{ !inputs.rpm-source-run }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          ARTIFACT: ${{ inputs.rpm-artifact || 'fedora-44-amd64' }}
        run: |
          set -euo pipefail
          cd "$WORK/rpms"
          python3 - <<'EOF'
          import hashlib, json, os, pathlib
          rpms = sorted(p.name for p in pathlib.Path(".").glob("*.rpm"))
          artifacts = {}
          for name in rpms:
              path = pathlib.Path(name)
              digest = hashlib.sha256()
              with path.open("rb") as package:
                  while block := package.read(1024 * 1024):
                      digest.update(block)
              artifacts[name] = {"byte_size": path.stat().st_size, "sha256": digest.hexdigest()}
          pathlib.Path("source.json").write_text(json.dumps({
              "workflow": os.environ["WORKFLOW"],
              "run": int(os.environ["RUN_NUMBER"]), "run_id": int(os.environ["RUN_ID"]),
              "commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF_NAME"],
              "artifact": os.environ["ARTIFACT"], "rpms": rpms, "artifacts": artifacts}, indent=1) + "\n")
          EOF
          cat source.json

      - name: Boot Fedora, log into Tilo, open apps
        timeout-minutes: 60
        env:
          APPS: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail
          python3 dist/session/vm-e2e/run.py test --rpms "$WORK/rpms" --out "$WORK/report" \
            --work "$WORK/vm" --image-cache "$WORK/images" --apps "${APPS:-}"

      - name: Write the report to the job summary
        if: always()
        run: |
          set -euo pipefail
          report="$WORK/report/report.md"
          [[ -f $report ]] || { echo '::warning::the run wrote no report'; exit 0; }
          tee -a "$GITHUB_STEP_SUMMARY" < "$report"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: host-session-e2e-${{ github.run_id }}
          path: /var/tmp/host-session-e2e/report
          if-no-files-found: warn
