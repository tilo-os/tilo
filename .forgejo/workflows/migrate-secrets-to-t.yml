# One-off: hand the Actions secrets t's checks use to t's server config.
#
# Run once by hand. Each secret is written into a YAML file that sops encrypts
# for the infra repository's age recipients inside this job; only the
# encrypted file leaves the runner, as an artifact, and is then merged into
# t's encrypted server config. Remove this workflow once it has run.
name: Migrate secrets to t

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    runs-on: runner
    timeout-minutes: 10
    steps:
      - name: Install sops
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
          echo "79b0f844237bd4b0446e4dc884dbc1765fc7dedc3968f743d5949c6f2e701739  /tmp/sops" | sha256sum -c -
          chmod +x /tmp/sops

      - name: Encrypt the secrets for infra's age recipients
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          RUNTIME_BUNDLE_SIGNING_KEY: ${{ secrets.RUNTIME_BUNDLE_SIGNING_KEY }}
          TAPP_PUBLISHER_IDENTITY: ${{ secrets.TAPP_PUBLISHER_IDENTITY }}
          TILO_MODEL_CATALOG_SIGNING_KEY: ${{ secrets.TILO_MODEL_CATALOG_SIGNING_KEY }}
          DEV_APP_PUBLISHER_IDENTITY: ${{ secrets.DEV_APP_PUBLISHER_IDENTITY }}
          TILO_LIVE_NEXTCLOUD_URL: ${{ secrets.TILO_LIVE_NEXTCLOUD_URL }}
          TILO_LIVE_NEXTCLOUD_USER: ${{ secrets.TILO_LIVE_NEXTCLOUD_USER }}
          TILO_LIVE_NEXTCLOUD_PASSWORD: ${{ secrets.TILO_LIVE_NEXTCLOUD_PASSWORD }}
          TILO_LIVE_WEBDAV_URL: ${{ secrets.TILO_LIVE_WEBDAV_URL }}
          TILO_LIVE_WEBDAV_USER: ${{ secrets.TILO_LIVE_WEBDAV_USER }}
          TILO_LIVE_WEBDAV_PASSWORD: ${{ secrets.TILO_LIVE_WEBDAV_PASSWORD }}
          AGE_RECIPIENTS: age1qrg6kmfff64fwsq9uq472k64yzs90d9pkye5yc83n7s3ppkqa3rsnuswrx,age13qwt0j5nvn23tkkphku82tmkc89wq5dqah6xw43f3j07x92seprshc6w3p,age1lk46dkh85yrazq3wp775gdsanjnxkg7jax9g6u0ymhzku2ck4f3qnwya5z
        run: |
          set -euo pipefail
          umask 077
          plain=$(mktemp -p /dev/shm 2>/dev/null || mktemp)
          trap 'shred -u "$plain" 2>/dev/null || rm -f "$plain"' EXIT
          python3 - "$plain" <<'PY'
          import json, os, sys
          names = ["REGISTRY_TOKEN", "RUNTIME_BUNDLE_SIGNING_KEY", "TAPP_PUBLISHER_IDENTITY",
                   "TILO_MODEL_CATALOG_SIGNING_KEY", "DEV_APP_PUBLISHER_IDENTITY",
                   "TILO_LIVE_NEXTCLOUD_URL", "TILO_LIVE_NEXTCLOUD_USER", "TILO_LIVE_NEXTCLOUD_PASSWORD",
                   "TILO_LIVE_WEBDAV_URL", "TILO_LIVE_WEBDAV_USER", "TILO_LIVE_WEBDAV_PASSWORD"]
          present = {n: os.environ[n] for n in names if os.environ.get(n)}
          print("present:", " ".join(sorted(present)))
          print("missing:", " ".join(sorted(set(names) - set(present))) or "none")
          with open(sys.argv[1], "w") as f:
              f.write("secrets:\n")
              for n, v in sorted(present.items()):
                  f.write(f"  {n}: {json.dumps(v)}\n")
          PY
          /tmp/sops --encrypt --age "$AGE_RECIPIENTS" --input-type yaml --output-type yaml "$plain" > t-secrets.sops.yaml
          grep -q "ENC\[" t-secrets.sops.yaml

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: t-secrets
          path: t-secrets.sops.yaml
          retention-days: 1
