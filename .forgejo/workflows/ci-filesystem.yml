name: CI / cloud sources

# The cloud-source conformance suite against real servers run as job services,
# and against live accounts on a schedule. The rest of the filesystem contract
# (real FUSE, Files UX, the native data plane) are the real-fuse, files-ux and
# native-tier1 checks in t.toml; these two jobs stay here because a t check
# cannot start service containers or receive these test-account secrets yet.

on:
  # Main runs the same selection, so main stays verified and its compiler
  # cache serves pull requests.
