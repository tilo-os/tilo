  pull_request:
    # Stacked PRs (a PR whose base is another task branch) get the
    # same gate; affected-package selection diffs against that base, so each
    # layer tests its own change.
    branches: ["main", "pr/sdk-*", "codex/**"]
    paths:
      - ".cargo/**"
      - "crates/collab/**"
      - "crates/collab/tilo-user-identity/**"
