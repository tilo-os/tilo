  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  # Replace superseded pull request runs; pushes, schedules and manual runs
  # keep one run per commit.
  group: fs-fuse-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "8"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  # Deny warnings through per-target flags. Cargo joins these with the
  # target rustflags in .cargo/config.toml (x86-64-v3, frame pointers,
  # hardening); RUSTFLAGS would replace them, giving these builds different
  # codegen, and different pixels, from nightly and local builds.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  # The cloud-source conformance suite against real, self-hosted servers:
  # Apache mod_dav and the official Nextcloud image, as job services. The
  # same suite runs against in-process fakes in every affected-package test
  # shard, and against live accounts in `cloud-live`.
  cloud-servers:
    needs: builder
    runs-on: runner
    timeout-minutes: 30
    env:
      TILO_REQUIRE_CLOUD_SERVERS: "1"
      TILO_TEST_WEBDAV_URL: http://webdav/
      TILO_TEST_WEBDAV_USER: ada
      TILO_TEST_WEBDAV_PASSWORD: conformance-password
      TILO_TEST_NEXTCLOUD_URL: http://nextcloud/
      TILO_TEST_NEXTCLOUD_USER: ada
      TILO_TEST_NEXTCLOUD_PASSWORD: conformance-password
    container:
      image: ${{ needs.builder.outputs.image }}
    services:
      webdav:
        image: docker.io/bytemark/webdav:latest
        env:
          AUTH_TYPE: Basic
          USERNAME: ada
          PASSWORD: conformance-password
      # Nextcloud on SQLite answers 503 once a write waits 60 s for the
      # database lock, which the suite's parallel clients reach on a slow disk.
      nextcloud-db:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: conformance-password
      nextcloud:
        image: docker.io/library/nextcloud:31-apache
        env:
          POSTGRES_HOST: nextcloud-db
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: conformance-password
          NEXTCLOUD_ADMIN_USER: ada
          NEXTCLOUD_ADMIN_PASSWORD: conformance-password
          NEXTCLOUD_TRUSTED_DOMAINS: nextcloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Nextcloud installs itself before it listens; curl's retry bounds it.
      - name: Wait for the servers to serve
        run: |
          curl -sS -o /dev/null --retry 60 --retry-connrefused --retry-delay 1 http://webdav/
          curl -fsS -o /dev/null --retry 300 --retry-all-errors --retry-delay 1 http://nextcloud/status.php

      - name: Run the conformance suite against real servers
        run: >-
          bash scripts/ci-run.sh "cloud-source conformance (servers)" --
          cargo test --locked -p cloud-source-dav --test conformance container_ -- --nocapture

  # The same suite against live provider accounts, on a schedule. Each run
  # works in its own folder and deletes it; without the secrets every test
  # is skipped.
  cloud-live:
    needs: builder
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.builder.result == 'success' }}
    runs-on: runner
    timeout-minutes: 30
    env:
      TILO_LIVE_WEBDAV_URL: ${{ secrets.TILO_LIVE_WEBDAV_URL }}
      TILO_LIVE_WEBDAV_USER: ${{ secrets.TILO_LIVE_WEBDAV_USER }}
      TILO_LIVE_WEBDAV_PASSWORD: ${{ secrets.TILO_LIVE_WEBDAV_PASSWORD }}
      TILO_LIVE_NEXTCLOUD_URL: ${{ secrets.TILO_LIVE_NEXTCLOUD_URL }}
      TILO_LIVE_NEXTCLOUD_USER: ${{ secrets.TILO_LIVE_NEXTCLOUD_USER }}
      TILO_LIVE_NEXTCLOUD_PASSWORD: ${{ secrets.TILO_LIVE_NEXTCLOUD_PASSWORD }}
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run the conformance suite against live accounts
        run: >-
          bash scripts/ci-run.sh "cloud-source conformance (live)" --
          cargo test --locked -p cloud-source-dav --test conformance live_ -- --nocapture --test-threads=1

  # The native data plane's acceptance suites (`fs --test native_tier1`,
  # `fs-native --test it`): two daemons on two loop-mounted Btrfs stores,
  # fanotify journal and pre-content hydration, leases, SQLite and git sync.
  # TILO_REQUIRE_FANOTIFY=1 turns every skip into a failure. They need a
  # kernel with pre-content fanotify events (Linux 6.14 or later with
  # CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y), Btrfs, loop devices and a
  # privileged container. No runner has that kernel yet: the Kata guest
  # kernels are 6.12 (x86-64) and 6.18 (ARM64), both without
  # CONFIG_FANOTIFY_ACCESS_PERMISSIONS. The job stays skipped, instead of
  # queueing forever, until a `runner-native-storage` pool exists and
  # TILO_NATIVE_STORAGE_RUNNER is set to true.
