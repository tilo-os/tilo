name: Development / native resource views

# Manual acceptance evidence for the defining Notes-in-Chat composition flow.
# The workflow-ref checkout owns admission, harness and verification. source_sha
# may name only one of its ancestors and supplies build inputs/binaries only.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit (40 lowercase hex characters)'
        required: true
        type: string

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.sandbox.example/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source: ${{ steps.source.outputs.sha }}
      control: ${{ steps.source.outputs.control }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit only an ancestor of this trusted workflow ref
        id: source
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          control=$(git rev-parse HEAD)
          [[ $control == "$GITHUB_SHA" && $control =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$control" || {
            echo '::error::source_sha must be an ancestor of the workflow ref'
            exit 1
          }
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "control=$control" >> "$GITHUB_OUTPUT"
      - name: Resolve immutable native builder
        id: resolve
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 tools/ci/resolve_builder.py

  acceptance:
    needs: builder
    runs-on: runner-disk-100g
    timeout-minutes: 240
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.builder.outputs.control }}
          path: control
          persist-credentials: false
      - name: Checkout exact acceptance source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.builder.outputs.source }}
          path: source
          persist-credentials: false
      - name: Install identity-service test subjects
        # These processes are exercised by the harness. They do not replace or
        # relax the launcher's Bubblewrap, seccomp or Landlock policy.
        run: dnf install -y gnome-keyring iproute libsecret && dnf clean all
      - name: Refuse an incomplete native enforcement substrate
        run: |
          python3 - <<'PY'
          import ctypes, os
          if os.uname().machine != 'x86_64':
              raise SystemExit('native acceptance requires x86_64')
          abi = ctypes.CDLL(None, use_errno=True).syscall(444, None, 0, 1)
          if abi < 5:
              raise SystemExit(f'Landlock ABI 5 or newer required; worker reports {abi}')
          print(f'Landlock ABI {abi}')
          PY
          bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev /usr/bin/true
      - name: Restore Cargo downloads
        id: downloads
        uses: ./control/.forgejo/actions/restore-cargo-downloads
        with:
          lockfile: source/Cargo.lock
      - name: Prepare software renderer
        run: |
          control/os/dev/assert-native-arch.sh x86_64
          driver=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          test -r "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
      - name: Build candidate offline without inherited credentials
        run: |
          evidence_root="$RUNNER_TEMP/native-resource-view-sandbox"
          install -d -m 0700 "$evidence_root"
          source_root=$(realpath source)
          control_root=$(realpath control)
          target_root="$evidence_root/target"
          install -d -m 0700 "$target_root"
          # Bubblewrap needs an existing mountpoint but never writes through it:
          # the dedicated target tree is mounted over this empty directory.
          mkdir -p "$source_root/target"
          source_head=$(git -C "$source_root" rev-parse HEAD)
          source_tree=$(git -C "$source_root" rev-parse 'HEAD^{tree}')
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=no)"
          test "$(readlink -f /var/run)" = /run
          # Candidate-controlled Cargo build scripts and package assembly see
          # no job environment, cloud/cache/registry credentials, host home or
          # network. The checkout and restored dependency cache are read-only;
          # only the overlaid target and evidence trees are writable.
          # /var/run is Fedora's symlink to /run, so one private tmpfs masks
          # both host IPC trees, including engine/credential sockets.
          bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev \
            --tmpfs /root --tmpfs /tmp --tmpfs /run \
            --ro-bind "$source_root" /subject \
            --bind "$target_root" /subject/target \
            --ro-bind "$control_root" /control \
            --bind "$evidence_root" /evidence --chdir /control \
            /usr/bin/env -i \
              PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
              HOME=/tmp CARGO_HOME=/cargo-home CARGO_NET_OFFLINE=true \
              CARGO_BUILD_JOBS=4 CARGO_INCREMENTAL=0 \
              CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
              RUSTC_WRAPPER= SCCACHE_IGNORE_SERVER_IO_ERROR=1 \
              GIT_CONFIG_NOSYSTEM=1 LC_ALL=C.UTF-8 LANG=C.UTF-8 \
              bash /control/scripts/headless-examples/run-resource-view-acceptance.sh \
                prepare /subject /evidence/run \
                '${{ needs.builder.outputs.source }}'
          test "$(git -C "$source_root" rev-parse HEAD)" = "$source_head"
          test "$(git -C "$source_root" rev-parse 'HEAD^{tree}')" = "$source_tree"
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=no)"
          git -C "$source_root" diff --quiet --exit-code
          git -C "$source_root" diff --cached --quiet --exit-code
      - name: Run responsive native matrix and two-client convergence
        run: |
          evidence_root="$RUNNER_TEMP/native-resource-view-sandbox"
          source_root=$(realpath source)
          control_root=$(realpath control)
          target_root="$evidence_root/target"
          # Wide, narrow-mounted-resize, enlarged-text and two-client cases
          # share this one bounded 240-minute job and its private network.
          # The candidate shell and apps receive a private network namespace
          # with loopback only. CAP_NET_ADMIN exists just long enough to raise
          # lo, then setpriv drops the complete capability bounding set before
          # any candidate binary starts.
          bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
            --cap-add CAP_NET_ADMIN --ro-bind / / --proc /proc --dev /dev \
            --tmpfs /root --tmpfs /tmp --tmpfs /run \
            --ro-bind "$source_root" /subject \
            --bind "$target_root" /subject/target \
            --ro-bind "$control_root" /control \
            --bind "$evidence_root" /evidence --chdir /control \
            /usr/bin/env -i \
              PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/sbin:/usr/bin:/bin \
              HOME=/tmp LC_ALL=C.UTF-8 LANG=C.UTF-8 \
              VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
              WGPU_BACKEND=vulkan WGPU_ADAPTER_NAME=llvmpipe \
              TILO_ACCEPTANCE_SOURCE_SHA='${{ needs.builder.outputs.source }}' \
              TILO_ACCEPTANCE_CONTROL_SHA='${{ needs.builder.outputs.control }}' \
              TILO_ACCEPTANCE_BUILDER='${{ needs.builder.outputs.image }}' \
              /bin/bash -c '
                /usr/sbin/ip link set lo up
                exec /usr/bin/setpriv --bounding-set=-all --inh-caps=-all \
                  --ambient-caps=-all --no-new-privs \
                  /bin/bash /control/scripts/headless-examples/run-resource-view-acceptance.sh \
                    run /subject /evidence/run "$1"
              ' _ '${{ needs.builder.outputs.source }}'
      - name: Upload complete native evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: native-resource-view-${{ needs.builder.outputs.source }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-resource-view-sandbox/run
            !${{ runner.temp }}/native-resource-view-sandbox/run/prepared/release/work
            !${{ runner.temp }}/native-resource-view-sandbox/run/prepared/xdg
          retention-days: 14
          if-no-files-found: error
      - name: Save Cargo downloads
        if: always() && steps.downloads.outputs.cache-hit != 'true' && steps.downloads.outputs.cache-key != ''
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: ${{ steps.downloads.outputs.cache-key }}
