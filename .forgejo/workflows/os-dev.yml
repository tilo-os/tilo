name: Build / OS dev

# Explicit OS-image iteration with tilo-vm: dispatch this workflow or label an
# image-changing pull request `os-image` (or `os-arm64`) to build and publish:
#
#   registry.tilo.so/tilo/tilo-ci:<ref>-<sha7>-<arch>   the unsigned OS image
#   registry.tilo.so/tilo/tilo-vm:<ref>-<sha7>-ci       its dev image
#
# (<ref> is main or pr-<number>), so `tilo-vm vm upgrade --from sha:<commit>`
# moves a VM onto any commit that built. No reproduction lane, no signing, no
# release channel: those are Release / OS (build-image.yml), which this calls.
#
# A requested pull request builds only when its own diff touches the image, builds
# x86_64, and adds aarch64 when it changes an architecture-specific input or
# carries the `os-arm64` label
# (tools/ci/os_dev_arches.py). Main images also have architecture-specific
# dispatches (os-dev-x86.yml, os-dev-arm.yml), newest commit only. Ordinary
# pushes and unlabelled PRs leave native package capacity for required checks.
on:
  workflow_dispatch:
    inputs:
      arches:
        description: 'JSON architecture list for a targeted cached dev build, for example ["aarch64"].'
        required: false
        default: '["x86_64","aarch64"]'
      fex_payload_candidate:
        description: 'Optional immutable ARM FEX payload; provide together with windows_guest_candidate.'
        required: false
        default: ''
      windows_guest_candidate:
        description: 'Optional immutable x86 Windows guest; provide together with fex_payload_candidate.'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "os/**"
      # Unit tests and docs never enter the image.
      - "!os/tests/test_*.py"
      - "!os/dev/test_*.py"
      - "!os/dev/installer-console.py"
      # Windows host transport and its native test never enter the OS image.
      - "!os/dev/vm-windows.ps1"
      - "!os/tests/vm-windows-tool-resolver-test.ps1"
      - "!os/docs/**"
      - "!os/**/*.md"
      - ".forgejo/workflows/os-dev.yml"
      - ".forgejo/workflows/build-image.yml"
      - ".forgejo/actions/setup-buildx/**"
      - "tools/ci/os_dev_arches.py"

# Share the x86 dev-image queue with the main wrapper. A PR image and a main
# image must not occupy two of the four available native package slots.
# Queue requests without cancelling a build that already has useful progress.
concurrency:
  group: os-dev-x86-native
  cancel-in-progress: false

jobs:
  arches:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'os-image') || contains(github.event.pull_request.labels.*.name, 'os-arm64')
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    outputs:
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: arches
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          REQUESTED_ARCHES: ${{ github.event.inputs.arches }}
        run: |
          set -euo pipefail
          if [[ $EVENT == workflow_dispatch ]]; then
            arches="$(jq -ec '
              if type == "array" and length > 0
                 and all(.[]; . == "x86_64" or . == "aarch64")
                 and length == (unique | length)
              then . else error("arches must be a nonempty unique list of x86_64 or aarch64") end
            ' <<< "$REQUESTED_ARCHES")"
            echo "arches=$arches" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--event "$EVENT")
          if [[ $EVENT == pull_request ]]; then
            args+=(--base "$BASE" --head "$HEAD")
            for label in $LABELS; do args+=(--label "$label"); done
          fi
          python3 -I tools/ci/os_dev_arches.py "${args[@]}"

  image:
    needs: arches
    uses: ./.forgejo/workflows/build-image.yml
    with:
      arches: ${{ needs.arches.outputs.arches }}
      fex_payload_candidate: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fex_payload_candidate || '' }}
      windows_guest_candidate: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.windows_guest_candidate || '' }}
    secrets: inherit
