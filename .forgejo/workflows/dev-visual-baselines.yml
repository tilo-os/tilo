name: Dev / visual baselines

# Goldens must be produced by the same font stack and software Vulkan renderer
# used by nightly verification. This manual workflow emits review candidates;
# it never commits generated pixels on a maintainer's behalf.
on:
  workflow_dispatch:

concurrency:
  group: refresh-visual-baselines-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: /cargo-home
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  WGPU_BACKEND: vulkan
  # Match required checks exactly. Without an adapter selector wgpu chooses
  # from whatever the particular runner exposes, so a successful refresh can
  # write baselines that every other runner correctly rejects.
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  WGPU_ADAPTER_NAME: llvmpipe

jobs:
  refresh:
    runs-on: runner
    timeout-minutes: 120
    container:
      # Keep this identical to ci-nightly.yml. Updating visual baselines under a
      # mutable image would silently bless changes in fonts or Mesa.
      image: registry.tilo.so/tilo/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
          filter: blob:none

      - name: Read the shared test filters
        run: python3 tools/ci/nextest_filters.py >> "$GITHUB_ENV"

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare headless runtime
        run: |
          test -r "$VK_DRIVER_FILES"
          mkdir -p /tmp/tilo-xdg-runtime
          chmod 700 /tmp/tilo-xdg-runtime

      - name: Render canonical visual baselines
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
          UPDATE_EBOOK_MATH_BASELINE: "1"
          UPDATE_EBOOK_TYPOGRAPHY_BASELINE: "1"
          UPDATE_SNAPSHOTS: "1"
          UPDATE_TYPOGRAPHY_BASELINES: "1"
          TILO_REQUIRE_GPU: "1"
        # The same runner, profile, environment and filter as nightly's
        # verification step. nextest runs each test in its own process and
        # the gpu-golden test group runs them one at a time, so concurrent
        # headless Vulkan renderers cannot crash Mesa's software driver.
        run: >-
          bash tools/with-test-environment.sh
          cargo nextest run --workspace --locked --profile ci
          -E "$GOLDEN_FILTER"

      - name: Assemble review bundle
        # Still collect the candidates written before any test failed.
        if: ${{ !cancelled() }}
        run: |
          review=target/visual-baseline-review
          mkdir -p "$review/files"
          # Intent-to-add makes a newly introduced golden part of the binary
          # patch and review inventory without staging its generated bytes.
          git ls-files --others --exclude-standard -z -- \
            crates/sdk/ui-core/tests/fixtures/typography \
            apps/ebook/tests/fixtures/typography \
            crates/session/shell/tests/snapshots/e2e \
            crates/session/shell/tests/snapshots/wheel_disc \
            | xargs -0 -r git add -N --
          git diff --name-only --diff-filter=AM -- \
            crates/sdk/ui-core/tests/fixtures/typography \
            apps/ebook/tests/fixtures/typography \
            crates/session/shell/tests/snapshots/e2e \
            crates/session/shell/tests/snapshots/wheel_disc \
            > "$review/changed-files.txt"
          git diff --stat -- \
            crates/sdk/ui-core/tests/fixtures/typography \
            apps/ebook/tests/fixtures/typography \
            crates/session/shell/tests/snapshots/e2e \
            crates/session/shell/tests/snapshots/wheel_disc \
            > "$review/diff-stat.txt"
          git diff --binary -- \
            crates/sdk/ui-core/tests/fixtures/typography \
            apps/ebook/tests/fixtures/typography \
            crates/session/shell/tests/snapshots/e2e \
            crates/session/shell/tests/snapshots/wheel_disc \
            > "$review/candidates.patch"
          while IFS= read -r path; do
            [ -z "$path" ] || cp --parents "$path" "$review/files"
          done < "$review/changed-files.txt"
          if [ ! -s "$review/changed-files.txt" ]; then
            printf 'No visual baseline changes were produced.\n' \
              > "$review/no-changes.txt"
          fi
          (cd "$review" && sha256sum candidates.patch > candidates.patch.sha256)

      - name: Upload candidates for visual review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: visual-baseline-candidates-${{ github.sha }}
          path: target/visual-baseline-review
          if-no-files-found: error

