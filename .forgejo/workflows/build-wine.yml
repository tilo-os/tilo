name: Wine / traditional native RPMs

on:
  workflow_dispatch:
  push:
    branches: ["codex/arm64-platform-support"]
    paths:
      - .forgejo/workflows/build-wine.yml
      - os/Containerfile.wine-tools
      - os/dev/fetch-wine-source.py
      - os/dev/wine-source.json
      - os/dev/wine_rpm_contract.py
      - os/dev/merge-wine-rpms.py
      - os/tests/test_fetch_wine_source.py
      - os/dev/wine-mock-producer.py
      - os/dev/run-wine-ci.sh
      - os/tests/test_wine_mock_producer.py
      - os/tests/test_wine_ci_cleanup.py

concurrency:
  group: wine-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-inputs:
    runs-on: runner
    timeout-minutes: 60
    outputs:
      runtime: code.podesta.ai/qos/wine-tools@${{ steps.tools.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Verify native host and acquisition contract
        run: |
          bash os/dev/assert-native-arch.sh x86_64
          python3 os/tests/test_fetch_wine_source.py
          python3 os/tests/test_wine_rpm_contract.py
          python3 os/tests/test_wine_rpm_merge.py
          python3 os/tests/test_wine_mock_producer.py
          python3 os/tests/test_wine_ci_cleanup.py
          df -h .
          grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up native image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Freeze native tooling image
        id: tools
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: os/Containerfile.wine-tools
          platforms: linux/amd64
          push: true
          tags: code.podesta.ai/qos/wine-tools:candidate-${{ github.sha }}-${{ github.run_id }}
          build-args: BASE_REF=${{ env.BASE_REF }}
          provenance: false

      - name: Acquire and authenticate the pinned Wine source
        env:
          TOOLS_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p wine-input-evidence
          ref="code.podesta.ai/qos/wine-tools@$TOOLS_DIGEST"
          printf '%s\n' "$ref" > wine-input-evidence/runtime-image.txt
          docker pull "$ref"
          container=$(docker create --entrypoint python3 "$ref" /tilo/fetch-wine-source.py /wine-inputs/source)
          cleanup() {
            docker cp "$container":/wine-inputs/. wine-input-evidence/ || true
            docker cp "$container":/usr/lib/tilo/. wine-input-evidence/ || true
            docker rm "$container" >/dev/null || true
          }
          trap cleanup EXIT
          docker start --attach "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0

      - name: Retain source and acquisition evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-native-inputs-${{ github.sha }}
          path: wine-input-evidence/
          if-no-files-found: warn

  build:
    needs: native-inputs
    runs-on: runner
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [x86_64, i686]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require native x86 host
        run: bash os/dev/assert-native-arch.sh x86_64

      - name: Download authenticated source inputs
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-native-inputs-${{ github.sha }}
          path: wine-inputs

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve and build full traditional Wine offline
        env:
          WINE_RUNTIME_IMAGE: ${{ needs.native-inputs.outputs.runtime }}
          WINE_TARGET: ${{ matrix.target }}
        run: bash os/dev/run-wine-ci.sh "$WINE_TARGET" "$WINE_RUNTIME_IMAGE" wine-inputs/source wine-evidence

      - name: Retain immutable references and build diagnostics
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-${{ matrix.target }}-${{ github.sha }}
          path: wine-evidence/
          if-no-files-found: warn

  pair:
    needs: [native-inputs, build]
    runs-on: runner
    timeout-minutes: 60
    steps:
      - name: Download x86-64 artifact reference
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-x86_64-${{ github.sha }}
          path: inputs/x86_64

      - name: Download i686 artifact reference
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-i686-${{ github.sha }}
          path: inputs/i686

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Validate both artifacts and merge equivalent noarch packages
        env:
          WINE_RUNTIME_IMAGE: ${{ needs.native-inputs.outputs.runtime }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          containers=()
          cleanup() {
            for container in "${containers[@]}"; do docker rm -f "$container" >/dev/null || true; done
          }
          trap cleanup EXIT
          docker pull "$WINE_RUNTIME_IMAGE"
          merger=$(docker create --entrypoint sleep "$WINE_RUNTIME_IMAGE" infinity)
          containers+=("$merger")
          docker start "$merger" >/dev/null
          for arch in x86_64 i686; do
            ref=$(cat "inputs/$arch/wine-rpms-image.txt")
            [[ "$ref" =~ ^code\.podesta\.ai/qos/wine-rpms@sha256:[0-9a-f]{64}$ ]]
            docker pull "$ref"
            input=$(docker create "$ref" /unused)
            containers+=("$input")
            mkdir -p "payloads/$arch"
            docker cp "$input":/wine-output/. "payloads/$arch/"
            docker cp "payloads/$arch" "$merger:/tmp/$arch"
          done
          x64=$(cat inputs/x86_64/wine-rpms-image.txt)
          x86=$(cat inputs/i686/wine-rpms-image.txt)
          docker exec "$merger" python3 /tilo/merge-wine-rpms.py \
            --x64 /tmp/x86_64 --x86 /tmp/i686 --x64-ref "$x64" --x86-ref "$x86" \
            --pin /tilo/wine-source.json --output /wine-paired
          tag="code.podesta.ai/qos/wine-paired:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker exec "$merger" tar -C / -cf - wine-paired | docker import --platform linux/amd64 - "$tag"
          docker push "$tag"
          mkdir -p paired-evidence
          docker image inspect --format '{{index .RepoDigests 0}}' "$tag" > paired-evidence/image.txt
          docker cp "$merger":/wine-paired/paired-contract.json paired-evidence/

      - name: Retain paired candidate identity
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-paired-${{ github.sha }}
          path: paired-evidence/
          if-no-files-found: error
