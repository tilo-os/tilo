name: CI / security fuzzing

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: security-fuzz
  cancel-in-progress: false

env:
  FALLBACK_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
  FALLBACK_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  fuzz:
    needs: builder
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      # Cache availability changes speed, never the fuzzing result.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      # The shared compiler cache serves the pinned nightly as well: the
      # cargo-fuzz install and the instrumented targets stop recompiling
      # unchanged crates every night.
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      # cargo-fuzz requires sanitizer instrumentation exposed by nightly. Both
      # tool and compiler are pinned so a moving installer cannot silently
      # change the security gate.
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-25 --profile minimal
          cargo +nightly-2026-08-25 install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz tapp ingress
        run: cargo +nightly-2026-08-25 fuzz run tapp_ingress -- -max_total_time=900 -timeout=10

      - name: Fuzz collaboration invite chains
        run: cargo +nightly-2026-08-25 fuzz run collab_invite_chain -- -max_total_time=900 -timeout=10

      - name: Fuzz identity wire formats
        run: cargo +nightly-2026-08-25 fuzz run identity_wire -- -max_total_time=900 -timeout=10

      - name: Fuzz sandbox policy parsing
        run: cargo +nightly-2026-08-25 fuzz run sandbox_policy -- -max_total_time=900 -timeout=10

