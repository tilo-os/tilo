name: Build / Windows compatibility payloads

# Development candidates for Windows apps in the OS image, all CI-built,
# digest-addressed and retained, none release-accepted (translated Wine, Proton
# and GPU execution still need separate tests). build-image.yml consumes them
# through TILO_FEX_PAYLOAD_REF / TILO_WINDOWS_GUEST_REF or its candidate inputs.
#   windows-guest  traditional Wine RPMs for x86-64 and i686, paired, then the
#                  x86 guest assembled from them
#   fex            the ARM FEX toolchain, x86 SDK and signed portable payload
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Payloads to build
        type: choice
        options: [windows-guest, fex, all]
        default: all

concurrency:
  group: build-windows-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-inputs:
    if: inputs.payload != 'fex'
    runs-on: runner
    timeout-minutes: 60
    outputs:
      runtime: registry.tilo.so/tilo/wine-tools@${{ steps.tools.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Verify native host and acquisition contract
        run: |
          bash os/dev/assert-native-arch.sh x86_64
          python3 os/tests/test_fetch_wine_source.py
          python3 os/tests/test_wine_rpm_contract.py
          python3 os/tests/test_wine_rpm_merge.py
          python3 os/tests/test_wine_mock_producer.py
          python3 os/tests/test_wine_ci_cleanup.py
          df -h .
          grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up native image builder
        uses: ./.forgejo/actions/setup-buildx

      - name: Freeze native tooling image
        id: tools
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: os/Containerfile.wine-tools
          platforms: linux/amd64
          push: true
          tags: registry.tilo.so/tilo/wine-tools:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: BASE_REF=${{ env.BASE_REF }}
          cache-from: type=gha,scope=wine-tools-x86_64
          cache-to: type=gha,scope=wine-tools-x86_64,mode=max,ignore-error=true
          provenance: false

      - name: Acquire and authenticate the pinned Wine source
        env:
          TOOLS_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p wine-input-evidence
          ref="registry.tilo.so/tilo/wine-tools@$TOOLS_DIGEST"
          printf '%s\n' "$ref" > wine-input-evidence/runtime-image.txt
          docker pull "$ref"
          container=$(docker create --entrypoint python3 "$ref" /tilo/fetch-wine-source.py /wine-inputs/source)
          cleanup() {
            docker cp "$container":/wine-inputs/. wine-input-evidence/ || true
            docker cp "$container":/usr/lib/tilo/. wine-input-evidence/ || true
            docker rm "$container" >/dev/null || true
          }
          trap cleanup EXIT
          docker start --attach "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0

      - name: Retain source and acquisition evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-native-inputs-${{ github.sha }}
          path: wine-input-evidence/
          if-no-files-found: warn

  build:
    needs: native-inputs
    runs-on: runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [x86_64, i686]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require native x86 host
        run: bash os/dev/assert-native-arch.sh x86_64

      - name: Download authenticated source inputs
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-native-inputs-${{ github.sha }}
          path: wine-inputs

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and build full traditional Wine offline
        env:
          WINE_RUNTIME_IMAGE: ${{ needs.native-inputs.outputs.runtime }}
          WINE_TARGET: ${{ matrix.target }}
        run: bash os/dev/run-wine-ci.sh "$WINE_TARGET" "$WINE_RUNTIME_IMAGE" wine-inputs/source wine-evidence

      - name: Retain immutable references and build diagnostics
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-${{ matrix.target }}-${{ github.sha }}
          path: wine-evidence/
          if-no-files-found: warn

  pair:
    needs: [native-inputs, build]
    runs-on: runner
    timeout-minutes: 60
    outputs:
      ref: ${{ steps.pair.outputs.ref }}
    steps:
      - name: Download x86-64 artifact reference
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-x86_64-${{ github.sha }}
          path: inputs/x86_64

      - name: Download i686 artifact reference
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: wine-i686-${{ github.sha }}
          path: inputs/i686

      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate both artifacts and merge equivalent noarch packages
        id: pair
        env:
          WINE_RUNTIME_IMAGE: ${{ needs.native-inputs.outputs.runtime }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          containers=()
          cleanup() {
            for container in "${containers[@]}"; do docker rm -f "$container" >/dev/null || true; done
          }
          trap cleanup EXIT
          docker pull "$WINE_RUNTIME_IMAGE"
          merger=$(docker create --entrypoint sleep "$WINE_RUNTIME_IMAGE" infinity)
          containers+=("$merger")
          docker start "$merger" >/dev/null
          for arch in x86_64 i686; do
            ref=$(cat "inputs/$arch/wine-rpms-image.txt")
            [[ "$ref" =~ ^registry\.tilo\.so/tilo/wine-rpms@sha256:[0-9a-f]{64}$ ]]
            docker pull "$ref"
            input=$(docker create "$ref" /unused)
            containers+=("$input")
            mkdir -p "payloads/$arch"
            docker cp "$input":/wine-output/. "payloads/$arch/"
            docker cp "payloads/$arch" "$merger:/tmp/$arch"
          done
          x64=$(cat inputs/x86_64/wine-rpms-image.txt)
          x86=$(cat inputs/i686/wine-rpms-image.txt)
          docker exec "$merger" python3 /tilo/merge-wine-rpms.py \
            --x64 /tmp/x86_64 --x86 /tmp/i686 --x64-ref "$x64" --x86-ref "$x86" \
            --pin /tilo/wine-source.json --output /wine-paired
          tag="registry.tilo.so/tilo/wine-paired:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker exec "$merger" tar -C / -cf - wine-paired | docker import --platform linux/amd64 - "$tag"
          docker push "$tag"
          mkdir -p paired-evidence
          docker image inspect --format '{{index .RepoDigests 0}}' "$tag" > paired-evidence/image.txt
          docker cp "$merger":/wine-paired/paired-contract.json paired-evidence/
          echo "ref=$(cat paired-evidence/image.txt)" >> "$GITHUB_OUTPUT"

      - name: Retain paired candidate identity
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-paired-${{ github.sha }}
          path: paired-evidence/
          if-no-files-found: error

  windows-guest:
    needs: [native-inputs, pair]
    runs-on: runner-disk-100g
    timeout-minutes: 90
    env:
      WINDOWS_GUEST_BUILDROOT_REF: ${{ needs.native-inputs.outputs.runtime }}
      WINE_PAIR_REF: ${{ needs.pair.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate native packaging inputs
        run: |
          bash os/dev/assert-native-arch.sh x86_64
          python3 os/dev/run-development-windows-guest.py --validate-only
          python3 os/tests/test_development_windows_guest.py
          python3 os/tests/test_development_wine_repository.py
          python3 os/tests/test_fetch_windows_guest_assets.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Wine, freeze dependencies and assemble the guest
        run: python3 os/dev/run-development-windows-guest.py
      - name: Retain public inputs and payload identities
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: development-windows-guest-${{ github.sha }}-${{ github.run_id }}
          path: guest-evidence/
          if-no-files-found: warn

  fex-buildroot:
    if: inputs.payload != 'windows-guest' && github.ref == 'refs/heads/main'
    runs-on: runner-large-arm64
    timeout-minutes: 90
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build native ARM toolchain candidate
        id: publish
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          source os/base-snapshot.env
          bash os/dev/cache-github-assets.sh nasm-2.16.03.tar.xz
          tag="registry.tilo.so/tilo/tilo-fex-buildroot-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/arm64 --push --provenance=false \
            --metadata-file buildroot-metadata.json --file os/Containerfile.fex-buildroot \
            --build-arg "BASE_REF=$BASE_REF" \
            --build-context github-assets=os/external-assets/cache \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' buildroot-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-buildroot-candidate@$digest" >> "$GITHUB_OUTPUT"

  fex-sdk:
    if: inputs.payload != 'windows-guest' && github.ref == 'refs/heads/main'
    runs-on: runner-large
    timeout-minutes: 90
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build native x86 development SDK candidate
        id: publish
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          source os/base-snapshot.env
          tag="registry.tilo.so/tilo/tilo-fex-x86-sdk-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/amd64 --push --provenance=false \
            --metadata-file sdk-metadata.json --file os/Containerfile.fex-x86-sdk \
            --build-arg "BASE_REF=$BASE_REF" \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' sdk-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-x86-sdk-candidate@$digest" >> "$GITHUB_OUTPUT"

  fex-payload:
    needs: [fex-buildroot, fex-sdk]
    runs-on: runner-large-arm64
    timeout-minutes: 180
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Build verified portable FEX candidate
        id: publish
        env:
          FEX_BUILDROOT_REF: ${{ needs.fex-buildroot.outputs.ref }}
          FEX_X86_SDK_REF: ${{ needs.fex-sdk.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          [[ "$FEX_BUILDROOT_REF" =~ ^registry\.tilo\.so/tilo/tilo-fex-buildroot-candidate@sha256:[0-9a-f]{64}$ ]]
          [[ "$FEX_X86_SDK_REF" =~ ^registry\.tilo\.so/tilo/tilo-fex-x86-sdk-candidate@sha256:[0-9a-f]{64}$ ]]
          echo "::notice::ARM runner CPUs=$(nproc); memory=$(awk '/^MemTotal:/ {print $2 " KiB"}' /proc/meminfo); Docker=$(docker info --format 'CPUs={{.NCPU}} memory={{.MemTotal}} bytes')"
          docker_memory_bytes="$(docker info --format '{{.MemTotal}}')"
          [[ "$docker_memory_bytes" =~ ^[0-9]+$ ]]
          payload_jobs=2
          if (( $(nproc) >= 4 && docker_memory_bytes >= 17179869184 )); then
            payload_jobs=4
          fi
          echo "::notice::FEX payload build jobs=$payload_jobs (bounded by runner CPUs and 16 GiB Docker memory)"
          bash os/dev/fetch-fex-source.sh "$RUNNER_TEMP/fex-source"
          tag="registry.tilo.so/tilo/tilo-fex-payload-candidate:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/arm64 --push --provenance=false \
            --metadata-file fex-metadata.json --file os/Containerfile.fex-payload \
            --build-arg "FEX_BUILDROOT_REF=$FEX_BUILDROOT_REF" \
            --build-arg "FEX_X86_SDK_REF=$FEX_X86_SDK_REF" \
            --build-arg "BUILD_JOBS=$payload_jobs" \
            --build-context "fex-source=$RUNNER_TEMP/fex-source" \
            --label org.tilo.development-only=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' fex-metadata.json)"
          echo "ref=registry.tilo.so/tilo/tilo-fex-payload-candidate@$digest" >> "$GITHUB_OUTPUT"
      - name: Install pinned Cosign
        run: bash os/dev/install-cached-cosign.sh
      - name: Sign candidate and record its limited provenance
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          FEX_BUILDROOT_REF: ${{ needs.fex-buildroot.outputs.ref }}
          FEX_X86_SDK_REF: ${{ needs.fex-sdk.outputs.ref }}
          FEX_PAYLOAD_REF: ${{ steps.publish.outputs.ref }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          jq -n --arg source "$GITHUB_SHA" --arg buildroot "$FEX_BUILDROOT_REF" \
            --arg sdk "$FEX_X86_SDK_REF" --arg payload "$FEX_PAYLOAD_REF" \
            --arg run "$GITHUB_RUN_ID" '{
              buildDefinition: {
                buildType: "https://tilo.sh/buildtypes/development-fex-payload/v1",
                externalParameters: {developmentOnly: true, runtimeAcceptanceVerified: false},
                resolvedDependencies: [
                  {uri: ("git+ssh://code.tilo.so/tilo/tilo@" + $source)},
                  {uri: $buildroot}, {uri: $sdk}
                ]
              },
              runDetails: {
                builder: {id: "https://code.tilo.so/tilo/forgejo/actions/development-fex-v1"},
                metadata: {invocationId: $run, output: $payload}
              }
            }' > fex-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$FEX_PAYLOAD_REF"
          cosign attest --yes --key "$COSIGN_KEY_REF" \
            --predicate fex-provenance.json --type slsaprovenance1 "$FEX_PAYLOAD_REF"
          cosign verify --key keys/cosign.pub "$FEX_PAYLOAD_REF" >/dev/null
          cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$FEX_PAYLOAD_REF" >/dev/null
          echo "::notice::CI-signed development FEX candidate: $FEX_PAYLOAD_REF"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: development-fex-payload-${{ github.sha }}-${{ github.run_id }}
          path: |
            fex-metadata.json
            fex-provenance.json
          if-no-files-found: warn
