name: Snapshot / CI builder

# Publishes code.podesta.ai/qos/tilo-builder, which check.yml runs in. Weekly so
# the base and the package set stay current; on dispatch, and whenever the
# inputs that define the environment change.

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: ["main"]
    paths:
      - "os/Containerfile.builder"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - "os/dev/promote-native-index.py"
      - "rust-toolchain.toml"
      - "tools/check-build-env.sh"
      - ".forgejo/workflows/build-builder-image.yml"
  workflow_dispatch:

concurrency:
  group: build-builder-image
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner
          - arch: aarch64
            platform: linux/arm64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Restore checksum-verified GitHub build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable GitHub build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save checksum-verified GitHub build inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # The image bakes the toolchain the workspace pins, so a job cannot
      # silently compile with a different one.
      - name: Read the pinned toolchain
        run: |
          ch=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          [ -n "$ch" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "RUST_CHANNEL=$ch" >> "$GITHUB_ENV"
          echo "building for toolchain $ch"

      # The runner provides docker, not podman.
      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      # The Containerfile runs tools/check-build-env.sh during the build, so a
      # missing native dependency fails here rather than in every later job.
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: code.podesta.ai/qos/tilo-builder:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=registry,ref=code.podesta.ai/qos/tilo-builder-buildcache:${{ matrix.arch }}
          cache-to: type=registry,ref=code.podesta.ai/qos/tilo-builder-buildcache:${{ matrix.arch }},mode=max

      - name: Install checksum-pinned Cosign
        run: ./os/dev/install-cached-cosign.sh
      - name: Sign and describe the native builder
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CHILD_ARCH: ${{ matrix.arch }}
          CHILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "code.podesta.ai/qos/tilo-builder@${CHILD_DIGEST}"
          mkdir -p native-child
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("native-child/child.json").write_text(json.dumps({
              "architecture": os.environ["CHILD_ARCH"],
              "digest": os.environ["CHILD_DIGEST"],
              "sourceRevision": os.environ["GITHUB_SHA"],
          }))
          PY
      - name: Upload the native child descriptor
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: builder-native-${{ matrix.arch }}
          path: native-child/
          if-no-files-found: error

  # Two separate, fresh job containers prove that an object written by the
  # first compiler process is read back from the remote S3 cache by another.
  # A unique prefix makes the first run genuinely cold without deleting or
  # disturbing the production cache. The package is deliberately small: this
  # is a cache-path assertion, not another workspace build.
  cache-cold:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      # Scope candidate tags to this run attempt so cached images from an older
      # build of the same commit cannot satisfy the cache acceptance tests.
      image: code.podesta.ai/qos/tilo-builder:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/tilo-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      # The runner injects the production SCCACHE_S3_KEY_PREFIX after ordinary
      # workflow env. The prepare hook promotes this non-conflicting request
      # after injection and restarts sccache under the isolated namespace.
      TILO_SCCACHE_KEY_PREFIX: tilo/canary/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-
      - name: Enable remote compiler cache
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          bash tools/ci-sccache.sh prepare
      - name: Populate a new remote cache namespace
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci-measure.sh "sccache cold canary" -- \
            cargo build -p atomic-file --locked
          bash tools/ci-sccache-canary.sh cold

  cache-warm:
    needs: cache-cold
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      image: code.podesta.ai/qos/tilo-builder:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/tilo-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      TILO_SCCACHE_KEY_PREFIX: tilo/canary/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-
      - name: Enable remote compiler cache
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          bash tools/ci-sccache.sh prepare
      - name: Require remote hits from a fresh compiler process
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci-measure.sh "sccache warm canary" -- \
            cargo build -p atomic-file --locked
          bash tools/ci-sccache-canary.sh warm

  promote-builder:
    timeout-minutes: 60
    needs: [build, cache-warm]
    runs-on: runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download native child descriptors
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: native-children
      - name: Log in to code.podesta.ai
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Install publication tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends podman skopeo
          else
            sudo -n dnf install -y podman skopeo
          fi
      - name: Verify and promote the tested native builder index
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          python3 os/dev/promote-native-index.py \
            --repository code.podesta.ai/qos/tilo-builder \
            --tag "$GITHUB_SHA" --tag "$channel" --tag latest \
            --revision "$GITHUB_SHA" --descriptors native-children \
            --signing-key env://COSIGN_PRIVATE_KEY --output builder-index.txt
          cat builder-index.txt >> "$GITHUB_STEP_SUMMARY"
