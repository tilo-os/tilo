name: Build the CI builder image

# Publishes code.podesta.ai/qos/qos-builder, which check.yml runs in. Weekly so
# the base and the package set stay current; on dispatch, and whenever the
# inputs that define the environment change.

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: ["main"]
    paths:
      - "os/Containerfile.builder"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "rust-toolchain.toml"
      - "tools/check-build-env.sh"
      - ".forgejo/workflows/build-builder-image.yml"
  workflow_dispatch:

concurrency:
  group: build-builder-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Restore checksum-verified GitHub build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable GitHub build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save checksum-verified GitHub build inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # The image bakes the toolchain the workspace pins, so a job cannot
      # silently compile with a different one.
      - name: Read the pinned toolchain
        run: |
          ch=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          [ -n "$ch" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "RUST_CHANNEL=$ch" >> "$GITHUB_ENV"
          echo "building for toolchain $ch"

      # The runner provides docker, not podman.
      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The Containerfile runs tools/check-build-env.sh during the build, so a
      # missing native dependency fails here rather than in every later job.
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          push: true
          build-args: |
            RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: |
            code.podesta.ai/qos/qos-builder:${{ env.RUST_CHANNEL }}
            code.podesta.ai/qos/qos-builder:${{ github.sha }}
            code.podesta.ai/qos/qos-builder:latest

  # Two separate, fresh job containers prove that an object written by the
  # first compiler process is read back from the remote S3 cache by another.
  # A unique prefix makes the first run genuinely cold without deleting or
  # disturbing the production cache. The package is deliberately small: this
  # is a cache-path assertion, not another workspace build.
  cache-cold:
    needs: build
    runs-on: runner
    container:
      # Use the immutable image produced by this run. A mutable `latest` tag
      # can resolve to a runner's stale local image even after the build job
      # has pushed a replacement.
      image: code.podesta.ai/qos/qos-builder:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/qos-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      # The runner injects the production SCCACHE_S3_KEY_PREFIX after ordinary
      # workflow env. The prepare hook promotes this non-conflicting request
      # after injection and restarts sccache under the isolated namespace.
      QOS_SCCACHE_KEY_PREFIX: quickdesktop/canary/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-
      - name: Enable remote compiler cache
        run: bash tools/ci-sccache.sh prepare
      - name: Populate a new remote cache namespace
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci-measure.sh "sccache cold canary" -- \
            cargo build -p atomic-file --locked
          bash tools/ci-sccache-canary.sh cold

  cache-warm:
    needs: cache-cold
    runs-on: runner
    container:
      image: code.podesta.ai/qos/qos-builder:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/qos-sccache-canary-target
      SCCACHE_IGNORE_SERVER_IO_ERROR: "0"
      QOS_SCCACHE_KEY_PREFIX: quickdesktop/canary/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-
      - name: Enable remote compiler cache
        run: bash tools/ci-sccache.sh prepare
      - name: Require remote hits from a fresh compiler process
        run: |
          test -n "${RUSTC_WRAPPER:-}"
          bash tools/ci-measure.sh "sccache warm canary" -- \
            cargo build -p atomic-file --locked
          bash tools/ci-sccache-canary.sh warm
