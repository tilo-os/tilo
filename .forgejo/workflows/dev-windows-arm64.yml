name: Dev / Windows ARM64 binaries

# Cross-build exact-source Windows ARM64 binaries on a Linux ARM64 runner, for
# hosts without a Rust build tree or a native Windows runner:
#   tilo-vm  the development CLI, to iterate with WHPX
#   imager   the imager and its test executable, which runs on the target host
#            with file-backed firmware variables before any physical write
on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to build
        type: choice
        options: [tilo-vm, imager]
        default: tilo-vm

jobs:
  tilo-vm:
    if: inputs.binary == 'tilo-vm'
    runs-on: runner-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.forgejo/actions/setup-windows-arm64-cross
      - name: Cross-build tilo-vm and run its unit tests
        run: |
          cargo xwin build -p tilo-vm --locked --release --target aarch64-pc-windows-msvc
          cargo test -p tilo-vm --locked --lib
          mkdir -p out
          cp target/aarch64-pc-windows-msvc/release/tilo-vm.exe out/tilo-vm.exe
          (cd out && sha256sum tilo-vm.exe > tilo-vm.exe.sha256)
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-vm-windows-arm64-${{ github.sha }}
          path: out/
          if-no-files-found: error

  imager:
    if: inputs.binary == 'imager'
    runs-on: runner-arm64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.forgejo/actions/setup-windows-arm64-cross
      - name: Cross-build the imager and its test executable
        run: |
          # ring forces clang for Windows ARM64, bypassing cc-rs' CC setting.
          # Use cargo-xwin's clang backend so its SDK flags match that driver.
          export XWIN_CROSS_COMPILER=clang
          # A file-backed firmware handoff test binary, not the optimized public
          # imager release: skip workspace fat LTO, which links for minutes.
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          # Clang 18 treats the SDK's __prefetch declaration as a conflicting
          # builtin in zstd-sys and OpenH264, so rename that unused declaration
          # while compiling those vendored sources. Zstd's NEON path emits
          # unresolved helper calls with this MSVC cross toolchain; use its
          # portable decoder for the Windows ARM64 host helper.
          export TILO_REAL_CLANG="$(command -v clang-18 || command -v clang)"
          mkdir -p "$RUNNER_TEMP/tilo-clang"
          cat > "$RUNNER_TEMP/tilo-clang/clang" <<'SH'
          #!/bin/sh
          case " $* " in
            *zstd/lib/*) exec "$TILO_REAL_CLANG" -D__prefetch=__tilo_sdk_prefetch -DZSTD_NO_INTRINSICS "$@" ;;
            *upstream/codec/*) exec "$TILO_REAL_CLANG" -D__prefetch=__tilo_sdk_prefetch "$@" ;;
            *) exec "$TILO_REAL_CLANG" "$@" ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/tilo-clang/clang"
          export PATH="$RUNNER_TEMP/tilo-clang:$PATH"
          cargo xwin test -p imager --lib --locked --release --target aarch64-pc-windows-msvc --no-run
          cargo xwin build -p imager --bin imager --locked --release --target aarch64-pc-windows-msvc
          mkdir -p out
          cp target/aarch64-pc-windows-msvc/release/imager.exe out/imager.exe
          mapfile -t tests < <(find target/aarch64-pc-windows-msvc/release/deps -maxdepth 1 -name 'imager-*.exe' | sort)
          test "${#tests[@]}" -eq 1
          cp "${tests[0]}" out/imager-tests.exe
          (cd out && sha256sum imager.exe imager-tests.exe > sha256.txt)
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: imager-windows-arm64-handoff-${{ github.sha }}
          path: out/
          if-no-files-found: error
