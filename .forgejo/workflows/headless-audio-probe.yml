name: Isolated headless audio dependency probe
on:
  push:
    branches: [codex/ci-audio-fix-probe]
jobs:
  audio:
    strategy:
      fail-fast: false
      matrix:
        runner: [runner, runner-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    container:
      image: code.podesta.ai/qos/tilo-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Replace only the conflicting audio daemon and exercise its socket
        run: |
          set -euo pipefail
          echo  | base64 -d > /tmp/ensure-headless-audio.sh
          echo  | base64 -d > /tmp/with-headless-audio.sh
          rpm -qa --qf '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > /tmp/before-rpms
          bash /tmp/ensure-headless-audio.sh
          rpm -qa --qf '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > /tmp/after-rpms
          python3 - <<'PY'
          from pathlib import Path
          before = dict(line.split(' ', 1) for line in Path('/tmp/before-rpms').read_text().splitlines())
          after = dict(line.split(' ', 1) for line in Path('/tmp/after-rpms').read_text().splitlines())
          for name, version in before.items():
              if name != 'pipewire-pulseaudio':
                  assert after.get(name) == version, (name, version, after.get(name))
          assert 'pulseaudio' in after
          print('Existing package versions preserved; PulseAudio available')
          PY
          bash /tmp/with-headless-audio.sh python3 -c 'import os,socket; s=socket.socket(socket.AF_UNIX); s.connect(os.environ["PULSE_SERVER"].removeprefix("unix:")); s.close(); print("Private production audio wrapper endpoint reachable")'
          bash /tmp/ensure-headless-audio.sh
