name: Build / Wine RPM pair

on:
  workflow_dispatch:
    inputs:
      buildroot_candidate:
        description: Immutable native Wine tools image
        required: true
        type: string
        default: registry.tilo.so/tilo/wine-tools@sha256:ce66cbd0539b5871e0039676cfa58b4a6eaa764e2789e7c7c7621579b07dff34
      x64_candidate:
        description: Immutable retained x86-64 Wine RPM artifact
        required: true
        type: string
      i686_candidate:
        description: Immutable retained i686 Wine RPM artifact
        required: true
        type: string

concurrency:
  group: development-wine-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pair:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')
    runs-on: runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Check packaging contract
        run: |
          bash os/dev/assert-native-arch.sh x86_64
          python3 os/tests/test_wine_rpm_merge.py
          python3 os/tests/test_wine_rpm_contract.py
      - name: Log in to candidate artifact registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate both artifacts and merge equivalent noarch packages
        env:
          WINE_RUNTIME_IMAGE: ${{ inputs.buildroot_candidate }}
          X64_REF: ${{ inputs.x64_candidate }}
          X86_REF: ${{ inputs.i686_candidate }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          [[ "$WINE_RUNTIME_IMAGE" =~ ^registry\.tilo\.so/tilo/wine-tools@sha256:[0-9a-f]{64}$ ]]
          for ref in "$X64_REF" "$X86_REF"; do
            [[ "$ref" =~ ^registry\.tilo\.so/tilo/wine-rpms@sha256:[0-9a-f]{64}$ ]]
          done
          containers=()
          cleanup() {
            for container in "${containers[@]}"; do docker rm -f "$container" >/dev/null || true; done
          }
          trap cleanup EXIT
          docker pull "$WINE_RUNTIME_IMAGE"
          merger=$(docker create --entrypoint sleep "$WINE_RUNTIME_IMAGE" infinity)
          containers+=("$merger")
          docker start "$merger" >/dev/null
          # Refresh the reviewed packaging code without rebuilding retained tools.
          for file in merge-wine-rpms.py wine_rpm_contract.py; do
            docker cp "os/dev/$file" "$merger:/tilo/$file"
          done
          docker cp os/dev/wine-source.json "$merger:/tilo/wine-source.json"
          for arch in x86_64 i686; do
            case "$arch" in x86_64) ref="$X64_REF";; i686) ref="$X86_REF";; esac
            [[ "$ref" =~ ^registry\.tilo\.so/tilo/wine-rpms@sha256:[0-9a-f]{64}$ ]]
            docker pull "$ref"
            input=$(docker create "$ref" /unused)
            containers+=("$input")
            mkdir -p "payloads/$arch"
            docker cp "$input":/wine-output/. "payloads/$arch/"
            docker cp "payloads/$arch" "$merger:/tmp/$arch"
          done
          x64="$X64_REF"
          x86="$X86_REF"
          docker exec "$merger" python3 /tilo/merge-wine-rpms.py \
            --x64 /tmp/x86_64 --x86 /tmp/i686 --x64-ref "$x64" --x86-ref "$x86" \
            --pin /tilo/wine-source.json --output /wine-paired
          tag="registry.tilo.so/tilo/wine-paired:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker exec "$merger" tar -C / -cf - wine-paired | docker import --platform linux/amd64 - "$tag"
          docker push "$tag"
          mkdir -p paired-evidence
          docker image inspect --format '{{index .RepoDigests 0}}' "$tag" > paired-evidence/image.txt
          docker cp "$merger":/wine-paired/paired-contract.json paired-evidence/

      - name: Retain paired candidate identity
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wine-paired-${{ github.sha }}
          path: paired-evidence/
          if-no-files-found: error
