name: CI / pre-merge lint

# A pull request is linted as it merges onto main's current tip, with the same
# selection a push is refused for (tools/ci/pre_push_lint.py): the packages the
# change touches and the packages whose own source names something it changed,
# natively and for the page. A merge the forge makes is a commit no contributor's
# pre-push hook ever saw, so without this the first lint of the merged tree runs
# after it is already main.
#
# The other checks read a main push (check.yml, lint.yml). This one reads the
# merge before it lands, and lints the crates a merge can break that neither
# side's own run named.
on:
  pull_request:
  workflow_dispatch:

# A newer commit of the same pull request replaces its run: only the newest
# merge is worth linting.
concurrency:
  group: pre-merge-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: runner-quality
    timeout-minutes: 30
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Disable automatic Git maintenance in the disposable job container
        # Git 2.54 maintenance can rewrite shallow history between fetches.
        # Checkout copies this global config before its first fetch.
        run: git config --global maintenance.auto false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge result is what lands, so it is what the lint reads: it
          # compares the pushed range with the checkout, and names the commits
          # the merge adds.
          fetch-depth: 0
          fetch-tags: false

      # What a pull request is checked as: its head on main's current tip.
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main

      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads

      - name: Install the page's target
        run: rustup target add wasm32-unknown-unknown

      - name: Lint what the merge changes
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.merge.outputs.main }}'
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^)
          fi
          bash tools/ci/measure.sh "pre-merge lint" -- \
            python3 -I tools/ci/pre_push_lint.py --range "$base..HEAD"
