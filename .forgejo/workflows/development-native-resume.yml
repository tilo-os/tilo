name: Development / reconstruct retained ARM native payload

on:
  workflow_dispatch:
    inputs:
      helpers_revision:
        description: Reviewed full controller/helper commit including resume hook
        required: true
        type: string
      checkpoint_initial:
        description: Exact public initial17-ELF checkpoint receipt JSON
        required: true
        type: string
      checkpoint_initial_sha256:
        description: SHA256 of exact initial receipt UTF-8 bytes
        required: true
        type: string
      checkpoint_delta:
        description: Exact public additional5-ELF checkpoint receipt JSON
        required: true
        type: string
      checkpoint_delta_sha256:
        description: SHA256 of exact delta receipt UTF-8 bytes
        required: true
        type: string
      checkpoint_release:
        description: Optional run8166 checkpoint_release (supply all reconstructed inputs together)
        required: false
        type: string
      checkpoint_release_sha256:
        description: Optional run8166 checkpoint_release_sha256 (supply all reconstructed inputs together)
        required: false
        type: string
      checkpoint_windows:
        description: Optional run8166 checkpoint_windows (supply all reconstructed inputs together)
        required: false
        type: string
      checkpoint_windows_sha256:
        description: Optional run8166 checkpoint_windows_sha256 (supply all reconstructed inputs together)
        required: false
        type: string
      reconstructed_partial_admission:
        description: Optional run8166 reconstructed_partial_admission (supply all reconstructed inputs together)
        required: false
        type: string
      reconstructed_partial_admission_sha256:
        description: Optional run8166 reconstructed_partial_admission_sha256 (supply all reconstructed inputs together)
        required: false
        type: string
      wpe_adoption:
        description: Original verified WPE adoption receipt JSON
        required: true
        type: string
      wpe_adoption_sha256:
        description: SHA256 of exact WPE receipt UTF-8 bytes
        required: true
        type: string
      thin_cache_approval:
        description: Optional independently reviewed small admission JSON binding cache and metadata OCI artifacts
        required: false
        type: string
      thin_cache_approval_sha256:
        description: SHA256 of exact thin-cache approval UTF-8 bytes
        required: false
        type: string

concurrency:
  group: development-native-reconstruction-arm64
  cancel-in-progress: false

jobs:
  reconstruct:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    runs-on: runner-disk-100g-arm64
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller
          ref: ${{ inputs.helpers_revision }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: 4583a44c4056c67cfd1ebc4f1e02c7fa4aff3ffc
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate helper and install existing pinned cosign
        env:
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          revision = os.environ['HELPERS_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          assert subprocess.check_output(['git', '-C', 'controller', 'rev-parse', 'HEAD']).decode().strip() == revision
          PY
          bash controller/os/dev/install-cached-cosign.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Reconstruct missing native phases with retained executable union
        timeout-minutes: 165
        env:
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
          CHECKPOINT_INITIAL: ${{ inputs.checkpoint_initial }}
          CHECKPOINT_INITIAL_SHA256: ${{ inputs.checkpoint_initial_sha256 }}
          CHECKPOINT_DELTA: ${{ inputs.checkpoint_delta }}
          CHECKPOINT_DELTA_SHA256: ${{ inputs.checkpoint_delta_sha256 }}
          CHECKPOINT_RELEASE: ${{ inputs.checkpoint_release }}
          CHECKPOINT_RELEASE_SHA256: ${{ inputs.checkpoint_release_sha256 }}
          CHECKPOINT_WINDOWS: ${{ inputs.checkpoint_windows }}
          CHECKPOINT_WINDOWS_SHA256: ${{ inputs.checkpoint_windows_sha256 }}
          RECONSTRUCTED_PARTIAL_ADMISSION: ${{ inputs.reconstructed_partial_admission }}
          RECONSTRUCTED_PARTIAL_ADMISSION_SHA256: ${{ inputs.reconstructed_partial_admission_sha256 }}
          WPE_ADOPTION: ${{ inputs.wpe_adoption }}
          WPE_ADOPTION_SHA256: ${{ inputs.wpe_adoption_sha256 }}
          THIN_CACHE_APPROVAL: ${{ inputs.thin_cache_approval }}
          THIN_CACHE_APPROVAL_SHA256: ${{ inputs.thin_cache_approval_sha256 }}
        run: |
          python3 controller/os/dev/launch-native-resume.py \
            --source "$PWD/source" --helpers "$PWD/controller" \
            --evidence "$RUNNER_TEMP/native-reconstruction-evidence"
      - name: Retain public reconstruction provenance
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: native-reconstruction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-reconstruction-evidence/
          if-no-files-found: warn
          retention-days: 14
