name: Development / reconstructed ARM kernel

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed kernel source commit (40 lowercase hex characters)
        default: 33e83f64cde9df4ee65ff47a708f125d932256da
        required: true
        type: string
      base_candidate:
        description: Immutable native Fedora bootc base reference
        required: true
        type: string
      rpms_candidate:
        description: Immutable native RPM snapshot with the kernel SRPM and build dependencies
        required: true
        type: string
      helper_revision:
        description: Exact reviewed recovery helper commit
        required: true
        type: string
      checkpoint_candidate:
        description: Immutable incomplete kernel checkpoint image
        required: true
        type: string
      checkpoint_approval:
        description: Exact independently reviewed admission JSON (hash includes all bytes)
        required: true
        type: string
      approval_sha256:
        description: Independently reviewed SHA256 of checkpoint_approval
        required: true
        type: string

concurrency:
  group: development-kernel-aarch64
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: runner-disk-100g-arm64
    timeout-minutes: 170
    env:
      # This runner allocates four CPUs. Two jobs left roughly half idle;
      # measured compiler memory fits four jobs within its existing limit.
      KERNEL_BUILD_JOBS: "4"
      SOURCE_REVISION: ${{ inputs.source_revision }}
      BASE_REF: ${{ inputs.base_candidate }}
      RPMS_REF: ${{ inputs.rpms_candidate }}
      HELPER_REVISION: ${{ inputs.helper_revision }}
      CHECKPOINT_REF: ${{ inputs.checkpoint_candidate }}
      CHECKPOINT_APPROVAL: ${{ inputs.checkpoint_approval }}
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
    steps:
      - name: Validate immutable development inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$SOURCE_REVISION" = 33e83f64cde9df4ee65ff47a708f125d932256da
          [[ "$HELPER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHECKPOINT_REF" =~ ^code\.podesta\.ai/qos/tilo-development-partial-kernel-aarch64@sha256:[0-9a-f]{64}$ ]]
          [[ "$BASE_REF" =~ ^code\.podesta\.ai/qos/fedora-bootc@sha256:[0-9a-f]{64}$ ]]
          [[ "$RPMS_REF" =~ ^code\.podesta\.ai/qos/(rpms|tilo-development-rpms-aarch64)@sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout exact kernel source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false

      - name: Checkout reviewed recovery helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision }}
          path: recovery-helpers
          fetch-depth: 1
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false

      - name: Record source and unique development output
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git -C recovery-helpers rev-parse HEAD)" = "$HELPER_REVISION"
          bash os/dev/assert-native-arch.sh aarch64
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE=code.podesta.ai/qos/tilo-development-reconstructed-kernel-aarch64:candidate-$SOURCE_REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Authenticate development artifact transfers
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require native input images
        run: |
          set -euo pipefail
          for ref in "$BASE_REF" "$RPMS_REF"; do
            docker pull --platform=linux/arm64 "$ref"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")" = linux/arm64
          done

      - name: Stage independently approved public checkpoint
        run: |
          set -euo pipefail
          docker pull --platform=linux/arm64 "$CHECKPOINT_REF"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$CHECKPOINT_REF")" = linux/arm64
          mkdir checkpoint-public
          checkpoint_container=$(docker create "$CHECKPOINT_REF" /bin/true)
          trap 'docker rm "$checkpoint_container" >/dev/null 2>&1 || true' EXIT
          for name in tree.tar scan.json capture-receipt.json; do
            docker cp "$checkpoint_container:/checkpoint/$name" "checkpoint-public/$name"
          done
          docker cp "$checkpoint_container:/checkpoint/toolchain-receipt.json" checkpoint-public/toolchain.json
          python3 recovery-helpers/os/dev/stage-kernel-checkpoint.py

      - name: Set up bounded native BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          driver-opts: |
            memory=9g
            memory-swap=9g

      - name: Resume admitted kernel and retain verified packaging
        id: compile
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: kernel-recovery.Containerfile
          build-contexts: |
            kernel-checkpoint=./checkpoint-context
          target: reconstructed-publish
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.CANDIDATE }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
            KERNEL_BUILD_JOBS=${{ env.KERNEL_BUILD_JOBS }}
            KERNEL_CHECKPOINT_RUN_ID=${{ github.run_id }}
            KERNEL_CHECKPOINT_ATTEMPT=${{ github.run_attempt }}
          cache-from: |
            type=registry,ref=code.podesta.ai/qos/tilo-development-kernel-buildcache:aarch64
            type=registry,ref=code.podesta.ai/qos/tilo-kernel-buildcache:aarch64
          cache-to: type=registry,ref=code.podesta.ai/qos/tilo-development-kernel-buildcache:aarch64,mode=min
          provenance: false

      - name: Retain public checkpoint after failed kernel make
        if: failure() && steps.compile.outcome == 'failure'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # This target reads only the run-specific cache; it has no dependency
          # on the compile stage and cannot compile the kernel a second time.
          partial="code.podesta.ai/qos/tilo-development-partial-kernel-aarch64:failed-$SOURCE_REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx build --file kernel-recovery.Containerfile --target failed-kernel-checkpoint \
            --platform linux/arm64 --build-context kernel-checkpoint=./checkpoint-context \
            --build-arg "BASE_REF=$BASE_REF" --build-arg "RPMS_REF=$RPMS_REF" \
            --build-arg "KERNEL_CHECKPOINT_RUN_ID=$GITHUB_RUN_ID" \
            --build-arg "KERNEL_CHECKPOINT_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            --provenance=false --load --tag "$partial" .
          # Export failure remains failure: the failed compile step is never
          # continue-on-error and no normal kernel success receipt is emitted.
          mkdir -p kernel-evidence
          cid=$(docker create "$partial" /bin/true)
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/capture-receipt.json" kernel-evidence/failed-make-capture.json
          docker cp "$cid:/SHA256SUMS" kernel-evidence/failed-make-SHA256SUMS
          docker push "$partial"
          PARTIAL_REF="$partial" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          ref=os.environ['PARTIAL_REF']
          image=json.loads(subprocess.check_output(['docker','image','inspect',ref]))[0]
          digest=next(x for x in image['RepoDigests'] if x.startswith('code.podesta.ai/qos/tilo-development-partial-kernel-aarch64@sha256:'))
          raw=subprocess.check_output(['docker','buildx','imagetools','inspect','--raw',digest])
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==digest.split('@')[1], 'published manifest digest differs'
          assert json.loads(raw)['config']['digest']==image['Id'], 'published config differs'
          capture=json.loads(pathlib.Path('kernel-evidence/failed-make-capture.json').read_text())
          assert capture['success'] is True and capture['capture']['build_success'] is False
          assert capture['capture']['run_id']==os.environ['GITHUB_RUN_ID'] and capture['capture']['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          pathlib.Path('kernel-evidence/failed-make-publication.json').write_text(json.dumps(dict(
              purpose='failed-make-public-kernel-checkpoint',reference=digest,config_digest=image['Id'],
              capture=capture,installable=False,build_success=False,resume_admitted=False),sort_keys=True)+'\n')
          PY

      - name: Inspect packaged RPM without executing its payload
        run: |
          set -euo pipefail
          mkdir -p kernel-evidence kernel-repo
          container=$(docker create "$CANDIDATE" /bin/true)
          audit_container=''
          cleanup() {
            docker rm "$container" >/dev/null 2>&1 || true
            [ -z "$audit_container" ] || docker rm -f "$audit_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$container:/repo/." kernel-repo/
          docker cp "$container:/reconstruction/." kernel-evidence/
          shopt -s nullglob
          packages=(kernel-repo/*.rpm)
          test "${#packages[@]}" -eq 1
          test -s kernel-repo/repodata/repomd.xml
          # The daemon runs in DinD; runner workspace paths are not daemon paths.
          audit_container=$(docker create --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --memory=512m --pids-limit=64 \
            --entrypoint /bin/bash "$BASE_REF" -c '
              set -euo pipefail
              ulimit -f 16384
              command -v rpm rpm2cpio cpio >/dev/null
              mkdir /audit
              test "$(rpm -qp --qf "%{NAME}|%{ARCH}" /repo/*.rpm)" = "tilo-kernel-core|aarch64"
              rpm -K /repo/*.rpm
              rpm2cpio /repo/*.rpm | cpio --extract --to-stdout --quiet "./lib/modules/*/config" > /audit/kernel.config
              test -s /audit/kernel.config
              sh /kernel-build-support.sh check-config aarch64 /audit/kernel.config
              rpm -qp --qf "%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}\n" /repo/*.rpm
            ')
          docker cp kernel-repo "$audit_container:/repo"
          docker cp os/kernel/build-support.sh "$audit_container:/kernel-build-support.sh"
          docker start --attach "$audit_container" > kernel-evidence/rpm-validation.txt 2>&1 || true
          test "$(docker inspect --format '{{.State.ExitCode}}' "$audit_container")" = 0
          docker cp "$audit_container:/audit/kernel.config" kernel-evidence/kernel.config
          sha256sum "${packages[0]}" > kernel-evidence/rpm.sha256
          docker image inspect "$CANDIDATE" > kernel-evidence/image.json

      - name: Publish the same compiled image and its public receipt
        run: |
          set -euo pipefail
          docker push "$CANDIDATE"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          image = json.loads(pathlib.Path('kernel-evidence/image.json').read_text())[0]
          raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', os.environ['CANDIDATE']])
          manifest = json.loads(raw)
          assert manifest['config']['digest'] == image['Id'], 'published config differs from compiled image'
          repository = os.environ['CANDIDATE'].split(':candidate-', 1)[0]
          published = json.loads(subprocess.check_output(['docker', 'image', 'inspect', os.environ['CANDIDATE']]))[0]
          refs = [ref for ref in published['RepoDigests'] if re.fullmatch(re.escape(repository) + r'@sha256:[0-9a-f]{64}', ref)]
          assert len(refs) == 1, 'one immutable published repository digest required'
          reference = refs[0]
          # Verify the digest-addressed registry object, not just the mutable tag.
          pinned = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', reference])
          assert json.loads(pinned)['config']['digest'] == image['Id']
          assert json.loads(pinned) == manifest
          package = next(pathlib.Path('kernel-repo').glob('*.rpm'))
          recipes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(pathlib.Path('os/kernel').rglob('*')) if p.is_file()}
          runtime_path = pathlib.Path('kernel-evidence/runtime.json')
          runtime = json.loads(runtime_path.read_bytes())
          assert runtime['purpose'] == 'tilo-kernel-reconstruction-runtime-evidence'
          assert runtime['regenerated_certificate_matches'] is True
          assert runtime['embedded_certificate_verified'] is True
          assert re.fullmatch('[0-9a-f]{64}', runtime['module_certificate_der_sha256'])
          invalidations = pathlib.Path('kernel-evidence/invalidations.json').read_bytes()
          assert runtime['invalidations_sha256'] == hashlib.sha256(invalidations).hexdigest()
          assert runtime['invalidated_paths'] == len(json.loads(invalidations))
          receipt = dict(schema=1, purpose='tilo-development-reconstructed-kernel', architecture='aarch64',
              reference=reference, config_digest=image['Id'], source_revision=os.environ['SOURCE_REVISION'],
              source_date_epoch=int(os.environ['SOURCE_DATE_EPOCH']), base=os.environ['BASE_REF'],
              rpms=os.environ['RPMS_REF'], recipe_sha256=recipes,
              package=dict(name=package.name, sha256=hashlib.file_digest(package.open('rb'), 'sha256').hexdigest()),
              run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              kernel_build_jobs=int(os.environ['KERNEL_BUILD_JOBS']), production_signed=False, boot_validated=False,
              installable=False, original_recipe_executed_verbatim=False,
              runtime_evidence=runtime,
              runtime_evidence_sha256=hashlib.sha256(runtime_path.read_bytes()).hexdigest(),
              reconstruction=json.loads(pathlib.Path('kernel-evidence/reconstruction.json').read_text()))
          pathlib.Path('kernel-evidence/receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(reference)
          PY

      - name: Retain public kernel evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: development-reconstructed-kernel-aarch64-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: kernel-evidence/
          if-no-files-found: warn
