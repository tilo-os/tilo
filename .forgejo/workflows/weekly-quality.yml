name: CI / weekly quality

# These compile-heavy whole-tree gates do not need to consume the shared runner
# on every pull request. Nightly covers compilation/tests; this weekly job covers
# the warning ratchet, workspace Clippy, docs, and release-size promises.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-quality
  cancel-in-progress: false

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.sandbox.example/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tools/ci/resolve_builder.py
          sparse-checkout-cone-mode: false
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Resolve the CI builder
        id: resolve
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 tools/ci/resolve_builder.py

  quality:
    needs: builder
    runs-on: runner
    timeout-minutes: 240
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # CI consumes diagnostics from rustc, not debugger symbols. Keeping the
      # dev profile aligned with check/nightly also lets sccache share their
      # objects instead of maintaining a second full-debuginfo namespace.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: never
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: No rustc warnings
        run: bash tools/ci/measure.sh "workspace warnings" -- tools/ci/check-warnings.sh

      - name: Clippy (warnings are errors)
        run: bash tools/ci/measure.sh "workspace clippy" -- tools/ci/clippy-check.sh --workspace

      - name: Documentation (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >-
          bash tools/ci/measure.sh "workspace docs" --
          cargo doc --workspace --no-deps --locked

      - name: Build release binaries
        run: >-
          bash tools/ci/measure.sh "workspace release" --
          cargo build --release --workspace --locked

      - name: Check binary sizes against budget
        run: tools/check-binary-size.sh

      - name: Report remote compiler-cache effectiveness
        if: always()
        run: bash tools/ci/sccache.sh report || true
