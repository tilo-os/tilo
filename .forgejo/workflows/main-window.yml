name: CI / main window

# The safety net for check.yml's `supersede` job. Main takes a push every couple
# of minutes and a full run needs five large runner slots for about an hour, so
# waiting push runs pile up unless each new run drops the ones behind it. That
# decision is a job in the run itself, which keeps the queue clear only while it
# runs; this workflow repeats the cancellation on a timer so a supersede job that
# failed, or a run that never reached a runner, cannot let the pile grow back.
#
# It only ever cancels push runs on main that have not started a single job, so
# it drops nothing that is measuring anything. Their commits belong to the
# newest run's window: check.yml plans from the head of the newest earlier run
# whose window ran, so the plan reaches back over every run dropped here.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # One sweep at a time; a schedule tick that arrives during a sweep waits.
  group: main-window
  cancel-in-progress: false

jobs:
  sweep:
    # Runner quality for a few seconds: this lists runs and cancels queue
    # positions, and never touches a large runner slot.
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:281af08d34010af96f97630aa5fde224b6ca02b130aff553ceb3d297d44fca7d
    steps:
      - name: Check out the sweep
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Cancel the push runs on main that never started
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          # Cancelling a run writes to this repository, and the run's own token
          # may not carry that; a refusal falls back to the repository token.
          CI_SPARE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 tools/ci/push_window.py --sweep
