name: CI / app SDK

# One app source, three targets. These lanes prove that the SDK builds Tilo
# apps for Linux, macOS and the web through `tilo-app`, that a generated app
# builds outside this repository, that every web-capable app runs in headless
# Chromium, and that web bundles only shrink.
on:
  # Pull requests and pushes share one path list. The lander requires this
  # workflow's checks only on a head it reported on.
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/config.toml"
      - ".forgejo/workflows/app-sdk.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tools/ci/app_sdk_affected.py"
      - "tools/ci/workspace_graph.py"
      - "tools/policy/app_capability*"
      - "tools/policy/app_portability*"
      - "tools/policy/check_app_*"
      - "tools/sdk/**"
      - "tools/web/**"
      - "vendor/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/config.toml"
      - ".forgejo/workflows/app-sdk.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tools/ci/app_sdk_affected.py"
      - "tools/ci/workspace_graph.py"
      - "tools/policy/app_capability*"
      - "tools/policy/app_portability*"
      - "tools/policy/check_app_*"
      - "tools/sdk/**"
      - "tools/web/**"
      - "vendor/**"
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Diagnostic selection; normal PR/main runs retain every lane.'
        type: choice
        required: false
        default: all
        options: [all, linux]

concurrency:
  # A newer commit on a pull request replaces its older run. Pushes keep one
  # run per commit.
  group: app-sdk-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # The browser runtime pins wasm-bindgen; the CLI must match it exactly.
  WASM_BINDGEN_VERSION: "0.2.108"

jobs:
  # Native PR lanes wait for these compile-free gates; invalid PRs do not
  # consume native slots. Main keeps all selected native diagnostics even
  # when policy fails. The dev and release browser lanes remain independent.
  # Compile-free gates: portability rules and their shrink-only baseline, the
  # capabilities each app's code uses against its manifest, the
  # manifest-generated desktop registry, the SDK patch list outside apps
  # carry, the publishable crate set, and the web size budgets.
  policy:
    needs: [builder]
    runs-on: runner-quality
    timeout-minutes: 20
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.builder.outputs.main }}
      - name: Apps and portable SDK crates hold no platform code
        run: python3 tools/policy/check_app_portability.py
      - name: Apps declare the capabilities their code uses
        run: python3 tools/policy/check_app_capabilities.py
      - name: Browser desktop registry matches app manifests
        run: python3 tools/web/generate_web_desktop.py --check
      - name: Web size budgets only decrease
        shell: bash
        run: |
          # A pull request's budgets compare with the main it was merged onto.
          base='${{ steps.merge.outputs.main }}'
          if [ -z "$base" ] || [ "$base" = null ]; then base='${{ github.event.before }}'; fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=HEAD~1; fi
          python3 tools/web/wasm_size_ratchet.py check-budget --base "$base"
      # Report only: main's workspace-hack lines, the vendored automerge patch
      # and some unversioned path dependencies block a real publish until the
      # SDK crate set is made publishable again.
      - name: What stands between the SDK crates and crates.io
        run: python3 tools/sdk/publish_check.py --report-only

  # Resolves the CI builder image and the main commit every job merges onto.
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      main: ${{ steps.merge.outputs.main }}
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      # Pull requests test the head merged onto main's current tip (a rerun
      # included), and every job merges this same main commit.
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main
      - name: Resolve the CI builder
        id: resolve
        run: python3 tools/ci/resolve_builder.py
      # The build lanes run only when the change reaches the SDK or an app
      # through the workspace's dependency graph (a manual run always does).
      - name: Does the change reach the SDK or an app?
        id: affected
        env:
          MAIN: ${{ steps.merge.outputs.main }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo affected=true >> "$GITHUB_OUTPUT"
          else
            # A pull request compares the merge with the main it merged; a push
            # compares with its parent.
            python3 tools/ci/app_sdk_affected.py ${MAIN:+--base "$MAIN"} --github-output "$GITHUB_OUTPUT"
          fi

  # Linux: the CLI's own tests, the Linux artifact and .tapp of a
  # representative app, and a generated app built outside the repository.
  linux:
    needs: [builder, policy]
    if: ${{ !cancelled() && needs.builder.result == 'success' && (github.event_name != 'pull_request' || needs.policy.result == 'success') && needs.builder.outputs.affected == 'true' }}
    # Several full debug graphs (tilo-app-cli's tests, Calculator, a generated
    # app for two targets) share one target directory: they outgrow the
    # quality lane's 20 GiB disk and reach its 5 GiB memory limit. Each step
    # reports its peak memory.
    # PRs can use either approved native pool without stranding idle ARM capacity.
    # Every main commit retains the native x86 SDK qualification; browser
    # lanes remain x86 because Chrome for Testing supplies an x86 Linux build.
    runs-on: ${{ github.event_name == 'push' && 'runner' || 'runner-native-portable' }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Merge onto main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.builder.outputs.main }}
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Verify native Linux SDK runner architecture
        env:
          EXPECTED_ARCH: ${{ github.event_name == 'push' && 'x86_64' || runner.arch }}
        run: bash tools/ci/assert-native-runner.sh "$EXPECTED_ARCH"
      - name: tilo-caps and the tilo-app target commands
        run: |
          bash tools/ci/measure.sh "tilo-caps tests" -- cargo test --locked -p tilo-caps
          bash tools/ci/measure.sh "tilo-app target tests" -- cargo test --locked -p tilo-app-cli --lib targets::
      - name: Build tilo-app and tilo-app-package
        # One `--bin` filter applies to every selected package, so each
        # binary is named.
        run: >-
          bash tools/ci/measure.sh "tilo-app build" --
          cargo build --locked -p tilo-app-cli -p tilo-app-package-cli --bin tilo-app --bin tilo-app-package
      - name: Calculator for Linux
        run: bash tools/ci/measure.sh "Calculator for Linux" -- target/debug/tilo-app build --target linux apps/calculator
      # The generated app compiles its whole graph into a temporary target
      # directory that the test removes. Run before the .tapp step, the two
      # builds never occupy the runner's disk at the same time.
      - name: A generated app builds outside the repository (native and wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          bash tools/ci/measure.sh "generated app outside the repository" -- \
            cargo test --locked -p tilo-app-cli --test it outside_repo -- --ignored --nocapture
      - name: Calculator .tapp
        # A Tilo OS .tapp links the toolkit from runtime-dylib, so this step
        # compiles the whole runtime: about 1,050 crates in a profile nothing
        # else here builds. At thin-app's opt-level 3 with one codegen unit
        # those compiles take far longer. This package is signed with an ephemeral
        # key and never shipped, so it is optimized lightly; release-apps.yml
        # builds the shipped runtime at the full profile.
        env:
          TILO_PKG: ${{ github.workspace }}/target/debug/tilo-app-package
          CARGO_PROFILE_THIN_APP_OPT_LEVEL: "1"
          CARGO_PROFILE_THIN_APP_CODEGEN_UNITS: "16"
          CARGO_PROFILE_THIN_APP_DEBUG: "0"
        run: |
          bash tools/ci/measure.sh "Calculator .tapp" -- \
            target/debug/tilo-app package --target linux apps/calculator \
            --output "$RUNNER_TEMP/calculator.tapp" --force
          test -s "$RUNNER_TEMP/calculator.tapp"
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true

  # macOS: the generated template outside the repository, Calculator and
  # Notes as ad-hoc-signed .app bundles rendered offscreen, and a packaged
  # .app zip (Developer ID signing and notarization need release secrets;
  # without them `package` signs ad hoc) that becomes a signed registry
  # entry for the macOS artifact format.
  macos:
    # Disabled: no runner serves the imager-macos-* labels yet.
    if: false
    runs-on: imager-macos-aarch64
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Build tilo-app and tilo-app-package
        run: cargo build --locked -p tilo-app-cli -p tilo-app-package-cli --bin tilo-app --bin tilo-app-package
      - name: Template outside the repository, as a git dependency
        env:
          TILO_SDK_SOURCE: git
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test --locked -p tilo-app-cli --test it outside_repo -- --ignored --nocapture
      - name: Calculator and Notes as .app bundles
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/macos-shots"
          mkdir -p "$shots"
          for app in calculator notes; do
            bundle="$(target/debug/tilo-app build --target macos "apps/$app" | tail -n 1)"
            plutil -lint "$bundle/Contents/Info.plist"
            codesign --verify --deep --strict "$bundle"
            "$bundle/Contents/MacOS/$app" --shots "$shots/$app.png"
            test -s "$shots/$app.png"
          done
      - name: Package Calculator for macOS
        run: |
          target/debug/tilo-app package --target macos apps/calculator \
            --output "$RUNNER_TEMP/Calculator-macos.zip" --force
          test -s "$RUNNER_TEMP/Calculator-macos.zip"
          test -s "$RUNNER_TEMP/Calculator-macos.zip.json"
      - name: The .app zip becomes a signed macOS registry entry
        run: |
          set -euo pipefail
          target/debug/tilo-app-package keygen --out "$RUNNER_TEMP/publisher.json"
          target/debug/tilo-app-package entry --platform macos \
            --url https://apps.tilo.so/artifacts/calculator/Calculator-macos.zip \
            --identity "$RUNNER_TEMP/publisher.json" "$RUNNER_TEMP/Calculator-macos.zip" \
            > "$RUNNER_TEMP/calculator-macos-entry.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["versions"][0]; assert v["target"]["platform"]=="macos" and v["artifact"]["format"]=="macos-app-zip", v' \
            "$RUNNER_TEMP/calculator-macos-entry.json"
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: app-sdk-macos-shots
          path: ${{ runner.temp }}/macos-shots
          if-no-files-found: ignore

  # Web: the desktop bundle built from the app manifests and every registered
  # app mounted in headless Chromium on WebGPU.
  web:
    # The dev mount does not consume release artifacts; build both lanes in parallel.
    needs: [builder, policy]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.lanes != 'linux') && !cancelled() && needs.builder.result == 'success' && (github.event_name != 'pull_request' || needs.policy.result == 'success') && needs.builder.outputs.affected == 'true' }}
    # wasm-bindgen over the whole desktop bundle exceeds the quality lane's
    # 5 GiB.
    runs-on: runner
    timeout-minutes: 150
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CDP_PORT: "9333"
      # Three isolated browsers fit the existing 6-CPU/22-GiB job budget.
      # Set this back to "2" to roll back without changing any probe.
      TILO_WEB_SMOKE_SHARDS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Merge onto main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.builder.outputs.main }}
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Web toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
          command -v node || dnf install -y nodejs
      - name: Platform crates' browser modules (node --test)
        run: node --test crates/platform/*/web/*.test.mjs
      - name: Build tilo-app
        run: bash tools/ci/measure.sh "SDK web tool build" -- cargo build --locked -p tilo-app-cli --bin tilo-app
      - name: Desktop bundle (dev profile)
        run: |
          bash tools/ci/measure.sh "SDK dev desktop bundle build" -- \
            target/debug/tilo-app build --target web --bundle desktop apps/calculator
      - name: Headless Chromium for Testing
        run: |
          # Chrome's shared-library dependencies; present on current builders.
          dnf install -y nss atk at-spi2-atk cups-libs libdrm libXcomposite libXdamage \
            libXrandr mesa-libgbm pango alsa-lib libxkbcommon || true
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Governed mounted resource journey
        run: |
          cargo run --locked -p tilo-agent-participant --example mounted-resource -- \
            target/tilo-app/web/calculator/bundle
      - name: Compiled Chat browser disconnect and retry
        run: |
          target/debug/tilo-app build apps/chat --platform web
          cargo run --locked -p tilo-agent-participant --example mounted-resource -- \
            target/tilo-app/web/chat/bundle --disconnect-retry
      - name: Compiled Chat browser call consent and lifecycle
        run: |
          install -d -m 700 -o nobody target/mounted-resource-voice
          python3 - <<'PY'
          import os, pathlib, shlex
          root = pathlib.Path.cwd()
          wrapper = root / "target/chat-fixture-chromium"
          wrapper.write_text("#!/bin/sh\nexec python3 " +
              shlex.quote(str(root / "tools/web/owned_browser.py")) + " " +
              shlex.quote(os.environ["CHROME"]) + ' "$@"\n')
          wrapper.chmod(0o755)
          PY
          CHROME="$PWD/target/chat-fixture-chromium" cargo run --locked \
            --config 'target.x86_64-unknown-linux-gnu.runner=["runuser","--preserve-environment","--user","nobody","--","env","TMPDIR=/tmp","bash","tools/with-test-environment.sh"]' \
            -p tilo-agent-participant --example mounted-resource -- \
            target/tilo-app/web/chat/bundle --voice
      - name: Compiled Chat encrypted resource after host restart
        run: |
          install -d -m 700 -o nobody target/mounted-resource-encrypted
          CHROME="$PWD/target/chat-fixture-chromium" cargo run --locked \
            --config 'target.x86_64-unknown-linux-gnu.runner=["runuser","--preserve-environment","--user","nobody","--","env","TMPDIR=/tmp","bash","tools/with-test-environment.sh"]' \
            -p tilo-agent-participant --example mounted-resource -- \
            target/tilo-app/web/chat/bundle --encrypted-restart
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: app-sdk-mounted-resource-${{ github.run_attempt }}
          path: |
            target/mounted-resource
            target/mounted-resource-recovery
            target/mounted-resource-voice
            target/mounted-resource-encrypted
          if-no-files-found: error
      - name: Mount every registered app
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/tilo-app/web/calculator/bundle
          (cd "$bundle" && python3 -m http.server 7878 --bind 127.0.0.1) &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          mapfile -t apps < <(python3 -c 'import json,sys; print("\n".join(a["id"] for a in json.load(open(sys.argv[1]))["applications"]))' "$bundle/apps.json")
          mkdir -p "$RUNNER_TEMP/web-shots"
          # Independent browsers keep each probe foregrounded while using
          # the existing job CPU/memory budget. Every app and timing stays.
          SHOTS_DIR="$RUNNER_TEMP/web-shots" bash tools/ci/measure.sh "SDK app mount tests" -- \
            node crates/browser/tilo-web-desktop/scripts/smoke.mjs \
            http://127.0.0.1:7878 "${apps[@]}" desktop
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: app-sdk-web-shots
          path: ${{ runner.temp }}/web-shots
          if-no-files-found: ignore
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true

  # The release desktop bundle held to its size budget, beside the mount test.
  web-size:
    needs: [builder, policy]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.lanes != 'linux') && !cancelled() && needs.builder.result == 'success' && (github.event_name != 'pull_request' || needs.policy.result == 'success') && needs.builder.outputs.affected == 'true' }}
    # wasm-bindgen over the whole desktop bundle exceeds the quality lane's
    # 5 GiB.
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Merge onto main
        uses: ./.forgejo/actions/merge-main
        with:
          main: ${{ needs.builder.outputs.main }}
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Web toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
      - name: Build tilo-app
        run: bash tools/ci/measure.sh "SDK release web tool build" -- cargo build --locked -p tilo-app-cli --bin tilo-app
      - name: Release desktop bundle within its size budget
        run: |
          bash tools/ci/measure.sh "SDK release desktop bundle build" -- \
            target/debug/tilo-app build --target web --bundle desktop --release apps/calculator
          python3 tools/web/wasm_size_ratchet.py measure desktop target/tilo-app/web/calculator/bundle
      - name: Stage exact release private image worker
        run: |
          python3 - "$RUNNER_TEMP/release-compute" <<'PY'
          import hashlib, json, pathlib, sys
          product = pathlib.Path('target/tilo-app/web/calculator/bundle')
          output = pathlib.Path(sys.argv[1])
          output.mkdir()
          hashes = {}
          for name in ('compute-worker.mjs', 'compute-domains.mjs', 'compute-protocol.mjs',
                       'pkg/compute/tilo_browser_compute.js', 'pkg/compute/tilo_browser_compute_bg.wasm'):
              data = (product / name).read_bytes()
              destination = output / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              hashes[name] = hashlib.sha256(data).hexdigest()
              assert hashlib.sha256(destination.read_bytes()).hexdigest() == hashes[name], name
          (output / 'sha256.json').write_text(json.dumps(hashes, sort_keys=True) + '\n')
          PY
      - name: Upload exact release private image worker
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: app-sdk-release-compute
          path: ${{ runner.temp }}/release-compute
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true
      - name: Headless Chromium for Testing
        run: |
          command -v node || dnf install -y nodejs
          # Chrome's shared-library dependencies; present on current builders.
          dnf install -y nss atk at-spi2-atk cups-libs libdrm libXcomposite libXdamage \
            libXrandr mesa-libgbm pango alsa-lib libxkbcommon || true
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Download exact release private image worker
        uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: app-sdk-release-compute
          path: ${{ runner.temp }}/release-compute-downloaded
      - name: Qualify exact release private image worker
        run: |
          python3 - "$RUNNER_TEMP/release-compute-downloaded" <<'PY'
          import hashlib, json, pathlib, sys
          product = pathlib.Path(sys.argv[1])
          names = {'compute-worker.mjs', 'compute-domains.mjs', 'compute-protocol.mjs',
                   'pkg/compute/tilo_browser_compute.js', 'pkg/compute/tilo_browser_compute_bg.wasm'}
          hashes = json.loads((product / 'sha256.json').read_text())
          assert set(hashes) == names, 'incomplete release worker manifest'
          for name in names:
              assert hashlib.sha256((product / name).read_bytes()).hexdigest() == hashes[name], name
          PY
          node crates/browser/tilo-browser-compute/scripts/qualify-packaged.mjs \
            "$RUNNER_TEMP/release-compute-downloaded" "$RUNNER_TEMP/compute-qualification" --no-sandbox
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: app-sdk-compute-qualification
          path: ${{ runner.temp }}/compute-qualification/qualification.json
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true
