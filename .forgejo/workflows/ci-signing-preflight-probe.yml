name: Qualify signing preflight quality lane
on:
  push:
    branches: [codex/ci-signing-preflight-lane]
jobs:
  signing-preflight:
    runs-on: runner-quality
    timeout-minutes: 5
    enable-openid-connect: true
    container:
      image: code.podesta.ai/qos/ci-fast@sha256:fd2d462eaa130052fded4fbb05c2e9c7e44b6d6fa70b3bc6eae484447920551a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore checksum-pinned Cosign
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ runner.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: cosign-v2.5.2-${{ runner.arch }}-
      - name: Install checksum-pinned Cosign
        env:
          TILO_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Require non-exportable builder signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          resolved="$RUNNER_TEMP/builder-signing-authority.pub"
          cosign public-key --key "$COSIGN_KEY_REF" > "$resolved"
          cmp --silent keys/cosign.pub "$resolved" || {
            echo '::error::builder KMS/HSM authority does not match keys/cosign.pub'
            exit 1
          }
