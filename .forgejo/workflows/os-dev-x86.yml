name: Build / OS dev (x86_64)

# Explicit main dev-image request. Keep one build per architecture and skip
# requests for a superseded main commit unless source_revision pins a reviewed
# main ancestor for a delivery request. Use os-dev.yml to target another ref
# or select multiple architectures.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Optional full main-ancestor commit to build exactly, including after queue admission.'
        required: false
        default: ''

concurrency:
  group: os-dev-x86-native
  cancel-in-progress: false

jobs:
  newest:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    outputs:
      build: ${{ steps.newest.outputs.build }}
      source_revision: ${{ steps.newest.outputs.source_revision }}
    steps:
      - id: newest
        env:
          TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event.inputs.source_revision || '' }}
        run: |
          set -euo pipefail
          if [[ -n $SOURCE_REVISION ]]; then
            [[ $GITHUB_REF == refs/heads/main && $SOURCE_REVISION =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::source_revision requires a full commit on a main dispatch"
              exit 1
            }
            echo "::notice::requesting exact main source $SOURCE_REVISION; the image plan verifies ancestry"
            echo "source_revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(curl -fsS -H "Authorization: token $TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/branches/main" | jq -er .commit.id)"
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; this latest-only request is superseded"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: newest
    if: needs.newest.outputs.build == 'true'
    uses: ./.forgejo/workflows/build-image.yml
    with:
      arches: '["x86_64"]'
      source_revision: ${{ needs.newest.outputs.source_revision }}
    secrets: inherit
