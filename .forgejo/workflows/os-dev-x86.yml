name: Build / OS dev (x86_64)

# Main's x86_64 dev image: Build / OS dev's build (build-image.yml) for main
# pushes. Main merges faster than an x86 build finishes, so main builds one
# commit at a time, newest first, like Build / OS dev (aarch64)
# (os-dev-arm.yml): a run that waited behind the one before skips its build
# when main has moved past its commit, and the newer commit's run builds
# instead. tilo-ci:main-<sha7>-x86_64 exists for the commits that built; the
# moving tags follow the newest (os/dev/move-tag-forward.sh). Pull requests
# stay in os-dev.yml, one run per pull request.
on:
  push:
    branches: [main]

concurrency:
  group: os-dev-x86_64-main
  cancel-in-progress: false

jobs:
  newest:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:281af08d34010af96f97630aa5fde224b6ca02b130aff553ceb3d297d44fca7d
    outputs:
      build: ${{ steps.newest.outputs.build }}
    steps:
      - id: newest
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(curl -fsS -H "Authorization: token $TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/branches/main" | jq -er .commit.id)"
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head; its run builds x86_64"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: newest
    if: needs.newest.outputs.build == 'true'
    uses: ./.forgejo/workflows/build-image.yml
    with:
      arches: '["x86_64"]'
    secrets: inherit
