name: Release / Dev VM disk

# Builds the dev VM image (os/Containerfile.dev) FROM an existing same-commit
# signed production OS image or unsigned tilo-ci integration image, installs it
# to a bootable disk, boots that disk once, and publishes each architecture on
# its own (os/dev/publish-dev-disk.sh):
#
#   registry.tilo.so/tilo/tilo-vm:<tag>-<arch>       the dev image child
#   registry.tilo.so/tilo/tilo-vm:<tag>              OCI index of the children so far
#   <generic packages>/tilo-vm-disk/<tag>/<disk>   qcow2 (and optional VHDX) disks
#   <generic packages>/tilo-vm-disk/<tag>/tilo-vm-disk-<arch>.json
#   <generic packages>/tilo-vm-disk/<tag>/*direct* ARM64 direct-boot companion
#
# Main integration builds do not come here: their OS lanes build, boot and
# publish the dev disk from the image they just built (build-image.yml). This
# workflow serves images that already exist: a signed release lane requests
# its own architecture once its child is signed, and anyone can dispatch it
# by hand for a published image. Both paths use the same scripts.
#
# Disks are cross-workflow outputs that outlive this run, so they go to the
# generic package registry (docs/release-pipeline.md).
#
# This is full-OS-class work (a disk install on a 100 GiB runner), so it never
# runs on pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Full commit SHA to build; empty uses the dispatched commit. Its production image must be published."
        required: false
        default: ""
      base_image:
        description: "Signed production image (registry.tilo.so/tilo/tilo:<tag> or @sha256:...), or a dev-trust integration image (registry.tilo.so/tilo/tilo-ci:main-<sha7>-<arch> or @sha256:...); empty uses tilo:main-<sha7>."
        required: false
        default: ""
      dev_image:
        description: "Optional immutable preinstall tilo-vm child digest from an earlier disk run, to resume installation without rebuilding the dev image."
        required: false
        default: ""
      tag:
        description: "tilo-vm tag and disk package version; empty derives main-<sha7>, the release version, or <branch>-<sha7>."
        required: false
        default: ""
      architectures:
        description: "Space-separated native architectures: x86_64, aarch64."
        required: false
        default: "x86_64"
      formats:
        description: "Space-separated disk formats: qcow2 (UTM, libvirt), vhdx (Hyper-V)."
        required: false
        default: "qcow2"
      rootfs:
        description: "Filesystem for this development VM disk: btrfs (default) or ext4. Does not rebuild or change the source OS image."
        required: false
        default: "btrfs"
      validate_boot:
        description: "auto: native boot proof for signed bases, candidate only for tilo-ci; true requires usable KVM; false publishes only an unvalidated candidate."
        required: false
        default: "auto"
      validate_greeter:
        description: "Diagnostic only: require a stable graphical greeter and report guest DRM state; skip disk publication."
        required: false
        default: "false"

concurrency:
  # One request per tag, source and architecture set at a time; different
  # requests run side by side, since each lane converges the shared index and
  # `latest` on its own (os/dev/publish-dev-disk.sh).
  group: tilo-vm-disk-${{ github.event.inputs.tag }}-${{ github.event.inputs.source_revision }}-${{ github.event.inputs.architectures }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: runner
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      formats: ${{ steps.plan.outputs.formats }}
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      checkpoint: ${{ steps.plan.outputs.checkpoint }}
      trust: ${{ steps.plan.outputs.trust }}
      channel: ${{ steps.plan.outputs.channel }}
      validate_boot: ${{ steps.plan.outputs.validate_boot }}
    steps:
      - name: Resolve source, base image, tag and native lanes
        id: plan
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source_revision }}
          INPUT_BASE: ${{ github.event.inputs.base_image }}
          INPUT_CHECKPOINT: ${{ github.event.inputs.dev_image }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          INPUT_FORMATS: ${{ github.event.inputs.formats }}
          INPUT_VALIDATE_BOOT: ${{ github.event.inputs.validate_boot }}
        run: |
          set -euo pipefail
          source=${INPUT_SOURCE:-$GITHUB_SHA}
          [[ $source =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::source_revision must be a full lowercase commit SHA'
            exit 1
          }
          short=${source:0:7}

          base=${INPUT_BASE:-registry.tilo.so/tilo/tilo:main-$short}
          # The repository is the trust boundary. tilo is signed and carries
          # provenance; tilo-ci holds unsigned main integration builds that
          # production policy rejects, and its disks carry a -ci tag suffix.
          if [[ $base =~ ^registry\.tilo\.so/tilo/tilo(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
            trust=release
            suffix=""
          elif [[ $base =~ ^registry\.tilo\.so/tilo/tilo-ci(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
            trust=integration
            suffix=-ci
          else
            echo "::error::base_image must name registry.tilo.so/tilo/tilo or registry.tilo.so/tilo/tilo-ci by tag or digest: $base"
            exit 1
          fi

          checkpoint=${INPUT_CHECKPOINT:-}
          [[ -z $checkpoint || $checkpoint =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::dev_image must be an immutable registry.tilo.so/tilo/tilo-vm child digest'
            exit 1
          }

          channel=false
          if [[ -n ${INPUT_TAG:-} ]]; then
            tag=$INPUT_TAG
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}$suffix
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            tag=main-$short$suffix
          else
            branch=${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}
            tag=${branch:0:100}-$short$suffix
          fi
          [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ && $tag != latest && $tag != *-candidate-* ]] || {
            echo "::error::invalid tilo-vm tag: $tag"
            exit 1
          }
          # An unsigned base must never take a name a signed release would use.
          [[ $trust == release || $tag == *-ci ]] || {
            echo "::error::a tilo-ci base publishes only -ci tags, not $tag"
            exit 1
          }
          case ${INPUT_VALIDATE_BOOT:-auto} in
            auto) [[ $trust == release ]] && validate_boot=true || validate_boot=false ;;
            true|false) validate_boot=$INPUT_VALIDATE_BOOT ;;
            *) echo '::error::validate_boot must be auto, true or false'; exit 1 ;;
          esac
          # Only main and release tags advance `latest`; other refs publish
          # addressable tags without moving the channel.
          if [[ $GITHUB_REF == refs/heads/main || $GITHUB_REF == refs/tags/v* ]]; then
            channel=true
          fi

          # One lane per native architecture. Adding a lane is a matter of
          # listing it here; both use the 100 GiB disk runners the OS build uses.
          declare -A runners=([x86_64]=runner-disk-100g [aarch64]=runner-disk-100g-arm64)
          read -r -a requested <<< "${INPUT_ARCHITECTURES:-x86_64}"
          (( ${#requested[@]} > 0 )) || { echo '::error::no architecture requested'; exit 1; }
          include='[]'
          architectures=()
          for arch in "${requested[@]}"; do
            [[ -n ${runners[$arch]:-} ]] || { echo "::error::unsupported architecture: $arch"; exit 1; }
            [[ " ${architectures[*]} " != *" $arch "* ]] || continue
            architectures+=("$arch")
            include=$(jq -c --arg arch "$arch" --arg runner "${runners[$arch]}" \
              '. + [{arch:$arch,runner:$runner}]' <<< "$include")
          done
          if [[ -n $checkpoint && ${#architectures[@]} -ne 1 ]]; then
            echo '::error::dev_image is one native child digest; resume one architecture at a time'
            exit 1
          fi

          read -r -a requested_formats <<< "${INPUT_FORMATS:-qcow2}"
          formats=()
          for format in "${requested_formats[@]}"; do
            case "$format" in
              qcow2|vhdx) ;;
              *) echo "::error::unsupported disk format: $format"; exit 1 ;;
            esac
            [[ " ${formats[*]} " != *" $format "* ]] || continue
            formats+=("$format")
          done
          (( ${#formats[@]} > 0 )) || { echo '::error::no disk format requested'; exit 1; }

          {
            echo "source=$source"
            echo "tag=$tag"
            echo "base=$base"
            echo "checkpoint=$checkpoint"
            echo "trust=$trust"
            echo "channel=$channel"
            echo "validate_boot=$validate_boot"
            echo "architectures=${architectures[*]}"
            echo "formats=${formats[*]}"
            echo "matrix=$(jq -c '{include:.}' <<< "$include")"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::tilo-vm:$tag from $base ($trust trust) at $source (${architectures[*]}; ${formats[*]}; channel=$channel; validate_boot=$validate_boot)"

  build:
    needs: plan
    strategy:
      # Every architecture publishes on its own; one failing must not cancel
      # or hold back another.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SOURCE_REVISION: ${{ needs.plan.outputs.source }}
      DISK_TOOLING_REVISION: ${{ github.sha }}
      DEV_TAG: ${{ needs.plan.outputs.tag }}
      BASE_REF_INPUT: ${{ needs.plan.outputs.base }}
      DEV_CHECKPOINT_REF: ${{ needs.plan.outputs.checkpoint }}
      BASE_TRUST: ${{ needs.plan.outputs.trust }}
      DISK_FORMATS: ${{ needs.plan.outputs.formats }}
      ARCH: ${{ matrix.arch }}
      DEV_IMAGE: localhost/tilo-vm:ci
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          # tilo-vm:latest only moves forward; the ancestry check needs history.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the selected native architecture
        run: ./os/dev/assert-native-arch.sh "$ARCH"

      - name: Require the dev image recipe at this revision
        run: |
          test -f os/Containerfile.dev || {
            echo "::error::os/Containerfile.dev does not exist at $SOURCE_REVISION"
            exit 1
          }

      - name: Install image and disk tooling
        run: |
          set -euo pipefail
          sudo -n true || {
            echo "::error::disk installation requires the runner's passwordless, Kata-confined sudo"
            exit 1
          }
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get update
            if [[ $ARCH == x86_64 ]]; then
              qemu_packages=(ovmf qemu-system-x86)
            else
              qemu_packages=(qemu-efi-aarch64 qemu-system-arm)
            fi
            sudo -n apt-get install -y --no-install-recommends \
              binutils btrfs-progs dosfstools e2fsprogs fuse-overlayfs ipxe-qemu openssh-client podman \
              jq qemu-utils skopeo slirp4netns socat sshpass sudo systemd \
              uidmap util-linux "${qemu_packages[@]}"
            test -r /usr/lib/ipxe/qemu/efi-virtio.rom || {
              echo '::error::ipxe-qemu did not provide efi-virtio.rom for QEMU disk boot'
              exit 1
            }
          elif command -v dnf >/dev/null; then
            if [[ $ARCH == x86_64 ]]; then
              qemu_packages=(edk2-ovmf qemu-system-x86-core)
            else
              qemu_packages=(edk2-aarch64 qemu-system-aarch64-core)
            fi
            # Fedora keeps QEMU's efi-virtio.rom in ipxe-roms-qemu, separate
            # from the architecture-specific QEMU system/device packages.
            sudo -n dnf install -y binutils btrfs-progs dosfstools e2fsprogs fuse-overlayfs ipxe-roms-qemu \
              jq openssh-clients podman qemu-img skopeo slirp4netns socat sshpass \
              sudo systemd util-linux "${qemu_packages[@]}"
          else
            echo '::error::native disk runner must provide apt-get or dnf'
            exit 1
          fi
          command -v jq objcopy podman qemu-img "qemu-system-$ARCH" skopeo sshpass socat systemd-repart >/dev/null

      # Kata's job container has a static /dev. Its disposable guest kernel
      # provides FUSE for Podman's overlay store and loop nodes for the disk
      # installer, but those nodes are not visible until devtmpfs is mounted.
      - name: Expose guest FUSE and loop devices
        run: |
          set -euo pipefail
          sudo -n modprobe fuse 2>/dev/null || true
          sudo -n modprobe loop 2>/dev/null || true
          if [[ ! -c /dev/fuse || ! -c /dev/loop-control ]]; then
            sudo -n mount -t devtmpfs devtmpfs /dev
            sudo -n mkdir -p /dev/pts /dev/shm
            [ "$(stat -f -c %T /dev/pts)" = devpts ] || sudo -n mount -t devpts -o gid=5,mode=620,ptmxmode=666 devpts /dev/pts
            mountpoint -q /dev/shm || sudo -n mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          fi
          test -c /dev/fuse && test -c /dev/loop-control || {
            echo '::error::Kata guest did not expose FUSE and loop devices'
            exit 1
          }
          sudo -n chmod 0666 /dev/fuse
          python3 -c 'open("/dev/fuse", "rb").close()'
          sudo -n losetup --find >/dev/null

      # The nested default store would commit every layer through
      # fuse-overlayfs; os/dev/ci-native-podman-store.sh has the measurements.
      - name: Use native Podman overlay for the dev disk
        run: ./os/dev/ci-native-podman-store.sh

      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}


      # "Same commit" is checked, not assumed. A release base must carry the
      # release signature, and its native child's signed provenance must name
      # exactly the revision whose Containerfile.dev is built on top of it. A
      # dev-trust integration base is unsigned by design: it must come from
      # tilo-ci and its revision label must name that same revision.
      - name: Resolve and verify the same-commit base
        id: base
        run: |
          set -euo pipefail
          case "$ARCH" in x86_64) platform=amd64 ;; aarch64) platform=arm64 ;; esac
          case "$BASE_TRUST" in
            release) repository=registry.tilo.so/tilo/tilo ;;
            integration) repository=registry.tilo.so/tilo/tilo-ci ;;
            *) echo "::error::unknown base trust: $BASE_TRUST"; exit 1 ;;
          esac
          raw=$(skopeo inspect --raw "docker://$BASE_REF_INPUT")
          top_digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
          top="$repository@$top_digest"
          if [[ $BASE_TRUST == release ]]; then
            cosign verify --key keys/cosign.pub "$top" >/dev/null
          fi
          if jq -e '.manifests? | type == "array"' <<< "$raw" >/dev/null; then
            child_digest=$(jq -er --arg platform "$platform" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $platform)]
              | if length == 1 then .[0].digest else error("expected exactly one \($platform) child") end
            ' <<< "$raw")
          else
            child_digest=$top_digest
          fi
          [[ $child_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          child="$repository@$child_digest"
          config=$(skopeo inspect "docker://$child")
          [[ "$(jq -er .Architecture <<< "$config")" == "$platform" ]] || {
            echo "::error::$child is not a linux/$platform image"
            exit 1
          }
          if [[ $BASE_TRUST == release ]]; then
            cosign verify --key keys/cosign.pub "$child" >/dev/null
            cosign verify-attestation --key keys/cosign.pub --type slsaprovenance1 "$child" \
              | jq -se --arg source "$SOURCE_REVISION" '
                  [.[] | (if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
                  | any(any(.buildDefinition.resolvedDependencies[]?;
                            .uri == ("git+ssh://code.tilo.so/tilo/tilo@" + $source)))
                ' >/dev/null || {
                  echo "::error::$child provenance does not bind source revision $SOURCE_REVISION"
                  exit 1
                }
          else
            [[ "$(jq -r '.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")" == "$SOURCE_REVISION" ]] || {
              echo "::error::$child is not the integration image of $SOURCE_REVISION"
              exit 1
            }
          fi
          {
            echo "repository=$repository"
            echo "index-digest=$top_digest"
            echo "child-digest=$child_digest"
            echo "child=$child"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::verified $BASE_TRUST-trust base $child for $SOURCE_REVISION"

      # The same recipe as every other dev image: os/dev/build-dev-image.sh
      # builds os/Containerfile.dev FROM a base already in local storage and
      # records its digest and creation time in the image.
      - name: Build the dev image FROM the verified base
        if: needs.plan.outputs.checkpoint == ''
        env:
          BASE_CHILD: ${{ steps.base.outputs.child }}
          BASE_CHILD_DIGEST: ${{ steps.base.outputs.child-digest }}
          BASE_INDEX_DIGEST: ${{ steps.base.outputs.index-digest }}
          BASE_REPOSITORY: ${{ steps.base.outputs.repository }}
        run: |
          set -euo pipefail
          podman pull "$BASE_CHILD"
          TILO_DEV_BASE="$BASE_CHILD" TILO_DEV_IMAGE="$DEV_IMAGE" TILO_DEV_DISK=0 \
            TILO_CARGO_FRESHNESS=clean TILO_DISTROBOX="" \
            TILO_OUTPUT="/var/tmp/tilo-vm-disk-$ARCH" \
            TILO_BUILD_ARGS="--label org.opencontainers.image.version=$DEV_TAG --label org.opencontainers.image.revision=$SOURCE_REVISION --label org.opencontainers.image.base.name=$BASE_REPOSITORY@$BASE_INDEX_DIGEST --label org.opencontainers.image.base.digest=$BASE_INDEX_DIGEST --label org.opencontainers.image.base.child.digest=$BASE_CHILD_DIGEST --label sh.tilo.dev.base-trust=$BASE_TRUST" \
            ./os/dev/build-dev-image.sh

      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the expensive verified build if disk installation or boot fails.
      # A resumed request accepts only the immutable digest of this native
      # preinstall image, with the same source, base, trust and architecture.
      - name: Push preinstall dev-image checkpoint
        if: needs.plan.outputs.checkpoint == ''
        run: |
          set -euo pipefail
          candidate="registry.tilo.so/tilo/tilo-vm:build-candidate-${SOURCE_REVISION:0:12}-$BASE_TRUST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          digest_file=$(mktemp /var/tmp/tilo-vm-build-digest.XXXXXX)
          podman push --digestfile "$digest_file" "$DEV_IMAGE" "docker://$candidate"
          digest=$(tr -d '[:space:]' < "$digest_file")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "DEV_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "::notice::preinstall dev image $candidate ($digest); resume with dev_image=registry.tilo.so/tilo/tilo-vm@$digest"

      - name: Load and verify preinstall dev-image checkpoint
        if: needs.plan.outputs.checkpoint != ''
        env:
          BASE_INDEX_DIGEST: ${{ steps.base.outputs.index-digest }}
          BASE_CHILD_DIGEST: ${{ steps.base.outputs.child-digest }}
          BASE_REPOSITORY: ${{ steps.base.outputs.repository }}
        run: |
          set -euo pipefail
          raw=$(skopeo inspect --raw "docker://$DEV_CHECKPOINT_REF")
          actual="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
          [[ $DEV_CHECKPOINT_REF == "registry.tilo.so/tilo/tilo-vm@$actual" ]] || {
            echo '::error::dev-image checkpoint manifest does not match its requested digest'
            exit 1
          }
          jq -e '.manifests? == null and .config.digest? != null' <<< "$raw" >/dev/null || {
            echo '::error::dev-image checkpoint must be one native child manifest'
            exit 1
          }
          config=$(skopeo inspect "docker://$DEV_CHECKPOINT_REF")
          case "$ARCH" in x86_64) platform=amd64 ;; aarch64) platform=arm64 ;; esac
          # The standalone disk builder labels the dev image with the index,
          # while the OS integration lane labels it with its exact native child.
          # Both identify the verified source above; require the name and digest
          # to use the same form, and always bind the native child separately.
          jq -e --arg arch "$platform" --arg source "$SOURCE_REVISION" \
            --arg base_index "$BASE_REPOSITORY@$BASE_INDEX_DIGEST" \
            --arg base_child "$BASE_REPOSITORY@$BASE_CHILD_DIGEST" \
            --arg index "$BASE_INDEX_DIGEST" --arg child "$BASE_CHILD_DIGEST" \
            --arg trust "$BASE_TRUST" '
            .Architecture == $arch
            and .Labels["sh.tilo.image.flavour"] == "dev"
            and .Labels["org.opencontainers.image.revision"] == $source
            and ((.Labels["org.opencontainers.image.base.name"] == $base_index
                  and .Labels["org.opencontainers.image.base.digest"] == $index)
                 or (.Labels["org.opencontainers.image.base.name"] == $base_child
                     and .Labels["org.opencontainers.image.base.digest"] == $child))
            and .Labels["org.opencontainers.image.base.child.digest"] == $child
            and .Labels["sh.tilo.dev.base-trust"] == $trust
          ' <<< "$config" >/dev/null || {
            echo '::error::dev-image checkpoint is not the exact verified source/base/trust/architecture'
            exit 1
          }
          podman pull "$DEV_CHECKPOINT_REF"
          podman tag "$DEV_CHECKPOINT_REF" "$DEV_IMAGE"
          echo "DEV_IMAGE_DIGEST=$actual" >> "$GITHUB_ENV"
          echo "::notice::resumed verified dev image $DEV_CHECKPOINT_REF"

      # Keep the OS and dev-image recipe at SOURCE_REVISION. After the image is
      # loaded, a separately reviewed workflow commit supplies the disk-only
      # entry point, installation, VM verification, and publication scripts.
      # The package records both revisions.
      - name: Checkout exact disk tooling revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .ci-disk-tooling
          persist-credentials: false
          sparse-checkout: |
            os/dev/build-image.sh
            os/dev/disk-image.sh
            os/dev/check-composefs-verity.py
            os/dev/export-direct-boot-bundle.sh
            os/dev/hold-loop-partition-nodes.py
            os/dev/private_disk_image.py
            os/dev/check-dev-vm.sh
            os/dev/diagnose-boot-failure.sh
            os/dev/publish-dev-disk-candidate.sh
            os/dev/publish-dev-disk.sh
            os/dev/_common.sh
            os/dev/probe-kvm.py
          sparse-checkout-cone-mode: false

      - name: Apply reviewed disk tooling only
        run: |
          set -euo pipefail
          [[ $DISK_TOOLING_REVISION =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C .ci-disk-tooling rev-parse HEAD) == "$DISK_TOOLING_REVISION" ]] || {
            echo '::error::disk tooling checkout differs from workflow revision'
            exit 1
          }
          # The dev image is already built from SOURCE_REVISION. Install the
          # reviewed disk-only entry point with its disk helpers, so checkpoint
          # runs do not download external build assets again.
          for file in build-image.sh disk-image.sh check-composefs-verity.py export-direct-boot-bundle.sh hold-loop-partition-nodes.py private_disk_image.py \
                       check-dev-vm.sh diagnose-boot-failure.sh publish-dev-disk-candidate.sh \
                       publish-dev-disk.sh _common.sh probe-kvm.py; do
            test -s ".ci-disk-tooling/os/dev/$file"
            install -m 0755 ".ci-disk-tooling/os/dev/$file" "os/dev/$file"
          done
          echo "::notice::dev image source $SOURCE_REVISION; disk tooling $DISK_TOOLING_REVISION"

      # build-image.sh with TILO_SKIP_BUILD=1 installs the unsealed dev image
      # in one pass, exactly as build-dev-image.sh's disk step does.
      - name: Install the dev image to a bootable disk
        timeout-minutes: 60
        env:
          TILO_IMAGE: localhost/tilo-vm:ci
          TILO_SKIP_BUILD: "1"
          TILO_DISTROBOX: ""
          TILO_OUTPUT: /var/tmp/tilo-vm-disk-${{ matrix.arch }}
          TILO_RUN: /var/tmp/tilo-vm-vm-${{ matrix.arch }}
          TILO_TARGET_IMGREF: registry.tilo.so/tilo/tilo-vm:${{ needs.plan.outputs.tag }}
          TILO_DISK_SIZE: 64G
          TILO_DISK_ROOTFS: ${{ github.event.inputs.rootfs }}
          TILO_QCOW2_COMPRESS: "1"
        run: |
          set -euo pipefail
          mkdir -p "$TILO_OUTPUT" "$TILO_RUN"
          df -h "$TILO_OUTPUT" "${RUNNER_TEMP:-/var/tmp}"
          if [[ $ARCH == aarch64 ]]; then
            rm -rf -- "$TILO_OUTPUT/direct-boot"
            export TILO_DEV_DIRECT_BUNDLE_DIR="$TILO_OUTPUT/direct-boot"
          fi
          ./os/dev/build-image.sh
          test -s "$TILO_OUTPUT/qcow2/disk.qcow2"
          if [[ $ARCH == aarch64 ]]; then
            test -s "$TILO_OUTPUT/direct-boot/boot.json"
          fi

      # An immutable, explicitly unvalidated checkpoint lets a WHPX host
      # inspect the installed disk even if slow CI TCG cannot reach greetd.
      # The normal dev-disk manifest is still published only after boot proof.
      - name: Publish unvalidated installed disk candidate
        if: github.event.inputs.validate_greeter != 'true'
        env:
          SOURCE_DISK: /var/tmp/tilo-vm-disk-${{ matrix.arch }}/qcow2/disk.qcow2
          SOURCE_BOOT: /var/tmp/tilo-vm-disk-${{ matrix.arch }}/direct-boot
          BASE_CHILD_DIGEST: ${{ steps.base.outputs.child-digest }}
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TILO_PACKAGE_PUBLIC_BASE_URL: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
        run: ./os/dev/publish-dev-disk-candidate.sh

      - name: Boot the disk and reach tilo-vmd over SSH
        if: needs.plan.outputs.validate_boot == 'true'
        timeout-minutes: 45
        env:
          TILO_DISTROBOX: ""
          TILO_OUTPUT: /var/tmp/tilo-vm-disk-${{ matrix.arch }}
          TILO_RUN: /var/tmp/tilo-vm-vm-${{ matrix.arch }}
          TILO_DISK: /var/tmp/tilo-vm-disk-${{ matrix.arch }}/qcow2/disk.qcow2
          TILO_VM_ARCH: ${{ matrix.arch }}
          BASE_CHILD_DIGEST: ${{ steps.base.outputs.child-digest }}
          # TCG is much slower than KVM; runners without /dev/kvm need the margin.
          TILO_BOOT_WAIT_ATTEMPTS: "600"
        run: |
          set -euo pipefail
          # A validation request must use native acceleration. TCG on Kata
          # spent 20 minutes in UEFI without entering Linux; the candidate is
          # already published for a WHPX or native-KVM proof instead.
          python3 os/dev/probe-kvm.py "$ARCH" || {
            echo '::error::boot validation requires usable native KVM; dispatch validate_boot=false for an unvalidated disk candidate'
            exit 1
          }
          # Diagnostic runs need failure evidence quickly, not the 20-minute
          # fallback intended for unusually slow ordinary disk validations.
          if [[ '${{ github.event.inputs.validate_greeter }}' == true ]]; then
            export TILO_BOOT_WAIT_ATTEMPTS=120
          fi
          # Boot a throwaway overlay so the published disk is never first-booted.
          overlay="$TILO_RUN/smoke.qcow2"
          qemu-img create -f qcow2 -F qcow2 -b "$TILO_DISK" "$overlay" >/dev/null
          finish_boot() {
            status=$?
            if (( status != 0 )); then ./os/dev/diagnose-boot-failure.sh || true; fi
            ./os/dev/vm.sh stop || true
            rm -f "$overlay"
            return "$status"
          }
          trap finish_boot EXIT
          ./os/dev/vm.sh boot --disk "$overlay"
          ./os/dev/vm.sh wait
          ./os/dev/check-dev-vm.sh --arch "$ARCH" --base-digest "$BASE_CHILD_DIGEST"
          if [[ '${{ github.event.inputs.validate_greeter }}' == true ]]; then
            # `vm.sh wait` observes greetd starting, which can precede a
            # compositor crash. The dev disk is already accessible over SSH;
            # require the actual greeter to survive and report guest DRM state.
            sleep 10
            if ! ./os/dev/vm.sh ssh 'test -c /dev/dri/card0 && systemctl is-active --quiet greetd && pgrep -x cage && pgrep -x tilo-greeter'; then
              ./os/dev/vm.sh ssh 'ls -l /dev/dri 2>&1; systemctl status greetd --no-pager -l; journalctl -b -u greetd --no-pager -n 40; journalctl -b -k --no-pager -n 80' || true
              echo '::error::native KVM guest did not keep a graphical greeter'
              exit 1
            fi
          fi

      - name: Upload failed boot framebuffer
        if: failure() && needs.plan.outputs.validate_boot == 'true'
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: dev-disk-boot-failure-${{ matrix.arch }}
          path: /var/tmp/tilo-vm-vm-${{ matrix.arch }}/boot-timeout.ppm
          if-no-files-found: ignore

      # This architecture publishes on its own; another lane of the same tag
      # adds its child to the index and its own manifest whenever it lands.
      - name: Publish this architecture's dev image and disk
        if: needs.plan.outputs.validate_boot == 'true' && github.event.inputs.validate_greeter != 'true'
        env:
          SOURCE_DISK: /var/tmp/tilo-vm-disk-${{ matrix.arch }}/qcow2/disk.qcow2
          SOURCE_BOOT: /var/tmp/tilo-vm-disk-${{ matrix.arch }}/direct-boot
          BASE_REPOSITORY: ${{ steps.base.outputs.repository }}
          BASE_INDEX_DIGEST: ${{ steps.base.outputs.index-digest }}
          BASE_CHILD_DIGEST: ${{ steps.base.outputs.child-digest }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          # Dev disks are development artifacts, never release-signed; the CI
          # account's package token (as build-kernel.yml uses) writes them.
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TILO_PACKAGE_PUBLIC_BASE_URL: ${{ vars.TILO_PACKAGE_PUBLIC_BASE_URL }}
        run: ./os/dev/publish-dev-disk.sh
