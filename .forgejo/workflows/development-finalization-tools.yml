name: Development / publish finalization crypto tools

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: runner-disk-100g-arm64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and test the native crypto helper
        shell: bash
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh aarch64
          RUSTC_WRAPPER= cargo test --locked --release -p tilo-crypto
          RUSTC_WRAPPER= cargo build --locked --release -p tilo-crypto
      - name: Publish an immutable finalization tools image
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          repository=code.sandbox.example/qos/tilo-development-finalization-tools-aarch64
          tag="$repository:crypto-${GITHUB_SHA:0:12}"
          binary_sha256=$(sha256sum target/release/tilo-crypto | awk '{print $1}')
          context=$(mktemp -d)
          cleanup() { rm -rf -- "$context"; }
          trap cleanup EXIT
          install -m 0755 target/release/tilo-crypto "$context/tilo-crypto"
          cat >"$context/Containerfile" <<EOF
          FROM code.sandbox.example/qos/tilo-development-finalization-tools-aarch64@sha256:b8f09490cb08b93ca137a9aca5a7c87b97a218ae33453f6b24b315fb0469903f
          COPY --chown=0:0 --chmod=0755 tilo-crypto /usr/local/bin/tilo-crypto
          LABEL ai.podesta.tilo.finalization.crypto.sha256="$binary_sha256"
          LABEL org.opencontainers.image.revision="$GITHUB_SHA"
          EOF
          docker build --file "$context/Containerfile" --tag "$tag" "$context"
          push_output=$(docker push "$tag")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | awk '/digest: sha256:/ {print $2}' | tail -n1)
          test "${digest#sha256:}" != "$digest"
          python3 - "$tag" "$digest" "$binary_sha256" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          tag, digest, binary, revision = sys.argv[1:]
          receipt = {
              'schema': 1,
              'architecture': 'aarch64',
              'binary_sha256': binary,
              'image': tag,
              'image_digest': digest,
              'reference': tag.split(':', 1)[0] + '@' + digest,
              'source_revision': revision,
          }
          pathlib.Path('finalization-tools-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - name: Retain the public publication receipt
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: finalization-tools-${{ github.run_id }}-aarch64
          path: finalization-tools-receipt.json
          if-no-files-found: error
          retention-days: 14
