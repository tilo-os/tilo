name: Snapshot / RPM repository

# Builds + pushes the digest-pinned frozen RPM repo that os/Containerfile
# installs from (for cross-time-reproducible OS builds). Runs in CI — the image
# ships from here, never a laptop. Manual dispatch: run it when you bump the
# base image or the package set. It prints the new RPMS_REF; commit that to
# os/rpms-snapshot.env (a normal PR/commit) and the OS build picks it up.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # These are the only files used below to derive the frozen package set.
      # Refreshing on changes prevents an OS build from asking an older snapshot
      # for a package that was added to one of the Containerfiles.
      - os/Containerfile
      - os/Containerfile.rpms
      - os/external-assets/github-assets.tsv
      - os/dev/cache-github-assets.sh
      - os/dev/derive-rpm-package-set.py
      - os/Containerfile.host
      - os/dev/composefs/Containerfile
      - os/containers/qos-relay/Containerfile
      - os/kernel/Containerfile
      - .forgejo/workflows/snapshot-rpms.yml

concurrency:
  group: snapshot-rpms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Restore checksum-verified external build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable external build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save checksum-verified external inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      # The base is the mirrored, digest-pinned one every image builds FROM
      # (os/base-snapshot.env) — the package set has to resolve against the
      # base it will be installed on. Only the BASE_REF= line: $GITHUB_ENV has
      # no comment syntax, so the file's leading `#` lines would corrupt the
      # env.
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      # Single source of truth for the package set: the union of every
      # dnf-install line across the OS Containerfiles (main image + host
      # bootc + standalone relay OCI). Keeping the snapshot the same for
      # every image guarantees whatever we FROM-mount the frozen repo at
      # finds every package it wants.
      - name: Derive the package set from the Containerfiles
        run: |
          # This parser is shared with the static invariant test. It handles
          # quoted capability specs and every install command in a RUN line;
          # keeping a second awk copy here previously let them drift apart.
          pkgs=$(./os/dev/derive-rpm-package-set.py | tr '\n' ' ')
          test -n "$pkgs"
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "packages: $pkgs"

      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build + push the frozen RPM repo image
        id: rpms
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.rpms
          push: true
          tags: code.podesta.ai/qos/rpms:${{ github.sha }}
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
            PACKAGES=${{ env.PACKAGES }}
          cache-from: type=registry,ref=code.podesta.ai/qos/qos-rpms-buildcache:latest
          cache-to: type=registry,ref=code.podesta.ai/qos/qos-rpms-buildcache:latest,mode=max
          provenance: false

      - name: Report the pinned RPMS_REF to commit
        run: |
          ref="code.podesta.ai/qos/rpms@${{ steps.rpms.outputs.digest }}"
          echo "::notice::Frozen RPM repo published. Set os/rpms-snapshot.env to: RPMS_REF=$ref"
          {
            echo "## Frozen RPM repo published"
            echo ""
            echo 'Commit this to `os/rpms-snapshot.env`:'
            echo ""
            echo '```'
            echo "RPMS_REF=$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the frozen snapshot pin to the dispatched branch
        env:
          RPMS_DIGEST: ${{ steps.rpms.outputs.digest }}
        run: |
          ref="code.podesta.ai/qos/rpms@${RPMS_DIGEST}"
          printf '%s\n' \
            '# Digest-pinned frozen RPM repository used by os/Containerfile.' \
            '# Updated by the snapshot-rpms workflow when the package set changes.' \
            "RPMS_REF=$ref" > os/rpms-snapshot.env
          if git diff --quiet -- os/rpms-snapshot.env; then
            echo "Snapshot pin is already current"
            exit 0
          fi
          git config user.name "qOS CI"
          git config user.email "ci@qos.invalid"
          git add os/rpms-snapshot.env
          git commit -m "os: refresh frozen RPM snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch the full image build and boot test
        env:
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/build-image.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"with_browser\":\"0\"}}"
