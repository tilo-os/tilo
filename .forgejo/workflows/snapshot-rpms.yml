name: Snapshot / RPM repository

# Builds + pushes the digest-pinned frozen RPM repo that os/Containerfile
# installs from (for cross-time-reproducible OS builds). CI publishes the image.
# Runs when the base image or package set changes; a manual dispatch forces a
# refresh.
#
# Kernel provenance binds RPMS_REF, so an RPM pin is only usable together with
# kernels built against it. After publishing the snapshot this workflow calls
# build-kernel.yml with the new RPMS_REF; that run builds, signs and verifies
# both native kernels and opens one pull request that updates
# os/rpms-snapshot.env and os/kernel-snapshot.env together. Main therefore
# never holds an RPM pin without its matching kernels.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # These are the only files used below to derive the frozen package set.
      # Refreshing on changes prevents an OS build from asking an older snapshot
      # for a package that was added to one of the Containerfiles. Keep this
      # list equal to INPUTS in os/dev/rpm-snapshot-inputs.py minus the pin.
      - os/Containerfile
      - os/base-snapshot.env
      - os/dev/rpm-snapshot-inputs.py
      - os/Containerfile.rpms
      - os/dev/verify-rpm-snapshot-signatures.sh
      - os/external-assets/github-assets.tsv
      - os/dev/cache-github-assets.sh
      - os/dev/derive-rpm-package-set.py
      - keys/cosign.pub
      - os/dev/promote-native-index.py
      - os/dev/open-snapshot-pr.py
      - os/dev/install-cached-cosign.sh
      - os/dev/configure-cosign-kms.sh
      - ".forgejo/actions/install-cosign/**"
      - os/Containerfile.dev
      - os/Containerfile.host
      - os/dev/composefs/Containerfile
      - os/containers/tilo-relay/Containerfile
      - os/kernel/Containerfile
      - .forgejo/workflows/snapshot-rpms.yml

concurrency:
  # Keep manual publications serialized. Each automatic revision is independent
  # so a no-op cannot replace a pending useful snapshot.
  group: snapshot-rpms-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.sha }}
  # A later semantic no-op must not cancel a useful native snapshot.
  cancel-in-progress: false

jobs:
  inputs:
    if: github.ref == 'refs/heads/main'
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Compare actual snapshot inputs before native fanout
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: python3 os/dev/rpm-snapshot-inputs.py --base "$BEFORE" --head "$GITHUB_SHA" --event "$EVENT"

  signing-preflight:
    needs: inputs
    if: github.ref == 'refs/heads/main' && needs.inputs.outputs.changed == 'true'
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Require non-exportable snapshot signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          resolved="$RUNNER_TEMP/rpm-snapshot-signing-authority.pub"
          cosign public-key --key "$COSIGN_KEY_REF" > "$resolved"
          cmp --silent keys/cosign.pub "$resolved" || {
            echo '::error::snapshot KMS/HSM authority does not match keys/cosign.pub'
            exit 1
          }

  snapshot:
    if: github.ref == 'refs/heads/main'
    needs: signing-preflight
    enable-openid-connect: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner
          - arch: aarch64
            platform: linux/arm64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Restore checksum-verified external build inputs
        id: github-assets-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-

      - name: Materialize immutable external build inputs
        run: ./os/dev/cache-github-assets.sh

      - name: Save checksum-verified external inputs immediately
        if: steps.github-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      # The base is the mirrored, digest-pinned one every image builds FROM
      # (os/base-snapshot.env) - the package set has to resolve against the
      # base it will be installed on. Only the BASE_REF= line: $GITHUB_ENV has
      # no comment syntax, so the file's leading `#` lines would corrupt the
      # env.
      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      # Single source of truth for the package set: the union of every
      # dnf-install line across the OS Containerfiles (main image + host
      # bootc + standalone relay OCI). Keeping the snapshot the same for
      # every image guarantees whatever we FROM-mount the frozen repo at
      # finds every package it wants.
      - name: Derive the package set from the Containerfiles
        run: |
          # This parser is shared with the static invariant test. It handles
          # quoted capability specs and every install command in a RUN line;
          # keeping a second awk copy here previously let them drift apart.
          pkgs=$(./os/dev/derive-rpm-package-set.py --arch '${{ matrix.arch }}' | tr '\n' ' ')
          test -n "$pkgs"
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "packages: $pkgs"

      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up buildx for native snapshot construction
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build + push the frozen RPM repo image
        id: rpms
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.rpms
          platforms: ${{ matrix.platform }}
          push: true
          tags: code.podesta.ai/qos/rpms:native-${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
            PACKAGES=${{ env.PACKAGES }}
          provenance: false

      - name: Install checksum-pinned Cosign
        run: ./os/dev/install-cached-cosign.sh

      - name: Sign and describe the native repository
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          CHILD_ARCH: ${{ matrix.arch }}
          CHILD_DIGEST: ${{ steps.rpms.outputs.digest }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          cosign sign --yes --key "$COSIGN_KEY_REF" "code.podesta.ai/qos/rpms@${CHILD_DIGEST}"
          mkdir -p native-child
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("native-child/child.json").write_text(json.dumps({
              "architecture": os.environ["CHILD_ARCH"],
              "digest": os.environ["CHILD_DIGEST"],
              "sourceRevision": os.environ["GITHUB_SHA"],
          }))
          PY

      - name: Upload the native child descriptor
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: rpms-native-${{ matrix.arch }}
          path: native-child/
          if-no-files-found: error

  promote-snapshot:
    if: github.ref == 'refs/heads/main'
    enable-openid-connect: true
    timeout-minutes: 60
    needs: snapshot
    runs-on: runner
    outputs:
      rpms-ref: ${{ steps.attest.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 0
      - name: Download native child descriptors
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: native-children
      - name: Refuse stale snapshot inputs before promotion
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! python3 os/dev/rpm-snapshot-inputs.py --base "$GITHUB_SHA" --head origin/main --require-equivalent; then
            echo '::error::RPM snapshot inputs changed while native builds ran'
            exit 1
          fi
      - name: Log in to code.podesta.ai
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Install publication tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends podman skopeo
          else
            sudo -n dnf install -y podman skopeo
          fi
      - name: Verify and promote the complete native index
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          # The containerized runner's root filesystem is overlayfs, so a
          # nested default Podman overlay store cannot assemble the index.
          # Manifest promotion needs metadata only; isolate it in a VFS store.
          storage="$(mktemp -d "$RUNNER_TEMP/tilo-rpm-manifests.XXXXXX")"
          trap 'rm -rf -- "$storage"; rm -f -- "${AWS_WEB_IDENTITY_TOKEN_FILE:-}"' EXIT
          export CONTAINERS_STORAGE_CONF="$storage/storage.conf"
          printf '[storage]\ndriver = "vfs"\ngraphroot = "%s/graph"\nrunroot = "%s/run"\n' \
            "$storage" "$storage" > "$CONTAINERS_STORAGE_CONF"
          python3 os/dev/promote-native-index.py \
            --repository code.podesta.ai/qos/rpms --tag "$GITHUB_SHA" \
            --revision "$GITHUB_SHA" --descriptors native-children \
            --signing-key "$COSIGN_KEY_REF" --output rpms-index.txt
          echo "RPMS_REF=$(cat rpms-index.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up buildx for index inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Attest and verify the native snapshot index
        id: attest
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          ref="$(cat rpms-index.txt)"
          platforms="$(docker buildx imagetools inspect --raw "$ref" | jq -c \
            '[.manifests[].platform | {os,architecture}] | sort_by(.architecture)')"
          expected='[{"os":"linux","architecture":"amd64"},{"os":"linux","architecture":"arm64"}]'
          [ "$platforms" = "$expected" ] || {
            echo "::error::frozen RPM index does not contain exactly amd64 and arm64: $platforms"
            exit 1
          }
          case "$COSIGN_KEY_REF" in
            gcpkms://*|awskms://*|azurekms://*|hashivault://*) ;;
            *) echo "::error::COSIGN_KEY_REF must name a non-exportable KMS/HSM key"; exit 1 ;;
          esac
          . os/dev/configure-cosign-kms.sh
          source os/base-snapshot.env
          python3 os/dev/derive-rpm-package-set.py --arch x86_64 | sort -u > package-roots-amd64.txt
          python3 os/dev/derive-rpm-package-set.py --arch aarch64 | sort -u > package-roots-arm64.txt
          package_set_sha256="$(cat package-roots-amd64.txt package-roots-arm64.txt | sort -u | sha256sum | cut -d' ' -f1)"
          package_amd64_sha256="$(sha256sum package-roots-amd64.txt | cut -d' ' -f1)"
          package_arm64_sha256="$(sha256sum package-roots-arm64.txt | cut -d' ' -f1)"
          digest="${ref##*@}"
          jq -n --arg source "git+ssh://code.podesta.ai/qos/qos@$GITHUB_SHA" \
            --arg digest "$digest" --arg base "$BASE_REF" \
            --arg package_amd64_sha256 "$package_amd64_sha256" --arg package_arm64_sha256 "$package_arm64_sha256" \
            --arg package_set_sha256 "$package_set_sha256" '
              {
                buildDefinition: {
                  buildType: "https://tilo.sh/buildtypes/frozen-rpm-index/v1",
                  externalParameters: {
                    architectures: ["amd64", "arm64"],
                    packageSetSha256: $package_set_sha256,
                    packageSetSha256ByArchitecture: {amd64: $package_amd64_sha256, arm64: $package_arm64_sha256}
                  },
                  internalParameters: {expectedReleaseDigest: $digest},
                  resolvedDependencies: [{uri: $source}, {uri: $base}]
                },
                runDetails: {
                  builder: {id: "https://code.podesta.ai/qos/forgejo/actions/rpm-snapshot-v1"},
                  metadata: {invocationId: env.GITHUB_RUN_ID}
                }
              }
            ' > rpm-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign attest --yes --key "$COSIGN_KEY_REF" --type slsaprovenance1 \
            --predicate rpm-provenance.json "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$ref")"
          printf '%s' "$provenance" | jq -e --arg digest "$digest" \
            --arg base "$BASE_REF" --arg package_amd64_sha256 "$package_amd64_sha256" --arg package_arm64_sha256 "$package_arm64_sha256" \
            --arg package_set_sha256 "$package_set_sha256" '
              [(if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
              | any(
                  .buildDefinition.buildType == "https://tilo.sh/buildtypes/frozen-rpm-index/v1"
                  and .buildDefinition.externalParameters.architectures == ["amd64", "arm64"]
                  and .buildDefinition.externalParameters.packageSetSha256 == $package_set_sha256
                  and .buildDefinition.externalParameters.packageSetSha256ByArchitecture == {amd64: $package_amd64_sha256, arm64: $package_arm64_sha256}
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $base)
                )
            ' >/dev/null
          echo "::notice::Frozen RPM repo published: RPMS_REF=$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "## Frozen RPM repo published"
            echo ""
            echo 'The kernels are rebuilt against it next; their pull request pins both:'
            echo ""
            echo '```'
            echo "RPMS_REF=$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # No pull request is opened here. build-kernel.yml builds, signs and verifies
  # the native kernels against the new index and proposes both pins in one pull
  # request, after checking that neither the RPM nor the kernel inputs moved on
  # main meanwhile.
  kernels:
    if: github.ref == 'refs/heads/main'
    needs: promote-snapshot
    uses: ./.forgejo/workflows/build-kernel.yml
    with:
      rpms_ref: ${{ needs.promote-snapshot.outputs.rpms-ref }}
    secrets: inherit
