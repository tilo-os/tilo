name: Development / cache proof and retained OS compilation

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for this build; select only the next test target
        required: true
        type: choice
        default: x86_64
        options: [x86_64, aarch64]
      hardware_profile:
        description: Explicit hardware definition; generic uses standard firmware boot
        required: true
        type: string
        default: generic
      firmware_candidate:
        description: Immutable firmware-only artifact; required for board full-build
        required: false
        type: string
      firmware_manifest_sha256:
        description: Independently reviewed SHA256 of the firmware manifest
        required: false
        type: string
      kernel_candidate:
        description: Immutable kernel RPM image; required for ARM full-build
        required: false
        type: string
      rpms_candidate:
        description: Optional reviewed immutable native RPM snapshot override
        required: false
        type: string
      fex_payload_candidate:
        description: Reviewed immutable compatibility runtime payload; required for ARM full-build
        required: false
        type: string
      windows_guest_candidate:
        description: Reviewed immutable Windows guest payload; required for ARM full-build
        required: false
        type: string
      builder_candidate:
        description: Reviewed immutable native tools and application builder
        required: true
        type: string
        default: code.sandbox.example/qos/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
      mode:
        description: 'Cache proof, reusable native applications, or full OS assembly'
        required: true
        type: choice
        default: cache-only
        options:
          - cache-only
          - native-payload
          - full-build
      native_builder_receipt:
        description: Optional completed native application payload receipt for full assembly
        required: false
        type: string
      native_builder_sha256:
        description: Independent SHA256 of the exact native application payload receipt
        required: false
        type: string
      source_revision:
        description: Optional immutable application source; helpers_revision can independently pin its compatible controller
        required: false
        type: string
      helpers_revision:
        description: Optional independently reviewed compatible controller commit; requires explicit source_revision
        required: false
        type: string
      reconstructed_native_receipt:
        description: Explicit development reconstruction receipt; excludes legacy native receipt
        required: false
        type: string
      reconstructed_native_sha256:
        description: Independently approved SHA256 of exact reconstructed receipt bytes
        required: false
        type: string
      approved_reconstruction_sha256:
        description: Independently reviewed reconstruction plan SHA256; never inferred from receipt
        required: false
        type: string
      native_source_compatibility:
        description: Explicit reviewed two-file Windows provider source correction admission JSON
        required: false
        type: string
      native_source_compatibility_sha256:
        description: Independently approved SHA256 of exact source compatibility admission
        required: false
        type: string
      wpe_candidate:
        description: 'Full-build only: reviewed matching native tilo-wpe-buildroot@sha256 candidate'
        required: false
        type: string
      generation:
        description: 'Full-build only: explicit positive test generation'
        required: false
        type: string
      wpe_stage_receipt:
        description: 'Full-build only: public JSON receipt from the completed WPE producer'
        required: false
        type: string
      wpe_adoption_receipt:
        description: Alternative development receipt for reviewed retained WPE bytes; excludes current producer inputs
        required: false
        type: string
      wpe_adoption_sha256:
        description: Independently reviewed SHA256 of the exact adoption receipt JSON
        required: false
        type: string

concurrency:
  group: development-compile-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  full-source:
    defaults:
      run:
        working-directory: controller
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    # Full browser compilation requires additional disk capacity. The driver
    # samples free space and stops at an 8 GiB reserve.
    runs-on: ${{ inputs.architecture == 'aarch64' && 'runner-disk-100g-arm64' || 'runner-disk-100g' }}
    # Leave evidence-cleanup headroom inside the existing 180-minute runner cap.
    # This is a limit, not an estimate of full compilation duration.
    # A literal job bound is required by the repository timeout policy.
    # The selected operation below separately bounds cache-only tools/probes.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate manual inputs and native execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SOURCE_REVISION: ${{ inputs.source_revision }}
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
          RECONSTRUCTED_NATIVE_RECEIPT: ${{ inputs.reconstructed_native_receipt }}
          RECONSTRUCTED_NATIVE_SHA256: ${{ inputs.reconstructed_native_sha256 }}
          APPROVED_RECONSTRUCTION_SHA256: ${{ inputs.approved_reconstruction_sha256 }}
          NATIVE_SOURCE_COMPATIBILITY: ${{ inputs.native_source_compatibility }}
          NATIVE_SOURCE_COMPATIBILITY_SHA256: ${{ inputs.native_source_compatibility_sha256 }}
          COMPILE_MODE: ${{ inputs.mode }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TEST_GENERATION: ${{ inputs.generation }}
          ARCHITECTURE: ${{ inputs.architecture }}
          HARDWARE_PROFILE: ${{ inputs.hardware_profile }}
          FIRMWARE_CANDIDATE: ${{ inputs.firmware_candidate }}
          FIRMWARE_MANIFEST_SHA256: ${{ inputs.firmware_manifest_sha256 }}
          KERNEL_CANDIDATE: ${{ inputs.kernel_candidate }}
          RPMS_CANDIDATE: ${{ inputs.rpms_candidate }}
          BUILDER_CANDIDATE: ${{ inputs.builder_candidate }}
          WPE_ADOPTION_RECEIPT: ${{ inputs.wpe_adoption_receipt }}
          WPE_ADOPTION_SHA256: ${{ inputs.wpe_adoption_sha256 }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.fex_payload_candidate }}
          WINDOWS_GUEST_CANDIDATE: ${{ inputs.windows_guest_candidate }}
          NATIVE_BUILDER_RECEIPT: ${{ inputs.native_builder_receipt }}
          NATIVE_BUILDER_SHA256: ${{ inputs.native_builder_sha256 }}
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh "$ARCHITECTURE"
          python3 os/tests/test_development_compile.py
          python3 os/tests/test_compile_retention.py
          python3 os/tests/test_native_builder_artifact.py
          python3 os/tests/test_compile_tools_source.py
          if [ "$COMPILE_MODE" != cache-only ]; then
            bash os/tests/app_store.sh
          fi
          python3 - <<'PY'
          import importlib.util, os, re
          e = os.environ
          revision = e['SOURCE_REVISION'] or e['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', revision):
              raise ValueError('application source must be an immutable commit')
          if e['HELPERS_REVISION'] and (not e['SOURCE_REVISION'] or not re.fullmatch('[0-9a-f]{40}', e['HELPERS_REVISION'])):
              raise ValueError('helper selection requires independent source and helper commits')
          if e['RECONSTRUCTED_NATIVE_RECEIPT'] and not e['HELPERS_REVISION']:
              raise ValueError('reconstructed frozen-source assembly requires explicitly reviewed compatible helpers')
          s = importlib.util.spec_from_file_location('compile', 'os/dev/compile-development-os.py')
          m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
          m.validate_inputs(e['WPE_CANDIDATE'], e['TEST_GENERATION'], revision, e['GITHUB_REF'],
              e['COMPILE_MODE'], e['ARCHITECTURE'], e['KERNEL_CANDIDATE'],
              wpe_adoption_receipt=e['WPE_ADOPTION_RECEIPT'] or None, wpe_adoption_sha256=e['WPE_ADOPTION_SHA256'],
              fex_payload_candidate=e['FEX_PAYLOAD_CANDIDATE'], windows_guest_candidate=e['WINDOWS_GUEST_CANDIDATE'],
              hardware_profile=e['HARDWARE_PROFILE'], firmware_candidate=e['FIRMWARE_CANDIDATE'],
              firmware_manifest_sha256=e['FIRMWARE_MANIFEST_SHA256'], require_firmware_artifact=True,
              native_builder_receipt=e['NATIVE_BUILDER_RECEIPT'] or None, native_builder_sha256=e['NATIVE_BUILDER_SHA256'],
              reconstructed_native_receipt=e['RECONSTRUCTED_NATIVE_RECEIPT'] or None,
              reconstructed_native_sha256=e['RECONSTRUCTED_NATIVE_SHA256'],
              approved_reconstruction_sha256=e['APPROVED_RECONSTRUCTION_SHA256'],
              native_source_compatibility=e['NATIVE_SOURCE_COMPATIBILITY'] or None,
              native_source_compatibility_sha256=e['NATIVE_SOURCE_COMPATIBILITY_SHA256'])
          PY
          python3 - <<'PY'
          import os, re
          for name in ('KERNEL_CANDIDATE', 'RPMS_CANDIDATE', 'BUILDER_CANDIDATE'):
              value = os.environ[name]
              required = name == 'BUILDER_CANDIDATE' or (
                  name == 'KERNEL_CANDIDATE' and os.environ['ARCHITECTURE'] == 'aarch64'
                  and os.environ['COMPILE_MODE'] == 'full-build')
              if (required or value) and not re.fullmatch(
                  r'code\.podesta\.ai/qos/[a-z0-9-]+@sha256:[0-9a-f]{64}', value):
                  raise ValueError(name + ' requires a reviewed immutable image')
          PY
          bash os/dev/install-cached-cosign.sh
      - name: Checkout independently pinned application source
        if: inputs.source_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: application-source
          fetch-depth: 5 # Frozen source plus reviewed provider, recipe, policy, and optional acceptance corrections.
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      # The workflow checkout remains the orchestrator. Only the independently
      # selected controller enters /work/repo and executes application helpers.
      - name: Checkout independently pinned compatible helpers
        if: inputs.helpers_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: helper-controller
          ref: ${{ inputs.helpers_revision }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Authenticate input pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.sandbox.example
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Run selected cache proof or full compilation
        timeout-minutes: ${{ inputs.mode == 'cache-only' && 30 || 165 }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SOURCE_REVISION: ${{ inputs.source_revision }}
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
          RECONSTRUCTED_NATIVE_RECEIPT: ${{ inputs.reconstructed_native_receipt }}
          RECONSTRUCTED_NATIVE_SHA256: ${{ inputs.reconstructed_native_sha256 }}
          APPROVED_RECONSTRUCTION_SHA256: ${{ inputs.approved_reconstruction_sha256 }}
          NATIVE_SOURCE_COMPATIBILITY: ${{ inputs.native_source_compatibility }}
          NATIVE_SOURCE_COMPATIBILITY_SHA256: ${{ inputs.native_source_compatibility_sha256 }}
          COMPILE_MODE: ${{ inputs.mode }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TEST_GENERATION: ${{ inputs.generation }}
          WPE_STAGE_RECEIPT: ${{ inputs.wpe_stage_receipt }}
          ARCHITECTURE: ${{ inputs.architecture }}
          HARDWARE_PROFILE: ${{ inputs.hardware_profile }}
          FIRMWARE_CANDIDATE: ${{ inputs.firmware_candidate }}
          FIRMWARE_MANIFEST_SHA256: ${{ inputs.firmware_manifest_sha256 }}
          KERNEL_CANDIDATE: ${{ inputs.kernel_candidate }}
          RPMS_CANDIDATE: ${{ inputs.rpms_candidate }}
          BUILDER_CANDIDATE: ${{ inputs.builder_candidate }}
          WPE_ADOPTION_RECEIPT: ${{ inputs.wpe_adoption_receipt }}
          WPE_ADOPTION_SHA256: ${{ inputs.wpe_adoption_sha256 }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.fex_payload_candidate }}
          WINDOWS_GUEST_CANDIDATE: ${{ inputs.windows_guest_candidate }}
          NATIVE_BUILDER_RECEIPT: ${{ inputs.native_builder_receipt }}
          NATIVE_BUILDER_SHA256: ${{ inputs.native_builder_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          name="tilo-provisional-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          context=$(mktemp -d)
          cache_secrets=$(mktemp -d)
          evidence="$RUNNER_TEMP/provisional-evidence"
          mkdir "$evidence"
          cleanup() {
            # Export an explicit public allowlist, never the private workspace.
            for file in controller-source.json native-source-compatibility.json reconstructed-native-adoption.json native-builder.json firmware-import.json inputs.json native-inputs.json tools.json workspace.json result.json wpe-stage.json wpe-adoption.json raw-rootfs.json raw-rootfs-audit.json retained-rootfs.json installed-rpms.tsv admission-capacity.json capacity.json memory-initial.json memory-final.json cache-configuration.json base-installation-tooling.json raw-installation-tooling.json; do
              docker cp "$name:/evidence/$file" "$evidence/$file" >/dev/null 2>&1 || true
            done
            mkdir -p "$evidence/public-trust"
            for file in cosign.pub tpm2-pcr-signing.public.pem efi-signing.crt registry-owner.pub manifest.json; do
              docker cp "$name:/evidence/public-trust/$file" "$evidence/public-trust/$file" >/dev/null 2>&1 || true
            done
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-work" "$name-storage" "$name-cache-secrets" >/dev/null 2>&1 || true
            docker image rm "$name:tools" >/dev/null 2>&1 || true
            rm -rf -- "$context" "$cache_secrets"
          }
          trap cleanup EXIT
          # Receipt text is data, never interpolated into shell commands.
          python3 - "$context/wpe-stage.json" <<'PY'
          import os, pathlib, sys
          raw = os.environ.get('WPE_STAGE_RECEIPT', '').encode()
          adopted = os.environ.get('WPE_ADOPTION_RECEIPT', '').encode()
          if max(len(raw), len(adopted)) > 65536 or (raw and adopted):
              raise SystemExit('select exactly one bounded WPE receipt')
          if os.environ['COMPILE_MODE'] in ('full-build', 'native-payload') and not (raw or adopted):
              raise SystemExit('full-build requires a completed or adopted WPE receipt')
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          pathlib.Path(sys.argv[1]).with_name('wpe-adoption.json').write_bytes(adopted)
          native = os.environ.get('NATIVE_BUILDER_RECEIPT', '').encode()
          if len(native) > 65536:
              raise SystemExit('native builder receipt exceeds limit')
          pathlib.Path(sys.argv[1]).with_name('native-builder.json').write_bytes(native)
          reconstructed = os.environ.get('RECONSTRUCTED_NATIVE_RECEIPT', '').encode()
          if len(reconstructed) > 1024 * 1024 or (reconstructed and native):
              raise SystemExit('select one bounded native receipt')
          pathlib.Path(sys.argv[1]).with_name('reconstructed-native.json').write_bytes(reconstructed)
          compatibility = os.environ.get('NATIVE_SOURCE_COMPATIBILITY', '').encode()
          if len(compatibility) > 65536:
              raise SystemExit('source compatibility admission exceeds limit')
          pathlib.Path(sys.argv[1]).with_name('native-source-compatibility.json').write_bytes(compatibility)
          PY
          # Existing runner credentials enter only a private disposable volume,
          # then Podman secret mounts. They never enter a build context or ARG.
          python3 - "$cache_secrets" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('compile', 'os/dev/compile-development-os.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.stage_cache_credentials(sys.argv[1])
          PY
          cp "$(command -v cosign)" "$context/cosign"
          execution_controller=.
          execution_revision="$GITHUB_SHA"
          if [ -n "$HELPERS_REVISION" ]; then
            execution_controller=../helper-controller
            execution_revision="$HELPERS_REVISION"
          fi
          if [ -n "$NATIVE_SOURCE_COMPATIBILITY" ]; then
            python3 - "$execution_controller" "$context/native-source-compatibility.json" "$evidence/native-source-compatibility-preflight.json" <<'PY'
          import importlib.util, json, os, pathlib, sys
          path = pathlib.Path(sys.argv[1]) / 'os/dev/native_source_compatibility.py'
          spec = importlib.util.spec_from_file_location('compatibility', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          result = module.verify('../application-source', os.environ['SOURCE_REVISION'], sys.argv[2],
              os.environ['NATIVE_SOURCE_COMPATIBILITY_SHA256'], os.environ['RECONSTRUCTED_NATIVE_SHA256'],
              os.environ['APPROVED_RECONSTRUCTION_SHA256'])
          pathlib.Path(sys.argv[3]).write_text(json.dumps(result, sort_keys=True) + '\n')
          PY
          fi
          tools_source_args=()
          if [ -n "$SOURCE_REVISION" ]; then
            tools_source_args=(--source ../application-source --source-revision "$SOURCE_REVISION")
          fi
          # Tools must match the application helpers actually executed. Frozen
          # source4583 still needs OpenSSL/sbsigntools; newer controller recipes
          # may intentionally omit them for a different helper implementation.
          python3 os/dev/stage-compile-tools-recipe.py \
            --controller "$execution_controller" --controller-revision "$execution_revision" \
            "${tools_source_args[@]}" --output "$context/Containerfile" \
            --receipt "$evidence/tools-source.json"
          docker build --file "$context/Containerfile" --tag "$name:tools" \
            --build-arg "BUILDER_REF=$BUILDER_CANDIDATE" "$context"
          expected_platform=linux/amd64
          if [ "$ARCHITECTURE" = aarch64 ]; then expected_platform=linux/arm64; fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$name:tools")" = "$expected_platform"
          docker volume create "$name-work"
          docker volume create "$name-storage"
          docker volume create "$name-cache-secrets"
          wpe_receipt_args=(--wpe-stage-receipt /work/wpe-stage.json)
          if [ -n "$WPE_ADOPTION_RECEIPT" ]; then
            wpe_receipt_args=(--wpe-adoption-receipt /work/wpe-adoption.json --wpe-adoption-sha256 "$WPE_ADOPTION_SHA256")
          fi
          native_receipt_args=()
          source_args=()
          compatibility_args=()
          if [ -n "$NATIVE_SOURCE_COMPATIBILITY" ]; then
            compatibility_args=(--native-source-compatibility /work/native-source-compatibility.json --native-source-compatibility-sha256 "$NATIVE_SOURCE_COMPATIBILITY_SHA256")
          fi
          application_revision="$GITHUB_SHA"
          if [ -n "$SOURCE_REVISION" ]; then
            application_revision="$SOURCE_REVISION"
            source_args=(--source-dir /work/source --controller-revision "$execution_revision")
            # The authenticated checkout action prepared a sibling checkout;
            # source remains outside the clean controller and its Docker copy.
            test "$(git -C ../application-source rev-parse HEAD)" = "$SOURCE_REVISION"
          fi
          if [ -n "$NATIVE_BUILDER_RECEIPT" ]; then
            native_receipt_args=(--native-builder-receipt /work/native-builder.json --native-builder-sha256 "$NATIVE_BUILDER_SHA256")
          elif [ -n "$NATIVE_BUILDER_SHA256" ]; then
            echo 'native builder digest requires receipt' >&2; exit 1
          fi
          if [ -n "$RECONSTRUCTED_NATIVE_RECEIPT" ]; then
            native_receipt_args=(--reconstructed-native-receipt /work/reconstructed-native.json
              --reconstructed-native-sha256 "$RECONSTRUCTED_NATIVE_SHA256"
              --approved-reconstruction-sha256 "$APPROVED_RECONSTRUCTION_SHA256")
          fi
          # These volumes and privileges exist only in the disposable Kata CI
          # guest. No physical disk, TPM, host directory or Docker socket is mounted.
          docker create --name "$name" --privileged --memory=9g --memory-swap=9g \
            --mount "type=volume,src=$name-work,dst=/work" \
            --mount "type=volume,src=$name-storage,dst=/var/lib/containers" \
            --mount "type=volume,src=$name-cache-secrets,dst=/run/tilo-cache-secrets" \
            --env SCCACHE_ENDPOINT --env SCCACHE_BUCKET --env SCCACHE_REGION \
            --env SCCACHE_S3_USE_SSL --env SCCACHE_S3_KEY_PREFIX \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env REGISTRY_AUTH_FILE=/registry-auth.json \
            "$name:tools" --mode "$COMPILE_MODE" --wpe "$WPE_CANDIDATE" --generation "$TEST_GENERATION" \
              --hardware-profile "$HARDWARE_PROFILE" --firmware-candidate "$FIRMWARE_CANDIDATE" \
              --firmware-manifest-sha256 "$FIRMWARE_MANIFEST_SHA256" \
              --architecture "$ARCHITECTURE" --kernel-candidate "$KERNEL_CANDIDATE" \
              --rpms-candidate "$RPMS_CANDIDATE" --builder-candidate "$BUILDER_CANDIDATE" \
              --fex-payload-candidate "$FEX_PAYLOAD_CANDIDATE" --windows-guest-candidate "$WINDOWS_GUEST_CANDIDATE" \
              "${wpe_receipt_args[@]}" \
              "${native_receipt_args[@]}" \
              "${source_args[@]}" \
              "${compatibility_args[@]}" \
              --revision "$application_revision" --branch "$GITHUB_REF"
          docker cp "$execution_controller/." "$name:/work/repo"
          if [ -n "$SOURCE_REVISION" ]; then docker cp ../application-source "$name:/work/source"; fi
          docker cp "$context/wpe-stage.json" "$name:/work/wpe-stage.json"
          docker cp "$context/wpe-adoption.json" "$name:/work/wpe-adoption.json"
          docker cp "$context/native-builder.json" "$name:/work/native-builder.json"
          docker cp "$context/reconstructed-native.json" "$name:/work/reconstructed-native.json"
          docker cp "$context/native-source-compatibility.json" "$name:/work/native-source-compatibility.json"
          docker cp "$cache_secrets/." "$name:/run/tilo-cache-secrets/"
          python3 - "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "$context/registry-auth.json" <<'PY'
          import json, os, sys
          registry = 'code.sandbox.example'
          credentials = json.load(open(sys.argv[1]))['auths'][registry]
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              json.dump({'auths': {registry: credentials}}, stream)
          PY
          docker cp "$context/registry-auth.json" "$name:/registry-auth.json"
          docker start --attach "$name"
          # Docker attach does not establish the container's exit status.
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Retain public compilation evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: provisional-os-compilation-${{ inputs.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/provisional-evidence/
          if-no-files-found: warn
          retention-days: 14
