name: Development / cache proof and retained OS compilation

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for this build; select only the next test target
        required: true
        type: choice
        default: x86_64
        options: [x86_64, aarch64]
      hardware_profile:
        description: Explicit hardware definition; generic uses standard firmware boot
        required: true
        type: string
        default: generic
      firmware_candidate:
        description: Immutable firmware-only artifact; required for board full-build
        required: false
        type: string
      firmware_manifest_sha256:
        description: Independently reviewed SHA256 of the firmware manifest
        required: false
        type: string
      kernel_candidate:
        description: Immutable kernel RPM image; required for ARM full-build
        required: false
        type: string
      rpms_candidate:
        description: Optional reviewed immutable native RPM snapshot override
        required: false
        type: string
      fex_payload_candidate:
        description: Reviewed immutable compatibility runtime payload; required for ARM full-build
        required: false
        type: string
      windows_guest_candidate:
        description: Reviewed immutable Windows guest payload; required for ARM full-build
        required: false
        type: string
      builder_candidate:
        description: Reviewed immutable native tools and application builder
        required: true
        type: string
        default: code.podesta.ai/qos/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
      mode:
        description: 'Cache proof, reusable native applications, or full OS assembly'
        required: true
        type: choice
        default: cache-only
        options:
          - cache-only
          - native-payload
          - full-build
      native_builder_receipt:
        description: Optional completed native application payload receipt for full assembly
        required: false
        type: string
      native_builder_sha256:
        description: Independent SHA256 of the exact native application payload receipt
        required: false
        type: string
      wpe_candidate:
        description: 'Full-build only: reviewed matching native tilo-wpe-buildroot@sha256 candidate'
        required: false
        type: string
      generation:
        description: 'Full-build only: explicit positive test generation'
        required: false
        type: string
      wpe_stage_receipt:
        description: 'Full-build only: public JSON receipt from the completed WPE producer'
        required: false
        type: string
      wpe_adoption_receipt:
        description: Alternative development receipt for reviewed retained WPE bytes; excludes current producer inputs
        required: false
        type: string
      wpe_adoption_sha256:
        description: Independently reviewed SHA256 of the exact adoption receipt JSON
        required: false
        type: string

concurrency:
  group: development-compile-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  full-source:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    # An explicit capacity experiment: full browser compilation has not yet
    # been measured. The driver samples space and stops at an 8 GiB reserve.
    runs-on: ${{ inputs.architecture == 'aarch64' && 'runner-disk-100g-arm64' || 'runner-disk-100g' }}
    # Leave evidence-cleanup headroom inside the existing 180-minute runner cap.
    # This is a limit, not an estimate of full compilation duration.
    # A literal job bound is required by the repository timeout policy.
    # The selected operation below separately bounds cache-only tools/probes.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate manual inputs and native execution
        env:
          COMPILE_MODE: ${{ inputs.mode }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TEST_GENERATION: ${{ inputs.generation }}
          ARCHITECTURE: ${{ inputs.architecture }}
          HARDWARE_PROFILE: ${{ inputs.hardware_profile }}
          FIRMWARE_CANDIDATE: ${{ inputs.firmware_candidate }}
          FIRMWARE_MANIFEST_SHA256: ${{ inputs.firmware_manifest_sha256 }}
          KERNEL_CANDIDATE: ${{ inputs.kernel_candidate }}
          RPMS_CANDIDATE: ${{ inputs.rpms_candidate }}
          BUILDER_CANDIDATE: ${{ inputs.builder_candidate }}
          WPE_ADOPTION_RECEIPT: ${{ inputs.wpe_adoption_receipt }}
          WPE_ADOPTION_SHA256: ${{ inputs.wpe_adoption_sha256 }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.fex_payload_candidate }}
          WINDOWS_GUEST_CANDIDATE: ${{ inputs.windows_guest_candidate }}
          NATIVE_BUILDER_RECEIPT: ${{ inputs.native_builder_receipt }}
          NATIVE_BUILDER_SHA256: ${{ inputs.native_builder_sha256 }}
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh "$ARCHITECTURE"
          python3 os/tests/test_development_compile.py
          python3 os/tests/test_compile_retention.py
          python3 os/tests/test_native_builder_artifact.py
          if [ "$COMPILE_MODE" != cache-only ]; then
            bash os/tests/app_store.sh
          fi
          python3 -c 'import importlib.util,os; s=importlib.util.spec_from_file_location("compile", "os/dev/compile-development-os.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.validate_inputs(os.environ["WPE_CANDIDATE"], os.environ["TEST_GENERATION"], os.environ["GITHUB_SHA"], os.environ["GITHUB_REF"], os.environ["COMPILE_MODE"], os.environ["ARCHITECTURE"], os.environ["KERNEL_CANDIDATE"], wpe_adoption_receipt=os.environ["WPE_ADOPTION_RECEIPT"] or None, wpe_adoption_sha256=os.environ["WPE_ADOPTION_SHA256"], fex_payload_candidate=os.environ["FEX_PAYLOAD_CANDIDATE"], windows_guest_candidate=os.environ["WINDOWS_GUEST_CANDIDATE"], hardware_profile=os.environ["HARDWARE_PROFILE"], firmware_candidate=os.environ["FIRMWARE_CANDIDATE"], firmware_manifest_sha256=os.environ["FIRMWARE_MANIFEST_SHA256"], require_firmware_artifact=True, native_builder_receipt=os.environ["NATIVE_BUILDER_RECEIPT"] or None, native_builder_sha256=os.environ["NATIVE_BUILDER_SHA256"])'
          python3 - <<'PY'
          import os, re
          for name in ('KERNEL_CANDIDATE', 'RPMS_CANDIDATE', 'BUILDER_CANDIDATE'):
              value = os.environ[name]
              required = name == 'BUILDER_CANDIDATE' or (
                  name == 'KERNEL_CANDIDATE' and os.environ['ARCHITECTURE'] == 'aarch64'
                  and os.environ['COMPILE_MODE'] == 'full-build')
              if (required or value) and not re.fullmatch(
                  r'code\.podesta\.ai/qos/[a-z0-9-]+@sha256:[0-9a-f]{64}', value):
                  raise ValueError(name + ' requires a reviewed immutable image')
          PY
          bash os/dev/install-cached-cosign.sh
      - name: Authenticate input pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Run selected cache proof or full compilation
        timeout-minutes: ${{ inputs.mode == 'cache-only' && 30 || 165 }}
        env:
          COMPILE_MODE: ${{ inputs.mode }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TEST_GENERATION: ${{ inputs.generation }}
          WPE_STAGE_RECEIPT: ${{ inputs.wpe_stage_receipt }}
          ARCHITECTURE: ${{ inputs.architecture }}
          HARDWARE_PROFILE: ${{ inputs.hardware_profile }}
          FIRMWARE_CANDIDATE: ${{ inputs.firmware_candidate }}
          FIRMWARE_MANIFEST_SHA256: ${{ inputs.firmware_manifest_sha256 }}
          KERNEL_CANDIDATE: ${{ inputs.kernel_candidate }}
          RPMS_CANDIDATE: ${{ inputs.rpms_candidate }}
          BUILDER_CANDIDATE: ${{ inputs.builder_candidate }}
          WPE_ADOPTION_RECEIPT: ${{ inputs.wpe_adoption_receipt }}
          WPE_ADOPTION_SHA256: ${{ inputs.wpe_adoption_sha256 }}
          FEX_PAYLOAD_CANDIDATE: ${{ inputs.fex_payload_candidate }}
          WINDOWS_GUEST_CANDIDATE: ${{ inputs.windows_guest_candidate }}
          NATIVE_BUILDER_RECEIPT: ${{ inputs.native_builder_receipt }}
          NATIVE_BUILDER_SHA256: ${{ inputs.native_builder_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          name="tilo-provisional-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          context=$(mktemp -d)
          cache_secrets=$(mktemp -d)
          evidence="$RUNNER_TEMP/provisional-evidence"
          mkdir "$evidence"
          cleanup() {
            # Export an explicit public allowlist, never the private workspace.
            for file in native-builder.json firmware-import.json inputs.json native-inputs.json tools.json workspace.json result.json wpe-stage.json wpe-adoption.json raw-rootfs.json raw-rootfs-audit.json retained-rootfs.json installed-rpms.tsv admission-capacity.json capacity.json memory-initial.json memory-final.json cache-configuration.json base-installation-tooling.json raw-installation-tooling.json; do
              docker cp "$name:/evidence/$file" "$evidence/$file" >/dev/null 2>&1 || true
            done
            mkdir -p "$evidence/public-trust"
            for file in cosign.pub tpm2-pcr-signing.public.pem efi-signing.crt registry-owner.pub manifest.json; do
              docker cp "$name:/evidence/public-trust/$file" "$evidence/public-trust/$file" >/dev/null 2>&1 || true
            done
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-work" "$name-storage" "$name-cache-secrets" >/dev/null 2>&1 || true
            docker image rm "$name:tools" >/dev/null 2>&1 || true
            rm -rf -- "$context" "$cache_secrets"
          }
          trap cleanup EXIT
          # Receipt text is data, never interpolated into shell commands.
          python3 - "$context/wpe-stage.json" <<'PY'
          import os, pathlib, sys
          raw = os.environ.get('WPE_STAGE_RECEIPT', '').encode()
          adopted = os.environ.get('WPE_ADOPTION_RECEIPT', '').encode()
          if max(len(raw), len(adopted)) > 65536 or (raw and adopted):
              raise SystemExit('select exactly one bounded WPE receipt')
          if os.environ['COMPILE_MODE'] in ('full-build', 'native-payload') and not (raw or adopted):
              raise SystemExit('full-build requires a completed or adopted WPE receipt')
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          pathlib.Path(sys.argv[1]).with_name('wpe-adoption.json').write_bytes(adopted)
          native = os.environ.get('NATIVE_BUILDER_RECEIPT', '').encode()
          if len(native) > 65536:
              raise SystemExit('native builder receipt exceeds limit')
          pathlib.Path(sys.argv[1]).with_name('native-builder.json').write_bytes(native)
          PY
          # Existing runner credentials enter only a private disposable volume,
          # then Podman secret mounts. They never enter a build context or ARG.
          python3 - "$cache_secrets" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('compile', 'os/dev/compile-development-os.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.stage_cache_credentials(sys.argv[1])
          PY
          cp "$(command -v cosign)" "$context/cosign"
          cp os/Containerfile.development-compile "$context/Containerfile"
          docker build --file "$context/Containerfile" --tag "$name:tools" \
            --build-arg "BUILDER_REF=$BUILDER_CANDIDATE" "$context"
          expected_platform=linux/amd64
          if [ "$ARCHITECTURE" = aarch64 ]; then expected_platform=linux/arm64; fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$name:tools")" = "$expected_platform"
          docker volume create "$name-work"
          docker volume create "$name-storage"
          docker volume create "$name-cache-secrets"
          wpe_receipt_args=(--wpe-stage-receipt /work/wpe-stage.json)
          if [ -n "$WPE_ADOPTION_RECEIPT" ]; then
            wpe_receipt_args=(--wpe-adoption-receipt /work/wpe-adoption.json --wpe-adoption-sha256 "$WPE_ADOPTION_SHA256")
          fi
          native_receipt_args=()
          if [ -n "$NATIVE_BUILDER_RECEIPT" ]; then
            native_receipt_args=(--native-builder-receipt /work/native-builder.json --native-builder-sha256 "$NATIVE_BUILDER_SHA256")
          elif [ -n "$NATIVE_BUILDER_SHA256" ]; then
            echo 'native builder digest requires receipt' >&2; exit 1
          fi
          # These volumes and privileges exist only in the disposable Kata CI
          # guest. No physical disk, TPM, host directory or Docker socket is mounted.
          docker create --name "$name" --privileged --memory=9g --memory-swap=9g \
            --mount "type=volume,src=$name-work,dst=/work" \
            --mount "type=volume,src=$name-storage,dst=/var/lib/containers" \
            --mount "type=volume,src=$name-cache-secrets,dst=/run/tilo-cache-secrets" \
            --env SCCACHE_ENDPOINT --env SCCACHE_BUCKET --env SCCACHE_REGION \
            --env SCCACHE_S3_USE_SSL --env SCCACHE_S3_KEY_PREFIX \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env REGISTRY_AUTH_FILE=/registry-auth.json \
            "$name:tools" --mode "$COMPILE_MODE" --wpe "$WPE_CANDIDATE" --generation "$TEST_GENERATION" \
              --hardware-profile "$HARDWARE_PROFILE" --firmware-candidate "$FIRMWARE_CANDIDATE" \
              --firmware-manifest-sha256 "$FIRMWARE_MANIFEST_SHA256" \
              --architecture "$ARCHITECTURE" --kernel-candidate "$KERNEL_CANDIDATE" \
              --rpms-candidate "$RPMS_CANDIDATE" --builder-candidate "$BUILDER_CANDIDATE" \
              --fex-payload-candidate "$FEX_PAYLOAD_CANDIDATE" --windows-guest-candidate "$WINDOWS_GUEST_CANDIDATE" \
              "${wpe_receipt_args[@]}" \
              "${native_receipt_args[@]}" \
              --revision "$GITHUB_SHA" --branch "$GITHUB_REF"
          docker cp . "$name:/work/repo"
          docker cp "$context/wpe-stage.json" "$name:/work/wpe-stage.json"
          docker cp "$context/wpe-adoption.json" "$name:/work/wpe-adoption.json"
          docker cp "$context/native-builder.json" "$name:/work/native-builder.json"
          docker cp "$cache_secrets/." "$name:/run/tilo-cache-secrets/"
          python3 - "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "$context/registry-auth.json" <<'PY'
          import json, os, sys
          registry = 'code.podesta.ai'
          credentials = json.load(open(sys.argv[1]))['auths'][registry]
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              json.dump({'auths': {registry: credentials}}, stream)
          PY
          docker cp "$context/registry-auth.json" "$name:/registry-auth.json"
          docker start --attach "$name"
          # Docker attach does not establish the container's exit status.
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Retain public compilation evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: provisional-os-compilation-${{ inputs.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/provisional-evidence/
          if-no-files-found: warn
          retention-days: 14
