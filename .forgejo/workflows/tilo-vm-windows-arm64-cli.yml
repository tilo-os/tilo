name: CI / Windows ARM64 tilo-vm CLI

# Produce the native development CLI once in CI so Windows ARM64 hosts can
# download it and iterate with WHPX without setting up a Rust build tree.
on:
  workflow_dispatch:

env:
  # The compiler cache belongs to this repository: its key is a repository
  # secret, not runner environment, because the runners serve every repository.
  SCCACHE_BUCKET: tilo-ci-sccache-125650147312-us-west-2
  SCCACHE_REGION: us-west-2
  SCCACHE_ENDPOINT: https://s3.us-west-2.amazonaws.com
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_S3_KEY_PREFIX: forgejo-runners/v1
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

jobs:
  cli:
    runs-on: runner-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the Windows ARM64 cross toolchain
        uses: ./.forgejo/actions/setup-windows-arm64-cross
      - name: Cross-build tilo-vm for Windows ARM64
        run: |
          set -euo pipefail
          cargo xwin build -p tilo-vm --locked --release --target aarch64-pc-windows-msvc
      - name: Verify CLI unit tests
        run: |
          set -euo pipefail
          cargo test -p tilo-vm --locked --lib
      - name: Package exact-source CLI
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/aarch64-pc-windows-msvc/release/tilo-vm.exe out/tilo-vm.exe
          (cd out && sha256sum tilo-vm.exe > tilo-vm.exe.sha256)
          printf '%s\n' "$GITHUB_SHA" > out/source-commit.txt
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: tilo-vm-windows-arm64-${{ github.sha }}
          path: out/
          if-no-files-found: error
      - name: Report compiler cache effectiveness
        if: always()
        continue-on-error: true
        run: bash tools/ci/sccache.sh report
