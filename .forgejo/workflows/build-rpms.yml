name: Build / RPM snapshot

# Builds, signs and tags the frozen RPM repo as
# registry.tilo.so/tilo/rpms:set-<fingerprint>, where the fingerprint is the
# content address of both architectures' package sets, BASE_REF, and the files
# that shape the snapshot. Exits early when that tag already resolves. Runs
# standalone on relevant main pushes or explicit dispatch. Forgejo v13 does not
# supply OIDC credentials to expanded reusable jobs, so signing must stay here.
# There is no hand-kept pin file and no pin pull request.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - os/Containerfile
      - os/base-snapshot.env
      - os/Containerfile.rpms
      - os/dev/verify-rpm-snapshot-signatures.sh
      - os/scripts/verify-no-cisco-openh264.sh
      - os/dev/layer-rpm-snapshot.py
      - os/dev/rpm-snapshot-fingerprint.py
      - os/dev/resolve-rpm-snapshot.sh
      - os/dev/ensure-base-mirror.sh
      - os/external-assets/github-assets.tsv
      - os/dev/cache-github-assets.sh
      - os/dev/derive-rpm-package-set.py
      - keys/cosign.pub
      - os/dev/promote-native-index.py
      - os/dev/install-cached-cosign.sh
      - os/dev/configure-cosign-kms.sh
      - os/dev/require-cosign-authority.sh
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/actions/cache-github-assets/**"
      - os/Containerfile.dev
      - os/Containerfile.host
      - os/dev/composefs/Containerfile
      - os/containers/tilo-relay/Containerfile
      - os/Containerfile.env-runtime
      - os/dev/uki-tools.packages
      - .forgejo/workflows/build-rpms.yml

concurrency:
  # Serialize by fingerprint so concurrent create attempts for the same set
  # cannot race the tag; unrelated fingerprints may still overlap.
  group: snapshot-rpms-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.sha }}
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
      tag: ${{ steps.fp.outputs.tag }}
      exists: ${{ steps.fp.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install registry tools
        run: |
          if ! command -v skopeo >/dev/null; then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends skopeo
            else
              sudo -n dnf install -y skopeo
            fi
          fi
      - name: Ensure the digest-pinned base is mirrored
        run: ./os/dev/ensure-base-mirror.sh
      - name: Compute the package-set fingerprint
        id: fp
        run: |
          set -euo pipefail
          fingerprint="$(python3 os/dev/rpm-snapshot-fingerprint.py)"
          tag="$(python3 os/dev/rpm-snapshot-fingerprint.py --format tag)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ./os/dev/resolve-rpm-snapshot.sh --exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::frozen RPM snapshot already published as $tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no published snapshot for $tag; create when on main"
          fi

  signing-preflight:
    needs: fingerprint
    if: >-
      needs.fingerprint.outputs.exists != 'true'
      && github.ref == 'refs/heads/main'
    runs-on: runner-quality
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Require non-exportable snapshot signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: os/dev/require-cosign-authority.sh

  snapshot:
    needs: [fingerprint, signing-preflight]
    if: >-
      needs.fingerprint.outputs.exists != 'true'
      && github.ref == 'refs/heads/main'
    enable-openid-connect: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner
          - arch: aarch64
            platform: linux/arm64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Install and check native snapshot host tools
        run: |
          set -euo pipefail
          missing=()
          for tool in skopeo jq curl; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if ((${#missing[@]})); then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends "${missing[@]}"
            elif command -v dnf >/dev/null; then
              sudo -n dnf install -y "${missing[@]}"
            else
              printf 'no supported package manager for missing snapshot tools: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi
          for tool in skopeo jq curl python3 docker base64 sha256sum; do
            command -v "$tool" >/dev/null || { printf 'snapshot host lacks %s\n' "$tool" >&2; exit 1; }
          done
          docker info >/dev/null || { echo 'snapshot host has no working Docker daemon' >&2; exit 1; }

      - name: Materialize checksum-verified external build inputs
        uses: ./.forgejo/actions/cache-github-assets
        with:
          key: github-assets-all-v1

      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure the digest-pinned base is mirrored
        run: ./os/dev/ensure-base-mirror.sh

      - name: Load BASE_REF (mirrored Fedora bootc base)
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Derive the package set from the Containerfiles
        run: |
          pkgs=$(./os/dev/derive-rpm-package-set.py --arch '${{ matrix.arch }}' | tr '\n' ' ')
          test -n "$pkgs"
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "packages: $pkgs"

      - name: Set up buildx for native snapshot construction
        uses: ./.forgejo/actions/setup-buildx

      - name: Build + push the frozen RPM repo image
        id: rpms
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.rpms
          platforms: ${{ matrix.platform }}
          push: true
          tags: registry.tilo.so/tilo/rpms:native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
            PACKAGES=${{ env.PACKAGES }}
          provenance: false

      - name: Install checksum-pinned Cosign
        run: ./os/dev/install-cached-cosign.sh

      - name: Sign and describe the native repository
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          CHILD_ARCH: ${{ matrix.arch }}
          CHILD_DIGEST: ${{ steps.rpms.outputs.digest }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          cosign sign --yes --key "$COSIGN_KEY_REF" "registry.tilo.so/tilo/rpms@${CHILD_DIGEST}"
          mkdir -p native-child
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("native-child/child.json").write_text(json.dumps({
              "architecture": os.environ["CHILD_ARCH"],
              "digest": os.environ["CHILD_DIGEST"],
              "sourceRevision": os.environ["GITHUB_SHA"],
          }))
          PY

      - name: Upload the native child descriptor
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: rpms-native-${{ matrix.arch }}
          path: native-child/
          if-no-files-found: error

  promote-snapshot:
    needs: [fingerprint, snapshot]
    if: >-
      needs.fingerprint.outputs.exists != 'true'
      && github.ref == 'refs/heads/main'
    runs-on: runner
    timeout-minutes: 30
    enable-openid-connect: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Exit early when another run already published this fingerprint
        run: |
          set -euo pipefail
          if ./os/dev/resolve-rpm-snapshot.sh --exists; then
            echo "::notice::fingerprint tag appeared while natives built; skipping promote"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Download native child descriptors
        if: env.skip != 'true'
        uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: native-children

      - name: Log in to registry.tilo.so
        if: env.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install publication tools
        if: env.skip != 'true'
        run: |
          ./os/dev/install-cached-cosign.sh
          if command -v apt-get >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends podman skopeo
          else
            sudo -n dnf install -y podman skopeo
          fi

      - name: Verify and promote the complete native index
        if: env.skip != 'true'
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          FINGERPRINT_TAG: ${{ needs.fingerprint.outputs.tag }}
        run: |
          set -euo pipefail
          . os/dev/configure-cosign-kms.sh
          storage="$(mktemp -d "$RUNNER_TEMP/tilo-rpm-manifests.XXXXXX")"
          trap 'rm -rf -- "$storage"; rm -f -- "${AWS_WEB_IDENTITY_TOKEN_FILE:-}"' EXIT
          export CONTAINERS_STORAGE_CONF="$storage/storage.conf"
          printf '[storage]\ndriver = "vfs"\ngraphroot = "%s/graph"\nrunroot = "%s/run"\n' \
            "$storage" "$storage" > "$CONTAINERS_STORAGE_CONF"
          [[ "$FINGERPRINT_TAG" =~ ^set-[0-9a-f]{64}$ ]]
          python3 os/dev/promote-native-index.py \
            --repository registry.tilo.so/tilo/rpms --tag "$FINGERPRINT_TAG" \
            --revision "$GITHUB_SHA" --descriptors native-children \
            --signing-key "$COSIGN_KEY_REF" --output rpms-index.txt
          echo "RPMS_REF=$(cat rpms-index.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up buildx for index inspection
        if: env.skip != 'true'
        uses: ./.forgejo/actions/setup-buildx

      - name: Attest and verify the native snapshot index
        if: env.skip != 'true'
        id: attest
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          FINGERPRINT_TAG: ${{ needs.fingerprint.outputs.tag }}
        run: |
          set -euo pipefail
          ref="$(cat rpms-index.txt)"
          platforms="$(docker buildx imagetools inspect --raw "$ref" | jq -c \
            '[.manifests[].platform | {os,architecture}] | sort_by(.architecture)')"
          expected='[{"os":"linux","architecture":"amd64"},{"os":"linux","architecture":"arm64"}]'
          [ "$platforms" = "$expected" ] || {
            echo "::error::frozen RPM index does not contain exactly amd64 and arm64: $platforms"
            exit 1
          }
          . os/dev/configure-cosign-kms.sh
          source os/base-snapshot.env
          python3 os/dev/derive-rpm-package-set.py --arch x86_64 | sort -u > package-roots-amd64.txt
          python3 os/dev/derive-rpm-package-set.py --arch aarch64 | sort -u > package-roots-arm64.txt
          package_set_sha256="$(cat package-roots-amd64.txt package-roots-arm64.txt | sort -u | sha256sum | cut -d' ' -f1)"
          package_amd64_sha256="$(sha256sum package-roots-amd64.txt | cut -d' ' -f1)"
          package_arm64_sha256="$(sha256sum package-roots-arm64.txt | cut -d' ' -f1)"
          digest="${ref##*@}"
          jq -n --arg source "git+ssh://code.tilo.so/tilo/tilo@$GITHUB_SHA" \
            --arg digest "$digest" --arg base "$BASE_REF" \
            --arg package_amd64_sha256 "$package_amd64_sha256" --arg package_arm64_sha256 "$package_arm64_sha256" \
            --arg package_set_sha256 "$package_set_sha256" '
              {
                buildDefinition: {
                  buildType: "https://tilo.sh/buildtypes/frozen-rpm-index/v1",
                  externalParameters: {
                    architectures: ["amd64", "arm64"],
                    packageSetSha256: $package_set_sha256,
                    packageSetSha256ByArchitecture: {amd64: $package_amd64_sha256, arm64: $package_arm64_sha256}
                  },
                  internalParameters: {expectedReleaseDigest: $digest},
                  resolvedDependencies: [{uri: $source}, {uri: $base}]
                },
                runDetails: {
                  builder: {id: "https://code.tilo.so/tilo/forgejo/actions/rpm-snapshot-v1"},
                  metadata: {invocationId: env.GITHUB_RUN_ID}
                }
              }
            ' > rpm-provenance.json
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign attest --yes --key "$COSIGN_KEY_REF" --type slsaprovenance1 \
            --predicate rpm-provenance.json "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          provenance="$(cosign verify-attestation --key keys/cosign.pub \
            --type slsaprovenance1 "$ref")"
          printf '%s' "$provenance" | jq -e --arg digest "$digest" \
            --arg base "$BASE_REF" --arg package_amd64_sha256 "$package_amd64_sha256" --arg package_arm64_sha256 "$package_arm64_sha256" \
            --arg package_set_sha256 "$package_set_sha256" '
              [(if type == "array" then .[] else . end) | .payload | @base64d | fromjson | .predicate]
              | any(
                  .buildDefinition.buildType == "https://tilo.sh/buildtypes/frozen-rpm-index/v1"
                  and .buildDefinition.externalParameters.architectures == ["amd64", "arm64"]
                  and .buildDefinition.externalParameters.packageSetSha256 == $package_set_sha256
                  and .buildDefinition.externalParameters.packageSetSha256ByArchitecture == {amd64: $package_amd64_sha256, arm64: $package_arm64_sha256}
                  and .buildDefinition.internalParameters.expectedReleaseDigest == $digest
                  and any(.buildDefinition.resolvedDependencies[]?; .uri == $base)
                )
            ' >/dev/null
          # Tag only if still absent — another creator may have won the race.
          if ./os/dev/resolve-rpm-snapshot.sh --exists; then
            echo "::notice::fingerprint tag already present; leaving published digest $ref"
          else
            skopeo copy --all --preserve-digests \
              "docker://$ref" "docker://registry.tilo.so/tilo/rpms:$FINGERPRINT_TAG"
          fi
          resolved="$(./os/dev/resolve-rpm-snapshot.sh)"
          echo "::notice::Frozen RPM repo published: RPMS_REF=$resolved"
          {
            echo '## Frozen RPM repo published'
            echo ""
            echo "Fingerprint tag \`$FINGERPRINT_TAG\` resolves to:"
            echo ""
            echo '```'
            echo "RPMS_REF=$resolved"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  resolve:
    needs: [fingerprint, promote-snapshot]
    if: >-
      always()
      && needs.fingerprint.result == 'success'
      && (
        needs.fingerprint.outputs.exists == 'true'
        || needs.promote-snapshot.result == 'success'
      )
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      rpms_ref: ${{ steps.resolve.outputs.rpms_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install verification tools
        run: |
          ./os/dev/install-cached-cosign.sh
          if ! command -v skopeo >/dev/null || ! command -v jq >/dev/null; then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends skopeo jq
            else
              sudo -n dnf install -y skopeo jq
            fi
          fi
      - name: Resolve the fingerprint tag to a verified digest
        id: resolve
        run: ./os/dev/resolve-rpm-snapshot.sh
