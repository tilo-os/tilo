# Explicit resource diagnostic only; never replaces current-head or main SDK gates.
name: CI / bounded release web native envelope
on:
  workflow_dispatch:
    inputs:
      memory_gib:
        description: 'Enforced job memory; identical release web build commands in both cases.'
        type: choice
        default: '22'
        options: ['22', '36']

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # The browser runtime pins wasm-bindgen; the CLI must match it exactly.
  WASM_BINDGEN_VERSION: "0.2.108"

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      memory: ${{ steps.envelope.outputs.memory }}
    steps:
      - name: Validate fixed diagnostic memory limit
        id: envelope
        env:
          REQUESTED_MEMORY: ${{ github.event.inputs.memory_gib }}
        run: |
          case "$REQUESTED_MEMORY" in
            22|36) printf 'memory=%s\n' "$REQUESTED_MEMORY" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unsupported diagnostic memory limit' >&2; exit 2 ;;
          esac
      - name: Checkout public-trust context fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the CI builder before starting job containers
        id: resolve
        env:
          REQUESTED_BUILDER: ${{ github.event.inputs.builder_image }}
        run: python3 tools/ci/resolve_builder.py
      - name: Verify named public-trust contexts with Docker BuildKit
        env:
          DOCKER_BUILDKIT: "1"
        run: bash os/tests/named_public_trust_context.sh docker

  bundle:
    needs: [builder]
    runs-on: runner-large-arm64
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
      options: --memory=${{ needs.builder.outputs.memory }}g --memory-swap=${{ needs.builder.outputs.memory }}g --cpus=24
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Verify native release build runner architecture
        env:
          EXPECTED_ARCH: aarch64
        run: bash os/dev/assert-native-arch.sh "$EXPECTED_ARCH"
      - name: Prohibit swap within this diagnostic job
        run: >-
          python3 tools/ci/qualify_native_envelope.py prepare
          --memory-gib ${{ needs.builder.outputs.memory }} --cpus 24
          --state "$RUNNER_TEMP/release-envelope-before.json"
      - name: Observe enforced native envelope before compilation
        run: >-
          python3 tools/ci/qualify_native_envelope.py before
          --memory-gib ${{ needs.builder.outputs.memory }} --cpus 24
          --state "$RUNNER_TEMP/release-envelope-before.json"
      - name: Web toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
      - name: Build tilo-app
        run: bash tools/ci/measure.sh "SDK release web tool build" -- cargo build --locked -p tilo-app-cli --bin tilo-app
      - name: Release desktop bundle within its size budget
        run: |
          bash tools/ci/measure.sh "SDK release desktop bundle build" -- \
            target/debug/tilo-app build --target web --bundle desktop --release apps/calculator
          python3 tools/web/wasm_size_ratchet.py measure desktop target/tilo-app/web/calculator/bundle
      - name: Stage exact release private image worker
        run: |
          python3 - "$RUNNER_TEMP/release-compute" <<'PY'
          import hashlib, json, pathlib, sys
          product = pathlib.Path('target/tilo-app/web/calculator/bundle')
          output = pathlib.Path(sys.argv[1])
          output.mkdir()
          hashes = {}
          for name in ('compute-worker.mjs', 'compute-domains.mjs', 'compute-protocol.mjs',
                       'pkg/compute/tilo_browser_compute.js', 'pkg/compute/tilo_browser_compute_bg.wasm'):
              data = (product / name).read_bytes()
              destination = output / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              hashes[name] = hashlib.sha256(data).hexdigest()
              assert hashlib.sha256(destination.read_bytes()).hexdigest() == hashes[name], name
          (output / 'sha256.json').write_text(json.dumps(hashes, sort_keys=True) + '\n')
          PY
      - name: Upload exact release private image worker
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: app-sdk-release-compute
          path: ${{ runner.temp }}/release-compute
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true
      - name: Qualify enforced native envelope after release packaging
        if: always()
        run: >-
          python3 tools/ci/qualify_native_envelope.py after
          --memory-gib ${{ needs.builder.outputs.memory }} --cpus 24
          --state "$RUNNER_TEMP/release-envelope-before.json"

  browser:
    needs: [builder, bundle]
    # Keep Chromium on the same existing x86 environment and budget.
    runs-on: runner
    timeout-minutes: 30
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Headless Chromium for Testing
        run: |
          command -v node || dnf install -y nodejs
          # Chrome's shared-library dependencies; present on current builders.
          dnf install -y nss atk at-spi2-atk cups-libs libdrm libXcomposite libXdamage \
            libXrandr mesa-libgbm pango alsa-lib libxkbcommon || true
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Download exact release private image worker
        uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: app-sdk-release-compute
          path: ${{ runner.temp }}/release-compute-downloaded
      - name: Qualify exact release private image worker
        run: |
          python3 - "$RUNNER_TEMP/release-compute-downloaded" <<'PY'
          import hashlib, json, pathlib, sys
          product = pathlib.Path(sys.argv[1])
          names = {'compute-worker.mjs', 'compute-domains.mjs', 'compute-protocol.mjs',
                   'pkg/compute/tilo_browser_compute.js', 'pkg/compute/tilo_browser_compute_bg.wasm'}
          hashes = json.loads((product / 'sha256.json').read_text())
          assert set(hashes) == names, 'incomplete release worker manifest'
          for name in names:
              assert hashlib.sha256((product / name).read_bytes()).hexdigest() == hashes[name], name
          PY
          node crates/browser/tilo-browser-compute/scripts/qualify-packaged.mjs \
            "$RUNNER_TEMP/release-compute-downloaded" "$RUNNER_TEMP/compute-qualification" --no-sandbox
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: app-sdk-compute-qualification
          path: ${{ runner.temp }}/compute-qualification/qualification.json
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report || true
