name: Perf / room host capacity

# What a public room host holds and what one collaborator on it costs: the
# room-load bench (crates/dev/room-load) ramps guests and spectators against
# a room host on one runner of known size, and tools/perf/room_capacity.py
# derives MiB per guest and per spectator, guests per vCPU, egress, the
# host's footprint at the deployed caps and the price of 100 concurrent
# guests per node of tools/perf/prices.toml. A run is recorded in
# docs/benchmarks/room-host-capacity-2026-10.md; the nightly guards the
# 300-guest point (perf-scheduled.yml, `hosting-room`).
#
# Manual dispatch only: a sweep holds a 12-CPU runner for about half an hour,
# and nothing about a pull request needs it. Never point it at a deployed
# host; the bench starts its own.
#
# Built as the room service image builds its relay (room-service-image.yml):
# thin LTO, 16 codegen units, the relay's agents feature.
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "full (the write-up's sweep), quick (300 guests), or a regex over the full plan's run names"
        required: false
        default: "full"

concurrency:
  group: perf-room-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  sweep:
    needs: [builder]
    # 12 CPUs and 32 GiB: the driver's guests and the host share it, and
    # the host must never be the one starved (the report says how many cores
    # each used).
    runs-on: runner-large
    timeout-minutes: 150
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the room load bench
        run: >-
          bash scripts/ci-run.sh "room load bench release build" --
          cargo build --locked --release -p tilo-room-load --features tilo-relay/agents

      - name: Describe the machine
        run: |
          set -euo pipefail
          mkdir -p capacity
          {
            echo "commit: $GITHUB_SHA"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo "cpus: $(nproc)"
            echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GiB"
            echo "kernel: $(uname -r)"
          } | tee capacity/machine.txt

      - name: Sweep
        env:
          PLAN: ${{ github.event.inputs.plan }}
        run: >-
          python3 tools/perf/room_capacity.py sweep --bin target/release/tilo-room-load
          --out capacity/runs --plan "${PLAN:-full}"

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          python3 tools/perf/room_capacity.py summarize capacity/runs \
            --json capacity/summary.json --markdown capacity/summary.md
          cat capacity/machine.txt capacity/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: room-capacity
          path: capacity/
          if-no-files-found: warn
