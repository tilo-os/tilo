name: Snapshot WPE buildroots

# This is the only CI boundary allowed to resolve WPE build dependencies from
# Fedora. It promotes signed, per-architecture immutable refs; OS release jobs
# consume those refs and cannot fall back to the network.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - os/Containerfile.wpe-buildroot
      - os/base-snapshot.env
      - os/external-assets/github-assets.tsv
      - os/dev/assert-native-arch.sh
      - os/dev/cache-github-assets.sh
      - os/dev/install-cached-cosign.sh
      - os/dev/acquire-wpe-snapshot-credentials.sh
      - keys/cosign.pub
      - .forgejo/workflows/snapshot-wpe-buildroot.yml

concurrency:
  group: snapshot-wpe-buildroot
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    enable-openid-connect: true
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the native runner architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"
      - name: Restore checksum-pinned Cosign
        id: cosign-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            cosign-v2.5.2-${{ matrix.arch }}-
      - name: Install checksum-pinned Cosign
        env:
          QOS_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Save checksum-pinned Cosign immediately
        if: steps.cosign-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-${{ matrix.arch }}-${{ hashFiles('os/external-assets/github-assets.tsv') }}
      - name: Load the mirrored Fedora base
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"
      - name: Acquire a short-lived base-image read lease
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER != ''
        env:
          WPE_SNAPSHOT_CREDENTIAL_BROKER: ${{ vars.WPE_SNAPSHOT_CREDENTIAL_BROKER }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh "resolve-${{ matrix.arch }}"
      - name: Use explicitly expiring static credentials to read the base image
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER == ''
        env:
          WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP: ${{ vars.WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP }}
          WPE_STATIC_BOOTSTRAP_EXPIRES_AT: ${{ vars.WPE_STATIC_BOOTSTRAP_EXPIRES_AT }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh "resolve-${{ matrix.arch }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve and build the native buildroot locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: os/Containerfile.wpe-buildroot
          push: false
          load: true
          provenance: false
          no-cache: true
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
          tags: code.sandbox.example/qos/qos-wpe-buildroot:${{ matrix.arch }}-${{ github.sha }}
      - name: Revoke the base-image read lease
        run: docker logout code.sandbox.example || true
      - name: Acquire a fresh short-lived publish and signing lease
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER != ''
        env:
          WPE_SNAPSHOT_CREDENTIAL_BROKER: ${{ vars.WPE_SNAPSHOT_CREDENTIAL_BROKER }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh "publish-${{ matrix.arch }}"
      - name: Renew explicitly expiring static credentials for bootstrap publication
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER == ''
        env:
          WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP: ${{ vars.WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP }}
          WPE_STATIC_BOOTSTRAP_EXPIRES_AT: ${{ vars.WPE_STATIC_BOOTSTRAP_EXPIRES_AT }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh "publish-${{ matrix.arch }}"
      - name: Publish and audit the immutable buildroot
        run: |
          set -euo pipefail
          tag="code.sandbox.example/qos/qos-wpe-buildroot:${{ matrix.arch }}-${{ github.sha }}"
          docker push "$tag"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          DIGEST="${digest_ref##*@}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="code.sandbox.example/qos/qos-wpe-buildroot@$DIGEST"
          actual_arch="$(docker run --rm --entrypoint cat "$ref" /usr/lib/qos/wpe-buildroot-arch)"
          test "$actual_arch" = '${{ matrix.arch }}'
          docker run --rm --entrypoint sh "$ref" -c \
            'test -s /usr/lib/qos/wpe-buildroot-packages.txt && ! find /etc/yum.repos.d -type f -print -quit | grep -q .'
          printf 'QOS_WPE_REF=%s\n' "$ref" >> "$GITHUB_ENV"
      - name: Sign through the non-exportable leased key
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER != ''
        run: |
          set -euo pipefail
          test -n "${QOS_WPE_SIGNER:-}"
          "$QOS_WPE_SIGNER" "$QOS_WPE_REF"
      - name: Sign with the explicitly expiring bootstrap key
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER == '' && vars.WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP == '1'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          WPE_STATIC_BOOTSTRAP_EXPIRES_AT: ${{ vars.WPE_STATIC_BOOTSTRAP_EXPIRES_AT }}
        run: |
          set -euo pipefail
          test "${QOS_WPE_STATIC_BOOTSTRAP:-}" = 1
          [[ "$WPE_STATIC_BOOTSTRAP_EXPIRES_AT" =~ ^[0-9]+$ ]]
          (( WPE_STATIC_BOOTSTRAP_EXPIRES_AT > $(date +%s) ))
          test -n "$COSIGN_PRIVATE_KEY" && test -n "$COSIGN_PASSWORD"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$QOS_WPE_REF"
      - name: Verify the signature and record the immutable reference
        run: |
          set -euo pipefail
          ref="$QOS_WPE_REF"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          mkdir -p refs
          case '${{ matrix.arch }}' in
            x86_64) key=WPE_BUILDROOT_X86_64_REF ;;
            aarch64) key=WPE_BUILDROOT_AARCH64_REF ;;
          esac
          printf '%s=%s\n' "$key" \
            "$ref" > "refs/${{ matrix.arch }}.env"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: wpe-buildroot-${{ matrix.arch }}
          path: refs/${{ matrix.arch }}.env
      - name: Revoke local registry credentials
        if: always()
        run: docker logout code.sandbox.example || true

  promote:
    needs: build
    runs-on: runner
    env:
      WPE_SNAPSHOT_INPUTS: |
        os/Containerfile.wpe-buildroot
        os/base-snapshot.env
        os/external-assets/github-assets.tsv
        os/dev/assert-native-arch.sh
        os/dev/cache-github-assets.sh
        os/dev/install-cached-cosign.sh
        os/dev/acquire-wpe-snapshot-credentials.sh
        keys/cosign.pub
        .forgejo/workflows/snapshot-wpe-buildroot.yml
    permissions:
      contents: write
      id-token: write
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Restore checksum-pinned Cosign
        id: cosign-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-x86_64-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            cosign-v2.5.2-x86_64-
      - name: Install checksum-pinned Cosign
        env:
          QOS_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Save checksum-pinned Cosign immediately
        if: steps.cosign-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-x86_64-${{ hashFiles('os/external-assets/github-assets.tsv') }}
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: refs
      - name: Acquire a short-lived registry lease
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER != ''
        env:
          WPE_SNAPSHOT_CREDENTIAL_BROKER: ${{ vars.WPE_SNAPSHOT_CREDENTIAL_BROKER }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh promote
      - name: Use an explicitly expiring static registry credential for initial bootstrap
        if: vars.WPE_SNAPSHOT_CREDENTIAL_BROKER == ''
        env:
          WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP: ${{ vars.WPE_ALLOW_STATIC_CREDENTIAL_BOOTSTRAP }}
          WPE_STATIC_BOOTSTRAP_EXPIRES_AT: ${{ vars.WPE_STATIC_BOOTSTRAP_EXPIRES_AT }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: os/dev/acquire-wpe-snapshot-credentials.sh promote
      - name: Verify signatures and advance both architecture pins atomically
        run: |
          set -euo pipefail
          x86="$(find refs -type f -name x86_64.env -print -quit)"
          arm="$(find refs -type f -name aarch64.env -print -quit)"
          test -n "$x86" && test -n "$arm"
          . "$x86"
          . "$arm"
          for ref in "$WPE_BUILDROOT_X86_64_REF" "$WPE_BUILDROOT_AARCH64_REF"; do
            [[ "$ref" =~ ^code\.podesta\.ai/qos/qos-wpe-buildroot@sha256:[0-9a-f]{64}$ ]]
            cosign verify --key keys/cosign.pub "$ref" >/dev/null
          done
          git fetch --no-tags origin main
          mapfile -t snapshot_inputs < <(printf '%s' "$WPE_SNAPSHOT_INPUTS")
          if ! git diff --quiet "$GITHUB_SHA..origin/main" -- "${snapshot_inputs[@]}"; then
            printf 'WPE buildroot inputs changed after this run started; refusing stale promotion\n' >&2
            exit 1
          fi
          printf '%s\n' \
            '# Per-architecture WPE buildroots, signed and pinned by digest.' \
            '# Updated only by snapshot-wpe-buildroot.yml.' \
            "WPE_BUILDROOT_X86_64_REF=$WPE_BUILDROOT_X86_64_REF" \
            "WPE_BUILDROOT_AARCH64_REF=$WPE_BUILDROOT_AARCH64_REF" \
            > os/wpe-buildroot-snapshot.env
          git config user.name 'qOS CI'
          git config user.email 'ci@qos.invalid'
          git add os/wpe-buildroot-snapshot.env
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'os: refresh WPE buildroot snapshots'
          git pull --rebase origin main
          if ! git diff --quiet "$GITHUB_SHA..origin/main" -- "${snapshot_inputs[@]}"; then
            printf 'WPE buildroot inputs changed during promotion; refusing stale push\n' >&2
            exit 1
          fi
          git push origin HEAD:main
      - name: Revoke local registry credentials
        if: always()
        run: docker logout code.sandbox.example || true
