name: Mirror the Fedora bootc base

# Copies the upstream Fedora bootc base into code.podesta.ai and prints the
# digest to pin. Sibling of snapshot-rpms: that job freezes the package set,
# this one freezes the base underneath it — together they are what makes a
# rebuild months later produce the same image.
#
# Why mirror at all: Fedora rebuilds the fedora-bootc tag daily and garbage-
# collects the manifest it replaces almost immediately, so a
# `FROM quay.io/fedora/fedora-bootc@sha256:…` pin stops resolving after about a
# day ("manifest unknown") and every image build fails at its first FROM. Our
# registry collects nothing, so the pin stays real.
#
# Manual dispatch: refreshing the base must be a deliberate act, not drift. The
# job prints the new BASE_REF; commit it to os/base-snapshot.env (a normal
# PR/commit) and every image build picks it up.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: runner
    container:
      image: quay.io/fedora/fedora:44
    steps:
      # The runner image ships neither skopeo nor node (which actions/checkout
      # needs) — same bootstrap as check.yml.
      - name: Install skopeo (+ node for checkout, jq for the guards)
        run: |
          dnf install -y skopeo jq nodejs git \
            && dnf clean all

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      # The upstream tag we track lives next to the pin it produces, so bumping
      # Fedora major is one edit in one file. Only the BASE_SOURCE= line —
      # $GITHUB_ENV has no comment syntax, so the file's leading `#` lines
      # would corrupt the env (the same trap RPMS_REF hit).
      - name: Read the upstream base tag we track
        run: grep '^BASE_SOURCE=' os/base-snapshot.env >> "$GITHUB_ENV"

      - name: Log in to the code.podesta.ai registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASS" | skopeo login \
            --username "$REGISTRY_USER" --password-stdin \
            --authfile /tmp/mirror-auth.json \
            code.podesta.ai

      - name: Copy the base image (multi-arch index preserved)
        run: |
          set -euo pipefail
          # --all copies the whole manifest list rather than just this runner's
          # architecture, so an arm64 build still has a base to build on.
          # --preserve-digests refuses to re-compress anything, so the mirrored
          # index is byte-identical to what Fedora published and its digest is
          # the digest Fedora published — the mirror adds durability, not a new
          # artifact to trust. --retry-times rides out the transient DNS/TLS
          # blips a ~1 GB four-architecture push hits on the runner; a
          # half-copied image would otherwise leave a tag that resolves but is
          # missing blobs.
          dst="code.podesta.ai/qos/fedora-bootc:${BASE_SOURCE##*:}-$(date -u +%Y%m%d)"
          skopeo copy --all --preserve-digests --retry-times 5 \
            --dest-authfile /tmp/mirror-auth.json \
            "docker://$BASE_SOURCE" "docker://$dst"
          echo "MIRROR_TAG=$dst" >> "$GITHUB_ENV"
          echo "mirrored $BASE_SOURCE -> $dst"

      - name: Verify the mirror resolves, is an index, and is the Fedora we track
        run: |
          set -euo pipefail
          skopeo inspect --raw --authfile /tmp/mirror-auth.json \
            "docker://$MIRROR_TAG" > /tmp/base-index.json
          digest="$(skopeo manifest-digest /tmp/base-index.json)"

          # Flattening to one architecture would silently strip arm64 from the
          # base, so assert the mirrored reference is still the index.
          media="$(jq -r '.mediaType' /tmp/base-index.json)"
          case "$media" in
            application/vnd.oci.image.index.v1+json) ;;
            application/vnd.docker.distribution.manifest.list.v2+json) ;;
            *) echo "::error::mirrored base is a single manifest ($media), not a multi-arch index"; exit 1 ;;
          esac
          arches="$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' /tmp/base-index.json)"
          case " $arches " in
            *" amd64 "*) ;;
            *) echo "::error::no amd64 manifest in the mirrored index (got: $arches)"; exit 1 ;;
          esac

          # A silent Fedora major bump would be worse than the stale pin this
          # job exists to fix, so assert the release BASE_SOURCE claims — read
          # back through the digest we are about to publish, not the tag.
          want="fc${BASE_SOURCE##*:}"
          osver="$(skopeo inspect --no-tags --authfile /tmp/mirror-auth.json \
            "docker://code.podesta.ai/qos/fedora-bootc@${digest}" \
            | jq -r '.Labels["ostree.linux"] // ""')"
          case "$osver" in
            *"$want"*) ;;
            *) echo "::error::mirrored base reports ostree.linux='$osver' — expected $want (BASE_SOURCE=$BASE_SOURCE)"; exit 1 ;;
          esac

          echo "BASE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BASE_ARCHES=$arches" >> "$GITHUB_ENV"
          echo "BASE_OSTREE_LINUX=$osver" >> "$GITHUB_ENV"
          echo "digest=$digest arches=$arches ostree.linux=$osver"

      - name: Report the pinned BASE_REF to commit
        run: |
          ref="code.podesta.ai/qos/fedora-bootc@${BASE_DIGEST}"
          echo "::notice::Base image mirrored. Set os/base-snapshot.env to: BASE_REF=$ref"
          {
            echo "## Base image mirrored"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`$BASE_SOURCE\` |"
            echo "| mirror tag | \`$MIRROR_TAG\` |"
            echo "| architectures | \`$BASE_ARCHES\` |"
            echo "| \`ostree.linux\` | \`$BASE_OSTREE_LINUX\` |"
            echo ""
            echo 'Commit this to `os/base-snapshot.env`:'
            echo ""
            echo '```'
            echo "BASE_REF=$ref"
            echo '```'
            echo ""
            echo 'Then re-run `snapshot-rpms` against the new base and commit the RPMS_REF it prints.'
          } >> "$GITHUB_STEP_SUMMARY"
