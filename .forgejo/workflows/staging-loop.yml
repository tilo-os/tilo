name: CI / imager staging loop device

# Destructive loopback proof of the USB-free staging helper (design spec
# 2026-09-22-usb-free-install §9): a debug imager stages a synthetic bundle onto
# a sparse loop disk with a fake efivarfs directory, is killed mid write-root,
# resumes, and removes everything again byte-for-byte. It needs root and loop
# devices, which only the privileged disposable disk runner provides, so it
# runs only when the staging code, its installer counterparts or the bundle
# exporter change.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/imager/src/setup/staging/**"
      - "apps/imager/src/setup/internal_bundle.rs"
      - "apps/imager/src/release.rs"
      - "os/usr/libexec/tilo-staging-*"
      - "os/dev/internal-bundle.py"
      - "os/tests/staging_helper_loop.sh"
      - "os/tests/staging_reclaim_loop.sh"
      - ".forgejo/workflows/staging-loop.yml"
  push:
    branches: ["main", "codex/usb-free-install"]
    paths:
      - "apps/imager/src/setup/staging/**"
      - "apps/imager/src/setup/internal_bundle.rs"
      - "apps/imager/src/release.rs"
      - "os/usr/libexec/tilo-staging-*"
      - "os/dev/internal-bundle.py"
      - "os/tests/staging_helper_loop.sh"
      - "os/tests/staging_reclaim_loop.sh"
      - ".forgejo/workflows/staging-loop.yml"
  workflow_dispatch:

concurrency:
  group: staging-loop-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HOME: /cargo-home
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Resolve the CI builder
        id: resolve
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 tools/ci/resolve_builder.py

  loop:
    needs: [builder]
    runs-on: runner-disk-100g
    timeout-minutes: 60
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
      # Privilege applies inside the disposable Kata guest only: loop devices
      # and partition ioctls for a sparse file. No host disk is mounted.
      options: --privileged
    steps:
      - name: Checkout exact change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 1

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Ensure loop-test tools
        run: |
          missing=()
          command -v mkfs.vfat >/dev/null || missing+=(dosfstools)
          command -v mcopy >/dev/null || missing+=(mtools)
          command -v sfdisk >/dev/null || missing+=(util-linux)
          if [ "${#missing[@]}" -gt 0 ]; then dnf install -y "${missing[@]}"; fi

      - name: Build the debug imager (test seams enabled)
        run: cargo build --locked -p imager --bin imager

      - name: Staging helper loopback proof
        env:
          IMAGER: ${{ github.workspace }}/target/debug/imager
        run: bash os/tests/staging_helper_loop.sh

      # The installed-system counterpart needs the same privileges and was not
      # run by any workflow; report it independently of the helper proof.
      - name: Staging reclaim loopback proof
        if: ${{ !cancelled() }}
        run: bash os/tests/staging_reclaim_loop.sh
