name: Development / ARM disk device probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: runner-disk-100g-arm64
    timeout-minutes: 10
    steps:
      - name: Probe guest FUSE, loop, and Podman mounts
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n modprobe fuse 2>/dev/null || true
          sudo -n modprobe loop 2>/dev/null || true
          sudo -n mount -t devtmpfs devtmpfs /dev
          sudo -n mkdir -p /dev/pts /dev/shm
          mountpoint -q /dev/pts || sudo -n mount -t devpts -o gid=5,mode=620,ptmxmode=666 devpts /dev/pts
          mountpoint -q /dev/shm || sudo -n mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          test -c /dev/fuse && test -c /dev/loop-control
          sudo -n chmod 0666 /dev/fuse
          python3 -c 'open("/dev/fuse", "rb").close()'
          sudo -n losetup --find
          export DEBIAN_FRONTEND=noninteractive
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends podman fuse-overlayfs e2fsprogs jq
          echo "default-podman=$(podman info --format json | jq -c '{driver:.store.graphDriverName,graphRoot:.store.graphRoot,graphOptions:.store.graphOptions,graphStatus:.store.graphStatus}')"
          echo "runner-temp-filesystem=$(findmnt -n -o FSTYPE -T "$RUNNER_TEMP")"
          context="$RUNNER_TEMP/tilo-storage-benchmark"
          mkdir -p "$context"
          head -c 268435456 /dev/urandom > "$context/payload"
          printf hello > "$context/hello"
          printf 'FROM scratch\nCOPY payload /payload\n' > "$context/Parentfile"
          benchmark() {
            local kind=$1 start elapsed
            printf 'FROM localhost/tilo-probe-parent:%s\nCOPY hello /hello\n' "$kind" > "$context/Childfile"
            podman build -q --file "$context/Parentfile" --tag "localhost/tilo-probe-parent:$kind" "$context"
            start=$(date +%s%3N)
            podman build -q --file "$context/Childfile" --tag "localhost/tilo-probe-child:$kind" "$context"
            elapsed=$(( $(date +%s%3N) - start ))
            echo "::notice::$kind parent=256MiB child COPY=5B child-build-ms=$elapsed"
          }
          benchmark default
          backing="$RUNNER_TEMP/tilo-native-overlay-probe.img"
          mount_dir="$RUNNER_TEMP/tilo-native-overlay-probe"
          loop=''
          cleanup() {
            sudo -n umount "$mount_dir" 2>/dev/null || true
            if [[ -n $loop ]]; then sudo -n losetup -d "$loop" 2>/dev/null || true; fi
            rm -f -- "$backing"
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          truncate -s 4G "$backing"
          sudo -n mkfs.ext4 -F -q "$backing"
          mkdir -p "$mount_dir"
          loop=$(sudo -n losetup --find --show "$backing")
          sudo -n mount -t ext4 "$loop" "$mount_dir"
          sudo -n chown "$(id -u):$(id -g)" "$mount_dir"
          printf '[storage]\ndriver="overlay"\ngraphroot="%s/graph"\nrunroot="%s/run"\n' \
            "$mount_dir" "$mount_dir" > "$mount_dir/storage.conf"
          export CONTAINERS_STORAGE_CONF="$mount_dir/storage.conf"
          echo "native-podman=$(podman info --format json | jq -c '{driver:.store.graphDriverName,graphRoot:.store.graphRoot,graphOptions:.store.graphOptions,graphStatus:.store.graphStatus}')"
          test "$(podman info --format json | jq -r .store.graphDriverName)" = overlay
          benchmark native
          echo '::notice::ARM disk runner supports Podman FUSE and loop nodes via guest devtmpfs'
