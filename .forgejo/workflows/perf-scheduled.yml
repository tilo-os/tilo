name: Perf / scheduled

# The scheduled performance lane: every KPI benchmark writes its
# results as records (tools/perf/record.py), compare.py checks them against
# the store's rolling baseline and tools/perf/kpi-budgets.toml, and the
# annotated records are appended to the store, the public generic package
# tilo-perf-results (tools/perf/store.py). docs/measurements/performance.md
# says how a benchmark joins.
#
# It is not a required check and never runs per push: wall-clock numbers
# from a pull request's shared runner would only be noise. Benchmarks consume
# artifacts that already exist (published tapps, images, release examples
# built once per night); the tilo-fs gate's debug test build is served by the
# compiler cache main's check runs fill.
#
# One job per benchmark group, each uploading its records as the artifact
# perf-<group>; a group must produce records whenever it is selected, or the
# comparison fails it as missing.
#
# `mode: ab` is the same-job A/B lane (#4078; DEVELOPMENT.md, "Proving a
# performance change"): instead of the nightly jobs, one `ab` job per selected
# group builds ab_base and ab_candidate in one checkout and runs that group's
# benchmark on both, alternating, ab_rounds times on one runner, through
# tools/perf/ab.py. It reports a paired verdict per KPI and writes nothing to
# the store. Manual dispatch only, like every run of this workflow outside the
# nightly schedule.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      kpis:
        description: "Comma-separated KPI groups to run (fs, footprint (app and OS image sizes), agent, latency, render, wakeups, search, hosting, browser, stream); empty runs all."
        required: false
        default: ""
      accept:
        description: "Comma-separated KPI ids (or all) whose values this run records as the new baseline start, for an intended change. Main only."
        required: false
        default: ""
      synthetic_series:
        description: "Gate test: tag this run's records as this synthetic series and multiply them by synthetic_factor. Synthetic records never enter a real baseline."
        required: false
        default: ""
      synthetic_factor:
        description: "Gate test: the factor applied to every percentile (1.25 is a 25 % regression)."
        required: false
        default: "1.0"
      mode:
        description: "scheduled: measure this commit against the store. ab: build ab_base and ab_candidate and run the kpis groups (required) interleaved in one job per group, for a paired verdict."
        type: choice
        options: [scheduled, ab]
        default: scheduled
      ab_base:
        description: "A/B: the base ref or commit."
        required: false
        default: "origin/main"
      ab_candidate:
        description: "A/B: the candidate ref or commit; empty is the dispatched commit."
        required: false
        default: ""
      ab_rounds:
        description: "A/B: rounds, each running both sides (at least 6 for a 95 % interval)."
        required: false
        default: "8"
      ab_relay_cpus:
        description: "A/B hosting: confine the relay to this many CPUs, as on a VM with that many vCPUs (empty: all, which gives it 4 workers). Both sides' bench must know --relay-cpus."
        required: false
        default: ""

concurrency:
  # compare.py reads the store's state and then appends to it; two runs at
  # once could both miss the other's pending regression. An A/B run never
  # touches the store, so it takes a group of its own and never queues behind
  # the nightly.
  group: perf-${{ github.event.inputs.mode == 'ab' && format('ab-{0}', github.run_id) || 'scheduled' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      ab_groups: ${{ steps.select.outputs.ab_groups }}
      groups: ${{ steps.select.outputs.groups }}
      fs: ${{ steps.select.outputs.fs }}
      footprint: ${{ steps.select.outputs.footprint }}
      agent: ${{ steps.select.outputs.agent }}
      latency: ${{ steps.select.outputs.latency }}
      render: ${{ steps.select.outputs.render }}
      wakeups: ${{ steps.select.outputs.wakeups }}
      search: ${{ steps.select.outputs.search }}
      hosting: ${{ steps.select.outputs.hosting }}
      browser: ${{ steps.select.outputs.browser }}
      stream: ${{ steps.select.outputs.stream }}
    steps:
      - name: Select KPI groups
        id: select
        env:
          KPIS: ${{ github.event.inputs.kpis }}
          MODE: ${{ github.event.inputs.mode }}
          AB_ROUNDS: ${{ github.event.inputs.ab_rounds }}
        run: |
          set -euo pipefail
          known=(fs footprint agent latency render wakeups search hosting browser stream)
          mode=${MODE:-scheduled}
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ $mode == ab ]]; then
            # tools/perf/ab.py GROUPS: every group that measures a build of
            # the repository (footprint measures published artifacts).
            ab_known=(fs agent latency render wakeups search hosting browser)
            [[ -n ${KPIS:-} ]] || { echo "::error::mode ab needs kpis: one or more of ${ab_known[*]}"; exit 1; }
            [[ ${AB_ROUNDS:-} =~ ^[0-9]+$ && $AB_ROUNDS -ge 6 ]] || { echo "::error::ab_rounds must be a number of at least 6"; exit 1; }
            IFS=, read -r -a selected <<< "$KPIS"
            for group in "${selected[@]}"; do
              [[ " ${ab_known[*]} " == *" $group "* ]] || { echo "::error::group '$group' has no A/B (A/B groups: ${ab_known[*]})"; exit 1; }
            done
            printf 'ab_groups=[%s]\n' "$(printf '"%s",' "${selected[@]}" | sed 's/,$//')" >> "$GITHUB_OUTPUT"
            echo "groups=" >> "$GITHUB_OUTPUT"
            for group in "${known[@]}"; do echo "$group=false" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # A placeholder, not an empty list: the skipped `ab` job's matrix is
          # still expanded, and an empty matrix is an error.
          echo 'ab_groups=["none"]' >> "$GITHUB_OUTPUT"
          IFS=, read -r -a selected <<< "${KPIS:-$(IFS=,; echo "${known[*]}")}"
          for group in "${selected[@]}"; do
            [[ " ${known[*]} " == *" $group "* ]] || { echo "::error::unknown KPI group '$group' (known: ${known[*]})"; exit 1; }
          done
          echo "groups=$(IFS=,; echo "${selected[*]}")" >> "$GITHUB_OUTPUT"
          for group in "${known[@]}"; do
            if [[ " ${selected[*]} " == *" $group "* ]]; then value=true; else value=false; fi
            echo "$group=$value" >> "$GITHUB_OUTPUT"
          done

  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  # The tilo-fs performance gate (crates/system/fs/tests/performance_gate.rs),
  # five times on the shared `runner` class, through adapters.py fs-gate.
  fs:
    needs: [plan, builder]
    if: needs.plan.outputs.fs == 'true'
    runs-on: runner
    timeout-minutes: 60
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      # ci-filesystem.yml's Cargo environment, so the build reuses the
      # compiler outputs main's check runs store.
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the tilo-fs performance gate
        run: >-
          bash scripts/ci-run.sh "tilo-fs performance gate build" --
          cargo test --locked -p tilo-fs --test performance_gate --test document_media_footprint --no-run

      - name: Run the gate five times and record it
        env:
          TILO_FS_PERF_GATE: "1"
        run: |
          set -uo pipefail
          mkdir -p perf
          status=0
          for run in 1 2 3 4 5; do
            cargo test --locked -p tilo-fs --test performance_gate -- --nocapture --test-threads=1 \
              2> "perf/fs-gate-$run.log" || status=$?
            # The daemon heap KPIs (fs.*-heap), in the same run's log.
            cargo test --locked -p tilo-fs --test document_media_footprint -- --nocapture \
              2>> "perf/fs-gate-$run.log" || status=$?
            grep '^PERF\| PERF ' "perf/fs-gate-$run.log" || true
          done
          # The Kata runners are KVM guests; the gate draws nothing.
          python3 tools/perf/record.py env --profile dev --renderer none \
            --virtualization kvm --runner runner > perf/env.json || status=1
          python3 tools/perf/adapters.py fs-gate --env-json perf/env.json perf/fs-gate-*.log \
            > perf/fs.jsonl || status=1
          cat perf/fs.jsonl
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-fs
          path: perf/
          if-no-files-found: warn

  # Agent round trip (scripts/perf/agent_rtt.py): actions list, state dump,
  # a no-op invoke accepted and completed, throughput under eight clients and
  # the no-op through the MCP server, against one headless compositor on the
  # shared `runner` class. The compositor is built once here: release
  # optimisation, thin LTO as release-apps.yml builds, and `dev-overrides`,
  # the dev image's feature that serves the control socket in a release
  # build. Authorization and the capability gate stay on.
  agent:
    needs: [plan, builder]
    if: needs.plan.outputs.agent == 'true'
    runs-on: runner
    timeout-minutes: 120
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      # The headless backend renders with Mesa's CPU Vulkan driver, as the
      # nightly headless tests do.
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the compositor
        run: >-
          bash scripts/ci-run.sh "agent round trip compositor build" --
          cargo build --locked --release -p shell --bin shell --features dev-overrides

      - name: Measure and record
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          test -r "$VK_DRIVER_FILES"
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer lavapipe \
            --virtualization kvm --runner runner > perf/env.json
          # A fresh HOME, XDG tree and runtime directory, no session bus:
          # the compositor and everything it leaves behind are this run's.
          bash tools/with-test-environment.sh python3 scripts/perf/agent_rtt.py \
            --spawn target/release/shell --samples 1000 --warmup 100 \
            --transport "test-control socket, headless, release + dev-overrides, thin LTO" \
            --env-json perf/env.json --out perf/agent.jsonl --log perf/compositor.log
          cat perf/agent.jsonl

      # Pipelined invokes (apps/agent, `pipelined_task_benchmark`): the
      # agent's own task loop, a scripted model and a broker whose
      # applications take 100 ms per step, one three-step plan on three
      # records run as the model marks it (independent) and unmarked (in
      # order). Whole task wall time; it draws nothing.
      - name: Measure pipelined agent invokes
        run: |
          set -euo pipefail
          python3 tools/perf/record.py env --profile release --renderer none \
            --virtualization kvm --runner runner > perf/env-pipeline.json
          TILO_AGENT_PIPELINE_REPS=30 TILO_AGENT_PIPELINE_SAMPLES="$PWD/perf/pipeline" \
            bash scripts/ci-run.sh "pipelined agent invokes" -- \
            cargo test --locked --release -p agent --lib pipelined_task_benchmark -- --nocapture
          for plan in pipelined sequential; do
            python3 tools/perf/record.py emit --kpi "agent.task.${plan}.wall" --unit ms \
              --samples-file "perf/pipeline/${plan}.txt" --env-json perf/env-pipeline.json \
              --meta steps=3 --meta step_ms=100 >> perf/agent.jsonl
          done
          tail -n 2 perf/agent.jsonl

      # Native task steps (apps/agent, `native_task_benchmark`): the same
      # plan as a native workspace task, whose steps are children the agent
      # follows by held re-asks. Whole task wall time, pipelined and in
      # order, and the host round trips per step that brought no news while
      # a step ran (in order).
      - name: Measure native agent task steps
        run: |
          set -euo pipefail
          TILO_AGENT_NATIVE_REPS=30 TILO_AGENT_NATIVE_SAMPLES="$PWD/perf/native" \
            bash scripts/ci-run.sh "native agent task steps" -- \
            cargo test --locked --release -p agent --lib native_task_benchmark -- --nocapture
          for plan in pipelined sequential; do
            python3 tools/perf/record.py emit --kpi "agent.task.native.${plan}.wall" --unit ms \
              --samples-file "perf/native/${plan}.txt" --env-json perf/env-pipeline.json \
              --meta steps=3 --meta step_ms=100 >> perf/agent.jsonl
          done
          python3 tools/perf/record.py emit --kpi agent.task.native.idle_round_trips --unit count \
            --samples-file perf/native/idle.txt --env-json perf/env-pipeline.json \
            --meta steps=3 --meta step_ms=100 >> perf/agent.jsonl
          tail -n 3 perf/agent.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-agent
          path: perf/
          if-no-files-found: warn

  # App package size: the newest signed tapp of every app in the public
  # registry index, per architecture. A runner-independent byte count. Also
  # the shared runtime every app maps, fetched from the same registry (two
  # ~240 MB downloads, hence the timeout).
  footprint:
    needs: plan
    if: needs.plan.outputs.footprint == 'true'
    runs-on: runner-quality
    timeout-minutes: 25
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: tools/perf
          sparse-checkout-cone-mode: false

      - name: Record the published tapp sizes
        run: |
          set -euo pipefail
          mkdir -p perf
          curl --fail --silent --show-error --retry 3 --retry-all-errors --proto '=https' \
            --output "$RUNNER_TEMP/entries.json" https://apps.tilo.so/entries
          python3 tools/perf/record.py env --profile release --renderer none \
            --virtualization none --runner none --hardware "apps.tilo.so registry index" > perf/env.json
          python3 tools/perf/adapters.py tapp-sizes --env-json perf/env.json "$RUNNER_TEMP/entries.json" \
            > perf/footprint.jsonl
          cat perf/footprint.jsonl

      # The enforced app-size gate (docs/measurements/app-package-size.md): every
      # published app within its budget, and the apps' median, p90 and max
      # within the fleet ceilings of tools/perf/tapp-size-budget/. The records
      # above are uploaded either way; compare fails the run on this job.
      - name: Published apps within their budgets and the fleet ceilings
        run: >-
          python3 tools/perf/tapp_size_ratchet.py fleet "$RUNNER_TEMP/entries.json"
          --summary "$GITHUB_STEP_SUMMARY"

      # The shared runtime (#4000; docs/measurements/runtime-size.md): the
      # newest published libruntime_dylib.so of each architecture against
      # tools/perf/runtime-size-budget/, recorded as footprint.runtime.*.
      # Records are written before the gate's verdict, so a run over budget
      # still enters the store.
      - name: Published runtime within its size budget
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/perf/runtime_size_ratchet.py published "$RUNNER_TEMP/entries.json" \
            --measurements "$RUNNER_TEMP/runtime.json" --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          [[ -s $RUNNER_TEMP/runtime.json ]] || exit 1
          python3 tools/perf/adapters.py runtime-sizes --env-json perf/env.json "$RUNNER_TEMP/runtime.json" \
            >> perf/footprint.jsonl || exit 1
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-footprint
          path: perf/
          if-no-files-found: warn

  # OS image size: main's newest production-layout image per
  # architecture, the tilo-ci base that tilo-vm:main-ci names, streamed from
  # the registry and replayed layer by layer through tools/perf/image_size.py.
  # Compressed layer bytes (a full pull), unique content (what composefs holds
  # after install), redundant payload (bytes the layers ship twice) and the
  # update from main's previous build (the layers it lacks). Byte
  # counts: runner-independent, so `runner` is none. The ceilings and the 5 %
  # growth rule are in tools/perf/kpi-budgets.toml (DEVELOPMENT.md, "OS image
  # size"). The full breakdown is the job's summary and the image-size
  # artifact.
  footprint-image:
    needs: plan
    if: needs.plan.outputs.footprint == 'true'
    runs-on: runner-quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      # History, for the update from main's previous build: the image of the
      # newest earlier first-parent commit that has one (Build / OS dev builds
      # main a few times a day, when OS inputs change).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 500
          sparse-checkout: tools/perf
          sparse-checkout-cone-mode: false

      - name: Measure main's newest image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p perf
          python3 tools/perf/image_size.py --dev-base registry.tilo.so/tilo/tilo-vm:main-ci \
            --arch "$ARCH" --records perf/image-$ARCH.jsonl --runner none \
            --update-from-previous 'main-{sha7}-{arch}' \
            --json perf/image-size-$ARCH.json --markdown perf/image-size-$ARCH.md > /dev/null
          cat "perf/image-size-$ARCH.md" >> "$GITHUB_STEP_SUMMARY"
          cat "perf/image-$ARCH.jsonl"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-footprint-image-${{ matrix.arch }}
          path: perf/
          if-no-files-found: warn

  # Compositor-side input and workspace-switch latency: a headless
  # compositor driven through its control socket, rendering with lavapipe on
  # the shared `runner` class, through scripts/perf/latency_bench.py. The
  # compositor is ci-legacy-apps.yml's debug build with the same Cargo
  # environment, so the compiler cache that lane fills serves it. Input to
  # photon on real hardware is the weekly, report-only
  # scripts/perf/device_latency_bench.py (docs/benchmarks/reference-hardware.md).
  latency:
    needs: [plan, builder]
    if: needs.plan.outputs.latency == 'true'
    runs-on: runner
    timeout-minutes: 60
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: never
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the compositor
        run: >-
          bash scripts/ci-run.sh "cargo build (latency bench)" --
          cargo build --locked -p shell --bin shell

      - name: Time pointer input and workspace switches
        run: |
          set -euo pipefail
          mkdir -p perf
          python3 tools/perf/record.py env --profile dev --renderer lavapipe \
            --virtualization kvm --runner runner > perf/env.json
          python3 scripts/perf/latency_bench.py --shell-bin target/debug/shell \
            --out perf/run --env-json perf/env.json --records perf/latency.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-latency
          path: perf/
          if-no-files-found: warn

  # Render frame time at native 4K: the toolkit's dashboard harness
  # (`ui-perf dashboard_perf_bench`, 1,000 events) and the shell's
  # `redraw_bench` (1,000 clicks through FrameBuilder, the DRM bridge's render,
  # readback and XRGB swizzle) and its `strip_pan_bench` (strip pans and
  # strip-to-strip moves composited from retained layers), all
  # release builds made once here, through
  # scripts/perf/render_bench.py: retained-frame pixel parity first, then the
  # timed runs, then the toolkit's runner-independent counters (the per-change
  # gate, ci-render-counters.yml). The runner has no GPU; lavapipe times the
  # CPU's rasterisation, so these records are compared only with each other
  # and never quoted as 4K/144 Hz. Hardware frame time is the reference
  # machines' weekly run (docs/benchmarks/reference-hardware.md).
  render:
    needs: [plan, builder]
    if: needs.plan.outputs.render == 'true'
    runs-on: runner
    timeout-minutes: 120
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      # The agent job's and ci-render-counters.yml's Cargo environment
      # (release optimisation, thin LTO as release-apps.yml builds), so the
      # release builds share one compiler cache.
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the render benchmarks
        run: |
          set -euo pipefail
          bash scripts/ci-run.sh "ui-perf release build" -- \
            cargo build --locked --release -p ui-examples --example ui-perf
          bash scripts/ci-run.sh "redraw_bench release build" -- \
            cargo build --locked --release -p shell --example redraw_bench
          bash scripts/ci-run.sh "strip_pan_bench release build" -- \
            cargo build --locked --release -p shell --example strip_pan_bench
          bash scripts/ci-run.sh "framework-scaling release build" -- \
            cargo build --locked --release -p tilo-app --features test-support --example framework-scaling
          bash scripts/ci-run.sh "notes-latency release build" -- \
            cargo build --locked --release -p notes --example notes-latency

      - name: Verify, time and record
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          test -r "$VK_DRIVER_FILES"
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer lavapipe \
            --virtualization kvm --runner runner > perf/env.json
          python3 scripts/perf/render_bench.py timing target/release/examples/ui-perf \
            target/release/examples/redraw_bench --env-json perf/env.json --out perf \
            --strip-pan-bench target/release/examples/strip_pan_bench \
            --records perf/render.jsonl
          # Opening a framework app over a long list.
          target/release/examples/framework-scaling 5000,50000 open | tee perf/framework-open.log
          python3 tools/perf/adapters.py framework-open --env-json perf/env.json \
            perf/framework-open.log >> perf/render.jsonl
          # Scrolling a long framework list, each frame presented as a window
          # that copies what a scroll keeps on screen presents it.
          target/release/examples/framework-scaling 5000 scroll | tee perf/framework-scroll.log
          python3 tools/perf/adapters.py framework-scroll --env-json perf/env.json \
            perf/framework-scroll.log >> perf/render.jsonl
          # The keyboard focus order of a long framework list: one
          # recomputation, and an agent call adding one item.
          target/release/examples/framework-scaling 500,1000,2500 focus | tee perf/framework-focus.log
          python3 tools/perf/adapters.py framework-focus --env-json perf/env.json \
            perf/framework-focus.log >> perf/render.jsonl
          # Notes over a 27-note notebook: typing, Enter, Backspace, the
          # wheel and opening a note, each input timed to the frame that
          # shows it and to that frame's raster.
          target/release/examples/notes-latency | tee perf/notes-latency.log
          python3 tools/perf/adapters.py notes-latency --env-json perf/env.json \
            perf/notes-latency.log >> perf/render.jsonl
          cat perf/render.jsonl

      - name: Check the render counters
        run: python3 scripts/perf/render_bench.py counters target/release/examples/ui-perf --out perf/counters

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-render
          path: perf/
          if-no-files-found: warn

  # Idle wakeups: the explicit examples/idle-wakeups.rs benchmark, never a
  # PR test. Three samples with a 60 s window through adapters.py idle-wakeups.
  # Build it and the production shell explicitly in the dev profile.
  wakeups:
    needs: [plan, builder]
    if: needs.plan.outputs.wakeups == 'true'
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      TILO_IDLE_WAKEUP_WINDOW_SECS: "60"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the idle benchmark and shell
        run: |
          bash scripts/ci-run.sh "idle wakeup benchmark build" -- \
            cargo build --locked -p shell --example idle-wakeups --features scheduled-idle-benchmark
          bash scripts/ci-run.sh "idle wakeup shell build" -- \
            cargo build --locked -p shell --bin shell

      - name: Count an idle desktop's wakeups three times and record them
        run: |
          set -uo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          mkdir -p perf
          status=0
          for run in 1 2 3; do
            TILO_IDLE_SHELL_BIN="$PWD/target/debug/shell" \
              bash tools/test-env.sh target/debug/examples/idle-wakeups \
              > "perf/idle-$run.log" 2>&1 || status=$?
            grep -A40 '^idle wakeups over' "perf/idle-$run.log" || true
          done
          python3 tools/perf/record.py env --profile dev --renderer lavapipe \
            --virtualization kvm --runner runner > perf/env.json || status=1
          python3 tools/perf/adapters.py idle-wakeups --env-json perf/env.json perf/idle-*.log \
            > perf/wakeups.jsonl || status=1
          cat perf/wakeups.jsonl
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-wakeups
          path: perf/
          if-no-files-found: warn

  # Files search's name index under file changes: process CPU for one watched
  # change to an index of MAX_ENTRIES (50k) names, an unchanged one, a
  # rename, a 64-file burst and a whole-index build, from the shell unit test
  # a_watched_change_costs_one_record_not_a_rebuild (which pull requests run
  # at 20k names), five times, through adapters.py files-name-index. A debug
  # lib-test build with check.yml's Cargo environment; the index engine
  # (tantivy, tilo-search) is optimised in that profile as in every other.
  search:
    needs: [plan, builder]
    if: needs.plan.outputs.search == 'true'
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      TILO_FILES_NAME_INDEX_NAMES: "50000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the shell unit tests
        run: >-
          bash scripts/ci-run.sh "files name index cost build" --
          cargo test --locked -p shell --lib --no-run

      - name: Measure watched changes to a 50k-name index five times and record them
        run: |
          set -uo pipefail
          mkdir -p perf
          status=0
          for run in 1 2 3 4 5; do
            bash tools/test-env.sh cargo test --locked -p shell --lib \
              shell::search::providers::files::tests::a_watched_change_costs_one_record_not_a_rebuild \
              -- --exact --nocapture --test-threads=1 > "perf/files-name-index-$run.log" 2>&1 || status=$?
            grep 'FILES-NAME-INDEX' "perf/files-name-index-$run.log" || true
          done
          # The Kata runners are KVM guests; the test draws nothing.
          python3 tools/perf/record.py env --profile dev --renderer none \
            --virtualization kvm --runner runner > perf/env.json || status=1
          python3 tools/perf/adapters.py files-name-index --env-json perf/env.json perf/files-name-index-*.log \
            > perf/search.jsonl || status=1
          cat perf/search.jsonl
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-search
          path: perf/
          if-no-files-found: warn

  # What an active collaborator costs a relay: 100 collaborators in
  # rooms of four type, point and idle through one relay process for ten
  # measured minutes, with authentication and the production co-edit path on
  # (crates/hosting/tilo-relay/examples/relay_load). Records CPU-seconds,
  # resident MiB and egress bytes per collaborator-hour and fan-out latency;
  # adapters.py prices them with tools/perf/prices.toml. Release build made
  # once here, with the agent and render jobs' Cargo environment.
  #
  # The relay runs on two CPUs (`--relay-cpus 2`), the shape of the priced
  # 2-vCPU VM: its daemon runtime then starts two workers, as it does there,
  # instead of the runner's four, and the collaborators run on the other CPUs.
  # Records carry it as meta `relay_cpus`; the series before this change was
  # measured on all of the runner's CPUs (kpi-budgets.toml, "Relay hosting cost").
  hosting:
    needs: [plan, builder]
    if: needs.plan.outputs.hosting == 'true'
    runs-on: runner
    timeout-minutes: 75
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the load bench
        run: >-
          bash scripts/ci-run.sh "relay load bench release build" --
          cargo build --locked --release -p tilo-relay --example relay_load

      # Preserve the original timing-sensitive median-one-write assertion.
      # This standalone scenario has no pointer or byte-cost tests.
      - name: Check timed keystroke write cost
        run: |
          set -euo pipefail
          mkdir -p perf
          bash scripts/ci-run.sh "timed keystroke write benchmark" -- \
            cargo run --locked -p tilo-relay --example keystroke_writes \
            | tee perf/keystroke-writes.log

      - name: Load the relay and record
        run: |
          set -euo pipefail
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer none \
            --virtualization kvm --runner runner > perf/env.json
          target/release/examples/relay_load --collaborators 100 --minutes 10 --relay-cpus 2 \
            --out perf/run | tee perf/hosting-load.log
          python3 tools/perf/adapters.py hosting-load --env-json perf/env.json \
            perf/run/hosting-load.json > perf/hosting.jsonl
          cat perf/hosting.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-hosting
          path: perf/
          if-no-files-found: warn

  # A public room host at 100 guests (crates/dev/room-load), three runs:
  # every guest joins through /join, holds a browser session, moves a cursor
  # on the live plane and chats. Records the guests' p99 join and chat
  # delivery and the host's peak memory and CPU (adapters.py room-load):
  # the largest room docs/benchmarks/room-host-capacity-2026-10.md measured
  # admitting every guest, and the cap it sizes eu1 to.
  # Built as the room service image builds its relay (thin LTO, the agents
  # feature); run on the class the write-up measured, with production's
  # MALLOC_ARENA_MAX=2.
  hosting-room:
    needs: [plan, builder]
    if: needs.plan.outputs.hosting == 'true'
    runs-on: runner-large
    timeout-minutes: 75
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Build the room load bench
        run: >-
          bash scripts/ci-run.sh "room load bench release build" --
          cargo build --locked --release -p tilo-room-load --features tilo-relay/agents

      - name: Load a room host with 100 guests and record
        run: |
          set -euo pipefail
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer none \
            --virtualization kvm --runner runner-large > perf/env.json
          for run in 1 2 3; do
            target/release/tilo-room-load bench --guests 100 --malloc-arenas 2 --hold 60 \
              > "perf/room-load-$run.json" 2> "perf/room-load-$run.log"
          done
          python3 tools/perf/adapters.py room-load --env-json perf/env.json perf/room-load-*.json \
            > perf/hosting-room.jsonl
          cat perf/hosting-room.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-hosting-room
          path: perf/
          if-no-files-found: warn

  # The browser runtime: the release desktop bundle (build.sh --bundle
  # desktop, the bytes the t check image-web-entry publishes) built once here, then
  # scripts/perf/browser_qualification.mjs in headless Chrome for Testing:
  # load, first opens, window activation and an idle desktop. The harness first proves the page ran exactly this
  # commit's clean bundle and that WebGPU ran on the renderer the records
  # name. The runner has no GPU, and Chrome gives WebGPU no CPU driver but its
  # own SwiftShader (lavapipe draws its page, never its WebGPU), which takes
  # tens of seconds for a panned FHD frame here, and queues its work behind
  # the page: one round at 960x540 with ten activations, and the demo workload
  # and its frame-rate goals left to hardware qualification (--demo-seconds 0;
  # kpi-budgets.toml, "Browser runtime"). A first FHD round took 20 minutes,
  # and a second one never finished within the job's two hours. Built in the CI builder like
  # the web entry's bundle (tools/ci/publish/web-entry-context.sh), with its compiler cache.
  browser:
    needs: [plan, builder]
    if: needs.plan.outputs.browser == 'true'
    runs-on: runner
    timeout-minutes: 120
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare verified fonts for the desktop bundle
        uses: ./.forgejo/actions/prepare-font-assets

      - name: Build the release desktop bundle
        run: |
          set -euo pipefail
          # build.sh reads the workspace metadata offline; crates new since
          # the download cache was saved must be fetched first.
          cargo fetch --locked
          # Outside the checkout, which must stay clean: the bundle records
          # whether it was built from a dirty tree, and the harness refuses one.
          bundle="$RUNNER_TEMP/browser-bundle"
          bash scripts/ci-run.sh "release desktop bundle build" -- \
            crates/browser/tilo-browser-runtime/scripts/build.sh "$bundle" --bundle desktop
          echo "BROWSER_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Headless Chrome for Testing
        run: |
          set -euo pipefail
          command -v node || dnf install -y nodejs
          bash tools/ci/ensure-browser-dependencies.sh
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"

      - name: Qualify the bundle and record
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer swiftshader \
            --virtualization kvm --runner runner > perf/env.json
          node scripts/perf/browser_qualification.mjs "$BROWSER_BUNDLE" --out perf/browser.json \
            --renderer swiftshader --demo-seconds 0 --rounds 1 --activations 10 --viewport 960x540 \
            --expect-revision "$(git rev-parse HEAD)" \
            | tee perf/browser-summary.txt
          python3 tools/perf/adapters.py browser-qualification --env-json perf/env.json \
            perf/browser.json > perf/browser.jsonl
          cat perf/browser.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-browser
          path: perf/
          if-no-files-found: warn

  # A native window on the browser desktop: scripts/perf/native_stream_qualification.mjs
  # streams a session's legacy window through this commit's host
  # (`tilo-relay dev`, feature web) to the release desktop bundle in headless
  # Chrome for Testing, and judges each picture the page draws. The session is
  # tilo-relay's legacy_stream_source example: the shell's share session's
  # protocol and production encoder over a drawn window, since the runner has
  # neither a GPU nor a Wayland capture to give it. It encodes in software
  # (30 fps), Chrome decodes in software and the desktop underneath draws on
  # SwiftShader at 960x540, as the browser job's does. SwiftShader compiles
  # the pipelines of the window's tile when the desktop first draws it, which
  # blocked the page for about 25 s here, so the stream's first 30 s are a
  # warm-up, judged but not timed (startup still counts it); the hardware numbers
  # (60 fps encode, hardware decode, a GPU desktop) are a hardware
  # qualification's (kpi-budgets.toml, "A native window on the browser
  # desktop"). After the timed run it drives the acceptance cases
  # (scripts/perf/native_stream_acceptance.mjs: focus, paste, IME, resize, the
  # HTTPS fallback, a viewer without control, a dropped live plane, no typing
  # into a stale window) with a second window, device and person. An
  # incorrect stream or a broken case fails the job and records nothing.
  stream:
    needs: [plan, builder]
    if: needs.plan.outputs.stream == 'true'
    runs-on: runner
    timeout-minutes: 120
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare verified fonts for the desktop bundle
        uses: ./.forgejo/actions/prepare-font-assets

      - name: Build the release desktop bundle
        run: |
          set -euo pipefail
          cargo fetch --locked
          # Outside the checkout, which must stay clean (the browser job's reason).
          bundle="$RUNNER_TEMP/stream-bundle"
          bash scripts/ci-run.sh "release desktop bundle build" -- \
            crates/browser/tilo-browser-runtime/scripts/build.sh "$bundle" --bundle desktop
          echo "STREAM_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Build the host and the session
        run: |
          set -euo pipefail
          bash scripts/ci-run.sh "stream host and session release build" -- \
            cargo build --locked --release -p tilo-relay --features web,stream-source \
              --bin tilo-relay --example legacy_stream_source
          # The session's frame numbers read back as the harness reads them.
          bash scripts/ci-run.sh "stream session tests" -- \
            cargo test --locked --release -p tilo-relay --features stream-source --example legacy_stream_source

      - name: Headless Chrome for Testing
        run: |
          set -euo pipefail
          command -v node || dnf install -y nodejs
          bash tools/ci/ensure-browser-dependencies.sh
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"

      - name: Qualify the stream and record
        id: h264
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          mkdir -p perf
          python3 tools/perf/record.py env --profile release --renderer swiftshader \
            --virtualization kvm --runner runner > perf/env.json
          node scripts/perf/native_stream_qualification.mjs "$STREAM_BUNDLE" --out perf/stream.json \
            --relay target/release/tilo-relay --source target/release/examples/legacy_stream_source \
            --renderer swiftshader --viewport 960x540 --warm-up 30 --expect-revision "$(git rev-parse HEAD)" \
            | tee perf/stream-summary.txt
          python3 tools/perf/adapters.py native-stream --env-json perf/env.json \
            perf/stream.json > perf/stream.jsonl
          cat perf/stream.jsonl

      # A session with no H.264 encoder (a stock device) streams software
      # VP9 (vp9enc), and every browser decodes it. Same build, same Chrome,
      # its own series (stream.vp9.*), so neither codec's numbers judge the
      # other's. It runs even when the H.264 leg failed: the two are separate
      # verdicts.
      - name: Qualify the VP9 stream and record
        if: ${{ !cancelled() && steps.h264.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          node scripts/perf/native_stream_qualification.mjs "$STREAM_BUNDLE" --out perf/stream-vp9.json \
            --relay target/release/tilo-relay --source target/release/examples/legacy_stream_source \
            --renderer swiftshader --viewport 960x540 --warm-up 30 --expect-revision "$(git rev-parse HEAD)" \
            --codec vp9 | tee perf/stream-vp9-summary.txt
          python3 tools/perf/adapters.py native-stream --env-json perf/env.json \
            perf/stream-vp9.json > perf/stream-vp9.jsonl
          cat perf/stream-vp9.jsonl

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-stream
          path: perf/
          if-no-files-found: warn

  # The same-job A/B lane: one leg per selected group, each on one
  # `runner` for its whole length, so both sides see the same machine. The
  # Cargo environment is the union of the nightly group jobs' (release with
  # thin LTO; debug without debug info), so the builds reuse their compiler
  # cache. Both sides build in this one checkout and target directory, one
  # after the other (tools/perf/ab.py), never in two worktrees. The verdicts
  # are the job summary; records, ab-result.json and run logs are the
  # artifact perf-ab-<group>.
  ab:
    needs: [plan, builder]
    if: needs.plan.outputs.mode == 'ab'
    runs-on: runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.ab_groups) }}
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Both sides' commits, and origin/main for the default base.
          fetch-depth: 0

      - name: Prepare Rust build caches
        uses: ./.forgejo/actions/prepare-rust-build

      # The browser group builds both sides' desktop bundles and drives them
      # in Chrome, as the nightly browser job does.
      - name: Prepare verified fonts for the desktop bundle
        if: matrix.group == 'browser'
        uses: ./.forgejo/actions/prepare-font-assets

      - name: Headless Chrome for Testing
        if: matrix.group == 'browser'
        run: |
          set -euo pipefail
          command -v node || dnf install -y nodejs
          bash tools/ci/ensure-browser-dependencies.sh
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
          cargo fetch --locked

      - name: Build both sides and run them interleaved
        env:
          GROUP: ${{ matrix.group }}
          BASE: ${{ github.event.inputs.ab_base }}
          CANDIDATE: ${{ github.event.inputs.ab_candidate }}
          ROUNDS: ${{ github.event.inputs.ab_rounds }}
          RELAY_CPUS: ${{ github.event.inputs.ab_relay_cpus }}
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh x86_64
          git config --global --add safe.directory "$PWD"
          python3 tools/perf/ab.py run --groups "$GROUP" --base "${BASE:-origin/main}" \
            --candidate "${CANDIDATE:-$GITHUB_SHA}" --rounds "$ROUNDS" --out perf-ab \
            --hosting-relay-cpus "${RELAY_CPUS:-0}" \
            --virtualization kvm --runner runner --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-ab-${{ matrix.group }}
          path: |
            perf-ab/*.jsonl
            perf-ab/*.json
            perf-ab/*.md
            perf-ab/logs/
            perf-ab/runs/
          if-no-files-found: warn

  compare:
    needs: [plan, fs, footprint, footprint-image, agent, latency, render, wakeups, search, hosting, hosting-room, browser, stream]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'ab' }}
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/perf
            tools/upload_immutable_packages.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: results

      - name: Compare with the store and publish
        env:
          GROUPS: ${{ needs.plan.outputs.groups }}
          ACCEPT: ${{ github.event.inputs.accept }}
          SERIES: ${{ github.event.inputs.synthetic_series }}
          FACTOR: ${{ github.event.inputs.synthetic_factor }}
          FS_RESULT: ${{ needs.fs.result }}
          FOOTPRINT_RESULT: ${{ needs.footprint.result }}
          FOOTPRINT_IMAGE_RESULT: ${{ needs.footprint-image.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          LATENCY_RESULT: ${{ needs.latency.result }}
          RENDER_RESULT: ${{ needs.render.result }}
          WAKEUPS_RESULT: ${{ needs.wakeups.result }}
          SEARCH_RESULT: ${{ needs.search.result }}
          HOSTING_RESULT: ${{ needs.hosting.result }}
          HOSTING_ROOM_RESULT: ${{ needs.hosting-room.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STREAM_RESULT: ${{ needs.stream.result }}
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          owner=${GITHUB_REPOSITORY%%/*}
          status=0
          for job in "fs:$FS_RESULT" "footprint:$FOOTPRINT_RESULT" "footprint-image:$FOOTPRINT_IMAGE_RESULT" "agent:$AGENT_RESULT" "latency:$LATENCY_RESULT" "render:$RENDER_RESULT" "wakeups:$WAKEUPS_RESULT" "search:$SEARCH_RESULT" "hosting:$HOSTING_RESULT" "hosting-room:$HOSTING_ROOM_RESULT" "browser:$BROWSER_RESULT" "stream:$STREAM_RESULT"; do
            case ${job#*:} in
              success|skipped) ;;
              *) echo "::error::benchmark job ${job%%:*} ended ${job#*:}"; status=1 ;;
            esac
          done
          on_main=false
          [[ $GITHUB_REF == refs/heads/main ]] && on_main=true
          if [[ -n ${ACCEPT:-} && $on_main != true ]]; then
            echo "::error::accept only applies to main, where the store is written"
            exit 1
          fi
          args=(--store "$GITHUB_SERVER_URL" --owner "$owner" --lane perf-scheduled --groups "$GROUPS"
                --publish-dir publish --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --summary summary.md)
          [[ -n ${ACCEPT:-} ]] && args+=(--accept "$ACCEPT")
          [[ -n ${SERIES:-} ]] && args+=(--synthetic "$SERIES" --synthetic-factor "${FACTOR:-1.0}")
          results=(results/*/*.jsonl)
          if (( ${#results[@]} == 0 )); then
            echo "::error::no benchmark produced records"
            exit 1
          fi
          python3 tools/perf/compare.py --results "${results[@]}" "${args[@]}" || status=1
          # Real records are written from main only; a synthetic series may be
          # written from any ref because it never enters a real baseline.
          if [[ $on_main == true || -n ${SERIES:-} ]]; then
            manifest=$(mktemp)
            for file in publish/*/*.jsonl; do
              month=$(basename "$(dirname "$file")")
              printf '%s\t%s\n' "$file" \
                "$GITHUB_SERVER_URL/api/packages/$owner/generic/tilo-perf-results/$month/$(basename "$file")"
            done > "$manifest"
            bash tools/upload_immutable_packages.sh "$manifest" || status=1
          else
            echo "Not main and not synthetic: compared only, nothing written to the store."
          fi
          [[ -f summary.md ]] && cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-summary
          path: |
            summary.md
            publish/
          if-no-files-found: warn
