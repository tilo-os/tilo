name: CI / fast quality

# Compilation-heavy warnings, Clippy, docs, and release-size gates run weekly.
# This path runs on every change.
on:
  # Main keeps a result for every commit. Task branches get theirs from the
  # pull_request event, which fires when a PR opens and on every update; a
  # branch push would repeat the same job on the same commit.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  # Push and pull-request checks are distinct required evidence. Include both
  # event and commit so neither can replace another result.
  group: lint-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: runner-quality
    timeout-minutes: 30
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:21849904f25c17f500394710ac8e080cc16e88a897248fcf5c2d106e3648c9c3
    env:
      # The policy suite's Cargo metadata and cargo deny resolve every locked
      # crate; read them from the shared download cache, not crates.io.
      CARGO_HOME: /cargo-home
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 2
          fetch-tags: false

      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads

      - name: Verify native fast-quality toolchain
        run: |
          test "$(uname -m)" = x86_64
          cargo --version
          rustc --version
          rustfmt --version
          cargo deny --version
          cargo machete --version
          cargo hakari --version

      - name: Check formatting of changed Rust files
        shell: bash
        run: >-
          bash tools/ci/check-changed-rustfmt.sh
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.before }}'

      - name: Require reasons for Rust lint exceptions in changed files
        run: >-
          python3 tools/ci/check_changed_rust_allows.py
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.before }}'

      - name: Repository policy suite
        run: bash tools/policy/run.sh

      - name: cargo deny
        run: cargo deny --workspace check --hide-inclusion-graph

      # crates/workspace-hack unifies third-party features across members; a
      # dependency change that is not regenerated splits the shared builds again.
      - name: Workspace-hack matches the dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
            echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (DEVELOPMENT.md, Dependency features)." >&2
            exit 1
          fi
          cargo hakari verify

      - name: cargo machete
        run: >-
          bash tools/ci/check-unused-dependencies.sh --changed
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.before }}'
