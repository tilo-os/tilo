name: CI / fast quality

# Compilation-heavy warnings, Clippy, docs, and release-size gates run weekly.
# This path runs on every change.
on:
  # Main keeps a result for every commit. Task branches get theirs from the
  # pull_request event, which fires when a PR opens and on every update; a
  # branch push would repeat the same job on the same commit.
  push:
    branches: ["main"]
  pull_request:
    # Stacked PRs (a PR whose base is another task branch) get the
    # same gate; affected-package selection diffs against that base, so each
    # layer tests its own change.
    branches: ["main", "pr/sdk-*", "codex/**"]
  workflow_dispatch:

concurrency:
  # A newer commit on a pull request replaces its older run: the lander only
  # reads the current head. Pushes keep one run per commit.
  group: lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: runner-quality
    timeout-minutes: 30
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    env:
      # The policy suite's Cargo metadata and cargo deny resolve every locked
      # crate; read them from the shared download cache, not crates.io.
      # The app lints build ~950 crates on the 20 GiB quality store.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Disable automatic Git maintenance in the disposable job container
        # Git 2.54 maintenance can rewrite shallow history between fetches.
        # Checkout copies this global config before its first fetch.
        run: git config --global maintenance.auto false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          fetch-tags: false

      # Pull requests are checked merged onto main's current tip.
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main

      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads

      - name: Verify native fast-quality toolchain
        run: |
          test "$(uname -m)" = x86_64
          cargo --version
          rustc --version
          rustfmt --version
          cargo deny --version
          cargo machete --version
          cargo hakari --version
          # ci-fast ships gcc as /usr/bin/cc (os/Containerfile.ci-fast); the
          # Tilo app lints below compile tilo-app-cli and need that linker.
          command -v cc

      - name: Check formatting of changed Rust files
        shell: bash
        run: >-
          bash tools/ci/check-changed-rustfmt.sh
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

      # crates/workspace-hack unifies third-party features across members; a
      # dependency change that is not regenerated splits the shared builds again.
      # Fail before the slower policy and dependency scans when it is stale.
      - name: Workspace-hack matches the dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
            echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (DEVELOPMENT.md, Dependency features)." >&2
            exit 1
          fi
          cargo hakari verify

      - name: Require reasons for Rust lint exceptions in changed files
        run: >-
          python3 tools/ci/check_changed_rust_allows.py
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

      - name: Verify commit messages and exact new blob contents
        run: >-
          python3 tools/policy/check_commit_policy.py
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

      - name: Repository policy suite
        run: bash tools/ci/measure.sh "repository policy tests" -- bash tools/policy/run.sh

      # Release / apps measures each shipped tapp against its budget; this
      # text check, which builds nothing, makes every budget change reviewed:
      # growth needs a raise file and a new app needs a budget.
      - name: App package size budgets only decrease
        shell: bash
        run: |
          # A pull request compares with the main it was merged onto; a push
          # to main, with its first parent (the previous main).
          base='${{ steps.merge.outputs.main }}'
          python3 tools/perf/tapp_size_ratchet.py check-budget --base "${base:-HEAD~1}"

      # The same rule for the shared app runtime's size and load-cost budgets
      # (tools/perf/runtime-size-budget/; DEVELOPMENT.md, "Runtime size").
      - name: Runtime size budgets only decrease
        shell: bash
        run: |
          base='${{ steps.merge.outputs.main }}'
          python3 tools/perf/runtime_size_ratchet.py check-budget --base "${base:-HEAD~1}"

      # The lint app developers run locally: an app that adds platform code
      # without moving it into a platform crate or declaring itself native
      # fails here. ci-fast already provides /usr/bin/cc (pinned digest).
      - name: Tilo app lints
        run: bash tools/ci/measure.sh "app lint check" -- cargo run --locked --quiet -p tilo-app-cli --bin tilo-app -- check --lint --all

      - name: cargo deny
        run: bash tools/ci/measure.sh "dependency policy check" -- cargo deny --workspace check --hide-inclusion-graph

      - name: cargo machete
        run: >-
          bash tools/ci/measure.sh "unused dependency check" --
          bash tools/ci/check-unused-dependencies.sh --changed
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'
