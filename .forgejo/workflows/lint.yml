name: Lint + audit

# Static analysis, separate from check.yml so a formatting failure does not
# hide a test failure and vice versa. Each step reports independently.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: runner
    container:
      image: code.podesta.ai/qos/qos-builder:latest
      # The runner pulls the job container before any step runs, so a
      # docker/login-action step inside the job is too late for a private image.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Runs whatever check.yml did not: every target, including tests.
      - name: cargo clippy
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo doc (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_BUILD_JOBS: "4"
        run: cargo doc --workspace --no-deps --locked

  audit:
    runs-on: runner
    container:
      image: code.podesta.ai/qos/qos-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      # Advisories, licence compatibility with AGPL-3.0, and the duplicate
      # version report. Reads deny.toml.
      - name: cargo deny
        run: cargo deny --workspace check

      # Dependencies nothing imports. The lockfile carries ~1,600 packages;
      # each unused one is compile time every builder pays.
      - name: cargo machete
        run: cargo machete --with-metadata
