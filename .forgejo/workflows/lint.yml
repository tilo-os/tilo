name: Fast quality checks

# Compilation-heavy warnings, Clippy, docs, and release-size gates run weekly.
# This path stays intentionally cheap so it can run on every change.
on:
  # Give every branch a cheap signal before it opens or updates a PR.
  push: {}
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: runner
    container:
      image: code.podesta.ai/qos/qos-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 2
          fetch-tags: false

      - name: Check formatting of changed Rust files
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] || [ "$base" = "null" ]; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] ||
             [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          if merge_base=$(git merge-base "$base" HEAD 2>/dev/null); then
            range="$merge_base...HEAD"
          else
            range="$base..HEAD"
          fi
          git diff --name-only -z --diff-filter=ACMRTUXB "$range" -- '*.rs' |
            xargs -0 -r rustfmt --edition 2024 --check

      - name: CI selector unit tests
        run: python3 -m unittest tools/tests/test_ci_select.py

      - name: Immutable workflow dependency contract
        run: bash os/tests/workflow_dependency_invariants.sh

      - name: Codex CI watcher unit tests
        run: |
          python3 -m json.tool .codex/hooks.json >/dev/null
          python3 .codex/hooks/test_watch_ci.py

      - name: Application text-stack contract
        run: |
          python3 tools/check_app_text_contract.py
          python3 -m unittest tools/tests/test_app_text_contract.py

      - name: Application resource/action contract
        run: |
          python3 tools/check_app_resource_action_contract.py
          python3 -m unittest tools/tests/test_app_resource_action_contract.py

      - name: cargo deny
        run: cargo deny --workspace check

      - name: cargo machete
        run: cargo machete --with-metadata
