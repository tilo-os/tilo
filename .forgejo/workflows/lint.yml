name: CI / native control image qualification
on:
  push:
    branches: ["codex/ci-control-image-probe"]
  workflow_dispatch:
jobs:
  quality:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: code.podesta.ai/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout public-trust context fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 2
          fetch-tags: false
      - name: Verify native Docker control tools
        run: |
          test "$(uname -m)" = x86_64
          docker --version
          docker buildx version
      - name: Verify named public-trust contexts with Docker BuildKit
        env:
          DOCKER_BUILDKIT: "1"
        run: bash os/tests/named_public_trust_context.sh docker
