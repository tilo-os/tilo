name: CI / fast quality

# Clippy over the whole tree runs nightly (ci-nightly.yml); push runs lint the
# packages a push touches (check.yml). This cheap path runs on every main commit so
# the format, dependency and policy gates of the commit being promoted have a
# result. Main is not gated, so a red result here blocks only the promotion.
#
# The gates run as two jobs: a push waits for a verdict in about the longer half
# instead of the sum of every step, and a slow inventory scan no longer delays
# the compile-heavy lints that developers wait for.
#
# A lint run checks the whole tree at one commit, so a later run says everything
# an earlier one could, and one verdict at a time is all main needs. The
# `supersede` job hands that verdict out with the same decision check.yml makes
# (tools/ci/push_window.py): a push skips its gates while another run holds them,
# and the first push after that run finishes takes over. The forge's own
# `concurrency:` did this by cancelling the waiting runs, which reported a
# cancelled run for every push main took and left the newest head waiting for the
# run in front of it.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Whose run lints the tree: see tools/ci/push_window.py for the rules.
  supersede:
    runs-on: runner
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    outputs:
      superseded: ${{ steps.window.outputs.superseded }}
    steps:
      - name: Check out the verdict decision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Decide whether this run lints the tree
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          # Cancelling a run writes to this repository, and the run's own token
          # may not carry that; a refusal falls back to the repository token.
          CI_SPARE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # This workflow's runs supersede each other, and `policy` is the first
          # job a run starts only when it decided to run.
          WORKFLOW: lint.yml
          MARKER_JOB: policy
        run: python3 tools/ci/push_window.py

  policy:
    needs: [supersede]
    if: needs.supersede.outputs.superseded != 'true'
    runs-on: runner-quality
    timeout-minutes: 30
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    steps:
      - name: Disable automatic Git maintenance in the disposable job container
        # Git 2.54 maintenance can rewrite shallow history between fetches.
        # Checkout copies this global config before its first fetch.
        run: git config --global maintenance.auto false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          fetch-tags: false

      # Pull requests are checked merged onto main's current tip.
      - name: Merge onto main
        id: merge
        uses: ./.forgejo/actions/merge-main

      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads

      - name: Verify fast-quality toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustfmt --version
          cargo deny --version
          cargo machete --version

      - name: Check formatting of changed Rust files
        shell: bash
        run: >-
          bash tools/ci/check-changed-rustfmt.sh
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

      - name: Verify commit messages and exact new blob contents
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: >-
          python3 tools/policy/check_commit_policy.py
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

      # The title becomes the merge commit's subject on main. It reaches the
      # script through the environment, never through the shell command.
      - name: Pull request title names no internal tracker reference
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/policy/check_commit_message.py --title "$TITLE"

      - name: Repository policy suite
        run: bash tools/ci/measure.sh "repository policy tests" -- bash tools/policy/run.sh

      # Release / apps measures each shipped tapp against its budget; this
      # text check, which builds nothing, makes every budget change reviewed:
      # growth needs a raise file and a new app needs a budget.
      - name: App package size budgets only decrease
        shell: bash
        run: |
          # A pull request compares with the main it was merged onto; a push
          # to main, with its first parent (the previous main).
          base='${{ steps.merge.outputs.main }}'
          python3 tools/perf/tapp_size_ratchet.py check-budget --base "${base:-HEAD~1}"

      # The same rule for the shared app runtime's size and load-cost budgets
      # (tools/perf/runtime-size-budget/; docs/measurements/runtime-size.md).
      - name: Runtime size budgets only decrease
        shell: bash
        run: |
          base='${{ steps.merge.outputs.main }}'
          python3 tools/perf/runtime_size_ratchet.py check-budget --base "${base:-HEAD~1}"

      - name: cargo deny
        run: bash tools/ci/measure.sh "dependency policy check" -- cargo deny --workspace check --hide-inclusion-graph

      - name: cargo machete
        run: >-
          bash tools/ci/measure.sh "unused dependency check" --
          bash tools/ci/check-unused-dependencies.sh --changed
          '${{ steps.merge.outputs.main }}'
          '${{ github.event.before }}'

  lints:
    needs: [supersede]
    if: needs.supersede.outputs.superseded != 'true'
    runs-on: runner-quality
    timeout-minutes: 30
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89
    env:
      # The app lints build ~950 crates on the 20 GiB quality store.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Disable automatic Git maintenance in the disposable job container
        # Git 2.54 maintenance can rewrite shallow history between fetches.
        # Checkout copies this global config before its first fetch.
        run: git config --global maintenance.auto false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          fetch-tags: false

      # Pull requests are checked merged onto main's current tip.
      - name: Merge onto main
        uses: ./.forgejo/actions/merge-main

      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads

      - name: Verify native fast-quality toolchain
        run: |
          test "$(uname -m)" = x86_64
          cargo --version
          rustc --version
          cargo hakari --version
          # ci-fast ships gcc as /usr/bin/cc (os/Containerfile.ci-fast); the
          # Tilo app lints below compile tilo-app-cli and need that linker.
          command -v cc

      # crates/workspace-hack unifies third-party features across members; a
      # dependency change that is not regenerated splits the shared builds again.
      # Fail before the app lints that build from it.
      - name: Workspace-hack matches the dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
            echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result." >&2
            exit 1
          fi
          cargo hakari verify

      # The lint app developers run locally: an app that adds platform code
      # without moving it into a platform crate or declaring itself native
      # fails here. ci-fast already provides /usr/bin/cc (pinned digest).
      - name: Tilo app lints
        run: bash tools/ci/measure.sh "app lint check" -- cargo run --locked --quiet -p tilo-app-cli --bin tilo-app -- check --lint --all
