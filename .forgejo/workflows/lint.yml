name: CI / fast quality

# Compilation-heavy warnings, Clippy, docs, and release-size gates run weekly.
# This path runs on every change.
on:
  # Run on every branch before it opens or updates a PR.
  push: {}
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  # A branch push and its pull_request synchronization describe the same head.
  # Normalize both event shapes so the later event cancels duplicate work.
  group: lint-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: runner
    timeout-minutes: 30
    container:
      image: code.podesta.ai/qos/qos-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          fetch-depth: 2
          fetch-tags: false

      - name: Check formatting of changed Rust files
        shell: bash
        run: >-
          bash tools/check-changed-rustfmt.sh
          '${{ github.event.pull_request.base.sha }}'
          '${{ github.event.before }}'

      - name: Repository policy unit tests
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          bash tools/tests/ci_sccache.sh
          bash tools/tests/cargo_shim.sh
          bash tools/tests/test_ci_receipt.sh

      - name: Immutable workflow dependency contract
        run: |
          bash os/tests/workflow_dependency_invariants.sh

      - name: Focused installer contracts without image assembly
        run: python3 tools/dev.py check installer --out "$RUNNER_TEMP/tilo-installer-contracts"

      - name: Retain installer contract timings and results
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: installer-contract-results
          path: ${{ runner.temp }}/tilo-installer-contracts/run.json
          if-no-files-found: warn

      - name: Codex CI watcher unit tests
        run: |
          python3 -m json.tool .codex/hooks.json >/dev/null
          python3 .codex/hooks/test_watch_ci.py

      - name: Application text-stack contract
        run: |
          python3 tools/check_app_text_contract.py

      - name: Application resource/action contract
        run: |
          python3 tools/check_app_resource_action_contract.py

      - name: AT-SPI endpoint contract
        run: python3 tools/check_atspi_endpoint_contract.py

      - name: cargo deny
        run: cargo deny --workspace check

      - name: cargo machete
        run: cargo machete --with-metadata
