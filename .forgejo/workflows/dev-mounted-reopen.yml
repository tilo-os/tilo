name: Dev / mounted resource reopen

# Explicit diagnostic only; required PR/main verification remains independent.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit to diagnose (40 lowercase hex characters)'
        required: true
        type: string

env:
  SOURCE_SHA: ${{ github.event.inputs.source_sha }}
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_TERM_COLOR: never
  WASM_BINDGEN_VERSION: '0.2.108'

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      source: ${{ steps.validate.outputs.source }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
          sparse-checkout: |
            tools/ci/mounted_reopen_probe.py
            tools/ci/resolve_builder.py
            tools/ci/images.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate exact source before native admission
        id: validate
        run: python3 -I tools/ci/mounted_reopen_probe.py validate
      - name: Resolve immutable native builder
        id: resolve
        run: python3 tools/ci/resolve_builder.py

  probe:
    needs: builder
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout diagnostic helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ needs.builder.outputs.source }}
          persist-credentials: false
      - name: Restore Cargo downloads
        uses: ./control/.forgejo/actions/restore-cargo-downloads
        with:
          lockfile: source/Cargo.lock
      - name: Prepare existing SDK browser toolchain
        working-directory: source
        run: |
          bash tools/ci/assert-native-runner.sh x86_64
          rustup target add wasm32-unknown-unknown
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
          command -v node || dnf install -y nodejs
          npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/chrome" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Build once and observe at most three isolated journeys
        env:
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
        run: python3 -I control/tools/ci/mounted_reopen_probe.py run --root source
      - name: Preserve every attempted journey including failure
        if: always()
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: mounted-reopen-probe-${{ github.run_attempt }}
          path: source/target/mounted-reopen-probe
          if-no-files-found: error
