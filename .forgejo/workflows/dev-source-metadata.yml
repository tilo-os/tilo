name: Dev / exact-source metadata export

# Explicit export for offline affected-plan callers. No build, no dependency
# pruning: Cargo describes every workspace package on the requested exact source.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full committed source SHA to export; caller must have a clean identical tree.'
        type: string
        required: true

jobs:
  export:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:e2d8ed58b06103e01cc9010c58989d07d3a966f0599774911a5c23bc9065844a
    steps:
      - name: Disable automatic Git maintenance
        run: git config --global maintenance.auto false
      - name: Validate requested source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout export validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: exporter
          fetch-depth: 1
          fetch-tags: false
      - name: Checkout exact requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          path: source
          fetch-depth: 1
          fetch-tags: false
      - name: Export complete locked workspace metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          (cd source && cargo metadata --locked --no-deps --format-version 1) > "$RUNNER_TEMP/metadata.json"
          python3 exporter/tools/ci/current_source_metadata.py seal --root source \
            --input "$RUNNER_TEMP/metadata.json" --output export/current-source-metadata.json
      - name: Save source-bound metadata
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: current-source-metadata-${{ github.event.inputs.source_sha }}
          path: export/current-source-metadata.json
          retention-days: 7
          if-no-files-found: error
