name: Dev / VM acceptance

# The VM acceptance suite (scripts/vm-acceptance, README "Run it in CI") on a
# KVM runner instead of a developer's laptop: a dev disk, a libvirt session VM
# created by tilo-vm, a headful slot on two outputs, the ref under test's
# components swapped in, every check, and the report as artifact and summary.
#
# The base disk comes from what CI already published: the dev disk
# (tilo-vm-disk/<tag>) or, more often, the dev image (tilo-vm:<tag>-x86_64,
# which Build / OS dev pushes per main commit) of the newest main commit at or
# before the ref, installed here exactly as Release / Dev VM disk installs it.
# The ref's own code builds here in the native immutable CI builder. Paired
# apps/runtime cohorts cross the pinned same-run artifact service and enter
# through verified swap-artifact; other requests retain the host swap path:
# the artifact route is explicitly opt-in; default swap planning is unchanged. P01
# states the result as "base <commit> + <components> swapped from <ref>".
#
# The run also measures the installed desktop's performance KPIs (boot to the
# greeter, idle CPU, wakeups and RAM, memory per app, warm app opens, frame CPU)
# and writes them as records; the perf job compares them with the store and, for
# the nightly run on main, publishes them (DEVELOPMENT.md "Performance results").
#
# Runners: runner-disk-100g, the Kata runners whose KVM the dev disk and legacy
# guest boots already use. They have no GPU, so `gl: auto` runs without virgl
# and the report records the software renderer.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit under test: its components are swapped onto the dev disk of the newest main commit at or before it with a published dev image."
        required: false
        default: "main"
      swap:
        description: "What to build from the ref and swap in: default (shell plus the apps the ref changed: a branch against main, a main commit against the base), none, all (every userspace component in os/components.toml), or a comma-separated list (components, app:<dir>)."
        required: false
        default: "default"
      prebuilt_cohort:
        description: "Use the verified same-run signed cohort artifact route (requires the swap-artifact CLI in the exact ref)."
        required: false
        default: "false"
      only:
        description: "Comma-separated check ids or areas (run.py --only); empty runs every check."
        required: false
        default: ""
      outputs:
        description: "The slot's outputs (run.py --outputs)."
        required: false
        default: "1920x1080@1,1280x800@1.25"
      gl:
        description: "virgl: auto (when the runner has a render node), on, or off."
        required: false
        default: "auto"
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    branches: [main]
    paths:
      - "scripts/vm-acceptance/**"
      - ".forgejo/workflows/vm-acceptance.yml"
      # What the input-fidelity (I01-I07, B04, W17) and agent-door (M01-M04) checks prove:
      # ci_select.py maps each to its checks, so such a pull request runs only those.
      - "crates/dev/tilo-vm/**"
      - "crates/dev/tilo-vmd/**"
      - "crates/dev/tilo-vm-protocol/**"
      - "crates/session/shell/src/compositor/input*"
      - "crates/session/shell/src/compositor/keyboard*"
      - "crates/session/shell/src/compositor/lock_*"
      - "crates/session/shell/src/compositor/backend/drm/**"
      - "crates/session/shell/src/compositor/agent_door.rs"
      - "crates/session/shell/src/shell/agent_admission*.rs"
      - "crates/runtime/tilo-runtime/src/**"
      - "os/usr/lib/udev/**"
      - "os/hardware/profiles/lenovo-83ed/input/**"

concurrency:
  # A pull request's newest commit replaces its older run; dispatched and
  # nightly runs only queue behind an identical request. (github.run_id is
  # not available here: it collapsed every dispatch into one queue.)
  group: vm-acceptance-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.ref }}-${{ github.event.inputs.swap }}-${{ github.event.inputs.only }}-${{ github.event.inputs.prebuilt_cohort }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  builder:
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  acceptance:
    needs: builder
    runs-on: runner-disk-100g
    timeout-minutes: 180
    outputs:
      only: ${{ steps.plan.outputs.only }}
    # The CI builder: the dev image's Fedora with the workspace's build
    # dependencies and the runner's sccache, so swapped components link
    # against the libraries the VM has.
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      ARCH: x86_64
      WORK: /var/tmp/vm-acceptance
      RUN_USER: acceptance
      # A base disk further behind the ref than this is called out in the summary.
      BEHIND_WARN: "20"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The image lookup walks main's history; the ref under test gets its
          # own worktree from this clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Require a native x86-64 runner with KVM
        run: |
          set -euo pipefail
          ./os/dev/assert-native-arch.sh "$ARCH"
          python3 os/dev/probe-kvm.py "$ARCH" || {
            echo '::error::this runner cannot create a KVM VM; the acceptance suite never runs under TCG'
            exit 1
          }

      - name: Install libvirt, QEMU and disk tooling
        run: |
          set -euo pipefail
          # libvirt's QEMU driver without the system daemon: tilo-vm uses the
          # per-user session (qemu:///session), started on demand. bash-devel
          # and readline-devel are the headers a `ush` swap builds Terminal's
          # Bash editor against (crates/runtime/ush/native/build.py).
          dnf --setopt=retries=3 install -y \
            libvirt-daemon-driver-qemu libvirt-client passt qemu-kvm qemu-img edk2-ovmf \
            ipxe-roms-qemu openssh-clients rsync python3-pillow binutils btrfs-progs dosfstools \
            e2fsprogs fuse-overlayfs podman jq skopeo slirp4netns socat sudo systemd \
            shadow-utils util-linux bash-devel readline-devel
          command -v virsh qemu-system-x86_64 qemu-img passt ssh podman skopeo systemd-repart sudo >/dev/null
          python3 -c 'import PIL'  # the checks read pixels from shots

      # registry.tilo.so answers this network's anonymous reads with 401.
      # The builder has no docker; skopeo and podman share this login.
      - name: Log in to registry.tilo.so
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | podman login --username "$ACTOR" --password-stdin registry.tilo.so

      - name: Plan the ref, its base disk, the swaps and the checks
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_SWAP: ${{ github.event.inputs.swap }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
          INPUT_OUTPUTS: ${{ github.event.inputs.outputs }}
          INPUT_GL: ${{ github.event.inputs.gl }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) ref=$PR_HEAD target=$PR_HEAD ;;
            schedule) ref=main target=$(git rev-parse origin/main) ;;
            *)
              ref=${INPUT_REF:-main}
              target=$(git rev-parse --verify -q "origin/$ref^{commit}" || git rev-parse --verify "$ref^{commit}") ;;
          esac

          registry=registry.tilo.so/tilo/tilo-vm
          packages=https://code.tilo.so/api/packages/tilo/generic/tilo-vm-disk
          commit="" disk_url="" image=""
          for c in $(git rev-list --first-parent -n 300 origin/main); do
            git merge-base --is-ancestor "$c" "$target" || continue
            tag="main-${c:0:7}-ci"
            if curl -fsS -H "Authorization: Bearer $REGISTRY_TOKEN" -o "$RUNNER_TEMP/disk.json" \
                 "$packages/$tag/tilo-vm-disk-$ARCH.json" 2>/dev/null; then
              commit=$c disk_url="$packages/$tag/tilo-vm-disk-$ARCH.json"
              break
            fi
            digest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$registry:$tag-$ARCH" 2>/dev/null || true)
            if [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              commit=$c image="registry.tilo.so/tilo/tilo-vm@$digest"
              break
            fi
          done
          [[ -n $commit ]] || {
            echo "::error::no main commit at or before ${target:0:12} (last 300) has a published dev disk or dev image"
            exit 1
          }
          behind=$(git rev-list --count "$commit..$target")
          bridge=$(python3 scripts/vm-acceptance/management.py "$commit" "$target")

          # What the base lacks of the ref, built from the ref and swapped in.
          swap=${INPUT_SWAP:-default}
          case $swap in
            none) swap="" ;;
            default)
              swap=""
              # The apps a branch changes are its own diff from main; for a
              # main commit, what changed since the base.
              from=$(git merge-base origin/main "$target")
              [[ $from != "$target" ]] || from=$commit
              if ! git diff --quiet "$commit" "$target"; then
                swap=shell
                # tilo-vmd's input path runs in the VM (device profiles, uinput).
                git diff --quiet "$from" "$target" -- crates/dev/tilo-vmd crates/dev/tilo-vm-protocol || swap+=",vmd"
                for app in $(git diff --name-only "$from" "$target" -- apps/ | cut -d/ -f2 | sort -u); do
                  git cat-file -e "$target:apps/$app/Cargo.toml" 2>/dev/null && swap+=",app:$app"
                done
              fi ;;
            all)
              swap=$(git show "$target:os/components.toml" | python3 -c '
          import sys, tomllib
          print(",".join(c["name"] for c in tomllib.loads(sys.stdin.read())["component"]
                         if c.get("kind") == "userspace"))') ;;
          esac

          only=${INPUT_ONLY:-}
          if [[ $EVENT == pull_request ]]; then
            # The whole diff: ci_select.py ignores what no check proves.
            mapfile -t changed < <(git diff --name-only "$PR_BASE...$PR_HEAD")
            only=$(python3 scripts/vm-acceptance/ci_select.py "${changed[@]}")
          fi

          gl=${INPUT_GL:-auto}
          case $gl in
            auto) compgen -G '/dev/dri/renderD*' >/dev/null && gl=on || gl=off ;;
            on|off) ;;
            *) echo '::error::gl must be auto, on or off'; exit 1 ;;
          esac

          {
            echo "ref=$ref"
            echo "target=$target"
            echo "commit=$commit"
            echo "behind=$behind"
            echo "bridge=$bridge"
            echo "disk-url=$disk_url"
            echo "image=$image"
            echo "swap=$swap"
            echo "only=$only"
            echo "outputs=${INPUT_OUTPUTS:-1920x1080@1,1280x800@1.25}"
            echo "gl=$gl"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::testing $ref (${target:0:12}) on the dev disk of ${commit:0:12} ($behind commits behind) from ${disk_url:-$image}; swap: ${swap:-nothing}; checks: ${only:-all}; gl=$gl"
          if (( behind > BEHIND_WARN )); then
            echo "::warning::the base disk is $behind commits behind ${target:0:12}: only the swapped components ($swap) are the ref's code"
          fi

      - name: Check out the ref under test
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: git worktree add --detach "$WORK/src" "$TARGET"

      - name: Build tilo-vm
        run: |
          set -euo pipefail
          (cd "$WORK/src" && cargo build --locked -p tilo-vm)
          install -m 0755 "$WORK/src/target/debug/tilo-vm" /usr/local/bin/tilo-vm

      # Root is the existing native CI build identity. The later acceptance
      # user receives only full signed layers, never builder access or keys.
      - name: Produce exact-source signed cohort layers
        id: cohort
        if: github.event.inputs.prebuilt_cohort == 'true' && contains(format(',{0},', steps.plan.outputs.swap), ',apps+runtime,')
        timeout-minutes: 100
        env:
          SOURCE: ${{ steps.plan.outputs.target }}
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
          COMPONENTS: ${{ steps.plan.outputs.swap }}
        run: |
          set -euo pipefail
          /usr/local/bin/tilo-vm swap-artifact --help >/dev/null
          digest=$(python3 scripts/vm-acceptance/layer_artifacts.py produce \
            --repo "$WORK/src" --directory "$WORK/cohort-produced" \
            --source "$SOURCE" --builder-image "$BUILDER_IMAGE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --components "$COMPONENTS")
          echo "receipt-sha256=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: github.event.inputs.prebuilt_cohort == 'true' && contains(format(',{0},', steps.plan.outputs.swap), ',apps+runtime,')
        with:
          name: vm-cohort-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.plan.outputs.target }}
          path: /var/tmp/vm-acceptance/cohort-produced/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        if: github.event.inputs.prebuilt_cohort == 'true' && contains(format(',{0},', steps.plan.outputs.swap), ',apps+runtime,')
        with:
          name: vm-cohort-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.plan.outputs.target }}
          path: /var/tmp/vm-acceptance/cohort

      - name: Verify the same-run cohort handoff
        if: github.event.inputs.prebuilt_cohort == 'true' && contains(format(',{0},', steps.plan.outputs.swap), ',apps+runtime,')
        env:
          SOURCE: ${{ steps.plan.outputs.target }}
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
          COMPONENTS: ${{ steps.plan.outputs.swap }}
          RECEIPT_SHA256: ${{ steps.cohort.outputs.receipt-sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/vm-acceptance/layer_artifacts.py verify \
            --directory "$WORK/cohort" --source "$SOURCE" --builder-image "$BUILDER_IMAGE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --components "$COMPONENTS" --receipt-sha256 "$RECEIPT_SHA256"

      - name: Build the fixture-matching management client
        if: steps.plan.outputs.bridge == 'true'
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          git worktree add --detach "$WORK/base-cli" "$COMMIT"
          (cd "$WORK/base-cli" && cargo build --locked -p tilo-vm)
          install -m 0755 "$WORK/base-cli/target/debug/tilo-vm" /usr/local/bin/tilo-vm-base

      # Kata's job container has a static /dev; its guest kernel provides FUSE
      # and loop nodes once devtmpfs is mounted (as in Release / Dev VM disk).
      - name: Expose guest FUSE and loop devices
        if: steps.plan.outputs.image != ''
        run: |
          set -euo pipefail
          sudo -n modprobe fuse 2>/dev/null || true
          sudo -n modprobe loop 2>/dev/null || true
          if [[ ! -c /dev/fuse || ! -c /dev/loop-control ]]; then
            sudo -n mount -t devtmpfs devtmpfs /dev
            sudo -n mkdir -p /dev/pts /dev/shm
            [ "$(stat -f -c %T /dev/pts)" = devpts ] || sudo -n mount -t devpts -o gid=5,mode=620,ptmxmode=666 devpts /dev/pts
            mountpoint -q /dev/shm || sudo -n mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          fi
          test -c /dev/fuse && test -c /dev/loop-control
          sudo -n chmod 0666 /dev/fuse
          sudo -n losetup --find >/dev/null

      - name: Use native Podman overlay storage
        if: steps.plan.outputs.image != ''
        run: ./os/dev/ci-native-podman-store.sh

      # The same install Release / Dev VM disk runs: build-image.sh with
      # TILO_SKIP_BUILD=1 writes the dev image to a bootable disk in one pass.
      - name: Install the base dev image to a disk
        if: steps.plan.outputs.image != ''
        timeout-minutes: 60
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          TILO_IMAGE: localhost/tilo-vm:ci
          TILO_SKIP_BUILD: "1"
          TILO_DISTROBOX: ""
          TILO_OUTPUT: /var/tmp/vm-acceptance/install
          TILO_RUN: /var/tmp/vm-acceptance/install-run
          TILO_DISK_SIZE: 64G
        run: |
          set -euo pipefail
          export TILO_TARGET_IMGREF="registry.tilo.so/tilo/tilo-vm:main-${COMMIT:0:7}-ci"
          mkdir -p "$TILO_OUTPUT" "$TILO_RUN"
          podman pull "$IMAGE"
          podman tag "$IMAGE" "$TILO_IMAGE"
          ./os/dev/build-image.sh
          disk="$WORK/tilo-dev-${COMMIT:0:9}.qcow2"
          sudo -n mv "$TILO_OUTPUT/qcow2/disk.qcow2" "$disk"
          echo "DISK=$disk" >> "$GITHUB_ENV"
          echo "OCI_DIGEST=${IMAGE#*@}" >> "$GITHUB_ENV"

      - name: Download the base's published dev disk
        if: steps.plan.outputs.disk-url != ''
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          read -r url sha256 < <(jq -er '.disks[] | select(.format == "qcow2") | "\(.url) \(.sha256)"' "$RUNNER_TEMP/disk.json")
          disk="$WORK/tilo-dev-${COMMIT:0:9}.qcow2"
          mkdir -p "$WORK"
          curl -fsS --retry 3 -H "Authorization: Bearer $REGISTRY_TOKEN" -o "$disk" "$url"
          echo "$sha256  $disk" | sha256sum -c -
          echo "DISK=$disk" >> "$GITHUB_ENV"
          echo "OCI_DIGEST=$(jq -r .imageDigest "$RUNNER_TEMP/disk.json")" >> "$GITHUB_ENV"

      # run.py ties the booted image to a commit through this record, as
      # build-disk.sh writes it for a laptop's disk.
      - name: Record the disk's provenance
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          SOURCE: ${{ steps.plan.outputs.disk-url || steps.plan.outputs.image }}
        run: |
          set -euo pipefail
          jq -n --arg commit "$COMMIT" --arg subject "$(git log -1 --format=%s "$COMMIT")" \
            --arg time "$(git log -1 --format=%cI "$COMMIT")" --arg digest "$OCI_DIGEST" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" --arg source "$SOURCE" \
            '{commit:$commit, subject:$subject, commit_time:$time, oci_digest:$digest,
              built_at:$built, built_by:".forgejo/workflows/vm-acceptance.yml", source:$source}' \
            > "$DISK.provenance.json"
          cat "$DISK.provenance.json"

      # tilo-vm runs VMs in the user's libvirt session, as on a laptop. Root
      # cannot hand passt its socket there, so the run gets its own user, who
      # also builds the swapped components with the builder's toolchain.
      - name: Prepare the libvirt session user
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash "$RUN_USER"
          uid=$(id -u "$RUN_USER")
          install -d -m 0700 -o "$RUN_USER" -g "$RUN_USER" "/run/user/$uid"
          chmod 0666 /dev/kvm
          # Fedora's libvirt raises QEMU's core limit to unlimited, which this
          # container's hard limit refuses; the session takes no core dumps.
          install -d -o "$RUN_USER" -g "$RUN_USER" "/home/$RUN_USER/.config" "/home/$RUN_USER/.config/libvirt"
          echo 'max_core = 0' | install -m 0644 -o "$RUN_USER" -g "$RUN_USER" /dev/stdin "/home/$RUN_USER/.config/libvirt/qemu.conf"
          install -d -o "$RUN_USER" -g "$RUN_USER" "$WORK/report"
          chown -R "$RUN_USER:" "$WORK"
          # tilo-vm writes a receipt per command into the worktree it runs from.
          install -d -o "$RUN_USER" -g "$RUN_USER" target/dev-runs
          # The toolchain is the builder's, installed for root; the cargo cache
          # and the runner's compiler cache settings carry over.
          chown -R "$RUN_USER:" "$CARGO_HOME"
          # The compiler cache server root started for tilo-vm writes outputs
          # as root; the run user's builds start their own.
          [[ -z ${RUSTC_WRAPPER:-} ]] || "$RUSTC_WRAPPER" --stop-server >/dev/null 2>&1 || true
          keep=$(env | sed -n 's/^\(RUSTC_WRAPPER\|SCCACHE_[A-Z0-9_]*\|ACTIONS_[A-Z0-9_]*\|AWS_[A-Z0-9_]*\|CARGO_[A-Z0-9_]*\|RUSTUP_HOME\|TILO_[A-Z0-9_]*\)=.*/\1/p' | paste -sd, -)
          {
            echo "RUN_UID=$uid"
            echo "RUN_KEEP=$keep"
          } >> "$GITHUB_ENV"
          # The session daemon started here outlives this step; let it set
          # any core limit QEMU asks for.
          ulimit -Hc unlimited 2>/dev/null || echo "::notice::core hard limit stays $(ulimit -Hc)"
          as_user() { sudo -n -u "$RUN_USER" -H --preserve-env="$keep" env "XDG_RUNTIME_DIR=/run/user/$uid" "PATH=$PATH" "$@"; }
          echo "the run user keeps: $keep"
          as_user cargo -V
          as_user virsh --connect qemu:///session capabilities | grep -q "<domain type='kvm'"
          as_user tilo-vm doctor || true

      - name: Run the acceptance suite
        id: run
        timeout-minutes: 150
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          REF: ${{ steps.plan.outputs.ref }}
          SWAP: ${{ steps.plan.outputs.swap }}
          ONLY: ${{ steps.plan.outputs.only }}
          OUTPUTS: ${{ steps.plan.outputs.outputs }}
          GL: ${{ steps.plan.outputs.gl }}
          BRIDGE: ${{ steps.plan.outputs.bridge }}
          PREBUILT_COHORT: ${{ github.event.inputs.prebuilt_cohort }}
          SOURCE: ${{ steps.plan.outputs.target }}
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
          RECEIPT_SHA256: ${{ steps.cohort.outputs.receipt-sha256 }}
        run: |
          set -euo pipefail
          args=(--disk "$DISK" --commit "$COMMIT" --outputs "$OUTPUTS" --out "$WORK/report"
                --tilo-vm /usr/local/bin/tilo-vm
                --records "$WORK/report/records.jsonl" --runner runner-disk-100g)
          [[ $BRIDGE != true ]] || args+=(--bootstrap-tilo-vm /usr/local/bin/tilo-vm-base --bootstrap-from "$WORK/src" --swap-ref "$REF")
          [[ -z $SWAP ]] || args+=(--swap "$SWAP" --swap-from "$WORK/src" --swap-ref "$REF")
          if [[ $PREBUILT_COHORT == true && ,$SWAP, == *,apps+runtime,* ]]; then
            args+=(--artifact-receipt "$WORK/cohort/manifest.json" --artifact-source "$SOURCE"
                   --artifact-builder-image "$BUILDER_IMAGE" --artifact-run-id "$GITHUB_RUN_ID"
                   --artifact-run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-receipt-sha256 "$RECEIPT_SHA256")
          fi
          [[ -z $ONLY ]] || args+=(--only "$ONLY")
          [[ $GL != on ]] || args+=(--gl)
          # The checkout is root's; git reads it for the run's commit names.
          sudo -n -u "$RUN_USER" -H --preserve-env="$RUN_KEEP" env \
            "XDG_RUNTIME_DIR=/run/user/$RUN_UID" "PATH=$PATH" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*' \
            python3 scripts/vm-acceptance/run.py "${args[@]}"

      - name: Write the report to the job summary
        if: always()
        env:
          REF: ${{ steps.plan.outputs.ref }}
          TARGET: ${{ steps.plan.outputs.target }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          BEHIND: ${{ steps.plan.outputs.behind }}
          SWAP: ${{ steps.plan.outputs.swap }}
        run: |
          set -euo pipefail
          report="$WORK/report/report.md"
          [[ -f $report ]] || { echo '::warning::the run wrote no report'; exit 0; }
          {
            if (( ${BEHIND:-0} > BEHIND_WARN )); then
              echo "> [!WARNING]"
              echo "> **The base disk is $BEHIND commits behind $REF (${TARGET:0:12})**: it is main ${COMMIT:0:12}, the newest with a published dev image. Only the swapped components (${SWAP:-none}) are $REF's code; everything else is the base's."
              echo
            elif [[ $COMMIT != "$TARGET" ]]; then
              echo "> Tested $REF (${TARGET:0:12}) on the dev disk of main ${COMMIT:0:12}, $BEHIND commits behind, with ${SWAP:-nothing} swapped in from $REF."
              echo
            fi
            cat "$report"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '"score: \([.results[] | select(.status == "pass")] | length)/\(.results | length) checks pass (\(.overall))"' \
            "$WORK/report/report.json"

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: vm-acceptance-${{ steps.plan.outputs.target }}
          path: /var/tmp/vm-acceptance/report
          if-no-files-found: warn

      # The run's performance records (run.py --records) for the perf job below.
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-vm
          path: /var/tmp/vm-acceptance/report/records.jsonl
          if-no-files-found: warn

  # The installed desktop's KPIs (boot, idle, memory, app, render) as performance
  # records, compared with the store's rolling baseline and tools/perf/kpi-budgets.toml
  # the way Perf / scheduled compares its groups (DEVELOPMENT.md, "Performance
  # results"). They come from this workflow's VM run rather than a second one there.
  # Its verdict is this job's, apart from the acceptance checks'. Only the nightly run
  # on main, and a dispatch of every check on main, write to the store; the rest
  # compare read-only.
  perf:
    needs: acceptance
    if: ${{ always() && needs.acceptance.result != 'cancelled' && needs.acceptance.result != 'skipped' }}
    runs-on: runner-quality
    timeout-minutes: 15
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/perf
            tools/upload_immutable_packages.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: perf-vm
          path: results

      - name: Compare with the store and publish
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ needs.acceptance.outputs.only }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_SWAP: ${{ github.event.inputs.swap }}
          INPUT_GL: ${{ github.event.inputs.gl }}
          TILO_PACKAGE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          if [[ ! -s results/records.jsonl ]]; then
            if [[ -n ${ONLY:-} ]]; then
              echo "::notice::the selected checks ($ONLY) recorded no performance KPI"
              exit 0
            fi
            echo "::error::the acceptance run wrote no performance records (it aborted, or measured nothing)"
            exit 1
          fi
          # A run of every check owes every group of its lane in
          # tools/perf/kpi-budgets.toml (render: only the KPIs this lane
          # claims); a subset is compared for what it measured.
          groups=""
          [[ -n ${ONLY:-} ]] || groups=boot,session,idle,memory,disk,app,render
          publish=false
          if [[ $GITHUB_REF == refs/heads/main && -z ${ONLY:-} ]]; then
            case $EVENT in
              schedule) publish=true ;;
              workflow_dispatch)
                [[ ${INPUT_REF:-main} == main && ${INPUT_SWAP:-default} == default && ${INPUT_GL:-auto} == auto ]] \
                  && publish=true ;;
            esac
          fi
          status=0
          python3 tools/perf/compare.py --results results/records.jsonl --store "$GITHUB_SERVER_URL" \
            --owner "$owner" --lane vm-acceptance --groups "$groups" --publish-dir publish \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-vm" --summary summary.md || status=1
          if [[ $publish == true ]]; then
            manifest=$(mktemp)
            for file in publish/*/*.jsonl; do
              month=$(basename "$(dirname "$file")")
              printf '%s\t%s\n' "$file" \
                "$GITHUB_SERVER_URL/api/packages/$owner/generic/tilo-perf-results/$month/$(basename "$file")"
            done > "$manifest"
            bash tools/upload_immutable_packages.sh "$manifest" || status=1
          else
            echo "Not the nightly run of every check on main: compared only, nothing written to the store."
          fi
          [[ -f summary.md ]] && cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: perf-vm-summary
          path: |
            summary.md
            publish/
          if-no-files-found: warn
