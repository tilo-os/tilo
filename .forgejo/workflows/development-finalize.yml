name: Development / finalize retained ARM rootfs

on:
  workflow_dispatch:
    inputs:
      helpers_revision:
        description: Reviewed full helper commit, including finalization fixes
        required: true
        type: string
      request:
        description: Bounded public finalization request JSON; operator must be ready before dispatch
        required: true
        type: string
      request_sha256:
        description: SHA256 of exact request UTF-8 bytes
        required: true
        type: string
      restore_run_id:
        description: Prior failed internal run ID containing an explicit stage-5 registry checkpoint
        required: false
        default: ""
        type: string
      restore_run_attempt:
        description: Prior failed run attempt containing the checkpoint artifact
        required: false
        default: ""
        type: string
      restore_receipt_sha256:
        description: Independently recorded canonical SHA256 of the prior stage-5 receipt
        required: false
        default: ""
        type: string

concurrency:
  group: development-arm-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    runs-on: runner-disk-100g-arm64
    # Covers five independently bounded human signing-response windows. Build
    # commands retain their smaller request-bound stage deadlines.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate pinned public inputs
        id: validated
        env:
          FINALIZATION_REQUEST: ${{ inputs.request }}
          FINALIZATION_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          RESTORE_RUN_ATTEMPT: ${{ inputs.restore_run_attempt }}
          RESTORE_RECEIPT_SHA256: ${{ inputs.restore_receipt_sha256 }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, re
          spec = importlib.util.spec_from_file_location('worker', 'controller/os/dev/launch-finalization-worker.py')
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)
          data = worker.request_bytes(os.environ['FINALIZATION_REQUEST'], os.environ['FINALIZATION_REQUEST_SHA256'], os.environ['HELPERS_REVISION'])
          request_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'finalization-request.json'
          request_path.write_bytes(data)
          restore = [os.environ[name] for name in ('RESTORE_RUN_ID', 'RESTORE_RUN_ATTEMPT', 'RESTORE_RECEIPT_SHA256')]
          if any(restore) != all(restore):
              raise ValueError('stage-5 restore inputs must be supplied together')
          if all(restore) and (not restore[0].isdecimal() or not restore[1].isdecimal()
                  or not re.fullmatch(r'[0-9a-f]{64}', restore[2])):
              raise ValueError('invalid stage-5 restore identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_revision=' + json.loads(data)['source_revision'] + '\n')
              output.write('restore_stage5=' + ('true' if all(restore) else 'false') + '\n')
          PY
      - name: Retrieve authenticated prior stage-5 evidence
        if: steps.validated.outputs.restore_stage5 == 'true'
        env:
          TASK_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          RESTORE_RUN_ATTEMPT: ${{ inputs.restore_run_attempt }}
          RESTORE_RECEIPT_SHA256: ${{ inputs.restore_receipt_sha256 }}
        run: |
          python3 controller/os/dev/fetch-finalization-stage5.py \
            --run-id "$RESTORE_RUN_ID" --attempt "$RESTORE_RUN_ATTEMPT" \
            --receipt-sha256 "$RESTORE_RECEIPT_SHA256" \
            --request "$RUNNER_TEMP/finalization-request.json" \
            --output "$RUNNER_TEMP/stage5-evidence"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ steps.validated.outputs.source_revision }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: helpers
          ref: ${{ inputs.helpers_revision }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Finalize only, with operator-bound external signing
        timeout-minutes: 710
        env:
          FINALIZATION_REQUEST: ${{ inputs.request }}
          FINALIZATION_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          HELPERS_REVISION: ${{ inputs.helpers_revision }}
          RESTORE_STAGE5: ${{ steps.validated.outputs.restore_stage5 }}
        run: |
          restore_args=()
          if [ "$RESTORE_STAGE5" = true ]; then
            restore_args=(--restore-stage5 "$RUNNER_TEMP/stage5-evidence")
          fi
          python3 controller/os/dev/launch-finalization-worker.py \
            --controller "$PWD/controller" --source "$PWD/source" --helpers "$PWD/helpers" \
            --evidence "$RUNNER_TEMP/finalization-evidence" "${restore_args[@]}"
      - name: Retain bounded public receipts
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalization-evidence/
          if-no-files-found: warn
          retention-days: 14
