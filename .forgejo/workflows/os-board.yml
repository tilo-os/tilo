name: Build / OS board image

# Build a board's sealed development image on the native arm64 runner and move
# the board's dev channel to it. The image chain is tools/ci/build-os.sh, the
# same steps a development machine runs; the runner supplies what they need: a
# native overlay store on a disposable ext4 volume, the Kata guest's loop
# devices, and the commit's date, which t hands the checks that build.
# The board image is what `tilo device update` pulls from
# registry.tilo.so/tilo/tilo-vm:<board>-ci; nothing here signs or releases.
on:
  workflow_dispatch:
    inputs:
      board:
        description: "Hardware profile the image seals (os/hardware/profiles/<board>.json)"
        required: true
        default: "orangepi-3b-v2-1"
        type: string
      move_channel:
        description: "Move the board's dev channel (<board>-ci) to this build when it moves forward"
        required: true
        default: true
        type: boolean
      jobs:
        description: "Cargo jobs the compiles run with"
        required: true
        default: "8"
        type: string

concurrency:
  group: os-board-${{ github.ref }}-${{ github.event.inputs.board }}
  cancel-in-progress: false

jobs:
  board:
    runs-on: runner-large-arm64
    # No job may need more than three hours; a slower one is a bug to fix.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the runner's native architecture
        run: ./os/dev/assert-native-arch.sh "$(python3 -I -c 'import json,sys; print(json.load(open("os/hardware/profiles/${{ github.event.inputs.board }}.json"))["architecture"])')"

      - name: Install the image and disk tools
        run: |
          set -euo pipefail
          sudo -n true
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -n apt-get -o Acquire::Retries=3 update
            sudo -n apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              binutils btrfs-progs dosfstools e2fsprogs fuse-overlayfs jq podman \
              qemu-efi-aarch64 qemu-utils skopeo slirp4netns systemd uidmap util-linux zstd
          elif command -v dnf >/dev/null; then
            sudo -n dnf --setopt=retries=3 install -y \
              binutils btrfs-progs dosfstools e2fsprogs fuse-overlayfs jq podman \
              qemu-img qemu-utils skopeo slirp4netns systemd util-linux zstd
          else
            echo '::error::native arm64 runner must provide apt-get or dnf'
            exit 1
          fi
          command -v jq losetup podman qemu-img skopeo systemd-repart zstd >/dev/null

      - name: Use the Kata guest's disk devices and a native overlay store
        env:
          TILO_PODMAN_STORE_SIZE: 100G
        run: |
          bash os/dev/ci-prepare-disk-devices.sh --kata-job
          bash os/dev/ci-native-podman-store.sh

      - name: Date the images by this commit
        # The image steps read no Git inside their build containers, as t gives them the
        # date of what they build (tools/ci/publish/source-date.sh); a commit's time here.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Prove the build containers read this commit
        run: |
          set -euo pipefail
          commit=$(git rev-parse --verify HEAD)
          mirror=$(awk -F '\t' '$1 == "registry.tilo.so/tilo/buildah" { print $1 "@" $3; exit }' \
            tools/ci/publish/mirrored-images.tsv)
          seen=$(podman run --rm --privileged --security-opt label=disable --workdir /src \
            -v "$PWD:/src" -e HOME=/root --entrypoint bash "$mirror" -ec 'git rev-parse --verify HEAD')
          [[ $seen == "$commit" ]] || {
            echo "::error::$mirror sees commit $seen of the checkout, not $commit"
            exit 1
          }

      - name: Build the OS image, the development image and the board's sealed image
        env:
          BOARD: ${{ github.event.inputs.board }}
          JOBS: ${{ github.event.inputs.jobs }}
        run: |
          set -euo pipefail
          # The steps' shared state lives on the ext4 volume the store step mounted,
          # where the images' own Podman keeps a native overlay store and every
          # layer commit copies a file instead of walking its parent.
          target="$(dirname "$CONTAINERS_STORAGE_CONF")/os"
          start=$SECONDS
          # A build part that prints nothing for minutes is waiting on something the
          # log cannot show: say what each process sits in, on which syscall, and
          # what the store and the network look like, then fail rather than hold a
          # slot until the job's ceiling.
          progress=$(mktemp)
          printf '%s\n' "$(date +%s)" > "$progress"
          report_waiting() {
            local quiet=$1 pid socket
            echo "::warning::no build output for ${quiet}s; what the build waits on:"
            ps -eo pid,ppid,stat,wchan:30,etime,pcpu,rss,args --sort=-rss | head -25 || true
            for pid in $(ps -eo pid,args | awk '/cargo|rustc|git |buildah/ && !/awk/ {print $1}'); do
              echo "--- pid $pid: $(ps -o args= -p "$pid" 2>/dev/null | cut -c1-110)"
              sudo -n grep -E '^(State|Threads)' "/proc/$pid/status" 2>&1 | sed 's/^/  /' || true
              sudo -n cat "/proc/$pid/syscall" 2>&1 | sed 's/^/  syscall: /' || true
              sudo -n cat "/proc/$pid/stack" 2>&1 | head -10 | sed 's/^/  stack: /' || true
              for socket in $(sudo -n ls -l "/proc/$pid/fd" 2>/dev/null | awk '$NF ~ /^socket:/ {print $9}'); do
                sudo -n readlink "/proc/$pid/fd/$socket" 2>&1 | sed 's/^/  fd: /' || true
              done
            done
            sudo -n cat /proc/net/tcp /proc/net/tcp6 2>&1 | head -20 || true
            # Can the build reach what it fetches from where it runs?
            head -4 /etc/resolv.conf || true
            getent hosts index.crates.io || true
            if command -v curl >/dev/null; then
              for url in https://index.crates.io/config.json \
                https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Everything/aarch64/os/repodata/repomd.xml; do
                curl -sS -m 20 -o /dev/null -w "  $url %{http_code} %{time_total}s %{remote_ip}\n" "$url" ||
                  echo "  $url did not answer"
              done
            fi
            df -h "$target" / 2>&1 || true
            free -m || true
            cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory 2>&1 || true
            command -v dmesg >/dev/null && { sudo -n dmesg 2>&1 | tail -20 || true; }
          }
          # What the build prints dates its progress, and the build runs in its own
          # process group, so a build that stops moving can be ended below.
          fifo=$(mktemp -u)
          mkfifo "$fifo"
          ( set +e
            while IFS= read -r line; do
              printf '%7ds %s\n' "$((SECONDS - start))" "$line"
              printf '%(%s)T\n' -1 > "$progress"
            done < "$fifo"
          ) &
          prefix_pid=$!
          stalled=$(mktemp)
          rm -f "$stalled"
          setsid bash tools/ci/build-os.sh --target "$target" --jobs "$JOBS" \
            image dev-image board "$BOARD" > "$fifo" 2>&1 &
          build=$!
          ( set +e
            reported=0
            while kill -0 "$build" 2>/dev/null; do
              sleep 30
              quiet=$(( $(date +%s) - $(cat "$progress") ))
              if (( quiet > 480 && quiet - reported > 600 )); then
                reported=$quiet
                report_waiting "$quiet"
              fi
              # Nothing printed and nothing running: the build waits on something
              # that will not come back, such as a connection that stopped
              # delivering. End it here, with the report above, rather than hold
              # this slot to the job's ceiling.
              load=$(awk '{ print int($1 * 100) }' /proc/loadavg)
              if (( quiet > 900 && load < 100 )); then
                echo "::error::the build printed nothing for ${quiet}s and runs nothing; ending it"
                : > "$stalled"
                kill -TERM -- "-$build" 2>/dev/null || kill -TERM "$build" 2>/dev/null || true
                break
              fi
            done
          ) &
          watchdog=$!
          trap 'kill "$watchdog" 2>/dev/null || true' EXIT
          status=0
          wait "$build" || status=$?
          # The reader ends when the build's output does; anything the build left
          # behind that still holds it must not keep the step waiting.
          timeout 60 tail --pid="$prefix_pid" -f /dev/null 2>/dev/null || true
          kill "$prefix_pid" 2>/dev/null || true
          rm -f "$fifo"
          test ! -e "$stalled" || exit 1
          (( status == 0 )) || exit "$status"
          ls -l "$target/publish/os-board/$BOARD" "$target/publish/os-board/$BOARD/disk"

      - name: Publish the board image and move its dev channel
        env:
          BOARD: ${{ github.event.inputs.board }}
          MOVE_CHANNEL: ${{ github.event.inputs.move_channel }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The image is what main's board channel and its per-commit tag carry, so only
          # main publishes it.
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::board images publish from main, not $GITHUB_REF"
            exit 1
          }
          target="$(dirname "$CONTAINERS_STORAGE_CONF")/os"
          out="$target/publish/os-board/$BOARD"
          test "$(cat "$out/board")" = "$BOARD"
          test "$(cat "$out/revision")" = "$GITHUB_SHA"
          # The tags this commit's board image takes: the immutable one its update
          # origin names, and the board's dev channel when it moves only forward.
          export T_REF=main T_COMMIT="$GITHUB_SHA"
          . tools/ci/publish/lib.sh
          tags=("main-${GITHUB_SHA:0:7}-$BOARD")
          if [[ $MOVE_CHANNEL == true ]]; then
            current=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' \
              "docker://registry.tilo.so/tilo/tilo-vm:$BOARD-ci" 2>/dev/null) || current=
            moves_forward "$current" && tags+=("$BOARD-ci")
          fi
          REGISTRY_USER=$GITHUB_ACTOR REGISTRY_PASSWORD=$REGISTRY_TOKEN \
            bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-vm "$out" "${tags[@]}"
          cat "$out/receipt.json"
