name: Operations / registry image copy

# Operator-dispatched: copies every image this tree references from the
# forge's registry to registry.tilo.so with the same digests
# (tools/ci/copy-images-to-tilo-registry.sh). The default is a dry run that
# only prints the plan. registry.tilo.so accepts this job's token for pushes
# below tilo/; re-signing uses the release KMS key, because a
# copied signature names the old repository and matchRepository refuses it.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Copy (false prints the plan only)"
        type: boolean
        default: false
      all_tags:
        description: "Copy every tag of each referenced repository, not only pinned tags and digests"
        type: boolean
        default: false
      resign:
        description: "Re-sign copied digests of signature-required repositories under their new name"
        type: boolean
        default: false
      extra_references:
        description: "Space-separated code.tilo.so references this tree does not pin (e.g. infra's runner label images)"
        type: string
        default: ""

concurrency:
  group: copy-images-to-tilo-registry
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/main'
    runs-on: runner
    timeout-minutes: 360
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner image carries no skopeo. Install it from the distribution
      # the way the builder publication job does, in the dry run too, so a
      # dry run that passes proves the real run can start.
      - name: Install skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends software-properties-common
              sudo -n add-apt-repository --yes universe
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends skopeo jq
            else
              sudo -n dnf install -y skopeo jq
            fi
          fi
          skopeo --version
          jq --version
      - name: Install checksum-pinned Cosign
        if: inputs.resign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64
      - name: Copy images
        env:
          # Every owner that published images here lands in tilo/ on the new
          # registry: the repository's own owner and the anonymous public one.
          OWNER_MOVES: ${{ github.repository_owner }}:tilo public:tilo
          SOURCE_USERNAME: ${{ github.actor }}
          SOURCE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DEST_USERNAME: ${{ github.actor }}
          DEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
          ALL_TAGS: ${{ inputs.all_tags && '1' || '0' }}
          RESIGN: ${{ inputs.resign && '1' || '0' }}
          EXTRA_REFERENCES: ${{ inputs.extra_references }}
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: tools/ci/copy-images-to-tilo-registry.sh
