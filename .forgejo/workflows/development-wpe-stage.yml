name: Development / completed native WPE stage

on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        options: [x86_64, aarch64]
        required: true
        default: x86_64
      wpe_candidate:
        description: Reviewed native tilo-wpe-buildroot@sha256 dependency input
        required: true
        type: string
      tools_builder:
        description: Reviewed native tilo-builder@sha256 tools base; architecture is checked before use
        required: true
        type: string
        default: code.podesta.ai/qos/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9

concurrency:
  group: development-wpe-stage-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ${{ inputs.architecture == 'aarch64' && 'tilo-package-arm64' || 'tilo-package' }}
    # Keep within the existing three-hour runner limit.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          persist-credentials: false
      - name: Validate native producer inputs
        id: inputs
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TOOLS_BUILDER: ${{ inputs.tools_builder }}
        run: |
          set -euo pipefail
          bash os/dev/assert-native-arch.sh "$ARCHITECTURE"
          python3 os/tests/test_produce_wpe_stage.py
          python3 - <<'PY'
          import argparse, importlib.util, os, pathlib, re
          spec = importlib.util.spec_from_file_location('producer', 'os/dev/produce-wpe-stage.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate(argparse.Namespace(architecture=os.environ['ARCHITECTURE'],
              wpe=os.environ['WPE_CANDIDATE'], tools_builder=os.environ['TOOLS_BUILDER'],
              revision=os.environ['GITHUB_SHA'], branch=os.environ['GITHUB_REF'],
              run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT']))
          script = pathlib.Path('os/dev/build-wpe.sh').read_text()
          paths = []
          for variable in ('LIBWPE', 'FDO', 'WPEWK'):
              names = re.findall('^' + variable + r'=([a-z0-9.-]+\.tar\.xz)$', script, re.MULTILINE)
              if len(names) != 1:
                  raise ValueError('exact WPE archive pin required')
              paths.append(str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'wpe-source-archives' / names[0]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('archive_paths<<WPE_ARCHIVES\n' + '\n'.join(paths) + '\nWPE_ARCHIVES\n')
          PY
          bash os/dev/install-cached-cosign.sh
      - name: Restore only the three immutable WPE archives
        id: archives
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.inputs.outputs.archive_paths }}
          key: tilo-wpe-source-archives-v1-${{ hashFiles('os/dev/build-wpe.sh') }}
          restore-keys: tilo-wpe-source-archives-v1-
      - name: Verify or fetch selected archives and copy only complete files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess
          script = pathlib.Path('os/dev/build-wpe.sh').read_text()
          names = []
          for variable in ('LIBWPE', 'FDO', 'WPEWK'):
              matches = re.findall('^' + variable + r'=([a-z0-9.-]+\.tar\.xz)$', script, re.MULTILINE)
              if len(matches) != 1:
                  raise ValueError('exact WPE archive pin required')
              names.extend(matches)
          cache = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wpe-source-archives'
          subprocess.run(['bash', 'os/dev/cache-github-assets.sh', *names],
              env=os.environ | {'TILO_GITHUB_ASSET_CACHE': str(cache)}, check=True)
          target = pathlib.Path('os/external-assets/cache')
          target.mkdir(parents=True, exist_ok=True)
          for name in names:
              shutil.copyfile(cache / name, target / name)
          PY
      - name: Save verified selected archives before compilation
        if: steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.inputs.outputs.archive_paths }}
          key: tilo-wpe-source-archives-v1-${{ hashFiles('os/dev/build-wpe.sh') }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Produce and retain completed WPE payload
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          WPE_CANDIDATE: ${{ inputs.wpe_candidate }}
          TOOLS_BUILDER: ${{ inputs.tools_builder }}
        run: |
          set -euo pipefail
          name="tilo-wpe-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          context=$(mktemp -d)
          evidence="$RUNNER_TEMP/wpe-stage-evidence"
          mkdir "$evidence"
          cleanup() {
            for file in admission.json inputs.json phases.json result.json wpe-stage.json compiler-diagnostics.json; do
              docker cp "$name:/evidence/$file" "$evidence/$file" >/dev/null 2>&1 || true
            done
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-work" "$name-storage" >/dev/null 2>&1 || true
            docker image rm "$name:tools" >/dev/null 2>&1 || true
            rm -rf -- "$context"
          }
          trap cleanup EXIT
          case "$ARCHITECTURE" in x86_64) oci=amd64 ;; aarch64) oci=arm64 ;; *) exit 2 ;; esac
          docker pull --platform "linux/$oci" "$TOOLS_BUILDER"
          test "$(docker image inspect --format '{{.Architecture}}' "$TOOLS_BUILDER")" = "$oci"
          cp "$(command -v cosign)" "$context/cosign"
          cp os/Containerfile.development-compile "$context/Containerfile"
          docker build --file "$context/Containerfile" --tag "$name:tools" \
            --build-arg "BUILDER_REF=$TOOLS_BUILDER" "$context"
          docker volume create "$name-work"
          docker volume create "$name-storage"
          # Private volumes inside the disposable CI guest; no host devices or
          # host directories. Registry auth is copied after building the tools.
          docker create --name "$name" --privileged --memory=23g --memory-swap=23g \
            --mount "type=volume,src=$name-work,dst=/work" \
            --mount "type=volume,src=$name-storage,dst=/var/lib/containers" \
            --env REGISTRY_AUTH_FILE=/registry-auth.json --entrypoint python3 "$name:tools" \
            os/dev/produce-wpe-stage.py --architecture "$ARCHITECTURE" \
            --revision "$GITHUB_SHA" --branch "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --wpe "$WPE_CANDIDATE" --tools-builder "$TOOLS_BUILDER"
          docker cp . "$name:/work/repo"
          python3 - "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "$context/registry-auth.json" <<'PY'
          import json, os, sys
          registry = 'code.podesta.ai'
          credentials = json.load(open(sys.argv[1]))['auths'][registry]
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              json.dump({'auths': {registry: credentials}}, output)
          PY
          docker cp "$context/registry-auth.json" "$name:/registry-auth.json"
          docker start --attach "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Retain public producer evidence only
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: development-wpe-stage-${{ inputs.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/wpe-stage-evidence/
          if-no-files-found: warn
          retention-days: 14
