name: Release / relay

# Builds the standalone qos-relay container image (see
# os/containers/qos-relay/Containerfile). Same publish cadence as
# the full OS image: PRs and pushes to main build-only; a version
# tag (`v*`) or a manual dispatch pushes to the registry.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "crates/hosting/qos-relay/**"
      - "os/containers/qos-relay/**"
      - "crates/identity/qos-user-identity/**"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/qos-relay.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/hosting/qos-relay/**"
      - "os/containers/qos-relay/**"
      - "crates/identity/qos-user-identity/**"
      - "os/external-assets/github-assets.tsv"
      - "os/dev/cache-github-assets.sh"
      - "os/dev/install-cached-cosign.sh"
      - ".forgejo/workflows/qos-relay.yaml"
  workflow_dispatch:

concurrency:
  group: qos-relay-image-${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}

jobs:
  build-and-push:
    runs-on: runner
    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Verify the relay-only Compose contract
        run: bash os/containers/qos-relay/test-contract.sh

      # Login is required on every build now (build-only or push): the
      # Containerfile FROMs the private frozen RPM repo, which needs
      # registry auth to pull.
      - name: Log in to the code.podesta.ai registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same mirrored, digest-pinned base as the OS image — see
      # os/base-snapshot.env for why the base is a mirror and not quay.io.
      - name: Load the pinned BASE_REF
        run: |
          if [ ! -f os/base-snapshot.env ]; then
            echo "::error::os/base-snapshot.env missing — run the mirror-base workflow first"
            exit 1
          fi
          . os/base-snapshot.env
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::BASE_REF not set in os/base-snapshot.env"
            exit 1
          fi
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          echo "base=$BASE_REF"

      - name: Load the pinned RPMS_REF
        run: |
          if [ ! -f os/rpms-snapshot.env ]; then
            echo "::error::os/rpms-snapshot.env missing — run the snapshot-rpms workflow first"
            exit 1
          fi
          . os/rpms-snapshot.env
          if [ -z "${RPMS_REF:-}" ]; then
            echo "::error::RPMS_REF not set in os/rpms-snapshot.env"
            exit 1
          fi
          echo "RPMS_REF=$RPMS_REF" >> "$GITHUB_ENV"
          echo "rpms=$RPMS_REF"

      - name: Compute SOURCE_DATE_EPOCH (HEAD commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up buildx for registry cache export
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: code.podesta.ai/qos/qos-relay
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            # workflow_dispatch off a non-main branch — without this, the metadata
            # step emits zero tags and the push fails "tag is needed". Derives a
            # "<branch>-<sha>" tag so a manual dispatch from a feature branch still
            # produces a discoverable image without polluting the `latest` channel.
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Build the qos-relay image (push only on tags/dispatch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: os/containers/qos-relay/Containerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
          cache-from: type=registry,ref=code.podesta.ai/qos/qos-relay-buildcache:latest
          cache-to: type=registry,ref=code.podesta.ai/qos/qos-relay-buildcache:latest,mode=max
          provenance: false

      # Optional signing reuses the same key as the OS image so `bootc
      # upgrade` policies can share a trust root. The binary has its own small
      # persistent cache rather than downloading through an installer action.
      - name: Restore checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        id: cosign-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-x86_64-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            cosign-v2.5.2-x86_64-
      - name: Install checksum-pinned Cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          QOS_GITHUB_ASSET_CACHE: os/external-assets/cosign-cache
        run: ./os/dev/install-cached-cosign.sh
      - name: Save checksum-pinned Cosign immediately
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.cosign-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cosign-cache
          key: cosign-v2.5.2-x86_64-${{ hashFiles('os/external-assets/github-assets.tsv') }}

      - name: Sign the published image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            "code.podesta.ai/qos/qos-relay@${{ steps.build.outputs.digest }}"
