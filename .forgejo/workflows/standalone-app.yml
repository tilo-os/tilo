name: CI / standalone app

# An app developer needs GCC, Python 3.11+ and rustup: no Tilo checkout or
# GUI development packages. This installs tilo-app from the commit under test
# into a bare Fedora, then creates, checks and packages an app outside any
# checkout, so a dependency that starts demanding
# a -dev package fails here rather than on a developer's machine. It compiles
# the CLI and an app from cold, so it runs nightly, on demand, and on pull
# requests that touch the install path itself; it is not a required check.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/dev/tilo-app-cli/build.rs"
      - "crates/dev/tilo-app-cli/Cargo.toml"
      - "crates/dev/tilo-app-cli/src/native_libs.rs"
      - "crates/dev/tilo-app-cli/src/standalone.rs"
      - "crates/sdk/tilo-host/Cargo.toml"
      - "crates/sdk/font-catalog/build.rs"
      - "tools/font-catalog.py"
      - "rust-toolchain.toml"
      - "tools/ci/standalone-app.sh"
      - ".forgejo/workflows/standalone-app.yml"

concurrency:
  group: standalone-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standalone-app:
    runs-on: runner
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tilo-app, then create, check and package an app
        env:
          IMAGE: registry.fedoraproject.org/fedora:44@sha256:55159f5c92b7baf5f1c1ca1d727c95e77a4cb77c0829b2c11740a700ff4ea02b
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          docker run --rm -i -e CARGO_BUILD_JOBS=4 -e CARGO_TERM_COLOR=never "$IMAGE" \
            bash -s -- --bootstrap --git "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" --rev "$REV" \
            < tools/ci/standalone-app.sh
