name: Dev / focused test

# Diagnostic evidence, not a replacement for required PR checks. Workflow code
# comes from the dispatch ref; source_sha selects only the code being tested.
# Forgejo ignores workflow permissions keys. Checkout credentials are removed;
# no publication or signing secret is passed to the source build.
# Repeated exact tests are supplemental diagnostics. The same job admission,
# resource limits and source test budgets apply; landing still needs full checks.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit (40 lowercase hex characters)'
        required: true
        type: string
      package:
        description: 'One Cargo workspace package; mutually exclusive with packages'
        required: false
        type: string
      packages:
        description: 'JSON array of 1-64 workspace packages; check-tests only'
        required: false
        type: string
      operation:
        description: 'Exact tests, package test compilation, fixed native observations, or history backtraces'
        required: true
        default: test
        type: choice
        options: [test, check-tests, inspect-native, history-backtrace]
      test_target:
        description: 'Integration target, e.g. it; empty for lib or check-tests'
        required: false
        type: string
      target_kind:
        description: 'Integration target or package library tests'
        required: true
        default: integration
        type: choice
        options: [integration, lib]
      test_name:
        description: 'One exact Rust test path; mutually exclusive with test_names'
        required: false
        type: string
      test_names:
        description: 'JSON array of 1-32 exact Rust test paths in the same target'
        required: false
        type: string
      repeat_count:
        description: 'Supplemental exact-test iterations, 1-20; stops after a failed iteration'
        required: false
        default: '1'
        type: string

env:
  SOURCE_SHA: ${{ github.event.inputs.source_sha }}
  PACKAGE: ${{ github.event.inputs.package }}
  PACKAGES: ${{ github.event.inputs.packages }}
  OPERATION: ${{ github.event.inputs.operation }}
  TEST_TARGET: ${{ github.event.inputs.test_target }}
  TEST_NAME: ${{ github.event.inputs.test_name }}
  TEST_NAMES: ${{ github.event.inputs.test_names }}
  TARGET_KIND: ${{ github.event.inputs.target_kind }}
  REPEAT_COUNT: ${{ github.event.inputs.repeat_count }}
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  # Deny warnings through per-target flags. Cargo joins these with the
  # target rustflags in .cargo/config.toml (x86-64-v3, frame pointers,
  # hardening); RUSTFLAGS would replace them, giving these builds different
  # codegen, and different pixels, from nightly and local builds.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-D warnings'
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-D warnings'
  WGPU_BACKEND: vulkan
  WGPU_ADAPTER_NAME: llvmpipe

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:0f205596aa1753a7ca1f2f496aa25095f68668ff80a28acbfdc6d0f35f6dcfde
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source: ${{ steps.validate.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate focused request before native admission
        id: validate
        run: python3 -I tools/ci/focused_test.py validate
      - name: Resolve immutable native builder
        id: resolve
        run: python3 tools/ci/resolve_builder.py

  focused:
    needs: builder
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact test source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.builder.outputs.source }}
          path: source
          persist-credentials: false
      - name: Restore source lockfile downloads
        if: github.event.inputs.operation != 'inspect-native'
        id: downloads
        uses: ./control/.forgejo/actions/restore-cargo-downloads
        with:
          lockfile: source/Cargo.lock
      - name: Prepare the headless runtime
        if: github.event.inputs.operation != 'inspect-native'
        run: |
          ./control/os/dev/assert-native-arch.sh x86_64
          driver=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          test -r "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          mkdir -p /tmp/tilo-focused-runtime
          chmod 700 /tmp/tilo-focused-runtime
          bash control/tools/ensure-headless-audio.sh
      - name: Install ephemeral debugger for fixed browser history diagnosis
        if: github.event.inputs.operation == 'history-backtrace'
        run: |
          dnf install -y --setopt=install_weak_deps=False gdb
          package=$(rpm -q --qf 'gdb-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' gdb)
          printf 'TILO_HISTORY_GDB_PACKAGE %s\n' "$package"
          printf 'TILO_HISTORY_GDB_PACKAGE %s\n' "$package" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute focused request
        if: github.event.inputs.operation != 'inspect-native'
        env:
          XDG_RUNTIME_DIR: /tmp/tilo-focused-runtime
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
        run: bash control/tools/with-headless-audio.sh python3 -I control/tools/ci/focused_test.py run --root source --receipt focused-receipt/receipt.json
      - name: Inspect normal native job environment without mounts or device access
        if: github.event.inputs.operation == 'inspect-native'
        env:
          BUILDER_IMAGE: ${{ needs.builder.outputs.image }}
        run: python3 -I control/tools/ci/focused_test.py run --root source
      - name: Preserve focused request and every completed case
        if: always() && github.event.inputs.operation != 'inspect-native'
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: focused-test-${{ github.run_attempt }}
          path: focused-receipt/receipt.json
          if-no-files-found: error
      - name: Save source lockfile downloads
        if: always() && steps.downloads.outputs.cache-hit != 'true' && steps.downloads.outputs.cache-key != ''
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.downloads.outputs.paths }}
          key: ${{ steps.downloads.outputs.cache-key }}
