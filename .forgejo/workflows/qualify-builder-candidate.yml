name: Qualify / unsigned builder candidate

# Temporary: builds os/Containerfile.builder natively for both architectures
# without signing, so check.yml can be dispatched against the candidate
# (builder_image input) before the recipe lands. Nothing resolves these tags
# automatically; only main publishes the signed builder.
on:
  workflow_dispatch:

concurrency:
  group: qualify-builder-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: runner
          - arch: aarch64
            platform: linux/arm64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
      - name: Restore checksum-verified GitHub build inputs
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: os/external-assets/cache
          key: github-assets-all-v1-${{ hashFiles('os/external-assets/github-assets.tsv') }}
          restore-keys: |
            github-assets-all-v1-
      - name: Materialize immutable GitHub build inputs
        run: ./os/dev/cache-github-assets.sh
      - name: Read the pinned toolchain
        run: |
          ch=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          [ -n "$ch" ]
          echo "RUST_CHANNEL=$ch" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            github-assets=os/external-assets/cache
          file: os/Containerfile.builder
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RUST_CHANNEL=${{ env.RUST_CHANNEL }}
          tags: code.podesta.ai/qos/tilo-builder:unsigned-qualification-${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=registry,ref=code.podesta.ai/qos/tilo-builder-buildcache:${{ matrix.arch }}

  index:
    needs: build
    runs-on: runner
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: code.podesta.ai
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Assemble the multi-architecture candidate index
        run: |
          set -euo pipefail
          repo=code.podesta.ai/qos/tilo-builder
          tag="unsigned-qualification-$GITHUB_SHA"
          docker buildx imagetools create --tag "$repo:$tag" \
            "$repo:$tag-x86_64" "$repo:$tag-aarch64"
          docker buildx imagetools inspect "$repo:$tag" | tee -a "$GITHUB_STEP_SUMMARY"
