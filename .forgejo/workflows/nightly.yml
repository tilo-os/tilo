name: CI / nightly workspace

# This is the coverage backstop for dependency-aware pull-request CI. Every
# Cargo package and every target is checked, and every test is executed daily.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  complete:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      # Visual goldens are meaningful only when fonts, Mesa and the software
      # renderer are byte-for-byte identical to the reviewed refresh job.
      # Advance this digest together with refresh-visual-baselines.yml.
      image: code.sandbox.example/qos/tilo-builder@sha256:568fca1f8b4a4b1700c871cca033d2d291a5eb02c4b3be9681410f456b5a7bc9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_BUILD_JOBS: ${{ matrix.arch == 'aarch64' && '1' || '4' }}
      CARGO_INCREMENTAL: "0"
      # Keep dev and test fingerprints compatible. The all-target check and
      # example links can then reuse dependencies emitted by nextest instead
      # of rebuilding the workspace merely to add unused CI debuginfo.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      WGPU_BACKEND: vulkan
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.${{ matrix.arch }}.json
      WGPU_ADAPTER_NAME: llvmpipe
      XDG_RUNTIME_DIR: /tmp/tilo-xdg-runtime
      # Keep this identical to the nextest gpu-golden override. These tests
      # need an idle software Vulkan renderer, not merely serialization with
      # one another; the isolated tail below retains full daily coverage.
      GOLDEN_FILTER: >-
        (package(tilo-ui) and test(typography_visual_regression::)) or
        (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline))) or
        (package(shell) and (test(e2e_shell_flows::) or test(sidebar_wheel_disc_snapshot::)))
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Prepare Rust build caches
        id: rust-build
        uses: ./.forgejo/actions/prepare-rust-build

      - name: Prepare headless runtime
        run: |
          ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'
          test -r "$VK_DRIVER_FILES"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      # This golden-pinned image predates the audio fixture. Install only new
      # packages or replace the audio daemon: never update fonts, Mesa or libraries.
      # A dependency requiring an existing package upgrade must fail the job.
      - name: Ensure isolated audio test dependency
        run: bash tools/ensure-headless-audio.sh

      # Pinned/older builders may predate native PDF capture coverage. Stage
      # only the verified runtime; leave Mesa, fonts and OS packages unchanged.
      - name: Ensure native PDF capture dependency
        run: |
          asset=$(bash tools/ci/install-pdfium.sh --asset-name)
          ./os/dev/cache-github-assets.sh "$asset"
          library=$(bash tools/ci/install-pdfium.sh os/external-assets/cache /usr os/external-assets/github-assets.tsv)
          printf 'TILO_PDFIUM_LIB=%s\n' "$library" >> "$GITHUB_ENV"

      - name: Workspace membership guard
        run: ./scripts/check-workspace-complete.sh

      - name: Check complete workspace formatting
        run: cargo fmt --all --check

      # Build/run tests first so the following checks can reuse emitted
      # rlibs/rmeta instead of compiling metadata before codegen.
      - name: Run every workspace test
        run: >-
          bash tools/ci/measure.sh "nightly workspace nextest" --
          bash scripts/ci-run.sh "cargo nextest --workspace" --
          bash tools/with-headless-audio.sh cargo nextest run --workspace --locked --profile ci
          -E "not ($GOLDEN_FILTER)"

      # This reuses the artifacts compiled above and executes the same number
      # of tests as before. A separate job would duplicate the workspace build;
      # running at the tail makes llvmpipe/lavapipe idle without extra CPU.
      - name: Verify visual goldens on an idle renderer
        run: >-
          bash tools/ci/measure.sh "nightly isolated visual goldens" --
          bash scripts/ci-run.sh "cargo nextest visual goldens" --
          cargo nextest run --workspace --locked --profile ci
          -E "$GOLDEN_FILTER"

      # The fast and complete workspace suites stay deterministic. This one
      # intentionally queries third-party music services; retain its coverage
      # nightly without making ordinary pushes depend on external uptime.
      - name: Probe live music search and stream resolution
        continue-on-error: true
        run: >-
          bash tools/ci/measure.sh "nightly live music integration" --
          cargo nextest run -p music --locked --profile ci --run-ignored all
          -E 'test(live_search_and_stream_resolve_through_the_app)'

      - name: Check every workspace target
        run: >-
          bash tools/ci/measure.sh "nightly all-target check" --
          bash scripts/ci-run.sh "cargo check --workspace --all-targets" --
          cargo check --workspace --locked --all-targets

      # Source-level protocol checks prevent an app from opting out, but only
      # the laid-out production root can prove that visible effect controls
      # resolve to live resources/actions (and that no stale or legacy binding
      # remains). tilo-app builds the graphical apps as one Cargo graph, then
      # runs every binary's deterministic --native-audit entry point.
      - name: Certify every production app action surface
        run: >-
          bash tools/ci/measure.sh "nightly native app certification" --
          bash scripts/ci-run.sh "tilo-app certify --workspace" --
          cargo run --locked -p tilo-app-cli --bin tilo-app -- certify --workspace

      # `cargo check --all-targets` type-checks examples but neither links nor
      # runs their test harnesses. Reuse the test-profile artifacts above to do
      # both here, once per day rather than in a separate job or on every pull
      # request.
      - name: Test every workspace example
        run: >-
          bash tools/ci/measure.sh "nightly workspace examples" --
          bash scripts/ci-run.sh "cargo test --workspace --examples" --
          cargo test --workspace --examples --locked

      - name: Report remote compiler-cache effectiveness
        if: always()
        run: |
          echo "### nightly sccache" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/sccache.sh report 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save Cargo downloads
        if: always() && steps.rust-build.outputs.cargo-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /cargo-home/registry/index
            /cargo-home/registry/cache
            /cargo-home/git/db
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
