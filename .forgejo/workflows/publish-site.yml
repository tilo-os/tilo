name: Publish / site

# The images tilo.sh runs, built from one commit of main, tested and
# pushed as dev-<commit>: the web entry (the Tilo app on the web) and the
# Lounge (one always-on public workspace, relay and Discord bridge). The site
# is released by hand and independently of stable: whoever releases it
# dispatches this on main and pins each receipt's digest in the infra
# repository.
#
# One job of the CI builder:
# privileged only inside the disposable guest, where buildah builds and tests
# each image chrooted, without a daemon.

on:
  workflow_dispatch:

concurrency:
  group: publish-site-${{ github.sha }}
  cancel-in-progress: false

jobs:
  builder:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:585b2dacdaa651cb37ea66a57ec8203301d3724726f1b8c700ee55d2438ef728
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the CI builder
        id: resolve
        run: python3 tools/ci/resolve_builder.py

  publish:
    needs: builder
    # Main only publishes development tags; a branch's build is not the site's.
    if: github.ref == 'refs/heads/main'
    runs-on: runner
    timeout-minutes: 180
    container:
      image: ${{ needs.builder.outputs.image }}
      options: --privileged
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      TILO_SCCACHE_KEY_PREFIX: tilo/site-publish/v1/x86_64
      T_REF: main
      T_COMMIT: ${{ github.sha }}
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Lounge's image publishes every version of its apps' surfaces
          # from their history, so this checkout carries it.
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare Rust build
        uses: ./.forgejo/actions/prepare-rust-build
      - name: Prepare compiler cache
        # The runner offers sccache; a job only uses it once this sets
        # RUSTC_WRAPPER and starts the server. Without it every publish
        # compiled the web desktop from nothing.
        run: bash tools/ci/sccache.sh prepare
      - name: Fetch fonts
        # The download cache step turns font fetching off for hermetic test
        # suites; the scripts here fetch and verify the fonts they ship.
        run: echo TILO_FONT_ASSETS_OFFLINE=0 >> "$GITHUB_ENV"

      - name: Build the Lounge programs
        run: bash tools/ci/publish/lounge-binaries.sh "$OUT/lounge/binaries"

      - name: Test the Lounge entrypoint
        # The deployment's TILO_ROOMS_* to the host's flags, against a stub
        # relay: the image's program starts with what the deployment says.
        run: bash os/containers/tilo-lounge/test-entrypoint.sh

      - name: Install buildah and skopeo
        run: |
          set -euo pipefail
          missing=()
          for tool in buildah skopeo; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if ((${#missing[@]})); then
            dnf install -y --setopt=install_weak_deps=False "${missing[@]}"
          fi

      - name: Build the web desktop
        run: |
          set -euo pipefail
          bash tools/ci/publish/web-desktop-bundle.sh wasm "$OUT/web-desktop/wasm"
          bash tools/ci/publish/web-desktop-bundle.sh bundle "$OUT/web-desktop/bundle" "$OUT/web-desktop/wasm"

      - name: Give buildah a scratch disk
        # Its overlay driver refuses the job container's own overlayfs; a t step
        # had an ext4 scratch disk. The images are small (a caddy base and a
        # minimal Fedora with two programs), so a tmpfs holds their layers.
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/buildah-scratch
          mount -t tmpfs -o size=12g tmpfs /var/tmp/buildah-scratch
          echo TMPDIR=/var/tmp/buildah-scratch >> "$GITHUB_ENV"

      - name: Report the compiler cache
        if: always()
        run: bash tools/ci/sccache.sh report

      - name: Build and test the web entry image
        run: |
          set -euo pipefail
          dir=$OUT/web-entry
          bash tools/ci/publish/web-entry-context.sh "$dir/context" "$OUT/web-desktop/bundle"
          revision=$(cat "$dir/context/source-revision")
          bash tools/ci/publish/oci-build.sh "$dir/context" "$dir/context/Containerfile" "$dir" --build-arg "SOURCE_REVISION=$revision"
          bash crates/browser/tilo-browser-runtime/container/test-image.sh "$dir/image.oci.tar"

      - name: Build and test the Lounge image
        run: |
          set -euo pipefail
          dir=$OUT/lounge
          bash tools/ci/publish/lounge-fonts.sh "$dir/fonts"
          bash tools/ci/publish/lounge-context.sh "$dir/context" "$dir/binaries" "$dir/fonts"
          revision=$(cat "$dir/context/source-revision")
          bash tools/ci/publish/oci-build.sh "$dir/context" "$dir/context/Containerfile" "$dir" --build-arg "SOURCE_REVISION=$revision"
          bash os/containers/tilo-lounge/test-image.sh "$dir/image.oci.tar"

      - name: Install a browser for the integration test
        # The gate opens the built web entry in a real headless Chromium.
        run: |
          set -euo pipefail
          if ! rpm -q chromium >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False chromium
          fi
          command -v chromium-browser >/dev/null && echo "CHROME=$(command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Run the Lounge with people in it
        # The gate before publishing: the image the deployment runs starts on
        # a fresh volume, lists itself in its directory, and hosts two
        # people's browsers in the shared desk — chat, windows and presence —
        # with the same programs and entry the deployment uses.
        run: bash os/containers/tilo-lounge/test-integration.sh "$OUT/lounge/image.oci.tar" "$OUT/web-desktop/bundle" "$OUT/lounge-gate"

      - name: Keep the gate's diagnostics
        # Whatever the gate found, whether or not it passed: each page's
        # snapshot, its console, the site's and the Lounge's logs. A gate that
        # stopped on a page that never arrived says why here; its own failure
        # line says which step the page was in.
        if: always()
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: lounge-gate
          path: |
            out/lounge-gate/people
            out/lounge-gate/lounge.log
            out/lounge-gate/site.log
          if-no-files-found: ignore

      - name: Publish
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/ci/publish/oci-publish.sh dev "registry.tilo.so/tilo/web-entry" "$OUT/web-entry" 'dev-{commit}'
          echo "::notice::web-entry: $(cat "$OUT/web-entry/receipt.json")"
          bash tools/ci/publish/oci-publish.sh dev "registry.tilo.so/tilo/lounge" "$OUT/lounge" 'dev-{commit}'
          echo "::notice::lounge: $(cat "$OUT/lounge/receipt.json")"
      - name: Keep the receipts
        # The digests the infra repository pins, kept whether or not the job
        # got as far as publishing: a run that failed after building says what
        # it built.
        if: always()
        uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: receipts
          path: |
            out/web-entry/receipt.json
            out/lounge/receipt.json
          if-no-files-found: ignore
