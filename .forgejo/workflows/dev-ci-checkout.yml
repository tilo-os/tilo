name: Dev / CI receipt checkout

# Explicit qualification only: compare the actual pinned checkout action at
# one source SHA on one runner. No compilation, publication or protected
# notes writes. Reverse the order on a second dispatch to expose warm-order
# effects; neither result replaces required PR or main checks.
on:
  workflow_dispatch:
    inputs:
      order:
        description: 'Checkout order; dispatch both orders when comparing.'
        type: choice
        default: baseline-first
        options: [baseline-first, sparse-first]

jobs:
  compare:
    runs-on: runner-quality
    timeout-minutes: 10
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c
    steps:
      - name: Begin first checkout measurement
        run: |
          git config --global maintenance.auto false
          printf 'FIRST_STARTED=%s\n' "$(date +%s.%N)" >> "$GITHUB_ENV"
          printf 'FIRST_CPU=%s\n' "$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)" >> "$GITHUB_ENV"

      - name: Checkout baseline first
        if: github.event.inputs.order == 'baseline-first'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: baseline
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout sparse first
        if: github.event.inputs.order == 'sparse-first'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: sparse
          fetch-depth: 1
          fetch-tags: false
          sparse-checkout: tools/ci/receipt.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Finish first and begin second measurement
        run: |
          printf 'FIRST_STOPPED=%s\n' "$(date +%s.%N)" >> "$GITHUB_ENV"
          printf 'FIRST_CPU_STOPPED=%s\n' "$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)" >> "$GITHUB_ENV"
          printf 'FIRST_PEAK=%s\n' "$(cat /sys/fs/cgroup/memory.peak)" >> "$GITHUB_ENV"
          printf 'SECOND_STARTED=%s\n' "$(date +%s.%N)" >> "$GITHUB_ENV"
          printf 'SECOND_CPU=%s\n' "$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)" >> "$GITHUB_ENV"

      - name: Checkout sparse second
        if: github.event.inputs.order == 'baseline-first'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: sparse
          fetch-depth: 1
          fetch-tags: false
          sparse-checkout: tools/ci/receipt.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout baseline second
        if: github.event.inputs.order == 'sparse-first'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: baseline
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Report comparison and verify exact receipt inputs
        env:
          ORDER: ${{ github.event.inputs.order }}
        run: |
          export SECOND_STOPPED="$(date +%s.%N)"
          export SECOND_CPU_STOPPED="$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)"
          export SECOND_PEAK="$(cat /sys/fs/cgroup/memory.peak)"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          assert os.environ['ORDER'] in ('baseline-first', 'sparse-first')
          rows = []
          variants = ['baseline', 'sparse'] if os.environ['ORDER'] == 'baseline-first' else ['sparse', 'baseline']
          for name, prefix in zip(variants, ['FIRST', 'SECOND']):
              def value(suffix):
                  return float(os.environ[prefix + '_' + suffix])
              rows.append({'variant': name,
                           'wall_seconds': round(value('STOPPED') - value('STARTED'), 3),
                           'cgroup_cpu_seconds': round((value('CPU_STOPPED') - value('CPU')) / 1e6, 3),
                           'job_cumulative_peak_bytes': int(value('PEAK'))})
          for directory in ('baseline', 'sparse'):
              sha = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
              assert sha == os.environ['GITHUB_SHA'], (directory, sha)
          assert subprocess.check_output(['git', '-C', 'sparse', 'rev-parse', '--is-shallow-repository'], text=True).strip() == 'true'
          assert subprocess.check_output(['git', '-C', 'sparse', 'rev-list', '--count', 'HEAD'], text=True).strip() == '1'
          assert pathlib.Path('baseline/tools/ci/receipt.sh').read_bytes() == pathlib.Path('sparse/tools/ci/receipt.sh').read_bytes()
          evidence = {'source_sha': os.environ['GITHUB_SHA'], 'order': os.environ['ORDER'],
                      'cpu_max': pathlib.Path('/sys/fs/cgroup/cpu.max').read_text().strip(),
                      'memory_max': pathlib.Path('/sys/fs/cgroup/memory.max').read_text().strip(),
                      'measurements': rows}
          report = json.dumps(evidence, indent=2)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + report + '\n```\n')
          PY
          # Full existing assertions, including real shallow recording, racing
          # writers and transient push failure. All notes stay in a local fixture.
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 bash baseline/tools/tests/test_ci_receipt.sh
