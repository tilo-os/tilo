name: Build / buildroot snapshots

# The only CI boundary allowed to resolve kernel build dependencies and the
# Fedora kernel SRPM from Fedora. Each buildroot is built
# natively per architecture, signed with the release KMS key, and both digest
# pins are proposed through a protected-main pull request. build-kernel.yml and
# the OS image build FROM those refs and have no package repository to fall back
# to. The OS frozen RPM snapshot is not an input. Steps live in
# os/dev/buildroot-snapshot.sh, which also owns each buildroot's input list.
on:
  workflow_dispatch:
    inputs:
      buildroot:
        description: Buildroots to refresh
        type: choice
        options: [all, kernel]
        default: all
  push:
    branches: [main]
    paths:
      - os/Containerfile.kernel-buildroot
      - os/base-snapshot.env
      - os/dev/assert-native-arch.sh
      - os/dev/install-cached-cosign.sh
      - os/dev/configure-cosign-kms.sh
      - os/dev/require-cosign-authority.sh
      - os/dev/open-snapshot-pr.py
      - os/dev/buildroot-snapshot.sh
      - ".forgejo/actions/install-cosign/**"
      - keys/cosign.pub
      - .forgejo/workflows/build-buildroots.yml

concurrency:
  group: build-buildroots
  # Only the newest immutable snapshot is useful. In particular, do not let an
  # older run waiting for runner-arm64 capacity serialize newer amd64 work
  # behind it.
  cancel-in-progress: true

jobs:
  # Promotion is atomic across both native architectures, so the workflow stays
  # skipped until the ARM64 pool exists instead of queueing forever.
  plan:
    if: github.ref == 'refs/heads/main' && vars.TILO_NATIVE_ARM64_RUNNER == 'true'
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: registry.tilo.so/tilo/ci-fast@sha256:f84f99fb5586335f3850c06c7daaf26a12903c4cb29513b9a9c95a9f266f56f1
    outputs:
      kinds: ${{ steps.plan.outputs.kinds }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: plan
        env:
          CHOICE: ${{ inputs.buildroot }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$CHOICE" in
            all|kernel) kinds='["kernel"]' ;;
            *) kinds="$(os/dev/buildroot-snapshot.sh changed "$BEFORE" "$GITHUB_SHA")" ;;
          esac
          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
          builds="$(jq -c '[.[] as $kind
                             | {kind: $kind, arch: "x86_64", platform: "linux/amd64", runner: "runner"},
                               {kind: $kind, arch: "aarch64", platform: "linux/arm64", runner: "runner-arm64"}]' <<< "$kinds")"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  # Fail in seconds, before the native builds, when the signing authority is
  # missing or no longer matches the committed trust root.
  signing-preflight:
    needs: plan
    if: needs.plan.outputs.kinds != '[]'
    runs-on: runner-quality
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64
      - name: Require non-exportable snapshot signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: os/dev/require-cosign-authority.sh

  build:
    needs: [plan, signing-preflight]
    timeout-minutes: 180
    enable-openid-connect: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the native runner architecture
        run: ./os/dev/assert-native-arch.sh "${{ matrix.arch }}"
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ matrix.arch }}
      - name: Load the mirrored Fedora base
        run: grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"
      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/setup-buildx
      - name: Resolve, build and publish the native buildroot
        id: buildroot
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: os/Containerfile.${{ matrix.kind }}-buildroot
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          no-cache: true
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: registry.tilo.so/tilo/tilo-${{ matrix.kind }}-buildroot:${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Audit the immutable buildroot
        run: os/dev/buildroot-snapshot.sh audit ${{ matrix.kind }} ${{ matrix.arch }} "${{ steps.buildroot.outputs.digest }}"
      - name: Sign with the non-exportable release key
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: |
          . os/dev/configure-cosign-kms.sh
          cosign sign --yes --key "$COSIGN_KEY_REF" "$TILO_BUILDROOT_REF"
      - name: Verify the signature and record the immutable reference
        run: os/dev/buildroot-snapshot.sh record ${{ matrix.kind }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ matrix.kind }}-buildroot-${{ matrix.arch }}
          path: refs/${{ matrix.arch }}.env
          if-no-files-found: error
      - name: Revoke local registry credentials
        if: always()
        run: docker logout registry.tilo.so || true

  # A buildroot whose native builds both succeeded is promoted even when the
  # other one failed; its missing artifacts fail only its own promotion.
  promote:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.kinds != '[]' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
    runs-on: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          filter: blob:none
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: x86_64
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: ${{ matrix.kind }}-buildroot-x86_64
          path: refs/x86_64
      - uses: actions/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: ${{ matrix.kind }}-buildroot-aarch64
          path: refs/aarch64
      # Protected main accepts no direct pushes: commit both pins on the current
      # main tip, push a branch named after the pin file's digest, and open a
      # pull request so the required checks and merge policy apply.
      - name: Verify both signatures and propose the pins through protected main
        env:
          # The job token pushes the branch but Forgejo answers its
          # pull-request API calls with 404. RELEASE_TOKEN has repository scope;
          # a PR it opens also triggers its own required checks.
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: os/dev/buildroot-snapshot.sh promote ${{ matrix.kind }}
