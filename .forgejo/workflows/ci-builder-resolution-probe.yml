name: Immutable builder resolution pilot
on:
  push:
    branches: [codex/ci-immutable-builder]
jobs:
  resolver:
    runs-on: runner-quality
    timeout-minutes: 5
    container:
      image: code.podesta.ai/qos/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Resolve actual authenticated builder manifest
        id: resolve
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 tools/resolve_ci_builder.py
      - name: Verify native resolver and manual override contracts
        run: |
          python3 tools/tests/test_resolve_ci_builder.py
          python3 os/tests/test_builder_candidate_workflow.py
          python3 tools/tests/test_ci_queue_relief.py
      - name: Verify resolved package digest is the registry index
        env:
          RESOLVED_IMAGE: ${{ steps.resolve.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          export DOCKER_CONFIG="$temporary/auth"
          printf '%s' "$REGISTRY_TOKEN" | docker login code.podesta.ai --username "$REGISTRY_USER" --password-stdin >/dev/null
          docker buildx imagetools inspect --raw "$RESOLVED_IMAGE" > "$temporary/index.json"
          python3 - "$temporary/index.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          document = json.loads(payload)
          assert 'sha256:' + hashlib.sha256(payload).hexdigest() == os.environ['RESOLVED_IMAGE'].split('@')[1]
          assert document['mediaType'] in ('application/vnd.oci.image.index.v1+json', 'application/vnd.docker.distribution.manifest.list.v2+json')
          assert {'amd64', 'arm64'} <= {item['platform']['architecture'] for item in document['manifests'] if item['platform']['os'] == 'linux'}
          print('REGISTRY_INDEX_EQUIVALENCE_PASS')
          PY
