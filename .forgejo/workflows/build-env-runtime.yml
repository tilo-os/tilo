name: Build / env-runtime image

# Builds the env-runtime environment image — the minimal userland every
# environment's /usr and /etc start from — natively for x86_64 and aarch64
# from the frozen RPM snapshot, seals each tree into a signed `env-runtime`
# tapp, and publishes both tapps as
# registry.tilo.so/tilo/env-runtime:set-<fingerprint>, Cosign-signed. The OS
# image and the tilo-session-apps RPM resolve that tag
# (os/dev/resolve-env-runtime.sh) and ship the runtime in their system app
# store, so a first environment opens offline.
#
# The fingerprint is the bytes of os/Containerfile.env-runtime. Every tool
# image is bound to one exact runtime package id, so the runtime is rebuilt
# only when that file changes; a run whose tag already resolves exits early.
# The runtime's packages are snapshot markers in that file, so changing them
# also changes the frozen RPM snapshot (build-rpms.yml). A run waits for a
# build-rpms.yml main run building that snapshot; with none, it exits early
# and the scheduled run builds the runtime once the snapshot is published.
# A dispatch on a branch builds and seals with a throwaway key and publishes
# nothing, to check a change before it lands.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */4 * * *"
  push:
    branches: [main]
    paths:
      - os/Containerfile.env-runtime
      - os/dev/resolve-env-runtime.sh
      - .forgejo/workflows/build-env-runtime.yml

concurrency:
  group: env-runtime-${{ github.ref == 'refs/heads/main' && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: runner-quality
    timeout-minutes: 180
    container:
      image: registry.tilo.so/tilo/ci-control@sha256:cc33624d156302fa0c62c065b9babf1d18c6d3103116ff9b0ecf4e0f316d9ce5
    outputs:
      tag: ${{ steps.fp.outputs.tag }}
      version: ${{ steps.fp.outputs.version }}
      build: ${{ steps.fp.outputs.build }}
      publish: ${{ steps.fp.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Install registry tools
        run: |
          set -euo pipefail
          missing=()
          for tool in skopeo jq; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if ((${#missing[@]})); then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends "${missing[@]}"
            else
              sudo -n dnf install -y "${missing[@]}"
            fi
          fi
      - name: Compute the runtime fingerprint
        id: fp
        run: |
          set -euo pipefail
          tag="$(./os/dev/resolve-env-runtime.sh --tag)"
          version="$(./os/dev/resolve-env-runtime.sh --version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Main publishes a runtime once; a branch dispatch always builds,
          # to check the definition, and never publishes.
          if ./os/dev/resolve-env-runtime.sh --exists; then
            echo "::notice::env-runtime already published as $tag"
            exists=true
          else
            exists=false
          fi
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            build=$([[ $exists == false ]] && echo true || echo false)
            publish=$build
          else
            build=true
            publish=false
          fi
          if [[ $build == true ]]; then
            status=0
            ./os/dev/await-rpm-snapshot.sh --exists || status=$?
            case $status in
              0) ;;
              1)
                echo "::notice::the frozen RPM snapshot for this checkout is not published or being built; the scheduled run builds the runtime once it is"
                build=false
                publish=false
                ;;
              *) exit "$status" ;;
            esac
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  builder:
    needs: fingerprint
    if: needs.fingerprint.outputs.build == 'true'
    uses: ./.forgejo/workflows/resolve-builder.yml
    secrets: inherit

  signing-preflight:
    needs: fingerprint
    if: needs.fingerprint.outputs.publish == 'true'
    runs-on: runner
    timeout-minutes: 5
    enable-openid-connect: true
    steps:
      - name: Checkout signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned Cosign
        uses: ./.forgejo/actions/install-cosign
        with:
          cache-architecture: ${{ runner.arch }}
      - name: Require non-exportable signing authority
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
        run: os/dev/require-cosign-authority.sh

  tree:
    needs: fingerprint
    if: needs.fingerprint.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: runner
          - arch: aarch64
            runner: runner-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Require a native build host
        run: ./os/dev/assert-native-arch.sh '${{ matrix.arch }}'

      - name: Install and check host tools
        run: |
          set -euo pipefail
          missing=()
          for tool in skopeo jq; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if ((${#missing[@]})); then
            if command -v apt-get >/dev/null; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends "${missing[@]}"
            else
              sudo -n dnf install -y "${missing[@]}"
            fi
          fi
          ./os/dev/install-cached-cosign.sh
          docker info >/dev/null || { echo 'build host has no working Docker daemon' >&2; exit 1; }

      - name: Log in to registry.tilo.so
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the base and the frozen RPM snapshot
        run: |
          set -euo pipefail
          grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"
          rpms_ref="$(./os/dev/resolve-rpm-snapshot.sh)"
          echo "RPMS_REF=$rpms_ref" >> "$GITHUB_ENV"

      - name: Set up buildx
        uses: ./.forgejo/actions/setup-buildx

      - name: Install the runtime into an empty root and export its tree
        run: |
          set -euo pipefail
          mkdir -p out
          docker buildx build --file os/Containerfile.env-runtime --target tree \
            --build-arg "BASE_REF=$BASE_REF" --build-arg "RPMS_REF=$RPMS_REF" \
            --output "type=tar,dest=out/env-runtime-tree-${{ matrix.arch }}.tar" .
          printf '%s\n' "$RPMS_REF" > "out/env-runtime-rpms-${{ matrix.arch }}.txt"
          ls -l out

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: env-runtime-tree-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  seal:
    needs: [fingerprint, builder, tree]
    # A skipped reusable-workflow job still reports success.
    if: needs.fingerprint.outputs.build == 'true'
    runs-on: runner
    timeout-minutes: 90
    container:
      image: ${{ needs.builder.outputs.image }}
    env:
      CARGO_HOME: /cargo-home
      CARGO_INCREMENTAL: "0"
      TILO_SCCACHE_KEY_PREFIX: tilo/env-runtime/v1/x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        uses: ./.forgejo/actions/restore-cargo-downloads
      - name: Prepare compiler cache
        run: bash tools/ci/sccache.sh prepare
      - name: Build the packer
        run: cargo build --release --locked -p tilo-app-package-cli --bin tilo-app-package

      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: trees

      - name: Seal both trees into env-runtime tapps
        env:
          TAPP_PUBLISHER_IDENTITY: ${{ needs.fingerprint.outputs.publish == 'true' && secrets.TAPP_PUBLISHER_IDENTITY || '' }}
          PUBLISH: ${{ needs.fingerprint.outputs.publish }}
          VERSION: ${{ needs.fingerprint.outputs.version }}
        run: |
          set -euo pipefail
          packer=target/release/tilo-app-package
          identity_args=()
          if [[ -n ${TAPP_PUBLISHER_IDENTITY:-} ]]; then
            identity="$RUNNER_TEMP/tilo-env-runtime-publisher.json"
            (umask 077; printf '%s' "$TAPP_PUBLISHER_IDENTITY" > "$identity")
            trap 'rm -f "$identity"' EXIT
            identity_args=(--identity "$identity")
          elif [[ $PUBLISH == true ]]; then
            printf 'TAPP_PUBLISHER_IDENTITY is required for publication\n' >&2
            exit 1
          else
            echo "::notice::branch build: sealed with a throwaway key, published nowhere"
          fi
          unset TAPP_PUBLISHER_IDENTITY
          mkdir -p sealed
          {
            echo '## env-runtime'
            echo
            echo '| arch | package id | files | tree | tapp |'
            echo '|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in x86_64 aarch64; do
            work="$RUNNER_TEMP/env-runtime-$arch"
            rm -rf "$work"
            mkdir -p "$work/tree"
            tar -xpf "trees/env-runtime-tree-$arch/env-runtime-tree-$arch.tar" -C "$work/tree"
            mv "$work/tree/packages.txt" "$work/packages.txt"
            test -x "$work/tree/usr/bin/bash"
            tapp="sealed/env-runtime-$arch.tapp"
            id="$("$packer" seal-image --kind env-runtime --tree "$work/tree" \
              --id so.tilo.env-runtime --version "$VERSION" \
              --name 'Tilo environment runtime' --arch "$arch" \
              --packages "$work/packages.txt" "${identity_args[@]}" --output "$tapp")"
            [[ $id =~ ^tapp:[0-9a-f]{64}$ ]]
            "$packer" verify "$tapp"
            printf '%s\n' "$id" > "sealed/env-runtime-$arch.id"
            cp "$work/packages.txt" "sealed/env-runtime-$arch.packages.txt"
            cp "trees/env-runtime-tree-$arch/env-runtime-rpms-$arch.txt" "sealed/env-runtime-$arch.rpms.txt"
            files="$(find "$work/tree" -type f | wc -l)"
            tree_size="$(du -sh --apparent-size "$work/tree" | cut -f1)"
            tapp_size="$(du -h --apparent-size "$tapp" | cut -f1)"
            echo "| $arch | \`$id\` | $files | $tree_size | $tapp_size |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::env-runtime $arch $id: $files files, tree $tree_size, tapp $tapp_size"
          done
          "$packer" inspect sealed/env-runtime-x86_64.tapp \
            | sed -n 's/^publisher-identity: ed25519:\([0-9a-f]\{64\}\)$/\1/p' > sealed/publisher.hex
          [[ $(cat sealed/publisher.hex) =~ ^[0-9a-f]{64}$ ]]
          (cd sealed && sha256sum ./*.tapp > SHA256SUMS)
          ls -l sealed

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: env-runtime-sealed
          path: sealed/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [fingerprint, signing-preflight, seal]
    if: needs.fingerprint.outputs.publish == 'true'
    runs-on: runner
    timeout-minutes: 30
    enable-openid-connect: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}

      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: env-runtime-sealed
          path: sealed

      - name: Exit early when another run already published this fingerprint
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || sudo -n dnf install -y skopeo || {
            sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends skopeo; }
          if ./os/dev/resolve-env-runtime.sh --exists; then
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to registry.tilo.so
        if: env.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.tilo.so
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The published stage copies only the sealed tapps, but every FROM
      # needs its argument: pass the base and the snapshot the trees used.
      - name: Load the build's base and RPM snapshot
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          grep '^BASE_REF=' os/base-snapshot.env >> "$GITHUB_ENV"
          rpms_ref="$(cat sealed/env-runtime-x86_64.rpms.txt)"
          [[ $rpms_ref =~ ^registry\.tilo\.so/tilo/rpms@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::sealed runtimes carry no RPMS_REF"; exit 1; }
          [[ $(cat sealed/env-runtime-aarch64.rpms.txt) == "$rpms_ref" ]] \
            || { echo "::error::the two runtimes were built from different RPM snapshots"; exit 1; }
          echo "RPMS_REF=$rpms_ref" >> "$GITHUB_ENV"

      - name: Set up buildx
        if: env.skip != 'true'
        uses: ./.forgejo/actions/setup-buildx

      - name: Push the sealed runtimes
        if: env.skip != 'true'
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-contexts: |
            sealed=sealed
          file: os/Containerfile.env-runtime
          target: published
          build-args: |
            BASE_REF=${{ env.BASE_REF }}
            RPMS_REF=${{ env.RPMS_REF }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.tilo.so/tilo/env-runtime:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Sign, verify and tag the runtime
        if: env.skip != 'true'
        env:
          COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
          AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ needs.fingerprint.outputs.tag }}
        run: |
          set -euo pipefail
          ./os/dev/install-cached-cosign.sh
          . os/dev/configure-cosign-kms.sh
          [[ $TAG =~ ^set-[0-9a-f]{64}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="registry.tilo.so/tilo/env-runtime@$DIGEST"
          cosign sign --yes --key "$COSIGN_KEY_REF" "$ref"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          # Tag only if still absent — another run may have won the race.
          if ./os/dev/resolve-env-runtime.sh --exists; then
            echo "::notice::$TAG already present; leaving the published digest"
          else
            skopeo copy --all --preserve-digests \
              "docker://$ref" "docker://registry.tilo.so/tilo/env-runtime:$TAG"
          fi
          resolved="$(./os/dev/resolve-env-runtime.sh)"
          {
            echo '## env-runtime published'
            echo
            echo '```'
            echo "ENV_RUNTIME_REF=$resolved"
            cat sealed/*.id
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::env-runtime published: $resolved"
