  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".forgejo/actions/cache-github-assets/**"
      - ".forgejo/actions/install-cosign/**"
      - ".forgejo/workflows/release-relay.yml"
      - "Cargo.lock"
