# Example qos-relay config. Every field is optional; missing fields
# fall back to the in-binary defaults (see `RelayConfig::default()` in
# `src/config.rs`). Copy this to `/etc/qos-relay/config.toml` and edit.

# Multiaddrs the relay listens on. Defaults to dual-stack IPv4 on TCP
# + QUIC port 4001. If you operate behind a reverse proxy or run multiple
# relays on the same host, pick distinct ports.
listen = [
    "/ip4/0.0.0.0/tcp/4001",
    "/ip4/0.0.0.0/udp/4001/quic-v1",
]

# Persistent ed25519 keypair. Generated on first run. Mode 0600. The
# relay's libp2p PeerId is derived from this file — back it up if you
# want to keep the same peer id across hardware migrations.
identity_path = "/var/lib/qos-relay/identity.key"

# Other relays to seed the Kademlia DHT from. Each addr MUST include
# `/p2p/<peerid>` so the dial can be authenticated. Empty for the very
# first relay in a community.
bootstrap = [
    # "/dns4/relay-a.example.com/tcp/4001/p2p/12D3KooWAaZSRpMrdcwMWYbVDBJ8nPgwmorrnYrUyLG1YuVvTuiG",
    # "/dns4/relay-b.example.com/tcp/4001/p2p/12D3KooWMyvi1EVqY1ZtBhvXu8SxHVDJb5mj2cijqSa3VmYL1V7x",
]

# Gossipsub topics the relay forwards, as glob patterns. The default
# `qos.*` matches every topic the qOS shell publishes. Use `["*"]` only
# in development — a public relay should not forward arbitrary traffic.
topic_allowlist = ["qos.*"]

# Soft cap on (topic, peer) message rate per minute. Messages above the
# cap log a warning and are dropped. 0 disables the limiter. 6000 means
# ~100 msgs/sec/peer, which is generous enough for human-paced editing
# but tight enough to catch a runaway peer.
rate_limit_per_topic_per_minute = 6000

# Bind a Prometheus exposition endpoint. Uncomment to enable. The relay
# serves `GET /metrics` (OpenMetrics text) and `GET /healthz` on this
# socket; everything else 404s.
# metrics_listen = "127.0.0.1:9090"

# Log level filter — `tracing_subscriber::EnvFilter` directives. Common
# values:
#   "info"                          — production (default)
#   "qos_relay=debug,libp2p=info"   — relay-loop debug w/o libp2p noise
#   "trace"                         — everything (very noisy)
# Override at runtime via `RUST_LOG=...`.
log_level = "info"
