# Dev image only. Sorted before 50-redhat.conf, since the first value sshd reads wins.
#
# root: keys only. `tilo-vm` connects as root and runs `tilo-vmd rpc`, which
# has to be root (users, units, sysext, vkms). Install the key at first boot,
# for example as the systemd credential `ssh.authorized_keys.root`, which
# systemd's provision tmpfiles write to /root/.ssh/authorized_keys.
#
# The dev login account (os/account.env, `quickuser`) keeps password login:
# os/dev/vm.sh and the dev-disk CI boot check reach the VM that way before any
# key exists.
PermitRootLogin prohibit-password
PasswordAuthentication yes

# `ssh <vm> <command>` runs a non-login shell, which never reads profile.d, so
# the in-VM build environment (see /etc/profile.d/tilo-vm-build.sh) is set for
# every SSH session here as well.
SetEnv RUSTC_WRAPPER=/usr/bin/sccache SCCACHE_DIR=/var/cache/tilo-vm/sccache CARGO_INCREMENTAL=0
