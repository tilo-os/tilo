# Dev image only. tilo-devd's state root (layers, slots, generations) and the
# sysext directory VM-wide layers are merged from. The shared compiler cache for
# in-VM builds lives beside them, so it survives image upgrades.
d /var/lib/tilo-dev 0700 root root -
d /var/lib/extensions 0755 root root -
d /var/cache/tilo-dev 0755 root root -
d /var/cache/tilo-dev/sccache 0755 root root -
