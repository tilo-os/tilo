# Dev image only. tilo-vmd's state root (layers, slots, generations) and the
# sysext directory VM-wide layers are merged from. The shared compiler cache for
# in-VM builds lives beside them, so it survives image upgrades.
d /var/lib/tilo-vm 0700 root root -
d /var/lib/extensions 0755 root root -
d /var/cache/tilo-vm 0755 root root -
d /var/cache/tilo-vm/sccache 0755 root root -
