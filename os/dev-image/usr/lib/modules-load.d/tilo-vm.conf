# Dev image only. The device's steps give each headful account a vkms card (configfs) and
# per-seat uinput devices. Loading both at boot means a kernel without them
# fails here, in systemd-modules-load.service, instead of at the first account.
# vkms is loaded with create_default_dev=0 (tilo-vm-vkms.conf in modprobe.d),
# so no stray card appears on seat0.
vkms
uinput
