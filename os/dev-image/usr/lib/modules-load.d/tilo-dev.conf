# Dev image only. tilo-devd gives each headful slot a vkms card (configfs) and
# per-seat uinput devices. Loading both at boot means a kernel without them
# fails here, in systemd-modules-load.service, instead of at the first slot.
# vkms is loaded with create_default_dev=0 (tilo-dev-vkms.conf in modprobe.d),
# so no stray card appears on seat0.
vkms
uinput
