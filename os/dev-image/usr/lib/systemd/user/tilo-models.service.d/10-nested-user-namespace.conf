# Dev image only. A tilo-vm slot's user manager cannot remount /dev/mqueue
# (EPERM → 226/NAMESPACE) when ProtectSystem/ProtectHome/ProtectKernel* are
# set. An empty assignment is not a reset: systemd rejects it ("Failed to
# parse ProtectSystem=, ignoring") and the production value stays in effect.
# false is the boolean these keys accept for off. The production unit in
# os/usr keeps ProtectSystem=strict, ProtectHome=read-only and ProtectKernel*:
# a host session must not lose this sandbox because a nested manager cannot
# create it.
[Service]
ProtectSystem=false
ProtectHome=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectKernelLogs=false
