# Dev image only. A tilo-vm slot's user manager cannot remount /dev/mqueue
# (EPERM → 226/NAMESPACE) when ProtectSystem/ProtectHome/ProtectKernel* are
# set. Empty assignments unset those directives so the unit starts. The
# production unit in os/usr keeps them: a host session must not lose this
# sandbox because a nested manager cannot create it.
[Service]
ProtectSystem=
ProtectHome=
ProtectKernelTunables=
ProtectKernelModules=
ProtectKernelLogs=
