# Dev image only. A tilo-vm slot's user manager can enter a mount namespace
# but cannot mount a fresh /dev/mqueue (EPERM → 226/NAMESPACE). PrivateIPC=yes
# is that mount. PrivateTmp=, ProtectControlGroups= and a non-empty
# ReadWritePaths= also make systemd set the namespace up, so the mqueue mount
# still runs while PrivateIPC stays at the production value. ProtectClock= is
# a capability and syscall filter, and ProtectHostname= is a UTS namespace;
# its /proc/sys hostname mounts are applied only inside a mount namespace,
# which this drop-in no longer requests. An empty assignment is not a reset
# for these booleans: systemd rejects it ("Failed to parse ..., ignoring") and
# the production value stays in effect. ReadWritePaths= is a path list, so an
# empty assignment does reset it. false is the boolean these keys accept for
# off. The production units in os/usr keep PrivateTmp=yes,
# ProtectControlGroups=yes, ProtectSystem=strict, ProtectHome=read-only,
# ProtectKernel*, ProtectClock= and ProtectHostname=. Cloud and recipient
# also keep PrivateIPC=yes. A host session must not lose this sandbox
# because a nested manager cannot create it.
[Service]
ProtectSystem=false
ProtectHome=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectKernelLogs=false
PrivateIPC=false
PrivateTmp=false
ProtectControlGroups=false
ReadWritePaths=
