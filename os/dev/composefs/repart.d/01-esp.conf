# The ESP holds the UKI, so it has to be sized for kernels + initramfs rather
# than for a bootloader. Tilo's initramfs is ~120 MB, and an update series keeps
# the previous generation's UKI on the ESP for rollback, so several must fit at
# once. bootc's own default is being raised to 2 GB for composefs (bootc#2314);
# this matches that ahead of the release that ships it.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=2G
SizeMaxBytes=2G
