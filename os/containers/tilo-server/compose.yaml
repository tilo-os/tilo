# A user-owned, always-on Tilo server.
#
# Create the identity/config directories, make a ticket with `tilo device add
# --server` on a computer that holds the person's identity, then run `podman
# compose up -d` with it in TILO_TICKET. The ticket is spent once, on the
# volume's first start.
services:
  tilo-server:
    image: ${TILO_SERVER_IMAGE:-registry.tilo.so/tilo/tilo-server:latest}
    restart: unless-stopped
    environment:
      TILO_DEVICE_NAME: ${TILO_DEVICE_NAME:-Home server}
      # The one secret a new volume joins with. Ignored once the volume holds
      # its device key and login, so a restart never spends it.
      TILO_TICKET: ${TILO_TICKET:-}
    # The ticket's certify call reaches the issuing device over the peer
    # network: a bridged container works; this deliberately joins the host
    # network so the server's iroh endpoint is reachable on the machine's own
    # address.
    network_mode: host
    volumes:
      # The server configuration, written on first start.
      - ./config:/etc/tilo:Z
      # A device key, certificate and login. Never put a user-root private key
      # here or in the image.
      - ./identity:/var/lib/tilo:Z
      # CRDT snapshots, offline pending queues, metrics, and the stable Iroh
      # endpoint secret. Back this volume up as server state.
      - tilo-server-state:/var/lib/tilo-server:Z
    healthcheck:
      # The daemon answers a status call, asked through the one function that finds it and run in
      # the daemon's own environment: the probe starts nothing, and returns within a couple of
      # seconds either way. It is not a claim that an external peer can reach us.
      test: ["CMD-SHELL", "HOME=/var/lib/tilo-server TILO_IDENTITY_ROOT=/var/lib/tilo XDG_STATE_HOME=/var/lib/tilo/state TILO_RUNTIME_PROFILE=/var/lib/tilo-server /usr/bin/tilo status --daemon"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  tilo-server-state:
