# Composite relay and complete filesystem replica for a user-owned qOS home peer.
#
# Create the identity/config directories, then run `podman compose up -d` and
# approve the nearby server from qOS Settings. Identity and the signed
# home-peer bundle are provisioned over the LAN without copying a token.
services:
  qos-relay:
    image: ${QOS_RELAY_IMAGE:-code.sandbox.example/qos/qos-relay:latest}
    command: ["--config", "/etc/qos/relay.toml", "run"]
    restart: unless-stopped
    environment:
      QOS_DEVICE_NAME: ${QOS_DEVICE_NAME:-Home server}
    # Enrollment uses authenticated LAN broadcast on UDP 45831. A bridged
    # container cannot receive/reply on the physical LAN broadcast domain, so
    # the composite home peer deliberately joins the host network.
    network_mode: host
    volumes:
      # Enrollment writes the full-sync bundle here on first start.
      - ./config:/etc/qos:Z
      # A pre-enrolled, host-capable device identity. Never put a user-root
      # private key in this directory or image.
      - ./identity:/var/lib/qos:Z
      # CRDT snapshots, offline pending queues, metrics, and the stable Iroh
      # endpoint secret. Back this volume up as relay state.
      - qos-relay-state:/var/lib/qos-relay:Z
      - qos-full-replica:/var/lib/qos/full-replica:Z
    healthcheck:
      # Written only after the daemon has started and its periodic metrics
      # task is live. It is not a claim that an external peer can reach us.
      test: ["CMD-SHELL", "test -s /var/lib/qos-relay/metrics.json && grep -q '\"state\": \"ready\"' /var/lib/qos/full-replica/status.json"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  qos-relay-state:
  qos-full-replica:
