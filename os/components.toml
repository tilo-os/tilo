# socket. tilo-vmd's `control` passes through to it.
[[component]]
name = "control"
kind = "userspace"
scope = "session"
packages = ["tilo-control"]
bins = ["tilo-control"]
layer = "desktop-binaries"
files = [
  { from = "tilo-control", to = "/usr/bin/tilo-control", mode = "0755" },
]

[[component]]
