# Tilo OS component manifest: which Tilo-built file goes where in the image.
#
# This file is the single source of truth for Tilo build outputs in the OS
# image. It is consumed by:
#   * os/scripts/install-components.py, which the production Containerfile's
#     `component-files` stage runs to arrange every binary into /image/<layer>/,
#     which os/Containerfile.dev runs with `--dev` to build and install the dev
#     image's components, and which assembles development sysext layers
#     (`--dest <layer>/`) from the same entries, so the image, the dev image and
#     a dev layer cannot place a file differently;
#   * tools/policy/check_component_manifest.py (part of tools/policy/run.sh),
#     which fails when the Containerfile builds or copies a Tilo output that is
#     not declared here, or when an entry names a cargo package, bin, feature or
#     unit that does not exist;
#   * tools/policy/check_dev_image_contract.py, which keeps dev-only components
#     out of the production image and the dev image out of production tags;
#   * tilo-vmd, which reads its copy at /usr/share/tilo/components.toml in the
#     dev image to learn each component's scope and units;
#   * os/tests/lib/containerfile.sh, which expands the manifest into the image's
#     copy contract.
#
# Schema, one [[component]] table each:
#   name        unique component name; the unit of a dev-VM swap
#   kind        "userspace": takes effect when its session or units restart.
#               "boot": only takes effect on a cold boot (kernel, UKI,
#               bootloader, initramfs, installer media); dev tooling redirects a
#               swap to `scenario` instead of restarting anything, unless the
#               component declares `dev_swap`.
#   scenario    boot components only: the os/dev/ driver script that
#               cold-boots and exercises the component
#   dev_swap    boot components only: "reboot" when `tilo-vm swap` can put a
#               dev build of it into a dev VM, as the VM's next boot entry
#               followed by a reboot (the kernel). Without it a swap is
#               redirected to `scenario`.
#   dev_build   with dev_swap: the os/ script that builds the component for a
#               dev VM from the same sources as the image (os/kernel/dev-build.sh)
#   scope       "session": per-overlay (compositor, user services, CLIs a user
#               runs); a swap is a normal session restart.
#               "vm": VM-wide (system services, greeter, boot tooling); a swap
#               merges into the VM's /usr and restarts `units`.
#   profile     cargo profile of the build, "release" (default) or "thin-app"
#   packages    cargo package(s) built for this component
#   bins        cargo bins those packages build for the image
#   features    cargo features, package-qualified ("pkg/feature")
#   dev_features  cargo features only dev builds enable, normally package-qualified;
#                 a bare feature may target a single-package component when a
#                 same-named self dev-dependency shadows pkg/feature.
#               The dev image rebuilds every component that has them, with
#               them (os/Containerfile.dev); the production image never does.
#   units       system units whose ExecStart runs these files (restart on swap)
#   user_units  user units whose ExecStart runs these files (restart on swap)
#   optional    true when the image may legitimately omit the component
#   layer       default image layer for its files (see below)
#   files       list of { from, to, mode } entries (a boot component whose
#               install is not driven by this manifest yet may omit packages
#               and files):
#     from      build output path. Relative paths are resolved against the
#               build output directory (--from: /out in the Containerfile,
#               target/<profile> for a dev build). Absolute paths are outputs
#               the build writes at their final path, resolved under --build-root.
#     to        absolute path in the image; a trailing '/' with `tree = true`
#               copies a whole directory
#     mode      octal mode for regular files, e.g. "0755"
#     link      instead of `from`: install a relative symlink to this target
#     layer     override the component's layer for this one file
#   Image layers name the Containerfile scratch overlay a file is committed
#   with (`COPY --from=component-files /image/<layer>/ /`). The layer `direct`
#   means the Containerfile copies that path itself, straight from the builder
#   stage, because the build writes it there (the baked runtime and app store).
#   Layers named `dev-*` exist only in the dev image: a component whose files
#   are all in such a layer is dev-only. The production image never builds or
#   copies it, and `install-components.py --all` never selects it.
#
# Adding a component:
#   1. Build it in the Containerfile builder stage (`-p <pkg> --bin <bin>`) and
#      stage the output into /out.
#   2. Add a [[component]] table below, for example:
#
#        [[component]]
#        name = "example"
#        kind = "userspace"
#        scope = "session"
#        packages = ["example"]
#        bins = ["tilo-example"]
#        user_units = ["tilo-example.service"]
#        layer = "desktop-binaries"
#        files = [
#          { from = "tilo-example", to = "/usr/libexec/tilo-example", mode = "0755" },
#        ]
#
#   3. Run `python3 tools/policy/check_component_manifest.py` (or the whole
#      `tools/policy/run.sh`) and `python3 os/scripts/install-components.py
#      --dry-run example` to see the plan.
#
# Not listed: /usr/libexec/tilo-local-model-service arrives with the
# local-model system extension rather than from this image build.

# Units provided by distribution packages rather than os/usr/lib/systemd.
external_units = ["greetd.service"]

# ---- Session: compositor and desktop ---------------------------------------

[[component]]
name = "shell"
kind = "userspace"
scope = "session"
packages = ["shell"]
bins = ["shell"]
dev_features = ["dev-overrides"]
layer = "desktop-binaries"
files = [
  { from = "shell", to = "/usr/bin/shell", mode = "0755" },
  # The PAM entry point and compositor share the session-recovery contract.
  # A fresh slot login must run this source's wrapper, not the base image's.
  { from = "@manifest/usr/libexec/tilo-session", to = "/usr/libexec/tilo-session", mode = "0755" },
]

