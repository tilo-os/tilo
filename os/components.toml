  { link = "tilo", to = "/usr/share/bash-completion/completions/system", layer = "desktop-binaries" },
  { from = "completions/fish/tilo.fish", to = "/usr/share/fish/vendor_completions.d/tilo.fish", mode = "0644", optional = true, layer = "desktop-binaries" },
  { from = "completions/zsh/_tilo", to = "/usr/share/zsh/site-functions/_tilo", mode = "0644", optional = true, layer = "desktop-binaries" },
  { link = "_tilo", to = "/usr/share/zsh/site-functions/_system", layer = "desktop-binaries" },
]

# Consent-gated NTFS access: the root service the shell asks to open a drive
# after the person agreed, and the library its confined userspace driver is
# started with. Socket-activated, so a swap takes effect at its next start.
[[component]]
name = "ntfs-mount"
kind = "userspace"
scope = "vm"
packages = ["tilo-ntfs-mount"]
bins = ["tilo-ntfs-mount"]
units = ["tilo-ntfs-mount.service"]
layer = "desktop-binaries"
files = [
  { from = "tilo-ntfs-mount", to = "/usr/libexec/tilo-ntfs-mount", mode = "0755" },
  { from = "ntfs-mount/fuse-handoff.so", to = "/usr/lib/tilo/ntfs-mount/fuse-handoff.so", mode = "0755" },
]

# The one writer of the read-only ESP, started on demand as
# tilo-esp-write@CALLER.service by the boot-entry and Secure Boot units, at
# boot and on the way down; a swap takes effect at its next start. Also
# /usr/libexec/tilo-uki-cmdline, which edits a UKI's sealed command line.
[[component]]
name = "esp-write"
kind = "userspace"
scope = "vm"
packages = ["tilo-esp-write"]
bins = ["tilo-esp-write"]
layer = "recovery-files"
files = [
  { from = "tilo-esp-write", to = "/usr/libexec/tilo-esp-write", mode = "0755" },
  # Run under this name it is the in-place UKI command-line and .osrel editor
  # the repair entry, the installer and the image build use.
  { link = "tilo-esp-write", to = "/usr/libexec/tilo-uki-cmdline" },
]

# First-boot account files: tilo-firstboot-user runs the copy beside it, this
# one or the one a custom installer stages in the target's /etc/tilo, so a swap
# takes effect at the next account handoff (or install).
[[component]]
name = "firstboot-files"
kind = "userspace"
scope = "vm"
packages = ["tilo-firstboot-files"]
bins = ["tilo-firstboot-files"]
layer = "recovery-files"
files = [
  { from = "tilo-firstboot-files", to = "/usr/libexec/tilo-firstboot-files", mode = "0755" },
]

# The boot security audit's proof that containers-policy.json requires the
# pinned Cosign signature; tilo-security-audit runs it, so a swap takes effect
# at the next audit.
[[component]]
name = "image-policy-check"
kind = "userspace"
scope = "vm"
packages = ["tilo-image-policy-check"]
bins = ["tilo-image-policy-check"]
layer = "recovery-files"
files = [
  { from = "tilo-image-policy-check", to = "/usr/libexec/tilo-image-policy-check", mode = "0755" },
]

# Dual boot: run by hand after the first Tilo boot to enlist it after Windows
# in the firmware boot order (docs/windows-first-tilo-boot-order.md). The
# installer image, and so every target it installs, inherits it from here.
[[component]]
name = "boot-order"
kind = "userspace"
scope = "vm"
packages = ["tilo-boot-order"]
bins = ["tilo-boot-order"]
layer = "recovery-files"
files = [
  { from = "tilo-boot-order", to = "/usr/libexec/tilo-boot-order", mode = "0755" },
]

# USB-free install: tilo-staging-reclaim.service (enabled by the installer
# image, which inherits the helper from here) returns the staging partitions to
# the Tilo root after the first real session; a swap takes effect at its next
# start.
[[component]]
name = "staging-reclaim"
kind = "userspace"
scope = "vm"
packages = ["tilo-staging-reclaim"]
bins = ["tilo-staging-reclaim"]
layer = "recovery-files"
files = [
  { from = "tilo-staging-reclaim", to = "/usr/libexec/tilo-staging-reclaim", mode = "0755" },
]

# The live installer's privileged helpers. tilo-staging-handoff.service runs
# the USB-free installation guard before greetd; the installer backend
# (tilo-install) runs the rest: the signed offline target's verification and
# import, the setup handoff copy, a dev self-install's owner SSH keys and, in
# a VM, the bootc export cache and the install proof. The installer image
# inherits them from here; a swap takes effect at the next install.
[[component]]
name = "install-helpers"
kind = "userspace"
scope = "vm"
packages = ["tilo-install-helpers"]
bins = [
  "tilo-install-handoff-copy",
  "tilo-install-dev-ssh",
  "tilo-vm-bootc-copy-cache",
  "tilo-installer-offline-target",
  "tilo-staging-handoff",
  "tilo-vm-install-proof",
]
layer = "recovery-files"
files = [
  { from = "tilo-install-handoff-copy", to = "/usr/libexec/tilo-install-handoff-copy", mode = "0755" },
  { from = "tilo-install-dev-ssh", to = "/usr/libexec/tilo-install-dev-ssh", mode = "0755" },
  { from = "tilo-vm-bootc-copy-cache", to = "/usr/libexec/tilo-vm-bootc-copy-cache", mode = "0755" },
  { from = "tilo-installer-offline-target", to = "/usr/libexec/tilo-installer-offline-target", mode = "0755" },
  { from = "tilo-staging-handoff", to = "/usr/libexec/tilo-staging-handoff", mode = "0755" },
  { from = "tilo-vm-install-proof", to = "/usr/libexec/tilo-vm-install-proof", mode = "0755" },
]

# Downloaded, Tilo-signed system extensions: tilo-extension-activate.service at
# boot, tilo-extension@VERB:ID.service on demand, the refresh timer and the
# NetworkManager hook all start it; a swap takes effect at its next start.
[[component]]
name = "extension"
kind = "userspace"
scope = "vm"
packages = ["tilo-extension"]
bins = ["tilo-extension"]
layer = "extension-files"
files = [
  { from = "tilo-extension", to = "/usr/libexec/tilo-extension", mode = "0755" },
]

[[component]]
name = "rollback"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-encrypted-install.sh"
packages = ["tilo-rollback"]
bins = ["tilo-rollback"]
layer = "rollback-files"
files = [
  { from = "tilo-rollback", to = "/usr/bin/tilo-rollback", mode = "0755" },
]

[[component]]
name = "sibling-unlock"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-nearby-pairing.sh"
packages = ["tilo-sibling-unlock"]
bins = ["tilo-sibling-unlock"]
layer = "rollback-files"
files = [
  { from = "tilo-sibling-unlock", to = "/usr/bin/tilo-sibling-unlock", mode = "0755" },
]

[[component]]
name = "windows"
kind = "userspace"
scope = "vm"
packages = ["windows-vm", "compat-service"]
bins = ["tilo-windows-vm-control", "tilo-windows-rail", "tilo-windows-runtime"]
units = ["tilo-windows-vm-egress-reaper.service"]
layer = "windows"
files = [
  { from = "tilo-windows-vm-control", to = "/usr/libexec/tilo-windows-vm-control", mode = "0755" },
  { from = "tilo-windows-rail", to = "/usr/libexec/tilo-windows-rail", mode = "0755" },
  { from = "tilo-windows-runtime", to = "/usr/libexec/tilo-windows-runtime", mode = "0755" },
]

# ---- Dev image only ----------------------------------------------------------
# The `dev-tools` layer is installed by os/Containerfile.dev alone.
# tools/policy/check_dev_image_contract.py fails if the production image builds
# or copies any of it.

# The dev-VM guest daemon. It is not a service: `tilo-vm` runs
# `ssh <vm> tilo-vmd rpc` per call, hence the PATH link.
[[component]]
name = "vmd"
kind = "userspace"
scope = "vm"
packages = ["tilo-vmd"]
bins = ["tilo-vmd"]
layer = "dev-tools"
files = [
  { from = "tilo-vmd", to = "/usr/libexec/tilo-vmd", mode = "0755" },
  { link = "../libexec/tilo-vmd", to = "/usr/bin/tilo-vmd" },
]

# tilo-vmd's requests over the peer network, for a device beyond the LAN
# (docs/device-reach.md). os/dev-image/ carries its unit,
# tilo-device-admin.service, which os/Containerfile.dev enables; `tilo-vm`
# runs `tilo-device-admin id` over SSH to record the route, hence the PATH
# link. A developer's machine runs the same binary's `dial`.
[[component]]
name = "device-admin"
kind = "userspace"
scope = "vm"
packages = ["tilo-device-admin"]
bins = ["tilo-device-admin"]
layer = "dev-tools"
files = [
  { from = "tilo-device-admin", to = "/usr/libexec/tilo-device-admin", mode = "0755" },
  { link = "../libexec/tilo-device-admin", to = "/usr/bin/tilo-device-admin" },
]

# The host CLI, so a Tilo dev machine is a developer's machine too: it drives
# other devices over SSH, or beyond the LAN through tilo-device-admin beside
# it (os/dev/test-device-admin-reach.sh drives a device that way).
[[component]]
name = "vm-cli"
kind = "userspace"
scope = "vm"
packages = ["tilo-vm"]
bins = ["tilo-vm"]
layer = "dev-tools"
files = [
  { from = "tilo-vm", to = "/usr/bin/tilo-vm", mode = "0755" },
]

# A signed app registry on loopback offering newer versions of an installed
# app, for os/tests/booted_app_update.sh: the system image's apps update and
# roll back through `app` like any other.
[[component]]
name = "test-registry"
kind = "userspace"
scope = "session"
packages = ["test-app-registry"]
bins = ["tilo-test-registry"]
layer = "dev-tools"
files = [
  { from = "tilo-test-registry", to = "/usr/bin/tilo-test-registry", mode = "0755" },
]

# ---- Boot: effective only after a cold boot ---------------------------------
# Built and installed outside this manifest for now (the kernel RPM stage, the
# `uki` stage via os/dev/uki.sh, dracut in the rootfs stage). Listed so dev
# tooling knows what a swap of them means. The kernel is swappable in a dev VM
# (`dev_swap = "reboot"`): tilo-vm builds it with `dev_build`, installs it
# VM-wide as the next boot entry and reboots. The others stay scenario-only, and
# a swap of them is redirected to the scenario that cold-boots them.
# `installer`, `rollback` and `sibling-unlock` above are boot components too:
# the installer runs from installer media, tilo-rollback is copied into the
# initramfs by os/usr/lib/dracut/modules.d/91tilo-rollback, and
# tilo-sibling-unlock by os/usr/lib/dracut/modules.d/92tilo-sibling-unlock.

[[component]]
name = "kernel"
kind = "boot"
scope = "vm"
scenario = "os/dev/vm.sh"
dev_swap = "reboot"
dev_build = "os/kernel/dev-build.sh"

[[component]]
name = "initramfs"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-encrypted-install.sh"

[[component]]
name = "uki"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-measured-boot.sh"

[[component]]
name = "bootloader"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-secureboot.sh"
