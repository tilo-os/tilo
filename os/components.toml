# The shared runtime and every packaged thin app. One component because Rust
# dylib symbols carry crate hashes: a thin app only runs against the
# libruntime_dylib.so built in the same Cargo graph (os/scripts/build-thin-apps.sh).
# The app set is every apps/*/tilo-app.toml; the image bakes the signed bundle
# and packs the read-only app store at their final paths in the builder stage.
[[component]]
name = "apps+runtime"
kind = "userspace"
scope = "session"
profile = "thin-app"
packages = ["runtime-dylib"]
app_manifests = "apps/*/tilo-app.toml"
features = [
  "music/audio", "music/live", "music/runtime-engine", "video-player/decode",
  "camera/live-capture", "tube/live", "tube/media", "tube/grayjay-sync",
  "tube/runtime-engine", "mail/live", "disks/live", "video-editor/decode",
  "video-editor/gst", "typst-editor/runtime-engine", "canvas/runtime-engine",
  "mail/runtime-engine", "settings/runtime-engine", "calendar/runtime-engine",
  "clocks/runtime-engine", "contacts/runtime-engine", "messages/runtime-engine",
  "pdf-viewer/runtime-engine", "file-explorer/runtime-engine",
  "word-processor/runtime-engine", "print-centre/runtime-engine",
  "imager/runtime-engine",
]
layer = "direct"
files = [
  { from = "/usr/lib/tilo-runtime/", to = "/usr/lib/tilo-runtime/", tree = true },
  { from = "/usr/share/tilo/font-catalogs/", to = "/usr/share/tilo/font-catalogs/", tree = true },
  { from = "runtime-bundle-publisher.hex", to = "/usr/share/tilo/runtime-bundle-publisher.hex", mode = "0644" },
  { from = "runtime-version", to = "/usr/share/tilo/runtime-version", mode = "0644" },
  { from = "browser-runtime-publisher.hex", to = "/usr/share/tilo/browser-runtime-publisher.hex", mode = "0644" },
  { from = "registry-runtime-publisher.hex", to = "/usr/share/tilo/registry-runtime-publisher.hex", mode = "0644" },
  { from = "/usr/share/tilo-apps/", to = "/usr/share/tilo-apps/", tree = true },
  { from = "app-publisher.hex", to = "/usr/share/tilo/app-publisher.hex", mode = "0644" },
]

# ---- VM-wide: system services, login and boot tooling ----------------------

[[component]]
name = "fs"
kind = "userspace"
scope = "vm"
packages = ["tilo-fs"]
bins = ["fs"]
units = ["fs.service", "tilo-fs-replica.service"]
user_units = ["tilo-fs-recipient.service", "tilo-fs-cloud.service"]
layer = "desktop-binaries"
files = [
  { from = "fs", to = "/usr/bin/fs", mode = "0755" },
]

# Settings' credential helper. The cloud account service runs it (through
# bounded-command) when an account's short-lived handoff credential is
# missing, expired or rejected; it alone opens the account vault, for that
# one call.
[[component]]
name = "account-credential"
kind = "userspace"
scope = "session"
packages = ["account-custody"]
bins = ["tilo-account-credential"]
layer = "desktop-binaries"
files = [
  { from = "tilo-account-credential", to = "/usr/libexec/tilo-account-credential", mode = "0755" },
]

# Installed target-user setup consumer. First use and the retained launcher
# authenticate this root-owned helper; elevated operations keep their existing
# parent/descriptor admission rather than gaining a new installation grant.
# Its --verify-{account,home,applications}-consumer-capability and
# --data-consumer-catalog-facts modes produce and check the installed consumer
# receipts (os/docs/data-consumer-capabilities.md).
[[component]]
name = "prepared-setup"
kind = "userspace"
scope = "session"
packages = ["imager"]
bins = ["tilo-prepared-setup", "tilo-installer-prepared-setup-extract"]
# The installation's consumer side; the Imager app (apps+runtime) leaves it out.
features = ["imager/installation"]
layer = "desktop-binaries"
files = [
  { from = "tilo-prepared-setup", to = "/usr/libexec/tilo-prepared-setup", mode = "0755" },
  { from = "tilo-installer-prepared-setup-extract", to = "/usr/libexec/tilo-installer-prepared-setup-extract", mode = "0755" },
]

[[component]]
name = "greeter"
kind = "userspace"
scope = "vm"
packages = ["greeter"]
bins = ["tilo-greeter"]
units = ["greetd.service"]
layer = "desktop-binaries"
files = [
  { from = "tilo-greeter", to = "/usr/bin/tilo-greeter", mode = "0755" },
]

[[component]]
name = "installer"
kind = "boot"
scope = "vm"
scenario = "os/dev/test-installer-cycle.sh"
packages = ["installer"]
bins = ["tilo-installer", "tilo-firstboot-home-seeds"]
layer = "desktop-binaries"
files = [
  { from = "tilo-installer", to = "/usr/bin/tilo-installer", mode = "0755" },
  { from = "tilo-firstboot-home-seeds", to = "/usr/libexec/tilo-firstboot-home-seeds", mode = "0755" },
]

[[component]]
name = "relay"
kind = "userspace"
scope = "vm"
packages = ["tilo-relay"]
# As the image builds it: the relay serves browsers (`run --web`, a node).
features = ["tilo-relay/web"]
bins = ["tilo-relay", "tilo-relay-admin", "tilo-enroll", "tilo-home-peer-control"]
units = ["tilo-relay.service"]
layer = "desktop-binaries"
files = [
  { from = "tilo-relay", to = "/usr/bin/tilo-relay", mode = "0755" },
  { from = "tilo-relay-admin", to = "/usr/bin/tilo-relay-admin", mode = "0755" },
  { from = "tilo-enroll", to = "/usr/bin/tilo-enroll", mode = "0755" },
  { from = "tilo-home-peer-control", to = "/usr/libexec/tilo-home-peer-control", mode = "0755" },
  # A node (docs/node-machine.md).
  { from = "@manifest/usr/lib/tilo/node-relay.toml", to = "/usr/lib/tilo/node-relay.toml", mode = "0644" },
  { from = "@manifest/usr/lib/sysusers.d/tilo-relay.conf", to = "/usr/lib/sysusers.d/tilo-relay.conf", mode = "0644" },
  { from = "@manifest/usr/lib/systemd/system/tilo-node-relay@.service", to = "/usr/lib/systemd/system/tilo-node-relay@.service", mode = "0644" },
  { from = "@manifest/usr/lib/systemd/system/tilo-node-session-key@.service", to = "/usr/lib/systemd/system/tilo-node-session-key@.service", mode = "0644" },
  { from = "@manifest/usr/lib/systemd/system/tilo-node-session@.service", to = "/usr/lib/systemd/system/tilo-node-session@.service", mode = "0644" },
  { from = "@manifest/usr/lib/systemd/system/tilo-node-session@.path", to = "/usr/lib/systemd/system/tilo-node-session@.path", mode = "0644" },
]

