# What /usr may hold, per image flavour, and what must not be in it at all.
#
# Ceilings on the deployed /usr of a built image (each hard-linked file once,
# bytes of regular files; os/tests/image_size_budget.py), checked by t on every
# image it builds: os-image-size-<arch> holds os-image-<arch> to
# production-<arch> before os-acceptance-<arch> boots it (and os-release-image-size-<arch>
# the release image before os-release-seal-<arch> does), and
# os-board-size-<board> holds os-board-<board> to board-<board> before
# publish-os-board-<board> pushes it, and os-release-image-size-<board> the board's
# release image before os-release-seal-<board> seals it (tools/ci/os/image-size.sh, which also
# writes the breakdown by layer, directory, file and package). The nightly KPI
# budgets in tools/perf/kpi-budgets.toml watch the whole image over time; these
# stop a single change that grows /usr before it ships.
#
# Ratchet, do not raise: lower a ceiling to measured + 5 % when a measurement
# leaves more room than that. Raising one needs the reason in the commit
# message. Board images are built on the dev image of the same commit
# (os/Containerfile.board), so a board's ceiling covers the dev toolchain too.
# Measured on t (2026-10-23, tools/ci/os/image-size.sh on the published
# tilo-vm:<board>-ci images): lenovo-83ed 8,718 MB; orangepi-3b-v2-1
# 8,739 MB before its firmware_exclude dropped the PC GPU, Wi-Fi and microcode
# firmware it has no hardware for.
#
# flavour = production-<arch> (a generic image), board-<profile> (a board
# image), dev-<arch> (the dev layer on top of a generic image).

# Files the base image must not carry: they are the Windows compatibility
# system extension (os/usr/share/tilo/system-extensions/sysext.d/windows-compat.json),
# which overlays the same paths once a person installs Windows support.
[moved_to_sysext]
paths = [
  "usr/lib/tilo/windows-runners",
  "usr/share/virtio-win",
  "usr/bin/FEX",
  "usr/bin/FEXServer",
  "usr/share/fex-emu",
]

[flavour.production-x86_64]
usr_bytes = 9_000_000_000

[flavour.production-aarch64]
usr_bytes = 9_000_000_000

[flavour.board-lenovo-83ed]
usr_bytes = 8_800_000_000

[flavour.board-orangepi-3b-v2-1]
usr_bytes = 8_800_000_000

[flavour.dev-x86_64]
usr_bytes = 10_800_000_000

[flavour.dev-aarch64]
usr_bytes = 10_800_000_000
