# A magic packet wakes a sleeping Tilo device over Ethernet (Wake-on-LAN).
# Another of the person's devices on the same network, or a developer's
# machine, sends it to the MAC the device advertises in its presence
# (docs/device-reach.md). A profile can still turn it off with its own
# ethernet.wake-on-lan.
#
# This file sets Ethernet only. Wi-Fi wake depends on the connection's
# explicit flags or its hardware-profile default; it is not disabled here.
# Lenovo 83ED images generate a separate WCN7850 default disabling WoWLAN
# because the retained-firmware resume path can leave MHI unusable. Explicit
# saved profile wake flags override that default and need separate diagnosis.
[connection-tilo-wake]
ethernet.wake-on-lan=magic
