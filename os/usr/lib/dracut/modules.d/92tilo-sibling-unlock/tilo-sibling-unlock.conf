# NetworkManager in the initramfs, for one sibling unlock attempt. Wired links
# get DHCP on their own; the owner's unlock networks are runtime keyfiles the
# client writes to /run/NetworkManager/system-connections and removes again.
[main]
plugins=keyfile
dhcp=internal
rc-manager=file
# An empty list: every Ethernet link gets an automatic DHCP profile.
no-auto-default=

[keyfile]
path=/run/NetworkManager/system-connections

[logging]
level=INFO
