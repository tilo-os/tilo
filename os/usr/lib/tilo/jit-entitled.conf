# Packages that may run without write-xor-execute.
#
# tilo-launcher compiles every sandboxed app's syscall filter with a rule that
# refuses any mmap/mprotect/pkey_mprotect asking for a mapping that is writable
# and executable at the same time. That combination is what turns a heap or
# stack write into code execution: the attacker stops needing to find existing
# instructions to reuse and can write their own. Refusing it costs an app
# nothing unless it compiles code at run time.
#
# One class of program genuinely does. A web engine's JavaScript tier emits
# machine code into a mapping and then runs it, and cannot be made to work
# without the combination. Everything named here gets the `tilo-jit` profile:
# the same deny-list minus that one rule. ptrace, mount, pivot_root, chroot,
# unshare, setns, bpf, keyctl and raw AF_PACKET sockets are still refused.
#
# The list lives in /usr/lib because the IMAGE decides who may generate code,
# not the package. A .tapp carries its own manifest, so a package naming its
# own profile was the applicant filling in their own permit — an app must not
# be able to opt itself out of a protection, which is the same rule
# untrusted-parsers.conf states from the other direction. A manifest may still
# write `seccomp = "tilo-jit"`; if the id is not on this list the launcher
# applies the strict profile anyway and says so on stderr. (An operator can
# still put a machine-local file at the same path — /usr is the image's copy.)
#
# Format: one package id per line, `#` starts a comment, a trailing `*` makes
# the entry a prefix match. When this file is missing the launcher falls back
# to a compiled-in list holding the same single entry, so a packaging mistake
# degrades to "the browser works" rather than to "nothing may generate code" —
# which would be a browser that cannot render a page on any image that lost
# the file.
#
# What belongs here: a program with a real code-generating tier, where
# write-then-flip is not available to it. What does not: anything that merely
# feels fast-moving or ships a plugin system. A well-behaved JIT that maps
# writable, writes, then flips to executable already runs under the strict
# profile and needs no entry.

# The browser's Chromium engine and its V8 tiers. The only package in this tree that
# generates code at run time, and — see untrusted-parsers.conf — also the one
# that parses the most bytes it did not produce, which is why it is on both
# lists at once.
so.tilo.browser

# Mail's HTML reader runs the same engine (its V8 tiers are part of it, although
# the CSP of every mail document denies script).
so.tilo.mail
