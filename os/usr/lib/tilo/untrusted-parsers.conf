# Packages whose processes parse bytes they did not produce.
#
# tilo-launcher reads this list and gives everything named here two protections
# the rest of the system does not pay for:
#
#   * the scudo hardened allocator, LD_PRELOADed and bound into the sandbox
#   * hardware shadow stacks, via GLIBC_TUNABLES=glibc.cpu.hwcaps=SHSTK
#
# Both are deliberately NOT image-wide. Measured on a 3-million-allocation loop:
# the allocator costs roughly 3.3x, shadow stacks about 8%, and both together
# about 4.2x. Most of Tilo is Rust and does not produce the bug classes the
# allocator catches, so spending that everywhere would be a tax on
# already-memory-safe code. Kicksecure ships hardened_malloc and still cannot
# enable it globally, for the same reason from the other direction: something
# always breaks.
#
# The list lives in /usr/lib because the IMAGE decides who is high-risk, not the
# package. An app manifest cannot request this and cannot decline it: the
# question is how much the system trusts the app's inputs, and an app that could
# answer it would be answering for its own author. (An operator can still put a
# machine-local file at the same path — /usr is the image's copy.)
#
# Format: one package id per line, `#` starts a comment, a trailing `*` makes
# the entry a prefix match. When this file is missing the launcher falls back to
# a compiled-in list with the same three entries, so a packaging mistake
# degrades to "hardened" rather than to "unprotected".
#
# What belongs here: anything that runs a C or C++ parser over remote or
# user-supplied data — web engines, container demuxers, audio/video decoders,
# image codecs, font shapers. What does not: a pure-Rust app reading its own
# CRDT document.

# A complete web engine: HTML, CSS, images, media and fonts from any origin,
# plus a JavaScript JIT. Also the only package on the tilo-jit seccomp profile.
so.tilo.browser

# Video: container demux and H.264/AV1 decode over network streams.
so.tilo.tube

# Audio: container and codec parsing over network streams.
so.tilo.music
