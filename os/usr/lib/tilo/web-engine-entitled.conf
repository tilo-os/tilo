# Packages that may build a nested sandbox of their own.
#
# tilo-launcher's syscall filter refuses every app the calls that create
# namespaces: unshare, setns and the namespace flags to clone. A web engine
# that confines each renderer process is the one program that needs some of
# them. Chromium puts every renderer into a new user namespace holding a new
# PID and network namespace, then chroots it into an empty directory, and it
# refuses to run renderers at all when it cannot ("No usable sandbox!").
# Everything named here gets the `tilo-web-engine` profile: `tilo-jit` plus
# exactly those three namespace kinds and chroot. Mount, pivot_root, setns and
# the mount, IPC, UTS, cgroup and time namespaces are still refused, so the
# nested namespaces can only narrow what the package already has.
#
# The cost is kernel surface: inside its own user namespace the package holds
# capabilities over its own network namespace, the path most user-namespace
# kernel bugs have been reached through. It is granted per package, by the
# image, for the same reason as jit-entitled.conf: a manifest asking for it is
# the applicant filling in their own permit.
#
# Format: one package id per line, `#` starts a comment, a trailing `*` makes
# the entry a prefix match. When this file is missing the launcher falls back
# to a compiled-in list holding the same single entry.

# The browser's Chromium engine.
so.tilo.browser
