# System apps that are told whether this session owns the machine.
#
# The compositor that drives this machine's display with its seat owns the
# machine's system surfaces: network, radios, audio, displays, the clock,
# accounts, printers, power and software. It passes that answer to apps in
# TILO_SYSTEM_SURFACES. A sandbox starts from a cleared environment, so
# tilo-launcher passes the answer only to the packages named here, and only
# when their manifest declares `[sandbox] manages-machine = true`. Every
# other app is started without it and treats the machine as managed by the
# host system.
#
# The list lives in /usr/lib because the IMAGE decides which apps manage the
# machine, not the package: a .tapp carries its own manifest. This is an
# accident guard for the apps' own UI, not a permission. What they can change
# is still decided by polkit, logind, file permissions and the sandbox.
#
# Format: one package id per line, `#` starts a comment, a trailing `*` makes
# the entry a prefix match. When this file is missing the launcher falls back
# to a compiled-in list with the same entries.

so.tilo.settings
so.tilo.vpn
