# A node's server (tilo-node-server@.service): the person's workspaces for their
# web pages, beside the session that runs their apps. Its identity is its own,
# installed by the person's page through /peer/v1/install; its state is the
# daemon's, on the node's volume.
identity_root = "/var/lib/tilo-node/server/identity"
state_root = "/var/lib/tilo-node/server/state"
# Where the installing page reaches it, and the certificate it serves with while
# installing and after: a development one, kept on the node's volume.
web_listen = "0.0.0.0:9443"
