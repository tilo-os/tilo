# A node's server (tilo-node-server@.service): the person's workspaces for their
# web pages, beside the session that runs their apps. Its identity and state are
# the unit's own (`TILO_IDENTITY_ROOT`, `XDG_STATE_HOME`), on the node's volume.
# Where the installing page reaches it, and the certificate it serves with while
# installing and after: a development one, kept on the node's volume.
web_listen = "0.0.0.0:9443"
