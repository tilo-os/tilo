# Tilo interactive performance policy.
#
# These are conservative scheduler/VM defaults, not a permanent "performance"
# power profile: power-profiles-daemon still owns the hardware power/thermal
# trade-off selected by the user.

# Preserve scheduler fairness between interactive sessions and CPU-heavy job
# groups. The matching kernel feature is pinned in tilo.config.
kernel.sched_autogroup_enabled = 1

# zram is fast enough to prefer over evicting clean application pages, but
# clustered swap I/O only adds decompression work and latency for a RAM-backed
# device. These are the upstream zram-generator/systemd-oomd style defaults.
vm.swappiness = 100
vm.page-cluster = 0

# Avoid background huge-page compaction. Applications with large stable heaps
# retain THP through madvise; latency-sensitive threads never compact merely
# because every anonymous mapping was implicitly eligible.
vm.compaction_proactiveness = 0
