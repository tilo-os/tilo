# Tilo runtime hardening — kernel and network tunables.
#
# Lives under /usr/lib because it is part of the image, not per-machine
# configuration. Anything an operator needs to change belongs in
# /etc/sysctl.d/ with a higher number, which sorts later and wins.
#
# ===========================================================================
#  DO NOT ADD kernel.unprivileged_userns_clone = 0
#  DO NOT LOWER user.max_user_namespaces
# ===========================================================================
# Every hardening guide recommends turning unprivileged user namespaces off.
# On Tilo that switch does not harden anything — it removes the sandbox. Each
# workspace runs its apps under bubblewrap, which needs an unprivileged
# namespace to exist before it can drop anything, so disabling namespace
# creation would leave applications running with MORE access, not less, and
# would stop the compositor from launching them at all. The correct move is
# always to constrain what a namespace can do once created (seccomp filter,
# Landlock ruleset, capability set, cgroup) — never to remove the ability to
# create one. Anyone reading a checklist and reaching for that knob: this
# paragraph is the answer.

# --- Process introspection -------------------------------------------------

# No process may attach to another, not even a parent to its own child, and
# not even as root. Attaching is how a compromised app would read another
# app's keys or inject code across the sandbox boundary; Tilo has no
# supervisor that legitimately needs it.
#
# The compositor's own test harness does not need this: it drives the running
# shell over the TILO_TEST_CONTROL JSON socket, and the sandbox seccomp filters
# already refuse ptrace(2) outright from inside an app.
#
# Consequences worth knowing: gdb and strace stop working on this machine, and
# systemd-coredump still writes the core but can no longer symbolise a
# backtrace into the journal. Level 3 cannot be lowered at run time by design
# — a debugging session needs a drop-in such as
# /etc/sysctl.d/90-local-debug.conf setting a lower value, and a reboot.
# To see where a running compositor spends its time, the device admin asks it
# to profile itself instead (session-diagnostics profile-start on the admin
# control socket; docs/performance-flags.md, "Profiling the running desktop").
kernel.yama.ptrace_scope = 3

# Kernel pointers read as zero everywhere, for every user including root.
# Otherwise /proc/kallsyms and a dozen /proc and /sys files hand an exploit
# the KASLR offset it needs to turn a write primitive into code execution.
kernel.kptr_restrict = 2

# Only root reads the kernel ring buffer. dmesg leaks addresses, hardware
# layout and driver state that is useful for nothing else at this point.
kernel.dmesg_restrict = 1

# Unprivileged eBPF off, and locked off — value 1 cannot be undone without a
# reboot. The unprivileged verifier has been a recurring source of privilege
# escalation, and nothing in this image loads BPF without privilege.
kernel.unprivileged_bpf_disabled = 1

# Blind constants in JIT-compiled BPF so a loaded program cannot be used to
# spray attacker-chosen bytes into executable kernel memory. Privileged BPF
# (systemd's cgroup device and address filters) still works.
net.core.bpf_jit_harden = 2

# No new kernel may be loaded for kexec. This closes the "boot a kernel of my
# choosing without touching the disk" path around the signed boot chain.
# lockdown=integrity in the kargs already blocks unsigned images; this
# removes the call entirely.
-kernel.kexec_load_disabled = 1

# perf_event_open needs CAP_PERFMON. The interface has a long history of
# privilege escalation and there is no reason for an application to reach it.
# Profiling the compositor still works — run the profiler as root.
kernel.perf_event_paranoid = 3

# Full address-space randomisation (heap, stack, mmap, VDSO). This is the
# default; pinned here so a future drop-in cannot quietly relax it.
kernel.randomize_va_space = 2

# Keep the bottom 64 KiB unmappable, so a NULL-pointer dereference in the
# kernel cannot be aimed at a page an unprivileged process placed there.
vm.mmap_min_addr = 65536

# A privileged process that crashes writes no core. Its core would contain
# key material and belong to a user who should not read it.
fs.suid_dumpable = 0

# Line-discipline modules are not loaded on demand from an ioctl. Autoloading
# from a TTY ioctl has produced use-after-free bugs and no desktop workload
# needs a discipline the running kernel does not already have.
dev.tty.ldisc_autoload = 0

# --- Shared-directory races ------------------------------------------------
# /tmp is shared between the compositor, the portal helpers and every app that
# was granted it. These four turn the classic "point a link at someone else's
# file and wait" pattern into an error.

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Network ---------------------------------------------------------------
# Tilo peers over Iroh on an ephemeral QUIC port, so this section removes the
# ways a host on the LAN can redirect or spoof traffic without touching
# anything peer sync depends on.

# Never accept a route change from an ICMP redirect, and never send one. A
# redirect from a machine on the café Wi-Fi should not be able to move this
# host's traffic. `secure_redirects` is off as well: accepting them only from
# the current gateway is still accepting them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Source routing lets a sender dictate the return path. It has no legitimate
# use on a desktop and is a straightforward way to bypass a filter.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Reverse-path filtering in loose mode: drop a packet only when its source is
# unreachable by ANY route. Strict mode (1) is the stronger setting and is
# wrong here — it drops the asymmetric paths that show up with multiple
# interfaces, VPNs and peer-to-peer traffic, which would break peer sync
# rather than protect it.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Log packets whose source address cannot be routed back. Cheap, and the only
# on-host signal that someone is spoofing on the local segment.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Do not answer broadcast pings, and ignore bogus ICMP error replies. Both
# turn this host into an amplifier or a target-discovery aid for a scan of
# the local network.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN cookies for the listening peer-sync socket, and RFC 1337 protection so
# a stray old segment cannot resurrect a socket in TIME_WAIT.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# Not set: accept_ra / accept_ra_defrtr. Refusing router advertisements is a
# common item on hardening lists and it would leave this machine with no IPv6
# default route on any ordinary home or office network — a rogue advertisement
# is a real risk, but so is a desktop with half its connectivity missing, and
# the first is what the signed transport layer already assumes.
