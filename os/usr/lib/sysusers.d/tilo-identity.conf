# The device-trust group.
#
# The machine has exactly one cryptographic identity, and its private
# half lives in /var/lib/tilo/device-private/keypair.bin. Two components read it:
# fs.service, which runs as root because mounting FUSE at
# /var/workspace needs it, and the compositor, which runs inside the
# user's session. They are the same device, so they must present the
# same identity — which means the key cannot be owned by exactly one of
# them.
#
# Membership in this group is therefore read access to the device identity.
# Keep it to components that must cryptographically present this machine: the
# session user on desktops and the static relay account on headless hosts. It
# is not a convenience or general service group.
g tilo-identity -
