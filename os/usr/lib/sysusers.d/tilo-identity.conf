# The device-trust group.
#
# The machine has exactly one cryptographic identity. Its private half
# (/var/lib/tilo/device-private/keypair.bin) is the device daemon's alone and
# this group cannot read it: only that one process signs as the device, and
# every other program asks it to.
#
# What the group still gives the person's account, which stays a member, is
# the public side and the paths a session serves from: the device certificates
# and the person's public key, the enrollment directories, /run/tilo, and the
# Windows VM's files. Keep membership to the session user on desktops and the
# static server account on headless hosts; it is not a convenience or general
# service group.
g tilo-identity -
