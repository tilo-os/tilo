# The hosted-VM service (os/usr/libexec/tilo-hosted-serve). Its numbers are the
# jail's (os/containers/tilo-vm-host/hosted-jail.json): the service's uid the
# helper refuses every other caller but, and the base of the slot uids the VMs
# run as.
u tilo-hosted 10001 "Tilo hosted VM service" /var/lib/tilo-hosted /usr/sbin/nologin
