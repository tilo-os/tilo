# The account the device's app host runs apps as (tilo-app-host@.service): an
# app's held connection, which runs with no person signed in, never runs as the
# device daemon's account. It owns nothing but its own state, and it is in no
# group of the device's.
u tilo-app - "Tilo apps run by the device" /var/lib/tilo-app /usr/sbin/nologin
