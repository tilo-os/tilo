# An update check is also the retry point for a codec-pack Mesa part that is
# waiting for a matching RPM Fusion build. --no-block: the update service must
# not wait on a third-party download, and the helper is a no-op unless the owner
# opted in to the pack.
[Service]
ExecStartPost=-/usr/bin/systemctl start --no-block tilo-codec-pack@refresh.service
