[Unit]
After=NetworkManager.service

[Service]
ExecCondition=/usr/libexec/tilo-update-policy-check
ExecStart=
# Upstream passes --apply, which reboots immediately. Tilo stages atomically and
# lets the user's next normal restart apply it, avoiding mid-session/game loss.
ExecStart=/usr/libexec/tilo-verified-update --quiet
