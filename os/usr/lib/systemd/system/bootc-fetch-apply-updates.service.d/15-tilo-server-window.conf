# A server stages an update only inside the window its operator set: the machine
# serves other people's workspaces, and a restart outside that window takes them
# with it. The window is one setting in the update policy every Tilo machine
# keeps (/usr/libexec/tilo-server-update-window reads it); with none set, the
# update stages at any time, as a desktop's does.
[Service]
ExecCondition=/usr/libexec/tilo-server-update-window
