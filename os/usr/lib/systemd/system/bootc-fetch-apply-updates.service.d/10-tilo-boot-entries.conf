# A staged deployment's boot loader entry has to carry a try counter BEFORE the
# reboot into it. Adding it at the next boot is one boot too late: the first boot
# of a broken update would be unassessed, and an update that never reaches
# userspace would keep being chosen for ever.
#
# This is why the hook is here and not only in tilo-boot-entries.service — that
# unit runs at boot, and the window that matters opens when the update is staged.
[Service]
ExecStartPost=-/usr/libexec/tilo-deployment entries
