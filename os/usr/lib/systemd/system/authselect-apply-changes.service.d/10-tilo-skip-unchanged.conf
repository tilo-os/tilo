# Skip a boot on which nothing authselect applies from changed since its last successful
# run (os/usr/libexec/tilo-authselect-unchanged): the unit stays ordered before user
# sessions, so when a profile or the selection did change it still finishes first, but an
# unchanged boot no longer holds the greeter for a run that changes nothing.
[Service]
# ExecCondition skips the unit when its command exits 1-254, so the check inverts.
ExecCondition=/bin/sh -c '/usr/libexec/tilo-authselect-unchanged check && exit 1; exit 0'
ExecStartPost=/usr/libexec/tilo-authselect-unchanged record
