# What a server is, in the configuration of every device's one daemon
# (tilo-runtime.service), never a second unit: a server is a device, and this
# image is the device's image with these settings.
#
# The daemon, its account (`tilo`) and its state root (/var/lib/tilo/state,
# which the base unit names) are every device's. What is a server's is the
# configuration it reads: the workspaces it keeps, its own web listener, the
# relay it shows its code at, and the trust a peer's certificate must meet.
[Unit]
# A server its person's Servers entry retired from service does not start: the
# machine's state root carries the marker its document writes.
ConditionPathExists=!/var/lib/tilo/state/decommissioned

[Service]
Environment=TILO_SERVER_CONFIG=/etc/tilo/server.toml
# The identity tree it serves as: the device key, the certificates people gave
# this machine, and the login a ticket left. The base unit reads it by default;
# a server's configuration makes that explicit because everything it serves
# hangs off it.
Environment=TILO_IDENTITY_ROOT=/var/lib/tilo
# A server may come up before it joined anyone: its error stream carries the words that say how
# to join it, and a serial console is the only place a headless machine can say them.
StandardError=journal+console
# A server that has not answered in 30 s is not going to, and a boot's verdict
# must not wait for it.
TimeoutStartSec=30
# Hardening a daemon on a network-facing, always-on machine keeps beyond every
# device's: no shared IPC namespace, no inherited keyring, no writable-and-
# executable memory, no namespaces of its own.
PrivateIPC=yes
RemoveIPC=yes
KeyringMode=private
MemoryDenyWriteExecute=yes
RestrictNamespaces=yes
