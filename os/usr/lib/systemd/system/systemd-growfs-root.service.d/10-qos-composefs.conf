# systemd-gpt-auto-generator pulls in systemd-growfs-root.service whenever the
# root partition carries the GPT GrowFileSystem attribute, which os/dev/disk-image.sh
# sets via `GrowFileSystem=yes` in its repart definition. The unit runs
# `systemd-growfs /`, and `/` here is a composefs overlay rather than a block
# device, so it can only fail. qos-growfs-sysroot.service grows the real
# filesystem at /sysroot instead; this condition keeps the two from overlapping
# without leaving either layout ungrown.
[Unit]
ConditionPathIsMountPoint=!/sysroot
