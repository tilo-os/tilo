# A server's liveness is serving, not a sign-in screen: the same boundary an
# always-on board uses to name its own session unit, here naming the probe that
# says whether the server answers and its store opens. See
# os/usr/libexec/tilo-server-health.
[Unit]
Wants=tilo-server-health.service

[Service]
Environment=TILO_BOOT_HEALTH_UNIT=tilo-server-health.service
# Above tilo-server-health's own 240 s wait for the server, so a broken boot's
# verdict is the probe's and not this wait's.
Environment=TILO_BOOT_HEALTH_TIMEOUT=360
