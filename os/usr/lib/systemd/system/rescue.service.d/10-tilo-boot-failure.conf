# A failed start shows Tilo's boot-failure screen, not systemd's administrator
# console: what failed, Try again, Start the previous version, and a recovery
# console behind the disk passphrase or an administrator's sign-in. Its stock
# ExecStartPre= quits plymouth, which the screen is drawn on.
[Service]
ExecStartPre=
ExecStart=
ExecStart=-/usr/libexec/tilo-boot-failure show
