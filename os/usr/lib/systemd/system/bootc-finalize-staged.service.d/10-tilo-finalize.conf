# bootc finalizes a staged composefs deployment only at shutdown, and a machine
# that loses power instead never reaches that step, so the update it staged never
# boots. Tilo finalizes as soon as the staged entry carries its try counter and
# again at every boot (tilo-deployment-finalize.service). This hook keeps shutdown
# as the last chance, and it is safe because finalizing a deployment that already
# is the boot plan does nothing.
[Service]
ExecStop=
ExecStop=/usr/libexec/tilo-deployment finalize
