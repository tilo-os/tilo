# The image builds /etc/ld.so.cache together with its /usr, and an upgrade's
# /etc merge carries the new image's cache unless it was changed locally. A
# new /usr is therefore no reason to rebuild it: bootc removes /etc/.updated
# from every deployment, so the stock trigger would rebuild it on the first
# boot of every install and upgrade. Rebuild only a missing or empty cache.
[Unit]
ConditionNeedsUpdate=
ConditionFileNotEmpty=|!/etc/ld.so.cache
