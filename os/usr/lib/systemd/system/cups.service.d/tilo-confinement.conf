# Confinement for the CUPS scheduler.
#
# CUPS is a necessary evil on a desktop: it is the only way to reach a
# printer, and it is a large C daemon that parses IPP off a socket, reads
# vendor PPDs, and execs a chain of filter binaries over attacker-influenced
# document data. Fedora ships it with no hardening at all — `systemd-analyze
# security cups.service` scores the stock unit 9.6 UNSAFE. Everything below
# exists to shrink what a compromised cupsd reaches.
#
# Read `docs/printing-threat-model.md` before changing any of this. Each
# directive is here for a stated reason; none of it is copied from a template.

[Service]
# --- Privileges ------------------------------------------------------------
# cupsd is NOT switched to a dedicated user with `User=`, and that is
# deliberate rather than an oversight. Upstream cupsd must start as root: it
# creates /run/cups/cups.sock with the right ownership, and it setuid()s per
# job so filters run as the *submitting* user and the spool is not a shared
# trust pool. Forcing User=lp makes it fail at startup, which on a printing
# stack shows up as "printing is broken" long after the change.
#
# The dedicated unprivileged user is applied where it actually bites — the
# filter processes that touch document bytes — via `User lp` / `Group lp` in
# cupsd.conf. Root here is confined by everything below instead.
NoNewPrivileges=yes

# The full root capability set is far more than a print scheduler needs.
# What is kept, and why:
#   CHOWN, DAC_OVERRIDE, FOWNER  — own and reach spool files across uids
#   SETUID, SETGID               — drop to the job's user before filtering
#   KILL                         — reap filters that hang or overrun
#   AUDIT_WRITE                  — PAM writes an audit record on auth
# Everything else is dropped. Notably absent: NET_BIND_SERVICE, because this
# cupsd never binds a privileged port (see cups.socket.d/tilo-local-only.conf),
# and NET_ADMIN / SYS_ADMIN / SYS_MODULE, which it has never needed.
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID CAP_KILL CAP_AUDIT_WRITE
AmbientCapabilities=

# --- Filesystem ------------------------------------------------------------
# Everything read-only except the handful of paths cupsd genuinely writes.
ProtectSystem=strict
# /etc/cups is writable because adding or editing a printer rewrites
# printers.conf. Without it, "Add printer" fails in a way that looks like a
# permissions bug in the UI rather than a deliberate restriction.
ReadWritePaths=/etc/cups /var/spool/cups /var/cache/cups /var/log/cups /run/cups
# cupsd never reads user home directories. Jobs arrive as bytes over the
# socket — the client reads the file, the scheduler only ever sees a stream.
# So a cupsd that is talked into opening a path cannot reach anyone's files.
ProtectHome=yes
PrivateTmp=yes
# The spool is the one place attacker-influenced bytes are at rest.
UMask=0077

# --- Devices ---------------------------------------------------------------
# PrivateDevices=yes is deliberately NOT set: it replaces /dev with a
# pseudo-only tree, and USB printers live at /dev/usb/lp* and /dev/bus/usb.
# Setting it would silently break every directly attached printer. A closed
# device policy with an explicit allow list gets the same containment without
# that cost.
DevicePolicy=closed
DeviceAllow=/dev/usb/lp0 rw
DeviceAllow=/dev/usb/lp1 rw
DeviceAllow=/dev/usb/lp2 rw
DeviceAllow=/dev/usb/lp3 rw
DeviceAllow=char-usb_device rw
# Parallel-port printers. Rare, near-free to allow, and their absence is
# indistinguishable from a broken cupsd when someone does have one.
DeviceAllow=char-lp rw

# --- Kernel and namespaces -------------------------------------------------
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
# A print scheduler has no business creating namespaces — that is a sandbox
# escape primitive, not a printing feature.
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# Filters are separate binaries; nothing in the chain needs writable
# executable memory. This is the one directive most likely to break an exotic
# filter, so it is stated here rather than assumed: if a printer stops working
# after a filter update, test with this line removed before blaming anything
# else, and record the finding in the threat model.
MemoryDenyWriteExecute=yes

# --- Network ---------------------------------------------------------------
# AF_UNIX is the local socket every local client uses. AF_INET/AF_INET6 stay
# because network printers are reached over IPP/AppSocket and removing them
# would mean "no printer that is not plugged in". AF_NETLINK is how cupsd
# learns about interfaces. Everything else — packet sockets, bluetooth, can,
# and the rest — is refused.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# No inbound listener exists, so nothing legitimate connects *to* cupsd from
# off-box. This does not restrict outbound: reaching a network printer is the
# job.
IPAddressDeny=
PrivateMounts=yes

# --- System calls ----------------------------------------------------------
SystemCallArchitectures=native
SystemCallFilter=@system-service
# @privileged is NOT denied wholesale: cupsd's per-job setuid()/setgid() lives
# there, and denying it kills printing outright. The specific dangerous
# families it has no use for are denied instead.
SystemCallFilter=~@mount @swap @reboot @raw-io @obsolete @cpu-emulation @module @clock @debug @pkey
SystemCallErrorNumber=EPERM

# --- Blast radius ----------------------------------------------------------
# A filter chain that runs away should not take the machine with it.
TasksMax=256
MemoryMax=1G
