# Blessing a good boot renames its loader entry on the ESP, from
# `name+LEFT-DONE.conf` to `name.conf`. Tilo keeps the ESP (and a separate
# /boot) mounted read-only, so without this the rename fails with EROFS: the
# entry stays on trial, every later good boot spends another try, and after
# three of them the boot loader abandons a deployment that works.
#
# Like tilo-esp-write@.service, the unit gets a writable view of its own: the
# remount happens in this service's private mount namespace, and the global
# mounts stay read-only. Each Exec line gets a namespace of its own, so the
# remount and the blessing are one process. Listing a directory first triggers
# an automount. ($$ is a literal $ for the shell, not a unit variable.)
#
# On an installed system /boot is a separate ext4 partition and the ESP is at
# /boot/efi (tilo-esp-generator), which systemd-bless-boot finds by itself.
[Unit]
RequiresMountsFor=/boot /boot/efi

[Service]
PrivateMounts=yes
ExecStart=
ExecStart=/bin/sh -ec 'for m in /efi /boot /boot/efi; do ls "$$m" >/dev/null 2>&1 || continue; mountpoint -q "$$m" || continue; if findmnt -no OPTIONS --mountpoint "$$m" | tr , "\\n" | grep -qx ro; then mount -o remount,rw "$$m"; fi; done; exec /usr/lib/systemd/systemd-bless-boot good'
