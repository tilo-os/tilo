# The scheduler is reachable from this machine and nowhere else.
#
# Fedora's cups.socket already lists only /run/cups/cups.sock. This drop-in
# does not change that — it pins it, so a future package update that adds a
# `ListenStream=631` cannot quietly turn the desktop's print scheduler into a
# network service.
#
# The historical reason to listen on 631 is sharing a printer with other
# machines. Tilo does not do that by default: a shared printer means an IPP
# parser exposed to the LAN, which is the exact surface behind the 2024
# cups-browsed remote-code-execution chain. Someone who wants it can add a
# listener deliberately; nobody gets it by accident.

[Socket]
# Reset first, so this is the complete list rather than an addition to
# whatever the package shipped.
ListenStream=
ListenStream=/run/cups/cups.sock
RemoveOnStop=on

# The socket is the only door. Local clients reach it through filesystem
# permissions, which means group membership is the access-control mechanism —
# worth being explicit about rather than inheriting.
SocketMode=0660
SocketUser=root
SocketGroup=lp
