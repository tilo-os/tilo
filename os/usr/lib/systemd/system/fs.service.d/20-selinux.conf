[Service]
# Run the collaborative filesystem daemon in its own SELinux domain (qos_fs_t,
# defined in /usr/share/qos/selinux/qos-base.cil) instead of unconfined_service_t.
# The leading '-' makes systemd tolerate a missing/invalid context (e.g. SELinux
# disabled or the module not loaded), so fs always starts — it just runs
# unconfined in that case rather than failing.
SELinuxContext=-system_u:system_r:qos_fs_t:s0
