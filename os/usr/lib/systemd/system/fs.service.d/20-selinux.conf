[Service]
# Run the collaborative filesystem daemon in its own SELinux domain (tilo_fs_t,
# defined in /usr/share/tilo/selinux/tilo-base.cil) instead of unconfined_service_t.
# The image build verifies that the policy module is installed. If an enforcing
# host cannot enter the dedicated domain, fail the mount instead of silently
# running this root network daemon as unconfined_service_t.
SELinuxContext=system_u:system_r:tilo_fs_t:s0
