# Import no systemd credentials from outside the signed image.
#
# systemd reads credentials from the kernel command line, SMBIOS type 11 OEM
# strings, qemu fw_cfg and the boot loader's credential drop-ins. It skips only
# containers and confidential VMs, so on physical hardware anyone who controls
# the firmware's OEM strings could add units, tmpfiles lines or SSH keys that
# run as root on every boot. Nothing in a sealed Tilo boot consumes imported
# credentials, and `bootc container ukify` seals this argument into the UKI.
#
# The unsealed dev image deletes this file: tilo-vm hands a dev VM its SSH key
# as an SMBIOS credential.
kargs = ["systemd.import_credentials=no"]
