# The kernel arguments the boot needs that no package supplies, and that on a
# sealed image can ONLY come from here.
#
# These used to be injected at disk-image time (`bootc install --karg`), which
# works for an unsealed install and is impossible for a sealed one: the command
# line is signed into the UKI at build time, so an argument added at install
# would be silently absent at boot. `bootc container ukify` reads this directory,
# so a karg placed here ends up inside the signature and inside the PCR 11
# measurement along with everything else. os/dev/disk-image.sh refuses --karg for
# an image that carries a UKI rather than dropping it quietly.
kargs = [
  # bootc mounts the root read-only without this. The sealed root itself stays
  # read-only regardless — it is `composefs:<digest> overlay ro,verity=require`,
  # and that is the point — but /var, /etc and the writable overlay above it need
  # a read-write mount to be assembled at all.
  "rw",
  # A headless boot has to leave a log somewhere a harness can read, which is the
  # only way a boot that never reaches userspace can be diagnosed. tty0 keeps the
  # framebuffer console so a screendump still shows the boot.
  "console=tty0",
  "console=ttyS0,115200",
  # Keep the local display on the UKI's signed qOS splash. Fatal boot errors
  # still replace it; the serial console remains complete for diagnostics.
  "quiet",
  "splash",
  # A diagnostics serial console must not make Plymouth abandon the local
  # graphical LUKS prompt after initially painting the branded splash.
  "plymouth.ignore-serial-consoles",
  "loglevel=3",
  "systemd.show_status=auto",
  "rd.udev.log_level=3",
  "vt.global_cursor_default=0",
]
