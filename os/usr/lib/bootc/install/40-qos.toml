# bootc reads every /usr/lib/bootc/install/*.toml at `bootc install {to-disk,
# to-filesystem}` time and merges them into the install configuration. Baking
# this drop-in into the image makes the choice apply to every install path — the
# desktop qcow2 that bootc-image-builder produces (the same install code path
# bib drives internally), the Anaconda `ostreecontainer` path from the ISO, and
# the custom `qos-install` frontend that ultimately execs `bootc install
# to-disk` — without every caller having to pass `--bootloader`.
#
# The accepted values for the `bootloader` key are `grub`, `grub-cc`, `systemd`,
# `none`.
#
# Why `grub` and not `systemd`:
#
# bootc has two install backends. The **ostree** backend is what every qOS
# install path uses today, and it has no systemd-boot code path at all —
# `install_with_sysroot()` in bootc's crates/lib/src/install.rs matches on the
# resolved bootloader and installs via bootupd for `Grub`, skips for `None`, and
# for `Systemd` it does nothing but
#
#     anyhow::bail!("bootupd is required for ostree-based installs");
#
# The only caller of bootc's `install_systemd_boot()` is its **composefs**
# backend (crates/lib/src/bootc_composefs/boot.rs). That backend is selected by
# `bootc install --composefs-backend`, or implicitly when the image ships a
# unified kernel image; bootc-image-builder exposes no flag for it and the qOS
# kernel is not a UKI, so bib always takes the ostree path.
#
# So `bootloader = "systemd"` does not produce a slower install or a fallback —
# it makes the image **uninstallable**, and it did: every `bootc install` against
# a qOS image failed at the bootloader step with the bail above. This is a
# property of bootc's code, not of the image's bootupd metadata; the bail happens
# before bootupd is consulted, and bootupd 0.2.35 cannot describe systemd-boot
# anyway (its EFI component knows only grub2 + shim, and
# `bootupctl backend generate-update-metadata` re-emits exactly that).
#
# Moving to systemd-boot therefore means moving to bootc's composefs backend —
# a real change to how the root filesystem is composed, not a bootloader swap.
# Until that is a deliberate decision, GRUB is the bootloader that installs, and
# `grub2` + `shim-x64` must stay in the image so bootupd has a payload to plant
# (see the bootloader section of os/Containerfile).
[install]
bootloader = "grub"
