# Per-user storage required before tilo-models.service starts.
#
# The manager is a user service deliberately: model bytes, rootless Podman
# state, and its launcher socket must never require a first privileged setup.
# `d` is idempotent, leaves an existing user's data alone, and runs as that
# user through systemd-tmpfiles --user.
d %h/.local/share/tilo            0700 - - -
d %h/.local/share/tilo/models     0700 - - -
d %h/.local/share/containers     0700 - - -
d %h/.config/tilo                0700 - - -
d %t/tilo                         0700 - - -
d %t/tilo/services                0700 - - -
