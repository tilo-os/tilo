# Persistent state directories for a qOS host-mode image.
# `bootc` mounts / read-only; anything the daemons write goes under
# /var, which is writable. Pre-create the tree with tight perms so
# the first-boot script + qos-relay.service don't have to.

# Identity tree — read-only in normal operation; the first-boot
# script populates it once.
d /var/lib/qos                  0755 root root -
d /var/lib/qos/device           0700 root root -
d /var/lib/qos/user-identity    0755 root root -

# Relay state (per-workspace CRDT snapshots + pending queues + iroh
# secret). systemd's `DynamicUser=yes` + `StateDirectory=qos-relay`
# create + own /var/lib/qos-relay at unit start; this line is a
# belt-and-suspenders in case the unit's state directive is stripped.
d /var/lib/qos-relay            0700 root root -
