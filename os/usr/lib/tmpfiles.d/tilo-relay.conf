# Relay state (per-workspace CRDT snapshots + pending queues + iroh secret)
# and the always-on server's full replica, owned by the relay's static account
# (sysusers.d/tilo-relay.conf), in every image that runs tilo-relay.service.
d /var/lib/tilo-relay            0700 tilo-relay tilo-relay -
d /var/lib/tilo/full-replica     0700 tilo-relay tilo-relay -
