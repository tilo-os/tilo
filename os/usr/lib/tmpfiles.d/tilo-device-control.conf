# Device control. The daemon (user tilo) stages each step's arguments in its invocation's
# directory under /run/tilo/device-steps, which the step's root unit reads, and keeps the
# content callers put to the device, which steps such as layer-import and tree-sync read.
d /run/tilo/device-steps          0700 tilo tilo -
d /var/lib/tilo/device-control    0700 tilo tilo -
