# systemd-tmpfiles snippets for qOS.
#
# bootc images are read-only outside /var (and a handful of other
# overlay-friendly paths), so every persistent directory the stack
# touches has to be (re)created at boot. systemd-tmpfiles-setup.service
# runs before local-fs.target, so these dirs exist before quick-fs or
# the compositor try to read/write them.
#
# Format: TYPE  PATH  MODE  USER  GROUP  AGE  ARG  (see tmpfiles.d(5))

# FUSE mountpoint. Owned by root so a hostile user can't replace the
# directory before quick-fs binds onto it; mode 0755 so every user can
# traverse into the per-user workspace dirs that fs creates
# underneath.
d  /var/workspace            0755  root  root  -  -

# Content-addressed blob cache for fs (Iroh + moka). 1MB
# readahead means churn is real; the dir grows but a btrfs root handles
# that fine. Owned by root because fs.service runs as root (FUSE
# needs CAP_SYS_ADMIN to mount at /var/workspace).
d  /var/cache/quick-fs        0755  root  root  -  -

# State root for the stack's persistent policy and identity material.
d  /var/lib/qos                0755  root  root           -  -

# The singleton Windows appliance. Every host-side artifact, including the
# guest-bridge bootstrap key, is root-only. Individual RemoteApp leases are
# runtime-only and are never made into a convenient shared filesystem.
d  /var/lib/qos/windows         0700  root  root           -  -
d  /var/lib/qos/windows/bridge  0700  root  root           -  -
# RAIL portal projections live below the signed-in user's logind-owned
# $XDG_RUNTIME_DIR/qos/windows-vm/leases (0700).  Do not pre-create a
# root-owned /run/qos lease tree: the compositor must materialise descriptor
# projections without making them broadly traversable or invoking a privileged
# file copier.

# Controller-owned Windows egress records and the distinct ID-free status
# summary. The qOS owner can read only the 0640 summary; opaque lease records
# remain below the root-only leaf.
d  /run/qos/windows-egress        2750  root  qos-identity   -  -
d  /run/qos/windows-egress/leases 0700  root  root           -  -

# The machine's one device identity. Every network and document
# identity on the box derives from the key in here: the compositor and
# filesystem Iroh endpoint id, the CRDT author, and
# the default access-control subject.
#
# `2770 root:qos-identity` — setgid, so the key inherits the
# device-trust group whichever component creates it first. fs.service
# runs as root and the compositor runs in the user's session; they are
# the same device and must present the same identity, so neither can own
# the key outright. Nothing outside the group gets any access, and the
# device-key reader enforces that on every read.
d  /var/lib/qos/device         2770  root  qos-identity   -  -
d  /var/lib/qos/user-identity  2770  root  qos-identity   -  -
d  /var/lib/qos-relay          0700  root  root           -  -
d  /var/lib/qos/full-replica   0700  root  root           -  -

# Narrow filesystem accounting/eviction IPC. Membership is intentionally the
# existing device-trust boundary: only the signed-in device user and root may
# ask the root-owned filesystem daemon to discard verified clean cache data.
d  /run/qos                    2770  root  qos-identity   -  -

# Windows Wine/UMU audio and network leases are per-launch, mode 0700 trees
# below this group-traversable parent. The compatibility broker may create a
# new leaf but another session user cannot list or read its sockets/config.
d  /run/qos/windows-compat         2730  root  qos-identity   -  -
d  /run/qos/windows-compat/leases  2730  root  qos-identity   -  -

# The capability list fs.service enforces. `C` copies the shipped
# default only when the destination does not exist, so an edited list
# survives every subsequent boot and every image update — bootc replaces
# /usr, and a policy file that /usr overwrote would silently undo an
# administrator's restriction.
#
# 0644 root:root: the mount reads it as root, and it must not be
# writable by the session it constrains.
C  /var/lib/qos/fs-capabilities.json  0644  root  root  -  /usr/share/qos/fs-capabilities.json

# Per-cluster bridge sockets land under $XDG_RUNTIME_DIR/nirios/ — we
# don't pre-create that here because XDG_RUNTIME_DIR is per-user tmpfs
# managed by systemd-logind. Documenting the convention here so anyone
# debugging "missing socket" issues knows where to look.
