# systemd-sysext's persistent search directory. The extension unit may write
# only this tree outside its own state and cache, and a sandbox can only grant
# write access to a path that exists.
d /var/lib/extensions 0755 root root -
# Every extension's state (opt-in marker, accepted revisions) and its
# world-readable status, <id>.json. Present before anything was ever installed:
# Settings and first-login setup watch it with inotify for progress, and the
# helper's unit also names it as its StateDirectory.
d /var/lib/tilo/extensions 0755 root root -
# Live system update layers (tilo-extension live:*) last until the next boot,
# which boots the staged image that holds all of them: every boot deletes them.
R! /var/lib/tilo/live-update/layers - - - - -
d /var/lib/tilo/live-update 0755 root root -
