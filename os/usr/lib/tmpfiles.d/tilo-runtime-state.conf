# The tree a Tilo server boots with: the device identity every machine has, the
# state root of the device's one daemon (tilo-runtime.service), and what the
# root-run helpers that carry out its person's settings write.
#
# `bootc` mounts / read-only, so everything the daemon writes is under /var; it
# is made here once, with the owners and modes it reads them with, before
# systemd-tmpfiles-setup finishes.
#
# The identity tree is the desktop's (os/usr/lib/tmpfiles.d/tilo.conf); a
# server's image carries only this part of it.

d /var/lib/tilo                  0755 root root         -
d /var/lib/tilo/device           2770 root tilo-identity -
d /var/lib/tilo/device/certs     2770 root tilo-identity -
# The device key is the daemon account's alone, in a directory nobody else can
# enter. `tilo-device-key-init` gives the key this directory's owner and 0600
# every boot.
d /var/lib/tilo/device-private   0700 tilo tilo         -
d /var/lib/tilo/user-identity    2770 root tilo-identity -
d /var/lib/tilo/peers            2770 root tilo-identity -
# Tokens this device already redeemed, and the staging a join on this machine
# publishes through: the group members may add their own entry, never rename
# another account's.
d /var/lib/tilo/enrollment-nonces 2770 root tilo-identity -
d /var/lib/tilo/enrollment-staging 3770 root tilo-identity -
d /var/lib/tilo/enrollment-commits 3770 root tilo-identity -
# The device's daemon: its profile and home, where it keeps the workspaces it
# serves and what its person's Servers entry asks of the machine.
d /var/lib/tilo/state            0700 tilo tilo         -
# The computer's app store, which the daemon installs into and starts apps
# from, and a lease any account may take.
d  /var/lib/tilo/apps            0755 tilo tilo         -  -
a+ /var/lib/tilo/apps            -    -    -            -  default:other::r-x
d  /var/lib/tilo/apps/leases     1777 tilo tilo         -  -
# Bounded rollback: the units that confirm a generation and harden the TPM
# sandbox themselves can write only these, and systemd refuses a unit whose
# ReadWritePaths= is missing. /run/tilo-rollback is where the initramfs leaves
# the secret a boot unlocked with; a machine with no rollback token never
# creates it, and it stays empty.
d /var/lib/tilo/rollback         0700 root root         -
d /run/tilo-rollback             0700 root root         -

# What the root-run helpers write: the systemd state a restart, a mask and a
# rollback change; the keyfiles NetworkManager reads; the hostname it sets; and
# the schedule the update-policy helper writes the update timer's drop-in into.
d /run/systemd                   0755 root root         -
d /etc/NetworkManager/system-connections 0700 root root -
f /etc/hostname                  0644 root root         -
d /etc/systemd/system/bootc-fetch-apply-updates.timer.d  0755 root root -
