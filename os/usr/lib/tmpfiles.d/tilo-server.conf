# Relay state (per-workspace CRDT snapshots + pending queues + iroh secret)
# and the always-on server's full replica, owned by the relay's static account
# (sysusers.d/tilo-server.conf), in every image that runs tilo-server.service.
d /var/lib/tilo-server            0700 tilo-server tilo-server -
d /var/lib/tilo/full-replica     0700 tilo-server tilo-server -
