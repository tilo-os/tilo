# Relay state (per-workspace CRDT snapshots + pending queues + iroh secret)
# and the always-on server's full replica, owned by the server's static account
# (sysusers.d/tilo-server.conf), in every image that runs tilo-server.service.
d /var/lib/tilo-server            0700 tilo-server tilo-server -
d /var/lib/tilo/full-replica     0700 tilo-server tilo-server -
# What tilo-server-control.service and tilo-server-device-config.service
# write: the systemd state a restart, a mask and a rollback change, the
# keyfiles NetworkManager reads, and the hostname it sets.
d /run/systemd                   0755 root root -
d /etc/NetworkManager/system-connections 0700 root root -
f /etc/hostname                  0644 root root -
