# Persistent state directories for a Tilo host-mode image.
# `bootc` mounts / read-only; anything the daemons write goes under
# /var, which is writable. Pre-create the tree with tight perms so
# the first-boot script + tilo-server.service don't have to.

# Identity tree — read-only in normal operation; the first-boot
# script populates it once. The certificates are the device-trust
# group's, as on a desktop; the device key is the daemon's alone.
d /var/lib/tilo                  0755 root root         -
d /var/lib/tilo/device           2770 root tilo-identity -
d /var/lib/tilo/device/certs     2770 root tilo-identity -
# The server's daemon reads the key, as tilo-server, never as root: the key is
# its account's, owner-only, in a directory nobody else can enter.
d /var/lib/tilo/device-private   0700 tilo-server tilo-server -
d /var/lib/tilo/user-identity    2770 root tilo-identity -
# The identity's home-peer registry, readable by the server account.
d /var/lib/tilo/peers            2770 root tilo-identity -
