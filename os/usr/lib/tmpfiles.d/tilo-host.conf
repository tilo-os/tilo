# Persistent state directories for a Tilo host-mode image.
# `bootc` mounts / read-only; anything the daemons write goes under
# /var, which is writable. Pre-create the tree with tight perms so
# the first-boot script + tilo-relay.service don't have to.

# Identity tree — read-only in normal operation; the first-boot
# script populates it once. The device directory is setgid to the
# device-trust group so the one device key is readable by both
# components that must present that identity (see tilo.conf).
d /var/lib/tilo                  0755 root root         -
d /var/lib/tilo/device           2770 root tilo-identity -
d /var/lib/tilo/user-identity    2770 root tilo-identity -

# Relay state (per-workspace CRDT snapshots + pending queues + iroh
# secret). Owned by root:root because the tilo-relay unit runs as root
# under a strict syscall + capability sandbox — DynamicUser= there is
# incompatible with SELinux enforcing on bootc (systemd's dir-rename
# under init_t vs var_lib_t triggers a policy denial). See the unit
# file for the full rationale.
d /var/lib/tilo-relay            0700 root root -
d /var/lib/tilo/full-replica     0700 root root -
