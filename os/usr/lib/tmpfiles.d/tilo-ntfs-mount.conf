# The NTFS mount service's control socket and boot-time disk record.
d /run/tilo-ntfs-mount 0755 root root -
# Each confined helper mounts a private tmpfs here in its own mount namespace;
# outside those namespaces it stays empty.
d /run/tilo-ntfs-mount/sandbox 0700 root root -
# Remembered drives, one file per person. Root-owned: a remembered choice
# stands in for consent, so nothing the person's processes write may create one.
d /var/lib/tilo/ntfs-mount 0700 root root -
d /var/lib/tilo/ntfs-mount/grants 0700 root root -
