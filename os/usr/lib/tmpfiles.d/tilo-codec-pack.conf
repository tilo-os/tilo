# systemd-sysext's persistent search directory. The codec-pack unit may write
# only this tree outside its own state and cache, and a sandbox can only grant
# write access to a path that exists.
d /var/lib/extensions 0755 root root -
# The pack's state (opt-in marker, status.json). World-readable, and present
# before the pack was ever installed: Settings and first-login setup watch it
# with inotify for progress, and the helper's unit also names it as its
# StateDirectory.
d /var/lib/tilo/codec-pack 0755 root root -
