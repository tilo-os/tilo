# The community a Tilo computer is in by default: the home workspace of this
# site, joined through the site's own door as the person's session starts.
# The person leaves it from the workspace switcher like any other workspace,
# and joins it again from "Join a workspace…"; once they joined it or left
# it, no computer of theirs joins it for them again. An administrator names
# another site, or none (an empty `site`), in /etc/tilo/community.toml, which
# wins over this file.
site = "https://tilo.sh/"
