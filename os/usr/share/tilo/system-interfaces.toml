# The interfaces this image serves to apps: one version of each.
#
# An app names the version it speaks of each service it uses in its
# manifest's `[sandbox.services]` (`required@N` or `optional@N`). It runs
# only where every one is served at exactly that version: the registry
# client offers only builds that fit, `tilo-install` refuses the rest, the
# launcher connects nothing at another version, and the shell updates an app
# that is behind before it opens it (docs/architecture/compatibility.md).
# Nothing is kept for an older version; the image's own apps are built with
# it and always fit (crates/packaging/launcher checks every manifest in apps/
# against this file).
#
# Each version is the code's (`interface.toml` beside the code that owns it);
# tools/policy/check_interfaces.py fails when the two differ.

[interfaces]
# The image-owned grant Settings drives the system through: host clients and
# configuration, the filtered system bus to the system's authorities
# (NetworkManager, BlueZ, logind, timedated, ...), PipeWire and the
# compositor's runtime state (crates/packaging/launcher/src/system_authority.rs).
system = 1

# App ↔ shell: the shell-ui connection (crates/sdk/ui-core/interface.toml).
shell-ui = 15

# App ↔ runtime: every service under [runtime] below
# (crates/runtime/runtime-portal/interface.toml).
runtime = 10

# App ↔ app host: the package-management door the Store holds, and the runtime
# and language-pack requests the Browser and Settings make, on the app-host
# service only those three apps are handed (crates/packaging/app-host/interface.toml).
# Its own interface, so a change to what the Store reads never versions the
# apps that never talk to the app host.
app-host = 3

[runtime]
# Session services handed to apps as connected sockets; each speaks the
# runtime interface's version.
services = [
    "collab",
    "compat",
    "identity",
    "model-gateway",
    "models",
    "tilo-fs",
    "tools",
    "ush",
]
