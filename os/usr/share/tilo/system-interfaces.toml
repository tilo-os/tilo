# The interfaces this image serves to apps: one version of each, and of the
# runtime interface every version from its oldest to its current one.
#
# An app names the version it speaks of each service it uses in its
# manifest's `[sandbox.services]` (`required@N` or `optional@N`). It runs
# only where every one is served: a runtime service at any version from
# `[runtime] oldest` to `[interfaces] runtime`, every other interface exactly
# at its version. The registry client offers only builds that fit,
# `tilo-install` refuses the rest, the launcher connects nothing outside the
# range, and the shell updates an app that is behind before it opens it
# (docs/architecture/compatibility.md). Nothing is kept for an older version;
# the image's own apps are built with it and always fit (crates/core/launcher
# checks every manifest in apps/ against this file).
#
# Each version is the code's (`interface.toml` beside the code that owns it);
# tools/policy/check_interfaces.py fails when the two differ.

[interfaces]
# The image-owned grant Settings drives the system through: host clients and
# configuration, the filtered system bus to the system's authorities
# (NetworkManager, BlueZ, logind, timedated, ...), PipeWire and the
# compositor's runtime state (crates/core/launcher/src/system_authority.rs).
system = 1

# App ↔ shell: the shell-ui connection (crates/ui/ui-core/interface.toml).
shell-ui = 37

# App ↔ runtime: every service under [runtime] below
# (crates/core/runtime-portal/interface.toml).
runtime = 48

# App ↔ messaging service: the person's messaging accounts for Messages, on
# the messaging service only that app is handed
# (crates/integrations/tilo-messaging/interface.toml).
messaging = 3

# Settings ↔ session: the connections adding an account makes to its servers,
# on the accounts service only Settings is handed, whose sandbox has no network
# (crates/integrations/account-probe/interface.toml).
accounts = 1

[runtime]
# Session services handed to apps as connected sockets; each speaks the
# runtime interface's range.
services = [
    "collab",
    "compat",
    "identity",
    "model-gateway",
    "models",
    "native",
    "tilo-fs",
    "tools",
    "ush",
]
# The oldest runtime interface version still served
# (runtime_portal::OLDEST_RUNTIME_INTERFACE_VERSION), set by hand only when a
# change stops this build reading the wire of the version before it.
oldest = 48
