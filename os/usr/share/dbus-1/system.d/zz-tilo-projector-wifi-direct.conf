<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- FluxCast only needs the Wi-Fi Display information elements that make
       Tilo identify as a source: the `WFDIEs` property on wpa_supplicant's
       root object. NetworkManager still owns group activation.

       Fedora's own policy denies every non-root send to wpa_supplicant; this
       file sorts after it. It therefore opens exactly one object path, for
       the session group only: a `context="default"` rule without a path
       would let any local uid set `Networks/N` properties (steer the machine
       to a rogue access point) or `DebugShowKeys` (dump PSK/EAP material to
       the journal) on every other object. -->
  <policy group="tilo-identity">
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_path="/fi/w1/wpa_supplicant1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_path="/fi/w1/wpa_supplicant1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Set"/>
    <allow receive_sender="fi.w1.wpa_supplicant1" receive_type="signal"/>
  </policy>
</busconfig>
