<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Tilo's pinned font catalog (/usr/share/fonts/tilo) supplies the system's
  generic families, so software that asks fontconfig for sans-serif, serif,
  monospace, emoji or math gets the faces Tilo's own toolkit sets text in.
  Sans-serif is the UI face, Instrument Sans, with Noto Sans behind it for
  the Greek, Cyrillic and Vietnamese text Instrument Sans does not cover.
-->
<fontconfig>
  <match>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Instrument Sans</string><string>Noto Sans</string></edit>
  </match>
  <match>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif</string></edit>
  </match>
  <match>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono</string></edit>
  </match>
  <match>
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend"><string>Noto Color Emoji</string></edit>
  </match>
  <match>
    <test name="family"><string>math</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Math</string></edit>
  </match>

  <!-- Han, kana and hangul in the reader's regional forms. -->
  <match>
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match>
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match>
    <test name="lang"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match>
    <test name="lang"><string>zh-sg</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match>
    <test name="lang"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match>
    <test name="lang"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match>
    <test name="lang"><string>zh-mo</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK HK</string></edit>
  </match>

  <!-- Each catalog family's own generic class, for fallback ordering. -->
  <alias><family>Instrument Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Arabic</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Hebrew</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Devanagari</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Bengali</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Thai</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Symbols</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans Symbols 2</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK JP</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK KR</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK SC</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK TC</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK HK</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Serif</family><default><family>serif</family></default></alias>
  <alias><family>Noto Sans Mono</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Math</family><default><family>math</family></default></alias>
  <alias><family>Noto Color Emoji</family><default><family>emoji</family></default></alias>
</fontconfig>
