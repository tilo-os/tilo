# Roots the per-user filesystem services mount into and cache under. They
# create nothing themselves: their sandbox makes the home read-only, and a
# user unit with PrivateIPC=yes cannot run an ExecStartPre to do it. `d` is
# idempotent and runs as the user through systemd-tmpfiles --user.
d %h/Remote                        0755 - - -
d %h/Shared                        0755 - - -
d %h/.cache/tilo                   0700 - - -
d %h/.cache/tilo/received-files    0700 - - -
# The cloud service's control socket lives here; Settings' sandbox binds the
# directory, which must outlast service restarts.
d %t/tilo-fs-cloud                 0700 - - -
