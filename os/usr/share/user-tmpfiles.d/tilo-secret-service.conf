# The vault tilo-secret-service keeps. Its unit makes the home read-only
# and grants write access only to this directory (ReadWritePaths=), and
# systemd fails a unit at 226/NAMESPACE when a ReadWritePaths= entry does not
# exist, so the directory has to exist before the first D-Bus activation on
# every home, new or migrated. `d` is idempotent, leaves an existing vault
# alone, and runs as the user through systemd-tmpfiles --user.
d %h/.local/share/tilo          0700 - - -
d %h/.local/share/tilo/secrets  0700 - - -
