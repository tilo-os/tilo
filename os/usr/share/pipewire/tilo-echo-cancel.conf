# Echo-cancelled microphone for calls.
#
# The desktop session runs this as its own PipeWire client
# (`pipewire -c tilo-echo-cancel.conf`) while Settings → Sound → "Reduce echo
# in calls" is on, and stops it when the setting is turned off, so the virtual
# nodes exist exactly as long as the preference does.
#
# WebRTC echo cancellation subtracts what the speakers play from what the
# microphone hears. `monitor.mode` takes that reference from the monitor of the
# default output instead of creating a sink every app would have to be routed
# through: music, a browser tab and a call all count as echo, and nothing about
# playback routing changes.
#
# Routing is WirePlumber's own media-role policy: a capture stream that sets
# `media.role = "Communication"` (Pulse "phone") and names no explicit target is
# linked to the source whose `device.intended-roles` lists that role. Every
# other capture (recorders, music, dictation) keeps the default microphone. The
# capture and reference streams carry no target either, so both follow the
# default microphone and the default output as those change. They are passive:
# the microphone opens only while something records from the echo-cancelled
# source.
#
# Copy this file to /etc/pipewire/ or ~/.config/pipewire/ to change it; PipeWire
# prefers those over this one.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {   name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    {   name = libpipewire-module-protocol-native }
    {   name = libpipewire-module-client-node }
    {   name = libpipewire-module-adapter }
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.gain_control = false
            }
            capture.props = {
                node.name = "tilo_echo_cancel_capture"
                node.description = "Echo-cancelled microphone (input)"
                node.passive = true
            }
            source.props = {
                node.name = "tilo_echo_cancel_source"
                node.description = "Echo-cancelled microphone"
                device.intended-roles = [ "Communication" ]
                priority.session = 0
            }
            sink.props = {
                node.name = "tilo_echo_cancel_reference"
                node.description = "Echo-cancelled microphone (speaker reference)"
                node.passive = true
            }
            playback.props = {
                node.name = "tilo_echo_cancel_playback"
                node.description = "Echo-cancelled microphone (playback)"
            }
        }
    }
]
