# Every patch in os/kernel/patches/: where it stands upstream, and the Fedora
# kernel these statuses were last checked against. os/kernel/check-patches.py
# holds the record to the directory, and in the kernel build fails once the
# buildroot's Fedora kernel is a release that already carries a patch merged
# upstream: drop the patch and its entry then.
#
# `merged` is the first mainline release (tag) that contains the patch, and
# `commit` the mainline commit. A patch without `merged` is not in mainline;
# `upstream` says why it is carried and where it stands.

