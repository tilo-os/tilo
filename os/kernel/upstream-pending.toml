# Patches in os/kernel/patches/ that are posted upstream but not yet merged.
# Each is carried unmodified from the list, pinned by sha256, and verified
# against exactly one Fedora kernel. os/kernel/check-upstream-pending.py runs
# in every kernel build (build-support.sh prepare-source) and fails it when the
# buildroot's Fedora kernel SRPM is not `fedora_kernel`: a Fedora kernel update
# then stops at the kernel build, loudly, until someone checks whether the
# series has been merged (drop the patches and the entry) or still applies and
# works (re-test, then set `fedora_kernel` to the new version).
#
# Only upstream-bound patches belong here; never a vendor BSP kernel's.

[[series]]
title = "media: rockchip: rkvdec: add support for the VDPU346 variant"
# The RK3566/RK3568 video decoder (H.264 and HEVC up to 4096x2304). Its VP9
# is not part of the series and no posting covers it yet.
revision = "v3"
author = "Christian Hewitt <christianshewitt@gmail.com>"
posted = "2026-01-10"
lists = ["linux-media", "linux-rockchip", "devicetree"]
cover = "20260110053727.2295260-1-christianshewitt@gmail.com"
# Posted on Linux 6.19-rc4 on top of the VDPU381/VDPU383 series
# <20260109161538.1294449-1-detlev.casanova@collabora.com> (v8), which is in
# mainline since v7.0. Applies to v7.2.7 without changes.
status = "not merged: absent from mainline v7.3-rc (a74306e2e676) and linux-next next-20261002"
drop_when = "the Fedora kernel contains the compatible \"rockchip,rk3568-vdec\" in drivers/media/platform/rockchip/rkvdec/rkvdec.c"
fedora_kernel = "kernel-7.2.7-200.fc44"
# Not shippable as carried: on an Orange Pi 3B v2.1 (RK3566, U-Boot 2026.07
# EFI) the driver probes and enumerates S264/S265 up to 4096x2304, but the
# first VIDIOC_STREAMON panics the board. Zeroing the row-cache buffers in the
# SRAM pool the DT node assigns (sram@fdcc0000, 0xb000) raises an asynchronous
# SError (netconsole, a 10-frame H.264 1080p decode, no session running):
#
#   SError Interrupt on CPU1, code 0x00000000be000011 -- SError
#   pc : __pi_memset_generic+0x170/0x188
#   lr : gen_pool_dma_zalloc_algo+0x30/0x50
#     gen_pool_dma_zalloc_align+0x34/0x60
#     rkvdec_allocate_rcb+0x124/0x240 [rockchip_vdec]
#     rkvdec_start_streaming+0x4c/0xc0 [rockchip_vdec]
#     vb2_core_streamon <- v4l2_m2m_ioctl_streamon <- VIDIOC_STREAMON
#   Kernel panic - not syncing: Asynchronous SError Interrupt
#
# Untested suspects: the range is reserved or secure-only under this board's
# firmware, or needs a clock/power domain that is off at that point. The next
# experiment would be the node without its `sram` property.

