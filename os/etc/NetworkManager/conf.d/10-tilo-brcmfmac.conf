# brcmfmac (the Orange Pi AP6256) drops the link when NetworkManager
# changes the MAC. Fedora's default for every Wi-Fi profile is stable-ssid.
[device-tilo-brcmfmac]
match-device=driver:brcmfmac
wifi.scan-rand-mac-address=no

[connection-tilo-brcmfmac]
match-device=driver:brcmfmac
wifi.cloned-mac-address=permanent
