# systemd `kernel-install(8)` config for qOS.
#
# The qos-kernel package (os/kernel/Containerfile) statically links every
# boot-path driver (storage, net, USB, HID, virtio-*), so the kernel can
# mount its root filesystem without an initramfs stage.  Setting
# `initrd_generator=none` tells kernel-install to skip initrd creation on
# every kernel install or upgrade — no dracut invocation, no
# /boot/initramfs-*.img produced.
#
# Verified at boot via:
#   * absence of /boot/initramfs-*.img
#   * dmesg's "Freeing unused kernel memory" arrives without an
#     "unpacking initramfs" preamble.
#
# `layout=bls` keeps the boot loader spec entries under /boot/loader,
# same layout Fedora bootc uses (so bootc's atomic staged updates find
# the entries as expected).
#
# If you swap qos-kernel back to Fedora's stock kernel-core (see
# os/dev/switch-to-stock-kernel.sh), this file is left in place — the
# stock kernel will boot but with reduced hardware coverage and no
# initramfs, so you may need to reinstall dracut and re-run
# `kernel-install add` for the older kernel version.

layout=bls
initrd_generator=none
uki_generator=none
