# Tilo zram-backed swap (C3).
#
# Read by systemd-zram-generator (the `zram-generator` package), which
# synthesises systemd-zram-setup@zram0.service at boot — no unit needs to be
# enabled by hand. /etc/ overrides any /usr/lib default config.
#
# Size: half of RAM, capped at 8 GiB. `ram` is expressed in MiB, so 8192 = 8G.
# Why this size and no more: zram pages live in RAM, so a larger device only
# lets a runaway workload convert free memory into swap more slowly; it does
# not create capacity. Half of RAM, at most 8 GiB, holds the cold anonymous
# pages of an interactive desktop at lz4's roughly 2:1 ratio. When it fills,
# systemd-oomd (os/etc/systemd/oomd.conf.d) kills batch work (the user
# background slice, rootless containers) at 80% swap use instead of letting
# the desktop thrash. The compositor's scope is excluded from swap entirely
# (MemorySwapMax=0), so its hot path never takes a swap-in.
#
# No writeback device: the only block device available for it would be an
# unencrypted partition, and writing swapped pages there would leave memory
# (keys, documents) on disk outside the LUKS volume. Writeback needs an
# ephemerally keyed dm-crypt device; until the image provisions one, zram is
# the whole swap (the boot gate requires exactly that).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = lz4
