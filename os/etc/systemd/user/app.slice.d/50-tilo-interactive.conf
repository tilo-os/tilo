# Each app scope sets its own weights: the launcher starts it in the
# foreground tier and the compositor demotes it when focus leaves
# (crates/packaging/launcher/src/priority.rs). This slice carries the floor
# that lets the focused app's memory protection take effect, and is
# deliberately not an oomd target: the focused app must never be killed.
[Slice]
CPUWeight=100
IOWeight=100
MemoryLow=15%
