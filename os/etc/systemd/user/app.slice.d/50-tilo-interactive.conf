# Each app carries its own weights: it starts in the foreground tier and moves
# to the background one (crates/packaging/launcher/src/priority.rs). Every app
# is a scope of its own here, app-tilo-<id>-<pid>.scope, made by the launcher
# (crates/packaging/launcher/src/app_cgroup.rs); `tilo-launcher apps` lists
# them. This slice carries the floor that lets the apps' own memory protection
# take effect, and is deliberately not an oomd target: an app must never be
# killed by oomd.
[Slice]
CPUWeight=100
IOWeight=100
MemoryLow=15%
