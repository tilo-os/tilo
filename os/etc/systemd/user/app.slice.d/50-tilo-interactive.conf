# Each app sets its own weights: it starts in the foreground tier and the
# compositor demotes it when focus leaves (crates/packaging/launcher/src/
# priority.rs). Apps are cgroups of one delegated scope here,
# tilo-apps-<n>.scope, made by the compositor's app spawner (crates/packaging/
# launcher/src/app_cgroup.rs); `tilo-launcher apps` lists them. This slice
# carries the floor that lets the focused app's memory protection take effect,
# and is deliberately not an oomd target: the focused app must never be killed.
[Slice]
CPUWeight=100
IOWeight=100
MemoryLow=15%
