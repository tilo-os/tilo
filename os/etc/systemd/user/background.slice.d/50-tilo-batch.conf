# Batch work: sync, indexing, builds, containers. Never capped, so it uses
# every idle cycle, but it always yields to the session and the focused app
# (weights 10 against 50 and 800), has no memory protection, and is what
# systemd-oomd kills first (see ../../oomd.conf.d/50-tilo.conf).
[Slice]
CPUWeight=10
IOWeight=10
MemoryLow=0
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
