# This is the user manager's own `user.slice`, where rootless podman and
# toolbox place every container scope (libpod-*.scope) by default. Giving it
# the batch treatment makes containers background work without wrapping
# podman or editing containers.conf: builds in a toolbox yield to the
# desktop automatically. Same policy as background.slice.
[Slice]
CPUWeight=10
IOWeight=10
MemoryLow=0
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
