# The user manager (apps, session services, batch work) against the login
# session scope that holds the compositor, which is raised to weight 1000 at
# runtime (crates/packaging/launcher/src/priority.rs).
[Service]
# Every controller the session's app tree hands its apps: per-app CPU and IO
# weights, memory accounting with the focused app's floor, and process counts.
# The compositor's app spawner holds a scope of this manager with Delegate=yes
# (tilo-apps-<n>.scope in app.slice) and makes each app's cgroup in it
# (crates/packaging/launcher/src/app_cgroup.rs); a controller missing here is
# missing there, and the io controller is not delegated by default, so
# per-app IO weights would be silently inert without it.
Delegate=cpu io memory pids
CPUWeight=500
IOWeight=500
MemoryLow=20%
