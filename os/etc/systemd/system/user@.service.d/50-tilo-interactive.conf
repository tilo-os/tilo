# The user manager (apps, session services, batch work) against the login
# session scope that holds the compositor, whose weights and floors the
# session slice carries (session.slice.d/50-tilo-interactive.conf).
[Service]
# Every controller the launcher gives each app's scope: per-app CPU and IO
# weights, memory accounting with each app's floor, and process counts. The
# scope itself is made by the launcher through this manager
# (crates/packaging/launcher/src/scope.rs); the io controller is not delegated
# by default, so per-app IO weights would be silently inert without it.
Delegate=cpu io memory pids
CPUWeight=500
IOWeight=500
MemoryLow=20%
