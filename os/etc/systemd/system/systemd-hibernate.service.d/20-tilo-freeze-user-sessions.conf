[Service]
# Freeze user sessions before systemd asks the kernel to suspend. The kernel's
# final freezer pass cannot resolve a task blocked in a FUSE request when the
# userspace FUSE daemon is frozen at the same time; ordering the session freeze
# first lets outstanding requests drain and prevents suspend from timing out.
# systemd-sleep reads this from its environment; sleep.conf has no such key.
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=1
