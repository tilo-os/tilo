# Tilo interactive priority, system level: the person's session outranks
# system services and batch work for CPU, IO and memory. Nothing here caps
# anything; weights and floors only decide who yields under contention.
#
# Memory floors cascade: a cgroup's memory.low/min is honoured only up to what
# every ancestor also protects, and (memory_recursiveprot) a parent's floor is
# shared by all its children, so each level carries a finite share sized to
# hold what the levels below claim: the session slice's services (see
# session.slice.d) and each launched app (1/8, see
# crates/packaging/launcher/src/priority.rs).
[Slice]
MemoryMin=256M
MemoryLow=25%
