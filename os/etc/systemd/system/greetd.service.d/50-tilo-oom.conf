# The kernel's OOM killer never chooses the session: the greeter, and the
# compositor greetd starts at login with everything of the shell's own,
# inherit this value. Only a privileged process can set it so low, which is
# why it is set here, before the login. The launcher raises every app back
# to the OOM killer's list before it starts it, and the compositor moves apps
# along it by focus: the background first, the focused app last
# (crates/packaging/launcher/src/priority.rs, `oom_score_adj`). Running out of
# memory ends an app, never the desktop.
[Service]
OOMScoreAdjust=-1000
