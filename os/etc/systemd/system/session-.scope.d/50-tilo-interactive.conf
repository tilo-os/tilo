# The compositor's login session scope (logind's session-N.scope) outranks
# every app and service the person runs and is never the OOM killer's or
# systemd-oomd's choice.
#
# The compositor stays in its logind scope (moving it out breaks logind's
# pid-to-session lookup, which libseat relies on), so the scope is where its
# protection belongs. `session-.scope.d/` is a prefix drop-in: it applies to
# every session scope logind creates, before anything starts in it, so nothing
# has to ask the system manager at runtime.
#
# The weights are the top of the range (the default is 100, a focused app 800,
# the user manager 500, see user.slice.d, user@.service.d and the launcher in
# crates/packaging/launcher/src/). The floors keep the compositor's working
# set out of reclaim; they stay well inside what user.slice and user-N.slice
# protect (MemoryMin=256M, MemoryLow=25%), which caps what a child can claim.
# MemorySwapMax=0 keeps the hot path from faulting a page back in from zram.
# Nothing here caps the session: the floors are protection, not a limit.
[Scope]
CPUWeight=1000
IOWeight=1000
MemoryMin=256M
MemoryLow=1G
MemorySwapMax=0
# systemd-oomd never picks the session as the victim; apps are its targets.
ManagedOOMPreference=avoid
