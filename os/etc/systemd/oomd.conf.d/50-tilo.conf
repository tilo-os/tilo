# systemd-oomd acts only on cgroups that opt in. Tilo opts in exactly the batch
# tier (user background.slice, which includes rootless containers), so under
# memory pressure or a full swap it kills a build or sync job and never the
# compositor, the session services or the focused app.
[OOM]
# Pressure at which a batch cgroup is considered to be thrashing, and for how
# long. Kill within seconds, not after a minute of a frozen desktop.
DefaultMemoryPressureLimit=50%
DefaultMemoryPressureDurationSec=10s
# zram holds compressed pages in RAM, so a full zram is memory exhaustion in
# slow motion. Act before it is completely full.
SwapUsedLimitPercent=80%
