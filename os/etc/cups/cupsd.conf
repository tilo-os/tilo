# Tilo CUPS scheduler configuration.
#
# Replaces the stock Fedora cupsd.conf. The differences from stock are all in
# one direction: fewer ways in, less spoken on the network, less kept on disk.
# See docs/printing-threat-model.md for the reasoning behind each block.

# Filters and backends — the processes that actually touch document bytes and
# vendor PPD code — run as this unprivileged user. cupsd itself starts as root
# because it must (see cups.service.d/tilo-confinement.conf); this is where the
# dedicated account does its work.
User lp
Group lp

# Log to the journal rather than files under /var/log/cups: it inherits the
# journal's rotation and access control, and a print job's metadata is not
# something to leave lying in a world-readable log.
AccessLog syslog
ErrorLog syslog
PageLog syslog
LogLevel warn
# Job files are the user's documents. Do not keep them after the job is done.
PreserveJobFiles No
PreserveJobHistory No

# --- Who can reach the scheduler ------------------------------------------
# The domain socket only. No Port and no Listen on any address: this scheduler
# is not a network service. Adding a TCP listener here is what turns a desktop
# into an IPP server exposed to whatever network it is on.
Listen /run/cups/cups.sock

# --- Discovery -------------------------------------------------------------
# Off, deliberately.
#
# Browsing advertises this machine's printers over DNS-SD and, with
# cups-browsed, accepts *remote* advertisements and creates local print queues
# from them. That second half is the dangerous one: it means a machine on the
# same network can cause a queue to appear here, pointing at a device it
# controls, whose PPD it supplies — which is CVE-2024-47076 / 47175 / 47176 /
# 47177 in one sentence. Tilo does not install cups-browsed at all, and this
# turns off the advertising half too.
#
# What the user gives up: network printers do not appear on their own. A
# printer is added deliberately, by address. What they get: nothing on the
# network can make a print queue exist on this machine.
Browsing Off
BrowseLocalProtocols none
# Do not let a client's request enable sharing behind the user's back.
DefaultShared No

# --- Timeouts --------------------------------------------------------------
# A stalled client should not hold a scheduler slot indefinitely.
Timeout 300
KeepAlive On
KeepAliveTimeout 30
# Bound the queue so a runaway submitter cannot fill the spool partition.
MaxJobs 100
MaxJobsPerUser 20
MaxCopies 99

# --- Access policy ---------------------------------------------------------
# Local-only by construction (there is no TCP listener), but stated anyway so
# the policy does not depend on the listener configuration being right.
<Location />
  Order allow,deny
  Allow localhost
</Location>

# Administration requires being root or in the lp group, and is reachable only
# over the local socket.
<Location /admin>
  Order allow,deny
  Allow localhost
  AuthType Default
  Require user @SYSTEM
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow localhost
  AuthType Default
  Require user @SYSTEM
</Location>

<Location /admin/log>
  Order allow,deny
  Allow localhost
  AuthType Default
  Require user @SYSTEM
</Location>

# --- Operation policy ------------------------------------------------------
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Reading and cancelling your own jobs.
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs \
         Set-Job-Attributes Create-Job-Subscription Renew-Subscription \
         Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job \
         Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job \
         CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Anything that changes what a printer *is* — including the device URI, which
  # is where a filter's command line comes from — is administrative.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class \
         CUPS-Delete-Class CUPS-Set-Default>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer \
         Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs \
         Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer \
         Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs \
         CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
