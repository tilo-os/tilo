# NTFS drivers load only when the consent-gated NTFS mount service asks for
# one by name (`modprobe ntfs3`), after the person agreed to open a drive.
# `blacklist` removes the drivers' aliases, so a mount attempt naming an NTFS
# file system type (`fs-ntfs3`, `fs-ntfs`) can no longer pull the driver into
# the kernel. That matters because any process may try such a mount, even
# from an unprivileged user namespace, and the attempt alone loaded the
# module before. Explicit loads by module name are unaffected.
blacklist ntfs3
blacklist ntfs
