# Tilo authenticated wall-clock policy. Image endorsements advance a persistent
# trusted-time floor, so an unauthenticated DHCP/NTP source must never be able
# to push the clock forward and permanently deny otherwise-valid updates.
# Independent operators provide quorum/diversity; `authselectmode require`
# prevents an accidentally discovered unauthenticated source from selection.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server nts1.time.nl iburst nts
server ptbtime1.ptb.de iburst nts
authselectmode require
minsources 2

driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
makestep 1.0 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony

# Tilo consumes time but does not provide a network time service.
port 0
