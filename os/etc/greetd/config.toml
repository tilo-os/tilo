# greetd display manager — drops the user into tilo's Wayland session.
#
# The login prompt is now a GRAPHICAL greeter (`tilo-greeter`, built on the
# Tilo `ui` toolkit) instead of the text-mode tuigreet. greetd can't host a
# GUI itself, so the greeter runs inside `cage` — a single-window kiosk
# wlroots compositor — which provides the Wayland display the greeter draws
# into. `cage -s` makes cage exit when its child exits; on successful auth
# the greeter speaks greetd IPC, calls StartSession, and exits, at which
# point greetd execs the chosen session (`/usr/bin/shell --backend drm`)
# from /usr/share/wayland-sessions.
#
# Note the session compositor (`shell`) runs in `--mode native` and binds
# the wayland-N socket itself — it is NOT wrapped in cage. Only the greeter
# needs cage, because greetd has no display for it.
#
# Chain: greetd → cage → tilo-greeter → (greetd StartSession) → shell.
#
# tilo-cage-session chooses cage's renderer and cursor for the display: the
# hardware cursor plane on physical GPUs, where wlroots' composited software
# cursor leaves a trail of old pointer stamps, and a software cursor only on
# QEMU's virtio-gpu, whose hardware cursor renders Y-flipped and offset.
[terminal]
vt = 1

[default_session]
command = "/usr/libexec/tilo-cage-session /usr/bin/tilo-greeter"
user = "greetd"
