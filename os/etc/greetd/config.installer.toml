# greetd config for the Tilo INSTALLER live medium.
#
# Identical in spirit to etc/greetd/config.toml, but the default session runs
# /usr/libexec/tilo-session-select instead of the greeter directly. That script
# inspects the kernel cmdline and execs either the Tilo graphical installer
# (tilo-installer, when tilo.install is present — which it is on this medium)
# or the normal greeter — both wrapped in `cage`, since greetd has no display
# of its own.
#
# tilo-session-select starts both through tilo-cage-session, which chooses
# cage's renderer and cursor for the display hardware, so the command here is
# the bare script.
#
# The Containerfile.installer overwrites /etc/greetd/config.toml with THIS
# file, so the live image's greetd uses the session selector.
[terminal]
vt = 1

[default_session]
command = "/usr/libexec/tilo-session-select"
user = "greetd"
