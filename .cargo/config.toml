[build]
# This tree builds inside a container, declared in `.build-container` at the repo root, because
# its native dependencies (xkbcommon, libseat, libinput, libudev, libdrm, gbm, gl, egl, pipewire,
# fuse3, dbus, libav*, wayland-client, capnp) are not present on this image-based host. The cargo
# shim on PATH reads that file and routes the build there, which is also where it enables sccache
# and picks the sccache server belonging to that namespace. None of that needs to be repeated here.
#
# Crates in this tree cost on the order of gigabytes of resident memory per rustc, roughly an order
# of magnitude more than the lighter projects on this machine, so the job count is pinned here
# rather than in the home-level config where it would tax everything else. The systemd budget on
# the container slice is what makes an over-large value survivable; this is what keeps builds from
# spending their time being throttled against it.
jobs = 4
# CPU floor is `x86-64-v3` — Haswell/Excavator (2013+), the intersection
# of "vast majority of installed hardware" and "enough SIMD to matter"
# (AVX2, BMI2, FMA). NOT `native` — that pins to the current build
# host's CPU, breaks reproducibility, and can't ship in the same OS
# image across users. Not `x86-64-v4` (AVX-512) — too narrow, that's a
# per-app opt-in ship.
#
# `force-frame-pointers=yes` keeps `perf record` + BOLT able to walk
# stacks; the runtime cost is negligible on x86-64 and the sampling-
# tooling win is large.
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "force-frame-pointers=yes",
]
