[build]
# The cargo shim derives parallelism from available memory; this is the CI floor.
jobs = 4
# Use the reproducible x86-64-v3 baseline and frame pointers for profiling.
# Keep hardening in target lists: Cargo does not merge target and build flags.
# IBT is disabled because stable Rust does not emit the required landing pads.

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))']
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "force-frame-pointers=yes",
    "-C", "relro-level=full",
    "-C", "link-arg=-Wl,-z,noexecstack",
    "-C", "link-arg=-Wl,-z,shstk",
    # Keep in-image paths reproducible without allowing RUSTFLAGS to replace
    # this target's hardening flags.
    "--remap-path-prefix=/build=.",
]

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))']
rustflags = [
    "-C", "target-cpu=generic",
    "-C", "force-frame-pointers=yes",
    "-C", "relro-level=full",
    "-C", "link-arg=-Wl,-z,noexecstack",
    "--remap-path-prefix=/build=.",
]

# Imager also builds on Windows and macOS, whose linkers do not accept ELF
# -z options. Keep the architecture floor and reproducible paths on those hosts.
[target.'cfg(all(target_arch = "x86_64", not(target_os = "linux")))']
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "force-frame-pointers=yes",
    "--remap-path-prefix=/build=.",
]

[target.'cfg(all(target_arch = "aarch64", not(target_os = "linux")))']
# Preserve each platform's ABI CPU baseline (Apple ARM requires AES/SHA2).
rustflags = [
    "-C", "force-frame-pointers=yes",
    "--remap-path-prefix=/build=.",
]

# `cc` builds vendored C/C++ outside distribution flag defaults. Force the
# fortify, stack-protector, stack-clash, CET, and non-executable-stack floor.
# cc-rs combines generic and target-specific flags. Keep platform flags scoped
# to their target, and avoid incompatible native LTO in distribution overrides.
[env]
# Scope GNU C/assembler options to Linux targets, too. Global CFLAGS would
# send -Wa,--noexecstack to MSVC/Apple clang while building the host Imager.
CFLAGS_aarch64_unknown_linux_gnu = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
CXXFLAGS_aarch64_unknown_linux_gnu = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
CFLAGS_x86_64_unknown_linux_gnu = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -fcf-protection=full -Wa,--noexecstack", force = true }
CXXFLAGS_x86_64_unknown_linux_gnu = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -fcf-protection=full -Wa,--noexecstack", force = true }
CFLAGS_aarch64_unknown_linux_musl = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
CXXFLAGS_aarch64_unknown_linux_musl = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
CFLAGS_x86_64_unknown_linux_musl = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
CXXFLAGS_x86_64_unknown_linux_musl = { value = "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wno-cpp -fstack-protector-strong -fstack-clash-protection -Wa,--noexecstack", force = true }
# GNU assembler/ELF switches such as `-Wa,--noexecstack` must not reach Darwin,
# whose Apple toolchain does not accept them. Keep its cc-rs flags target-specific
# so the supported stack protector is applied without leaking Linux-only switches.
CFLAGS_aarch64_apple_darwin = { value = "-fstack-protector-strong", force = true }
CXXFLAGS_aarch64_apple_darwin = { value = "-fstack-protector-strong", force = true }
CFLAGS_x86_64_apple_darwin = { value = "-fstack-protector-strong", force = true }
CXXFLAGS_x86_64_apple_darwin = { value = "-fstack-protector-strong", force = true }

# Keep incremental compilation off so sccache can serve these profiles.
[profile.dev]
incremental = false

[profile.release]
incremental = false
