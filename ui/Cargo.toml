[package]
name = "ui"
version = "0.1.0"
edition = "2024"
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
autoexamples = false

[features]
# Keep the legacy JSON-over-Unix-socket broker path compiled in
# (i.e. `collaboration::broker` submodule + the `QUICK_COLLAB_SOCK`
# code branch inside `CollaborationManager`). Runtime already
# prefers the `runtime-collab` SDK path; this flag exists so the
# in-tree test suites and the shell's
# 1400-LOC broker keep compiling / working while the wider fleet
# migrates. Flip off (in a workspace `--no-default-features` build)
# once every consumer is on the SDK dialect.
default = ["legacy-broker"]
legacy-broker = []
# Brave/EasyList filter-list → WebKit content-blocker JSON compiler
# (`webview::adblock`). Off by default: only the browser app (and any
# other app embedding a WebView with built-in blocking) pays for the
# adblock-rust dependency.
webview-adblock = ["dep:adblock"]
# WPE WebKit engine backend for the WebView widget (`webview::wpe`).
# Links the WPE stack (not packaged by Fedora — build it with
# os/dev/build-wpe.sh and export PKG_CONFIG_PATH/LD_LIBRARY_PATH to its
# prefix). Off by default so the workspace builds without the libraries.
# Pulls `ash` for the DMA-BUF zero-copy import (raw-Vulkan interop with
# wgpu-hal); its 0.38 matches the version wgpu-hal 29 resolves.
webview-wpe = ["dep:ash", "dmabuf-import"]
# Zero-copy DMA-BUF -> wgpu texture import via Vulkan external memory
# (`dmabuf_import`). Shared by the WebView's rendered pages and the video
# decoder's hardware frames — both hand over a GPU buffer as a dmabuf. Pulls
# `ash` for the raw-Vulkan interop, so it stays opt-in for builds that need
# neither.
dmabuf-import = ["dep:ash"]
# GPU video frames: the dmabuf import above plus the YUV->RGB conversion a
# hardware decoder's NV12/P010 output needs before it can be painted.
gpu-video = ["dmabuf-import"]
# Desktop media integration (MPRIS `org.mpris.MediaPlayer2`) for the
# `VideoPlayer` widget: media keys + the system top-bar now-playing widget can
# drive playback and show the current title/artist/art. Off by default so the
# hermetic build / `--shots` / CI need no D-Bus; an app enables it (e.g. Tube's
# `media` feature turns on `ui/mpris`). `zbus` is pinned to 4.4 to match the
# copy `apps/music` + `apps/chat` already resolve, so no second zbus lands.
mpris = ["dep:zbus", "zbus/tokio"]
# Host-native file open/save through the XDG Desktop Portal (`ui::portal`).
# Pulls `ashpd` (D-Bus / FileChooser) only when an app actually needs to open or
# save files — an app opts in with `ui = { …, features = ["portal"] }`. The pure
# parts always compile, so headless tests drive the exact per-frame drain path
# with no portal, and a feature-less build degrades to a clean
# `PortalOutcome::Failed` rather than failing to link.
portal = ["dep:ashpd"]

[dependencies]
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../crates/system/atomic-file" }
# XDG Desktop Portal client for `portal` (feature `portal`).
ashpd = { workspace = true, optional = true }
# Parses the portal's returned file URIs. Non-optional:
# `portal::to_local_path` is the file-access rule — a URI naming a remote
# host must not resolve to a local path — and must be testable in every
# build configuration.
url.workspace = true
# The two halves of `uri`: RFC 3986 percent-decoding and the
# x-www-form-urlencoded dialect that also reads `+` as a space.
percent-encoding = "2"
form_urlencoded = "1"
qos-startup-metrics = { path = "../crates/system/qos-startup-metrics" }
# Filter-list compiler for the WebView's built-in ad blocking (feature
# `webview-adblock`). The `content-blocking` feature provides the
# EasyList→WebKit-content-blocker conversion; blocking then runs inside
# WebKit's network process, not in Rust.
adblock = { version = "0.12", optional = true, features = ["content-blocking"] }
# runtime-collab is the qOS collab broker Cap'n Proto SDK.
# `CollaborationManager` now delegates to it via a shovel thread; the
# legacy Unix-socket JSON dialect stays available behind the
# `legacy-broker` feature so the in-tree tests and the shell's broker
# keep compiling.
runtime-collab = { path = "../crates/runtime/runtime-collab" }
capnp-rpc.workspace = true
runtime-portal = { path = "../crates/runtime/runtime-portal" }
# On `CollaborationManager` init, load the user's on-disk identity
# via `runtime-identity::load()` and forward its pubkey bytes to
# `join_channel` so the broker sees a real caller instead of the
# empty-identity fallback. Absent when running outside a qOS session
# (env var unset / file missing) — the manager degrades to the
# pre-existing empty-identity path in that case.
runtime-identity = { path = "../crates/runtime/runtime-identity" }
# The workspace host / relay tier. `CollaborationManager` can route an
# app's co-edit deltas + presence through a `RelayCoeditSession` (the
# `Backend::Relay` path) so they inherit the host's fan-out + on-disk
# store-and-forward, transparently to the app. Only the co-edit shim +
# its transport types are named here; the iroh endpoint + identity are
# owned by the caller (the shell's network actor) that hands the
# already-joined session in.
qos-relay = { path = "../crates/hosting/qos-relay" }
# The canonical per-package Automerge store. Living here rather than in
# each app is what makes persistence a three-line change in an app's `main`
# instead of a bespoke storage module per app.
app-state = { path = "../crates/system/app-state" }
automerge.workspace = true
# Diagnostic event/handler tracing. Off by default at WARN; turn up with
# `RUST_LOG=ui=debug` to see every MouseInput, CursorMoved, KeyboardInput
# entering App::window_event + dispatch results. Lets a maintainer
# diagnose interaction bugs in hosted mode without source-reading.
tracing.workspace = true
# Standard app startup installs the workspace's logging subscriber once.
tracing-subscriber.workspace = true
cosmic-text = { version = "0.19.0", default-features = false, features = ["swash", "std"] }
# Keep this aligned with cosmic-text: text painting needs the font's complete
# variation-axis order to translate CSS-like axis values for Vello.
skrifa = "0.40.0"
pollster.workspace = true

# Raw-Vulkan interop for the WebView DMA-BUF zero-copy import (feature
# `webview-wpe`). Version tracks what wgpu-hal 29 resolves so the `vk::*`
# handles passed through `create_texture_from_hal` are ABI-identical.
ash = { version = "0.38", optional = true }
taffy = { workspace = true, features = ["content_size"] }
tokio = { workspace = true, features = ["full"] }
vello.workspace = true
wgpu.workspace = true
winit.workspace = true
# Resolves the user's real, *localized* XDG user directories
# (`~/.config/user-dirs.dirs`) for `sysdirs` — so a "Places" list (file
# manager sidebar, file picker) shows the machine's own folder names
# (Dokumente / Bilder) instead of hard-coded English ones.
dirs.workspace = true
fluent.workspace = true
unic-langid.workspace = true
unicode-segmentation = "1.12"
# UAX #14 opportunities shared by editor geometry and clamped-label wrapping.
# cosmic-text uses the same crate internally; naming it directly lets toolkit
# code that must mirror shaped rows avoid ASCII-space heuristics.
unicode-linebreak = "0.1.5"
# ICU dictionary/LSTM segmentation for scripts whose word boundaries cannot
# be inferred from whitespace (Thai, Lao, Khmer, Myanmar, CJK).
icu_segmenter = "1.5"
# TeX/Liang hyphenation patterns with language-specific minima. The same
# implementation is already used by the workspace's Typst document engine;
# making it direct lets UI paragraphs opt in without runtime dictionary I/O.
hypher = "0.1.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
png.workspace = true
# Multi-format decode (JPEG/PNG/WebP) for the async remote-image cache
# (`image_store`): system apps display real CDN artwork. Default features are
# off so we pull only the decoders we need, not the whole codec zoo.
image = { workspace = true, features = ["jpeg", "png", "webp"] }
# Date / time picker widgets (`widget::date_picker`, `widget::time_picker`) use
# `chrono` for NaiveDate arithmetic. shell already pulls chrono
# transitively but this is a direct dep so the picker widgets compile in
# isolation.
chrono = { workspace = true, features = ["clock", "std"] }
# VideoPlayer widget (`widget::video_player`) decodes H.264 NAL units in-process.
# `source` feature compiles the pure-C reference implementation so we don't
# rely on a runtime-installed `libopenh264.so` — same pin as `shell`'s
# screencast pipeline.
openh264.workspace = true
# Shared qOS media layer. The `VideoPlayer` widget owns a `media::MediaEngine`
# and pulls frames from it; `media`'s default (no `decode`) build carries no
# gstreamer dependency, so `ui`'s hermetic build / `--shots` / CI stay green.
# An app that wants real decode enables `media/decode` in its own manifest.
media = { path = "../crates/media" }
# MPRIS D-Bus media control for the `VideoPlayer` widget (behind the `mpris`
# feature). Pinned to 4.4 with `p2p` to match `apps/music` + `apps/chat`, so the
# workspace resolves a single zbus 4.4 copy (the hermetic p2p round-trip test
# also uses the `p2p` transport).
zbus = { workspace = true, optional = true, features = ["p2p"], default-features = true }
# System clipboard access for TextInput's Ctrl+C / Ctrl+V / Ctrl+X.
# Wayland uses `wl_data_device`; X11 uses the selection protocol —
# `arboard` wraps both. The "wayland-data-control" feature lets us
# talk to the data-control compositor extension when available
# (kanshi / GNOME / KDE), falling back to the seat-driven protocol
# otherwise.
arboard = { workspace = true, features = ["image-data"] }
# The `Link` widget hands its URL to the OS's registered handler (xdg-open /
# the desktop portal on Linux) when activated. Same crate + pin the file
# explorer already uses to open files with the desktop default; already
# resolved in the workspace lockfile, so this adds no registry fetch.
open.workspace = true
# Shared collaboration-types crate. Phase 1 widgets
# (`widget::activity_timeline`, `widget::history_scrubber`,
# `widget::conflict_picker`, `widget::channel_browser`) read `OpClass`
# / `ArtifactKind` from here; Phase 3 also uses `SignedOp` +
# `validate_inbound_op` for the wire envelopes carried by
# `CollabRequest::SignedSyncIncremental` /
# `CollabEvent::SignedCRDTIncremental`.
collab-types = { path = "../crates/collab/collab-types" }
# The canonical document model. `history_source` reads a live document's
# change graph through `qdoc::history` (`versions` / `materialize_at`) and
# turns it into the `HistoryEntry` rows the timeline + scrubber render, and
# uses `qdoc`'s structural snapshot diff to write each row's summary. Pure
# model code — no renderer, no I/O — so this stays a cheap dep.
qdoc = { path = "../crates/doc/qdoc" }
# The qOS ACTION model: serializable, replayable CRDT-mutation actions + the
# nested Resource tree apps publish. `command_palette` + `action_palette` +
# the `App` resource-collection hook build on it to make Ctrl+K scope to the
# focused app instance's open resources and dispatch their exported actions.
qos-actions = { path = "../crates/collab/actions" }
# Direct dep on the Ed25519 implementation `qos-collab-types` uses so
# the toolkit can name `SigningKey` in `collaboration::SigningIdentity`
# without reaching into the qos-collab-types private module path. Pinned
# to the same major as `qos-collab-types`.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# Phase 8 identity-flow widgets: FROST threshold identity engine. The
# screens in `widget::identity_flow` drive `ThresholdIdentity::bootstrap_single_device`,
# `begin_enrolment`, `adopt_dkg_outcome`, and `export_recovery_share`.
threshold-identity = { path = "../crates/collab/threshold-identity" }
# Phase 8 identity-flow QR widget: `widget::qr` encodes both the
# pairing-channel JSON payload (screen 3) and the `qos://invite/...`
# URL (screen 5). `qrcode` is a small (no transitive deps), pure-Rust
# QR encoder that produces a module-matrix we paint with Vello.
qrcode.workspace = true
# Phase 8 invite encoding: the `qos://invite/<base32>` URL packs a
# postcard-encoded payload as base32 (RFC 4648 alphabet, no padding)
# so it stays URL-safe and case-insensitive when read aloud.
base32.workspace = true
# Phase 8 pairing one-time MAC: derived from the 6-digit code so the
# host can authenticate the pairer's DKG round-2 reply without a
# pre-shared long-term key. SHA-512 is already a transitive via
# `qos-threshold-identity`, so direct pin keeps the lock single-copy.
sha2.workspace = true
# Phase 8 pairing-channel encryption (placeholder; in-memory shim for
# the v1 widget tests). HMAC is used as a one-time pairing MAC over
# the round-1 broadcast keyed by the 6-digit code's full nonce.
hmac.workspace = true
# Identity-flow encode helpers — canonical-bytes for the invite
# envelope's owner signature view, hex for the pairing-channel JSON
# payload's binary fields, serde_bytes for the postcard-friendly
# delegation-secret representation, thiserror for the flow-local
# error type.
postcard = { workspace = true, features = ["alloc", "use-std"] }
hex.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
# `widget::identity_flow::recovery_share` generates a deterministic
# placeholder mnemonic on first-run (single-device mode has no real
# recovery share — see the module-level note). Already a transitive
# via `qos-threshold-identity`; the direct pin keeps Cargo collapsing
# to a single copy.
bip39.workspace = true
# The identity-flow screens need a `CryptoRng + RngCore` compatible with
# `frost-ed25519` 3.x, which consumes `rand_core` 0.6. Depending on it
# directly (rather than reaching through `rand`) keeps the requirement
# visible at the manifest level.
rand_core = { workspace = true, features = ["getrandom"] }
# Accessibility: AccessKit is the cross-platform a11y schema; the winit
# adapter bridges our exported tree into the event loop and, via its default
# `accesskit_unix` feature on Linux, publishes it over AT-SPI2 so standard ATs
# (Orca, braille) read every `ui` app. `accesskit_winit` 0.33.1 targets
# winit 0.30.x — the same pin as the `winit` dep above. See
# `ui/src/accesskit_bridge.rs` (tree builder + role/action mapping) and the
# adapter wiring in `ui/src/app.rs`.
accesskit = "0.24.1"
accesskit_winit = "0.33.1"
# Accessibility: the built-in screen reader (`ui::screen_reader`) speaks
# focus / value / live-region narration through the offline qOS TTS engine.
# `default_speaker()` never panics (falls back to `NullSpeaker` when no speech
# stack is installed), so depending on this is safe in headless builds.
tts = { path = "../crates/system/tts" }
smithay-clipboard = "0.7"

[build-dependencies]
# Locates the WPE WebKit stack when the `webview-wpe` feature is on
# (see build.rs); inert otherwise.
pkg-config = "0.3"

[dev-dependencies]
regex.workspace = true
# The `diag!` tests reproduce the crash they prevent: they need `dup2` to point
# the process's stderr at a pipe, and the child's exit signal to assert SIGABRT.
libc.workspace = true
# Inspect Vello scene encodings (draw tags) in widget tests so we can pin
# end-to-end paint contracts (e.g. `tabs::active_pill_emits_more_color_\
# fills_than_inactive_siblings`) without rendering pixels.
vello_encoding.workspace = true
# `widget::file_picker::tests` build a real on-disk tree to exercise the
# `std::fs::read_dir` path. Already pulled in by shell as a regular
# dev-dep; pinning here for the leaf-test build.
tempfile.workspace = true
# `record::tests` point `XDG_DATA_HOME` at a scratch tree to exercise
# per-record persistence, which is process-global — those tests run
# serially so they cannot see each other's data root.
serial_test.workspace = true
# The `collaboration` shim tests stand up a fake capnp broker on one end
# of a `UnixStream::pair()` and drive `CollaborationManager` against it.
# Same pin runtime-collab tests use.
capnp.workspace = true
tokio-util.workspace = true
# The `Backend::Relay` integration test stands up a real in-process
# workspace host (`qos_relay::Relay`) + two iroh clients and drives two
# `CollaborationManager`s through it — the same host path the relay
# crate's own `coedit_through_host` test exercises, but end-to-end
# through the toolkit. Identity material is minted with
# `qos-user-identity`; the iroh endpoints dial the host over the pinned
# 1.0 stack the rest of the tree resolves.
qos-user-identity = { path = "../crates/identity/qos-user-identity" }
iroh.workspace = true
iroh-base.workspace = true

[[example]]
name = "ui-lab"
path = "examples/ui_lab.rs"

[[example]]
name = "ui-shots"
path = "examples/ui_shots.rs"

[[example]]
name = "ui-perf"
path = "examples/ui_perf.rs"

[[example]]
name = "ui-wpe"
path = "examples/ui_wpe.rs"
required-features = ["webview-wpe"]

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
