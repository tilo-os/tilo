# cargo-deny: advisories, licenses, and the duplicate-version report.
#
# Run: cargo deny check

# crates/workspace-hack (cargo hakari) names every feature-unified crate only to
# fix its features. Pruned from the graph, deny sees the dependency edges members
# really have, so `workspace` scoped advisories stay about direct dependencies.
[graph]
exclude = ["workspace-hack"]

[advisories]
# Both remaining quick-xml versions are selected by current upstream releases:
# citationberg (Typst 0.15.1) uses 0.38 and zbus_xml (AccessKit 0.34) uses 0.39.
# Direct XML parsers in Tilo are on fixed 0.41; the bans guard below prevents
# either advisory exception from permitting another old quick-xml edge.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # UEFI requires RSA Authenticode. No patched Rust RSA release exists as of
    # 2026-09-17. The retained crates only generate/parse keys and verify public
    # signatures; every Tilo private-key operation, including Authenticode, uses
    # ring's blinded signer. cargo-deny reports at package granularity, so keep
    # this exact advisory acknowledged while tests reject RSA decryption and
    # regressions to RustCrypto private signing in tilo-crypto.
    "RUSTSEC-2023-0071",
]
# Maintenance notices remain actionable when Tilo selects the crate directly.
# Transitive maintenance changes require their owning upstream to migrate, and
# are reported as warnings rather than blocking unrelated security upgrades.
unmaintained = "workspace"

[licenses]
# AGPL-3.0 for our own code. Dependencies must be compatible with distributing
# a binary under it, so permissive licenses and weak copyleft only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
    # tilo-ntfs-helper statically links the pinned GPL-2.0-or-later ntfs-3g
    # reader and is distributed with its corresponding source. We exercise the
    # "or later" option as GPLv3 when combining it with the AGPLv3 system.
    "GPL-2.0-or-later",
    # rustypipe 0.11.4 publishes the deprecated spelling; SPDX defines it as
    # GPL-3.0-only and the crate's license text matches that interpretation.
    "GPL-3.0",
    "GPL-3.0-only",
    "NCSA",
    "WTFPL",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

# This standalone helper links pinned NTFS-3G; no other workspace crate links it.
# Its staging layout includes COPYING and the helper, protocol, and NTFS sources.
[[licenses.exceptions]]
crate = "tilo-ntfs-helper@=0.1.0"
allow = ["GPL-2.0-or-later"]

[bans]
# Duplicate major versions of one crate are the dependency tree's own bloat
# report: each is a separate compilation. `warn` until the tree is cleaned up,
# then `deny` to keep it clean.
multiple-versions = "warn"
wildcards = "deny"
# Version-less path dependencies are pinned by this repository's commit. They
# are allowed only for packages explicitly marked `publish = false`; registry
# wildcard dependencies remain denied.
allow-wildcard-paths = true
# Old quick-xml releases remain permitted only behind the two upstream crates
# that still require them.
deny = [
    { crate = "quick-xml@0.38.4", wrappers = ["citationberg"], reason = "Typst's current citationberg release has not adopted fixed quick-xml 0.41" },
    { crate = "quick-xml@0.39.4", wrappers = ["zbus_xml"], reason = "AccessKit's current zbus_xml release has not adopted fixed quick-xml 0.41" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The vendored vello and winit forks build from path. Only the forks patched
# in `[patch.crates-io]` may come from git; any other git dependency appearing
# is something to look at.
allow-git = [
    "https://code.tilo.so/tilo/accesskit.git",
    "https://code.tilo.so/tilo/atspi.git",
    "https://code.tilo.so/tilo/rustypipe.git",
]
