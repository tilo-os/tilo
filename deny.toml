# cargo-deny: advisories, licenses, and the duplicate-version report.
#
# Run: cargo deny check

# crates/workspace-hack (cargo hakari) names every feature-unified crate only to
# fix its features, and crates/dev/workspace-unify (tools/ci/workspace_unify.py)
# every library the workspace builds. Pruned from the graph, deny sees the
# dependency edges members really have, so `workspace` scoped advisories stay
# about direct dependencies.
#
# The apps are pruned for a different reason: each turns its own `samples`
# feature on for its tests through a renamed dev-dependency on itself, and
# cargo-deny's graph builder (krates) cannot resolve a dependency whose manifest
# key is not the package name — it aborts before checking anything. Pruning them
# costs no coverage: every crate they depend on is also reachable from the rest
# of the workspace, so license, advisory, ban and source checks still see all of
# them.
[graph]
exclude = [
    "workspace-hack",
    "workspace-unify",
    "activity",
    "canvas",
    "chat",
    "code-editor",
    "db-client",
    "diffmerge",
    "discord",
    "ebook",
    "feeds",
    "file-explorer",
    "firewall",
    "git-client",
    "hex-editor",
    "mail",
    "maps",
    "notes",
    "pdf-viewer",
    "photos",
    "poker",
    "remote",
    "sheets",
    "shortcuts",
    "slides",
    "tasks",
    "terminal",
    "tube",
    "typst-editor",
    "video-editor",
    "weather",
]

[advisories]
# Both remaining quick-xml versions are selected by current upstream releases:
# citationberg (Typst 0.15.1) uses 0.38 and zbus_xml (AccessKit 0.34) uses 0.39.
# Direct XML parsers in Tilo are on fixed 0.41; the bans guard below prevents
# either advisory exception from permitting another old quick-xml edge.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # UEFI requires RSA Authenticode. No patched Rust RSA release exists as of
    # 2026-09-17. The retained crates only generate/parse keys and verify public
    # signatures; every Tilo private-key operation, including Authenticode, uses
    # ring's blinded signer. cargo-deny reports at package granularity, so keep
    # this exact advisory acknowledged while tests reject RSA decryption and
    # regressions to RustCrypto private signing in tilo-crypto.
    "RUSTSEC-2023-0071",
    # crypto-bigint timing variability: 0.7.6 fixes it and the 0.7 line is
    # pinned there, but no patched 0.5 release exists as of 2026-10-23.
    # crypto-bigint 0.5 arrives only through elliptic-curve 0.13 for the NIST
    # curves hpke-rs-rust-crypto 0.7 (behind openmls_rust_crypto and tilo-seal)
    # compiles in. Tilo never selects them: tilo-seal uses DhKem25519 and
    # channel-crypto's one MLS ciphersuite is X25519/Ed25519. The bans below
    # keep crypto-bigint 0.5 behind elliptic-curve and refuse vulnerable 0.7.
    "RUSTSEC-2026-0387",
]
# Maintenance notices remain actionable when Tilo selects the crate directly.
# Transitive maintenance changes require their owning upstream to migrate, and
# are reported as warnings rather than blocking unrelated security upgrades.
unmaintained = "workspace"

[licenses]
# The desktop/host default is AGPL; the app SDK and its linked support libraries
# are MIT (LICENSING.md). This policy covers the whole workspace. The narrower
# app-distribution graph is also checked by tools/sdk/check_licenses.py.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
    # tilo-ntfs-helper statically links the pinned GPL-2.0-or-later ntfs-3g
    # reader and is distributed with its corresponding source. We exercise the
    # "or later" option as GPLv3 when combining it with the AGPLv3 system.
    "GPL-2.0-or-later",
    # rustypipe 0.11.4 publishes the deprecated spelling; SPDX defines it as
    # GPL-3.0-only and the crate's license text matches that interpretation.
    "GPL-3.0",
    "GPL-3.0-only",
    "NCSA",
    "WTFPL",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

# This standalone helper links pinned NTFS-3G; no other workspace crate links it.
# Its staging layout includes COPYING and the helper, protocol, and NTFS sources.
[[licenses.exceptions]]
crate = "tilo-ntfs-helper@=0.1.0"
allow = ["GPL-2.0-or-later"]

# libbz2-rs-sys, the pure-Rust port of libbzip2 behind Files' bzip2 and 7z
# reading, keeps libbzip2's own license: BSD-style (redistribution with the
# notice, no endorsement), compatible with distributing under the AGPL.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
# Duplicate major versions of one crate are the dependency tree's own bloat
# report: each is a separate compilation. `warn` until the tree is cleaned up,
# then `deny` to keep it clean.
multiple-versions = "warn"
wildcards = "deny"
# Version-less path dependencies are pinned by this repository's commit. They
# are allowed only for packages explicitly marked `publish = false`; registry
# wildcard dependencies remain denied.
allow-wildcard-paths = true
# Old quick-xml releases remain permitted only behind the two upstream crates
# that still require them.
deny = [
    { crate = "quick-xml@0.38.4", wrappers = ["citationberg"], reason = "Typst's current citationberg release has not adopted fixed quick-xml 0.41" },
    { crate = "quick-xml@0.39.4", wrappers = ["zbus_xml"], reason = "AccessKit's current zbus_xml release has not adopted fixed quick-xml 0.41" },
    { crate = "crypto-bigint@0.5.5", wrappers = ["elliptic-curve"], reason = "RUSTSEC-2026-0387 has no patched 0.5 release; only elliptic-curve 0.13's unused NIST curves may keep it" },
    { crate = "crypto-bigint:>=0.6, <0.7.6", reason = "RUSTSEC-2026-0387: constant-time fixes need crypto-bigint 0.7.6" },
    # TLS is rustls on ring, reached through tilo_net::http. OpenSSL would be a
    # second certificate-verification path to review, a C library to patch in
    # every image, and a runtime dependency an app could not assume on macOS,
    # Windows or the web. A dependency that pulls one in by default usually has
    # a `rustls` feature: select it and turn its default features off.
    { crate = "openssl", reason = "rustls is the only TLS stack" },
    { crate = "openssl-sys", reason = "rustls is the only TLS stack" },
    { crate = "native-tls", reason = "rustls is the only TLS stack (native-tls is OpenSSL on Linux)" },
    # Tilo's own components carry no telemetry, analytics or crash-upload client:
    # panics stay in ~/.cache/tilo/crashes and feedback leaves only as a report
    # the person approved. Local tracing never leaves the device by itself, so
    # `tracing` and an exporter-less `opentelemetry` are fine.
    { crate = "sentry", reason = "crash reporting service" },
    { crate = "sentry-core", reason = "crash reporting service" },
    { crate = "bugsnag", reason = "crash reporting service" },
    { crate = "crash-handler", reason = "minidump capture exists to upload a crash elsewhere" },
    { crate = "minidumper", reason = "minidump capture exists to upload a crash elsewhere" },
    { crate = "posthog-rs", reason = "product analytics" },
    { crate = "segment", reason = "product analytics" },
    { crate = "opentelemetry-otlp", reason = "exports spans and metrics off the device" },
    { crate = "opentelemetry-http", reason = "exports spans and metrics off the device" },
    { crate = "opentelemetry-datadog", reason = "exports spans and metrics off the device" },
    { crate = "opentelemetry-zipkin", reason = "exports spans and metrics off the device" },
    # GStreamer (tilo-media) is the one media stack. openh264 builds Cisco's
    # H.264 codec from source, which Cisco's patent licence does not cover (it
    # covers only Cisco's own binaries); ffmpeg is a second media stack.
    { crate = "openh264", reason = "use media::RealtimeEncoder/Decoder (GStreamer)" },
    { crate = "openh264-sys2", reason = "use media::RealtimeEncoder/Decoder (GStreamer)" },
    { crate = "ffmpeg-next", reason = "a second media stack; use media (GStreamer)" },
    { crate = "ffmpeg-sys-next", reason = "a second media stack; use media (GStreamer)" },
    # Two RustCrypto generations are in the lock: the current one, which iroh
    # uses, and the previous one, which third-party crates still pull in. Only
    # those upstreams may depend on the old one, so it leaves the lock when the
    # last of them migrates instead of gaining direct users here. tilo-crypto's
    # sha2 0.10 feeds authenticode, which has no release on digest 0.11.
    { crate = "ed25519-dalek:<3", wrappers = ["openmls_basic_credential", "openmls_rust_crypto"], reason = "old RustCrypto generation" },
    { crate = "x25519-dalek:<3", wrappers = ["hpke-rs-rust-crypto"], reason = "old RustCrypto generation" },
    { crate = "rand:<0.10", wrappers = [
        "davey", "librespot-connect", "librespot-core", "librespot-discovery", "librespot-playback", "lipsum",
        "num-bigint-dig", "oauth2", "proptest", "rand_distr", "rustypipe", "smithay", "tantivy-columnar", "tungstenite",
    ], reason = "old RustCrypto generation" },
    { crate = "rand_core:<0.10", wrappers = [
        "crypto-bigint", "crypto-common", "curve25519-dalek", "ed25519-dalek", "elliptic-curve", "ff", "frost-core",
        "frost-ed25519", "frost-rerandomized", "group", "openmls_basic_credential", "openmls_rust_crypto", "rand",
        "rand_chacha", "rand_xorshift", "rsa", "signature", "snow", "x25519-dalek",
    ], reason = "old RustCrypto generation" },
    { crate = "rand_chacha:<0.10", wrappers = ["lipsum", "openmls_rust_crypto", "proptest", "rand"], reason = "old RustCrypto generation" },
    { crate = "sha2:<0.11", wrappers = [
        "cranelift-codegen", "davey", "ed25519-dalek", "frost-ed25519", "mysql_common", "oauth2",
        "p256", "p384", "rig-core", "scrypt", "smithay", "snow", "tilo-crypto",
    ], reason = "old RustCrypto generation" },
    { crate = "hmac:<0.13", wrappers = ["davey", "hkdf", "librespot-core", "librespot-discovery", "pbkdf2", "rfc6979"], reason = "old RustCrypto generation" },
    { crate = "chacha20poly1305:<0.11", wrappers = ["hpke-rs-rust-crypto", "openmls_rust_crypto", "snow"], reason = "old RustCrypto generation" },
    # Raw AEAD, key agreement/KEM, HPKE and password-KDF crates. Sealing
    # constructions live in one reviewed crate, tilo-seal; every other
    # workspace crate seals through its typed API. The other wrappers are the
    # upstream libraries that own their whole construction (Noise, MLS, SSH,
    # iroh, ...) and tilo-crypto's PBKDF2, which Apple's iCloud SRP-6a sign-in
    # fixes. A new upstream user is added here after review.
    { crate = "aead", wrappers = ["aes-gcm", "chacha20poly1305", "davey", "ssh-cipher"] },
    { crate = "aes", wrappers = ["aes-gcm", "davey", "librespot-audio", "librespot-core", "librespot-discovery", "pkcs5", "russh", "ssh-cipher", "tilo-seal", "wacore", "wacore-libsignal"] },
    { crate = "aes-gcm", wrappers = ["hpke-rs-rust-crypto", "noq-proto", "openmls_rust_crypto", "pkcs5", "snow", "ssh-cipher", "tilo-seal"] },
    { crate = "aes-gcm-siv" },
    { crate = "aes-siv" },
    { crate = "argon2", wrappers = ["ssh-key", "tilo-seal"] },
    { crate = "balloon-hash" },
    { crate = "chacha20", wrappers = ["chacha20poly1305", "rand", "ssh-cipher"] },
    { crate = "chacha20poly1305", wrappers = ["hpke-rs-rust-crypto", "openmls_rust_crypto", "snow", "tilo-seal"] },
    { crate = "crypto_box" },
    { crate = "crypto_secretbox" },
    { crate = "curve25519-dalek", wrappers = ["ed25519-dalek", "frost-ed25519", "iroh-base", "russh", "snow", "wacore-libsignal", "x25519-dalek"] },
    { crate = "hpke" },
    { crate = "hpke-rs", wrappers = ["openmls_rust_crypto", "tilo-seal"] },
    { crate = "hpke-rs-crypto", wrappers = ["hpke-rs", "hpke-rs-rust-crypto", "openmls_rust_crypto", "tilo-seal"] },
    { crate = "hpke-rs-libcrux" },
    { crate = "hpke-rs-rust-crypto", wrappers = ["hpke-rs", "openmls_rust_crypto", "tilo-seal"] },
    { crate = "libcrux-chacha20poly1305" },
    { crate = "libcrux-ecdh" },
    { crate = "libcrux-hpke" },
    { crate = "libcrux-kem" },
    { crate = "orion" },
    { crate = "pbkdf2", wrappers = ["bcrypt-pbkdf", "librespot-core", "pkcs5", "russh", "scrypt", "tilo-crypto", "tilo-seal"] },
    { crate = "poly1305", wrappers = ["chacha20poly1305", "ssh-cipher"] },
    { crate = "salsa20", wrappers = ["russh", "scrypt"] },
    { crate = "scrypt", wrappers = ["davey", "pkcs5", "russh"] },
    { crate = "sodiumoxide" },
    { crate = "x25519-dalek", wrappers = ["hpke-rs-rust-crypto", "wacore-libsignal", "x-wing"] },
    { crate = "xsalsa20poly1305" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Patched and unpublished crates build from path under vendor/, so a build
# needs no git host: any git dependency appearing is something to look at.
allow-git = []
