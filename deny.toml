# cargo-deny: advisories, licenses, and the duplicate-version report.
#
# Run: cargo deny check

[advisories]
# Fail on any RUSTSEC advisory. Add an id here with a reason when one has no
# fix available yet; an empty list means nothing is being ignored silently.
ignore = []

[licenses]
# AGPL-3.0 for our own code. Dependencies must be compatible with distributing
# a binary under it, so permissive licenses and weak copyleft only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions of one crate are the dependency tree's own bloat
# report: each is a separate compilation. `warn` until the tree is cleaned up,
# then `deny` to keep it clean.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The vendored vello and winit forks build from path, not git, so no allowance
# is needed here; a git dependency appearing is something to look at.
allow-git = []
