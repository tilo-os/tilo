name: Packaging coordinator fixture
on:
  workflow_dispatch:
    inputs:
      coordinator_intent:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
jobs:
  receipt:
    runs-on: runner-quality
    timeout-minutes: 2
    container:
      image: python:3.12-alpine
    steps:
      - name: Record immutable identity without building or publishing
        env:
          SOURCE_SHA: ${{ github.sha }}
          INTENT: ${{ inputs.coordinator_intent }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          print('COORDINATOR_RECEIPT=' + json.dumps({key: os.environ[key] for key in ('SOURCE_SHA', 'INTENT', 'BASELINE_SHA')}, sort_keys=True))
          PY
