name: Private artifact token qualification
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Previous successful probe run; empty creates the first artifact
        required: false
        default: ""
jobs:
  probe:
    runs-on: runner-quality
    timeout-minutes: 3
    container:
      # Existing runner environment includes both Python and the Node action runtime.
      image: code.sandbox.example/public/runner-image:latest
    steps:
      - name: Check identities and historical artifact access
        env:
          TASK_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          python3 -I - <<'PY'
          import io, json, os, urllib.request, zipfile
          from pathlib import Path
          api = 'https://code.sandbox.example/api/v1/repos/tilo/ci-workflow-pilot-20260918-9245-repeat'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          def get(path):
              request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['TASK_TOKEN']})
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  raw = response.read(262145)
                  if len(raw) > 262144:
                      raise ValueError('probe response exceeds limit')
                  return raw
          run_id = int(os.environ['GITHUB_RUN_ID'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          run = json.loads(get(f'/actions/runs/{run_id}'))
          assert run['id'] == run_id and run['commit_sha'] == os.environ['GITHUB_SHA']
          jobs = json.loads(get(f'/actions/runs/{run_id}/jobs'))
          own = [job for job in jobs if job['name'] == 'probe']
          assert len(own) == 1 and own[0]['attempt'] == attempt and own[0]['task_id'] > 0
          print('PROBE_IDENTITY', json.dumps({'run_id': run_id, 'attempt': attempt, 'task_id': own[0]['task_id']}))
          baseline = os.environ.get('BASELINE_RUN', '')
          if baseline:
              assert baseline.isdecimal() and int(baseline) != run_id
              prior = json.loads(get(f'/actions/runs/{int(baseline)}'))
              assert prior['status'] == 'success' and prior['workflow_id'] == 'artifact-token-probe.yml'
              artifacts = json.loads(get(f'/actions/runs/{int(baseline)}/artifacts?page=1&limit=50'))
              matches = [item for item in artifacts if item['name'] == 'probe-payload']
              assert len(matches) == 1 and matches[0]['run_id'] == int(baseline) and not matches[0]['expired']
              raw = get(f'/actions/artifacts/{matches[0]["id"]}/zip')
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert archive.namelist() == ['probe.txt']
                  assert archive.read('probe.txt') == b'tilo-private-artifact-probe-v1\n'
              print('HISTORICAL_TASK_TOKEN_READ_PASS', int(baseline), matches[0]['id'])
          Path('probe.txt').write_bytes(b'tilo-private-artifact-probe-v1\n')
          PY
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: probe-payload
          path: probe.txt
          if-no-files-found: error
