# The native Chromium host (apps/browser/chromium), built from the pinned CEF SDK as the
# OS image builds it, its C++ unit tests, and real pages driven through its protocol.
# Without it the host is compiled only by os-image builds, an hour away from a change.
[[check]]
name = "chromium-host"
outputs = ["target/chromium/**"]
requires = ["arch=x86_64"]
# Built cold (no compiler cache, empty target), the check peaks at 4.5 GiB: eight
# compilers at once while the host builds; no one process passes 1.3 GiB.
requirement = { cores = 8, memory = "6GiB" }
# Chromium's renderers are confined in user namespaces of their own.
nested_sandboxes = true
run = """
bash tools/ci/ensure-browser-dependencies.sh
command -v cmake >/dev/null || dnf install -y cmake
python3 scripts/browser/build-host.py --jobs 8
ctest --test-dir target/chromium-build --output-on-failure
# Chromium refuses root, and the host never turns its sandbox off: the page tests run as a user.
chmod -R a+rX target/chromium apps/browser/chromium/tests apps/browser/chromium/src apps/browser-parts/assets/extension-manager apps/browser-parts/src/extension_toolbar.rs
mkdir -p -m 1777 /tmp/host-test
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/document_size.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/privacy_defaults.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/pointer_input.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/ime_composition.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/page_popups.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/tabs.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/navigation.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/native_regressions.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/page_dialogs.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/page_clipboard.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/context_menu.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/adblock_extension.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/extensions.py target/chromium/tilo-chromium-host \
    Extensions.test_mv3_worker_storage_content_and_action RuntimeExtensions.test_load_unload_and_denied_methods
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/extension_toggle.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/extension_tabs.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/site_extensions.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/page_actions.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/sealed_documents.py target/chromium/tilo-chromium-host
# Camera and microphone questions only: on this node Chromium refuses notifications and
# location without asking, so the rest of capabilities.py runs against a macOS host.
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/capabilities.py target/chromium/tilo-chromium-host \
    Capabilities.test_fake_camera_microphone_policy_grant_revoke_and_new_request \
    Capabilities.test_refused_camera_is_kept_until_the_site_may_ask_again
# The same page again with the engine started the way a Browser launch starts it: its
# environment and the seccomp filters its sandbox stacks (launcher example web_engine_sandbox).
cargo build --locked -p launcher --example web_engine_sandbox
install -m 0755 "${CARGO_TARGET_DIR:-target}/debug/examples/web_engine_sandbox" /tmp/host-test/web_engine_sandbox
printf '#!/bin/sh\\nexec /tmp/host-test/web_engine_sandbox %s/target/chromium/tilo-chromium-host "$@"\\n' "$PWD" > /tmp/host-test/sandboxed-host
chmod a+rx /tmp/host-test/sandboxed-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/document_size.py /tmp/host-test/sandboxed-host
# Frames reach the app through the memory it hands the sandboxed engine.
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/frame_transport.py --transport memory /tmp/host-test/sandboxed-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/resize_frames.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/frame_transport.py target/chromium/tilo-chromium-host
HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- \
  python3 apps/browser/chromium/tests/frame_damage.py target/chromium/tilo-chromium-host
"""
inputs = ["apps/browser/chromium/**", "apps/browser-parts/assets/extension-manager/**", "apps/browser-parts/src/extension_toolbar.rs", "apps/browser/tilo-app.toml", "scripts/browser/build-host.py", "scripts/browser/cef-lock.json", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock", "tools/ci/ensure-browser-dependencies.sh"]
