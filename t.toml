# Tilo's checks for t (docs/t.md): what runs before a push and on every commit to main.
# Each cargo family becomes one check per workspace package: `test/<package>`, `clippy/<package>`.

# The builder index tools/ci/resolve_builder.py resolves registry.tilo.so/tilo/tilo-builder:latest
# to, pinned so results stay comparable: move it by resolving the tag again
# (`skopeo inspect --raw docker://registry.tilo.so/tilo/tilo-builder:latest | sha256sum`).
image = "registry.tilo.so/tilo/tilo-builder@sha256:7706dd82cbb5598be302186d1d4748a44bbd2e67f6608e7bc150236046ef120e"
inputs = ["rust-toolchain.toml", ".cargo/config.toml", "deny.toml"]

# A check that needs a particular node names it in `requires`: `arch=x86_64`, `os=macos`, a
# device such as `/dev/kvm`, or a node label such as `disk-100g`.
# A check whose result doesn't depend on the node's architecture says `arch=any`, and t runs it
# wherever it starts soonest, arm64 nodes included: formatting, lints and policy scripts, the
# cargo families (tests pass on both architectures; check.yml tested every package on both),
# and builds of architecture-independent output (wasm, web bundles). A check without an
# architecture runs on the server's, x86_64. Pinned to one stay the checks that produce or
# exercise that architecture's own artifacts (images, release binaries, VM guests, Android's
# NDK), the ones that need software that only exists for x86_64 (Chrome for Testing, the
# ci-fast image), and the tests that fail on aarch64 for reasons of the architecture (the
# `test-x86_64` family, the goldens).

# check.yml's workflow environment. Warnings fail through the per-target flags, which
# Cargo joins with .cargo/config.toml's target rustflags (RUSTFLAGS would replace them).
# Tests render with Mesa's CPU Vulkan driver, never whatever adapter a node has.
[env]
XDG_RUNTIME_DIR = "/tmp/tilo-xdg-runtime"
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_NAME = "llvmpipe"

# check.yml's test shards: tools/ci/t-nextest.sh prepares what the packages need and
# leaves out the visual goldens and quarantined tests (.config/nextest-filters.toml).
# Media, audio and the software GPU are present in the builder, so a test that finds
# one missing fails instead of skipping. Pushes to main run the push-only suites too.
[[cargo]]
name = "test"
tool = "nextest"
requires = ["arch=any"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# Tested on x86_64 only, by the `test-x86_64` family below.
exclude = ["launcher", "shell", "store", "tilo-sandbox", "tilo-vmd"]
inputs = [".config/nextest.toml", ".config/nextest-filters.toml", "tools/ci/t-nextest.sh", "tools/ci/package_features.py", "tools/ci/nextest_filters.py", "tools/test-env.sh", "tools/with-test-environment.sh", "tools/with-headless-audio.sh"]
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
# Packages whose tests start sandboxes of their own (bubblewrap, unshare): in t's job
# sandbox they may create user, mount and network namespaces, as uid 1000 inside.
nested_sandboxes = ["shell", "launcher", "ush", "tilo-fs", "tilo-runtime", "tilo-vmd", "settings", "tilo-sandbox-core", "thumbnails"]
