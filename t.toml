# The SDKs' suites need their ecosystems' tools and locked dependencies, which no other check's
# image carries: uv with the Python SDK's environment from sdk/python/uv.lock, bun with the
# TypeScript SDK's packages from sdk/typescript/bun.lock, both baked into the image this check
# builds. They run offline. That image is built for these checks and not published, so the
# dependencies a suite runs against are always the tree's locks: a bump changes the image's
# inputs and with it the image.
[[check]]
name = "sdk-python"
run = "bash tools/ci/sdk-python.sh"
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]

[[check]]
name = "sdk-typescript"
run = "bash tools/ci/sdk-typescript.sh"
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]

# The SDKs' release to npm and PyPI, tools/ci/publish/sdks.sh: both packages publish under the
# one name tilo-sdk (on PyPI plain `tilo` belongs to an unrelated project, on npm the @tilo scope
# is not available), and the version is the release tag's, never a number in the tree. The check
# that publishes runs on release tags, with the registries' tokens and nowhere else; a version
# already on a registry is skipped, so re-running a tag finishes a release that stopped halfway
# rather than failing on what it already sent. Dispatched on a branch it publishes nothing:
# sdks.sh refuses any ref but a release tag.
#
# What runs on main is the same build with no token: both packages are built as a tag would
# build them, their artifacts are packed and read back, and the version a tag would write is
# exercised on a stand-in. A renamed package, a manifest that stops being publishable or an
# import package that falls out of the wheel breaks here, long before a tag does. It runs again
# in the tag's own publish run, on that tag's version, before anything is sent.
[[check]]
name = "publish-sdks-dry-run"
run = "bash tools/ci/publish/sdks.sh check"
needs = ["sdk-python", "sdk-typescript"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
on = ["main", "dispatch"]

[[check]]
name = "publish-sdks"
run = "bash tools/ci/publish/sdks.sh publish"
needs = ["sdk-python", "sdk-typescript", "publish-sdks-dry-run"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]
secrets = ["NPM_TOKEN", "PYPI_TOKEN"]

