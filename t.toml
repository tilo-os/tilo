# The assets of os-assets one kind of OS step uses, as a check of their own. t keys a step by
# every output of every check it needs, so a step that needed os-assets was built again whenever
# any asset changed: dropping one Windows asset built the OS builder, host-base and every layer
# again, to the same bytes. Each of these fetches its set again when the manifest changes, and
# the steps that need it are served as before while the set's bytes are the same. A piece that
# starts using another asset names it here; its build fails on the missing file otherwise.
