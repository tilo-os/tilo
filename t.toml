# Screenshots of every app of the default collection in the situations its plan sets up through
# the app's own actions (tools/screenshots/<app>.toml), dark and light, wide and compact, rendered
# headless on the software renderer: `t outputs app-screenshots` puts them in
# target/app-screenshots/<app>/ beside each app's manifest.json and resources.json. A failed
# situation is listed in summary.json with its log; the pictures that were taken are kept.
[[check]]
name = "app-screenshots"
run = """
bash tools/screenshots/build.sh "$CARGO_TARGET_DIR/app-screenshots-build"
rm -rf /target/app-screenshots
bash tools/test-env.sh python3 tools/screenshots/run.py --out /target/app-screenshots \\
  --bin-dir "$CARGO_TARGET_DIR/app-screenshots-build/bin" --lib-dir "$CARGO_TARGET_DIR/app-screenshots-build/lib" \\
  || echo "app-screenshots: some situations failed (see summary.json)"
"""
# Pictures, not a lint gate: warnings stay warnings (clippy and the tests gate them), so one app's
# dead code under its thin features does not cost every other app its screenshots.
env = { TILO_TEST_NTFS_FIXTURES = "0", CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "", CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "" }
outputs = ["/target/app-screenshots/**"]
requires = ["arch=x86_64"]
timeout_secs = 5400
default = false

# Videos of the motion gallery (every standard `ui::motion` where the desktop runs it) and of the
# shell's main flows (the motion review films), light and dark, every motion at the pace it runs:
# `t outputs motion-recordings` puts them in target/motion-recordings/<theme>/<scenario>.mp4.
[[check]]
name = "motion-recordings"
run = """
rm -rf /target/motion-recordings
cargo build --locked -p shell --features test-support,hosted-test-control,in-process-apps --bin shots
for theme in light dark; do
  mkdir -p "/target/motion-recordings/$theme"
  for scenario in motion_gallery motion_review_quick_settings motion_review_notifications \
      motion_review_windows motion_review_overview motion_review_popovers motion_review_tabs \
      motion_review_sheets motion_review_ribbon motion_review_launcher; do
    TILO_SHOTS_THEME="$theme" bash tools/test-env.sh "$CARGO_TARGET_DIR/debug/shots" \
      --mode recording --scenario "$scenario" --fps 60 --step-duration 0.1 \
      --out "/target/motion-recordings/$theme/$scenario.mp4"
  done
done
"""
env = { TILO_TEST_NTFS_FIXTURES = "0" }
outputs = ["/target/motion-recordings/**"]
requires = ["arch=x86_64"]
timeout_secs = 5400
default = false

