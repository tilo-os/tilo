# Tenant and agent isolation of hosted rooms: one relay governing several
# tenants' rooms, the agents delegated into them and the host's compute, against
# both relay builds that ship (the default one and the room service's `agents`
# build). Each suite also runs with its crate's tests on main; this runs them together
# on release candidates, each test in its own process as the test family runs them. The
# relays run in process; nothing reaches a deployed host.
[[check]]
name = "security-isolation-{part}"
run = """
export TILO_TEST_ASSET_CACHE=$CARGO_TARGET_DIR/test-assets TILO_TEST_NTFS_FIXTURES=0
any() { local e="" t; for t; do e="${e:+$e | }test($t)"; done; printf '%s' "$e"; }
run() { bash tools/test-env.sh cargo nextest run --locked --profile ci --no-tests=fail "$@"; }
case {part} in
  relay)
    run -p tilo-relay --lib -E "$(any room_access rooms:: compute_content host_authority)"
    run -p tilo-relay --test it -E "$(any tenant_isolation:: governed_rooms:: governed_workspace_access:: \
      room_admission:: auth_reject:: federation_cross_user_reject:: cross_user_workspace_host:: \
      compute_content:: remote_action_routing::)"
    ;;
  relay-agents)
    run -p tilo-relay --features agents --test it -E "$(any tenant_isolation:: governed_rooms:: \
      governed_workspace_access:: room_admission:: auth_reject:: compute_content:: persistent_room::)"
    ;;
  agent-participant)
    run -p tilo-agent-participant --test worker_isolation
    run -p tilo-agent-participant --test room_actions -E "$(any governed_agent::)"
    ;;
esac
"""
env = { RUST_BACKTRACE = "1" }
heavy = true
on = ["stable", "dispatch"]
timeout_secs = 5400
default = false

# Its three builds side by side: the default relay, the room service's `agents` relay, the agents.
