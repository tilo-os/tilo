# The session's end-to-end proofs (scripts/headless-examples/README.md), on the session the
# nested-session check built: run when named (`t test e2e/two-people`) and on main's newest head
# when t has room. Their verdicts, screenshots and logs: `t outputs e2e/<proof> --to DIR`.
[[check]]
name = "e2e/{proof}"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/test-env.sh bash tools/ci/session-proofs.sh {proof}"
