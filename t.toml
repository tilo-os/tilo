# Tilo's checks for t (docs/t.md): what runs before a push and on every commit to main.
# Each cargo family becomes one check per workspace package: `test/<package>`, `clippy/<package>`.
#
# Main is where changes integrate, not a release: every push to it runs the cheap checks that
# catch breakage in what it touched (fmt, clippy, the tests of the packages it reaches, the
# policy and suite scripts, the lockfile, deny and hakari), and t bisects each of their failures
# to the commit that caused it. Release candidates on `stable` run the extensive ones as well: OS
# images and their boots, VM, micro-VM and FUSE suites, the perf runs, size budgets,
# certification, the full web and SDK suites, Android, the goldens, development signing. Those say
# `on = ["stable", "dispatch"]` and `default = false`; `t test <name>` runs one for a working
# tree, `t dispatch <name>` on a branch. The ones a candidate is verified by also say `heavy =
# true`: `t stable verify <commit>` runs those of them without a result for the candidate's
# files, so a candidate reruns only what its changes since a verified ancestor reach. t keys
# each check by what its jobs read, recorded as they run, so nothing here says what a check
# reads, and a commit that only touches docs reruns nothing that never read them.
# Everything on a schedule is cheap and watches something outside the tree (certificate expiry,
# live third-party services, loop devices, mirrors, extension manifests). Some checks also say
# `idle`: main's newest head runs them when CI has room left, at the lowest priority, and t
# bisects their failures like a default check's. Their runs and bisection probes wait behind all
# other work and restart whenever pre-empted. The dev channel is published that way: main's dev
# and board images (publish-os-dev-*, publish-os-board-*), which development devices update
# from, each once os-dev-gate-* has booted it and applied an update on it.
# Publishing steps stay on main where something consumes main's development tags (the builder pin
# below, the CI images, the mirrors); those only a release or a person uses (the services'
# development tags, the release rehearsal and tools) are dispatched. The extensive checks are
# keyed by what they read, so running one for a change that doesn't touch it takes its cached
# result: run those
# your change reaches (sdk-web for the web runtime, real-fuse for the filesystem, render-counters
# for the toolkit's renderer, the goldens of the packages whose pixels you changed). Each still
# builds tilo-app, the shell or the toolkit, which most commits reach, so none of them is cheap
# enough to run on every push.

# The builder index this tree's os/Containerfile.builder defines, as main's publish-ci-builder
# published it (`dev-<commit>`), pinned so results stay comparable. `latest` lags behind it, so
# move the pin to the newest `dev-<commit>` whose commit has today's builder inputs
# (`skopeo inspect --raw docker://registry.tilo.so/tilo/tilo-builder:dev-<commit> | sha256sum`).
# The test family expects what the builder provides, such as the Chromium RPM at $CHROME.
image = "registry.tilo.so/tilo/tilo-builder@sha256:a660798f8d18ef28ca738292c5a5520bbc8ad3c64ca45de2ced317dd9c2476ae"

# A check that needs a particular node names it in `requires`: `arch=x86_64`, `os=macos`, a
# device such as `/dev/kvm`, or a node label such as `disk-100g`.
# A check whose result doesn't depend on the node's architecture says `arch=any`, and t runs it
# wherever it starts soonest, arm64 nodes included, and takes a result from one architecture for
# the other: formatting, lints and policy scripts, the cargo families over the packages whose
# code is the same on both, and builds of architecture-independent output (wasm, web bundles).
# A check without an architecture runs on the server's, x86_64. A package whose own code differs
# between x86_64 and aarch64 (tools/ci/package_sets.py, per_arch) is tested and linted on each,
# by the `test-<arch>` and `clippy-<arch>` families. Pinned to one stay the checks that produce or
# exercise that architecture's own artifacts (images, release binaries, VM guests, Android's
# NDK), the ones that need software that only exists for x86_64 (Chrome for Testing, the
# ci-fast image), and the goldens.

# The environment of every check. Warnings fail through the per-target flags, which
# Cargo joins with .cargo/config.toml's target rustflags (RUSTFLAGS would replace them).
# Tests render with Mesa's CPU Vulkan driver, never whatever adapter a node has.
[env]
XDG_RUNTIME_DIR = "/tmp/tilo-xdg-runtime"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_NAME = "llvmpipe"

# The workspace tests: tools/ci/t-nextest.sh prepares what the packages need and
# leaves out the visual goldens (.config/nextest-filters.toml).
# Media, audio and the software GPU are present in the builder, so a test that finds
# one missing fails instead of skipping. Pushes to main run the push-only suites too.
[[cargo]]
name = "test"
tool = "nextest"
requires = ["arch=any"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# Tested on each architecture, by the `test-<arch>` families below, or through another package:
# one with no test target of its own is compiled into another's tests (browser-parts into
# browser's), and nextest refuses to run it alone. Or in a
# micro-VM check of its own: the packages .config/nextest-filters.toml's `micro_vm` names
# (imager-tests-<arch>).
# BEGIN generated by tools/ci/t_toml.py: test-exclude
exclude = ["app-catalogue", "app-cli", "browser", "canvas", "click-test-client", "compat-service", "env-tools", "fs-native", "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "music", "pdf-viewer", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-ui", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm", "workspace-unify"]
# END generated
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
# Packages whose tests start sandboxes of their own (bubblewrap, unshare): in t's job
# sandbox they may create user, mount and network namespaces, as uid 1000 inside.
isolation = { nested = ["shell", "launcher", "ush", "tilo-fs", "tilo-runtime", "tilo-vmd", "settings", "tilo-sandbox-core", "thumbnails", "runtime-bundle"] }

# The test family's packages whose own code differs between x86_64 and aarch64 (seccomp
# filters and syscall numbers, ISA detection, per-architecture runtimes and guests), tested on
# each: a result on one says nothing about the other. Those of them the `test` family runs with
# nested sandboxes are named here too. Everything else as `test`.
[[cargo]]
name = "test-x86_64"
tool = "nextest"
requires = ["arch=x86_64"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# BEGIN generated by tools/ci/t_toml.py: test-x86_64-packages
packages = ["app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
isolation = { nested = ["launcher", "runtime-bundle", "shell", "tilo-sandbox-core", "tilo-vmd", "ush"] }
# END generated
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }

[[cargo]]
name = "test-aarch64"
tool = "nextest"
requires = ["arch=aarch64"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# BEGIN generated by tools/ci/t_toml.py: test-aarch64-packages
packages = ["app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
isolation = { nested = ["launcher", "runtime-bundle", "shell", "tilo-sandbox-core", "tilo-vmd", "ush"] }
# END generated
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }

# The test family's packages main runs only when it has room (tools/ci/t_toml.py, IDLE_TESTS).
# Everything else as `test`.
[[cargo]]
name = "test-idle"
tool = "nextest"
requires = ["arch=any"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# BEGIN generated by tools/ci/t_toml.py: test-idle-packages
packages = ["canvas", "music", "pdf-viewer", "tilo-ui"]
# END generated
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

# The property tests of the packages that have them, with 256 cases each instead of proptest's
# default: what the whole-workspace nightly-workspace-test adds over the `test` family,
# per package, so a release candidate reruns only the packages its change reaches.
[[cargo]]
name = "test-deep"
tool = "nextest"
requires = ["arch=any"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# BEGIN generated by tools/ci/t_toml.py: test-deep-packages
packages = ["frame-link", "tilo-doc-codecs", "tilo-reference", "tilo-render-protocol"]
# END generated
env = { PROPTEST_CASES = "256", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
heavy = true
on = ["stable", "dispatch"]
default = false

# Every package's examples, built and run as `cargo test --examples` runs them, per package: a
# release candidate reruns those of the packages its change reaches. nightly-examples is the
# same over the whole workspace at once, run on request.
[[cargo]]
name = "examples"
tool = "test"
requires = ["arch=x86_64"]
# Build scripts fetch test fixtures into the build directory, which t keeps across a build
# lineage (family env is taken literally).
wrapper = ["bash", "-c", "export TILO_TEST_ASSET_CACHE=\"$CARGO_TARGET_DIR/test-assets\" TILO_NTFS_SOURCE_CACHE=\"$CARGO_TARGET_DIR/ntfs-source\"; exec bash tools/with-test-environment.sh \"$@\"", "examples"]
args = ["--locked", "--examples"]
# BEGIN generated by tools/ci/t_toml.py: examples-packages
packages = ["accounts", "agent", "agent-provider-config", "app-cli", "browser", "calculator", "channel-crypto", "code-editor", "containers", "discord-worker", "file-explorer", "imager", "launcher", "local-model-service", "monitor", "notes", "os-actions", "osk", "runtime-bundle", "scratchpad", "settings", "shell", "store", "tilo-agent-participant", "tilo-app", "tilo-bluez", "tilo-browser-compute", "tilo-browser-peer", "tilo-clipboard", "tilo-cpu-raster", "tilo-dialogs", "tilo-doc-codecs", "tilo-doc-pdf", "tilo-files", "tilo-font-catalog", "tilo-fs", "tilo-install-helpers", "tilo-location", "tilo-media", "tilo-model-gateway", "tilo-moq", "tilo-notify", "tilo-ntfs-protocol", "tilo-paint-stream", "tilo-pdf", "tilo-relay", "tilo-resource", "tilo-rich-text", "tilo-staging-reclaim", "tilo-ui", "tilo-vmd", "tilo-web-search", "tilo-wet-media", "tilolang-app", "tilolang-host", "tilolang-tilo", "tube", "typst-editor", "ui-examples", "ush", "video-editor", "windows-vm", "word-processor"]
# END generated
env = { VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" }
heavy = true
on = ["stable", "dispatch"]
default = false

[[cargo]]
name = "clippy"
# Resolves features for the others and has nothing of its own to build (tools/ci/workspace_unify.py);
# the packages main lints only when it has room are `clippy-idle`'s, and those whose code differs
# between architectures `clippy-<arch>`'s.
# BEGIN generated by tools/ci/t_toml.py: clippy-exclude
exclude = ["workspace-unify", "music", "tilo-messaging-protocol", "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
# END generated
tool = "clippy"
requires = ["arch=any"]
# A browser crate is linted for wasm32 as well, as the web build compiles it: its
# wasm-only code builds for no other target. A package is linted with the features its own
# tests are (tools/ci/package_features.py), and one whose tested features are not what it
# ships is also linted as it ships.
wrapper = ["python3", "tools/ci/t_cargo_compile.py"]
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]

# The clippy family's packages main lints only when it has room (tools/ci/t_toml.py, IDLE_LINTS).
[[cargo]]
name = "clippy-idle"
tool = "clippy"
requires = ["arch=any"]
wrapper = ["python3", "tools/ci/t_cargo_compile.py"]
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
heavy = true
on = ["stable", "dispatch", "idle"]
default = false
# BEGIN generated by tools/ci/t_toml.py: clippy-idle-packages
packages = ["music", "tilo-messaging-protocol"]
# END generated

# The clippy family's packages whose own code differs between x86_64 and aarch64, linted on
# each, as `test-<arch>` tests them. Everything else as `clippy`.
[[cargo]]
name = "clippy-x86_64"
tool = "clippy"
requires = ["arch=x86_64"]
wrapper = ["python3", "tools/ci/t_cargo_compile.py"]
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
# BEGIN generated by tools/ci/t_toml.py: clippy-x86_64-packages
packages = ["app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
# END generated

[[cargo]]
name = "clippy-aarch64"
tool = "clippy"
requires = ["arch=aarch64"]
wrapper = ["python3", "tools/ci/t_cargo_compile.py"]
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
# BEGIN generated by tools/ci/t_toml.py: clippy-aarch64-packages
packages = ["app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
