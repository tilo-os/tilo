# A person's first hour, one walk per thing they meet — the shell's launcher, switcher, search,
# quick settings and the rest, and each app they open — walked in every version its step file names
# that is still in the tree: the tilolang shell, a Rust app and
# its tilolang port. One headless session per version on the session the nested-session check built,
# every step snapshotted in the light theme and the marked ones in the dark, each step asserting what
# a person must see and how long it may take (scripts/headless-examples/app-walk.py, the steps in
# app-walks/WALK.json). The check holds what it found to the walk's baseline from main
# (app-walks/baseline/WALK.json): a step walked there and not here, or walked twice as slowly, is
# red, and a version the baseline did not have is held to the version a person got then, so a lane
# that deletes the Rust shell or app proves the replacement lost nothing. `scripts/headless-examples/walk.sh WALK`
# runs it and brings back the page (walk.md, compare.md) with the baseline's shots beside this
# tree's; inputs: `only=rust|tl` walks one version, `discover=1` keeps every step's controls.
# The session runs as the seat's account, in a login's runtime directory, on a system bus of its
# own that serves the machine's power authorities, as a device has them: Chromium refuses its
# sandbox as root, the shell runtime and the system bus are the login's, and Settings reads the
# display snapshot the compositor publishes there (tools/ci/app-walk.sh).
[[check]]
name = "app-walk/{app}"
run = "bash tools/test-env.sh bash tools/ci/app-walk.sh /target/app-walk/{app} {app} ${T_INPUT_WALK:+--only-walk \"$T_INPUT_WALK\"}"
needs = ["font-seed", "nested-session", "tilolang-cli-binary"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_NESTED_SESSION_BUILD = "/target/nested-session", TILO_TILOLANG = "/target/debug/tilolang" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/app-walk/{app}/**"]
evidence = ["/target/app-walk/{app}/**"]
timeout_secs = 2400
on = ["dispatch", "idle", "stable"]
dispatch_inputs = { only = "", discover = "", walk = "" }
[check.matrix]
app = ["access-view", "api-tester", "apps", "backups", "capabilities", "capabilities-unused", "capabilities-unused-agent", "capabilities-unused-styles", "capture", "clocks", "code-editor", "devices", "displays-across-devices", "file-explorer", "git-client", "maps", "music", "notes", "osk", "passwords", "remote", "scratchpad", "settings", "shell", "shortcuts", "store", "tl-apps", "totp", "tube", "video-player"]
# Typing in a tilolang app on the headless session, key to the frame that shows it
# (tools/ci/key-latency.sh): Notes' package built from the tree, a note opened, keys typed into it.
# The distribution: `t outputs key-latency/notes --to DIR` (table.md, notes.json).
[[check]]
name = "key-latency/notes"
run = "bash tools/test-env.sh bash tools/ci/key-latency.sh /target/key-latency/notes notes 'New note'"
needs = ["font-seed", "nested-session", "tilolang-cli-binary"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_NESTED_SESSION_BUILD = "/target/nested-session", TILO_TILOLANG = "/target/debug/tilolang" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/key-latency/notes/**"]
evidence = ["/target/key-latency/notes/**"]
timeout_secs = 1800
on = ["dispatch"]

# Every app's open against the product's bar, 100 ms from asking for an app on the device to the
# frame that shows its window: the cold open and each open after a quit, as the walks of the apps
# recorded them from their sessions' launch timings, one row per app and open with how busy the
# machine was beside it (scripts/headless-examples/app-walk.py --opens). Apart from the walks, which
# are red for their flows alone: a slow open is red here, and never hides a broken flow there.
# The rows: `t outputs app-walk/open --to DIR` (opens.md).
[[check]]
name = "app-walk/open"
run = "python3 -I -B scripts/headless-examples/app-walk.py --opens /target/app-walk --out /target/app-walk/open"
needs = ["app-walk/apps", "app-walk/notes", "app-walk/tube"]
outputs = ["/target/app-walk/open/**"]
timeout_secs = 300
on = ["dispatch", "idle", "stable"]

# `cargo headless --check` and `cargo desktop --check` (tools/tilo-local) on the session the
# nested-session check built: each starts the development session the way a developer does, asks
# it something (its actions; its window, opened on a throwaway headless Tilo in place of the
# developer's desktop) and stops it, with listening traps where the host's session bus, system bus,
# login bus and systemd would be. A connection to any of them fails the check: the commands must
# never reach the session of whoever runs them.
[[check]]
name = "run-headless"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/test-env.sh /target/debug/tilo-local headless --check --no-build --apps activity"
needs = ["font-seed", "nested-session", "tilo-local-binaries"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_NESTED_SESSION_BUILD = "/target/nested-session" }
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1200
on = ["idle", "stable"]

[[check]]
name = "run-desktop"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/test-env.sh /target/debug/tilo-local desktop --check --no-build --apps activity"
needs = ["font-seed", "nested-session", "tilo-local-binaries"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_NESTED_SESSION_BUILD = "/target/nested-session" }
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1200
on = ["idle", "stable"]

# `cargo daemon`'s programs: the launcher, this checkout's `tilo` command and the daemon it
# starts, built where cargo has its registry.
[[check]]
name = "daemon-binaries"
run = "cargo build --locked -p tilo-local && cargo build --locked -p tilo-cli --bin tilo && cargo build --locked -p tilo-daemon --bin tilo-runtime"
# The toolkit the daemon carries reads its font catalog at build time.
needs = ["font-seed"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1" }
outputs = ["/target/debug/tilo-local", "/target/debug/tilo", "/target/debug/tilo-runtime"]
# The binaries are native, and their only consumer runs them on x86_64: named here so a job on
# another architecture never builds them and hands them to it.
requires = ["arch=x86_64"]
default = false

# `cargo daemon --check` (tools/tilo-local): a device daemon started on a fresh state directory
# of its own, founding its throwaway person, asked `tilo status --daemon` and one read action
# (devices#info), then stopped. It runs beside the person's own daemon and never touches it.
[[check]]
name = "run-daemon"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/test-env.sh /target/debug/tilo-local daemon --check --no-build"
needs = ["daemon-binaries"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1200
on = ["idle", "stable"]

# `cargo web --check` on the bundle and programs the checks beside it built: the local stack brought
# up on the shipped bundle, its page loaded back module by module down to the runtime's
# WebAssembly, then stopped. A bundle missing a piece the page imports fails here, by name.
[[check]]
name = "run-web"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "cargo run --locked -q -p tilo-local -- web --check --bundle /target/publish/web-entry/bundle"
needs = ["web-entry-bundle", "tilo-sh-binaries", "tilo-sh-caddy", "cli-x86_64"]
# openssl signs the stack's own releases, as the release key signs production's.
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_CLI_DIR = "/target/publish/cli/linux-x86_64" }
requires = ["arch=x86_64"]
isolation = "nested"
timeout_secs = 1200
on = ["idle", "stable"]

# ---- Product images, signatures and publication
#
# One chain per image: what it is built from, the image, a test that runs the thing inside it,
# then signing and publication on a release tag (`vMAJOR.MINOR.PATCH`) or wherever a release is
# asked for by dispatch. Every link is a check of its own, so changing a link leaves every earlier
# one cached.
#
# The registry server is a `build`: a Containerfile of this tree whose one outside input is a
# named context, so t makes a check per instruction and caches each on what it reads. The other
# two are `run`s, for two reasons that stay true of them. Their context is not this tree's: a
# script assembles it from other checks' outputs (font catalogues prepared, the web bundle laid
# out, bot programs renamed), and t reads a build's context from the state's sources, so it would
# find those files missing. And both Containerfiles stamp the commit into the image with an `ARG`
# that the packaging script passes the commit to — a build arg is a fixed string in t.toml, while
# a per-commit one would rerun the config steps of every commit.

[[check]]
name = "image-web-entry-context"
run = "bash tools/ci/publish/web-entry-context.sh /target/publish/web-entry/context /target/publish/web-entry/bundle /target/docs/site"
needs = ["web-entry-bundle", "docs-site"]
outputs = ["/target/publish/web-entry/context/**"]
git = true
requires = ["arch=x86_64"]
default = false

[[check]]
name = "image-web-entry"
# Pulls and builds container images whose packages come from mirrors and registries no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash tools/ci/publish/oci-build.sh /target/publish/web-entry/context /target/publish/web-entry/context/Containerfile /target/publish/web-entry --build-arg SOURCE_REVISION=$(cat /target/publish/web-entry/context/source-revision)\nbash crates/core/tilo-browser-runtime/container/test-image.sh /target/publish/web-entry/image.oci.tar"
needs = ["image-web-entry-context"]
outputs = ["/target/publish/web-entry/image.oci.tar", "/target/publish/web-entry/digest"]
requires = ["arch=x86_64"]
isolation = "vm"
git = true
default = false

[[check]]
name = "carry-web-entry"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash tools/ci/publish/web-entry-carry.sh /target/publish/web-entry /target/publish/web-entry/release"
needs = ["image-web-entry"]
outputs = ["/target/publish/web-entry/release/image.oci.tar", "/target/publish/web-entry/release/digest", "/target/publish/web-entry/release/receipt-extra.json"]
requires = ["arch=x86_64"]
isolation = "vm"
on = ["dispatch"]
cache = false

[[check]]
name = "sign-web-entry"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/web-entry /target/publish/web-entry/release"
needs = ["carry-web-entry", "signing-tools"]
outputs = ["/target/publish/web-entry/release/payload.json", "/target/publish/web-entry/release/signature", "/target/publish/web-entry/release/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
# Signed on a release tag and on a dispatch: the web entry is released at a release tag, with the
# server of the same commit (`t dispatch publish-web-entry --ref tag:vX.Y.Z`). The signing role
# trusts v* tags only, so a dispatch on main gets no signature and publishes nothing.
on = ["dispatch"]

[[check]]
name = "publish-web-entry"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/web-entry /target/publish/web-entry 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-web-entry", "signing-tools"]
optional_needs = ["carry-web-entry"]
# Only a release tag's run can sign (the release key's role trusts v* tags), so a dispatch names
# this and is skipped where that run cannot sign: publishing waits for the answer and pushes the
# channel's tags anyway, a development build without a signature and a release one only with it
# (oci-publish.sh), which is the loud failure a release that cannot sign should get.
needs_any_outcome = ["sign-web-entry"]
outputs = ["/target/publish/web-entry/receipt.json"]
pointers = { web-entry = "/target/publish/web-entry/receipt.json" }
id_token = ["registry.tilo.so"]
env = { TILO_RELEASE_OUT = "/target/publish/web-entry/release" }
requires = ["arch=any"]
on = ["dispatch"]

# The Lounge, built and guarded here: the programs, the image and the image used by people — two
# headless browsers joining it through the web entry, chatting, sharing a shell and seeing each
# other present, then one of them opening a shared document's link. One check per step, so a
# change leaves the earlier ones cached, and the check runs on any commit and branch instead of
# only in the publication on main. Image-lounge-context publishes the app surfaces from the
# apps' history, so these read Git; the image is built at the commit time of the newest commit
# that changed it, as every image here is.
[[check]]
name = "lounge-binaries"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/lounge-binaries.sh /target/publish/lounge/binaries"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/binaries/**"]
# The image's programs, built as the image ships them: a release build whose whole-program link
# covers everything a host that serves pages carries. Only the image waits for this build; the
# checks that run these programs themselves (e2e, the tilo.sh stack) ask for
# `lounge-check-binaries` below. A release waits
# for it, so it gets longer than a check of a change does: the whole-program link grows with the
# graph and this is the only build of it left.
timeout_secs = 5400
default = false

# The same programs, for the checks that run them directly (e2e, the tilo.sh
# stack): the profile Cargo.toml's `lounge-check` describes, which is release optimisation
# without the whole-program link. A check starts from an empty build directory, so a run takes
# every unit it reuses from the compiler cache, recompiles the crates the change touched and the
# crates above them, and links whole — for a binary no check reads the speed of.
[[check]]
name = "lounge-check-binaries"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/lounge-binaries.sh /target/publish/lounge-check/binaries lounge-check"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge-check/binaries/**"]
# A node's first run of this builds the whole graph from nothing through the compiler cache; after
# that t books it from what it measured. A change to a leaf crate recompiles that crate and what
# depends on it, and relinks; a change to a crate the programs carry recompiles everything above
# it. That work is the check's own: each of these checks selects its own packages and cargo
# resolves features per selection, so a crate two of them carry is a different unit in each
# selection that reaches it, and only a unit their selections resolve alike is served to both.
timeout_secs = 7200
default = false

# The apps a Lounge runs for its workspace's people (tools/ci/publish/lounge-apps.sh): the
# launcher each app's process starts in, the Tilo and tilolang runtime bundles, the one key they
# and the packages are signed with, and the default collection's tilolang packages. A device
# carries all of them; the image installs the packages into its store, and a check installs them
# into the store it starts the server on.
[[check]]
name = "lounge-apps"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/lounge-apps.sh /target/publish/lounge/apps /target/tilolang-runtime /target/publish/lounge/fonts release"
needs = ["tilolang-runtime", "lounge-fonts"]
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/apps/**"]
timeout_secs = 7200
default = false

# The same apps for the checks that run the Lounge's programs directly (the page checks, the
# local stack): the launcher built with `dev-overrides`, so it reads the trust list this build
# writes beside it rather than the image's /etc/tilo. No program of the image's `release` build
# ever honours that.
[[check]]
name = "lounge-check-apps"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/lounge-apps.sh /target/publish/lounge-check/apps /target/tilolang-runtime /target/publish/lounge/fonts lounge-check"
needs = ["tilolang-runtime", "lounge-fonts"]
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge-check/apps/**"]
timeout_secs = 7200
default = false

# The product font catalog, which the image's context and every check that runs the Lounge's
# programs directly serve: built once, apart from the image's own assembly, so a check of the page
# does not wait for the image's programs.
[[check]]
name = "lounge-fonts"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/lounge-fonts.sh /target/publish/lounge/fonts"
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/fonts/**"]
default = false

[[check]]
name = "image-lounge-context"
run = "bash tools/ci/publish/lounge-context.sh /target/publish/lounge/context /target/publish/lounge/binaries /target/publish/lounge/fonts /target/publish/lounge/apps"
needs = ["lounge-binaries", "lounge-fonts", "lounge-apps"]
outputs = ["/target/publish/lounge/context/**"]
requires = ["arch=x86_64"]
git = true
default = false

[[check]]
name = "image-lounge"
# Pulls and builds container images whose packages come from mirrors and registries no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/containers/tilo-lounge/test-entrypoint.sh\nbash tools/ci/publish/oci-build.sh /target/publish/lounge/context /target/publish/lounge/context/Containerfile /target/publish/lounge --build-arg SOURCE_REVISION=$(cat /target/publish/lounge/context/source-revision)\nbash os/containers/tilo-lounge/test-image.sh /target/publish/lounge/image.oci.tar"
needs = ["image-lounge-context"]
# The entrypoint is also held against the programs the image carries, not only against its stub:
# the daemon answers, and a volume with no identity says how a machine joins.
env = { TILO_SERVER_BIN = "/target/publish/lounge/context/bin/tilo-runtime" }
outputs = ["/target/publish/lounge/image.oci.tar", "/target/publish/lounge/digest"]
requires = ["arch=x86_64"]
isolation = "vm"
git = true
default = false

# The check's own certificate mint, built for the node's architecture as a development build: the
# site's TLS needs it, and it is no published artifact.
[[check]]
name = "lounge-check-tools"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "cargo build --locked -p tilo-crypto --bin tilo-crypto\nrm -rf /target/publish/lounge/check-tools\nmkdir -p /target/publish/lounge/check-tools\ncp \"$CARGO_TARGET_DIR/debug/tilo-crypto\" /target/publish/lounge/check-tools/\n"
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/check-tools/**"]
default = false

# The tilo command an agent runs in e2e's setups, built as the server beside it is (Cargo.toml's
# `lounge-check`: the release's code and opt-level without its whole-program link), from the same
# compiler cache. A change to the command recompiles the crates above the change and relinks, not
# the command alone, and what this selection resolves differently from the server's is its own
# units (`lounge-check-binaries`). The static musl build a release publishes is cli-x86_64's, which
# cli-rehearsal installs the way a person does: its build from cold is no part of what a change to
# a page waits for.
[[check]]
name = "lounge-check-cli"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "# The tilo command and the daemon it starts, packed together as cli-release.sh packs them, with\n# the launcher beside them a device starts every app through (a check's, reading the trust list it\n# is given rather than the image's).\ncargo build --locked --profile lounge-check -p tilo-cli -p tilo-daemon --bin tilo --bin tilo-runtime\ncargo build --locked --profile lounge-check -p launcher --features launcher/dev-overrides --bin tilo-launcher\nrm -rf /target/publish/lounge-check/cli\nmkdir -p /target/publish/lounge-check/cli\ncp \"$CARGO_TARGET_DIR/lounge-check/tilo\" \"$CARGO_TARGET_DIR/lounge-check/tilo-runtime\" \"$CARGO_TARGET_DIR/lounge-check/tilo-launcher\" /target/publish/lounge-check/cli/\n"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge-check/cli/**"]
default = false

# A person's first Tilo on stock Linux: `tilo login --new-identity` installs this computer's daemon
# as their systemd user unit and systemd starts it, a second login reinstalls nothing, and a fresh
# manager starts the enabled unit again, as after a reboot. A job's sandbox has no writable
# cgroups, so the check runs in a VM and starts its user manager there as a login's is.
[[check]]
name = "cli-user-service-x86_64"
run = "bash tools/ci/cli-user-service.sh /target/publish/lounge-check/cli"
needs = ["lounge-check-cli"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 600
on = ["idle", "stable", "dispatch"]

# The web page and the stack it runs on, end to end, on every change that reaches either, in
# minutes: tilo.sh as production's manifests bring it up (stack.sh: the Lounge's server, the front
# API server and the web entry, with their images' entrypoints and environment behind production's Caddy)
# from what the checks beside it built, so it compiles nothing; one headless Chromium started per
# flow; then every flow at the same time against that one stack, each as people of its own
# (os/containers/tilo-lounge/test-e2e.sh says which flows there are). A change to a page driver
# reruns only this, and the server, the API server, the site and the command are the cached outputs
# the other checks share. One flow alone: `bash os/containers/tilo-lounge/test-e2e.sh BUNDLE WORK
# boot`.
#
# Nested, because the stack's services are sandboxed with bwrap (stack.sh), which needs namespaces
# of its own.
# A stack holding data comes up on the next build (tools/ci/stack-upgrade/upgrade.sh): the commit
# before fills a stack with a workspace's chat, tasks, a note, a file, Mail, a contact, an event,
# and its person's Passwords entry, vault item and mail account at a stand-in mail server; this
# commit's programs bring the same state up and read each back. A change to what a server stores
# that leaves an earlier build's data behind fails on the commit that made it. The base's
# programs are built here, from its own checkout, beside the cached build of this commit.
[[check]]
name = "stack-upgrade"
on = ["idle", "stable"]
# The crates the base's build fetches, from the mirror tilo-sh-binaries builds from; the stack
# meets the fill and the check on loopback.
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/stack-upgrade/upgrade.sh /target/stack-upgrade"
needs = ["tilo-sh-binaries", "lounge-check-cli", "lounge-fonts", "tilo-sh-caddy", "image-web-entry-context"]
# The stack signs its release of the tilo command with a key openssl makes. Not pinned: dnf
# installs the newest build Fedora's updates repository holds, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { CARGO_BUILD_JOBS = "8", TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo", TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_FONTS = "/target/publish/lounge/fonts", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_VM_HOST = "0" }
requires = ["arch=x86_64"]
isolation = "nested"
git = true
outputs = ["/target/stack-upgrade/expected.json", "/target/stack-upgrade/state/logs/*.log"]
evidence = ["/target/stack-upgrade/state/logs/**"]
timeout_secs = 3600

[[check]]
name = "tilo-sh-e2e/{flow}"
# Heavy: on main's newest head with the room main's heads leave (`idle`), keyed on every commit, so
# a failure is still bisected to the commit that broke it and told to its pusher. At every head
# it and the release-profile builds it needs cost about 2 core-hours of the node's (11-14).
on = ["idle", "stable"]
# No egress: every flow meets the stack on loopback (the server and API on 127.0.0.1 and localhost,
# the site at tilo.localhost, which the image's resolver answers itself), and its programs, fonts
# and Caddy are its needs'. A computer a flow logs in takes its workspaces' work on a runtime that
# relays through the stack's own relay on this machine and asks no router for a port. What a
# runtime holding number 0's relays still sends by design — a relay name to the sandbox's resolver
# and a router port over SSDP (iroh's portmapper) — is declared exactly, as the page checks do.
egress = { to = ["169.254.1.1:53", "239.255.255.250:1900"] }
# One job a flow, each against a stack of its own (the script's E2E_FLOWS): t sizes each flow by
# what its own runs measured, and a flow that fails is the one named. As one job, every run of the
# ten was booked at the width the single-flow runs taught, and on a loaded node agent-setup was
# throttled for most of its time and two flows reached their limits, a verdict no one could tell
# from the code's.
run = "E2E_FLOWS={flow} bash os/containers/tilo-lounge/test-e2e.sh /target/publish/web-entry/bundle /target/e2e"
needs = ["lounge-check-binaries", "lounge-fonts", "lounge-check-cli", "lounge-check-tools", "web-entry-bundle", "tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False python3-httpx python3-pip openssl && dnf clean all && python3 -m pip install --no-cache-dir blake3", egress = { to = ["0.0.0.0/0", "::/0"] } }
# Its browsers are bounded by the job, as onboarding's (below), never the supervisor's two-browser
# share of a developer's machine, which held every flow but two waiting for a browser against its
# own time limit.
env = { TILO_SERVER_BIN = "/target/publish/lounge-check/binaries/tilo-runtime", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/check-tools/tilo-crypto", TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo", TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_STATE = "/target/e2e/state", TILO_SH_FRESH = "1", TILO_SH_VM_HOST = "0", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0", TILO_OWNED_BROWSER_MAX_LIFETIME_SECS = "0" }
requires = ["arch=x86_64"]
isolation = "nested"
# What it found, not what it ran: each flow's pages, reports and consoles, and each of the stack's
# own logs; the site it served is the web entry's laid-out context again.
outputs = ["/target/e2e/*.log", "/target/e2e/state/logs/*.log", "/target/e2e/signin/**", "/target/e2e/directory/**", "/target/e2e/boot/**", "/target/e2e/agent-setup/**", "/target/e2e/setup-resume/**", "/target/e2e/visa/**", "/target/e2e/entry/**", "/target/e2e/passkey/**", "/target/e2e/wait-list/**", "/target/e2e/onboarding/**"]
# What a failure keeps of why: every service's log, which says which of them did not answer.
evidence = ["/target/e2e/state/logs/**"]
timeout_secs = 1800
[check.matrix]
# test-e2e.sh's flows, as its `all` names them.
flow = ["signin", "directory", "boot", "agent-setup", "setup-resume", "visa", "entry", "passkey", "wait-list", "onboarding"]

# A stranger's way into tilo.sh, end to end, on a whole stack of its own, brought up the way
# production's manifests bring it up (test-onboarding.sh, one flow of the e2e check's): the wait
# list and its confirmation mail, the invitation an owner sends from the workspace's wait list, the
# workspace the link lands them in with the agent setup, the passkey that brings them back on a
# browser that forgot the site, a second workspace they make, and a visitor with no invitation who
# still cannot get in. Nested, because the stack's services are sandboxed with bwrap (stack.sh).
# Its browsers are as bounded as the flow is, not as a developer's machine is: three people's pages
# are open at once here (the operator's, the stranger's, and the browser that signs in), where the
# supervisor's two-browser bound and ten-minute lifetime (tools/web/owned_browser.py) are one agent's
# share of a machine. Only the job bounds a job: its timeout stops a driver that never finishes,
# and a driver that stops takes its browsers with it.
[[check]]
name = "onboarding"
# No egress: the entry, the stack and the people's browsers meet on loopback alone.
run = "bash os/containers/tilo-lounge/test-onboarding.sh /target/publish/web-entry/bundle /target/onboarding"
needs = ["lounge-check-cli", "web-entry-bundle", "tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False python3-httpx openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo", TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_STATE = "/target/onboarding/state", TILO_SH_FRESH = "1", TILO_SH_VM_HOST = "0", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0", TILO_OWNED_BROWSER_MAX_LIFETIME_SECS = "0" }
requires = ["arch=x86_64"]
isolation = "nested"
outputs = ["/target/onboarding/**"]
evidence = ["/target/onboarding/state/logs/**"]
timeout_secs = 1800
on = ["dispatch"]

# A fresh tilo.sh stack admits a page: the site's own page, in a headless Chromium, reaches the
# host over the browser's WebTransport and is let into the Lounge through its entry, on a stack
# brought up fresh from what the checks beside it built (so it compiles nothing). One flow of
# test-e2e.sh's, not the whole check, so a page the stack turns away fails here by name in about a
# minute, where the entry-speed flows would show it only as a slower number.
#
# Nested, because the stack's services are sandboxed with bwrap (stack.sh), which needs namespaces
# of its own.
[[check]]
name = "tilo-sh-admits-a-page"
# Heavy: on main's newest head with the room main's heads leave (`idle`), keyed on every commit, so
# a failure is still bisected to the commit that broke it and told to its pusher. At every head
# it and the release-profile builds it needs cost about 2 core-hours of the node's (11-14).
on = ["idle", "stable"]
# No egress: as e2e, the page and the stack meet on loopback alone.
run = "bash os/containers/tilo-lounge/test-e2e.sh /target/publish/web-entry/bundle /target/entry entry"
needs = ["lounge-check-cli", "web-entry-bundle", "tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False python3-httpx openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo", TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_STATE = "/target/entry/state", TILO_SH_FRESH = "1", TILO_SH_VM_HOST = "0", TILO_SH_ENTRY_VISITS = "1", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0", TILO_OWNED_BROWSER_MAX_LIFETIME_SECS = "0" }
requires = ["arch=x86_64"]
isolation = "nested"
# What it found, not what it ran: the visitor's page and console, and the stack's own logs.
outputs = ["/target/entry/*.log", "/target/entry/entry/**", "/target/entry/state/logs/*.log"]
evidence = ["/target/entry/state/logs/**"]
timeout_secs = 600

# A stranger at the front of a workspace that takes people by invitation, in a real browser, against
# the Lounge's server (test-wait-list.sh): the wait list is what they see rather than the setup
# screen, the address they leave is confirmed through the mail the entry sends to a sink this run
# keeps, and a reload keeps them on the wait list. It is the whole way from the page's refusal
# through the server's entry, the workspace's wait list and the mail out — one flow of the e2e
# check's, brought up on its own here with the same programs and bundle.
[[check]]
name = "wait-list"
# No egress: the page, the entry, its mail sink and the security it serves meet on loopback.
run = "bash os/containers/tilo-lounge/test-wait-list.sh /target/publish/web-entry/bundle /target/wait-list"
needs = ["lounge-check-binaries", "lounge-fonts", "lounge-check-tools", "web-entry-bundle"]
env = { TILO_SERVER_BIN = "/target/publish/lounge-check/binaries/tilo-runtime", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/check-tools/tilo-crypto", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0", TILO_OWNED_BROWSER_MAX_LIFETIME_SECS = "0" }
requires = ["arch=x86_64"]
outputs = ["/target/wait-list/**"]
timeout_secs = 1800
on = ["dispatch"]

[[check]]
name = "page-notes"
# No egress: as e2e, the walk meets its Lounge on loopback (direct-lounge.sh) and its
# programs and fonts are its needs'.
# This host's own endpoints probe a router for a port that is how devices reach
# it without the relay (iroh's portmapper: SSDP to 239.255.255.250:1900 and a
# name lookup at the sandbox's resolver). The product does that by design and
# the walk neither uses it nor needs it; the sandbox has no router, so the
# packets are refused unless the check declares them. Exactly those two.
egress = { to = ["169.254.1.1:53", "239.255.255.250:1900"] }
run = "TILO_PAGE_NOTES_IN_LOG=1 bash os/containers/tilo-lounge/test-page-notes.sh /target/publish/web-entry/bundle /target/page-notes"
needs = ["lounge-check-binaries", "lounge-check-apps", "lounge-fonts", "lounge-check-tools", "web-entry-bundle"]
env = { TILO_SERVER_BIN = "/target/publish/lounge-check/binaries/tilo-runtime", TILO_LOUNGE_APPS = "/target/publish/lounge-check/apps", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/check-tools/tilo-crypto" }
requires = ["arch=x86_64"]
# Nested: the launcher starts each app's process in a bwrap sandbox of its own, which needs
# namespaces.
isolation = "nested"
outputs = ["/target/page-notes/**"]
timeout_secs = 1800
default = false

# Two people in a voice call, each in a headless Chromium of their own with a
# synthetic microphone and camera, on the workspace's page against the Lounge:
# they name themselves from the page's search, one makes a voice channel, both
# join its call, unmute and turn their camera on, and the call is proved by its
# own counters on each page (voice frames heard, pictures sent and received) and
# by the other person's tile drawing picture after picture.
[[check]]
name = "page-call"
# No egress: as page-notes, the walk meets its Lounge on loopback (direct-lounge.sh) and its
# programs and fonts are its needs', and a page's call runs over that same loopback. This
# host's own endpoints probe a router for a port devices reach it by without the relay (iroh's
# portmapper: SSDP to 239.255.255.250:1900 and a name lookup at the sandbox's resolver). The
# product does that by design and the walk neither uses it nor needs it; the sandbox has no
# router, so the packets are refused unless the check declares them. Exactly those two.
egress = { to = ["169.254.1.1:53", "239.255.255.250:1900"] }
run = "bash os/containers/tilo-lounge/test-page-call.sh /target/publish/web-entry/bundle /target/page-call"
needs = ["lounge-check-binaries", "lounge-fonts", "lounge-check-tools", "web-entry-bundle"]
env = { TILO_SERVER_BIN = "/target/publish/lounge-check/binaries/tilo-runtime", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/check-tools/tilo-crypto", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0" }
requires = ["arch=x86_64"]
# The Lounge joins its person over their endpoint, as a deployment does (the
# stack's own checks, which bring one up, run nested too).
isolation = "nested"
outputs = ["/target/page-call/**"]
timeout_secs = 1800
default = false

[[check]]
name = "page-reopen"
# No egress: as page-notes, the walk meets its Lounge on loopback (direct-lounge.sh) and its
# programs and fonts are its needs'.
egress = { to = ["169.254.1.1:53", "239.255.255.250:1900"] }
run = "TILO_PAGE_REOPEN_IN_LOG=1 bash os/containers/tilo-lounge/test-page-reopen.sh /target/publish/web-entry/bundle /target/page-reopen"
needs = ["lounge-check-binaries", "lounge-check-apps", "lounge-fonts", "lounge-check-tools", "web-entry-bundle"]
env = { TILO_SERVER_BIN = "/target/publish/lounge-check/binaries/tilo-runtime", TILO_LOUNGE_APPS = "/target/publish/lounge-check/apps", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/check-tools/tilo-crypto", TILO_OWNED_BROWSER_MAX_CONCURRENT = "0", TILO_OWNED_BROWSER_MAX_LIFETIME_SECS = "0" }
requires = ["arch=x86_64"]
# Nested: the launcher starts each app's process in a bwrap sandbox of its own, which needs
# namespaces.
isolation = "nested"
outputs = ["/target/page-reopen/**"]
timeout_secs = 1800
default = false

# The user stories (os/containers/tilo-lounge/stories/stories.json): what people set out to do with
# Tilo, each walked end to end by its people in fresh browser profiles on a fresh tilo.sh stack of
# its own, every step recorded (screenshots, each person's video), timed and held to its budget,
# and the recording judged by a model that has seen none of the code, as a picky first-time user.
# A story is green only when it finished within budget and the judge accepted it; each story is
# its own item, so a red one is named on `t main`. Its page, recordings and verdict:
# `t outputs user-stories/<story> --to DIR`, DIR/<story>/index.html; the stories' page together:
# `python3 -I os/containers/tilo-lounge/stories/page.py DIR DIR/*/<story>`.
#
# Nested, because the stack's services are sandboxed with bwrap (stack.sh), which needs
# namespaces of its own.
[[check]]
name = "user-stories/{story}"
on = ["schedule:0 6 * * *", "dispatch"]
# The judge's model, at Anthropic's API; the stack itself meets its people on loopback.
egress = { to = ["api.anthropic.com:443"] }
run = "bash os/containers/tilo-lounge/test-user-stories.sh /target/user-stories/{story} {story}"
needs = ["lounge-check-cli", "web-entry-bundle", "tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context"]
# Its setup is not pinned: dnf installs the newest builds Fedora's updates repository holds, and pip
# the newest Anthropic SDK, from hosts no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False python3-httpx python3-pip openssl ffmpeg-free && dnf clean all && python3 -m pip install --no-cache-dir anthropic", egress = { to = ["0.0.0.0/0", "::/0"] } }
# The judge reads ANTHROPIC_API_KEY: declare it here as `secrets = ["ANTHROPIC_API_KEY"]` once t holds
# that secret (a check with a secret then runs only on its schedule and by `t dispatch`). Until then
# each story whose steps pass is "passed, not judged".
env = { TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo", TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_VM_HOST = "0" }
requires = ["arch=x86_64"]
isolation = "nested"
cache = false
# The story's page, its recording and verdict, and the stack's logs. A red story keeps them too:
# the recording is what says why.
outputs = ["/target/user-stories/{story}/index.html", "/target/user-stories/{story}/{story}/**"]
evidence = ["/target/user-stories/{story}/index.html", "/target/user-stories/{story}/{story}/**"]
timeout_secs = 1800
[check.matrix]
story = ["wait-list-sign-up"]

# The user stories walked in Tilo shells (stories.json's `"walk": "shell"`): each person a headless
# Tilo session of their own, on the session the nested-session check built with the tree's apps, on
# scratch homes (stories/shell/story.py), or a computer of theirs where the `tilo` command is the
# whole of Tilo, driven by the commands a person runs there (stories/shell/cli_host.py: a ticket
# from one computer logged in on another, and a home server joined to a workspace). Each step is
# driven through the shell's own actions, pointer and keys, or through those commands, decided by
# reading the shells' own state or what the commands answered, timed against its budget and
# snapshotted; each person's snapshots become their video. A story that meets a server (`servers`)
# starts it here first, as root, and reads its state beside the person's (test-user-stories.sh):
# the Nextcloud one story connects to over WebDAV and CalDAV is the conformance suite's own image,
# which is why this check needs a VM and /dev/fuse (its account folders are FUSE mounts). The page
# and recording: `t outputs user-stories-shell/<story> --to DIR`, DIR/<story>/index.html. No secret
# is needed: the judge looks only where the check holds ANTHROPIC_API_KEY, and a story whose steps
# pass is otherwise "passed, not judged", never red for that alone.
[[check]]
name = "user-stories-shell/{story}"
on = ["schedule:0 6 * * *", "dispatch", "idle", "stable"]
# The pinned assets the test environment fetches, and the judge's model where it has a key. Not
# pinned beside them: a story meeting its own server pulls that server's image (the conformance
# Nextcloud and PostgreSQL) as it starts, and a registry's hosts are no fixed list. The walk
# itself meets only its own loopback.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/test-env.sh bash os/containers/tilo-lounge/test-user-stories.sh /target/user-stories-shell/{story} {story}"
needs = ["font-seed", "nested-session", "lounge-check-cli"]
# ffmpeg encodes each person's video, and podman starts the Nextcloud a story's people meet. Not
# pinned: dnf installs the newest builds Fedora's updates repository holds, and pip the newest
# Anthropic SDK, from hosts no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman ffmpeg-free python3-pip && dnf clean all && python3 -m pip install --no-cache-dir anthropic", egress = { to = ["0.0.0.0/0", "::/0"] } }
# A story's people run
# the `tilo` command against their own desktop, at the socket it serves its person's programs on
# (the desktop API): it is the release the page stories drive, built once for them.
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_NESTED_SESSION_BUILD = "/target/nested-session", TILO_CLI_BIN = "/target/publish/lounge-check/cli/tilo" }
# The account folders a cloud story's person sees are FUSE mounts.
requires = ["/dev/fuse", "arch=x86_64"]
isolation = "vm"
cache = false
# The story's page, its snapshots, videos and verdict, and each session's log. A red story keeps
# them too: the recording is what says why.
outputs = ["/target/user-stories-shell/{story}/index.html", "/target/user-stories-shell/{story}/{story}/**"]
evidence = ["/target/user-stories-shell/{story}/index.html", "/target/user-stories-shell/{story}/{story}/**"]
timeout_secs = 3000
[check.matrix]
story = ["agent-mcp", "second-device", "files-in", "calendar-invite", "nextcloud-files", "mail-password", "shared-mailbox", "desktop-easy", "invite-live", "cli-login-ticket", "home-server-joins"]

# The programs the local tilo.sh stack's checks run, and its server's laid-out context: built once
# here, at the release's code and opt-level without its whole-program link (Cargo.toml's
# `lounge-check`), so a check's bring-up compiles nothing. The server and its Discord worker are
# lounge-check-binaries' (the Lounge's page checks run those); this adds the API server, the fake Discord,
# the context's bots, surfaces and font catalog.
# The login wrapper's contract in a disposable container (dist/ci/run-dev-session-test.sh): the
# session scripts, copied into a digest-pinned Ubuntu image rather than mounted, refuse what a
# person's session must when run by a non-root account. Docker creates and starts the container, so
# the check needs a VM of its own; the image is a release the check pulls, at no fixed host list.
[[check]]
name = "dev-session-test"
# Pulls the pinned Ubuntu from Docker Hub, at hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash dist/ci/run-dev-session-test.sh"
# Its setup is not pinned: dnf installs the newest podman Fedora's updates repository holds, from
# mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { DOCKER = "podman" }
requires = ["arch=x86_64"]
isolation = "vm"
on = ["idle", "stable", "dispatch"]

[[check]]
name = "tilo-sh-binaries"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/tilo-sh-binaries.sh /target/publish/tilo-sh /target/publish/lounge-check/binaries /target/publish/lounge/fonts /target/publish/lounge-check/apps"
needs = ["lounge-check-binaries", "lounge-fonts", "lounge-check-apps"]
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/tilo-sh/**"]
git = true
default = false

# The local tilo.sh stack's programs (os/containers/tilo-sh/stack.sh): the server, the Discord
# worker, the API server, the fake Discord, the tilo command with its daemon and the launcher
# every app starts in, in `lounge-check` builds, so a change to the server compiles it once and
# relinks every program at once rather than in checks that wait on each other. It reads no git,
# so a commit that changes none of what it compiles takes the last build; the stack lays the
# server's context out itself.
[[check]]
name = "tilo-sh-programs"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/tilo-sh-programs.sh /target/publish/tilo-sh-programs"
env = { CARGO_BUILD_JOBS = "16" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/tilo-sh-programs/**"]
default = false

# A fresh tilo.sh stack answers an agent's program: brought up from tilo-sh-programs' one build
# with a stub site (nothing opens a page), it takes one small tilolang program at the API server's
# POST /v1/workspaces/{workspace}/programs, sent with the key of the stack's own person, and must
# answer `ok`. The API server starts such a program in tilolang-process, which it looks for beside
# itself: every other check of the stack passes on a build without that program, and this one
# fails there in the API server's own words. Named only: it and the build it needs cost nothing
# until somebody asks for them.
#
# Nested, because the stack's services are sandboxed with bwrap (stack.sh), which needs namespaces
# of its own.
[[check]]
name = "tilo-sh-answers-a-program"
# No egress: the stack and the one call meet on loopback alone.
run = "bash os/containers/tilo-sh/test-program.sh /target/tilo-sh-program"
needs = ["tilo-sh-programs", "lounge-fonts", "tilo-sh-caddy"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh-programs", TILO_SH_FONTS = "/target/publish/lounge/fonts", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy" }
requires = ["arch=x86_64"]
isolation = "nested"
# The stack lays the server's context out itself, from the apps' history (lounge-context.sh).
git = true
outputs = ["/target/tilo-sh-program/answer.json", "/target/tilo-sh-program/state/logs/*.log"]
# What a failure keeps of why: every service's log.
evidence = ["/target/tilo-sh-program/state/logs/**"]
timeout_secs = 900
default = false

# A folder's bulk write survives its holder being killed halfway: on a fresh stack from
# tilo-sh-programs' one build (test-peer-kill-midwrite.sh), thousands of files go into a mounted
# folder, the holder gets SIGKILL halfway while `tilo status` is asked the whole time, and the
# write finishes with nothing the folder acknowledged lost, no status replacing a holder that was
# there, and a holder with nothing kept reading the server's whole tree back.
[[check]]
name = "peer-kill-midwrite"
# Not a default check: the write and its convergence take minutes of a stack.
default = false
# No egress: the holders and the stack meet on loopback alone.
run = "bash os/containers/tilo-sh/test-peer-kill-midwrite.sh /target/peer-kill-midwrite"
needs = ["tilo-sh-programs", "lounge-fonts", "tilo-sh-caddy"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh-programs", TILO_SH_FONTS = "/target/publish/lounge/fonts", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy" }
requires = ["arch=x86_64", "/dev/fuse"]
isolation = "nested"
# The stack lays the server's context out itself, from the apps' history (lounge-context.sh).
git = true
outputs = ["/target/peer-kill-midwrite/state/logs/*.log", "/target/peer-kill-midwrite/state/logs/kill-midwrite/*.log"]
# What a failure keeps of why: every service's log and the write's.
evidence = ["/target/peer-kill-midwrite/state/logs/**"]
timeout_secs = 1800

# A holder that runs for a long time under a large change stays responsive: on a fresh stack from
# tilo-sh-programs' one build (test-peer-kill-midwrite.sh long), files are written, rewritten,
# renamed and removed in a mounted folder for 20 minutes, tens of thousands of them, while
# `tilo status` and `tilo ls` are asked every second; each must answer within 10 seconds, none
# may say the background sync is busy, and the tree must then reach the workspace whole.
[[check]]
name = "peer-long-change"
# Not a default check: it runs for 20 minutes of a stack.
default = false
# No egress: the holder and the stack meet on loopback alone.
run = "bash os/containers/tilo-sh/test-peer-kill-midwrite.sh /target/peer-long-change long"
needs = ["tilo-sh-programs", "lounge-fonts", "tilo-sh-caddy"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names. elfutils is the stack reader a
# process that stalled logs its threads' stacks with.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl elfutils && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
# The server times its own phases at debug, so a stall is told apart from what it waited on.
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh-programs", TILO_SH_FONTS = "/target/publish/lounge/fonts", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SERVER_LOG = "info" }
requires = ["arch=x86_64", "/dev/fuse"]
isolation = "nested"
# The stack lays the server's context out itself, from the apps' history (lounge-context.sh).
git = true
outputs = ["/target/peer-long-change/state/logs/*.log", "/target/peer-long-change/state/logs/kill-midwrite/*.log"]
# What a failure keeps of why: every service's log, the holder's and the run's.
evidence = ["/target/peer-long-change/state/logs/**"]
timeout_secs = 3000

# A git checkout of this repository into a mounted folder runs at the files a second it must
# and survives its holder ending halfway: on a fresh stack from tilo-sh-programs' one build
# (test-peer-kill-midwrite.sh git), the whole checkout is timed from git's progress, then
# checkouts of part of it are under way when the holder gets SIGKILL, is asked to step down by a
# newer program's holder, and gets SIGTERM; each time the folder is shown again, never stale, and
# `git fsck --full` finds the repository whole, and a holder with nothing kept reads the server's
# whole tree back. The figures are in throughput.txt among its outputs.
[[check]]
name = "peer-git-midwrite"
# Not a default check: a checkout of twenty thousand files and its convergence take minutes.
default = false
# No egress: the holders and the stack meet on loopback alone.
run = "bash os/containers/tilo-sh/test-peer-kill-midwrite.sh /target/peer-git-midwrite git"
needs = ["tilo-sh-programs", "lounge-fonts", "tilo-sh-caddy"]
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False openssl git-core elfutils && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh-programs", TILO_SH_FONTS = "/target/publish/lounge/fonts", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy" }
requires = ["arch=x86_64", "/dev/fuse"]
isolation = "nested"
# The repository it checks out is this one, from its history.
git = true
outputs = ["/target/peer-git-midwrite/state/logs/*.log", "/target/peer-git-midwrite/state/logs/kill-midwrite/*"]
# What a failure keeps of why: every service's log and the checkout's.
evidence = ["/target/peer-git-midwrite/state/logs/**"]
timeout_secs = 3600

# Production's Caddy, which serves the local stack's server and site as its tls container and web
# entry image do: the one pinned release (os/containers/tilo-sh/caddy.env), fetched and checked
# here, so a check's bring-up downloads nothing.
[[check]]
name = "tilo-sh-caddy"
# The release archive, checked against the SHA-512 caddy.env pins; GitHub sends it on to its
# release-assets host.
egress = { to = ["github.com:443", "release-assets.githubusercontent.com:443", "objects.githubusercontent.com:443"], pinned = true }
run = "bash tools/ci/publish/tilo-sh-caddy.sh /target/publish/tilo-sh-caddy"
requires = ["arch=x86_64"]
outputs = ["/target/publish/tilo-sh-caddy/**"]
default = false

# The same stack with the VM hosts' own machines in it: tilo.sh's VM host (privileged, with its
# loop-backed state disk and Firecracker) runs here from its image, so a hosted workspace's Browser
# runs in the workspace's VM, on the guest image this checkout built, while the server, the API server and
# the site beside it are this commit's programs. A one-workspace key opens Browser and the
# open is timed; the VM it woke must be a clone of the host's warm template, not a cold boot; the
# agent fills the visa test page with page actions and is asked nothing, the
# person allows a submission and refuses another, a click on the submit button is held; a key
# without the scope is asked about its first page actions; a reviewer joins by invitation and reads
# the run in History; the page actions past the plans file's free ones are refused; the VM is held
# to its proofs - every renderer sandboxed, the session as the image's unprivileged browser user,
# its device key, and what the page costs in memory.
#
# Then the Linux half of the same VM: a Linux command without a card on file is refused with what
# would let it through and runs nothing; the provider puts the account on file and the refused page
# action runs; the workspace's Terminal makes, lists and reads a file in the VM and its run is a
# structured record and a step of History named after the key that ran it; a key scoped to that one
# workspace runs a command through the `tilo` command; the Linux session runs as the tenant, not as
# the Browser's account, and neither reads the other's files; and a Linux GUI app opens in the same
# VM: the agent opens the guest's X11 terminal, a person invited into the workspace sees its window on
# their shell in their own browser and types a command into it, and the file it wrote is read back,
# with the app running as the tenant and its memory measured.
# What it found stays in /target/tilo-sh-local-vm.
#
# A workspace's VM runs at `default`, the size production places (4 vCPU, 8 GiB,
# 50 GiB disk), and the VM host's budget follows it, so the placement here is the
# one a customer's workspace gets: a check that places a smaller VM proves less
# than the deployment does, and one that runs out of room underneath it says so
# in its own log instead of the size being quietly turned down.
[[check]]
name = "tilo-sh-local-vm"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash os/containers/tilo-sh/check-in-vm.sh /target/tilo-sh-local-vm"
# Its setup is not pinned: dnf installs the newest build Fedora's updates repository holds, which
# changes as updates land, from mirrors no fixed list names.
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman util-linux xfsprogs python3-httpx python3-pip openssl && dnf clean all && python3 -m pip install --no-cache-dir blake3", egress = { to = ["0.0.0.0/0", "::/0"] } }
needs = ["tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context", "cli-x86_64", "image-vm-host", "image-hosted-guest"]
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_CLI_DIR = "/target/publish/cli/linux-x86_64", TILO_SH_STATE = "/target/tilo-sh-local-vm-state", TILO_SH_FRESH = "1", TILO_SH_VM_HOST = "1", TILO_SH_IMAGE_VM_HOST = "/target/publish/vm-host/image.oci.tar", TILO_SH_HOSTED_GUEST = "/target/publish/hosted-guest/image", TILO_SH_BROWSER_FREE_ACTIONS = "200" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/tilo-sh-local-vm/**"]
timeout_secs = 5400
default = false

# The developer docs' hosted-Browser example (example `hosted-browser` in
# docs/developers/one-workspace-per-customer.md): the same stack and VM host tilo-sh-local-vm
# runs, brought up for one program, an agent's key opening a workspace's Browser in the
# workspace's own VM and driving a page through the SDKs' generic action call. It is the
# stack a local Tilo serves the book's examples from, so this check runs the one example that
# asks for it rather than reading about it.
#
# Its setup's dnf installs from Fedora's mirrors, which are no fixed host list; the run meets the
# stack, the page it drives and the VM's session on loopback alone.
[[check]]
name = "docs-examples-browser"
on = ["dispatch", "idle", "stable"]
run = "bash os/containers/tilo-sh/test-docs-browser.sh /target/docs-examples-browser"
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman util-linux xfsprogs openssl && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
needs = ["tilo-sh-binaries", "tilo-sh-caddy", "image-web-entry-context", "cli-x86_64", "image-vm-host", "image-hosted-guest"]
env = { TILO_SH_PROGRAMS = "/target/publish/tilo-sh/bin", TILO_SH_LOUNGE = "/target/publish/tilo-sh/lounge", TILO_SH_SITE = "/target/publish/web-entry/context", TILO_SH_CADDY = "/target/publish/tilo-sh-caddy/caddy", TILO_SH_CLI_DIR = "/target/publish/cli/linux-x86_64", TILO_SH_STATE = "/target/docs-examples-browser/state", TILO_SH_FRESH = "1", TILO_SH_VM_HOST = "1", TILO_SH_IMAGE_VM_HOST = "/target/publish/vm-host/image.oci.tar", TILO_SH_HOSTED_GUEST = "/target/publish/hosted-guest/image", TILO_SH_BROWSER_FREE_ACTIONS = "200" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
# The stack lays the server's context out itself, from the apps' history (lounge-context.sh).
git = true
outputs = ["/target/docs-examples-browser/**"]
# What a failure keeps of why: every service's log, which says which of them did not answer.
evidence = ["/target/docs-examples-browser/state/logs/**"]
timeout_secs = 3600

# Releasing the Lounge: t's own image-lounge build of the released commit (the same cached build
# the check runs), with the entrypoint and image tests its check runs, signed with the release key
# and published as `sha-<commit>` on a release tag. Published on dispatch as `dev-<commit>`,
# which is what tilo.sh runs (release-tilo-sh, tools/release/tilo-sh.sh). The release
# needs no registry image made elsewhere first: any commit tagged is released from its own build.
[[check]]
name = "sign-lounge"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/lounge/release\ncp /target/publish/lounge/image.oci.tar /target/publish/lounge/digest /target/publish/lounge/release/\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/lounge /target/publish/lounge/release"
needs = ["image-lounge", "signing-tools"]
outputs = ["/target/publish/lounge/release/payload.json", "/target/publish/lounge/release/signature", "/target/publish/lounge/release/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]

[[check]]
name = "publish-lounge"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/lounge/release\ncp /target/publish/lounge/image.oci.tar /target/publish/lounge/digest /target/publish/lounge/release/\nbash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/lounge /target/publish/lounge/release 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-lounge", "signing-tools"]
# Only a release tag's run can sign (the release key's role trusts v* tags), so a dispatch names
# this and is skipped where that run cannot sign: publishing waits for the answer and pushes the
# channel's tags anyway, a development build without a signature and a release one only with it
# (oci-publish.sh), which is the loud failure a release that cannot sign should get.
needs_any_outcome = ["sign-lounge"]
outputs = ["/target/publish/lounge/release/receipt.json"]
pointers = { lounge = "/target/publish/lounge/release/receipt.json" }
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch", "tag:v[0-9]*.[0-9]*.[0-9]*"]

# The registry server: this tree is its context, and the compiler-cache client it installs is the
# fetched asset cache, a named context of `os-assets`' outputs. So t plans it instruction by
# instruction and caches each on what it reads, and the compile `COPY . .` precedes runs in the
# image, as the Containerfile says, with the caches it mounts empty for each step.
[[check]]
name = "image-registry-server"
# Its cargo step fetches the crates its Cargo.lock names by checksum.
egress = { to = ["index.crates.io:443", "static.crates.io:443"], pinned = true }
build = { containerfile = "crates/core/registry-server/container/Containerfile", context = ".", contexts = { github-assets = { check = "os-assets", path = "os/external-assets/cache" } } }
needs = ["os-assets"]
requires = ["arch=x86_64"]
timeout_secs = 7200
default = false

# The image before it is signed or published: non-root, Tilo's trust bundle where the patched
# client looks for it, the reviewed offline-root commands, and a server that initializes a fresh
# state directory and answers /health. It runs in the buildah image, which loads the archive
# without a daemon, in a micro-VM step because buildah needs root over throwaway mounts.
[[check]]
name = "test-image-registry-server"
# Pulls and builds container images whose packages come from mirrors and registries no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash crates/core/registry-server/container/test-image.sh /target/images/image-registry-server/image.oci.tar"
needs = ["image-registry-server"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
default = false

# Signing and publishing read the build's archive and digest beside it: they name the image the
# build made, at the path the build leaves it, and copy the two files where oci-sign.sh and
# oci-publish.sh expect the build's output.

[[check]]
name = "sign-registry-server"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/registry-server\ncp /target/images/image-registry-server/image.oci.tar /target/images/image-registry-server/digest /target/publish/registry-server/\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/tilo-registry-server /target/publish/registry-server"
needs = ["image-registry-server", "signing-tools"]
outputs = ["/target/publish/registry-server/payload.json", "/target/publish/registry-server/signature", "/target/publish/registry-server/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
# The release key's token reaches release tags only (a dispatch of main is refused it), so
# this applies there; a dispatch of main publishes the server's development tag unsigned.
on = ["tag:v*"]

[[check]]
name = "publish-registry-server"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/registry-server\ncp /target/images/image-registry-server/image.oci.tar /target/images/image-registry-server/digest /target/publish/registry-server/\nbash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/tilo-registry-server /target/publish/registry-server 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-registry-server", "signing-tools"]
optional_needs = ["sign-registry-server"]
outputs = ["/target/publish/registry-server/receipt.json"]
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch"]

# The hosted VM host (os/containers/tilo-vm-host): the service that runs tilo.sh workspaces'
# Linux programs in jailed Firecracker VMs, its jail helper, Firecracker and pasta. Its programs
# are t's own compile (vm-host-binaries, cached like every other build here), so the image is
# packaging only: the pinned Fedora base, the runtime packages from the frozen RPM snapshot and
# the pinned Firecracker release as a named context. Tested in a micro-VM, and published on
# dispatch as dev-<commit> for the infra repository's apps/tilo-sh-vm-host to pin, signed on a
# release tag.
[[check]]
