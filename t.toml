# blob read with a redirect into its object storage, named here as `pins` names it.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "bash os/image/build-layer.sh base x86_64 /target/os/x86_64/base"
