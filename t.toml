default = false

# Release trust as installed systems apply it: the committed operational certificates still
# chain to the release root, certify the KMS keys CI signs with and have time left
# (tools/signing/release_trust.py), and skopeo, the verifier bootc updates through, accepts the
# shipped policy's release chain and refuses expired, foreign, revoked and unlogged signatures
# (os/tests/release_trust_chain_native.py). Root in a micro-VM step, for the packages it installs.
[[check]]
name = "release-trust"
run = """
dnf install -y --setopt=install_weak_deps=False skopeo openssl >/dev/null
python3 tools/signing/release_trust.py check-committed
python3 os/tests/release_trust_chain_native.py
"""
requires = ["arch=x86_64"]
isolation = "vm"
# One small micro-VM run, keyed by what it reads, which few commits change: on release candidates,
# when dispatched, and on main's newest head when t has room (`idle`), keyed per commit and
# bisected to the commit that broke it. release-trust-expiry checks the certificates every day,
# and suite-release-trust the policy's generator on every push.
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

# The certificates again every day, uncached: one nearing expiry fails here, with the renewal
# step in its message, two weeks before signing would refuse it.
[[check]]
name = "release-trust-expiry"
run = """
dnf install -y --setopt=install_weak_deps=False openssl >/dev/null
python3 tools/signing/release_trust.py check-committed
"""
requires = ["arch=x86_64"]
isolation = "vm"
cache = false
on = ["schedule:20 5 * * *", "dispatch"]
# Only then: as a default check it would run, uncached, on every push to main.
default = false

