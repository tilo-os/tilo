"\nchown 1000:1000 \"$home\"\nfor test in \\\n  serve_handoff::a_terminal_gets_a_shell_in_its_environment_over_the_service_socket \\\n  serve_handoff::a_new_session_runs_ushs_own_shell_and_marks_its_runs \\\n  serve_handoff::a_tilo_side_session_starts_its_guest_for_the_first_program_only \\\n  serve_handoff::terminals_in_two_workspaces_run_two_environments_each_with_its_own_files \\\n  serve_handoff::a_guest_that_cannot_be_set_up_says_so_on_its_lease_and_nothing_on_its_terminal \\\n  serve_handoff::the_public_ush_alias_creates_default_and_runs_a_confined_command \\\n  serve_handoff::a_guest_reaches_the_session_through_its_own_agent_door \\\n  serve_handoff::a_sandbox_that_cannot_be_built_is_explained \\\n  serve_handoff::the_shipped_service_reexecs_the_same_elf_when_its_launch_path_is_unlinked \\\n  serve_handoff::each_workspace_lists_its_own_environments_and_an_app_cannot_name_another \\\n  helper_runtime::dynamic_helper_starts_from_private_closure_without_host_usr_and_keeps_shim_dispatch \\\n  network::a_guest_whose_hosts_cannot_be_enforced_does_not_start; do\n  one setpriv --reuid=1000 --regid=1000 --clear-groups \\\n    env HOME=\"$home\" TMPDIR=\"$home\" /target/vm/ush-it --exact \"$test\"\ndone\n"
