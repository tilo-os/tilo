# catalog.json are checked in as the source and the image's catalog. `t dispatch
# publish-model-catalog --ref stable` then builds the compiler, signs the reviewed catalog (which
# must reproduce the checked-in one) and uploads it with the runtime archives it names. Dev images
# carry model-catalog-dev-<arch>'s catalog instead: the same source with the runtimes of their own
# tree, signed with a throwaway key their own signature vouches for; main publishes each runtime's
# archive (publish-model-runtime-<id>) when t has room. The compiler is built without
# credentials; only the release signing checks hold TILO_MODEL_CATALOG_SIGNING_KEY and only the
# publishing ones a package token. Forgejo's generic package registry does not take t's identity
# tokens, so that one is a stored secret. Checks holding a secret run as micro-VM steps, which t
# boots on x86_64 only for now.
[[check]]
name = "model-catalog-compiler"
run = "bash tools/release/local-model-catalog.sh compiler /target/model-catalog/bin"
# Keyed by what the compiler is built from, so the dev catalogs and the dev images waiting for
# them build again only when it changes.
outputs = ["/target/model-catalog/bin/tilo-model-catalog"]
default = false

[[check]]
name = "sign-model-catalog"
run = "bash tools/release/local-model-catalog.sh sign /target/model-catalog/bin/tilo-model-catalog /target/model-catalog/signed"
needs = ["model-catalog-compiler", "local-model-runtime-llama-cpp-cpu-x86_64", "local-model-runtime-llama-cpp-cpu-aarch64", "local-model-runtime-llama-cpp-vulkan-x86_64", "local-model-runtime-llama-cpp-vulkan-aarch64", "local-model-runtime-llama-cpp-cuda-x86_64", "local-model-runtime-vllm-cuda-x86_64"]
outputs = ["/target/model-catalog/signed/catalog.json", "/target/model-catalog/signed/keys.json"]
secrets = ["TILO_MODEL_CATALOG_SIGNING_KEY"]
requires = ["arch=x86_64"]
on = ["dispatch"]

[[check]]
name = "publish-model-catalog"
run = "bash tools/release/local-model-catalog.sh publish /target/model-catalog/signed"
needs = ["sign-model-catalog", "local-model-runtime-llama-cpp-cpu-x86_64", "local-model-runtime-llama-cpp-cpu-aarch64", "local-model-runtime-llama-cpp-vulkan-x86_64", "local-model-runtime-llama-cpp-vulkan-aarch64", "local-model-runtime-llama-cpp-cuda-x86_64", "local-model-runtime-vllm-cuda-x86_64"]
secrets = ["REGISTRY_TOKEN"]
requires = ["arch=x86_64"]
on = ["dispatch"]

[[check]]
name = "review-model-catalog"
run = "bash tools/release/local-model-catalog.sh review /target/model-catalog/bin/tilo-model-catalog /target/model-catalog/review"
needs = ["model-catalog-compiler", "local-model-runtime-llama-cpp-cpu-x86_64", "local-model-runtime-llama-cpp-cpu-aarch64", "local-model-runtime-llama-cpp-vulkan-x86_64", "local-model-runtime-llama-cpp-vulkan-aarch64", "local-model-runtime-llama-cpp-cuda-x86_64", "local-model-runtime-vllm-cuda-x86_64"]
