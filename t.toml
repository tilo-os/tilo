run = "set -eu\n# The fixture starts a user manager for the account and the supervisor places each check in a\n# service of it, so it must be the guest's root. If t ever stops giving the guest root, fail\n# here instead of letting the fixture skip.\nif [ \"$(id -u)\" != \"0\" ]; then\n  echo \"approved-checks: expected euid 0 in the micro-VM, got $(id -u)\" >&2\n  exit 1\nfi\nmkdir -p \"$TMPDIR\"\nprintf 'guest euid %s; controllers [%s]\\n' \"$(id -u)\" \"$(cat /sys/fs/cgroup/cgroup.controllers 2>&1)\"\n# The fixture runs itself in a process of its own, whose streams the harness keeps until it\n# ends: it writes each step to this file, which the check streams as it runs, so a step that\n# waits is visible while it waits.\nsteps=\"$TMPDIR/approved-checks-steps.log\"\n: > \"$steps\"\ntail -n +1 -F \"$steps\" >&2 &\nfollow=$!\nset -o pipefail\n# The window that lays a view out sets its text in the pinned font catalog the build prepared, which the app's sandbox mounts: this check reaches no network.\nexport TILO_FONT_ASSET_CACHE=/target/font-artifacts\nexport TILO_FONT_ASSETS_OFFLINE=1\nstatus=0\nTILO_APPROVED_CHECKS_FIXTURE=1 \\\n  TILO_APPROVED_CHECKS_USH=/target/vm/tilo-ush \\\n  TILO_SIBLING_BIN_tilolang_process=/target/vm/tilolang-process \\\n  TILO_SIBLING_BIN_tilo_launcher=/target/vm/tilo-launcher \\\n  /target/vm/tilo-daemon-approved-checks --exact \\\n    language::approved_checks::a_projects_host_runs_its_approved_checks_and_removal_refuses_the_next \\\n    --nocapture --test-threads=1 2>&1 | tee \"$TMPDIR/fixture.log\" || status=$?\nkill \"$follow\" 2>/dev/null || true\nif [ \"$status\" != \"0\" ]; then\n  echo \"approved-checks: the fixture failed with $status\" >&2\n  exit \"$status\"\nfi\n# A filter that matches nothing still exits 0: the fixture must have run and passed.\n# The micro-VM's PATH carries neither grep nor cat, so the shell reads the fixture's log with\n# its own builtins.\nran=0\nwhile IFS= read -r line; do\n  case \"$line\" in\n    \"test result: ok. 1 passed\"*) ran=1 ;;\n  esac\ndone < \"$TMPDIR/fixture.log\"\nif [ \"$ran\" != 1 ]; then\n  echo \"approved-checks: the fixture did not run\" >&2\n  exit 1\nfi\n"
