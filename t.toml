[[check]]
name = "provenance-rpms-{arch}"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/rpms-provenance.sh {arch} /target/publish/rpms"
