[[check]]
name = "chromium-host"
run = "bash tools/ci/ensure-browser-dependencies.sh\ncommand -v cmake >/dev/null || dnf install -y cmake\npython3 scripts/browser/build-host.py --jobs 8\nctest --test-dir target/chromium-build --output-on-failure\n# Chromium refuses root, and the host never turns its sandbox off: the page tests run as a user.\nchmod -R a+rX target/chromium apps/browser/chromium/tests apps/browser/chromium/src apps/browser/assets/extension-manager apps/browser/src/extension_toolbar.rs\nmkdir -p -m 1777 /tmp/host-test\n# Every suite runs, so one that fails does not hide the ones after it; the check\n# fails at the end and names each suite that did.\nfailed=\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/document_size.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  document_size\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/privacy_defaults.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  privacy_defaults\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/pointer_input.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  pointer_input\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/ime_composition.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  ime_composition\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/page_popups.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_popups\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/tabs.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  tabs\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/navigation.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  navigation\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/native_regressions.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  native_regressions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/page_dialogs.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_dialogs\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/page_clipboard.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_clipboard\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/context_menu.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  context_menu\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/adblock_extension.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  adblock_extension\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/extensions.py target/chromium/tilo-chromium-host Extensions.test_mv3_worker_storage_content_and_action RuntimeExtensions.test_load_unload_and_denied_methods; } || failed=\"$failed\\n  extensions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/extension_toggle.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  extension_toggle\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-use