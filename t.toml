# The server OS's base and the layer above it (os/Containerfile.host-base, Containerfile.host).
# Splitting them is what makes a server change cheap: the base is the mirrored bootc base and the
# frozen package set, with the tools that seal its UKI, which change only when those do, and t
# serves it to every commit that keeps them; the image is the server's programs and the files that
# name them, one copying layer, sealed by the desktop's own stages into one UKI.
# Together they are the dev loop: `t test test-image-host host-assurance-x86_64` builds the
# changed programs, lays them on the cached base, seals the result and boots it in a VM, signed
# with throwaway keys, without publishing anything.
#
# The date each is built at, oci-build.sh's SOURCE_DATE_EPOCH: the commit time of the newest
# commit that changed a file the image is built from (source-date.sh). Only these read Git, so
# only they are kept per commit, and each takes a second; the builds need the date, not the
# commit, so a commit that changes none of their files builds the same image again.
[[check]]
name = "source-date-host-base"
run = "bash tools/ci/publish/source-date.sh /target/source-date/host-base os/Containerfile.host-base os/image/helpers/uki-tools.Containerfile os/dev/uki-tools.packages os/dev/uki.sh os/dev/uki-hardware-profile.py os/dev/hardware_profile.py os/dev/make-boot-splash.py os/base-snapshot.env os/external-assets/github-assets.tsv os/dev/cache-github-assets.sh tools/ci/publish/host-base.sh tools/ci/publish/lib.sh"
git = true
outputs = ["/target/source-date/host-base"]
default = false

[[check]]
name = "source-date-host"
run = "bash tools/ci/publish/source-date.sh /target/source-date/host os/Containerfile.host os/image/boot.Containerfile os/containers/tilo-vm-host/hosted-jail.json os/etc/containers os/etc/modules-load.d/tilo-hosted.conf os/usr/libexec os/usr/lib/bootc os/usr/lib/systemd/system os/usr/lib/systemd/system-generators os/usr/lib/dracut/modules.d os/usr/lib/sysusers.d os/usr/lib/tmpfiles.d os/scripts/build-initramfs.sh os/scripts/verify-board-initramfs.py keys/cosign.pub keys/release keys/tpm2-pcr-signing.public.pem docs/recovery.md docs/app-model/environments.md tools/ci/publish/host-build.sh tools/ci/publish/lib.sh"
git = true
outputs = ["/target/source-date/host"]
default = false

# The development server image's date: the same stages as the server image's, built on the same
# base, with os/Containerfile.host-dev's additions (the device steps' runtime and the dev-VM CLI,
# their units, base.json), which host-build.sh --dev appends. It names every one of those files, so the image's
# date moves when any changes, and an unchanged set of them is the same image again.
[[check]]
name = "source-date-host-dev"
run = "bash tools/ci/publish/source-date.sh /target/source-date/host-dev os/Containerfile.host os/image/boot.Containerfile os/Containerfile.host-dev os/components.toml os/usr/lib/tilo/node-server.toml os/scripts/install-components.py os/scripts/finalize-dev-image.py Cargo.lock crates/os/tilo-device-steps/data os/containers/tilo-vm-host/hosted-jail.json os/etc/containers os/etc/modules-load.d/tilo-hosted.conf os/etc/polkit-1/rules.d/49-tilo-device-steps.rules os/usr/libexec os/usr/lib/bootc os/usr/lib/systemd/system os/usr/lib/systemd/system-generators os/usr/lib/dracut/modules.d os/usr/lib/sysusers.d os/usr/lib/tmpfiles.d os/scripts/build-initramfs.sh os/scripts/verify-board-initramfs.py keys/cosign.pub keys/release keys/tpm2-pcr-signing.public.pem docs/recovery.md docs/app-model/environments.md tools/ci/publish/host-build.sh tools/ci/publish/lib.sh keys/cosign-dev.pub"
git = true
outputs = ["/target/source-date/host-dev"]
default = false

# The generation the server image carries: the next of the server's own dense series, the gen<N>
# tags of registry.tilo.so/tilo/tilo-host, each verified by its signature and its provenance
# (os/dev/next-generation.sh). Read afresh in every run, so the image a release builds carries the
# number after the last one published.
[[check]]
name = "generation-host"
# Reads the series from the registry, which a release moves on, so it is asked in every run and
# not pinned (seconds); cosign checks each signature against Sigstore's log, as `pins` does. It runs
# in the OS assembler image, which carries jq and skopeo, so it installs nothing.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443", "tuf-repo-cdn.sigstore.dev:443", "rekor.sigstore.dev:443"] }
run = "set -euo pipefail\n. tools/ci/publish/lib.sh\nuse_cosign\nmkdir -p /target/generation-host\nTILO_PUBLISH_REPO=registry.tilo.so/tilo/tilo-host TILO_ALLOW_EMPTY_SERIES=1 bash os/dev/next-generation.sh > /target/generation-host/generation\nprintf 'generation %s\\n' \"$(cat /target/generation-host/generation)\""
needs = ["signing-tools"]
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/generation-host/generation"]
default = false

[[check]]
name = "host-base"
# Pinned: it pulls the mirrored base and the frozen RPM snapshot by digest, both of which this
# run's files name (os/base-snapshot.env, the snapshot reference), and the Firecracker release
# from the checksum-verified external assets, which its files and the assets' list decide.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "SOURCE_DATE_EPOCH=$(cat /target/source-date/host-base)\nexport SOURCE_DATE_EPOCH\nbash tools/ci/publish/host-base.sh /target/publish/rpm-snapshot/x86_64 /target/publish/rpms/x86_64 /target/publish/host-base"
needs = ["source-date-host-base", "rpm-snapshot-x86_64", "image-rpms-x86_64", "os-assets-host"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/host-base/image.oci.tar", "/target/publish/host-base/digest", "/target/publish/host-base/rpms-source", "/target/publish/host-base/uki-tools/image.oci.tar", "/target/publish/host-base/uki-tools/digest"]
timeout_secs = 7200
default = false

[[check]]
name = "host-binaries"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/server-binaries.sh host /target/publish/host/binaries"
# One feature resolution for the whole server; the links are most of a server
# build, and the compiler cache the builder gives this check is what keeps a
# one-crate change at a relink.
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/host/binaries/**"]
timeout_secs = 7200
