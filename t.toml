# The image's boot loader signed with the release key, before the seal: systemd-boot
# sits in the rootfs and `bootc install` copies its `.efi.signed` companion to the
# ESP, so the signature has to be inside the image the seal describes. Only a
# release does this; a branch run has no key, as it has none for the UKIs either.
[[check]]
name = "sign-host-loader"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/sign-boot-loader.sh /target/publish/host /target/publish/host-loader-signed"
needs = ["image-host", "os-assets", "signing-tools"]
env = { AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_EFI_SIGNING_KMS_KEY = "arn:aws:kms:us-east-1:125650147312:alias/tilo-efi-signing", TILO_PCR_SIGNING_KMS_KEY = "arn:aws:kms:us-east-1:125650147312:alias/tilo-pcr-prediction" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/host-loader-signed/**"]
# The release key's token reaches release tags only (a dispatch of main is refused it), so this
# applies there; a dispatch of main seals the host image as it is, as seal-host's own fallback
# says.
on = ["tag:v*"]
id_token = ["sts.amazonaws.com"]

# The image sealed: its UKI's composefs digest the one `bootc install` computes from its layers,
# by the resealing bootc a sealed dev image takes it from (tools/ci/seal-dev-image.sh), and what
# its boot signing signs prepared beside it (host-seal.sh seal). Everything after signs, boots or
# publishes this image; a release's is the one sign-host-loader signed the boot loader into.
[[check]]
name = "seal-host"
# Pinned: it runs in the OS assembler image, which carries what sealing takes from the frozen
# snapshot, with the resealing bootc bootc-reseal-x86_64 built, and pulls only the pinned base by
# digest.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "image=/target/publish/host-loader-signed\nif [ ! -s \"$image/image.oci.tar\" ]; then\n  image=/target/publish/host\n  case \"${T_REF:-}\" in tag:*) echo 'a release signs its boot loader before it seals; sign-host-loader produced nothing' >&2; exit 1 ;; esac\nfi\nbash tools/ci/publish/host-seal.sh seal \"$image\" /target/publish/host-sealed"
needs = ["image-host", "bootc-reseal-x86_64"]
optional_needs = ["sign-host-loader"]
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
env = { TILO_BOOTC_RESEAL = "/target/bootc-reseal/x86_64/bootc" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/host-sealed/**"]
timeout_secs = 3600
default = false

# The development server image, never a release (os/Containerfile.host-dev): the server image's
# own stages, built on the base as image-host builds them, then the device steps' runtime and the
# dev-VM CLI, their boot units, a base.json naming how the programs were built, and systemd-sysext
# merging layers at boot, sealed as the server image is. An installed one takes a rebuilt
# component as a layer, which a retry of the install proof swaps in instead of rebuilding the
# image and its medium.
#
# It builds nothing of the release server image (host-binaries, image-host): its programs are
# compiled without LTO, as the development OS is compiled, so a change to one costs that crate's
# compile and the links, and its image build follows on the base. The programs are compiled by the
# same check image as host-binaries compiles the server's, so the layers a check builds later
# (`tilo-vm layer-pack`) carry the target, toolchain and builder its daemon admits.
[[check]]
name = "host-binaries-dev"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "TILO_SERVER_LTO=off bash tools/ci/publish/server-binaries.sh host host-dev /target/publish/host-dev/binaries"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/host-dev/binaries/**"]
timeout_secs = 7200
default = false

[[check]]
name = "image-host-dev"
# No network: the base, the sealing tools and the bootc come from host-base's archives and
# os-tools-x86_64's layout, and the layer copies programs and files the tree holds.
run = "SOURCE_DATE_EPOCH=$(cat /target/source-date/host-dev)\nexport SOURCE_DATE_EPOCH\nbash tools/ci/publish/host-build.sh --dev /target/publish/host-dev/binaries /target/publish/host-base /target/os/x86_64/tools /target/generation-host/generation /target/publish/host-dev"
needs = ["source-date-host-dev", "host-base", "host-binaries-dev", "generation-host", "os-tools-x86_64"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/host-dev/image.oci.tar", "/target/publish/host-dev/digest", "/target/publish/host-dev/rpms-source", "/target/publish/host-dev/generation", "/target/publish/host-dev/base.json"]
timeout_secs = 3600
default = false

[[check]]
name = "seal-host-dev"
# Pinned, as seal-host: the OS assembler image and the pinned base by digest.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "bash tools/ci/publish/host-seal.sh seal /target/publish/host-dev /target/publish/host-dev-sealed"
needs = ["image-host-dev", "bootc-reseal-x86_64"]
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
env = { TILO_BOOTC_RESEAL = "/target/bootc-reseal/x86_64/bootc" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/host-dev-sealed/**"]
timeout_secs = 3600
default = false

[[check]]
name = "test-image-host-dev"
# No network: it pulls the sealed image out of seal-host-dev's archive, runs what is in it, and
# compares its bootc with the one os-tools-x86_64 built.
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/tests/host_image.sh --dev /target/publish/host-dev-sealed/image.oci.tar /target/os/x86_64/tools"
needs = ["seal-host-dev", "os-tools-x86_64"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
