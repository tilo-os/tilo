hare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/document_size.py /tmp/host-test/sandboxed-host; } || failed=\"$failed\\n  document_size (as a Browser launch starts the engine)\"\n# Frames reach the app through the memory it hands the sandboxed engine.\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/frame_transport.py --transport memory /tmp/host-test/sandboxed-host; } || failed=\"$failed\\n  frame_transport (as a Browser launch starts the engine)\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/resize_frames.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  resize_frames\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/frame_transport.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  frame_transport\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 apps/browser/chromium/tests/frame_damage.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  frame_damage\"\n\n[ -z \"$failed\" ] || { printf 'engine suites that failed:%b\\n' \"$failed\" >&2; exit 1; }"
