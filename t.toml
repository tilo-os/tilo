# Compile and install before any metered twin starts. Artifacts carry exact
# binary checksums; t's cargo graph and needs/outputs bind them to the inputs.
[[check]]
name = "cloud-rystic-build"
run = """
python3 tools/ci/rystic_ci.py build --artifacts "$CARGO_TARGET_DIR/rystic-ci"
python3 tools/ci/rystic_ci.py install-cli --artifacts "$CARGO_TARGET_DIR/rystic-ci"
"""
outputs = ["/target/rystic-ci/**"]
requires = ["arch=x86_64", "os=linux"]
default = false

# Informational on relevant main changes; never grants credentials to a local
# snapshot or fork. Unchanged inputs reuse the result rather than another lease.
[[check]]
name = "cloud-rystic"
run = "bash tools/ci/run-rystic-ci.sh supported"
needs = ["cloud-rystic-build"]
outputs = ["/target/rystic-results/**"]
requires = ["arch=x86_64", "os=linux"]
isolation = "vm"
secrets = ["RYSTIC_CI_TOKEN"]
on = ["main", "dispatch"]
default = false

# Exercise unchanged pinned releases once a week as well as source changes.
[[check]]
