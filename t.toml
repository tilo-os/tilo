  and ([.files[] | select(.role == "disk")] | length) == 1
' "$TILO_RUN/disk-input.json" >/dev/null
file=$(jq -er '.files[] | select(.role == "disk") | .file' "$TILO_RUN/disk-input.json")
[[ $file =~ ^tilo-vm-[A-Za-z0-9._-]+\.qcow2$ ]]
url=$(jq -er '.files[] | select(.role == "disk") | .url' "$TILO_RUN/disk-input.json")
[[ $url == "$base/$file" ]]
sha=$(jq -er '.files[] | select(.role == "disk") | .sha256' "$TILO_RUN/disk-input.json")
[[ $sha =~ ^[0-9a-f]{64}$ ]]
curl --fail --location --retry 3 --output "$TILO_RUN/$file" "$url"
(cd "$TILO_RUN" && printf '%s  %s\n' "$sha" "$file" | sha256sum -c -)
qemu-img check -f qcow2 "$TILO_RUN/$file"
TILO_DISK="$TILO_RUN/$file"

[[ $RENDERER_VARIANT == gpu || $RENDERER_VARIANT == gpu-generic-cpu || $RENDERER_VARIANT == vello-cpu || $RENDERER_VARIANT == gl-softpipe || $RENDERER_VARIANT == lp-zero || $RENDERER_VARIANT == lp-no-rast ]] || {
  echo '::error::renderer_variant must be gpu, gpu-generic-cpu, vello-cpu, gl-softpipe, lp-zero, or lp-no-rast'
  exit 1
}
[[ $CPU_VARIANT == host || $CPU_VARIANT == host-no-sve ]] || {
  echo '::error::cpu_variant must be host or host-no-sve'
  exit 1
}
[[ $CAPTURE_FAULT_PC == true || $CAPTURE_FAULT_PC == false ]] || {
  echo '::error::capture_fault_pc must be true or false'
  exit 1
}
[[ $CHECK_DESKTOP == true || $CHECK_DESKTOP == false ]] || exit 2
[[ $CHECK_BOOT_PERFORMANCE == true || $CHECK_BOOT_PERFORMANCE == false ]] || exit 2
[[ $DEV_UKI_BOOT == true || $DEV_UKI_BOOT == false ]] || exit 2
[[ $COLD_BOOT == true || $COLD_BOOT == false ]] || exit 2
[[ $DEV_UKI_BOOT == false || $TILO_VM_ARCH == x86_64 ]] || exit 2
[[ $TILO_VM_ARCH == aarch64 || ( $CPU_VARIANT == host && $CAPTURE_FAULT_PC == false ) ]] || exit 2
[[ $OVERRIDE_SESSION_WRAPPER == true || $OVERRIDE_SESSION_WRAPPER == false ]] || exit 2
[[ $SHARED_DISK_ESP == true || $SHARED_DISK_ESP == false ]] || exit 2
[[ $SHARED_DISK_ESP == false || -n $UPGRADE_IMAGE ]] || {
  echo '::error::shared_disk_esp checks the bootc of upgrade_image; name one'
  exit 1
}
# bootc refuses to switch to the image of an existing deployment, so
# the target is a third one.
[[ $SHARED_DISK_ESP == false || ( $SHARED_DISK_SWITCH_IMAGE =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ && $SHARED_DISK_SWITCH_IMAGE != "$UPGRADE_IMAGE" ) ]] || {
  echo '::error::shared_disk_switch_image must pin a tilo-vm dev image digest other than upgrade_image'
  exit 1
}
[[ -z $UPGRADE_IMAGE || $UPGRADE_IMAGE =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ ]] || {
  echo '::error::upgrade_image must pin a tilo-vm dev image digest'
  exit 1
}
# The assessment counts this disk's own boot loader entries: a foreign
# ESP or a generated diagnostic UKI would change what it counts.
[[ -z $BOOT_ASSESSMENT_IMAGE || ( $BOOT_ASSESSMENT_IMAGE =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ \
   && $BOOT_ASSESSMENT_IMAGE != "$UPGRADE_IMAGE" && $SHARED_DISK_ESP == false && $DEV_UKI_BOOT == false ) ]] || {
  echo '::error::boot_assessment_image must pin a tilo-vm dev image digest other than upgrade_image, without shared_disk_esp or dev_uki_boot'
  exit 1
}
[[ $BOOT_ASSESSMENT_FAULT == greetd || $BOOT_ASSESSMENT_FAULT == greeter || $BOOT_ASSESSMENT_FAULT == unlock ]] || {
  echo '::error::boot_assessment_fault must be greetd, greeter or unlock'
  exit 1
}
export TILO_KVM_CPU_VARIANT="$CPU_VARIANT"
overlay="$TILO_RUN/smoke.qcow2"
qemu-img create -f qcow2 -F qcow2 -b "$TILO_DISK" "$overlay" >/dev/null
guest_evidence() {
  timeout --kill-after=5s 20s ./os/dev/vm.sh ssh "$@"
}
host_observer_pid=
host_evidence() {
  printf '\nTILO_HOST_PROGRESS time=%s\n' "$(date -u +%FT%TZ)"
  timeout --kill-after=1s 3s df -h "$TILO_RUN" || true
  timeout --kill-after=1s 3s df -i "$TILO_RUN" || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh status || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh cmd 'info status' || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh cmd 'info block' || true
}
finish() {
  status=$?
  if [[ -n $host_observer_pid ]]; then
    kill "$host_observer_pid" 2>/dev/null || true
    wait "$host_observer_pid" 2>/dev/null || true
  fi
  host_evidence >> "$TILO_RUN/host-switch.log" 2>&1 || true
  # A session can exit before the portal appears. Preserve its flight
  # recorder, rather than only the SSH chatter on the serial console.
  guest_evidence 'cat "$HOME/.local/state/tilo/session-logs/latest.log"' > "$TILO_RUN/desktop-session.log" 2>&1 || true
  guest_evidence 'cat "$HOME/.local/state/tilo/session-logs/frame-trace.csv"' > "$TILO_RUN/frame-trace.csv" 2>&1 || true
  guest_evidence 'printf "user=%s runtime=%s bus=%s\n" "$(id -un)" "${XDG_RUNTIME_DIR:-unset}" "${DBUS_SESSION_BUS_ADDRESS:-unset}"; busctl --user --timeout=3 status org.freedesktop.impl.portal.desktop.tilo; printf "portal_status=%s\n" "$?"; wc -l "$HOME/.local/state/tilo/session-logs/frame-trace.csv"; systemctl --user --no-pager --failed' > "$TILO_RUN/desktop-readiness.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' journalctl -b -u greetd --no-pager" > "$TILO_RUN/greetd.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' journalctl -b --no-pager _UID=1000" > "$TILO_RUN/user-session.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' dmesg --color=never" > "$TILO_RUN/kernel.log" 2>&1 || true
  guest_evidence 'systemd-analyze; systemctl show --property=InitRDTimestampMonotonic --property=UserspaceTimestampMonotonic --property=FirmwareTimestampMonotonic --property=LoaderTimestampMonotonic' > "$TILO_RUN/boot-phases.log" 2>&1 || true
  if (( status != 0 )); then
    timeout --kill-after=5s 20s ./os/dev/vm.sh cmd "screendump $TILO_RUN/boot-failure.ppm" >/dev/null 2>&1 || true
    timeout --kill-after=5s 30s bash ./os/dev/diagnose-boot-failure.sh || true
  fi
  ./os/dev/vm.sh stop || true
  rm -f -- "$overlay"
  return "$status"
}
trap finish EXIT
./os/dev/vm.sh boot --2d --disk "$overlay"
ready=false
for attempt in $(seq 1 120); do
  if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
  sleep 1
done
[[ $ready == true ]] || { echo '::error::candidate boot did not accept SSH'; exit 1; }
if [[ -n $UPGRADE_IMAGE ]]; then
  # Reuse the candidate's installed disk. bootc fetches changed layers;
  # the original disk remains immutable underneath this overlay.
  old_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id')
  # Noninteractive bootc can stay silent while fetching or sealing.
  # Keep one switch running, report its I/O and storage, and bound it
  # before the whole job expires so finish() can collect evidence.
  cat > "$TILO_RUN/guest-switch.sh" <<'GUEST_SWITCH'
#!/usr/bin/env bash
set -euo pipefail
mount -o remount,rw /boot
timeout --kill-after=10s 20m bootc switch "$1" &
switch_pid=$!
(
  while kill -0 "$switch_pid" 2>/dev/null; do
    printf '\nTILO_SWITCH_PROGRESS time=%s\n' "$(date -u +%FT%TZ)"
    timeout --kill-after=1s 3s df -h /sysroot /var /boot || true
    timeout --kill-after=1s 3s df -i /sysroot /var /boot || true
    timeout --kill-after=1s 3s ps -C bootc -o pid,etime,time,stat,wchan:24 || true
    for pid in $(timeout --kill-after=1s 3s pgrep -x bootc || true); do
      printf 'bootc pid=%s\n' "$pid"
      timeout --kill-after=1s 3s cat "/proc/$pid/io" 2>/dev/null || true
    done
    sleep 15
  done
) &
observer_pid=$!
trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
result=0
wait "$switch_pid" || result=$?
printf 'TILO_SWITCH_DONE exit_code=%s\n' "$result"
exit "$result"
GUEST_SWITCH
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/guest-switch.sh" "$TILO_USER@127.0.0.1:/tmp/guest-switch.sh"
  # A paused QEMU cannot run the guest's sampler or timeout. Observe
  # the host independently to distinguish disk I/O errors from a
  # running guest that has stopped responding over SSH.
  (
    while true; do
      host_evidence
      sleep 15
    done
  ) > >(tee "$TILO_RUN/host-switch.log") 2>&1 &
  host_observer_pid=$!
  timeout --kill-after=10s 22m ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-switch.sh '$UPGRADE_IMAGE'" \
    | tee "$TILO_RUN/image-switch.log"
  kill "$host_observer_pid" 2>/dev/null || true
  wait "$host_observer_pid" 2>/dev/null || true
  host_observer_pid=
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 120); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::dev image upgrade did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootc status --json" > "$TILO_RUN/bootc-status.json"
  jq -e --arg image "$UPGRADE_IMAGE" '.status.booted.image.image.image == $image' "$TILO_RUN/bootc-status.json" >/dev/null || {
    echo '::error::guest did not boot the requested dev image'
    exit 1
  }
  cat "$TILO_RUN/bootc-status.json"
fi
if [[ $SHARED_DISK_ESP == true ]]; then
  # A disk shared with Windows: its ESP comes first. The overlay
  # grows by the room the foreign ESP takes, which the root must not
  # grow into; the guest adds it (os/tests/shared_disk_esp.sh) and
  # boots with it in place.
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh hold-size"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl poweroff" || true
  stopped=false
  for attempt in $(seq 1 60); do
    if [[ $(./os/dev/vm.sh status) == stopped ]]; then stopped=true; break; fi
    sleep 1
  done
  [[ $stopped == true ]] || { echo '::error::guest did not shut down to grow its disk'; exit 1; }
  ./os/dev/vm.sh stop
  qemu-img resize -f qcow2 "$overlay" +1G
  ./os/dev/vm.sh boot --2d --disk "$overlay"
  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::grown disk did not boot'; exit 1; }
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh prepare" \
    | tee "$TILO_RUN/shared-disk-prepare.log"
  old_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id')
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 180); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::guest did not boot with a foreign ESP ahead of its own'; exit 1; }
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  timeout --kill-after=10s 28m ./os/dev/vm.sh ssh \
    "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh check '$SHARED_DISK_SWITCH_IMAGE'" \
    | tee "$TILO_RUN/shared-disk-check.log"
fi
if [[ $DEV_UKI_BOOT == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/dev/guest-dev-uki.sh "$TILO_USER@127.0.0.1:/tmp/guest-dev-uki.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-dev-uki.sh" > "$TILO_RUN/dev-uki-build.log" 2>&1
  old_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id')
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 120); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::generated dev UKI did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl status --no-pager" > "$TILO_RUN/dev-uki-boot.log"
  grep -Eq '^[[:space:]]*Current Entry: tilo-dev-diagnostic[.]efi$' "$TILO_RUN/dev-uki-boot.log"
fi
if [[ $COLD_BOOT == true ]]; then
  if [[ $DEV_UKI_BOOT == true ]]; then
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl set-oneshot tilo-dev-diagnostic.efi"
  fi
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl poweroff" || true
  stopped=false
  for attempt in $(seq 1 30); do
    if [[ $(./os/dev/vm.sh status) == stopped ]]; then stopped=true; break; fi
    sleep 1
  done
  [[ $stopped == true ]] || { echo '::error::guest did not shut down for the cold boot'; exit 1; }
  ./os/dev/vm.sh stop
  ./os/dev/vm.sh boot --2d --disk "$overlay"
  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::cold dev boot did not accept SSH'; exit 1; }
  if [[ $DEV_UKI_BOOT == true ]]; then
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl status --no-pager" > "$TILO_RUN/dev-uki-boot.log"
    grep -Eq '^[[:space:]]*Current Entry: tilo-dev-diagnostic[.]efi$' "$TILO_RUN/dev-uki-boot.log"
  fi
fi
# Measure the actual boot before diagnostic instrumentation restarts
# greetd; its new activation timestamp would include host probe time.
if [[ $CHECK_BOOT_PERFORMANCE == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/boot_performance_check.sh "$TILO_USER@127.0.0.1:/tmp/boot-performance-check.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/boot-performance-check.sh" > "$TILO_RUN/boot-performance.log" 2>&1
fi
# A broken update must roll itself back on this disk's own boot chain.
# It ends booted on the deployment that came back, so the greeter
# checks below also prove that machine reaches its greeter.
if [[ -n $BOOT_ASSESSMENT_IMAGE ]]; then
  RUNNER='./os/dev/vm.sh ssh' SUDO_PASS="$TILO_PASS" FAULT="$BOOT_ASSESSMENT_FAULT" \
    RESET="./os/dev/vm.sh stop; ./os/dev/vm.sh boot --2d --disk '$overlay'" \
    SERIAL='./os/dev/vm.sh serial' \
    ./os/tests/boot_assessment_rollback.sh "$BOOT_ASSESSMENT_IMAGE" "$TILO_RUN/boot-assessment"
fi
read -r -a samples <<< "$VERITY_SAMPLES"
for sample in "${samples[@]}"; do
  [[ $sample =~ ^[0-9a-f]{2}/[0-9a-f]{126}$ ]] || {
    echo '::error::verity_samples contains an invalid object path'
    exit 1
  }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sha256sum '/sysroot/composefs/objects/$sample' >/dev/null" || {
    echo "::error::native KVM could not read composefs object $sample"
    exit 1
  }
  echo "::notice::native KVM read composefs object $sample"
done
if [[ $CAPTURE_FAULT_PC == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/dev/guest-ptrace-override.sh "$TILO_USER@127.0.0.1:/tmp/guest-ptrace-override.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-ptrace-override.sh"
  ./os/dev/vm.sh stop
  ./os/dev/vm.sh boot --2d --disk "$overlay"
  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::debug guest did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh 'cat /proc/sys/kernel/yama/ptrace_scope; test "$(cat /proc/sys/kernel/yama/ptrace_scope)" = 0' || {
    echo '::error::disposable guest ptrace override did not take effect'
    exit 1
  }
  cc -O2 -Wall -Wextra -o "$TILO_RUN/tilo-greeter-ptrace-probe" \
    os/dev/greeter-ptrace-probe.c
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/tilo-greeter-ptrace-probe" "$TILO_USER@127.0.0.1:/tmp/"
fi
if [[ $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  cc -O2 -Wall -Wextra -shared -fPIC -o "$TILO_RUN/libtilo-gallivm-cpu-interpose.so" \
    os/dev/gallivm-cpu-interpose.c
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/libtilo-gallivm-cpu-interpose.so" "$TILO_USER@127.0.0.1:/tmp/"
fi
sshpass -p "$TILO_PASS" scp -q -P 2222 \
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
  -o PreferredAuthentications=password -o PubkeyAuthentication=no \
  os/dev/guest-greeter-diagnostic.sh "$TILO_USER@127.0.0.1:/tmp/guest-greeter-diagnostic.sh"
./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' env GREETER_RENDER_VARIANT=$RENDERER_VARIANT GREETER_CAPTURE_FAULT_PC=$CAPTURE_FAULT_PC bash /tmp/guest-greeter-diagnostic.sh"
./os/dev/vm.sh ssh 'cat /tmp/tilo-cage-diagnostic.log' > "$TILO_RUN/cage-diagnostic.log" || true
if [[ $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  grep -q 'TILO_GALLIVM_CPU=generic' "$TILO_RUN/cage-diagnostic.log" || {
    echo '::error::LLVM CPU override did not load in the guest'
    exit 1
  }
fi
if [[ $RENDERER_VARIANT == gpu || $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  ./os/dev/vm.sh ssh 'grep -lq first-frame-presented /tmp/tilo-greeter-metrics-*.json' || {
    echo '::error::guest did not present its first frame'
    exit 1
  }
fi
sleep 3
./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sh -c 'test -c /dev/dri/card0 && systemctl is-active --quiet greetd && pgrep -x cage && pgrep -x tilo-greeter'" || {
  echo '::error::native KVM guest did not keep a graphical greeter'
  exit 1
}
if [[ $CHECK_DESKTOP == true ]]; then
  if [[ $OVERRIDE_SESSION_WRAPPER == true ]]; then
    sshpass -p "$TILO_PASS" scp -q -P 2222 \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o PreferredAuthentications=password -o PubkeyAuthentication=no \
      os/usr/libexec/tilo-session "$TILO_USER@127.0.0.1:/tmp/tilo-session-override"
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sh -c 'install -m 0755 /tmp/tilo-session-override /run/tilo-session-override && chcon --reference=/usr/libexec/tilo-session /run/tilo-session-override && mount --bind /run/tilo-session-override /usr/libexec/tilo-session && mount -o remount,bind,ro,exec /usr/libexec/tilo-session'"
  fi
  ./os/dev/vm.sh login --passcode-only "$TILO_PASS"
  desktop_ready=false
  for attempt in $(seq 1 60); do
    # The CSV records ticks after event-loop dispatch returns and may
    # stay buffered while an already painted desktop is idle. Require
    # a completed render-thread presentation, not a flushed loop tick.
    if ./os/dev/vm.sh ssh 'busctl --user --timeout=3 status org.freedesktop.impl.portal.desktop.tilo >/dev/null 2>&1 && grep -Eq "^FRAME-LIFECYCLE serial=[1-9][0-9]* event=render-retired " "$HOME/.local/state/tilo/session-logs/latest.log"'; then
      desktop_ready=true
      break
    fi
    sleep 1
  done
  if [[ $desktop_ready != true ]]; then
    echo '::error::native desktop did not own its portal and complete a presentation; preserving evidence in desktop-readiness.log, desktop-session.log and frame-trace.csv'
    exit 1
  fi
  ./os/dev/vm.sh cmd "screendump $TILO_RUN/desktop.ppm" >/dev/null
fi
'''
needs = ["tilo-vm-binary-{arch}"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch={arch}", "/dev/kvm", "disk-100g"]
isolation = "vm"
evidence = ["/target/dev-disk-boot-diagnostic/**"]
cache = false
git = true
timeout_secs = 5400
on = ["dispatch"]
dispatch_inputs = { candidate_manifest = "", candidate_manifest_sha256 = "", source_revision = "", upgrade_image = "", renderer_variant = "gpu", cpu_variant = "host", capture_fault_pc = "false", check_desktop = "false", check_boot_performance = "false", dev_uki_boot = "false", cold_boot = "false", override_session_wrapper = "false", verity_samples = "", shared_disk_esp = "false", shared_disk_switch_image = "", boot_assessment_image = "", boot_assessment_fault = "greetd" }
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "vm-acceptance-cohort"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/install-packages.sh tools/ci/packages/vm-acceptance.txt && bash tools/ci/vm-acceptance.sh cohort"
needs = ["os-dev-disk-x86_64", "tilo-vm-binary-x86_64", "vm-cohort-x86_64", "vm-cohort-verifier-x86_64"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/vm-acceptance/report/**"]
cache = false
git = true
timeout_secs = 10800
on = ["dispatch"]
dispatch_inputs = { only = "", outputs = "1920x1080@1,1280x800@1.25", gl = "auto" }

# An encrypted install whose keyslot is sealed to its TPM opens by itself at the
# next boot, with nobody typing, and reaches a login
# (os/dev/test-encrypted-install.sh on this tree's dev disk).
[[check]]
name = "encrypted-install-tpm-x86_64"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/install-packages.sh tools/ci/packages/boot-assessment.txt tools/ci/packages/signin-e2e.txt tools/ci/packages/qemu-x86_64.txt && TILO_VM_DISPLAY=2d bash os/dev/test-encrypted-install.sh tpm /target/publish/os-dev-disk/x86_64/disk/disk.qcow2 --out /target/encrypted-install-tpm"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/encrypted-install-tpm/**"]
cache = false
git = true
timeout_secs = 7200
default = false
on = ["dispatch"]

# The sealed command line is measured, and the check can say so: a dev disk booted with a
# software TPM runs its own boot-side rollback check with `tilo.generation=` sealed, then with
# the token blanked out of the UKI in place, and the second run must fail on the generation
# while PCR 11 still holds a measurement (os/dev/test-measured-boot.sh).
[[check]]
name = "measured-boot-x86_64"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "# The guest-side half is the image's /usr/libexec/tilo-rollback-boot-check, os/tests/rollback-boot-check.sh.\nbash tools/ci/install-packages.sh tools/ci/packages/boot-assessment.txt tools/ci/packages/qemu-x86_64.txt && rm -rf /var/tmp/tilo-measured-boot && TILO_VM_DISPLAY=2d TILO_RUN=/var/tmp/tilo-measured-boot OUT=/target/measured-boot bash os/dev/test-measured-boot.sh /target/publish/os-dev-disk/x86_64/disk/disk.qcow2"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/measured-boot/**"]
cache = false
git = true
timeout_secs = 7200
default = false
on = ["dispatch"]

# Owner-enrolled Secure Boot on a booted dev disk: keys generated and the image signed inside the
# guest, enrolment refused while re-signing is off, and a reboot into enforcement that runs only
# the owner's signed kernel (os/dev/test-secureboot.sh).
[[check]]
name = "secureboot-enrolment-x86_64"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/install-packages.sh tools/ci/packages/boot-assessment.txt tools/ci/packages/qemu-x86_64.txt && rm -rf /var/tmp/tilo-secureboot && TILO_VM_DISPLAY=2d TILO_RUN=/var/tmp/tilo-secureboot bash os/dev/test-secureboot.sh /target/publish/os-dev-disk/x86_64/disk/disk.qcow2 --out /target/secureboot-enrolment"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/secureboot-enrolment/**"]
cache = false
git = true
timeout_secs = 7200
default = false
on = ["dispatch"]

# A box set up once, branched into two that start configured and work on their own
# (scripts/vm-e2e/branch.py): this tree's dev disk and tilo-vm, on libvirt in the micro-VM.
[[check]]
name = "e2e-branch"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/vm-e2e-branch.sh"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/e2e-branch/**"]
cache = false
git = true
timeout_secs = 7200
on = ["dispatch"]
dispatch_inputs = { hold = "0" }

[[check]]
name = "e2e-agents"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
# Several coding agents on one booted tilo box, each in an environment of its own workspace:
# two workspaces, Terminal and an environment in each, an MCP client configured as Claude Code
# in each environment's shell, the person's answers on the sheet and their Stop
# (scripts/vm-acceptance/acceptance/checks/agents_e2e.py).
run = "bash tools/ci/install-packages.sh tools/ci/packages/vm-acceptance.txt && bash tools/ci/vm-acceptance.sh e2e-agents"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/e2e-agents/report/**"]
cache = false
git = true
timeout_secs = 5400
on = ["dispatch"]

[[check]]
name = "e2e-ws-branch"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
# A workspace set up once on one booted tilo box (a note, files, a Terminal environment with a
# tool in it, a window on its shell) and branched twice through `workspace.branch` and once
# through `tilo do branch-workspace`: each branch starts with all of it and only its owner, no
# chat, and from then on changes apart from its source and its sibling, also after the session
# restarts; an agent in a branch's environment acts there alone
# (scripts/vm-acceptance/acceptance/checks/ws_branch_e2e.py).
run = "bash tools/ci/install-packages.sh tools/ci/packages/vm-acceptance.txt && bash tools/ci/vm-acceptance.sh e2e-ws-branch"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/e2e-ws-branch/report/**"]
cache = false
git = true
timeout_secs = 5400
on = ["dispatch"]
dispatch_inputs = { hold = "0" }

[[check]]
# An agent on one of the person's Tilo boxes steering another of their boxes over MCP, on real
# VMs: two boxes branched from one set-up box, a third of another person, on one local network.
name = "e2e-remote"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/e2e-remote.sh"
needs = ["os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/e2e-remote/**"]
cache = false
git = true
timeout_secs = 7200
on = ["dispatch"]

[[check]]
