[[check]]
name = "real-fuse"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "# Mounting FUSE needs a user namespace where the check is root: the job sandbox gives it no\n# capability, and no_new_privs keeps fusermount3's setuid bit from helping, so a mount from\n# the check itself fails with \"fusermount3: mount failed: Operation not permitted\".\nscript=$(cat <<'REAL_FUSE'\nexport TILO_FONT_ASSET_CACHE=$CARGO_TARGET_DIR/font-artifacts\npython3 -I tools/font-catalog.py root crates/ui/ui-core/assets/fonts --scope fixtures --cache \"$TILO_FONT_ASSET_CACHE\"\nexport TILO_FONT_ASSETS_OFFLINE=1\nbash scripts/ci-fuse-preflight.sh\ncargo build --locked -p tilo-cli -p tilo-daemon -p tilo-fs -p launcher -p tilolang-process --bin tilo --bin tilo-runtime --bin fs --bin tilo-launcher --bin tilolang-process\ncargo test --locked -p tilo-daemon --test it -- --ignored language::files_content:: --test-threads=1\nbash os/tests/tilo-session-lifecycle.sh\ncargo test --locked -p linux-vm --test hosted_share_cache -- --nocapture\ncargo test --locked -p tilo-fs --lib -- --exact fs::mount_tests::a_tree_removed_takes_every_name_with_it fs::mount_tests::a_name_can_be_made_and_taken_again_and_again fs::mount_tests::a_folder_in_use_is_unmounted_and_its_session_ends fs::mount_tests::a_folder_mounted_in_another_namespace_too_is_unmounted_and_its_session_ends fs::mount_tests::a_desktop_editor_saves_with_its_person_s_access hydration::file_keys::tests::a_mounted_file_refuses_a_read_after_workspace_access_is_revoked\ncargo test --locked -p tilo-user-identity projection --lib -- --nocapture\ncargo test --locked -p tilo-fs durable_backup::tests --lib -- --nocapture\ncargo test --locked -p tilo-fs namespace::journey_tests::byte_names_survive_load_save_rename_and_replication_exactly --lib -- --nocapture\ncargo test --locked -p tilo-fs availability::tests::availability_registry_persists_by_stable_document_id_and_rejects_tampering --lib -- --nocapture\nREAL_FUSE\n)\nexec unshare --user --map-root-user --mount -- bash -ec \"$script\"\n"
env = { TILO_FS_FUSE_REQUIRED = "1", TILO_REQUIRE_FUSE = "1", TILO_FONT_IMAGE_SEED = "/target/font-seed" }
needs = ["font-seed"]
requires = ["/dev/fuse", "/dev/fuse"]
isolation = "nested"
on = ["idle", "stable", "dispatch"]
heavy = true

[[check]]
name = "real-fuse-mounts-build"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "set -eu\nmkdir -p \"$CARGO_TARGET_DIR/vm\"\n# Read every message before copying: cargo fails with a broken pipe if its output\n# is closed while it is still writing build messages.\ncargo test --locked -p tilo-fs --test it --bin fs --no-run --message-format json | python3 -c '\nimport json, os, shutil, sys\nnames = {\"it\": \"tilo-fs-it\"}\nout = os.path.join(os.environ[\"CARGO_TARGET_DIR\"], \"vm\")\nfor message in map(json.loads, sys.stdin):\n    if message.get(\"reason\") == \"compiler-artifact\" and message.get(\"executable\") and message[\"target\"][\"name\"] in names:\n        shutil.copy(message[\"executable\"], os.path.join(out, names[message[\"target\"][\"name\"]]))\n'\n"
requires = ["arch=x86_64"]
outputs = ["/target/vm/tilo-fs-it", "/target/debug/fs"]
on = ["dispatch", "idle", "stable"]
heavy = true

[[check]]
name = "real-fuse-mounts"
run = "# The mount serves callers that switch to other uids, and the kernel only lets a namespace map\n# a uid range it holds a capability for; a nested check has no capability and maps its own uid\n# alone, so switching to another uid fails. The micro-VM runs the check as real root.\nset -eu\ncd crates/core/fs\n/target/vm/tilo-fs-it integration_test:: --nocapture --test-threads=1\n/target/vm/tilo-fs-it cloud_mount:: --nocapture --test-threads=1\n/target/vm/tilo-fs-it files_mount:: --nocapture --test-threads=1\n"
env = { TILO_FS_FUSE_REQUIRED = "1", TILO_REQUIRE_FUSE = "1" }
needs = ["real-fuse-mounts-build"]
requires = ["arch=x86_64"]
isolation = "vm"
on = ["dispatch", "idle", "stable"]
heavy = true

[[check]]
