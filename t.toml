# The development server's channel: main's sealed development server image, signed with the
# development key for the dev repository (which only a development image's own policy accepts),
# published there as server-sha-<commit>, and server-x86_64-ci moved to it, only forward along
# main (host-dev-channel.sh). Every development server follows that tag (tilo-update-channel),
# and the development server's installer medium names it as the installed server's origin
# (server-installer-medium.sh). It publishes when t is idle, as main's dev desktop images do.
[[check]]
name = "sign-dev-host"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/tilo-vm /target/publish/host-dev-sealed"
needs = ["seal-host-dev", "signing-tools"]
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-dev-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTDevSigner", TILO_SIGNING_AUDIENCE = "tilo-dev-signing", TILO_DEV_SIGNING = "1" }
default = false
outputs = ["/target/publish/host-dev-sealed/payload.json", "/target/publish/host-dev-sealed/signature", "/target/publish/host-dev-sealed/dry-run.pub"]
id_token = ["tilo-dev-signing"]

[[check]]
name = "publish-host-dev"
# Takes an identity token from t (at its deployment's own address) to the registry: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "set -euo pipefail\nchannel=$(bash tools/ci/publish/host-dev-channel.sh server-x86_64-ci)\nbash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-vm /target/publish/host-dev-sealed 'server-sha-{commit}' $channel"
needs = ["seal-host-dev", "test-image-host-dev", "sign-dev-host", "signing-tools"]
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/host-dev-sealed/receipt.json"]
git = true
timeout_secs = 3600
on = ["idle", "dispatch"]
id_token = ["registry.tilo.so"]

# The server image's release, asked for and never run by a tag or a change: build it (host-base,
# host-binaries, image-host), seal it (seal-host), prove it (test-image-host in a container,
# host-assurance-x86_64 by installing and booting it under Secure Boot), sign its boot chain with
# the EFI and PCR keys (sign-host-boot, apply-host-boot, the desktop release's own steps), sign it
# with the release key and publish it as registry.tilo.so/tilo/tilo-host. As the desktop's OS
# release, someone runs it on a release tag, one step at a time: a release builds a commit whose
# server checks passed, and the boot proof is a need, not a step someone remembers.
#
# `t dispatch publish-host --ref tag:vX.Y.Z --publish` is the whole release, and one step may be
# dispatched alone on a tag whose own run stopped there. The tags never move a published image:
# sha-<commit> names the build once, gen<N> its place in the server's generation series once,
# <version> the release, and latest follows only a final version (oci-publish.sh). A dispatch
# elsewhere signs and publishes nothing: the release keys' roles trust v* tags, and oci-sign.sh
# refuses an image built from an RPM set no release published.
[[check]]
name = "sign-host-boot"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/os-release.sh sign-boot /target/publish/host-sealed /target/publish/host-boot-signed"
needs = ["seal-host", "os-assets", "signing-tools"]
env = { AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_EFI_SIGNING_KMS_KEY = "arn:aws:kms:us-east-1:125650147312:alias/tilo-efi-signing", TILO_PCR_SIGNING_KMS_KEY = "arn:aws:kms:us-east-1:125650147312:alias/tilo-pcr-prediction" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/host-boot-signed/**"]
on = ["dispatch"]
id_token = ["sts.amazonaws.com"]

[[check]]
name = "apply-host-boot"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/host-seal.sh apply /target/publish/host-sealed /target/publish/host-boot-signed /target/publish/host-release"
needs = ["seal-host", "sign-host-boot", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/host-release/image.oci.tar", "/target/publish/host-release/digest", "/target/publish/host-release/generation", "/target/publish/host-release/rpms-source", "/target/publish/host-release/provenance.json", "/target/publish/host-release/install.log"]
git = true
timeout_secs = 3600
on = ["dispatch"]

[[check]]
name = "sign-host"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
