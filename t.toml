# The snapshots the OS builds FROM, pinned on main to what stable published and signed (the
# `kernel-buildroot`, `kernel` and `legacy-guest` pointers publish-kernel-buildroot,
# publish-kernel and publish-legacy-guest set). Main is pushed to by everyone, so it never publishes these itself;
# it pins stable's, and only where main would build the same thing (the inputs digest in the
# pointer), after verifying the signature (and the kernel's provenance) against keys/cosign.pub.
