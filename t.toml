# The desktop session for other distributions (release-desktop.yml, dist/): its packaging inputs,
# checked before anything is built: the install contract, the packaging scripts' syntax, the
# version each format carries, the RPM signing client's contract, the development session and
# the OS payload's contract, whose session tests build the flight recorder (tilo-session-record,
# dist/session/tests/build-flight-recorder.sh), so its key holds what that package reads. The
# login wrapper's refusals (dist/ci/run-dev-session-test.sh) need a non-root user created in a
# throwaway container, which a check can't do yet.
[[check]]
name = "desktop-preflight"
requires = ["arch=any"]
# Building the flight recorder compiles some 680 crates, nearly all from the compiler cache: on
# one core cargo fetches them one after another (95 to 940 s), so it gets the cores to fetch and
# compile them side by side. Measured on main over a week, on one core: 1.7 GiB peak.
requirement = { cores = 8, memory = "6GiB" }
run = """
set -eu
python3 scripts/check-install-contract.py
bash -n dist/*.sh dist/*/*.sh dist/ci/proot-apt-key dist/arch/PKGBUILD
cc -fsyntax-only -Wall -Wextra -Werror dist/ci/qemu-argv0-wrapper.c
test "$(cat dist/VERSION)" = "$(sed -n 's/^pkgver=//p' dist/arch/PKGBUILD)"
grep -Fxq "%{!?tilo_version:%global tilo_version $(cat dist/VERSION)}" dist/rpm/tilo-session.spec
python3 -m unittest discover -s tools/tests -p test_rpm_broker.py
dist/ci/run-payload-contract-tests.sh
os/tests/portal_config_validity.sh
"""
# The payload contract records the source revision.
git = true
cargo_packages = ["tilo-session-record"]
cargo_dev_dependencies = false
# What its scripts read besides: the packaging tree, the install contract and the docs it checks
# against, the OS files the payload installs, and the manifests and binaries the RPM build graph
# test reads (tools/tests/test_rpm_build_graph.py).
inputs = ["dist/**", "docs/install-contract.json", "docs/desktop-rpm-broker.md", "docs/packaging.md", "scripts/check-install-contract.py", "tools/tests/test_rpm_broker.py", "tools/tests/test_rpm_build_graph.py", "tools/ci/sccache.sh", "os/tests/portal_config_validity.sh", "os/usr/share/xdg-desktop-portal/**", "os/usr/share/pipewire/**", "os/usr/lib/systemd/user/**", "os/usr/share/user-tmpfiles.d/**", "os/etc/pam.d/tilo-unlock", "os/etc/profile.d/tilo-apps.sh", "os/scripts/install-components.py", "tools/ci/products.toml", ".forgejo/workflows/release-desktop.yml", ".forgejo/workflows/release-imager.yml", "Cargo.toml", "**/Cargo.toml", "**/src/main.rs", "**/src/bin/**"]
cost = "minutes"
on = ["stable", "dispatch", "idle"]
default = false

