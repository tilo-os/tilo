  # before the whole job expires so finish() can collect evidence.
  cat > "$TILO_RUN/guest-switch.sh" <<'GUEST_SWITCH'
#!/usr/bin/env bash
set -euo pipefail
mount -o remount,rw /boot
timeout --kill-after=10s 20m bootc switch "$1" &
switch_pid=$!
(
  while kill -0 "$switch_pid" 2>/dev/null; do
    printf '\nTILO_SWITCH_PROGRESS time=%s\n' "$(date -u +%FT%TZ)"
    timeout --kill-after=1s 3s df -h /sysroot /var /boot || true
    timeout --kill-after=1s 3s df -i /sysroot /var /boot || true
    timeout --kill-after=1s 3s ps -C bootc -o pid,etime,time,stat,wchan:24 || true
