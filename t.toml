python3 os/dev/probe-kvm.py "$TILO_VM_ARCH"

set -euo pipefail
[[ $SOURCE_REVISION =~ ^[0-9a-f]{40}$ ]]
[[ $CANDIDATE_MANIFEST =~ ^https://code\.tilo\.so/api/packages/tilo/generic/tilo-vm-disk-(candidate|latest)/[A-Za-z0-9._-]+/candidate\.json$ || $CANDIDATE_MANIFEST =~ ^https://code\.tilo\.so/api/packages/tilo/generic/tilo-vm-disk/[A-Za-z0-9._-]+/tilo-vm-disk-(aarch64|x86_64)\.json$ ]] || {
