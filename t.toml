# ---- The tilo command ----------------------------------------------------------------------
#
# What `curl -fsSL https://tilo.sh | sh` installs (dist/install/tilo.sh), by
# tools/ci/publish/cli-release.sh: one statically linked archive per Linux architecture, both
# built on the x86_64 node (aarch64 cross-compiles, so a node of that architecture is not needed);
# their SHA256SUMS; its signature by the release key. It is released with the relay, on release
# tags: sign-cli alone holds the release key, publish-cli alone the package token, and neither
# runs anywhere else. Either may also be dispatched, on a release tag whose own run did not
# publish it (`t dispatch publish-cli --ref tag:vX.Y.Z`): the release key's token is issued for
# tags only and cli-release.sh refuses any other ref, so a dispatch elsewhere publishes nothing.
# cli-rehearsal signs the same release with a throwaway key, publishes it into a directory laid
# out as tilo.sh serves it, serves that at a local HTTPS site, and installs it the way a person
# does (`curl -fsSL https://<site>/ | sh`): with openssl on the machine, and again with a PATH
# that has none, as stock systems come. Nothing in it reaches the live site.
#
# A release carries both Linux archives or none. The Mac archives are built by the
# cli-macos-cross checks, on the same x86_64 node: no Mac is a node of this fleet, so Zig builds
# the program against link stubs of the frameworks it uses (tools/ci/macos-frameworks.py), and no
# Apple SDK -- Apple's to license on Apple hardware -- is involved. These checks build and pack
# them, and check the Mach-O they are; nothing else here builds, signs or publishes them. A Mac
# archive joins a release once it has run on a Mac: until then cli-release does not wait for them,
# and the installer tells a Mac that the release has none.

[[check]]
name = "cli-{arch}"
run = "bash tools/ci/publish/cli-release.sh build {arch}-unknown-linux-musl /target/publish/cli/linux-{arch}"
# The musl C compiler the program's C (ring, SQLite) needs, and for aarch64 the Zig toolchain
# that cross-compiles it and qemu to run it: see tools/ci/install-cli-toolchain.sh.
setup = { run = "bash tools/ci/install-cli-toolchain.sh {arch}-unknown-linux-musl" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/cli/linux-{arch}/*"]
# A release builds the whole program for musl from cold, beside the rest of the release on the
# same node: over an hour when the node is full (v0.1.5's x86_64 build ended at the default
# hour, a crate short of done).
timeout_secs = 7200
default = false
[check.matrix]
arch = ["x86_64", "aarch64"]

# Both Mac architectures build on the x86_64 Linux node. The program cannot run there, so its
# build is checked by reading the Mach-O: the architecture it was built for, the macOS it needs,
# the libraries it names, and its arm64 code signature (tools/ci/publish/cli-release.sh). On a
# Mac, `t outputs cli-macos-cross-{arch}` fetches the archive, and `tar xzf
# tilo-macos-{arch}.tar.gz && ./tilo --help` runs what it installs.
[[check]]
name = "cli-macos-cross-{arch}"
run = "bash tools/ci/publish/cli-release.sh build {arch}-apple-darwin /target/publish/cli/macos-{arch}"
# Zig, which carries Darwin's C library headers, the Rust target, and llvm-otool to read the
# Mach-O with: see tools/ci/install-cli-toolchain.sh.
setup = { run = "bash tools/ci/install-cli-toolchain.sh {arch}-apple-darwin" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/cli/macos-{arch}/*"]
