[[check]]
name = "perf-publish"
run = "bash tools/ci/perf-compare.sh /target/perf-publish"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
needs_any_outcome = ["perf-fs", "perf-agent", "perf-agent-native", "perf-footprint", "perf-footprint-image", "perf-latency", "perf-render", "perf-wakeups", "perf-search", "perf-hosting", "perf-hosting-room", "perf-browser", "perf-stream"]
outputs = ["/target/perf-publish/**"]
secrets = ["TILO_PACKAGES_TOKEN"]
cache = false
default = false
on = ["stable", "dispatch"]

[check.dispatch_inputs]
accept = ""
synthetic_series = ""
synthetic_factor = "1.0"

# A paired A/B of two refs: both sides built
# and run interleaved, `t dispatch perf-ab --input groups=hosting --input
# base=origin/main --input candidate=<commit>`; `t outputs perf-ab` gives the
# verdict. Needs groups (fs, agent, latency, render, wakeups, search, hosting,
# browser) and at least 6 rounds.
[[check]]
name = "perf-ab"
requires = ["arch=x86_64"]
git = true
run = """
[[ -n $T_INPUT_GROUPS ]] || { echo "perf-ab needs --input groups=..." >&2; exit 2; }
[[ $T_INPUT_ROUNDS =~ ^[0-9]+$ && $T_INPUT_ROUNDS -ge 6 ]] || { echo "rounds must be a number of at least 6" >&2; exit 2; }
if [[ ,$T_INPUT_GROUPS, == *,browser,* ]]; then
  bash tools/ci/ensure-browser-dependencies.sh
  npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
  export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
fi
rm -rf /target/perf-ab
python3 tools/perf/ab.py run --groups "$T_INPUT_GROUPS" --base "$T_INPUT_BASE" \
  --candidate "${T_INPUT_CANDIDATE:-${T_COMMIT:-HEAD}}" --rounds "$T_INPUT_ROUNDS" --out /target/perf-ab \
  --hosting-relay-cpus "${T_INPUT_RELAY_CPUS:-0}" --virtualization kvm --runner t
"""
env = { CARGO_PROFILE_RELEASE_LTO = "thin", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16", VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json", npm_config_cache = "/tmp/npm-cache" }
outputs = ["/target/perf-ab/**"]
cache = false
timeout_secs = 10800
default = false
on = ["dispatch"]

[check.dispatch_inputs]
groups = ""
base = "origin/main"
candidate = ""
rounds = "8"
relay_cpus = ""

# ---------------------------------------------------------------------------
# Checks for nodes with KVM, a privileged VM or 100 GB of disk.

# The OS image's acceptance scenarios in tilo-vm (scripts/vm-acceptance), in a
# micro-VM on an x86-64 node with KVM: this tree's own dev image, on the disk
# os-dev-disk-x86_64 installed it to (the disk the dev channel publishes), booted from a
# throwaway overlay in a libvirt guest by tilo-vm-binary-x86_64's tilo-vm
# (tools/ci/vm-acceptance.sh).
# The suite runs in shards (run.py SHARDS: session, apps, foreign-apps, window, shell), a matrix
# of checks, `vm-acceptance/<shard>`, each in a VM of its own with its shard in T_SHARDS, cached
# on its own and run again alone when it fails; t runs them in parallel where there is room. A
# check that needs `vm-acceptance/{shard}` needs every shard. The packages the job needs beside the
# builder image are its setup (tools/ci/packages/vm-acceptance.txt), a cached layer over it.
# `t dispatch vm-acceptance --input only=input --input swap=all` runs a selection in every
# shard (a t that dispatches only one check at a time takes `t dispatch vm-acceptance/<shard>`);
# `t test vm-acceptance` the checks a working tree's changes select, in every shard; `t
# outputs vm-acceptance/<shard>` gives its report. vm-acceptance-perf runs every check on release candidates
# and when dispatched, and publishes its performance records where the run holds
# TILO_PACKAGES_TOKEN (`t dispatch vm-acceptance-perf --ref main`, or any reference the
# server's secret config gives it to). The micro-VM holds the guest (6 vCPUs, 4.5 GiB) beside
# what a swap builds. Its inputs are what the run reads besides the disk and tilo-vm: the
# suite, its driver and the repository files the scenarios read. A swap builds from the
# whole tree, which the commit keys (`git`). A result is kept per commit and those files,
# so a run whose disk, tilo-vm and suite are unchanged takes it from the cache.
[[check]]
name = "vm-acceptance/{shard}"
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
git = true
run = "bash tools/ci/install-packages.sh tools/ci/packages/vm-acceptance.txt && bash tools/ci/vm-acceptance.sh"
env = { T_SHARDS = "{shard}" }
needs = ["os-dev-disk-x86_64", "tilo-vm-binary-x86_64"]
outputs = ["/target/vm-acceptance/{shard}/report/**"]
timeout_secs = 10800
default = false
# A release candidate is verified by it (heavy) and gates on what works; its budgets are
# reported (budgets = "report", tools/ci/vm-acceptance.sh), and vm-acceptance-perf compares
# its records without holding the candidate.
heavy = true
on = ["stable", "dispatch"]

[check.matrix]
shard = ["session", "apps", "foreign-apps", "window", "shell"]

[check.dispatch_inputs]
swap = "none"
only = ""
outputs = "1920x1080@1,1280x800@1.25"
gl = "auto"
budgets = "report"

# A broken update falls back by itself: this tree's dev image installed to a disk and
# booted under KVM, an update staged on it that waits at a disk unlock prompt nobody
# answers, and the boot loader going back after its tries (tools/ci/boot-assessment.sh,
# os/tests/boot_assessment_rollback.sh). `t dispatch boot-assessment-x86_64 --ref <branch>`.
[[check]]
name = "boot-assessment-x86_64"
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
git = true
run = "bash tools/ci/install-packages.sh tools/ci/packages/boot-assessment.txt && bash tools/ci/boot-assessment.sh"
needs = ["os-dev-image-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
outputs = ["/target/boot-assessment/**"]
cache = false
timeout_secs = 7200
default = false
on = ["dispatch"]

[check.dispatch_inputs]
fault = "unlock"

# The same fallback on the sealed release disk instead of a dev disk: the release image this
# tree built, installed as a device installs it (/boot is the ESP, the UKI seals the composefs
# digest the install computed, the boot loader counts and blesses there), with the release
# itself staged as the update in the release's own repository under the guest's local storage,
# since a sealed disk refuses the unsigned repositories a dev disk admits
# (tools/ci/boot-assessment-release.sh, os/tests/boot_assessment_rollback.sh).
# `t dispatch boot-assessment-release-x86_64 --ref <branch>`.
#
# A lane that never runs on a push decides nothing from a push; keyed by what it reads, it
# reruns only when that changed.
[[check]]
name = "boot-assessment-release-x86_64"
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
git = true
run = "bash tools/ci/boot-assessment-release.sh x86_64 /target/os/x86_64/release-image /target/boot-assessment-release"
needs = ["os-release-image-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
outputs = ["/target/boot-assessment-release/**"]
cache = false
timeout_secs = 7200
default = false
on = ["dispatch"]

[check.dispatch_inputs]
fault = "greetd"

# The same suite with this commit's launcher, install, shell and apps+runtime entering as
# prebuilt signed layers through verified swap-artifact (docs/layer-artifacts.md,
# tools/ci/vm-cohort.sh): vm-cohort-x86_64 packs them with this tree's tilo-vm, and
# vm-cohort-verifier-x86_64 builds the tilo-vm that verifies and imports them from main's head,
# never from the tree under test. The receipt names an exact clean commit: `t dispatch
# vm-acceptance-cohort --ref <branch>`, or `t test` of a clean checkout of a pushed commit.
[[check]]
name = "vm-acceptance-cohort"
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
git = true
run = "bash tools/ci/install-packages.sh tools/ci/packages/vm-acceptance.txt && bash tools/ci/vm-acceptance.sh cohort"
needs = ["os-dev-disk-x86_64", "tilo-vm-binary-x86_64", "vm-cohort-x86_64", "vm-cohort-verifier-x86_64"]
outputs = ["/target/vm-acceptance/report/**"]
cache = false
timeout_secs = 10800
default = false
on = ["dispatch"]

[check.dispatch_inputs]
only = ""
outputs = "1920x1080@1,1280x800@1.25"
gl = "auto"

# The packs are tilo-vm-pack-apps-x86_64's: the apps' layout runs in bubblewrap sandboxes of its
# own ("nested"), with the engine and fixtures from their checks.
[[check]]
name = "vm-cohort-x86_64"
run = "bash tools/ci/vm-cohort.sh produce"
env = { CARGO_BUILD_JOBS = "16", TILO_TEST_ASSET_SEED = "/target/test-assets", TILO_RUNTIME_BUNDLE_DIR = "/target/engine-dev/x86_64/bundles", CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "", CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "" }
needs = ["tilo-vm-binary-x86_64", "test-assets", "engine-dev-x86_64"]
outputs = ["/target/vm-cohort/**"]
git = true
requires = ["arch=x86_64"]
isolation = "nested"
timeout_secs = 7200
default = false

[[check]]
name = "vm-cohort-verifier-x86_64"
run = "bash tools/ci/vm-cohort.sh verify"
env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "", CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "" }
needs = ["vm-cohort-x86_64"]
outputs = ["/target/vm-cohort-verifier/**"]
requires = ["arch=x86_64"]
# main's head moves: a cached verifier would be an older main's.
cache = false
default = false

# Reported on a candidate, never gating it (not `heavy`; see the perf groups above).
[[check]]
name = "vm-acceptance-perf"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
needs = ["vm-acceptance/{shard}"]
run = """
# Each shard of vm-acceptance writes the records of the checks it ran, and the
# selection it ran beside them: a dispatched `--only A14` owes A14's measurements,
# never every check of the lane's.
records=$TMPDIR/records.jsonl
cat /target/vm-acceptance/*/report/records.jsonl > "$records" 2>/dev/null || true
[[ -s $records ]] || { echo "the acceptance run wrote no performance records" >&2; exit 1; }
[[ -s /target/vm-acceptance/only ]] || { echo "the acceptance run did not record the checks it ran" >&2; exit 1; }
selection=$(cat /target/vm-acceptance/only)
publish=false
[[ -n ${T_REF:-} ]] && publish=true
status=0
python3 tools/perf/compare.py --results "$records" --store https://code.tilo.so --owner tilo \
  --lane vm-acceptance --groups "$(python3 scripts/vm-acceptance/selected_groups.py "$selection")" \
  --publish-dir "$TMPDIR/publish" \
  --run "t-${T_COMMIT:-tree}-vm" --summary "$TMPDIR/summary.md" || status=1
if [[ $publish == true && -n ${TILO_PACKAGES_TOKEN:-} ]]; then
  manifest=$(mktemp)
  for file in "$TMPDIR"/publish/*/*.jsonl; do
    month=$(basename "$(dirname "$file")")
    printf '%s\t%s\n' "$file" "https://code.tilo.so/api/packages/tilo/generic/tilo-perf-results/$month/$(basename "$file")"
  done > "$manifest"
  TILO_PACKAGE_TOKEN=$TILO_PACKAGES_TOKEN bash tools/upload_immutable_packages.sh "$manifest" || status=1
fi
cat "$TMPDIR/summary.md" 2>/dev/null || true
exit "$status"
"""
# The comparison needs no credentials, so a release candidate's verification judges the
# acceptance run's records whether or not the run holds the store's token;
# vm-acceptance-perf-publish writes them to the store where it does.
cache = false
default = false
on = ["stable", "dispatch"]

# vm-acceptance-perf where the run holds TILO_PACKAGES_TOKEN, which records the results.
[[check]]
name = "vm-acceptance-perf-publish"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
needs = ["vm-acceptance/{shard}"]
run = """
# Each shard of vm-acceptance writes the records of the checks it ran, and the
# selection it ran beside them: a dispatched `--only A14` owes A14's measurements,
# never every check of the lane's.
records=$TMPDIR/records.jsonl
cat /target/vm-acceptance/*/report/records.jsonl > "$records" 2>/dev/null || true
[[ -s $records ]] || { echo "the acceptance run wrote no performance records" >&2; exit 1; }
[[ -s /target/vm-acceptance/only ]] || { echo "the acceptance run did not record the checks it ran" >&2; exit 1; }
selection=$(cat /target/vm-acceptance/only)
publish=false
[[ -n ${T_REF:-} ]] && publish=true
status=0
python3 tools/perf/compare.py --results "$records" --store https://code.tilo.so --owner tilo \
  --lane vm-acceptance --groups "$(python3 scripts/vm-acceptance/selected_groups.py "$selection")" \
  --publish-dir "$TMPDIR/publish" \
  --run "t-${T_COMMIT:-tree}-vm" --summary "$TMPDIR/summary.md" || status=1
if [[ $publish == true && -n ${TILO_PACKAGES_TOKEN:-} ]]; then
  manifest=$(mktemp)
  for file in "$TMPDIR"/publish/*/*.jsonl; do
    month=$(basename "$(dirname "$file")")
    printf '%s\t%s\n' "$file" "https://code.tilo.so/api/packages/tilo/generic/tilo-perf-results/$month/$(basename "$file")"
  done > "$manifest"
  TILO_PACKAGE_TOKEN=$TILO_PACKAGES_TOKEN bash tools/upload_immutable_packages.sh "$manifest" || status=1
fi
cat "$TMPDIR/summary.md" 2>/dev/null || true
exit "$status"
"""
secrets = ["TILO_PACKAGES_TOKEN"]
cache = false
default = false
on = ["stable", "dispatch"]

# A development VM of this tree (tools/ci/os-vm.sh): os-dev-disk-x86_64's disk on a throwaway
# overlay, booted in a micro-VM on a node with KVM, its serial console, SSH and display reached
# through t (`t vm console|ssh|display`, `t vm extend`, `t vm stop`). Never part of CI: only
# `t test os-vm-x86_64` or a dispatch starts one. `--input lifetime=SECS` sets how long it runs
# before `t vm extend` (default an hour); the job's timeout bounds it.
[[check]]
name = "os-vm-x86_64"
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
run = "bash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-x86_64.txt && bash tools/ci/os-vm.sh x86_64 /target/publish/os-dev-disk/x86_64/disk"
