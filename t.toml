[[ $SHARED_DISK_ESP == false || ( $SHARED_DISK_SWITCH_IMAGE =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ && $SHARED_DISK_SWITCH_IMAGE != "$UPGRADE_IMAGE" ) ]] || {
