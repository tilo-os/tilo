[[check]]
name = "imager-tests-build-{arch}"
run = "set -eu\nmkdir -p \"$CARGO_TARGET_DIR/vm\"\n# nextest keeps its store at the repository's target/nextest unless told otherwise, and the\n# sources are read-only: a tool config moves it into the build directory.\nprintf '[store]\\ndir = \"%s/nextest\"\\n' \"$CARGO_TARGET_DIR\" > \"$CARGO_TARGET_DIR/vm/nextest-store.toml\"\ncargo nextest archive --locked --profile ci --tests -p imager -p imager-backend -p workspace-unify \\\n  --tool-config-file \"t:$CARGO_TARGET_DIR/vm/nextest-store.toml\" \\\n  --archive-file \"$CARGO_TARGET_DIR/vm/imager-tests-{arch}.tar.zst\"\n"
requires = ["arch={arch}"]
outputs = ["/target/vm/imager-tests-{arch}.tar.zst"]
[check.matrix]
arch = ["x86_64", "aarch64"]

# The imager's tests in eight micro-VMs at once, each running the eighth of them nextest's
# `--partition hash:<shard>/8` picks: together every test, each in exactly one shard. One guest ran
# all 1508 in 451-460 s on the one vCPU t gives it (NEXTEST_TEST_THREADS=1, 0.83 cores busy), the
# whole of main's critical path after the build (r7c0fe71230, rcfccbdee7e, 2026-11-06); a shard's
# own start (the guest, the archive's extraction, the test environment) is about 3 s.
# `t test imager-tests-<arch>` names all of an architecture's shards.
[[check]]
name = "imager-tests-{arch}/{shard}"
run = "set -eu\n# The guest's /var/tmp is on the step's own scratch disk, an empty ext4 t makes for each step\n# (its README, \"Micro-VM steps\"), not the node's filesystem. The tests assert the filesystem\n# themselves and fail, naming it, on any other. /var/tmp itself is world-writable, which the\n# publication of an installed system refuses among its target's ancestors (as a job's private\n# TMPDIR never is), so a directory on it is mounted at /imager, below / alone.\necho \"imager-tests-{arch}/{shard}: $(nproc) vCPUs; /var/tmp is $(awk '$2 == \"/var/tmp\" { print $3 }' /proc/mounts)\"\nmkdir -p /var/tmp/imager /imager\nmount --bind /var/tmp/imager /imager\nchmod 700 /imager\nexport TMPDIR=/imager/tmp TILO_IMAGER_TEST_CACHE_ROOT=/imager/cache\nmkdir -p \"$TMPDIR\" \"$TILO_IMAGER_TEST_CACHE_ROOT\"\n# The tests run as the guest's root, with its capabilities: the original-image review's refusal\n# of a changed held image is observed only so (as uid 0 without capabilities, the job\n# sandbox's identity, it fails), and the fixtures that need root run instead of skipping.\n# nextest's store, as in imager-tests-build-{arch}: not in the read-only sources.\nprintf '[store]\\ndir = \"/var/tmp/nextest\"\\n' > /var/tmp/nextest-store.toml\nbash tools/test-env.sh cargo nextest run --profile ci --no-fail-fast \\\n  --tool-config-file t:/var/tmp/nextest-store.toml \\\n  --archive-file /target/vm/imager-tests-{arch}.tar.zst --workspace-remap /src \\\n  --partition hash:{shard}/8\n"
needs = ["imager-tests-build-{arch}"]
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1", TILO_TEST_NTFS_FIXTURES = "0" }
requires = ["arch={arch}"]
isolation = "vm"
[check.matrix]
arch = ["x86_64", "aarch64"]
shard = ["1", "2", "3", "4", "5", "6", "7", "8"]

