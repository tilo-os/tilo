# The kernel-path filesystem contract over a real FUSE device, which every test
# here must find (TILO_REQUIRE_FUSE): a missing device fails instead of skipping. Its long
# suites, each minutes of one test at a time, are real-fuse-mounts and real-fuse-shares, so
# they run side by side.
[[check]]
name = "real-fuse"
devices = ["/dev/fuse"]
requires = ["/dev/fuse"]
env = { TILO_FS_FUSE_REQUIRED = "1", TILO_REQUIRE_FUSE = "1" }
isolation = "nested"
run = """
# Mounting FUSE needs a user namespace where the check is root: the job sandbox gives it no
# capability, and no_new_privs keeps fusermount3's setuid bit from helping, so a mount from
# the check itself fails with "fusermount3: mount failed: Operation not permitted".
script=$(cat <<'REAL_FUSE'
export TILO_FONT_ASSET_CACHE=$CARGO_TARGET_DIR/font-artifacts
python3 tools/font-catalog.py root crates/sdk/ui-core/assets/fonts --scope fixtures --cache "$TILO_FONT_ASSET_CACHE"
export TILO_FONT_ASSETS_OFFLINE=1
bash scripts/ci-fuse-preflight.sh
bash os/tests/tilo-session-lifecycle.sh
cargo test --locked -p tilo-fs named_share_delivery --lib -- --nocapture
cargo test --locked -p fs-protocol share_control --lib -- --nocapture
cargo test --locked -p tilo-user-identity projection --lib -- --nocapture
cargo test --locked -p tilo-fs replica_ack::tests::exact_nonce_version_peer_and_freshness_are_bound --lib -- --nocapture
cargo test --locked -p tilo-fs sync::tests::namespace_documents_reach_only_entitled_peers_and_readers_cannot_author --lib -- --nocapture
cargo test --locked -p tilo-fs --lib -- --exact fs::tests::record_publisher_integration_tests::keep_current_and_use_other_append_signed_convergent_resolutions
cargo test --locked -p tilo-fs durable_backup::tests --lib -- --nocapture
cargo test --locked -p tilo-fs --lib -- --exact record_repository::tests::signed_transactions_merges_and_batches_project_whole_and_survive_restart record_repository::tests::a_received_changeset_applies_whole_or_not_at_all durable_backup::tests::backups_retain_generations_and_recover_from_the_newest_valid_one
cargo test --locked -p tilo-fs namespace::tests::byte_names_survive_load_save_rename_and_replication_exactly --lib -- --nocapture
cargo test --locked -p tilo-fs history::tests::history_logs_read_legacy_and_fail_closed_on_damage --lib -- --nocapture
cargo test --locked -p tilo-fs record_transaction::tests::journal_restarts_exactly_with_monotonic_phases_and_whole_batches --lib -- --nocapture
cargo test --locked -p tilo-fs transaction_coordinator::tests::broadcast_failure_recovers_exact_committed_namespace_without_duplicate_history --lib -- --nocapture
cargo test --locked -p tilo-fs availability::tests::availability_registry_persists_by_stable_record_id_and_rejects_tampering --lib -- --nocapture
REAL_FUSE
)
exec unshare --user --map-root-user --mount -- bash -ec "$script"
"""
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

