# Tilo's checks, run with t.
#
# Nothing here says what a check reads: t records what each job reads as it runs and keys its
# result by that, so an edit reruns the checks whose files it moved and nothing else. Nothing here
# says how much a check costs: t books each job from what its runs measured and grows it.
#
# `main` is the integration branch and is tested lightly; a release is cut onto `stable`, which
# runs everything at every head while it is stabilized. So a default check is one a head of main
# runs where its change reaches it: the compile, the lints, the policy suite, each package's tests
# where the change reaches the package, and the hermetic suites whose inputs it moves. A push is
# never held: whoever broke a check is told and fixes it forward. The rest (flows, VM and root
# steps, end-to-end walks, OS images, SDK and docs builds) names `on = ["idle", "stable"]`: main
# runs it on its newest head when t has room, bisecting a failure to the commit that caused it,
# and every head of stable runs it. Image builds, installers, signing and publication keep their
# own triggers.
#
# When a check runs is two fields. A check that names no `on` is a default one: it is in `all` and
# in the run of every new head of a followed branch, where main's heads ask only what the change
# reaches. `default = false` leaves it out of those. `on` names the places the server runs a check
# by itself: `idle` (main's newest head when t has room, bisected and attributed when it fails),
# `stable` (every head of the release branch), `dispatch`, `schedule:<cron>` and `tag:<glob>` (a
# release, for the `tag:vMAJOR.MINOR.PATCH` glob). A check that names an `on` runs there and when
# asked, not with every change; `default = true` beside an `on` runs it on every change too. There
# is no queue and no check: a change runs what `t scope` says it reaches, and `t suggest` names the
# opt-in checks it moves.
#
# `heavy = true` marks a check a release is verified by, and not part of an ordinary change's run.
#
# A Python tool of `tools/` a check runs is run isolated (`python3 -I`), as `tools/ci/python.py`
# needs and every check below does: without it the interpreter puts the script's directory on
# `sys.path` and lists that directory to look the script's imports up, so the check reads every
# file beside the tool and reruns when any of them changes — an edit to one `tools/ci` script
# reached hundreds of checks. A tool that imports a sibling module is the exception, and says so
# where it is run.

# Edition 2: a check's jobs reach only the network it declares (`egress`), and nothing but their
# own loopback where it declares none, so what they answer is their state's and is served again.
# A test that probes the network by itself (an iroh endpoint's UPnP and NAT-PMP search) is
# refused, and its check told, instead of making every run of the check the network's.
#
# What a declaration says:
# - `code.tilo.so:443`, pinned: the checks that fetch test fixtures and fonts
#   from tilo's package store, each named by the SHA-256 its sources pin (tools/test-assets.py,
#   tools/font-catalog.py): `font-seed` and `test-assets`. A cargo build that compiles one of the packages whose build reads them is given
#   their outputs (`[cargo_builds]` below) and fetches none itself; a build of a crate that
#   reaches none of them is given nothing and queues no job. Every `[[cargo]]` family still
#   declares it for its test binaries' runs.
# - `registry.tilo.so:443`, pinned: an OS image step that pulls only images named by digest.
# - `0.0.0.0/0` and `::/0`: the open network, for a check whose destinations are no fixed list
#   (Fedora's mirrors, package registries, AWS, t's token endpoint, live services). A name on a
#   list is resolved as the job starts and the job gets no DNS of its own; the open network
#   includes the node's resolver.
# `pinned` says that what the job fetches is fixed by what it read (a digest, or a hash its
# sources hold), so a job that connected out is still served; without it, never.
edition = 2

# The image every check runs in unless it says otherwise: pinned by digest, so a moving tag can't
# change what a check runs in without a commit saying so. Move it by changing this line.
image = "registry.tilo.so/tilo/tilo-builder@sha256:67dd1e7626599170108d1ad823fbe1c974a82d4879aaee50d33be419fa51e05c"

# The environment every job gets. A value here, or in a family's `env`, is in the environment
# cargo builds in, and cargo keys every build script's and proc macro's cache entry by it; so it
# belongs here only when every check wants it or a build reads it. A value only a family's tests
# read is that profile's setup step instead (.config/nextest.toml), which reaches the tests and no
# build, so the units one family builds are the units every other family builds.
[env]
# Debug info is what the test binaries' panics need, not the debugger: line tables only, which is
# what the profiles in Cargo.toml ask for anyway.
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
# Executables without their symbol table: symbol names are about half of each one, and stripping
# them makes a test binary 56-58% smaller (tilo-fs's lib tests 268 MB to 118 MB) to link, store,
# move and load. What it costs: a backtrace no longer names its functions (a crash report or a
# liveness report from a development build lists addresses); a panic's or an assert's message
# still says file:line. Cargo applies them to the `test` profile, which `cargo test` and nextest
# build every test executable with, and to `dev`, which every other development build uses: a
# check's, a lint's, a program a check builds to run. Both strip alike because cargo hashes a
# unit's whole profile, strip among it, into its `-C metadata`: the build scripts, proc macros and
# host libraries every family compiles are then one unit each, compiled and cached once rather
# than once per profile. Before every dev build stripped, a sixth of the compiler cache's misses
# were these units compiled again for a family whose strip differed.
# The packages whose symbol table something reads keep it: their tests' (`[profile.test.package.*]`
# in Cargo.toml) and the browser runtime's module, which the splitter reads
# (crates/core/tilo-browser-runtime/scripts/build.sh).
# To keep symbols again, delete these lines.
CARGO_PROFILE_DEV_STRIP = "symbols"
CARGO_PROFILE_TEST_STRIP = "symbols"
# Warnings are the lint checks' to refuse: clippy and the per-package lints pass `-D warnings`
# themselves (their `trailing`), so a stray unused binding fails the lint and not every build and
# test that compiles the crate.
# Software Vulkan everywhere: no CI node has a GPU, and every render check renders the same way
# on all of them.
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_NAME = "llvmpipe"

# A cargo build t runs is given the seeds whose build script it compiles, and no others: the
# pinned fonts (tilo-font-catalog) and the test fixtures (tilo-pdf, tilo-doc-codecs), each the output of its check below, at /target. t gives them to a
# build of a package named here, or of a package that depends on one, so a build of a crate that
# reads none of them (a page crate, say) queues no seed job. The offline flags make a pin no seed
# holds fail the build, naming what is missing, instead of fetching it. A family whose tests read
# a seed themselves names it in the family's own `needs` (the visual goldens' baselines, an
# example's fonts).
[cargo_builds]
package_needs = { "tilo-font-catalog" = ["font-seed"], "tilo-doc-codecs" = ["test-assets"], "tilo-pdf" = ["test-assets"] }
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_TEST_ASSET_SEED = "/target/test-assets", TILO_TEST_ASSETS_OFFLINE = "1" }

# The workspace packages whose own sources differ between x86_64 and aarch64. Their tests and
# lints run once per architecture (`test-x86_64`, `test-aarch64`, `clippy-x86_64`,
# `clippy-aarch64`): a result on one says nothing about the other, which a check that requires no
# architecture would let it stand for. `package-sets` fails while this list and
# `python3 -I tools/ci/package_sets.py per-arch` disagree.
#
# app-catalogue app-cli browser compat-service env-tools fs-native install launcher launcher-macos
# local-model-service runtime-bundle store tilo-agent-session tilo-app-builder tilo-device-steps
# tilo-environment tilo-liveness tilo-oci-images tilo-sandbox tilo-sandbox-core
# tilolang-cli tilolang-tilo ush windows-vm

# The per-package test families run when t has room on main (bisected when one fails), at every
# stable head and when asked, not with every push: main is the integration branch and gets
# minimal testing, and a change's author runs its focused tests before pushing.
#
# Tests, one check per package: `test/<package>`. The driver runs nextest once over the whole
# family, so a shared dependency compiles once for all of them, and t shards each test binary by
# its measured per-test time. The flows' tests are not here: the shared filters leave them out,
# and the `flows` check runs each flow alone.
[[cargo]]
name = "test"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# A run that asks less than the whole family (`t test test/settings-store` after an edit) builds
# just the packages it asks for, and this one beside them: its manifest declares every member's
# features as the whole builds of the families that declare it resolve them
# (tools/ci/workspace_unify.py generates it over all of them, the test features included), so the
# narrowed selection's units are the units those builds make and its tests are the family's tests,
# not a feature-starved subset. t selects this package itself for such a run; a whole-family run
# has no use for it.
unify = "workspace-unify"
# What does not run here: the per-arch packages (their own families), `workspace-unify` (a
# generated crate, checked by `workspace-unify-<arch>`), the idle packages (their own family) and
# the two whose tests need a disk of their own (`imager-tests-<arch>`, VM steps).
exclude = [
    "app-catalogue", "app-cli", "compat-service", "env-tools", "tilo-fs-native",
    "imager", "install", "launcher", "launcher-macos", "local-model-service",
    "tilo-runtime-bundle", "tilo-agent-session",
    "tilo-app-builder", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox",
    "tilo-sandbox-core", "tilo-device-steps", "tilolang-cli", "tilolang-tilo", "ush",
    "windows-vm", "workspace-unify",
]
# The tests that start sandboxes of their own need nested namespaces, which a job's sandbox does
# not give them: the session's own tests are here too, because installing an app and opening it is
# the launcher's sandbox, built with bubblewrap in a user namespace of its own. The packages are
# tools/ci/nested-sandboxes.toml's, an edit there moving this list with it
# (tools/tests/test_nested_sandboxes.py fails while the two disagree).
isolation = { nested = ["launcher", "ush", "tilo-fs", "tilo-runtime", "tilo-device-steps", "tilo-sandbox-core", "tilo-runtime-bundle", "tilo-session", "tilo-session-client", "tilo-net", "tilo-daemon"] }
# The apps the session's tests start (`tilo_test_env::sibling_binary`), as the session-siblings
# setup in .config/nextest.toml names them for both packages:
# built once by this family's build and kept with its test binaries,
# each shard is handed them (NEXTEST_BIN_EXE_<bin>) and the setups build nothing. The app host's
# trust test installs with the installer it finds beside its own build (`tilo-install`), which
# tools/ci/nextest.sh built only where it was named the package: a shard names none. A run of a
# package .config/nextest-capabilities.toml names first runs the capability probe
# (tools/ci/capability_filter.py), handed the same way (tools/tests/test_capability_filter.py
# holds every such package to it).
# Every program is built in this family's own profile, never `fast`: an optimised program is a
# second build of everything it links, and each with features of its own a third, which a change
# to a core crate compiled again for every test run (1,678 of one build's 1,776 compiles were the
# started programs). The one test that is about optimised builds, the app-open budget, is the
# `app-open-budget` family's, which builds them. The launcher keeps `dev-overrides`, which a debug
# build honours anyway, so that family's optimised launcher and this one are one declaration.
# The tilolang runtime host is built with the `test` profile, the one these tests are compiled
# with: the tests install it in a runtime bundle, which carries no program over 256 MiB
# (`runtime-bundle`), and unoptimised with `app-launch` it is 265 MiB of machine code. The `test`
# profile optimises the toolkit crates it is mostly made of (Cargo.toml), which brings it to
# 241 MiB, and those are the units the tests' own build already compiled.
# Each device the session's tests start runs the device daemon, built with `test-support` so it
# starts the session build the test names as its person's shell, which is not installed beside it.
# The Lounge tests start the server daemon, which `tilo-runtime` has only with `agents`, for both
# packages whose tests start it: a featured artifact is built in an invocation of its own, so it
# moves no unit of this family's build. The pam-tilo tests load the PAM module as libpam does:
# this family's build makes the cdylib and every shard is told its file as T_STARTED_CDYLIB_pam_tilo,
# which the pam-module setup step hands to the tests (.config/nextest.toml). The extension helper's
# end-to-end test checks real manifest signatures with the tilo-crypto it is handed.
starts = { tilo-daemon = ["tilo-test-env:tilo-capability-probe", "install:tilo-install", "launcher:tilo-launcher=dev-overrides", "tilolang-process:tilolang-process@test=app-launch", "ush:tilo-ush", "tilo-cli:tilo", "tilo-daemon:tilo-runtime=test-support,agents", "tilo-fs:fs", "discord:discord"], tilo-device-identity = ["tilo-test-env:tilo-capability-probe"], tilo-extension = ["tilo-crypto:tilo-crypto"], tilo-files = ["tilo-test-env:tilo-capability-probe"], tilo-secrets = ["tilo-test-env:tilo-capability-probe"], tilo-identity = ["tilo-test-env:tilo-capability-probe"], tilo-runtime-portal = ["tilo-test-env:tilo-capability-probe"], linux-vm = ["tilo-test-env:tilo-capability-probe"], tilo-session = ["tilo-lock-screen:tilo-lock-screen", "launcher:tilo-launcher=dev-overrides", "tilo-daemon:tilo-runtime=test-support,agents", "example-shared-checklist:example-shared-checklist", "tilolang-process:tilolang-process@test=app-launch"], tilo-session-client = ["tilo-daemon:tilo-runtime=test-support,agents", "launcher:tilo-launcher=dev-overrides", "tilolang-process:tilolang-process@test=app-launch"], pam-tilo = ["pam-tilo:cdylib:pam_tilo"], tilo-device-vpn = ["tilo-test-env:tilo-capability-probe"], tilo-install-helpers = ["tilo-test-env:tilo-capability-probe"], tilo-net = ["tilo-test-env:tilo-capability-probe"], tilo-runtime = ["tilo-test-env:tilo-capability-probe", "launcher:tilo-launcher=dev-overrides", "tilolang-process:tilolang-process@test=app-launch"] }

# The same packages' tests once per architecture: a result on one says nothing about the other.
# It declares `unify` like `test`: these packages' shared libraries resolve as the whole builds of
# every family that declares it resolve them, so all of them build the same units of them. The
# flows' tests are not here either: the shared filters leave them out, and the `flows` check runs
# each flow alone.
[[cargo]]
name = "test-{arch}"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
requires = ["arch={arch}"]
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
unify = "workspace-unify"
packages = [
    "app-catalogue", "app-cli", "compat-service", "env-tools", "tilo-fs-native", "install",
    "launcher", "launcher-macos", "local-model-service", "tilo-runtime-bundle",
    "tilo-agent-session", "tilo-app-builder", "tilo-environment", "tilo-liveness",
    "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-device-steps", "tilolang-cli",
    "tilolang-tilo", "ush", "windows-vm",
]
isolation = { nested = ["launcher", "tilo-runtime-bundle", "tilo-sandbox-core", "tilo-device-steps", "ush"] }
# The font catalog a test's setup step copies is the font-seed check's output. A package here
# whose test prepares the catalog (a bundle's fonts payload, a device step's session swap) links
# none of the crates whose builds bring the seed with them, so the family is given it.
needs = ["font-seed"]
# The programs of other packages these tests find beside their own build: the installer the app
# CLI's install tests run, the render helper an agent's host renders video in, and the tilolang
# host a task's programs run in. Each shard is handed them as the test family's are; a job handed
# none builds it (tools/ci/nextest.sh, or the render helper's setup step, .config/nextest.toml),
# and a shard names none. So is the capability probe a job of a package
# .config/nextest-capabilities.toml names first.
starts = { app-cli = ["install:tilo-install"], launcher = ["tilo-test-env:tilo-capability-probe"], windows-vm = ["tilo-test-env:tilo-capability-probe"], tilo-agent-session = ["tilolang-process:tilolang-process"], env-tools = ["tilo-test-env:tilo-capability-probe"], tilo-runtime-bundle = ["tilo-test-env:tilo-capability-probe"], ush = ["tilo-test-env:tilo-capability-probe"] }
matrix = { arch = ["x86_64", "aarch64"] }

# The packages whose tests cost main a lot for what they catch: on main's newest head when t has
# room (which bisects a failure to its commit), when dispatched, and by name. A build server that
# is never idle never runs them, so nothing every app is built on belongs here: tilo-ui's tests
# are the `test` family's, run on every head they reach.
[[cargo]]
name = "test-idle"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
unify = "workspace-unify"
packages = []
heavy = true
on = ["dispatch", "idle", "stable"]

# The property tests, with more cases: where a rarer failure is worth the time, when dispatched,
# and by name. The count is the `deep` profile's (.config/nextest.toml), which inherits `ci` and
# hands it to these tests alone; a family's `env` would carry it into the build of every unit.
[[cargo]]
name = "test-deep"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "deep", "--tests"]
unify = "workspace-unify"
packages = ["tilo-doc-codecs", "tilo-reference", "tilo-render-protocol"]
heavy = true
on = ["dispatch"]

# Every package's examples build and run (`cargo test --examples`) in the test environment, which
# prepares the pinned font catalog the tests that set text read, with its asset cache in
# the build directory. Dozens of programs nothing else compiles. It declares `unify` too, so the
# libraries these examples share with the other families are built as those families build them,
# once.
[[cargo]]
name = "examples"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "test"
requires = ["arch=x86_64"]
wrapper = ["bash", "-c", "export TILO_TEST_ASSET_CACHE=\"$CARGO_TARGET_DIR/test-assets\"; exec bash tools/test-env.sh \"$@\"", "examples"]
args = ["--locked", "--examples"]
unify = "workspace-unify"
# tools/test-env.sh prepares the pinned font catalog for a command that names no package, as this
# family's commands name none, so each of the family's jobs is given the seed it prepares from.
needs = ["font-seed"]
packages = [
    "tilo-accounts", "app-cli", "tilo-key-group",
    "discord-worker", "imager", "launcher", "local-model-service",
    "tilo-runtime-bundle", "tilo-runtime-portal",
    "tilo-agent-session", "tilo-app", "tilo-bluez",
    "tilo-session-client", "tilo-clipboard", "tilo-cpu-raster", "tilo-dialogs", "tilo-doc-codecs",
    "tilo-doc-pdf", "tilo-files", "tilo-font-catalog", "tilo-fs", "tilo-install-helpers",
    "tilo-location", "tilo-model-gateway", "tilo-notify",
    "tilo-paint-stream", "tilo-pdf", "tilo-staging-reclaim", "tilo-ui", "tilo-device-steps",
    "tilo-web-search", "tilo-wet-media", "tilolang-process", "tilolang-tilo",
    "ui-examples", "ush", "windows-vm",
]
heavy = true
on = ["dispatch"]

# The flows of docs/architecture/flows.md, one check per flow so a flow still being built can stay
# red without turning an ordinary package's test check red: a flow test is a test whose name
# carries a `flow_<name>` module, and the shared filters (.config/nextest-filters.toml, `flows`)
# leave those out of every run that names no filter of its own. Each entry runs exactly that flow's
# tests, in the package whose tests they are and the way that package's family runs them: a default
# check, so every change it reaches runs it.
#
# Every flow names its own command in a matrix set, and none is the template's default: the tests a
# flow serves move with their package, and a command whose filter then matches nothing fails
# (`--no-tests=fail`) instead of passing with no test run. A flow whose tests another package holds
# adds a matrix entry with its own `-p` and filter, and a run names what it starts the way that
# package's family does. The flows in crates/core/session-client/tests start the server's workspace
# service as a deployment does: the ci profile's `lounge-siblings` setup builds it for the tests its
# filter matches, so a flow module it should build goes in that filter (.config/nextest.toml) and
# the entry is `-p tilo-session-client --test it -E 'test(flow_<name>::)'`. The customer-workspaces
# flow's tests are the device daemon's: they run the daemon in the test's process and start no
# program of another package, so the ci profile's `install-siblings` setup, which serves the
# daemon's tests, is what they get (.config/nextest.toml). A flow run as more than one command keeps
# `--no-tests=pass`, because `t test flows/<flow> --test <name>` leaves the command that does not
# hold the test matching nothing. The VM-only steps of flow 1 (a hosted Browser and a command in a
# VM) are KVM and stay in os/containers/tilo-sh/check.sh.
[[check]]
name = "flows/{flow}"
on = ["idle", "stable"]
# `t test flows/<flow> --test <name>` runs one test of the flow instead of all of them: each
# command reads the names in T_TESTS and runs only those (tools/ci/test_selection.py).
tests = "env"
egress = { to = ["code.tilo.so:443"], pinned = true }
timeout_secs = 1800
# The session-client flows' server runs the workspace's apps under the launcher's sandbox.
isolation = "nested"
[check.matrix]
flow = ["customer-workspaces", "four-devices", "laptop-phone-server"]

[[check.matrix.set]]
when = { flow = "customer-workspaces" }
run = "bash tools/ci/nextest.sh cargo nextest run --locked --profile ci --no-tests=fail -p tilo-daemon --test it -E 'test(language::customer_workspaces::)'\n"

[[check.matrix.set]]
when = { flow = "four-devices" }
run = "bash tools/ci/nextest.sh cargo nextest run --locked --profile ci --no-tests=pass -p tilo-session-client --test it -E 'test(flow_four_devices::)'\n"

[[check.matrix.set]]
when = { flow = "laptop-phone-server" }
run = "bash tools/ci/nextest.sh cargo nextest run --locked --profile ci --no-tests=pass -p tilo-runtime --lib -E 'test(flow_laptop_phone_server::)'\nbash tools/ci/nextest.sh cargo nextest run --locked --profile ci --no-tests=pass -p tilo-session-client --test it -E 'test(flow_laptop_phone_server::)'\n"

# The clippy families run when t has room on main, at every stable head and when asked, not
# with every push: main is the integration branch and gets minimal testing, and the pre-push
# hook already lints what each push changes through these same checks.
#
# Clippy over the workspace: one driver, one unit per crate, shared with `test` and `check` (t's
# compiler cache keys a unit by what it was given, whichever family asked for it). Its selection
# is `check`'s: a member either family leaves out is `clippy-idle`'s or a per-architecture
# family's, so the shared libraries resolve to the same units in both. It declares `unify` like
# the test families: a run that asks for a few of its packages builds them beside workspace-unify,
# so every shared library resolves with the features the family's whole build gives it, and an
# ad-hoc `t cargo clippy -p` of a package resolves them the same way. Its lints don't depend on
# the architecture it runs on (the per-architecture packages are excluded below), so it runs
# anywhere: t gives the Arm node such work only when x86 has no room, so its units stay shared
# with x86's `test` and `check` while x86 can take it.
[[cargo]]
name = "clippy"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
requires = ["arch=any"]
tool = "clippy"
args = ["--locked", "--all-targets"]
unify = "workspace-unify"
trailing = ["-D", "warnings"]
exclude = [
    "app-catalogue", "app-cli", "compat-service", "env-tools", "tilo-fs-native", "imager",
    "install", "launcher", "launcher-macos", "local-model-service",
    "tilo-runtime-bundle", "tilo-agent-session", "tilo-app-builder",
    "tilo-environment", "tilo-liveness", "tilo-messaging-protocol", "tilo-oci-images",
    "tilo-sandbox", "tilo-sandbox-core", "tilo-device-steps", "tilolang-cli", "tilolang-tilo", "ush",
    "windows-vm", "workspace-unify",
]

# The lints `clippy` leaves out: on main's newest head when t has room, when dispatched, and by
# name. It declares `unify` like `clippy`, so a run asking for one of these packages builds it
# alone beside workspace-unify, with the features the family's whole build gives its libraries.
[[cargo]]
name = "clippy-idle"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "clippy"
args = ["--locked", "--all-targets"]
unify = "workspace-unify"
trailing = ["-D", "warnings"]
packages = ["tilo-messaging-protocol"]
heavy = true
on = ["dispatch", "idle", "stable"]

# The same packages' lints once per architecture, and the same `unify` as `clippy`: their shared
# libraries resolve with the features every family that declares workspace-unify gives them, so a
# run asking for one package lints what the family's whole build lints.
[[cargo]]
name = "clippy-{arch}"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "clippy"
requires = ["arch={arch}"]
args = ["--locked", "--all-targets"]
unify = "workspace-unify"
trailing = ["-D", "warnings"]
packages = [
    "app-catalogue", "app-cli", "compat-service", "env-tools", "tilo-fs-native", "imager",
    "install", "launcher", "launcher-macos", "local-model-service",
    "tilo-runtime-bundle", "tilo-agent-session", "tilo-app-builder",
    "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core",
    "tilo-device-steps", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm",
]
matrix = { arch = ["x86_64", "aarch64"] }

# The page's lints: the crates that build for wasm32-unknown-unknown, under the page's own Clippy
# configuration, whose banned methods include std's clocks, which panic in a browser page and which
# the root clippy.toml cannot ban for every target (tools/ci/wasm_clippy_conf.py says why).
# tools/ci/page-clippy.sh, this family's wrapper, writes that configuration and exports it, so
# every build here is linted under it. The crates are `python3 -I tools/ci/package_sets.py wasm`
# and the page's entry, and tools/tests/test_package_sets.py fails while this list and the set
# derived there disagree. No `unify`: workspace-unify is a host crate that builds nothing for
# wasm32, no native family shares a unit with these, and the page's own build compiles each of
# them with the features cargo resolves for it.
[[cargo]]
name = "clippy-page"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "clippy"
args = ["--locked", "--target", "wasm32-unknown-unknown"]
wrapper = ["bash", "tools/ci/page-clippy.sh"]
trailing = ["-D", "warnings"]
packages = [
    "tilo-key-group", "tilo-browser-runtime",
    "tilo-clipboard", "tilo-local-time", "tilo-dialogs", "tilo-files", "tilo-image-codec",
    "tilo-location", "tilo-media", "tilo-net", "tilo-notify", "tilo-peer-state", "tilo-rt",
    "tilo-secrets", "tilo-session-client", "tilo-workspace-service",
    "tilolang-web", "tilolang-window", "workspace-unify",
]

# The packages CI also checks as they ship (tools/ci/package_features.py): their default build,
# the feature set that ships, beside the union of features workspace-unify gives them in every
# other clippy family. A lint that only saw the unified shape never compiles code the default
# build leaves out. `default-builds-{arch}` compiles their tests when dispatched; this lints them
# on every change. No `unify`: the default feature set is the point, and
# tools/tests/test_package_sets.py fails while this list and that table disagree.
[[cargo]]
name = "clippy-shipped"
on = ["dispatch", "idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "clippy"
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
packages = [
    "tilo-collaboration", "imager", "tilo-crypto", "tilo-model-gateway", "tilo-net",
    "tilo-test-env",
]

# `cargo check` alone, when someone wants a package's errors without clippy's lints or a build.
# Its members are `clippy`'s: `clippy-idle` and the per-architecture families cover what both
# leave out, and the shared libraries keep one unit per crate across the two selections. It
# declares `unify` too: a run that asks for a few of its packages builds them beside
# workspace-unify, so every shared library resolves with the features the family's whole build
# gives it, and an ad-hoc `t cargo check -p` of a package resolves them the same way.
#
# It is main's gate (`gate`): every head of main asks it whatever its change reaches, and its one
# job stands ahead of people's work in line, so a head that doesn't compile is said within minutes
# of its push instead of waiting behind the queue. That is the check the compiler cache serves
# warmest: every `t cargo check`, `t test` and `t cargo test` compiles these units, so a head pays
# only for what its change moved. A package the family leaves out builds for another platform or
# architecture (its `clippy-{arch}` family has it), so no single native check covers it.
[[cargo]]
name = "check"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "check"
args = ["--locked", "--all-targets"]
unify = "workspace-unify"
exclude = [
    "app-catalogue", "app-cli", "compat-service", "env-tools", "tilo-fs-native", "imager",
    "install", "launcher", "launcher-macos", "local-model-service",
    "tilo-runtime-bundle", "tilo-agent-session", "tilo-app-builder",
    "tilo-environment", "tilo-liveness", "tilo-messaging-protocol", "tilo-oci-images",
    "tilo-sandbox", "tilo-sandbox-core", "tilo-device-steps", "tilolang-cli", "tilolang-tilo", "ush",
    "windows-vm", "workspace-unify",
]
default = false
gate = true

# The page's compile, as main's gate beside `check`: the crates clippy-page lints, built for
# wasm32-unknown-unknown with no lints, asked of every head of main and ranked with `check`. No
# `wrapper`: the page's clippy configuration bans std's clocks for lints, and a compile alone
# needs none of it. No `unify`: workspace-unify builds nothing for wasm32, and the page's own
# build compiles each of these with the features cargo resolves for it. The packages are
# clippy-page's, and tools/tests/test_package_sets.py fails while either list disagrees with the
# set derived there.
[[cargo]]
name = "check-page"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "check"
args = ["--locked", "--target", "wasm32-unknown-unknown"]
gate = true
default = false
packages = [
    "tilo-key-group", "tilo-browser-runtime",
    "tilo-clipboard", "tilo-local-time", "tilo-dialogs", "tilo-files", "tilo-image-codec",
    "tilo-location", "tilo-media", "tilo-net", "tilo-notify", "tilo-peer-state", "tilo-rt",
    "tilo-secrets", "tilo-session-client", "tilo-workspace-service",
    "tilolang-web", "tilolang-window", "workspace-unify",
]

# The visual goldens: tilo-ui's baselines are pixels, under the filter
# `.config/nextest-filters.toml` keeps (`golden`), on the project's builder image. That is the
# image the repository's own visual-goldens runs render and verify on, and a renderer that moves
# pixels fails there with a diff, so a second pinned builder only made every render compile the
# workspace again under another compiler identity. They stay on x86_64: on aarch64 seven of them
# come out different (`nightly-arm64-goldens`), so a result from there would not stand for both.
# `packages` and `unify` keep the build to this package and make its units the test and
# test-idle families' units, which the compiler cache serves.
[[cargo]]
name = "goldens"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
requires = ["arch=x86_64"]
unify = "workspace-unify"
packages = ["tilo-ui-app"]
wrapper = ["bash", "-c", "export TILO_FONT_ASSET_CACHE=\"$CARGO_TARGET_DIR/font-artifacts\"; exec bash tools/test-env.sh \"$@\"", "goldens"]
args = ["--locked", "--profile", "ci", "--tests", "--no-tests=pass", "-E", "(package(tilo-ui-app) and test(typography_visual_regression::))"]
# The tests resolve their pixel baselines through tools/test-assets.py, and tools/test-env.sh
# prepares the fonts they are set in: the family's jobs are given both seeds.
needs = ["font-seed", "test-assets"]
on = ["schedule:0 3 * * *", "idle", "stable"]

# The app-open budget: the session opens every installed app and holds each open to the splash
# budget its manifest declares, counted as the work the session, the launcher and the app run
# (crates/desktop/session/tests/app_open_budget.rs). That work is a person's only on optimised
# builds, so the session (with the overrides its tests sign in with), the launcher and the tilolang
# runtime are built with the `fast` profile, as a dev image builds them. A started build of the
# session's own binary reaches the test as T_STARTED_BIN_<bin>_<profile>_<features>
# (`tilo_test_env::started_variant`). Those builds are a second build of everything they link, so
# this test is not the `test` family's, which leaves it out (`.config/nextest-filters.toml`,
# `budgets`): it runs on main's newest head when t has room, which bisects a failure to its
# commit, when dispatched, and by name. `unify` keeps the test binary the `test` family's build.
[[cargo]]
name = "app-open-budget"
egress = { to = ["code.tilo.so:443"], pinned = true }
tool = "nextest"
requires = ["arch=x86_64"]
wrapper = ["bash", "tools/ci/nextest.sh"]
unify = "workspace-unify"
packages = ["tilo-session"]
args = ["--locked", "--profile", "ci", "--tests", "-E", "(package(tilo-session) and binary(it) and test(app_open_budget::))"]
isolation = { nested = ["tilo-session"] }
starts = { tilo-session = ["tilo-session:tilo-session@fast=dev-overrides", "tilo-lock-screen:tilo-lock-screen", "launcher:tilo-launcher@fast=dev-overrides", "tilo-daemon:tilo-runtime=test-support,agents", "example-shared-checklist:example-shared-checklist", "tilolang-process:tilolang-process@fast=app-launch"] }
heavy = true
on = ["dispatch", "idle", "stable"]

# The repository policy suite, one check per step of `tools/policy/steps.toml`: the step's own
# command, so `t test policy` runs the suite and `t test policy/<step>` one step. That file is the
# list, so a step added there is a check here without a t.toml edit. Its `unit` step, which runs
# every unit test in one go, is left out: `policy/unit/<file>` below runs them, one check per test
# file, so a failure is attributed to the file it is in.
[[check]]
name = "policy/{step}"
run = "{step.run}"
# A step reads the tree, never the machine it runs on, so its result stands on every
# architecture and it runs wherever there is room, the Arm node included. So do the unit tests
# below, except the few that ask the machine itself; those keep x86_64 in their own `set`s.
requires = ["arch=any"]
[check.matrix]
step = { from_toml = "tools/policy/steps.toml", key = "step" }
exclude = [{ step = "unit" }]

# The steps that read the Git view (the index, `ls-files`, the log): t gives a job a `.git` only
# when its check says `git = true`, and keys such a check by the commit, so only these rerun on
# every commit. A step added to `steps.toml` that reads Git is added here too.
[[check.matrix.set]]
when = { step = "format-migrations" }
git = true
# It fetches the released branch (stable), which a job's Git view doesn't hold, to keep every
# format's floor at or below what released devices wrote. Not pinned: a new release reruns it.
egress = { to = ["code.tilo.so:443"] }

[[check.matrix.set]]
when = { step = "image-builder-inputs" }
git = true

[[check.matrix.set]]
when = { step = "image-interpreters" }
git = true

[[check.matrix.set]]
when = { step = "interfaces" }
git = true

[[check.matrix.set]]
when = { step = "public-references" }
git = true

[[check.matrix.set]]
when = { step = "repository-layout" }
git = true

[[check.matrix.set]]
when = { step = "seeded-state-history" }
git = true

[[check.matrix.set]]
when = { step = "setup-neutral" }
git = true

[[check.matrix.set]]
when = { step = "source-content" }
git = true

[[check.matrix.set]]
when = { step = "suites" }
git = true

[[check.matrix.set]]
when = { step = "test-cargo" }
git = true

[[check.matrix.set]]
when = { step = "test-spawns" }
git = true

[[check.matrix.set]]
when = { step = "too-many-arguments" }
git = true

[[check.matrix.set]]
when = { step = "workspace-membership" }
git = true

[[check.matrix.set]]
when = { step = "words-that-go" }
git = true

# The policy suite's own tests, one check per test file: `policy/unit/<file>`. A failed test is
# attributed to the file it is in, so a change reruns the tests whose inputs it moved and nothing
# else.
[[check]]
name = "policy/unit/{test}"
run = "python3 tools/policy/run_unit_tests.py tools/tests/test_{test}.py"
requires = ["arch=any"]
[check.matrix]
test = { from = "tools/tests/test_*.py" }

# The suite reads the tree and copies it into temporary directories, so its result is the same
# on either architecture. These ask the machine itself and stay on x86_64: the OS build is
# planned for the host's architecture and tests that board, the CET test compiles with the
# host's compiler for an x86-only marker, the verifier-bundle test hands the check the host's
# architecture and its own ELF binaries, the extension-manifest test resolves for the machine's
# architecture (the script refuses any other), and the push-lint test expects the clippy family
# of the machine's architecture. Two read the host more directly: the environment test reads its
# tools, PATH and Vulkan drivers, and the Chromium test reads `/proc` and the host's name to find
# its own processes.
[[check.matrix.set]]
when = { test = "build_os" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "chrome_process_cleanup" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "extension_publish" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "pre_push_lint" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "shstk_mark" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "test_environment" }
requires = ["arch=x86_64"]

[[check.matrix.set]]
when = { test = "verifier_bundle_checks" }
requires = ["arch=x86_64"]

# The tests that ask Git about the tree they run in: the tracked files (`ls-files`), the commit
# (`rev-parse`) or the log, also through the scripts they run (`tools/ci/build-os.sh`,
# `tools/ci/suites.py`). The rest of the suite makes its own repositories in temporary
# directories and needs no `.git` here, so only these are keyed by the commit.
[[check.matrix.set]]
when = { test = "browser_runtime_release" }
git = true

[[check.matrix.set]]
when = { test = "build_os" }
git = true

[[check.matrix.set]]
when = { test = "check_image_interpreters" }
git = true

[[check.matrix.set]]
when = { test = "check_seeded_state_history" }
git = true

[[check.matrix.set]]
when = { test = "ci_select" }
git = true

# The font tests, the installer test (which stages the session layer's fonts) and the catalog's
# own test (whose build script prepares the catalog) read the reviewed font pins, artifacts of
# the release store rather than files of the tree. They read them from the font-seed check's
# output, every pin of this tree laid out by its digest, as the machine's seed, so none of them
# reaches the network for a font.
[[check.matrix.set]]
when = { test = "component_manifest" }
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }

[[check.matrix.set]]
when = { test = "font_artifacts" }
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }

[[check.matrix.set]]
when = { test = "font_catalog" }
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }

[[check.matrix.set]]
when = { test = "image_builder_inputs" }
git = true

[[check.matrix.set]]
when = { test = "macos_collection" }
git = true

[[check.matrix.set]]
when = { test = "macos_font_catalog" }
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }

[[check.matrix.set]]
when = { test = "signal_runtime_staging" }
git = true

[[check.matrix.set]]
when = { test = "suites" }
git = true

# The environments it sets up prepare the pinned font catalog. They read the fonts from the
# font-seed check's output, every pin of this tree laid out by its digest, where they would read
# the builder image's seed: one taken before a pin changed would send them to the release store,
# which this check has no network to reach.
[[check.matrix.set]]
when = { test = "test_environment" }
git = true
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }

[[check.matrix.set]]
when = { test = "workflow_package_paths" }
git = true

# Test suites outside Cargo, one check per group of `tools/ci/suites.toml`: `suite-<group>` runs
# the group's suites in the ci-fast image, which is what `file`-shaped tests need. The group list
# is the file's, so a group added there is a check here. A group runs on a head of main whose
# change moves its inputs and on every head of stable; the
# `os` group needs root over throwaway fixtures and a disk, so it is a micro-VM step and waits for
# a dispatch or main's room.

[[check]]
name = "suite-{group}"
run = "python3 -I tools/ci/suites.py run --jobs 8 --group {group}"
image = "registry.tilo.so/tilo/ci-fast@sha256:c7be92bd00fa759dc586916e7bccbb93179fe7b358c6a05a12bc31d8ea48ab6f"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
[check.matrix]
group = { from_toml = "tools/ci/suites.toml", key = "group" }

[[check.matrix.set]]
when = { group = "os" }
isolation = "vm"
# The runtime font payload's test prepares the SDK catalog: it reads the build's font
# seed, as this group runs without network.
needs = ["vm-test-binaries", "font-seed"]
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin", TILO_STAGING_HANDOFF_BIN = "/target/debug/tilo-staging-handoff", TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1" }
on = ["dispatch", "idle", "stable"]
heavy = true

[[check.matrix.set]]
when = { group = "browser-runtime-web" }
run = "python3 -I tools/ci/suites.py run --jobs 8 --group browser-runtime-web"

# ---- Per-area checks -------------------------------------------------------------
#
# Every other check, by area: the app SDKs, the browsers and their pages, the platform
# integrators, the virtual machines and their guests, the images and their chains, the
# publishing steps, and the nightly, weekly and performance runs. Each keeps the command it ran,
# the image it ran in and what it needs. Nothing declares what it reads or what it costs, and a
# check that names one architecture in a matrix asks for it with `requires = ["arch={arch}"]`.

[[check]]
name = "miracast-capture"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/test-env.sh cargo test --locked -p tilo-projector-broker --bin tilo-projector session::miracast"
image = { check = "image-ci-builder-x86_64", path = "/target/publish/ci-builder/x86_64/image.oci.tar" }
env = { TILO_REQUIRE_SCREEN_CAPTURE = "1", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1" }
requires = ["arch=x86_64"]
on = ["dispatch"]
heavy = true

[[check]]
name = "bench-imagefilter"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "crates/lang/tilolang-tilo/bench/imagefilter/build.sh"
outputs = ["/target/wasm32-unknown-unknown/release/tilolang_bench_imagefilter.wasm"]
default = false

# The test that applies an installed app's action from the package an image
# installs, not one the test compiled: Database Client's `.tapp` is built by
# the image's own pack path (tools/apps/tilolang_packages.sh, which
# os/scripts/pack-apps.sh calls; tools/ci/pack-model-tapp.sh drives it), and
# the test loads the module that package carries and runs the app's own verb
# through it. It is `#[ignore]`d in its package's own test family, which hands
# it no package, and run here.
[[check]]
name = "test-packaged-model"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "set -euo pipefail\nbash tools/ci/pack-model-tapp.sh /target/packaged-model db-client\nTILO_APP_PACKAGE=/target/packaged-model/so.tilo.db-client.tapp cargo test --locked -p tilolang-runtime --test it packaged_app -- --ignored\n"

[[check]]
name = "codemap"
requires = ["arch=any"]
run = "python3 -I tools/docs/codemap.py --check"
fix = "python3 -I tools/docs/codemap.py"

# The developer documentation's reference pages are written from what they
# document (tools/docs/reference), never copied: a generator reads the Python
# SDK, the `tilo` command or the runtime's own tool list and writes one page,
# and stops when a public item has no doc text. So a reference cannot describe
# something the tree no longer has, and the pages are complete or this is red.
# The site publishes what these write.
[[check]]
name = "docs-reference"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
# The `tilo` it runs is the one its need built, so both run on one architecture: an arm build
# restored on an x86 node execs as `Exec format error`.
requires = ["arch=x86_64"]
run = "bash tools/ci/docs-reference.sh"
needs = ["docs-reference-bins"]
outputs = [
  "/target/docs/generated/rest-api.md",
  "/target/docs/generated/python-sdk.md",
  "/target/docs/generated/cli.md",
  "/target/docs/generated/mcp-tools.md",
]

# The two commands the reference pages run: built once here, so the pages
# check reads what they print instead of building them again.
[[check]]
name = "docs-reference-bins"
egress = { to = ["code.tilo.so:443"], pinned = true }
# The binary these outputs carry is exec'd by `docs-reference`, which is x86_64 for that reason.
requires = ["arch=x86_64"]
run = "cargo build --locked -p tilo-cli -p tilo-daemon --bin tilo --bin tilo-runtime\n"
outputs = ["/target/debug/tilo", "/target/debug/tilo-runtime"]
default = false

# The same for the TypeScript SDK, whose page is read with the TypeScript
# compiler API: it needs bun and the SDK's locked packages, which the ci-sdk
# image carries (sdk-typescript's image).
[[check]]
name = "docs-reference-sdk"
on = ["idle", "stable"]
run = "bash tools/ci/docs-reference-sdk.sh"
needs = ["sdk-gen"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
outputs = ["/target/docs/generated/typescript-sdk.md"]

# The developer docs served at https://tilo.sh/docs/ (tools/docs/build-site.sh): the pages of
# docs/tilo-sh/pages.toml with the reference pages the two checks above generated from the code, so the
# web entry's image ships the docs of the commit it is built from.
[[check]]
name = "docs-site"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/docs/build-site.sh /target/docs/site /target/docs/generated"
needs = ["docs-reference", "docs-reference-sdk"]
outputs = ["/target/docs/site/**"]
git = true

[[check]]
name = "fmt"
requires = ["arch=any"]
run = "cargo fmt --check"
fix = "cargo fmt"

[[check]]
name = "hakari"
run = "if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then\n  echo \"crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (docs/policies.md).\" >&2\n  exit 1\nfi\ncargo hakari verify\n"
image = "registry.tilo.so/tilo/ci-fast@sha256:c7be92bd00fa759dc586916e7bccbb93179fe7b358c6a05a12bc31d8ea48ab6f"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
fix = "cargo hakari generate && cargo hakari manage-deps --yes"

[[check]]
name = "sdk-licenses"
requires = ["arch=any"]
run = "python3 -m unittest tools/tests/test_sdk_licenses.py && python3 -I tools/sdk/check_licenses.py"

[[check]]
name = "client-licenses"
