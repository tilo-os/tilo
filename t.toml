  # grows by the room the foreign ESP takes, which the root must not
  # grow into; the guest adds it (os/tests/shared_disk_esp.sh) and
  # boots with it in place.
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh hold-size"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl poweroff" || true
