# The compiled helpers the micro-VM invariant runs (security, suite-os) call. Every
# workspace member builds the workspace hack, wgpu and naga with it, which a cold
# compile inside those small VMs cannot fit in memory; they are built here, where
# builds are warm, and the VM's /target holds them at these paths. It runs where they
# do, as their need, not on every commit of its own.
[[check]]
name = "vm-test-binaries"
default = false
requires = ["arch=x86_64"]
run = """
cargo build --locked -p tilo-image-policy-check -p tilo-crypto -p tilo-esp-write -p tilo-board-successor \\
  -p tilo-install-helpers --bin tilo-image-policy-check --bin tilo-crypto --bin tilo-esp-write \\
  --bin tilo-board-successor --bin tilo-staging-handoff
"""
outputs = ["/target/debug/tilo-image-policy-check", "/target/debug/tilo-crypto", "/target/debug/tilo-esp-write", "/target/debug/tilo-board-successor", "/target/debug/tilo-staging-handoff"]

# Shell, image-configuration and workflow invariants, in ci-fast, which carries
# their fixture tools. Several write to /var/tmp (installer and publication
# fixtures, rpmbuild's scratch directory), which is the check's own.
[[check]]
name = "security"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin", TILO_IMAGE_POLICY_CHECK_BIN = "/target/debug/tilo-image-policy-check", TILO_CRYPTO_BIN = "/target/debug/tilo-crypto", TILO_ESP_WRITE_BIN = "/target/debug/tilo-esp-write", TILO_BOARD_SUCCESSOR_BIN = "/target/debug/tilo-board-successor", TILO_STAGING_HANDOFF_BIN = "/target/debug/tilo-staging-handoff" }
requires = ["arch=x86_64"]
# The Wine producer's static i686 probe needs the 32-bit syscall ABI, which the
# job sandbox refuses on x86_64; a micro-VM has it.
isolation = "vm"
