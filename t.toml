# The launcher's script entrypoints, on the runtime packages they name: bun and
# CPython, built here from their pinned upstream releases
# (tools/apps/runtime_packages.sh) into the unpacked packages the tests read.
# The launcher's own check leaves them out, since its job has no package tree;
# this one runs them and refuses a skip.
[[check]]
name = "script-runtimes-{arch}"
on = ["idle", "stable"]
# The Python runtime's SDK imports the types the generator writes, which are built where they are
# used and never committed: the bundle carries the sdk-gen check's output.
needs = ["sdk-gen"]
# Fetches bun's and CPython's release assets, which GitHub sends on to CDN hosts no fixed list
# names. Pinned: every asset's SHA-256 is in os/external-assets/github-assets.tsv, and the
# packages are signed here with a throwaway key that never leaves the job.
egress = { to = ["0.0.0.0/0", "::/0"], pinned = true }
run = '''set -euo pipefail
work=$TMPDIR/script-runtimes
packages=$work/packages
bin=$CARGO_TARGET_DIR/debug
mkdir -p "$packages"
cargo build --locked -p tilo-runtime-bundle -p tilo-app-package-cli \
    -p tilo-sdk-node-native -p tilo-sdk-python-native -p tilo-automerge-isolate
identity=$work/publisher.json
"$bin/tilo-runtime-bundle" key generate --out "$identity"
# The packages are fixtures for the launcher's tests: a throwaway publisher, a version of no
# release, and the full archive kept so it can be unpacked.
export PACK_RUNTIME_KEEP_FULL=1
export TILO_GITHUB_ASSET_CACHE=$work/assets TILO_ASSET_STORE=
# shellcheck source=/dev/null
. tools/apps/runtime_packages.sh
for name in $(runtime_package_versions); do
    provides=$(runtime_package_build "$name" "$bin/tilo-runtime-bundle" "$bin" \
        "$identity" "$packages" 0.0.0)
    version=${provides#*/}
    tapp=$(find "$packages/runtime-package/language/$name" -maxdepth 1 -name 'full-*.tapp' -print -quit)
    test -n "$tapp"
    "$bin/tilo-app-package" unpack --dest "$packages/$version" "$tapp"
    mv "$packages/$version/manifest.toml" "$packages/$name.manifest.toml"
    "$bin/tilo-runtime-bundle" key pubkey --identity "$identity" > "$packages/$name.publisher"
done
# The tests skip when no package tree is handed to them, which a passing run does not show:
# hand them this one, and refuse a skip or any count but the two.
export TILO_RUNTIME_PACKAGES=$packages
output=$(bash tools/test-env.sh cargo test --locked -p launcher --test it -- script_entrypoint:: --nocapture --test-threads=1 2>&1) || {
    printf '%s\n' "$output"
    exit 1
}
printf '%s\n' "$output"
case "$output" in
    *"skipping:"*) echo "script-runtimes: a test skipped for a missing runtime package" >&2; exit 1 ;;
esac
grep -q 'test result: ok. 2 passed' <<<"$output" || {
    echo "script-runtimes: the two script entrypoint tests did not both pass" >&2
    exit 1
}
'''
requires = ["arch={arch}"]
isolation = "nested"
heavy = true
timeout_secs = 3600
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "imager-tests-build-{arch}"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "set -eu\nmkdir -p \"$CARGO_TARGET_DIR/vm\"\n# nextest keeps its store at the repository's target/nextest unless told otherwise, and the\n# sources are read-only: a tool config moves it into the build directory.\nprintf '[store]\\ndir = \"%s/nextest\"\\n' \"$CARGO_TARGET_DIR\" > \"$CARGO_TARGET_DIR/vm/nextest-store.toml\"\ncargo nextest archive --locked --profile ci --tests -p imager -p workspace-unify \\\n  --tool-config-file \"t:$CARGO_TARGET_DIR/vm/nextest-store.toml\" \\\n  --archive-file \"$CARGO_TARGET_DIR/vm/imager-tests-{arch}.tar.zst\"\n"
requires = ["arch={arch}"]
outputs = ["/target/vm/imager-tests-{arch}.tar.zst"]
[check.matrix]
arch = ["x86_64", "aarch64"]

# The imager's tests in eight micro-VMs at once, each running the eighth of them nextest's
# `--partition hash:<shard>/8` picks: together every test, each in exactly one shard. One guest ran
# all 1508 in 451-460 s on the one vCPU t gives it (NEXTEST_TEST_THREADS=1, 0.83 cores busy), the
# whole of main's critical path after the build (r7c0fe71230, rcfccbdee7e, 2026-11-06); a shard's
# own start (the guest, the archive's extraction, the test environment) is about 3 s.
# `t test imager-tests-<arch>` names all of an architecture's shards.
[[check]]
name = "imager-tests-{arch}/{shard}"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "set -eu\n# The guest's /var/tmp is on the step's own scratch disk, an empty ext4 t makes for each step\n# (its README, \"Micro-VM steps\"), not the node's filesystem. The tests assert the filesystem\n# themselves and fail, naming it, on any other. /var/tmp itself is world-writable, which the\n# publication of an installed system refuses among its target's ancestors (as a job's private\n# TMPDIR never is), so a directory on it is mounted at /imager, below / alone.\necho \"imager-tests-{arch}/{shard}: $(nproc) vCPUs; /var/tmp is $(awk '$2 == \"/var/tmp\" { print $3 }' /proc/mounts)\"\nmkdir -p /var/tmp/imager /imager\nmount --bind /var/tmp/imager /imager\nchmod 700 /imager\nexport TMPDIR=/imager/tmp TILO_IMAGER_TEST_CACHE_ROOT=/imager/cache\nmkdir -p \"$TMPDIR\" \"$TILO_IMAGER_TEST_CACHE_ROOT\"\n# The tests run as the guest's root, with its capabilities: the original-image review's refusal\n# of a changed held image is observed only so (as uid 0 without capabilities, the job\n# sandbox's identity, it fails), and the fixtures that need root run instead of skipping.\n# nextest's store, as in imager-tests-build-{arch}: not in the read-only sources.\nprintf '[store]\\ndir = \"/var/tmp/nextest\"\\n' > /var/tmp/nextest-store.toml\nbash tools/test-env.sh cargo nextest run --profile ci --no-fail-fast \\\n  --tool-config-file t:/var/tmp/nextest-store.toml \\\n  --archive-file /target/vm/imager-tests-{arch}.tar.zst --workspace-remap /src \\\n  --partition hash:{shard}/8\n"
needs = ["font-seed", "imager-tests-build-{arch}"]
env = { TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_FONT_ASSETS_OFFLINE = "1", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
requires = ["arch={arch}"]
isolation = "vm"
[check.matrix]
arch = ["x86_64", "aarch64"]
shard = ["1", "2", "3", "4", "5", "6", "7", "8"]

