# Tilo's checks, run with t.
#
# Nothing here says what a check reads: t records what each job reads as it runs and keys its
# result by that, so an edit reruns the checks whose files it moved and nothing else. Nothing here
# says how much a check costs: t books each job from what its runs measured and grows it.
#
# When a check runs is two fields. A check that names no `on` is a default one: it is in `all` and
# in the run of every new head of a followed branch, so `main` integrates ungated: a push is never
# held, and whoever broke a check is told and fixes it forward. `default = false` leaves it out of
# those. `on` names the places the server runs a check by itself: `stable` (release candidates),
# `idle` (main's newest head when t has room, bisected and attributed when it fails), `dispatch`,
# `schedule:<cron>` and `tag:<glob>`. A check that names an `on` runs there and when asked, not
# with every change; `default = true` beside an `on` runs it on every change too. There is no queue
# and no gate: a change runs what `t scope` says it reaches, and `t suggest` names the opt-in
# checks it moves.
#
# `heavy = true` marks a check a candidate for `stable` is verified by, and not part of an ordinary
# change's run.

# The image every check runs in unless it says otherwise: pinned by digest, so a moving tag can't
# change what a check runs in without a commit saying so. Move it by changing this line.
image = "registry.tilo.so/tilo/tilo-builder@sha256:a6f389d770ee5acb65b7a03d67c0d619c7acb147b64ce6511337ac5548e9dce5"

[env]
XDG_RUNTIME_DIR = "/tmp/tilo-xdg-runtime"
# Debug info is what the test binaries' panics need, not the debugger: line tables only, which is
# what the profiles in Cargo.toml ask for anyway.
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
# Test executables without their symbol table: symbol names are about half of each one, and
# stripping them makes a test binary 56-58% smaller (tilo-fs's lib tests 268 MB to 118 MB) to
# link, store, move and load. What it costs: a backtrace no longer names its functions; a panic's
# or an assert's message still says file:line. Cargo applies it to the `test` profile only, which
# `cargo test` and nextest build every test executable with. The packages whose tests read the
# symbol table keep it (`[profile.test.package.*] strip = false` in Cargo.toml).
# To keep symbols in every test binary again, delete this line.
CARGO_PROFILE_TEST_STRIP = "symbols"
# A warning in any crate of a target the CI builds is an error, in every check that compiles.
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
# Software Vulkan everywhere: no CI node has a GPU, and every render check renders the same way
# on all of them.
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_NAME = "llvmpipe"

# The workspace packages whose own sources differ between x86_64 and aarch64. Their tests and
# lints run once per architecture (`test-x86_64`, `test-aarch64`, `clippy-x86_64`,
# `clippy-aarch64`): a result on one says nothing about the other, which a check that requires no
# architecture would let it stand for. `package-sets` fails while this list and
# `python3 tools/ci/package_sets.py per-arch` disagree.
#
# app-catalogue app-cli browser compat-service env-tools fs-native install launcher launcher-macos
# local-model-service runtime-bundle store tilo-agent-participant tilo-app-cli
# tilo-environment tilo-liveness tilo-oci-images tilo-sandbox tilo-sandbox-core tilo-vmd
# tilolang-cli tilolang-tilo ush windows-vm

# Tests, one check per package: `test/<package>`. The driver runs nextest once over the whole
# family, so a shared dependency compiles once for all of them, and t shards each test binary by
# its measured per-test time.
[[cargo]]
name = "test"
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# A run that asks less than the whole family (`t test test/settings-store` after an edit) builds
# just the packages it asks for, and this one beside them: its manifest declares every member's
# features as the family's whole build resolves them (tools/ci/workspace_unify.py generates it
# over the family's members, the test features included), so the narrowed selection's units are
# the units the whole build makes and its tests are the family's tests, not a feature-starved
# subset. t selects this package itself for such a run; a whole-family run has no use for it.
unify = "workspace-unify"
# What does not run here: the per-arch packages (their own families), `workspace-unify` (a
# generated crate, checked by `workspace-unify-<arch>`), the idle packages (their own family) and
# the two whose tests need a disk of their own (`imager-tests-<arch>`, VM steps).
exclude = [
    "app-catalogue", "app-cli", "browser", "canvas", "compat-service", "env-tools", "fs-native",
    "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service",
    "music", "pdf-viewer", "runtime-bundle", "store", "tilo-agent-participant",
    "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox",
    "tilo-sandbox-core", "tilo-ui", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush",
    "windows-vm", "workspace-unify",
]
# The tests that start sandboxes of their own need nested namespaces, which a job's sandbox does
# not give them: the session's own tests are here too, because installing an app and opening it is
# the launcher's sandbox, built with bubblewrap in a user namespace of its own. The packages are
# tools/ci/nested-sandboxes.toml's, an edit there moving this list with it
# (tools/tests/test_nested_sandboxes.py fails while the two disagree).
isolation = { nested = ["launcher", "ush", "tilo-fs", "tilo-runtime", "tilo-vmd", "settings", "tilo-sandbox-core", "thumbnails", "runtime-bundle", "tilo-session"] }
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
# The apps the session's tests start (`tilo_test_env::sibling_binary`), as the session-siblings
# setup in .config/nextest.toml names them for both packages, and for the session the three the
# chat-siblings setup names (Chat, the launcher that starts it beside the session, the runtime it
# runs on, for `chat_2x2`): built once by this family's build and kept with its test binaries,
# each shard is handed them (NEXTEST_BIN_EXE_<bin>) and the setups build nothing. The app host's
# trust test installs with the installer it finds beside its own build (`tilo-install`), which
# tools/ci/nextest.sh built only where it was named the package: a shard names none.
starts = { tilo-session = ["tilo-lock-screen:tilo-lock-screen", "osk:osk", "tilo-quick-settings:tilo-quick-settings", "chat:chat", "launcher:tilo-launcher", "tilo-runtime:tilo-runtime"], tilo-quick-settings = ["tilo-lock-screen:tilo-lock-screen", "osk:osk", "tilo-quick-settings:tilo-quick-settings"], app-host = ["install:tilo-install"] }

# The same packages' tests once per architecture: a result on one says nothing about the other.
[[cargo]]
name = "test-{arch}"
tool = "nextest"
requires = ["arch={arch}"]
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
packages = [
    "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "install",
    "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "store",
    "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness",
    "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli",
    "tilolang-tilo", "ush", "windows-vm",
]
isolation = { nested = ["launcher", "runtime-bundle", "tilo-sandbox-core", "tilo-vmd", "ush"] }
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
# The programs of other packages these tests find beside their own build: the installer the app
# CLI's install tests run, and the render helper an agent's host renders video in. Each shard is
# handed them as the test family's are; tools/ci/nextest.sh built them only where it was named
# the package, and a shard names none.
starts = { app-cli = ["install:tilo-install"], tilo-agent-participant = ["tilo-video-render:tilo-video-render"] }
matrix = { arch = ["x86_64", "aarch64"] }

# The packages whose tests cost main a lot for what they catch: on main's newest head when t has
# room (which bisects a failure to its commit), on release candidates, and by name.
[[cargo]]
name = "test-idle"
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
packages = ["canvas", "music", "pdf-viewer", "tilo-ui"]
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
heavy = true
on = ["stable", "dispatch", "idle"]

# The property tests, with more cases: on release candidates, where a rarer failure is worth the
# time, and by name.
[[cargo]]
name = "test-deep"
tool = "nextest"
wrapper = ["bash", "tools/ci/nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
packages = ["frame-link", "tilo-doc-codecs", "tilo-reference", "tilo-render-protocol"]
env = { PROPTEST_CASES = "256", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
heavy = true
on = ["stable", "dispatch"]

# Every package's examples build and run (`cargo test --examples`), with the test environment's
# asset and NTFS caches in the build directory. Dozens of programs nothing else compiles.
[[cargo]]
name = "examples"
tool = "test"
requires = ["arch=x86_64"]
wrapper = ["bash", "-c", "export TILO_TEST_ASSET_CACHE=\"$CARGO_TARGET_DIR/test-assets\" TILO_NTFS_SOURCE_CACHE=\"$CARGO_TARGET_DIR/ntfs-source\"; exec bash tools/with-test-environment.sh \"$@\"", "examples"]
args = ["--locked", "--examples"]
packages = [
    "accounts", "agent", "app-cli", "browser", "calculator", "channel-crypto", "code-editor",
    "containers", "discord-worker", "file-explorer", "imager", "launcher", "local-model-service",
    "notes", "osk", "runtime-bundle", "runtime-portal", "scratchpad", "settings", "store",
    "tilo-agent-participant", "tilo-app", "tilo-bluez", "tilo-browser-compute",
    "tilo-session-host", "tilo-clipboard", "tilo-cpu-raster", "tilo-dialogs", "tilo-doc-codecs",
    "tilo-doc-pdf", "tilo-files", "tilo-font-catalog", "tilo-fs", "tilo-install-helpers",
    "tilo-location", "tilo-model-gateway", "tilo-notify", "tilo-ntfs-protocol",
    "tilo-paint-stream", "tilo-pdf", "tilo-relay", "tilo-staging-reclaim", "tilo-ui", "tilo-vmd",
    "tilo-web-search", "tilo-wet-media", "tilolang-app", "tilolang-host", "tilolang-tilo",
    "tube", "typst-editor", "ui-examples", "ush", "windows-vm", "word-processor",
]
env = { VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" }
heavy = true
on = ["stable", "dispatch"]

# Clippy over the workspace: one driver, one unit per crate, shared with `test` and `check` (t's
# compiler cache keys a unit by what it was given, whichever family asked for it).
[[cargo]]
name = "clippy"
tool = "clippy"
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
exclude = [
    "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager",
    "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "music",
    "runtime-bundle", "store", "tilo-agent-participant", "tilo-app-cli",
    "tilo-environment", "tilo-liveness", "tilo-messaging-protocol", "tilo-oci-images",
    "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush",
    "windows-vm", "workspace-unify",
]

[[cargo]]
name = "clippy-idle"
tool = "clippy"
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
packages = ["music", "tilo-messaging-protocol"]
heavy = true
on = ["stable", "dispatch", "idle"]

[[cargo]]
name = "clippy-{arch}"
tool = "clippy"
requires = ["arch={arch}"]
args = ["--locked", "--all-targets"]
trailing = ["-D", "warnings"]
packages = [
    "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager",
    "imager-backend", "install", "launcher", "launcher-macos", "local-model-service",
    "runtime-bundle", "store", "tilo-agent-participant", "tilo-app-cli",
    "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core",
    "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm",
]
matrix = { arch = ["x86_64", "aarch64"] }

# `cargo check` alone, when someone wants a package's errors without clippy's lints or a build.
[[cargo]]
name = "check"
tool = "check"
args = ["--locked", "--all-targets"]
exclude = [
    "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager",
    "imager-backend", "install", "launcher", "launcher-macos", "local-model-service",
    "runtime-bundle", "store", "tilo-agent-participant", "tilo-app-cli",
    "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core",
    "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm", "workspace-unify",
]
default = false

# The visual goldens: the three packages whose baselines are pixels, under the filter
# `.config/nextest-filters.toml` keeps (`golden`), in the image whose fonts and lavapipe they were
# rendered with. They stay on x86_64: on aarch64 seven of them come out different
# (`nightly-arm64-goldens`), so a result from there would not stand for both.
[[cargo]]
name = "goldens"
tool = "nextest"
requires = ["arch=x86_64"]
image = "registry.tilo.so/tilo/tilo-builder@sha256:e4763a8c16005f544dde0206014c2cc088fff0d5d28f1857ea24961677c666f6"
wrapper = ["bash", "-c", "export TILO_FONT_ASSET_CACHE=\"$CARGO_TARGET_DIR/font-artifacts\"; exec bash tools/test-env.sh \"$@\"", "goldens"]
args = ["--locked", "--profile", "ci", "--tests", "--no-tests=pass", "-E", "(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline)))"]
env = { TILO_REQUIRE_GPU = "1", TILO_TEST_NTFS_FIXTURES = "0" }
on = ["idle"]

# The repository policy suite, one check per step of `tools/policy/steps.toml`: the step's own
# command, so `t test policy` runs the suite and `t test policy/<step>` one step. That file is the
# list, so a step added there is a check here without a t.toml edit. Its `unit` step, which runs
# every unit test in one go, is left out: `policy/unit/<file>` below runs them, one check per test
# file, so a failure is attributed to the file it is in.
[[check]]
name = "policy/{step}"
run = "{step.run}"
[check.matrix]
step = { from_toml = "tools/policy/steps.toml", key = "step" }
exclude = [{ step = "unit" }]

# The steps that read the Git view (the index, `ls-files`, the log): t gives a job a `.git` only
# when its check says `git = true`, and keys such a check by the commit, so only these rerun on
# every commit. A step added to `steps.toml` that reads Git is added here too.
[[check.matrix.set]]
when = { step = "format-migrations" }
git = true

[[check.matrix.set]]
when = { step = "image-builder-inputs" }
git = true

[[check.matrix.set]]
when = { step = "image-interpreters" }
git = true

[[check.matrix.set]]
when = { step = "interfaces" }
git = true

[[check.matrix.set]]
when = { step = "public-references" }
git = true

[[check.matrix.set]]
when = { step = "repository-layout" }
git = true

[[check.matrix.set]]
when = { step = "seeded-state-history" }
git = true

[[check.matrix.set]]
when = { step = "setup-neutral" }
git = true

[[check.matrix.set]]
when = { step = "source-content" }
git = true

[[check.matrix.set]]
when = { step = "source-file-size" }
git = true

[[check.matrix.set]]
when = { step = "suites" }
git = true

[[check.matrix.set]]
when = { step = "test-cargo" }
git = true

[[check.matrix.set]]
when = { step = "test-spawns" }
git = true

[[check.matrix.set]]
when = { step = "too-many-arguments" }
git = true

[[check.matrix.set]]
when = { step = "workspace-membership" }
git = true

# The policy suite's own tests, one check per test file: `policy/unit/<file>`. A failed test is
# attributed to the file it is in, so a change reruns the tests whose inputs it moved and nothing
# else.
[[check]]
name = "policy/unit/{test}"
run = "python3 tools/policy/run_unit_tests.py tools/tests/test_{test}.py"
[check.matrix]
test = { from = "tools/tests/test_*.py" }

# The tests that ask Git about the tree they run in: the tracked files (`ls-files`), the commit
# (`rev-parse`) or the log, also through the scripts they run (`tools/ci/build-os.sh`,
# `tools/ci/suites.py`). The rest of the suite makes its own repositories in temporary
# directories and needs no `.git` here, so only these are keyed by the commit.
[[check.matrix.set]]
when = { test = "browser_runtime_release" }
git = true

[[check.matrix.set]]
when = { test = "build_os" }
git = true

[[check.matrix.set]]
when = { test = "check_image_interpreters" }
git = true

[[check.matrix.set]]
when = { test = "check_seeded_state_history" }
git = true

[[check.matrix.set]]
when = { test = "ci_select" }
git = true

# The installer test stages the session layer's fonts, whose artifacts are reviewed pins
# fetched from the release store rather than files of the tree. The node's build directory
# keeps them, as it does for the checks that build with fonts, so a run reads them there
# instead of fetching 55 MB into a cache this job's home does not outlive.
[[check.matrix.set]]
when = { test = "component_manifest" }
env = { TILO_FONT_ASSET_CACHE = "/target/font-artifacts" }

[[check.matrix.set]]
when = { test = "image_builder_inputs" }
git = true

[[check.matrix.set]]
when = { test = "macos_collection" }
git = true

[[check.matrix.set]]
when = { test = "signal_provider_release" }
git = true

[[check.matrix.set]]
when = { test = "signal_runtime_staging" }
git = true

[[check.matrix.set]]
when = { test = "suites" }
git = true

[[check.matrix.set]]
when = { test = "test_environment" }
git = true

[[check.matrix.set]]
when = { test = "workflow_package_paths" }
git = true

# Test suites outside Cargo, one check per group of `tools/ci/suites.toml`: `suite-<group>` runs
# the group's suites in the ci-fast image, which is what `file`-shaped tests need. The group list
# is the file's, so a group added there is a check here. A group runs on every head of main; the
# `os` group needs root over throwaway fixtures and a disk, so it is a micro-VM step and waits for
# a release candidate, a dispatch or main's room.

[[check]]
name = "suite-{group}"
run = "python3 tools/ci/suites.py run --jobs 8 --group {group}"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
[check.matrix]
group = { from_toml = "tools/ci/suites.toml", key = "group" }

[[check.matrix.set]]
when = { group = "os" }
isolation = "vm"
needs = ["vm-test-binaries"]
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin", TILO_STAGING_HANDOFF_BIN = "/target/debug/tilo-staging-handoff" }
on = ["stable", "dispatch", "idle"]
heavy = true

[[check.matrix.set]]
when = { group = "browser-compute-web" }
run = "python3 tools/ci/suites.py run --jobs 8 --group browser-compute-web"

[[check.matrix.set]]
when = { group = "browser-runtime-web" }
run = "python3 tools/ci/suites.py run --jobs 8 --group browser-runtime-web"

# ---- Per-area checks -------------------------------------------------------------
#
# Every other check, by area: the app SDKs, the browsers and their pages, the platform
# integrators, the virtual machines and their guests, the images and their chains, the
# publishing steps, and the nightly, weekly and performance runs. Each keeps the command it ran,
# the image it ran in and what it needs. Nothing declares what it reads or what it costs, and a
# check that names one architecture in a matrix asks for it with `requires = ["arch={arch}"]`.

[[check]]
name = "miracast-capture"
run = "bash tools/test-env.sh cargo test --locked -p tilo-projector --bin tilo-projector session::miracast"
image = { check = "image-ci-builder-x86_64", path = "/target/publish/ci-builder/x86_64/image.oci.tar" }
env = { TILO_REQUIRE_SCREEN_CAPTURE = "1", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_TEST_NTFS_FIXTURES = "0" }
requires = ["arch=x86_64"]
on = ["stable", "dispatch"]
heavy = true

[[check]]
name = "bench-imagefilter"
run = "crates/platform/tilolang-tilo/bench/imagefilter/build.sh"
outputs = ["/target/wasm32-unknown-unknown/release/tilolang_bench_imagefilter.wasm"]
default = false

[[check]]
name = "codemap"
run = "python3 tools/docs/codemap.py --check"
fix = "python3 tools/docs/codemap.py"

[[check]]
name = "fmt"
run = "cargo fmt --check"
fix = "cargo fmt"

[[check]]
name = "hakari"
run = "if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then\n  echo \"crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (docs/development/dependencies.md).\" >&2\n  exit 1\nfi\ncargo hakari verify\n"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
fix = "cargo hakari generate && cargo hakari manage-deps --yes"

[[check]]
name = "sdk-licenses"
run = "python3 -m unittest tools/tests/test_sdk_licenses.py && python3 tools/sdk/check_licenses.py"

[[check]]
name = "client-licenses"
run = "python3 -m unittest tools/tests/test_client_licenses.py && python3 tools/sdk/check_client_licenses.py"

[[check]]
name = "lockfile"
run = "find . \\( -name target -o -path ./vendor -o -path ./fuzz \\) -prune -o -name Cargo.lock -print | sort | while read -r lock; do\n  cargo metadata --locked --format-version 1 --manifest-path \"${lock%.lock}.toml\" >/dev/null || exit 1\ndone\n"
fix = "find . \\( -name target -o -path ./vendor -o -path ./fuzz \\) -prune -o -name Cargo.lock -print | sort | while read -r lock; do\n  cargo metadata --format-version 1 --manifest-path \"${lock%.lock}.toml\" >/dev/null || exit 1\ndone\n"

# Resolves every nested lockfile afresh, beyond what the state's root Cargo.lock names, so it
# needs cargo's network; t turns it off where it hands a job the state's crates.
env = { CARGO_NET_OFFLINE = "false" }
[[check]]
name = "deny"
run = "cargo deny --workspace check --hide-inclusion-graph"

[[check]]
name = "machete"
run = "bash tools/ci/check-unused-dependencies.sh"
git = true
on = ["stable", "dispatch"]
heavy = true

[[check]]
name = "changes"
