[[cargo]]
name = "check"
# Resolves features for the others and has nothing of its own to build (tools/ci/workspace_unify.py),
# and the packages whose code differs between architectures, which `clippy-<arch>` compiles on each.
# BEGIN generated by tools/ci/t_toml.py: check-exclude
exclude = ["workspace-unify", "app-catalogue", "app-cli", "browser", "compat-service", "env-tools", "fs-native", "imager", "imager-backend", "install", "launcher", "launcher-macos", "local-model-service", "runtime-bundle", "shell", "store", "tilo-agent-participant", "tilo-app-cli", "tilo-environment", "tilo-liveness", "tilo-oci-images", "tilo-sandbox", "tilo-sandbox-core", "tilo-vmd", "tilolang-cli", "tilolang-tilo", "ush", "windows-vm"]
