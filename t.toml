outputs = ["/target/rystic-results/**"]
requires = ["arch=x86_64", "os=linux"]
requirement = { cores = 1, memory = "1GiB" }
isolation = "vm"
secrets = ["RYSTIC_CI_TOKEN"]
on = ["main", "dispatch"]
default = false
cost = "minutes"

