# END generated

# Live Miracast capture, end to end: tilo-projector's Miracast session asks a simulated
# ScreenCast portal on a private bus for the screen, captures the headless PipeWire screen it
# grants through pipewiresrc, encodes H.264 and AAC from the headless PulseAudio, and streams
# MPEG-TS over RTP to the miracast crate's strict test sink (crates/system/projector/src/
# session/miracast/tests.rs). It runs in the builder this tree defines, which carries
# PipeWire and WirePlumber; the `test` family skips it on a builder without them.
[[check]]
name = "miracast-capture"
image = { check = "image-ci-builder-x86_64", path = "/target/publish/ci-builder/x86_64/image.oci.tar" }
run = "CARGO_TARGET_DIR=${TMPDIR:-/tmp}/miracast-capture-target bash tools/test-env.sh cargo test --locked -p tilo-projector --bin tilo-projector session::miracast"
inputs = ["tools/test-env.sh", "tools/with-test-environment.sh", "tools/with-headless-audio.sh"]
cargo_packages = ["tilo-projector"]
env = { TILO_REQUIRE_SCREEN_CAPTURE = "1", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1" }
requires = ["arch=x86_64"]
# Measured on main over a week: 2.1 GiB peak, with half again as much room.
requirement = { cores = 4, memory = "4GiB" }
cost = "minutes"
on = ["stable", "dispatch"]
default = false

# The generated blocks of this file match what they are generated from (suites.toml,
# products.toml, .config/, the workspace's manifests, the Rust files suites.toml lists
# as reading outside their package, and for the size checks the apps, their collections and
# the runtime's budget, and the policy suite's steps). The policy suite's unit tests check this
# too, but rerun for any change; this answers in seconds.
[[check]]
name = "t-toml"
requires = ["arch=any"]
requirement = { cores = 1, memory = "1GiB" }
run = "python3 tools/ci/t_toml.py check"
fix = "python3 tools/ci/t_toml.py write"
