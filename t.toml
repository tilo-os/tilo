# service in persistent mode with its relay, and the web entry serving the desktop bundle, through
# crates/hosting/tilo-room-service/dev/run.py), then two headless nested sessions of fresh
# identities and the site's web view (headless Chrome) check that the workspace is the room the
# door names, that a post reaches the other session and the web view, and that joining again keeps
