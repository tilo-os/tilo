requires = ["arch={arch}", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/imager-medium-cycle/{arch}/**"]
# A failed run keeps what each guest and its installer said: the serial tails, the installer's
# console state and the screens it was on.
evidence = ["/target/imager-medium-cycle/{arch}/**"]
cache = false
git = true
timeout_secs = 14400
heavy = true
default = false
on = ["dispatch"]
[check.matrix]
