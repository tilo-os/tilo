requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/host/image.oci.tar", "/target/publish/host/digest", "/target/publish/host/rpms-source", "/target/publish/host/generation"]
timeout_secs = 3600
default = false

[[check]]
name = "test-image-host"
# No network: it pulls the image out of the archive image-host left and runs what is in it, and
# compares its bootc with the one os-tools-x86_64 built.
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/tests/host_image.sh /target/publish/host/image.oci.tar /target/os/x86_64/tools"
