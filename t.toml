# BEGIN generated by tools/ci/t_toml.py: products-extension-manifests
# Downloadable system-extension manifests (tools/ci/publish/extension-manifests.sh): every
# day, and when dispatched with `--input images=…`, each published OS image's native child
# resolves every extension inside itself, as root in a micro-VM step and without credentials;
# `publish-extension-manifests` signs the manifests with the extension-manifest key in KMS (not
# the OS release key) and publishes those that changed. Mirrors drop superseded builds and
# publishers ship updates, so nothing is served from the cache.
[[check]]
name = "extension-manifests-{arch}"
run = "bash tools/ci/publish/extension-manifests.sh resolve {arch} /target/extension-manifests/{arch}"
inputs = ["tools/extensions/**", "tools/ci/publish/extension-manifests.sh", "tools/ci/publish/lib.sh"]
needs = ["signing-tools"]
outputs = ["/target/extension-manifests/{arch}/**"]
requires = ["{node}", "disk-100g"]
isolation = "vm"
requirement = { cores = 4, memory = "8GiB" }
timeout_secs = 3600
on = ["schedule:40 4 * * *", "dispatch"]
default = false
cache = false

[check.dispatch_inputs]
images = ""
expected_content_sha256 = ""
publish = "true"

