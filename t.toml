# The SDK's web path: the calculator desktop bundle, governed mounted-resource
# journeys, every registered app mounted and the desktop navigated in headless
# Chromium for Testing, which it downloads. The bundle build runs `npm ci` in
# scripts/moq-browser, inside the source tree. The voice call and the cold
