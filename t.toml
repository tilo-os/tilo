# The registry server: this tree is its context, and the compiler-cache client it installs is the
# fetched asset cache, a named context of `os-assets`' outputs. So t plans it instruction by
# instruction and caches each on what it reads, and the compile `COPY . .` precedes runs in the
# image, as the Containerfile says, with the caches it mounts empty for each step.
[[check]]
name = "image-registry-server"
build = { containerfile = "crates/packaging/registry-server/container/Containerfile", context = ".", contexts = { github-assets = { check = "os-assets", path = "os/external-assets/cache" } } }
needs = ["os-assets"]
requires = ["arch=x86_64"]
timeout_secs = 7200
default = false

# The image before it is signed or published: non-root, Tilo's trust bundle where the patched
# client looks for it, the reviewed offline-root commands, and a server that initializes a fresh
# state directory and answers /health. It runs in the buildah image, which loads the archive
# without a daemon, in a micro-VM step because buildah needs root over throwaway mounts.
[[check]]
name = "test-image-registry-server"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash crates/packaging/registry-server/container/test-image.sh /target/images/image-registry-server/image.oci.tar"
needs = ["image-registry-server"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
default = false

# Signing and publishing read the build's archive and digest beside it: they name the image the
# build made, at the path the build leaves it, and copy the two files where oci-sign.sh and
# oci-publish.sh expect the build's output.

[[check]]
name = "sign-registry-server"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/registry-server\ncp /target/images/image-registry-server/image.oci.tar /target/images/image-registry-server/digest /target/publish/registry-server/\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/tilo-registry-server /target/publish/registry-server"
needs = ["image-registry-server", "signing-tools"]
outputs = ["/target/publish/registry-server/payload.json", "/target/publish/registry-server/signature", "/target/publish/registry-server/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable"]

[[check]]
name = "publish-registry-server"
