image = "quay.io/skopeo/stable@sha256:edad588fe8391ce37d5ec5e06d280dd1a666a77da302ceaf3cafa019676c8a3f"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/web-entry /target/publish/web-entry"
inputs = ["tools/ci/publish/**", "os/dev/configure-cosign-kms.sh", "os/dev/install-cached-cosign.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "keys/cosign.pub"]
needs = ["image-web-entry"]
outputs = ["/target/publish/web-entry/payload.json", "/target/publish/web-entry/signature"]
secrets = ["COSIGN_KEY_REF", "TILO_SIGNING_AWS_ACCESS_KEY_ID", "TILO_SIGNING_AWS_SECRET_ACCESS_KEY"]
on = ["stable"]

[[check]]
name = "publish-web-entry"
image = "quay.io/skopeo/stable@sha256:edad588fe8391ce37d5ec5e06d280dd1a666a77da302ceaf3cafa019676c8a3f"
run = "bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/web-entry /target/publish/web-entry 'dev-{commit}'"
inputs = ["tools/ci/publish/**"]
needs = ["image-web-entry"]
outputs = ["/target/publish/web-entry/receipt.json"]
secrets = ["REGISTRY_USER", "REGISTRY_TOKEN"]
on = ["main"]

[[check]]
name = "release-web-entry"
image = "quay.io/skopeo/stable@sha256:edad588fe8391ce37d5ec5e06d280dd1a666a77da302ceaf3cafa019676c8a3f"
run = "bash tools/ci/publish/oci-publish.sh release registry.tilo.so/tilo/web-entry /target/publish/web-entry 'sha-{commit}'"
inputs = ["tools/ci/publish/**", "os/dev/install-cached-cosign.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "keys/cosign.pub"]
needs = ["image-web-entry", "sign-web-entry"]
outputs = ["/target/publish/web-entry/receipt.json"]
secrets = ["REGISTRY_USER", "REGISTRY_TOKEN"]
on = ["stable"]

# The fast CI images (build-ci-fast-images.yml), x86_64 only. CI tooling, not a product:
# published from main, pinned by digest in tools/ci/images.toml by hand.
[[check]]
name = "image-ci-fast"
image = "quay.io/buildah/stable@sha256:084dc36d939cf44c9250d94e3164230153bf5dff9f0391f46b7957f16bcd8c9f"
run = "mkdir -p $TMPDIR/empty && bash tools/ci/publish/oci-build.sh $TMPDIR/empty os/Containerfile.ci-fast /target/publish/ci-fast"
inputs = ["tools/ci/publish/**", "os/Containerfile.ci-fast"]
outputs = ["/target/publish/ci-fast/image.oci.tar", "/target/publish/ci-fast/digest"]
requires = ["arch=x86_64"]
cost = "heavy"
default = false

# ci-control adds the Docker client to the ci-fast image just built, not to the pinned one.
[[check]]
name = "image-ci-control"
image = "quay.io/buildah/stable@sha256:084dc36d939cf44c9250d94e3164230153bf5dff9f0391f46b7957f16bcd8c9f"
run = "mkdir -p $TMPDIR/empty && bash tools/ci/publish/oci-build.sh $TMPDIR/empty os/Containerfile.ci-control /target/publish/ci-control --build-arg CI_FAST_IMAGE=oci-archive:/target/publish/ci-fast/image.oci.tar"
inputs = ["tools/ci/publish/**", "os/Containerfile.ci-control"]
needs = ["image-ci-fast"]
outputs = ["/target/publish/ci-control/image.oci.tar", "/target/publish/ci-control/digest"]
requires = ["arch=x86_64"]
cost = "minutes"
default = false

[[check]]
name = "publish-ci-fast"
image = "quay.io/skopeo/stable@sha256:edad588fe8391ce37d5ec5e06d280dd1a666a77da302ceaf3cafa019676c8a3f"
run = """
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/ci-fast /target/publish/ci-fast 'sha-{commit}'
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/ci-control /target/publish/ci-control 'sha-{commit}'
"""
inputs = ["tools/ci/publish/**"]
needs = ["image-ci-fast", "image-ci-control"]
outputs = ["/target/publish/ci-fast/receipt.json", "/target/publish/ci-control/receipt.json"]
secrets = ["REGISTRY_USER", "REGISTRY_TOKEN"]
on = ["main"]
