}
export TILO_KVM_CPU_VARIANT="$CPU_VARIANT"
overlay="$TILO_RUN/smoke.qcow2"
qemu-img create -f qcow2 -F qcow2 -b "$TILO_DISK" "$overlay" >/dev/null
guest_evidence() {
  timeout --kill-after=5s 20s ./os/dev/vm.sh ssh "$@"
}
host_observer_pid=
host_evidence() {
  printf '\nTILO_HOST_PROGRESS time=%s\n' "$(date -u +%FT%TZ)"
  timeout --kill-after=1s 3s df -h "$TILO_RUN" || true
  timeout --kill-after=1s 3s df -i "$TILO_RUN" || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh status || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh cmd 'info status' || true
  timeout --kill-after=1s 5s ./os/dev/vm.sh cmd 'info block' || true
}
finish() {
  status=$?
  if [[ -n $host_observer_pid ]]; then
    kill "$host_observer_pid" 2>/dev/null || true
    wait "$host_observer_pid" 2>/dev/null || true
  fi
  host_evidence >> "$TILO_RUN/host-switch.log" 2>&1 || true
  # A session can exit before the portal appears. Preserve its flight
  # recorder, rather than only the SSH chatter on the serial console.
  guest_evidence 'cat "$HOME/.local/state/tilo/session-logs/latest.log"' > "$TILO_RUN/desktop-session.log" 2>&1 || true
  guest_evidence 'cat "$HOME/.local/state/tilo/session-logs/frame-trace.csv"' > "$TILO_RUN/frame-trace.csv" 2>&1 || true
  guest_evidence 'printf "user=%s runtime=%s bus=%s\n" "$(id -un)" "${XDG_RUNTIME_DIR:-unset}" "${DBUS_SESSION_BUS_ADDRESS:-unset}"; busctl --user --timeout=3 status org.freedesktop.impl.portal.desktop.tilo; printf "portal_status=%s\n" "$?"; wc -l "$HOME/.local/state/tilo/session-logs/frame-trace.csv"; systemctl --user --no-pager --failed' > "$TILO_RUN/desktop-readiness.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' journalctl -b -u greetd --no-pager" > "$TILO_RUN/greetd.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' journalctl -b --no-pager _UID=1000" > "$TILO_RUN/user-session.log" 2>&1 || true
  guest_evidence "printf '%s\n' '$TILO_PASS' | sudo -S -p '' dmesg --color=never" > "$TILO_RUN/kernel.log" 2>&1 || true
  guest_evidence 'systemd-analyze; systemctl show --property=InitRDTimestampMonotonic --property=UserspaceTimestampMonotonic --property=FirmwareTimestampMonotonic --property=LoaderTimestampMonotonic' > "$TILO_RUN/boot-phases.log" 2>&1 || true
  if (( status != 0 )); then
    timeout --kill-after=5s 20s ./os/dev/vm.sh cmd "screendump $TILO_RUN/boot-failure.ppm" >/dev/null 2>&1 || true
    timeout --kill-after=5s 30s bash ./os/dev/diagnose-boot-failure.sh || true
  fi
  ./os/dev/vm.sh stop || true
  rm -f -- "$overlay"
  return "$status"
}
trap finish EXIT
./os/dev/vm.sh boot --2d --disk "$overlay"
ready=false
for attempt in $(seq 1 120); do
  if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
  sleep 1
done
[[ $ready == true ]] || { echo '::error::candidate boot did not accept SSH'; exit 1; }
if [[ -n $UPGRADE_IMAGE ]]; then
