# The Android library's std, built from source with native thread-locals, holds
# more thread-locals than bionic has pthread keys, and rustc's own Android std does not: a program
# built both ways, linked statically so this kernel runs it. Building std fetches the crates its
# own lockfile names from crates.io, which needs cargo's network.
[[check]]
name = "android-tls"
egress = { to = ["code.tilo.so:443", "index.crates.io:443", "static.crates.io:443"] }
# The probe program builds itself against the NDK and runs both its builds: the check starts it,
# so no test run carries a second Cargo build.
run = "cargo run --locked -p tilo-app-builder --example android_thread_locals"
env = { CARGO_NET_OFFLINE = "false" }
