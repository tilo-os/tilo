# ---- The imager release's publication surfaces
#
# The release's own assets are built by the imager release workflow: this draft translates
# everything the release does after that, because those scripts are in the tree. Each check
# runs on the release tag and reads that tag's published assets, which is what the workflow
# handed these jobs as a downloaded artifact.

[[check]]
name = "publish-winget"
run = '''set -eu
export GITHUB_REF_NAME="${T_REF#tag:}"
assets=$TMPDIR/release-assets
rm -rf "$assets" && mkdir -p "$assets"
cp /target/windows/x86_64/package/tilo-imager-setup-windows-x86_64.exe* \
   /target/windows/aarch64/package/tilo-imager-setup-windows-aarch64.exe* "$assets/"
python3 apps/imager/packaging/generate-winget.py "$assets" \
  --version "${GITHUB_REF_NAME#imager-v}" \
  --base-url "${TILO_RELEASE_SERVER%/}/${TILO_RELEASE_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
python3 apps/imager/packaging/validate-winget.py "$assets/winget"
bash apps/imager/packaging/publish-winget.sh "$assets"
'''
needs = ["package/windows-x86_64", "package/windows-aarch64"]
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { TILO_RELEASE_SERVER = "https://github.com", TILO_RELEASE_REPOSITORY = "tilo-os/releases", TILO_HOMEBREW_TAP_REPOSITORY = "tilo-os/homebrew-tilo", TILO_HOMEBREW_TAP_NAME = "tilo/tilo" }
requires = ["arch=x86_64"]
cache = false
timeout_secs = 3600
on = ["tag:imager-v*"]
secrets = ["WINGET_GITHUB_TOKEN"]

[[check]]
name = "publish-homebrew-tap"
run = '''set -eu
export GITHUB_REF_NAME="${T_REF#tag:}"
assets=$TMPDIR/release-assets
rm -rf "$assets" && mkdir -p "$assets"
base="${TILO_RELEASE_SERVER%/}/${TILO_RELEASE_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
for name in tilo-imager-linux-x86_64.tar.gz tilo-imager-linux-aarch64.tar.gz \
            tilo-imager-macos-x86_64.dmg tilo-imager-macos-aarch64.dmg; do
  curl --fail --location --retry 3 --output "$assets/$name" "$base/$name"
done
bash apps/imager/packaging/publish-homebrew-tap.sh "$assets"
'''
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { TILO_IMAGER_MACOS_ENABLED = "1", TILO_RELEASE_SERVER = "https://github.com", TILO_RELEASE_REPOSITORY = "tilo-os/releases", TILO_HOMEBREW_TAP_REPOSITORY = "tilo-os/homebrew-tilo", TILO_HOMEBREW_TAP_NAME = "tilo/tilo" }
requires = ["os=linux", "arch=aarch64"]
cache = false
timeout_secs = 3600
on = ["tag:imager-v*"]
secrets = ["HOMEBREW_TAP_TOKEN"]

# The install tests are one script over the two package kinds on the two platforms: the formula
# on Linux, the cask on macOS, each on both architectures. A lane is the pair, so the axis
# carries the platform with the package kind it installs.
[[check]]
name = "homebrew-{package_kind}-{arch}"
run = '''set -eu
command -v brew >/dev/null
export HOMEBREW_NO_AUTO_UPDATE=1
brew tap "$TILO_HOMEBREW_TAP_NAME" "${TILO_RELEASE_SERVER%/}/$TILO_HOMEBREW_TAP_REPOSITORY.git"
if [ "$PACKAGE_KIND" = formula ]; then
  brew install tilo/tilo/tilo-imager
  brew test tilo/tilo/tilo-imager
  brew uninstall tilo-imager
else
  brew install --cask tilo/tilo/tilo-imager
  brew list --cask tilo-imager >/dev/null
  brew uninstall --cask tilo-imager
fi
'''
needs = ["publish-homebrew-tap"]
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { PACKAGE_KIND = "{package_kind}", TILO_RELEASE_SERVER = "https://github.com", TILO_RELEASE_REPOSITORY = "tilo-os/releases", TILO_HOMEBREW_TAP_REPOSITORY = "tilo-os/homebrew-tilo", TILO_HOMEBREW_TAP_NAME = "tilo/tilo" }
requires = ["os={os}", "arch={arch}"]
cache = false
timeout_secs = 5400
on = ["tag:imager-v*"]
[check.matrix]
package_kind = [{ package_kind = "formula", os = "linux" }, { package_kind = "cask", os = "macos" }]
arch = ["x86_64", "aarch64"]

