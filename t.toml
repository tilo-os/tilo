# (apps/imager/packaging/export-target-policy.py). It reads a published, signed image; it
# publishes nothing. Dispatch it on a release with
# `--input published_os_image=registry.tilo.so/tilo/tilo@sha256:...`.
[[check]]
name = "target-policy/imager-{arch}"
# The registry redirects each blob to its object store, and the verifier reads the transparency
# log; no fixed host list names them.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "[[ -n $T_INPUT_PUBLISHED_OS_IMAGE && -n $T_INPUT_SOURCE_REVISION ]] || { echo 'target-policy/imager-{arch} needs --input published_os_image=...,source_revision=... from a published, signed release' >&2; exit 2; }\nbash tools/ci/linux-imager/target-policy.sh export {arch} \"$T_INPUT_PUBLISHED_OS_IMAGE\" \"$T_INPUT_SOURCE_REVISION\" \"$T_INPUT_RELEASE_ID\" /target/imager-target-policy/{arch}"
needs = ["signing-tools"]
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
requires = ["arch={arch}"]
isolation = "vm"
outputs = ["/target/imager-target-policy/{arch}/**"]
timeout_secs = 3600
default = false
on = ["dispatch"]
dispatch_inputs = { published_os_image = "", source_revision = "", release_id = "imager-v0.0.0" }
[check.matrix]
arch = ["x86_64", "aarch64"]

# The same bundle published to the generic package the Imager reads it from. A dispatch names the
