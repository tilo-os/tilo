run = "cargo test --locked -p file-explorer --lib -- --nocapture --test-threads=1"
env = { TILO_FS_FUSE_REQUIRED = "0", TILO_REQUIRE_FUSE = "0" }
heavy = true
on = ["stable", "dispatch", "idle"]
