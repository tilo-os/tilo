# Too heavy for every commit of main: it runs on release candidates (`stable`), when dispatched,
# and on main's newest head when t has room (`idle`), keyed per commit and bisected to the commit
# that broke it. `t suggest` names it for a change that touches it.
on = ["stable", "dispatch", "idle"]
default = false

# ---------------------------------------------------------------------------
# The whole-workspace suites: the nightly-* and weekly-* sets, named for when they used to run.
# Each takes the whole workspace (or a release build of it), so they run on release candidates
# and on request, not on main: `t test 'nightly-*'` for a working tree, `t dispatch <check>` on a
# branch. The two live checks (nightly-live-music, nightly-live-sign-in) still run every night
# on main's head: they test one package each against third-party services, which can change
# under an unchanged tree, and a release candidate shouldn't wait on those services' uptime.
# t reserves `/` in check names for package families, hence the `nightly-` and `weekly-`
# prefixes. The goldens, app certification and vendored crates are the `goldens`, `certify` and
# `vendored` checks above.

[[check]]
name = "nightly-workspace-test"
nested_sandboxes = true
requires = ["arch=x86_64", "disk-100g"]
run = """
export TILO_TEST_ASSET_CACHE=$CARGO_TARGET_DIR/test-assets TILO_NTFS_SOURCE_CACHE=$CARGO_TARGET_DIR/ntfs-source
export TILO_IMAGER_TEST_CACHE_ROOT=$CARGO_TARGET_DIR/ci/imager-test-fs
mkdir -p "$TILO_IMAGER_TEST_CACHE_ROOT" && chmod 700 "$TILO_IMAGER_TEST_CACHE_ROOT"
cargo build --locked -p install --bin tilo-install
# The browser peer's suites drive Chrome and the MoQ library the browser runtime builds.
bash tools/ci/ensure-browser-dependencies.sh
npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
npm ci --prefix scripts/moq-browser --no-audit --no-fund
node scripts/moq-browser/build.mjs
# Where the kernel can enforce Landlock, the PDF tests require the helper's sandbox.
pdf_sandbox=$(bash tools/ci/require-pdf-sandbox.sh)
export TILO_REQUIRE_PDF_SANDBOX=$pdf_sandbox
filter=$(python3 tools/ci/nextest_filters.py | sed -n 's/^GOLDEN_FILTER=//p')
bash tools/test-env.sh cargo nextest run --workspace --locked --profile ci -E "not ($filter)"
"""
env = { VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json", PROPTEST_CASES = "256", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_GPU = "1", TILO_REQUIRE_AUDIO = "1" }
writable_sources = true
on = ["stable", "dispatch"]
cost = "heavy"
default = false

[[check]]
name = "nightly-check"
requires = ["arch=x86_64"]
run = """
export TILO_TEST_ASSET_CACHE=$CARGO_TARGET_DIR/test-assets TILO_NTFS_SOURCE_CACHE=$CARGO_TARGET_DIR/ntfs-source
cargo check --workspace --locked --all-targets
"""
on = ["stable", "dispatch"]
env = { VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" }
cost = "heavy"
default = false

[[check]]
