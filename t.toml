# The layer itself (dist/dev/t-pack.sh): the `tilo-vm layer-pack` command the builder left in
# .tilo-vm-pack/args.json, run by that tilo-vm against the uploaded worktree on a node of the
# device's architecture; the framed layer it prints is the output the builder downloads and streams
# to the device. Each request carries its own source inventory, so nothing is cached here;
# layer-pack reuses a layer the device already holds by itself. The builder picks the check by the
# component's size, and each check's cargo runs the jobs its CARGO_BUILD_JOBS names (a command
# check gets no jobserver from t): `tilo-vm-pack-apps-<arch>` builds the app collection and its
# runtime with the thin-app profile, as big as the collection's own builds (app-binaries-<arch>),
# and lays them out in bubblewrap sandboxes of its own (so it is "nested");
# `tilo-vm-pack-shell-<arch>` builds the shell's release binary, the size of shell-binaries;
# `tilo-vm-pack-<arch>` builds every other component (the launcher, the system services), release
# builds of one program each. Each takes the fixtures its build scripts embed from the test-assets
# check's verified seed (TILO_TEST_ASSET_SEED), never from the forge.
