# ---- App and engine releases -------------------------------------------------------------
#
# Per architecture, what `Release / apps` publishes through, in two steps: the compile, which
# holds no key and builds every selected app once, then the packaging that signs with the release
# identities, which only a trusted run has. They are checks of their own so that a run without
# identities can never produce a signed package, and so that the compile's result serves the
# package, the size budgets and the dev shapes alike. `dist/apps/package-apps.sh` is the one path
# both run: `TILO_APP_COMPILE_ONLY=1` for the first, `TILO_APP_PREBUILT` over its tree for the
# second, which then runs no compiler.
#
# The version a release carries is its commit (`T_COMMIT`, which a check with `git = true` or
# secrets is given): the same commit packages the same bytes, so a second run is answered from
# the cache and a device downloads nothing new. A number made per run instead would make the same
# commit a new release every time.

[[check]]
name = "apps-build-{arch}"
run = '''set -euo pipefail
export CARGO_INCREMENTAL=0
export CARGO_PROFILE_RELEASE_LTO=thin
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
export CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-$(bash -c 'source tools/apps/release-lib.sh; cargo_jobs')}"
export CARGO_TARGET_DIR=/target/apps-build/{arch}
export TILO_RELEASE_APPS=$(python3 -I tools/ci/python.py tools/apps/app_release.py --collection default | python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["apps"]))')
export TILO_APP_COMPILE_ONLY=1
dist/apps/package-apps.sh'''
needs = ["test-assets"]
requires = ["arch={arch}"]
env = { TILO_TEST_ASSET_SEED = "/target/test-assets" }
outputs = ["/target/apps-build/{arch}/**"]
on = ["stable", "dispatch"]
timeout_secs = 10800
[check.matrix]
arch = ["x86_64", "aarch64"]

# The signed tapps, from the compiled tree: `package-apps.sh` packages and signs in one run, so
# this is the old `app-binaries` and `sign-apps` link together. The identities are written to
# files of a scratch directory and taken out of the environment before anything else runs, so no
# step after it can read them and none of them can reach an output.
[[check]]
name = "sign-apps-{arch}"
run = '''set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
(umask 077; printf '%s' "$TAPP_PUBLISHER_IDENTITY" > "$work/app-publisher.json")
(umask 077; printf '%s' "$RUNTIME_BUNDLE_SIGNING_KEY" > "$work/runtime-publisher.json")
unset TAPP_PUBLISHER_IDENTITY RUNTIME_BUNDLE_SIGNING_KEY
export TAPP_PUBLISHER_IDENTITY_FILE="$work/app-publisher.json"
export RUNTIME_BUNDLE_IDENTITY_FILE="$work/runtime-publisher.json"
export CARGO_INCREMENTAL=0
export CARGO_PROFILE_RELEASE_LTO=thin
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
export TILO_RELEASE_APPS=$(python3 -I tools/ci/python.py tools/apps/app_release.py --collection default | python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["apps"]))')
export TILO_APP_PREBUILT=/target/apps-build/{arch}
export TILO_APP_TOOLS_BUILT=1
export TILO_APP_RELEASE_OUT=/target/app-release/{arch}
export TILO_APP_RELEASE_SOURCE="$T_COMMIT"
export TILO_APP_RELEASE_SEQUENCE=$(git show -s --format=%ct "$T_COMMIT")
dist/apps/package-apps.sh
# The package CLI the publication runs on: the same bytes the tapps were packed with.
install -m 0755 /target/apps-build/{arch}/release/tilo-app-package /target/app-release/{arch}/tilo-app-package'''
needs = ["apps-build-{arch}"]
requires = ["arch={arch}"]
secrets = ["TAPP_PUBLISHER_IDENTITY", "RUNTIME_BUNDLE_SIGNING_KEY"]
git = true
outputs = ["/target/app-release/{arch}/**"]
on = ["stable", "dispatch"]
heavy = true
timeout_secs = 5400
[check.matrix]
arch = ["x86_64", "aarch64"]

# Two builds of one app give the same bytes, or every image and update re-sends what did not
