# An app developer's whole path from a bare Fedora: install tilo-app with
# cargo, then create, check and package an app.
# Not runnable as a t check: the bootstrap installs gcc and Python with dnf,
# which needs a writable root, and it installs tilo-app from the Git server,
# not from the tree under test.
[[check]]
name = "standalone-app"
on = ["dispatch"]
image = "registry.fedoraproject.org/fedora:44@sha256:55159f5c92b7baf5f1c1ca1d727c95e77a4cb77c0829b2c11740a700ff4ea02b"
run = "bash tools/ci/standalone-app.sh --bootstrap --branch main"
default = false

# Your devices as a VPN between two network namespaces: real TUN devices the root helper's Linux
# backend sets up with `ip` and `nft`, and a loopback iroh pair carrying the packets
# (crates/system/device-vpn/tests/netns_tunnel.rs); and the kill switch of the person's VPN profiles,
# its nftables block following the profile's state (tests/netns_profile_block.rs). The job sandbox refuses nftables netlink even
# to checks with nested sandboxes, so the test binary is built here and run in a micro-VM, whose
# kernel has TUN and nftables; TILO_REQUIRE_TUN fails a test that would skip there.
[[check]]
name = "device-vpn-namespaces-build"
requires = ["arch=x86_64"]
run = """
set -eu
mkdir -p "$CARGO_TARGET_DIR/vm"
# Read every message before selecting: closing cargo's pipe early makes it
# fail with a broken pipe while it is still writing build messages.
cargo test --locked -p tilo-device-vpn --features test-support --test netns_tunnel --test netns_profile_block --no-run --message-format json \
  | python3 -c '
import json, os, shutil, sys
messages = list(map(json.loads, sys.stdin))
built = {m["target"]["name"]: m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("executable")}
target = os.environ["CARGO_TARGET_DIR"]
shutil.copy(built["netns_tunnel"], target + "/vm/device-vpn-netns-tunnel")
shutil.copy(built["netns_profile_block"], target + "/vm/device-vpn-netns-profile-block")
'
"""
outputs = ["/target/vm/device-vpn-netns-tunnel", "/target/vm/device-vpn-netns-profile-block"]
heavy = true
on = ["stable", "dispatch"]
default = false

[[check]]
name = "device-vpn-namespaces"
