# The Windows compatibility system extension (os/image/layers.toml image `windows-compat`): built
# like the OS image's own actions, published beside main's dev images for extension-manifests
# to pin.
# The PE DLL-load fixtures the Windows capsule's evidence is made from (fixtures/windows-dxvk-load.c),
# compiled for both Windows architectures with the image's Clang and lld-link against the MinGW
# import libraries' kernel32. The managed FEX checks run them under Wine; this only proves the
# fixtures build.
[[check]]
name = "windows-dxvk-load"
# dnf installs the MinGW compilers, whose import libraries the fixtures link against, from Fedora's
# mirrors: no fixed host list, and the newest builds, so the job is never served.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash os/tests/build-windows-dxvk-load.sh /target/windows-dxvk-load /"
setup = { run = "dnf install -y --setopt=install_weak_deps=False mingw32-gcc mingw64-gcc && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"] } }
requires = ["arch=x86_64"]
outputs = ["/target/windows-dxvk-load/**"]
on = ["idle", "stable", "dispatch"]

# The Windows VM's domain XML, rendered for both architectures by the windows-vm example, against
# the schema of the libvirt release the VM host ships: an element or attribute that release refuses
# fails here instead of on a person's machine. The tarball is pinned by the SHA-256 the OS image's
# asset list holds (os/external-assets/github-assets.tsv); its src/conf/schemas is the complete
# directory domain.rng includes from, not an isolated copy.
[[check]]
name = "windows-vm-schema"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443", "download.libvirt.org:443"], pinned = true }
run = "set -euo pipefail\ncurl -sSfL -o /tmp/libvirt.tar.xz https://download.libvirt.org/libvirt-12.7.0.tar.xz\nprintf '%s  %s\\n' 7ec1a04e7e4f4069353d4daac117bbe869287f5b202695de61fe1b079efb6cb6 /tmp/libvirt.tar.xz | sha256sum -c -\ntar --no-same-owner -xJf /tmp/libvirt.tar.xz -C /tmp libvirt-12.7.0/src/conf/schemas\nbash os/tests/windows_vm_schema.sh /tmp/libvirt-12.7.0/src/conf/schemas/domain.rng\n"
requires = ["arch=x86_64"]

