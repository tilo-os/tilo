# The generated template outside the repository taken from `new` to a signed macOS .tapp waiting
# in a loopback registry's review queue, with the SDK as a git dependency on this commit;
# Calculator and Notes as ad-hoc-signed .app bundles rendered offscreen; and a packaged .app zip
# with its signing descriptor (Developer ID signing and notarization are release steps).
[[check]]
name = "sdk-macos"
requires = ["os=macos", "arch=arm64"]
run = """
set -eu
# The project's environment picks Mesa's Vulkan CPU driver for Linux; on the Mac wgpu picks Metal.
unset WGPU_BACKEND WGPU_ADAPTER_NAME
python3 tools/font-catalog.py root crates/sdk/ui-core/assets/fonts --scope fixtures --cache "$TMPDIR/font-artifacts"
export TILO_FONT_ASSET_CACHE="$TMPDIR/font-artifacts" TILO_FONT_ASSETS_OFFLINE=1
cargo build --locked -p tilo-app-cli -p tilo-app-package-cli --bin tilo-app --bin tilo-app-package
bin=${CARGO_TARGET_DIR:-$PWD/target}/debug
rustup target add wasm32-unknown-unknown
# The template takes the SDK from this tree as a git repository (`--sdk-git file://…`, at HEAD).
# t's macOS workers give a check no `.git` even with `git = true`, so commit the tree here.
if ! git rev-parse --git-dir >/dev/null 2>&1; then
  git init -q
  git add -A
  GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@localhost GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@localhost \
    git commit -q -m 'the checked tree'
fi
TILO_SDK_SOURCE=git cargo test --locked -p tilo-app-cli --test it outside_repo -- --ignored --nocapture
for app in calculator notes; do
  bundle=$("$bin/tilo-app" build --target macos "apps/$app" | tail -n 1)
  plutil -lint "$bundle/Contents/Info.plist"
  codesign --verify --deep --strict "$bundle"
  "$bundle/Contents/MacOS/$app" --shots "$TMPDIR/$app.png"
  test -s "$TMPDIR/$app.png"
done
"$bin/tilo-app" package --target macos apps/calculator --output "$TMPDIR/Calculator-macos.zip" --force
test -s "$TMPDIR/Calculator-macos.zip"
test -s "$TMPDIR/Calculator-macos.zip.json"
"""
inputs = ["apps/**", "crates/**", "vendor/**", "tools/sdk/**", "tools/font-catalog.py", "Cargo.toml", "Cargo.lock"]
git = true
# It may commit the tree into a repository of its own (above).
writable_sources = true
cost = "heavy"
on = ["schedule:17 1 * * *"]
default = false

[[check]]
name = "apps-macos"
requires = ["os=macos", "arch=arm64"]
run = """
set -eu
# The project's environment picks Mesa's Vulkan CPU driver for Linux; on the Mac wgpu picks Metal.
unset WGPU_BACKEND WGPU_ADAPTER_NAME
python3 tools/font-catalog.py root crates/sdk/ui-core/assets/fonts --scope fixtures --cache "$TMPDIR/font-artifacts"
export TILO_FONT_ASSET_CACHE="$TMPDIR/font-artifacts" TILO_FONT_ASSETS_OFFLINE=1
packages=$(python3 tools/ci/macos_apps.py)
cargo build --locked $packages
# Nextest discovers the tests itself, one process per test as on Linux; the doctests run even
# when a test failed.
status=0
cargo nextest run --locked --profile ci --no-fail-fast $packages || status=$?
cargo test --locked --no-fail-fast --doc $packages || status=$?
exit $status
"""
inputs = ["apps/**", "crates/**", "vendor/**", "tools/ci/macos_apps.py", "tools/font-catalog.py", ".config/nextest.toml", "Cargo.toml", "Cargo.lock"]
cost = "heavy"
on = ["schedule:17 1 * * *"]
default = false

# ---------------------------------------------------------------------------
# Benchmarks, run when asked for.

# What a public room host holds and what one collaborator on it costs: the
# room-load bench ramps guests and spectators against a host it starts itself,
# and tools/perf/room_capacity.py derives the per-guest figures and prices them
# (docs/benchmarks/room-host-capacity-2026-10.md records a run). Built as the
# room service image builds its relay. A full sweep takes about 45 minutes after
# the build: `t dispatch perf-room-capacity --input plan=quick` (full, quick, or
# a regex over the full plan's run names), then `t outputs perf-room-capacity`.
# The machine description says which node and quota the numbers came from.
[[check]]
name = "perf-room-capacity"
requires = ["arch=x86_64"]
run = """
out=/target/perf-room-capacity
rm -rf "$out"
mkdir -p "$out"
cargo build --locked --release -p tilo-room-load --features tilo-relay/agents
{
  echo "commit: ${T_COMMIT:-a working tree}"
  echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
  echo "cpus: $(nproc)"
  echo "memory: $(awk '/^MemTotal:/ {printf "%.1f", $2 / 1048576}' /proc/meminfo) GiB"
  echo "cgroup cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
  echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"
  echo "kernel: $(uname -r)"
  df -h "${TMPDIR:-/tmp}" /dev/shm | sed 's/^/disk: /'
} | tee "$out/machine.txt"
status=0
python3 tools/perf/room_capacity.py sweep --bin "$CARGO_TARGET_DIR/release/tilo-room-load" \
  --out "$out/runs" --plan "${T_INPUT_PLAN:-full}" || status=$?
python3 tools/perf/room_capacity.py summarize "$out/runs" --json "$out/summary.json" --markdown "$out/summary.md"
cat "$out/summary.md"
exit "$status"
"""
env = { CARGO_PROFILE_RELEASE_LTO = "thin", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16" }
inputs = ["crates/**", "vendor/**", "apps/**", "tools/perf/**", "Cargo.toml", "Cargo.lock"]
outputs = ["/target/perf-room-capacity/**"]
# A measurement of the node it ran on, never a stored result.
cache = false
# The bench's guests and the host share the node; the write-up's runs had 40 CPUs and 36 GiB.
cpus = 40
memory = "36G"
timeout_secs = 9000
cost = "heavy"
default = false
on = ["dispatch"]

[check.dispatch_inputs]
plan = "full"

