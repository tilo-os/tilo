# ---------------------------------------------------------------------------
# Fast quality, in whole-tree form.
#
# The diff-based gates stay in the Git hooks, which see the change:
# changed-file rustfmt and Rust allow reasons (.githooks/pre-commit), commit
# messages and blob policy (tools/policy/check_commit_policy.py before a
# push). The tapp, runtime and web size-budget ratchets compare budget files
# with a base commit's and need Git history, which a t check does not have.

[[check]]
name = "fmt"
requires = ["arch=any"]
run = "cargo fmt --check"
# t applies this on main by itself when fmt fails there; `t fix fmt` applies it here.
fix = "cargo fmt"

# Before a push (.githooks/pre-push): rustfmt of only the Rust files the change touches
# (tools/ci/fmt-changed.sh), in seconds where the whole tree takes a minute. It reads the change
# from Git, so its result is the commit's; main runs the whole tree's `fmt` instead.
[[check]]
name = "fmt-changed"
requires = ["arch=any"]
git = true
run = "bash tools/ci/fmt-changed.sh --check"
fix = "bash tools/ci/fmt-changed.sh"
default = false

# cargo-hakari ships in ci-fast, not in the builder.
# ci-fast's rustup home has no update-hashes directory, and rustup's proxies
# fail creating it on a read-only root, so its checks put the toolchain's own
# binaries first on PATH.
[[check]]
name = "hakari"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
run = """
if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
  echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (docs/development/dependencies.md)." >&2
  exit 1
fi
cargo hakari verify
"""
fix = "cargo hakari generate && cargo hakari manage-deps --yes"

# Cargo.lock holds what the manifests require. Every cargo check builds `--locked` and fails on
# a stale lock too, but only once it gets to compile. The fix relocks without update flags, so it
# adds and drops what the manifests now need and moves no locked version (AGENTS.md, "Cargo.lock
# is committed"). The standalone workspaces' locks count too: they reach workspace crates by
# path, so a dependency added there leaves them stale, and only the heavy checks build them.
# Not vendor/ (the locks upstream published, which no build reads) nor fuzz/ (cargo fuzz
# builds unlocked).
[[check]]
name = "sdk-licenses"
requires = ["arch=any"]
run = "python3 -m unittest tools/tests/test_sdk_licenses.py && python3 tools/sdk/check_licenses.py"

[[check]]
name = "lockfile"
requires = ["arch=any"]
run = """
find . \\( -name target -o -path ./vendor -o -path ./fuzz \\) -prune -o -name Cargo.lock -print | sort | while read -r lock; do
  cargo metadata --locked --format-version 1 --manifest-path "${lock%.lock}.toml" >/dev/null || exit 1
done
"""
fix = """
find . \\( -name target -o -path ./vendor -o -path ./fuzz \\) -prune -o -name Cargo.lock -print | sort | while read -r lock; do
  cargo metadata --format-version 1 --manifest-path "${lock%.lock}.toml" >/dev/null || exit 1
done
"""

[[check]]
name = "deny"
requires = ["arch=any"]
run = "cargo deny --workspace check --hide-inclusion-graph"

# The whole-tree form of the changed-crate scan.
[[check]]
name = "machete"
requires = ["arch=any"]
run = "bash tools/ci/t-git-index.sh bash tools/ci/check-unused-dependencies.sh"
heavy = true
on = ["stable", "dispatch"]
default = false

# The diff-based gates, against the commit the tree branched from (on main,
# the previous commit): reasons for new Rust `allow`s, commit messages and new
# blob contents, interfaces and format migrations, and the tapp, runtime and
# web size budgets, which may only shrink unless a raise file says
# why. They compare with the base, so they run here, the one check kept per
# commit, rather than each as a check of its own that `git = true` would rerun
# on every commit whatever its files.
[[check]]
name = "changes"
# Every push's gate runs it: in the builder, which both architectures have, so a push never
# waits for an x86_64 node.
requires = ["arch=any"]
git = true
run = """
base=$(git rev-parse main)
if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^); fi
python3 tools/policy/check_commit_policy.py "$base"
python3 tools/policy/check_interfaces.py against "$base"
python3 tools/policy/check_format_migrations.py against "$base"
python3 tools/policy/check_wire_enums.py against "$base"
python3 tools/perf/tapp_size_ratchet.py check-budget --base "$base"
python3 tools/perf/runtime_size_ratchet.py check-budget --base "$base"
python3 tools/web/wasm_size_ratchet.py check-budget --base "$base"
"""

[[check]]
name = "app-lints"
requires = ["arch=any"]
run = "cargo run --locked --quiet -p tilo-app-cli --bin tilo-app -- check --lint --all"
env = { CARGO_PROFILE_DEV_DEBUG = "0" }
# Too heavy for every commit of main: it runs on release candidates (`stable`), when dispatched,
# and on main's newest head when t has room (`idle`), keyed per commit and bisected to the commit
# that broke it. `t suggest` names it for a change that touches it.
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

