# are built here and run in a micro-VM, as root, with the tests of overlays, which need to mount
# them.
[[check]]
name = "sandbox-host-ids-build"
requires = ["arch=x86_64"]
run = """
test=$(cargo test --locked -p tilo-sandbox --test job --no-run --message-format json \
  | python3 -c 'import json, sys; print(next(m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == "job"))')
mkdir -p "$CARGO_TARGET_DIR/vm"
cp "$test" "$CARGO_TARGET_DIR/vm/tilo-sandbox-job"
"""
outputs = ["/target/vm/tilo-sandbox-job"]
cargo_packages = ["tilo-sandbox"]
inputs = []

[[check]]
name = "sandbox-host-ids"
requires = ["arch=x86_64"]
isolation = "vm"
needs = ["sandbox-host-ids-build"]
run = """
cd crates/platform/tilo-sandbox
/target/vm/tilo-sandbox-job host_ids:: overlays:: --nocapture --test-threads=1
"""
inputs = []

