env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
git = true
requires = ["arch=x86_64", "/dev/kvm"]
isolation = "vm"
timeout_secs = 14400
cache = false
default = false
on = ["dispatch"]

[check.dispatch_inputs]
lifetime = "3600"

# One-password sign-in end to end (docs/security/sign-in.md §3, §4; tools/ci/signin-e2e.sh): this
# commit's development installer medium installs an encrypted system in a KVM guest with a
# software TPM, which then boots through first boot, migration at the greeter, the boot sign-in
# screen, wrong entries, lock screen/sudo/polkit and the recovery key; a second install uses the
# installer's separate disk secret. `t outputs signin-e2e-<arch>` gives report.md and the boot
# sign-in and greeter screenshots. Two installs and about a dozen cold boots: an hour or more on
# top of the image and medium builds. The dispatch inputs pick other variants: `variants =
# "rollback"` with `pre_pam_tilo_image`, an image from before pam_tilo that the guest can pull or
# an OCI archive below /target. Without t, tools/ci/signin-e2e-builder.sh runs it.
[[check]]
name = "signin-e2e-{arch}"
run = "bash tools/ci/install-packages.sh tools/ci/packages/signin-e2e.txt tools/ci/packages/signin-e2e-{arch}.txt && bash tools/ci/signin-e2e.sh /target/publish/dev-installer-medium/{arch}/disk.qcow2 /target/signin-e2e"
needs = ["dev-installer-medium-{arch}", "{vm}"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
outputs = ["/target/signin-e2e/**"]
requires = ["{node}", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 14400
default = false
heavy = true
on = ["stable", "dispatch"]

[check.dispatch_inputs]
variants = ""
pre_pam_tilo_image = ""

[check.matrix]
arch = [{ arch = "x86_64", node = "arch=x86_64", vm = "tilo-vm-binary-x86_64" }, { arch = "aarch64", node = "arch=arm64", vm = "tilo-vm-binary-arm64" }]

# The imager's staging helper and reclaim proofs over loop devices. Needs a privileged node with loop
# devices.
[[check]]
name = "staging-loop"
on = ["schedule:40 2 * * *", "dispatch"]
requires = ["disk-100g"]
isolation = "vm"
devices = ["/dev/loop-control"]
run = """
command -v mkfs.vfat >/dev/null && command -v mcopy >/dev/null && command -v mkfs.btrfs >/dev/null \
  || dnf install -y -q --setopt=install_weak_deps=False dosfstools mtools btrfs-progs
cargo build --locked -p imager --bin imager
IMAGER=$CARGO_TARGET_DIR/debug/imager bash os/tests/staging_helper_loop.sh
bash os/tests/staging_reclaim_loop.sh
"""
default = false

# The native data plane acceptance suites on a host kernel
# (tools/native-tier1.sh). Needs a privileged node on Linux 6.14+ with pre-content
# fanotify, Btrfs and loop devices.
[[check]]
name = "native-tier1"
