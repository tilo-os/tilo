[[check]]
name = "standalone-app"
# Installs packages (npm, PyPI, rustup) from hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/standalone-app.sh --bootstrap --branch main"
# Runs `cargo install` of a crate the state's Cargo.lock doesn't name, so it needs cargo's
