# Too heavy for every commit of main: it runs on release candidates (`stable`), when dispatched,
# and on main's newest head when t has room (`idle`), keyed per commit and bisected to the commit
# that broke it. `t suggest` names it for a change that touches it.
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

# The tests of the imager and its backend need ext4, XFS or Btrfs: under the internal cache
# (TILO_IMAGER_TEST_CACHE_ROOT) and under TMPDIR, where the migration review keeps its
# inventory scratch, and both refuse any other filesystem. A node's build directory and TMPDIR
# may be on another one (ZFS, an overlay, tmpfs), so the packages run in a micro-VM check of
# their own instead of the test family (.config/nextest-filters.toml, `micro_vm`), on each
# architecture, as their code differs between them. Like `test/imager` before it, it runs
# whenever a change reaches them: this is the packages' only test run. The tests are built and
# archived here, as the test family builds them (beside workspace-unify, so its units are that
# family's), where builds are warm.
[[check]]
name = "imager-tests-build-{arch}"
# The micro-VM runs these binaries, on the same architecture.
requires = ["arch={arch}"]
run = """
set -eu
mkdir -p "$CARGO_TARGET_DIR/vm"
# nextest keeps its store at the repository's target/nextest unless told otherwise, and the
# sources are read-only: a tool config moves it into the build directory.
printf '[store]\\ndir = "%s/nextest"\\n' "$CARGO_TARGET_DIR" > "$CARGO_TARGET_DIR/vm/nextest-store.toml"
cargo nextest archive --locked --profile ci --tests -p imager -p imager-backend -p workspace-unify \\
  --tool-config-file "t:$CARGO_TARGET_DIR/vm/nextest-store.toml" \\
  --archive-file "$CARGO_TARGET_DIR/vm/imager-tests-{arch}.tar.zst"
"""
outputs = ["/target/vm/imager-tests-{arch}.tar.zst"]

[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "imager-tests-{arch}"
requires = ["arch={arch}"]
isolation = "vm"
needs = ["imager-tests-build-{arch}"]
# What the test family requires of the builder, which the guest's userspace is.
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1", TILO_TEST_NTFS_FIXTURES = "0" }
run = """
set -eu
# The guest's /var/tmp is on the step's own scratch disk, an empty ext4 t makes for each step
# (its README, "Micro-VM steps"), not the node's filesystem. The tests assert the filesystem
# themselves and fail, naming it, on any other. /var/tmp itself is world-writable, which the
# publication of an installed system refuses among its target's ancestors (as a job's private
# TMPDIR never is), so a directory on it is mounted at /imager, below / alone.
echo "imager-tests-{arch}: /var/tmp is $(awk '$2 == "/var/tmp" { print $3 }' /proc/mounts)"
mkdir -p /var/tmp/imager /imager
mount --bind /var/tmp/imager /imager
chmod 700 /imager
export TMPDIR=/imager/tmp TILO_IMAGER_TEST_CACHE_ROOT=/imager/cache
mkdir -p "$TMPDIR" "$TILO_IMAGER_TEST_CACHE_ROOT"
# The tests run as the guest's root, with its capabilities: the original-image review's refusal
# of a changed held image is observed only so (as uid 0 without capabilities, the job
# sandbox's identity, it fails), and the fixtures that need root run instead of skipping.
# nextest's store, as in imager-tests-build-{arch}: not in the read-only sources.
printf '[store]\\ndir = "/var/tmp/nextest"\\n' > /var/tmp/nextest-store.toml
bash tools/test-env.sh cargo nextest run --profile ci --no-fail-fast \\
  --tool-config-file t:/var/tmp/nextest-store.toml \\
  --archive-file /target/vm/imager-tests-{arch}.tar.zst --workspace-remap /src
"""

[check.matrix]
arch = ["x86_64", "aarch64"]

