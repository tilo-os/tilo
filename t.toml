[[check]]
name = "identity-accounts"
on = ["idle", "stable"]
run = "set -eu\n# The fixtures must run as real root in the micro-VM, with its capabilities: one group runs\n# as an ordinary account through setpriv, the other as the guest's own root. If t ever stops\n# giving the guest root, fail here instead of letting the fixtures skip.\nif [ \"$(id -u)\" != \"0\" ]; then\n  echo \"identity-accounts: expected euid 0 in the micro-VM, got $(id -u)\" >&2\n  exit 1\nfi\nmkdir -p \"$TMPDIR\"\n# Every fixture below must run the exact case it exists for. A filter that matches fewer (or\n# no) tests still exits 0, and a capability skip inside a scenario's phase still reports the\n# scenario as passed, so compare the reported count and look for the skip message.\nrun_tests() {\n  expected=$1\n  shift\n  output=$(\"$@\" 2>&1) || { status=$?; printf '%s\\n' \"$output\"; return \"$status\"; }\n  printf '%s\\n' \"$output\"\n  case \"$output\" in\n    *\"skipping test at\"*|*\"not exercising\"*) echo \"selected fixture skipped: $*\" >&2; return 1 ;;\n  esac\n  actual=$(printf '%s\\n' \"$output\" | sed -n 's/^test result: ok\\. \\([0-9][0-9]*\\) passed.*/\\1/p' | tail -n 1)\n  if [ \"${actual:-}\" != \"$expected\" ]; then\n    echo \"expected $expected passing tests, got ${actual:-none}: $*\" >&2\n    return 1\n  fi\n}\n# Each fixture runs in a process of its own, as the test runner gives it.\none() {\n  run_tests 1 \"$@\" --nocapture --test-threads=1\n}\n# These observe what an ordinary account may not read, so they run as one: a home of its own\n# to write in, and the account setpriv switches to.\nhome=/var/tmp/identity-user\nmkdir -p \"$home/run\"\nchmod 0700 \"$home/run\"\nchown -R 1000:1000 \"$home\"\nfor selection in \\\n  identity-device-identity:persist::tests::an_unreachable_device_key_is_an_error_not_a_fresh_machine \\\n  identity-files:provisioning_flushes_every_barrier_and_keeps_what_a_failure_left \\\n  identity-windows-vm:owner_status::tests::the_owner_status_summary_reads_state_and_runtime_status_safely \\\n  identity-secrets:owner_migration::chromium::tests::owner_scope_refuses_files_and_elevation_without_contacting_a_keyring \\\n  identity-runtime-portal:descriptors::tests::a_peer_that_cannot_be_traced_still_hands_over_its_descriptor \\\n  identity-linux-vm:hosted::jail::tests::only_a_root_owned_configuration_is_read \\\n  identity-tilo-identity:person_files::tests::a_symlinked_or_foreign_identity_directory_is_refused \\\n  identity-launcher:owned_service::capture::root_output::tests::original_output_admission_needs_held_native_ownership \\\n; do\n  binary=${selection%%:*}\n  test=${selection#*:}\n  one setpriv --reuid=1000 --regid=1000 --clear-groups \\\n    env HOME=\"$home\" TMPDIR=\"$home\" XDG_RUNTIME_DIR=\"$home/run\" \"/target/vm/$binary\" --exact \"$test\"\ndone\n# These observe what only root may do, as the guest's own root.\none /target/vm/identity-tilo-identity --exact \"person_files::tests::root_writes_into_a_persons_directory_only_as_the_person\"\none /target/vm/identity-files-lib --exact \"native::atomic::directory::retained_foundation_tests::a_held_store_publishes_and_validates_through_the_directory_it_holds\"\n"
needs = ["identity-accounts-build"]
