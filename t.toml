# Fuzzing with the pinned nightly toolchain, installed at run time
# into the check's own rustup home, as the image's is read-only.
[[check]]
name = "nightly-fuzz"
run = """
export RUSTUP_HOME=$TMPDIR/rustup
rustup toolchain install nightly-2026-08-25 --profile minimal --no-self-update
cargo +nightly-2026-08-25 install cargo-fuzz --locked --version 0.13.2 --root "$TMPDIR/cargo-fuzz"
export PATH=$TMPDIR/cargo-fuzz/bin:$PATH
for target in tapp_ingress workspace_invitation identity_wire sandbox_policy render_scene; do
  cargo +nightly-2026-08-25 fuzz run "$target" -- -max_total_time=900 -timeout=10
done
"""
env = { RUST_BACKTRACE = "1" }
inputs = ["fuzz/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock"]
writable_sources = true
# LeakSanitizer's exit-time leak check stops the process's threads with ptrace, which the
# job sandbox refuses: the check dies there with a fatal error and an empty "crash" input.
# A micro-VM allows it, so every target keeps its leak check.
isolation = "vm"
requirement = { cores = 4, memory = "8GiB" }
on = ["stable", "dispatch"]
timeout_secs = 5400
cost = "heavy"
default = false

