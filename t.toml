[[check]]
name = "image-ci-fast"
# Fetches from mirrors, registries and release hosts no fixed list names. Not `pinned`: its two
# FROMs are named by digest, but the `dnf install`s in os/Containerfile.ci-fast name packages, not
# bytes, and a mirror may answer with another build of one. It can be served again once the build
# installs those from a snapshot named by digest and this line declares that egress `pinned`, as
# the OS image does with registry.tilo.so/tilo/rpms.
#
# The build's date is source-date-ci-fast's: rpm records it as the transactions' install time
# (its signature check is the real clock's, so a mirror's newest update installs regardless), and
# oci-build.sh dates the image and its layers with it. A commit that changes none of the files
# the date covers builds the same image again.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "SOURCE_DATE_EPOCH=$(cat /target/source-date/ci-fast)\nexport SOURCE_DATE_EPOCH\n# The only files the build reads from the tree are the scripts that clean up after the\n# package transactions and pin the times they leave (os/Containerfile.ci-fast).\ncontext=$TMPDIR/ci-fast-context\nrm -rf \"$context\"\nmkdir -p \"$context/os/scripts\"\ncp os/scripts/finalize-rpmdb.sh os/scripts/clean-dnf-layer-state.sh os/scripts/pin-directory-times.py \"$context/os/scripts/\"\nbash tools/ci/publish/oci-build.sh \"$context\" os/Containerfile.ci-fast /target/publish/ci-fast --build-arg \"TILO_BUILD_EPOCH=$SOURCE_DATE_EPOCH\"\n"
needs = ["source-date-ci-fast"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/ci-fast/image.oci.tar", "/target/publish/ci-fast/digest"]
default = false

