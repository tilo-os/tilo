[[ $RENDERER_VARIANT == gpu || $RENDERER_VARIANT == gpu-generic-cpu || $RENDERER_VARIANT == vello-cpu || $RENDERER_VARIANT == gl-softpipe || $RENDERER_VARIANT == lp-zero || $RENDERER_VARIANT == lp-no-rast ]] || {
