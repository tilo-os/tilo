# ---- App and engine releases -------------------------------------------------------------
#
# Per architecture, the app release, in two steps: the compile, which holds no key and builds
# every selected app once, then the packaging that signs with the release
# identities, which only a trusted run has. They are checks of their own so that a run without
# identities can never produce a signed package, and so that the compile's result serves the
# package, the size budgets and the dev shapes alike. `dist/apps/package-apps.sh` is the one path
# both run: `TILO_APP_COMPILE_ONLY=1` for the first, `TILO_APP_PREBUILT` over its tree for the
# second, which then runs no compiler.
#
# The version a release carries is its commit (`T_COMMIT`, which a check with `git = true` or
# secrets is given): the same commit packages the same bytes, so a second run is answered from
# the cache and a device downloads nothing new. A number made per run instead would make the same
# commit a new release every time.

[[check]]
name = "apps-build-{arch}"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -euo pipefail
export CARGO_INCREMENTAL=0
export CARGO_PROFILE_RELEASE_LTO=thin
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
export CARGO_BUILD_JOBS=$(bash -c 'source tools/apps/release-lib.sh; cargo_jobs')
export CARGO_TARGET_DIR=/target/apps-build/{arch}
export TILO_RELEASE_APPS=$(python3 -I tools/ci/python.py tools/apps/app_release.py --collection default | python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["apps"]))')
export TILO_APP_COMPILE_ONLY=1
dist/apps/package-apps.sh'''
needs = ["test-assets"]
requires = ["arch={arch}"]
env = { TILO_TEST_ASSET_SEED = "/target/test-assets" }
outputs = ["/target/apps-build/{arch}/**"]
on = ["dispatch"]
timeout_secs = 10800
[check.matrix]
arch = ["x86_64", "aarch64"]

# The signed tapps, from the compiled tree: `package-apps.sh` packages and signs in one run, so
# this is the old `app-binaries` and `sign-apps` link together. The identities are written to
# files of a scratch directory and taken out of the environment before anything else runs, so no
# step after it can read them and none of them can reach an output.
[[check]]
name = "sign-apps-{arch}"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
(umask 077; printf '%s' "$TAPP_PUBLISHER_IDENTITY" > "$work/app-publisher.json")
(umask 077; printf '%s' "$RUNTIME_BUNDLE_SIGNING_KEY" > "$work/runtime-publisher.json")
unset TAPP_PUBLISHER_IDENTITY RUNTIME_BUNDLE_SIGNING_KEY
export TAPP_PUBLISHER_IDENTITY_FILE="$work/app-publisher.json"
export RUNTIME_BUNDLE_IDENTITY_FILE="$work/runtime-publisher.json"
export CARGO_INCREMENTAL=0
export CARGO_PROFILE_RELEASE_LTO=thin
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
export TILO_RELEASE_APPS=$(python3 -I tools/ci/python.py tools/apps/app_release.py --collection default | python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["apps"]))')
export TILO_APP_PREBUILT=/target/apps-build/{arch}
export TILO_APP_TOOLS_BUILT=1
export TILO_APP_RELEASE_OUT=/target/app-release/{arch}
export TILO_APP_RELEASE_SOURCE="$T_COMMIT"
export TILO_APP_RELEASE_SEQUENCE=$(git show -s --format=%ct "$T_COMMIT")
dist/apps/package-apps.sh
# The package CLI the publication runs on: the same bytes the tapps were packed with.
install -m 0755 /target/apps-build/{arch}/release/tilo-app-package /target/app-release/{arch}/tilo-app-package'''
needs = ["apps-build-{arch}"]
requires = ["arch={arch}"]
secrets = ["TAPP_PUBLISHER_IDENTITY", "RUNTIME_BUNDLE_SIGNING_KEY"]
git = true
outputs = ["/target/app-release/{arch}/**"]
on = ["dispatch"]
heavy = true
timeout_secs = 5400
[check.matrix]
arch = ["x86_64", "aarch64"]

# What a release's signed packages must show before they are published: every windowed app draws
# its first frame against the shared runtime, a media app decodes through the GStreamer the runtime
# loads on first use, Typst Editor runs its engine libraries, and every app's own engine
# library loads when it starts. It reads the compile's tree and the signed release the sign check
# wrote (`tools/apps/release-smoke.sh`), so it builds nothing.
[[check]]
name = "app-release-smoke-{arch}"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = '''set -euo pipefail
export CARGO_TARGET_DIR=/target/apps-build/{arch}
export TILO_APP_RELEASE_OUT=/target/app-release/{arch}
bash tools/apps/release-smoke.sh {arch}'''
needs = ["apps-build-{arch}", "sign-apps-{arch}"]
requires = ["arch={arch}"]
timeout_secs = 5400
on = ["dispatch"]
heavy = true
[check.matrix]
arch = ["x86_64", "aarch64"]

# A release's signed packages, published to the registry at apps.tilo.so from main
# (`tools/apps/publish-apps.sh`): every tapp with its compressed twin and the store's artwork go up
# as immutable generic packages, then the Tilo, tilolang and Browser engine runtimes, the apps and
# the language packs are submitted as entries the publisher identity signs, which the registry
# verifies again before its signed catalogue names them. It refuses a registry at another package
# format, and a release signed by keys devices do not already trust. `--input apps="tl-chat"`
# publishes only the apps named, with the runtimes; a second run of the same commit uploads and
# submits nothing new.
[[check]]
name = "publish-apps-{arch}"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
# t gives the package token only to jobs on a disk-100g node, so both architectures publish from
# x86_64 with the x86_64 release's package CLI.
run = "bash tools/apps/publish-apps.sh /target/app-release/{arch} /target/app-release/x86_64/tilo-app-package"
needs = ["sign-apps-{arch}", "app-release-smoke-{arch}", "sign-engine-x86_64", "sign-engine-aarch64"]
requires = ["arch=x86_64", "disk-100g"]
secrets = ["TILO_PACKAGES_TOKEN", "TAPP_PUBLISHER_IDENTITY"]
env = { TILO_ENGINE_PACKAGES = "/target/engine-release/x86_64/signed/package /target/engine-release/aarch64/signed/package" }
cache = false
on = ["dispatch"]
timeout_secs = 3600
dispatch_inputs = { apps = "" }
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check.matrix.set]]
when = { arch = "aarch64" }
needs = ["sign-apps-aarch64", "app-release-smoke-aarch64", "sign-apps-x86_64"]

# Two builds of one app give the same bytes, or every image and update re-sends what did not
# change: `tools/apps/check-reproducible-tapp.sh` packages a small app twice through the same
# script, with one identity made for it, and names every byte that differs.
[[check]]
name = "app-reproducible-{arch}"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/apps/check-reproducible-tapp.sh poker"
requires = ["arch={arch}"]
on = ["dispatch"]
heavy = true
timeout_secs = 5400
[check.matrix]
arch = ["x86_64", "aarch64"]

# The browser engine, the runtime the Browser renders pages with: compiled once per architecture
# without a key, then sealed in two shapes. `seal` with the release identities is the release
# package; without them it makes its own throwaway keys, which is the development shape, and no
# device trusts it.
[[check]]
name = "engine-build-{arch}"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -euo pipefail
export CARGO_INCREMENTAL=0
export CARGO_PROFILE_RELEASE_LTO=thin
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
export CARGO_BUILD_JOBS=$(bash -c 'source tools/apps/release-lib.sh; cargo_jobs')
export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$T_COMMIT")
python3 -I tools/ci/python.py tools/apps/browser_runtime_release.py compile \
  --arch {arch} --source "$T_COMMIT" --out /target/engine-release/{arch}/compiled'''
git = true
requires = ["arch={arch}"]
outputs = ["/target/engine-release/{arch}/compiled/**"]
on = ["dispatch"]
timeout_secs = 10800
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "engine-dev-{arch}"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -euo pipefail
cp -a /target/engine-release/{arch}/compiled /target/engine-release/{arch}/dev
export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$T_COMMIT")
REQUESTED_PUBLISH=false python3 -I tools/ci/python.py tools/apps/browser_runtime_release.py seal \
  --arch {arch} --source "$T_COMMIT" --sequence "$SOURCE_DATE_EPOCH" \
  --out /target/engine-release/{arch}/dev
version=$(sed -n 's/^version = "\(.*\)"$/\1/p' /target/engine-release/{arch}/dev/runtime/bundle.toml)
[[ -n $version ]] || { echo "the sealed engine names no version" >&2; exit 1; }
mkdir -p /target/engine-dev/{arch}/bundles
cp -a /target/engine-release/{arch}/dev/runtime "/target/engine-dev/{arch}/bundles/$version"'''
needs = ["engine-build-{arch}"]
git = true
requires = ["arch={arch}"]
outputs = ["/target/engine-dev/{arch}/bundles/**"]
on = ["dispatch"]
timeout_secs = 5400
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "sign-engine-{arch}"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
(umask 077; printf '%s' "$TAPP_PUBLISHER_IDENTITY" > "$work/app-publisher.json")
(umask 077; printf '%s' "$RUNTIME_BUNDLE_SIGNING_KEY" > "$work/runtime-publisher.json")
unset TAPP_PUBLISHER_IDENTITY RUNTIME_BUNDLE_SIGNING_KEY
export TAPP_PUBLISHER_IDENTITY_FILE="$work/app-publisher.json"
export RUNTIME_BUNDLE_IDENTITY_FILE="$work/runtime-publisher.json"
cp -a /target/engine-release/{arch}/compiled /target/engine-release/{arch}/signed
export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$T_COMMIT")
REQUESTED_PUBLISH=true python3 -I tools/ci/python.py tools/apps/browser_runtime_release.py seal \
  --arch {arch} --source "$T_COMMIT" --sequence "$SOURCE_DATE_EPOCH" \
  --out /target/engine-release/{arch}/signed'''
needs = ["engine-build-{arch}"]
secrets = ["TAPP_PUBLISHER_IDENTITY", "RUNTIME_BUNDLE_SIGNING_KEY"]
git = true
requires = ["arch={arch}"]
outputs = ["/target/engine-release/{arch}/signed/package/**", "/target/engine-release/{arch}/signed/bin/**"]
on = ["dispatch"]
timeout_secs = 5400
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "app-sizes-{arch}"
# Fetches from mirrors, registries and release hosts no fixed list names, and all of it pinned:
# crates by Cargo.lock (`cargo build --locked`), fonts by the SHA-256 the catalog verifies them
# against (tools/font-catalog.py). Pinned, a verdict is kept by what the job read and served to
# the next ask of the same state, instead of every ask building the release again.
egress = { to = ["0.0.0.0/0", "::/0"], pinned = true }
run = "set -euo pipefail\n# One release build of the default collection, then the two budgets over it: every app's\n# signed tapp (tools/perf/tapp-size-budget/) and the shared runtime's bytes, relocations and\n# symbol lookups (tools/perf/runtime-size-budget/). package-apps.sh builds with throwaway\n# identities when no publisher key is given, which is all a size build needs.\n# Each measure prints its numbers and its own verdict, so an over-budget tapp never hides\n# the runtime's numbers, or the reverse.\nexport CARGO_INCREMENTAL=0\nexport CARGO_BUILD_JOBS=$(bash -c 'source tools/apps/release-lib.sh; cargo_jobs')\nexport TILO_RELEASE_APPS=$(python3 -I tools/ci/python.py tools/apps/app_release.py --collection default | python3 -c 'import json, sys; print(\" \".join(json.load(sys.stdin)[\"apps\"]))')\nexport TILO_APP_RELEASE_OUT=/target/app-sizes/{arch}\ndist/apps/package-apps.sh\nfailed=\npython3 tools/perf/tapp_size_ratchet.py measure /target/app-sizes/{arch} --arch {arch} --every || failed=1\nlibdir=$(rustc --print target-libdir)\npython3 tools/perf/runtime_size_ratchet.py measure \"$CARGO_TARGET_DIR/thin-app/libruntime_dylib.so\" --arch {arch} --apps-dir \"$CARGO_TARGET_DIR/thin-app\" --library-dir \"$libdir\" $(sed \"s|^|--engine $CARGO_TARGET_DIR/thin-app/|\" \"$CARGO_TARGET_DIR/thin-app/runtime-engines\") || failed=1\n[[ -z $failed ]]\n"
outputs = ["/target/app-sizes/{arch}/**"]
requires = ["arch={arch}"]
timeout_secs = 5400
on = ["dispatch", "idle", "stable"]
heavy = true
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "chromium-blocker"
# The host links this library to match filter rules in native code
# (crates/engines/chromium-blocker). Cargo reads every member's manifest and the lockfile to build
# it, so it is built on its own here and `chromium-engine` reads the library: a dependant is keyed
# by what its need output, not by what the need read, so a head that moved a manifest builds the
# library again (seconds) and the engine not at all while its bytes stay the same.
egress = { to = ["code.tilo.so:443"], pinned = true }
run = '''set -euo pipefail
cargo build --locked -p tilo-chromium-blocker --profile thin-app
rm -rf /target/chromium-blocker && mkdir -p /target/chromium-blocker
cp "$CARGO_TARGET_DIR/thin-app/libtilo_chromium_blocker.a" /target/chromium-blocker/
'''
outputs = ["/target/chromium-blocker/**"]
requires = ["arch=x86_64"]
timeout_secs = 1800
default = false

[[check]]
name = "chromium-engine"
# The Browser's engine alone: the pinned CEF archive (its SHA-256 in
# scripts/browser/cef-lock.json) and the host's sources, and nothing else of the tree. So one
# build answers every tree, and the checks that need a session are given it (`TILO_CHROMIUM_ENGINE`)
# rather than downloading and compiling Chromium each. The blocker library it links is
# `chromium-blocker`'s, given here by `TILO_CHROMIUM_BLOCKER`: this check runs no cargo, so it
# reads no manifest or lockfile and only a change to the library itself rebuilds Chromium. A
# developer's own `dist/dev/nested-session-build.sh` run, which no check answers, builds both in
# place as before.
egress = { to = ["code.tilo.so:443", "cef-builds.spotifycdn.com:443"], pinned = true }
run = "python3 scripts/browser/build-host.py --work /target/chromium-build --runtime /target/chromium-engine --jobs \"${CARGO_BUILD_JOBS:-$(nproc)}\""
needs = ["chromium-blocker"]
env = { TILO_CHROMIUM_BLOCKER = "/target/chromium-blocker/libtilo_chromium_blocker.a" }
outputs = ["/target/chromium-engine/**"]
requires = ["arch=x86_64"]
timeout_secs = 3600
default = false

[[check]]
name = "nested-session-fonts"
# The product fonts the session's text is set in, materialized from the tree's pinned catalog and
# the release store's artifacts. Its own fetch, so the session's build reaches no network of its
# own: a check's failure under an egress it declares is never served to a later ask, and a build
# that fetches nothing has no such failure.
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "python3 tools/font-catalog.py prepare crates/ui/ui-core/assets/fonts /target/nested-session-fonts --scope product"
outputs = ["/target/nested-session-fonts/**"]
requires = ["arch=any"]
timeout_secs = 1800
default = false

[[check]]
name = "nested-session"
# No network of its own: the engine, the fonts and the pinned test assets are their checks'
# (`chromium-engine`, `nested-session-fonts` and `font-seed`, `test-assets`). A job that reached no
# network can fail only for its own reasons, so its failure is served to a later ask instead of
# being kept outbound: a tree that fails the build is not asked again for another 20 minutes.
run = "bash dist/dev/nested-session-build.sh /target/nested-session"
needs = ["image-env-runtime-dev-tree-x86_64", "chromium-engine", "nested-session-fonts", "font-seed", "test-assets"]
# The build's own default app set, and Calendar: a user story walks a person connecting their
# calendar in it (stories/shell/calendar-invite.py), and a session installs only the apps its
# build carries. The paths are those checks' outputs: the engine runtime and product fonts this
# build stages, the pinned font artifacts and test assets its build scripts read instead of
# fetching.
env = { TILO_ENV_RUNTIME_TREES = "/target/publish/env-runtime/dev-trees", TILO_CHROMIUM_ENGINE = "/target/chromium-engine", TILO_NESTED_FONTS = "/target/nested-session-fonts", TILO_FONT_ASSET_CACHE = "/target/font-seed", TILO_TEST_ASSET_CACHE = "/target/test-assets" }
requires = ["arch=x86_64"]
outputs = ["/target/nested-session/**"]
timeout_secs = 5400
default = false

# The tilolang apps laid out headlessly at the standard window sizes: 320x568 and 390x844, a
# phone's, and 1280x800, a laptop's. What `tilo-layout-check` finds is the check's verdict (a
# finding the allow-list does not name, a line it names that no longer shows, a view no scenario
# reaches), and the report, the layout of the frames its findings came from and, when a run asks
# for them, its PNG captures are its outputs: `t outputs layout-check --to DIR`. The renders are
# the toolkit's own, so they run in the test environment (the product's fonts, lavapipe) on
# x86_64, where the visual goldens are recorded. One job lays every view out once and reports the
# three sizes; a view is read at every size from 320x568 to 3440x1440 either way, so a second job
# over the same apps would read all of them again for a verdict it already has.
#
# The pictures cost nine tenths of the check: each is a software rasterisation of a whole window,
# nine hundred of them to a size, and a run over the tree that took them measured over half an
# hour against a few minutes for the verdict alone. So they are taken when asked (`--input
# shots=true`), not on every head.
#
# A run narrows with its inputs, which are part of its key: `app` lays out one package of `apps/tl`
# (`--input app=apps/tl/tasks`, the run to make while iterating), `size` reports one size of the
# three (`--input size=390x844`), `shots=true` writes the window at each reported size, light and
# dark, to PNGs in its own directory, `press` presses a control by its words before each window is
# read (`--input press="Mark Buy oat milk and eggs done"`), `dump=true` prints every frame laid out
# rather than only those a finding came from, `shot_height=2200` takes the shots in a window that
# tall, so the lower part of a long page shows, `hover=640,980` rests the pointer there for the
# shots (a chart's readout), and `state=picked=studio` stages a view state's value before anyone
# picks, so a screen behind a pick is the one shot. Strict's whole-tree verdict (an allow-list line
# that no longer shows, a view no scenario reaches) is the run that names no app and no press; a
# narrowed run still fails on a finding the allow-list does not name.
[[check]]
name = "layout-check"
# Heavy: every app of apps/tl laid out at every size, strict, in one pass: the three jobs that each
# made that whole pass for the same verdict cost 10.1 core-hours and 11.6 minutes apiece (91 jobs,
# 923 core-hours, 2026-11-25). The pictures, nine hundred windows a size and a software
# rasterisation apiece, are taken only by a run that asks for them (`shots=true`). On main's newest
# head with the room main's heads leave (`idle`), keyed on every commit, so a failure is still
# bisected to the commit that broke it and told to its pusher.
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/layout-check.sh"
requires = ["arch=x86_64"]
outputs = ["/target/layout-check/**"]
# A run with findings fails, and the report and the frames its findings came from (dump.txt) are
# what says why: they are kept as evidence, so `t outputs layout-check` fetches them from a failed
# run too.
evidence = ["/target/layout-check/**"]
timeout_secs = 1800
dispatch_inputs = { app = "", size = "", shots = "false", press = "", dump = "false", shot_height = "", hover = "", state = "" }

[[check]]
name = "app-screenshots"
# Each capture runs in the app its device's daemon starts, in the app's own sandbox: the job starts
# sandboxes of its own.
isolation = "nested"
# The Chromium engine Browser renders pages with is its own check's (`chromium-engine`): one build
# of the pinned CEF archive (SHA-256 in scripts/browser/cef-lock.json) answers every tree, and this
# job signs it as the runtime bundle Browser requires rather than downloading and compiling
# Chromium again. The build scripts' pinned assets are the job's other reach.
egress = { to = ["code.tilo.so:443", "cef-builds.spotifycdn.com:443"], pinned = true }
needs = ["chromium-engine"]
env = { TILO_CHROMIUM_ENGINE = "/target/chromium-engine" }
run = "bash tools/ci/ensure-browser-dependencies.sh\nbash tools/screenshots/build.sh \"$CARGO_TARGET_DIR/app-screenshots-build\"\nrm -rf /target/app-screenshots\nbash tools/test-env.sh python3 -I tools/screenshots/run.py --out /target/app-screenshots \\\n  --bin-dir \"$CARGO_TARGET_DIR/app-screenshots-build/bin\" \\\n  --apps \"${T_INPUT_APPS:-}\"\n"
dispatch_inputs = { apps = "" }
requires = ["arch=x86_64"]
outputs = ["/target/app-screenshots/**"]
# A failed situation's picture, log and summary are what says why it failed.
evidence = ["/target/app-screenshots/**"]
timeout_secs = 5400
default = false

[[check]]
name = "imager-journey-screenshots"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "rm -rf /target/imager-journey-screenshots\nTILO_UI_SCREENSHOT_DIR=/target/imager-journey-screenshots bash tools/ci/nextest.sh \\\n  cargo nextest run -p imager --lib --no-fail-fast \\\n  -E 'test(/setup::journey::(visual_tests|visual_review_tests|tests::existing_backup_recovery)/)' \\\n  || echo \"imager-journey-screenshots: some tests failed; the pictures taken are kept\"\n"
outputs = ["/target/imager-journey-screenshots/**"]
timeout_secs = 3600
