# ---------------------------------------------------------------------------
# The app SDK: its compile-free policy, the Linux path, the web desktop in
# headless Chromium and the release bundle's size.

[[check]]
name = "sdk-policy"
requires = ["arch=any"]
run = """
python3 tools/policy/check_app_portability.py
python3 tools/policy/check_app_capabilities.py
python3 tools/web/generate_web_desktop.py --check
python3 tools/apps/generate_catalogue_fleet.py --check
python3 tools/sdk/publish_check.py --report-only
"""
# Of what it checks, the two generators write what they find stale.
fix = "python3 tools/web/generate_web_desktop.py && python3 tools/apps/generate_catalogue_fleet.py"

# The SDK's Linux path: the target commands, a generated app outside the
# repository, and Calculator built and packaged as a .tapp.
[[check]]
name = "sdk-linux"
run = """
cargo test --locked -p tilo-caps
cargo test --locked -p tilo-app-cli --lib targets::
cargo build --locked -p tilo-app-cli -p tilo-app-package-cli --bin tilo-app --bin tilo-app-package
bin=$CARGO_TARGET_DIR/debug
"$bin/tilo-app" build --target linux apps/calculator
cargo test --locked -p tilo-app-cli --test it outside_repo -- --ignored --nocapture
TILO_PKG=$bin/tilo-app-package CARGO_PROFILE_THIN_APP_OPT_LEVEL=1 CARGO_PROFILE_THIN_APP_CODEGEN_UNITS=16 CARGO_PROFILE_THIN_APP_DEBUG=0 \
  "$bin/tilo-app" package --target linux apps/calculator --output "$TMPDIR/calculator.tapp" --force
test -s "$TMPDIR/calculator.tapp"
"""
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

# The SDK's web path: the calculator desktop bundle, governed mounted-resource
# journeys, every registered app mounted and the desktop navigated in headless
# Chromium for Testing, which it downloads. The bundle build runs `npm ci` in
# scripts/moq-browser, inside the source tree. The voice call and the cold
# encrypted resource need Chromium's own sandbox, which it refuses to use as
# root, so they run as an unprivileged user in a user namespace of their own.
# The desktop bundle compiles apps whose build scripts embed pinned fixtures
# (the PDF viewer's, the ebook's): they come from the test-assets check's
# verified seed, so a forge or DNS hiccup cannot fail the bundle build.
[[check]]
name = "sdk-web"
isolation = "nested"
run = """
node --test crates/platform/*/web/*.test.mjs
cargo build --locked -p tilo-app-cli --bin tilo-app
app=$CARGO_TARGET_DIR/debug/tilo-app
web=$CARGO_TARGET_DIR/tilo-app/web
python3 tools/ci/prepare_sdk_moq.py prepare
"$app" build --target web --bundle desktop apps/calculator
python3 tools/ci/prepare_sdk_moq.py license "$web/calculator/bundle"
bash tools/ci/ensure-browser-dependencies.sh
npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
node --test crates/agent/agent-participant/tests/mounted_resource/accounts.test.mjs
cargo run --locked -p tilo-agent-participant --example mounted-resource -- "$web/calculator/bundle"
"$app" build apps/chat --platform web
python3 tools/ci/prepare_sdk_moq.py license "$web/chat/bundle"
cargo run --locked -p tilo-agent-participant --example mounted-resource -- "$web/chat/bundle" --disconnect-retry
printf '#!/bin/sh\nexec python3 %s %s "$@"\n' "$PWD/tools/web/owned_browser.py" "$CHROME" > "$TMPDIR/chat-fixture-chromium"
chmod 755 "$TMPDIR/chat-fixture-chromium"
unprivileged='target.x86_64-unknown-linux-gnu.runner=["unshare","--user","--map-user=65534","--map-group=65534","--","bash","tools/with-test-environment.sh"]'
CHROME=$TMPDIR/chat-fixture-chromium cargo run --locked --config "$unprivileged" -p tilo-agent-participant --example mounted-resource -- "$web/chat/bundle" --voice
CHROME=$TMPDIR/chat-fixture-chromium cargo run --locked --config "$unprivileged" -p tilo-agent-participant --example mounted-resource -- "$web/chat/bundle" --encrypted-restart
CHROME=$TMPDIR/chat-fixture-chromium cargo run --locked --config "$unprivileged" -p tilo-agent-participant --example mounted-resource -- "$web/chat/bundle" --scrollback
(cd "$web/calculator/bundle" && python3 -m http.server 7878 --bind 127.0.0.1) &
server=$!
trap 'kill $server 2>/dev/null || true' EXIT
mapfile -t apps < <(python3 -c 'import json,sys; print("\\n".join(a["id"] for a in json.load(open(sys.argv[1]))["applications"]))' "$web/calculator/bundle/apps.json")
SHOTS_DIR=$TMPDIR/web-shots RUNNER_TEMP=$TMPDIR bash tools/web/run_smoke_shards.sh http://127.0.0.1:7878 "${apps[@]}" desktop
SHOTS_DIR=$TMPDIR/web-shots node crates/browser/tilo-web-desktop/scripts/navigation.mjs "$web/calculator/bundle"
"""
env = { CDP_PORT = "9333", TILO_WEB_SMOKE_SHARDS = "3", TILO_TEST_ASSET_SEED = "/target/test-assets" }
needs = ["test-assets"]
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

