# ---------------------------------------------------------------------------
# Publishing (docs/publishing-on-t.md). Each image is a chain of checks, generated from
# tools/ci/products.toml by tools/ci/t_toml.py where the product is listed there:
#
#   image-<name>[-context]  build, no secrets: runs anywhere, also for a working tree;
#                           image-<name>-<arch> per architecture, image-<name> their index
#   sign-<name>             signs the built digest with the release key in KMS; holds only
#                           the signing identity, on stable and release tags, as a micro-VM step
#   publish-<name>          pushes development tags from main and, with sign-<name> as an
#                           optional need, the signed release from stable or release tags
#
# The server runs publish-* on every new head of main and stable by itself (`on`), as trusted
# runs; nobody runs them from a working tree. Building and signing never share a check: the
# build runs arbitrary code, the signing check refuses any digest but the build's. No check
# holds a stored credential: each asks t for an identity token (`id_token`) naming this
# repository, the reference and the commit, valid for minutes, so there is nothing long-lived
# to leak. registry.tilo.so takes the `registry.tilo.so` token as a push credential (user
# `oidc`) for main, stable and v* tags; AWS exchanges the `sts.amazonaws.com` token for the
# TiloTReleaseSigner role, which trusts stable and v* tags only and may do nothing but sign
# with the release keys. Check names have no `/` yet because the deployed server refuses it.

# The images the publishing checks run in (buildah, skopeo) come from quay.io, which deletes the
# digests a pin names once it rebuilds a tag. They are mirrored into registry.tilo.so and pinned
# there; this check copies each digest of tools/ci/publish/mirrored-images.tsv across while
# upstream still serves it, and passes at once when the mirror has them all.
[[check]]
name = "mirror-images"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/mirror-images.sh"
inputs = ["tools/ci/publish/lib.sh", "tools/ci/publish/mirror-images.sh", "tools/ci/publish/mirrored-images.tsv"]
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["main"]

