on = ["dispatch", "idle"]

# The Tilo app's APK, built as a developer builds one: `tilolang setup android` installs the SDK's
# build tools and platform from Google's repository, and `tilolang build` compiles the phone's
# library and its tilolang apps and links them. The JDK the SDK's tools run on, and zip, come from
# Fedora's release repository in the setup, which never changes (updates go to another), so the
# setup is pinned and served from t's cache; the builder image carries the NDK only. The JDK is
# named by its directory, since `java` on PATH comes from alternatives links the run doesn't see,
# and the SDK tools keep their cache in ANDROID_USER_HOME: Java's home is the passwd entry's, not
# $HOME, and isn't writable here. The library's std is built from source, from the crates its own
# lockfile names, which come from crates.io and need cargo's network.
[[check]]
name = "android-apk"
egress = { to = ["0.0.0.0/0", "::/0"] }
env = { CARGO_NET_OFFLINE = "false" }
setup = { run = "dnf install -y --setopt=install_weak_deps=False --repo=fedora --setopt=fedora.metalink= '--setopt=fedora.baseurl=https://dl.fedoraproject.org/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/' java-25-openjdk-devel zip unzip && dnf clean all", egress = { to = ["0.0.0.0/0", "::/0"], pinned = true } }
run = "export JAVA_HOME=\"$(dirname \"$(dirname \"$(ls /usr/lib/jvm/java-25-openjdk*/bin/javac | head -n 1)\")\")\"\nexport PATH=\"$JAVA_HOME/bin:$PATH\"\nexport ANDROID_HOME=\"$TMPDIR/android-sdk\"\nexport ANDROID_USER_HOME=\"$TMPDIR/android-user\"\nmkdir -p \"$ANDROID_HOME\" \"$ANDROID_USER_HOME\" \"$HOME/.android\"\ncp \"$T_REPO_INPUTS/android-debug-keystore\" \"$HOME/.android/debug.keystore\"\ncargo run --locked -p tilolang-cli --bin tilolang -- setup android --accept-licenses\ncargo run --locked -p tilolang-cli --bin tilolang -- build --platform android --arch x86_64 --profile release --output /target/android-apk crates/desktop/phone\n"
# The APK as it ships: an optimised build, whose size is the one the app-size budget reads, and
# the file a walk on an emulator or a phone installs (`t outputs android-apk`).
outputs = ["/target/android-apk/**"]
# The debug key every build of this check signs with, so an APK installs over the last one and a
# phone keeps its sign-in. It is kept on t's side, never in the public tree: a published key would
# let anyone sign an app that installs over a debug Tilo holding a person's device key. Anyone who
# can run this check can read it, which is fine for a debug key only. Release signing never takes
# this path, and no release key may ever be set as a repo input.
repo_inputs = ["android-debug-keystore"]
requires = ["arch=x86_64"]
on = ["dispatch", "idle", "stable"]
heavy = true
# t's compiler cache keeps none of the Android crates built against a std built from source (it
# counts them as compiles of two inputs), so each run compiles them all: about an hour.
timeout_secs = 7200

# That APK on an Android emulator: it starts, draws, answers a swipe with a new frame and keeps
# running (tools/ci/android-launch.sh). The setup installs, once and pinned, what the emulator
# links against, a JDK for avdmanager, and the SDK's emulator, platform-tools and system image
# from Google's repository. The emulator renders with SwiftShader, so a node needs KVM, no GPU.
# Its AVD lives in /dev/shm: the emulator wants more free space beside it than a job's scratch
# disk has.
[[check]]
name = "android-launch"
needs = ["android-apk"]
setup = { run = "dnf install -y --setopt=install_weak_deps=False --repo=fedora --setopt=fedora.metalink= '--setopt=fedora.baseurl=https://dl.fedoraproject.org/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/' java-25-openjdk-headless unzip libX11 libxkbfile libXext libXdamage libXfixes libXcomposite libXcursor libXi libXrandr libXrender libXtst libxcb libdrm mesa-libgbm nss nspr pulseaudio-libs libsecret libbsd libuuid ncurses-libs libpng fontconfig freetype dbus-libs expat libxkbcommon libxkbcommon-x11 xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil alsa-lib libglvnd-egl libglvnd-glx && dnf clean all\nexport JAVA_HOME=\"$(dirname \"$(dirname \"$(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -n 1)\")\")\"\nmkdir -p /opt/android-sdk/cmdline-tools\ncurl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip\nunzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools\nmv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest\nrm /tmp/cmdline-tools.zip\nyes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses >/dev/null\n/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk emulator platform-tools 'system-images;android-35;google_apis;x86_64' >/dev/null\n", egress = { to = ["0.0.0.0/0", "::/0"], pinned = true } }
run = "export JAVA_HOME=\"$(dirname \"$(dirname \"$(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -n 1)\")\")\"\nexport PATH=\"$JAVA_HOME/bin:$PATH\" ANDROID_HOME=/opt/android-sdk OUT=/target/android-launch AVD_DIR=/dev/shm\nbash tools/ci/android-launch.sh /target/android-apk/tilo-phone-x86_64.apk\n"
# The screenshots and the log, for a failure to be read by.
outputs = ["/target/android-launch/**"]
requires = ["arch=x86_64", "/dev/kvm"]
on = ["dispatch", "idle"]

[[check]]
