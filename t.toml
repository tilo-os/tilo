# ---- Product images, signatures and publication
#
# One chain per image: what it is built from, the image, a test that runs the thing inside it,
# then signing on the stable branch and publication wherever a release is asked for. Every link
# is a check of its own, so changing a link leaves every earlier one cached.
#
# The registry server is a `build`: a Containerfile of this tree whose one outside input is a
# named context, so t makes a check per instruction and caches each on what it reads. The other
# two are `run`s, for two reasons that stay true of them. Their context is not this tree's: a
# script assembles it from other checks' outputs (font catalogues prepared, the web bundle laid
# out, bot programs renamed), and t reads a build's context from the state's sources, so it would
# find those files missing. And both Containerfiles stamp the commit into the image with an `ARG`
# that the packaging script passes the commit to — a build arg is a fixed string in t.toml, while
# a per-commit one would rerun the config steps of every commit; the room service's test reads
# that label back and refuses an image whose `/mode` reports another revision.

[[check]]
name = "image-room-service-context"
run = "bash tools/ci/publish/room-service-context.sh /target/publish/room-service/context /target/publish/room-service/bin /target/publish/web-desktop/bundle"
needs = ["room-service-binaries", "web-desktop-bundle"]
outputs = ["/target/publish/room-service/context/**"]
git = true
requires = ["arch=x86_64"]
default = false

[[check]]
name = "image-room-service"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash tools/ci/publish/oci-build.sh /target/publish/room-service/context /target/publish/room-service/context/Containerfile /target/publish/room-service --build-arg SOURCE_REVISION=$(cat /target/publish/room-service/context/source-revision)\nbash crates/hosting/tilo-room-service/container/test-image.sh /target/publish/room-service/image.oci.tar $(cat /target/publish/room-service/context/source-revision)"
needs = ["image-room-service-context"]
outputs = ["/target/publish/room-service/image.oci.tar", "/target/publish/room-service/digest"]
requires = ["arch=x86_64"]
isolation = "nested"
# The image is dated by its commit's time, which `oci-build.sh` reads from the log.
git = true
default = false

[[check]]
name = "sign-room-service"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/room-service /target/publish/room-service"
needs = ["image-room-service", "signing-tools"]
outputs = ["/target/publish/room-service/payload.json", "/target/publish/room-service/signature", "/target/publish/room-service/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable"]

[[check]]
name = "publish-room-service"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/room-service /target/publish/room-service 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-room-service", "signing-tools"]
optional_needs = ["sign-room-service"]
outputs = ["/target/publish/room-service/receipt.json"]
pointers = { room-service = "/target/publish/room-service/receipt.json" }
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch", "stable"]

[[check]]
name = "image-web-entry-context"
run = "bash tools/ci/publish/web-entry-context.sh /target/publish/web-entry/context /target/publish/web-desktop/bundle"
needs = ["web-desktop-bundle"]
outputs = ["/target/publish/web-entry/context/**"]
