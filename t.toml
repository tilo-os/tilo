# The development loop's dev image and disk: the dev image as os-dev-image-ARCH builds it, but
# never published, so it needs neither what only a publication carries nor the commit
# (TILO_DEV_LOOP=1, tools/ci/publish/os-image.sh): it keeps the OS image's own local model
# catalog (the release's) in place of one naming this tree's runtimes, so asking for it builds
# none of the local model runtimes (llama.cpp for the CPU, Vulkan and CUDA, vLLM) nor that
# catalog; and it reads no Git, so a commit that changes none of its inputs is answered from the
# cache instead of building the image and installing the disk again. Everything else is the same
# build: the OS image, the dev components, the env-runtime, the install. Work on the disk, its
# install or what boots on it asks for `os-dev-disk-lean-x86_64`; the end-to-end checks of boxes
# boot it. Main's published dev images and disks, the check and acceptance keep os-dev-image-ARCH
# and os-dev-disk-ARCH: those name their commit, which publishing checks and the dev channel
# moves forward by, and carry this tree's runtimes in their catalog.
[[check]]
name = "os-dev-image-lean-{arch}"
on = ["idle", "stable"]
# Pinned: it installs from the RPM snapshot rpm-snapshot-ARCH names (image-rpms-ARCH's copy of
# it) and builds on the Rust toolchain image by digest.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "bash tools/ci/publish/os-image.sh dev {arch} /target/os/{arch}/image /target/publish/os-dev/{arch} /target/os/{arch}/compiled-dev"
needs = ["image-rpms-{arch}", "rpm-snapshot-{arch}", "os-image-{arch}", "os-dev-packages-{arch}", "os-compile-dev-{arch}", "env-runtime-dev-{arch}", "signing-tools"]
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
env = { TILO_DEV_LOOP = "1", TILO_DEV_PACKAGES = "/target/publish/os-dev-packages/{arch}" }
requires = ["arch={arch}", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/os-dev/{arch}/**"]
timeout_secs = 3600
[check.matrix]
arch = ["x86_64", "aarch64"]

