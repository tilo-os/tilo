# The OS image's checks that only read the finished image, run against the image the chain
# composed as an OCI layout rather than inside its build, where each lengthened the image layer
# a change to any binary rebuilds, and where the desktop programs, laid over the composed image,
# are not yet: the encrypted-boot, LUKS-enrolment, filesystem and rollback contracts, the
# programs contract (each program in place, the session's libraries resolved, the browser
# engine's runtime verified), that no Python program of Tilo's ships, that every file of a
# package the build installed is what the rpmdb records (dated by the image's clock, which tells
# the build's packages from the base's), and `bootc container lint`.
[[check]]
name = "os-image-contracts"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
# The image installs os/tests/boot_chain_invariants.sh and os/tests/luks_enrolment.sh as its own
# entrypoints; each runs the shipped script.
dnf install -y --setopt=install_weak_deps=False podman >/dev/null
podman=(podman --cgroup-manager=cgroupfs --events-backend=file)
image=$("${podman[@]}" pull -q "oci:/target/os/x86_64/image/oci")
trap '"${podman[@]}" image rm "$image" >/dev/null 2>&1 || true' EXIT
"${podman[@]}" run --rm --entrypoint /usr/libexec/tilo/boot-chain-test.sh "$image"
"${podman[@]}" run --rm --entrypoint /usr/libexec/tilo/luks-enrolment-test.sh "$image"
"${podman[@]}" run --rm --mount "type=bind,src=$PWD/os/tests/collaborative-files-image-contract.sh,dst=/run/tilo-collaborative-files-image-contract.sh,ro" \
  --entrypoint bash "$image" -c 'OS_ROOT=/ bash /run/tilo-collaborative-files-image-contract.sh image'
"${podman[@]}" run --rm --mount "type=bind,src=$PWD/os,dst=/repo/os,ro" \
  --entrypoint bash "$image" -c 'bash /repo/os/tests/rollback-wrappers.sh /usr/libexec/tilo/tilo-rollback'
epoch=$("${podman[@]}" image inspect --format '{{index .Labels "org.tilo.source-date-epoch"}}' "$image")
case $epoch in ''|*[!0-9]*) echo "the image carries no clock but '$epoch'" >&2; exit 1 ;; esac
"${podman[@]}" run --rm --network none --mount "type=bind,src=$PWD/os/tests,dst=/repo/os/tests,ro" \
  --entrypoint bash "$image" /repo/os/tests/image-programs-contract.sh
"${podman[@]}" run --rm --network none --mount "type=bind,src=$PWD/os/scripts,dst=/repo/os/scripts,ro" \
  --env "SOURCE_DATE_EPOCH=$epoch" --entrypoint bash "$image" -c \
  'bash /repo/os/scripts/verify-no-python-runtime.sh && sh /repo/os/scripts/verify-rpm-files.sh && bootc container lint'
'''
needs = ["os-image-x86_64"]
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
timeout_secs = 3600
on = ["dispatch", "idle", "stable"]

# Rootful Podman and the offline fixtures that build with it: a group-relative layer audit, the
# firmware mount's layer-cache reuse, external-asset build contexts, a named public trust context,
# the production trust-input copy's filesystem contract, and the failed-RUN BuildKit cache. Every
# one builds only from scratch or from the pinned images the check pulls, and keeps its images in
# private storage.
[[check]]
name = "disposable-root-podman"
# Pulls the fixtures' pinned images from docker.io, which no fixed host list covers.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
dnf install -y --setopt=install_weak_deps=False podman >/dev/null
podman=(podman --cgroup-manager=cgroupfs --events-backend=file)
busybox=docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
buildkit=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
coreutils=docker.io/library/debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
"${podman[@]}" pull -q "$busybox" >/dev/null
"${podman[@]}" pull -q "$buildkit" >/dev/null
"${podman[@]}" pull -q "$coreutils" >/dev/null
python3 os/tests/rootfs_firmware_cache.py
python3 os/tests/container_build_context.py
bash os/tests/named_public_trust_context.sh podman
python3 os/tests/prove_kernel_failure_cache_local.py --output /target/kernel-failure-cache-local
tools=$("${podman[@]}" image inspect --format '{{.Id}}' "$coreutils")
python3 os/tests/trust_input_copy_equivalence.py --tools-image "$tools"
'''
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
timeout_secs = 3600
on = ["idle", "stable", "dispatch"]

# The internal bundle export on real loop devices, vfat and Btrfs: the installer's export path is
# only honest when a fresh mount reads back what it wrote, so it runs as root in a micro-VM.
[[check]]
name = "loop-device-native"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
dnf install -y --setopt=install_weak_deps=False dosfstools mtools btrfs-progs qemu-img util-linux >/dev/null
bash os/tests/internal_bundle_export.sh
'''
requires = ["arch=x86_64", "disk-100g", "/dev/loop-control"]
isolation = "vm"
timeout_secs = 3600
on = ["idle", "stable", "dispatch"]

# The signing spool with the real signer: real EFI and PCR signatures from the built tilo-crypto,
# root-owned where the spool's own trust check requires it, with every key in a private tree.
[[check]]
name = "signing-spool-native"
# dnf installs from Fedora's mirrors and cargo fetches crates from the registry, no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
cargo build --locked -p tilo-crypto --bin tilo-crypto
install -m 0755 -o root -g root "$CARGO_TARGET_DIR/debug/tilo-crypto" /usr/local/bin/tilo-crypto
python3 os/tests/test_signing_spool.py
'''
isolation = "vm"
timeout_secs = 3600
on = ["idle", "stable", "dispatch"]

# The installed session's first login as an ordinary user, then the host identity minted, verified
# and re-provisioned through the production provisioning entrypoint.
[[check]]
name = "installed-host-startup"
# dnf installs from Fedora's mirrors, which are no fixed host list; the build fetches crates.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
dnf install -y --setopt=install_weak_deps=False shadow-utils util-linux >/dev/null
cargo build --locked -p tilo-session --bins
TILO_SESSION_BIN="$CARGO_TARGET_DIR/debug/tilo-session" bash dist/ci/test-installed-host-startup.sh
'''
isolation = "vm"
timeout_secs = 3600
on = ["dispatch"]

# The Kbuild contracts in the builder's own userspace: a checkpointed kernel restore over a real
# make run and the CN20K object selection through Kbuild.
[[check]]
name = "os-build-contracts"
requires = ["arch=any"]
run = '''set -eu
python3 os/tests/test_kernel_checkpoint_make.py
python3 os/kernel/tests/test-cn20k-debugfs.py
'''

# The installed material audit against a real squashfs image it builds itself, which the ci-fast
# image cannot make.
[[check]]
name = "installed-material-audit"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = '''set -eu
dnf install -y --setopt=install_weak_deps=False squashfs-tools >/dev/null
python3 os/tests/installed_material_audit.py
'''
requires = ["arch=x86_64"]
isolation = "vm"
on = ["idle", "stable", "dispatch"]
