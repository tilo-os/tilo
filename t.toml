# The suite reads every blob and tests release contracts against HEAD. Its
# fixtures create repositories and scratch files beside the sources, so use
# t's real Git checkout and a private writable view, not an inherited Git index.
[[check]]
name = "policy"
requires = ["arch=any"]
run = "bash tools/policy/run.sh"
git = true
writable_sources = true
inputs = ["**"]

# Live Miracast capture, end to end: tilo-projector's Miracast session asks a simulated
# ScreenCast portal on a private bus for the screen, captures the headless PipeWire screen it
# grants through pipewiresrc, encodes H.264 and AAC from the headless PulseAudio, and streams
# MPEG-TS over RTP to the miracast crate's strict test sink (crates/system/projector/src/
# session/miracast/tests.rs). It runs in the builder this tree defines, which carries
# PipeWire and WirePlumber; the `test` family skips it on a builder without them.
[[check]]
name = "miracast-capture"
image = { check = "image-ci-builder-x86_64", path = "/target/publish/ci-builder/x86_64/image.oci.tar" }
run = "CARGO_TARGET_DIR=${TMPDIR:-/tmp}/miracast-capture-target bash tools/test-env.sh cargo test --locked -p tilo-projector --bin tilo-projector session::miracast"
inputs = ["tools/test-env.sh", "tools/with-test-environment.sh", "tools/with-headless-audio.sh"]
cargo_packages = ["tilo-projector"]
env = { TILO_REQUIRE_SCREEN_CAPTURE = "1", TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1" }
requires = ["arch=x86_64"]
cost = "minutes"

# The generated blocks of this file match what they are generated from (suites.toml,
# products.toml, .config/, the workspace's manifests and the Rust files suites.toml lists
# as reading outside their package). policy checks this too, but takes many minutes and
# reruns for any change; this answers in seconds.
[[check]]
name = "t-toml"
requires = ["arch=any"]
run = "python3 tools/ci/t_toml.py check"
inputs = ["t.toml", "tools/ci/**", ".config/**", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "**/*.rs"]


# ---------------------------------------------------------------------------
# Fast quality (.forgejo/workflows/lint.yml), in whole-tree form.
#
# The diff-based lint.yml gates stay in the Git hooks, which see the change:
# changed-file rustfmt and Rust allow reasons (.githooks/pre-commit), commit
# messages and blob policy (tools/policy/check_commit_policy.py before a
# push). The tapp, runtime and web size-budget ratchets compare budget files
# with a base commit's and need Git history, which a t check does not have.

[[check]]
name = "fmt"
requires = ["arch=any"]
run = "cargo fmt --check"
# t applies this on main by itself when fmt fails there; `t fix fmt` applies it here.
fix = "cargo fmt"
inputs = ["**/*.rs", "rustfmt.toml", "Cargo.toml", "**/Cargo.toml", "Cargo.lock"]

# cargo-hakari ships in ci-fast, the image lint.yml runs in, not in the builder.
# ci-fast's rustup home has no update-hashes directory, and rustup's proxies
# fail creating it on a read-only root, so its checks put the toolchain's own
# binaries first on PATH.
[[check]]
name = "hakari"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
run = """
if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
  echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (DEVELOPMENT.md, Dependency features)." >&2
  exit 1
fi
cargo hakari verify
"""
inputs = ["Cargo.toml", "**/Cargo.toml", "Cargo.lock", ".config/hakari.toml", "crates/workspace-hack/**"]

[[check]]
name = "deny"
requires = ["arch=any"]
run = "cargo deny --workspace check --hide-inclusion-graph"
inputs = ["Cargo.toml", "**/Cargo.toml", "Cargo.lock"]

# The whole-tree form of lint.yml's changed-crate scan.
[[check]]
name = "machete"
requires = ["arch=any"]
run = "bash tools/ci/t-git-index.sh bash tools/ci/check-unused-dependencies.sh"
inputs = ["**/Cargo.toml", "**/*.rs", ".gitignore", "tools/ci/check-unused-dependencies.sh", "tools/ci/t-git-index.sh"]

# lint.yml's diff-based gates, against the commit the tree branched from (on main,
# the previous commit): reasons for new Rust `allow`s, commit messages and new
# blob contents, and the tapp and runtime size budgets, which may only shrink
# unless a raise file says why.
[[check]]
name = "changes"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
git = true
run = """
base=$(git rev-parse main)
if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^); fi
python3 tools/ci/check_changed_rust_allows.py "$base"
python3 tools/policy/check_commit_policy.py "$base"
python3 tools/perf/tapp_size_ratchet.py check-budget --base "$base"
python3 tools/perf/runtime_size_ratchet.py check-budget --base "$base"
"""

[[check]]
name = "app-lints"
requires = ["arch=any"]
run = "cargo run --locked --quiet -p tilo-app-cli --bin tilo-app -- check --lint --all"
# BEGIN generated by tools/ci/t_toml.py: app-lints-reads
cargo_packages = ["tilo-app-cli"]
cargo_dev_dependencies = false
inputs = ["Cargo.toml", "apps/**", "examples/apps/**", ".cargo/config.toml", "Cargo.lock", "apps/browser/tilo-app.toml", "apps/calculator/tilo-app.toml", "crates/collab/collab-types/tests/net_host_vectors.txt", "crates/dev/tilo-app-cli/src/included.rs", "crates/packaging/launcher/tests/fixtures/seccomp/tilo-default.x86_64.bpf.hex", "crates/packaging/launcher/tests/fixtures/seccomp/tilo-jit.x86_64.bpf.hex", "crates/packaging/launcher/tests/fixtures/seccomp/tilo-web-engine.x86_64.bpf.hex", "crates/sdk/tilo-app/Cargo.toml", "crates/sdk/ui-core/assets/fonts/**", "crates/system/cloud-source-gdrive/tests/fixtures/docx.rs", "crates/system/cloud-source-gdrive/tests/fixtures/empty.svg", "crates/system/cloud-source-gdrive/tests/fixtures/pptx.rs", "crates/system/cloud-source-gdrive/tests/fixtures/xlsx.rs", "crates/system/fs/tests/cloud_mount/import.rs", "crates/system/fs/tests/cloud_mount/import_transition.rs", "crates/system/fs/tests/cloud_mount/native.rs", "docs/developers/tasks/actions.md", "docs/developers/tasks/collaborate.md", "docs/developers/tasks/network.md", "docs/developers/tasks/permissions.md", "docs/developers/tasks/publish.md", "docs/developers/tasks/start.md", "docs/developers/tasks/verify.md", "examples/apps/shared-checklist/tests/app.rs", "os/usr/libexec/tilo-session", "rust-toolchain.toml", "tools/font-catalog.py", "tools/policy/app_capability_usage.toml", "tools/policy/app_portability_rules.toml", "tools/test-assets-build.rs"]
# END generated
cost = "minutes"
env = { CARGO_INCREMENTAL = "0", CARGO_PROFILE_DEV_DEBUG = "0" }

# ---------------------------------------------------------------------------
# Affected packages (.forgejo/workflows/check.yml), beyond the families above.
#
# The package families run every package whose inputs changed, which is what the
# affected-package shards select; a package that reads files outside its directory
# names them in tools/ci/suites.toml and gets them as package_inputs above, which
# covers the scoped reader tests (tools/ci/run_scoped_tests.py) by running the
# package's whole suite.

[[check]]
name = "workspace-layout"
requires = ["arch=any"]
run = """
bash tools/ci/t-git-index.sh ./scripts/check-workspace-complete.sh
bash tools/ci/t-git-index.sh python3 tools/policy/check_repository_layout.py
"""

# Shell, image-configuration and workflow invariants, in ci-fast, which carries
# their fixture tools. Several write to /var/tmp (installer and publication
# fixtures, rpmbuild's scratch directory), which is the check's own.
[[check]]
name = "security"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
# The Wine producer's static i686 probe needs the 32-bit syscall ABI, which the
# job sandbox refuses on x86_64; a micro-VM has it.
isolation = "vm"
run = "bash tools/run-security-boundary-invariants.sh"
cost = "minutes"

# Release trust as installed systems apply it: the committed operational certificates still
# chain to the release root, certify the KMS keys CI signs with and have time left
# (tools/signing/release_trust.py), and skopeo, the verifier bootc updates through, accepts the
# shipped policy's release chain and refuses expired, foreign, revoked and unlogged signatures
# (os/tests/release_trust_chain_native.py). Root in a micro-VM step, for the packages it installs.
[[check]]
name = "release-trust"
run = """
dnf install -y --setopt=install_weak_deps=False skopeo openssl >/dev/null
python3 tools/signing/release_trust.py check-committed
python3 os/tests/release_trust_chain_native.py
"""
inputs = ["keys/**", "tools/signing/**", "os/etc/containers/**", "os/tests/release_trust_chain_native.py"]
requires = ["arch=x86_64"]
isolation = "vm"
cost = "minutes"

