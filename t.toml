[[ $DEV_UKI_BOOT == false || $TILO_VM_ARCH == x86_64 ]] || exit 2
[[ $TILO_VM_ARCH == aarch64 || ( $CPU_VARIANT == host && $CAPTURE_FAULT_PC == false ) ]] || exit 2
[[ $OVERRIDE_SESSION_WRAPPER == true || $OVERRIDE_SESSION_WRAPPER == false ]] || exit 2
[[ $SHARED_DISK_ESP == true || $SHARED_DISK_ESP == false ]] || exit 2
[[ $SHARED_DISK_ESP == false || -n $UPGRADE_IMAGE ]] || {
  echo '::error::shared_disk_esp checks the bootc of upgrade_image; name one'
