# The workspace's cargo metadata sealed to this exact committed source, for
# offline affected-package selection (AGENTS.md): `t outputs source-metadata` in
# a clean checkout of a pushed commit writes target/ci/current-source-metadata.json.
[[check]]
name = "source-metadata"
# `cargo metadata --no-deps` lists every target's dependencies, whatever node runs it.
requires = ["arch=any"]
on = ["dispatch"]
run = """
mkdir -p "$CARGO_TARGET_DIR/ci"
cargo metadata --locked --no-deps --format-version 1 > "$TMPDIR/metadata.json"
