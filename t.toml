# The local model catalog (crates/agent/local-model-service/RELEASE.md), published by hand from
# stable: `t dispatch publish-model-catalog --ref stable` builds the compiler, signs the reviewed
# catalog (which must reproduce the checked-in one) and uploads it; `t dispatch
# review-speech-catalog --ref stable` signs the speech candidate for review (`t outputs
# review-speech-catalog`). The compiler is built without credentials; only the signing checks
# hold TILO_MODEL_CATALOG_SIGNING_KEY and only the publishing one the package token. Forgejo's
# generic package registry does not take t's identity tokens, so that one is a stored secret.
