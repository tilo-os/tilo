# crates/dev/workspace-unify is what tools/ci/workspace_unify.py writes for x86_64. The script
# resolves in a copy of the tree, since cargo writes beside it.
[[check]]
name = "workspace-unify-x86_64"
requires = ["arch=x86_64"]
run = "python3 tools/ci/workspace_unify.py --check"
fix = "python3 tools/ci/workspace_unify.py --write"

# With crates/dev/workspace-unify, no member builds as another unit on x86_64 whichever selection
# of packages pulls it in. It plans every selection, so it runs on main; workspace-unify-x86_64
# keeps the anchor current before push. Run in a copy: cargo writes beside the tree.
[[check]]
name = "member-units-x86_64"
requires = ["arch=x86_64"]
run = "cp -a /src /tmp/tree && cd /tmp/tree && python3 tools/ci/member_units.py"
on = ["main"]

# crates/dev/workspace-unify is what tools/ci/workspace_unify.py writes for aarch64. The script
# resolves in a copy of the tree, since cargo writes beside it.
[[check]]
name = "workspace-unify-aarch64"
requires = ["arch=aarch64"]
run = "python3 tools/ci/workspace_unify.py --check"
fix = "python3 tools/ci/workspace_unify.py --write"

# With crates/dev/workspace-unify, no member builds as another unit on aarch64 whichever selection
# of packages pulls it in. It plans every selection, so it runs on main; workspace-unify-aarch64
# keeps the anchor current before push. Run in a copy: cargo writes beside the tree.
[[check]]
name = "member-units-aarch64"
requires = ["arch=aarch64"]
run = "cp -a /src /tmp/tree && cd /tmp/tree && python3 tools/ci/member_units.py"
on = ["main"]

# Terminal in a nested session (dist/dev/nested-terminal-check.py): the session starts the ush
# supervisor as its user unit does, with the env-runtime in its system store, and Terminal opens
# and shows the output of a command it runs in its shell.
[[check]]
name = "nested-terminal"
run = "bash tools/test-env.sh python3 -I dist/dev/nested-terminal-check.py --out /target/nested-terminal"
env = { TILO_NESTED_SESSION_BUILD = "/target/nested-session" }
needs = ["nested-session"]
outputs = ["/target/nested-terminal/**"]
requires = ["arch=x86_64"]
git = true
# Terminal's shell runs in a guest of its own (bwrap, user namespaces), which the job sandbox
# does not give; a micro-VM does.
isolation = "vm"
timeout_secs = 1800
on = ["idle"]
default = false

