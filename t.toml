[[check]]
name = "web-node-tests"
egress = { to = ["nodejs.org:443"], pinned = true }
run = "set -euo pipefail\nversion=24.22.3\ntarball=node-v$version-linux-x64\ncurl -sSfL -o /tmp/node.tar.xz \"https://nodejs.org/dist/v$version/$tarball.tar.xz\"\nprintf '%s  %s\\n' 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb /tmp/node.tar.xz | sha256sum -c -\ntar --no-same-owner -xJf /tmp/node.tar.xz -C /tmp\nexport PATH=/tmp/$tarball/bin:$PATH\nnode --version\nnode --test crates/core/tilo-browser-runtime/web/pairing.test.mjs crates/core/tilo-browser-runtime/web/device-key.test.mjs crates/core/tilo-browser-runtime/web/identity.test.mjs crates/core/tilo-runtime/src/device/keep/web/page/page.test.mjs\n"
requires = ["arch=x86_64"]

# JavaScript that needs real WebCodecs and media in a browser: the editor muxes and plays back
# media, and a page decodes a call's camera stream where its tile stands, in the image's Chromium
# (CHROME), serving the page on loopback only.
[[check]]
name = "web-page-tests"
run = "node --test crates/engines/tilo-media/web/tilo-media-edit.test.mjs crates/core/tilo-browser-runtime/web/voice-video-page.test.mjs"
requires = ["arch=x86_64"]
timeout_secs = 900

# Every menu of a page in the image's Chromium (CHROME), in both themes and set in the faces the
# page serves: no label is cut short once its menu has arrived. The page lays a menu's rows out
# itself, so only a browser measures them in the face it draws (crates/ui/ui-app/examples/
# page_menus.rs writes the page, tools/web/page-menus.mjs opens its menus). The web cuts come from
# the font-seed check's pins, so nothing reaches the network for a font.
[[check]]
name = "page-menus"
on = ["idle", "stable"]
run = "set -euo pipefail\nout=/tmp/page-menus\nrm -rf \"$out\"\ncargo run --locked -p tilo-ui-app --example page-menus -- \"$out\"\npython3 -I tools/font-catalog.py prepare crates/ui/ui-core/assets/fonts \"$out/catalog\" --scope web --offline\nmkdir -p \"$out/fonts\"\nfind \"$out/catalog\" -name '*.woff2' -exec cp {} \"$out/fonts/\" ';'\nnode tools/web/page-menus.mjs \"$out\"\n"
needs = ["font-seed"]
env = { TILO_FONT_IMAGE_SEED = "/target/font-seed" }
requires = ["arch=x86_64"]
timeout_secs = 1800

# The page's peer store over IndexedDB in the image's Chromium (CHROME), reloaded as a person
# reloads the page, offline, hidden and left: the runtime built for the page, bound with the
# image's wasm-bindgen, its page served on loopback only.
[[check]]
name = "web-peer-store"
run = "cargo build --locked --lib -p tilo-browser-runtime --target wasm32-unknown-unknown --profile wasm-dev\nnode --test crates/core/tilo-browser-runtime/web/peer-files-page.test.mjs\n"
requires = ["arch=x86_64"]
timeout_secs = 1800

[[check]]
name = "chromium-host"
# The pinned CEF archive (SHA-256 in scripts/browser/cef-lock.json), and the build scripts' pinned assets.
egress = { to = ["code.tilo.so:443", "cef-builds.spotifycdn.com:443"], pinned = true }
run = "bash tools/ci/ensure-browser-dependencies.sh\ncommand -v cmake >/dev/null || dnf install -y cmake\npython3 scripts/browser/build-host.py --jobs 8\nctest --test-dir target/chromium-build --output-on-failure\n# Chromium refuses root, and the host never turns its sandbox off: the page tests run as a user.\nchmod -R a+rX target/chromium crates/engines/chromium-host/chromium/tests crates/engines/chromium-host/chromium/src crates/engines/chromium-host/assets/extension-manager crates/engines/chromium-host/src/extension_toolbar.rs\nmkdir -p -m 1777 /tmp/host-test\n# Every suite runs, so one that fails does not hide the ones after it; the check\n# fails at the end and names each suite that did.\nfailed=\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/document_size.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  document_size\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/privacy_defaults.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  privacy_defaults\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/pointer_input.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  pointer_input\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/ime_composition.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  ime_composition\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_popups.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_popups\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/tabs.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  tabs\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/navigation.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  navigation\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/first_page_history.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  first_page_history\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/native_regressions.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  native_regressions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_dialogs.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_dialogs\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/download_lifetime.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  download_lifetime\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/http_auth.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  http_auth\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_clipboard.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_clipboard\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/context_menu.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  context_menu\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/adblock_extension.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  adblock_extension\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/extensions.py target/chromium/tilo-chromium-host Extensions.test_mv3_worker_storage_content_and_action RuntimeExtensions.test_load_unload_and_denied_methods; } || failed=\"$failed\\n  extensions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/extension_toggle.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  extension_toggle\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/extension_tabs.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  extension_tabs\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/site_extensions.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  site_extensions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_actions.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  page_actions\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_holds.py target/chromium/tilo-chromium-host; } || failed=\"$failed\n  page_holds\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/sealed_documents.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  sealed_documents\"\n# Camera and microphone questions only: on this node Chromium refuses notifications and\n# location without asking, so the rest of capabilities.py runs against a macOS host.\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/capabilities.py target/chromium/tilo-chromium-host Capabilities.test_fake_camera_microphone_policy_grant_revoke_and_new_request Capabilities.test_refused_camera_is_kept_until_the_site_may_ask_again; } || failed=\"$failed\\n  capabilities\"\n# The same page again with the engine started the way a Browser launch starts it: its\n# environment and the seccomp filters its sandbox stacks (launcher example web_engine_sandbox).\ncargo build --locked -p launcher --example web_engine_sandbox\ninstall -m 0755 \"${CARGO_TARGET_DIR:-target}/debug/examples/web_engine_sandbox\" /tmp/host-test/web_engine_sandbox\nprintf '#!/bin/sh\\nexec /tmp/host-test/web_engine_sandbox %s/target/chromium/tilo-chromium-host \"$@\"\\n' \"$PWD\" > /tmp/host-test/sandboxed-host\nchmod a+rx /tmp/host-test/sandboxed-host\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/document_size.py /tmp/host-test/sandboxed-host; } || failed=\"$failed\\n  document_size (as a Browser launch starts the engine)\"\n# Frames reach the app through the memory it hands the sandboxed engine.\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/frame_transport.py --transport memory /tmp/host-test/sandboxed-host; } || failed=\"$failed\\n  frame_transport (as a Browser launch starts the engine)\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/frame_transport.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  frame_transport\"\n{ HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/frame_damage.py target/chromium/tilo-chromium-host; } || failed=\"$failed\\n  frame_damage\"\n# What a watched share asks of a real page: captured as Browser captures it, drawn by the web view, handed over whole (toolkit example page-share-probe).\n{ cargo build --locked -p tilo-ui --example page-share-probe && install -m 0755 \"${CARGO_TARGET_DIR:-target}/debug/examples/page-share-probe\" /tmp/host-test/page-share-probe && HOME=/tmp/host-test TMPDIR=/tmp/host-test unshare --user --map-user=1000 --map-group=1000 -- python3 crates/engines/chromium-host/chromium/tests/page_share.py target/chromium/tilo-chromium-host /tmp/host-test/page-share-probe; } || failed=\"$failed\\n  page_share\"\n\n[ -z \"$failed\" ] || { printf 'engine suites that failed:%b\\n' \"$failed\" >&2; exit 1; }"
requires = ["arch=x86_64"]
isolation = "nested"
outputs = ["target/chromium/**"]
timeout_secs = 5400
default = false

# The engine suites tools/ci/chromium-host-repeat.plan names, each as many times as the plan says,
# on a host built as chromium-host builds it: for a failure that shows once in many runs of the
# whole check, which a `--test` filter does not narrow. Run when asked and never with a change.
[[check]]
name = "chromium-host-repeat"
# The pinned CEF archive (SHA-256 in scripts/browser/cef-lock.json), and the build scripts' pinned assets.
egress = { to = ["code.tilo.so:443", "cef-builds.spotifycdn.com:443"], pinned = true }
run = "bash tools/ci/chromium-host-repeat.sh"
requires = ["arch=x86_64"]
isolation = "nested"
timeout_secs = 5400
default = false

[[check]]
name = "pins"
# Verifies digest-pinned kernel images' signatures: the registry, and Sigstore's log and trust root.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443", "tuf-repo-cdn.sigstore.dev:443", "rekor.sigstore.dev:443"], pinned = true }
run = "export RUNNER_TEMP=$TMPDIR GITHUB_PATH=$TMPDIR/github-path\nTILO_GITHUB_ASSET_CACHE=/target/signing-tools TILO_ASSET_OFFLINE=1 bash os/dev/install-cached-cosign.sh\nexport PATH=$(cat \"$GITHUB_PATH\"):$PATH\nbash os/dev/verify-snapshot-pins.sh os/kernel-snapshot.env\n"
needs = ["signing-tools"]

[[check]]
name = "vendored"
requires = ["arch=any"]
# Resolves against crates.io.
egress = { to = ["index.crates.io:443", "static.crates.io:443"] }
run = "bash tools/ci/test-vendored-crates.sh"
# Tests vendored crates with their dev-dependencies resolved afresh, beyond the root lockfile,
# so it needs cargo's network; t turns it off where it hands a job the state's crates.
env = { CARGO_NET_OFFLINE = "false" }

[[check]]
name = "example-scenarios"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/example-scenarios.sh -p tilo-app-builder"
env = { TILO_REQUIRE_GPU = "1" }
on = ["dispatch", "idle", "stable"]
heavy = true

[[check]]
name = "certify"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "cargo run --locked -p tilolang-cli --bin tilolang -- certify --workspace"
env = { TILO_REQUIRE_GPU = "1", TILO_CERTIFY_SURFACES = "/target/certify/surfaces" }
outputs = ["/target/certify/surfaces/**"]
on = ["schedule:0 3 * * *", "dispatch"]
heavy = true

# The SDKs' types and the API's OpenAPI description, written from the tree by `tilo sdk gen`
# (tools/ci/sdk-gen.sh). They are built, never committed: the SDKs' suites, their release and the
# reference pages read them from here, in an image with no Rust toolchain.
[[check]]
name = "sdk-gen"
requires = ["arch=any"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/sdk-gen.sh write /target/sdk-gen"
outputs = ["/target/sdk-gen/**"]
default = false

# The component catalogue, crates/ui/ui-graph/components.json: the toolkit's widgets described as
# data, which tilo-view and tilolang's `ui` package are built from. The toolkit's own test fails
# while it is stale; this check names the same comparison so `t fix ui-graph` writes the file from
# the tree, run detached and kept per tree. The fix writes the generator's output beside the file
# first, so a generator that fails to build or run leaves the committed file whole.
[[check]]
name = "ui-graph"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "cargo run --locked -q -p tilo-app-window --example component-catalogue > \"$TMPDIR/components.json\"\ncmp -s \"$TMPDIR/components.json\" crates/ui/ui-graph/components.json || { echo 'crates/ui/ui-graph/components.json is stale: t fix ui-graph writes it'; exit 1; }\n"
fix = "cargo run --locked -q -p tilo-app-window --example component-catalogue > \"$TMPDIR/components.json\"\nmv \"$TMPDIR/components.json\" crates/ui/ui-graph/components.json\n"
default = false

# The SDKs' suites need their ecosystems' tools and locked dependencies, which no other check's
# image carries: uv with the Python SDK's environment from sdk/python/uv.lock, bun with the
# TypeScript SDK's packages from sdk/typescript/bun.lock, both baked into the image this check
# builds. They run offline. That image is built for these checks and not published, so the
# dependencies a suite runs against are always the tree's locks: a bump changes the image's
# inputs and with it the image. These run what needs no daemon; sdk-native runs each SDK against
# one.
[[check]]
name = "sdk-python"
on = ["idle", "stable"]
run = "bash tools/ci/sdk-python.sh"
needs = ["sdk-gen"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]

[[check]]
name = "sdk-typescript"
on = ["idle", "stable"]
run = "bash tools/ci/sdk-typescript.sh"
needs = ["sdk-gen"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]

# The Discord bridge's program, in the same image: the plan, the gateway and the bridge's own
# end-to-end tests run under bun from the app's own manifest. Discord's gateway and REST are faked
# at the process boundary, so nothing here reaches the network. The whole app's files are read
# first, so a change to any of them, its record's language or its manifest included, reruns it.
[[check]]
name = "discord-bridge"
on = ["idle", "stable"]
run = "set -eu\nfind apps/tl/discord -type f -exec cat {} + >/dev/null\ncd apps/tl/discord && bun test\n"
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]

# The SDKs' native part (tools/ci/sdk-native.sh): the Python extension and the Node addon, each
# the line wire's client of this computer's daemon, so a program's calls are action frames on the
# daemon's native endpoint, admitted as whoever connects. The first check builds both beside the
# daemon and its harness; the second runs each SDK's end-to-end suite against a daemon the
# harness starts in a profile of its own, in the SDKs' image. It runs in a micro-VM: the daemon
# answers root as the device itself, so the suites run as an ordinary account, which a job's
# root, holding no capability, cannot switch to. The TypeScript suite also installs an app of its
# own that the daemon launches through tilo-launcher, on the bun runtime the build check bakes
# from its pinned release asset, as the script-runtimes check does.
[[check]]
name = "sdk-native-build"
on = ["idle", "stable"]
# Fetches bun's release asset, which GitHub sends on to CDN hosts no fixed list names. Pinned: its
# SHA-256 is in os/external-assets/github-assets.tsv, and the bundle is signed with a throwaway
# key that signs nothing outside this check.
egress = { to = ["0.0.0.0/0", "::/0"], pinned = true }
run = "bash tools/ci/sdk-native.sh build /target/sdk-native"
requires = ["arch=x86_64"]
outputs = ["/target/sdk-native/**"]

[[check]]
name = "sdk-native"
on = ["idle", "stable"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/sdk-native.sh test /target/sdk-native"
needs = ["sdk-native-build", "sdk-gen"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
isolation = "vm"

# The SDKs' release to npm and PyPI, tools/ci/publish/sdks.sh: both packages publish under the
# one name tilo-sdk (on PyPI plain `tilo` belongs to an unrelated project, on npm the @tilo scope
# is not available), and the version is the release tag's, never a number in the tree. The check
# that publishes runs on release tags, with the registries' tokens and nowhere else; a version
# already on a registry is skipped, so re-running a tag finishes a release that stopped halfway
# rather than failing on what it already sent. Dispatched on a branch it publishes nothing:
# sdks.sh refuses any ref but a release tag.
#
# What runs on main is the same build with no token: both packages are built as a tag would
# build them, their artifacts are packed and read back, and the version a tag would write is
# exercised on a stand-in. Only a check that publishes is told the reference it runs for, so this
# one never sees the tag; the publish check builds and checks the tag's version itself before it
# sends anything. A renamed package, a manifest that stops being publishable or an import
# package that falls out of the wheel breaks here, long before a tag does.
[[check]]
name = "publish-sdks-dry-run"
# Installs packages (npm, PyPI, rustup) from hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/sdks.sh check"
needs = ["sdk-gen", "sdk-python", "sdk-typescript"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
on = ["idle", "stable", "dispatch"]

[[check]]
name = "publish-sdks"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/sdks.sh publish"
needs = ["sdk-gen", "sdk-python", "sdk-typescript", "publish-sdks-dry-run"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]
secrets = ["NPM_TOKEN", "PYPI_TOKEN"]

# The builder crates' release to crates.io, tools/sdk/publish_check.py: every workspace crate in
# the closure of the toolkit (tilo-ui), the app SDK (tilo-app) and tilolang (its compiler,
# runtime, lexer, command and browser build), forks included, all at the release tag's version.
# A crate is published once it is marked `publish = true` and everything it builds on is
# publishable too; until then the report says what it waits for. On release tags publish-crates
# publishes every ready crate not yet on crates.io at that version, in dependency order, with the
# registry's token; a crate already there is skipped, so re-running a tag (`t dispatch
# publish-crates --ref tag:vX.Y.Z`) finishes a release that stopped halfway, on crates.io's limit
# for new names or anything else. Dispatched on a branch it publishes nothing: the script refuses
# any ref but a release tag.
#
# What runs on main is everything short of the upload: the report, which fails on a crate marked
# publishable whose own manifest is not (no description, a path dependency without a version...)
# and on a name crates.io holds for another project; then every ready crate packaged at a
# stand-in version, each package's size checked against crates.io's 10 MiB, and each built from
# its package alone, against crates.io and the packages before it, so a file a build needs that
# the package leaves out breaks here, long before a tag does.
[[check]]
name = "publish-crates-dry-run"
# Resolves against crates.io and asks it about names: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "python3 -I tools/sdk/publish_check.py --check-names --verify"
requires = ["arch=x86_64"]
timeout_secs = 5400
on = ["idle", "stable", "dispatch"]

[[check]]
name = "publish-crates"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
# crates.io takes a new name about every ten minutes after a short burst, so a first release of
# many crates outlasts one job: each run publishes until its budget, then the same tag is
# dispatched again (`t dispatch publish-crates --ref tag:vX.Y.Z`) and carries on.
run = "python3 -I tools/sdk/publish_check.py --publish --budget 6600"
timeout_secs = 7200
needs = ["publish-crates-dry-run"]
requires = ["arch=x86_64"]
cache = false
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]
secrets = ["CARGO_REGISTRY_TOKEN"]

# Programs outside Tilo built on the published crates alone (tools/sdk/published_crates_proof.py):
# each guide's program (docs/tilolang/embedding.md: compile a tilolang package, run an action,
# read the resource, build the view) is written into a new project that depends on the crates
# by version, with no patch and no path, built offline against a local registry of the crates
# packaged here and what they resolve to on crates.io, and run; its output must be what the
# guide shows. The `tilolang` command is installed from its package the same way, into a
# directory outside the repository, and there starts an app (`tilolang new`), checks and builds
# it, and checks and builds a package copied out of apps/tl: no checkout is anywhere around it.
[[check]]
name = "published-crates-proof"
# Packaging and the registry resolve against crates.io: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "python3 -I tools/sdk/published_crates_proof.py"
requires = ["arch=x86_64"]
# `tilolang check` reads the new app's public surface in a network namespace of its own, as
# app-surfaces does: a user namespace the job's own sandbox gives only nested.
isolation = "nested"
timeout_secs = 7200
on = ["dispatch", "idle", "stable"]

# The same programs and the same installed `tilolang`, once a release is out, against crates.io
# itself: nothing is packaged and no registry stands in, so each resolves the guides' version
# online as a stranger's machine does. Run by name after publish-crates has carried a release
# all the way (`t test published-crates-live`); before that the crates it asks for are missing.
[[check]]
name = "published-crates-live"
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "python3 -I tools/sdk/published_crates_proof.py --crates-io"
requires = ["arch=x86_64"]
isolation = "nested"
timeout_secs = 7200
cache = false
on = ["dispatch"]

# Each builder crate from crates.io alone, in an empty project, with its default features
# (tools/sdk/standalone_crates.sh): what a person who adds just that crate builds, where the
# workspace's feature unification cannot hide a default build that names an optional crate.
# Dispatched once a release is out; `--input RELEASE=vX.Y.Z` for another release.
[[check]]
name = "published-crates-standalone"
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/sdk/standalone_crates.sh"
requires = ["arch=x86_64"]
timeout_secs = 7200
cache = false
on = ["dispatch"]
dispatch_inputs = { RELEASE = "" }

# tilolang as a person gets it, on a stock Fedora and a stock Debian with nothing of Tilo's or
# Rust's: the curl installer, `tilolang new`, `check` without Rust (which says to install it),
# rustup, then `check` and `build`, and the same from `cargo install tilolang-cli` into an empty
# CARGO_HOME (tools/sdk/installer_proof.sh). Dispatched once a release is out; `--input
# RELEASE=vX.Y.Z` proves another release than the one tools/ci/publish/release-version names.
# Each setup adds only what a person adds first: curl and the C compiler Rust links with. It
# also gives root the empty home /var/tmp/home: the sandbox keeps /root read-only, and Cargo
# would read the configuration t keeps in /tmp/.cargo for anything under /tmp.
[[check]]
name = "installer-clean-fedora"
# `tilolang check` reads an app's surface in a user and network namespace of its own, as a stock
# Linux allows; t's nested isolation allows it too.
isolation = "nested"
image = "docker.io/library/fedora@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5"
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/sdk/installer_proof.sh"
setup = { run = "dnf install -y --setopt=install_weak_deps=False curl gcc && dnf clean all && sed -i 's|^root:\\([^:]*:[^:]*:[^:]*:[^:]*\\):/root:|root:\\1:/var/tmp/home:|' /etc/passwd", egress = { to = ["0.0.0.0/0", "::/0"] } }
requires = ["arch=x86_64"]
timeout_secs = 7200
cache = false
on = ["dispatch"]
dispatch_inputs = { RELEASE = "" }

[[check]]
name = "installer-clean-debian"
# `tilolang check` reads an app's surface in a user and network namespace of its own, as a stock
# Linux allows; t's nested isolation allows it too.
isolation = "nested"
image = "docker.io/library/debian@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2"
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/sdk/installer_proof.sh"
setup = { run = "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev && rm -rf /var/lib/apt/lists/* && sed -i 's|^root:\\([^:]*:[^:]*:[^:]*:[^:]*\\):/root:|root:\\1:/var/tmp/home:|' /etc/passwd", egress = { to = ["0.0.0.0/0", "::/0"] } }
requires = ["arch=x86_64"]
timeout_secs = 7200
cache = false
on = ["dispatch"]
dispatch_inputs = { RELEASE = "" }

# tilolang in a browser, as the npm package `tilolang`, tools/ci/publish/tilolang-npm.sh:
# tilolang-web's page module (wasm-bindgen's `web` build) and the startup fonts its windows set
# text in. tilolang-npm builds it in the builder image, which carries wasm-bindgen and the wasm
# target; the SDKs' image, which carries bun, reads it back and publishes it. On release tags
# publish-npm-tilolang publishes it at the tag's version with the token the SDKs publish with,
# skipping a version npm already has; on main the dry run packs it as a tag would, at a stand-in.
[[check]]
name = "tilolang-npm"
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "bash tools/ci/publish/tilolang-npm.sh build /target/publish/tilolang-npm"
requires = ["arch=x86_64"]
outputs = ["/target/publish/tilolang-npm/**"]
default = false

[[check]]
name = "publish-npm-tilolang-dry-run"
run = "bash tools/ci/publish/tilolang-npm.sh check /target/publish/tilolang-npm"
needs = ["tilolang-npm"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
on = ["idle", "stable", "dispatch"]

[[check]]
name = "publish-npm-tilolang"
# Publishes with a stored token, to hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/tilolang-npm.sh publish /target/publish/tilolang-npm"
needs = ["tilolang-npm", "publish-npm-tilolang-dry-run"]
image = { check = "image-ci-sdk", path = "/target/publish/ci-sdk/image.oci.tar" }
requires = ["arch=x86_64"]
cache = false
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]
secrets = ["NPM_TOKEN"]

# The SDKs' native halves are designed, not built: sdk/python/native (PyO3, wheels of the same
# tilo-sdk project) and sdk/typescript/native (napi-rs, the tilo-sdk-native packages) do not
# exist yet, and nothing here publishes something a tree does not build. The step that will, with
# its names and its exact commands, is the native part of the SDKs' section of
# docs/publishing.md; it joins this chain, beside publish-sdks, when those crates land.

