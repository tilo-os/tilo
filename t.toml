[[check]]
name = "sign-rpms-{arch}"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/rpms /target/publish/rpms/{arch}\nbash tools/ci/publish/oci-attest.sh registry.tilo.so/tilo/rpms /target/publish/rpms/{arch}\n"
needs = ["image-rpms-{arch}", "provenance-rpms-{arch}", "signing-tools"]
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com", TILO_SIGN_TLOG = "1" }
outputs = ["/target/publish/rpms/{arch}/payload.json", "/target/publish/rpms/{arch}/signature", "/target/publish/rpms/{arch}/dry-run.pub", "/target/publish/rpms/{arch}/bundle.json", "/target/publish/rpms/{arch}/attestation.json", "/target/publish/rpms/{arch}/attestation.bundle.json"]
# A release tag signs and publishes this architecture's package set, so the images it publishes
# install from a set that is published and signed. A dispatch on a release tag of what installs
# from the set (`t dispatch rpm-snapshot-aarch64 --ref tag:vX.Y.Z --publish`) finishes a release
# whose own run stopped here, and on an arm64 node publishes the other architecture's set; the
# release key's role trusts v* tags only, so a dispatch anywhere else gets no signature.
on = ["tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]
id_token = ["sts.amazonaws.com"]
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "publish-rpms-{arch}"
# Takes an identity token from t (at its deployment's own address) to registries and AWS STS/KMS: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/oci-publish.sh release registry.tilo.so/tilo/rpms /target/publish/rpms/{arch} 'once:set-{fingerprint}-{arch}'\n"
# provenance-rpms-{arch} is what writes the fingerprint the tag names ({fingerprint}): a check is
# given the outputs of the checks it needs, and only of those.
needs = ["image-rpms-{arch}", "provenance-rpms-{arch}", "sign-rpms-{arch}", "signing-tools"]
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
outputs = ["/target/publish/rpms/{arch}/receipt.json"]
# Ahead of the images of the same run: rpm-snapshot-{arch} names publish-rpms-{arch} as an
# optional need, so on a release tag the set is published before anything builds from it, and the
# image of that tag installs from the published set rather than from the run's unsigned one.
# `once:` tags never move: an architecture's set is published once per package set.
# Only on a release tag, a dispatch there included (a tag trigger applies to any run of the tag):
# an optional need applies wherever its `on` matches, and in a dispatch on a branch this would
# apply without its signature (the release key signs v* tags only), so every OS build a branch
# dispatch asked for stopped at rpm-snapshot-{arch} with nothing built.
on = ["tag:v[0-9]*.[0-9]*.[0-9]*"]
id_token = ["registry.tilo.so"]
[check.matrix]
arch = ["x86_64", "aarch64"]

