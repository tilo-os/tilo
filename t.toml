# ---------------------------------------------------------------------------
# The performance run, on release candidates and when dispatched: one check
# per KPI group, each writing its records to /target/perf/<group>/, perf-scheduled,
# which compares them with the store, and perf-publish, which compares them again and
# writes them to the store where the run holds TILO_PACKAGES_TOKEN: the server's secret
# config names the references that get it (`t dispatch perf-publish --publish --ref main`).
# A group is keyed by the packages it builds and measures and the scripts it runs: t keeps its
# result, records included, while those are unchanged, so a candidate whose change doesn't
# reach a group compares that group's earlier records, which the store already judged (as
# compare.py keeps them). The footprint groups measure what the registry serves, which changes
# without the tree, so they always run. One group runs alone with `t test perf-render`
# (browser and stream measure a commit's desktop bundle: `t dispatch perf-stream --ref
# <branch>`); the whole run with `t dispatch perf-scheduled`, and recorded with `t dispatch
# perf-publish --publish` (inputs: accept, synthetic_series, synthetic_factor).
#
# None of them is `heavy`: a release candidate's verification gates on what works, and these
# report. They still run when stable moves (`on`), and tools/ci/stable_cut.py runs them on a
# candidate beside its heavy checks without waiting on them, since t's shared, GPU-less workers
# measure the worker as much as the commit. They gate again once they run on dedicated or GPU
# runners.

