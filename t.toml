# The release path rehearsed with no credentials: the boot chain is signed with throwaway EFI and
# PCR keys and the image with a throwaway release key, then published into a local OCI layout as a
# release tag of this tree would, and the published image is verified as its consumers verify it
# (os-release.sh sign-boot's, oci-sign.sh's and oci-publish.sh's dry runs). It reads the tree's
# T_REF as the tag the run pretends to be, so it also runs from a branch.
[[check]]
name = "host-release-rehearsal"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "set -euo pipefail\nwork=/target/host-release-rehearsal\nrm -rf \"$work\"\nmkdir -p \"$work/registry\"\nexport T_REF=tag:v0.0.0 T_COMMIT=$(git rev-parse --verify HEAD)\nexport TILO_PUBLISH_DRY_RUN=$work/registry TILO_BOOT_SIGNER_DRY_RUN=$work/boot-keys TILO_BOOT_SIGNING_DRY_RUN=1\nbash tools/ci/publish/os-release.sh sign-boot /target/publish/host-sealed \"$work/boot-signed\"\nbash tools/ci/publish/host-seal.sh apply /target/publish/host-sealed \"$work/boot-signed\" \"$work/image\"\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/tilo-host \"$work/image\"\nbash tools/ci/publish/oci-attest.sh registry.tilo.so/tilo/tilo-host \"$work/image\"\nbash tools/ci/publish/oci-publish.sh release registry.tilo.so/tilo/tilo-host \"$work/image\" '0.0.0' 'sha-{commit}' 'once:gen{generation}' 'final:latest'\n"
needs = ["seal-host", "test-image-host", "os-assets", "signing-tools", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/host-release-rehearsal/image/receipt.json"]
git = true
on = ["dispatch"]
heavy = true


# The server image proves itself by booting: its boot loader and UKIs signed and sealed with
# throwaway EFI and PCR keys the machine trusts, it installs onto an encrypted disk in a guest of
# its own (this check's micro-VM cannot open a volume), and the machine boots that disk under
# firmware that trusts those keys alone, so only from the signed boot loader and UKI. It serves
# (the hosted-VM service binds its socket, the boot judges itself by the server probe, updates
# stage through the verified path), an update that breaks the server spends its tries and the
# boot loader goes back by itself, and a registry update is verified before it stages. The
# installed machine then seals the disk to itself (a PIN-less keyslot against the signed PCR 11
# prediction and its own PCR 7), reboots with nothing typed, and refuses an image whose signed
# prediction is below the rollback floor the approvals moved. Driven at the serial console,
# which is the only console the image has.
[[check]]
name = "host-assurance-x86_64"
# Fetches from mirrors, registries and release hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/host-assurance.sh"
needs = ["image-host", "host-base", "os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64", "os-assets"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/host-assurance/**"]
evidence = ["/target/host-assurance/**"]
cache = false
git = true
timeout_secs = 10800
on = ["dispatch"]

# The base the stages of the server image's proof start from, built once from a commit of main
# and kept by digest: the image signed and sealed with throwaway keys, installed onto LUKS2, booted
# once and shown to serve, with its update disk, firmware variables, TPM, keys and what the
# registry serves (tools/ci/host-assurance.sh base), as one image. Its log ends with the base's
# commit and image by digest, which tools/ci/host-assurance-base.env takes in a commit of its own,
# so the base moves only when someone dispatches this and commits that file, never with main.
[[check]]
name = "publish-host-assurance-base"
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "set -euo pipefail\nparts=/target/host-assurance-base\nout=/target/publish/host-assurance-base\nbash tools/ci/host-assurance.sh base \"$parts\"\nrpm -q zstd >/dev/null 2>&1 || dnf install -y --setopt=install_weak_deps=False zstd >/dev/null\nrm -rf \"$out\" && mkdir -p \"$out\"\npython3 tools/ci/publish/server-plan-base.py pack \"$out\" \"$T_COMMIT\" disk.qcow2=\"$parts/disk.qcow2\" update.qcow2=\"$parts/update.qcow2\" state=\"$parts/state\" registry=\"$parts/registry\"\nrm -rf \"$parts\"\nbash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-vm \"$out\" 'host-assurance-base-{commit}'\nprintf 'COMMIT=%s\\nIMAGE=registry.tilo.so/tilo/tilo-vm@%s\\n' \"$T_COMMIT\" \"$(cat \"$out/digest\")\" > \"$out/base.env\"\ncat \"$out/base.env\"\nrm -rf \"$out/oci\""
needs = ["image-host", "host-base", "os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64", "os-assets"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/host-assurance-base/receipt.json", "/target/publish/host-assurance-base/base.env"]
git = true
timeout_secs = 10800
on = ["dispatch"]
id_token = ["registry.tilo.so"]
pointers = { host-assurance-base = "/target/publish/host-assurance-base/base.env" }

