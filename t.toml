# The desktop session's Fedora 44 RPMs (desktop-package-amd64) on stock Fedora 44 Cloud under KVM,
# as a person runs them: dnf install, the keyring unlocked, SDDM autologin into tilo.desktop, then
# apps opened through search; the compositor must survive each. Then the way back: the same packages
# upgraded in place with the person's files intact, signing out and signing in to the desktop the
# host had before Tilo, and removing the packages while the login session menu, the packages and the
# login user's files stay as they were (dist/session/README.md, "VM test"). The Cloud image carries
# no other login, so the return check is reported as failed rather than skipped when the VM has no
# previous desktop to sign back in to. In the privileged VM's own Fedora, which takes QEMU from dnf.
# Stable publishes the desktop payload only after it passes. `t dispatch host-session-e2e --input
# apps=so.tilo.notes` opens only those apps (empty: all); `t outputs host-session-e2e` gives the
# report and source.json, each tested RPM's size and SHA-256.
[[check]]
name = "host-session-e2e"
run = '''
dnf --setopt=retries=3 --setopt=install_weak_deps=False install -y \
  qemu-system-x86-core qemu-device-display-virtio-vga qemu-device-display-virtio-gpu \
  qemu-device-display-virtio-gpu-pci qemu-img openssh-clients xorriso python3 curl
python3 os/dev/probe-kvm.py x86_64
work=$(mktemp -d /var/tmp/host-session-e2e.XXXXXX)
rpms=dist/ci-output/fedora-44-amd64
rm -rf target/host-session-e2e && mkdir -p target/host-session-e2e
python3 dist/session/vm-e2e/run.py source --rpms "$rpms" --producer desktop-package-amd64
cp "$rpms/source.json" target/host-session-e2e/source.json
python3 dist/session/vm-e2e/run.py test --rpms "$rpms" --out target/host-session-e2e \
  --work "$work/vm" --image-cache "$work/images" --apps "${T_INPUT_APPS:-}"
'''
needs = ["desktop-package-amd64"]
outputs = ["target/host-session-e2e/**"]
git = true
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 5400
on = ["stable", "dispatch"]
default = false
heavy = true

[check.dispatch_inputs]
