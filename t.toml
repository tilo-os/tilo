# What of the compiled tree the apps are packed from (os/image/compile.sh --apps), as a step t
# never serves from its cache: the payload that needs it is then keyed by these files' bytes, not
# by the compile's key, so a commit that relinks only system programs (a server crate's) keeps the
# payload's key, and the packing of every app is served instead of done again.
[[check]]
name = "os-compiled-apps-{arch}"
run = "bash os/image/compile.sh --apps /target/os/{arch}/compiled /target/os/{arch}/compiled-apps"
needs = ["os-compile-{arch}"]
outputs = ["/target/os/{arch}/compiled-apps/**"]
cache = false
default = false
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "os-compiled-apps-release-{arch}"
