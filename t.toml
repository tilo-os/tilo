on = ["stable", "dispatch"]
id_token = ["sts.amazonaws.com"]

[[check]]
name = "publish-hosted-guest"
run = "bash tools/ci/publish/oci-publish.sh release registry.tilo.so/tilo/hosted-guest /target/publish/hosted-guest/image 'x86_64-{commit}'\nbash tools/ci/publish/hosted-guest.sh pins /target/publish/hosted-guest/image\n"
