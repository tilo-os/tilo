# ---- The frozen RPM package set
#
# One set of RPMs per package set (the direct roots os/Containerfile names and the files that
# shape the snapshot), built natively for each architecture and, per architecture, given its SLSA
# provenance, signed and published by a release tag: `once:set-<fingerprint>-<arch>` names it, so
# the first tag that builds a package set publishes it and every later one finds it there. Each
# architecture's set is published on its own: a machine of one builds, signs and publishes its own
# and needs no node, build or tag of the other, and an architecture publishes later — dispatched on
# a node of its own — without republishing what is already published.
#
# Every image that installs from RPMs (the server, the servers, the environment runtime, the OS
# image) installs from a set the registry holds by digest, so an unchanged tree copies a few
# gigabytes instead of resolving Fedora again (tens of minutes). rpms-source-ARCH resolves this
# tree's package set — the published set where a release tag published one, else the development
# snapshot an earlier job mirrored, else it builds one — and rpms-mirror-ARCH puts that one in
# the registry under `dev-set-<fingerprint>-<arch>`, also written once, so the tag names one
# digest forever. image-rpms-ARCH copies whichever the source found by digest, and
# rpm-snapshot-ARCH resolves the published set, verifies its signature, its provenance for that
# architecture's package set and the image's own architecture, and the build records which set
# it installed from.
#
# Nothing signs a development snapshot: a release tag publishes the signed set under its own tag
# from the same bytes (publish-rpms), and a build that installed from the unsigned one records
# that, which the signing guard (oci-sign.sh, require_published_snapshot) refuses.

# The package set's snapshot, resolved from Fedora once per set: `ref` where the registry holds the
# set already, else the snapshot it built (a package set no tag has published yet), which the mirror
# then takes into the registry.
[[check]]
name = "rpms-resolve-{arch}"
# Pinned: dnf installs from Fedora's mirrors, which are no fixed host list, and the snapshot is
# frozen by its package set: a set's first resolution is the set's snapshot, kept by t and never
# resolved again, as a published tag is written once.
egress = { to = ["0.0.0.0/0", "::/0"], pinned = true }
run = "bash tools/ci/publish/rpms-build.sh {arch} /target/publish/rpms-resolve/{arch} --ref-only"
needs = ["os-assets", "rpm-package-set"]
optional_needs = ["mirror-base"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch={arch}", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/rpms-resolve/{arch}/**"]
timeout_secs = 10800
default = false
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "rpms-source-{arch}"
# Asks the registry, in every run, whether a tag holds the set now (seconds), and else keeps the
# snapshot rpms-resolve-ARCH resolved: a set mirrored or published since is read by its tag. The
# registry's answer changes as sets are published, so it is not pinned; what it leaves — the set's
# reference — is what the checks above it read, and those are served.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"] }
run = "bash tools/ci/publish/rpms-build.sh {arch} /target/publish/rpms-source/{arch} --ref-only --resolved /target/publish/rpms-resolve/{arch}"
needs = ["rpms-resolve-{arch}", "rpm-package-set"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch={arch}"]
# `ref` where the registry holds the set, the snapshot rpms-resolve-ARCH built where no tag does.
outputs = ["/target/publish/rpms-source/{arch}/**"]
timeout_secs = 1800
default = false
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "rpms-mirror-{arch}"
# dnf installs from Fedora's mirrors when the set is not in the registry, which are no fixed host
# list; what it mirrors is what rpms-source-ARCH read. The registry token it writes with is what
# makes it a trusted job's (main, a release tag, a dispatch): a branch reads or builds its own.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/publish/rpms-mirror.sh {arch} /target/publish/rpms-source/{arch} /target/publish/rpms-mirror/{arch}"
needs = ["rpms-source-{arch}"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch={arch}", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/rpms-mirror/{arch}/**"]
timeout_secs = 3600
default = false
# Mirrored when a main head resolves a new package set, as the base is (mirror-base), and when
# dispatched; the images that install from it then read it by digest.
on = ["main", "dispatch"]
id_token = ["registry.tilo.so"]
[check.matrix]
arch = ["x86_64", "aarch64"]

[[check]]
name = "image-rpms-{arch}"
# Pinned: it copies the snapshot the registry holds, by the digest the reference
# rpms-source-ARCH left names, and reads nothing else. The registry answers a blob read with a
# redirect into its object storage, named here.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "bash tools/ci/publish/rpms-copy.sh {arch} /target/publish/rpms-source/{arch} /target/publish/rpms/{arch}"
needs = ["rpms-source-{arch}"]
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
requires = ["arch={arch}"]
# No Git: the snapshot is dated by its packages' newest signature (rpms-copy.sh), never by the
# commit, so its key is the package set's and every OS layer above it is reused across commits
