      timeout --kill-after=1s 3s cat "/proc/$pid/io" 2>/dev/null || true
    done
    sleep 15
  done
) &
observer_pid=$!
trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
result=0
wait "$switch_pid" || result=$?
printf 'TILO_SWITCH_DONE exit_code=%s\n' "$result"
exit "$result"
GUEST_SWITCH
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/guest-switch.sh" "$TILO_USER@127.0.0.1:/tmp/guest-switch.sh"
