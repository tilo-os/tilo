# Signed with the release key, which signs only a release run: stable's, or a tag's. Until
# stable publishes the guest, a release is a dispatch of publish-hosted-guest on a tag
# (vhosted-guest-<date>; the release signer accepts tags beginning with v, and no check is
# triggered by one that does not continue with a version number), and its pins.env is pinned
# by hand with `hosted-guest.sh pin`'s checks.
[[check]]
name = "sign-hosted-guest"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/hosted-guest /target/publish/hosted-guest/image"
