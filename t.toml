[[check]]
name = "apple-client-macos"
# The Swift package in dist/apple is the Mac and iPhone client, which no Cargo package builds
# and no Linux job sees. Its tests import XCTest and its views use SwiftUI's macros, and both
# come with Xcode alone: a Mac that has the command line tools and no Xcode fails here, saying
# so, instead of passing for having built nothing. The development Mac has no Xcode today, so
# this runs on dispatch, where its failure names what to install; it can gate main once that
# Mac carries an Xcode.
run = "set -eu\nif ! xcrun --find xctest >/dev/null 2>&1; then\n  echo 'this Mac has no Xcode, so nothing of the Swift client in dist/apple can be built or tested here' >&2\n  exit 1\nfi\ndist/apple/build.sh test\n"
requires = ["os=macos", "arch=arm64"]
# A cold Swift build of every target and its tests: the job the Swift client had before
# allowed ninety minutes.
timeout_secs = 5400
on = ["dispatch"]
heavy = true

[[check]]
name = "apple-client-compile-macos"
# The Swift package in dist/apple, compiled with the command line tools alone: no XCTest, so no
# tests, and no iPhone SDK. The macOS SDK carries the shell's own modules, the Mac app, and the
# notice and widget extensions, whose UIKit-only parts are `#if os(iOS)`; TiloPhone, and the
# iPhone half of every bundle, needs Xcode and is built by apple-client-macos. Each target is
# built as the package names it, so one that has not landed yet is no error. This says a push
# does not break the Swift client where no Xcode is available.
run = "set -eu\nif ! xcrun --find swift >/dev/null 2>&1; then\n  echo 'this Mac has no Swift toolchain, so nothing of the Swift client in dist/apple can be compiled here' >&2\n  exit 1\nfi\ncd dist/apple\nbuild() { xcrun swift build --scratch-path ../target/apple.noindex/swiftpm-mac --target \"$1\"; }\n# The package's own targets, as it names them, so one that has not landed yet is not an error.\ntargets=$(xcrun swift package describe --type json | python3 -c 'import json,sys; print(\" \".join(t[\"name\"] for t in json.load(sys.stdin).get(\"targets\",[]) if t[\"name\"] in {\"ShellCore\",\"ShellWeb\",\"TiloMac\",\"TiloNotice\"} or \"Widget\" in t[\"name\"]))')\nfor target in $targets; do build \"$target\"; done\n"
requires = ["os=macos", "arch=arm64"]
timeout_secs = 1800
on = ["main", "idle", "stable"]

[[check]]
name = "sdk-macos"
# Installs packages (npm, PyPI, rustup) from hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
# The generated app outside the repository resolves its own dependencies, the SDK among them as
# a git dependency on this tree, so it needs cargo's network; t turns it off where it hands a job
# the state's crates.
env = { CARGO_NET_OFFLINE = "false" }
run = "set -eu\n# The project's environment picks Mesa's Vulkan CPU driver for Linux; on the Mac wgpu picks Metal.\nunset WGPU_BACKEND WGPU_ADAPTER_NAME\n# The Mac's own tilo test cache, which outlives jobs as the Linux nodes' does (font-catalog.py's\n# default): $TMPDIR is each job's own, and the fonts were downloaded again in every run.\nfonts=\"${TILO_TEST_CACHE_DIR:-$HOME/.cache/tilo/test-env}/font-artifacts\"\npython3 -I tools/font-catalog.py root crates/ui/ui-core/assets/fonts --scope fixtures --cache \"$fonts\"\nexport TILO_FONT_ASSET_CACHE=\"$fonts\" TILO_FONT_ASSETS_OFFLINE=1\ncargo build --locked -p tilolang-cli -p tilo-app-package-cli --bin tilolang --bin tilo-app-package\nbin=${CARGO_TARGET_DIR:-$PWD/target}/debug\nrustup target add wasm32-unknown-unknown\n# The template takes the SDK from this tree as a git repository (`--sdk-git file://\u2026`, at HEAD):\n# commit the tree here, so HEAD is exactly the files checked, a working tree's changes included.\nif ! git rev-parse --git-dir >/dev/null 2>&1; then\n  git init -q\n  git add -A\n  GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@localhost GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@localhost git commit -q -m 'the checked tree'\nfi\nTILO_SDK_SOURCE=git cargo test --locked -p tilolang-cli --test it outside_repo -- --ignored --nocapture\n# The installer is a host program, not an SDK app; the SDK example stands for a Rust app.\nbundle=$(\"$bin/tilolang\" build --target macos examples/apps/counter | tail -n 1)\nplutil -lint \"$bundle/Contents/Info.plist\"\ncodesign --verify --deep --strict \"$bundle\"\n\"$bundle/Contents/MacOS/example-counter\" --shots \"$TMPDIR/counter.png\"\ntest -s \"$TMPDIR/counter.png\"\n\"$bin/tilolang\" package --target macos examples/apps/counter --output \"$TMPDIR/counter-macos.zip\" --force\ntest -s \"$TMPDIR/counter-macos.zip\"\ntest -s \"$TMPDIR/counter-macos.zip.json\"\n"
requires = ["os=macos", "arch=arm64"]
on = ["dispatch", "idle", "stable"]
heavy = true

[[check]]
name = "tilolang-macos"
# The fonts' and crates' downloads come from hosts no fixed list names.
egress = { to = ["0.0.0.0/0", "::/0"] }
# A tilolang app on the Mac, on the paths Linux runs it on: its window runs the instance in its own
# process over the app's document, patches crossing a real channel and shared memory, and an
# action a person's click runs is counted and named in history.
run = "set -eu\n# The project's environment picks Mesa's Vulkan CPU driver for Linux; on the Mac wgpu picks Metal.\nunset WGPU_BACKEND WGPU_ADAPTER_NAME\nfonts=\"${TILO_TEST_CACHE_DIR:-$HOME/.cache/tilo/test-env}/font-artifacts\"\npython3 -I tools/font-catalog.py root crates/ui/ui-core/assets/fonts --scope fixtures --cache \"$fonts\"\nexport TILO_FONT_ASSET_CACHE=\"$fonts\" TILO_FONT_ASSETS_OFFLINE=1\n# The channel and the shared memory every patch and module crosses, and the Seatbelt profile the\n# runtime confines an app with.\ncargo test --locked -p tilo-render-protocol --lib\ncargo test --locked -p launcher-macos --lib\n# A person's click runs the counter's action through the app's window and its tilolang host.\ncargo test --locked -p tilolang-process --test window hosted::counter -- --exact hosted::counter::a_persons_click_on_a_button_runs_the_action_and_history_names_them\n# The package built as a session installs it, opened by the runtime binary on its payload.\ncargo build --locked -p tilolang-cli --bin tilolang -p tilolang-process --bin tilolang-process --features tilolang-process/app-launch\nbin=${CARGO_TARGET_DIR:-$PWD/target}/debug\nexport XDG_STATE_HOME=\"$TMPDIR/state\"\n\"$bin/tilolang\" build apps/tl/counter --out \"$TMPDIR/built\"\npayload=$(ls -d \"$TMPDIR\"/built/*/payload | head -n 1)\ntest -s \"$payload/app.wasm\"\nTILO_APP_MODULE=\"$payload\" TILO_PACKAGE_ID=so.tilo.lang.counter \"$bin/tilolang-process\" --shots \"$TMPDIR/counter.png\"\ntest -s \"$TMPDIR/counter.png\"\n# Every package runs where its runtime runs, the Mac included.\nfor app in notes mail tube; do\n  \"$bin/tilolang\" build \"apps/tl/$app\" --out \"$TMPDIR/built-$app\"\n  for manifest in \"$TMPDIR/built-$app\"/*/manifest.toml; do\n    grep -qx 'platforms = \\[\"linux\", \"macos\", \"web\"\\]' \"$manifest\"\n  done\ndone\n# A Mac whose Tilo.app lists no runtime publisher installs no runtime; with the list, a runtime\n# only where it has code, and only from a publisher the list names.\ncargo test --locked -p install --test it runtime_package::a_runtime_installs_only_where_it_has_code_from_a_publisher_this_device_trusts -- --exact\n# Chat with the person's agent: they send from the composer, the agent's answer stands with its turn and author, a view it wrote is drawn in its message, and the person's answer to what it asks reaches the dispatch.\ncargo test --locked -p tilolang-process --test window hosted::chat -- --exact hosted::chat::a_person_writes_a_message_in_a_conversation_with_their_agent_and_sends_it\ncargo test --locked -p tilolang-process --test window hosted::chat -- --exact hosted::chat::an_agents_answer_stands_with_its_turn_and_author\ncargo test --locked -p tilolang-process --test window hosted::chat -- --exact hosted::chat::an_agents_written_view_is_drawn_inside_its_message\ncargo test --locked -p tilolang-process --test window hosted::chat -- --exact hosted::chat::an_agents_ask_shows_and_the_persons_answer_goes_to_the_dispatch\n# The tilolang runtime with the reviewed GStreamer closure relocated beside it, as its package\n# carries it, plays a clip: a decoded frame, a moving position and the app's action.\nrt=\"$TMPDIR/runtime\"\npython3 dist/macos/collection_local_runtime.py tilolang --binary \"$bin/tilolang-process\" --out \"$rt\" >/dev/null\nfind \"$rt/lib/gstreamer/Frameworks\" \"$rt/lib/gstreamer/PlugIns\" \"$rt/lib/gstreamer/Helpers\" -type f -exec codesign -f -s - {} +\ncodesign -f -s - \"$rt/bin/tilolang-process\"\npython3 dist/macos/runtime_plays.py --tilolang \"$bin/tilolang\" --runtime \"$rt\" --work \"$TMPDIR/plays\"\n"
requires = ["os=macos", "arch=arm64"]
on = ["dispatch", "idle", "stable"]
heavy = true

[[check]]
name = "window-connector"
on = ["idle", "stable"]
# The video site's types kept in step with YouTube through the connector its daemon runs: the
# client's play answer reaches its record and its window draws the player. The test installs the
# Tube app from apps/tl, which a cargo-keyed tree leaves out, so this reads Git: the job gets the
# repository's files and the check is keyed by the commit. It fails when the app is not there and
# when no test ran, so a renamed or filtered-out test is red, never green.
git = true
# The fonts the window's build sets text in: every pin of this tree, laid out by its digest by the
# font-seed check. The builder image's seed can predate a changed pin, and this check has no
# network to fetch one: a pin the seed lacks fails at once, naming the seed and the tool that
# prepares it, rather than trying the store.
