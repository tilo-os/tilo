# `t dispatch vm-acceptance --input only=input --input swap=all` runs a selection;
# `t test vm-acceptance` the checks a working tree's changes select; `t outputs
# vm-acceptance` gives the report. vm-acceptance-perf runs every check on release candidates
# and when dispatched, and publishes its performance records where the run holds
# TILO_PACKAGES_TOKEN (`t dispatch vm-acceptance-perf --ref main`, or any reference the
# server's secret config gives it to). The micro-VM holds the guest (6 vCPUs, 4.5 GiB) beside
# the image install and the tilo-vm build.
[[check]]
name = "vm-acceptance"
