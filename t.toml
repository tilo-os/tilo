  # the host independently to distinguish disk I/O errors from a
  # running guest that has stopped responding over SSH.
  (
    while true; do
      host_evidence
      sleep 15
    done
  ) > >(tee "$TILO_RUN/host-switch.log") 2>&1 &
  host_observer_pid=$!
  timeout --kill-after=10s 22m ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-switch.sh '$UPGRADE_IMAGE'" \
    | tee "$TILO_RUN/image-switch.log"
  kill "$host_observer_pid" 2>/dev/null || true
  wait "$host_observer_pid" 2>/dev/null || true
  host_observer_pid=
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 120); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::dev image upgrade did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootc status --json" > "$TILO_RUN/bootc-status.json"
