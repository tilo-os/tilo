name = "web-desktop-bundle"
run = "bash tools/ci/publish/web-desktop-bundle.sh bundle /target/publish/web-desktop/bundle /target/publish/web-desktop/wasm"
needs = ["web-desktop-wasm"]
requires = ["arch=x86_64"]
outputs = ["/target/publish/web-desktop/bundle/**"]
git = true
default = false

