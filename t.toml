run = "set -eu\nmkdir -p \"$CARGO_TARGET_DIR/vm\"\n# Read every message before selecting: closing cargo's pipe early makes it\n# fail with a broken pipe while it is still writing build messages.\ncargo test --locked -p tilo-device-vpn --features test-support --test netns_tunnel --test netns_profile_block --no-run --message-format json | python3 -c '\nimport json, os, shutil, sys\nmessages = list(map(json.loads, sys.stdin))\nbuilt = {m[\"target\"][\"name\"]: m[\"executable\"] for m in messages if m.get(\"reason\") == \"compiler-artifact\" and m.get(\"executable\")}\ntarget = os.environ[\"CARGO_TARGET_DIR\"]\nshutil.copy(built[\"netns_tunnel\"], target + \"/vm/device-vpn-netns-tunnel\")\nshutil.copy(built[\"netns_profile_block\"], target + \"/vm/device-vpn-netns-profile-block\")\n'\n"
