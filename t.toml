# Tilo's checks for t (docs/t.md): what runs before a push and on every commit to main.
# Each cargo family becomes one check per workspace package: `test/<package>`, `clippy/<package>`.
#
# Main is where changes integrate, not a release: every push to it runs the cheap checks that
# catch breakage in what it touched (fmt, clippy, the tests of the packages it reaches, the
# policy and suite scripts, the lockfile, deny and hakari), and t bisects each of their failures
# to the commit that caused it. Release candidates on `stable` run the extensive ones as well: OS
# images and their boots, VM, micro-VM and FUSE suites, the whole-workspace nightly-* and
# weekly-* sets, the perf runs, size budgets, certification, the full web and SDK suites,
# Android, the goldens, development signing. Those say `on = ["stable", "dispatch"]` and `default
# = false`; `t test <name>` runs one for a working tree, `t dispatch <name>` on a branch. The one
# heavy schedule on main's head is the nightly development OS: its dev images and board images
# (publish-os-dev-*, publish-os-board-*), which development VMs and boards update from, each
# published only once its gates pass. Everything else on a schedule is cheap and watches
# something outside the tree (certificate expiry, live third-party services, loop devices,
# mirrors, extension manifests). A few checks also say `idle`: main's newest head runs them when
# CI has room left, at the lowest priority, and t bisects their failures like a default check's.
# Their runs and bisection probes wait behind all other work and restart whenever pre-empted, so a
# check should say it only if a run is cheap and its inputs change rarely (release-trust).
# Publishing steps stay on main where something consumes main's development tags (the builder pin
# below, the CI images, the mirrors); those only a release or a person uses (the services'
# development tags, the release rehearsal and tools) are dispatched. Most of the extensive checks
# are keyed by the packages they build (`cargo_packages`) and the files they read, so running one
# for a change that doesn't touch them takes its cached result: run those
# your change reaches (sdk-web for the web runtime, real-fuse for the filesystem, render-counters
# for the toolkit's renderer, the goldens of the packages whose pixels you changed). Each still
# builds tilo-app, the shell or the toolkit, which most commits reach, so none of them is cheap
# enough to run on every push.

# The builder index this tree's os/Containerfile.builder defines, as main's publish-ci-builder
# published it (`dev-<commit>`), pinned so results stay comparable. `latest` lags behind it, so
# move the pin to the newest `dev-<commit>` whose commit has today's builder inputs
# (`skopeo inspect --raw docker://registry.tilo.so/tilo/tilo-builder:dev-<commit> | sha256sum`).
# The test family expects what the builder provides, such as the Chromium RPM at $CHROME.
image = "registry.tilo.so/tilo/tilo-builder@sha256:e4763a8c16005f544dde0206014c2cc088fff0d5d28f1857ea24961677c666f6"
inputs = ["rust-toolchain.toml", ".cargo/config.toml", "deny.toml"]

# A check that needs a particular node names it in `requires`: `arch=x86_64`, `os=macos`, a
# device such as `/dev/kvm`, or a node label such as `disk-100g`.
# A check whose result doesn't depend on the node's architecture says `arch=any`, and t runs it
# wherever it starts soonest, arm64 nodes included: formatting, lints and policy scripts, the
# cargo families (tests pass on both architectures),
# and builds of architecture-independent output (wasm, web bundles). A check without an
# architecture runs on the server's, x86_64. Pinned to one stay the checks that produce or
# exercise that architecture's own artifacts (images, release binaries, VM guests, Android's
# NDK), the ones that need software that only exists for x86_64 (Chrome for Testing, the
# ci-fast image), and the tests that fail on aarch64 for reasons of the architecture (the
# `test-x86_64` family, the goldens).

# What every check and cargo family must be able to pass with unless it declares its own
# `requirement`: its job's memory limit, so a check that needs more fails as its own failure
# instead of quietly taking more. Checks and families declare their own where their runs
# measured differently: the 99th-percentile peak memory with half again as much room, rounded up
# to 1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48 or 64 GiB, and the 90th-percentile peak cores (at
# most 16 for cargo families, 8 for other checks). The default covers `t cargo` commands, which
# take it too: their 99th-percentile peak at 4 cores is about 10 GiB.
[defaults]
requirement = { cores = 4, memory = "16GiB" }

# The environment of every check. Warnings fail through the per-target flags, which
# Cargo joins with .cargo/config.toml's target rustflags (RUSTFLAGS would replace them).
# Tests render with Mesa's CPU Vulkan driver, never whatever adapter a node has.
[env]
XDG_RUNTIME_DIR = "/tmp/tilo-xdg-runtime"
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings"
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_NAME = "llvmpipe"

# The workspace tests: tools/ci/t-nextest.sh prepares what the packages need and
# leaves out the visual goldens (.config/nextest-filters.toml).
# Media, audio and the software GPU are present in the builder, so a test that finds
# one missing fails instead of skipping. Pushes to main run the push-only suites too.
[[cargo]]
name = "test"
tool = "nextest"
requires = ["arch=any"]
wrapper = ["bash", "tools/ci/t-nextest.sh"]
args = ["--locked", "--profile", "ci", "--tests"]
# Tested on x86_64 only, by the `test-x86_64` family below, or through another package: one
# with no test target of its own is compiled into another's tests (settings-rare's panes into
# settings-core's, browser-parts into browser's), and nextest refuses to run it alone.
# BEGIN generated by tools/ci/t_toml.py: test-exclude
exclude = ["browser-parts", "launcher", "settings-rare", "shell", "store", "tilo-sandbox", "tilo-vmd", "workspace-unify"]
# END generated
inputs = [".config/nextest.toml", ".config/nextest-filters.toml", "tools/ci/t-nextest.sh", "tools/ci/package_features.py", "tools/ci/nextest_filters.py", "tools/ci/require-pdf-sandbox.sh", "tools/test-env.sh", "tools/with-test-environment.sh", "tools/with-headless-audio.sh"]
env = { TILO_REQUIRE_MEDIA = "1", TILO_REQUIRE_AUDIO = "1", TILO_REQUIRE_GPU = "1" }
# Each job of this family runs under it; t cuts batches so none is expected to need more.
# The cores are the fewest a job passes with, which t never goes below; t widens a job past
# them from its profile when that helps (t's README, "requirement"). The memory is the peak
# measured at up to 16 cores with half again as much room, so it covers fewer.
requirement = { cores = 4, memory = "32GiB" }
# Packages whose tests start sandboxes of their own (bubblewrap, unshare): in t's job
# sandbox they may create user, mount and network namespaces, as uid 1000 inside.
nested_sandboxes = ["shell", "launcher", "ush", "tilo-fs", "tilo-runtime", "tilo-vmd", "settings", "settings-core", "tilo-sandbox-core", "thumbnails", "runtime-bundle"]
