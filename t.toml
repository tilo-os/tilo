run = "# Each shard of vm-acceptance writes the records of the checks it ran, and the\n# selection it ran beside them: a dispatched `--only A14` owes A14's measurements,\n# never every check of the lane's.\nrecords=$TMPDIR/records.jsonl\ncat /target/vm-acceptance/*/report/records.jsonl > \"$records\" 2>/dev/null || true\n[[ -s $records ]] || { echo \"the acceptance run wrote no performance records\" >&2; exit 1; }\n[[ -s /target/vm-acceptance/only ]] || { echo \"the acceptance run did not record the checks it ran\" >&2; exit 1; }\nselection=$(cat /target/vm-acceptance/only)\npublish=false\n[[ -n ${T_REF:-} ]] && publish=true\nstatus=0\npython3 tools/perf/compare.py --results \"$records\" --store https://code.tilo.so --owner tilo --lane vm-acceptance --groups \"$(python3 scripts/vm-acceptance/selected_groups.py \"$selection\")\" --publish-dir \"$TMPDIR/publish\" --run \"t-${T_COMMIT:-tree}-vm\" --summary \"$TMPDIR/summary.md\" || status=1\nif [[ $publish == true && -n ${TILO_PACKAGES_TOKEN:-} ]]; then\n  manifest=$(mktemp)\n  for file in \"$TMPDIR\"/publish/*/*.jsonl; do\n    month=$(basename \"$(dirname \"$file\")\")\n    printf '%s\t%s\n' \"$file\" \"https://code.tilo.so/api/packages/tilo/generic/tilo-perf-results/$month/$(basename \"$file\")\"\n  done > \"$manifest\"\n  TILO_PACKAGE_TOKEN=$TILO_PACKAGES_TOKEN bash tools/upload_immutable_packages.sh \"$manifest\" || status=1\nfi\ncat \"$TMPDIR/summary.md\" 2>/dev/null || true\nexit \"$status\"\n"
needs = ["vm-acceptance/{shard}"]
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
cache = false
on = ["stable", "dispatch"]

[[check]]
name = "vm-acceptance-perf-publish"
run = "# Each shard of vm-acceptance writes the records of the checks it ran, and the\n# selection it ran beside them: a dispatched `--only A14` owes A14's measurements,\n# never every check of the lane's.\nrecords=$TMPDIR/records.jsonl\ncat /target/vm-acceptance/*/report/records.jsonl > \"$records\" 2>/dev/null || true\n[[ -s $records ]] || { echo \"the acceptance run wrote no performance records\" >&2; exit 1; }\n[[ -s /target/vm-acceptance/only ]] || { echo \"the acceptance run did not record the checks it ran\" >&2; exit 1; }\nselection=$(cat /target/vm-acceptance/only)\npublish=false\n[[ -n ${T_REF:-} ]] && publish=true\nstatus=0\npython3 tools/perf/compare.py --results \"$records\" --store https://code.tilo.so --owner tilo --lane vm-acceptance --groups \"$(python3 scripts/vm-acceptance/selected_groups.py \"$selection\")\" --publish-dir \"$TMPDIR/publish\" --run \"t-${T_COMMIT:-tree}-vm\" --summary \"$TMPDIR/summary.md\" || status=1\nif [[ $publish == true && -n ${TILO_PACKAGES_TOKEN:-} ]]; then\n  manifest=$(mktemp)\n  for file in \"$TMPDIR\"/publish/*/*.jsonl; do\n    month=$(basename \"$(dirname \"$file\")\")\n    printf '%s\t%s\n' \"$file\" \"https://code.tilo.so/api/packages/tilo/generic/tilo-perf-results/$month/$(basename \"$file\")\"\n  done > \"$manifest\"\n  TILO_PACKAGE_TOKEN=$TILO_PACKAGES_TOKEN bash tools/upload_immutable_packages.sh \"$manifest\" || status=1\nfi\ncat \"$TMPDIR/summary.md\" 2>/dev/null || true\nexit \"$status\"\n"
needs = ["vm-acceptance/{shard}"]
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
