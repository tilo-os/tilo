  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::grown disk did not boot'; exit 1; }
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh prepare" \
    | tee "$TILO_RUN/shared-disk-prepare.log"
  old_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id')
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 180); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::guest did not boot with a foreign ESP ahead of its own'; exit 1; }
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/shared_disk_esp.sh "$TILO_USER@127.0.0.1:/tmp/shared_disk_esp.sh"
  timeout --kill-after=10s 28m ./os/dev/vm.sh ssh \
    "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/shared_disk_esp.sh check '$SHARED_DISK_SWITCH_IMAGE'" \
    | tee "$TILO_RUN/shared-disk-check.log"
fi
if [[ $DEV_UKI_BOOT == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/dev/guest-dev-uki.sh "$TILO_USER@127.0.0.1:/tmp/guest-dev-uki.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-dev-uki.sh" > "$TILO_RUN/dev-uki-build.log" 2>&1
  old_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id')
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl reboot" || true
  ready=false
  for attempt in $(seq 1 120); do
    new_boot=$(./os/dev/vm.sh ssh 'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || new_boot=
    if [[ -n $new_boot && $new_boot != "$old_boot" ]]; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::generated dev UKI did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl status --no-pager" > "$TILO_RUN/dev-uki-boot.log"
  grep -Eq '^[[:space:]]*Current Entry: tilo-dev-diagnostic[.]efi$' "$TILO_RUN/dev-uki-boot.log"
fi
if [[ $COLD_BOOT == true ]]; then
  if [[ $DEV_UKI_BOOT == true ]]; then
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl set-oneshot tilo-dev-diagnostic.efi"
  fi
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' systemctl poweroff" || true
  stopped=false
  for attempt in $(seq 1 30); do
    if [[ $(./os/dev/vm.sh status) == stopped ]]; then stopped=true; break; fi
    sleep 1
  done
  [[ $stopped == true ]] || { echo '::error::guest did not shut down for the cold boot'; exit 1; }
  ./os/dev/vm.sh stop
  ./os/dev/vm.sh boot --2d --disk "$overlay"
  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::cold dev boot did not accept SSH'; exit 1; }
  if [[ $DEV_UKI_BOOT == true ]]; then
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bootctl status --no-pager" > "$TILO_RUN/dev-uki-boot.log"
    grep -Eq '^[[:space:]]*Current Entry: tilo-dev-diagnostic[.]efi$' "$TILO_RUN/dev-uki-boot.log"
  fi
fi
# Measure the actual boot before diagnostic instrumentation restarts
# greetd; its new activation timestamp would include host probe time.
if [[ $CHECK_BOOT_PERFORMANCE == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/tests/boot_performance_gate.sh "$TILO_USER@127.0.0.1:/tmp/boot-performance-gate.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/boot-performance-gate.sh" > "$TILO_RUN/boot-performance.log" 2>&1
fi
# A broken update must roll itself back on this disk's own boot chain.
# It ends booted on the deployment that came back, so the greeter
# checks below also prove that machine reaches its greeter.
if [[ -n $BOOT_ASSESSMENT_IMAGE ]]; then
  RUNNER='./os/dev/vm.sh ssh' SUDO_PASS="$TILO_PASS" FAULT="$BOOT_ASSESSMENT_FAULT" \
    RESET="./os/dev/vm.sh stop; ./os/dev/vm.sh boot --2d --disk '$overlay'" \
    SERIAL='./os/dev/vm.sh serial' \
    ./os/tests/boot_assessment_rollback.sh "$BOOT_ASSESSMENT_IMAGE" "$TILO_RUN/boot-assessment"
fi
read -r -a samples <<< "$VERITY_SAMPLES"
for sample in "${samples[@]}"; do
  [[ $sample =~ ^[0-9a-f]{2}/[0-9a-f]{126}$ ]] || {
    echo '::error::verity_samples contains an invalid object path'
    exit 1
  }
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sha256sum '/sysroot/composefs/objects/$sample' >/dev/null" || {
    echo "::error::native KVM could not read composefs object $sample"
    exit 1
  }
  echo "::notice::native KVM read composefs object $sample"
done
if [[ $CAPTURE_FAULT_PC == true ]]; then
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    os/dev/guest-ptrace-override.sh "$TILO_USER@127.0.0.1:/tmp/guest-ptrace-override.sh"
  ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' bash /tmp/guest-ptrace-override.sh"
  ./os/dev/vm.sh stop
  ./os/dev/vm.sh boot --2d --disk "$overlay"
  ready=false
  for attempt in $(seq 1 120); do
    if ./os/dev/vm.sh ssh true >/dev/null 2>&1; then ready=true; break; fi
    sleep 1
  done
  [[ $ready == true ]] || { echo '::error::debug guest did not reboot'; exit 1; }
  ./os/dev/vm.sh ssh 'cat /proc/sys/kernel/yama/ptrace_scope; test "$(cat /proc/sys/kernel/yama/ptrace_scope)" = 0' || {
    echo '::error::disposable guest ptrace override did not take effect'
    exit 1
  }
  cc -O2 -Wall -Wextra -o "$TILO_RUN/tilo-greeter-ptrace-probe" \
    os/dev/greeter-ptrace-probe.c
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/tilo-greeter-ptrace-probe" "$TILO_USER@127.0.0.1:/tmp/"
fi
if [[ $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  cc -O2 -Wall -Wextra -shared -fPIC -o "$TILO_RUN/libtilo-gallivm-cpu-interpose.so" \
    os/dev/gallivm-cpu-interpose.c
  sshpass -p "$TILO_PASS" scp -q -P 2222 \
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o PreferredAuthentications=password -o PubkeyAuthentication=no \
    "$TILO_RUN/libtilo-gallivm-cpu-interpose.so" "$TILO_USER@127.0.0.1:/tmp/"
fi
sshpass -p "$TILO_PASS" scp -q -P 2222 \
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
  -o PreferredAuthentications=password -o PubkeyAuthentication=no \
  os/dev/guest-greeter-diagnostic.sh "$TILO_USER@127.0.0.1:/tmp/guest-greeter-diagnostic.sh"
./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' env GREETER_RENDER_VARIANT=$RENDERER_VARIANT GREETER_CAPTURE_FAULT_PC=$CAPTURE_FAULT_PC bash /tmp/guest-greeter-diagnostic.sh"
./os/dev/vm.sh ssh 'cat /tmp/tilo-cage-diagnostic.log' > "$TILO_RUN/cage-diagnostic.log" || true
if [[ $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  grep -q 'TILO_GALLIVM_CPU=generic' "$TILO_RUN/cage-diagnostic.log" || {
    echo '::error::LLVM CPU override did not load in the guest'
    exit 1
  }
fi
if [[ $RENDERER_VARIANT == gpu || $RENDERER_VARIANT == gpu-generic-cpu ]]; then
  ./os/dev/vm.sh ssh 'grep -lq first-frame-presented /tmp/tilo-greeter-metrics-*.json' || {
    echo '::error::guest did not present its first frame'
    exit 1
  }
fi
sleep 3
./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sh -c 'test -c /dev/dri/card0 && systemctl is-active --quiet greetd && pgrep -x cage && pgrep -x tilo-greeter'" || {
  echo '::error::native KVM guest did not keep a graphical greeter'
  exit 1
}
if [[ $CHECK_DESKTOP == true ]]; then
  if [[ $OVERRIDE_SESSION_WRAPPER == true ]]; then
    sshpass -p "$TILO_PASS" scp -q -P 2222 \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o PreferredAuthentications=password -o PubkeyAuthentication=no \
      os/usr/libexec/tilo-session "$TILO_USER@127.0.0.1:/tmp/tilo-session-override"
    ./os/dev/vm.sh ssh "printf '%s\n' '$TILO_PASS' | sudo -S -p '' sh -c 'install -m 0755 /tmp/tilo-session-override /run/tilo-session-override && chcon --reference=/usr/libexec/tilo-session /run/tilo-session-override && mount --bind /run/tilo-session-override /usr/libexec/tilo-session && mount -o remount,bind,ro,exec /usr/libexec/tilo-session'"
  fi
  ./os/dev/vm.sh login --passcode-only "$TILO_PASS"
  desktop_ready=false
  for attempt in $(seq 1 60); do
    # The CSV records ticks after event-loop dispatch returns and may
    # stay buffered while an already painted desktop is idle. Require
    # a completed render-thread presentation, not a flushed loop tick.
    if ./os/dev/vm.sh ssh 'busctl --user --timeout=3 status org.freedesktop.impl.portal.desktop.tilo >/dev/null 2>&1 && grep -Eq "^FRAME-LIFECYCLE serial=[1-9][0-9]* event=render-retired " "$HOME/.local/state/tilo/session-logs/latest.log"'; then
      desktop_ready=true
      break
    fi
    sleep 1
  done
  if [[ $desktop_ready != true ]]; then
    echo '::error::native desktop did not own its portal and complete a presentation; preserving evidence in desktop-readiness.log, desktop-session.log and frame-trace.csv'
    exit 1
  fi
  ./os/dev/vm.sh cmd "screendump $TILO_RUN/desktop.ppm" >/dev/null
fi
'''
needs = ["tilo-vm-binary-{arch}"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch={arch}", "/dev/kvm", "disk-100g"]
isolation = "vm"
evidence = ["/target/dev-disk-boot-diagnostic/**"]
cache = false
git = true
timeout_secs = 5400
on = ["dispatch"]
dispatch_inputs = { candidate_manifest = "", candidate_manifest_sha256 = "", source_revision = "", upgrade_image = "", renderer_variant = "gpu", cpu_variant = "host", capture_fault_pc = "false", check_desktop = "false", check_boot_performance = "false", dev_uki_boot = "false", cold_boot = "false", override_session_wrapper = "false", verity_samples = "", shared_disk_esp = "false", shared_disk_switch_image = "", boot_assessment_image = "", boot_assessment_fault = "greetd" }
[check.matrix]
