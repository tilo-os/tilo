run = "SOURCE_DATE_EPOCH=$(cat /target/source-date/host)\nexport SOURCE_DATE_EPOCH\nbash tools/ci/publish/host-build.sh /target/publish/host/binaries /target/publish/host-base /target/os/x86_64/tools /target/generation-host/generation /target/publish/host"
needs = ["source-date-host", "host-base", "host-binaries", "generation-host", "os-tools-x86_64"]
