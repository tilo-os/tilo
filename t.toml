# Runs `cargo install` of a crate the state's Cargo.lock doesn't name, so it needs cargo's
# network; t turns it off where it hands a job the state's crates.
env = { CARGO_NET_OFFLINE = "false" }
requires = ["arch=x86_64"]
outputs = ["/target/iai-runner/**", "/target/iai-valgrind-fixed/install/**", "/target/iai-valgrind-fixed/build-inputs.txt", "/target/iai-valgrind-fixed/install.sha256"]
timeout_secs = 3600
on = ["dispatch"]

[[check]]
name = "editor-typing-iai-build"
run = "bash tools/perf/typing-iai.sh --build-only"
needs = ["editor-typing-iai-tools"]
requires = ["arch=x86_64"]
outputs = ["/target/iai-built/**", "/target/iai/benchmark-executable*", "/target/iai/*source.sha256", "/target/iai/build-inputs.sha256", "/target/iai/compiler.txt", "/target/iai/instrumenter*", "/target/iai/build.jsonl", "/target/cargo-timings/**"]
timeout_secs = 3600
on = ["dispatch"]

[[check]]
name = "editor-typing-iai"
run = "bash tools/perf/typing-iai.sh"
needs = ["editor-typing-iai-build", "editor-typing-iai-tools"]
requires = ["arch=x86_64"]
outputs = ["/target/iai/**"]
cache = false
timeout_secs = 3600
on = ["dispatch"]

# ---- Product images, signatures and publication
#
# One chain per image: what it is built from, the image, a test that runs the thing inside it,
# then signing on the stable branch and publication wherever a release is asked for. Every link
# is a check of its own, so changing a link leaves every earlier one cached.
#
# The registry server is a `build`: a Containerfile of this tree whose one outside input is a
# named context, so t makes a check per instruction and caches each on what it reads. The other
# two are `run`s, for two reasons that stay true of them. Their context is not this tree's: a
# script assembles it from other checks' outputs (font catalogues prepared, the web bundle laid
# out, bot programs renamed), and t reads a build's context from the state's sources, so it would
# find those files missing. And both Containerfiles stamp the commit into the image with an `ARG`
# that the packaging script passes the commit to — a build arg is a fixed string in t.toml, while
# a per-commit one would rerun the config steps of every commit.

[[check]]
name = "image-web-entry-context"
run = "bash tools/ci/publish/web-entry-context.sh /target/publish/web-entry/context /target/publish/web-desktop/bundle"
needs = ["web-desktop-bundle"]
outputs = ["/target/publish/web-entry/context/**"]
git = true
requires = ["arch=x86_64"]
default = false

[[check]]
name = "image-web-entry"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash tools/ci/publish/oci-build.sh /target/publish/web-entry/context /target/publish/web-entry/context/Containerfile /target/publish/web-entry --build-arg SOURCE_REVISION=$(cat /target/publish/web-entry/context/source-revision)\nbash crates/browser/tilo-browser-runtime/container/test-image.sh /target/publish/web-entry/image.oci.tar"
needs = ["image-web-entry-context"]
outputs = ["/target/publish/web-entry/image.oci.tar", "/target/publish/web-entry/digest"]
requires = ["arch=x86_64"]
isolation = "vm"
git = true
default = false

[[check]]
name = "carry-web-entry"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash tools/ci/publish/web-entry-carry.sh /target/publish/web-entry /target/publish/web-entry/release"
needs = ["image-web-entry"]
outputs = ["/target/publish/web-entry/release/image.oci.tar", "/target/publish/web-entry/release/digest", "/target/publish/web-entry/release/receipt-extra.json"]
requires = ["arch=x86_64"]
isolation = "vm"
on = ["dispatch", "stable"]
cache = false

[[check]]
name = "sign-web-entry"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/web-entry /target/publish/web-entry/release"
needs = ["carry-web-entry", "signing-tools"]
outputs = ["/target/publish/web-entry/release/payload.json", "/target/publish/web-entry/release/signature", "/target/publish/web-entry/release/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
# Signed on stable and on a dispatch: the web entry is released at a release tag, with the relay
# of the same commit (`t dispatch publish-web-entry --ref tag:vX.Y.Z`). The signing role trusts
# stable and v* tags only, so a dispatch on main gets no signature and publishes nothing.
on = ["stable", "dispatch"]

[[check]]
name = "publish-web-entry"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/web-entry /target/publish/web-entry 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-web-entry", "signing-tools"]
optional_needs = ["sign-web-entry", "carry-web-entry"]
outputs = ["/target/publish/web-entry/receipt.json"]
pointers = { web-entry = "/target/publish/web-entry/receipt.json" }
id_token = ["registry.tilo.so"]
env = { TILO_RELEASE_OUT = "/target/publish/web-entry/release" }
requires = ["arch=any"]
on = ["dispatch"]

# The Lounge, built and gated here: the programs, the image and the image used by people — two
# headless browsers joining it through the web entry, chatting, sharing a desk and seeing each
# other present, then one of them opening a shared document's link. One check per step, so a
# change leaves the earlier ones cached, and the gate runs on any commit and branch instead of
# only in the publication on main. Image-lounge-context publishes the app surfaces from the
# apps' history, so these read Git; the image is built at the commit time of the newest commit
# that changed it, as every image here is.
[[check]]
name = "lounge-binaries"
run = "bash tools/ci/publish/lounge-binaries.sh /target/publish/lounge/binaries"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/binaries/**"]
# The image's programs, built as the image ships them: a release build whose whole-program link
# covers everything a host that serves pages carries. Only the image waits for this build; the
# checks that run these programs themselves ask for `lounge-gate-binaries` below. A release waits
# for it, so it gets longer than a check of a change does: the whole-program link grows with the
# graph and this is the only build of it left.
timeout_secs = 5400
default = false

# The same two programs, for the checks that run them directly (page-boot, page-two-people,
# agent-setup): the profile Cargo.toml's `lounge-gate` describes, which is release optimisation
# without the whole-program link. A check starts from an empty build directory, so a run is the
# whole graph taken from the compiler cache and then linked whole, which grows with every crate a
# host that serves pages carries and which any change in that graph redoes — for a binary no check
# reads the speed of.
[[check]]
name = "lounge-gate-binaries"
run = "bash tools/ci/publish/lounge-binaries.sh /target/publish/lounge-gate/binaries lounge-gate"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge-gate/binaries/**"]
# A node's first run of this builds the whole graph from nothing through the compiler cache; after
# that t books it from what it measured, and a change to one crate relinks.
timeout_secs = 7200
default = false

# The product font catalog, which the image's context and every check that runs the Lounge's
# programs directly serve: built once, apart from the image's own assembly, so a check of the page
# does not wait for the image's programs.
[[check]]
name = "lounge-fonts"
run = "bash tools/ci/publish/lounge-fonts.sh /target/publish/lounge/fonts"
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/fonts/**"]
default = false

[[check]]
name = "image-lounge-context"
run = "bash tools/ci/publish/lounge-context.sh /target/publish/lounge/context /target/publish/lounge/binaries /target/publish/lounge/fonts"
needs = ["lounge-binaries", "lounge-fonts"]
outputs = ["/target/publish/lounge/context/**"]
requires = ["arch=x86_64"]
git = true
default = false

[[check]]
name = "image-lounge"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/containers/tilo-lounge/test-entrypoint.sh\nbash tools/ci/publish/oci-build.sh /target/publish/lounge/context /target/publish/lounge/context/Containerfile /target/publish/lounge --build-arg SOURCE_REVISION=$(cat /target/publish/lounge/context/source-revision)\nbash os/containers/tilo-lounge/test-image.sh /target/publish/lounge/image.oci.tar"
needs = ["image-lounge-context"]
# The entrypoint is also held against the programs the image carries, not only against its stub:
# every flag it passes has to be one this build's `tilo-relay room` reads.
env = { TILO_RELAY_BIN = "/target/publish/lounge/context/bin/tilo-relay" }
outputs = ["/target/publish/lounge/image.oci.tar", "/target/publish/lounge/digest"]
requires = ["arch=x86_64"]
isolation = "vm"
git = true
default = false

# The gate's own certificate mint, built for the node's architecture as a development build: the
# site's TLS needs it, and it is no published artifact. A one-package selection resolves fewer
# features than the whole workspace's build does, so the warnings-as-errors flags are off here (as
# they are for the other checks that only build a program to run it): the lints themselves are
# `clippy`'s, over every package at once.
[[check]]
name = "lounge-gate-tools"
run = "cargo build --locked -p tilo-crypto --bin tilo-crypto\nrm -rf /target/publish/lounge/gate-tools\nmkdir -p /target/publish/lounge/gate-tools\ncp \"$CARGO_TARGET_DIR/debug/tilo-crypto\" /target/publish/lounge/gate-tools/\n"
env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "", CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/lounge/gate-tools/**"]
default = false

# The image, run and used as the deployment runs it: a fresh volume reaching Ready, the
# workspace listed in its public directory, the web entry served beside it, and people in
# browsers using the Lounge through it. It keeps everything it found in /target/lounge-gate —
# each page's snapshot and console, the site's and the Lounge's logs — as its outputs, and says
# in its log what the pages said as they failed.
[[check]]
name = "lounge-gate"
run = "mkdir -p /target/lounge-gate-cli\ntar -xzf /target/publish/cli/linux-x86_64/tilo-linux-x86_64.tar.gz -C /target/lounge-gate-cli tilo\nbash os/containers/tilo-lounge/test-integration.sh /target/publish/lounge/image.oci.tar /target/publish/web-desktop/bundle /target/lounge-gate"
setup = { run = "dnf install -y --setopt=install_weak_deps=False buildah && dnf clean all" }
needs = ["image-lounge", "web-desktop-bundle", "lounge-gate-tools", "cli-x86_64"]
env = { TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto", TILO_CLI_BIN = "/target/lounge-gate-cli/tilo" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/lounge-gate/**"]
timeout_secs = 3600
default = false

# The gate's agent step on its own, in minutes: a person sets Tilo up through their agent, comes
# back to their workspace on a reload, and signs in again on a fresh browser through the agent.
# The Lounge's entrypoint runs the relay the image carries (lounge-binaries, with the fonts its
# context prepares) directly, beside the web entry and the tilo command a release publishes (cli-x86_64), with no image or micro-VM
# around them. It builds nothing itself: a change to the page or the test reruns only the test,
# and a change to the relay or the command rebuilds that one output, which the gate shares.
[[check]]
name = "agent-setup"
run = "mkdir -p /target/agent-setup-cli\ntar -xzf /target/publish/cli/linux-x86_64/tilo-linux-x86_64.tar.gz -C /target/agent-setup-cli tilo\nbash os/containers/tilo-lounge/test-agent-setup.sh /target/publish/web-desktop/bundle /target/agent-setup"
needs = ["lounge-gate-binaries", "lounge-fonts", "cli-x86_64", "lounge-gate-tools", "web-desktop-bundle"]
env = { TILO_RELAY_BIN = "/target/publish/lounge-gate/binaries/tilo-relay", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto", TILO_CLI_BIN = "/target/agent-setup-cli/tilo" }
requires = ["arch=x86_64"]
outputs = ["/target/agent-setup/**"]
timeout_secs = 1800
default = false

# A person's setup survives what their browser does mid-way, on every change that reaches it: the
# real page in headless Chromium against the Lounge's relay run directly and the tilo command an
# agent runs, reloaded, closed and reopened, gone back and forward to and opened in a second tab at
# every step of "Set up with your agent", with a code running out and the network dropping. Each
# case must land on the step the person was at, never in the Lounge by surprise. It builds nothing
# itself: it takes the same cached outputs as agent-setup.
[[check]]
name = "setup-resume"
run = "mkdir -p /target/setup-resume-cli\ntar -xzf /target/publish/cli/linux-x86_64/tilo-linux-x86_64.tar.gz -C /target/setup-resume-cli tilo\nbash os/containers/tilo-lounge/test-setup-resume.sh /target/publish/web-desktop/bundle /target/setup-resume"
needs = ["lounge-gate-binaries", "lounge-fonts", "cli-x86_64", "lounge-gate-tools", "web-desktop-bundle"]
env = { TILO_RELAY_BIN = "/target/publish/lounge-gate/binaries/tilo-relay", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto", TILO_CLI_BIN = "/target/setup-resume-cli/tilo" }
requires = ["arch=x86_64"]
# What it found, not what it ran: the captures, the report, each tab's console and the Lounge's logs.
outputs = ["/target/setup-resume/setup-resume/*.png", "/target/setup-resume/setup-resume/*.json", "/target/setup-resume/setup-resume/*.log", "/target/setup-resume/*.log"]
timeout_secs = 1800

# The web page boots for real, on every change that reaches it: the built bundle in headless
# Chromium against the Lounge's relay run directly, arriving, joining the workspace and opening
# Notes, failing on any exception the page throws or panic it reports. A page's unit tests run
# against a fake runtime, so what only a real page meets (a runtime export the page calls by
# another name, storage read before it is loaded, std's clock reached in wasm) passes them all.
# Like agent-setup it builds nothing itself: the bundle and the relay are the cached outputs the
# gate shares, rebuilt only when what they are built from moved.
[[check]]
name = "page-boot"
run = "bash os/containers/tilo-lounge/test-page-boot.sh /target/publish/web-desktop/bundle /target/page-boot"
needs = ["lounge-gate-binaries", "lounge-fonts", "lounge-gate-tools", "web-desktop-bundle"]
env = { TILO_RELAY_BIN = "/target/publish/lounge-gate/binaries/tilo-relay", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto" }
requires = ["arch=x86_64"]
outputs = ["/target/page-boot/**"]
timeout_secs = 1200

# The front door of a workspace that takes people by invitation, in a real browser: a stranger
# whose browser has never been here sees the wait list rather than the setup screen, leaves an
# address, confirms it through the mail the door sends to a local sink, and stays on the list
# when the tab reloads. The screenshots it keeps are what someone arriving today sees.
[[check]]
name = "wait-list-door"
run = "bash os/containers/tilo-lounge/test-wait-list-door.sh /target/publish/web-desktop/bundle /target/wait-list-door"
needs = ["lounge-gate-binaries", "lounge-fonts", "lounge-gate-tools", "web-desktop-bundle"]
env = { TILO_RELAY_BIN = "/target/publish/lounge-gate/binaries/tilo-relay", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto" }
requires = ["arch=x86_64"]
outputs = ["/target/wait-list-door/**"]
timeout_secs = 1200
default = false

# Two people on the page, each in their own browser, against the Lounge's relay run directly as
# page-boot runs it: the gate's people step, brief (chat, presence, a call and the names on its
# card, the strip panned and a sideways swipe over Sheets among a few apps), so what broke between
# two people's pages is caught in minutes. The gate runs the whole step: every app the Lounge
# offers, the menus, an invitation.
[[check]]
name = "page-two-people"
run = "bash os/containers/tilo-lounge/test-page-two-people.sh /target/publish/web-desktop/bundle /target/page-two-people"
needs = ["lounge-gate-binaries", "lounge-fonts", "lounge-gate-tools", "web-desktop-bundle"]
env = { TILO_RELAY_BIN = "/target/publish/lounge-gate/binaries/tilo-relay", TILO_FONTS_DIR = "/target/publish/lounge/fonts", TILO_CRYPTO_BIN = "/target/publish/lounge/gate-tools/tilo-crypto" }
requires = ["arch=x86_64"]
outputs = ["/target/page-two-people/**"]
timeout_secs = 1200
default = false

# tilo.sh, whole, on one machine, and used end to end (os/containers/tilo-sh/check.sh): the
# Lounge, front door and web entry images of this commit run under podman with the environment
# production's manifests give them, a fresh startup identity approves a server key on the local
# site in a headless Chromium, the visa run makes workspaces, mints a one-workspace MCP, has the
# agent fill the form, a reviewer join by invitation and approve, and revoked keys refused; then
# fresh visitors' entry into the Lounge is timed. What it found (pages, logs, report.json with
# the bring-up and entry times) stays in /target/tilo-sh-local. The VM host is not in it: it needs
# a privileged host with KVM, which a micro-VM step is not.
[[check]]
name = "tilo-sh-local"
run = "bash os/containers/tilo-sh/check-in-vm.sh /target/tilo-sh-local"
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman passt shadow-utils util-linux e2fsprogs python3-httpx && dnf clean all\nmkdir -p /etc/containers/containers.conf.d\nprintf '[engine]\\ncgroup_manager = \"cgroupfs\"\\nevents_logger = \"file\"\\n' > /etc/containers/containers.conf.d/tilo-sh-local.conf" }
needs = ["image-lounge", "image-front-door", "image-web-entry", "cli-x86_64"]
env = { TILO_SH_IMAGE_LOUNGE = "/target/publish/lounge/image.oci.tar", TILO_SH_IMAGE_DOOR = "/target/images/image-front-door/image.oci.tar", TILO_SH_IMAGE_WEB = "/target/publish/web-entry/image.oci.tar", TILO_SH_CLI_DIR = "/target/publish/cli/linux-x86_64", TILO_SH_STATE = "/target/tilo-sh-local-state", TILO_SH_FRESH = "1", TILO_SH_IMAGES = "1" }
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/tilo-sh-local/**"]
timeout_secs = 3600
default = false

# The same stack with the VM hosts' own machines in it: tilo.sh's VM host (privileged, with its
# loop-backed state disk and Firecracker) runs here, so a hosted workspace's Browser runs in the
# workspace's VM, on the guest image this checkout built. A one-workspace key opens Browser and the
# open is timed; the agent fills the visa test page with page actions and captures it; a reviewer
# joins by invitation and reads its run in History; the page actions past the plans file's free
# ones are refused until the account is added to it; and the VM is held to its proofs - every
# renderer sandboxed, the session as the image's unprivileged browser user, its device key, and
# what the page costs in memory. What it found stays in /target/tilo-sh-local-vm.
[[check]]
name = "tilo-sh-local-vm"
run = "bash os/containers/tilo-sh/check-in-vm.sh /target/tilo-sh-local-vm"
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman passt shadow-utils util-linux e2fsprogs xfsprogs python3-httpx && dnf clean all\nmkdir -p /etc/containers/containers.conf.d\nprintf '[engine]\\ncgroup_manager = \"cgroupfs\"\\nevents_logger = \"file\"\\n' > /etc/containers/containers.conf.d/tilo-sh-local.conf" }
needs = ["image-lounge", "image-front-door", "image-web-entry", "cli-x86_64", "image-vm-host", "image-hosted-guest"]
env = { TILO_SH_IMAGE_LOUNGE = "/target/publish/lounge/image.oci.tar", TILO_SH_IMAGE_DOOR = "/target/images/image-front-door/image.oci.tar", TILO_SH_IMAGE_WEB = "/target/publish/web-entry/image.oci.tar", TILO_SH_IMAGE_VM_HOST = "/target/publish/vm-host/image.oci.tar", TILO_SH_HOSTED_GUEST = "/target/publish/hosted-guest/image", TILO_SH_CLI_DIR = "/target/publish/cli/linux-x86_64", TILO_SH_STATE = "/target/tilo-sh-local-vm-state", TILO_SH_FRESH = "1", TILO_SH_IMAGES = "1", TILO_SH_VM_HOST = "1", TILO_SH_BROWSER_FREE_ACTIONS = "8" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/tilo-sh-local-vm/**"]
timeout_secs = 5400
default = false

# Releasing the Lounge: t's own image-lounge build of the released commit (the same cached build
# the gate runs), with the entrypoint and image tests its check runs, signed with the release key
# and published as `sha-<commit>` for cloud-deploy, on stable and on a release tag. Published on
# dispatch as `dev-<commit>`, so a deployment can try a commit before it is released. The release
# needs no registry image made elsewhere first: any commit tagged is released from its own build.
[[check]]
name = "sign-lounge"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/lounge/release\ncp /target/publish/lounge/image.oci.tar /target/publish/lounge/digest /target/publish/lounge/release/\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/lounge /target/publish/lounge/release"
needs = ["image-lounge", "signing-tools"]
outputs = ["/target/publish/lounge/release/payload.json", "/target/publish/lounge/release/signature", "/target/publish/lounge/release/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable", "tag:v[0-9]*.[0-9]*.[0-9]*", "dispatch"]

[[check]]
name = "publish-lounge"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/lounge/release\ncp /target/publish/lounge/image.oci.tar /target/publish/lounge/digest /target/publish/lounge/release/\nbash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/lounge /target/publish/lounge/release 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-lounge", "signing-tools"]
optional_needs = ["sign-lounge"]
outputs = ["/target/publish/lounge/release/receipt.json"]
pointers = { lounge = "/target/publish/lounge/release/receipt.json" }
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch", "stable", "tag:v[0-9]*.[0-9]*.[0-9]*"]

# The registry server: this tree is its context, and the compiler-cache client it installs is the
# fetched asset cache, a named context of `os-assets`' outputs. So t plans it instruction by
# instruction and caches each on what it reads, and the compile `COPY . .` precedes runs in the
# image, as the Containerfile says, with the caches it mounts empty for each step.
[[check]]
name = "image-registry-server"
build = { containerfile = "crates/packaging/registry-server/container/Containerfile", context = ".", contexts = { github-assets = { check = "os-assets", path = "os/external-assets/cache" } } }
needs = ["os-assets"]
requires = ["arch=x86_64"]
timeout_secs = 7200
default = false

# The image before it is signed or published: non-root, Tilo's trust bundle where the patched
# client looks for it, the reviewed offline-root commands, and a server that initializes a fresh
# state directory and answers /health. It runs in the buildah image, which loads the archive
# without a daemon, in a micro-VM step because buildah needs root over throwaway mounts.
[[check]]
name = "test-image-registry-server"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash crates/packaging/registry-server/container/test-image.sh /target/images/image-registry-server/image.oci.tar"
needs = ["image-registry-server"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
default = false

# Signing and publishing read the build's archive and digest beside it: they name the image the
# build made, at the path the build leaves it, and copy the two files where oci-sign.sh and
# oci-publish.sh expect the build's output.

[[check]]
name = "sign-registry-server"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/registry-server\ncp /target/images/image-registry-server/image.oci.tar /target/images/image-registry-server/digest /target/publish/registry-server/\nbash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/tilo-registry-server /target/publish/registry-server"
needs = ["image-registry-server", "signing-tools"]
outputs = ["/target/publish/registry-server/payload.json", "/target/publish/registry-server/signature", "/target/publish/registry-server/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable"]

[[check]]
name = "publish-registry-server"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "install -d /target/publish/registry-server\ncp /target/images/image-registry-server/image.oci.tar /target/images/image-registry-server/digest /target/publish/registry-server/\nbash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/tilo-registry-server /target/publish/registry-server 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-registry-server", "signing-tools"]
optional_needs = ["sign-registry-server"]
outputs = ["/target/publish/registry-server/receipt.json"]
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch", "stable"]

# The hosted VM host (os/containers/tilo-vm-host): the service that runs tilo.sh workspaces'
# Linux programs in jailed Firecracker VMs, its jail helper, Firecracker and pasta. Its programs
# are t's own compile (vm-host-binaries, cached like every other build here), so the image is
# packaging only: the pinned Fedora base, the runtime packages from the frozen RPM snapshot and
# the pinned Firecracker release as a named context. Tested in a micro-VM, and published on
# dispatch as dev-<commit> for the infra repository's apps/tilo-sh-vm-host to pin, signed on
# stable.
[[check]]
name = "vm-host-binaries"
run = "bash tools/ci/publish/server-binaries.sh vm-host /target/publish/vm-host/binaries"
# One feature resolution for the three programs; the link is most of a server build, and the
# compiler cache the builder gives this check is what keeps a one-crate change at a relink.
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/vm-host/binaries/**"]
timeout_secs = 7200
default = false

[[check]]
name = "image-vm-host"
run = "bash tools/ci/publish/vm-host-build.sh /target/publish/rpm-snapshot /target/publish/rpms/x86_64 /target/publish/vm-host/binaries /target/publish/vm-host"
needs = ["vm-host-binaries", "rpm-snapshot", "image-rpms-x86_64", "os-assets"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
git = true
outputs = ["/target/publish/vm-host/image.oci.tar", "/target/publish/vm-host/digest", "/target/publish/vm-host/rpms-source"]
timeout_secs = 7200
default = false

[[check]]
name = "test-image-vm-host"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/containers/tilo-vm-host/test-image.sh /target/publish/vm-host/image.oci.tar"
needs = ["image-vm-host"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
default = false

[[check]]
name = "sign-vm-host"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/vm-host /target/publish/vm-host"
needs = ["image-vm-host", "test-image-vm-host", "signing-tools"]
outputs = ["/target/publish/vm-host/payload.json", "/target/publish/vm-host/signature", "/target/publish/vm-host/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable"]

[[check]]
name = "publish-vm-host"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/vm-host /target/publish/vm-host 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-vm-host", "test-image-vm-host", "signing-tools"]
optional_needs = ["sign-vm-host"]
outputs = ["/target/publish/vm-host/receipt.json"]
pointers = { vm-host = "/target/publish/vm-host/receipt.json" }
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch", "stable"]

# The local tilo.sh stack's VM host (os/containers/tilo-sh/vm-host.sh): the same image,
# privileged with a loop-backed state disk, the placer that places workspaces' VMs on it, and
# the guest image this checkout built instead of a release's. It is what a hosted workspace
# needs under it locally: its Linux programs and its Browser run in its VM there. The check
# boots it and holds it to a workspace's VM waking from that guest and running a program,
# with its member device installed, and a clean `down`.
[[check]]
name = "tilo-sh-vm-host"
run = "cargo build --locked -p tilo-relay --bin tilo-enroll\nbash os/containers/tilo-sh/test-vm-host.sh /target/images/image-vm-host/image.oci.tar /target/publish/hosted-guest/image \"$CARGO_TARGET_DIR/debug/tilo-enroll\"\n"
setup = { run = "dnf install -y --setopt=install_weak_deps=False podman xfsprogs util-linux && dnf clean all" }
env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "", CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "" }
needs = ["image-vm-host", "image-hosted-guest"]
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 3600
default = false

# The front door of hosted Tilo (os/containers/tilo-front-door): the MCP endpoint behind
# https://mcp.tilo.sh, with OAuth for agents and routing to the workspace's host. It is
# configured entirely by its environment, so the deployment's values never enter the image. Its
# program is t's own compile (front-door-binaries), so the image is packaging only: the pinned
# Fedora base and the packages from the frozen RPM snapshot. Tested in a micro-VM against a real
# start, and published on dispatch as dev-<commit> for the infra repository's deployment to pin,
# signed on stable.
[[check]]
name = "front-door-binaries"
run = "bash tools/ci/publish/server-binaries.sh front-door /target/publish/front-door/binaries"
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
outputs = ["/target/publish/front-door/binaries/**"]
timeout_secs = 7200
default = false

[[check]]
name = "image-front-door"
run = "bash tools/ci/publish/front-door-build.sh /target/publish/rpm-snapshot /target/publish/rpms/x86_64 /target/publish/front-door/binaries /target/publish/front-door"
needs = ["front-door-binaries", "rpm-snapshot", "image-rpms-x86_64"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
git = true
outputs = ["/target/publish/front-door/image.oci.tar", "/target/publish/front-door/digest", "/target/publish/front-door/rpms-source"]
timeout_secs = 7200
default = false

[[check]]
name = "test-image-front-door"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = "bash os/containers/tilo-front-door/test-image.sh /target/publish/front-door/image.oci.tar"
needs = ["image-front-door"]
requires = ["arch=x86_64"]
isolation = "vm"
timeout_secs = 1800
default = false

[[check]]
name = "sign-front-door"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-sign.sh registry.tilo.so/tilo/front-door /target/publish/front-door"
needs = ["image-front-door", "test-image-front-door", "signing-tools"]
outputs = ["/target/publish/front-door/payload.json", "/target/publish/front-door/signature", "/target/publish/front-door/dry-run.pub"]
id_token = ["sts.amazonaws.com"]
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
requires = ["arch=any"]
on = ["stable", "dispatch"]

[[check]]
name = "publish-front-door"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/oci-publish.sh any registry.tilo.so/tilo/front-door /target/publish/front-door 'dev:dev-{commit}' 'release:sha-{commit}'"
needs = ["image-front-door", "test-image-front-door", "signing-tools"]
optional_needs = ["sign-front-door"]
outputs = ["/target/publish/front-door/receipt.json"]
