# ---------------------------------------------------------------------------
# Publishing (docs/publishing-on-t.md). Each image is a chain of checks, generated from
# tools/ci/products.toml by tools/ci/t_toml.py where the product is listed there:
#
#   image-<name>[-context]  build, no secrets: runs anywhere, also for a working tree;
#                           image-<name>-<arch> per architecture, image-<name> their index
#   sign-<name>             signs the built digest with the release key in KMS; holds only
#                           the signing identity, on stable and release tags, as a micro-VM step
#   publish-<name>          pushes development tags from main and, with sign-<name> as an
#                           optional need, the signed release from stable or release tags
#
# The server runs publish-* on every new head of main and stable by itself (`on`), as trusted
# runs; nobody runs them from a working tree. Building and signing never share a check: the
# build runs arbitrary code, the signing check refuses any digest but the build's. No check
# holds a stored credential: each asks t for an identity token (`id_token`) naming this
# repository, the reference and the commit, valid for minutes, so there is nothing long-lived
# to leak. registry.tilo.so takes the `registry.tilo.so` token as a push credential (user
# `oidc`) for main, stable and v* tags; AWS exchanges the `sts.amazonaws.com` token for the
# TiloTReleaseSigner role, which trusts stable and v* tags only and may do nothing but sign
# with the release keys. Check names have no `/` yet because the deployed server refuses it.

# The images the publishing checks run in (buildah, skopeo) come from quay.io, which deletes the
# digests a pin names once it rebuilds a tag. They are mirrored into registry.tilo.so and pinned
# there; this check copies each digest of tools/ci/publish/mirrored-images.tsv across while
# upstream still serves it, and passes at once when the mirror has them all.
[[check]]
name = "mirror-images"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/mirror-images.sh"
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["main"]

# The browser desktop bundle (crates/browser/tilo-web-desktop: every web app compiled to wasm,
# release, split into modules) that the room service's and the web entry's images serve and the
# browser end-to-end checks drive. web-desktop-wasm compiles its modules, keyed by what that
# compile reads (not by commit, and not by the crates' web/ pages), so a commit that changes
# none of it takes the last build; web-desktop-bundle assembles this commit's pages around them,
# once per commit (the bundle records it), and both image contexts take it as an output, so
# neither compiles the apps to wasm again and the room service's native build runs beside it.
[[check]]
name = "web-desktop-wasm"
run = "bash tools/ci/publish/web-desktop-bundle.sh wasm /target/publish/web-desktop/wasm"
outputs = ["/target/publish/web-desktop/wasm/**"]
# A command check gets no jobserver from t, so cargo would keep .cargo/config.toml's floor of 4
# jobs.
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
default = false

[[check]]
name = "web-desktop-bundle"
run = "bash tools/ci/publish/web-desktop-bundle.sh bundle /target/publish/web-desktop/bundle /target/publish/web-desktop/wasm"
needs = ["web-desktop-wasm"]
outputs = ["/target/publish/web-desktop/bundle/**"]
# The release bundle records the commit it was built from (git rev-parse, git status).
git = true
requires = ["arch=x86_64"]
default = false

# The room service image's programs (tools/ci/publish/room-service-binaries.sh): tilo-relay with
# its agents, which link every web app, tilo-room-service and the Discord worker, release with
# thin LTO, in one cargo build beside web-desktop-bundle; the browser end-to-end checks run them
# too. Keyed by what that build reads (not by commit, and not by the room service's scripts and
# pages), so a commit that changes none of it takes the last build.
[[check]]
name = "room-service-binaries"
run = "bash tools/ci/publish/room-service-binaries.sh /target/publish/room-service/bin"
outputs = ["/target/publish/room-service/bin/**"]
# A command check gets no jobserver from t, so cargo would keep .cargo/config.toml's floor of 4
# jobs.
env = { CARGO_BUILD_JOBS = "8" }
requires = ["arch=x86_64"]
default = false

# BEGIN generated by tools/ci/t_toml.py: products-services
# The room service: tested before it is published, deployed by digest from stable's receipt.
# Development tags are published only when dispatched (`t dispatch publish-room-service --ref
# main`): what runs is stable's.
[[check]]
name = "image-room-service-context"
run = "bash tools/ci/publish/room-service-context.sh /target/publish/room-service/context /target/publish/room-service/bin /target/publish/web-desktop/bundle"
needs = ["room-service-binaries", "web-desktop-bundle"]
outputs = ["/target/publish/room-service/context/**"]
git = true
requires = ["arch=x86_64"]
default = false

[[check]]
name = "image-room-service"
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
run = """
bash tools/ci/publish/oci-build.sh /target/publish/room-service/context /target/publish/room-service/context/Containerfile /target/publish/room-service --build-arg SOURCE_REVISION=$(cat /target/publish/room-service/context/source-revision)
bash crates/hosting/tilo-room-service/container/test-image.sh /target/publish/room-service/image.oci.tar $(cat /target/publish/room-service/context/source-revision)
"""
needs = ["image-room-service-context"]
outputs = ["/target/publish/room-service/image.oci.tar", "/target/publish/room-service/digest"]
requires = ["arch=x86_64"]
isolation = "vm"
default = false

[[check]]
name = "sign-room-service"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
