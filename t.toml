# The OS release (tools/ci/publish/os-release.sh), released only when dispatched on stable or a
# release tag: `t dispatch publish-os-release --ref stable`. os-release-image-<arch> is the release
# image (thin LTO, the registry owner's key; tools/ci/os/os_toml.py); os-release-seal-<arch> checks
# it inside, installs it, which seals its UKI, and boots it to the greeter, on every release
# candidate too; sign-os-boot-<arch> signs its UKIs (EFI) and PCR 11 prediction with the keys in
# KMS, running nothing of the image; os-release-<arch> verifies and adds them, installs it once more
# and writes its SBOM and provenance; os-release-reproduce-<arch> builds the image again from an
# independent compile and must get the same bytes. sign-os-release signs the images and their
# index with the release key and attests their provenance and freshness; publish-os-release
# publishes registry.tilo.so/tilo/tilo:gen<N> (once), <version> on a final version tag, and
# latest. `t test os-release-rehearsal-x86_64` runs the boot signing, signing and publishing with
# throwaway keys into a throwaway OCI layout instead, without credentials. A board with a release
# of its own (the Lenovo 83ED) goes through the same steps apart, into its own series in
# code.tilo.so/tilo/tilo (below).
# The release image checked as a device gets it, on every release candidate and when dispatched:
# inside the image, every ELF resolves its libraries, every script its interpreter and every
# package its dependencies, the enabled units exist and verify, every GStreamer plugin loads and
# Miracast's software encoders work, and the programs the desktop runs start
# (tools/ci/image_smoke.py); then it is installed onto a disk as a device installs it, which seals
# its UKI with the composefs digest the install computes, and booted under KVM until the greeter
# accepts input, with no unit failed on the way. It installs from the RPM set of the same run when
# no snapshot of it is published, so a package-set change is checked before stable ships it
# (though no release ships such an image). The sealed image and what its boot signing signs are
# its outputs.
