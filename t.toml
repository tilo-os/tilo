# Every feature set an embedder builds the workspace service and the person
# services beside it with, each alone:
# a device serving apps (`apps`, the runtime and the session), a host that runs
# agents (`agents`, which carries `web` and no apps), the server embedding it
# for pages (`web`), a build with no feature at all, and the test features the
# embedders' dev-dependencies add. Each compiles with its tests, so code behind
# one feature cannot slip into a build that leaves it out. No `unify`: these
# builds' features are the point, so their units are their own.
[[check]]
name = "workspace-service-features"
requires = ["arch=any"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "for features in '' device-keys apps agents apps,agents apps,test-support agents,test-support; do\n    cargo check --locked -p tilo-workspace-service --all-targets ${features:+--features \"$features\"} || exit 1\ndone\nfor features in '' device-keys apps agents test-support agents,test-support; do\n    cargo check --locked -p tilo-person-services --all-targets ${features:+--features \"$features\"} || exit 1\ndone\nfor features in '' agents files agents,files test-support agents,test-support; do\n    cargo check --locked -p tilo-app-host --all-targets ${features:+--features \"$features\"} || exit 1\ndone\n"

