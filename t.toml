[[check]]
name = "vm-acceptance-perf"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
needs = ["vm-acceptance"]
run = """
records=/target/vm-acceptance/report/records.jsonl
[[ -s $records ]] || { echo "the acceptance run wrote no performance records" >&2; exit 1; }
publish=false
[[ ${T_REF:-} == main && ${T_TRIGGER:-} == schedule ]] && publish=true
status=0
python3 tools/perf/compare.py --results "$records" --store https://code.tilo.so --owner tilo \
  --lane vm-acceptance --groups boot,session,idle,memory,disk,app,render --publish-dir "$TMPDIR/publish" \
  --run "t-${T_COMMIT:-tree}-vm" --summary "$TMPDIR/summary.md" || status=1
if [[ $publish == true && -n ${TILO_PACKAGES_TOKEN:-} ]]; then
  manifest=$(mktemp)
  for file in "$TMPDIR"/publish/*/*.jsonl; do
    month=$(basename "$(dirname "$file")")
    printf '%s\t%s\n' "$file" "https://code.tilo.so/api/packages/tilo/generic/tilo-perf-results/$month/$(basename "$file")"
  done > "$manifest"
  TILO_PACKAGE_TOKEN=$TILO_PACKAGES_TOKEN bash tools/upload_immutable_packages.sh "$manifest" || status=1
fi
cat "$TMPDIR/summary.md" 2>/dev/null || true
exit "$status"
"""
inputs = ["tools/perf/**", "tools/upload_immutable_packages.sh"]
secrets = ["TILO_PACKAGES_TOKEN"]
cache = false
default = false
on = ["schedule:23 2 * * *"]

# The imager's staging helper and reclaim proofs over loop devices
# (.forgejo/workflows/ci-staging-loop.yml). Needs a privileged node with loop
# devices.
[[check]]
name = "staging-loop"
on = ["schedule:40 2 * * *", "dispatch"]
requires = ["disk-100g"]
privileged = true
devices = ["/dev/loop-control"]
run = """
command -v mkfs.vfat >/dev/null && command -v mcopy >/dev/null && command -v mkfs.btrfs >/dev/null \
  || dnf install -y -q --setopt=install_weak_deps=False dosfstools mtools btrfs-progs
cargo build --locked -p imager --bin imager
IMAGER=$CARGO_TARGET_DIR/debug/imager bash os/tests/staging_helper_loop.sh
bash os/tests/staging_reclaim_loop.sh
"""
cost = "heavy"
default = false

