# The development loop's dev image and disk: the dev image as os-dev-image-ARCH builds it, but
# never published, so it needs neither what only a publication carries nor the commit
# (TILO_DEV_LOOP=1, tools/ci/publish/os-image.sh): it keeps the OS image's own local model
# catalog (the release's) in place of one naming this tree's runtimes, so asking for it builds
# none of the local model runtimes (llama.cpp for the CPU, Vulkan and CUDA, vLLM) nor that
# catalog; and it reads no Git, so a commit that changes none of its inputs is answered from the
# cache instead of building the image and installing the disk again. Everything else is the same
# build: the OS image, the dev components, the env-runtime, the install. Work on the disk, its
# install or what boots on it asks for `os-dev-disk-lean-x86_64`; the end-to-end checks of boxes
