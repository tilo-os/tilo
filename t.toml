# ---------------------------------------------------------------------------
# Deploys what stable released (tools/release/cloud_deploy.py). Which images run where is not
# decided here: the GitOps repository TILO_DEPLOY_REPO holds the deploy target at
# TILO_DEPLOY_CONFIG, listing each service, the manifest pinning its image by digest and the URL
# it reports its build at, and `rollout`, which keeps this a dry run until it is true. When
# stable moves, this takes the receipts of stable's signed images, commits their digests to that
# repository's main, which its reconciler applies, and waits until every moved service reports
# its new build and stays healthy; if one does not, it commits the previous digests back, waits
# for them and fails. A service already running the build keeps its pin, so a deploy reloads
# open tabs only when the web entry changed. `t dispatch cloud-deploy --ref stable` runs it at
# once: `--input dry_run=true` stops before the commit, `--input revision=<commit> --input
# allow_rollback=true` redeploys an older release. `t outputs cloud-deploy` has the plan.
[[check]]
name = "cloud-deploy"
image = "registry.tilo.so/tilo/ci-fast@sha256:ee8b038d30e14a6a7722f419fdca240956065df8f64bf44cb6bfc0a9d1dfe3a8"
run = "bash tools/release/cloud-deploy.sh /target/cloud-deploy /target/publish/room-service/receipt.json /target/publish/web-entry/receipt.json"
inputs = ["tools/release/cloud_deploy.py", "tools/release/cloud-deploy.sh"]
needs = ["publish-room-service", "publish-web-entry"]
outputs = ["/target/cloud-deploy/*"]
env = { TILO_DEPLOY_REPO = "PodestaAI/infra", TILO_DEPLOY_CONFIG = "clusters/prod/tilo-deploy.toml" }
# The receipts' commits are compared along stable's history.
git = true
# A check holding a secret runs as a micro-VM step, which t boots on x86_64 only for now.
requires = ["arch=x86_64"]
# It observes the target, which changes without this repository changing.
cache = false
secrets = ["INFRA_PROMOTION_TOKEN"]
# A rollout and, when it fails, the rollback each wait up to the target's timeout and settle time.
timeout_secs = 3600
cost = "minutes"
on = ["stable", "dispatch"]
default = false

[check.dispatch_inputs]
revision = ""
allow_rollback = "false"
dry_run = "false"

