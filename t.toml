# Getting in, end to end, on the stack the web entry and room service images
# ship: crates/hosting/tilo-room-service/dev/auth-e2e.mjs starts them with
# dev/run.py and drives headless Chrome through a person's first visit, reloads,
# tabs, a damaged link, a stolen invitation, a revoked device, a guest's open
# page the host forgot, a host that forgot its room, a stale link, a pruned
# membership and a removed member. Before it,
# dev/limits-e2e.py checks the persistent room's limits and what it keeps across
# a restart over plain HTTP, and dev/owner-key-e2e.py that only a throwaway
# room's creator mints its invitations and watches its members. Release
# binaries with the images' flags. The bundle
# records the commit it was built from, so a committed tree must match it
# exactly; a working tree with changes runs as a development build.
[[check]]
name = "browser-auth-e2e"
run = """
export TILO_FONT_ASSET_CACHE=$CARGO_TARGET_DIR/font-artifacts
python3 tools/font-catalog.py root crates/sdk/ui-core/assets/fonts --scope fixtures --cache "$TILO_FONT_ASSET_CACHE" >/dev/null
cargo build --locked --release -p tilo-relay --features agents --bin tilo-relay
cargo build --locked --release -p tilo-room-service
bin=$CARGO_TARGET_DIR/release
python3 crates/hosting/tilo-room-service/dev/limits-e2e.py \
  --relay-bin "$bin/tilo-relay" --room-service-bin "$bin/tilo-room-service" --out "$TMPDIR/limits-e2e"
python3 crates/hosting/tilo-room-service/dev/owner-key-e2e.py \
  --relay-bin "$bin/tilo-relay" --room-service-bin "$bin/tilo-room-service" --out "$TMPDIR/owner-key-e2e"
cp -r scripts/moq-browser "$TMPDIR/moq-browser"
TILO_MOQ_BROWSER_DIR=$TMPDIR/moq-browser crates/browser/tilo-browser-runtime/scripts/build.sh "$TMPDIR/auth-bundle" --bundle desktop
bash tools/ci/ensure-browser-dependencies.sh
npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
if [ -z "$(git status --porcelain)" ]; then revision=(--expect-revision "$(git rev-parse HEAD)"); else revision=(--allow-dev); fi
rm -rf "$CARGO_TARGET_DIR/auth-e2e"
node crates/hosting/tilo-room-service/dev/auth-e2e.mjs --bundle "$TMPDIR/auth-bundle" \
  --relay-bin "$bin/tilo-relay" --room-service-bin "$bin/tilo-room-service" --out "$CARGO_TARGET_DIR/auth-e2e" "${revision[@]}"
"""
env = { CARGO_PROFILE_RELEASE_LTO = "thin", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16", TILO_TEST_ASSET_SEED = "/target/test-assets" }
needs = ["test-assets"]
inputs = ["apps/**", "crates/**", "vendor/**", "scripts/moq-browser/**", "scripts/perf/browser_qualification.mjs", "tools/web/**", "tools/ci/ensure-browser-dependencies.sh", "tools/font-catalog.py", "Cargo.toml", "Cargo.lock"]
# The summary and a screenshot of each page it checks (`t outputs browser-auth-e2e`).
outputs = ["/target/auth-e2e/**"]
git = true
requires = ["arch=x86_64"]
on = ["stable", "dispatch"]
timeout_secs = 9000
cost = "heavy"
default = false

# Whose windows are whose on a room's shared desktop, end to end, on the
# stack browser-auth-e2e runs: crates/hosting/tilo-room-service/dev/
# shared-desktop-e2e.mjs has two guests and one of the room's moderators open,
# hover, drag and close each other's windows in headless Chrome, and
# photographs what each sees. `t outputs browser-shared-desktop-e2e` runs it
# and downloads the screenshots and its summary.
[[check]]
name = "browser-shared-desktop-e2e"
run = """
export TILO_FONT_ASSET_CACHE=$CARGO_TARGET_DIR/font-artifacts
python3 tools/font-catalog.py root crates/sdk/ui-core/assets/fonts --scope fixtures --cache "$TILO_FONT_ASSET_CACHE" >/dev/null
cargo build --locked --release -p tilo-relay --features agents --bin tilo-relay
cargo build --locked --release -p tilo-room-service
bin=$CARGO_TARGET_DIR/release
cp -r scripts/moq-browser "$TMPDIR/moq-browser"
TILO_MOQ_BROWSER_DIR=$TMPDIR/moq-browser crates/browser/tilo-browser-runtime/scripts/build.sh "$TMPDIR/desktop-bundle" --bundle desktop
bash tools/ci/ensure-browser-dependencies.sh
npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
if [ -z "$(git status --porcelain)" ]; then revision=(--expect-revision "$(git rev-parse HEAD)"); else revision=(--allow-dev); fi
rm -rf /target/shared-desktop-e2e
# The screenshots are what this is for: a failed check is in summary.json
# beside them, and the outputs are kept whatever happened.
node crates/hosting/tilo-room-service/dev/shared-desktop-e2e.mjs --bundle "$TMPDIR/desktop-bundle" \
  --relay-bin "$bin/tilo-relay" --room-service-bin "$bin/tilo-room-service" --out /target/shared-desktop-e2e "${revision[@]}" \
  || echo "shared-desktop-e2e: exited $? (see summary.json)"
"""
env = { CARGO_PROFILE_RELEASE_LTO = "thin", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16", TILO_TEST_ASSET_SEED = "/target/test-assets" }
needs = ["test-assets"]
inputs = ["apps/**", "crates/**", "vendor/**", "scripts/moq-browser/**", "scripts/perf/browser_qualification.mjs", "tools/web/**", "tools/ci/ensure-browser-dependencies.sh", "tools/font-catalog.py", "Cargo.toml", "Cargo.lock"]
git = true
requires = ["arch=x86_64"]
requirement = { cores = 8, memory = "32GiB" }
on = ["dispatch"]
cache = false
outputs = ["/target/shared-desktop-e2e/**"]
timeout_secs = 9000
cost = "heavy"
default = false

# Tenant and agent isolation of hosted rooms: one relay governing several
# tenants' rooms, the agents delegated into them and the host's compute, against
# both relay builds that ship (the default one and the room service's `agents`
# build). Each suite also runs with its crate's tests on main; this runs them together
# on release candidates, each test in its own process as the test family runs them. The
# relays run in process; nothing reaches a deployed host.
[[check]]
name = "security-isolation"
run = """
export TILO_TEST_ASSET_CACHE=$CARGO_TARGET_DIR/test-assets TILO_TEST_NTFS_FIXTURES=0
any() { local e="" t; for t; do e="${e:+$e | }test($t)"; done; printf '%s' "$e"; }
run() { bash tools/test-env.sh cargo nextest run --locked --profile ci --no-tests=fail "$@"; }
run -p tilo-relay --lib -E "$(any room_access rooms:: compute_content host_authority)"
run -p tilo-relay --test it -E "$(any tenant_isolation:: governed_rooms:: governed_workspace_access:: \
  room_admission:: auth_reject:: federation_cross_user_reject:: cross_user_workspace_host:: \
  compute_content:: remote_action_routing::)"
run -p tilo-relay --features agents --test it -E "$(any tenant_isolation:: governed_rooms:: \
  governed_workspace_access:: room_admission:: auth_reject:: compute_content:: persistent_room::)"
run -p tilo-agent-participant --test worker_isolation
run -p tilo-agent-participant --test room_actions -E "$(any governed_agent::)"
"""
env = { RUST_BACKTRACE = "1" }
inputs = ["apps/**", "crates/**", "vendor/**", "Cargo.toml", "Cargo.lock"]
# nextest's ci profile keeps its store and JUnit report under the source tree's target/.
writable_sources = true
on = ["stable", "dispatch"]
timeout_secs = 5400
cost = "heavy"
default = false

