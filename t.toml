[[ -z $BOOT_ASSESSMENT_IMAGE || ( $BOOT_ASSESSMENT_IMAGE =~ ^registry\.tilo\.so/tilo/tilo-vm@sha256:[0-9a-f]{64}$ \
   && $BOOT_ASSESSMENT_IMAGE != "$UPGRADE_IMAGE" && $SHARED_DISK_ESP == false && $DEV_UKI_BOOT == false ) ]] || {
