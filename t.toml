  setup::media_setup::protected_output::tests::protected_pending_area_actual_private_provisioning_and_replacement_refusal \
  setup::migration_handoff::linux::tests::unrelated_cgroup_namespace_root_preserves_storage_capture_and_cannot_be_selected \
  setup::prepared_setup::tests::authenticated_geometry_keeps_home_only_shape_and_refuses_unadmitted_inventory_marker \
  setup::prepared_setup::tests::offline_home_crypto_reopen_preserves_exact_selection_and_refuses_split_declaration \
  setup::prepared_setup::tests::pending_home_without_account_consent_refuses_selected_service_sessions
cd ../../../apps/imager
run_tests 1 /target/vm/imager-lib --exact --test-threads=1 \
  setup::journey::prepared_media_native::tests::awaiting_offline_export_public_state_never_becomes_completed_delivery
