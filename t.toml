[[check]]
name = "staging-loop"
run = "command -v mkfs.vfat >/dev/null && command -v mcopy >/dev/null && command -v mkfs.btrfs >/dev/null || dnf install -y -q --setopt=install_weak_deps=False dosfstools mtools btrfs-progs\ncargo build --locked -p imager --bin imager\nIMAGER=$CARGO_TARGET_DIR/debug/imager bash os/tests/staging_helper_loop.sh\nbash os/tests/staging_reclaim_loop.sh\n"
requires = ["disk-100g", "/dev/loop-control"]
isolation = "vm"
on = ["schedule:40 2 * * *", "dispatch"]

[[check]]
name = "native-tier1"
run = "TILO_NATIVE_TIER1_DIR=$TMPDIR/native-tier1 tools/native-tier1.sh --nocapture"
env = { TILO_FS_FUSE_REQUIRED = "0", TILO_REQUIRE_FUSE = "0" }
