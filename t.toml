[[check]]
name = "test-server-installer-medium-x86_64"
# QEMU and its firmware come from the packages below, which dnf fetches from Fedora's mirrors.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/install-packages.sh tools/ci/packages/signin-e2e.txt tools/ci/packages/qemu-x86_64.txt && bash tools/ci/server-installer-smoke.sh /target/publish/server-installer-medium/x86_64 $(cat /target/publish/host-sealed/digest) /target/server-installer-smoke"
needs = ["server-installer-medium-x86_64", "seal-host", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/server-installer-smoke/**"]
timeout_secs = 3600
# It boots the medium in a KVM guest of its own; a shrunken host leaves the
# guest's installer with too little memory to come up.
heavy = true
default = false

# A Linux machine another of the person's devices planned as a Tilo Server installs it
# unattended from a staged installer, a complete plan and a single-use token, and opens its
# encrypted disk with the owner's device on its first boot and again after
# `server.set-default-start`; the owner reads its recovery key back
# (os/dev/test-server-plan-install-cycle.sh). Two KVM guests: the machine (retained Fedora,
# an empty second disk staged from a privileged container on it) and the owner (the dev
# disk's headless session with a throwaway identity).
[[check]]
name = "server-plan-install-cycle"
# dnf in the guests installs from Fedora's mirrors, and the enrolment and unlock cross the
# public iroh relay of two user-mode networks; no fixed host list names either.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash os/dev/test-server-plan-install-cycle.sh --bundle-dir /target/publish/server-installer-bundle/x86_64 --imager /target/server-installer-imager/imager --owner-disk /target/publish/os-dev-disk/x86_64/disk/disk.qcow2 --release-tag imager-v0.0.0 --out /target/server-plan-install-cycle"
needs = ["server-installer-medium-x86_64", "server-installer-imager-x86_64", "os-dev-disk-lean-x86_64", "tilo-vm-binary-x86_64"]
# QEMU runs in the job sandbox, directly under the worker's VM, so the guests it boots are two
# virtualisation levels deep and not three: the image carries the emulator and its firmware.
image = { check = "image-os-vm-x86_64", path = "/target/publish/os-vm/x86_64/image.oci.tar" }
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "nested"
outputs = ["/target/server-plan-install-cycle/**"]
# What a failed run leaves: its steps, its guests' serials and QEMU logs, the owner's logs.
evidence = ["/target/server-plan-install-cycle/**"]
cache = false
git = true
timeout_secs = 10800
default = false
on = ["dispatch"]

# The base a retry of the server install proof starts from, built once from a commit of main and
# kept by digest: the installer medium's bundle with the development server image as its target,
# the test Imager that names that bundle, and the owner's dev disk, as one image
# (tools/ci/publish/server-plan-base.py). Its log ends with the base's commit and image by digest,
# which tools/ci/server-plan-base.env takes in a commit of its own, so the base moves only when
# someone dispatches this and commits that file, never with main.
[[check]]
name = "publish-server-plan-base"
# Takes an identity token from t (at its deployment's own address) to the registry: no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "set -euo pipefail\nout=/target/publish/server-plan-base\nrm -rf \"$out\" && mkdir -p \"$out\"\npython3 tools/ci/publish/server-plan-base.py pack \"$out\" \"$T_COMMIT\" bundle=/target/publish/server-installer-bundle-dev/x86_64/bundle imager=/target/server-installer-imager-dev/imager owner-disk.qcow2=/target/publish/os-dev-disk/x86_64/disk/disk.qcow2\nbash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-vm \"$out\" 'server-plan-base-{commit}'\nprintf 'COMMIT=%s\\nIMAGE=registry.tilo.so/tilo/tilo-vm@%s\\n' \"$T_COMMIT\" \"$(cat \"$out/digest\")\" > \"$out/base.env\"\ncat \"$out/base.env\"\nrm -rf \"$out/oci\""
# The compiles first: a check waits on its needs in the order they are named, and the first that
# ends without passing skips it, so a red compile answers a dispatch of this in the compile's own
# minutes instead of after the image, installer and disk stages behind it. They are needed through
# those stages anyway; named here they gate them.
needs = ["os-compile-x86_64", "os-compile-dev-x86_64", "server-installer-medium-dev-x86_64", "server-installer-imager-dev-x86_64", "os-dev-disk-lean-x86_64", "signing-tools"]
image = { check = "os-assembler-x86_64", path = "/target/os/x86_64/assembler/oci" }
requires = ["arch=x86_64", "disk-100g"]
isolation = "vm"
outputs = ["/target/publish/server-plan-base/receipt.json", "/target/publish/server-plan-base/base.env"]
timeout_secs = 3600
on = ["dispatch"]
id_token = ["registry.tilo.so"]
pointers = { server-plan-base = "/target/publish/server-plan-base/base.env" }

# A retry of the server install proof: what this tree changed since main's base, built as the
# tilo-vm layers `tilo-vm swap` installs, with the compiler cache and without link-time
# optimisation (tools/ci/server-plan-retry.sh layers). A change the base would have to be rebuilt
# for stops here, named. Kept by what it read, so the same tree and base build nothing again.
[[check]]
name = "server-plan-retry-layers"
egress = { to = ["code.tilo.so:443"] }
run = "bash tools/ci/server-plan-retry.sh layers /target/server-plan-retry-layers"
needs = ["tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm", CARGO_BUILD_JOBS = "32", CARGO_PROFILE_RELEASE_LTO = "off", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16" }
requires = ["arch=x86_64"]
outputs = ["/target/server-plan-retry-layers/**"]
git = true
timeout_secs = 3600
default = false

# The retry's base, unpacked from the registry by the digest tools/ci/server-plan-base.env names,
# outside the proof's VM (tools/ci/server-plan-retry.sh fetch). Kept by that file, so the retries
# on one base fetch it once.
[[check]]
name = "server-plan-base-fetch"
# The registry redirects each blob to its object store, whose address it names per request.
# Pinned: the image is named by digest (tools/ci/server-plan-base.env), and the fetch refuses a
# blob or a layer that doesn't match its digest, so a result is the base's whatever served it,
# and retries on one base are answered from the first fetch rather than fetching 25 GB again.
egress = { to = ["0.0.0.0/0", "::/0"], pinned = true }
run = "bash tools/ci/server-plan-retry.sh fetch /target/server-plan-base-fetch"
requires = ["arch=x86_64", "disk-100g"]
outputs = ["/target/server-plan-base-fetch/**"]
timeout_secs = 1800
default = false

# The retry itself: the proof run on the fetched base with this tree's layers in
# the installed server and the owner's device (tools/ci/server-plan-retry.sh proof), from a
# working tree: `t test server-plan-install-retry`.
[[check]]
name = "server-plan-install-retry"
# The base comes from the registry by digest; dnf in the guests installs from Fedora's mirrors, and
# the enrolment and unlock cross the public iroh relay; no fixed host list names them all.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/server-plan-retry.sh proof /target/server-plan-retry-layers /target/server-plan-base-fetch /target/server-plan-install-retry"
needs = ["server-plan-retry-layers", "server-plan-base-fetch", "tilo-vm-binary-x86_64"]
# The proof's QEMU runs in the job sandbox, as server-plan-install-cycle's does.
image = { check = "image-os-vm-x86_64", path = "/target/publish/os-vm/x86_64/image.oci.tar" }
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "nested"
outputs = ["/target/server-plan-install-retry/**"]
evidence = ["/target/server-plan-install-retry/**"]
cache = false
timeout_secs = 5400
default = false

# The complete graphical installation cycle on this tree's installer medium: the live installer
# driven only through the actions its own console publishes, the encrypted target opened by the
# passphrase after a cold power cycle, and the installed desktop's first login read off the
# framebuffer (os/dev/test-installer-cycle.sh).
[[check]]
name = "installer-cycle-x86_64"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "set -euo pipefail\nencoder_dir=\"$CARGO_TARGET_DIR/imager-profile\"\ncargo build --release --locked --manifest-path tools/imager-profile/Cargo.toml --target-dir \"$encoder_dir\"\nencoder=\"$encoder_dir/release/tilo-imager-profile\"\ntest -f \"$encoder\" && test ! -L \"$encoder\" && test -x \"$encoder\"\nencoder_sha256=\"$(sha256sum \"$encoder\" | awk '{print $1}')\"\nbash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-x86_64.txt tools/ci/packages/installer-cycle.txt\nrm -rf /var/tmp/tilo-installer-cycle\nTILO_PROFILE_ENCODER=\"$encoder\" TILO_PROFILE_ENCODER_SHA256=\"$encoder_sha256\" TILO_VM_DISPLAY=2d TILO_ACCEL=kvm TILO_DISTROBOX= TILO_MEM=8192 TILO_VM_CYCLE=installer-cycle TILO_INSTALLER_CYCLE_STORAGE=/var/tmp/tilo-installer-cycle TILO_BOOT_WAIT_SECS=1800 TILO_INSTALLER_CYCLE_MAX_INSTALL_SECONDS=3600 bash os/dev/test-installer-cycle.sh /target/publish/dev-installer-medium/x86_64/disk.qcow2 --graphics software --out /target/installer-cycle\n"
needs = ["dev-installer-medium-x86_64", "tilo-vm-binary-x86_64"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
outputs = ["/target/installer-cycle/**"]
# A failed run keeps what the guest and its installer said: the serial tail
# before the install begins and the installer's console state.
evidence = ["/target/installer-cycle/**"]
cache = false
git = true
timeout_secs = 10800
# It boots the medium in a KVM guest of its own; a shrunken host leaves the
# guest's installer with too little memory to come up.
heavy = true
default = false
on = ["dispatch"]

# The live installer medium a release publishes, from the release image this tree composes:
# the bootable qcow2, the raw payload the Imager downloads and writes with the catalog entry
# that names its bytes, and the internal bundle the Imager stages onto a machine's own disk
# (tools/ci/publish/installer-release-medium.sh). The medium is tools/ci/publish/installer-medium.sh's,
# the same build the server and development media use; the release image is the one
# os-release-image-{arch} composes, which the release seal and sign steps consume.
# The medium carries no release signature: signing its boot artifacts is the release signer's
# step, on the protected tag it runs on.
[[check]]
name = "medium/imager-{arch}"
# Pinned: it runs in the OS assembler image, which carries the install's tools, and the disk
# step installs from container storage, so it pulls no image.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443"], pinned = true }
run = "bash tools/ci/publish/installer-release-medium.sh {arch} /target/os/{arch}/release-image /target/imager-medium/{arch}"
needs = ["os-release-image-{arch}", "bootc-alongside-{arch}"]
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
env = { TILO_INSTALLER_BOOTC_ALONGSIDE = "/target/bootc-alongside/{arch}/bootc" }
requires = ["arch={arch}", "disk-100g"]
isolation = "vm"
outputs = ["/target/imager-medium/{arch}/**"]
timeout_secs = 14400
heavy = true
default = false
on = ["dispatch"]
[check.matrix]
arch = ["x86_64", "aarch64"]

# A release signs the medium it ships, in a keyring that exists only for the check: the payload
# and its digest are copied into the directory the release gathers a tag's media from, and the
# signature is made over those exact bytes. The public key and its fingerprint are the package
# sign step's, on x86_64, so a person verifies the medium with the same release key.
[[check]]
name = "sign/medium-{arch}"
run = "bash tools/ci/linux-imager/sign-medium.sh {arch} /target/imager-medium/{arch} /target/imager-medium-signed/{arch}"
needs = ["medium/imager-{arch}"]
image = "registry.tilo.so/tilo/ci-fast@sha256:c7be92bd00fa759dc586916e7bccbb93179fe7b358c6a05a12bc31d8ea48ab6f"
requires = ["arch={arch}"]
outputs = ["/target/imager-medium-signed/{arch}/*"]
cache = false
timeout_secs = 1800
on = ["tag:imager-v*"]
secrets = ["TILO_LINUX_SIGNING_KEY_ASC", "TILO_LINUX_EXPECTED_FINGERPRINT"]
[check.matrix]
arch = ["x86_64", "aarch64"]

# The complete graphical installation cycle on that medium: erase, prepared-alongside and
# guided-alongside (tools/ci/installer-release-cycle.sh). Each mode drives the live installer
# only through the actions its console publishes, unlocks the encrypted target after a cold
# power cycle, and reads the installed desktop's first login off the framebuffer; the alongside
# modes also prove the foreign Windows and Linux partitions and their shared ESP are unchanged.
[[check]]
name = "medium/cycle-{arch}"
# dnf installs from Fedora's mirrors, which are no fixed host list.
egress = { to = ["0.0.0.0/0", "::/0"] }
run = "bash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-{arch}.txt tools/ci/packages/installer-cycle.txt\nrm -rf /var/tmp/tilo-installer-release-cycle\nTILO_INSTALLER_CYCLE_STORAGE=/var/tmp/tilo-installer-release-cycle bash tools/ci/installer-release-cycle.sh /target/imager-medium/{arch} /target/imager-medium-cycle/{arch}\n"
needs = ["medium/imager-{arch}", "tilo-vm-binary-{arch}"]
