[[check]]
name = "imager-root-build"
requires = ["arch=x86_64"]
run = """
set -eu
mkdir -p "$CARGO_TARGET_DIR/vm"
binary_lib() {
  package=$1
  lib=$2
  name=$3
  executable=$(cargo test --locked -p "$package" --features "$package/installation" --lib --no-run --message-format json \
    | python3 -c 'import json, sys; messages = list(map(json.loads, sys.stdin)); print(next(m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == sys.argv[1]))' "$lib")
  cp "$executable" "$CARGO_TARGET_DIR/vm/$name"
}
binary_lib imager-backend imager_backend imager-backend-lib
binary_lib imager imager imager-lib
"""
outputs = ["/target/vm/imager-backend-lib", "/target/vm/imager-lib"]
# Too heavy for every commit of main: it runs on release candidates (`stable`), when dispatched,
# and on main's newest head when t has room (`idle`), keyed per commit and bisected to the commit
# that broke it. `t suggest` names it for a change that touches it.
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

[[check]]
name = "imager-root"
requires = ["arch=x86_64"]
isolation = "vm"
needs = ["imager-root-build"]
env = { TILO_REQUIRE_CHOWN = "1", TILO_REQUIRE_USERNS = "1", TMPDIR = "/var/tmp/tilo-test" }
run = """
set -eu
if [ "$(id -u)" != "0" ]; then
  echo "imager-root: expected euid 0 in the micro-VM, got $(id -u)" >&2
  exit 1
fi
mkdir -p "$TMPDIR"
# A filter that matches fewer tests still exits 0, so compare the reported count.
run_tests() {
  expected=$1
  shift
  output=$("$@" 2>&1) || { status=$?; printf '%s\\n' "$output"; return "$status"; }
  printf '%s\\n' "$output"
  case "$output" in
    *"skipping test"*) echo "selected fixture skipped: $*" >&2; return 1 ;;
  esac
  actual=$(printf '%s\\n' "$output" | sed -n 's/^test result: ok\\. \\([0-9][0-9]*\\) passed.*/\\1/p' | tail -n 1)
  if [ "${actual:-}" != "$expected" ]; then
    echo "expected $expected passing tests, got ${actual:-none}: $*" >&2
    return 1
  fi
}
cd crates/platform/imager-backend
run_tests 11 /target/vm/imager-backend-lib --exact --test-threads=1 \
  capture::original_caller::tests::original_credentials_come_from_actual_kernel_admitted_peer_and_expire_on_exit \
