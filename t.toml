[[check]]
name = "image-ci-sdk"
# Pinned: every byte it fetches is named by what it read. The base is the ci-fast image by digest,
# uv and bun are release assets named by version and checked against the SHA-256 the Containerfile
# holds, and the two SDK environments come from sdk/python/uv.lock and sdk/typescript/bun.lock,
# each naming its packages with their hashes. Nothing floats: the one input that did (an `unzip`
# from whichever build Fedora's repositories held) is gone, unpacked by the base's python3 instead
# (os/Containerfile.ci-sdk). The hosts are the ones those reads name — the registry for the base
# and the object storage its blobs redirect to, the release assets behind github.com's redirect,
# PyPI, and npm.
egress = { to = ["registry.tilo.so:443", "tilo-oci-registry-125650147312-us-west-2.s3.us-west-2.amazonaws.com:443", "github.com:443", "objects.githubusercontent.com:443", "release-assets.githubusercontent.com:443", "pypi.org:443", "files.pythonhosted.org:443", "registry.npmjs.org:443"], pinned = true }
run = "SOURCE_DATE_EPOCH=$(cat /target/source-date/ci-sdk)\nexport SOURCE_DATE_EPOCH\n# The SDKs' manifests and locks are the image's context: the pins and the dependencies they\n# name are baked in, so this context is the only thing the build reads.\ncontext=$TMPDIR/ci-sdk-context\nrm -rf \"$context\"\nmkdir -p \"$context/sdk/python\" \"$context/sdk/typescript\"\ncp sdk/python/pyproject.toml sdk/python/uv.lock \"$context/sdk/python/\"\ncp sdk/typescript/package.json sdk/typescript/bun.lock \"$context/sdk/typescript/\"\nbash tools/ci/publish/oci-build.sh \"$context\" os/Containerfile.ci-sdk /target/publish/ci-sdk\n"
needs = ["source-date-ci-sdk"]
image = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
requires = ["arch=x86_64"]
isolation = "vm"
outputs = ["/target/publish/ci-sdk/image.oci.tar", "/target/publish/ci-sdk/digest"]
default = false

