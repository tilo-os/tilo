# The desktop session for other distributions (release-desktop.yml, dist/): its packaging inputs,
# checked before anything is built: the install contract, the packaging scripts' syntax, the
# version each format carries, the RPM signing client's contract, the development session and
# the OS payload's contract, whose session tests build the flight recorder (tilo-session-record,
# dist/session/tests/build-flight-recorder.sh), so its key holds what that package reads. The
# login wrapper's refusals (dist/ci/run-dev-session-test.sh) need a non-root user created in a
# throwaway container, which a check can't do yet.
[[check]]
name = "desktop-preflight"
requires = ["arch=any"]
run = """
set -eu
python3 scripts/check-install-contract.py
bash -n dist/*.sh dist/*/*.sh dist/ci/proot-apt-key dist/arch/PKGBUILD
cc -fsyntax-only -Wall -Wextra -Werror dist/ci/qemu-argv0-wrapper.c
test "$(cat dist/VERSION)" = "$(sed -n 's/^pkgver=//p' dist/arch/PKGBUILD)"
grep -Fxq "%{!?tilo_version:%global tilo_version $(cat dist/VERSION)}" dist/rpm/tilo-session.spec
python3 -m unittest discover -s tools/tests -p test_rpm_broker.py
dist/ci/run-payload-contract-tests.sh
os/tests/portal_config_validity.sh
"""
# The payload contract records the source revision.
git = true
heavy = true
on = ["stable", "dispatch", "idle"]
default = false

