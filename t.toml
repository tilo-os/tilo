# The suite reads the whole tree (every blob's bytes, layout, references), and
# lists it through Git, which t's copy of the tree has no .git for.
[[check]]
name = "policy"
run = "bash tools/ci/t-git-index.sh bash tools/policy/run.sh"
inputs = ["**"]


# ---------------------------------------------------------------------------
# Fast quality (.forgejo/workflows/lint.yml), in whole-tree form.
#
# The diff-based lint.yml gates stay in the Git hooks, which see the change:
# changed-file rustfmt and Rust allow reasons (.githooks/pre-commit), commit
# messages and blob policy (tools/policy/check_commit_policy.py before a
# push). The tapp, runtime and web size-budget ratchets compare budget files
# with a base commit's and need Git history, which a t check does not have.

[[check]]
name = "fmt"
run = "cargo fmt --check"
inputs = ["**/*.rs", "rustfmt.toml", "Cargo.toml", "**/Cargo.toml", "Cargo.lock"]

# cargo-hakari ships in ci-fast, the image lint.yml runs in, not in the builder.
# ci-fast's rustup home has no update-hashes directory, and rustup's proxies
# fail creating it on a read-only root, so its checks put the toolchain's own
# binaries first on PATH.
[[check]]
name = "hakari"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
requires = ["arch=x86_64"]
run = """
if ! { cargo hakari generate --diff && cargo hakari manage-deps --dry-run; }; then
  echo "crates/workspace-hack is stale: run 'cargo hakari generate' and 'cargo hakari manage-deps', then commit the result (DEVELOPMENT.md, Dependency features)." >&2
  exit 1
fi
cargo hakari verify
"""
inputs = ["Cargo.toml", "**/Cargo.toml", "Cargo.lock", ".config/hakari.toml", "crates/workspace-hack/**"]

[[check]]
name = "deny"
run = "cargo deny --workspace check --hide-inclusion-graph"
inputs = ["Cargo.toml", "**/Cargo.toml", "Cargo.lock"]

# The whole-tree form of lint.yml's changed-crate scan.
[[check]]
name = "machete"
run = "bash tools/ci/t-git-index.sh bash tools/ci/check-unused-dependencies.sh"
inputs = ["**/Cargo.toml", "**/*.rs", ".gitignore", "tools/ci/check-unused-dependencies.sh", "tools/ci/t-git-index.sh"]

[[check]]
name = "app-lints"
run = "cargo run --locked --quiet -p tilo-app-cli --bin tilo-app -- check --lint --all"
inputs = ["**"]
cost = "minutes"
env = { CARGO_INCREMENTAL = "0", CARGO_PROFILE_DEV_DEBUG = "0" }

# ---------------------------------------------------------------------------
# Affected packages (.forgejo/workflows/check.yml), beyond the families above.
#
# The package families run every package whose inputs changed, which is what the
# affected-package shards select; a package that reads files outside its directory
# names them in tools/ci/suites.toml and gets them as package_inputs above, which
# covers the scoped reader tests (tools/ci/run_scoped_tests.py) by running the
# package's whole suite.

[[check]]
name = "workspace-layout"
run = """
bash tools/ci/t-git-index.sh ./scripts/check-workspace-complete.sh
bash tools/ci/t-git-index.sh python3 tools/policy/check_repository_layout.py
"""

# Shell, image-configuration and workflow invariants, in ci-fast, which carries
# their fixture tools. Not a default check yet: several invariants write to
# /var/tmp (installer and publication fixtures, rpmbuild's scratch directory),
# which a t check's read-only root does not allow. It needs t to give checks a
# writable /var/tmp, as a CI container has.
[[check]]
name = "security"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
env = { PATH = "/usr/local/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin" }
