# The mounted-resource disconnect/retry journey, built once and observed up to
# three times; each attempt's evidence and receipt are kept, and the first
# failure ends the run.
[[check]]
name = "mounted-reopen"
on = ["dispatch"]
run = """
rm -rf target/mounted-resource-recovery target/mounted-reopen-probe "$CARGO_TARGET_DIR/mounted-reopen-probe"
bash tools/ci/ensure-browser-dependencies.sh
npx --yes @puppeteer/browsers@2 install chrome@stable --path "$TMPDIR/chrome" | tee "$TMPDIR/chrome.txt"
export CHROME=$(awk '{print $2}' "$TMPDIR/chrome.txt" | tail -n 1)
status=0
SOURCE_SHA=$(git rev-parse HEAD) python3 -I tools/ci/mounted_reopen_probe.py run || status=$?
