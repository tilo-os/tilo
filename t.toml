# Every app's committed surface.toml against its code, on every change: an
# app's types, its actions and its stored fields are what the SDK's generated
# types, the OS's view of an app that is not running and another device's
# reading of its records are built from, so a surface behind its code is a
# wrong answer everywhere. One build of the whole application set, then each
# binary prints what it publishes; the example apps beside the tree are
# compared the same way, so a surface kept beside generated code cannot drift.
# Each app also commits its catalogue entry beside itself (`fleet.json`, for a
# tilolang package read from its own declaration), which is what search, the
# Store and the SDK know an app by while it is not installed; the entry is
# compared here, so the fleet the fleet-catalogue crate gathers from them at build
# time is what the apps declare. That crate refuses two apps claiming one id.
# Each binary is run in a network namespace of its own (`isolation`), so
# a report cannot wait on a network: what it publishes is what its code holds.
# A gate of main beside `check` (`gate`): a surface the committed files no longer match refuses
# every push that reaches the apps reading it, so a head that left one stale is told to its pusher
# at once.
[[check]]
name = "app-surfaces"
requires = ["arch=any"]
egress = { to = ["code.tilo.so:443"], pinned = true }
isolation = "nested"
gate = true
run = "cargo run --locked --quiet -p tilolang-cli --bin tilolang -- surfaces\ncargo run --locked --quiet -p tilolang-cli --bin tilolang -- surfaces examples\ncargo run --locked --quiet -p tilolang-cli --bin tilolang -- describe --fleet --check\npython3 -I tools/apps/generate_default_apps.py --check\n"
fix = "cargo run --locked --quiet -p tilolang-cli --bin tilolang -- surfaces --write\ncargo run --locked --quiet -p tilolang-cli --bin tilolang -- surfaces examples --write\ncargo run --locked --quiet -p tilolang-cli --bin tilolang -- describe --fleet --write\npython3 -I tools/apps/generate_default_apps.py\n"
env = { CARGO_PROFILE_DEV_DEBUG = "0" }

# The device's published surface, crates/desktop/device-surfaces/device-surface.json, against
# what the device publishes: the settings app and every package reading the device's resources are
# checked against the committed file, so a stale one refuses their pushes. A gate of main for that
# reason, as app-surfaces is. The crate's own test is the comparison; `t fix device-surface`
# writes the file.
[[check]]
name = "device-surface"
requires = ["arch=any"]
egress = { to = ["code.tilo.so:443"], pinned = true }
run = "cargo test --locked -p tilo-device-surfaces --lib the_device_surface_file_is_what_the_device_publishes"
fix = "UPDATE_SNAPSHOTS=1 cargo test --locked -p tilo-device-surfaces --lib the_device_surface_file_is_what_the_device_publishes"
gate = true

