# Tests that need a capability a test machine may not have, by capability.
#
# A capability marked `mapped` has every test that needs it listed here, each
# group with the probe that decides it (tilo_test_env::PROBES). A group's
# filter names packages and tests only: nextest refuses a binary() that a run
# does not build. Under the ci
# profile the setup script sets its TILO_REQUIRE_* variable, so such a test
# fails rather than skips when the capability is missing; and
# tools/ci/capability_filter.py runs the probes where the tests run first and
# leaves out each group whose probe fails, so the run reports those tests as
# not run, naming the capability. tools/ci/nextest.sh asks it for that filter
# before every run it makes, so a job t shards leaves them out exactly as a
# workflow's shard does. A plain `cargo test` asks for the same answer as
# libtest skips (tools/test-env.sh, tools/cargo-runner.sh), so it leaves them
# out too, and says so: a group there is a test(=NAME), or a test(/regex/) that
# is a literal, anchored or not at its start, which a skip can stand in for.
# A capability not yet mapped keeps the
# old behaviour: its tests skip with a message where it is missing.
#
# A test that fails with "TILO_REQUIRE_... is set but ... is unavailable"
# belongs in a group here.
#
# A group left out of every job that tests its package runs nowhere, and a
# passing run does not show it. So each group runs on main where its probe
# passes: in a t.toml cargo family whose isolation for its package gives the
# probe what it needs, or in the t.toml checks its `checks` names
# (tools/tests/test_capability_coverage.py holds every group to that).

[capabilities.UserNamespace]
variable = "TILO_REQUIRE_USERNS"
mapped = true

[[capabilities.UserNamespace.tests]]
# The seed test mounts in a private mount namespace.
probe = "mount-namespace"
checks = ["sandbox-host-ids"]
filter = "package(tilo-install-helpers) and test(=native_python::native_home_seeds)"

[[capabilities.UserNamespace.tests]]
# The tool builder's sandbox: root of a user namespace with an overlay.
probe = "bubblewrap-overlay"
checks = ["sandbox-host-ids"]
filter = "package(env-tools) and test(/^build::/)"

[[capabilities.UserNamespace.tests]]
# Fixtures and guests in a plain bubblewrap sandbox.
probe = "bubblewrap"
filter = """\
(package(runtime-bundle) and test(/component_pins::/)) \
or (package(ush) and (test(/^helper_runtime::/) or test(/^network::/) or test(/^serve_handoff::/) or test(/^runtime_dir::/))) \
or (package(settings) and test(/keyboard_preview::/)) \
or (package(tilo-net) and test(=a_ca_installed_in_the_store_is_trusted_by_default))"""

[capabilities.NetworkTunnel]
variable = "TILO_REQUIRE_TUN"
mapped = true

[[capabilities.NetworkTunnel.tests]]
probe = "network-tunnel"
checks = ["device-vpn-namespaces"]
filter = """\
package(tilo-device-vpn) and (test(=packets_cross_two_network_namespaces) \
or test(=the_block_comes_and_goes_with_the_profile_state) \
or test(=a_caller_other_than_the_seats_shell_is_refused) \
or test(=a_block_left_by_a_crashed_helper_is_kept_until_reset_at_boot) \
or test(=a_block_left_by_a_crashed_session_is_taken_over_by_the_next))"""

# The tests that observe what an ordinary account may not read ran as the image's test user
# before: a root job passed them vacuously. They state that premise and run in the micro-VM
# checks `identity-accounts` and `identity-accounts-build` (t.toml), under setpriv --reuid=1000.
[capabilities.NonRoot]
variable = "TILO_REQUIRE_NONROOT"
mapped = true

[[capabilities.NonRoot.tests]]
probe = "non-root-identity"
checks = ["identity-accounts"]
filter = """\
(package(tilo-device-identity) and test(=persist::tests::an_unreachable_device_key_is_an_error_not_a_fresh_machine)) \
or (package(tilo-files) and test(=provisioning_flushes_every_barrier_and_keeps_what_a_failure_left)) \
or (package(windows-vm) and test(=owner_status::tests::the_owner_status_summary_reads_state_and_runtime_status_safely)) \
or (package(tilo-secrets) and test(=owner_migration::chromium::tests::owner_scope_refuses_files_and_elevation_without_contacting_a_keyring)) \
or (package(runtime-portal) and test(=descriptors::tests::a_peer_that_cannot_be_traced_still_hands_over_its_descriptor)) \
or (package(linux-vm) and test(=hosted::jail::tests::only_a_root_owned_configuration_is_read)) \
or (package(tilo-identity) and test(=person_files::tests::a_symlinked_or_foreign_identity_directory_is_refused))"""

# The tests that observe what only root may do, for the same reason, in the same checks under
# the guest's own root. A launcher test that enters a mount namespace of its own is root's too:
# a user namespace's root cannot bind the host's filesystems, and a job sandbox's
# capability-dropped root holds no mount privilege.
[capabilities.Root]
variable = "TILO_REQUIRE_ROOT"
mapped = true

[[capabilities.Root.tests]]
probe = "root-identity"
checks = ["identity-accounts", "launcher-root"]
filter = """\
(package(tilo-identity) and test(=person_files::tests::root_writes_into_a_persons_directory_only_as_the_person)) \
or (package(tilo-files) and test(=native::atomic::directory::retained_foundation_tests::a_held_store_publishes_and_validates_through_the_directory_it_holds)) \
or (package(launcher) and test(=system_view::the_view_exposes_exactly_what_per_path_binds_did))"""
