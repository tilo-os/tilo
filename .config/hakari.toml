# Settings for `cargo hakari`: https://docs.rs/cargo-hakari/latest/cargo_hakari/config
#
# crates/workspace-hack depends on every third-party crate that workspace
# members build with more than one feature set, with the union of those
# features, and every managed member depends on it. Any selection of `-p`
# packages then compiles each shared dependency identically, so CI slots and
# sccache reuse one build instead of one per package set. After changing a
# dependency or its features, run `cargo hakari generate` and
# `cargo hakari manage-deps`; t's `hakari` check fails until both are clean.

hakari-package = "workspace-hack"
dep-format-version = "4"
resolver = "2"

# Members name `workspace-hack = { version = "0.1" }` and the root manifest's
# `[patch.crates-io]` points it at crates/workspace-hack. Workspaces outside
# this one that reach members by path (fuzz/, tilo-doc-codec-markdown-wasm) have no
# patch and resolve crates.io's empty workspace-hack 0.1.0 instead, so neither
# their lockfiles nor a wasm32 build take on the host dependency set.
workspace-hack-line-style = "version-only"
#
# The unified set is native (tokio `net` pulls mio, which refuses wasm32), and
# most of it lands in the hack's unconditional `[dependencies]`. Members the
# browser also builds for wasm32 therefore name the hack under
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`; manage-deps
# accepts that, and tools/policy/check_wasm_workspace_hack.py names a member
# that picked up the unconditional line.

# CI builds and tests Linux on both architectures. Other hosts (Imager on
# Windows and macOS) still receive the platform-independent section.
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# unify-target-host stays at its default, which replicates target features on
# the host because the workspace has a proc macro. Native builds, all of CI,
# then share host and target units; syn, serde and every proc macro built on
# them no longer vary with the selection. A cross build (Imager for Windows or
# macOS) compiles the unified set for its Linux or macOS host as well.

[traversal-excludes]
# frame-link's demo draws text with cosmic-text but without the toolkit, so it
# reaches cosmic-text's skrifa 0.40 / read-fonts 0.37 with fewer features than
# the toolkit's graph (where tilo-pdf turns on their defaults). Counting it
# would put both font crates into the hack, and so into every managed member's
# build; a development demo is not worth that. It builds its own graph.
#
# tilo-winit-x11 is the one place winit's X11 backend is turned on: the
# shell's hosted backend builds winit with X11, apps without (the toolkit's
# `x11` feature), so winit is deliberately built with two feature sets.
# Counted, that split would either put winit's X11 backend, x11rb and x11-dl
# into the hack and so into the shared runtime every sandboxed app maps,
# where no X server is reachable, or, with winit in final-excludes, fail
# `cargo hakari verify`: verify re-resolves an excluded crate's union on its
# own, and every crate below winit then shows up with a feature set no
# member builds. Skipping the crate that holds the X11 edge leaves winit with
# one feature set in the analysis, so winit, its keyboard loader and all of
# their dependencies are unified and verified like any other crate. X11
# builds add only X11 crates on top: what x11rb and x11-dl ask of shared
# crates (libc, once_cell, rustix, tracing, ...) is within the hack's union.
#
# workspace-unify depends on every library with the features the whole
# workspace builds it with (tools/ci/workspace_unify.py): counted, it would be
# every crate's union at once, and the hack would take all of them.
workspace-members = ["frame-link", "tilo-winit-x11", "workspace-unify"]
# Every managed member builds every crate listed in the hack, so none may need
# a system library: server containers (tilo-relay, registry-server) and cross
# builds have no desktop development packages. Media stays optional
# everywhere: hermetic builds, `--shots` and CI must not need gstreamer-1.0.
third-party = [
    # Wayland system linkage belongs to platform-selected clients/servers.
    # A global feature union would make portable metadata and cross builds
    # require the Linux client library even when native transport is disabled.
    { name = "wayland-backend", path = "vendor/wayland-backend" },
    { name = "wayland-client" },
    { name = "wayland-sys" },
    # Protocol crates also enable wayland-client transitively. Keeping them in
    # the platform-independent union makes Windows builds compile Unix APIs.
    { name = "wayland-protocols" },
    { name = "wayland-protocols-misc" },
    { name = "wayland-protocols-wlr" },
    { name = "gstreamer" },
    { name = "gstreamer-app" },
    { name = "gstreamer-base" },
    { name = "gstreamer-video" },
    # Its build script requires xkbcommon from pkg-config. zstd-sys builds its
    # bundled sources, so it may stay.
    { name = "smithay-client-toolkit" },
    # The peer transport belongs to the hosts: tilo-desktop is managed and
    # must never reach iroh (tools/policy/check_desktop_model_dependencies.py).
    { name = "iroh", path = "vendor/iroh" },
    { name = "iroh-base" },
    { name = "iroh-dns" },
    { name = "iroh-metrics" },
    { name = "iroh-relay" },
    # A vendored YouTube client only the Tube app uses; server images and
    # the builder canary must not compile it.
    { name = "rustypipe", path = "vendor/rustypipe" },
    # The model gateway's pinned Rig turns on serde_json's `float_roundtrip`
    # (and ordered-float). Counted, the hack handed them to every Linux build,
    # so every app compiled serde_json's slow-path float parser into its own
    # JSON decoding: 13 to 28 KB of each aarch64 tapp (Monitor 1,168,896 ->
    # 1,141,248 B). The gateway still builds them as Rig asks.
    { name = "rig-core", path = "vendor/rig-core" },
]

[final-excludes]
# These members keep their own dependency graph. Built with managed members
# they still receive the unified features; built alone they do not.
# - tilo-desktop-model must not reach host stacks through any dependency
#   (tools/policy/check_desktop_model_dependencies.py), so neither it nor any
#   member it depends on may depend on workspace-hack. When that policy reports
#   a host stack after desktop-model gains a member dependency, list it here.
# - tilo-crypto is also built standalone from registry dependencies only
#   (os/kernel/project-crate.py).
# - tilo-vm and its protocol are the tilo-vm Windows CLI's whole
#   workspace graph; keep that cross build to the crates it uses.
# - install-profile-model is also built by the isolated tools/imager-profile
#   workspace, which must not resolve the application workspace.
# - tilo-advisory-lock is the builder image's sccache canary, compiled cold into
#   an empty namespace (tools/ci/publish/ci-builder-canary.sh); it must stay small.
workspace-members = [
    # resolves the others' features and builds nothing (tools/ci/workspace_unify.py)
    "workspace-unify",
    # tilo-desktop-model and its member dependencies
    "collab-types",
    "desktop-policy",
    "tilo-action-policy",
    "tilo-actions",
    "tilo-automation",
    "tilo-automerge",
    "tilo-clock",
    "tilo-lock",
    "tilo-sort",
    "tilo-face",
    "tilo-content",
    "tilo-desktop-model",
    "wire-frame",
    # standalone registry-only build
    "tilo-crypto",
    # tilo-vm Windows CLI
    "tilo-vm",
    "tilo-vm-protocol",
    # also built by the isolated tools/imager-profile workspace
    "install-profile-model",
    # builder sccache canary
    "tilo-advisory-lock",
    # The [patch.crates-io] replacement for rustls-native-certs sits below
    # third-party crates the hack itself depends on (rustls-platform-verifier),
    # so depending on the hack would be a cycle.
    "rustls-native-certs",
]
# A -sys crate in the hack is linked into runtime-dylib, whose exports carry
# Rust symbols only. A thin app that monomorphises its safe wrapper (Imager's
# zstd Reader) then references C symbols no library provides and fails to link.
# Keep such crates out of the hack so each user links its own copy.
third-party = [
    { name = "zstd" },
    { name = "zstd-safe" },
    { name = "zstd-sys" },
]
