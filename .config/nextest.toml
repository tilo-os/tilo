[profile.default]
# Report and terminate hung tests.
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

# Also the profile for the whole suite outside CI, under tools/test-env.sh;
# DEVELOPMENT.md ("The whole suite, as CI runs it") has the command, which keeps
# the visual goldens (GOLDEN_FILTER in the workflows) for an idle renderer.
[profile.ci]
# A test still running after 30 s prints a SLOW line each period, so a log
# shows where shard time goes while it runs; tools/ci/nextest_report.py lists
# the slowest tests from the JUnit report. The hang bound stays 30 s x 16 = 8 min.
slow-timeout = { period = "30s", terminate-after = 16 }
failure-output = "immediate-final"
fail-fast = false
# Permit one retry for timing-sensitive GPU and socket tests. A retried test
# is still reported: TRY 2 lines while running, FLAKY in the final summary,
# and tools/ci/nextest_report.py lists both from the JUnit report.
retries = 1
status-level = "slow"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# The apps and launcher the shell's end-to-end tests run, built beside the
# shell's own binaries in check.yml, travel with a test archive so the
# partitions that run from it find them in target/ as a local build does.
[profile.ci.archive]
include = [
  { path = "debug/notes", relative-to = "target", on-missing = "ignore" },
  { path = "debug/chat", relative-to = "target", on-missing = "ignore" },
  { path = "debug/tilo-launcher", relative-to = "target", on-missing = "ignore" },
]

# Process-isolated compositor, GPU, and collaboration tests need shared limits.
#
# Nextest starts tests in order and a test that needs every thread waits for
# all running tests to finish, idling the rest of the pool. Tests that take the
# whole pool therefore have the highest priority: they run back to back while
# the pool is still empty. The two-wide compositor group and the longest tests
# follow, so a run ends on short tests.
[test-groups]
compositor = { max-threads = 2 }
gpu-golden = { max-threads = 1 }
agent-collaboration = { max-threads = 1 }
lan-pairing = { max-threads = 1 }
imager-durable-disk = { max-threads = 2 }
cloud-host-workers = { max-threads = 4 }

# Golden rendering shares Vulkan resources across test processes.
[[profile.default.overrides]]
filter = '(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline))) or (package(shell) and (test(e2e_shell_flows::) or test(sidebar_wheel_disc_snapshot::)))'
test-group = "gpu-golden"

[[profile.ci.overrides]]
filter = '(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline))) or (package(shell) and (test(e2e_shell_flows::) or test(sidebar_wheel_disc_snapshot::)))'
test-group = "gpu-golden"

[[profile.default.overrides]]
filter = 'binary(it) and (test(clipboard_e2e::) or test(interaction_test::) or test(wayland_test::))'
test-group = "compositor"
priority = 90

[[profile.ci.overrides]]
filter = 'binary(it) and (test(clipboard_e2e::) or test(interaction_test::) or test(wayland_test::))'
test-group = "compositor"
priority = 90

# Collaboration suites (modules of the agent `it` binary) share bounded socket
# resources, so they run one at a time beside the rest of the pool.
[[profile.default.overrides]]
filter = 'package(agent) and binary(it) and (test(presence_semantics::) or test(relay_roundtrip::) or test(discovered_operations::) or test(concurrent_edit::))'
test-group = "agent-collaboration"
priority = 100

[[profile.ci.overrides]]
filter = 'package(agent) and binary(it) and (test(presence_semantics::) or test(relay_roundtrip::) or test(discovered_operations::) or test(concurrent_edit::))'
test-group = "agent-collaboration"
priority = 100

# This real-time codec test needs an uncontended CPU budget.
[[profile.default.overrides]]
filter = 'package(shell) and binary(it) and test(flatpak_share_e2e::session_delivers_30_frames_in_3_seconds_at_bounded_latency)'
threads-required = "num-cpus"
priority = 100

[[profile.ci.overrides]]
filter = 'package(shell) and binary(it) and test(flatpak_share_e2e::session_delivers_30_frames_in_3_seconds_at_bounded_latency)'
threads-required = "num-cpus"
priority = 100

# Native-4K renderer tests need an uncontended CPU budget.
[[profile.default.overrides]]
filter = 'package(shell) and (test(shell::frame::retained_tests::native_4k_legacy_and_segmented_shell_frames_match_through_quick_settings_cycle) or test(shell::frame::retained_tests::native_4k_retained_quick_settings_damage_covers_large_shadow_and_matches_dense) or test(shell::frame::retained_tests::workspace_root_rebuild_forces_dense_boundary_and_keeps_live_topbar_pixels) or test(native_4k_framebuilder_actions_match_current_staging_for_one_and_two_targets) or test(native_4k_retained_pixels_match_dense_oracle_for_benchmark_actions))'
threads-required = "num-cpus"
priority = 100

[[profile.ci.overrides]]
filter = 'package(shell) and (test(shell::frame::retained_tests::native_4k_legacy_and_segmented_shell_frames_match_through_quick_settings_cycle) or test(shell::frame::retained_tests::native_4k_retained_quick_settings_damage_covers_large_shadow_and_matches_dense) or test(shell::frame::retained_tests::workspace_root_rebuild_forces_dense_boundary_and_keeps_live_topbar_pixels) or test(native_4k_framebuilder_actions_match_current_staging_for_one_and_two_targets) or test(native_4k_retained_pixels_match_dense_oracle_for_benchmark_actions))'
threads-required = "num-cpus"
priority = 100

# Shared GPU targets use real devices and deterministic completion fault seams. Keep their
# adapter/copy/overflow oracles exclusive of other tests in normal and CI selections.
[[profile.default.overrides]]
filter = 'package(shell) and test(shell::render::paint::tests::gpu_target_)'
threads-required = "num-cpus"
priority = 100

[[profile.ci.overrides]]
filter = 'package(shell) and test(shell::render::paint::tests::gpu_target_)'
threads-required = "num-cpus"
priority = 100

# These render complete application/compositor frames and are intentionally
# expensive. Running them beside the rest of a 10k-test shard saturates the
# runner's memory/CPU budget and turns bounded animations into timeouts.
[[profile.default.overrides]]
filter = '(package(notes) and binary(it) and (test(screenshot_critique::) or test(capture_runtime::))) or (package(shell) and binary(it) and test(foreign_surface_compositing::))'
threads-required = "num-cpus"
priority = 100

[[profile.ci.overrides]]
filter = '(package(notes) and binary(it) and (test(screenshot_critique::) or test(capture_runtime::))) or (package(shell) and binary(it) and test(foreign_surface_compositing::))'
threads-required = "num-cpus"
priority = 100

# Nearby enrollment binds the fixed LAN pairing port and answers broadcast
# solicitations, so two approvals in parallel processes would cross-talk.
[[profile.default.overrides]]
filter = 'package(tilo-relay) and (test(nearby_) or test(personal_device_process::))'
test-group = "lan-pairing"

[[profile.ci.overrides]]
filter = 'package(tilo-relay) and (test(nearby_) or test(personal_device_process::))'
test-group = "lan-pairing"

# The imager's migration, cache and download tests fsync journals and
# payloads on the real disk that CI qualifies for them. Dozens at once queue
# behind each other's flushes until their worker deadlines expire, so they
# share a cap.
[[profile.default.overrides]]
filter = 'package(imager) and (test(/^setup::import_view::tests::/) or test(/^setup::desktop_continuation::tests::/) or test(/^setup::migration_worker::tests::/) or test(/^setup::internal_cache::/) or test(/^setup::internal_download::/) or test(/^setup::internal_download_flow::/))'
test-group = "imager-durable-disk"

[[profile.ci.overrides]]
filter = 'package(imager) and (test(/^setup::import_view::tests::/) or test(/^setup::desktop_continuation::tests::/) or test(/^setup::migration_worker::tests::/) or test(/^setup::internal_cache::/) or test(/^setup::internal_download::/) or test(/^setup::internal_download_flow::/))'
test-group = "imager-durable-disk"

# Each of these runs a whole Cloud agent host in-process: the certified
# broker, the Writer, Chat and Notes workers and an enrolled Agent client, each
# on its own threads. Started together at the head of a shard they starve each
# other until the product's own handshake bounds (the SDK's primary route
# timeout, the owner's turn budget) expire, so a few run at a time.
[[profile.default.overrides]]
filter = 'package(tilo-cloud-host) and (test(/^agent_workers::enrolled_handoff_tests::/) or test(/_with_actual_agent_runtime_/))'
test-group = "cloud-host-workers"

[[profile.ci.overrides]]
filter = 'package(tilo-cloud-host) and (test(/^agent_workers::enrolled_handoff_tests::/) or test(/_with_actual_agent_runtime_/))'
test-group = "cloud-host-workers"

# The longest tests (15-180 s each in CI) start right after the pool-wide ones.
[[profile.default.overrides]]
filter = '(package(fs) and (test(/^fs::checked_restore::tests::/) or binary(collab_release_matrix))) or (package(shell) and (test(=shell::collab_history::tests::history_outlives_the_memory_window_and_a_restart) or binary(shots))) or (package(media) and test(/^real::/)) or (package(imager) and test(/^setup::staging::fake::tests::/)) or (package(notes) and binary(it) and test(/^canonical_import::/)) or (package(scratchpad) and binary(native_proof)) or (package(tilo-rollback) and binary(mechanism)) or (package(tilo-automerge) and binary(patch_log_memory)) or (package(tilo-relay) and (binary(held_memory) or test(/^daemon::tests::/) or test(=store::replay::tests::bounded_snapshot_pins_orders_counts_and_hydrates_only_its_batch) or test(=store::shell_selection::tests::projected_checkpoint_prefix_exposes_the_route_count_cutoff) or test(=peer::private_transport_tests::thirty_four_route_prefix_uses_one_all_original_selection_then_converges))) or (package(tilo-cloud-host) and (test(=agent_workers::tests::cloud_worker_set_follows_open_windows_over_ninety_cycles) or test(=delivery::retention::growth_tests::store_stays_bounded_over_many_agent_steps_refreshes_and_retries) or test(=tests::compact_bootstrap_stays_small_beyond_sixty_four_devices) or test(=agent_workers::enrolled_handoff_tests::participant_stream_tests::streamed_type_text_continues_the_appended_paragraph) or test(=desktop_commands::tests::fifty_open_close_cycles_keep_the_catalogue_bounded))) or (package(tilo-device-host) and binary(owner_retention)) or (package(tilo-ui) and (binary(held-memory) or test(/^incremental_render_regressions::/) or test(/^app::large_document_tests::/) or test(/^app::semantic_tree_app_tests::/) or test(/^presence::render::tests::/))) or (package(video-editor) and (test(/^export::tests::/) or test(/^shot::tests::/))) or (package(app-state) and test(/^fs_store::tests::/))'
priority = 50

[[profile.ci.overrides]]
filter = '(package(fs) and (test(/^fs::checked_restore::tests::/) or binary(collab_release_matrix))) or (package(shell) and (test(=shell::collab_history::tests::history_outlives_the_memory_window_and_a_restart) or binary(shots))) or (package(media) and test(/^real::/)) or (package(imager) and test(/^setup::staging::fake::tests::/)) or (package(notes) and binary(it) and test(/^canonical_import::/)) or (package(scratchpad) and binary(native_proof)) or (package(tilo-rollback) and binary(mechanism)) or (package(tilo-automerge) and binary(patch_log_memory)) or (package(tilo-relay) and (binary(held_memory) or test(/^daemon::tests::/) or test(=store::replay::tests::bounded_snapshot_pins_orders_counts_and_hydrates_only_its_batch) or test(=store::shell_selection::tests::projected_checkpoint_prefix_exposes_the_route_count_cutoff) or test(=peer::private_transport_tests::thirty_four_route_prefix_uses_one_all_original_selection_then_converges))) or (package(tilo-cloud-host) and (test(=agent_workers::tests::cloud_worker_set_follows_open_windows_over_ninety_cycles) or test(=delivery::retention::growth_tests::store_stays_bounded_over_many_agent_steps_refreshes_and_retries) or test(=tests::compact_bootstrap_stays_small_beyond_sixty_four_devices) or test(=agent_workers::enrolled_handoff_tests::participant_stream_tests::streamed_type_text_continues_the_appended_paragraph) or test(=desktop_commands::tests::fifty_open_close_cycles_keep_the_catalogue_bounded))) or (package(tilo-device-host) and binary(owner_retention)) or (package(tilo-ui) and (binary(held-memory) or test(/^incremental_render_regressions::/) or test(/^app::large_document_tests::/) or test(/^app::semantic_tree_app_tests::/) or test(/^presence::render::tests::/))) or (package(video-editor) and (test(/^export::tests::/) or test(/^shot::tests::/))) or (package(app-state) and test(/^fs_store::tests::/))'
