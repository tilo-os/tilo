# Setup scripts give the ci profile's runs their test environment (below).
experimental = ["setup-scripts"]

[profile.default]
# Report and terminate hung tests.
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

# Also the profile for the whole suite outside CI; it keeps the visual goldens
# (.config/nextest-filters.toml) for an idle renderer.
[profile.ci]
# A test still running after 30 s prints a SLOW line each period, so a log
# shows where shard time goes while it runs. The hang bound stays 30 s x 16 = 8 min.
slow-timeout = { period = "30s", terminate-after = 16 }
failure-output = "immediate-final"
fail-fast = false
# No second attempt. A test that fails on the first run fails the job.
# Timing-sensitive tests pin their clock or wait on the production signal;
# a retry would record that race as FLAKY and let the shard pass.
retries = 0
# Name leaked subprocess handles as well as slow and failed tests. JUnit's
# passing test records do not identify leaks, and ordinary passes stay quiet.
status-level = "leak"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# The ci profile's test environment, set up by nextest itself on the machine
# that runs the tests, wherever cargo runs them (a CI container, a developer
# machine, a remote builder): lavapipe, PDFium, the shared fixture cache, the
# TILO_REQUIRE_* capabilities the image promises and a private audio endpoint
# for the run's lifetime; the native NTFS images only for a run that selects a
# test reading them. tools/test-env-setup.sh describes each step; every test
# binary also runs in tools/with-test-environment.sh (tools/cargo-runner.sh).
[scripts.setup.test-runtime]
command = ["bash", "tools/test-env-setup.sh", "runtime"]

[scripts.setup.headless-audio]
command = ["bash", "tools/test-env-setup.sh", "audio"]

[scripts.setup.ntfs-fixtures]
command = ["bash", "tools/test-env-setup.sh", "ntfs"]

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "all()"
setup = ["test-runtime", "headless-audio"]

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-ntfs-helper)"
setup = "ntfs-fixtures"

# Process-isolated compositor, GPU, and collaboration tests need shared limits.
#
# Nextest starts tests in order and a test that needs every thread waits for
# all running tests to finish, idling the rest of the pool. Tests that take the
# whole pool therefore have the highest priority: they run back to back while
# the pool is still empty. The four-wide compositor group and the longest tests
# follow, so a run ends on short tests.
[test-groups]
compositor = { max-threads = 4 }
desktop-smoke = { max-threads = 1 }
gpu-golden = { max-threads = 1 }
agent-collaboration = { max-threads = 1 }
imager-durable-disk = { max-threads = 2 }
agent-participant-sessions = { max-threads = 2 }

# Golden rendering shares Vulkan resources across test processes.
[[profile.default.overrides]]
filter = '(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline))) or (package(shell) and test(e2e_shell_flows::))'
test-group = "gpu-golden"

[[profile.default.overrides]]
filter = 'binary(it) and (test(clipboard_e2e::) or test(interaction_test::) or test(wayland_test::))'
test-group = "compositor"
priority = 90

# The desktop smoke gate: one at a time, so the load variant's busy threads
# never starve the quiet one, and a hang bound of two minutes, since a healthy
# run takes well under one. A frozen compositor is reported by the test itself
# within half a second; this only bounds a test that cannot even do that.
# Its idle reading (CPU by thread, and what woke the compositor's loop) is
# printed on a pass too, so a drift toward the bound shows in every CI log
# before a run crosses it.
[[profile.default.overrides]]
filter = 'binary(it) and test(desktop_smoke::)'
test-group = "desktop-smoke"
priority = 95
slow-timeout = { period = "60s", terminate-after = 2 }
success-output = "final"

# Not started with the pool-wide and longest tests: each suite's first route
# join runs under the SDK's 4.5 s primary-route deadline, which the opening
# burst of a whole-workspace shard (every slot starting a process at once)
# exceeds.
[[profile.default.overrides]]
filter = 'package(agent) and binary(it) and test(presence_semantics::)'
test-group = "agent-collaboration"

# The native-4K, XRGB-history and GPU-target oracles render and read back
# whole 3840x2160 frames through the software renderer. They assert pixels,
# not time, so they need a share of the cores rather than the whole pool:
# taking the whole pool made a shell run spend its first minute on them one
# at a time with every other test waiting.
[[profile.default.overrides]]
filter = 'package(shell) and (test(shell::frame::retained_tests::native_4k_legacy_and_segmented_shell_frames_match_through_quick_settings_cycle) or test(shell::frame::retained_tests::native_4k_retained_quick_settings_damage_covers_large_shadow_and_matches_dense) or test(shell::frame::retained_tests::workspace_root_rebuild_forces_dense_boundary_and_keeps_live_topbar_pixels) or test(native_4k_framebuilder_actions_match_current_staging_for_one_and_two_targets) or test(native_4k_retained_pixels_match_dense_oracle_for_benchmark_actions) or test(native_4k_modal_layers_match_between_dense_and_retained_frames))'
threads-required = 16
priority = 100

[[profile.default.overrides]]
filter = 'package(shell) and test(shell::render::paint::tests::gpu_target_)'
threads-required = 16
priority = 100

# The loopback peer-sync latency measurements (a 50 ms p95, an edit from one
# device through the room's host to another) are wall-clock and run only when
# asked for with --ignored; sharing the runner with the parallel suite would
# measure scheduler contention instead of the push path, so they run with the
# pool to themselves.
[[profile.default.overrides]]
filter = 'package(shell) and test(=shell::network::one_host_tests::edit_latency::a_note_edit_reaches_the_other_device_within_the_interactive_budget)'
threads-required = "num-cpus"
priority = 100

# The idle-work counts build a whole fixture desktop for each of their 64
# repetitions (several seconds each in a debug build on a busy node) and run
# its real pump and park selector on virtual instants; they finish in seven to
# nine minutes, past the CI profile's eight-minute hang bound.
[[profile.default.overrides]]
filter = 'package(shell) and test(/^compositor::native::idle_work_tests::/)'
slow-timeout = { period = "60s", terminate-after = 16 }

# The native voice round trip paces 50 Opus frames a second for real and
# holds each received frame 200 ms (the voice receive budget) before it counts
# as late. Beside the parallel suite the drain loop stalls past that budget
# under scheduler contention (208 of 250 delivered, 33-42 late, none lost),
# which measures the runner, not the transport; its delivery, tone and latency
# assertions stay as they are and it runs with the pool to itself.
[[profile.default.overrides]]
filter = 'package(shell) and test(=network::native_media::audio_tests::native_opus_moq_voice_roundtrip_both_directions_with_tone_and_latency)'
threads-required = "num-cpus"
priority = 100

[[profile.default.overrides]]
filter = '(package(notes) and binary(it) and (test(scenarios::) or test(capture_runtime::))) or (package(shell) and binary(it) and test(foreign_surface_compositing::))'
threads-required = 16
priority = 100

[[profile.default.overrides]]
filter = 'package(imager) and (test(/^setup::import_view::tests::/) or test(/^setup::desktop_continuation::tests::/) or test(/^setup::migration_worker::tests::/) or test(/^setup::internal_cache::/) or test(/^setup::internal_download::/) or test(/^setup::internal_download_flow::/))'
test-group = "imager-durable-disk"

# Each tilo-agent-participant integration test runs a relay host, agents and
# browser sessions that drive every web app natively against fixed deadlines;
# the all-app coverage runs starve a concurrent session of the CPU it needs.
[[profile.default.overrides]]
filter = 'package(tilo-agent-participant) and kind(test)'
test-group = "agent-participant-sessions"

# A thousand keystrokes, each a durable relay commit (file and directory
# fsyncs) before it fans out: the run time is the node's fsync latency a
# thousand times over, not CPU. Alone on a busy CI node it took 348 s at 0.4
# cores; beside the parallel suite it passed the 8 min suite-wide bound while
# still progressing. Every keystroke's round trip is held to the test-env hang
# bound already, so this bound only has to catch a run that stopped; it starts
# with the longest tests.
[[profile.default.overrides]]
filter = 'package(tilo-relay) and binary(it) and test(=hosting_cost::one_keystroke_costs_the_host_bounded_bytes_on_the_wire_and_disk)'
priority = 50
slow-timeout = { period = "30s", terminate-after = 40 }

# Megabytes of fsynced commits: these take the runner's disk and CPUs, so
# they run alone rather than slowing every test beside them.
[[profile.default.overrides]]
filter = 'package(tilo-browser-peer) and (binary(compaction) or binary(backpressure))'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = '(package(tilo-fs) and (test(/^fs::checked_restore::tests::/) or binary(collab_release_matrix))) or (package(shell) and (test(=shell::collab_history::tests::history_outlives_the_memory_window_and_a_restart) or binary(shots))) or (package(tilo-media) and test(/^real::/)) or (package(imager) and test(/^setup::staging::fake::tests::/)) or (package(scratchpad) and binary(native_proof)) or (package(tilo-rollback) and binary(mechanism)) or (package(tilo-automerge) and binary(patch_log_memory)) or (package(tilo-relay) and (binary(held_memory) or test(/^daemon::tests::/) or test(=store::replay::tests::bounded_snapshot_pins_orders_counts_and_hydrates_only_its_batch) or test(=store::shell_selection::tests::projected_checkpoint_prefix_exposes_the_route_count_cutoff) or test(=peer::private_transport_tests::thirty_four_route_prefix_uses_one_all_original_selection_then_converges))) or (package(tilo-ui) and (binary(held-memory) or test(/^incremental_render_regressions::/) or test(/^app::large_document_tests::/) or test(/^app::semantic_tree_app_tests::/) or test(/^presence::render::tests::/))) or (package(video-editor) and (test(/^export::tests::/) or test(/^shot::tests::/))) or (package(tilo-app-state) and test(/^fs_store::tests::/))'
priority = 50
