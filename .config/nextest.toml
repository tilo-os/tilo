# Setup scripts give the ci profile's runs their test environment (below), and the runs of every
# profile that inherits it.
experimental = ["setup-scripts"]

[profile.default]
# Report and terminate hung tests. Six periods, so the test-env hang bound (five minutes) fails a
# stopped test with its own message first.
slow-timeout = { period = "60s", terminate-after = 6 }
failure-output = "immediate-final"
fail-fast = false

# Also the profile for the whole suite outside CI; it keeps the visual goldens
# (.config/nextest-filters.toml) for an idle renderer.
[profile.ci]
# A test still running after 30 s prints a SLOW line each period, so a log
# shows where shard time goes while it runs. The hang bound stays 30 s x 16 = 8 min.
slow-timeout = { period = "30s", terminate-after = 16 }
failure-output = "immediate-final"
fail-fast = false
# No second attempt. A test that fails on the first run fails the job.
# Timing-sensitive tests pin their clock or wait on the production signal;
# a retry would record that race as FLAKY and let the shard pass.
retries = 0
# Name leaked subprocess handles as well as slow and failed tests. JUnit's
# passing test records do not identify leaks, and ordinary passes stay quiet.
status-level = "leak"
final-status-level = "flaky"
# The overrides above are the run's: this profile adds none of its own, and
# tools/tests/test_nextest_policy.py holds it that way, so the suite runs one
# list of overrides under both profiles.

[profile.ci.junit]
path = "junit.xml"

# The property tests' count, for the packages t.toml's `test-deep` names: a profile of their own,
# inheriting `ci` (its hang bound, failure output and setup steps), so the count reaches those
# tests and no build. In the job's environment it would key every build script's and proc macro's
# cache entry by it, and another family's run of the same packages would share no build.
[profile.deep]
inherits = "ci"

# The ci profile's test environment, set up by nextest itself on the machine
# that runs the tests, wherever cargo runs them (a CI container, a developer
# machine, a remote builder). Every test gets `test-runtime`: lavapipe, PDFium,
# the shared fixture cache and the TILO_REQUIRE_* capabilities the image
# promises, the font catalog and the audio endpoint among them. A setup script
# runs once per nextest run, and a suite is over a thousand runs (a package's
# test binary, or one shard of it), so that one starts no interpreter and
# prepares nothing. What takes work runs for the packages that can use it: the
# pinned font catalog, and a private audio endpoint for the run's lifetime;
# the native NTFS images only for a run that selects a test reading them.
# tools/test-env-setup.sh describes each step; every test binary also runs in
# tools/with-test-environment.sh (tools/cargo-runner.sh).
[scripts.setup.test-runtime]
command = ["bash", "tools/test-env-setup.sh", "runtime"]

[scripts.setup.font-catalog]
command = ["bash", "tools/test-env-setup.sh", "fonts"]

[scripts.setup.headless-audio]
command = ["bash", "tools/test-env-setup.sh", "audio"]

[scripts.setup.ntfs-fixtures]
command = ["bash", "tools/test-env-setup.sh", "ntfs"]

# The values only some packages' tests need. They are handed to the test processes, never to the
# job's environment: a variable there keys every build script's and proc macro's cache entry by
# it, and these differ per package (the PDF sandbox, the TPM, an agent's render helper, the PAM
# module), so jobs testing different packages would share no build.
[scripts.setup.swtpm]
command = ["bash", "tools/test-env-setup.sh", "swtpm"]

[scripts.setup.pdf-sandbox]
command = ["bash", "tools/test-env-setup.sh", "pdf-sandbox"]

[scripts.setup.video-render]
command = ["bash", "tools/test-env-setup.sh", "video-render"]

[scripts.setup.pam-module]
command = ["bash", "tools/test-env-setup.sh", "pam-module"]

# The property tests' count: the `deep` profile runs the packages t.toml's `test-deep` names with
# more cases than an ordinary run (tools/test-env-setup.sh, `property-cases`). A family's `env`
# would carry it into the build of every unit, so another family's run of the same packages would
# share no build with this one.
[scripts.setup.property-cases]
command = ["bash", "tools/test-env-setup.sh", "property-cases"]

# The sizes the agent session's ignored throughput test runs at (tools/test-env-setup.sh,
# `throughput`). A family's `env` would carry them into the build of every unit, so another
# family's run of the same package would share no build with this one.
[scripts.setup.throughput]
command = ["bash", "tools/test-env-setup.sh", "throughput"]

[[profile.deep.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "all()"
setup = "property-cases"

# The programs the session's tests start beside their own: the lock screen,
# the on-screen keyboard and the quick-settings panel are apps of other
# packages, tilolang-process runs a task's programs, and the launcher is what
# a test asks whether it takes the command line the session starts an app
# with; Cargo builds none of them for a test. The harness builds them before any
# test starts, in one Cargo invocation (tools/build-sibling-binaries.sh), and
# hands each path to the run's tests as TILO_SIBLING_BIN_<bin>, which
# tilo_test_env::sibling_binary answers with. A test starts only programs its
# run built: one that asked Cargo for its own would resolve and compile the
# workspace a second time, inside the run, in every test process that needs it.
#
# Every profile but `default` inherits these registrations (the `ci` profile
# runs this setup too), so a profile that would run its tests elsewhere names
# only what it adds.
[scripts.setup.session-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tilo-lock-screen:tilo-lock-screen", "osk:osk",
    "tilo-quick-settings:tilo-quick-settings",
    "tilolang-process:tilolang-process", "launcher:tilo-launcher",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) or package(tilo-quick-settings)"
setup = "session-siblings"

# The session's workspace-service test starts the server as the Lounge image does
# (`tilo-server workspace --persistent` with its deployment routes), a program of
# another package: the feature `agents` is what gives it that subcommand.
[scripts.setup.lounge-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tilo-server:tilo-server=tilo-server/agents",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(lounge_e2e::)"
setup = "lounge-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(lounge_e2e::)"
setup = "lounge-siblings"

# The browser peer's Lounge test starts the same workspace service the deployment
# runs, so it is built the same way: a program of another package, with the
# feature `agents` that gives it the `workspace` subcommand.
[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(it) and test(lounge_fresh_page::)"
setup = "lounge-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(it) and test(lounge_fresh_page::)"
setup = "lounge-siblings"

# The browser peer's page tests drive the page's own modules in headless
# Chrome, served beside the runtime module (tools/web/page-bundle.mjs). The
# harness builds that module once before they start
# (tools/build-page-bundle.sh) and hands it over as TILO_PAGE_BUNDLE: built
# inside a test, a cold wasm compile ran out the time the test gives the page
# to answer.
[scripts.setup.page-bundle]
command = ["bash", "tools/build-page-bundle.sh"]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(it) and (test(passkey_root::) or test(node_workspace::))"
setup = "page-bundle"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(it) and (test(passkey_root::) or test(node_workspace::))"
setup = "page-bundle"

# Chat's acceptance, a branched device running it with its host away, and the
# agents a session makes drive the app itself, as a desktop starts it: the app,
# the launcher that starts it and the runtime host the app runs on are packages
# of other crates, which Cargo builds for no test of the session's.
[scripts.setup.chat-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "chat:chat", "launcher:tilo-launcher", "tilo-runtime:tilo-runtime",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and (test(chat_2x2::) or test(device_branch::) or test(shared_input::a_window_lifted) or test(workspace_agents::))"
setup = "chat-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "all()"
setup = "test-runtime"

# The two steps that take work, for the packages whose code can use what they
# prepare. `rdeps(NAME)` is NAME and every package that depends on it, which
# nextest reads from the build's own dependency graph: a package that starts
# depending on one of these is served without an edit here. The names are read
# from the code (tools/ci/setup_filters.py prints both filters, and
# tools/tests/test_setup_filters.py fails while these are not they): the font
# catalog's one reader, the crate that owns it; and each package whose sources
# name an audio endpoint, with its dependents where that is library code.
# `test-runtime` promises both to every test (TILO_REQUIRE_FONTS,
# TILO_REQUIRE_AUDIO), so a test that needs one in a package left out here
# fails, saying so, and never skips.
[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "rdeps(tilo-font-catalog)"
setup = "font-catalog"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "rdeps(compat-service) or rdeps(launcher) or rdeps(music) or rdeps(tilo-app-cli) or rdeps(tilo-capture) or rdeps(tilo-media) or rdeps(tilo-projector) or rdeps(tilo-spotify) or rdeps(tilo-tts) or package(tilo-session) or package(tilo-session-client) or package(tilo-test-env)"
setup = "headless-audio"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and (test(chat_2x2::) or test(device_branch::) or test(shared_input::a_window_lifted) or test(workspace_agents::))"
setup = "chat-siblings"

# Tasks' own package, which the closed-app test starts without a window, and the launcher the
# session starts it through (it looks for one beside itself first): the app's code is what writes
# the workspace's tracker there, so the record the agent's step changes is the app's.
[scripts.setup.tasks-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tasks:tasks", "launcher:tilo-launcher",
]

# A branched device's vault and provider keys are read through the apps that keep them:
# Passwords and Model Providers, as a desktop starts them.
[scripts.setup.vault-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "passwords:passwords", "model-providers:model-providers", "launcher:tilo-launcher",
    "tilo-session:tilo-session=tilo-session/dev-overrides",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(device_branch::)"
setup = "vault-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(device_branch::)"
setup = "vault-siblings"

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(closed_tasks::)"
setup = "tasks-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(closed_tasks::)"
setup = "tasks-siblings"

# The installed apps the session opens and times against the splash budgets their own manifests
# declare, and the launcher that starts them: each is a program of another package, which Cargo
# builds for no test of the session's. And the session as the dev image builds it, which the test
# runs in place of the tests' own build of it.
[scripts.setup.app-open-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tasks:tasks", "chat:chat", "tilo-runtime:tilo-runtime",
    "passwords:passwords", "model-providers:model-providers", "launcher:tilo-launcher",
    "tilo-session:tilo-session=tilo-session/dev-overrides",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(app_open_budget::)"
setup = "app-open-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(it) and test(app_open_budget::)"
setup = "app-open-siblings"

# The native NTFS images the helper's integration tests read are generated once
# and handed to the tests as TILO_NTFS_FIXTURES; Cargo builds none, and a test
# that starts without them fails saying so. Its library's tests read none: a run
# of them alone waited a minute for images it never opened. In every profile:
# the release is graded with the default profile, and ci inherits this
# registration.
[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-ntfs-helper) and binary(it)"
setup = "ntfs-fixtures"

# The values only some packages' tests need, for those packages: the ones
# tools/ci/nextest.sh gave the job's environment before, which every build
# script's and proc macro's cache entry then carried.
[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-auth) or package(tilo-rollback) or package(tilo-test-env)"
setup = "swtpm"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-pdf) or package(pdf-viewer) or package(tilo-thumbnail)"
setup = "pdf-sandbox"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-agent-session)"
setup = "video-render"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-agent-session) and test(workspace_actions::throughput::)"
setup = "throughput"

# pam-tilo's tests load the module as libpam does: the cdylib, which no test binary links, so Cargo
# builds none for them. The setup builds it and hands the tests its path. In every profile: a run
# outside CI loads the module the same way.
[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(pam-tilo)"
setup = "pam-module"

# Process-isolated compositor, GPU, and collaboration tests need shared limits.
#
# Nextest starts tests in order and a test that needs every thread waits for
# all running tests to finish, idling the rest of the pool. Tests that take the
# whole pool therefore have the highest priority: they run back to back while
# the pool is still empty. The longest tests follow, so a run ends on short ones.
[test-groups]
gpu-golden = { max-threads = 1 }
imager-durable-disk = { max-threads = 2 }
agent-sessions = { max-threads = 2 }

# Golden rendering shares Vulkan resources across test processes.
[[profile.default.overrides]]
filter = '(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline)))'
test-group = "gpu-golden"

# What a person's interactions at 10k tasks cost, printed on a pass too: the
# reading against the targets it is held to, so a drift toward them shows in
# every run's log before a run crosses one. The test's name carries the module
# it is written in (`cost`), which the filter has to name: a `test(=…)` names
# the whole test, so the table was never printed. One override serves both
# profiles: a profile that names no overrides of its own inherits these, so the
# run the CI makes prints the table too.
[[profile.default.overrides]]
filter = 'package(tilolang-app) and binary(it) and test(=hosted::cost::what_the_interactions_a_person_feels_cost)'
success-output = "final"

# A company's workspace at real size: a thousand notes and five hundred issues
# written through the API one at a time, then every call an agent makes most
# timed against what an empty workspace answers in. Writing them is the bulk of
# the run and takes minutes on a busy machine; the bound only has to catch a run
# that stopped. Printed on a pass too, so the timings show in every log.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and test(workspace_actions::scale::)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 30 }

# How long a tracker's first listing after a restart takes, and how long another
# workspace's request waits while it runs: the numbers are what the bounds are
# about, so they show in every log, not only in one that failed.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and test(workspace_actions::tracker_listing::)'
success-output = "final"

# How fast a workspace takes records and files at each size it is filled to:
# seeding the larger sizes and timing every path takes minutes, so the bound
# only has to catch a run that stopped. Printed on a pass too, so the table
# shows in every log.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and test(workspace_actions::throughput::)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 60 }

# What a device receives of an answer of four hundred words while its model writes it: how
# many changes they come in, when the first and the last arrive, how many bytes a change adds
# to what the device keeps. Printed on a pass too, so the numbers show in every log.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and test(workspace_actions::hosted_agent_turns::asks::sub_agents::reply_times::)'
success-output = "final"

[[profile.default.overrides]]
filter = 'package(imager) and (test(/^setup::import_view::tests::/) or test(/^setup::desktop_continuation::tests::/) or test(/^setup::migration_worker::tests::/) or test(/^setup::internal_cache::/) or test(/^setup::internal_download::/) or test(/^setup::internal_download_flow::/))'
test-group = "imager-durable-disk"

# The all-app coverage runs open every web app the workspace can hold and
# drive each record or window in turn; beside a session held to fixed
# deadlines they take the CPUs those deadlines need. They keep the two-wide
# group. Every other test of the binary runs one scenario over one app and
# has the pool: at a CI shard's 18 test threads the whole run took 203-212 s
# in three runs, against 1613 s while the cap covered every test of the
# package.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and (test(app_coverage::) or test(empty_state_actions::every_apps_empty_state_action_is_a_button_in_the_tree) or test(workspace_actions::member_roles::carried_names::) or test(=replicas::only_the_creator_seeds_a_record))'
test-group = "agent-sessions"

# A thousand keystrokes, each a durable server commit (file and directory
# fsyncs) before it fans out: the run time is the node's fsync latency a
# thousand times over, not CPU. Alone on a busy CI node it took 348 s at 0.4
# cores; beside the parallel suite it passed the 8 min suite-wide bound while
# still progressing. Every keystroke's round trip is held to the test-env hang
# bound already, so this bound only has to catch a run that stopped; it starts
# with the longest tests.
[[profile.default.overrides]]
filter = 'package(tilo-server) and binary(it) and test(=server_cost::one_keystroke_costs_the_host_bounded_bytes_on_the_wire_and_disk)'
priority = 50
slow-timeout = { period = "30s", terminate-after = 40 }

# Megabytes of fsynced commits: these take the runner's disk and CPUs, so
# they run alone rather than slowing every test beside them.
[[profile.default.overrides]]
filter = 'package(tilo-session-client) and binary(it) and test(compaction::)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = '(package(tilo-fs) and (test(/^fs::checked_restore::tests::/) or (binary(it) and test(collab_release_matrix::)))) or (package(tilo-media) and test(/::real::/)) or (package(imager) and test(/^setup::staging::fake::tests::/)) or (package(scratchpad) and binary(native_proof)) or (package(tilo-rollback) and binary(mechanism)) or (package(tilo-automerge) and binary(it) and test(patch_log_memory::)) or (package(tilo-server) and (binary(held_memory) or test(/^daemon::tests::/) or test(=store::replay::tests::bounded_snapshot_pins_orders_counts_and_hydrates_only_its_batch) or test(=store::shell_selection::tests::projected_checkpoint_prefix_exposes_the_route_count_cutoff) or test(=peer::private_transport_tests::thirty_four_route_prefix_uses_one_all_original_selection_then_converges))) or (package(tilo-ui) and (binary(held-memory) or test(/^incremental_render_regressions::/) or test(/^app::large_document_tests::/) or test(/^app::semantic_tree_app_tests::/) or test(/^presence::render::tests::/))) or (package(video-editor) and (test(/^export::tests::/) or test(/^shot::tests::/))) or (package(tilo-app-state) and test(/^fs_store::tests::/))'
priority = 50

# A lock starts the lock screen app, which draws under llvmpipe: beside the
# parallel suite the screen took over the run's whole bound to come up, so the
# run measured the runner rather than the press it is about.
[[profile.default.overrides]]
filter = 'package(tilo-quick-settings) and binary(session) and test(=the_lock_tile_locks_the_screens)'
threads-required = "num-cpus"
priority = 50

# How fast a workspace takes actions and files, printed on a pass too, so a
# drift shows in every log before it crosses a ceiling. Seeding a workspace
# and timing each kind takes minutes on a busy machine.
[[profile.default.overrides]]
filter = 'package(tilo-agent-session) and binary(it) and test(=workspace_actions::throughput::a_workspace_takes_records_and_files_at_the_same_speed_however_full)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 10 }
