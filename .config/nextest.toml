# Setup scripts give the ci profile's runs their test environment (below).
experimental = ["setup-scripts"]

[profile.default]
# Report and terminate hung tests.
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

# Also the profile for the whole suite outside CI; it keeps the visual goldens
# (.config/nextest-filters.toml) for an idle renderer.
[profile.ci]
# A test still running after 30 s prints a SLOW line each period, so a log
# shows where shard time goes while it runs. The hang bound stays 30 s x 16 = 8 min.
slow-timeout = { period = "30s", terminate-after = 16 }
failure-output = "immediate-final"
fail-fast = false
# No second attempt. A test that fails on the first run fails the job.
# Timing-sensitive tests pin their clock or wait on the production signal;
# a retry would record that race as FLAKY and let the shard pass.
retries = 0
# Name leaked subprocess handles as well as slow and failed tests. JUnit's
# passing test records do not identify leaks, and ordinary passes stay quiet.
status-level = "leak"
final-status-level = "flaky"
# The overrides above are the run's: this profile adds none of its own, and
# tools/tests/test_nextest_policy.py holds it that way, so the suite runs one
# list of overrides under both profiles.

[profile.ci.junit]
path = "junit.xml"

# The ci profile's test environment, set up by nextest itself on the machine
# that runs the tests, wherever cargo runs them (a CI container, a developer
# machine, a remote builder): lavapipe, PDFium, the shared fixture cache, the
# TILO_REQUIRE_* capabilities the image promises and a private audio endpoint
# for the run's lifetime; the native NTFS images only for a run that selects a
# test reading them. tools/test-env-setup.sh describes each step; every test
# binary also runs in tools/with-test-environment.sh (tools/cargo-runner.sh).
[scripts.setup.test-runtime]
command = ["bash", "tools/test-env-setup.sh", "runtime"]

[scripts.setup.headless-audio]
command = ["bash", "tools/test-env-setup.sh", "audio"]

[scripts.setup.ntfs-fixtures]
command = ["bash", "tools/test-env-setup.sh", "ntfs"]

[scripts.setup.as-root]
command = ["bash", "tools/test-env-setup.sh", "root"]

# The programs the session's tests start beside their own: the lock screen,
# the on-screen keyboard and the quick-settings panel are apps of other
# packages, which Cargo builds for no test. The harness builds them before any
# test starts, in one Cargo invocation (tools/build-sibling-binaries.sh), and
# hands each path to the run's tests as TILO_SIBLING_BIN_<bin>, which
# tilo_test_env::sibling_binary answers with. A test starts only programs its
# run built: one that asked Cargo for its own would resolve and compile the
# workspace a second time, inside the run, in every test process that needs it.
#
# Every profile but `default` inherits these registrations (the `ci` profile
# runs this setup too), so a profile that would run its tests elsewhere names
# only what it adds.
[scripts.setup.session-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tilo-lock-screen:tilo-lock-screen", "osk:osk",
    "tilo-quick-settings:tilo-quick-settings",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) or package(tilo-quick-settings)"
setup = "session-siblings"

# The session's room-service test starts the relay as the Lounge image does
# (`tilo-relay room --persistent` with its deployment routes), a program of
# another package: the feature `agents` is what gives it that subcommand.
[scripts.setup.lounge-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tilo-relay:tilo-relay=tilo-relay/agents",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(lounge_e2e)"
setup = "lounge-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(lounge_e2e)"
setup = "lounge-siblings"

# The browser peer's Lounge test starts the same room service the deployment
# runs, so it is built the same way: a program of another package, with the
# feature `agents` that gives it the `room` subcommand.
[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(lounge_fresh_page)"
setup = "lounge-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and binary(lounge_fresh_page)"
setup = "lounge-siblings"

# The browser peer's page tests drive the page's own modules in headless
# Chrome, served beside the runtime module (tools/web/page-bundle.mjs). The
# harness builds that module once before they start
# (tools/build-page-bundle.sh) and hands it over as TILO_PAGE_BUNDLE: built
# inside a test, a cold wasm compile ran out the time the test gives the page
# to answer.
[scripts.setup.page-bundle]
command = ["bash", "tools/build-page-bundle.sh"]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and (binary(passkey_root) or binary(node_workspace))"
setup = "page-bundle"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session-client) and (binary(passkey_root) or binary(node_workspace))"
setup = "page-bundle"

# Chat's acceptance, and a branched device running it with its host away, drive
# the app itself, as a desktop starts it: the app, the launcher that starts it
# and the runtime host the app runs on are packages of other crates, which Cargo
# builds for no test of the session's.
[scripts.setup.chat-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "chat:chat", "launcher:tilo-launcher", "tilo-runtime:tilo-runtime",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and (binary(chat_2x2) or binary(device_branch))"
setup = "chat-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "all()"
setup = ["test-runtime", "headless-audio"]

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and (binary(chat_2x2) or binary(device_branch))"
setup = "chat-siblings"

# Tasks' own package, which the closed-app test starts without a window, and the launcher the
# session starts it through (it looks for one beside itself first): the app's code is what writes
# the workspace's tracker there, so the record the agent's step changes is the app's.
[scripts.setup.tasks-siblings]
command = [
    "bash", "tools/build-sibling-binaries.sh",
    "tasks:tasks", "launcher:tilo-launcher",
]

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(closed_tasks)"
setup = "tasks-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-session) and binary(closed_tasks)"
setup = "tasks-siblings"

[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-ntfs-helper)"
setup = "ntfs-fixtures"

# The only tests that run as root where a job starts as root; every other test
# runs as the image's ordinary user (tools/as-test-user.sh). A job sandbox with
# host ids of its own maps a block of host users and idmaps its mounts, and the
# limits tests give a job a cgroup of their own: both take root.
[[profile.ci.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
filter = "package(tilo-sandbox) and (test(/^host_ids::/) or test(/^limits::/))"
setup = "as-root"

# Process-isolated compositor, GPU, and collaboration tests need shared limits.
#
# Nextest starts tests in order and a test that needs every thread waits for
# all running tests to finish, idling the rest of the pool. Tests that take the
# whole pool therefore have the highest priority: they run back to back while
# the pool is still empty. The longest tests follow, so a run ends on short ones.
[test-groups]
gpu-golden = { max-threads = 1 }
agent-collaboration = { max-threads = 1 }
imager-durable-disk = { max-threads = 2 }
agent-participant-sessions = { max-threads = 2 }

# Golden rendering shares Vulkan resources across test processes.
[[profile.default.overrides]]
filter = '(package(tilo-ui) and test(typography_visual_regression::)) or (package(ebook) and (test(serif_reader_matches_typography_baseline) or test(mathematical_reader_matches_shared_typesetting_baseline)))'
test-group = "gpu-golden"

# What a person's interactions at 10k tasks cost, printed on a pass too: the
# reading against the targets it is held to, so a drift toward them shows in
# every run's log before a run crosses one. The test's name carries the module
# it is written in (`cost`), which the filter has to name: a `test(=…)` names
# the whole test, so the table was never printed. One override serves both
# profiles: a profile that names no overrides of its own inherits these, so the
# run the CI makes prints the table too. Seeding ten thousand tasks and driving
# a window over them takes minutes on a machine busy with other work, so its
# hang bound is eight minutes: a slow run reports the table rather than a
# termination.
[[profile.default.overrides]]
filter = 'package(tilolang-app) and binary(hosted) and test(=cost::what_the_interactions_a_person_feels_cost)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 8 }

# Not started with the pool-wide and longest tests: each suite's first route
# join runs under the SDK's 4.5 s primary-route deadline, which the opening
# burst of a whole-workspace shard (every slot starting a process at once)
# exceeds.
[[profile.default.overrides]]
filter = 'package(agent) and binary(it) and test(presence_semantics::)'
test-group = "agent-collaboration"

# Every app's every view laid out at every window size, display scale and text
# size: each window is laid out on a core of its own, so the sweep takes the
# runner's CPUs rather than sharing them with the tests beside it.
[[profile.default.overrides]]
filter = 'package(tilolang-cli) and test(=the_apps_show_no_layout_problem_their_allow_list_does_not_name)'
threads-required = "num-cpus"
priority = 100

# Each app gate seeds a workspace of a thousand items and one of ten thousand and
# runs the open, the filter and the changes over both: 42 s of CPU a gate on a quiet
# machine, and a loaded one reached the eight-minute suite-wide bound without a
# finish. The bound only has to catch a gate that stopped.
[[profile.default.overrides]]
filter = 'package(tilolang-tilo) and binary(budgets)'
slow-timeout = { period = "30s", terminate-after = 40 }

[[profile.default.overrides]]
filter = '(package(notes) and binary(it) and (test(scenarios::) or test(capture_runtime::)))'
threads-required = 16
priority = 100

[[profile.default.overrides]]
filter = 'package(imager) and (test(/^setup::import_view::tests::/) or test(/^setup::desktop_continuation::tests::/) or test(/^setup::migration_worker::tests::/) or test(/^setup::internal_cache::/) or test(/^setup::internal_download::/) or test(/^setup::internal_download_flow::/))'
test-group = "imager-durable-disk"

# Each tilo-agent-participant integration test runs a relay host, agents and
# browser sessions that drive every web app natively against fixed deadlines;
# the all-app coverage runs starve a concurrent session of the CPU it needs.
[[profile.default.overrides]]
filter = 'package(tilo-agent-participant) and kind(test)'
test-group = "agent-participant-sessions"

# A thousand keystrokes, each a durable relay commit (file and directory
# fsyncs) before it fans out: the run time is the node's fsync latency a
# thousand times over, not CPU. Alone on a busy CI node it took 348 s at 0.4
# cores; beside the parallel suite it passed the 8 min suite-wide bound while
# still progressing. Every keystroke's round trip is held to the test-env hang
# bound already, so this bound only has to catch a run that stopped; it starts
# with the longest tests.
[[profile.default.overrides]]
filter = 'package(tilo-relay) and binary(it) and test(=hosting_cost::one_keystroke_costs_the_host_bounded_bytes_on_the_wire_and_disk)'
priority = 50
slow-timeout = { period = "30s", terminate-after = 40 }

# Megabytes of fsynced commits: these take the runner's disk and CPUs, so
# they run alone rather than slowing every test beside them.
[[profile.default.overrides]]
filter = 'package(tilo-session-client) and binary(compaction)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = '(package(tilo-fs) and (test(/^fs::checked_restore::tests::/) or binary(collab_release_matrix))) or (package(tilo-action-broker) and test(=history_outlives_the_memory_window_and_a_restart)) or (package(tilo-media) and test(/^real::/)) or (package(imager) and test(/^setup::staging::fake::tests::/)) or (package(scratchpad) and binary(native_proof)) or (package(tilo-rollback) and binary(mechanism)) or (package(tilo-automerge) and binary(patch_log_memory)) or (package(tilo-relay) and (binary(held_memory) or test(/^daemon::tests::/) or test(=store::replay::tests::bounded_snapshot_pins_orders_counts_and_hydrates_only_its_batch) or test(=store::shell_selection::tests::projected_checkpoint_prefix_exposes_the_route_count_cutoff) or test(=peer::private_transport_tests::thirty_four_route_prefix_uses_one_all_original_selection_then_converges))) or (package(tilo-ui) and (binary(held-memory) or test(/^incremental_render_regressions::/) or test(/^app::large_document_tests::/) or test(/^app::semantic_tree_app_tests::/) or test(/^presence::render::tests::/))) or (package(video-editor) and (test(/^export::tests::/) or test(/^shot::tests::/))) or (package(tilo-app-state) and test(/^fs_store::tests::/))'
priority = 50

# A lock starts the lock screen app, which draws under llvmpipe: beside the
# parallel suite the screen took over the run's whole bound to come up, so the
# run measured the runner rather than the press it is about.
[[profile.default.overrides]]
filter = 'package(tilo-quick-settings) and binary(session) and test(=the_lock_tile_locks_the_screens)'
threads-required = "num-cpus"
priority = 50
