[project]
name = "tilo-sdk"
version = "0.1.0"
description = "Drive Tilo workspaces from Python: the same resources, actions, runs and undo as clicking or an agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# A program reaches this computer's daemon through the native part, `tilo._native` (native/, a
# crate of the Tilo workspace), built by tools/ci/sdk-native.sh beside the package; a checkout or
# wheel without it reaches a server with a key instead, over httpx. Platform wheels that carry it,
# with the `tilo-automerge-worker` program it starts its sandboxed workers as, come from a maturin
# build in the workspace (docs/publishing.md#native-packages).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The apps' types are written by `tilo sdk gen` at build time and Git ignores them, as hatchling
# would too: the sdist and the wheel carry them all the same (tools/ci/sdk-gen.sh).
artifacts = ["src/tilo/types/"]

[tool.hatch.build.targets.wheel]
packages = ["src/tilo"]

# uv runs the suite against src/ as it is (pytest's `pythonpath`) and never builds the project:
# building it compiles the native part, which the transport-free tests do not need.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
