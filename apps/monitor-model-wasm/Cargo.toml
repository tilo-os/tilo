[package]
name = "monitor-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Monitor model as the WebAssembly module its package carries: the shared table layout, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
monitor-model = { path = "../monitor-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
