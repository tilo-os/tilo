[package]
name = "chat-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The chat.workspace and chat.drafts records: a workspace's channels, categories and read marks, reviewed feedback, moderation, agent summaries, and each person's unsent words"

# The resource Chat keeps and every device holding the workspace's keys applies:
# the same types, verbs and typed action arguments on the app's side and in the
# WebAssembly module its package carries. It has no window and no surface of its
# own; the app draws it.
#
# It depends on the resource layer, the action API and the records the chat
# refers to, never the toolkit.

[lib]
name = "chat_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-reference = { path = "../../crates/collab/reference" }
# A message body and a draft are rich text, the document model's own type.
tilo-document = { path = "../../crates/sdk/tilo-document" }
# Reviewed feedback submissions, kept with the chat's resource.
tilo-feedback = { path = "../../crates/sdk/feedback" }
# Reports of people and messages, decided by the workspace's moderators.
moderation-model = { path = "../moderation-model" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource", features = ["test-support"] }

[lints]
workspace = true
