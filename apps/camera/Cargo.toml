[package]
name = "camera"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "camera"
path = "src/lib.rs"

[[bin]]
name = "camera"
path = "src/main.rs"

[features]
# Live camera capture ships on by default: a normally-built `camera` opens the
# real device (GStreamer v4l2src) and shows the live viewfinder. The capture
# pipeline is only driven for the `Storage::Disk` (live) source — the sample
# source used by `--shots` and tests synthesizes its viewfinder frame and never
# enumerates or opens a device (see `poll_camera`), so the feature only compiles
# the pipeline in while the runtime storage decides whether it runs.
default = ["live-capture"]
# Live capture via GStreamer's v4l2src. See `src/capture.rs`.
live-capture = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
ui = { path = "../../ui" }
# The qOS ACTION model: Camera's `actions` module exports its gallery/scan
# metadata operations as replayable actions the host's Ctrl+K palette dispatches.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true

# On-disk photo library: file dimensions, decode + downscale for thumbnails.
# Default features are trimmed to the formats a camera roll actually holds.
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png.workspace = true
dirs.workspace = true

# QR / barcode pipeline — both pure Rust.
#   qrcode:  encode payloads into a module matrix (used to synthesize the
#            offline sample frame for `--shots`, and to render the "share
#            my Wi-Fi" QR in-app).
#   rqrr:    detect + decode QR codes from a greyscale buffer. This is the
#            real scanner: the composited sample frame is decoded back so
#            the on-screen bounding box + payload are produced by an actual
#            decode, not hand-placed.
qrcode.workspace = true
rqrr.workspace = true

# Live-capture-only (feature-gated; never compiled for the default build).
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[lints]
workspace = true
