[package]
name = "camera"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "camera"
path = "src/lib.rs"

[[bin]]
name = "camera"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Live camera capture uses GStreamer's v4l2src. Sample storage used by shots and
# tests does not enumerate or open a device.
default = ["live-capture"]
# Live capture through tilo-capture (GStreamer on the desktop, getUserMedia
# on the web). See `src/capture.rs`.
live-capture = ["tilo-capture/camera"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Scanned links and the privacy-settings hand-off open through
# `ui::portal::open_uri` (the OpenURI portal on Linux).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo ACTION model: Camera's `actions` module exports capture/scan metadata
# operations as replayable actions the host's Ctrl+K palette dispatches.
tilo-content = { path = "../../crates/system/content" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true

# Capture encoding plus portal-selected image decoding for code scanning.
# Default features are trimmed to formats cameras and image portals provide.
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# The shared preview pipeline (recent-capture peek) and bounded image decoder.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tilo-ocr = { path = "../../crates/media/ocr" }
tilo-doc-pdf = { path = "../../crates/doc/tilo-doc-pdf" }
# Cameras (live-capture) and SANE document scanners.
tilo-capture = { path = "../../crates/platform/tilo-capture", features = ["scanner"] }

# Pure-Rust QR/barcode fixtures and detection for scanner flows.
qrcode.workspace = true
rqrr.workspace = true


[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# A brokered camera whose permission prompt a test answers.
tilo-capture = { path = "../../crates/platform/tilo-capture", features = ["scanner", "test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
