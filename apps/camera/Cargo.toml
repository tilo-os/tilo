[package]
name = "camera"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "camera"
path = "src/lib.rs"

[[bin]]
name = "camera"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Live camera capture uses GStreamer's v4l2src. Sample storage used by shots and
# tests does not enumerate or open a device.
default = ["live-capture"]
# Live capture via GStreamer's v4l2src. See `src/capture.rs`.
live-capture = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo ACTION model: Camera's `actions` module exports capture/scan metadata
# operations as replayable actions the host's Ctrl+K palette dispatches.
tilo-actions = { path = "../../crates/collab/actions" }
qdoc = { path = "../../crates/doc/qdoc" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true

# Capture encoding plus portal-selected image decoding for code scanning.
# Default features are trimmed to formats cameras and image portals provide.
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp"] }
dirs.workspace = true
tilo-ocr = { path = "../../crates/media/ocr" }
qdoc-pdf = { path = "../../crates/doc/qdoc-pdf" }
os-actions = { path = "../../crates/system/os-actions" }

# Pure-Rust QR/barcode fixtures and detection for scanner flows.
qrcode.workspace = true
rqrr.workspace = true

# Live-capture-only (feature-gated; never compiled for the default build).
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[lints]
workspace = true
