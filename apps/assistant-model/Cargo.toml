[package]
name = "assistant-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The assistant.window record: the window's own document, which holds nothing"

# The resource the Assistant window draws, as the app reads it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer, never the toolkit.

[lib]
name = "assistant_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
