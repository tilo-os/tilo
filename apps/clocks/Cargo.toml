[package]
name = "clocks"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "clocks"
path = "src/lib.rs"

[[bin]]
name = "clocks"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
chrono-tz = "0.10"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
ui = { package = "tilo-app", path = "../../crates/app/tilo-app", features = ["notifications"] }
atomic-file = { path = "../../crates/system/atomic-file" }
private-fs = { path = "../../crates/system/private-fs" }
vello.workspace = true
taffy.workspace = true
automerge.workspace = true
winit.workspace = true
tilo-actions = { path = "../../crates/collab/actions" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }

[features]
thin = ["dep:runtime-dylib"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
