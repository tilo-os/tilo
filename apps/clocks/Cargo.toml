[package]
name = "clocks"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "clocks"
path = "src/lib.rs"

[[bin]]
name = "clocks"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
chrono-tz = "0.10"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
taffy.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-timezone-engine = { path = "../../crates/runtime/engines/timezone", optional = true }

[features]
thin = ["dep:runtime-dylib"]
# Reach the time-zone database through its engine library in the runtime
# bundle (libtilo_timezone_engine.so, crates/runtime/engines/timezone)
# instead of the runtime. The release collection enables it
# (dist/apps/app-collections.toml); a `thin` build without it (`tilo-app dev`)
# links chrono-tz statically, because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-timezone-engine/thin"]

[lints]
workspace = true

[dev-dependencies]
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
