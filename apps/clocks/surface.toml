format = 2

[[resources]]
kind = "clocks.collection"
label = "Clocks"
version = 1
fields = [
  { path = "world_clocks", type = { collection = { named = "WorldClock" } }, stored = "collection" },
  { path = "world_clocks.*.city", type = "text", label = true },
  { path = "world_clocks.*.timezone", type = "text", readonly = true },
  { path = "alarms", type = { collection = { named = "Alarm" } }, stored = "collection" },
  { path = "alarms.*.label", type = "text", label = true },
  { path = "alarms.*.hour", type = "int" },
  { path = "alarms.*.minute", type = "int" },
  { path = "alarms.*.repeat", type = "int" },
  { path = "alarms.*.enabled", type = "bool", readonly = true },
  { path = "alarms.*.enabled_at_ms", type = "int", readonly = true },
  { path = "timers", type = { collection = { named = "Timer" } }, stored = "collection" },
  { path = "timers.*.label", type = "text", label = true },
  { path = "timers.*.duration_ms", type = "int", readonly = true },
  { path = "timers.*.ends_at_ms", type = { option = "int" }, readonly = true },
  { path = "timers.*.paused_remaining_ms", type = { option = "int" }, readonly = true },
  { path = "stopwatch", type = { named = "Stopwatch" }, readonly = true, stored = "record" },
  { path = "stopwatch.accumulated_ms", type = "int" },
  { path = "stopwatch.started_at_ms", type = { option = "int" } },
  { path = "stopwatch.laps_ms", type = { list = "int" } },
]

[[resources.verbs]]
id = "add-world-clock"
kind = "undoable"
params = [
  { name = "city", type = "text", required = true, schema = { type = "string" } },
  { name = "timezone", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "remove-world-clock"
kind = "undoable"
params = [
  { name = "world_clock", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-alarm"
kind = "undoable"
params = [
  { name = "label", type = "text", required = true, schema = { type = "string" } },
  { name = "hour", type = "int", required = true, schema = { type = "integer", maximum = 255, minimum = 0 } },
  { name = "minute", type = "int", required = true, schema = { type = "integer", maximum = 255, minimum = 0 } },
  { name = "weekdays", type = { list = { named = "WeekdayKey" } }, required = true, schema = { type = "array", items = { type = "string", enum = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] } } },
]

