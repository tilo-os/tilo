[[resources]]
kind = "clocks.collection"
label = "Clocks"
version = 1
fields = [
  { path = "world_clocks", type = "Collection<WorldClock>", stored = "collection" },
  { path = "world_clocks.*.city", type = "String", label = true },
  { path = "world_clocks.*.timezone", type = "Atom", readonly = true },
  { path = "alarms", type = "Collection<Alarm>", stored = "collection" },
  { path = "alarms.*.label", type = "String", label = true },
  { path = "alarms.*.hour", type = "u8" },
  { path = "alarms.*.minute", type = "u8" },
  { path = "alarms.*.repeat", type = "u8" },
  { path = "alarms.*.enabled", type = "bool", readonly = true },
  { path = "alarms.*.enabled_at_ms", type = "i64", readonly = true },
  { path = "timers", type = "Collection<Timer>", stored = "collection" },
  { path = "timers.*.label", type = "String", label = true },
  { path = "timers.*.duration_ms", type = "u64", readonly = true },
  { path = "timers.*.ends_at_ms", type = "Option<i64>", readonly = true },
  { path = "timers.*.paused_remaining_ms", type = "Option<u64>", readonly = true },
  { path = "stopwatch", type = "Stopwatch", readonly = true, stored = "record" },
  { path = "stopwatch.accumulated_ms", type = "u64" },
  { path = "stopwatch.started_at_ms", type = "Option<i64>" },
  { path = "stopwatch.laps_ms", type = "Vec<u64>" },
]

[[resources.verbs]]
id = "add-world-clock"
kind = "undoable"
params = [
  { name = "city", required = true, schema = { type = "string" } },
  { name = "timezone", required = true, schema = { type = "string" } },
]

