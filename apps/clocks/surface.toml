  { name = "minute", required = true, schema = { type = "integer", maximum = 255, minimum = 0 } },
  { name = "weekdays", required = true, schema = { type = "array", items = { type = "string", enum = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] } } },
]

