[[resources.fields]]
owner = "stopwatch"
path = "stopwatch.started_at_ms"
stored = "value"
title = "Started at ms"
type = "Option<i64>"

[[resources.fields]]
owner = "stopwatch"
path = "stopwatch.laps_ms"
stored = "value"
title = "Laps ms"
type = "Vec<u64>"

