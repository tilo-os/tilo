[[resources]]
kind = "clocks.collection"
label = "Clocks"
version = 1

[[resources.fields]]
owner = "clocks"
path = "world_clocks"
stored = "collection"
title = "World clocks"
type = "Collection<WorldClock>"

[[resources.fields]]
label = true
owner = "world-clock"
path = "world_clocks.*.city"
stored = "value"
title = "City"
type = "String"

[[resources.fields]]
owner = "world-clock"
path = "world_clocks.*.timezone"
readonly = true
stored = "value"
title = "The IANA time zone, such as `Asia/Tokyo`"
type = "Atom"

[[resources.fields]]
owner = "clocks"
path = "alarms"
stored = "collection"
title = "Alarms"
type = "Collection<Alarm>"

[[resources.fields]]
label = true
owner = "alarm"
path = "alarms.*.label"
stored = "value"
title = "Label"
type = "String"

[[resources.fields]]
owner = "alarm"
path = "alarms.*.hour"
stored = "value"
title = "Hour"
type = "u8"

[[resources.fields]]
owner = "alarm"
path = "alarms.*.minute"
stored = "value"
title = "Minute"
type = "u8"

[[resources.fields]]
owner = "alarm"
path = "alarms.*.repeat"
stored = "value"
title = "The weekdays it repeats on, Monday as bit 0; none rings once"
type = "u8"

[[resources.fields]]
owner = "alarm"
path = "alarms.*.enabled"
readonly = true
stored = "value"
title = "On: turning it on is a verb, which notes when"
type = "bool"

[[resources.fields]]
owner = "alarm"
path = "alarms.*.enabled_at_ms"
readonly = true
stored = "value"
title = "When it was last turned on, so a deadline from before that (a device"
type = "i64"

[[resources.fields]]
owner = "clocks"
path = "timers"
stored = "collection"
title = "Timers"
type = "Collection<Timer>"

[[resources.fields]]
label = true
owner = "timer"
path = "timers.*.label"
stored = "value"
title = "Label"
type = "String"

[[resources.fields]]
owner = "timer"
path = "timers.*.duration_ms"
readonly = true
stored = "value"
title = "Duration ms"
type = "u64"

[[resources.fields]]
owner = "timer"
path = "timers.*.ends_at_ms"
readonly = true
stored = "value"
title = "Ends at ms"
type = "Option<i64>"

[[resources.fields]]
owner = "timer"
path = "timers.*.paused_remaining_ms"
readonly = true
stored = "value"
title = "Paused remaining ms"
type = "Option<u64>"

[[resources.fields]]
owner = "clocks"
path = "stopwatch"
readonly = true
stored = "record"
