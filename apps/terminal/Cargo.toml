[package]
name = "terminal"
version = "0.2.1"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-xdg-paths = { path = "../../crates/system/xdg-paths" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# OSC 8 links open through `ui::portal::open_uri` (the OpenURI portal on Linux).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
portable-pty = "0.9.0"
# The application runtime the terminal hosts. Only its client half is used:
# the service protocol and the descriptor-passing helper.
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
libc.workspace = true
vte = "0.15.0"
tracing.workspace = true
unicode-width = "0.2.2"
unicode-segmentation = "1.12"
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# OSC 52 clipboard writes carry base64-encoded payloads.
base64.workspace = true
tilo-content = { path = "../../crates/system/content" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }
# Serialises the tests that touch the shared system clipboard / primary
# selection so they don't race each other under the default parallel runner
# (selecting text sets the primary selection, which a middle-click paste test
# then reads — they must not interleave).
serial_test.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
