[package]
name = "terminal"
version = "0.2.1"
edition = "2024"

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["full"] }
portable-pty = "0.9.0"
vte = "0.15.0"
tracing.workspace = true
tracing-subscriber.workspace = true
futures = { workspace = true, default-features = true }
tokio-util = { workspace = true, features = ["codec"] }
unicode-width = "0.2.2"
crossbeam-channel = "0.5.15"
chrono = { workspace = true, default-features = true }
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# OSC 52 clipboard writes carry base64-encoded payloads.
base64.workspace = true

[dev-dependencies]
# Clipboard round-trip assertions in the selection tests. Production code
# copies/pastes through `ui::clipboard_copy` / `ui::clipboard_paste`
# (and `ui::clipboard_copy_primary` for the mouse primary selection), so
# arboard is only a test dependency now — the shared `ui` helper replaced
# the terminal's former direct use.
arboard.workspace = true
# Serialises the tests that touch the shared system clipboard / primary
# selection so they don't race each other under the default parallel runner
# (selecting text sets the primary selection, which a middle-click paste test
# then reads — they must not interleave).
serial_test.workspace = true
