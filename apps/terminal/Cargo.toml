[package]
name = "terminal"
version = "0.2.1"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["terminal-samples"]

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[features]
# The terminal on a computer: the session's shell, its emulator and its window.
# A page has no shell of its own, so it shows the session's commands instead
# (`src/command_list.rs`) and a web build leaves this off
# (`[package.metadata.tilo] web-features`).
default = ["desktop"]
desktop = [
    "dep:alacritty_terminal",
    "dep:anyhow",
    "dep:portable-pty",
    "dep:regex",
    "dep:runtime-portal",
    "dep:taffy",
    "dep:tilo-paths",
    "dep:tilo-process",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:vello",
    "dep:winit",
]
# The canned sessions the screenshot scenarios show: development runs,
# captures and tests only, never a release.
samples = ["desktop"]
thin = ["desktop", "dep:runtime-dylib"]
# Hooks a host's own tests use (`TerminalWidget::attach_input_probe`) in an
# optimised profile, where debug assertions are off.
test-support = []

[package.metadata.tilo]
web-features = []

[dependencies]
# OSC 8 links open through `ui::portal::open_uri` (the OpenURI portal on Linux).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
# Where a session runs, and the environment records it can run in.
tilo-environment = { path = "../../crates/runtime/environment" }
tracing.workspace = true
# Kitty graphics transmissions carry base64-encoded payloads.
base64.workspace = true
# What a command printed, which its record names by content.
tilo-content = { path = "../../crates/system/content", default-features = false }

# The desktop surface's dependencies, on by the `desktop` feature alone.
tilo-process = { version = "0.1.0", path = "../../crates/platform/tilo-process", features = ["native-editor"], optional = true }
tilo-paths = { workspace = true, optional = true }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
portable-pty = { version = "0.9.0", optional = true }
# The application runtime the terminal hosts. Only its client half is used:
# the service protocol and the descriptor-passing helper.
runtime-portal = { path = "../../crates/runtime/runtime-portal", optional = true }
# The VT emulator: parser, grid with scrollback and reflow, modes and replies.
alacritty_terminal = { version = "0.26.0", optional = true }
# The window bar's search can find a regular expression in the scrollback.
regex = { workspace = true, optional = true }
unicode-width = { version = "0.2.2", optional = true }
unicode-segmentation = { version = "1.12", optional = true }
vello = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
taffy = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

# The workspace hack's native feature set does not build for wasm32, and a page
# builds this app for it: name the hack where only a native build sees it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
# A test raises the OS errors a pty read can fail with.
libc.workspace = true
# The stored shape History reads a session's runs by.
tilo-automerge.workspace = true
# Tests see this package's samples. The key must not be the package name:
# a dependency named `terminal` claims `--features terminal/thin` in the
# collection build, and the app then links the whole runtime statically.
terminal-samples = { package = "terminal", path = ".", features = ["samples"] }
tempfile.workspace = true
# ush's own shell, as the process of a session whose runs are recorded.
ush-shell = { path = "../../crates/runtime/ush-shell" }
# ush's host on the Tilo side, for a session whose shell runs there.
ush-tilo = { path = "../../crates/runtime/ush-tilo" }
tilo-test-env = { path = "../../tools/test-env" }
# Serialises the tests that touch the shared system clipboard / primary
# selection so they don't race each other under the default parallel runner
# (selecting text sets the primary selection, which a middle-click paste test
# then reads — they must not interleave).
serial_test.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
