[package]
name = "terminal"
version = "0.2.1"
edition = "2024"

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tokio = { version = "1.52.3", features = ["full"] }
portable-pty = "0.9.0"
vte = "0.15.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tokio-util = { version = "0.7.18", features = ["codec"] }
unicode-width = "0.2.2"
crossbeam-channel = "0.5.15"
chrono = "0.4"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Clipboard for cell-grid text selection (Ctrl+Shift+C). Mirrors the
# feature set used by `ui::widget::text_input` so Wayland data-control
# works without a hard dep on X11. Tracked as a fallback: a parallel
# subagent is extracting a shared `ui::clipboard_copy` helper; once that
# lands the terminal can drop this direct dep and call the helper.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
