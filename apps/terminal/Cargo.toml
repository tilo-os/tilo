[package]
name = "terminal"
version = "0.2.1"
edition = "2024"

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tokio = { version = "1.52.3", features = ["full"] }
portable-pty = "0.9.0"
vte = "0.15.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tokio-util = { version = "0.7.18", features = ["codec"] }
unicode-width = "0.2.2"
crossbeam-channel = "0.5.15"
chrono = "0.4"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# OSC 52 clipboard writes carry base64-encoded payloads.
base64 = "0.22.1"

[dev-dependencies]
# Clipboard round-trip assertions in the selection tests. Production code
# copies/pastes through `ui::clipboard_copy` / `ui::clipboard_paste`
# (and `ui::clipboard_copy_primary` for the mouse primary selection), so
# arboard is only a test dependency now — the shared `ui` helper replaced
# the terminal's former direct use.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Serialises the tests that touch the shared system clipboard / primary
# selection so they don't race each other under the default parallel runner
# (selecting text sets the primary selection, which a middle-click paste test
# then reads — they must not interleave).
serial_test = "3.4.0"
