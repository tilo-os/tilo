returns = { schema = { type = ["object", "array", "null"] } }
params = [
  { name = "runs", type = "text", required = true, schema = { type = "string" } },
  { name = "test", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "stop"
kind = "undoable"

[[resources.verbs]]
id = "record-run"
kind = "undoable"
params = [
  { name = "command", type = "text", required = true, schema = { type = "string" } },
  { name = "cwd", type = "text", required = true, schema = { type = "string" } },
  { name = "started_ms", type = "int", required = true, schema = { type = "integer" } },
  { name = "ended_ms", type = "int", required = true, schema = { type = "integer" } },
  { name = "exit", type = "int", required = true, schema = { type = "integer", maximum = 2147483647, minimum = -2147483648 } },
  { name = "output", type = { option = "any" }, required = false, schema = { oneOf = [{ type = "null" }, { oneOf = [{ type = "array", items = { type = "integer", maximum = 255, minimum = 0 } }, { type = "string", content = true, pattern = "^tilo\\.content:[0-9a-f]{64}(\\.[A-Za-z0-9_-]{43})?$" }, { type = "string", pattern = "^blake3:[0-9a-f]{64}:[0-9]+(:[0-9a-f]{64}\\.[A-Za-z0-9_-]{43})?$" }, { type = "object", properties = { inline = { type = "array" } } }, { type = "null" }] }] } },
  { name = "truncated", type = "bool", required = true, schema = { type = "boolean" } },
  { name = "tool", type = "text", required = true, schema = { type = "string" } },
  { name = "undoable", type = "bool", required = true, schema = { type = "boolean" } },
  { name = "items", type = { list = "any" }, required = true, schema = { type = "array", items = { type = "object", additionalProperties = false, properties = { path = { type = ["string", "null"] }, code = { type = ["string", "null"] }, column = { type = ["integer", "null"], maximum = 4294967295, minimum = 0 }, kind = { type = "string", enum = ["error", "warning", "location", "url", "test-passed", "test-failed", "test-ignored", "change"] }, line = { type = ["integer", "null"], maximum = 4294967295, minimum = 0 }, text = { type = "string" } }, required = ["kind", "text"] } } },
  { name = "request", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "run", type = "text", required = true, schema = { type = "string" } },
]

