[[resources]]
kind = "terminal.session"
label = "Terminal"
version = 1

[[resources.fields]]
owner = "terminal"
path = "target"
readonly = true
stored = "value"
title = "Where the session runs"
type = "Option<Atom>"

[[resources.fields]]
owner = "terminal"
path = "relay_session"
readonly = true
stored = "value"
title = "Relay session"
type = "Option<Atom>"

[[resources.fields]]
owner = "terminal"
path = "pane"
readonly = true
stored = "value"
