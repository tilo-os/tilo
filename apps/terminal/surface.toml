type = "Option<Atom>"

[[resources.verbs]]
description = "Record where the session runs."
id = "record-target"
kind = "undoable"
label = "Record where the session runs"

[[resources.verbs.params]]
name = "target"
required = true

[resources.verbs.params.schema]
description = "An encoded session target"
type = "string"

[[resources.verbs]]
description = "Record the relay session this session re-attaches to, or forget it."
id = "record-relay-session"
kind = "undoable"
label = "Record the relay session this session re-attaches to, or forget it"

[[resources.verbs.params]]
name = "session"
required = false

[resources.verbs.params.schema]
description = "The relay session's id; none to forget it"
type = [
    "string",
    "null",
]

[[resources.verbs]]
description = "Scope presence to a new process's pane."
id = "claim-pane"
kind = "undoable"
label = "Scope presence to a new process's pane"

[[resources.verbs.params]]
name = "pane"
