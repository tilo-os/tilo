  { path = "commands.*.ended_ms", type = "int" },
  { path = "commands.*.exit", type = "int" },
  { path = "commands.*.output", type = "any" },
  { path = "commands.*.truncated", type = "bool" },
  { path = "commands.*.tool", type = "text" },
  { path = "commands.*.undoable", type = "bool" },
  { path = "commands.*.items", type = { list = { named = "CommandItem" } } },
  { path = "requests", type = { outbox = { named = "CommandRequest" } }, readonly = true, unit = true },
]

