[[resources]]
kind = "terminal.session"
label = "Terminal"
version = 1
fields = [
  { path = "target", type = { option = "text" }, readonly = true },
  { path = "relay_session", type = { option = "text" }, readonly = true },
  { path = "pane", type = { option = "text" }, readonly = true },
  { path = "device", type = { option = "text" }, readonly = true },
  { path = "holder", type = { option = "text" }, readonly = true },
  { path = "runs", type = { collection = { named = "Run" } }, readonly = true, stored = "collection" },
  { path = "runs.*.command", type = "text", label = true },
  { path = "runs.*.cwd", type = "text" },
  { path = "runs.*.environment", type = { option = "text" } },
  { path = "runs.*.actor", type = "text" },
  { path = "runs.*.for_person", type = { option = "text" } },
  { path = "runs.*.started_ms", type = "int" },
  { path = "runs.*.ended_ms", type = "int" },
  { path = "runs.*.exit", type = "int" },
  { path = "runs.*.output", type = "any" },
  { path = "runs.*.truncated", type = "bool" },
  { path = "runs.*.tool", type = "text" },
  { path = "runs.*.undoable", type = "bool" },
  { path = "runs.*.items", type = { list = { named = "RunItem" } } },
  { path = "requests", type = { outbox = { named = "RunRequest" } }, readonly = true, unit = true },
]

[[resources.verbs]]
id = "run"
kind = "outside"
returns = { schema = { type = ["object", "array", "null"] } }
params = [
  { name = "command", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
