format = 2

[[resources]]
kind = "terminal.session"
label = "Terminal"
version = 1
fields = [
  { path = "target", type = { option = "text" }, readonly = true },
  { path = "relay_session", type = { option = "text" }, readonly = true },
  { path = "pane", type = { option = "text" }, readonly = true },
  { path = "device", type = { option = "text" }, readonly = true },
  { path = "holder", type = { option = "actor" }, readonly = true },
  { path = "commands", type = { collection = { named = "Command" } }, readonly = true, stored = "collection" },
  { path = "commands.*.command", type = "text", label = true },
  { path = "commands.*.cwd", type = "text" },
  { path = "commands.*.environment", type = { option = "text" } },
  { path = "commands.*.actor", type = { option = "actor" } },
  { path = "commands.*.for_person", type = { option = "text" } },
