  { name = "ask", fields = [{ name = "param", type = "any" }] },
  { name = "ai", fields = [{ name = "prompt", type = "text" }, { name = "input", type = { option = "any" } }, { name = "output", type = { option = "any" } }] },
  { name = "task", fields = [{ name = "instruction", type = "text" }, { name = "allow", type = { list = "any" } }, { name = "output", type = { option = "any" } }] },
  { name = "read", fields = [{ name = "app", type = "text" }, { name = "record", type = "text" }, { name = "joined", type = "bool" }] },
]

