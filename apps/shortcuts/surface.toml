# The app's public surface, written by `tilo-app surface`: its resources' verbs
# and stored fields. Review changes to it like an API change; `tilo-app check`
# fails when the code and this file disagree.

[[resources]]
kind = "shortcuts.workbench"
label = "Shortcuts"
version = 1

[[resources.fields]]
owner = "workbench"
path = "drafts"
stored = "collection"
title = "Drafts"
type = "Collection<Draft>"

[[resources.fields]]
label = true
owner = "draft"
path = "drafts.*.name"
stored = "value"
title = "Name"
type = "String"

[[resources.fields]]
owner = "draft"
path = "drafts.*.shortcut_id"
stored = "value"
title = "The id the shortcut is saved under"
type = "String"

[[resources.fields]]
owner = "draft"
path = "drafts.*.inputs"
stored = "collection"
title = "The shortcut's inputs, keyed by name"
type = "Collection<Json<Option<ActionParam>>>"

[[resources.fields]]
owner = "draft"
path = "drafts.*.steps"
stored = "collection"
title = "Every step at every depth, in program order; a step names the block"
type = "Collection<StepNode>"

[[resources.fields]]
owner = "step-node"
path = "drafts.*.steps.*.parent"
stored = "value"
title = "The item id of the step whose block holds this one; empty at the top"
type = "Atom"

[[resources.fields]]
owner = "step-node"
path = "drafts.*.steps.*.branch"
stored = "value"
title = "Which block of the parent: `then`, `else` or `each`; empty at the top"
type = "Atom"

[[resources.fields]]
owner = "step-node"
path = "drafts.*.steps.*.id"
stored = "value"
title = "The step's own id, which bindings to its output name"
type = "Atom"

[[resources.fields]]
owner = "step-node"
path = "drafts.*.steps.*.head"
stored = "value"
title = "What the step does, apart from its arguments and blocks"
type = "Json<Option<Head>>"

[[resources.fields]]
owner = "step-node"
path = "drafts.*.steps.*.args"
stored = "value"
title = "An action step's arguments, each bound on its own"
type = "BTreeMap<String, Json<Option<Binding>>>"

[[resources.fields]]
owner = "draft"
path = "drafts.*.output"
stored = "value"
title = "What a finished run reports back"
type = "Json<Option<Binding>>"

[[resources.fields]]
owner = "draft"
path = "drafts.*.triggers"
stored = "value"
title = "Carried unchanged from the saved shortcut, so editing its steps"
type = "Json<Vec<TriggerSpec>>"

[[resources.fields]]
owner = "draft"
path = "drafts.*.replaces_saved"
stored = "value"
title = "Whether saving replaces a saved shortcut rather than creating one"
type = "bool"

[[resources.verbs]]
id = "new-draft"
kind = "undoable"
label = "Start a new shortcut"

[[resources.verbs.params]]
name = "name"
required = true

[resources.verbs.params.schema]
type = "string"

[[resources.verbs]]
id = "open-shortcut"
kind = "undoable"
label = "Open a saved shortcut as a draft to change it"

[[resources.verbs.params]]
name = "shortcut"
required = true

[resources.verbs.params.schema]

