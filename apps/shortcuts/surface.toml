format = 2

[[resources]]
kind = "shortcuts.workbench"
label = "Shortcuts"
version = 4
fields = [
  { path = "drafts", type = { collection = { named = "Draft" } }, stored = "collection" },
  { path = "drafts.*.name", type = "text", label = true },
  { path = "drafts.*.shortcut_id", type = "text" },
  { path = "drafts.*.inputs", type = { collection = "any" }, stored = "collection" },
  { path = "drafts.*.steps", type = { collection = { named = "StepNode" } }, stored = "collection" },
  { path = "drafts.*.steps.*.parent", type = "text" },
  { path = "drafts.*.steps.*.branch", type = "text" },
  { path = "drafts.*.steps.*.id", type = "text" },
  { path = "drafts.*.steps.*.head", type = { option = { named = "Head" } } },
  { path = "drafts.*.steps.*.args", type = { map = "any" } },
  { path = "drafts.*.steps.*.on_error", type = "any" },
  { path = "drafts.*.output", type = { option = "any" } },
  { path = "drafts.*.triggers", type = { list = "any" } },
  { path = "drafts.*.step_timeout_secs", type = { option = "int" } },
  { path = "drafts.*.replaces_saved", type = "bool" },
  { path = "ignored", type = { list = "text" } },
]

