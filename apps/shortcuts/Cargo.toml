[package]
name = "shortcuts"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["shortcuts-samples"]

[lib]
name = "shortcuts"
path = "src/lib.rs"

[[bin]]
name = "shortcuts"
path = "src/main.rs"

[features]
# The sample shortcuts and catalogue the screenshot scenarios show:
# development runs, captures and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-action-policy = { path = "../../crates/collab/action-policy" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The shortcut program, its checker and the least-authority grant vocabulary.
tilo-automation = { path = "../../crates/collab/automation", features = ["model"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `shortcuts` claims `--features shortcuts/thin` in the
# collection build, and the app then links the whole runtime statically.
shortcuts-samples = { package = "shortcuts", path = ".", features = ["samples"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
