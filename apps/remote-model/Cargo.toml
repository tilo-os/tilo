[package]
name = "remote-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Remote's resource: the saved connections a workspace keeps, with the checks that keep each profile connectable"

# The resource Remote keeps and an agent adds through the same verbs. It has no
# window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# SSH and VNC transports, the window, its sessions, the form being filled in and
# every credential stay in the app, on the device that connects.

[lib]
name = "remote_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# A Tilo device's address is its certified endpoint id, which the model reads to
# tell a real one from a friendly name.
iroh-base = { workspace = true, features = ["key"] }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[dev-dependencies]
tilo-test-env = { path = "../../crates/dev/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
