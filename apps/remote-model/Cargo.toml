[package]
name = "remote-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Remote's resource: the saved connections a workspace keeps, with the checks that keep each profile connectable"

# The resource Remote keeps and an agent adds through the same verbs. It has no
# window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# SSH and VNC transports, the window, its sessions, the form being filled in and
# every credential stay in the app, on the device that connects.

[lib]
name = "remote_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# A Tilo device's address is its certified endpoint id: an Ed25519 public key,
# hex or base32, which the model reads to tell a real one from a friendly name.
# It decodes the text itself and checks the key with ed25519-dalek, as iroh-base
# does, rather than through iroh-base, whose `key` feature turns on getrandom's
# browser backend, which a model module (no JavaScript host) cannot link. The
# two decodings are a few lines; data-encoding's general codec would be most of
# the app's model module.
ed25519-dalek.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[dev-dependencies]
# Real endpoint ids for the tests, made as a device makes its own.
iroh-base = { workspace = true, features = ["key"] }
data-encoding.workspace = true
tilo-test-env = { path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
