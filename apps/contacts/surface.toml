[[resources.verbs]]
description = "Merge contacts.  Merges another contact into this one and deletes it. Every phone number, email address, postal address and group of either is kept; a field both fill keeps this contact's value unless it is named to be taken from the other."
destructive = true
id = "merge-contacts"
kind = "undoable"
label = "Merge contacts"

[[resources.verbs.params]]
name = "contact"
required = true

[resources.verbs.params.schema]
description = "Contact"
type = "string"

[[resources.verbs.params]]
name = "source"
required = true

[resources.verbs.params.schema]
description = "The contact merged into it and deleted"
format = "uuid"
type = "string"

[[resources.verbs.params]]
name = "take_from_source"
required = true

[resources.verbs.params.schema]
description = "The fields to take from the merged contact: First, Last, Organization, Title, Website, Birthday, Notes"
type = "array"

[resources.verbs.params.schema.items]
description = "One field on which a duplicate review can deliberately keep the other contact's scalar value.  Repeated fields are always unioned by their normalized value, so no unique phone, email, group, or address is silently thrown away."
enum = [
    "First",
    "Last",
    "Organization",
    "Title",
    "Website",
    "Birthday",
    "Notes",
]
type = "string"

