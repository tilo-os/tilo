[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "contacts"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "contacts"
path = "src/lib.rs"

[[bin]]
name = "contacts"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-contact-directory = { path = "../../crates/platform/tilo-contact-directory" }
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["priority-contacts"] }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# NFC makes a person or group's identity independent of whether an input
# method produced a precomposed or decomposed spelling.  Keeping this local to
# Contacts avoids widening the public SDK for an app-level matching policy.
unicode-normalization = "0.1.25"
# RFC 6350 content lines: folding, parameter quoting and TEXT escaping.
pim-lines = { path = "../../crates/text/pim-lines" }

# --- Host-native file open/save (XDG Desktop Portal) ------------------
# Import (open) and Export (save) go through
# org.freedesktop.portal.FileChooser (via ashpd) — an app never draws its
# own file picker and never keys off an env var (HIG §5). On GNOME the user
# sees GNOME's file chooser; on Tilo the compositor's portal backend renders
# Tilo's picker (and hosts the per-cluster file-access prompt). The portal
# call runs off the UI thread on its own small Tokio runtime and the chosen
# paths come back over a shared `ui::portal` channel. All three are already
# resolved in the shared workspace lockfile, so this adds no registry fetch.

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# Serialises the tests that construct scratch files / drive the portal
# drain path so parallel runs don't race on the shared temp dir.
serial_test.workspace = true
# Schema-validate the app manifest (`tilo-app.toml`) in a test so the vCard
# file-type association it declares is checked against the packaging schema.
# Already resolved in the workspace lockfile.
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
# Reads the history sentences the book's changes record.

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
