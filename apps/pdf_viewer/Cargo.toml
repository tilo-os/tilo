[package]
name = "pdf_viewer"
version = "0.1.0"
edition = "2024"

[lib]
name = "pdf_viewer"
path = "src/lib.rs"

[[bin]]
name = "pdf_viewer"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Real PDF page rasterisation via a dynamically-loaded pdfium; falls back to
# pure-Rust text extraction when the native library is not present.
pdfium-render = "0.8.37"
pdf-extract = "0.7.12"
