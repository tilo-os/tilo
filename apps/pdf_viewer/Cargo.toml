[package]
name = "pdf_viewer"
version = "0.1.0"
edition = "2024"

[lib]
name = "pdf_viewer"
path = "src/lib.rs"

[[bin]]
name = "pdf_viewer"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui", features = ["portal"] }
automerge.workspace = true
# The qOS ACTION model: the reader's `actions` module exports its markup-store
# operations as replayable actions the host's Ctrl+K palette dispatches.
qos-actions = { path = "../../crates/collab/actions" }
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Real PDF page rasterisation via a dynamically-loaded pdfium; falls back to
# pure-Rust text extraction when the native library is not present.
pdfium-render = "0.8.37"
pdf-extract = "0.7.12"
# Decode imported images (PNG/JPEG/…) to place them as new PDF pages. Pinned to
# the same 0.25 line pdfium-render uses so `DynamicImage` unifies to one type.
image = { workspace = true, features = ["png", "jpeg"] }
# Host-native file open/save through the XDG Desktop Portal
# (org.freedesktop.portal.FileChooser). On GNOME the user sees GNOME's file
# chooser; on qOS the compositor's portal backend renders qOS's picker. The
# portal call runs off the UI thread on its own small Tokio runtime and the
# chosen path is delivered back over a channel (see `app::portal`).

[dev-dependencies]
# Serialise the tests that touch the shared system clipboard so they never race
# each other for it (arboard talks to the real Wayland/X11 clipboard).
serial_test.workspace = true
# Two real files on disk, so "open a second document" is the real thing rather
# than the same path twice.
tempfile.workspace = true

[lints]
workspace = true
