[package]
name = "passwords-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Passwords model as the WebAssembly module its package carries: the vault's empty record, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
# A package carries these bytes to every device: short, and nothing in them a
# reader can use but the ABI.
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"

[dependencies]
passwords-model = { path = "../passwords-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }

# Not a member of the repository's workspace: a package carries it built for
# wasm32 (`tilo-app model`), never for the machine that packages it.
[workspace]

# The module links no browser glue: getrandom takes its custom backend here,
# which 0.4.3 needs one cfg arm fixed to compile beside the `wasm_js` feature
# the rest of the repository enables for wasm targets
# (`vendor/getrandom/TILO-PATCH.md`).
[patch.crates-io]
getrandom = { path = "../../vendor/getrandom" }
