[[resources.verbs]]
id = "diff-layout"
kind = "read"

[[resources.verbs]]
id = "syntax-highlight"
kind = "read"

[[resources.verbs]]
id = "show-whitespace"
kind = "read"

[[resources.verbs]]
id = "wrap-lines"
kind = "read"

[[resources.types]]
name = "Branch"
fields = [
  { name = "name", type = "text" },
  { name = "is_head", type = "bool" },
  { name = "is_remote", type = "bool" },
  { name = "upstream", type = { option = "text" } },
  { name = "ahead", type = "int" },
  { name = "behind", type = "int" },
  { name = "tip", type = "text" },
]

[[resources.types]]
name = "ChangeArea"
cases = [
  { name = "Staged" },
  { name = "Unstaged" },
  { name = "Untracked" },
]

[[resources.types]]
name = "ChangeKind"
cases = [
  { name = "Added" },
  { name = "Modified" },
  { name = "Deleted" },
  { name = "Renamed" },
  { name = "Untracked" },
  { name = "Conflicted" },
]

[[resources.types]]
name = "Commit"
fields = [
  { name = "id", type = "text" },
  { name = "summary", type = "text" },
  { name = "body", type = "text" },
  { name = "author_name", type = "text" },
  { name = "author_email", type = "text" },
  { name = "when", type = "text" },
  { name = "time", type = "int" },
  { name = "parents", type = { list = "text" } },
  { name = "refs", type = { list = { named = "RefLabel" } } },
  { name = "lane", type = "int" },
  { name = "files", type = { list = { named = "FileChange" } } },
]

[[resources.types]]
name = "FileChange"
fields = [
  { name = "path", type = "text" },
  { name = "old_path", type = { option = "text" } },
  { name = "area", type = { named = "ChangeArea" } },
  { name = "kind", type = { named = "ChangeKind" } },
  { name = "additions", type = "int" },
  { name = "deletions", type = "int" },
]

[[resources.types]]
name = "RefKind"
cases = [
  { name = "Head" },
  { name = "LocalBranch" },
  { name = "RemoteBranch" },
  { name = "Tag" },
]

[[resources.types]]
name = "RefLabel"
fields = [
  { name = "name", type = "text" },
  { name = "kind", type = { named = "RefKind" } },
]

[[resources.types]]
name = "Remote"
fields = [
  { name = "name", type = "text" },
  { name = "url", type = "text" },
]

[[resources.types]]
name = "SharedRepo"
fields = [
  { name = "name", type = "text" },
  { name = "head", type = "text" },
  { name = "workdir", type = "text" },
  { name = "commits", type = { list = { named = "Commit" } } },
  { name = "branches", type = { list = { named = "Branch" } } },
  { name = "tags", type = { list = { named = "Tag" } } },
  { name = "stashes", type = { list = { named = "Stash" } } },
  { name = "remotes", type = { list = { named = "Remote" } } },
  { name = "graph_width", type = "int" },
  { name = "author_name", type = "text" },
  { name = "author_email", type = "text" },
]

[[resources.types]]
name = "Stash"
fields = [
  { name = "index", type = "int" },
  { name = "message", type = "text" },
  { name = "branch", type = "text" },
]

[[resources.types]]
name = "Tag"
fields = [
  { name = "name", type = "text" },
  { name = "target", type = "text" },
  { name = "message", type = { option = "text" } },
]

