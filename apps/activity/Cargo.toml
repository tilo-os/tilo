[package]
name = "activity"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "What changed in a workspace: what is new since you were last here, its history, and a replay of its layout"

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["activity-samples"]

[lib]
name = "activity"
path = "src/lib.rs"

[[bin]]
name = "activity"
path = "src/main.rs"

[features]
# The sample activity and the screenshot scenarios that show it: development
# runs, captures and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
serde.workspace = true
serde_json.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `activity` claims `--features activity/thin` in the
# collection build, and the app then links the whole runtime statically.
activity-samples = { package = "activity", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
