[package]
name = "firewall-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Firewall model as the WebAssembly module its package carries: the configuration's verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
firewall-model = { path = "../firewall-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }

# The workspace-hack's native feature set does not build for wasm32 (it turns
# on getrandom's browser backend, mio, ...), and a model module is only ever
# built for wasm32 (tools/policy/check_wasm_workspace_hack.py).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
