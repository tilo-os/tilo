format = 2

[[resources]]
kind = "typst-editor.workspace"
label = "Typst workspace"
version = 1
fields = [
  { path = "files", type = { collection = { named = "TypstFile" } }, stored = "collection" },
  { path = "files.*.name", type = "text", label = true },
  { path = "files.*.path", type = { option = "text" }, readonly = true },
  { path = "files.*.source", type = "text" },
]

[[resources.verbs]]
id = "new-file"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string" } },
  { name = "path", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "source", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "saved-at"
kind = "undoable"
params = [
  { name = "file", type = "text", required = true, schema = { type = "string" } },
  { name = "path", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "load"
kind = "undoable"
params = [
  { name = "file", type = "text", required = true, schema = { type = "string" } },
  { name = "name", type = "text", required = true, schema = { type = "string" } },
  { name = "path", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "source", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "close-file"
destructive = true
kind = "undoable"
params = [
  { name = "file", type = "text", required = true, schema = { type = "string" } },
]

[[resources.types]]
name = "TypstFile"
fields = [
  { name = "name", type = "text" },
  { name = "path", type = { option = "text" } },
  { name = "source", type = "text" },
]

