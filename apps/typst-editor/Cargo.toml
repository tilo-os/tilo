[package]
name = "typst-editor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "typst_editor"
path = "src/lib.rs"

[[bin]]
name = "typst-editor"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tilo-paths = { path = "../../crates/platform/tilo-paths" }

# Typst compilation + raster rendering. All pinned to the same 0.15
# series so the `typst` crate instance is unified across compile + render.
typst = "0.15"
typst-render = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
tiny-skia = "0.12"
comemo = "0.5"
# Typst's bundled fonts: embedded natively, fetched from the host by a page.
tilo-typst-fonts = { path = "../../crates/platform/tilo-typst-fonts" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
