[package]
name = "typst-editor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["typst-editor-samples"]

[lib]
name = "typst_editor"
path = "src/lib.rs"

[[bin]]
name = "typst-editor"
path = "src/main.rs"

[features]
# The documents the screenshot scenarios show: development runs, captures and
# tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]
# Link Typst from its engine library in the runtime bundle
# (libtilo_typst_engine.so, crates/runtime/engines/typst) instead of the
# executable. The release collection enables it (dist/apps/app-collections.toml);
# a `thin` build without it (`tilo-app dev`) links Typst statically, because
# the engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-typst-engine/thin"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-typst-engine = { path = "../../crates/runtime/engines/typst", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Typst compilation + raster rendering. All pinned to the same 0.15
# series so the `typst` crate instance is unified across compile + render.
typst = "0.15"
typst-render = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
# The page pipeline every page viewer draws through: render queue, bitmap
# cache, tiles.
tilo-page-raster = { path = "../../crates/sdk/tilo-page-raster" }
comemo = "0.5"
# Typst's bundled fonts: embedded natively, fetched from the host by a page.
tilo-typst-fonts = { path = "../../crates/platform/tilo-typst-fonts" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `typst-editor` claims `--features typst-editor/thin` in the
# collection build, and the app then links the whole runtime statically.
typst-editor-samples = { package = "typst-editor", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true
