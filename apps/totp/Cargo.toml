[package]
name = "totp"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "totp"
path = "src/lib.rs"

[[bin]]
name = "totp"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Tilo resource and action model for replayable account mutations.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# RFC 6238 is implemented in-crate using RustCrypto HMAC/SHA primitives and
# RFC 4648 base32 decoding.
hmac.workspace = true
sha1 = "0.11"
sha2.workspace = true
data-encoding.workspace = true
data-encoding-macro.workspace = true

# Pure-Rust QR detection over image-decoded greyscale buffers. Image codecs
# are limited to PNG and JPEG for screenshot/photo imports.
rqrr = { workspace = true, default-features = true }
image = { workspace = true, features = ["png", "jpeg"] }

# Host-native screenshot/photo selection uses the XDG file portal.
# `zeroize` clears derived HMAC keys.
zeroize.workspace = true

[dev-dependencies]
# Render otpauth QR codes in tests to exercise the rqrr decode path.
qrcode.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
