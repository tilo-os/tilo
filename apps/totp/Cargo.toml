[package]
name = "totp"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "totp"
path = "src/lib.rs"

[[bin]]
name = "totp"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
bounded-command = { path = "../../crates/system/bounded-command" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
# Tilo resource and action model for replayable account mutations.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# RFC 6238 is implemented in-crate using RustCrypto HMAC/SHA primitives and
# RFC 4648 base32 decoding.
hmac.workspace = true
sha1 = "0.10"
sha2.workspace = true
base32.workspace = true

# Pure-Rust QR detection over image-decoded greyscale buffers. Image codecs
# are limited to PNG and JPEG for screenshot/photo imports.
rqrr = { workspace = true, default-features = true }
image = { workspace = true, features = ["png", "jpeg"] }

# Host-native screenshot/photo selection uses the XDG file portal.
# TOTP secrets are sealed at rest with XChaCha20-Poly1305; `rand_core`'s OsRng
# supplies key/nonce material and `zeroize` clears plaintext and derived keys.
chacha20poly1305.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
private-fs = { path = "../../crates/system/private-fs" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
# Render otpauth QR codes in tests to exercise the rqrr decode path.
qrcode.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }

[lints]
workspace = true
