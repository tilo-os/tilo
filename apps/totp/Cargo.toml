[package]
name = "totp"
version = "0.1.0"
edition = "2024"

[lib]
name = "totp"
path = "src/lib.rs"

[[bin]]
name = "totp"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui", features = ["portal"] }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

# --- TOTP / 2FA code generation ---------------------------------------
# RFC 6238 (TOTP) is implemented in-crate (src/totp.rs) directly on the
# audited RustCrypto HMAC/SHA primitives below + RFC 4648 base32 secret
# decoding. These four crates are already resolved in the workspace
# lockfile (pulled transitively by the iroh/fs stack), so adding them as
# direct dependencies needs no network fetch and keeps the shared build
# green. `totp-rs` was evaluated, but it is NOT in the lock and would
# force a registry fetch; building the ~30-line RFC 6238 core on top of
# these primitives is the lighter, build-safe choice and gives full
# control over the otpauth:// param surface the UI exposes.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base32 = "0.5"

# --- QR import (decode an otpauth:// URI out of a screenshot/photo) ----
# Pure-Rust QR detection (the `quirc` algorithm) over an image-decoded
# greyscale buffer — no camera, no native libs, works offline today. Both
# crates are already resolved in the shared workspace lockfile (rqrr's only
# extra deps are g2p + lru, both present), so this needs no registry fetch
# and keeps the fleet build green. `image` is pinned to the formats a
# saved authenticator code actually arrives in (PNG screenshots, JPEG
# photos); the default codec zoo is disabled to keep the build lean.
rqrr = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- Encryption-at-rest for the vault ---------------------------------
# TOTP secrets are long-lived bearer credentials, so the vault is sealed
# on disk with XChaCha20-Poly1305 (a 192-bit-nonce AEAD) under a 256-bit
# key. `getrandom` draws the key + per-write nonce straight from the OS
# CSPRNG; `zeroize` wipes decrypted plaintext and derived key bytes from
# the heap once they're no longer needed. All three are already resolved
# in the shared workspace lockfile (pulled transitively by the iroh/fs
# stack), so this adds no registry fetch and keeps the fleet build green.
# default-features are off so we don't pull chacha's optional RNG surface
# — randomness comes from `getrandom` directly.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
# Render known otpauth QR codes in tests so the decoder is exercised on the
# real rqrr detect+decode path, not a mock. Already in the lockfile.
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
