[[resources.verbs]]
description = "Paint brush strokes on a layer in one step. On an oil or watercolour layer the medium simulates real paint; on a plain layer the brush preset draws them: pen for clean line art (pressure swells the line), pencil or charcoal to shade (pressure sets darkness; charcoal catches the paper), marker for flat see-through tone, airbrush for soft glows, calligraphy for lettering. brush eraser (no colour) clears paint under it on its layer; remove-marks along takes whole strokes. Each stroke: points [[x,y] or [x,y,pressure]], size, colour (#rrggbb or pigment:<name>). Answers the new ids. One stroke can be many: forks grows a branch or bare tree; dabs scatters foliage, flowers or (with `dab_length`, angle -90) grass; hatch shades the area its points enclose. Work like a painter, looking close after each passage: big shapes first; then forms in a few values (dark mass, middle, lit side); small lights and accents last."
id = "paint"
kind = "undoable"
label = "Paint strokes"

[[resources.verbs.params]]
name = "layer"
required = false

[resources.verbs.params.schema]
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "strokes"
required = true

[resources.verbs.params.schema]
type = "array"

[resources.verbs.params.schema.items]
additionalProperties = false
description = "One brush stroke."
required = [
    "points",
    "size",
]
type = "object"

[resources.verbs.params.schema.items.properties.angle]
description = "With `dabs`, the way they point in degrees (-90 is up; along the path when absent); with `hatch`, the lines' (default 45)."
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.brush]
description = "Plain layers: `pen` (crisp ink, pressure sets width), `pencil` (grainy, pressure sets darkness), `marker` (flat, overlaps darken), `airbrush` (soft spray that builds up), `charcoal` (picks up the ground's tooth), `calligraphy` (broad nib at `angle`, default 45). Any layer: `eraser` clears paint beneath it on its layer. A round ink brush when absent. Plain layers: `pixel` and `pixel-eraser` paint or clear whole square cells, ignoring pressure and taper."
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.items.properties.clip]
description = "Keep the paint inside this mark's shape, as a painter cuts in against an edge: texture a rock or a crown within its silhouette. Or `selection` (its area now), or an area's SVG path data."
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.items.properties.colour]
description = "`#rrggbb[aa]` or `pigment:<name>`; an eraser takes none."
type = "string"

[resources.verbs.params.schema.items.properties.dab_length]
description = "With `dabs`: how long each is, in units (about `size` when absent); much longer than `size`, each is a flick lifting to a point (grass)."
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.dabs]
description = "Instead of one line, this many short dabs (1-600) of `size` scattered along the points: foliage, flowers, broken light."
maximum = 4294967295
minimum = 0
type = [
    "integer",
    "null",
]

[resources.verbs.params.schema.items.properties.forks]
description = "A limb that lifts to a point and forks this many times (1-6) into ever thinner twigs: a branch or a bare tree in one stroke."
maximum = 4294967295
minimum = 0
type = [
    "integer",
    "null",
]

[resources.verbs.params.schema.items.properties.hatch]
description = "Instead of one line, lines this many units apart across the area the points enclose: shading in one stroke; another at a second angle cross-hatches."
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.id]
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.items.properties.name]
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.items.properties.opacity]
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.params]
description = """Medium overrides on a painted layer (`{"load": 0.2}` for dry brush); on a plain layer the brush's flow, hardness, spacing, smoothing and taper, each 0..=1."""
type = [
    "object",
    "null",
]

[resources.verbs.params.schema.items.properties.points]
description = "`[[x, y], …]` or `[[x, y, pressure], …]`, pressure `0..=1`; the stroke is smoothed through them, so a few points make a curve."
type = "array"

[resources.verbs.params.schema.items.properties.points.items]
type = "array"

[resources.verbs.params.schema.items.properties.points.items.items]
type = "number"

[resources.verbs.params.schema.items.properties.scatter]
description = "With `dabs`: how far they stray either side of the path, in units (default twice `size`)."
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.size]
description = "Brush width in units."
type = "number"

[resources.verbs.params.schema.items.properties.spread]
description = "With `forks`: how widely the twigs splay, in degrees (default 35)."
type = [
    "number",
    "null",
]

[resources.verbs.params.schema.items.properties.wet]
description = "Paint into what is still wet: blends in oil, bleeds in watercolour."
type = [
    "boolean",
    "null",
]

[[resources.verbs.params]]
name = "group"
required = false

[resources.verbs.params.schema]
type = [
    "string",
    "null",
]

[[resources.verbs]]
description = "Draw shapes on a layer in one step: rect, ellipse, polygon, line, path (SVG d), text, stroke or image (src: a file path, content address or data: URI; a unit per pixel unless sized), each with fill, gradient, stroke and opacity. Answers the new ids; or give your own. On a painted layer filled shapes are laid in with the brush: paint a building or small figure as filled planes (lit and shadow side) with a small brush, not as many strokes."
id = "draw"
kind = "undoable"
label = "Draw shapes"

[[resources.verbs.params]]
name = "layer"
