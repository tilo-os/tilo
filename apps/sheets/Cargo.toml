[package]
name = "sheets"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "sheets"
path = "src/lib.rs"

[[bin]]
name = "sheets"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
xdg-paths = { path = "../../crates/system/xdg-paths" }
atomic-file = { path = "../../crates/system/atomic-file" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
# The Tilo action model: doc-mutating operations are replayable, undoable actions.
tilo-actions = { path = "../../crates/collab/actions" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Spreadsheet interchange (.xlsx/.ods) through qdoc's bounded, XXE-hardened
# codecs, and its A1 reference helpers.
qdoc = { path = "../../crates/doc/qdoc" }
uuid.workspace = true

[dev-dependencies]
# Builds real-world-shaped .xlsx/.ods fixtures and inspects exported packages.
zip.workspace = true

[lints]
workspace = true
