[package]
name = "sheets"
version = "0.1.0"
edition = "2024"

[lib]
name = "sheets"
path = "src/lib.rs"

[[bin]]
name = "sheets"
path = "src/main.rs"

[dependencies]
# One owner for ~/.config/qos/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
# The qOS action model: doc-mutating operations are replayable, undoable actions.
qos-actions = { path = "../../crates/collab/actions" }
ui = { path = "../../ui", features = ["portal"] }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Per-user config path resolution for the shared global-settings store.
dirs.workspace = true
# Spreadsheet interchange: calamine reads .xlsx/.ods; rust_xlsxwriter writes
# .xlsx; the .ods writer is hand-rolled on top of `zip` (a flat-XML archive).
calamine = "0.26"
rust_xlsxwriter = "0.79"
zip.workspace = true

[lints]
workspace = true
