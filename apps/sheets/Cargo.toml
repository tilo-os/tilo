[package]
name = "sheets"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["sheets-samples"]

[lib]
name = "sheets"
path = "src/lib.rs"

[[bin]]
name = "sheets"
path = "src/main.rs"

[features]
# The sample workbook and the screenshot scenarios that show it: development
# runs, captures and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-locale = { path = "../../crates/platform/tilo-locale" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The Tilo action model: doc-mutating operations are replayable, undoable actions.
tilo-actions = { path = "../../crates/collab/actions" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Spreadsheet interchange (.xlsx/.ods) through tilo-doc's bounded, XXE-hardened
# codecs, and its A1 reference helpers.
tilo-doc = { path = "../../crates/doc/tilo-doc" }
tilo-doc-codecs = { path = "../../crates/doc/tilo-doc-codecs", default-features = false, features = ["xlsx", "ods"] }
# The comment-thread model the document apps share.
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# A Notion export arrives as an archive; it is read through the same bounded
# zip reader as every other untrusted archive.
uuid.workspace = true
ironcalc_base.workspace = true
iana-time-zone.workspace = true

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `sheets` claims `--features sheets/thin` in the
# collection build, and the app then links the whole runtime statically.
sheets-samples = { package = "sheets", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# Builds the export archives the Notion importer is tested against, and
# real-world-shaped .xlsx/.ods fixtures and inspects exported packages.
zip.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
