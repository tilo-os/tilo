[package]
name = "sheets"
version = "0.1.0"
edition = "2024"

[lib]
name = "sheets"
path = "src/lib.rs"

[[bin]]
name = "sheets"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Per-user config path resolution for the shared global-settings store.
dirs = "6.0.0"
# Spreadsheet interchange: calamine reads .xlsx/.ods; rust_xlsxwriter writes
# .xlsx; the .ods writer is hand-rolled on top of `zip` (a flat-XML archive).
calamine = "0.26"
rust_xlsxwriter = "0.79"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
