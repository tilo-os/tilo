[package]
name = "disks"
version = "0.1.0"
edition = "2024"

[lib]
name = "disks"
path = "src/lib.rs"

[[bin]]
name = "disks"
path = "src/main.rs"

[features]
default = []
# `live` links udisks2 over D-Bus (zbus) for privileged mount / unmount /
# format. OFF by default so the standard build, unit tests and `--shots`
# never pull in zbus and never touch the system bus. The CLI fallback
# (`udisksctl`, `mount`/`umount`/`mkfs.<fs>`) and the read benchmark compile
# unconditionally but only run when `DISKS_LIVE` is set at runtime.
live = ["dep:zbus"]

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Pinned to match `apps/chat` so a single zbus copy resolves from the lock.
zbus = { workspace = true, optional = true, default-features = true }
