[package]
name = "disks"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["qos-actions"]

[lib]
name = "disks"
path = "src/lib.rs"

[[bin]]
name = "disks"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The real udisks2 transport ships on by default: `live` links udisks2 over
# D-Bus (zbus) for privileged mount / unmount / format, so a normally-built
# `disks` performs real operations. The system-bus connection is opened only
# when `DISKS_LIVE` is set at runtime (and only on an explicit device action) —
# `--shots`, unit tests and any headless render seed the curated sample topology
# and never set DISKS_LIVE, so the feature compiles the udisks2 path in while
# the runtime env decides whether it touches the bus.
default = ["live"]
# `live` links udisks2 over D-Bus (zbus) for privileged mount / unmount /
# format. The CLI fallback (`udisksctl`, `mount`/`umount`/`mkfs.<fs>`) and the
# read benchmark compile unconditionally; the zbus path runs only when
# `DISKS_LIVE` is set at runtime.
live = ["dep:zbus"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# vello / taffy / winit / automerge are reached through `ui::` — the toolkit
# re-exports its own stack so there is exactly one copy of each in the binary,
# and it is the one the widget tree was compiled against.
ui = { path = "../../ui" }
qos-actions = { path = "../../crates/collab/actions" }
serde.workspace = true
serde_json.workspace = true
# Pinned to match `apps/chat` so a single zbus copy resolves from the lock.
zbus = { workspace = true, optional = true, default-features = true }

[lints]
workspace = true
