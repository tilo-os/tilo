[package]
name = "containers"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["qos-actions"]

[lib]
name = "containers"
path = "src/lib.rs"

[[bin]]
name = "containers"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "qos-app", path = "../../crates/app/qos-app" }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[lints]
workspace = true
