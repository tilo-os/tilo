[package]
name = "containers"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "containers"
path = "src/lib.rs"

[[bin]]
name = "containers"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
bounded-command = { path = "../../crates/system/bounded-command" }
# Container shells open in Terminal through the shell's typed tool service.
runtime-portal = { path = "../../crates/runtime/runtime-portal", default-features = false }
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }

[lints]
workspace = true
