[package]
name = "monitor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["monitor-samples"]

[lib]
name = "monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[features]
# The sample snapshot and scenarios the captures show: development runs and
# tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]
test-support = ["ui/test-support"]

[dependencies]
# The resource the app draws: the shared table layout and its sort keys.
monitor-model = { path = "../monitor-model" }
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true

# The system information service: the session's on Linux (the sandbox shows
# Monitor no other process, so it never reads /proc itself), one in this
# process over the platform's own interfaces elsewhere.
tilo-system-info = { path = "../../crates/platform/tilo-system-info" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
monitor-samples = { package = "monitor", path = ".", features = ["samples"] }
tilo-test-env = { path = "../../tools/test-env" }
# The tests serve the session's service themselves.
tilo-system-stats = { path = "../../crates/system/system-stats" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
