[package]
name = "monitor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true


[lib]
name = "monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
test-support = ["ui/test-support"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
sysinfo.workspace = true
tracing.workspace = true
host-info = { path = "../../crates/system/host-info" }
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }

[lints]
workspace = true
