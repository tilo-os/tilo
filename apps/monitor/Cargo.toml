[package]
name = "monitor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true


[lib]
name = "monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
test-support = ["ui/test-support"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
workspace-hack = { version = "0.1" }

# Linux: the session's system information service. The sandbox shows
# Monitor no other process, so it never reads /proc itself.
[target.'cfg(target_os = "linux")'.dependencies]
tilo-system-stats = { path = "../../crates/system/system-stats" }

# Elsewhere (macOS): the platform's own interfaces.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo.workspace = true
host-info = { path = "../../crates/system/host-info" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
