[package]
name = "monitor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true


[lib]
name = "monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
test-support = ["ui/test-support"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true

# The system information service: the session's on Linux (the sandbox shows
# Monitor no other process, so it never reads /proc itself), one in this
# process over the platform's own interfaces elsewhere.
tilo-system-info = { path = "../../crates/platform/tilo-system-info" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../crates/dev/test-env" }
# The tests serve the session's service themselves.
tilo-system-stats = { path = "../../crates/system/system-stats" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
