  { name = "cwd", required = true, schema = { type = "string" } },
  { name = "started_ms", required = true, schema = { type = "integer" } },
  { name = "ended_ms", required = true, schema = { type = "integer" } },
  { name = "exit", required = true, schema = { type = "integer", maximum = 2147483647, minimum = -2147483648 } },
  { name = "output", required = false, schema = { type = ["string", "null"] } },
  { name = "output_len", required = true, schema = { type = "integer", minimum = 0 } },
