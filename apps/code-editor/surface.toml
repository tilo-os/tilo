[[resources.verbs.params]]
name = "name"
required = true

[resources.verbs.params.schema]
description = "The new name"
type = "string"

[[resources.verbs]]
description = "Move  Move the file or folder into the folder `folder` (the project's root when none), before `before` among its entries or after them all."
id = "move-entry"
kind = "undoable"
label = "Move"

[[resources.verbs.params]]
name = "entry"
required = true

[resources.verbs.params.schema]
description = "Entry"
type = "string"

[[resources.verbs.params]]
name = "folder"
required = false

[resources.verbs.params.schema]
description = "The folder it goes in; the project's root when none"
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "before"
