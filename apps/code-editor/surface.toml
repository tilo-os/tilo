  { path = "files.*.language", type = "text" },
  { path = "buffers", type = { map = "any" } },
  { path = "terminal_panel", type = { option = { named = "Terminal" } }, readonly = true, stored = "record" },
  { path = "terminal_panel.target", type = { option = "text" }, readonly = true },
  { path = "terminal_panel.relay_session", type = { option = "text" }, readonly = true },
  { path = "terminal_panel.pane", type = { option = "text" }, readonly = true },
  { path = "terminal_panel.runs", type = { collection = { named = "Run" } }, readonly = true, stored = "collection" },
  { path = "terminal_panel.runs.*.command", type = "text", label = true },
  { path = "terminal_panel.runs.*.cwd", type = "text" },
  { path = "terminal_panel.runs.*.environment", type = { option = "text" } },
  { path = "terminal_panel.runs.*.actor", type = "text" },
  { path = "terminal_panel.runs.*.for_person", type = { option = "text" } },
  { path = "terminal_panel.runs.*.started_ms", type = "int" },
  { path = "terminal_panel.runs.*.ended_ms", type = "int" },
  { path = "terminal_panel.runs.*.exit", type = "int" },
  { path = "terminal_panel.runs.*.output", type = "any" },
  { path = "terminal_panel.runs.*.truncated", type = "bool" },
  { path = "terminal_panel.runs.*.tool", type = "text" },
  { path = "terminal_panel.runs.*.undoable", type = "bool" },
  { path = "terminal_panel.runs.*.items", type = { list = { named = "RunItem" } } },
  { path = "terminal_panel.requests", type = { outbox = { named = "RunRequest" } }, readonly = true, unit = true },
  { path = "terminal_requests", type = { outbox = { named = "RunRequest" } }, readonly = true, unit = true },
]

