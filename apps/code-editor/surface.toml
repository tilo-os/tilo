[[resources.verbs.params]]
name = "output"
required = false

[resources.verbs.params.schema]
description = "The content hash of the raw output (lower-case hex), when it printed anything."
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "output_len"
required = true

[resources.verbs.params.schema]
minimum = 0
type = "integer"

[[resources.verbs.params]]
