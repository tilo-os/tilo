    "string",
    "null",
]

[[resources.verbs]]
description = "Delete  Delete the file and its text, or the folder once it is empty."
destructive = true
id = "delete"
kind = "undoable"
label = "Delete"

[[resources.verbs.params]]
name = "entry"
required = true

[resources.verbs.params.schema]
description = "Entry"
type = "string"

[[resources.verbs]]
description = "Record entry  Record a file or folder of the project's folder on disk, the first time the editor reads it, under the id the editor gave it. An entry already recorded, or at a path a collaborator recorded under another id, is left as it is."
id = "record-entry"
kind = "undoable"
label = "Record entry"

[[resources.verbs.params]]
name = "id"
required = true

[resources.verbs.params.schema]
description = "The id it is kept under"
type = "string"

[[resources.verbs.params]]
name = "kind"
required = true

[resources.verbs.params.schema]
description = "File or folder"
enum = [
    "file",
    "folder",
]
type = "string"

[[resources.verbs.params]]
name = "name"
required = true

[resources.verbs.params.schema]
description = "Its name"
type = "string"

[[resources.verbs.params]]
name = "folder"
required = false

[resources.verbs.params.schema]
description = "The folder it is in; the project's root when none"
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "language"
required = true

[resources.verbs.params.schema]
description = "A file's language"
type = "string"

[[resources.verbs]]
description = "Record text  Keep `text`, read from disk, as the text of `file` the first time the editor opens it. Text already there — a collaborator's or an earlier session's unsaved edits — is left as it is."
id = "record-text"
kind = "undoable"
label = "Record text"

[[resources.verbs.params]]
name = "file"
required = true

[resources.verbs.params.schema]
description = "The file's id"
type = "string"

[[resources.verbs.params]]
name = "text"
required = true

[resources.verbs.params.schema]
description = "Its text on disk"
type = "string"

