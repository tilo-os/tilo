[[resources.verbs]]
description = "New file  A new file named `name` in the folder `folder` (the project's root when none), holding `text`."
id = "new-file"
kind = "undoable"
label = "New file"

[[resources.verbs.params]]
name = "name"
required = false

[resources.verbs.params.schema]
description = "File name; `untitled` when none"
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "folder"
required = false

[resources.verbs.params.schema]
description = "The folder it goes in; the project's root when none"
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "text"
required = false

[resources.verbs.params.schema]
description = "Its text"
type = [
    "string",
    "null",
]

[[resources.verbs]]
description = "New folder  A new folder named `name` in the folder `folder` (the project's root when none)."
