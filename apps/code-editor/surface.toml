[[resources]]
kind = "code_editor.project"
label = "Code Editor"
version = 1
fields = [
  { path = "files", type = "Collection<Entry>", stored = "collection" },
  { path = "files.*.kind", type = "EntryKind", readonly = true },
  { path = "files.*.name", type = "String", label = true, readonly = true },
  { path = "files.*.parent", type = "Option<Id>", readonly = true },
  { path = "files.*.language", type = "String" },
  { path = "buffers", type = "BTreeMap<String, Source>" },
  { path = "terminal_panel", type = "Option<Terminal>", readonly = true, stored = "record" },
  { path = "terminal_panel.target", type = "Option<Atom>", readonly = true },
  { path = "terminal_panel.relay_session", type = "Option<Atom>", readonly = true },
  { path = "terminal_panel.pane", type = "Option<Atom>", readonly = true },
  { path = "terminal_panel.runs", type = "Collection<Run>", readonly = true, stored = "collection" },
  { path = "terminal_panel.runs.*.command", type = "Atom", label = true },
  { path = "terminal_panel.runs.*.cwd", type = "Atom" },
  { path = "terminal_panel.runs.*.environment", type = "Option<Atom>" },
  { path = "terminal_panel.runs.*.actor", type = "Atom" },
  { path = "terminal_panel.runs.*.for_person", type = "Option<Atom>" },
  { path = "terminal_panel.runs.*.started_ms", type = "i64" },
  { path = "terminal_panel.runs.*.ended_ms", type = "i64" },
  { path = "terminal_panel.runs.*.exit", type = "i32" },
  { path = "terminal_panel.runs.*.output", type = "Bytes" },
  { path = "terminal_panel.runs.*.truncated", type = "bool" },
  { path = "terminal_panel.runs.*.tool", type = "Atom" },
  { path = "terminal_panel.runs.*.items", type = "Vec<RunItem>" },
  { path = "terminal_panel.requests", type = "Outbox<RunRequest, RunAnswer>", readonly = true },
  { path = "terminal_requests", type = "Outbox<RunRequest, RunAnswer>", readonly = true },
]

