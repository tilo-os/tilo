[package]
name = "tilo-console"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "What your agents do in your workspaces: their runs as timelines of actions, each with its own view, and the door they connect by"

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["console-samples"]

[lib]
name = "tilo_console"
path = "src/lib.rs"

[[bin]]
name = "console"
path = "src/main.rs"

[features]
# The sample runs, grants and workspaces and the screenshot scenarios that
# show them: development runs, captures and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
serde.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `tilo-console` claims `--features tilo-console/thin` in the
# collection build, and the app then links the whole runtime statically.
console-samples = { package = "tilo-console", path = ".", features = ["samples"] }
serde_json.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
