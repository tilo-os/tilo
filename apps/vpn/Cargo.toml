[package]
name = "vpn"
version = "0.1.0"
edition = "2024"

[lib]
name = "vpn"
path = "src/lib.rs"

[[bin]]
name = "vpn"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

# org.freedesktop.portal.FileChooser (via ashpd) — an app never draws its own
# file picker; importing a .conf/.ovpn goes through the host portal so the
# compositor's picker + per-cluster sandbox prompt is the security boundary.
# The D-Bus round-trip runs off the UI thread on its own small Tokio runtime
# and the chosen path is handed back over a channel.
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
# Serialise the handful of tests that mutate process-global env vars
# (QOS_VPN_ALLOW_EXEC / XDG_DATA_HOME) so they never race under the default
# parallel test runner.
serial_test = "3"
