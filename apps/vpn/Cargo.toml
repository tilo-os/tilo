[package]
name = "vpn"
version = "0.1.0"
edition = "2024"

[lib]
name = "vpn"
path = "src/lib.rs"

[[bin]]
name = "vpn"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The qOS action model: every document-mutating operation is a serializable,
# replayable action dispatched through one executor, so undo, multi-peer replay
# and the Ctrl+K command palette all work from a single implementation.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
ashpd.workspace = true
tokio.workspace = true
url.workspace = true
serial_test.workspace = true
