[package]
name = "model-providers"
version = "0.1.0"
edition = "2024"
description = "Host-backed model provider administration"
publish.workspace = true
license.workspace = true

[lib]
name = "model_providers"
path = "src/lib.rs"

[[bin]]
name = "model-providers"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Run the app from the Settings engine library in the runtime bundle
# (libtilo_settings_engine.so, crates/runtime/engines/settings), which
# carries this package's library: the binary is one call into it
# (src/main.rs). The release collection enables it
# (dist/apps/app-collections.toml).
runtime-engine = ["thin"]

[dependencies]
provider-settings-ui = { version = "0.1.0", path = "../../crates/integrations/provider-settings-ui" }
ui = { package = "tilo-app", version = "0.1.0", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
