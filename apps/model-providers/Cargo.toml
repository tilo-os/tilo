[package]
name = "model-providers"
version = "0.1.0"
edition = "2024"
description = "Host-backed model provider administration"
publish.workspace = true
license.workspace = true

[lib]
name = "model_providers"
path = "src/lib.rs"

[[bin]]
name = "model-providers"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
provider-settings-ui = { version = "0.1.0", path = "../../crates/sdk/provider-settings-ui" }
ui = { package = "tilo-app", version = "0.1.0", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
