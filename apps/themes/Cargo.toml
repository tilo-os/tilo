[package]
name = "themes"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "themes"
path = "src/lib.rs"

[[bin]]
name = "themes"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# One owner for ~/.config/qos/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
ui = { package = "qos-app", path = "../../crates/app/qos-app" }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[lints]
workspace = true
