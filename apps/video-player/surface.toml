# Written by `tilo-app surface`; review changes like an API change.

format = 2

[[resources]]
kind = "video-player.library"
label = "Video Player"
version = 1
fields = [
  { path = "playlists", type = { collection = { named = "Playlist" } }, stored = "collection" },
  { path = "playlists.*.name", type = "text", label = true },
  { path = "items", type = { collection = { named = "PlaylistItem" } }, stored = "collection" },
  { path = "items.*.playlist", type = "text", readonly = true },
  { path = "items.*.media_ref", type = "text", readonly = true },
  { path = "items.*.title", type = "text", label = true },
  { path = "annotations", type = { collection = { named = "TimestampAnnotation" } }, stored = "collection" },
  { path = "annotations.*.media_ref", type = "text", readonly = true },
  { path = "annotations.*.time_ms", type = "int" },
  { path = "annotations.*.text", type = "text", label = true },
  { path = "transports", type = { map = { named = "SharedTransport" } }, readonly = true },
]

[[resources.verbs]]
id = "create-playlist"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

[[resources.verbs]]
id = "delete-playlist"
destructive = true
kind = "undoable"
params = [
  { name = "playlist", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-to-playlist"
kind = "undoable"
params = [
  { name = "playlist", type = "text", required = true, schema = { type = "string" } },
  { name = "media_ref", type = "text", required = true, schema = { type = "string" } },
  { name = "title", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-to-watch-later"
kind = "undoable"
params = [
  { name = "media_ref", type = "text", required = true, schema = { type = "string" } },
  { name = "title", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-annotation"
kind = "undoable"
params = [
  { name = "media_ref", type = "text", required = true, schema = { type = "string" } },
  { name = "time_ms", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
  { name = "text", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "delete-annotation"
destructive = true
kind = "undoable"
params = [
  { name = "annotation", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "set-transport"
kind = "undoable"
params = [
  { name = "media_ref", type = "text", required = true, schema = { type = "string" } },
  { name = "playing", type = "bool", required = true, schema = { type = "boolean" } },
  { name = "position_ms", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
  { name = "rate", type = "float", required = true, schema = { type = "number" } },
  { name = "epoch_ms", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

[[resources.verbs]]
id = "open-video"
kind = "read"
params = [
  { name = "path", type = { option = "text" }, required = false },
]

[[resources.verbs]]
id = "clear-recent"
destructive = true
kind = "read"

[[resources.types]]
name = "Playlist"
fields = [
  { name = "name", type = "text" },
]

[[resources.types]]
name = "PlaylistItem"
fields = [
  { name = "playlist", type = "text" },
  { name = "media_ref", type = "text" },
  { name = "title", type = "text" },
]

[[resources.types]]
name = "SharedTransport"
fields = [
  { name = "playing", type = "bool" },
  { name = "position_ms", type = "int" },
  { name = "rate", type = "float" },
  { name = "epoch_ms", type = "int" },
]

[[resources.types]]
name = "TimestampAnnotation"
fields = [
  { name = "media_ref", type = "text" },
  { name = "time_ms", type = "int" },
  { name = "text", type = "text" },
]

[[resources]]
kind = "video-player.recent"
label = "Recent videos"
version = 1
fields = [
  { path = "devices", type = { map = "any" } },
]

[[resources.verbs]]
id = "keep"
kind = "undoable"
params = [
  { name = "device", type = "text", required = true, schema = { type = "string" } },
  { name = "rows", required = true, schema = {} },
]

[[resources.verbs]]
id = "stood"
kind = "undoable"
params = [
  { name = "device", type = "text", required = true, schema = { type = "string" } },
  { name = "id", type = "text", required = true, schema = { type = "string" } },
  { name = "position_ms", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

