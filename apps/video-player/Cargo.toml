[package]
name = "video-player"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "video_player"
path = "src/lib.rs"

[[bin]]
name = "video-player"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# `decode` ships by default for GStreamer-backed playback. Shots render a
# synthesized frame and do not decode a file.
default = ["decode"]
# GStreamer decode of the opened file/stream, via the shared media layer.
decode = ["media/decode"]

[dependencies]
fnv.workspace = true
tilo-clock = { path = "../../crates/platform/tilo-clock" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
# Videos opened by contents in a page, kept in the cache location for Recent.
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
media = { package = "tilo-media", path = "../../crates/platform/tilo-media" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

# Portal-only (feature-gated; never compiled for the default hermetic build).

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
