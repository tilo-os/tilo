[package]
name = "video-player"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "video_player"
path = "src/lib.rs"

[[bin]]
name = "video-player"
path = "src/main.rs"

[features]
# A video player's core is decoding video, so `decode` ships on by default: a
# normally-built `video-player` really decodes the opened file/stream through
# the shared media layer (GStreamer). `--shots` still renders the synthesized
# representative frame at runtime (no file is decoded during a shot), so the
# screenshot path stays hermetic even with the decoder compiled in.
default = ["decode"]
# Real GStreamer decode of the opened file/stream, via the shared media layer.
decode = ["media/decode"]
# Real host-native file picking via the XDG FileChooser portal (ashpd). Off by
# default so the hermetic build needs no D-Bus / tokio; `--open PATH` opens a
# file directly without the portal.
portal = ["ui/portal"]

[dependencies]
ui = { path = "../../ui" }
media = { path = "../../crates/media" }
collab-types = { path = "../../crates/collab/collab-types" }
automerge.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Portal-only (feature-gated; never compiled for the default hermetic build).

[lints]
workspace = true
