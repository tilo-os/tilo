[package]
name = "video-player"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "video_player"
path = "src/lib.rs"

[[bin]]
name = "video-player"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# `decode` ships by default for GStreamer-backed playback. Shots render a
# synthesized frame and do not decode a file.
default = ["decode", "portal"]
# GStreamer decode of the opened file/stream, via the shared media layer.
decode = ["media/decode"]
# Host-native file picking via the XDG FileChooser portal (ashpd). Hermetic
# tests use `--no-default-features`; `--open PATH` supports direct launches.
portal = ["ui/portal"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
settings-store = { path = "../../crates/system/settings-store" }
media = { path = "../../crates/media/core" }
collab-types = { path = "../../crates/collab/collab-types" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
tilo-test-env = { path = "../../crates/dev/test-env" }

# Portal-only (feature-gated; never compiled for the default hermetic build).

[lints]
workspace = true
