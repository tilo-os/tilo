[package]
name = "video-player"
version = "0.1.0"
edition = "2024"

[lib]
name = "video_player"
path = "src/lib.rs"

[[bin]]
name = "video-player"
path = "src/main.rs"

[features]
default = []
# Real GStreamer decode of the opened file/stream, via the shared media layer.
# Off by default so the hermetic build + `--shots` need no gstreamer stack (the
# synthesized-frame fallback keeps them green). Enable on a host with the
# gstreamer-1.0 dev stack: `--features decode`.
decode = ["media/decode"]
# Real host-native file picking via the XDG FileChooser portal (ashpd). Off by
# default so the hermetic build needs no D-Bus / tokio; `--open PATH` opens a
# file directly without the portal.
portal = ["dep:ashpd", "dep:tokio"]

[dependencies]
ui = { path = "../../ui" }
media = { path = "../../crates/media" }
automerge = "0.8.0"
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

# Portal-only (feature-gated; never compiled for the default hermetic build).
ashpd = { version = "0.9", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
