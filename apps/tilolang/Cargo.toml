[package]
# Not `tilolang`: the compiler crate owns that name.
name = "tilolang-app"
autotests = false
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang runtime: the binary of the tilolang runtime bundle, which runs one installed tilolang app."

[lib]
name = "tilolang_app"
path = "src/lib.rs"

# The binary of the tilolang runtime bundle (`bin/tilolang-app`). `tilolang` is the language
# tool's (`crates/lang/tilolang-cli`).
[[bin]]
name = "tilolang-app"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it.rs"

# One package per process: Counter's binary of its own.
[[test]]
name = "counter"
path = "tests/counter.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilolang-tilo = { path = "../../crates/platform/tilolang-tilo" }
tilo-automerge.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tilolang = { path = "../../crates/lang/tilolang" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

# The development session's later builds are watched with inotify (`src/updates.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
