[package]
# Not `tilolang`: the compiler crate owns that name.
name = "tilolang-app"
autotests = false
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang runtime: the binary of the tilolang runtime bundle, which runs one installed tilolang app."

[lib]
name = "tilolang_app"
path = "src/lib.rs"

# The binary of the tilolang runtime bundle (`bin/tilolang-app`). `tilolang` is the language
# tool's (`crates/lang/tilolang-cli`).
[[bin]]
name = "tilolang-app"
path = "src/main.rs"

# Every tilolang app's tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-startup-metrics = { version = "0.1.0", path = "../../crates/system/tilo-startup-metrics" }
# Waiting on the hosted window's patch connection.
libc.workspace = true
tilolang-tilo = { path = "../../crates/platform/tilolang-tilo" }
# The directory protocol a running app takes later builds of its package through (`src/updates.rs`).
tilo-app-module = { version = "0.1.0", path = "../../crates/platform/tilo-app-module" }
# The IMAP and SMTP protocol code of native Mail, and the settings' account store, behind the
# mail origin of packages whose types hold a mail server's resources (`src/mail`).
mail = { path = "../mail" }
# The mail origin: in the window's process outside a host, and the connector process the
# system runs for a hosted Mail.
tilolang-mail = { path = "../../crates/platform/tilolang-mail" }
# YouTube as an outside origin: a live window of an app whose types hold YouTube's resources
# keeps them in step with it, in native code with the network.
tilolang-youtube = { path = "../../crates/platform/tilolang-youtube" }
tilo-content = { path = "../../crates/system/content" }
# The UI host's half of the window, and the patch protocol between it and the instance.
tilo-ui-host = { path = "../../crates/platform/tilo-ui-host" }
tilo-render-protocol = { path = "../../crates/platform/tilo-render-protocol" }
tilo-automerge.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tilolang = { path = "../../crates/lang/tilolang" }
# Waiting for a server's answer without a fixed budget that a busy runner overruns.
tilo-test-env = { path = "../../crates/dev/test-env" }
# The test IMAP and SMTP servers the mail origin's tests run against.
mail = { path = "../mail", features = ["fake-servers"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# A hosted app's window against the tilolang host running its instance (`tests/hosted.rs`).
tilolang-host = { path = "../../crates/platform/tilolang-host" }
collaboration = { version = "0.1.0", path = "../../crates/collab/collaboration", features = ["test-support", "broker-transport", "native"] }
collab-types = { version = "0.1.0", path = "../../crates/collab/collab-types" }
automerge.workspace = true
uuid.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# Later builds of the package are watched (`src/updates.rs`).
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"] }
