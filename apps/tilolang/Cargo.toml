[package]
# Not `tilolang`: the compiler crate owns that name.
name = "tilolang-app"
autotests = false
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The tilolang runtime: the binary of the tilolang runtime bundle, which runs one installed tilolang app."

[lib]
name = "tilolang_app"
path = "src/lib.rs"

# The binary of the tilolang runtime bundle (`bin/tilolang-app`). `tilolang` is the language
# tool's (`crates/lang/tilolang-cli`).
[[bin]]
name = "tilolang-app"
path = "src/main.rs"

# Every tilolang app's tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilolang-tilo = { path = "../../crates/platform/tilolang-tilo" }
tilo-failure = { path = "../../crates/platform/tilo-failure" }
# The app window's half of the window, and the patch protocol between it and the instance.
tilo-app-window = { path = "../../crates/platform/tilo-app-window" }
tilo-render-protocol = { path = "../../crates/platform/tilo-render-protocol" }
serde_json.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tilolang = { path = "../../crates/lang/tilolang" }
tilolang-tilo = { path = "../../crates/platform/tilolang-tilo", features = ["test-support"] }
# Mail's engine, the stand-in IMAP and SMTP servers Mail's tests run against, and the engine's
# content store.
mail-engine = { path = "../../crates/platform/mail-engine", features = ["test-support"] }
tilo-account-probe = { path = "../../crates/platform/account-probe", features = ["test-support"] }
tilo-content = { path = "../../crates/system/content" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# A hosted app's window against the tilolang host running its instance (`tests/hosted.rs`),
# whose tests play the broker over the host's own fake (`testing`).
tilolang-process = { path = "../../crates/platform/tilolang-process", features = ["test-support"] }
collaboration = { version = "0.1.0", path = "../../crates/collab/collaboration", features = ["test-support", "broker-transport", "native"] }
collab-types = { version = "0.1.0", path = "../../crates/collab/collab-types" }
# The pictures a page is sent are PNGs as `data:` addresses (`tests/gallery_html.rs`).
base64.workspace = true
uuid.workspace = true
# A window's thread that must not wait on storage, as the window closes (`tests/gallery_close.rs`).
durable-store = { path = "../../crates/system/durable-store" }
# The started gallery in `tests/gallery_start.rs` starts outside every other test's environment.
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# Without a session, a window runs its instance in a tilolang host in its own process.
tilolang-process = { path = "../../crates/platform/tilolang-process" }
# A window a device shows on a web page answers the device on its page's link.
tilo-server-protocol = { path = "../../crates/server/tilo-server-protocol" }
# The variable a page window finds its descriptors in; in tests, a later build as a development
# session hands it over the host's socket.
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# Later builds `tilolang dev` publishes are watched (`src/updates.rs`).
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"] }
tilo-startup-metrics = { version = "0.1.0", path = "../../crates/system/tilo-startup-metrics" }
# Waiting on the hosted window's patch connection.
libc.workspace = true
# The directory protocol a running app takes later builds of its package through (`src/updates.rs`).
tilo-app-module = { version = "0.1.0", path = "../../crates/platform/tilo-app-module" }

[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
# The mail origin: in the window's process outside a host, and the connector process the
# system runs for a hosted Mail.
tilolang-mail = { path = "../../crates/platform/tilolang-mail" }
# YouTube as an outside origin: a live window of an app whose types hold YouTube's resources
# keeps them in step with it, in native code with the network.
tilolang-youtube = { path = "../../crates/platform/tilolang-youtube" }
# The calendar origin: the connector process the system runs for a hosted Calendar.
tilolang-calendar = { path = "../../crates/integrations/tilolang-calendar" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# A video plays in the app's window on an Apple silicon Mac, decoded by the GStreamer Tilo.app
# carries beside this binary (dist/macos/build-app.sh).
tilo-media = { path = "../../crates/platform/tilo-media", features = ["decode"] }

[target.'cfg(windows)'.dependencies]
# An origin reaches its connector over a socket the session handed both; a Windows host has
# no session yet, and this runtime refuses to run there (src/main.rs), so it takes the
# origins without their connectors.
tilolang-mail = { path = "../../crates/platform/tilolang-mail", default-features = false }
tilolang-youtube = { path = "../../crates/platform/tilolang-youtube", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A web page installs a package by its address (`src/page.rs`): its files are fetched there.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["Response", "Window"] }
