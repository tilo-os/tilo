[package]
name = "calculator-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The calculator.document record: the evaluated history and the saved graph formulas"

# The resource Calculator draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "calculator_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
