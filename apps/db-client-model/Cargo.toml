[package]
name = "db-client-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Database Client's resource: a workspace's connection profiles, saved queries and SQL buffer, and the verbs that change them"

# The resource Database keeps and an agent works through the same verbs. It has
# no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[features]
# The bundled read-only sample database a development session shows.
samples = []

[lib]
name = "db_client_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tilo-actions = { path = "../../crates/core/actions" }
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
