[package]
name = "tube-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Tube's model as the WebAssembly module its package carries: the library's and the watch history's verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }
tube-model = { path = "../tube-model" }

[lints]
workspace = true
