# Written by `tilo-app surface`; review changes like an API change.

[[resources]]
kind = "api-tester.workspace"
label = "API workspace"
version = 1
fields = [
  { path = "collections", type = { collection = { named = "SavedCollection" } }, stored = "collection" },
  { path = "collections.*.name", type = "text", label = true },
  { path = "collections.*.requests", type = { collection = { named = "RequestRecord" } }, stored = "collection" },
  { path = "collections.*.requests.*.name", type = "text", label = true },
  { path = "collections.*.requests.*.method", type = { named = "HttpMethod" } },
  { path = "collections.*.requests.*.url", type = "text" },
  { path = "collections.*.requests.*.params", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "collections.*.requests.*.params.*.key", type = "text" },
  { path = "collections.*.requests.*.params.*.value", type = "text" },
  { path = "collections.*.requests.*.params.*.enabled", type = "bool" },
  { path = "collections.*.requests.*.headers", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "collections.*.requests.*.headers.*.key", type = "text" },
  { path = "collections.*.requests.*.headers.*.value", type = "text" },
  { path = "collections.*.requests.*.headers.*.enabled", type = "bool" },
  { path = "collections.*.requests.*.auth", type = { named = "Credentials" }, stored = "record" },
  { path = "collections.*.requests.*.auth.scheme", type = { named = "AuthScheme" } },
  { path = "collections.*.requests.*.auth.username", type = "text" },
  { path = "collections.*.requests.*.auth.header", type = "text" },
  { path = "collections.*.requests.*.auth.reference", type = "text" },
  { path = "collections.*.requests.*.body_mode", type = { named = "BodyMode" } },
  { path = "collections.*.requests.*.body", type = "text" },
  { path = "collections.*.requests.*.form", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "collections.*.requests.*.form.*.key", type = "text" },
  { path = "collections.*.requests.*.form.*.value", type = "text" },
  { path = "collections.*.requests.*.form.*.enabled", type = "bool" },
  { path = "environments", type = { collection = { named = "Environment" } }, stored = "collection" },
  { path = "environments.*.name", type = "text", label = true },
  { path = "environments.*.variables", type = { collection = { named = "Variable" } }, stored = "collection" },
  { path = "environments.*.variables.*.key", type = "text", label = true },
  { path = "environments.*.variables.*.value", type = "text" },
  { path = "environments.*.variables.*.enabled", type = "bool" },
  { path = "environments.*.variables.*.secret", type = "bool", readonly = true },
  { path = "active_environment", type = { option = "text" } },
  { path = "request", type = { named = "RequestRecord" }, stored = "record" },
  { path = "request.name", type = "text", label = true },
  { path = "request.method", type = { named = "HttpMethod" } },
  { path = "request.url", type = "text" },
  { path = "request.params", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "request.params.*.key", type = "text" },
  { path = "request.params.*.value", type = "text" },
  { path = "request.params.*.enabled", type = "bool" },
  { path = "request.headers", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "request.headers.*.key", type = "text" },
  { path = "request.headers.*.value", type = "text" },
  { path = "request.headers.*.enabled", type = "bool" },
  { path = "request.auth", type = { named = "Credentials" }, stored = "record" },
  { path = "request.auth.scheme", type = { named = "AuthScheme" } },
  { path = "request.auth.username", type = "text" },
  { path = "request.auth.header", type = "text" },
  { path = "request.auth.reference", type = "text" },
  { path = "request.body_mode", type = { named = "BodyMode" } },
  { path = "request.body", type = "text" },
  { path = "request.form", type = { collection = { named = "Row" } }, stored = "collection" },
  { path = "request.form.*.key", type = "text" },
  { path = "request.form.*.value", type = "text" },
  { path = "request.form.*.enabled", type = "bool" },
  { path = "opened", type = "text", readonly = true },
  { path = "history", type = { collection = { named = "Sent" } }, readonly = true, stored = "collection" },
  { path = "history.*.route", type = "text", label = true },
  { path = "history.*.method", type = { named = "HttpMethod" } },
  { path = "history.*.url", type = "text" },
  { path = "history.*.status", type = "int" },
  { path = "history.*.duration_ms", type = "int" },
  { path = "history.*.at_ms", type = "int" },
  { path = "history.*.replay", type = "text" },
]

[[resources.verbs]]
id = "new-request"
kind = "undoable"

[[resources.verbs]]
id = "new-collection"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "delete-collection"
destructive = true
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-request"
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
  { name = "name", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "save-request"
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
  { name = "name", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "open-request"
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
  { name = "request", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "delete-request"
destructive = true
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
  { name = "request", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "new-environment"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "delete-environment"
destructive = true
kind = "undoable"
params = [
  { name = "environment", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "use-environment"
kind = "undoable"
params = [
  { name = "environment", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-variable"
kind = "undoable"
params = [
  { name = "environment", type = "text", required = true, schema = { type = "string" } },
  { name = "key", type = "text", required = true, schema = { type = "string" } },
  { name = "value", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "secret", type = { option = "bool" }, required = false, schema = { type = ["boolean", "null"] } },
]

[[resources.verbs]]
id = "open-sent"
kind = "undoable"
params = [
  { name = "sent", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "save-sent"
kind = "undoable"
params = [
  { name = "collection", type = "text", required = true, schema = { type = "string" } },
  { name = "sent", type = "text", required = true, schema = { type = "string" } },
  { name = "name", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "delete-sent"
destructive = true
kind = "undoable"
params = [
  { name = "sent", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "record-sent"
kind = "undoable"
params = [
  { name = "method", type = "text", required = true, schema = { type = "string" } },
  { name = "url", type = "text", required = true, schema = { type = "string" } },
  { name = "status", type = "int", required = true, schema = { type = "integer", maximum = 65535, minimum = 0 } },
  { name = "duration_ms", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

[[resources.types]]
name = "AuthScheme"
cases = [
  { name = "none" },
  { name = "bearer" },
  { name = "basic" },
  { name = "api_key" },
]

[[resources.types]]
name = "BodyMode"
cases = [
  { name = "none" },
  { name = "json" },
  { name = "form" },
  { name = "raw" },
]

[[resources.types]]
name = "Credentials"
fields = [
  { name = "scheme", type = { named = "AuthScheme" } },
  { name = "username", type = "text" },
  { name = "header", type = "text" },
  { name = "reference", type = "text" },
]

[[resources.types]]
name = "Environment"
fields = [
  { name = "name", type = "text" },
  { name = "variables", type = { collection = { named = "Variable" } } },
]

[[resources.types]]
name = "HttpMethod"
cases = [
  { name = "get" },
  { name = "post" },
  { name = "put" },
  { name = "patch" },
  { name = "delete" },
  { name = "head" },
  { name = "options" },
]

[[resources.types]]
name = "RequestRecord"
fields = [
  { name = "name", type = "text" },
  { name = "method", type = { named = "HttpMethod" } },
  { name = "url", type = "text" },
  { name = "params", type = { collection = { named = "Row" } } },
  { name = "headers", type = { collection = { named = "Row" } } },
  { name = "auth", type = { named = "Credentials" } },
  { name = "body_mode", type = { named = "BodyMode" } },
  { name = "body", type = "text" },
  { name = "form", type = { collection = { named = "Row" } } },
]

[[resources.types]]
name = "Row"
fields = [
  { name = "key", type = "text" },
  { name = "value", type = "text" },
  { name = "enabled", type = "bool" },
]

[[resources.types]]
name = "SavedCollection"
fields = [
  { name = "name", type = "text" },
  { name = "requests", type = { collection = { named = "RequestRecord" } } },
]

[[resources.types]]
name = "Sent"
fields = [
  { name = "route", type = "text" },
  { name = "method", type = { named = "HttpMethod" } },
  { name = "url", type = "text" },
  { name = "status", type = "int" },
  { name = "duration_ms", type = "int" },
  { name = "at_ms", type = "int" },
  { name = "replay", type = "text" },
]

[[resources.types]]
name = "Variable"
fields = [
  { name = "key", type = "text" },
  { name = "value", type = "text" },
  { name = "enabled", type = "bool" },
  { name = "secret", type = "bool" },
]

