[package]
name = "api-tester-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The api-tester.workspace resource: collections of requests, their environments and what was sent"

# The resource API Tester draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "api_tester_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
uuid.workspace = true

[dev-dependencies]
tilo-test-env = { version = "0.1.0", path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
