[package]
name = "backups"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "backups"
path = "src/lib.rs"

[[bin]]
name = "backups"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
host-fs = { path = "../../crates/system/host-fs" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: every document-mutating operation is a serializable,
# replayable action dispatched through one executor, so undo, multi-peer replay
# and the Ctrl+K command palette all work from a single implementation.
tilo-actions = { path = "../../crates/collab/actions" }
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
walkdir.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
