[package]
name = "backups"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "backups"
path = "src/lib.rs"

[[bin]]
name = "backups"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
test-support = []

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
# The Tilo action model: every document-mutating operation is a serializable,
# replayable action dispatched through one executor, so undo, multi-peer replay
# and the Ctrl+K command palette all work from a single implementation.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
backups = { path = ".", default-features = false, features = ["test-support"] }
tempfile.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
