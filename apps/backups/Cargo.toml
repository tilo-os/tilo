[package]
name = "backups"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "backups"
path = "src/lib.rs"

[[bin]]
name = "backups"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
host-fs = { path = "../../crates/system/host-fs" }
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
settings-model = { path = "../../crates/system/settings-model" }
# The resource the app draws: its type and verb, shared with the device that applies it.
backups-model = { path = "../backups-model" }
# The Tilo action model: every document-mutating operation is a serializable,
# replayable action dispatched through one executor, so undo, multi-peer replay
# and the Ctrl+K command palette all work from a single implementation.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
walkdir.workspace = true
vello.workspace = true
winit.workspace = true
jiff.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-history = { path = "../../crates/sdk/tilo-history" }
# The restore's folder chooser and the job it runs wait on the test's bound.
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
