[package]
name = "git_client"
version = "0.1.0"
edition = "2024"

[lib]
name = "git_client"
path = "src/lib.rs"

[[bin]]
name = "git_client"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"
