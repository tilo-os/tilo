[package]
name = "diffmerge-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Diff & Merge's session: the texts compared, the merged result and which side each change takes, with the verbs that change them"

# The `diffmerge.session` resource as the app that draws it and an agent that
# works it both read it. It has no window and no surface of its own; the app
# draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# line alignment is plain computation on the texts, so the model computes a
# merge the same way on every device.

[lib]
name = "diffmerge_model"
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
fnv.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "2.6"
tilo-resource = { path = "../../crates/core/tilo-resource" }

[dev-dependencies]
# The scenarios the model tests are folded into.
tilo-test-env = { path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
