[package]
name = "logs-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Logs model as the WebAssembly module its package carries: the journal filter's verb, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
logs-model = { path = "../logs-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }

[lints]
workspace = true
