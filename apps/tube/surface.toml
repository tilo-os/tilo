[[resources]]
kind = "tube.library"
label = "Tube"
version = 1
fields = [
  { path = "likes", type = { set = "text" } },
  { path = "queue", type = { set = "text" } },
  { path = "subscriptions", type = { set = "text" } },
  { path = "comment_likes", type = { set = "text" } },
  { path = "replies", type = { collection = { named = "Reply" } }, stored = "collection" },
  { path = "replies.*.comment", type = "text", readonly = true },
  { path = "replies.*.text", type = "text", label = true, readonly = true },
]

