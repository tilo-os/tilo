[package]
name = "tube"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "tube"
path = "src/lib.rs"

[[bin]]
name = "tube"
path = "src/main.rs"

[dependencies]
xdg-paths = { path = "../../crates/system/xdg-paths" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Shared streaming and playback layer. The watch-page `VideoPlayer` uses the
# same `media::MediaEngine` as the local player and editor preview.
media = { path = "../../crates/media/core" }
automerge.workspace = true
# The Tilo ACTION model: Tube's `actions` module exports its collaborative
# operations (likes, queue, comment replies) as replayable actions the host's
# Ctrl+K palette dispatches.
tilo-actions = { path = "../../crates/collab/actions" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Live fetch (Invidious / SponsorBlock / DeArrow), driven by a background
# worker and excluded from the shots path.
# rustls-tls because the distrobox image has no openssl/native-tls.
reqwest = { workspace = true, features = ["blocking", "json", "query"] }
tilo-net = { path = "../../crates/system/tilo-net", features = ["blocking"] }
bounded-command = { path = "../../crates/system/bounded-command" }
atomic-file = { path = "../../crates/system/atomic-file" }
blake3.workspace = true
libc.workspace = true

# Live YouTube backend (off by default): rustypipe handles InnerTube requests
# and botguard tokens without ffmpeg or yt-dlp.
#
# rustls with bundled webpki roots avoids an OpenSSL dependency and keeps the
# TLS stack consistent with reqwest.
rustypipe = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }
# `rt-multi-thread` is required by rustypipe's internal spawned tasks.
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

# Grayjay device sync uses the Noise protocol over TCP. `snow`, `flate2`, and
# `base64` are gated behind `grayjay-sync`.
snow = { version = "0.9", optional = true }
flate2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
runtime-portal-xdg = { path = "../../crates/runtime/runtime-portal-xdg", optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
wire-frame = { path = "../../crates/system/wire-frame", optional = true }

[dev-dependencies]
# Encoding-level assertions for the video-surface test; version matches `vello`.
vello_encoding.workspace = true
# Encode a valid PNG for the offline image-store test fixture.
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[features]
thin = ["dep:runtime-dylib"]
# The default app includes live YouTube and media features. Shots/tests remain
# hermetic at runtime because their live workers are not spawned; Grayjay sync
# also fails closed if the host secret broker is unavailable.
default = ["live", "media", "grayjay-sync"]
# YouTube data via yt-dlp with rustypipe as a fallback source.
live = ["dep:rustypipe", "dep:tokio"]
# Video decode, playback, and audio through the shared GStreamer media engine.
media = [
    "media/decode",
    # Desktop media integration: the watch-page player publishes now-playing +
    # accepts media keys through the toolkit's MPRIS service.
    "ui/mpris",
]
# Grayjay account/device sync over Noise (TCP 12315 + pairing), including its
# portal-backed lifecycle.
grayjay-sync = [
    "dep:snow",
    "dep:flate2",
    "dep:base64",
    "dep:runtime-portal-xdg",
    "dep:sha2",
    "dep:zeroize",
    "dep:wire-frame",
]

[lints]
workspace = true
