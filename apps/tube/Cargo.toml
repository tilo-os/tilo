[package]
name = "tube"
version = "0.1.0"
edition = "2024"

[lib]
name = "tube"
path = "src/lib.rs"

[[bin]]
name = "tube"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Live fetch (Invidious / SponsorBlock / DeArrow). Blocking client driven
# from a background worker thread; never touched on the `--shots` path.
# rustls-tls because the distrobox image has no openssl/native-tls.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# blake3 used by the SponsorBlock privacy-preserving hash-prefix query.
sha2 = "0.10"
