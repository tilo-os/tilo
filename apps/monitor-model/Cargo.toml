[package]
name = "monitor-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Monitor's resource: the process table's shared layout, with the sort keys it orders by"

# The resource Monitor keeps and an agent sets through the same fields. It has
# no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. This
# machine's processes, its sampling and the window's effects stay in the app.

[lib]
name = "monitor_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
