[package]
name = "chat"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "chat"
path = "src/lib.rs"

[[bin]]
name = "chat"
path = "src/main.rs"

# Calls run through the shell's native voice service (`ui::native_media`),
# which a page build reaches through its host; the app itself has no media
# transport.
[package.metadata.tilo]
web-features = []

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
fnv.workspace = true
emoji = { path = "../../crates/text/emoji" }
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The Tilo action model: the serializable, replayable unit of CRDT mutation
# behind Ctrl+K and cross-peer collaboration. Chat's messages/channels/reactions
# are exported as `ChatAction`s (see `src/actions.rs`) dispatched through the
# framework's `ui::ActionHost`.
tilo-actions = { path = "../../crates/collab/actions" }
# The address a message carries when it was authored by selecting something —
# `Message::reference` — and the vocabulary an agent's own progress on a
# summons is recorded in (`Message::work`, `ChatAction::SetAgentWork`).
tilo-reference = { path = "../../crates/collab/reference" }
# Reports of people and messages, which the room host's moderation agent
# decides on; the record lives in the chat so every guest can file one.
moderation-model = { path = "../moderation-model" }
tilo-doc = { path = "../../crates/doc/tilo-doc" }
# Message bodies and drafts are rich text, written in the SDK editor.
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# Content addressing everywhere; the on-disk store, and the device store where
# the launcher hands one over.
tilo-content = { path = "../../crates/system/content", features = ["dir", "device"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# The data directory for the workspace document, the workspace mount the
# attachment picker browses, and the session's account and host names.
tilo-paths = { path = "../../crates/platform/tilo-paths" }
# Read image headers for workspace attachments and encode demo thumbnails for
# the shared `ui::ImageStore`.
# Attachment bytes live in the app's content store; no
# sender-local path is stored in the chat document.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
[dev-dependencies]
# Descriptor fixtures exercise the real gateway backend injected into the SDK.
tilo-model-gateway = { path = "../../crates/agent/model-gateway", default-features = false, features = ["runtime-client"] }
# Reads the signed manifest's offers to check them against what the app publishes.
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
