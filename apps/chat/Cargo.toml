[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[lib]
name = "chat"
path = "src/lib.rs"

[[bin]]
name = "chat"
path = "src/main.rs"

[features]
default = []
# The real-time media engine: voice + camera + screen-share over iroh QUIC,
# GStreamer for microphone/opus capture + playback and camera capture, openh264
# (bundled source, no system lib) for the H.264 camera/screen codec, and the
# xdg-desktop-portal ScreenCast request over ashpd. OFF by default so the
# standard build and the `--shots` headless path never need the GStreamer/portal
# dev stack or a Tokio runtime; the call UI runs fully against simulated/local
# participants without it. Enable on a real qOS install with
# `--features live-media`. See `src/media.rs`, `src/audio.rs`, `src/video.rs`
# and `src/call.rs`. (ffmpeg / ALSA / Pulse / the `opus` crate are deliberately
# NOT direct dependencies — audio codecs are GStreamer's `opusenc`/`opusdec`
# elements, video is the in-tree openh264 source build, transport is iroh QUIC,
# and the screen portal is ashpd.)
live-media = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:iroh",
    "dep:tokio",
    "dep:openh264",
    "dep:ashpd",
    "dep:qos-callstream",
]

[dependencies]
ui = { path = "../../ui" }
# The qOS action model: the serializable, replayable unit of CRDT mutation
# behind Ctrl+K and cross-peer collaboration. Chat's messages/channels/reactions
# are exported as `ChatAction`s (see `src/actions.rs`) dispatched through the
# framework's `ui::ActionHost`.
qos-actions = { path = "../../crates/collab/actions" }
# The qOS runtime user-identity loader (QOS_USER_IDENTITY) — the canonical
# per-peer identity the collab layer signs with. Chat uses its public key +
# display name so every running instance is a distinct participant.
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# XDG data-dir resolution for on-disk persistence of the workspace document.
dirs.workspace = true
# Reading real image headers (true width/height) for files chosen in the
# workspace attachment picker, plus PNG-encoding the demo thumbnails the shared
# `ui::ImageStore` decodes on its worker threads — so the offline shot exercises
# the real fetch → decode → cache → paint image path (no gradient stand-in).
# Live attachments are read straight off the FUSE mount.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Live-media-only (feature-gated; never compiled for the default build).
# Versions pinned to match the workspace lock so no extra copies resolve:
# gstreamer 0.24 collapses onto the copy `apps/camera` / `apps/tube` /
# `crates/media` already resolve; iroh 1.0 matches `fs`; openh264 0.9 (source)
# matches `ui` / `shell` (the same decoder `ui::VideoPlayer::feed_frame` uses);
# ashpd 0.9 matches the copy the other portal-using apps resolve.
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync", "time"] }
openh264 = { workspace = true, optional = true }
ashpd = { workspace = true, optional = true, default-features = true }
qos-callstream = { path = "../../crates/collab/qos-callstream", optional = true }

[dev-dependencies]
tempfile.workspace = true
