[package]
name = "chat"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "chat"
path = "src/lib.rs"

[[bin]]
name = "chat"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The default app includes the legacy diagnostic media engine. Shots and tests
# use the simulated engine and do not start an iroh endpoint.
default = ["live-media"]
# Calls themselves run through the shell's native voice service
# (`ui::native_media`). This feature only adds the legacy custom-Iroh media
# transport and the device-free Opus codec diagnostics. Disable default
# features for explicitly media-free builds and hermetic tests. Its
# dependencies are native only: in the browser (a web side module) the
# feature adds nothing.
live-media = [
    "media/voice",
    "dep:iroh",
    "dep:tokio",
    "dep:wire-frame",
]

[dependencies]
fnv.workspace = true
hex.workspace = true
tracing.workspace = true
emoji = { path = "../../crates/text/emoji" }
tilo-clock = { path = "../../crates/system/tilo-clock" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The Tilo action model: the serializable, replayable unit of CRDT mutation
# behind Ctrl+K and cross-peer collaboration. Chat's messages/channels/reactions
# are exported as `ChatAction`s (see `src/actions.rs`) dispatched through the
# framework's `ui::ActionHost`.
tilo-actions = { path = "../../crates/collab/actions" }
# The address a message carries when it was authored by selecting something —
# `Message::reference` — and the vocabulary an agent's own progress on a
# summons is recorded in (`Message::work`, `ChatAction::SetAgentWork`).
tilo-reference = { path = "../../crates/collab/reference" }
qdoc = { path = "../../crates/doc/qdoc" }
# Message bodies and drafts are rich text, written in the SDK editor.
qdoc-rich-text = { path = "../../crates/doc/qdoc-rich-text" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# Content addressing everywhere; the on-disk and device stores only natively
# (the browser build keeps content in memory).
tilo-content = { path = "../../crates/system/content", default-features = false }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# XDG data-dir resolution for on-disk persistence of the workspace document.
xdg-paths = { path = "../../crates/system/xdg-paths" }
# Read image headers for workspace attachments and encode demo thumbnails for
# the shared `ui::ImageStore`.
# Attachment bytes live in the app's content store; no
# sender-local path is stored in the chat document.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tilo-content = { path = "../../crates/system/content", features = ["dir", "device"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
media = { path = "../../crates/media/core", default-features = false }
# The Tilo runtime user-identity loader (TILO_USER_IDENTITY) — the canonical
# per-peer identity the collab layer signs with. Chat uses its public key +
# display name so every running instance is a distinct participant.
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
# Live-media dependencies. Versions match the workspace media and transport
# stacks to avoid duplicate copies.
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
# Length-prefixed media frames on the call stream.
wire-frame = { path = "../../crates/system/wire-frame", optional = true, features = ["tokio"] }
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The browser runtime embeds this app in wasm32, where the toolkit is the
# portable build: no native desktop runner, no broker transport, no portal.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", default-features = false }
