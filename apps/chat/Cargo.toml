[package]
name = "chat"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "chat"
path = "src/lib.rs"

[[bin]]
name = "chat"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The default app includes the real-time media engine. Shots and tests use the
# simulated engine and do not start an iroh endpoint or ScreenCast portal.
default = ["live-media"]
# Voice, camera, and screen sharing use iroh QUIC, GStreamer capture/playback,
# `tilo-callstream`, and the ScreenCast portal. This is a default feature for
# the shipped app; disable default features only for explicitly media-free
# builds and hermetic tests.
live-media = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:iroh",
    "dep:tokio",
    "dep:tilo-callstream",
    "ui/portal",
]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: the serializable, replayable unit of CRDT mutation
# behind Ctrl+K and cross-peer collaboration. Chat's messages/channels/reactions
# are exported as `ChatAction`s (see `src/actions.rs`) dispatched through the
# framework's `ui::ActionHost`.
tilo-actions = { path = "../../crates/collab/actions" }
# The address a message carries when it was authored by selecting something —
# `Message::reference` — and the vocabulary an agent's own progress on a
# summons is recorded in (`Message::work`, `ChatAction::SetAgentWork`).
tilo-reference = { path = "../../crates/collab/reference" }
qdoc = { path = "../../crates/doc/qdoc" }
# The Tilo runtime user-identity loader (TILO_USER_IDENTITY) — the canonical
# per-peer identity the collab layer signs with. Chat uses its public key +
# display name so every running instance is a distinct participant.
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# XDG data-dir resolution for on-disk persistence of the workspace document.
xdg-paths = { path = "../../crates/system/xdg-paths" }
# Read image headers for workspace attachments and encode demo thumbnails for
# the shared `ui::ImageStore`.
# Attachment bytes hydrate through qdoc's content-addressed blob store; no
# sender-local path is stored in the chat document.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Live-media dependencies. Versions match the workspace media, transport, and
# portal stacks to avoid duplicate copies.
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync", "time"] }
tilo-callstream = { path = "../../crates/collab/tilo-callstream", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
