[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[lib]
name = "chat"
path = "src/lib.rs"

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Same pin as `ui`/`shell`: the in-tree C build (no runtime libopenh264.so).
# Shared target dir means this links the already-compiled artifact — used to
# synthesise the demo call frame so the VideoPlayer surface is populated
# offline. Live MoQ-over-iroh transport is gated behind a worker + TODO.
openh264 = { version = "0.9", features = ["source"] }
