[package]
name = "video-editor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "video_editor"
path = "src/lib.rs"

[[bin]]
name = "video-editor"
path = "src/main.rs"

# Media import uses the shared host file chooser (`ui::portal`) in every build;
# it is independent of the GStreamer decode/export features.
[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
fnv.workspace = true
# `ui` brings the host file chooser and the planar upload + YUV shader the
# compositor paints hardware-decoded frames with (`ui::gpu_video`).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Used directly by the media and application modules.
tracing.workspace = true
anyhow.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Decode/preview/export runs through GStreamer, linked only under the
# `gst` feature so the default fleet build (and `--shots`) compiles without
# the gstreamer-1.0 dev headers present. ffmpeg is intentionally not a dep.
gstreamer = { workspace = true, optional = true }
media = { package = "tilo-media", path = "../../crates/platform/tilo-media" }
gstreamer-app = { version = "0.24", optional = true }
# Bin swatches and filmstrip frames come from the shared preview pipeline.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }

# GStreamer encode/decode tests share a `serial` group because the native
# encoder is not safe to run concurrently in one process.
[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
serial_test.workspace = true
tempfile.workspace = true
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../crates/dev/test-env" }
tilo-advisory-lock = { path = "../../crates/system/advisory-lock" }
# The compose probe example writes rendered frames for inspection.

# The page build has no GStreamer: the editor runs with representative
# preview frames there (the preview's blocking frame-exact seeks need an
# asynchronous path before the page's media elements can serve them).
[package.metadata.tilo]
web-features = []

[features]
# Shared-runtime build, as the rest of the fleet has adopted: links the
# toolkit as a dylib so an app stays small.
thin = ["dep:runtime-dylib"]
# The default editor includes decode and export. Headless shots and tests stay
# hermetic at runtime because they use the representative frame and do not
# start an encoder.
default = ["decode", "gst"]
# Decode and waveform support for the preview canvas through
# `media::MediaEngine` and its appsink.
decode = ["media/decode", "tilo-thumbnail/video", "dep:gstreamer", "dep:gstreamer-app"]
# GStreamer encode and mux support. Kept separate so preview-only builds can
# use `--no-default-features --features decode`.
gst = ["dep:gstreamer", "dep:gstreamer-app", "media/encode"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
