[package]
name = "hex-editor"
version = "0.1.0"
description = "Hex editor: edits a file's bytes as a collaborative record"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["hex-editor-samples"]

[lib]
name = "hex_editor"
path = "src/lib.rs"

[[bin]]
name = "hex-editor"
path = "src/main.rs"

[features]
# The buffer the screenshot scenarios open: development runs, captures and
# tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `hex-editor` claims `--features hex-editor/thin` in the
# collection build, and the app then links the whole runtime statically.
hex-editor-samples = { package = "hex-editor", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
