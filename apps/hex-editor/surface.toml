# Written by `tilo-app surface`; review changes like an API change.

format = 2

[[resources]]
kind = "hex-editor.document"
label = "Hex document"
version = 1
fields = [
  { path = "name", type = { option = "text" }, readonly = true },
  { path = "opened", type = "int", readonly = true },
  { path = "bytes", type = "any", ops = "sha256:2fa6b0850e7a3ef9" },
]

[[resources.verbs]]
id = "load"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string" } },
  { name = "bytes", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "insert-bytes"
kind = "undoable"
params = [
  { name = "offset", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
  { name = "bytes", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "overwrite-bytes"
kind = "undoable"
params = [
  { name = "offset", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
  { name = "bytes", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "delete-bytes"
destructive = true
kind = "undoable"
params = [
  { name = "offset", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
  { name = "len", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

