[package]
name = "scratchpad-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Scratchpad's resource: the one note a workspace keeps, with the type the app draws"

# The resource Scratchpad keeps and an agent reads and writes through the same
# type. It has no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "scratchpad_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
