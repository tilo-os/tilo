[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "osk"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "qOS on-screen keyboard — data-driven layouts, responsive sizing, customizable toolbar."

[lib]
name = "osk"
path = "src/lib.rs"

[[bin]]
name = "osk"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { path = "../../ui" }
# Real FUTO swipe decoder (ExecuTorch over FFI). Builds a stub reporting
# "unavailable" when the FUTO libs aren't linked, so the OSK falls back to
# its geometric decoder — see src/futo.rs.
swipe = { path = "../../crates/system/swipe" }
# Same render/event crate set the other `ui` apps pull in so the `Widget`
# impl can build a taffy node, draw into a vello `Scene`, react to winit
# events, and (for tests/headless) carry an automerge handle.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
# W7 — text injection into the focused surface via the Wayland
# `virtual-keyboard-v1` protocol (wtype-style). The injector opens its own,
# second wayland-client connection, independent of the one winit owns.
wayland-client.workspace = true
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# memfd_create for the synthetic XKB keymap fd handed to the compositor.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Compile the synthetic keymap with the *same* library a real compositor uses
# (libxkbcommon), so the unit tests prove the generated keymap actually parses
# and that each symbol resolves to the intended keysym.
xkbcommon = "0.8"

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
