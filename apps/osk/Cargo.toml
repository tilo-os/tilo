[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "osk"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo on-screen keyboard — data-driven layouts, responsive sizing, customizable toolbar."

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "osk"
path = "src/lib.rs"

[[bin]]
name = "osk"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
# FUTO swipe decoder (ExecuTorch over FFI); builds an unavailable stub when
# the FUTO libraries are not linked.
swipe = { path = "../../crates/system/swipe" }
# Emoji catalogue, search, skin tones, recents and word suggestions.
emoji = { path = "../../crates/text/emoji" }
# Same render/event crate set the other `ui` apps pull in so the `Widget`
# impl can build a taffy node, draw into a vello `Scene`, react to winit
# events, and (for tests/headless) carry an automerge handle.
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
# W7 — text injection into the focused surface via the Wayland
# `virtual-keyboard-v1` protocol (wtype-style). The injector opens its own,
# second wayland-client connection, independent of the one winit owns.
wayland-client.workspace = true
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# memfd_create for the synthetic XKB keymap fd handed to the compositor.
libc.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-automerge.workspace = true
tempfile.workspace = true
# Compile the synthetic keymap with libxkbcommon so tests validate generated
# keymaps and symbol resolution.
xkbcommon = "0.8"
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
