[package]
name = "music"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "music"
path = "src/lib.rs"

[[bin]]
name = "music"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The default app includes live search, stream resolution, and audio output.
# The bundled sample library and runtime offline switch keep shots and tests
# hermetic; `lyrics` and `p2p` remain opt-in.
default = ["audio", "live"]
# Desktop audio output/control and the XDG file chooser for playlist covers.
audio = ["dep:gstreamer", "dep:zbus", "dep:tokio", "ui/portal"]
# YouTube Music search and stream resolution through the pure-Rust `rustypipe`
# InnerTube client. Off by default so shots/tests stay hermetic; `reqwest`
# supports `--probe` verification.
live = ["dep:rustypipe", "dep:tokio", "dep:reqwest"]
# Synced lyrics from lrclib.net over HTTP; off by default.
lyrics = ["dep:reqwest"]
# Async P2P library-sync transport; only its Tokio executor is feature-gated.
p2p = ["dep:tokio"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
ui = { package = "tilo-app", path = "../../crates/app/tilo-app" }
# The Tilo action model: document-mutating library edits (playlist create/rename/
# delete, add/remove/reorder track, like/save/follow) are replayable actions the
# Ctrl+K palette and the on-screen affordances both dispatch — one source of
# truth, one replay path.
tilo-actions = { path = "../../crates/collab/actions" }
media = { path = "../../crates/media" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
base64.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Optional: enabled only by the `audio` / `live` / `lyrics` / `p2p`
# features above. Versions pinned to match the workspace lock so no extra
# copies resolve (tokio mirrors the `chat` app + `fs` submodule pins).
reqwest = { workspace = true, optional = true, features = ["blocking", "json", "rustls-tls"] }
gstreamer = { workspace = true, optional = true }
# MPRIS D-Bus media control. The version matches `apps/chat` and `ashpd` to
# keep one zbus copy; `p2p` also supports socket-pair round-trip tests.
zbus = { workspace = true, optional = true, features = ["p2p"], default-features = true }
# Native XDG file-chooser portal for playlist covers; `url` maps returned URIs.
# Kept non-optional so URI mapping and its tests build in the default
# configuration.
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# Pure-Rust InnerTube (YouTube / YouTube Music) client: search + stream
# resolution. Embeds `rquickjs` for signature deobfuscation — no ffmpeg /
# yt-dlp / JS runtime binary. Gated behind `live`; off the `--shots` path.
rustypipe = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
