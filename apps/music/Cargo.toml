[package]
name = "music"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "music"
path = "src/lib.rs"

[[bin]]
name = "music"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The default app includes live search, stream resolution, and audio output.
# The bundled sample library and runtime offline switch keep shots and tests
# hermetic. Live builds also support network lyrics.
default = ["audio", "live"]
# Desktop audio output/control and the host file chooser for playlist covers.
audio = ["dep:gstreamer", "dep:tokio", "ui/portal", "ui/mpris"]
# YouTube Music search and stream resolution through the pure-Rust `rustypipe`
# InnerTube client. Shots/tests select their hermetic backend at runtime; `reqwest`
# supports `--probe` verification.
live = ["dep:rustypipe", "dep:tokio", "dep:reqwest", "dep:tilo-net", "dep:rquickjs"]
# Enable network lyrics without the full live backend; live already enables them.
lyrics = ["dep:reqwest", "dep:tilo-net"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
xdg-paths = { path = "../../crates/system/xdg-paths" }
dirs.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: document-mutating library edits (playlist create/rename/
# delete, add/remove/reorder track, like/save/follow) are replayable actions the
# Ctrl+K palette and the on-screen affordances both dispatch — one source of
# truth, one replay path.
tilo-actions = { path = "../../crates/collab/actions" }
media = { path = "../../crates/media/core" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
base64.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
sha2.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Optional: enabled only by the `audio` / `live` / `lyrics`
# features above. Versions pinned to match the workspace lock so no extra
# copies resolve (tokio mirrors the `chat` app + `fs` submodule pins).
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
tilo-net = { path = "../../crates/system/tilo-net", optional = true, features = ["blocking"] }
gstreamer = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# Pure-Rust InnerTube (YouTube / YouTube Music) client: search + stream
# resolution. Embeds `rquickjs` for signature deobfuscation — no external
# interpreter, downloader, or JS runtime binary. Gated behind `live`.
rustypipe = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
# QuickJS does not ship Windows ARM64 bindings; generate the actual target ABI.
rquickjs = { workspace = true, optional = true, features = ["bindgen"] }

[target.'cfg(target_os = "linux")'.dependencies]
bounded-command = { path = "../../crates/system/bounded-command" }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true
