[package]
name = "music"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "music"
path = "src/lib.rs"

[[bin]]
name = "music"
path = "src/main.rs"

# The page build has no GStreamer and no live catalogue yet: the player
# plays through the page's media element (tilo-media), and search, stream
# resolution and lyrics wait for tilo-net's fetch backend.
[package.metadata.tilo]
web-features = []

[features]
thin = ["dep:runtime-dylib"]
# Play Spotify and reach YouTube Music through their engine libraries in the
# runtime bundle (libtilo_spotify_engine.so and libtilo_youtube_engine.so,
# under crates/runtime/engines/) instead of the executable. The release
# collection enables it (dist/apps/app-collections.toml); a `thin` build
# without it (`tilo-app dev`) links librespot and rustypipe statically,
# because an engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "spotify-native", "tilo-spotify-engine/thin", "tilo-youtube-engine/thin"]
# The default app includes live search, stream resolution, and audio output.
# The bundled sample library and runtime offline switch keep shots and tests
# hermetic. Live builds also support network lyrics.
default = ["audio", "live", "spotify-native"]
spotify-native = ["audio", "live", "tilo-spotify/native"]
# Desktop audio output. Media controls and the host file chooser for playlist
# covers come with `ui`.
audio = ["dep:gstreamer", "dep:tokio", "media/voice"]
# YouTube Music search and stream resolution through the pure-Rust `rustypipe`
# InnerTube client. Shots/tests select their hermetic backend at runtime; `reqwest`
# supports `--probe` verification.
live = ["dep:rustypipe", "dep:tilo-innertube", "dep:tokio", "dep:reqwest", "dep:tilo-invidious", "tilo-net/http", "tilo-net/blocking", "dep:tilo-spotify"]

[dependencies]
tilo-spotify = { path = "../../crates/platform/tilo-spotify", optional = true }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-spotify-engine = { path = "../../crates/runtime/engines/spotify", optional = true }
tilo-youtube-engine = { path = "../../crates/runtime/engines/youtube", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { path = "../../crates/platform/tilo-files" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: document-mutating library edits (playlist create/rename/
# delete, add/remove/reorder track, like/save/follow) are replayable actions the
# Ctrl+K palette and the on-screen affordances both dispatch — one source of
# truth, one replay path.
tilo-actions = { path = "../../crates/collab/actions" }
media = { package = "tilo-media", path = "../../crates/platform/tilo-media" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
base64.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
# Portal-selected cover art is normalised through the shared preview decoder.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }
tracing.workspace = true
hex.workspace = true
sha2.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Optional: enabled only by the `audio` / `live` / `lyrics`
# features above. Versions pinned to match the workspace lock so no extra
# copies resolve (tokio mirrors the `chat` app + `fs` submodule pins).
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
# Network status (whether the connection is metered, for prefetch) always;
# HTTP with `live` or `lyrics`.
tilo-net = { path = "../../crates/platform/tilo-net" }
gstreamer = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "time"] }
# Pure-Rust InnerTube (YouTube / YouTube Music) client: search + stream
# resolution. Embeds `rquickjs` for signature deobfuscation — no external
# interpreter, downloader, or JS runtime binary. Gated behind `live`.
rustypipe = { workspace = true, optional = true, features = ["rustls-no-provider"] }
# Its queries, compiled once beside it (in the YouTube engine library in a
# release) rather than in this executable.
tilo-innertube = { path = "../../crates/platform/tilo-innertube", optional = true }
# Fully-rangeable stream URLs through Invidious media proxies.
tilo-invidious = { path = "../../crates/platform/tilo-invidious", optional = true }

[dev-dependencies]
test-http = { path = "../../crates/dev/test-http" }
tilo-oauth = { path = "../../crates/system/tilo-oauth", features = ["fake"] }
serial_test.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env", features = ["document"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

# The Windows-on-Arm test proves QuickJS, which rustypipe embeds for stream
# signatures, runs there.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dev-dependencies]
rquickjs.workspace = true
