[package]
name = "scratchpad"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
# One instance per note directory.
advisory-lock = { path = "../../crates/system/advisory-lock" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The native diagnostic reports the note's BLAKE3 hash, never its text.
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
