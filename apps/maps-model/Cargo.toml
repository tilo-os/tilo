[package]
name = "maps-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Maps' resources: the shared map with its places, searches and plans, and the areas downloaded for offline use"

# The resources Maps keeps and an agent reads through the same verbs. They have
# no window and no surface of their own; the app draws them.
#
# It depends on the resource layer and the action API, never the toolkit. The
# basemap, tiles, network and painting stay in the app.

[lib]
name = "maps_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
