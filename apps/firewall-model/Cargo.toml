[package]
name = "firewall-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Firewall's resources: the rules a workspace shares, the zones they belong to, and what each device applied"

# The resources Firewall keeps and an agent reads through the same verbs. They
# have no window and no surface of their own; the app draws them.
#
# It depends on the resource layer and the action API, never the toolkit. What
# firewalld answers on a device stays in the app: the model only holds the
# configuration people share and what each device pushed.

[lib]
name = "firewall_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
