[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "settings"
version = "0.1.0"
edition = "2024"

[lib]
name = "settings"
path = "src/lib.rs"

[[bin]]
name = "settings"
path = "src/main.rs"

[dependencies]
# One owner for ~/.config/qos/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
# The one capability vocabulary the compositor persists. Depending on this
# lightweight *types* crate (not the compositor) lets the Permissions pane
# deserialise the real per-workspace grants the shell writes to
# ~/.config/qos/state.json and render them read-only, instead of a hand-mirrored
# copy that could drift from the enforced shape.
collab-types = { path = "../../crates/collab/collab-types" }
# The qOS action model: every setting mutation is a serializable, replayable
# `SettingsAction` the on-screen controls and the Ctrl+K palette both dispatch.
qos-actions = { path = "../../crates/collab/actions" }
ui = { path = "../../ui" }
# Shared shell-out helpers for the interactive panes (display, audio,
# network, bluetooth). The crate lives at the workspace root so both
# `shell` and the Settings app drive the same hardware bindings without
# this app depending on the compositor crate.
os-actions = { path = "../../crates/system/os-actions" }
# The shared multi-account store + encrypted secret vault. Settings reads and
# writes email + CalDAV accounts through this one canonical store, so it and
# the Mail / Calendar apps can no longer disagree on the on-disk shape.
accounts = { path = "../../crates/system/accounts" }
# The audio graph client: enumerate the PipeWire/WirePlumber node graph and
# route per-application streams. The Sound pane drives real audio routing
# through it (default features only — no gstreamer decode stack pulled in).
media = { path = "../../crates/media" }
# Trait passes (`sync`, `build_layout`, `handle_event`) mention these crates
# in their signatures; we re-export them at the same versions the sibling
# native apps pin so a shared `target/` cache hits across crates.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The shared account + region/format stores Settings owns are plain
# serde-serialisable JSON documents that other apps (Mail, Calendar,
# Sheets, Weather) read. serde/serde_json render them; dirs resolves the
# per-user config root; uuid mints stable account ids.
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# The persistence tests read the shared account store + vault back to prove
# the pane wrote through them.
accounts = { path = "../../crates/system/accounts" }
# The accounts→Mail loop test drives the Settings add flow, then loads the
# account back through Mail's own reader to prove Mail actually consumes what
# Settings persisted (end-to-end across the shared store, not a mock).
mail = { path = "../mail" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
