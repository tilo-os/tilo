[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "settings"
version = "0.1.0"
description = "Personal Settings: the device and account settings hub"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "settings"
path = "src/lib.rs"

[[bin]]
name = "settings"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach account custody and the IMAP client through their engine library in
# the runtime bundle (libtilo_accounts_engine.so,
# crates/runtime/engines/accounts) instead of the runtime. The release
# collection enables it (dist/apps/app-collections.toml); a `thin` build
# without it (`tilo-app dev`) links account-custody and async-imap
# statically, because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-accounts-engine/thin"]

[dependencies]
provider-settings-ui = { version = "0.1.0", path = "../../crates/sdk/provider-settings-ui" }
# Shared platform layout data keeps Settings independent of the OSK app.
tilo-keyboard-map = { version = "0.1.0", path = "../../crates/platform/tilo-keyboard-map" }
tilo-locale = { path = "../../crates/platform/tilo-locale" }
# The shipped wallpapers' catalog and thumbnails, for the Appearance picker.
tilo-wallpapers = { version = "0.1.0", path = "../../crates/platform/tilo-wallpapers" }
hex.workspace = true
tilo-clock = { path = "../../crates/platform/tilo-clock" }
bounded-command = { path = "../../crates/system/bounded-command" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-accounts-engine = { path = "../../crates/runtime/engines/accounts", optional = true }
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../crates/system/settings-store", features = ["model"] }
tilo-accessibility-settings = { path = "../../crates/platform/tilo-accessibility-settings", features = ["model"] }
desktop-policy = { path = "../../crates/system/desktop-policy" }
package-store = { path = "../../crates/packaging/package-store" }
# Installed manifests are read through the package format's one decoder,
# not the sandbox launcher's library.
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
# The same freedesktop scanner the shell uses for host and Flatpak launches;
# notification rules must be keyed by those canonical desktop identities.
desktop-entry = { package = "tilo-desktop-entry", path = "../../crates/system/desktop-entry" }
# The one capability vocabulary the compositor persists. Depending on this
# lightweight *types* crate (not the compositor) lets the Permissions pane
# deserialise the per-workspace grants the shell writes to
# ~/.config/tilo/state.json and render them read-only, instead of a hand-mirrored
# copy that could drift from the enforced shape.
collab-types = { path = "../../crates/collab/collab-types" }
# The Tilo action model: every setting mutation is a serializable, replayable
# `SettingsAction` the on-screen controls and the Ctrl+K palette both dispatch.
tilo-actions = { path = "../../crates/collab/actions" }
# The CA-certificate chooser and captive-portal sign-in go through
# `ui::portal`, never a host tool.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Shared shell-out helpers for the interactive panes (display, audio,
# network, bluetooth). The crate lives at the workspace root so both
# `shell` and the Settings app drive the same hardware bindings without
# this app depending on the compositor crate.
os-actions = { path = "../../crates/system/os-actions" }
# Public identity summaries, as the host's identity actions answer them. The
# identity store itself is the host's: no record or secret enters Settings.
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
runtime-fs = { path = "../../crates/runtime/runtime-fs" }
# Device role, workspace residency and server relay policy use the same types
# the tilo-relay daemon loads; Settings never keeps a shadow sync model.
tilo-relay-protocol = { path = "../../crates/hosting/tilo-relay-protocol" }
tilo-bluez = { path = "../../crates/system/tilo-bluez" }
# The shared multi-account store + encrypted secret vault. Settings reads and
# writes email + CalDAV accounts through this one canonical store, so it and
# the Mail / Calendar apps can no longer disagree on the on-disk shape.
accounts = { path = "../../crates/system/accounts", features = ["person"] }
# Credential custody for cloud accounts: the shared OAuth client, Nextcloud
# Login Flow v2, iCloud sessions and the short-lived handoff to the storage
# daemon.
account-custody = { path = "../../crates/system/account-custody" }
# Provider metadata is shared with the headless agent runner. This dependency
# contains no HTTP client and no secret values.
agent-provider-config = { path = "../../crates/agent/provider-config", features = ["model"] }
# The audio graph client: enumerate the PipeWire/WirePlumber node graph and
# route per-application streams. The Sound pane drives audio routing
# through it (default features only — no gstreamer decode stack pulled in).
media = { package = "tilo-media", path = "../../crates/platform/tilo-media" }
# Trait passes (`sync`, `build_layout`, `handle_event`) mention these crates
# in their signatures; we re-export them at the same versions the sibling
# native apps pin so a shared `target/` cache hits across crates.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
tilo-net = { path = "../../crates/platform/tilo-net" }
# Account probes speak DAV through the shared bounded client and IMAP through
# async-imap, the client Mail uses, on a per-probe current-thread runtime.
tilo-dav = { path = "../../crates/system/tilo-dav" }
async-imap.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
tokio-rustls.workspace = true
zeroize.workspace = true
# The shared account + region/format stores Settings owns are plain
# serde-serialisable JSON documents that other apps (Mail, Calendar,
# Sheets, Weather) read. serde/serde_json render them; dirs resolves the
# per-user config root; uuid mints stable account ids.
serde.workspace = true
serde_json.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
quick-xml.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
provider-settings-ui = { version = "0.1.0", path = "../../crates/sdk/provider-settings-ui", features = ["test-support"] }
# Exercise the published Files surface against the production cloud service.
file-explorer = { path = "../file-explorer" }
zip.workspace = true
# The platform adapter the native runner feeds, for the live-bus benchmark.
accesskit_unix = { version = "0.23.0", default-features = false, features = ["tokio"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
# Prove that discovered selections are consumed by Calendar, not just valid JSON.
calendar = { path = "../calendar", default-features = false }
# Serialised, self-restoring HOME/XDG redirection for the tests that
# construct the whole app or persist through the per-user settings file.
tilo-test-env = { path = "../../crates/dev/test-env" }
rcgen.workspace = true
test-http = { path = "../../crates/dev/test-http" }
# The persistence tests read the shared account store + vault back to verify
# the pane wrote through them.
accounts = { path = "../../crates/system/accounts" }
# A fake authorization server and browser for the sign-in flow tests.
tilo-oauth = { path = "../../crates/system/tilo-oauth", features = ["fake"] }
# The cloud storage end-to-end test: Settings signs in, the storage
# daemon's cloud service mounts the account against each provider's fake.
tilo-fs = { path = "../../crates/system/fs" }
cloud-source = { path = "../../crates/system/cloud-source" }
cloud-source-gdrive = { path = "../../crates/system/cloud-source-gdrive", features = ["fake-server"] }
cloud-source-onedrive = { path = "../../crates/system/cloud-source-onedrive", features = ["fake-server"] }
cloud-source-dropbox = { path = "../../crates/system/cloud-source-dropbox", features = ["fake-server"] }
cloud-source-icloud = { path = "../../crates/system/cloud-source-icloud", features = ["fake-server"] }
# The keyboard preview's confinement test runs it inside the launcher's real
# read-only sandbox profile. The app itself never links the launcher.
launcher = { path = "../../crates/packaging/launcher" }

[[test]]
name = "it"
path = "tests/it.rs"

# These suites deliberately redirect the process-global XDG config root.
# Keep them out of `it` so they never share a process with the UI interaction
# suite; one binary is enough — nextest isolates each test in its own process.
[[test]]
name = "xdg"
path = "tests/xdg.rs"

[lints]
workspace = true
