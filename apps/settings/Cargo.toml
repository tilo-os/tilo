[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "settings"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "settings"
path = "src/lib.rs"

[[bin]]
name = "settings"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
bounded-command = { path = "../../crates/system/bounded-command" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
desktop-policy = { path = "../../crates/system/desktop-policy" }
launcher = { path = "../../crates/packaging/launcher" }
# The same freedesktop scanner the shell uses for host and Flatpak launches;
# notification rules must be keyed by those canonical desktop identities.
desktop-entry = { package = "tilo-desktop-entry", path = "../../crates/system/desktop-entry" }
# The one capability vocabulary the compositor persists. Depending on this
# lightweight *types* crate (not the compositor) lets the Permissions pane
# deserialise the per-workspace grants the shell writes to
# ~/.config/tilo/state.json and render them read-only, instead of a hand-mirrored
# copy that could drift from the enforced shape.
collab-types = { path = "../../crates/collab/collab-types" }
# The Tilo action model: every setting mutation is a serializable, replayable
# `SettingsAction` the on-screen controls and the Ctrl+K palette both dispatch.
tilo-actions = { path = "../../crates/collab/actions" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Shared shell-out helpers for the interactive panes (display, audio,
# network, bluetooth). The crate lives at the workspace root so both
# `shell` and the Settings app drive the same hardware bindings without
# this app depending on the compositor crate.
os-actions = { path = "../../crates/system/os-actions" }
# Public identity summaries + active selector. The secret share never enters
# Settings state; switching writes only the non-secret active id.
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
runtime-fs = { path = "../../crates/runtime/runtime-fs" }
# Device role, workspace residency and server relay policy use the same types
# the tilo-relay daemon loads; Settings never keeps a shadow sync model.
tilo-relay-protocol = { path = "../../crates/hosting/tilo-relay-protocol" }
tilo-bluez = { path = "../../crates/system/tilo-bluez" }
runtime-portal-xdg = { path = "../../crates/runtime/runtime-portal-xdg" }
# The shared multi-account store + encrypted secret vault. Settings reads and
# writes email + CalDAV accounts through this one canonical store, so it and
# the Mail / Calendar apps can no longer disagree on the on-disk shape.
accounts = { path = "../../crates/system/accounts" }
# Provider metadata is shared with the headless agent runner. This dependency
# contains no HTTP client and no secret values.
agent-provider-config = { path = "../../crates/agent/provider-config" }
# Settings uses this only over the launcher-passed service FD to put/remove a
# key; no vault file or provider network capability is linked into the app.
tilo-model-gateway = { path = "../../crates/agent/model-gateway" }
# The audio graph client: enumerate the PipeWire/WirePlumber node graph and
# route per-application streams. The Sound pane drives audio routing
# through it (default features only — no gstreamer decode stack pulled in).
media = { path = "../../crates/media/core" }
# Trait passes (`sync`, `build_layout`, `handle_event`) mention these crates
# in their signatures; we re-export them at the same versions the sibling
# native apps pin so a shared `target/` cache hits across crates.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
tilo-net = { path = "../../crates/system/tilo-net" }
# Account probes speak DAV through the shared bounded client and IMAP through
# async-imap, the client Mail uses, on a per-probe current-thread runtime.
tilo-dav = { path = "../../crates/system/tilo-dav" }
async-imap.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
tokio-rustls.workspace = true
zeroize.workspace = true
# The shared account + region/format stores Settings owns are plain
# serde-serialisable JSON documents that other apps (Mail, Calendar,
# Sheets, Weather) read. serde/serde_json render them; dirs resolves the
# per-user config root; uuid mints stable account ids.
serde.workspace = true
serde_json.workspace = true
atomic-file = { path = "../../crates/system/atomic-file" }
dirs.workspace = true
quick-xml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Serialised, self-restoring HOME/XDG redirection for the tests that
# construct the whole app or persist through the per-user settings file.
tilo-test-env = { path = "../../crates/dev/test-env" }
rcgen.workspace = true
test-http = { path = "../../crates/dev/test-http" }
# The persistence tests read the shared account store + vault back to verify
# the pane wrote through them.
accounts = { path = "../../crates/system/accounts" }
# The accounts→Mail loop test drives the Settings add flow, then loads the
# account back through Mail's own reader to verify Mail consumes what
# Settings persisted across the shared store.
mail = { path = "../mail" }

[[test]]
name = "it"
path = "tests/it.rs"

# These suites deliberately redirect the process-global XDG config root.
# Keep each in its own test process instead of cohabiting the UI interaction
# suite, whose parallel tests may legitimately construct settings panes.
[[test]]
name = "prefs_persistence"
path = "tests/prefs_persistence.rs"

[[test]]
name = "accounts_mail_loop"
path = "tests/accounts_mail_loop.rs"

[lints]
workspace = true
