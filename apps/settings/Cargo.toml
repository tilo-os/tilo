[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "settings"
version = "0.1.0"
description = "Settings: the device and account settings hub"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "settings"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "settings"
path = "src/main.rs"

[features]
default = ["tilo-os"]
# The panes that administer the device Settings runs on: its hardware
# (displays, sound, Bluetooth, power, printers, disks, network), its OS
# services (users, updates, time, default apps, notifications' app list,
# storage, device sync) and the accounts it keeps in its own vault (mail,
# calendars, cloud storage, model providers). They need the device's
# programs, files, sockets and system bus. A browser tab has none of them,
# so the web build (and the agent host, which has no device to administer)
# leaves the feature off: those panes are compiled out, not shown broken.
tilo-os = ["dep:bounded-command", "dep:desktop-entry", "dep:os-actions", "dep:tilo-ntfs-mount", "dep:runtime-fs", "dep:tilo-bluez", "dep:account-credentials", "dep:media", "dep:tilo-audio-service", "dep:tilo-dav", "dep:tilo-account-probe", "dep:tilo-capture", "dep:tilo-system-resources", "tilo-keyboard-map/native"]
thin = ["dep:runtime-dylib"]
# Run the app from the Settings engine library in the runtime bundle
# (libtilo_settings_engine.so, crates/engines/loadable/settings), which carries
# this package's library and links account credentials and the IMAP client from
# their own engine library: the binary is one call into it (src/main.rs). The
# release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links the library statically, because an
# engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin"]

[dependencies]
# The days data usage is counted and charted on.
jiff.workspace = true
provider-settings-ui = { version = "0.1.0", path = "../../crates/integrations/provider-settings-ui" }
# Shared platform layout data keeps Settings independent of the OSK app. Reading the layouts a
# device has installed needs libxkbcommon, so only the device panes (`tilo-os`) turn that on.
tilo-keyboard-map = { version = "0.1.0", path = "../../crates/platform/tilo-keyboard-map", default-features = false }
# The outlines the keyboard preview draws.
tilo-pc-keyboard-geometry = { path = "../../crates/platform/pc-keyboard-geometry" }
# The Date & Time pane's globe.
tilo-zone-globe = { path = "../../crates/sdk/zone-globe" }
tilo-locale = { path = "../../crates/platform/tilo-locale" }
# The shipped wallpapers' catalog and thumbnails, for the Appearance picker.
tilo-wallpapers = { version = "0.1.0", path = "../../crates/platform/tilo-wallpapers" }
hex.workspace = true
tilo-clock = { path = "../../crates/platform/tilo-clock" }
tilo-process = { path = "../../crates/platform/tilo-process" }
tilo-rt = { path = "../../crates/platform/tilo-rt" }
bounded-command = { path = "../../crates/platform/bounded-command", optional = true }
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../crates/system/settings-store", features = ["model"] }
# The sections Settings edits, which the session keeps as resources too.
settings-sections = { path = "../../crates/system/settings-sections" }
tilo-accessibility-settings = { path = "../../crates/platform/tilo-accessibility-settings", features = ["model"] }
desktop-policy = { path = "../../crates/system/desktop-policy" }
package-store = { path = "../../crates/packaging/package-store" }
# Installed manifests are read through the package format's one decoder,
# not the sandbox launcher's library.
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
# The same freedesktop scanner the shell uses for host and Flatpak launches;
# notification rules must be keyed by those canonical desktop identities.
desktop-entry = { package = "tilo-desktop-entry", path = "../../crates/system/desktop-entry", optional = true }
# The one capability vocabulary the compositor persists. Depending on this
# lightweight *types* crate (not the compositor) lets the Permissions pane
# deserialise the per-workspace grants the shell writes to
# ~/.config/tilo/state.json and render them read-only, instead of a hand-mirrored
# copy that could drift from the enforced shape.
collab-types = { path = "../../crates/collab/collab-types" }
tilo-action-policy = { path = "../../crates/collab/action-policy" }
# The Tilo action model: every setting mutation is a serializable, replayable
# `SettingsAction` the on-screen controls and the Ctrl+K palette both dispatch.
tilo-actions = { path = "../../crates/collab/actions" }
# The CA-certificate chooser and captive-portal sign-in go through
# `ui::portal`, never a host tool.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Shared shell-out helpers for the interactive panes (display, audio,
# network, bluetooth). The crate lives at the workspace root so both
# `shell` and the Settings app drive the same hardware bindings without
# this app depending on the compositor crate.
os-actions = { path = "../../crates/system/os-actions", optional = true }
# The session's `system-update` resource: the reading the Updates pane shows and the names of
# its actions.
tilo-system-resources = { path = "../../crates/platform/tilo-system-resources", optional = true }
# Remembered NTFS drives: the mount service's protocol (panes::drives).
tilo-ntfs-mount = { path = "../../crates/os/ntfs-mount", default-features = false, optional = true }
# Public identity summaries, as the host's identity actions answer them. The
# identity store itself is the host's: no resource or secret enters Settings.
tilo-identity-client = { path = "../../crates/runtime/tilo-identity-client" }
runtime-fs = { package = "tilo-fs-client", path = "../../crates/runtime/tilo-fs-client", optional = true }
# Device role, workspace residency and server policy use the same types
# the tilo-server daemon loads; Settings never keeps a shadow sync model.
tilo-server-protocol = { path = "../../crates/server/tilo-server-protocol" }
tilo-bluez = { path = "../../crates/os/tilo-bluez", optional = true }
# The shared multi-account store + encrypted secret vault. Settings reads and
# writes email + CalDAV accounts through this one canonical store, so it and
# the Mail / Calendar apps can no longer disagree on the on-disk shape.
accounts = { path = "../../crates/integrations/accounts", features = ["person"] }
# Credential ownership for cloud accounts: the shared OAuth client, Nextcloud
# Login Flow v2, iCloud sessions and the short-lived handoff to the storage
# daemon.
account-credentials = { path = "../../crates/integrations/account-credentials", optional = true }
# Provider metadata is shared with the headless agent runner. This dependency
# contains no HTTP client and no secret values.
agent-provider-config = { path = "../../crates/integrations/provider-config", features = ["model"] }
# The bounded audio diagnostics the Sound pane starts (a channel test, a
# microphone and an output meter), and the event-sound themes it lists.
media = { package = "tilo-media", path = "../../crates/engines/tilo-media", optional = true }
# The session's `sound` resource: the reading the Sound pane shows and the
# actions its controls take. Without the `service` feature: the pane needs
# the resource's spec and types, the session runs the service.
tilo-audio-service = { path = "../../crates/session/audio-service", default-features = false, optional = true }
# Trait passes (`sync`, `build_layout`, `handle_event`) mention these crates
# in their signatures; we re-export them at the same versions the sibling
# native apps pin so a shared `target/` cache hits across crates.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tracing.workspace = true
# The DAV account panes parse server URLs and name discovered calendars.
tilo-dav = { path = "../../crates/integrations/tilo-dav", optional = true }
# The sign-in probes both this app and the workspace host run (one owner).
tilo-account-probe = { path = "../../crates/integrations/account-probe", optional = true }
zeroize.workspace = true
# The shared account + region/format stores Settings owns are plain
# serde-serialisable JSON documents that other apps (Mail, Calendar,
# Sheets, Weather) read. serde/serde_json render them; dirs resolves the
# per-user config root; uuid mints stable account ids.
serde.workspace = true
serde_json.workspace = true
# The change-only directory watch the panes follow host snapshots with.
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"] }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
quick-xml.workspace = true
uuid.workspace = true
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
# The installer service's client, for the language packs Region & formats offers.
package-service = { path = "../../crates/packaging/package-service", default-features = false }
tilo-capture = { path = "../../crates/engines/tilo-capture", features = ["scanner"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# The integration suites read the account store and the runtime's files back.
hex.workspace = true
runtime-fs = { package = "tilo-fs-client", path = "../../crates/runtime/tilo-fs-client" }
account-credentials = { path = "../../crates/integrations/account-credentials" }
# The platform adapter the native runner feeds, for the live-bus benchmark.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
# Prove that discovered selections are consumed by Calendar, not just valid JSON.
calendar = { path = "../calendar", default-features = false }
# Serialised, self-restoring HOME/XDG redirection for the tests that
# construct the whole app or persist through the per-user settings file.
tilo-test-env = { path = "../../tools/test-env" }
test-http = { path = "../../tools/test-http" }
# The persistence tests read the shared account store + vault back to verify
# the pane wrote through them.
accounts = { path = "../../crates/integrations/accounts" }
# A fake authorization server and browser for the sign-in flow tests.
tilo-oauth = { path = "../../crates/integrations/tilo-oauth", features = ["fake"] }
# The keyboard preview's confinement test runs it inside the launcher's real
# read-only sandbox profile. The app itself never links the launcher.
launcher = { path = "../../crates/packaging/launcher" }
provider-settings-ui = { version = "0.1.0", path = "../../crates/integrations/provider-settings-ui", features = ["test-support"] }
tilo-ntfs-mount = { path = "../../crates/os/ntfs-mount" }
tilo-capture = { path = "../../crates/engines/tilo-capture", features = ["scanner"] }

[[test]]
name = "it"
path = "tests/it.rs"
# The suites drive the device panes.
required-features = ["tilo-os"]

# These suites deliberately redirect the process-global XDG config root.
# Keep them out of `it` so they never share a process with the UI interaction
# suite; one binary is enough — nextest isolates each test in its own process.
[[test]]
name = "xdg"
path = "tests/xdg.rs"
# The suites drive the device panes.
required-features = ["tilo-os"]

[package.metadata.tilo]
# The web desktop links Settings without its device panes (`tilo-os`).
web-features = []

[lints]
workspace = true
