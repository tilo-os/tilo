# The actions of the workspace's vault that a tilolang app calls by address,
# read as the package `so.tilo.vault`: keeping a code generator's seed and
# forgetting it. A code is a reading (`vault_code`), not an action here. What
# the device's provider registers; a test holds it to this file.

