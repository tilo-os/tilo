# The bridge's process: a bun program the daemon's one launcher starts in the app sandbox,
# attested as this app. Its held connection is the Discord gateway, placed on one device.
[package]
id = "so.tilo.discord.preview"
kind = "app"
optional-runtimes = ["bun/1.4.5+bun"]

[entrypoint]
type = "cli"
runtime = "bun/1.4.5+bun"
bin = "bin/bun"
script = "main.js"
connection = true

[sandbox.services]
native = "required@40"

# What a device must give before it takes the held connection.
[capabilities]
required = ["network.http", "secrets"]

# The bridge's network, enforced with the workspace's grant. The token item's places only say
# where web-call may send its secret, so the origins the token really goes to are listed there
# too. Voice's *.discord.media hosts come from the package grant's domain entries.
[sandbox.net]
mode = "allowlist"
hosts = [
  "discord.com",
  "gateway.discord.gg",
  "cdn.discordapp.com",
  "media.discordapp.net",
  "*.discord.media",
]
