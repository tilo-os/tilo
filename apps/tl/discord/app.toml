# The bridge's process: a bun program the daemon's one launcher starts in the app sandbox,
# attested as this app. Its held connection is the Discord gateway, placed on one device.
[package]
id = "so.tilo.discord.preview"
kind = "app"
optional-runtimes = ["bun/1+bun"]

[entrypoint]
runtime = "bun/1+bun"
bin = "bin/bun"
script = "main.js"
connection = true

[sandbox.services]
native = "required@40"

# What a device must give before it takes the held connection.
[capabilities]
required = ["network.http", "secrets"]

# The token item's own places name where the token may be sent: the gateway and the REST
# origins. Voice's *.discord.media hosts wait on vault places that can name a domain.
[sandbox.net]
mode = "allowlist"
hosts = [
  "discord.com",
  "gateway.discord.gg",
  "cdn.discordapp.com",
  "media.discordapp.net",
]
