[package]
name = "disks-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Disks model as the WebAssembly module its package carries: the device-name verb, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
disks-model = { path = "../disks-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
