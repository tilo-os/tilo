[package]
name = "print-centre-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Print Centre's resource: the print and scan defaults a workspace keeps, with the check that keeps them to the offered choices"

# The resource Print Centre keeps and an agent sets through the same fields. It
# has no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. CUPS,
# SANE, the window and its effects stay in the app, on the machine that prints.

[lib]
name = "print_centre_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
