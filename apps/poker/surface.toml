format = 2

[[resources]]
kind = "so.tilo.poker.table"
label = "Poker table"
version = 1
fields = [
  { path = "players", type = { map = { named = "Player" } } },
  { path = "hand", type = { named = "Hand" }, stored = "record" },
  { path = "hand.number", type = "int" },
  { path = "hand.street", type = { named = "Street" } },
  { path = "hand.players", type = { list = { named = "InHand" } } },
  { path = "hand.button", type = "int" },
  { path = "hand.deck", type = { list = "int" } },
  { path = "hand.board", type = { list = "int" } },
  { path = "hand.to_act", type = { option = "int" } },
  { path = "hand.current_bet", type = "int" },
  { path = "hand.min_raise", type = "int" },
  { path = "hand.since_ms", type = "int" },
  { path = "hand.awards", type = { list = { named = "Award" } } },
  { path = "button_seat", type = "int" },
]

