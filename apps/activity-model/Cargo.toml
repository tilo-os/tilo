[package]
name = "activity-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The activity.filter record: which changes Activity shows"

# The resource Activity draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "activity_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-actions = { path = "../../crates/collab/actions" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
