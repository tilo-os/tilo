[package]
name = "activity-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The activity.window record: the anchor Activity's windows and offers belong to"

# The resource Activity's windows belong to, as the app reads it. It holds nothing of its own
# and has no window of its own; the app draws its windows.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "activity_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
