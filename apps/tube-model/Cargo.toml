[package]
name = "tube-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Tube's shared library and watch history: the record types, their verbs and typed action arguments"

# Tube's records, as the app that draws them reads them and as the app's verbs change them. It
# has no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action door, never the toolkit.

[lib]
name = "tube_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-actions = { path = "../../crates/collab/actions" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource", features = ["test-support"] }

[lints]
workspace = true
