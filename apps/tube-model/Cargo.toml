[package]
name = "tube-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Tube's shared library and watch history: the record types, their verbs and typed action arguments, and the module the document host runs"

# Tube's records, as the app that draws them reads them and as the document host runs their
# verbs. It has no window and no surface of its own; the app draws it.
#
# It is also the model module the document host runs (docs/architecture/apps.md §1), so it
# depends on the resource layer and the action door, never the toolkit.

[lib]
name = "tube_model"
path = "src/lib.rs"
# A model crate builds both ways: the wasm module the host loads, and the rlib the app links
# to read the same types.
crate-type = ["cdylib", "rlib"]

[features]
# The module the document host runs: its export and the host imports under it. Off, the crate
# is the records' types alone — what an app links.
module = ["dep:tilo-model-guest"]

[dependencies]
serde.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-actions = { path = "../../crates/collab/actions" }
# The module side: the export the host calls and the tree it answers.
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource", features = ["test-support"] }

[lints]
workspace = true
