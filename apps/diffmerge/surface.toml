format = 2

[[resources]]
kind = "diffmerge.session"
label = "Diff & Merge"
version = 1
fields = [
  { path = "comparison", type = { option = { named = "Comparison" } }, readonly = true, stored = "record" },
  { path = "comparison.left_label", type = "text" },
  { path = "comparison.left", type = "text" },
  { path = "comparison.right_label", type = "text" },
  { path = "comparison.right", type = "text" },
  { path = "merge", type = { option = { named = "MergeInputs" } }, readonly = true, stored = "record" },
  { path = "merge.base_label", type = "text" },
  { path = "merge.base", type = "text" },
  { path = "merge.ours_label", type = "text" },
  { path = "merge.ours", type = "text" },
  { path = "merge.theirs_label", type = "text" },
  { path = "merge.theirs", type = "text" },
  { path = "merged", type = "text" },
  { path = "resolutions", type = { map = { named = "HunkChoice" } }, readonly = true },
  { path = "written", type = { map = "text" }, readonly = true },
]

