[package]
name = "diffmerge"
version = "0.1.0"
edition = "2024"

[lib]
name = "diffmerge"
path = "src/lib.rs"

[[bin]]
name = "diffmerge"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
similar = "2.6"
# Host-native file open through the XDG Desktop Portal
# (org.freedesktop.portal.FileChooser). On GNOME the user sees GNOME's file
# chooser; on qOS the compositor's portal backend renders qOS's picker. The
# portal call runs off the UI thread on its own small Tokio runtime and the
# chosen path is delivered back over a channel (see `app::portal`). An app
# never draws its own file picker (HIG §5).
ashpd.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }
url.workspace = true
