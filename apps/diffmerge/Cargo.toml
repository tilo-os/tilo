[package]
name = "diffmerge"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "diffmerge"
path = "src/lib.rs"

[[bin]]
name = "diffmerge"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
fnv.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
similar = "2.6"
# Host-native file open through the XDG Desktop Portal
# (org.freedesktop.portal.FileChooser). On GNOME the user sees GNOME's file
# chooser; on Tilo the compositor's portal backend renders Tilo's picker. The
# portal call runs off the UI thread on its own small Tokio runtime and the
# chosen path is delivered back over a channel from `ui::portal`. An app
# never draws its own file picker (HIG §5).

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
