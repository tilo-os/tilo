[package]
name = "discord-wire"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "What the Discord connector app, its outside worker and the bridge program say to each other"

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The record-facing schema the app needs; the worker leaves it out.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", optional = true }

[features]
resource = ["dep:ui"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
