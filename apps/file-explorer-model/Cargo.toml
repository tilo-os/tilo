[package]
name = "file-explorer-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Files' resources: the recent files each device opened, and the folder a window shows"

# The resources Files keeps in a workspace and an agent reads through the same
# verbs. They have no window and no surface of their own; the app draws them.
#
# It depends on the resource layer and the action API, never the toolkit. The
# files themselves, their watching, copying and painting stay in the app.

[lib]
name = "file_explorer_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
