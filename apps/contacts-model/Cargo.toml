[package]
name = "contacts-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The contacts.book resource: the contacts, their groups and the places those sit in"

# The resource Contacts draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the text normalization, never the toolkit.

[lib]
name = "contacts_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
unicode-normalization = "0.1.25"
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
