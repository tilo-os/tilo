[package]
name = "hex-editor-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Hex Editor model as the WebAssembly module its package carries: the buffer's verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
hex-editor-model = { path = "../hex-editor-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }

[lints]
workspace = true
