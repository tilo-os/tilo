[package]
name = "hex_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "hex_editor"
path = "src/lib.rs"

[[bin]]
name = "hex_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui", features = ["portal"] }
# The qOS ACTION model: every buffer mutation (insert / delete / overwrite of
# bytes) is a replayable action the shell's Ctrl+K palette dispatches, so a
# keystroke and a palette row build the identical action and share one undo
# boundary that Ctrl+Z reverts.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[lints]
workspace = true
