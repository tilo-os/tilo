[package]
name = "print-centre"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "print_centre"
path = "src/lib.rs"

[[bin]]
name = "print-centre"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach the PDF engine through its engine library in the runtime bundle
# (libtilo_pdf_engine.so, crates/engines/loadable/pdf) instead of linking it.
# The release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links tilo-pdf statically, because an
# engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-pdf-engine/thin"]

[dependencies]
# The resource the app draws: the defaults, their check and the choices offered.
print-centre-model = { path = "../print-centre-model" }
tilo-files = { path = "../../crates/platform/tilo-files" }
hex.workspace = true
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
tilo-pdf-engine = { path = "../../crates/engines/loadable/pdf", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
os-actions = { path = "../../crates/system/os-actions" }
tilo-capture = { path = "../../crates/engines/tilo-capture", features = ["scanner"] }
tilo-ocr = { path = "../../crates/engines/ocr" }
tilo-doc-pdf = { path = "../../crates/engines/tilo-doc-pdf" }
tilo-thumbnail = { path = "../../crates/engines/thumbnail" }
# First pages of the PDFs it prints, handed to the thumbnailer.
tilo-pdf = { path = "../../crates/engines/tilo-pdf" }
taffy.workspace = true
vello.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Tests build their image fixtures.
image.workspace = true
tempfile.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
