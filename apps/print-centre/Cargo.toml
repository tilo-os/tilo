[package]
name = "print-centre"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "print_centre"
path = "src/lib.rs"

[[bin]]
name = "print-centre"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "qos-app", path = "../../crates/app/qos-app", features = ["portal"] }
qos-actions = { path = "../../crates/collab/actions" }
os-actions = { path = "../../crates/system/os-actions" }
qos-ocr = { path = "../../crates/media/ocr" }
qdoc-pdf = { path = "../../crates/doc/qdoc-pdf" }
image.workspace = true
thumbnail = { path = "../../crates/thumbnail", features = ["pdf"] }
automerge.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
