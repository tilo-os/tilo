[package]
name = "print-centre"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "print_centre"
path = "src/lib.rs"

[[bin]]
name = "print-centre"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
private-fs = { path = "../../crates/system/private-fs" }
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
os-actions = { path = "../../crates/system/os-actions" }
tilo-ocr = { path = "../../crates/media/ocr" }
tilo-doc-pdf = { path = "../../crates/doc/tilo-doc-pdf" }
image.workspace = true
tilo-thumbnail = { path = "../../crates/media/thumbnail", features = ["pdf"] }
automerge.workspace = true
serde_json.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
