[package]
name = "db_client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "db_client"
path = "src/lib.rs"

[[bin]]
name = "db_client"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { path = "../../ui" }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
rusqlite = { version = "0.37.0", features = ["bundled"] }
# Real network drivers. Both are synchronous, matching the sync `rusqlite`
# path so the whole engine layer stays blocking (the `postgres` crate wraps
# `tokio-postgres` behind a private runtime; `mysql` is natively sync). TLS
# is left off here (localhost / trusted-network connections) to keep the
# dependency surface — and compile time — small; a future grant-gated build
# can enable `rustls-tls` on both.
postgres = "0.19"
mysql = { version = "25", default-features = false, features = ["minimal"] }

[lints]
workspace = true
