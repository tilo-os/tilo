[package]
name = "logs"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "logs"
path = "src/lib.rs"

[[bin]]
name = "logs"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
test-support = ["ui/test-support"]

[dependencies]
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The resource the app draws: its type, verb and typed action arguments.
logs-model = { path = "../logs-model" }
tilo-actions = { path = "../../crates/core/actions" }
bounded-command = { package = "tilo-bounded-command", path = "../../crates/platform/bounded-command" }
serde_json.workspace = true
serde.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
blake3.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
