[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar"
path = "src/main.rs"

# Live CalDAV sync refreshes its credentials through account-credentials's
# credential store (vault, daemon handoff, blocking refresh), which is native-only:
# the page's calendar keeps its events in the browser without it.
[package.metadata.tilo]
web-features = []

[dependencies]
fnv.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-timezone-engine = { path = "../../crates/runtime/engines/timezone", optional = true }
# The CalDAV client and the account credentials its sign-in reaches.
tilo-accounts-engine = { path = "../../crates/runtime/engines/accounts", optional = true }
tilo-contact-directory-engine = { path = "../../crates/runtime/engines/contact-directory", optional = true }
# Read-only address-book hints, offered as attendees; choosing one confirms no
# identity and sends nothing.
tilo-contact-directory = { path = "../../crates/integrations/tilo-contact-directory" }
hex.workspace = true
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
tilo-files = { path = "../../crates/platform/tilo-files" }
# Event and task dates and times are model values.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The records and verbs the app draws: its events, tasks, projects and the
# notes beside them, shared with the agent that works them and with a server
# that syncs their calendars. `store` keeps the CalDAV accounts and the
# secrets that sign them in; `live` reaches a calendar server.
calendar-model = { path = "../calendar-model", features = ["store"] }
# Shared multi-account store and encrypted secret vault. Settings owns writes;
# credentials are sealed in the vault rather than the plaintext store.
accounts = { path = "../../crates/integrations/accounts", features = ["person"] }
# Tilo action model for serializable, replayable document mutations.
tilo-actions = { path = "../../crates/collab/actions" }
# Notes are rich text, edited in the SDK rich-text editor.
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
jiff.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Multistatus parsing and REPORT bodies are always built; the async HTTP
# client behind live CalDAV sync (REPORT and ETag-guarded PUT/DELETE) is guarded
# by `live`, so the headless build stays off the network stack.
tilo-dav = { path = "../../crates/integrations/tilo-dav", default-features = false }

[features]
thin = ["dep:runtime-dylib"]
# Reach the time-zone database, the CalDAV client (with the account
# credentials its sign-in reaches) and the contact directory through their
# engine libraries in the runtime bundle (libtilo_timezone_engine.so,
# libtilo_accounts_engine.so and libtilo_contact_directory_engine.so, under
# crates/runtime/engines/) instead of the runtime. The release collection
# enables it (dist/apps/app-collections.toml); a `thin` build without it
# (`tilo-app dev`) links their crates statically, because an engine library
# links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = [
    "thin",
    "tilo-timezone-engine/thin",
    "tilo-accounts-engine/thin",
    "tilo-contact-directory-engine/thin",
    "calendar-model/runtime-engine",
]
# The CalDAV transport runs on the app runtime and is a no-op without a
# configured account.
default = ["live"]
live = ["tilo-dav/oauth", "calendar-model/live"]

[dev-dependencies]
account-credentials = { path = "../../crates/integrations/account-credentials" }
tilo-dav = { path = "../../crates/integrations/tilo-dav", default-features = false, features = ["test-support"] }
# Reads the signed manifest's offers to check them against what the app publishes.
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
# Mail's signed surface: the action Calendar hands an invitation to, and what it takes.
app-fleet = { path = "../../crates/packaging/app-fleet", features = ["surfaces"] }
toml.workspace = true
test-http = { path = "../../tools/test-http" }
# `scenario!`: one test function holds the cases of one subject.
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
