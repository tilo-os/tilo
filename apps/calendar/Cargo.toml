[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar"
path = "src/main.rs"

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Shared multi-account store and encrypted secret vault. Settings owns writes;
# credentials are sealed in the vault rather than the plaintext store.
accounts = { path = "../../crates/system/accounts" }
# Tilo action model for serializable, replayable document mutations.
tilo-actions = { path = "../../crates/collab/actions" }
chrono = { workspace = true, features = ["std", "clock"] }
# RFC 5545 TZID values are IANA names.  Keep the transition database in the
# app so imported wall times resolve identically on every peer, including DST
# gaps/folds, rather than depending on the host's current `/usr/share/zoneinfo`.
chrono-tz = "0.10.4"
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
url.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Live CalDAV sync (discovery, REPORT, and ETag-guarded PUT) is optional and
# gated by `live`; the default build uses the offline path.
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"

[features]
thin = ["dep:runtime-dylib"]
# The CalDAV transport runs on a background thread and is a no-op without a
# configured account.
default = ["live"]
live = ["dep:reqwest"]

[dev-dependencies]
# Serialises the handful of tests that set the process-wide
# `TILO_CALENDAR_IMPORT_DIR` env var (export/import go through `transfer_dir`),
# so they never race each other under cargo's default parallel runner.
serial_test.workspace = true
mail = { path = "../mail" }

[lints]
workspace = true
