[package]
name = "messages"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
thin = ["dep:runtime-dylib"]
# Reach the contact directory through its engine library in the runtime
# bundle (libtilo_contact_directory_engine.so,
# crates/runtime/engines/contact-directory) instead of the runtime. The
# release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links tilo-contact-directory statically,
# because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-contact-directory-engine/thin"]

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-contact-directory = { path = "../../crates/platform/tilo-contact-directory" }
tilo-messaging = { path = "../../crates/platform/tilo-messaging" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-contact-directory-engine = { path = "../../crates/runtime/engines/contact-directory", optional = true }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
