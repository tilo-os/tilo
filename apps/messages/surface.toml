[[resources]]
kind = "tilo.contacts.identities"
label = "Contact identities"
version = 1
person = true
fields = [
  { path = "people", type = "Collection<Person>", stored = "collection" },
  { path = "people.*.label", type = "String" },
  { path = "people.*.removed", type = "bool" },
  { path = "people.*.phones", type = "Json<Vec<String>>" },
  { path = "people.*.emails", type = "Json<Vec<String>>" },
  { path = "people.*.endpoints", type = "Collection<Endpoint>", stored = "collection" },
  { path = "people.*.endpoints.*.service", type = "String" },
  { path = "people.*.endpoints.*.recipient", type = "String" },
  { path = "people.*.endpoints.*.scope", type = "String" },
  { path = "people.*.endpoints.*.revision", type = "String" },
  { path = "people.*.endpoints.*.removed", type = "bool" },
]

