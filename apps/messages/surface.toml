# Written by `tilolang surface`; review changes like an API change.

format = 2

reads = ["tilo.accounts", "tilo.contacts.identities"]

[[resources]]
kind = "tilo.messages"
label = "Messages"
version = 1
shows = ["back", "cancel-link", "close-groups", "list-account-states", "list-people", "list-routes", "open-account-setup", "open-conversation", "open-person", "reset-first-enrollment", "select-route", "select-setup-account"]
fields = [
  { path = "conversations", type = { collection = { named = "Conversation" } }, readonly = true, stored = "collection" },
  { path = "conversations.*.with", type = "text" },
  { path = "conversations.*.messages", type = { collection = { named = "Message" } }, stored = "collection" },
  { path = "conversations.*.messages.*.from", type = "text" },
  { path = "conversations.*.messages.*.to", type = "text" },
  { path = "conversations.*.messages.*.body", type = "text" },
  { path = "conversations.*.messages.*.date", type = "text" },
  { path = "conversations.*.messages.*.at_ms", type = "int" },
  { path = "conversations.*.messages.*.outgoing", type = "bool" },
  { path = "conversations.*.messages.*.queued", type = "bool" },
]

[[resources.verbs]]
id = "deliver-message"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "from", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "to", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "date", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "conversation", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "send-message"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "to", type = "text", required = true, schema = { type = "string" } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "conversation", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "reply"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "conversation", type = "text", required = true, schema = { type = "string" } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

[[resources.verbs]]
id = "list-groups"
kind = "read"
params = [
  { name = "service", type = "text", required = true, schema = { type = "string" } },
  { name = "account", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "read-group-membership"
kind = "read"
params = [
  { name = "service", type = "text", required = true, schema = { type = "string" } },
  { name = "account", type = "text", required = true, schema = { type = "string" } },
  { name = "group", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "read-group-history"
kind = "read"
params = [
  { name = "service", type = "text", required = true, schema = { type = "string" } },
  { name = "account", type = "text", required = true, schema = { type = "string" } },
  { name = "group", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "read-history"
kind = "read"
params = [
  { name = "choice", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "read-older-history"
kind = "read"
params = [
  { name = "choice", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "search-messages"
kind = "read"
params = [
  { name = "query", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "export-content"
kind = "read"
params = [
  { name = "format", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "conversation", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.types]]
name = "Conversation"
fields = [
  { name = "with", type = "text" },
  { name = "messages", type = { collection = { named = "Message" } } },
]

[[resources.types]]
name = "Message"
fields = [
  { name = "from", type = "text" },
  { name = "to", type = "text" },
  { name = "body", type = "text" },
  { name = "date", type = "text" },
  { name = "at_ms", type = "int" },
  { name = "outgoing", type = "bool" },
  { name = "queued", type = "bool" },
]

