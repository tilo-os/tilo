# Written by `tilo-app surface`; review changes like an API change.

[[resources]]
kind = "tilo.messages"
label = "Messages"
version = 1
fields = [
  { path = "conversations", type = { collection = { named = "Conversation" } }, readonly = true, stored = "collection" },
  { path = "conversations.*.with", type = "text" },
  { path = "conversations.*.messages", type = { collection = { named = "Message" } }, stored = "collection" },
  { path = "conversations.*.messages.*.from", type = "text" },
  { path = "conversations.*.messages.*.to", type = "text" },
  { path = "conversations.*.messages.*.body", type = "text" },
  { path = "conversations.*.messages.*.date", type = "text" },
  { path = "conversations.*.messages.*.at_ms", type = "int" },
  { path = "conversations.*.messages.*.outgoing", type = "bool" },
  { path = "conversations.*.messages.*.queued", type = "bool" },
]

[[resources.verbs]]
id = "deliver-message"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "from", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "to", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "date", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "conversation", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "send-message"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "to", type = "text", required = true, schema = { type = "string" } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "conversation", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "reply"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "conversation", type = "text", required = true, schema = { type = "string" } },
  { name = "body", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

