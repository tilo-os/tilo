format = 2

[[resources]]
kind = "chip_design.project"
label = "Chip Design"
version = 1
fields = [
  { path = "reports", type = { map = "text" }, readonly = true },
  { path = "verifications", type = { map = "text" }, readonly = true },
  { path = "nodes", type = { collection = { named = "OperatorNode" } }, stored = "keyed" },
  { path = "nodes.*.id", type = "text", readonly = true },
  { path = "nodes.*.kind", type = { named = "OperatorKind" }, readonly = true },
  { path = "nodes.*.shape", type = { list = "int" }, readonly = true },
  { path = "nodes.*.normalization_width", type = "int", readonly = true },
  { path = "nodes.*.output_width", type = { option = "int" } },
  { path = "nodes.*.x", type = "int" },
  { path = "nodes.*.y", type = "int" },
  { path = "connections", type = { set = { named = "Connection" } }, readonly = true },
]

[[resources.verbs]]
id = "import-report"
kind = "undoable"
params = [
  { name = "json", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "remove-report"
kind = "undoable"
params = [
  { name = "report", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "import-verification"
kind = "undoable"
params = [
  { name = "json", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "remove-verification"
kind = "undoable"
params = [
  { name = "report", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "add-node"
kind = "undoable"
params = [
  { name = "node", type = "text", required = true, schema = { type = "string" } },
  { name = "kind", type = { named = "OperatorKind" }, required = true, schema = { type = "string", enum = ["input", "gate_input", "norm_weight_input", "rms_norm", "apply_norm_weight", "silu", "multiply", "projection_input", "matrix_weight_input", "linear_projection", "add"] } },
  { name = "shape", type = { list = "int" }, required = true, schema = { type = "array", items = { type = "integer", maximum = 65535, minimum = 0 } } },
  { name = "output_width", type = { option = "int" }, required = false, schema = { type = ["integer", "null"], maximum = 4294967295, minimum = 0 } },
  { name = "x", type = "int", required = true, schema = { type = "integer", maximum = 65535, minimum = 0 } },
  { name = "y", type = "int", required = true, schema = { type = "integer", maximum = 65535, minimum = 0 } },
]

[[resources.verbs]]
id = "set-shape"
kind = "undoable"
params = [
  { name = "node", type = "text", required = true, schema = { type = "string" } },
  { name = "shape", type = { list = "int" }, required = true, schema = { type = "array", items = { type = "integer", maximum = 65535, minimum = 0 } } },
]

[[resources.verbs]]
id = "remove-node"
kind = "undoable"
params = [
  { name = "node", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "connect"
kind = "undoable"
params = [
  { name = "from_node", type = "text", required = true, schema = { type = "string" } },
  { name = "from_port", type = "text", required = true, schema = { type = "string" } },
  { name = "to_node", type = "text", required = true, schema = { type = "string" } },
  { name = "to_port", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "disconnect"
kind = "undoable"
params = [
  { name = "node", type = "text", required = true, schema = { type = "string" } },
  { name = "port", type = "text", required = true, schema = { type = "string" } },
]

[[resources.types]]
name = "Connection"
fields = [
  { name = "from_node", type = "text" },
  { name = "from_port", type = "text" },
  { name = "to_node", type = "text" },
  { name = "to_port", type = "text" },
]

