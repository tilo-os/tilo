  { name = "projection_input" },
  { name = "matrix_weight_input" },
  { name = "linear_projection" },
  { name = "add" },
]

[[resources.types]]
name = "OperatorNode"
fields = [
  { name = "id", type = "text" },
  { name = "kind", type = { named = "OperatorKind" } },
  { name = "shape", type = { list = "int" } },
  { name = "normalization_width", type = "int" },
  { name = "output_width", type = { option = "int" } },
