[package]
name = "logs-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Logs' resource: the journal filter a workspace shares, with the verb that clears it"

# The resource Logs keeps and an agent reads through the same verbs. It has no
# window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# journal itself is the device's own and stays in the app.

[lib]
name = "logs_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
