[package]
autotests = false
name = "pdf-viewer"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "pdf_viewer"
path = "src/lib.rs"

[[bin]]
name = "pdf-viewer"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach the PDF engine through its engine library in the runtime bundle
# (libtilo_pdf_engine.so, crates/runtime/engines/pdf) instead of linking it.
# The release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links tilo-pdf statically, because an
# engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-pdf-engine/thin"]

[dependencies]
fnv.workspace = true
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-pdf-engine = { path = "../../crates/runtime/engines/pdf", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
tilo-automerge.workspace = true
tilo-paths = { path = "../../crates/platform/tilo-paths" }
# The Tilo ACTION model: the reader's `actions` module exports its markup-store
# operations as replayable actions the host's Ctrl+K palette dispatches.
tilo-actions = { path = "../../crates/collab/actions" }
# Comment and reply text is rich text, written in the SDK editor.
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
tilo-content = { path = "../../crates/system/content" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Rendering, text layer, forms and export through Tilo's sandboxed PDF engine.
tilo-pdf = { path = "../../crates/platform/tilo-pdf" }
# The page pipeline every page viewer draws through: render queue, bitmap
# cache, tiles.
tilo-page-raster = { path = "../../crates/sdk/tilo-page-raster" }
image = { workspace = true, features = ["png", "jpeg"] }
tempfile.workspace = true
# Documents the user opens and saves.
tilo-files = { path = "../../crates/platform/tilo-files" }
# Host-native file open/save through the XDG Desktop Portal; calls run off the
# UI thread and return through `ui::portal`.

[dev-dependencies]
# Serialise tests that touch the shared system clipboard.
serial_test.workspace = true
# Two distinct files for the multi-document test.
tempfile.workspace = true
# The zoom test looks at every frame's pixels as the CPU renderer draws them.
tilo-cpu-raster = { path = "../../crates/sdk/tilo-cpu-raster" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
# A reader hosted in a desktop window, as the browser desktop hosts it.
tilo-desktop-model = { path = "../../crates/session/desktop-model" }
tilo-desktop-surface = { path = "../../crates/session/desktop-surface" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
