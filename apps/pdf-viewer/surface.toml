[[resources.verbs.params]]
name = "name"
required = true

[resources.verbs.params.schema]
description = "The file's name"
type = "string"

[[resources.verbs]]
description = "Take over the PDF's own markup.  The highlights, notes and their replies, free text, ink and form values the source bytes already carry become records like any other, once per source. Their ids derive from the source, so two people taking it over at once agree."
