[[resources.verbs]]
description = "Make the page plan.  The pages of the opened file, in their order, the first time a record meets it. Page ids are deterministic, so two people opening the same file agree."
id = "start-page-plan"
kind = "undoable"
label = "Make the page plan"

[[resources.verbs.params]]
name = "pages"
required = true

[resources.verbs.params.schema]
description = "How many pages the PDF has"
minimum = 0
type = "integer"

[[resources.verbs]]
description = "Pin the source.  Names the PDF bytes the markup is made against by their content. The first pin of a record wins: it never re-targets its markup."
id = "pin-source"
kind = "undoable"
label = "Pin the source"

[[resources.verbs.params]]
name = "hash"
required = true

[resources.verbs.params.schema]
