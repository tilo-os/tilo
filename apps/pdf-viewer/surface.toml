# The app's public surface, written by `tilo-app surface`: its resources' verbs
# and stored fields. Review changes to it like an API change; `tilo-app check`
# fails when the code and this file disagree.

[[resources]]
kind = "pdf.document"
label = "PDF"
version = 1

[[resources.fields]]
owner = "pdf-markup"
path = "source"
readonly = true
stored = "value"
title = "The PDF bytes the markup is made against. The first pin wins: a"
type = "Bytes"

[[resources.fields]]
owner = "pdf-markup"
path = "source_name"
readonly = true
stored = "value"
