[package]
name = "passwords"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "passwords"
path = "src/lib.rs"

[[bin]]
name = "passwords"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
accounts = { path = "../../crates/system/accounts" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
zeroize.workspace = true
automerge.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
atomic-file = { path = "../../crates/system/atomic-file" }

[lints]
workspace = true
