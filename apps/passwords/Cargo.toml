[package]
name = "passwords"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "passwords"
path = "src/lib.rs"

[[bin]]
name = "passwords"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
accounts = { path = "../../crates/system/accounts" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
zeroize.workspace = true
taffy.workspace = true
vello.workspace = true
winit.workspace = true
serde_json.workspace = true
tilo-seal = { path = "../../crates/system/tilo-seal" }
tilo-files = { path = "../../crates/platform/tilo-files" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# Tests open the vault in a private profile, never the person's.
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
