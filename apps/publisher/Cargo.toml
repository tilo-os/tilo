[package]
name = "publisher"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "publisher"
path = "src/lib.rs"

[[bin]]
name = "publisher"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The resource the app draws: its type, its check and its registry default.
publisher-model = { path = "../publisher-model" }
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
app-registry = { package = "tilo-app-registry", path = "../../crates/core/app-registry" }
registry-types = { package = "tilo-registry-types", path = "../../crates/core/registry-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
hex.workspace = true
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../tools/test-env" }
# The reach test walks every published action (framework::testing).
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# The headless test host the tests open the app in, as a person's device hosts it.
tilo-app-test-host = { path = "../../crates/sdk/tilo-app-test-host" }

[lints]
workspace = true
