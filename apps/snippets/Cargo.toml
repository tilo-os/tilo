[package]
name = "snippets"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "snippets"
path = "src/lib.rs"

[[bin]]
name = "snippets"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo ACTION model: Snippets' `actions` module exports every library
# mutation as a replayable action the host's Ctrl+K palette dispatches, so a
# toolbar button and a palette row build the identical action and share one
# undo boundary.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
