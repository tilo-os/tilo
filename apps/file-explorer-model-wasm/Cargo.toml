[package]
name = "file-explorer-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Files model as the WebAssembly module its package carries: the recent list's verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
file-explorer-model = { path = "../file-explorer-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
