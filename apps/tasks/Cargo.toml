[package]
name = "tasks"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Issue tracker of a workspace: nested issues on a list and a board, worked by people and agents"

[lib]
name = "tasks"
path = "src/lib.rs"

[[bin]]
name = "tasks"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The sample tracker and the screenshot scenarios that show it: development
# runs, captures and tests only, never a release.
samples = []

[dependencies]
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
serde_json.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
# When a migrated issue and its comments were written where they came from (RFC 3339).
jiff.workspace = true
tracing.workspace = true
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The resource the app draws: its types, verbs and typed action arguments,
# shared with the agent that works its issues.
tasks-model = { path = "../tasks-model" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `tasks` claims `--features tasks/thin` in the
# collection build, and the app then links the whole runtime statically.
tasks-samples = { package = "tasks", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { version = "0.1.0", path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
