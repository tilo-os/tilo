[package]
name = "tasks"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Issue tracker of a workspace: nested issues on a list and a board, handed to agents"

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["tasks-samples"]

[lib]
name = "tasks"
path = "src/lib.rs"

[[bin]]
name = "tasks"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# The sample tracker and the screenshot scenarios that show it: development
# runs, captures and tests only, never a release.
samples = []

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
serde.workspace = true
serde_json.workspace = true
tilo-agent-models = { path = "../../crates/platform/tilo-agent-models" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The record the app draws: its types, verbs and typed action arguments,
# shared with the agent that works its issues.
tasks-model = { path = "../tasks-model" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `tasks` claims `--features tasks/thin` in the
# collection build, and the app then links the whole runtime statically.
tasks-samples = { package = "tasks", path = ".", features = ["samples"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { version = "0.1.0", path = "../../crates/dev/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
