  { name = "body", required = false, schema = { type = ["string", "null"] } },
  { name = "agent", required = true, schema = { type = "string" } },
  { name = "model", required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { model = { type = "string" }, profile = { type = "string" } }, required = ["profile", "model"] } },
