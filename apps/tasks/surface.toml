[[resources]]
kind = "tasks.tracker"
label = "Tasks"
version = 1
fields = [
  { path = "issues", type = "Collection<Issue>", stored = "collection", unit = true },
  { path = "issues.*.number", type = "u64", readonly = true },
  { path = "issues.*.title", type = "String", label = true },
  { path = "issues.*.body", type = "RichText", ops = "sha256:b86bfc65e3faa1c9" },
  { path = "issues.*.status", type = "Status" },
  { path = "issues.*.assignee", type = "Option<Atom>", readonly = true },
  { path = "issues.*.model", type = "Option<ModelChoice>", readonly = true, stored = "record" },
  { path = "issues.*.model.profile", type = "String" },
  { path = "issues.*.model.model", type = "String" },
  { path = "issues.*.subject", type = "Option<serde_json::Value>", readonly = true },
  { path = "issues.*.labels", type = "Set<String>" },
  { path = "issues.*.parent", type = "Option<Id>", readonly = true },
  { path = "issues.*.links", type = "Collection<Link>", stored = "collection" },
  { path = "issues.*.links.*.label", type = "String", label = true },
  { path = "issues.*.links.*.app", type = "String" },
  { path = "issues.*.links.*.kind", type = "String" },
  { path = "issues.*.links.*.resource", type = "String" },
  { path = "issues.*.links.*.record", type = "Option<String>" },
  { path = "issues.*.comments", type = "Collection<Message>", readonly = true, stored = "collection" },
  { path = "issues.*.comments.*.author", type = "String", readonly = true },
  { path = "issues.*.comments.*.by_agent", type = "bool", readonly = true },
  { path = "issues.*.comments.*.at_ms", type = "i64", readonly = true },
  { path = "issues.*.comments.*.text", type = "String", readonly = true },
  { path = "issues.*.comments.*.kind", type = "MessageKind", readonly = true },
  { path = "issues.*.comments.*.run", type = "u64", readonly = true },
  { path = "issues.*.comments.*.incorporated", type = "bool", readonly = true },
  { path = "issues.*.author", type = "String", readonly = true },
  { path = "issues.*.created_ms", type = "i64", readonly = true },
  { path = "issues.*.budget", type = "Option<Budget>", readonly = true, stored = "record" },
  { path = "issues.*.budget.turn_ms", type = "u64" },
  { path = "issues.*.budget.total_ms", type = "u64" },
  { path = "issues.*.run", type = "Option<Run>", readonly = true, stored = "record" },
  { path = "issues.*.run.epoch", type = "u64" },
  { path = "issues.*.run.agent", type = "Atom" },
  { path = "issues.*.run.starter", type = "String" },
  { path = "issues.*.run.phase", type = "RunPhase" },
  { path = "issues.*.run.model", type = "Option<ModelChoice>", stored = "record" },
  { path = "issues.*.run.model.profile", type = "String" },
  { path = "issues.*.run.model.model", type = "String" },
  { path = "issues.*.run.started_ms", type = "i64" },
  { path = "issues.*.run.updated_ms", type = "i64" },
  { path = "issues.*.run.confirmation", type = "Option<Confirmation>", stored = "record" },
  { path = "issues.*.run.confirmation.id", type = "String" },
  { path = "issues.*.run.confirmation.app", type = "String" },
  { path = "issues.*.run.confirmation.action", type = "String" },
  { path = "issues.*.run.confirmation.resource", type = "String" },
  { path = "issues.*.run.confirmation.arguments_digest", type = "String" },
  { path = "issues.*.run.confirmation.draft", type = "serde_json::Value" },
  { path = "issues.*.run.confirmation.state", type = "ConfirmationState" },
  { path = "issues.*.run.confirmation.edits", type = "serde_json::Value" },
  { path = "issues.*.run.confirmation.reason", type = "String" },
  { path = "issues.*.run.confirmation.answered_by", type = "String" },
  { path = "numbers", type = "Counter", readonly = true },
  { path = "imported", type = "Set<String>", readonly = true },
]

[[resources.verbs]]
id = "create"
kind = "undoable"
writes = ["record", "issues.*"]
params = [
  { name = "title", required = true, schema = { type = "string" } },
  { name = "parent", required = false, schema = { type = ["string", "null"] } },
  { name = "body", required = false, schema = { type = ["string", "null"] } },
  { name = "status", required = false, schema = { oneOf = [{ type = "null" }, { oneOf = [{ type = "string", const = "backlog" }, { type = "string", const = "todo" }, { type = "string", const = "in-progress" }, { type = "string", const = "in-review" }, { type = "string", const = "done" }, { type = "string", const = "cancelled" }] }] } },
  { name = "assignee", required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "move-under"
kind = "undoable"
writes = ["record", "issues.*"]
params = [
  { name = "issue", required = true, schema = { type = "string" } },
  { name = "parent", required = false, schema = { type = ["string", "null"] } },
]

