  { name = "question", required = true, schema = { type = "object", additionalProperties = false, properties = { action = { type = "string" }, app = { type = "string" }, arguments_digest = { type = "string" }, draft = {}, id = { type = "string" }, resource = { type = "string" } }, required = ["id", "app", "action", "resource", "arguments_digest", "draft"] } },
]

