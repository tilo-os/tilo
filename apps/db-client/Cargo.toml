[package]
name = "db-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "db_client"
path = "src/lib.rs"

[[bin]]
name = "db-client"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
rusqlite = { version = "0.37.0", features = ["bundled", "hooks"] }
# Network drivers. Both are synchronous, matching the sync `rusqlite`
# path so the whole engine layer stays blocking (the `postgres` crate wraps
# `tokio-postgres` behind a private runtime; `mysql` is natively sync). TLS
# is left off here (localhost / trusted-network connections) to keep the
# dependency surface and compile time small.
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono.workspace = true
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
tempfile.workspace = true

[lints]
workspace = true
