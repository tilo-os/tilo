[package]
name = "git-client-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Git client's resource: the repository a client opens and what members see of it, with the verb that keeps it"

# The resource the app draws and an agent reads through the same verb. It has
# no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# repository is read with `git2` in the app, on the device that has it.

[lib]
name = "git_client_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
