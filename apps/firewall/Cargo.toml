[package]
name = "firewall"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["firewall-samples"]

[lib]
name = "firewall"
path = "src/lib.rs"

[[bin]]
name = "firewall"
path = "src/main.rs"

[features]
# The sample ruleset the screenshot scenarios show: development runs, captures
# and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: every document-mutating operation is a serializable,
# replayable action dispatched through one executor, so undo, multi-peer replay
# and the Ctrl+K command palette all work from a single implementation.
tilo-actions = { path = "../../crates/collab/actions" }
bounded-command = { path = "../../crates/system/bounded-command" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `firewall` claims `--features firewall/thin` in the
# collection build, and the app then links the whole runtime statically.
firewall-samples = { package = "firewall", path = ".", features = ["samples"] }
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
