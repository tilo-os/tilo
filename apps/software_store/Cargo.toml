autotests = false
name = "software_store"
version = "0.1.0"
edition = "2024"

[lib]
name = "software_store"
path = "src/lib.rs"

[[bin]]
name = "software_store"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
