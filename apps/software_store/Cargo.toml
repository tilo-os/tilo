[package]
name = "software_store"
version = "0.1.0"
edition = "2024"

[lib]
name = "software_store"
path = "src/lib.rs"

[[bin]]
name = "software_store"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Synthesising the offline demo icons/screenshots and re-encoding fetched
# bitmaps drives the exact same fetch → decode → paint image path as the live
# Flathub icons/screenshots (no permanent placeholder stand-in).
image = { workspace = true, features = ["png", "jpeg", "webp"] }
