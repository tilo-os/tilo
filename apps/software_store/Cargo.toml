serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
