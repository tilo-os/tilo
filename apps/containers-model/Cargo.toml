[package]
name = "containers-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The containers.engine resource: the new-container draft, and the values the window reads"

# The resource Containers draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer, never the toolkit.

[lib]
name = "containers_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[dev-dependencies]
tilo-test-env = { version = "0.1.0", path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
