[package]
name = "hex-editor-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Hex Editor's resource: a file's bytes in the document, with the verbs that load and edit them"

# The resource Hex Editor keeps and an agent reads through the same verbs. It
# has no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "hex_editor_model"
path = "src/lib.rs"

[dependencies]
automerge.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-actions = { path = "../../crates/collab/actions" }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[dev-dependencies]
# The scenarios the model tests are folded into.
tilo-test-env = { path = "../../tools/test-env" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
