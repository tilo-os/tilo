[package]
name = "clocks-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The clocks.collection and clocks.on-devices resources: what a person keeps in Clocks and what each device rang"

# The resources Clocks draws, as the app reads them and changes them. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer, never the toolkit. When a clock rings is computed by the
# app, which passes the wall time in.

[lib]
name = "clocks_model"
path = "src/lib.rs"

[dependencies]
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-recurrence = { path = "../../crates/engines/tilo-recurrence" }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
