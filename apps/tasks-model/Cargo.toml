[package]
name = "tasks-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The tasks.tracker record: a workspace's issues, their projects and areas, and an agent's runs on them"

# The record Tasks keeps and the agent runner reads: the same types, verbs and typed action
# arguments on both sides, so a call the agent builds and the action that applies it cannot
# drift. It has no window and no surface of its own; the app draws it.
#
# It is also the model module the document host runs (docs/architecture/apps.md §1), so it
# depends on the resource layer and the action door, never the toolkit.

[lib]
name = "tasks_model"
path = "src/lib.rs"
# A model crate builds both ways: the wasm module the host loads, and the rlib the app and the
# host's tests link to read the same types.
crate-type = ["cdylib", "rlib"]

[features]
# The module the document host runs: its export and the host imports under it. Off, the crate
# is the record's types alone — what an app links. A wasm app built with it would import the
# `tilo_model` module a browser has nothing to resolve, so only the module's own build turns
# it on.
module = ["dep:tilo-model-guest"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The rich text an issue's body is: the document model's own type, not the editor the toolkit
# draws it with, so a model crate builds without the toolkit.
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-reference = { path = "../../crates/collab/reference" }
# The module side: the export the host calls and the tree it answers.
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest", optional = true }

# The workspace-hack's native feature set does not build for wasm32, and the
# browser builds the desktop, and so this model, for it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource", features = ["test-support"] }

[lints]
workspace = true
