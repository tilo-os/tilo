[package]
name = "slides"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "slides"
path = "src/lib.rs"

[[bin]]
name = "slides"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "qos-app", path = "../../crates/app/qos-app", features = ["portal"] }
# The qOS action model: doc-mutating operations are replayable, undoable actions.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
qdoc = { path = "../../crates/doc/qdoc" }
vello.workspace = true
# The image picker accepts these four raster formats.  Keeping the list
# explicit matters for the one-Cargo-graph qpkg build: `default-features`
# would enable every codec for every app that shares `image`, including Files;
# the workspace lockfile therefore intentionally excludes those codec crates.
image = { workspace = true, default-features = false, features = ["jpeg", "png", "gif", "webp"] }
winit.workspace = true
taffy.workspace = true
# LibreOffice .odp read/write: an ODF package is a ZIP of XML parts. Versions
# match the `qdoc` document codecs so the workspace resolves one copy of each.
zip.workspace = true
quick-xml.workspace = true
# Host-native image open through the XDG Desktop Portal
# (org.freedesktop.portal.FileChooser). On GNOME the user sees GNOME's file
# chooser; on qOS the compositor's portal backend renders qOS's picker. The
# portal call runs off the UI thread on its own small Tokio runtime and the
# chosen path is delivered back over a shared `ui::portal` channel.

[lints]
workspace = true
