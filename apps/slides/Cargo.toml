[package]
name = "slides"
version = "0.1.0"
edition = "2024"

[lib]
name = "slides"
path = "src/lib.rs"

[[bin]]
name = "slides"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui", features = ["portal"] }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
image = "0.25"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# LibreOffice .odp read/write: an ODF package is a ZIP of XML parts. Versions
# match the `qdoc` document codecs so the workspace resolves one copy of each.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
