[package]
name = "slides"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "slides"
path = "src/lib.rs"

[[bin]]
name = "slides"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo action model: doc-mutating operations are replayable, undoable actions.
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tilo-content = { path = "../../crates/system/content" }
# Text boxes are qdoc rich text, edited and drawn by the SDK editor.
tilo-doc = { path = "../../crates/doc/tilo-doc" }
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
tracing.workspace = true
# The XML entity helpers shared with the office document codecs.
tilo-doc-codecs = { path = "../../crates/doc/tilo-doc-codecs", default-features = false, features = ["office"] }
# Zip-bomb and XXE bounds for imported .odp/.pptx packages.
bounded-zip = { path = "../../crates/doc/bounded-zip" }
vello.workspace = true
# The image picker accepts these four raster formats.  Keeping the list
# explicit matters for the one-Cargo-graph tapp build: `default-features`
# would enable every codec for every app that shares `image`, including Files;
# the workspace lockfile therefore intentionally excludes those codec crates.
image = { workspace = true, default-features = false, features = ["jpeg", "png", "gif", "webp"] }
winit.workspace = true
taffy.workspace = true
# LibreOffice .odp read/write: an ODF package is a ZIP of XML parts. Versions
# match the `tilo-doc-codecs` document codecs so the workspace resolves one copy of each.
zip.workspace = true
quick-xml.workspace = true
# Host-native image open through the XDG Desktop Portal
# (org.freedesktop.portal.FileChooser). On GNOME the user sees GNOME's file
# chooser; on Tilo the compositor's portal backend renders Tilo's picker. The
# portal call runs off the UI thread on its own small Tokio runtime and the
# chosen path is delivered back over a shared `ui::portal` channel.

[lints]
workspace = true

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
