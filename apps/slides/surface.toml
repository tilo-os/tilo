description = "Replace deck  Replace the whole deck — its title, theme and every slide — with another: a presentation file opened into it."
id = "replace-deck"
kind = "undoable"
label = "Replace deck"

[[resources.verbs.params]]
name = "title"
required = true

[resources.verbs.params.schema]
description = "Title"
type = "string"

[[resources.verbs.params]]
name = "palette"
required = true

[resources.verbs.params.schema]
description = "Theme"
enum = [
    "indigo",
    "emerald",
    "amber",
    "rose",
    "sky",
]
type = "string"

[[resources.verbs.params]]
name = "slides"
required = true

[resources.verbs.params.schema]
description = "Slides, in order"
type = "array"

[resources.verbs.params.schema.items]
additionalProperties = false
description = "A slide as a verb carries it whole."
required = [
    "id",
    "layout",
    "background",
]
type = "object"

[resources.verbs.params.schema.items.properties.background]
description = "Per-slide background treatment, resolved against the palette at draw time. Keeps slides theme-driven while still allowing variety."

[[resources.verbs.params.schema.items.properties.background.oneOf]]
const = "surface"
description = "Neutral content surface (raised panel)."
type = "string"

[[resources.verbs.params.schema.items.properties.background.oneOf]]
const = "accent"
description = "Full accent wash — used for section / cover slides."
type = "string"

[[resources.verbs.params.schema.items.properties.background.oneOf]]
const = "deep"
description = "Deep, near-black accent tint."
type = "string"

[resources.verbs.params.schema.items.properties.elements]
description = "Back to front."
type = "array"

[resources.verbs.params.schema.items.properties.elements.items]
additionalProperties = false
description = "An element as a verb carries it whole: the window's paste, a slide's copy, a file's import. `blocks` are a text box's words as written."
