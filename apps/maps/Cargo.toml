[package]
name = "maps"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "maps"
path = "src/lib.rs"

[[bin]]
name = "maps"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
xdg-paths = { path = "../../crates/system/xdg-paths" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
tilo-net = { path = "../../crates/system/tilo-net", features = ["blocking"] }
# RFC-3339 timestamps for the transit depart/arrive time picker.
chrono = { workspace = true, default-features = true }

[lints]
workspace = true
