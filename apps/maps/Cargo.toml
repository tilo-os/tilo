[package]
name = "maps"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "maps"
path = "src/lib.rs"

[[bin]]
name = "maps"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
lru.workspace = true
fnv.workspace = true
hex.workspace = true
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tilo-net = { path = "../../crates/platform/tilo-net", features = ["http"] }
# The tile worker's job queue, awaited on the app runtime.
# RFC-3339 timestamps for the transit depart/arrive time picker.
chrono = { workspace = true, default-features = true }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
