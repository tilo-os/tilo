[package]
name = "maps"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "maps"
path = "src/lib.rs"

[[bin]]
name = "maps"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { path = "../../ui" }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
# Explicit rustls ring provider so we can install_default() at startup — the tree
# has both ring + aws-lc-rs, which rustls 0.23 won't auto-disambiguate.
rustls.workspace = true
png.workspace = true
# Device location through the XDG Desktop Portal (org.freedesktop.portal.Location,
# GeoClue2 behind it). Runs off the UI thread on its own small Tokio runtime; the
# fix is delivered back over a channel (see `location`). Honest failure states —
# never a fabricated position.
ashpd.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }
futures-util.workspace = true
# RFC-3339 timestamps for the transit depart/arrive time picker.
chrono = { workspace = true, default-features = true }

[lints]
workspace = true
