[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "file-explorer"
version = "0.2.0"
edition = "2024"

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# Source of truth for which extensions are editable documents (so the file
# manager and the codecs agree on what opens in the word processor).
qdoc = { path = "../../crates/doc/qdoc" }
# The one shared thumbnail generator + cache. `pdf` on (real first-page PDF
# previews; pure-Rust to build — pdfium loads dynamically at runtime, falling
# back to a badge when absent). Video stays a badge here so the hermetic build
# and `--shots` need no gstreamer stack.
thumbnail = { path = "../../crates/thumbnail", features = ["pdf"] }
trash = "5.2.6"
open.workspace = true
mime_guess = "2.0.5"
humansize = "2.1.3"
chrono = { workspace = true, default-features = true }
# Reads the qOS FUSE driver's `user.qos.sync` extended attribute so the file
# manager can show each workspace file's sync/hydration state.
xattr = "1.6.1"
# Only used by the `--shots` demo seeds to synthesise real sample files
# (gradient images, an EPUB with a cover) so a headless thumbnail frame renders
# genuine previews rather than mocks.
image = { workspace = true, features = ["png", "jpeg"] }
zip.workspace = true
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
