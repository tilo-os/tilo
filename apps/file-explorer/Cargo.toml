[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "file-explorer"
version = "0.2.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["qos-actions"]

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "qos-app", path = "../../crates/app/qos-app" }
qos-actions = { path = "../../crates/collab/actions" }
accounts = { path = "../../crates/system/accounts" }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
zeroize.workspace = true
# Source of truth for which extensions are editable documents (so the file
# manager and the codecs agree on what opens in the word processor).
qdoc = { path = "../../crates/doc/qdoc" }
collab-types = { path = "../../crates/collab/collab-types" }
qos-user-identity = { path = "../../crates/identity/qos-user-identity" }
ed25519-dalek.workspace = true
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
uuid.workspace = true
blake3.workspace = true
# The one shared thumbnail generator + cache. `pdf` on (real first-page PDF
# previews; pure-Rust to build — pdfium loads dynamically at runtime, falling
# back to a badge when absent). Video stays a badge here so the hermetic build
# and `--shots` need no gstreamer stack.
thumbnail = { path = "../../crates/thumbnail", features = ["pdf"] }
trash = "5.2.6"
open.workspace = true
mime_guess = "2.0.5"
chrono = { workspace = true, default-features = true }
# CLDR-backed date/time and decimal formatting. Keep these scoped to Files:
# ICU4X's compiled data provides deterministic locale fallback without relying
# on host libc locale installation.
icu_datetime = "2.3.0"
icu_decimal = "2.3.0"
icu_locale = "2.3.0"
# Reads the qOS FUSE driver's `user.qos.sync` extended attribute so the file
# manager can show each workspace file's sync/hydration state.
xattr = "1.6.1"
libc.workspace = true
# Only used by the `--shots` demo seeds to synthesise real sample files
# (gradient images, an EPUB with a cover) so a headless thumbnail frame renders
# genuine previews rather than mocks.
image = { workspace = true, features = ["png", "jpeg"] }
zip.workspace = true
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
fluent.workspace = true
unic-langid.workspace = true
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
tempfile.workspace = true
fs = { path = "../../fs" }
fuser.workspace = true
iroh.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "live_collaborative_mount"
path = "tests/live_collaborative_mount.rs"

[lints]
workspace = true
