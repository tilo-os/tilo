[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "file-explorer"
version = "0.2.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach the PDF engine through its engine library in the runtime bundle
# (libtilo_pdf_engine.so, crates/runtime/engines/pdf) instead of linking it.
# The release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links tilo-pdf statically, because an
# engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-pdf-engine/thin"]

[dependencies]
tilo-clock = { path = "../../crates/platform/tilo-clock" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-pdf-engine = { path = "../../crates/runtime/engines/pdf", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-automation = { path = "../../crates/collab/automation" }
accounts = { path = "../../crates/system/accounts" }
# Remote account folders are named exactly as the storage daemon's cloud
# service names its mounts (`cloud_source::tree::mount_names`).
cloud-source = { path = "../../crates/system/cloud-source" }
# Source of truth for which extensions are editable documents (so the file
# manager and the codecs agree on what opens in the word processor).
# File records, the share/recipient control protocols and their canonical
# encoding; the app needs nothing else from the collaboration core.
fs-protocol = { path = "../../crates/system/fs-protocol" }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
ed25519-dalek.workspace = true
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
# Credential-free cloud browsing and independent streamed imports.
tilo-cloud-files = { path = "../../crates/platform/tilo-cloud-files" }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
# Share- and recipient-control frames.
wire-frame = { path = "../../crates/system/wire-frame", features = ["tokio"] }
uuid.workspace = true
hex.workspace = true
sha2.workspace = true
# Shared thumbnail generator and cache. PDF previews come from the PDF engine
# (tilo-pdf), which Files hands to it; video remains a badge in this crate.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }
tilo-mime = { path = "../../crates/platform/tilo-mime" }
chrono = { workspace = true, default-features = true }
# CLDR-backed date/time and decimal formatting. Keep these scoped to Files:
# ICU4X's compiled data provides deterministic locale fallback without relying
# on host libc locale installation.
# Reads the Tilo FUSE driver's `user.tilo.sync` extended attribute so the file
# manager can show each workspace file's sync/hydration state, and performs
# no-replace renames, private staging and trash management.
host-fs = { path = "../../crates/system/host-fs" }
# Reading a PDF's text, through the portable engine. Document formats are
# Writer's: it links the codecs and converts files.
tilo-pdf = { path = "../../crates/platform/tilo-pdf" }
# Used by `--shots` demo seeds to create sample images and an EPUB cover.
image = { workspace = true, features = ["png", "jpeg"] }
zip.workspace = true
tar.workspace = true
flate2.workspace = true
# Home, config, cache and the localized user folders.
tilo-paths = { path = "../../crates/platform/tilo-paths" }
# Change notification for the open directory (inotify, FSEvents), so an idle
# window re-reads nothing on a timer.
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
unic-langid.workspace = true
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge.workspace = true
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
vello.workspace = true
winit.workspace = true
taffy.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-history = { path = "../../crates/sdk/tilo-history" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-copy-lint = { path = "../../crates/dev/copy-lint" }
tilo-test-env = { path = "../../crates/dev/test-env" }
tilo-process = { path = "../../crates/platform/tilo-process" }

[target.'cfg(unix)'.dev-dependencies]
tilo-fs = { path = "../../crates/system/fs" }
fuser.workspace = true
iroh.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "live_collaborative_mount"
path = "tests/live_collaborative_mount.rs"

[lints]
workspace = true
