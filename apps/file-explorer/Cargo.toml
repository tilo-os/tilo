[package]
name = "file-explorer"
version = "0.2.0"
edition = "2024"

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
walkdir = "2.5.0"
trash = "5.2.6"
open = "5.3.5"
infer = "0.19.0"
mime_guess = "2.0.5"
humansize = "2.1.3"
chrono = "0.4"
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
dirs = "6.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge = "0.8.0"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"

[dev-dependencies]
