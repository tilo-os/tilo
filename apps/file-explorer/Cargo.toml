[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "file-explorer"
version = "0.2.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["file-explorer-samples"]

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[features]
# The file manager on a computer: the device's mounts, archives and a window
# toolkit. A page's Files is the workspace's tree alone (`src/tree.rs`), over
# the session, so a web build leaves the feature off
# (`[package.metadata.tilo] web-features`).
default = ["desktop"]
desktop = [
    "dep:accounts",
    "dep:automerge",
    "dep:cloud-source",
    "dep:ed25519-dalek",
    "dep:host-fs",
    "dep:sha2",
    "dep:taffy",
    "dep:tilo-archive",
    "dep:tilo-automation",
    "dep:tilo-clock",
    "dep:tilo-cloud-files",
    "dep:tilo-files",
    "dep:tilo-mime",
    "dep:tilo-paths",
    "dep:tilo-pdf",
    "dep:tilo-thumbnail",
    "dep:tilo-user-identity",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:vello",
    "dep:winit",
    "dep:zip",
]
# The folders the screenshot scenarios browse: development runs, captures and
# tests only, never a release.
samples = ["desktop"]
thin = ["dep:runtime-dylib"]
# Reach the PDF and archive engines through their engine libraries in the
# runtime bundle (libtilo_pdf_engine.so, libtilo_archive_engine.so under
# crates/engines/loadable) instead of linking them.
# The release collection enables it (dist/apps/app-collections.toml); a `thin`
# build without it (`tilo-app dev`) links tilo-pdf statically, because an
# engine library links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-pdf-engine/thin", "tilo-archive-engine/thin"]

[package.metadata.tilo]
# The page's Files is the workspace's tree, not the file manager: a web build
# compiles no default feature.
web-features = []
# And it mounts that tree's window whatever features a build beside it turned
# on: a test build that unifies the file manager's `desktop` features would
# otherwise give a page the computer's disk.
page-definition = "page_definition"

# The app keeps two surfaces of the one Files app: the file manager on a
# computer, which browses the mounts of the device, and the workspace's files
# in a page, which are the Files record a workspace holds (`src/tree.rs`).
# Only what both use is declared here; the manager's crates are `desktop`'s.
[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The records the app draws: their types, verbs and typed action arguments.
file-explorer-model = { path = "../file-explorer-model" }
tilo-actions = { path = "../../crates/collab/actions" }
# File records: the tree a workspace's files are, and the kinds of node in it.
fs-protocol = { path = "../../crates/system/fs-protocol" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
uuid.workspace = true

tilo-clock = { path = "../../crates/platform/tilo-clock", optional = true }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-pdf-engine = { path = "../../crates/engines/loadable/pdf", optional = true }
tilo-archive-engine = { path = "../../crates/engines/loadable/archive", optional = true }
tilo-automation = { path = "../../crates/collab/automation", optional = true }
accounts = { path = "../../crates/integrations/accounts", features = ["person"], optional = true }
# Remote account folders are named exactly as the storage daemon's cloud
# service names its mounts (`cloud_source::tree::mount_names`).
cloud-source = { path = "../../crates/integrations/cloud-source", optional = true }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity", optional = true }
ed25519-dalek = { workspace = true, optional = true }
# Which apps open a kind of file, as the session answers: the workspace tree asks it too, on
# every target.
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
# Credential-free cloud access: the service's protocol, and owner-writable copies staged into
# the workspace.
tilo-cloud-files = { path = "../../crates/integrations/tilo-cloud-files", optional = true }
tokio = { workspace = true, features = ["rt", "net", "io-util"], optional = true }
sha2 = { workspace = true, optional = true }
# Shared thumbnail generator and cache. PDF previews come from the PDF engine
# (tilo-pdf), which Files hands to it; video remains a badge in this crate.
tilo-thumbnail = { path = "../../crates/engines/thumbnail", optional = true }
tilo-mime = { path = "../../crates/platform/tilo-mime", optional = true }
# Reads the Tilo FUSE driver's `user.tilo.sync` extended attribute so the file
# manager can show each workspace file's sync/hydration state, and performs
# no-replace renames, private staging and trash management.
host-fs = { path = "../../crates/system/host-fs", optional = true }
# Reading a PDF's text, through the portable engine. Document formats are
# Writer's: it links the codecs and converts files.
tilo-pdf = { path = "../../crates/engines/tilo-pdf", optional = true }
# Archives: browsing into, extracting and packing them. A thin release build
# loads it from libtilo_archive_engine.so (`runtime-engine`).
tilo-archive = { path = "../../crates/engines/tilo-archive", optional = true }
# The `--shots` demo seeds write a zip.
zip = { workspace = true, optional = true }
# Home, config, cache and the localized user folders.
tilo-paths = { path = "../../crates/platform/tilo-paths", optional = true }
# Change notification for the open directory (inotify, FSEvents), so an idle
# window re-reads nothing on a timer.
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"], optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
taffy = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# Tests build their image fixtures.
image = { workspace = true, features = ["png", "jpeg"] }
# Tests see this package's samples. The key must not be the package name:
# a dependency named `file-explorer` claims `--features file-explorer/thin` in the
# collection build, and the app then links the whole runtime statically.
file-explorer-samples = { package = "file-explorer", path = ".", features = ["samples"] }
tar.workspace = true
tilo-history = { path = "../../crates/sdk/tilo-history" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-copy-lint = { path = "../../tools/copy-lint" }
tilo-test-env = { path = "../../tools/test-env" }
tilo-process = { path = "../../crates/platform/tilo-process" }

[target.'cfg(unix)'.dev-dependencies]
tilo-fs = { path = "../../crates/system/fs" }
iroh-blobs.workspace = true
fuser.workspace = true
# Endpoints with no relay or directory at all, for tests whose peers are all this machine's.

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "live_collaborative_mount"
path = "tests/live_collaborative_mount.rs"

[lints]
workspace = true
