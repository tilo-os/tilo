[package]
name = "file-explorer"
version = "0.2.0"
edition = "2021"

[lib]
name = "file_explorer"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
walkdir = "2.5"
trash = "5.0"
open = "5.0"
infer = "0.15"
mime_guess = "2.0"
humansize = "2.1"
chrono = "0.4"
dirs-next = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
# Needed by `FileExplorerWidget`'s `Widget` impl — matches the crate set
# terminal pulls in for the same reason.
automerge = "0.7.4"
vello = "0.9"
winit = "0.30.13"
taffy = "0.9.2"

[dev-dependencies]
