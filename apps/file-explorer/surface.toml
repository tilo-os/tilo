# The app's public surface, written by `tilo-app surface`: its resources' verbs
# and stored fields. Review changes to it like an API change; `tilo-app check`
# fails when the code and this file disagree.

[[resources]]
kind = "files.folder"
label = "Folder"
version = 1

[[resources.fields]]
owner = "file-explorer"
path = "places"
stored = "collection"
title = "The bookmarked places, in order. Each is stored under an id derived"
type = "Collection<Bookmark>"

[[resources.fields]]
label = true
owner = "bookmark"
path = "places.*.place"
readonly = true
stored = "value"
title = "Place"
type = "Atom"

[[resources.fields]]
owner = "file-explorer"
path = "ops"
stored = "value"
title = "Filesystem changes, each settled by its device with what it changed"
type = "Outbox<FileTask, Vec<Change>>"

