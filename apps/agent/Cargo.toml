[package]
autotests = false
name = "agent"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "tilo-agent: a headless member that answers the turns people ask it in their conversations through the workspace's MCP tools."

[lib]
name = "tilo_agent"
path = "src/lib.rs"

[[bin]]
name = "tilo-agent"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach the web tools' libraries through their engine library in the runtime
# bundle (libtilo_agent_web_engine.so, crates/runtime/engines/agent-web)
# instead of linking them. The release collection enables it
# (dist/apps/app-collections.toml); a `thin` build without it (`tilo-app dev`)
# links them statically, because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-agent-web-engine/thin"]

[dependencies]
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
# The blocking agent facade delegates to the toolkit's typed
# `TILO_SVC_COLLAB_FD` client and consumes the same request/event model as a
# windowed app.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
# A turn's work: the workspace's MCP tools over the session's action API, asked on this agent's
# own connection, until the model answers.
tilo-agent-turn = { path = "../../crates/agent/agent-turn" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tilo-action-policy = { path = "../../crates/collab/action-policy" }
# The transform action names shortcuts lower their `Ai` steps to.
tilo-automation = { path = "../../crates/collab/automation" }
# The two tools themselves, which a release loads from its engine library
# (crates/runtime/engines/agent-web).
tilo-agent-web-tools = { path = "../../crates/agent/agent-web-tools" }
# The engine library a release loads the search and the page reader through
# (crates/runtime/engines/agent-web).
tilo-agent-web-engine = { path = "../../crates/runtime/engines/agent-web", optional = true }
# The runner reads the same provider profile Settings writes. Resolving the
# profile's vault reference remains a desktop-secret-broker operation; no key
# is linked into this binary through configuration.
agent-provider-config = { path = "../../crates/agent/provider-config" }
# The descriptor client for the desktop-owned hosted model gateway. This has
# no vault access and never exposes a bearer token to the agent process.
tilo-model-client = { default-features = false, path = "../../crates/agent/model-client" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
# A host's actions, answered from closures: what the agent's link reaches in its tests.
tilo-actions = { path = "../../crates/collab/actions", features = ["test-support"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# Read the agent's own catalogues in its tests, as the catalogue check does.
tilo-copy-lint = { path = "../../crates/dev/copy-lint" }
# The person's settings, as the session hands them to a launched app.
settings-store = { path = "../../crates/system/settings-store" }
tempfile.workspace = true
hex.workspace = true
tilo-agent-web-tools = { path = "../../crates/agent/agent-web-tools", features = ["fixture-servers"] }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
runtime-identity = { package = "tilo-identity-client", path = "../../crates/runtime/tilo-identity-client" }
ed25519-dalek.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

# The broker tests (typed_peer and the tests built on it) drive the action
# broker in-process, which runs on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-workspace-service = { path = "../../crates/server/tilo-workspace-service", features = ["apps", "test-support"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
