[package]
autotests = false
name = "agent"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "tilo-agent: a headless participant that joins a word-processor document through the compositor's collaboration broker and edits it with the app's own actions."

[lib]
name = "tilo_agent"
path = "src/lib.rs"

[[bin]]
name = "tilo-agent"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-clock = { path = "../../crates/system/tilo-clock" }
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
collab-types = { path = "../../crates/collab/collab-types" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
# The blocking agent facade delegates to the toolkit's typed
# `TILO_SVC_COLLAB_FD` client and consumes the same request/event model as a
# windowed app.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The word processor's exported actions, shared with the toolbar.
word-processor = { path = "../word-processor" }
# Chat conversation types and actions. Live media features remain disabled for
# this headless participant.
chat = { path = "../chat", default-features = false }
# Image editor types and actions, including cross-app image references.
photos = { path = "../photos" }
tilo-actions = { path = "../../crates/collab/actions" }
# The transform action names shortcuts lower their `Ai` steps to.
tilo-automation = { path = "../../crates/collab/automation" }
# The selected-resource address carried by chat messages.
tilo-reference = { path = "../../crates/collab/reference" }
# The runner reads the same provider profile Settings writes. Resolving the
# profile's vault reference remains a desktop-secret-broker operation; no key
# is linked into this binary through configuration.
agent-provider-config = { path = "../../crates/agent/provider-config" }
# The descriptor client for the desktop-owned hosted model gateway. This has
# no vault access and never exposes a bearer token to the agent process.
tilo-model-gateway = { path = "../../crates/agent/model-gateway" }
# Triage files an approved issue through the accounts service, which holds
# the team's forge token; the agent never does.
tilo-account-service = { path = "../../crates/system/account-service" }
atomic-file = { path = "../../crates/system/atomic-file" }
# The review floor: what a drafted issue must never carry.
tilo-feedback-review = { path = "../../crates/collab/feedback-review" }
qdoc = { path = "../../crates/doc/qdoc" }
tilo-content = { path = "../../crates/system/content" }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
# A triage session's device, in its room lease claim.
hex.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
hex.workspace = true
shell = { path = "../../crates/session/shell", default-features = false, features = ["test-support"] }
# The workspace-settings governance the triage tests drive, as the shell runs it.
tilo-desktop = { path = "../../crates/session/desktop" }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
ed25519-dalek.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }
# The accounts service in-process, over a fake forge, for the filing tests.
account-custody = { path = "../../crates/system/account-custody", features = ["fake-forge"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
