[package]
autotests = false
name = "agent"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "tilo-agent: a headless participant that runs broker-leased tasks through the actions the session's apps publish to it."

[lib]
name = "tilo_agent"
path = "src/lib.rs"

[[bin]]
name = "tilo-agent"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
collab-types = { path = "../../crates/collab/collab-types" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
# The blocking agent facade delegates to the toolkit's typed
# `TILO_SVC_COLLAB_FD` client and consumes the same request/event model as a
# windowed app.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
# The transform action names shortcuts lower their `Ai` steps to.
tilo-automation = { path = "../../crates/collab/automation" }
# The runner reads the same provider profile Settings writes. Resolving the
# profile's vault reference remains a desktop-secret-broker operation; no key
# is linked into this binary through configuration.
agent-provider-config = { path = "../../crates/agent/provider-config" }
# The descriptor client for the desktop-owned hosted model gateway. This has
# no vault access and never exposes a bearer token to the agent process.
tilo-model-gateway = { default-features = false, path = "../../crates/agent/model-gateway" }
tilo-content = { path = "../../crates/system/content", features = ["device"] }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-action-policy = { path = "../../crates/collab/action-policy" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
ed25519-dalek.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

# The broker tests (typed_peer and the tests built on it) drive the shell's
# in-process broker, which runs on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
shell = { path = "../../crates/session/shell", default-features = false, features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
