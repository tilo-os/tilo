[package]
autotests = false
name = "agent"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "tilo-agent: a headless participant that runs broker-leased tasks through the actions the session's apps publish to it."

[lib]
name = "tilo_agent"
path = "src/lib.rs"

[[bin]]
name = "tilo-agent"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
collab-types = { path = "../../crates/collab/collab-types" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
# The blocking agent facade delegates to the toolkit's typed
# `TILO_SVC_COLLAB_FD` client and consumes the same request/event model as a
# windowed app.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
# The tracker's run actions, typed: the agent builds each call it makes on
# an issue (its reports, spend and end) from Tasks' own action arguments, so
# a renamed or retyped parameter fails to compile rather than being refused
# at run time. It is the record crate, not the app: the same types, verbs and
# arguments the Tasks window draws, with no window or surface of theirs.
# A skill's selector: the kinds of thing it is for, and what they say.
tilo-selector = { path = "../../crates/platform/tilo-selector" }
# The machine this agent runs on, as a run's receipt reports it.
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tilo-action-policy = { path = "../../crates/collab/action-policy" }
# The transform action names shortcuts lower their `Ai` steps to.
tilo-automation = { path = "../../crates/collab/automation" }
# The agent's own web tools: several public search engines asked at once and
# merged, and one page reduced to readable text, with every download bounded
# and every destination checked.
tilo-web-search = { path = "../../crates/platform/tilo-web-search" }
# Those tools reach the network on their own runtime, and hand a page they
# fetched to whoever reads it as tilo.content.
tilo-rt = { path = "../../crates/platform/tilo-rt" }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["http"] }
# The runner reads the same provider profile Settings writes. Resolving the
# profile's vault reference remains a desktop-secret-broker operation; no key
# is linked into this binary through configuration.
agent-provider-config = { path = "../../crates/agent/provider-config" }
# The descriptor client for the desktop-owned hosted model gateway. This has
# no vault access and never exposes a bearer token to the agent process.
tilo-model-client = { default-features = false, path = "../../crates/agent/model-client" }
# Pictures a read answers with are shown to a model that sees, base64-encoded.
base64.workspace = true
blake3.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
# The web tools' tests ask a server on this machine instead of the engines,
# and read from it, where the shipped paths refuse its addresses.
tilo-web-search = { path = "../../crates/platform/tilo-web-search", features = ["fixture-servers"] }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
runtime-identity = { package = "tilo-identity-client", path = "../../crates/runtime/tilo-identity-client" }
ed25519-dalek.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

# The broker tests (typed_peer and the tests built on it) drive the action
# broker in-process, which runs on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tilo-action-broker = { path = "../../crates/collab/tilo-action-broker", features = ["test-support"] }
parking_lot.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true
