[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "qos-agent: a headless participant that joins a word-processor document through the compositor's collaboration broker and edits it with the app's own actions."

[lib]
name = "qos_agent"
path = "src/lib.rs"

[[bin]]
name = "qos-agent"
path = "src/main.rs"

[dependencies]
# The wire types every participant speaks (`CollabRequest` / `CollabEvent`,
# presence keys and payloads) — the same definitions the word processor
# serialises, so a frame the agent writes is a frame the app reads.
ui = { path = "../../ui" }
# The word processor's exported actions: the agent edits with exactly the
# ops the toolbar produces, never with its own idea of the document.
word-processor = { path = "../word-processor" }
# A second app, of a deliberately different shape: a tree of filesystem paths
# rather than blocks and offsets. The agent links its contract, not a list of
# what it can do — the operations come from the tree the app publishes.
file-explorer = { path = "../file-explorer" }
# Where the agent is spoken to. Chat's own message model and mention list: the
# room resolves `@name` to a participant id once, when the message is sent, so
# "am I being addressed" is a field lookup here rather than a second,
# disagreeing parse of the body. Default features off — the live media engine
# (GStreamer, iroh, openh264, the screen portal) is a chat window's business
# and nothing a headless participant reading messages needs.
chat = { path = "../chat", default-features = false }
# The one app in the room whose subject is not a document at all, and the
# reason an instruction can name two of them: a photograph edited here is a
# thing to put somewhere else. Its own decode and its own render, so "the
# cropped photograph" means what the app means by it.
photos = { path = "../photos" }
# The address of the thing a message is about, when it was written by selecting
# something. What lets "crop this" name a resource instead of a screen.
qos-reference = { path = "../../crates/collab/reference" }
qos-actions = { path = "../../crates/collab/actions" }
qdoc = { path = "../../crates/doc/qdoc" }
# The decision — which exported action answers an instruction — is a model
# call. Blocking, because the agent's loop is a plain blocking loop; rustls so
# no OS TLS stack is needed inside the image.
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
hex.workspace = true
# The record of what crossed between two applications is process-wide, the
# way the compositor reads it, so the tests that make one take turns.
serial_test.workspace = true
# The broker the compositor actually binds for an agent. The toolkit also
# ships an in-process relay, but that one fans every frame to every peer and
# enforces nothing, so a test on it proves neither the routing nor the gate a
# live session runs under.
shell = { path = "../../shell" }
