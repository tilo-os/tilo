[package]
name = "camera-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The camera record: the recent capture handoff and the scanned codes"

# The resource Camera draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the content store's reference check, never the toolkit.

[lib]
name = "camera_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tilo-content = { path = "../../crates/core/content", default-features = false }
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
