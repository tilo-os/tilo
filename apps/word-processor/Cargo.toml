[package]
name = "word-processor"
version = "0.1.0"
edition = "2021"
description = "CRDT rich-text word processor: a ui app over qdoc with .odt support."

[lib]
name = "word_processor"
path = "src/lib.rs"

[[bin]]
name = "word-processor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
qdoc = { path = "../../crates/doc/qdoc" }
spellcheck = { path = "../../crates/text/spellcheck" }
qdoc-pdf = { path = "../../crates/doc/qdoc-pdf" }
qdoc-html = { path = "../../crates/doc/qdoc-html" }
qdoc-rtf = { path = "../../crates/doc/qdoc-rtf" }
qdoc-epub = { path = "../../crates/doc/qdoc-epub" }
automerge.workspace = true
vello.workspace = true
taffy.workspace = true
winit.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
fluent.workspace = true
unic-langid.workspace = true
# Host-native image open through the XDG Desktop Portal (FileChooser). The
# portal round-trip runs on a worker thread; the chosen path comes back over a
# channel drained each frame — the UI thread never blocks.
ashpd.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }
url.workspace = true
