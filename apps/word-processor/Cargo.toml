[package]
name = "word-processor"
version = "0.1.0"
edition = "2021"
description = "CRDT rich-text word processor: a ui app over qdoc with .odt support."

[lib]
name = "word_processor"
path = "src/lib.rs"

[[bin]]
name = "word-processor"
path = "src/main.rs"

[dependencies]
# `portal` enables host-native file open/save via the XDG Desktop Portal
# (`ui::portal`) — the shared primitive every qOS app uses instead of drawing its
# own picker. Open, Save, and Save As all route through it.
ui = { path = "../../ui", features = ["portal"] }
qdoc = { path = "../../crates/doc/qdoc" }
spellcheck = { path = "../../crates/text/spellcheck" }
qdoc-pdf = { path = "../../crates/doc/qdoc-pdf" }
qdoc-html = { path = "../../crates/doc/qdoc-html" }
qdoc-rtf = { path = "../../crates/doc/qdoc-rtf" }
qdoc-epub = { path = "../../crates/doc/qdoc-epub" }
automerge = "0.8.0"
vello = "0.9"
taffy = "0.10.1"
winit = "0.30.13"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fluent = "0.17.0"
unic-langid = "0.9.6"
