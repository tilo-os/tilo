[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "word-processor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "CRDT rich-text word processor: a ui app over qdoc with .odt support."

[lib]
name = "word_processor"
path = "src/lib.rs"

[[bin]]
name = "word-processor"
path = "src/main.rs"

[features]
# Build the word processor as a thin app. Enabling this puts the shared
# toolkit dylib (`runtime-dylib` -> libruntime_dylib.so) on the link
# path; combined with `-C prefer-dynamic --profile thin-app` rustc then
# serves `ui` (and its wgpu / vello / cosmic-text / automerge graph) and
# libstd out of that shared object instead of baking a private copy into
# this binary. Off by default -- a normal `cargo build --release -p
# word-processor` is an unchanged static build.
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-clock = { path = "../../crates/platform/tilo-clock" }
fnv.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# Only pulled in under `--features thin`; see the `thin` feature above.
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-doc = { path = "../../crates/doc/tilo-doc" }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
tilo-document = { path = "../../crates/doc/tilo-document" }
# Comment replies are written in the SDK rich-text editor, embedded.
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
tilo-doc-codecs = { path = "../../crates/doc/tilo-doc-codecs", default-features = false, features = ["markdown", "html", "rtf", "epub", "docx", "odt"] }
tilo-spellcheck = { path = "../../crates/text/spellcheck" }
tilo-doc-pdf = { path = "../../crates/doc/tilo-doc-pdf" }
# Content addressing everywhere; the device store where the launcher hands
# one over.
tilo-content = { path = "../../crates/system/content", features = ["dir", "device"] }
automerge.workspace = true
tilo-automerge.workspace = true
vello.workspace = true
taffy.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# Host-native image open through the XDG Desktop Portal (FileChooser). The
# portal round-trip runs on a worker thread; the chosen path comes back over a
# channel drained each frame — the UI thread never blocks.

[[test]]
name = "it"
path = "tests/it.rs"

[dev-dependencies]
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
