[[resources.fields]]
path = "body"
owner = "document"
title = "The text: paragraphs, tables, images, styles, the page header and"
stored = "value"
type = "RichText"

[resources.fields.ops]
description = "Every collaborative, document-mutating operation the word processor exports. Deliberately positional: each variant names the exact block ids and offsets it touches, so `Action::apply` is a pure, replayable write. Ordinary typing, deletion, paragraph splitting, Find & Replace, and agent-authored edits all enter through these same envelopes; caret and selection updates remain local."

[[resources.fields.ops.oneOf]]
type = "object"
required = [
    "SpliceText",
]
additionalProperties = false
description = "Replace `[at, at+del)` of `block` with `ins` (insert = `del` 0; delete = `ins` empty). The deterministic text primitive."

[resources.fields.ops.oneOf.properties.SpliceText]
type = "object"
required = [
    "region",
    "block",
    "at",
    "del",
    "ins",
]
additionalProperties = false

[resources.fields.ops.oneOf.properties.SpliceText.properties.region]
type = "string"
enum = [
    "Body",
    "Header",
    "Footer",
]
description = "Which page region a text/formatting op addresses. Mirrors `tilo_doc::model::Region` (which is not itself serializable) so the region travels in the payload."

[resources.fields.ops.oneOf.properties.SpliceText.properties.block]
type = "string"

[resources.fields.ops.oneOf.properties.SpliceText.properties.at]
type = "integer"
minimum = 0

[resources.fields.ops.oneOf.properties.SpliceText.properties.del]
type = "integer"
minimum = 0

[resources.fields.ops.oneOf.properties.SpliceText.properties.ins]
type = "string"

[[resources.fields.ops.oneOf]]
type = "object"
required = [
    "ReplaceMatches",
]
additionalProperties = false
description = "Replace disjoint character ranges together without recreating blocks. Offsets refer to the pre-action document; application runs back to front."

[resources.fields.ops.oneOf.properties.ReplaceMatches]
type = "object"
required = [
    "region",
    "spans",
    "ins",
]
additionalProperties = false

[resources.fields.ops.oneOf.properties.ReplaceMatches.properties.region]
