[[resources.verbs]]
description = "Adds a photograph already kept in the content store. A photograph the library already has keeps what it was given."
id = "import-photo"
kind = "undoable"
label = "Import photograph"

[[resources.verbs.params]]
name = "image"
required = true

[resources.verbs.params.schema]
additionalProperties = false
description = "The photograph currently open: its portable identity and dimensions. Deliberately carries no bytes. The document names the original by content hash; the bytes live in the app's content store (`tilo-content`) and the pixels are decoded beside the document, never written into the CRDT: an oversized change is dropped by the sync transport and freezes every peer's replica at the change before it."
required = [
    "name",
    "path",
    "width",
    "height",
]
type = "object"

[resources.verbs.params.schema.properties.content]
description = "blake3 of the picture's bytes — the one name for it that means the same thing in every session. `#[serde(default)]` so a document written before this field existed still parses; such a picture has only its path, which is why the resolution order keeps working from one."
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.properties.height]
maximum = 4294967295
minimum = 0
type = "integer"

[resources.verbs.params.schema.properties.name]
description = "File name, as shown."
type = "string"

[resources.verbs.params.schema.properties.path]
description = "Where the picture was opened from, for a picture with no content address; a content-addressed picture keeps only its name here, never an absolute origin path: its bytes resolve by `Self::content` through the content store on every device."
type = "string"

[resources.verbs.params.schema.properties.width]
description = "Intrinsic pixel size of the *original*, before any edit."
maximum = 4294967295
minimum = 0
type = "integer"

[[resources.verbs.params]]
name = "captured_at"
required = false

[resources.verbs.params.schema]
type = [
    "string",
    "null",
]

[[resources.verbs.params]]
name = "location"
required = false

[resources.verbs.params.schema]
additionalProperties = false
description = "A deliberately small, explicitly shared location attached to one photo. Coordinates are useful for browsing a personal library, but are sensitive: this is never inferred from an IP address, uploaded for reverse geocoding, or copied from a machine-local file path.  A location reaches the shared document only through `SetPhotoLocation`; clearing it removes the complete shared record.  The label is a collaborator-visible convenience, not an authority over the coordinates."
required = [
    "latitude",
    "longitude",
]
type = [
    "object",
    "null",
]

[resources.verbs.params.schema.properties.label]
description = 'Optional user-facing place name, e.g. "Golden Gate Park".'
type = [
    "string",
    "null",
]

[resources.verbs.params.schema.properties.latitude]
description = "WGS-84 latitude in decimal degrees."
type = "number"

[resources.verbs.params.schema.properties.longitude]
description = "WGS-84 longitude in decimal degrees."
type = "number"

[resources.verbs.params.schema.properties.provenance]
additionalProperties = false
description = "Why this location exists and whether it was deliberately shared."
type = "object"

[resources.verbs.params.schema.properties.provenance.properties.scope]
description = "`shared` is required for durable locations. `local` is reserved for an app-private draft and must never be persisted in the CRDT."
type = "string"

[resources.verbs.params.schema.properties.provenance.properties.source]
description = "`user`, `map`, `exif`, or `device`.  `map` records a deliberate placement on Photos' bundled offline reference map. No network-derived source is silently accepted: hosted geocoding would be a privacy boundary, not metadata."
type = "string"

[[resources.verbs]]
description = "Refreshes what can be re-read from the original without overwriting deliberate organization. A capture time fills an empty one only; a location read from the file replaces only another read from a file."
id = "refresh-imported-metadata"
kind = "undoable"
label = "Read again from its file"

