required = true

[resources.verbs.params.schema]
additionalProperties = false
description = "A rectangle in normalized `0..1` coordinates of the image it applies to. Normalized rather than pixels so a crop survives the source being replaced by a different resolution of the same photograph, and so the value means the same thing to a peer that has not fetched the bytes yet."
required = [
    "x",
    "y",
    "w",
    "h",
]
type = "object"

