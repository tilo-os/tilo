[[resources.verbs]]
description = "Merges one analyzer's bounded result into what the photograph already shares. Text recognition and image analysis are independent: completing either keeps the other."
id = "merge-image-analysis"
kind = "undoable"
label = "Share analysis"

[[resources.verbs.params]]
name = "photo"
required = true

[resources.verbs.params.schema]
type = "string"

[[resources.verbs.params]]
name = "analysis"
required = true

[resources.verbs.params.schema]
additionalProperties = false
description = "Bounded, explainable intelligence derived on a device from a photograph. This record contains no pixels, embeddings, face geometry, machine-local file names, or opaque model output.  A local analysis is private until a user or trusted caller explicitly publishes it through `SetImageAnalysis`."
type = "object"

[resources.verbs.params.schema.properties.description]
description = "A concise, local description suitable for finding a photograph later."
type = "string"

[resources.verbs.params.schema.properties.objects]
description = 'Recognized non-person subjects, for example "bicycle" or "beach".'
type = "array"

[resources.verbs.params.schema.properties.objects.items]
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance]
additionalProperties = false
description = "Provenance for the text currently stored in `ocr_text`. Kept separate from visual analysis so a later OCR or vision job cannot erase the other component's audit trail."
type = [
    "object",
    "null",
]

[resources.verbs.params.schema.properties.ocr_provenance.properties.content]
description = "The content hash this result describes. Empty means a legacy/path-only image and makes the result deliberately refreshable, not transferable."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.engine]
description = "Stable engine/model family identifier, never an error or command line."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.language]
description = "OCR language when text recognition was used."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.model_id]
description = "Signed local model identifier when a vision result was produced. Empty for OCR, user-authored, and older records."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.model_revision]
description = "Immutable signed model revision when a vision result was produced. Empty preserves backwards compatibility with pre-provenance records."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.scope]
description = "Explicit sharing semantics: `shared` records were accepted through the document action; `local` records must never be written to the CRDT."
type = "string"

[resources.verbs.params.schema.properties.ocr_provenance.properties.source]
description = "`local-ocr`, `local-vision`, `local-description` (legacy), or `user`."
type = "string"

[resources.verbs.params.schema.properties.ocr_text]
description = "The text read from the pixels. Line layout is intentionally flattened: the shared search layer needs words, not page coordinates."
type = "string"

[resources.verbs.params.schema.properties.pets]
description = "Pet labels are separate from generic objects because people browse their animals differently from everything else in a scene."
type = "array"

[resources.verbs.params.schema.properties.pets.items]
type = "string"

[resources.verbs.params.schema.properties.provenance]
additionalProperties = false
description = "How the result was made. It gives collaborators enough context to decide whether to trust or refresh it without leaking local paths."
type = "object"

