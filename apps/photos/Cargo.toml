[package]
autotests = false
name = "photos"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "photos"
path = "src/lib.rs"

[[bin]]
name = "photos"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
# A new album's id is minted when the caller names none.
uuid.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The open photograph is published as a Resource whose edits are ActionSpecs,
# so the shell's palette and an out-of-process caller drive the same operations
# the toolbar buttons do.
tilo-actions = { path = "../../crates/collab/actions" }
tilo-reference = { path = "../../crates/collab/reference" }
tilo-content = { path = "../../crates/system/content" }
# The shared preview pipeline behind the library grid.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }
tilo-vision = { path = "../../crates/media/vision" }
agent-provider-config = { path = "../../crates/agent/provider-config" }
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tilo-ocr = { path = "../../crates/media/ocr" }
kamadak-exif = "0.6.1"

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
vello_encoding.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }
tilo-history = { path = "../../crates/sdk/tilo-history" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
