[package]
name = "photos"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "photos"
path = "src/lib.rs"

[[bin]]
name = "photos"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/app/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-reference = { path = "../../crates/collab/reference" }
qdoc = { path = "../../crates/doc/qdoc" }
atomic-file = { path = "../../crates/system/atomic-file" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
png.workspace = true

[dev-dependencies]
tempfile.workspace = true
vello_encoding.workspace = true

[lints]
workspace = true
