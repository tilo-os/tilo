[package]
name = "photos"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "photos"
path = "src/lib.rs"

[[bin]]
name = "photos"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
# The open photograph is published as a Resource whose edits are ActionSpecs,
# so the shell's palette and an out-of-process caller drive the same operations
# the toolbar buttons do.
tilo-actions = { path = "../../crates/collab/actions" }
tilo-reference = { path = "../../crates/collab/reference" }
qdoc = { path = "../../crates/doc/qdoc" }
tilo-vision = { path = "../../crates/media/vision" }
agent-provider-config = { path = "../../crates/agent/provider-config" }
atomic-file = { path = "../../crates/system/atomic-file" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tilo-ocr = { path = "../../crates/media/ocr" }
kamadak-exif = "0.6.1"

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tempfile.workspace = true
vello_encoding.workspace = true

[lints]
workspace = true
