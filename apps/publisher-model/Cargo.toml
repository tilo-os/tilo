[package]
name = "publisher-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "App Publisher's resource: the registry and namespace application a workspace keeps, with the check that keeps the registry an address to publish to"

# The resource App Publisher keeps and an agent works through the same type. It
# has no window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# signing key, the registry's HTTP client and the clipboard stay in the app.

[lib]
name = "publisher_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
url.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
