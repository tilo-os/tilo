[package]
name = "poker-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Poker's resource: the table and the hand being played, with Texas hold'em's rules"

# The resource Poker keeps and every person at the table sees: the same types and
# verbs in the app and in the WebAssembly module its package carries. It has no
# window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# drawn card face stays in the app.

[lib]
name = "poker_model"
path = "src/lib.rs"

[dependencies]
tilo-actions = { path = "../../crates/core/actions" }
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
