[[resources]]
kind = "ebook.library"
label = "Books"
version = 1
fields = [
  { path = "entries", type = "Collection<LibraryEntry>", stored = "collection" },
  { path = "entries.*.id", type = "String", readonly = true },
  { path = "entries.*.shared", type = "bool", readonly = true },
  { path = "entries.*.title", type = "String", label = true },
  { path = "entries.*.author", type = "String" },
  { path = "entries.*.subject", type = "String" },
  { path = "entries.*.added", type = "u64", readonly = true },
  { path = "entries.*.content", type = "Bytes", readonly = true },
  { path = "entries.*.index", type = "Bytes", readonly = true },
  { path = "progress", type = "Map<Progress>" },
  { path = "settings", type = "Settings", stored = "record" },
  { path = "settings.font_scale", type = "f32" },
  { path = "settings.line_spacing", type = "f32" },
  { path = "settings.font_id", type = "String" },
  { path = "settings.theme", type = "ReadTheme" },
  { path = "settings.scheme_id", type = "String" },
  { path = "settings.mode", type = "ReadMode" },
  { path = "settings.composition", type = "CompositionStyle" },
  { path = "default_font", type = "Atom" },
  { path = "prefs", type = "LibraryPrefs", stored = "record" },
  { path = "prefs.sort", type = "LibrarySort" },
  { path = "prefs.hide_read", type = "bool" },
  { path = "fonts", type = "Collection<FontEntry>", stored = "collection" },
  { path = "fonts.*.id", type = "String", readonly = true },
  { path = "fonts.*.kind", type = "FontKind" },
  { path = "fonts.*.name", type = "String", label = true },
  { path = "fonts.*.size_mult", type = "f32" },
  { path = "fonts.*.shown", type = "bool" },
  { path = "schemes", type = "Collection<ColorScheme>", stored = "collection" },
  { path = "schemes.*.id", type = "String", readonly = true },
  { path = "schemes.*.name", type = "String", label = true },
  { path = "schemes.*.page", type = "[u8; 3]" },
  { path = "schemes.*.ink", type = "[u8; 3]" },
  { path = "schemes.*.accent", type = "[u8; 3]" },
  { path = "schemes.*.dark", type = "bool" },
  { path = "schemes.*.enabled", type = "bool" },
  { path = "schemes.*.builtin", type = "bool", readonly = true },
  { path = "annotations", type = "Collection<Mark>", stored = "collection", unit = true },
  { path = "annotations.*.id", type = "Uuid", readonly = true },
  { path = "annotations.*.doc_id", type = "String", readonly = true },
  { path = "annotations.*.kind", type = "AnnoKind", readonly = true },
  { path = "annotations.*.chapter", type = "usize" },
  { path = "annotations.*.block", type = "usize" },
  { path = "annotations.*.start", type = "usize" },
  { path = "annotations.*.end", type = "usize" },
  { path = "annotations.*.excerpt", type = "String", label = true },
  { path = "annotations.*.text", type = "RichText", ops = "sha256:b86bfc65e3faa1c9" },
  { path = "annotations.*.color", type = "HiColor" },
  { path = "annotations.*.created", type = "u64" },
  { path = "annotations.*.group", type = "Uuid", readonly = true },
]

[[resources.verbs]]
id = "shelve"
kind = "undoable"
params = [
  { name = "book", required = true, schema = { type = "string" } },
  { name = "title", required = true, schema = { type = "string" } },
  { name = "author", required = true, schema = { type = "string" } },
  { name = "subject", required = true, schema = { type = "string" } },
  { name = "shared", required = true, schema = { type = "boolean" } },
  { name = "content", required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { hash = { type = "string" }, size = { type = "integer", minimum = 0 } }, required = ["hash", "size"] } },
]

