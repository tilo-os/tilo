[package]
name = "ebook"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "ebook"
path = "src/lib.rs"

[[bin]]
name = "ebook"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# "Open a book…" goes through `ui::portal`, the platform's own picker (the
# HIG's file-access boundary), instead of a magic folder.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
tilo-automerge.workspace = true
# Content-addressed book identity: the BLAKE3 hash of an EPUB's bytes is its id,
# so annotations + reading progress follow the file across paths, devices and
# peers. Same hash family the Tilo filesystem uses.
blake3.workspace = true
# Where a host that has no files for it (the browser) keeps an opened book's
# bytes, by content hash; the library row names the hash.
tilo-content = { path = "../../crates/system/content", default-features = false }
# The Tilo ACTION model: Books' `actions` module exports its annotation-store
# operations as replayable actions the host's Ctrl+K palette dispatches.
tilo-actions = { path = "../../crates/collab/actions" }
# Notes and comments are rich text, written in the SDK editor.
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# EPUB containers are ZIP archives with XHTML and an OPF manifest, read
# through the shared zip-bomb bounds. These pure-Rust crates keep parsing
# hermetic; `deflate` covers common EPUBs.
bounded-zip = { path = "../../crates/doc/bounded-zip", features = ["epub"] }
roxmltree.workspace = true
# Decode and downscale embedded raster covers for the shelf, through the
# shared preview decoder.
tilo-thumbnail = { path = "../../crates/media/thumbnail" }
unicode-bidi = "0.3.18"

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
# Encodes cover fixtures.
image = { workspace = true, features = ["png"] }
# Serialises the handful of tests that set the process-wide `EBOOK_LIBRARY_DIR`
# env var (library discovery + the empty-shelf reload) so cargo's default
# parallel runner can't race them.
serial_test.workspace = true
# Temporary directories for on-disk library-discovery tests.
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
