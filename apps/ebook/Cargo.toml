[package]
name = "ebook"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "ebook"
path = "src/lib.rs"

[[bin]]
name = "ebook"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# `portal` pulls in the host XDG file-chooser so "Open a book…" goes through the
# desktop's own picker (the HIG's file-access boundary) instead of a magic folder.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
automerge.workspace = true
# Content-addressed book identity: the BLAKE3 hash of an EPUB's bytes is its id,
# so annotations + reading progress follow the file across paths, devices and
# peers. Same hash family the Tilo filesystem uses.
blake3.workspace = true
# The Tilo ACTION model: Books' `actions` module exports its annotation-store
# operations as replayable actions the host's Ctrl+K palette dispatches.
tilo-actions = { path = "../../crates/collab/actions" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# EPUB containers are ZIP archives with XHTML and an OPF manifest, read
# through the shared zip-bomb bounds. These pure-Rust crates keep parsing
# hermetic; `deflate` covers common EPUBs.
bounded-zip = { path = "../../crates/doc/bounded-zip" }
roxmltree.workspace = true
# Decode and downscale embedded raster covers for the shelf.
image = { workspace = true, features = ["jpeg", "png"] }
unicode-bidi = "0.3.18"
# Device-local file capabilities (opened book paths and watched roots) must
# survive restart without entering the shared Automerge document.
settings-store = { path = "../../crates/system/settings-store" }

[dev-dependencies]
# Serialises the handful of tests that set the process-wide `EBOOK_LIBRARY_DIR`
# env var (library discovery + the empty-shelf reload) so cargo's default
# parallel runner can't race them.
serial_test.workspace = true
# Temporary directories for on-disk library-discovery tests.
tempfile.workspace = true

[lints]
workspace = true
