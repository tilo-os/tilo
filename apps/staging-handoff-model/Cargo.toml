[package]
name = "staging-handoff-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
install-profile-model = { path = "../../crates/os/install-profile-model" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# The load-option fixture is compared as bytes.
hex.workspace = true
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
