[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The history tests include ui-core's shared conformance suite, which takes
# merges through tilo-automerge; machete does not follow `include!`.
[package.metadata.cargo-machete]
ignored = ["tilo-automerge"]

[lib]
name = "calculator"
path = "src/lib.rs"

[[bin]]
name = "calculator"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
tilo-automerge.workspace = true

[lints]
workspace = true
