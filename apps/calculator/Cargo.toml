[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "calculator"
path = "src/lib.rs"

[[bin]]
name = "calculator"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
ui = { path = "../../ui" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[lints]
workspace = true
