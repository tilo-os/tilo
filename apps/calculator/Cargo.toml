[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "calculator"
path = "src/lib.rs"

[[bin]]
name = "calculator"
path = "src/main.rs"

# The Android library around this same `main.rs`, whose `ui::android_main!()`
# the activity enters. `tilo-app build --platform android` builds it.
[[example]]
name = "calculator-android"
path = "src/android.rs"
crate-type = ["cdylib"]
required-features = ["android"]

[features]
thin = ["dep:runtime-dylib"]
android = []

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
