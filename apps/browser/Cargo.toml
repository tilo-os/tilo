[package]
name = "browser"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "browser"
path = "src/lib.rs"

[[bin]]
name = "browser"
path = "src/main.rs"

[features]
# Live WPE WebKit engine. Needs the WPE stack from os/dev/build-wpe.sh
# (PKG_CONFIG_PATH/LD_LIBRARY_PATH pointing at its prefix). Normal launches
# use the pinned Chromium/CEF helper. Headless fixtures and unit tests use
# the deterministic test engine.
wpe = ["ui/webview"]
thin = ["dep:runtime-dylib"]

[dependencies]
fnv.workspace = true
private-fs = { path = "../../crates/system/private-fs" }
# Session-store ownership and the private cache root's cleanup barrier.
tilo-advisory-lock = { path = "../../crates/system/advisory-lock" }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
# ui — UI toolkit. The browser is chrome around the toolkit's WebView
# widget: the engine lives behind `ui::webview::WebViewEngine`, and the
# `webview-adblock` feature provides filter-list compilation. The default
# Chromium helper applies built-in network, cosmetic and scriptlet filtering.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["webview-adblock"] }
tilo-actions = { path = "../../crates/collab/actions" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }

# Filter lists (EasyList/EasyPrivacy) are fetched on a background thread
# with a blocking client and cached under the user cache dir.
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
host-info = { path = "../../crates/system/host-info" }
sha2.workspace = true
base64.workspace = true
url.workspace = true

# Extension packages: .xpi (Firefox) and .crx (Chrome) are zip archives
# (.crx behind a small binary header); manifest.json describes them. Read
# under the shared zip-bomb bounds before anything is extracted.
bounded-zip = { path = "../../crates/doc/bounded-zip" }
zip.workspace = true
serde_json.workspace = true
serde.workspace = true
blake3.workspace = true
uuid.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }

tracing.workspace = true

# Direct quick-ui adjacent deps (matches the set quick-terminal +
# file-explorer pull in for their `Widget` impls).
automerge.workspace = true
tilo-automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
accesskit_consumer = "0.39"
# extension install tests unpack into throwaway directories
tempfile.workspace = true
# block_on for the headless dmabuf probe examples
pollster.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

# Zero-copy composite probe — needs the WPE engine's dmabuf import.
[[example]]
name = "dmabuf_composite_probe"
required-features = ["wpe"]

[[example]]
name = "adblock_blank_repro"
required-features = ["wpe"]

[[example]]
name = "key_modifier_repro"
required-features = ["wpe"]

[[example]]
name = "startup_flicker_capture"
required-features = ["wpe"]

[lints]
workspace = true
