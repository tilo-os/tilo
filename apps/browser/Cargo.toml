[package]
name = "browser"
version = "0.1.0"
description = "Web browser: one page per instance, tabs are desktop tabs"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "browser"
path = "src/lib.rs"

[[bin]]
name = "browser"
path = "src/main.rs"

[features]
# Live browsing runs the Chromium engine runtime (ui::webview::chromium).
# Headless fixtures and unit tests use the deterministic test engine.
thin = ["dep:runtime-dylib"]
# Reach the import from another browser's profile (browser-continuity's
# capture and the SQLite it reads Chromium's and Firefox's databases with)
# through its engine library in the runtime bundle
# (libtilo_browser_import_engine.so, crates/runtime/engines/browser-import)
# instead of linking it. The release collection enables it
# (dist/apps/app-collections.toml); a `thin` build without it (`tilo-app dev`)
# links them statically, because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-browser-import-engine/thin"]

[dependencies]
tilo-browser-sessions = { path = "../../crates/platform/tilo-browser-sessions" }
browser-continuity = { workspace = true, features = ["native"] }
fnv.workspace = true
chrono.workspace = true
tilo-clock = { path = "../../crates/platform/tilo-clock" }
# ui — UI toolkit. The browser is chrome around the toolkit's WebView
# widget: the engine lives behind `ui::webview::WebViewEngine`, and the
# `webview-adblock` feature provides filter-list compilation. The default
# Chromium helper applies built-in network, cosmetic and scriptlet filtering.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["webview-adblock"] }
tilo-actions = { path = "../../crates/collab/actions" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-browser-import-engine = { path = "../../crates/runtime/engines/browser-import", optional = true }

# Filter lists (EasyList/EasyPrivacy) are fetched on a background thread
# with a blocking client and cached under the user cache dir.
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
host-info = { path = "../../crates/system/host-info" }
sha2.workspace = true
base64.workspace = true
# CRX3 proofs are RSA PKCS#1 v1.5 or ECDSA P-256 signatures over SHA-256.
ring = "0.17"
url.workspace = true

# Extension packages: .xpi (Firefox) and .crx (Chrome) are zip archives
# (.crx behind a small binary header); manifest.json describes them. Read
# under the shared zip-bomb bounds before anything is extracted.
bounded-zip = { path = "../../crates/doc/bounded-zip" }
zip.workspace = true
serde_json.workspace = true
tempfile.workspace = true
serde.workspace = true
blake3.workspace = true
uuid.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }

tracing.workspace = true

# Direct quick-ui adjacent deps (matches the set quick-terminal +
# file-explorer pull in for their `Widget` impls).
automerge.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
workspace-hack = { version = "0.1" }

[dev-dependencies]
hex.workspace = true
# The import tests write the Chromium and Firefox databases they read.
rusqlite = { version = "0.37.0", features = ["bundled"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# extension install tests unpack into throwaway directories
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true
