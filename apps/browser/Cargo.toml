[package]
name = "browser"
version = "0.1.0"
edition = "2024"

[lib]
name = "browser"
path = "src/lib.rs"

[[bin]]
name = "browser"
path = "src/main.rs"

[dependencies]
# ui — UI toolkit (iced was the previous host; the iced→ui migration
# landed in Phase B, and Phase D dropped the iced + iced_futures crates
# from this dep list entirely).
ui = { path = "../../ui" }

# Servo + GL plumbing (unchanged from the iced era).
servo = { git = "https://github.com/servo/servo.git", package = "libservo" }
surfman = "0.9"
glow = "0.13"
adblock = "0.12"
reqwest = { version = "0.12", features = ["blocking"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
once_cell = "1.21.4"
# `dirs-next` is deprecated; `dirs` 6 is the maintained drop-in. The
# `home_dir`/`config_dir`/`cache_dir` API is identical.
dirs = "6.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5.15"
keyboard-types = "0.8"
libc = "0.2"
euclid = "0.22.14"
dpi = "0.1"

# Direct quick-ui adjacent deps (matches the set quick-terminal +
# file-explorer pull in for their `Widget` impls).
automerge = "0.8.0"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
