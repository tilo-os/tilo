# Written by `tilo-app surface`; review changes like an API change.

[[resources]]
kind = "browser.application"
label = "Browser"
version = 1
fields = [
  { path = "bookmarks", type = { collection = { named = "Bookmark" } }, stored = "collection" },
  { path = "bookmarks.*.url", type = "text", readonly = true },
  { path = "bookmarks.*.title", type = "text", label = true },
  { path = "preferences", type = { named = "Settings" }, stored = "record" },
  { path = "preferences.adblock_enabled", type = "bool" },
  { path = "preferences.clear_on_exit", type = "bool" },
  { path = "preferences.search_engine", type = "text" },
  { path = "preferences.homepage", type = "text" },
  { path = "site_exceptions", type = { set = "text" }, readonly = true },
  { path = "site_forms", type = { map = { named = "RememberedForm" } }, readonly = true },
]

[[resources.verbs]]
id = "add-bookmark"
kind = "undoable"
params = [
  { name = "url", type = "text", required = true, schema = { type = "string" } },
  { name = "title", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "remove-bookmark"
kind = "undoable"
params = [
  { name = "bookmark", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "set-site-protection"
kind = "undoable"
params = [
  { name = "origin", type = "text", required = true, schema = { type = "string" } },
  { name = "enabled", type = "bool", required = true, schema = { type = "boolean" } },
]

[[resources.verbs]]
id = "remember-forms"
kind = "undoable"
params = [
  { name = "origin", type = "text", required = true, schema = { type = "string" } },
  { name = "page", type = "text", required = true, schema = { type = "string" } },
  { name = "forms", type = { list = { named = "RememberedForm" } }, required = true, schema = { type = "array", items = { type = "object", additionalProperties = false, properties = { follows = { type = "string" }, grew_from = { type = "string" }, label = { type = "string" }, pages = { type = "array", items = { type = "string" } }, questions = { type = "array", items = { type = "object", additionalProperties = false, properties = { choices = { type = "array", items = { type = "string" } }, fallback = { type = "string" }, kind = { type = "string" }, name = { type = "string" }, required = { type = "boolean" } } } }, seen = { type = "integer", minimum = 0 }, signature = { type = "string" }, submit = { type = "array", items = { type = "string" } } } } } },
  { name = "whole", type = "bool", required = true, schema = { type = "boolean" } },
  { name = "at", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

[[resources.types]]
name = "Bookmark"
fields = [
  { name = "url", type = "text" },
  { name = "title", type = "text" },
]

[[resources.types]]
name = "RememberedForm"
fields = [
  { name = "signature", type = "text" },
  { name = "label", type = "text" },
  { name = "pages", type = { list = "text" } },
  { name = "questions", type = { list = { named = "RememberedQuestion" } } },
  { name = "submit", type = { list = "text" } },
  { name = "follows", type = "text" },
  { name = "grew_from", type = "text" },
  { name = "seen", type = "int" },
]

[[resources.types]]
name = "RememberedQuestion"
fields = [
  { name = "name", type = "text" },
  { name = "kind", type = "text" },
  { name = "choices", type = { list = "text" } },
  { name = "required", type = "bool" },
  { name = "fallback", type = "text" },
]

[[resources.types]]
name = "Settings"
fields = [
  { name = "adblock_enabled", type = "bool" },
  { name = "clear_on_exit", type = "bool" },
  { name = "search_engine", type = "text" },
  { name = "homepage", type = "text" },
]

