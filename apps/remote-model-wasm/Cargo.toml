[package]
name = "remote-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Remote model as the WebAssembly module its package carries: the saved connections and their verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
remote-model = { path = "../remote-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }
workspace-hack = { version = "0.1" }

[lints]
workspace = true
