app-id: org.qos.Imager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: qos-imager
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=/run/udev:ro
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: qos-imager
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/imager /app/bin/qos-imager-bin
      - install -Dm755 apps/imager/packaging/linux/qos-imager-flatpak /app/bin/qos-imager
      - install -Dm644 apps/imager/packaging/linux/qos-imager.desktop /app/share/applications/org.qos.Imager.desktop
      - install -Dm644 apps/imager/packaging/linux/qos-imager.svg /app/share/icons/hicolor/scalable/apps/qos-imager.svg
    sources:
      - type: dir
        path: ../../../..
