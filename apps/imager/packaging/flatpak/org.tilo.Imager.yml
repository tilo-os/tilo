app-id: org.tilo.Imager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tilo-imager

# Deliberately no broad device, host-filesystem, or host-command permission.
# UDisks2 mediates a single exclusive descriptor through polkit.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=TILO_IMAGER_FLATPAK=1

modules:
  - name: tilo-imager
    buildsystem: simple
    build-commands:
      - install -Dm755 tilo-imager-bin /app/bin/tilo-imager
      - install -Dm755 tilo-enroll /app/bin/tilo-enroll
      - tar -xf tilo-capture-sidecar.tar -C /app
      - install -Dm644 org.tilo.Imager.desktop /app/share/applications/org.tilo.Imager.desktop
      - install -Dm644 org.tilo.Imager.metainfo.xml /app/share/metainfo/org.tilo.Imager.metainfo.xml
      - install -Dm644 org.tilo.Imager.svg /app/share/icons/hicolor/scalable/apps/org.tilo.Imager.svg
    sources:
      - type: file
        path: tilo-imager-bin
      - type: file
        path: tilo-enroll
      - type: file
        path: tilo-capture-sidecar.tar
      - type: file
        path: org.tilo.Imager.desktop
      - type: file
        path: org.tilo.Imager.metainfo.xml
      - type: file
        path: org.tilo.Imager.svg
