app-id: org.qos.Imager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: qos-imager

# Deliberately no broad device, host-filesystem, or host-command permission.
# UDisks2 mediates a single exclusive descriptor through polkit.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=QOS_IMAGER_FLATPAK=1

modules:
  - name: qos-imager
    buildsystem: simple
    build-commands:
      - install -Dm755 qos-imager-bin /app/bin/qos-imager
      - install -Dm644 org.qos.Imager.desktop /app/share/applications/org.qos.Imager.desktop
      - install -Dm644 org.qos.Imager.metainfo.xml /app/share/metainfo/org.qos.Imager.metainfo.xml
      - install -Dm644 org.qos.Imager.svg /app/share/icons/hicolor/scalable/apps/org.qos.Imager.svg
    sources:
      - type: file
        path: qos-imager-bin
      - type: file
        path: org.qos.Imager.desktop
      - type: file
        path: org.qos.Imager.metainfo.xml
      - type: file
        path: org.qos.Imager.svg
