[package]
name = "imager"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The qOS ACTION model: the imager's guided-customization install profile (the
# only user-authored config in the shared document) is exported as replayable
# actions the shell's Ctrl+K palette dispatches — the same actions its on-screen
# toggles and fields dispatch.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tempfile.workspace = true

[lints]
workspace = true
