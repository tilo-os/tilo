[package]
name = "imager"
version = "0.1.0"
description = "Writes OS images to drives and installs Tilo"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

# The destination side of the guided setup: the installer on the live medium
# (`/usr/libexec/tilo/tilo-installer`, the `installer` component in
# os/components.toml).
[[bin]]
name = "tilo-installer"
path = "src/bin/tilo-installer.rs"
required-features = ["destination"]

# The installer runs on Windows, macOS and Linux before any Tilo device or workspace exists: it
# is a program of the computer it runs on, not an app a Tilo device installs. It still serves
# its steps as actions, through the one actions protocol.
[package.metadata.tilo]
kind = "host-program"

[features]
# The guided installation of Tilo from another operating system: the guided
# setup (`--setup`) that downloads Tilo, stages it next to the running system
# or writes it to a drive, and hands the reviewed choices to the installer.
# The person's data comes over later, through the migration app on Tilo.
# The host downloads build it; the default build is the image writer alone.
# tools/ci/package_features.py tests and lints with it.
installation = ["dep:hardware-report"]
# The destination side of the guided setup, on the live installer medium:
# keyboard, network, disk, account and the install itself, consuming the
# profile and staged handoff the host side produced. It does not need the
# host side (`installation`). Linux only, like the live medium it runs on.
destination = ["imager-backend/destination", "dep:url", "dep:hardware-report"]
# Host downloads opt into the narrowly elevated raw-media writer. A host
# download is the guided installer, so it brings `installation`.
host-media-writer = ["installation"]
# Flatpak cannot safely elevate a binary from inside its mutable mount
# namespace.  This backend asks the host's root-owned UDisks2 service for one
# polkit-authorized, exclusive file descriptor to the reviewed removable
# drive.  No /dev access or host-command escape is granted to the sandbox.
flatpak-media-writer = ["installation", "imager-backend/flatpak-media-writer"]

[dependencies]
tilo-action-services = { version = "0.1.0", path = "../../crates/core/action-services" }
tilo-action-line = { version = "0.1.0", path = "../../crates/core/action-line" }
tilo-lock = { version = "0.1.0", path = "../../crates/platform/tilo-lock" }
# The host's own release, read instead of guessing from a file name.
tilo-os-release = { version = "0.1.0", path = "../../crates/platform/os-release" }
install-profile-model = { path = "../../crates/os/install-profile-model" }
tilo-keyboard-map = { path = "../../crates/desktop/tilo-keyboard-map" }
# The time zones the profile offers, as this machine reads them.
tilo-clock = { path = "../../crates/platform/tilo-clock", features = ["local"] }
# The one maker of a machine's plan and its single-use token, shared with
# `tilo machine add` so the window and the command write the same document.
install-plan = { path = "../../crates/os/install-plan" }
imager-backend = { path = "../../crates/os/imager-backend" }
# This computer's hardware, read the same way the live installer reads it.
hardware-report = { path = "../../crates/os/hardware-report", optional = true }
staging-handoff-model = { path = "../staging-handoff-model" }
uuid.workspace = true
base64.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
# The Tilo ACTION model: the imager's guided-customization install profile (the
# only user-authored config in the shared document) is exported as replayable
# actions the shell's Ctrl+K palette dispatches — the same actions its on-screen
# toggles and fields dispatch.
tilo-actions = { path = "../../crates/core/actions" }
# The resource, its effects and rows are declared with the resource macros.
tilo-resource = { path = "../../crates/core/tilo-resource" }
tilo-user-identity = { path = "../../crates/core/tilo-user-identity" }
tilo-identity = { path = "../../crates/core/tilo-identity" }
tilo-identity-client = { path = "../../crates/core/tilo-identity-client" }
tilo-server-protocol = { path = "../../crates/core/tilo-server-protocol" }
# The certificate this machine's person issues an image it writes.
tilo-server-client = { path = "../../crates/core/tilo-server-client" }
automerge.workspace = true
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
tilo-paths = { path = "../../crates/platform/tilo-paths" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
# Pure Rust, so no C decoder has to link.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tempfile.workspace = true
block-devices = { path = "../../crates/os/block-devices" }
bounded-command = { package = "tilo-bounded-command", path = "../../crates/platform/bounded-command" }
tilo-process = { version = "0.1.0", path = "../../crates/platform/tilo-process" }

# The destination side (`destination`): checks a self-hosted account server's
# address.
url = { workspace = true, optional = true }
tilo-device-identity = { version = "0.1.0", path = "../../crates/core/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# The daemon that issues the ticket an image joins with (Unix stages tickets only).
tilo-api = { path = "../../crates/core/tilo-api" }
# The action frames a console caller sends the installer's windows.
console-control = { path = "../../crates/os/console-control" }

[target.'cfg(target_os = "linux")'.dependencies]
host-fs = { path = "../../crates/core/host-fs" }

[target.'cfg(not(windows))'.dependencies]
tilo-ui-base = { version = "0.1.0", path = "../../crates/ui/ui-base", default-features = false }
ui = { package = "tilo-ui-app", path = "../../crates/ui/ui-app", features = ["model"] }

[target.'cfg(windows)'.dependencies]
tilo-ui-base = { version = "0.1.0", path = "../../crates/ui/ui-base", default-features = false }
ui = { package = "tilo-ui-app", path = "../../crates/ui/ui-app", features = ["dx12-shader-cache", "model"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_Memory", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }
# Windows installs no zoneinfo: the time-zone database comes bundled instead.
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }

# The cargo-xwin Clang sysroot's NEON header cannot compile blake3's C
# intrinsics for Windows ARM64. The portable implementation is sufficient for
# the small hashes in this host-side firmware handoff tool.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[package.metadata.cargo-machete]
# These target dependencies only enable a feature on a transitive crate.
ignored = ["blake3", "jiff"]

[dev-dependencies]
url.workspace = true
crc32fast.workspace = true
imager-backend = { path = "../../crates/os/imager-backend", features = ["test-support"] }
test-http = { package = "tilo-test-http", path = "../../tools/test-http" }
# The sentences History shows for the resource's changes.
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-test-env = { path = "../../tools/test-env" }
tilo-ui-base = { version = "0.1.0", path = "../../crates/ui/ui-base", default-features = false }
ui = { package = "tilo-ui-app", path = "../../crates/ui/ui-app", features = ["test-support", "model"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The destination's capacity test asks the same compiled rule that
# `tilo-guided-partition` delegates to; the destination, like that helper, is Linux only.
tilo-install-helpers = { path = "../../crates/os/install-helpers" }

[lints]
workspace = true
