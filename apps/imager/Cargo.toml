[package]
name = "imager"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Host downloads opt into the narrowly elevated raw-media writer. The qpkg
# deliberately omits this feature because its sandbox has no raw-device portal.
host-media-writer = []
# Flatpak cannot safely elevate a binary from inside its mutable mount
# namespace.  This backend asks the host's root-owned UDisks2 service for one
# polkit-authorized, exclusive file descriptor to the reviewed removable
# drive.  No /dev access or host-command escape is granted to the sandbox.
flatpak-media-writer = ["dep:zbus"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The qOS ACTION model: the imager's guided-customization install profile (the
# only user-authored config in the shared document) is exported as replayable
# actions the shell's Ctrl+K palette dispatches — the same actions its on-screen
# toggles and fields dispatch.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
zstd.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tempfile.workspace = true
zbus = { workspace = true, optional = true, default-features = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ui = { package = "qos-app", path = "../../crates/app/qos-app", features = ["portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ui = { package = "qos-app", path = "../../crates/app/qos-app" }

[lints]
workspace = true
