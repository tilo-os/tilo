[package]
name = "imager"
version = "0.1.0"
description = "Writes OS images to drives and installs Tilo"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

# The installed target-user setup consumer (/usr/libexec/tilo-prepared-setup,
# the `prepared-setup` component in os/components.toml): it runs the
# installation's consumer side, so it needs `installation`.
[[bin]]
name = "tilo-prepared-setup"
path = "src/bin/tilo-prepared-setup.rs"
required-features = ["installation"]

[[bin]]
name = "tilo-home-export"
path = "src/bin/tilo-home-export.rs"
required-features = ["capture-worker"]
test = false

[features]
thin = ["dep:runtime-dylib"]
# The guided installation of Tilo from another operating system and the
# migration of that system's data: the installer journey (`--installer`), the
# guided setup (`--setup`), the later folder imports (`--import-folders`), the
# capture and transfer of the old system's homes, accounts, browsers and
# applications, the prepared installer medium, and the helpers those start.
# The host downloads, the capture worker and the installed setup consumer
# (tilo-prepared-setup) build it. The Tilo app (`.tapp`, the release
# collection) does not: on Tilo it is the image writer, and the default build
# is that app. tools/ci/package_features.py tests and lints with it.
installation = ["dep:launcher"]
# Reach account custody with the WebDAV client, and the FUSE presentation the
# projection worker serves, through their engine libraries in the runtime
# bundle (libtilo_accounts_engine.so and libtilo_fuse_engine.so, under
# crates/runtime/engines/) instead of carrying them in the tapp. The release
# collection enables it (dist/apps/app-collections.toml); a `thin` build
# without it (`tilo-app dev`) links them statically, because an engine library
# links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-accounts-engine/thin", "tilo-fuse-engine/thin"]
capture-worker = ["installation", "imager-backend/capture-worker"]
# Explicit new signed cohort; default capture-worker preserves shipped Home5.
capture-worker-applications = ["capture-worker", "imager-backend/capture-worker-applications"]
# Privileged acceptance tests require a disposable, observable native store.
native-capture-qualification = ["installation", "imager-backend/native-capture-qualification"]
native-current-device-qualification = ["installation"]
# Explicit isolated original-owner SecretService + pinned public Slack fixture.
native-slack-qualification = ["installation", "imager-backend/native-slack-qualification"]
# Host downloads opt into the narrowly elevated raw-media writer. The tapp
# deliberately omits this feature because its sandbox has no raw-device portal.
# A host download is the guided installer, so it brings `installation`.
host-media-writer = ["installation", "imager-backend/host-media-writer"]
# Flatpak cannot safely elevate a binary from inside its mutable mount
# namespace.  This backend asks the host's root-owned UDisks2 service for one
# polkit-authorized, exclusive file descriptor to the reviewed removable
# drive.  No /dev access or host-command escape is granted to the sandbox.
flatpak-media-writer = ["installation", "imager-backend/flatpak-media-writer"]

[dependencies]
ed25519-dalek.workspace = true
tilo-image-codec = { version = "0.1.0", path = "../../crates/platform/tilo-image-codec" }
tilo-lock = { version = "0.1.0", path = "../../crates/platform/tilo-lock" }
install-profile-model = { path = "../../crates/session/install-profile-model" }
imager-backend = { path = "../../crates/platform/imager-backend" }
staging-handoff-model = { path = "../staging-handoff-model" }
uuid.workspace = true
base64.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-accounts-engine = { path = "../../crates/runtime/engines/accounts", optional = true }
tilo-fuse-engine = { path = "../../crates/runtime/engines/fuse", optional = true }
# The Tilo ACTION model: the imager's guided-customization install profile (the
# only user-authored config in the shared document) is exported as replayable
# actions the shell's Ctrl+K palette dispatches — the same actions its on-screen
# toggles and fields dispatch.
tilo-actions = { path = "../../crates/collab/actions" }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
tilo-identity-host = { path = "../../crates/runtime/tilo-identity-host" }
tilo-relay-protocol = { path = "../../crates/hosting/tilo-relay-protocol" }
automerge.workspace = true
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
tilo-paths = { path = "../../crates/platform/tilo-paths" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
hex.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
# Pure Rust: a thin app gets the `zstd` crate from libruntime_dylib.so, which
# exports Rust symbols only, so zstd's C decoder would not link.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tempfile.workspace = true
block-devices = { path = "../../crates/system/block-devices" }
bounded-command = { path = "../../crates/system/bounded-command" }
workspace-hack = { version = "0.1" }
tilo-process = { version = "0.1.0", path = "../../crates/platform/tilo-process" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only the installed setup consumer (tilo-prepared-setup) admits the
# launcher's consuming bootstrap; the app never runs launcher code.
launcher = { path = "../../crates/packaging/launcher", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[target.'cfg(windows)'.dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["dx12-shader-cache"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_Memory", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

# The cargo-xwin Clang sysroot's NEON header cannot compile blake3's C
# intrinsics for Windows ARM64. The portable implementation is sufficient for
# the small hashes in this host-side firmware handoff tool.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[package.metadata.cargo-machete]
# This target dependency only enables a feature on the transitive blake3 crate.
ignored = ["blake3"]

# Integration tests of the installation's consumer side.
[[test]]
name = "prepared_setup_cli"
path = "tests/prepared_setup_cli.rs"
required-features = ["installation"]

[[test]]
name = "profile_transport"
path = "tests/profile_transport.rs"
required-features = ["installation"]

[dev-dependencies]
accounts = { path = "../../crates/system/accounts" }
account-custody = { path = "../../crates/system/account-custody" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
zbus = { workspace = true, features = ["tokio", "blocking-api"] }
url.workspace = true
crc32fast.workspace = true
tilo-seal = { path = "../../crates/system/tilo-seal" }
imager-backend = { path = "../../crates/platform/imager-backend", features = ["test-support"] }
tilo-desktop-model = { path = "../../crates/session/desktop-model" }
vello_encoding.workspace = true
cloud-source-dav = { path = "../../crates/system/cloud-source-dav", features = ["fake-server"] }
test-http = { path = "../../crates/dev/test-http" }
tilo-oauth = { path = "../../crates/system/tilo-oauth", features = ["fake"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
fs-native = { path = "../../crates/system/fs-native" }
tilo-secrets.workspace = true
rusqlite = { version = "0.37.0", features = ["bundled"] }
runtime-fs = { path = "../../crates/runtime/runtime-fs" }
# Installer transport must reach the canonical storage consumer, not only the vault.
# Its FUSE backend is a Linux service, not part of hosted Windows tests.
tilo-fs = { path = "../../crates/system/fs" }

[lints]
workspace = true
