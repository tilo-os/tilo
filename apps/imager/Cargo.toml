[package]
name = "imager"
version = "0.1.0"
edition = "2024"

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

[dependencies]
# `portal` opts into the shared XDG Desktop Portal file chooser (HIG §5): the
# source image is picked through the host portal, never a bespoke in-app dialog.
ui = { path = "../../ui", features = ["portal"] }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
