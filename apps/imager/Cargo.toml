[package]
name = "imager"
version = "0.1.0"
description = "Writes OS images to drives and installs Tilo"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "imager"
path = "src/lib.rs"

[[bin]]
name = "imager"
path = "src/main.rs"

# The installed target-user setup consumer (/usr/libexec/tilo-prepared-setup,
# the `prepared-setup` component in os/components.toml): it runs the
# installation's consumer side, so it needs `installation`.
[[bin]]
name = "tilo-prepared-setup"
path = "src/bin/tilo-prepared-setup.rs"
required-features = ["installation"]

# The destination side of the guided setup: the installer on the live medium
# (`/usr/libexec/tilo/tilo-installer`, the `installer` component in
# os/components.toml).
[[bin]]
name = "tilo-installer"
path = "src/bin/tilo-installer.rs"
required-features = ["destination"]

[[bin]]
name = "tilo-home-export"
path = "src/bin/tilo-home-export.rs"
required-features = ["capture-worker"]
test = false

[features]
# The home-capture worker (tilo-home-export) links the shared runtime library
# the capture service ships beside it (os/scripts/build-thin-apps.sh, role
# home-capture), instead of carrying its own copy.
thin = ["dep:runtime-dylib"]
# The guided installation of Tilo from another operating system and the
# migration of that system's data: the guided setup (`--setup`), the later
# folder imports (`--import-folders`), the capture and transfer of the old
# system's homes, accounts, browsers and applications, the prepared installer
# medium, and the helpers those start.
# The host downloads, the capture worker and the installed setup consumer
# (tilo-prepared-setup) build it. The Tilo app (`.tapp`, the release
# collection) does not: on Tilo it is the image writer, and the default build
# is that app. tools/ci/package_features.py tests and lints with it.
installation = ["dep:launcher", "imager-backend/installation"]
# The capture worker reaches account credentials with the WebDAV client, and the
# FUSE presentation the projection worker serves, through their engine
# libraries in the runtime bundle (libtilo_accounts_engine.so and
# libtilo_fuse_engine.so, under crates/engines/loadable/) instead of carrying
# them. The capture service enables it from dist/apps/app-collections.toml; a
# `thin` build without it links them statically, because an engine library
# links only through tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-accounts-engine/thin", "tilo-fuse-engine/thin"]
# The destination side of the guided setup, on the live installer medium:
# keyboard, network, disk, account and the install itself, consuming the
# profile and staged handoff the host side produced. It does not need the
# host side (`installation`). Linux only, like the live medium it runs on.
destination = ["imager-backend/destination", "dep:url"]
capture-worker = ["installation", "imager-backend/capture-worker"]
# Explicit new signed cohort; default capture-worker preserves shipped Home5.
capture-worker-applications = ["capture-worker", "imager-backend/capture-worker-applications"]
# Privileged acceptance tests require a disposable, observable native store.
native-capture-qualification = ["installation", "imager-backend/native-capture-qualification"]
native-current-device-qualification = ["installation"]
# Explicit isolated original-owner SecretService + pinned public Slack fixture.
# Host downloads opt into the narrowly elevated raw-media writer. The tapp
# deliberately omits this feature because its sandbox has no raw-device portal.
# A host download is the guided installer, so it brings `installation`.
host-media-writer = ["installation", "imager-backend/host-media-writer"]
# Flatpak cannot safely elevate a binary from inside its mutable mount
# namespace.  This backend asks the host's root-owned UDisks2 service for one
# polkit-authorized, exclusive file descriptor to the reviewed removable
# drive.  No /dev access or host-command escape is granted to the sandbox.
flatpak-media-writer = ["installation", "imager-backend/flatpak-media-writer"]

[dependencies]
ed25519-dalek.workspace = true
tilo-image-codec = { version = "0.1.0", path = "../../crates/engines/tilo-image-codec" }
tilo-lock = { version = "0.1.0", path = "../../crates/platform/tilo-lock" }
install-profile-model = { path = "../../crates/os/install-profile-model" }
# The one maker of a machine's plan and its single-use token, shared with
# `tilo machine add` so the window and the command write the same document.
install-plan = { path = "../../crates/os/install-plan" }
imager-backend = { path = "../../crates/os/imager-backend" }
migration-sources = { path = "../../crates/import/migration-sources" }
# The shared native preflight the prepared-setup extractor runs without the
# installer backend, whose test-support dependency would cycle back here.
tilo-handoff = { path = "../../crates/os/tilo-handoff" }
prepared-setup-model = { path = "../../crates/session/prepared-setup-model" }
staging-handoff-model = { path = "../staging-handoff-model" }
uuid.workspace = true
base64.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-accounts-engine = { path = "../../crates/engines/loadable/accounts", optional = true }
tilo-fuse-engine = { path = "../../crates/engines/loadable/fuse", optional = true }
# The Tilo ACTION model: the imager's guided-customization install profile (the
# only user-authored config in the shared document) is exported as replayable
# actions the shell's Ctrl+K palette dispatches — the same actions its on-screen
# toggles and fields dispatch.
tilo-actions = { path = "../../crates/collab/actions" }
tilo-user-identity = { path = "../../crates/collab/tilo-user-identity" }
tilo-identity = { path = "../../crates/runtime/tilo-identity" }
tilo-identity-client = { path = "../../crates/runtime/tilo-identity-client" }
tilo-server-protocol = { path = "../../crates/server/tilo-server-protocol" }
automerge.workspace = true
cap-fs-ext = "3.4.6"
cap-primitives = "3.4.6"
cap-std = "3.4.6"
tilo-paths = { path = "../../crates/platform/tilo-paths" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
# Pure Rust: a thin app gets the `zstd` crate from libruntime_dylib.so, which
# exports Rust symbols only, so zstd's C decoder would not link.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
vello.workspace = true
winit.workspace = true
taffy.workspace = true
tempfile.workspace = true
block-devices = { path = "../../crates/os/block-devices" }
bounded-command = { path = "../../crates/platform/bounded-command" }
tilo-process = { version = "0.1.0", path = "../../crates/platform/tilo-process" }

# The destination side (`destination`): checks a self-hosted account server's
# address.
url = { workspace = true, optional = true }
tilo-app-id = { version = "0.1.0", path = "../../crates/platform/tilo-app-id" }
tilo-device-identity = { version = "0.1.0", path = "../../crates/collab/tilo-device-identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
host-fs = { path = "../../crates/system/host-fs" }
# Only the installed setup consumer (tilo-prepared-setup) admits the
# launcher's consuming bootstrap; the app never runs launcher code.
launcher = { path = "../../crates/packaging/launcher", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[target.'cfg(windows)'.dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["dx12-shader-cache"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_Memory", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

# The cargo-xwin Clang sysroot's NEON header cannot compile blake3's C
# intrinsics for Windows ARM64. The portable implementation is sufficient for
# the small hashes in this host-side firmware handoff tool.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[package.metadata.cargo-machete]
# This target dependency only enables a feature on the transitive blake3 crate.
ignored = ["blake3"]

# Integration tests of the installation's consumer side.
[[test]]
name = "prepared_setup_cli"
path = "tests/prepared_setup_cli.rs"
required-features = ["installation"]

[[test]]
name = "profile_transport"
path = "tests/profile_transport.rs"
required-features = ["installation", "destination"]

[dev-dependencies]
accounts = { path = "../../crates/integrations/accounts", features = ["sign-ins-fixture"] }
account-credentials = { path = "../../crates/integrations/account-credentials" }
url.workspace = true
crc32fast.workspace = true
tilo-seal = { path = "../../crates/system/tilo-seal" }
imager-backend = { path = "../../crates/os/imager-backend", features = ["test-support"] }
tilo-desktop-model = { path = "../../crates/session/desktop-model" }
vello_encoding.workspace = true
cloud-source-dav = { path = "../../crates/integrations/cloud-source-dav", features = ["fake-server"] }
test-http = { path = "../../tools/test-http" }
tilo-oauth = { path = "../../crates/integrations/tilo-oauth", features = ["fake"] }
tilo-test-env = { path = "../../tools/test-env" }
# Waits on the handoff source's refusals instead of sleeping.
tilo-handoff = { path = "../../crates/os/tilo-handoff", features = ["test-support"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The destination's capacity test asks the same compiled rule that
# `tilo-guided-partition` delegates to; the destination, like that helper, is Linux only.
tilo-install-helpers = { path = "../../crates/os/install-helpers" }
fs-native = { path = "../../crates/system/fs-native" }
tilo-secrets.workspace = true
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
runtime-fs = { package = "tilo-fs-client", path = "../../crates/runtime/tilo-fs-client" }
# Installer transport must reach the canonical storage consumer, not only the vault.
# Its FUSE backend is a Linux service, not part of hosted Windows tests.
tilo-fs = { path = "../../crates/system/fs" }

[lints]
workspace = true
