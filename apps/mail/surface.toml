  { path = "messages.*.server.locator", type = "String" },
  { path = "messages.*.server.read", type = "bool" },
  { path = "messages.*.server.starred", type = "bool" },
  { path = "messages.*.server.folder", type = "Folder" },
  { path = "messages.*.server.removed", type = "bool" },
  { path = "messages.*.purged", type = "bool", readonly = true },
  { path = "folders", type = "Collection<LocalFolder>", stored = "collection" },
  { path = "folders.*.name", type = "String", label = true },
  { path = "draft", type = "DraftState", stored = "record" },
  { path = "draft.sender", type = "Option<DraftSender>" },
  { path = "draft.to", type = "String" },
  { path = "draft.cc", type = "String" },
  { path = "draft.bcc", type = "String" },
  { path = "draft.subject", type = "String" },
  { path = "draft.body", type = "String" },
  { path = "draft.html_body", type = "Option<String>" },
  { path = "draft.calendar_ics", type = "Option<String>" },
  { path = "draft.attachments", type = "Vec<DraftAttachment>" },
