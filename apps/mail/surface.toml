[[resources]]
kind = "mail.mailbox"
label = "Mail"
version = 1
fields = [
  { path = "messages", type = "Collection<MessageState>", stored = "collection" },
  { path = "messages.*.read", type = "bool", readonly = true },
  { path = "messages.*.starred", type = "bool" },
  { path = "messages.*.folder", type = "Folder" },
  { path = "messages.*.labels", type = "Set<String>" },
  { path = "messages.*.server", type = "Option<ServerCopy>", readonly = true, stored = "record" },
