[package]
name = "mail"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "mail"
path = "src/lib.rs"

[[bin]]
name = "mail"
path = "src/main.rs"

[dependencies]
mime_guess.workspace = true
md-5.workspace = true
fnv.workspace = true
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# Attachment export goes through the host FileChooser portal.  Mail must never
# infer a writable Downloads path or grant itself broad filesystem authority.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo resource + action model: Mail's collaborative-doc mutations (flags,
# labels, local folders, drafts) are exported as replayable actions and a Ctrl+K
# resource tree. See `src/actions.rs`.
tilo-actions = { path = "../../crates/collab/actions" }
# The shared multi-account store + encrypted secret vault. Mail reads its
# email accounts from here (Settings owns the write lifecycle); credentials
# are sealed in the vault, never in the plaintext store.
accounts = { path = "../../crates/system/accounts" }
# Durable replace-after-portal-write; a failed/crashed export never leaves a
# partially-written attachment at the destination the user chose.
tilo-files = { path = "../../crates/platform/tilo-files" }
# Content store for draft attachments. Drafts carry only a verified content
# identity; the bytes live in the app's content store.
tilo-content = { path = "../../crates/system/content" }
# The draft body is rich text, edited in the SDK rich-text editor and sent as
# its HTML part.
tilo-doc-codecs = { path = "../../crates/doc/tilo-doc-codecs", default-features = false, features = ["html"] }
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# Calendar invitations are validated as parsed iCalendar content lines.
pim-lines = { path = "../../crates/text/pim-lines" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# A separate config directory keeps sample, shots, and test constructors away
# from the user's account store.
tempfile.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# MIME parsing and message construction; both are pure Rust with no native,
# TLS, or async dependencies.
mail-parser = "0.11.4"
mail-builder = "0.4.4"
# The base64 encodings XOAUTH2 and the sandboxed HTML data: URL use.
base64.workspace = true
# Tilo's one OAuth client registration per provider (with Gmail's and
# Outlook's mail scopes) and the custody of Mail's grants: sign-in, sealing
# and refresh. The custodian and its HTTPS client are compiled with `live`.
account-custody = { path = "../../crates/system/account-custody", default-features = false }

# Live IMAP and SMTP for the account engine. These are optional and gated by
# `live`; the default build uses the offline backend.
async-imap = { workspace = true, optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs", "tokio1"] }
# HTTP sender avatars through `ui::ImageStore`; optional and gated by `live`.
reqwest = { workspace = true, optional = true, features = ["blocking", "form"] }
# Async runtime and rustls backend used by the live engine; roots come from the
# Tilo system bundle through `tilo-net`, never OpenSSL.
tokio = { workspace = true, optional = true, features = ["rt", "net", "io-util", "time", "macros"] }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["std", "tls12"] }
tilo-net = { path = "../../crates/platform/tilo-net", optional = true, features = ["blocking"] }
futures-util = { workspace = true, optional = true }
workspace-hack = { version = "0.1" }

[features]
thin = ["dep:runtime-dylib"]
# The default app includes the live account engine; it remains idle without a
# configured account. HTML WebKit rendering is opt-in and requires WPE.
default = ["live"]
# Compile the IMAP/SMTP backend and remote avatar fetch; requires a TLS/async
# stack and a configured account at runtime.
live = ["account-custody/custody", "dep:async-imap", "dep:lettre", "dep:reqwest", "dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:tilo-net", "dep:futures-util"]
# Render HTML mail bodies with WPE WebKit; requires the stack from
# os/dev/build-wpe.sh.
html-webview = ["ui/webview"]

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# Test-only self-signed certificates for local IMAP/SMTP TLS servers.
rcgen.workspace = true
# The fake authorization server and browser for the Gmail and Outlook
# sign-in tests.
tilo-oauth = { path = "../../crates/system/tilo-oauth", features = ["fake"] }
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true
