[package]
name = "mail"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "mail"
path = "src/lib.rs"

[[bin]]
name = "mail"
path = "src/main.rs"

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { path = "../../ui" }
# The qOS resource + action model: Mail's collaborative-doc mutations (flags,
# labels, local folders, drafts) are exported as replayable actions and a Ctrl+K
# resource tree. See `src/actions.rs`.
qos-actions = { path = "../../crates/collab/actions" }
# The shared multi-account store + encrypted secret vault. Mail reads its
# email accounts from here (Settings owns the write lifecycle); credentials
# are sealed in the vault, never in the plaintext store.
accounts = { path = "../../crates/system/accounts" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# A throwaway config directory for the sample / `--shots` / test constructors,
# so account add/edit/remove in those modes can exercise the real persist path
# without ever touching the user's real account store under `~/.config/qos`.
tempfile.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# Real MIME parsing (incoming) + MIME building (outgoing). Both are pure
# Rust with no native/TLS/async deps, so the headless build stays green and
# fast. The bundled sample corpus is genuinely parsed by mail-parser, and
# compose output is genuinely serialized by mail-builder (see transport.rs).
mail-parser = "0.11.4"
mail-builder = "0.4.4"

# Live IMAP (fetch/flag/move) and SMTP (submit) for the account engine. These
# pull a TLS + async stack, so they are OPTIONAL and gated behind the `live`
# feature (OFF by default). The default build — and `--shots` — uses the
# offline stub backend in `engine.rs`, staying small, green, and deterministic.
# The data types Mail already uses (AccountConfig/Draft/Message) are exactly the
# shapes these crates consume and produce, so enabling `live` is a drop-in.
async-imap = { version = "0.10", optional = true, default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "tokio1"] }
# Real HTTP for sender avatars (Gravatar) through the shared `ui::ImageStore`.
# Optional + gated behind `live`; the default build injects a no-op fetcher so
# avatars render as initials and `--shots` never opens a socket.
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls-tls"] }
# The async runtime + TLS the engine worker drives async-imap/lettre on. The
# worker thread owns a Tokio runtime and `block_on`s each request; TLS is
# rustls (matching lettre/reqwest) with the bundled Mozilla roots so no OS
# trust-store or OpenSSL dependency is needed. All `live`-only.
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["std", "tls12"] }
webpki-roots = { version = "0.26", optional = true }
futures = { workspace = true, optional = true, features = ["std"] }

[features]
thin = ["dep:runtime-dylib"]
# The real mail client ships on by default: `live` compiles the real IMAP/SMTP
# engine + remote (Gravatar) avatar fetch, so a normally-built `mail` syncs a
# configured account for real. With no account configured — and on the `--shots`
# path, which injects a no-op avatar fetcher and drives the offline stub backend
# at runtime — nothing opens a socket, so the screenshot/test path stays
# hermetic with the live stack compiled in. `html-webview` (real WPE HTML
# rendering) stays opt-in: it needs the WPE stack from os/dev/build-wpe.sh.
default = ["live"]
# Compile the real IMAP/SMTP engine backend + remote avatar fetch. Requires
# network + a TLS/async stack; only exercised at runtime with a configured
# account (never the headless build or `--shots`).
live = ["dep:async-imap", "dep:lettre", "dep:reqwest", "dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:futures"]
# Render HTML mail bodies with the real WPE WebKit engine (the same one the
# browser uses), so an opened HTML email shows true rendered content instead of
# the deterministic test-engine surface. Needs the WPE stack from
# os/dev/build-wpe.sh; the default build renders HTML through the hermetic test
# engine (the sandbox/remote-block plumbing is identical either way).
html-webview = ["ui/webview-wpe"]

[dev-dependencies]
# Generates a throwaway self-signed certificate so the `live` engine tests can
# stand up local IMAP/SMTP servers over a real TLS socket. Uses the ring backend
# already in the tree (no aws-lc). Only compiled for tests, never shipped.
rcgen = "0.13"

[lints]
workspace = true
