[package]
name = "mail"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The renamed self dev-dependency only turns on `samples` for tests.
[package.metadata.cargo-machete]
ignored = ["mail-samples"]

# A page reads the mail its workspace holds and asks a capable device to
# reach the servers (`src/peer_copies.rs`): it compiles no IMAP/SMTP engine and
# no account credentials.
[package.metadata.tilo]
web-features = []

[lib]
name = "mail"
path = "src/lib.rs"

[[bin]]
name = "mail"
path = "src/main.rs"

[dependencies]
# Mail's model and its IMAP/SMTP engine: what this window draws and asks, with
# no window of its own. The tilolang Mail origin runs the same engine.
mail-engine = { path = "../../crates/platform/mail-engine", default-features = false }
# The page reader displays a web engine's frames through the toolkit; it talks to the engine through this client.
tilo-webview = { version = "0.1.0", path = "../../crates/sdk/tilo-webview" }
# A page builds MIME too (drafts, and the sends a capable device delivers),
# but has no hostname to read: the `live` build names Message-IDs from it, and
# Mail names every Message-ID itself.
mail-builder = { version = "0.4.4", default-features = false }
# A message too large to keep in one piece keeps its large parts apart.
tilo-mail-parts = { path = "../../crates/platform/mail-parts" }
tilo-sort = { path = "../../crates/platform/tilo-sort" }
fnv.workspace = true
hex.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-accounts-engine = { path = "../../crates/runtime/engines/accounts", optional = true }
tilo-contact-directory-engine = { path = "../../crates/runtime/engines/contact-directory", optional = true }
tilo-mail-engine = { path = "../../crates/runtime/engines/mail", optional = true }
# Attachment export goes through the host FileChooser portal.  Mail must never
# infer a writable Downloads path or grant itself broad filesystem authority.
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo resource + action model: Mail's collaborative-doc mutations (flags,
# labels, local folders, drafts) are exported as replayable actions and a Ctrl+K
# resource tree. See `src/actions.rs`.
tilo-actions = { path = "../../crates/collab/actions" }
# Read-only address-book hints; selection never confirms identity or sends mail.
tilo-contact-directory = { path = "../../crates/platform/tilo-contact-directory" }
# The shared multi-account store + encrypted secret vault. Mail reads its
# email accounts from here (Settings owns the write lifecycle); credentials
# are sealed in the vault, never in the plaintext store.
accounts = { path = "../../crates/system/accounts", features = ["person"] }
# Content store for draft attachments. Drafts carry only a verified content
# identity; the bytes live in the app's content store.
tilo-content = { path = "../../crates/system/content" }
# The draft body is rich text, edited in the SDK rich-text editor and sent as
# its HTML part.
tilo-doc-codecs = { path = "../../crates/doc/tilo-doc-codecs", default-features = false, features = ["html"] }
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# Calendar invitations are validated as parsed iCalendar content lines.
pim-lines = { path = "../../crates/text/pim-lines" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# A separate config directory keeps sample, shots, and test constructors away
# from the user's account store.
tempfile.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# MIME parsing; a message's date row and the kept mail's header are read with
# it.
mail-parser = "0.11.4"
# HTML mail is parsed as an engine parses it (the WHATWG algorithm), for the
# sealed document the reader's web engine shows and for the styled text it
# shows without one.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# The base64 encoding the sandboxed HTML data: URL uses.
base64.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[features]
# The sample mailboxes the screenshot scenarios and tests show: development
# runs, captures and tests only, never a release.
samples = []
thin = ["dep:runtime-dylib"]
# Reach account credentials with the IMAP client, and the contact directory,
# through their engine libraries in the runtime bundle
# (libtilo_accounts_engine.so, libtilo_contact_directory_engine.so and
# libtilo_mail_engine.so) instead of the runtime. The release collection
# enables it (dist/apps/app-collections.toml); a `thin` build without it
# (`tilo-app dev`) links mail-engine and tilo-contact-directory statically,
# because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-accounts-engine/thin", "tilo-contact-directory-engine/thin", "tilo-mail-engine/thin"]
# The default build includes the live account engine; it remains idle without
# a configured account.
default = ["live"]
# Compile the engine's IMAP/SMTP backend; requires a TLS/async stack and a
# configured account at runtime.
live = ["mail-engine/live"]
# The test IMAP and SMTP servers (`fake_servers`), for this app's tests of what
# talks to mail servers through the engine. Never in a release.
fake-servers = ["live", "mail-engine/fake-servers", "ui/test-support"]

[dev-dependencies]
# Tests see this package's samples. The key must not be the package name:
# a dependency named `mail` claims `--features mail/thin` in the
# collection build, and the app then links the whole runtime statically.
mail-samples = { package = "mail", path = ".", features = ["samples"] }
# Turns on the fake IMAP and SMTP servers for this package's tests, so its
# window tests can start them. Named apart from `mail` for the same reason as
# the samples above.
mail-fixture = { package = "mail", path = ".", features = ["fake-servers"] }
# A secret release a test can point at a directory of its own.
mail-engine = { path = "../../crates/platform/mail-engine", features = ["test-support"] }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
# The fake authorization server and browser for the Gmail and Outlook
# sign-in tests.
tilo-oauth = { path = "../../crates/system/tilo-oauth", features = ["fake"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
# Cross-app acceptance: the account Settings' sign-in writes is the one Mail
# adopts, and an attachment handed over as content opens in the PDF viewer.
settings = { path = "../settings" }
pdf-viewer = { path = "../pdf-viewer" }
test-http = { path = "../../crates/dev/test-http" }
account-credentials = { path = "../../crates/system/account-credentials", default-features = false }

[lints]
workspace = true
