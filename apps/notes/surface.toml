[[resources]]
kind = "notes.notebook"
label = "Notebook"
version = 2
fields = [
  { path = "pages", type = { collection = { named = "Page" } }, stored = "collection" },
  { path = "pages.*.title", type = "text", label = true, readonly = true },
  { path = "pages.*.parent", type = { option = "text" }, readonly = true },
  { path = "pages.*.body", type = "rich_text", ops = "sha256:10bf507639fdd4f3" },
  { path = "pages.*.tags", type = { set = "text" } },
  { path = "pages.*.creator", type = { option = "text" }, readonly = true },
  { path = "pages.*.reactions", type = "reactions" },
  { path = "tags", type = { collection = { named = "Tag" } }, stored = "collection" },
  { path = "tags.*.name", type = "text", label = true },
  { path = "images", type = { map = "any" }, readonly = true },
]

[[resources.verbs]]
id = "new-note"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "title", type = "text", required = true, schema = { type = "string" } },
  { name = "parent", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

