# Written by `tilo-app surface`; review changes like an API change.

format = 2

[[resources]]
kind = "notes.notebook"
label = "Notebook"
version = 2
fields = [
  { path = "pages", type = { collection = { named = "Page" } }, stored = "collection" },
  { path = "pages.*.title", type = "text", label = true, readonly = true },
  { path = "pages.*.parent", type = { option = "text" }, readonly = true },
  { path = "pages.*.body", type = "rich_text", ops = "sha256:8bbf96a46d039012" },
  { path = "pages.*.tags", type = { set = "text" } },
  { path = "pages.*.creator", type = { option = "actor" }, readonly = true },
  { path = "pages.*.creator_name", type = "text", readonly = true },
  { path = "pages.*.origin", type = { option = { named = "Origin" } }, readonly = true, stored = "record" },
  { path = "pages.*.origin.author", type = "text" },
  { path = "pages.*.origin.handle", type = { option = "text" } },
  { path = "pages.*.origin.source", type = "text" },
  { path = "pages.*.origin.url", type = { option = "text" } },
  { path = "pages.*.origin.reference", type = { option = "text" } },
  { path = "pages.*.origin.created_ms", type = { option = "int" } },
  { path = "pages.*.origin.updated_ms", type = { option = "int" } },
  { path = "pages.*.path", type = { option = "text" }, readonly = true },
  { path = "pages.*.reactions", type = "reactions" },
  { path = "tags", type = { collection = { named = "Tag" } }, stored = "collection" },
  { path = "tags.*.name", type = "text", label = true },
  { path = "images", type = { map = "any" }, readonly = true },
]

