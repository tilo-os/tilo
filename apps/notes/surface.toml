  { name = "markdown", type = "text", required = true, schema = { type = "string" } },
  { name = "images", type = { list = "any" }, required = true, schema = { type = "array", items = { oneOf = [{ type = "array", items = { type = "integer", maximum = 255, minimum = 0 } }, { type = "string", content = true, pattern = "^tilo\\.content:[0-9a-f]{64}(\\.[A-Za-z0-9_-]{43})?$" }, { type = "string", pattern = "^blake3:[0-9a-f]{64}:[0-9]+(:[0-9a-f]{64}\\.[A-Za-z0-9_-]{43})?$" }, { type = "object", properties = { inline = { type = "array" } } }, { type = "null" }] } } },
  { name = "note", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "append-to-note"
kind = "undoable"
returns = { schema = { type = "object" } }
params = [
  { name = "title", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "markdown", type = "text", required = true, schema = { type = "string" } },
]

