[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "notes"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "notes"
path = "src/lib.rs"

[[bin]]
name = "notes"
path = "src/main.rs"

# The Android library around this same `main.rs`, whose `ui::android_main!()`
# the activity enters. `tilo-app build --platform android` builds it.
[[example]]
name = "notes-android"
path = "src/android.rs"
crate-type = ["cdylib"]
required-features = ["android"]

# Input→display latency on an owned 27-note notebook; see its header.
[[example]]
name = "notes-latency"
path = "examples/notes-latency.rs"

[features]
thin = ["dep:runtime-dylib"]
android = []
# Reach the emoji catalogue a page's reactions pick from through its engine
# library in the runtime bundle (libtilo_emoji_engine.so,
# crates/runtime/engines/emoji) instead of linking it. The release collection
# enables it (dist/apps/app-collections.toml), as for Chat.
runtime-engine = ["thin", "tilo-emoji-engine/thin"]

[dependencies]
tilo-files = { path = "../../crates/platform/tilo-files" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
# Page bodies are rich text, edited in the SDK rich-text editor.
tilo-doc = { path = "../../crates/doc/tilo-doc" }
tilo-document = { path = "../../crates/doc/tilo-document" }
tilo-rich-text = { path = "../../crates/sdk/tilo-rich-text" }
# Images live in the device content store; the notebook keeps references.
# Content addressing everywhere; the device store where the launcher hands
# one over.
tilo-content = { path = "../../crates/system/content", features = ["dir"] }
automerge.workspace = true
base64.workspace = true
tilo-automerge.workspace = true
blake3.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
tracing.workspace = true
# A pasted or dropped image larger than a notebook asset is re-encoded smaller.
image = { workspace = true, features = ["jpeg", "png", "webp"] }
tempfile.workspace = true
url.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[dev-dependencies]
# Decides the changes Notes makes against its committed surface, as receivers do.
collab-types = { path = "../../crates/collab/collab-types" }
tempfile.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
# Mounts Notes in the desktop surface the browser desktop hosts apps in.
tilo-desktop-model = { path = "../../crates/session/desktop-model" }
tilo-desktop-surface = { path = "../../crates/session/desktop-surface" }

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
# The emoji catalogue for the picker of a page's reactions. The browser
# desktop's start module holds Notes and must not carry it; there Chat's
# module offers it.
tilo-emoji-catalogue = { path = "../../crates/text/emoji-catalogue" }
tilo-emoji-engine = { path = "../../crates/runtime/engines/emoji", optional = true }
