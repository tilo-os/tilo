[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "notes"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "notes"
path = "src/lib.rs"

[[bin]]
name = "notes"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
# Single-writer custody of a notebook directory.
advisory-lock = { path = "../../crates/system/advisory-lock" }
# Crash-safe file replacement (temp + fsync + rename + dir fsync).
atomic-file = { path = "../../crates/system/atomic-file" }
app-state = { path = "../../crates/system/app-state" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["portal"] }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
blake3.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
dirs.workspace = true
tracing.workspace = true
tempfile.workspace = true
url.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

[target.'cfg(unix)'.dependencies]
runtime-portal-xdg = { path = "../../crates/runtime/runtime-portal-xdg" }

[[test]]
name = "it"
path = "tests/it.rs"

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
