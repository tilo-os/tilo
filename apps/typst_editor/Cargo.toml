[package]
name = "typst_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "typst_editor"
path = "src/lib.rs"

[[bin]]
name = "typst_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
dirs = "6.0.0"

# Typst compilation + raster rendering. All three pinned to the same 0.14
# series so the `typst` crate instance is unified across compile + render.
typst = "0.14"
typst-render = "0.14"
typst-pdf = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
tiny-skia = "0.11"
comemo = "0.5"
