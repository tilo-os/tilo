[package]
name = "typst_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "typst_editor"
path = "src/lib.rs"

[[bin]]
name = "typst_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
dirs.workspace = true

# Typst compilation + raster rendering. All three pinned to the same 0.14
# series so the `typst` crate instance is unified across compile + render.
typst = "0.14"
typst-render = "0.14"
typst-pdf = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
tiny-skia = "0.11"
comemo = "0.5"
