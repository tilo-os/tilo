[package]
name = "code_editor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "code_editor"
path = "src/lib.rs"

[[bin]]
name = "code_editor"
path = "src/main.rs"

[dependencies]
# `portal` turns on `ui::portal`'s XDG FileChooser round-trip, which is how
# Open Folder / Open File / Save As reach paths outside the one directory this
# app is confined to. An app never draws its own picker (HIG §5), and the
# portal is where the sandbox's file-access grant is made — so it is the only
# way in, not merely the tidy one.
ui = { path = "../../ui", features = ["portal"] }
# The qOS resource + action model: the serializable, replayable buffer-creation
# action Code exports, plus the Resource tree it publishes to Ctrl+K.
qos-actions = { path = "../../crates/collab/actions" }
# The IDE's terminal panel embeds the real system terminal as a widget, rather
# than shipping a second, weaker terminal implementation.
terminal = { path = "../terminal" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# Syntax highlighting. We use syntect purely as a tokenizer: its Sublime
# syntax definitions classify each span into a scope stack, which we map to
# a small set of OS-theme-derived colors (see `highlight.rs`). The
# `default-fancy` feature selects the pure-Rust `fancy-regex` backend so no
# C toolchain / oniguruma is required at build time.
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
# Saving a source file is a write that must not be able to truncate it: a
# temp-file + fsync + rename leaves either the old bytes or the new ones.
atomic-file = { path = "../../crates/system/atomic-file" }
# `file://` URI construction for the language server's workspace root, using
# the same crate `ui::portal` parses picked URIs with, so the round-trip is
# exact for paths containing spaces and non-ASCII.
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
