[package]
name = "code_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "code_editor"
path = "src/lib.rs"

[[bin]]
name = "code_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The qOS resource + action model: the serializable, replayable buffer-creation
# action Code exports, plus the Resource tree it publishes to Ctrl+K.
qos-actions = { path = "../../crates/collab/actions" }
# The IDE's terminal panel embeds the real system terminal as a widget, rather
# than shipping a second, weaker terminal implementation.
terminal = { path = "../terminal" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Syntax highlighting. We use syntect purely as a tokenizer: its Sublime
# syntax definitions classify each span into a scope stack, which we map to
# a small set of OS-theme-derived colors (see `highlight.rs`). The
# `default-fancy` feature selects the pure-Rust `fancy-regex` backend so no
# C toolchain / oniguruma is required at build time.
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
