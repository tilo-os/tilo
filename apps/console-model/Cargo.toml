[package]
name = "console-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Console's record: which agent runs it shows, its verb and its effects"

# The record Console draws, as the app reads it and changes it. It has no window and no surface
# of its own; the app draws it.
#
# It depends on the resource layer and the action door, never the toolkit.

[lib]
name = "console_model"
path = "src/lib.rs"

[dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
