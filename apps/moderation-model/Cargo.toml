[package]
name = "moderation-model"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Reports and moderation decisions, kept in a workspace resource under Chat's policy"

[dependencies]
serde.workspace = true
serde_json.workspace = true
automerge.workspace = true
tilo-actions = { version = "0.1.0", path = "../../crates/core/actions" }
tilo-resource = { version = "0.1.0", path = "../../crates/core/tilo-resource" }

[dev-dependencies]
# The canonical compiled form of the surface this crate publishes.
tilo-surface-compile = { version = "0.1.0", path = "../../crates/core/tilo-surface-compile" }
tilo-resource = { path = "../../crates/core/tilo-resource", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
