[package]
# tests/*.rs are modules of tests/it.rs, not separate binaries
autotests = false
name = "discord-worker"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The Discord connector's outside worker: one gateway session, the REST calls the bridge queues, and nothing else"

[lib]
name = "discord_worker"
path = "src/lib.rs"

[[bin]]
name = "discord-worker"
path = "src/main.rs"

# The integration tests: one binary, its files included as modules by
# `tests/it.rs` (a file per binary linked the whole crate once each).
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
base64.workspace = true
blake3.workspace = true
discord-wire = { path = "../../discord-model" }
futures-util = { workspace = true, features = ["sink"] }
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-connector = { path = "../../../crates/integrations/connector" }
tilo-net = { path = "../../../crates/platform/tilo-net", features = ["http"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
# Discord's REST rate limits: buckets per route and major parameter, and the
# global limit. Transport-free, so calls stay on tilo-net and its egress rule.
twilight-http-ratelimiting = "0.18.0"
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "getrandom", "ring", "rustls-bring-your-own-connector"] }
url.workspace = true
zeroize.workspace = true
tilo-clock = { path = "../../../crates/platform/tilo-clock" }
# Voice: transport encryption (Discord's rtpsize AEAD modes, sealed in
# tilo-seal), DAVE end-to-end encryption, and Opus to mix several Tilo
# speakers into one stream. libopus is built from source by opusic-sys (cmake).
davey.workspace = true
getrandom.workspace = true
opus = "0.4"
tilo-seal = { path = "../../../crates/system/tilo-seal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
fake-discord = { path = "../../../tools/fake-discord" }
tempfile.workspace = true
collab-types = { path = "../../../crates/collab/collab-types" }
# `relay`: the loopback packet relay the bridge's host takes as its home.
tilo-test-env = { path = "../../../tools/test-env", features = ["iroh-relay"] }
tokio = { workspace = true, features = ["test-util"] }
tilo-secrets = { path = "../../../crates/platform/tilo-secrets" }
# The bridge end to end: its program on a workspace's host, with this binary.
tilo-server = { path = "../../../crates/server/tilo-server", features = ["agents"] }
# The bridge's host, and its Chat read and changed through its own package.
tilo-workspace-service = { path = "../../../crates/server/tilo-workspace-service", features = ["agents", "test-support"] }
tilo-server-protocol = { path = "../../../crates/server/tilo-server-protocol" }
# The workspace's live session a member's device takes part in the bridged call on.
tilo-live = { path = "../../../crates/collab/tilo-live", features = ["relay"] }
tilo-agent-session = { path = "../../../crates/agent/agent-session" }
tilo-automation = { path = "../../../crates/collab/automation" }
tilo-user-identity = { path = "../../../crates/collab/tilo-user-identity" }
ui = { package = "tilo-app", path = "../../../crates/sdk/tilo-app" }
tilo-reference = { path = "../../../crates/collab/reference" }
discord = { path = ".." }
automerge.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
iroh.workspace = true
tilo-automerge.workspace = true
tilo-automerge-isolate.workspace = true

[lints]
workspace = true
