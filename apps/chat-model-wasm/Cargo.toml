[package]
name = "chat-model-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Chat model as the WebAssembly module its package carries: the chat resource's verbs, applied by any device holding the workspace's keys."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
chat-model = { path = "../chat-model" }
tilo-model-guest = { path = "../../crates/sdk/tilo-model-guest" }

[lints]
workspace = true
