[package]
name = "launcher-app"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Search: the desktop's launcher, an app the shell hosts"

[lib]
name = "launcher_app"
path = "src/lib.rs"

[[bin]]
name = "launcher"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
