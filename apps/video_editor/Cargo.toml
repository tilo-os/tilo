[package]
name = "video_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "video_editor"
path = "src/lib.rs"

[[bin]]
name = "video_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The shared qOS media layer: the FUSE-aware `Source`, and the `MediaEngine`
# that decodes a frame at the playhead. Its default (no-decode) build carries no
# gstreamer dependency, so the default editor build stays hermetic; enabling
# this crate's `decode` feature turns on `media/decode` for a real pipeline.
media = { path = "../../crates/media" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

# Real host-native file picking via the XDG FileChooser portal (ashpd). Off by
# default so the hermetic build needs no D-Bus / tokio; the picker resolves a
# `file://` URI (local or `/var/workspace` FUSE) into a real imported clip.
# Same pins as the other portal-using apps so a single copy resolves.
ashpd = { version = "0.9", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Real export muxing runs through GStreamer (`appsrc → encoder → mux → filesink`),
# linked ONLY under the `gst` feature so the default fleet build (and `--shots`)
# compiles without the gstreamer-1.0 dev headers present. Same pins as
# `crates/media` so no second gstreamer copy resolves. ffmpeg is not a dep.
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }

[features]
default = []
# Real decode for the preview canvas, via the shared `media::MediaEngine`
# (GStreamer `playbin`). The default fleet build (and `--shots`) leaves this off
# so the preview shows a representative composited frame without a decoder — the
# headless CI box needs no media pipeline. With it on, the preview decodes the
# real frame of the clip under the playhead (seeking to its source time) and
# blits it; an un-hydrated reference falls back to the representative frame.
decode = ["media/decode"]
# Real export through GStreamer (encode + mux to a real file). Heavier; needs
# the gstreamer-1.0 dev headers, so it stays opt-in and off the default build.
gst = ["dep:gstreamer", "dep:gstreamer-app"]
# Real host-native file import via the XDG desktop portal.
portal = ["dep:ashpd", "dep:tokio"]
