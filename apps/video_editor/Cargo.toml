[package]
name = "video_editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "video_editor"
path = "src/lib.rs"

[[bin]]
name = "video_editor"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true

# Real decode/preview/export runs through GStreamer, linked ONLY under the
# `gst` feature so the default fleet build (and `--shots`) compiles without
# the gstreamer-1.0 dev headers present. ffmpeg is intentionally NOT a dep.
gstreamer = { workspace = true, optional = true }

[features]
default = []
# Real H.264 decode for the preview canvas, via `ui::VideoPlayer` (openh264).
# The default fleet build (and `--shots`) leaves this off so the preview shows
# a representative composited frame without touching a decoder — the headless
# CI box has no real media pipeline. Turning it on lets the preview decode the
# nearest keyframe of the clip under the playhead when its bytes are hydrated.
decode = []
# Real encode/decode through GStreamer (export muxing). Heavier; needs the
# gstreamer-1.0 dev headers, so it stays opt-in and off the default build.
gst = ["dep:gstreamer"]
