[package]
name = "video_editor"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "video_editor"
path = "src/lib.rs"

[[bin]]
name = "video_editor"
path = "src/main.rs"

# Media import always goes through the shared host file chooser
# (`ui::portal`), so its `portal` feature is on unconditionally: picking a file
# is a pure-Rust portal round-trip that compiles and links in every build
# (including hermetic CI / `--shots`) — at runtime it reaches the host desktop's
# chooser, and a headless box with no portal simply never exercises it. Import
# is a file-pick plus metadata probe; it needs no GStreamer, so it must never be
# gated behind the decode/export features.
[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { path = "../../ui", features = ["portal"] }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# Real decode/preview/export runs through GStreamer, linked ONLY under the
# `gst` feature so the default fleet build (and `--shots`) compiles without
# the gstreamer-1.0 dev headers present. ffmpeg is intentionally NOT a dep.
gstreamer = { workspace = true, optional = true }
media = { path = "../../crates/media" }
gstreamer-app = { version = "0.24", optional = true }

[features]
thin = ["dep:runtime-dylib"]
# The preview canvas decoding real frames is the editor's core, so `decode`
# ships on by default: the preview decodes the real frame of the clip under the
# playhead through the shared `media::MediaEngine` (GStreamer `playbin`). The
# `--shots` path renders the representative composited frame at runtime (an
# un-hydrated reference always falls back to it), so the screenshot path stays
# hermetic with the decoder compiled in. Full `gst` export (encode + mux) stays
# opt-in — it is heavy and off the normal preview path.
default = ["decode"]
# Real decode for the preview canvas, via the shared `media::MediaEngine`.
decode = ["media/decode"]
# Real export through GStreamer (encode + mux to a real file). Heavier; needs
# the gstreamer-1.0 dev headers, so it stays opt-in and off the default build.
gst = ["dep:gstreamer", "dep:gstreamer-app"]

[lints]
workspace = true
