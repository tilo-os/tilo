[package]
name = "weather"
version = "0.1.0"
edition = "2024"

[lib]
name = "weather"
path = "src/lib.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# One owner for ~/.config/qos/settings.json — path resolution, forgiving reads
# and non-destructive writes, shared with the Settings app and the compositor.
settings-store = { path = "../../crates/system/settings-store" }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
# Networking — used ONLY by the live event loop (see api.rs). The
# `--shots` offscreen path never touches the network; it renders bundled
# sample data so a screenshot is fully populated offline.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
