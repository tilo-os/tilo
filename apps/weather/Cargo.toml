[package]
name = "weather"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "weather"
path = "src/lib.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# One owner for ~/.config/qos/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
ui = { package = "qos-app", path = "../../crates/app/qos-app" }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# Networking — used ONLY by the live event loop (see api.rs). The
# `--shots` offscreen path never touches the network; it renders bundled
# sample data so a screenshot is fully populated offline.
reqwest = { workspace = true, features = ["json", "rustls-tls", "blocking"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros"] }
chrono = { workspace = true, features = ["std", "clock"] }

[lints]
workspace = true
