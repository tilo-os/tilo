[package]
name = "weather"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

# The app uses the protocol types through ui's canonical re-export.
[package.metadata.cargo-machete]
ignored = ["tilo-actions"]

[lib]
name = "weather"
path = "src/lib.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# One owner for ~/.config/tilo/settings.json.
settings-store = { path = "../../crates/system/settings-store" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# Networking is used only by the live event loop; shots render bundled sample
# data without opening a connection.
reqwest = { workspace = true, features = ["json", "blocking"] }
tilo-net = { path = "../../crates/system/tilo-net", features = ["blocking"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros"] }
chrono = { workspace = true, features = ["std", "clock"] }

[lints]
workspace = true
