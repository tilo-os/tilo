[package]
name = "weather"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "weather"
path = "src/lib.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-clock = { path = "../../crates/platform/tilo-clock" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
# Networking is used only by the live event loop; shots render bundled sample
# data without opening a connection.
tilo-net = { path = "../../crates/platform/tilo-net", features = ["http"] }
chrono = { workspace = true, features = ["std", "clock"] }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }
tilo-history = { path = "../../crates/sdk/tilo-history" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
