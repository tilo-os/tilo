[package]
name = "disk-usage-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Disk Usage Analyzer's resources: the analyzer's record and the folders each device analyzed lately"

# The resources Disk Usage keeps and an agent reads through the same verbs. They
# have no window and no surface of their own; the app draws them.
#
# It depends on the resource layer and the action API, never the toolkit. The
# scan itself is the app's: what it reads is the device's own disk.

[lib]
name = "disk_usage_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
