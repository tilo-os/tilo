[package]
name = "disks-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Disks' record: the names a person gives their storage devices, and the verb that changes them"

# The resource Disks keeps and an agent reads through the same verb. It has no
# window and no surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit. The
# machine's drives are the app's own probe: only the names a person gives them
# travel in the workspace.

[lib]
name = "disks_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
