[package]
name = "store"
version = "0.1.0"
edition = "2024"
description = "qOS app store — surfaces qOS registry entries and legacy Flatpak apps in one list."

[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
registry-types = { path = "../../crates/packaging/registry-types" }
runtime = { path = "../../crates/runtime/runtime" }
runtime-portal = { path = "../../crates/runtime/runtime-portal" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
dirs = "6.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"
thiserror = "1"
hex = "0.4"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Explicit rustls provider — the tree carries both ring + aws-lc-rs and
# rustls 0.23 won't auto-disambiguate. Matches the sibling maps / feeds apps.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
