[package]
name = "store"
version = "0.1.2"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo app store — surfaces Tilo registry entries and legacy Flatpak apps in one list."


[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
lru.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
# The registry list, its client and its trust classification. Shared
# with the desktop's search box, which offers the same registries' apps
# — one definition, so the two cannot drift into disagreeing about
# whether an entry verifies.
app-cli = { path = "../../crates/packaging/app-cli" }
# The app host's client side only. Its daemon (`service`) is the privileged
# door this app talks to over the launcher-issued capability, not code it
# links; with it, the content store and the filesystem would also land in
# the shared runtime every app maps.
app-host = { path = "../../crates/packaging/app-host", default-features = false }
# The installed-package row the app host lists.
package-store = { path = "../../crates/packaging/package-store" }
registry-types = { path = "../../crates/packaging/registry-types" }
runtime-identity = { path = "../../crates/runtime/runtime-identity" }
blake3.workspace = true
getrandom.workspace = true
rand_core.workspace = true
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
thiserror.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
base64.workspace = true
flate2.workspace = true
desktop-entry = { package = "tilo-desktop-entry", path = "../../crates/system/desktop-entry" }
app-host = { path = "../../crates/packaging/app-host", default-features = false, features = ["test-support"] }
capnp.workspace = true
tempfile.workspace = true
tilo-test-env = { path = "../../crates/dev/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
