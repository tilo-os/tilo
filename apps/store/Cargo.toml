[package]
name = "store"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "qOS app store — surfaces qOS registry entries and legacy Flatpak apps in one list."

[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The registry list, its client and its trust classification. Shared
# with the desktop's search box, which offers the same registries' apps
# — one definition, so the two cannot drift into disagreeing about
# whether an entry verifies.
app-catalogue = { path = "../../crates/packaging/app-catalogue" }
registry-types = { path = "../../crates/packaging/registry-types" }
runtime = { path = "../../crates/runtime/runtime" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
thiserror.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
# Explicit rustls provider — the tree carries both ring + aws-lc-rs and
# rustls 0.23 won't auto-disambiguate. Matches the sibling maps / feeds apps.
rustls.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
