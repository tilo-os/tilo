[package]
name = "store"
version = "0.1.2"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Tilo app store — surfaces Tilo registry entries and Linux Flatpak apps in one list."


[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]
# Reach the catalogue (app-catalogue) through its engine library in the runtime
# bundle (libtilo_app_process_engine.so, crates/engines/loadable/app-process)
# instead of linking it. The release collection enables it
# (dist/apps/app-collections.toml); a `thin` build without it (`tilo-app dev`)
# links it statically, because an engine library links only through
# tools/ci/rustc-thin-app-wrapper.sh.
runtime-engine = ["thin", "tilo-app-process-engine/thin"]

[dependencies]
lru.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-files = { path = "../../crates/platform/tilo-files" }
runtime-dylib = { path = "../../crates/sdk/runtime-dylib", optional = true }
tilo-app-process-engine = { path = "../../crates/engines/loadable/app-process", optional = true }
# The registry list, its client and its trust classification. Shared
# with the desktop's search box, which offers the same registries' apps
# — one definition, so the two cannot drift into disagreeing about
# whether an entry verifies.
app-cli = { path = "../../crates/os/app-cli" }
# The rows this device's package cache publishes, and what an installed
# package's manifest says about it.
package-actions = { path = "../../crates/core/package-actions" }
# The name an installed package's id reads as.
package-store = { path = "../../crates/core/package-store" }
# The package format: a handed `.tapp` is reviewed through its one decoder.
tilo-app-package = { path = "../../crates/core/tilo-app-package" }
# The hash of a package's surface, which the workspace records for a version.
app-registry = { path = "../../crates/core/app-registry" }
# Flathub's cached AppStream metadata, shared with desktop search. The block
# list comes through `ui::registry`.
app-catalogue = { path = "../../crates/core/app-catalogue" }
# The machine's own desktop entries, which name the Flatpak apps it has installed.
desktop-entry = { package = "tilo-desktop-entry", path = "../../crates/desktop/desktop-entry" }
tilo-app-id.workspace = true
blake3.workspace = true
getrandom.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
thiserror.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
tilo-net = { path = "../../crates/platform/tilo-net", features = ["blocking"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
tilo-test-env = { path = "../../tools/test-env" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true
