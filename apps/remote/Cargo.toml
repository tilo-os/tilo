[package]
name = "remote"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "remote"
path = "src/lib.rs"

[[bin]]
name = "remote"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
tilo-paths = { path = "../../crates/platform/tilo-paths" }
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
# The Tilo ACTION model: the saved-connection store is the app's shared-document
# state, so add/edit/rename/favorite/delete of a profile are replayable actions
# the shell's Ctrl+K palette dispatches — the same ones the on-screen affordances do.
tilo-actions = { path = "../../crates/collab/actions" }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
tilo-callstream = { path = "../../crates/collab/tilo-callstream" }
# Tilo-device connections store the target's endpoint id; only the key types
# are needed, not the iroh transport.
iroh-base = { workspace = true, features = ["key"] }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Keep compression and use the workspace's audited ring transport backend, but do not compile
# russh's optional RustCrypto RSA signer: it remains vulnerable to the remotely
# observable Marvin timing attack. Modern Ed25519/ECDSA keys and passwords stay
# supported.
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2"] }
tokio.workspace = true
vte = "0.15.0"
des = "0.9"
workspace-hack = { version = "0.1" }

[dev-dependencies]
tempfile.workspace = true
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }
tilo-test-env = { path = "../../crates/dev/test-env" }

[lints]
workspace = true
