[package]
name = "remote"
version = "0.1.0"
edition = "2024"

[lib]
name = "remote"
path = "src/lib.rs"

[[bin]]
name = "remote"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
# The qOS ACTION model: the saved-connection store is the app's shared-document
# state, so add/edit/rename/favorite/delete of a profile are replayable actions
# the shell's Ctrl+K palette dispatches — the same ones the on-screen affordances do.
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
russh = "0.63.1"
tokio.workspace = true
vte = "0.15.0"
des = "0.8"

[dev-dependencies]
# Serialises tests that exercise the process-wide clipboard, so they never
# race each other under cargo's default parallel runner.
serial_test.workspace = true

[lints]
workspace = true
