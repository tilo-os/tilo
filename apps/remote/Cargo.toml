[package]
name = "remote"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "remote"
path = "src/lib.rs"

[[bin]]
name = "remote"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "qos-app", path = "../../crates/app/qos-app" }
# The qOS ACTION model: the saved-connection store is the app's shared-document
# state, so add/edit/rename/favorite/delete of a profile are replayable actions
# the shell's Ctrl+K palette dispatches — the same ones the on-screen affordances do.
qos-actions = { path = "../../crates/collab/actions" }
# qOS-device sessions consume the authenticated exact-target mesh placement;
# Remote does not maintain a second host-selection implementation.
qos-relay = { path = "../../crates/hosting/qos-relay" }
runtime-collab = { path = "../../crates/runtime/runtime-collab" }
qos-callstream = { path = "../../crates/collab/qos-callstream" }
# Durable, same-directory replacement for the device-private SSH trust store.
atomic-file = { path = "../../crates/system/atomic-file" }
iroh.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true
anyhow.workspace = true
# Keep compression and the audited aws-lc transport backend, but do not compile
# russh's optional RustCrypto RSA signer: it remains vulnerable to the remotely
# observable Marvin timing attack. Modern Ed25519/ECDSA keys and passwords stay
# supported.
russh = { version = "0.63.1", default-features = false, features = ["aws-lc-rs", "flate2"] }
tokio.workspace = true
vte = "0.15.0"
des = "0.8"

[dev-dependencies]
# Serialises tests that exercise the process-wide clipboard, so they never
# race each other under cargo's default parallel runner.
serial_test.workspace = true

[lints]
workspace = true
