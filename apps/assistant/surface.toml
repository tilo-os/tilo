# Written by `tilo-app surface`; review changes like an API change.

format = 2

[[resources]]
kind = "assistant.window"
label = "Assistant window"
version = 1
shows = ["view-main-chat", "view-sub-agent", "view-supervision"]

[[resources]]
kind = "tilo.workspace.agent"
label = "Agents"
version = 1
fields = [
  { path = "agents", type = { collection = { named = "Agent" } }, stored = "keyed" },
  { path = "agents.*.id", type = "text" },
  { path = "agents.*.name", type = "text", label = true },
  { path = "agents.*.acts_for", type = "text" },
  { path = "agents.*.model", type = { option = "text" } },
  { path = "agents.*.mcp_client", type = { option = "text" } },
  { path = "agents.*.spend_limit_micros", type = { option = "int" } },
  { path = "agents.*.spent", type = { option = { named = "Spent" } }, stored = "record" },
  { path = "agents.*.spent.day", type = "text" },
  { path = "agents.*.spent.cost_micros", type = "int" },
  { path = "agents.*.state", type = { named = "AgentState" } },
  { path = "agents.*.created_at", type = "int" },
  { path = "agents.*.instruction", type = { option = "text" } },
  { path = "agents.*.sub", type = { option = { named = "Sub" } }, stored = "record" },
  { path = "agents.*.sub.started_by", type = "text" },
  { path = "agents.*.sub.job", type = "text" },
  { path = "agents.*.sub.role", type = "text" },
  { path = "agents.*.sub.kind", type = "text" },
  { path = "agents.*.sub.depth", type = "int" },
  { path = "agents.*.sub.task", type = { option = "text" } },
  { path = "agents.*.sub.stands", type = { named = "Stands" } },
  { path = "agents.*.sub.since", type = "int" },
  { path = "agents.*.sub.line", type = "text" },
  { path = "agents.*.sub.notes", type = { list = { named = "Note" } } },
  { path = "agents.*.sub.produced", type = { list = { named = "Produced" } } },
  { path = "agents.*.sub.coding", type = { option = { named = "Coding" } }, stored = "record" },
  { path = "agents.*.sub.coding.harness", type = "text" },
  { path = "agents.*.sub.coding.harness_name", type = "text" },
  { path = "agents.*.sub.coding.repository", type = "text" },
  { path = "agents.*.sub.coding.directory", type = "text" },
  { path = "agents.*.sub.coding.branch", type = "text" },
  { path = "agents.*.sub.coding.base", type = "text" },
  { path = "agents.*.sub.coding.session", type = "text" },
  { path = "agents.*.sub.coding.process", type = { option = { named = "CodingProcess" } }, stored = "record" },
  { path = "agents.*.sub.coding.process.started_ms", type = "int" },
  { path = "agents.*.sub.coding.process.ended_ms", type = { option = "int" } },
  { path = "agents.*.sub.coding.process.ended", type = "text" },
  { path = "agents.*.sub.coding.process.exit", type = { option = "int" } },
  { path = "agents.*.sub.coding.process.words", type = "text" },
  { path = "agents.*.sub.coding.process.stopped_by", type = "text" },
  { path = "agents.*.sub.coding.spent_micros", type = "int" },
  { path = "agents.*.sub_depth", type = { option = "int" } },
  { path = "agents.*.sub_at_once", type = { option = "int" } },
]

[[resources.verbs]]
id = "create-agent"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "id", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "model", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "mcp_client", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "set-agent-spend-limit"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "limit_micros", type = { option = "int" }, required = false, schema = { type = ["integer", "null"], minimum = 0 } },
]

[[resources.verbs]]
id = "record-agent-spend"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "day", type = "text", required = true, schema = { type = "string" } },
  { name = "cost_micros", type = "int", required = true, schema = { type = "integer", minimum = 0 } },
]

[[resources.verbs]]
id = "rename-agent"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "name", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

[[resources.verbs]]
id = "set-agent-model"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "model", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "set-agent-instruction"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "instruction", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "retire-agent"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "start-sub-agent"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string" } },
  { name = "job", type = "text", required = true, schema = { type = "string" } },
  { name = "role", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "instruction", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "kind", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "model", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "task", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "id", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "coding", type = { option = { named = "NewCoding" } }, required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { base = { type = ["string", "null"] }, branch = { type = ["string", "null"] }, harness = { type = ["string", "null"] }, repository = { type = "string" } }, required = ["repository"] } },
]

[[resources.verbs]]
id = "note-sub-agent"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "text", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

[[resources.verbs]]
id = "stop-sub-agent"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "sub-agent-stands"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "stands", type = { named = "Stands" }, required = true, schema = { oneOf = [{ type = "string", const = "working" }, { type = "string", const = "needs_person" }, { type = "string", const = "done" }, { type = "string", const = "failed" }, { type = "string", const = "stopped" }] } },
  { name = "line", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "sub-agent-produced"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "kind", type = "text", required = true, schema = { type = "string" } },
  { name = "label", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "url", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "at", type = { option = { named = "ProducedAt" } }, required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { app = { type = "string" }, document = { type = "string" }, resource = { type = "string" } }, required = ["app", "resource"] } },
]

[[resources.verbs]]
id = "sub-agent-coding"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "process", type = { option = { named = "CodingProcess" } }, required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { ended = { type = "string" }, ended_ms = { type = ["integer", "null"] }, exit = { type = ["integer", "null"], maximum = 2147483647, minimum = -2147483648 }, started_ms = { type = "integer" }, stopped_by = { type = "string" }, words = { type = "string" } }, required = ["started_ms"] } },
  { name = "session", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "spent_micros", type = { option = "int" }, required = false, schema = { type = ["integer", "null"], minimum = 0 } },
  { name = "harness", type = { option = { named = "CodingHarness" } }, required = false, schema = { type = ["object", "null"], additionalProperties = false, properties = { name = { type = "string" }, id = { type = "string" } }, required = ["id", "name"] } },
]

[[resources.verbs]]
id = "set-sub-agent-limits"
kind = "undoable"
params = [
  { name = "agent", type = "text", required = true, schema = { type = "string" } },
  { name = "depth", type = { option = "int" }, required = false, schema = { type = ["integer", "null"], maximum = 255, minimum = 0 } },
  { name = "at_once", type = { option = "int" }, required = false, schema = { type = ["integer", "null"], maximum = 4294967295, minimum = 0 } },
]

