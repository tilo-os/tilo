name = "Agent"
fields = [
  { name = "id", type = "text" },
  { name = "name", type = "text" },
  { name = "acts_for", type = "text" },
  { name = "model", type = { option = "text" } },
  { name = "mcp_client", type = { option = "text" } },
  { name = "spend_limit_micros", type = { option = "int" } },
  { name = "spent", type = { option = { named = "Spent" } } },
  { name = "state", type = { named = "AgentState" } },
  { name = "created_at", type = "int" },
  { name = "instruction", type = { option = "text" } },
  { name = "sub", type = { option = { named = "Sub" } } },
  { name = "sub_depth", type = { option = "int" } },
  { name = "sub_at_once", type = { option = "int" } },
]

