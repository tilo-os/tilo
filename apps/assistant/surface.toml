  { name = "repository", type = "text" },
  { name = "directory", type = "text" },
  { name = "branch", type = "text" },
  { name = "base", type = "text" },
  { name = "session", type = "text" },
  { name = "process", type = { option = { named = "CodingProcess" } } },
  { name = "spent_micros", type = "int" },
]

