[package]
name = "calendar-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The calendar.calendar resource: a workspace's events, tasks and projects, the notes beside them, and the verbs that change them"

# The resource Calendar keeps and an agent works. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer and the action API, never the toolkit.

[lib]
name = "calendar_model"
path = "src/lib.rs"

[dependencies]
automerge.workspace = true
# A fingerprint of what a server holds, so an unchanged event is owed nothing.
fnv.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tilo-document = { path = "../../crates/sdk/tilo-document" }
tilo-formats = { path = "../../crates/ui/tilo-formats" }
# The person's local time, read the one way a device and a page both answer.
tilo-clock = { path = "../../crates/platform/tilo-clock", features = ["local"] }
tilo-resource = { path = "../../crates/sdk/tilo-resource" }
# The iCalendar format and the event, task and calendar shapes an entry is
# read into and written from.
tilolang-calendar = { path = "../../crates/integrations/tilolang-calendar", default-features = false }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[dev-dependencies]
tilo-resource = { path = "../../crates/sdk/tilo-resource", features = ["test-support"] }
# `scenario!`: one test function holds the cases of one subject.
tilo-test-env = { path = "../../tools/test-env" }

[lints]
workspace = true
