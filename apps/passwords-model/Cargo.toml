[package]
name = "passwords-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Passwords' resource for encrypted workspace vault entries"

# The resource Passwords publishes and an agent reaches through the same verbs.
# It has no window and no surface of its own; the app draws it.
#
# Encrypting, unlocking and showing the vault stay in the app.

[lib]
name = "passwords_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
