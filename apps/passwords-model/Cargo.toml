[package]
name = "passwords-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Passwords' resource: the empty document that says the vault is this device's own and no secret syncs"

# The resource Passwords publishes and an agent reaches through the same verbs.
# It has no window and no surface of its own; the app draws it.
#
# It holds no secret material, in the clear or otherwise: the vault is the
# device's own encrypted store, and no login, key or code is in the document.
# Encrypting, unlocking, storing and showing the vault stay in the app.

[lib]
name = "passwords_model"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tilo-resource = { path = "../../crates/sdk/tilo-resource" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
