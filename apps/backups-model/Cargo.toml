[package]
name = "backups-model"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "The backups.workspace record: the retention policy every device follows, and the catalog the window shows"

# The resource Backups draws, as the app reads it and changes it. It has no window and no
# surface of its own; the app draws it.
#
# It depends on the resource layer, never the toolkit: the repository it reads is the app's
# own native side.

[lib]
name = "backups_model"
path = "src/lib.rs"

[dependencies]
jiff.workspace = true
serde_json.workspace = true
tilo-resource = { path = "../../crates/core/tilo-resource" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
