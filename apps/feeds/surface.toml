# Written by `tilo-app surface`; review changes like an API change.

format = 2

[[resources]]
kind = "feeds.library"
label = "Feeds"
version = 2
fields = [
  { path = "folders", type = { collection = { named = "Folder" } }, stored = "collection" },
  { path = "folders.*.name", type = "text", label = true },
  { path = "folders.*.collapsed", type = "bool" },
  { path = "feeds", type = { collection = { named = "Feed" } }, stored = "collection" },
  { path = "feeds.*.title", type = "text", label = true },
  { path = "feeds.*.url", type = "text", readonly = true },
  { path = "feeds.*.site_url", type = "text", readonly = true },
  { path = "feeds.*.folder", type = { option = "text" } },
  { path = "feeds.*.kind", type = { named = "FeedKind" }, readonly = true },
  { path = "feeds.*.certificate_pin", type = { option = "text" }, readonly = true },
  { path = "articles", type = { collection = { named = "Article" } }, stored = "collection" },
  { path = "articles.*.feed_id", type = "text", readonly = true },
  { path = "articles.*.title", type = "text", label = true, readonly = true },
  { path = "articles.*.author", type = "text", readonly = true },
  { path = "articles.*.url", type = "text", readonly = true },
  { path = "articles.*.published", type = "int", readonly = true },
  { path = "articles.*.summary", type = "text", readonly = true },
  { path = "articles.*.blocks", type = { list = { named = "ContentBlock" } }, readonly = true },
  { path = "articles.*.read", type = "bool" },
  { path = "articles.*.starred", type = "bool" },
  { path = "articles.*.tags", type = { set = "text" } },
]

[[resources.verbs]]
id = "add-subscription"
kind = "undoable"
params = [
  { name = "url", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
  { name = "folder", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "unsubscribe"
destructive = true
kind = "undoable"
params = [
  { name = "feed", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "mark-feed-read"
kind = "undoable"
params = [
  { name = "feed", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "mark-everything-read"
kind = "undoable"

[[resources.verbs]]
id = "new-folder"
kind = "undoable"
params = [
  { name = "name", type = "text", required = true, schema = { type = "string", minLength = 1, pattern = "\\S" } },
]

[[resources.verbs]]
id = "delete-folder"
destructive = true
kind = "undoable"
params = [
  { name = "folder", type = "text", required = true, schema = { type = "string" } },
]

[[resources.verbs]]
id = "import-subscriptions"
kind = "undoable"
params = [
  { name = "outlines", type = { list = { named = "Outline" } }, required = true, schema = { type = "array", items = { type = "object", additionalProperties = false, properties = { folder = { type = ["string", "null"] }, site_url = { type = "string" }, title = { type = "string" }, url = { type = "string" } }, required = ["title", "url"] } } },
]

[[resources.verbs]]
id = "refreshed"
kind = "undoable"
params = [
  { name = "articles", type = { list = { named = "Fetched" } }, required = true, schema = { type = "array", items = { type = "object", additionalProperties = false, properties = { author = { type = "string" }, blocks = { type = "array", items = { type = "object", additionalProperties = false, properties = { href = { type = ["string", "null"] }, kind = { type = "string", enum = ["Heading1", "Heading2", "Heading3", "Paragraph", "Bullet", "Quote", "Code", "Link", "Divider"] }, text = { type = "string" } }, required = ["kind", "text"] } }, published = { type = "integer" }, summary = { type = "string" }, title = { type = "string" }, url = { type = "string" } }, required = ["title"] } } },
  { name = "feed", type = "text", required = true, schema = { type = "string" } },
  { name = "title", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
  { name = "certificate_pin", type = { option = "text" }, required = false, schema = { type = ["string", "null"] } },
]

[[resources.verbs]]
id = "export-opml"
kind = "read"

[[resources.verbs]]
id = "reader-text-larger"
kind = "read"

[[resources.verbs]]
id = "reader-text-smaller"
kind = "read"

[[resources.verbs]]
id = "reader-font"
kind = "read"
params = [
  { name = "font", type = "text", required = true },
]

[[resources.verbs]]
id = "reader-paper"
kind = "read"
params = [
  { name = "paper", type = "text", required = true },
]

[[resources.types]]
name = "Article"
fields = [
  { name = "feed_id", type = "text" },
  { name = "title", type = "text" },
  { name = "author", type = "text" },
  { name = "url", type = "text" },
  { name = "published", type = "int" },
  { name = "summary", type = "text" },
  { name = "blocks", type = { list = { named = "ContentBlock" } } },
  { name = "read", type = "bool" },
  { name = "starred", type = "bool" },
  { name = "tags", type = { set = "text" } },
]

[[resources.types]]
name = "BlockKind"
cases = [
  { name = "heading1" },
  { name = "heading2" },
  { name = "heading3" },
  { name = "paragraph" },
  { name = "bullet" },
  { name = "quote" },
  { name = "code" },
  { name = "link" },
  { name = "divider" },
]

[[resources.types]]
name = "ContentBlock"
fields = [
  { name = "kind", type = { named = "BlockKind" } },
  { name = "text", type = "text" },
  { name = "href", type = { option = "text" } },
]

[[resources.types]]
name = "Feed"
fields = [
  { name = "title", type = "text" },
  { name = "url", type = "text" },
  { name = "site_url", type = "text" },
  { name = "folder", type = { option = "text" } },
  { name = "kind", type = { named = "FeedKind" } },
  { name = "certificate_pin", type = { option = "text" } },
]

[[resources.types]]
name = "FeedKind"
cases = [
  { name = "rss" },
  { name = "atom" },
  { name = "json" },
  { name = "gemini" },
]

[[resources.types]]
name = "Fetched"
fields = [
  { name = "title", type = "text" },
  { name = "author", type = "text" },
  { name = "url", type = "text" },
  { name = "published", type = "int" },
  { name = "summary", type = "text" },
  { name = "blocks", type = { list = { named = "ContentBlock" } } },
]

[[resources.types]]
name = "Folder"
fields = [
  { name = "name", type = "text" },
  { name = "collapsed", type = "bool" },
]

[[resources.types]]
name = "Outline"
fields = [
  { name = "title", type = "text" },
  { name = "url", type = "text" },
  { name = "site_url", type = "text" },
  { name = "folder", type = { option = "text" } },
]

