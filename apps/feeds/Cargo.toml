[package]
name = "feeds"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "feeds"
path = "src/lib.rs"

[[bin]]
name = "feeds"
path = "src/main.rs"

[features]
thin = ["dep:runtime-dylib"]

[dependencies]
quick-xml.workspace = true
fnv.workspace = true
tilo-files = { path = "../../crates/platform/tilo-files" }
hex.workspace = true
blake3.workspace = true
runtime-dylib = { path = "../../crates/runtime/runtime-dylib", optional = true }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
tilo-automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# --- Feed reading stack ---------------------------------------------------
# RSS/Atom/JSON-feed parsing; pure-Rust TLS avoids a
# system OpenSSL build dep inside the distrobox.
feed-rs = "2.4"
# HTTP everywhere, and the raw TLS socket gemini:// needs on the desktop.
tilo-net = { path = "../../crates/platform/tilo-net", features = ["http", "sockets"] }
# org.freedesktop.portal.FileChooser (via ashpd) — an app never draws its own
# file picker; OPML import goes through the host portal so the compositor's
# picker + per-cluster sandbox prompt is the security boundary. The D-Bus call
# runs off the UI thread on its own small Tokio runtime and the chosen path is
# handed back over a channel.
chrono = { workspace = true, features = ["clock", "std", "alloc"] }

[dev-dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
