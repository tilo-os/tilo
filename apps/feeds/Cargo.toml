[package]
name = "feeds"
version = "0.1.0"
edition = "2024"

[lib]
name = "feeds"
path = "src/lib.rs"

[[bin]]
name = "feeds"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui" }
automerge = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vello = "0.9"
winit = "0.30.13"
taffy = "0.10.1"
anyhow = "1.0"

# --- Feed reading stack ---------------------------------------------------
# Real RSS/Atom/JSON-feed parsing; pure-Rust TLS so we don't drag in a
# system OpenSSL build dep inside the distrobox.
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "sync",
    "macros",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }
# Raw TLS for the gemini:// fetcher (TOFU, accepts self-signed certs).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
