[package]
name = "feeds"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "feeds"
path = "src/lib.rs"

[[bin]]
name = "feeds"
path = "src/main.rs"

[dependencies]
ui = { path = "../../ui", features = ["portal"] }
qos-actions = { path = "../../crates/collab/actions" }
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vello.workspace = true
winit.workspace = true
taffy.workspace = true

# --- Feed reading stack ---------------------------------------------------
# Real RSS/Atom/JSON-feed parsing; pure-Rust TLS so we don't drag in a
# system OpenSSL build dep inside the distrobox.
feed-rs = "2.4"
reqwest = { workspace = true, features = ["rustls-tls", "gzip", "brotli"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# org.freedesktop.portal.FileChooser (via ashpd) — an app never draws its own
# file picker; OPML import goes through the host portal so the compositor's
# picker + per-cluster sandbox prompt is the security boundary. The D-Bus call
# runs off the UI thread on its own small Tokio runtime and the chosen path is
# handed back over a channel.
chrono = { workspace = true, features = ["clock", "std", "alloc"] }
# Raw TLS for the gemini:// fetcher (TOFU, accepts self-signed certs).
tokio-rustls.workspace = true

[lints]
workspace = true
