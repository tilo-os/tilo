[package]
name = "qos-runtime-identity"
version = "0.1.0"
edition = "2024"

# qOS runtime — user-identity loader. Reads the on-disk identity
# record the launcher points at via the QOS_USER_IDENTITY env var,
# exposes an ergonomic `SigningIdentity` that apps can use to sign
# collab-op / attestation payloads without knowing the on-disk
# format.
#
# In single-device (1-of-1) mode signing is done locally via
# ed25519-dalek. Threshold-mode (t > 1) signing requires a
# multi-device orchestrator and returns
# NotAvailable::ThresholdSigningNotSupported — the intended v1
# UX is that only the primary device signs directly and secondary
# devices use the FROST round-trip via `qos-threshold-identity`.

[lib]
name = "qos_runtime_identity"
path = "src/lib.rs"

[dependencies]
qos-runtime-portal = { path = "../qos-runtime-portal" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ed25519-dalek = { version = "2", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
