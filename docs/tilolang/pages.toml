# The tilolang and app-builder documentation, published at https://tilolang.dev/docs/ and,
# from this same list, at https://docs.tilo.so/tilolang/.
#
# Same format as docs/developers/pages.toml (tools/docs/developer_docs.py): the pages stay
# where they are in this repository, and this list chooses which of them are published, in
# what order and under which address. A site that publishes the book somewhere else exports
# it with `--at ORIGIN/BASE/`, so both sites carry the same pages from the same files.

title = "tilolang docs"
base = "/docs/"
origin = "https://tilolang.dev"
repository = "https://code.tilo.so/tilo/tilo"
related_manifests = ["docs/developers/pages.toml"]

