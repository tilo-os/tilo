[package]
name = "qos-format-host"
version = "0.1.0"
edition = "2021"
description = "qOS format-provider router daemon. Hosts WASM Component Model providers via wasmtime and serves a Cap'n Proto RPC interface."

[dependencies]
qos-format-provider-wit = { path = "../qos-format-provider-wit" }

# Wasmtime 46 ships component-model + the on-disk compilation cache out of the
# box. We rely on epoch-based interruption + ResourceLimiter for per-call
# wallclock + memory caps.
wasmtime = { version = "46", default-features = false, features = [
    "cranelift",
    "component-model",
    "cache",
    "runtime",
    "std",
    "addr2line",
    "demangle",
    "parallel-compilation",
    "wat",
] }
wasmtime-wasi = { version = "46" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Cap'n Proto RPC for the on-disk router socket. capnp 0.26 is the latest
# stable release as of mid-2026, matching capnp-rpc 0.26.
capnp = "0.26"
capnp-rpc = "0.26"
capnp-futures = "0.26"

serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
parking_lot = "0.12"
notify = "6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
capnpc = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wat = "1"
