[package]
name = "qos-format-host"
version = "0.1.0"
edition = "2021"
description = "qOS format-provider router daemon. Hosts WASM Component Model providers via wasmtime and serves a Cap'n Proto RPC interface."

[dependencies]
qos-format-provider-wit = { path = "../qos-format-provider-wit" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
