# Release binary size budgets, in MiB. tools/check-binary-size.sh fails a
# build that exceeds one.
#
# These are static release builds. The ~2 MB figure in the README is the
# thin build (crates/packaging/hello/build-thin.sh), where the SDK is a
# shared library from the runtime bundle rather than linked into each
# binary. That number is not what this file measures.
#
# Set at 15% over the measured size when the gate was added, rounded up to
# the next MiB. Raising one is a decision, so it belongs in a diff.

[budgets]
