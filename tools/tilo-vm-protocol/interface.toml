# Written by `python3 tools/policy/check_interfaces.py write` from the code;
# review a change here like an API change (docs/architecture/compatibility.md).
# Everything above [schema] is authored; [schema] and `version` are written.

# Host CLI `tilo-vm` and guest daemon `tilo-vmd`: newline-delimited JSON-RPC over
# `ssh <vm> tilo-vmd rpc`. The daemon outlives the host tool that made the VM
# (a disk of an older main keeps its own daemon), so the two sides are
# separately updated: a hello at another version is answered with the daemon's
# and every other method is refused.
name = "vm"
version = 10
version_const = "tools/tilo-vm-protocol/src/lib.rs:PROTOCOL_VERSION"
encoding = "json"
sources = [
  "tools/tilo-vm-protocol/src/lib.rs",
  "tools/tilo-vm-protocol/src/display.rs",
  "tools/tilo-vm-protocol/src/input.rs",
  "tools/tilo-vm-protocol/src/disk_unlock.rs",
  "tools/tilo-vm-protocol/src/manifest.rs",
  "tools/tilo-vm-protocol/src/profile.rs",
  "tools/tilo-vm-protocol/src/layer_hash.rs",
]
roots = [
  "RequestEnvelope",
  "ResponseEnvelope",
  "HelloResult",
  "StatusResult",
  "AccountCreateResult",
  "AccountInfo",
  "ApplyResult",
  "AccountRmResult",
  "AccountShowResult",
  "LayerUploadBeginResult",
  "LayerUploadChunkResult",
  "LayerImportResult",
  "LayerInfo",
  "UserspaceResult",
  "LogsResult",
  "SeatResult",
  "ShotResult",
  "ControlResult",
  "GcResult",
  "InputResult",
  "AppInstallResult",
  "BootConfirmResult",
  "AwakeLease",
  "NetworkWakeStatus",
  "DeviceUnlockEnrolResult",
]

[opaque]
"Value" = "any JSON value (serde_json::Value)"

