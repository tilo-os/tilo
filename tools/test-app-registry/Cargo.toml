[package]
name = "test-app-registry"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A signed app registry on loopback that offers newer versions of an installed app, for booted-image update checks."

[[bin]]
name = "tilo-test-registry"
path = "src/main.rs"

[dependencies]
package-store = { package = "tilo-package-store", path = "../../crates/core/package-store" }
registry-types = { package = "tilo-registry-types", path = "../../crates/core/registry-types" }
tilo-app-package = { path = "../../crates/core/tilo-app-package" }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }


[lints]
workspace = true
