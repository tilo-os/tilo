# Cargo packages whose code reads repository files outside their directory.
# A change to an input tests the whole package, unless every changed input is
# listed in the entry's optional `scope`: then only the scope's `filter`
# (a nextest filterset) within its `test` target runs for that package.

[[cargo]]
package = "tilo-ui"
# The design and spacing audits ratchet every app and shell source file; the
# launcher audit reads each app's main.rs and the framework launcher.
# Typography visual regression #[path]-includes the shared gallery showcase
# builder that lives with the ui-examples scenarios.
inputs = [
  "apps/*.rs", "apps/*/tilo-app.toml", "crates/session/shell/src/*.rs",
  "crates/sdk/tilo-app/src/framework/app.rs",
  "vendor/winit/src/platform_impl/quit_request.rs",
  "crates/dev/ui-examples/examples/common/gallery_scene.rs",
]
readers = [
  "crates/sdk/ui-core/src/app/close_admission.rs",
  "crates/sdk/ui-core/tests/support/ratchet.rs",
  "crates/sdk/ui-core/tests/typography_visual_regression.rs",
]
# App, shell and framework sources are read only by the look ratchets in the
# `it` target. A change confined to them runs those ratchets, not the whole
# toolkit suite; the vendored quit request is compiled into the library, so a
# change there still runs everything.
scope = { inputs = [
  "apps/*.rs", "apps/*/tilo-app.toml", "crates/session/shell/src/*.rs",
  "crates/sdk/tilo-app/src/framework/app.rs",
], test = "it", filter = "test(/^design_token_audit::/) | test(/^spacing_token_audit::/) | test(/^typography_token_audit::/) | test(/^copy_audit::/)" }

[[cargo]]
package = "ui-examples"
# Gallery shots render with the toolkit's checked-in typography fixture fonts.
inputs = ["crates/sdk/ui-core/assets/fonts/"]
readers = ["crates/dev/ui-examples/examples/gallery_shots.rs"]

[[cargo]]
package = "tilo-app-package"
inputs = ["apps/*/Cargo.toml", "apps/*/tilo-app.toml"]
readers = [
  "crates/packaging/tilo-app-package/tests/app_manifests.rs",
  "crates/packaging/tilo-app-package/src/validate.rs",
]

[[cargo]]
package = "launcher"
inputs = ["apps/*/tilo-app.toml", "os/usr/lib/tilo/jit-entitled.conf", "os/usr/lib/tilo/web-engine-entitled.conf"]
readers = ["crates/packaging/launcher/src/manifest.rs", "crates/packaging/launcher/src/seccomp.rs"]

[[cargo]]
package = "tilo-vm"
inputs = ["apps/*/tilo-app.toml"]
readers = ["crates/dev/tilo-vm/src/build.rs"]

[[cargo]]
package = "tilo-vm-protocol"
inputs = ["os/components.toml"]
readers = ["crates/dev/tilo-vm-protocol/src/manifest.rs"]

[[cargo]]
package = "tilo-vmd"
inputs = ["os/components.toml", "os/scripts/install-components.py"]
readers = ["crates/dev/tilo-vmd/tests/jobs.rs"]

[[cargo]]
package = "tilo-app-cli"
# Scaffolding and the dev loop locate the SDK and the UI builder in the tree;
# standalone scaffolds embed the workspace's lock, patches, profiles and toolchain.
# `--from-example` embeds the example apps, and a test checks them and their index.
inputs = [
  "crates/sdk/tilo-app/Cargo.toml", "crates/sdk/ui-core/Cargo.toml", "crates/dev/ui-builder/Cargo.toml",
  ".cargo/config.toml",
  "examples/apps/", "examples/README.md", "docs/examples.md",
  # The portability lint compiles in the policy gate's rules table, and the
  # capability check the table of what each capability's code uses.
  "tools/policy/app_portability_rules.toml", "tools/policy/app_capability_usage.toml",
  # Standalone apps take the SDK's toolchain and lock file.
