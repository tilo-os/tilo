[[cargo]]
package = "tilo-app-cli"
# Scaffolding and the dev loop locate the SDK and the UI builder in the tree;
# standalone scaffolds embed the workspace's lock, patches, profiles and toolchain.
# `--from-example` embeds the example apps, and a test checks them and their index.
inputs = [
  "crates/sdk/tilo-app/Cargo.toml", "crates/sdk/ui-core/Cargo.toml", "crates/dev/ui-builder/Cargo.toml",
  ".cargo/config.toml",
  "examples/apps/", "examples/README.md", "docs/examples.md",
  # Task guides are embedded by the CLI from the published documentation.
  "docs/developers/tasks/",
  # The portability lint compiles in the policy gate's rules table, and the
  # capability check the table of what each capability's code uses.
  "tools/policy/app_portability_rules.toml", "tools/policy/app_capability_usage.toml",
  # Standalone apps take the SDK's toolchain and lock file.
  "rust-toolchain.toml", "Cargo.lock",
  "tools/ci/rustc-sdk-consumer.sh", "os/dev/export-sdk-compiler.py",
  "os/dev/assemble-app-runtime.py", "tools/ci/rustc-thin-app-wrapper.sh",
  # The outside-repository test builds a generated app against the checkout.
  "Cargo.toml", "crates/sdk/", "crates/platform/", "vendor/",
  # Canonical worker builder sources.
  "crates/browser/tilo-browser-compute/",
  # Tests over every app of the workspace read each one's manifests and sources: the
  # capability and portability lints, the record kinds each manifest must declare, the
  # SDK graph of every app, workspace certification and the packaging fixtures.
  "apps/",
  # A new app's services speak the runtime interface version the image serves.
  "os/usr/share/tilo/system-interfaces.toml",
  # A check runs inside the test environment, as cargo's runner starts every test.
  "tools/with-test-environment.sh",
]
# The record-kinds tests read the sources of the local crates the apps depend on, the
# production resource regression Music's whole normal local dependency closure.
dependencies_of = ["apps/"]
readers = [
  "crates/dev/tilo-app-cli/src/tests.rs", "crates/dev/tilo-app-cli/src/portability.rs",
  # The SDK's current interfaces are the image's declaration from the same commit.
  "crates/dev/tilo-app-cli/src/interface_versions.rs",
  "crates/dev/tilo-app-cli/src/guide.rs",
  # Focused source lookup verifies the embedded shared-checklist test bytes.
  "crates/dev/tilo-app-cli/tests/json_output.rs",
  "crates/dev/tilo-app-cli/src/standalone.rs", "crates/dev/tilo-app-cli/tests/outside_repo.rs",
  "crates/dev/tilo-app-cli/src/capability_usage.rs",
  # Android packaging copies the standalone font catalog out of the SDK.
  "crates/dev/tilo-app-cli/src/android.rs",
  "crates/dev/tilo-app-cli/src/targets/web.rs",
  "crates/dev/tilo-app-cli/src/resource_kinds.rs",
  # Workspace certification's compute-package test reads real manifests.
  "crates/dev/tilo-app-cli/src/main.rs",
  "crates/dev/tilo-app-cli/src/native_sdk/tests.rs", "crates/dev/tilo-app-cli/tests/native_sdk.rs",
]

