# Test suites outside Cargo, and when the required CI checks run them.
#
# Every file that looks like a test (see tools/ci/suites.py: in_scope) is
# guarded by exactly one of:
#
#   * tools/security-boundary-invariants.txt or tools/policy/run.sh, which run
#     on every applicable change;
#   * a [[group]] below: a cheap, hermetic suite (no root-only host state, KVM,
#     built image or network) that t's `suite-<group>` check runs whenever
#     a changed path matches one of the group's inputs or the suite itself;
#   * a [[covered]] entry: exercised by the named, already guarded suite, or,
#     with `check = "<name>"`, by the named t check, which runs it in its own
#     image on every change or at every head of stable (a check that runs only
#     on idle or when asked is not required, so its suite is [[unrequired]]); or
#   * an [[unrequired]] entry with the reason it cannot be a required check,
#     and, where a t check already runs it, `check = "<name>"` naming that
#     check whatever its trigger: a per-arch family is named by one
#     architecture's check (`image-release-tools-x86_64`). A suite that only a
#     release workflow runs names it in `workflow` instead. `check` is not
#     required yet; `tools/ci/suites.py report` counts the suites still
#     without one.
#
# `tools/ci/suites.py check` (part of tools/policy/run.sh) rejects a
# test-shaped file in none of these, so a new suite cannot silently stay
# unguarded.
#
# Inputs are repository paths: "dir/" matches everything below it, a pattern
# containing * ? or [ is an fnmatch pattern (* also matches "/"), anything else
# is an exact file. Every head of stable runs every group, so an input list
# that misses a real dependency is caught before a release ships it.
#
# Each suite runs as `python3 PATH`, `bash PATH` or, for a JavaScript
# `*.test.mjs` suite, `node --test PATH` inside
# tools/with-test-environment.sh (no desktop session), from the repository root in
# the ci-fast image, as root, without network. A Python suite that defines
# unittest cases must call unittest.main() so direct execution runs them.
#
# Cargo tests are selected by the dependency graph, which only sees a package's
# own directory. A package whose code reads repository files outside it (an
# include_str! of a shipped file, a test that walks apps/) declares them in a
# [[cargo]] entry: a change to one of its inputs checks and tests the package,
# as a change to its own files does. `readers` lists the files that read; the
# check finds every literal include! and every CARGO_MANIFEST_DIR path that
# climbs out of its package, rejects one no entry lists, and requires each
# literal include's target to match an input. Paths built at runtime rely on
# `inputs` saying what they read. A [[cargo-exempt]] entry names a reading file
# whose read CI never runs, with the reason.

# The archive smoke's required hermetic contract runs the real shell with a stub archive runner.
[[covered]]
suite = "os/tests/ci_fast_images.sh"
by = "os/tests/test_ci_fast_images.py"

[[covered]]
suite = "os/tests/image_size_budget.py"
by = "os/tests/test_image_size_budget.py"

# The flows family builds a disk per scenario and boots it: four-devices and
# laptop-phone-server are the two the script runs.
[[covered]]
suite = "os/tests/flow_scenario.sh"
check = "flows/four-devices"

# The developer docs' hosted-Browser example: it needs the built web desktop bundle, the
# tilo-sh programs and site, headless Chromium, the VM host image and minutes of a machine's
# walls, on a stack of its own, so the check runs it when dispatched or idle, never on a change.
[[unrequired]]
suite = "os/containers/tilo-sh/test-docs-browser.sh"
reason = "one docs example brought up on a whole tilo.sh of its own, with a VM host and the hosted guest: the check runs it when dispatched or idle"
check = "docs-examples-browser"

[[covered]]
suite = "tools/test-assets.py"
by = "tools/tests/test_test_assets.py"

# Not a suite: the developer entry point that execs local_affected.py --changed,
# whose command line and runs its test covers.
[[covered]]
suite = "tools/ci/test-changed.sh"
by = "tools/tests/test_local_affected.py"

[[covered]]
suite = "tools/test-env-setup.sh"
by = "tools/tests/test_test_environment.py"

# Not a suite: the environment a check hands its command, which that test holds
# to what it sets.
[[covered]]
suite = "tools/test-env.sh"
by = "tools/tests/test_test_environment.py"

[[covered]]
suite = "os/tests/airplay-encrypted-session.sh"
by = "os/tests/airplay_encrypted_session_test.sh"

[[covered]]
suite = "os/tests/run-fex-tests.py"
by = "os/tests/test_fex_payload.py"

