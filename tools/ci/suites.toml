[[cargo]]
package = "tilo-esp-write"
# The ESP writer's tests run tilo-deployment's boot-counter pass, which reads
# its UKIs with the built helper as tilo-uki-cmdline. The editor's own tests
# run the installer suites that drive it through the Containerfile's and
# tilo-install's command lines.
inputs = [
  "os/usr/libexec/tilo-deployment",
  "os/tests/test_installer_target_cmdline.py",
  "os/tests/test_installer_target_boot_digest.py",
  "os/Containerfile.installer",
  "os/usr/libexec/tilo-install",
  "os/usr/lib/bootc/kargs.d/",
