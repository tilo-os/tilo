reason = "needs the built web entry image"
check = "image-web-entry"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-e2e.sh"
reason = "the e2e check runs it on main's newest head with spare room (`on = [\"idle\"]`), bisecting a failure to the commit that broke it, and tilo-sh-admits-a-page runs its entry flow there too: with the Lounge check's release builds it needs, about 2 core-hours a head"
check = "e2e"

[[unrequired]]
suite = "os/containers/tilo-sh/test-program.sh"
reason = "needs a whole tilo.sh stack of its own under bwrap, from the built programs, the font catalog and Caddy; the tilo-sh-answers-a-program check brings one up for it, nested, when named"
check = "tilo-sh-answers-a-program"

[[unrequired]]
suite = "os/containers/tilo-sh/test-vm-host.sh"
reason = "needs root, KVM, loop devices and the built VM host and hosted guest images; the tilo-sh-vm-host check runs it in a VM of its own on dispatch"
check = "tilo-sh-vm-host"

[[unrequired]]
suite = "os/containers/tilo-sh/test-peer-kill-midwrite.sh"
reason = "needs a whole tilo.sh stack and a FUSE mount, and minutes for the bulk write and its convergence; the peer-kill-midwrite check brings one up when named"
check = "peer-kill-midwrite"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-wait-list.sh"
reason = "needs the built web desktop bundle, headless Chromium and the built relay and crypto programs, and a mail sink it runs itself; the wait-list check brings those up for it (and e2e's wait-list flow runs it at idle)"
check = "wait-list"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-onboarding.sh"
reason = "one flow of the e2e check's, on a whole tilo.sh of its own (the stack, whose entry takes people by invitation and whose mail goes to a sink it reads): it needs the built web desktop bundle, the stack's programs, context, site and Caddy, headless Chromium, the tilo command, and minutes of a machine's walls; the onboarding check brings a stack up for it (and e2e runs it beside the other flows)"
check = "onboarding"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-page-notes.sh"
reason = "walks a workspace's page, its Notes and every app it opens in a headless browser against the Lounge, keeping what each step saw and a picture of it for a reviewer; needs the built web desktop bundle, the built server, crypto and font programs; the page-notes check runs it on request"
check = "page-notes"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-page-call.sh"
reason = "walks two people in a voice call, each in a headless browser of their own with a synthetic microphone and camera, and judges the call by its own counters (frames heard, pictures sent and received) and by the other person's tile redrawing; needs the built web desktop bundle, the built server, crypto and font programs; the page-call check runs it on request"
check = "page-call"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-page-reopen.sh"
reason = "walks a page whose app request is held past the server's wait, keeping what each step saw; needs the built web desktop bundle, the built server, crypto and font programs; the page-reopen check runs it on request"
check = "page-reopen"

[[unrequired]]
suite = "os/containers/tilo-lounge/test-image.sh"
