by = "tools/tests/test_android_fixture_resources.py"

[[unrequired]]
suite = "os/tests/flatpak_default_initialization_test.py"
reason = "requires native Flatpak, GPG and bubblewrap user namespaces; the digest-pinned ci-fast image has no Flatpak; run explicitly with python3 os/tests/flatpak_default_initialization_test.py, failing when prerequisites are absent"

[[cargo]]
package = "install"
# Real signed runtime installation is checked against its broker service grants.
inputs = ["crates/packaging/app-host/systemd/tilo-app-host.service", "os/usr/lib/systemd/user/tilo-app-host.service"]
readers = ["crates/packaging/install/tests/runtime_package.rs"]

[[unrequired]]
suite = "tools/ci/windows/wine-test.sh"
reason = "runs the imager's Windows unit-test executable under Wine; needs the cross-built test binary, so t's wine/windows-x86_64-tests check runs it after build/windows-x86_64-tests"

[[group]]
name = "cloud-rystic-ci"
requirement = { cores = 1, memory = "1GiB" }
inputs = ["tools/ci/rystic_ci.py", "tools/ci/run-rystic-ci.sh"]
suites = ["tools/ci/test_rystic_ci.py"]

[[unrequired]]
suite = "tools/ci/run-rystic-ci.sh"
reason = "metered integration runner; t's cloud-rystic, weekly-cloud-rystic and cloud-rystic-contracts checks execute it with native build artifacts and a trusted RYSTIC_CI_TOKEN secret"

[[cargo]]
package = "tilo-cli"
# Every program moved off PATH must be installed in /usr/libexec/tilo with its
# old command name linked to tilo; the alias table is checked against the
# image's component manifest.
inputs = ["os/components.toml"]
readers = ["crates/system/tilo-cli/src/aliases.rs"]
