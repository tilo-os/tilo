# The session tests mount apps against the controlled font fixture and share
# the browser peer's relay test support; the campaign benchmark runs its
# confined workers inside the test environment script.
inputs = [
  "crates/sdk/ui-core/assets/fonts/",
  "crates/browser/tilo-browser-peer/tests/support/",
  "tools/with-test-environment.sh",
]
readers = [
  "crates/agent/agent-participant/tests/asking_first.rs",
  "crates/agent/agent-participant/tests/campaign_bench.rs",
  "crates/agent/agent-participant/tests/check_facts.rs",
  "crates/agent/agent-participant/tests/room_actions.rs",
  "crates/agent/agent-participant/tests/host_agents.rs",
  "crates/agent/agent-participant/tests/session_coverage.rs",
  "crates/agent/agent-participant/tests/shared_session.rs",
]

[[cargo]]
package = "tilo-video-render"
# The helper's tests render footage the video editor's test support
# generates, so a change to that generator runs them.
inputs = ["apps/video-editor/tests/support/"]
readers = [
  "crates/media/video-render/tests/render_helper.rs",
  "crates/media/video-render/tests/support/media_stack.rs",
]

[[cargo]]
package = "collab-types"
# Every app's committed surface must parse as a receiver reads it.
inputs = ["apps/*/surface.toml"]
readers = ["crates/collab/collab-types/src/surface.rs"]

[[cargo]]
package = "format-host"
inputs = ["docs/app-model/formats.md"]
readers = ["crates/doc/format-host/tests/integration.rs"]

[[cargo]]
package = "tilo-projector"
# The CI target compiles the exact production TLS source, including its tests.
inputs = ["vendor/fcast-sender-sdk/src/chromecast_tls.rs", "vendor/fcast-sender-sdk/src/chromecast_tls/", "vendor/fcast-sender-sdk/src/chromecast_auth.rs", "vendor/fcast-sender-sdk/src/chromecast_auth/"]
readers = ["crates/system/projector/tests/cast_tls.rs", "crates/system/projector/tests/cast_auth.rs"]
scope = { inputs = ["vendor/fcast-sender-sdk/src/chromecast_tls.rs", "vendor/fcast-sender-sdk/src/chromecast_tls/"], test = "cast_tls", filter = "binary(cast_tls)" }

[[cargo]]
package = "notes"
inputs = ["tools/test-assets.py", "tools/test-assets-build.rs", "apps/settings/shots/artifacts.json"]
readers = ["apps/notes/build.rs"]


[[cargo]]
package = "shell"
inputs = [
  "apps/browser/tilo-app.toml",
  "apps/imager/packaging/linux/tilo-imager.svg",
  "apps/file-explorer/tilo-app.toml",
  # The session names Settings' own surface as it holds the app's records.
  "apps/settings/surface.toml",
  "tools/protocols/airdrop_sender.py",
  "tools/test-assets.py",
  "crates/sdk/ui-core/assets/fonts/",
  "dist/VERSION",
  "docs/shell-navigation-keyboard-map.md",
  "docs/architecture/dictation-whistle-aot-review.json",
  "docs/architecture/dictation-whistle-aot-image.json",
  "docs/architecture/dictation-whistle-aot-image-120s.json",
  "tools/with-test-environment.sh",
  "tools/atspi_external_client.py",
  "scripts/headless-examples/",
  # The search relevance table runs over every app's manifest and keywords.
  "apps/*/tilo-app.toml",
  "apps/*/search/*.ftl",
  # The ask-agent chord's test finds the apps that share a selection in their
  # sources and checks each manifest asks for the shell-ui service.
  "apps/*.rs",
]
readers = [
  "crates/session/shell/src/bin/shots/driver/downloaded_scene.rs",
  "crates/session/shell/src/shell/doc_open.rs",
  "crates/session/shell/src/shell/search/relevance_tests.rs",
  "crates/session/shell/src/shell/selection_agent.rs",
  "crates/session/shell/examples/files_clipboard_native.rs",
  "crates/session/shell/src/shell/broker_services/file_clipboard/bridge_tests/child_tests.rs",
  "crates/session/shell/src/shell/broker_services/airdrop_transfer.rs",
  "crates/session/shell/examples/packaged_native_bootstrap.rs",
  "crates/session/shell/src/linux_main.rs",
  "crates/session/shell/tests/support/snapshot.rs",
  "crates/session/shell/tests/input_method_wire.rs",
  "crates/session/shell/src/shell/fixed_chords.rs",
  "crates/session/shell/src/shell/network/paired_continuity_tests.rs",
  "crates/session/shell/src/compositor/chooser_service.rs",
  "crates/session/shell/src/shell/settings_records.rs",
]




[[cargo]]
