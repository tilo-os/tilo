# Test suites outside Cargo, and when the required CI checks run them.
#
# Every file that looks like a test (see tools/ci/suites.py: SCOPE) is gated by
# exactly one of:
#
#   * tools/security-boundary-invariants.txt, tools/policy/run.sh or a literal
#     step in check.yml/lint.yml, which run on every applicable change;
#   * a [[group]] below: a cheap, hermetic suite (no root-only host state, KVM,
#     built image or network) that the "suites" job in check.yml runs whenever
#     a changed path matches one of the group's inputs or the suite itself;
#   * a [[covered]] entry: exercised by the named, already gated suite; or
#   * an [[unrequired]] entry with the reason it cannot be a required check.
#
# `tools/ci/suites.py check` (part of tools/policy/run.sh) rejects a
# test-shaped file in none of these, so a new suite cannot silently stay
# ungated.
#
# Inputs are repository paths: "dir/" matches everything below it, a pattern
# containing * ? or [ is an fnmatch pattern (* also matches "/"), anything else
# is an exact file. Pushes to main run every group, so an input list that
# misses a real dependency is caught at the merge that broke the suite.
#
# Each suite runs as `python3 PATH` or `bash PATH` from the repository root in
# the ci-fast image, as root, without network. A Python suite that defines
# unittest cases must call unittest.main() so direct execution runs them.

[[group]]
name = "os"
inputs = ["os/"]
suites = [
