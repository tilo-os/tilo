[[group]]
name = "openssl-free"
requirement = { cores = 1, memory = "2GiB" }
# No OpenSSL, native-tls or second crypto provider in the workspace's dependency
# graph or any lockfile, and none started by the shipped runtime's sources, image
# recipes or workflows. It scans every Rust and shell source and resolves the
# whole graph with cargo tree, so it is a group of its own, which answers in
# seconds, rather than part of security, whose micro-VM every crate change
# would otherwise boot. It reads the OS tree and the workflows whole, the Rust
# and shell sources of the apps and crates, every manifest and lockfile (cargo
# tree resolves the vendored crates' too) and the two packaging recipes it
# greps.
inputs = [
  "os/", ".forgejo/", ".cargo/", "*Cargo.toml", "*Cargo.lock", "rust-toolchain.toml",
  "crates/*.rs", "crates/*.sh", "apps/*.rs", "apps/*.sh",
  "dist/arch/PKGBUILD", "dist/nix/package.nix",
]
suites = ["os/tests/no_openssl_runtime.sh"]

[[group]]
name = "mount-source-cache-keys"
requirement = { cores = 1, memory = "1GiB" }
# A RUN that bind-mounts a pulled image's alias stage (the frozen RPM snapshot,
# the kernel, a toolchain) keys its layer on that image's reference, so a local
# Buildah build never reuses a layer installed from a previous snapshot.
inputs = ["os/"]
suites = ["os/tests/test_mount_source_cache_keys.py"]

[[group]]
name = "dev-feature-targets"
requirement = { cores = 1, memory = "1GiB" }
# The dev features os/components.toml names, against the packages' manifests:
# `pkg/feature` must reach the package, not a dependency of it named pkg.
inputs = ["os/components.toml", "*Cargo.toml"]
suites = ["os/tests/dev_feature_targets.py"]

[[group]]
name = "containerfile-sources"
requirement = { cores = 1, memory = "1GiB" }
# Every host-side COPY source of every image Containerfile must exist. The
# Containerfiles are under os/, and what they copy from outside it is listed
# here as it is copied: a file by its path, so deleting or moving it runs the
# group, and a whole directory by its name, which can't go away without a
# change to os/ (the suite fails while a source outside os/ isn't listed).
inputs = [
  "os/", ".containerignore", ".cargo/", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
  "apps", "crates", "dist", "examples", "vendor", "vendor/zlink-macros/", "keys/release/",
