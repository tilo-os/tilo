# Cargo packages whose code reads repository files outside their directory.
# A change to an input tests the whole package, unless every changed input is
# listed in the entry's optional `scope`: then only the scope's `filter`
# (a nextest filterset) within its `test` target runs for that package.
# `dependencies_of` names directories whose packages' normal local dependencies
# the package reads too; tools/ci/t_toml.py adds those packages' directories to
# its inputs from the workspace's metadata, so a crate an app comes to depend on
# is counted without listing it here. `tools/ci/suites.py check` holds each
# entry's inputs to what its code reads where literals say: includes, and paths
# built from CARGO_MANIFEST_DIR, including every entry of a directory it lists.


[[cargo]]
package = "tilo-ui"
# The design and spacing audits ratchet every app and shell source file; the
# launcher audit reads each app's main.rs and the framework launcher.
# Typography visual regression #[path]-includes the shared gallery showcase
# builder that lives with the ui-examples scenarios. The paint stream's tests
# draw the layout snapshots and screenshot recorded for tilo-paint-stream.
inputs = [
  "apps/*.rs", "apps/*/tilo-app.toml", "crates/session/shell/src/*.rs",
  "crates/sdk/tilo-app/src/framework/app.rs",
  "vendor/winit/src/platform_impl/quit_request.rs",
  "crates/dev/ui-examples/examples/common/gallery_scene.rs",
  "crates/browser/paint-stream/tests/fixtures/",
  "crates/browser/tilo-browser-runtime/src/background_work.rs",
  "crates/browser/tilo-browser-runtime/src/mount_service_custody.rs",
  "tools/test-assets.py",
  # The ratchets find the checkout by its workspace manifest.
  "Cargo.toml",
]
readers = [
  "crates/sdk/ui-core/src/headless.rs",
  "crates/sdk/ui-core/build.rs",
  "crates/sdk/ui-core/src/app/close_admission.rs",
  "crates/sdk/ui-core/tests/support/ratchet.rs",
  "crates/sdk/ui-core/src/webview/paint.rs",
  "crates/sdk/ui-core/tests/typography_visual_regression.rs",
]
# App, shell and framework sources are read only by the look ratchets in the
# `it` target. A change confined to them runs those ratchets, not the whole
# toolkit suite; the vendored quit request is compiled into the library, so a
# change there still runs everything.
scope = { inputs = [
  "apps/*.rs", "apps/*/tilo-app.toml", "crates/session/shell/src/*.rs",
  "crates/sdk/tilo-app/src/framework/app.rs",
], test = "it", filter = "test(/^design_token_audit::/) | test(/^spacing_token_audit::/) | test(/^typography_token_audit::/) | test(/^copy_audit::/)" }


[[cargo]]
package = "tilo-app-package"
# Every app's search taglines are checked in each shipped language.
inputs = ["apps/*/Cargo.toml", "apps/*/tilo-app.toml", "apps/*/search/*.ftl"]
readers = [
  "crates/packaging/tilo-app-package/tests/app_manifests.rs",
  "crates/packaging/tilo-app-package/src/search_keywords.rs",
  "crates/packaging/tilo-app-package/src/validate.rs",
  "crates/packaging/tilo-app-package/src/view.rs",
]

