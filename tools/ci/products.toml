# What Tilo publishes as container images, one table per product. tools/ci/products.py turns
# each into its chain of checks in t.toml (`python3 tools/ci/t_toml.py write`); the format and
# how to add a product are in docs/publishing-on-t.md, "Products".

[defaults]
buildah = "quay.io/buildah/stable@sha256:084dc36d939cf44c9250d94e3164230153bf5dff9f0391f46b7957f16bcd8c9f"
skopeo = "quay.io/skopeo/stable@sha256:edad588fe8391ce37d5ec5e06d280dd1a666a77da302ceaf3cafa019676c8a3f"
# The release key in KMS and the role that may sign with it, for stable and v* tags only.
signing_env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }

# ---------------------------------------------------------------------------
# Services, deployed by digest from a receipt.

[[product]]
family = "services"
name = "room-service"
about = "The room service (room-service-image.yml): deployed by digest from stable's receipt."
repository = "registry.tilo.so/tilo/room-service"
dev = ["dev-{commit}"]
release = ["sha-{commit}"]

[product.context]
run = "bash tools/ci/publish/room-service-context.sh {dir}/context"
inputs = ["Cargo.lock", "crates/hosting/tilo-room-service/**", "crates/hosting/tilo-relay/**", "crates/hosting/tilo-relay-shell/**", "crates/hosting/tilo-relay-protocol/**", "crates/browser/tilo-browser-runtime/**", "crates/browser/tilo-browser-compute/**", "crates/browser/tilo-web-desktop/**", "apps/chat/**", "apps/discord/**", "scripts/moq-browser/**", "crates/sdk/ui-core/assets/fonts/**", "tools/font-catalog.py"]
outputs = ["{dir}/context/**"]
# The release bundle records the commit it was built from (git rev-parse, git status).
git = true
cost = "heavy"

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
cost = "minutes"

[[product]]
family = "services"
name = "web-entry"
about = "The web entry (web-entry.yml): the Tilo app on the web, deployed by digest."
repository = "registry.tilo.so/tilo/web-entry"
dev = ["dev-{commit}"]
release = ["sha-{commit}"]

[product.context]
run = "bash tools/ci/publish/web-entry-context.sh {dir}/context"
inputs = ["Cargo.lock", "crates/browser/**", "apps/**", "scripts/moq-browser/**", "crates/sdk/ui-core/assets/fonts/**", "tools/font-catalog.py"]
outputs = ["{dir}/context/**"]
git = true
cost = "heavy"

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
cost = "minutes"

[[product]]
family = "services"
name = "registry-server"
about = """
The app registry server (crates/packaging/registry-server): x86_64 only, like the cluster it
runs in. Rust compiles inside the Containerfile; the image is tested before main publishes it
and the GitOps repository pins the receipt's digest."""
repository = "registry.tilo.so/tilo/tilo-registry-server"
dev = ["sha-{commit}"]

[product.build]
run = """
assets=$TMPDIR/github-assets
TILO_GITHUB_ASSET_CACHE=$assets TILO_ASSET_STORE= bash os/dev/cache-github-assets.sh sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz
bash tools/ci/publish/oci-build.sh . crates/packaging/registry-server/container/Containerfile {out} --platform {platform} --build-context github-assets=$assets"""
test = ["bash crates/packaging/registry-server/container/test-image.sh {out}/image.oci.tar"]
inputs = ["crates/packaging/registry-server/container/**", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", ".containerignore", ".cargo/**", "rust-toolchain.toml"]
cargo_packages = ["registry-server"]
cargo_dev_dependencies = false
cost = "heavy"
cpus = 8
memory = "12G"

# ---------------------------------------------------------------------------
# CI tooling, not products: published from main and pinned by digest where they are used.

[[product]]
family = "ci-images"
name = "ci-fast"
about = """
The fast CI images, x86_64 only: published from main, pinned by digest in tools/ci/images.toml
by hand. image-ci-fast-smoke runs what the jobs that use them need, before either is published."""
repository = "registry.tilo.so/tilo/ci-fast"
dev = ["sha-{commit}"]
gates = ["image-ci-fast-smoke"]

[product.build]
containerfile = "os/Containerfile.ci-fast"
inputs = ["os/Containerfile.ci-fast"]
cost = "heavy"

[[product]]
family = "ci-images"
name = "ci-control"
about = "ci-control adds the Docker client to the ci-fast image just built, not to the pinned one."
repository = "registry.tilo.so/tilo/ci-control"
dev = ["sha-{commit}"]
gates = ["image-ci-fast-smoke"]

[product.build]
containerfile = "os/Containerfile.ci-control"
build_args = ["--build-arg CI_FAST_IMAGE=oci-archive:/target/publish/ci-fast/image.oci.tar"]
needs = ["image-ci-fast"]
inputs = ["os/Containerfile.ci-control"]
cost = "minutes"

[[product]]
family = "ci-images"
name = "release-tools"
about = """
The release tools image (os/Containerfile.release-tools): the compiler-free environment the
release jobs run in, built and tested natively per architecture and published from main as
one index. Its consumers pin the index by digest; jobs pull it before they can log in, so it
must be anonymously pullable."""
repository = "registry.tilo.so/tilo/tilo-release-tools"
arches = ["x86_64", "aarch64"]
index = true
dev = ["sha-{commit}"]
anonymous = true

[product.build]
containerfile = "os/Containerfile.release-tools"
test = ["bash os/tests/release_tools_image.sh {out}/image.oci.tar"]
inputs = ["os/Containerfile.release-tools", "os/tests/release_tools_image.sh"]
cost = "minutes"

[[product]]
family = "ci-images"
name = "ci-builder"
about = """
The CI builder (os/Containerfile.builder, tools/ci/publish/ci-builder.sh): the image t's checks
and the CI jobs run in, with the pinned toolchain baked in, built natively per architecture.
Its canaries, signing and promotion stay with build-ci-builder.yml for now."""
repository = "registry.tilo.so/tilo/tilo-builder"
arches = ["x86_64", "aarch64"]

[product.build]
run = "bash tools/ci/publish/ci-builder.sh build {arch} {out}"
inputs = ["os/Containerfile.builder", "os/external-assets/github-assets.tsv", "os/dev/cache-github-assets.sh", "rust-toolchain.toml", "dist/ci/install-build-deps.sh", "tools/ci/check-build-env.sh", "tools/ci/install-android-ndk.sh", "tools/ci/install-pdfium.sh", "tools/ci/native-mold-linker.sh", "tools/ci/verify-native-mold.sh", "tools/ci/windows/wine-prefix.sh", "tools/ci/sccache.sh", "tools/ci/measure.sh"]
cost = "heavy"
timeout_secs = 14400
cpus = 16
memory = "32G"
