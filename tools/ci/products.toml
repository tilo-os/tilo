[[matrix.check]]
name = "dev-installer-medium-{arch}"
comment = """
A bootable development installer medium from os-image-{arch}'s exact output
(tools/ci/publish/dev-installer-medium.sh): the image is checked against the digest its
composition recorded, the canonical os/dev/build-custom-installer.sh closes the image's
placeholder composefs seal and installs it to a qcow2, and media-provenance.py records the
finished medium. It is unsigned and never published, and needs no capture qualifier, source
