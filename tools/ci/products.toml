SHA-256 and source.json; boot it in a throwaway VM with `tilo-vm scenario install --medium`."""
run = "bash tools/ci/publish/dev-installer-medium.sh {arch} /target/os/{arch}/image /target/publish/dev-installer-medium/{arch}"
needs = ["os-image-{arch}"]
outputs = ["/target/publish/dev-installer-medium/{arch}/disk.qcow2", "/target/publish/dev-installer-medium/{arch}/disk.qcow2.sha256", "/target/publish/dev-installer-medium/{arch}/disk.qcow2.hardware.json", "/target/publish/dev-installer-medium/{arch}/source.json"]
git = true
