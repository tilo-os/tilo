[[product]]
family = "os-images"
name = "legacy-guest"
about = """
The Linux legacy VM guest (os/Containerfile.legacy-guest, tools/ci/publish/legacy-guest.sh):
the guest agent built here, the guest image built with it on a privileged x86_64 node,
installed to a disk and booted once until the agent serves, then the whole path end to end
(legacy-guest-e2e: the disk through `tilo-legacy` against a headless shell, a window, typed
text, a shared directory, suspend and resume). Stable signs (with a transparency log entry,
since `tilo-legacy` verifies requiring one) and publishes the disk and sets the
`legacy-guest` pointer; `legacy-guest.sh pin` commits it to os/legacy-guest-snapshot.env from
a check that pushes, once build-legacy-guest.yml no longer proposes the pin."""
repository = "registry.tilo.so/tilo/legacy-guest"
out = "{dir}/image"
release = ["x86_64-{commit}"]
tlog = true
gates = ["legacy-guest-e2e"]
after_publish = "bash tools/ci/publish/legacy-guest.sh pins {out}"

[product.build]
run = "bash tools/ci/publish/legacy-guest.sh build {dir}/agent {out}"
image = ""
needs = ["legacy-guest-agent"]
inputs = ["os/Containerfile.legacy-guest", "os/legacy-guest/**", "os/base-snapshot.env", "os/dev/legacy-guest-smoke.sh", "os/dev/disk-image.sh", "os/dev/ci-native-podman-store.sh", "os/dev/probe-kvm.py", "os/dev/install-cached-cosign.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv"]
requires = ["/dev/kvm", "disk-100g"]
cpus = 8
memory = "16G"
privileged = true
writable_sources = true
timeout_secs = 9000

[product.publish]
inputs = ["os/Containerfile.legacy-guest", "os/legacy-guest/**", "os/base-snapshot.env", "crates/runtime/legacy-agent/**", "crates/runtime/legacy-agent-protocol/**"]
outputs = ["{out}/pins.env"]
pointers = { legacy-guest = "{out}/pins.env" }

[[matrix]]
family = "windows"
about = """
Windows, cross-compiled and packaged on Linux (docs/publishing-on-t.md, Windows). The
builds run cargo-xwin against the MSVC CRT and Windows SDK, which Microsoft does not let
anyone redistribute: the windows-sdk checks download them once into t's private store
(their only input is the pinned versions) instead of into the public builder image.
Packaging and the Wine checks run on x86_64 because Fedora builds Wine for x86 only.
They pin the first builder with the Windows tools until the default image above moves past it."""
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { image = "registry.tilo.so/tilo/tilo-builder@sha256:da7c1556f8a38b33e5e85f8086bbd162194a2377e56898481000cefb4412fa9d" }

[[matrix.check]]
name = "build/windows-sdk-{arch}"
run = "bash tools/ci/windows/build.sh sdk {arch} /target/windows/sdk"
inputs = ["tools/ci/windows/build.sh", "tools/ci/windows/xwin-env.sh"]
outputs = ["/target/windows/sdk/sdk-{arch}.tar.zst", "/target/windows/sdk/sdk-{arch}.tar.zst.sha256"]
default = false
cpus = 4
memory = "4G"

[[matrix.check]]
name = "build/windows-{arch}"
run = "bash tools/ci/windows/build.sh imager {arch} /target/windows/sdk/sdk-{arch}.tar.zst /target/windows/{arch}/build"
needs = ["build/windows-sdk-{arch}"]
inputs = ["apps/imager/**", "apps/staging-handoff-model/**", "crates/**", "vendor/**", "dist/session/**", "os/tests/fixtures/**", "Cargo.toml", "Cargo.lock", "tools/ci/windows/build.sh", "tools/ci/windows/xwin-env.sh"]
outputs = ["/target/windows/{arch}/build/imager.exe", "/target/windows/{arch}/build/imager.exe.sha256"]
cpus = 16
memory = "24G"
default = false

[[matrix.check]]
name = "build/windows-{arch}-tests"
run = "bash tools/ci/windows/build.sh tests {arch} /target/windows/sdk/sdk-{arch}.tar.zst /target/windows/{arch}/tests"
needs = ["build/windows-sdk-{arch}"]
inputs = ["apps/imager/**", "apps/staging-handoff-model/**", "crates/**", "vendor/**", "dist/session/**", "os/tests/fixtures/**", "Cargo.toml", "Cargo.lock", "tools/ci/windows/build.sh", "tools/ci/windows/xwin-env.sh"]
outputs = ["/target/windows/{arch}/tests/imager-tests.exe", "/target/windows/{arch}/tests/imager-tests.exe.sha256"]
cpus = 16
memory = "24G"
default = false

[[matrix.check]]
name = "package/windows-{arch}"
run = "bash apps/imager/packaging/package-windows.sh {arch} /target/windows/{arch}/build/imager.exe /target/windows/{arch}/package"
needs = ["build/windows-{arch}"]
inputs = ["apps/imager/packaging/package-windows.sh", "apps/imager/packaging/windows/**", "docs/installer-walkthrough.md", "tools/ci/windows/wine-prefix.sh"]
outputs = ["/target/windows/{arch}/package/*"]
requires = ["arch=x86_64"]
default = false
cpus = 4
memory = "4G"
comment = "The unsigned package: standalone EXE, zip and Inno Setup installer, each with a digest."

[[matrix.check]]
name = "sign/windows-{arch}"
run = "bash tools/ci/windows/sign.sh {arch} /target/windows/{arch}/build /target/windows/{arch}/package /target/windows/{arch}/signed"
needs = ["build/windows-{arch}", "package/windows-{arch}"]
inputs = ["apps/imager/packaging/package-windows.sh", "apps/imager/packaging/windows/**", "docs/installer-walkthrough.md", "tools/ci/windows/**"]
outputs = ["/target/windows/{arch}/signed/*"]
secrets = ["TILO_SIGNING_AWS_ACCESS_KEY_ID", "TILO_SIGNING_AWS_SECRET_ACCESS_KEY", "TILO_AUTHENTICODE_KMS_KEY", "TILO_AUTHENTICODE_CERT_CHAIN", "TILO_WINDOWS_PUBLISHER"]
on = ["tag:imager-v*"]
requires = ["arch=x86_64"]
cache = false
cpus = 2
memory = "4G"
comment = """
Authenticode, for imager release tags only: re-checks the build's digest against the one
the package carries, then packages that executable again signing the EXE and the installer
with a key that never leaves AWS KMS. Its secrets reach release nodes only."""

[[matrix.check]]
name = "package/windows-winget"
run = """
root=$TMPDIR/winget-release
rm -rf "$root" && mkdir -p "$root"
cp /target/windows/x86_64/package/tilo-imager-setup-windows-x86_64.exe* /target/windows/aarch64/package/tilo-imager-setup-windows-aarch64.exe* "$root/"
python3 apps/imager/packaging/generate-winget.py "$root" --version 0.1.0 --base-url https://github.com/tilo-os/releases/releases/download/imager-v0.1.0
python3 apps/imager/packaging/validate-winget.py "$root/winget"
rm -rf /target/windows/winget && cp -r "$root/winget" /target/windows/winget
"""
needs = ["package/windows-x86_64", "package/windows-aarch64"]
inputs = ["apps/imager/packaging/generate-winget.py", "apps/imager/packaging/validate-winget.py"]
outputs = ["/target/windows/winget/*"]
default = false
cpus = 1
memory = "2G"
comment = """
Both installers in one WinGet manifest set, checked against WinGet's schemas (the version
and URL are placeholders: the release generates the real set from the signed installers)."""

[[matrix.check]]
name = "wine/windows-{arch}-tests"
run = "bash tools/ci/windows/wine-test.sh units /target/windows/{arch}/tests/imager-tests.exe"
needs = ["build/windows-{arch}-tests"]
inputs = ["tools/ci/windows/wine-test.sh", "tools/ci/windows/wine-prefix.sh", "tools/ci/windows/wine-skip.txt"]
requires = ["arch={arch}"]
default = false
cpus = 8
memory = "8G"
only = ["x86_64"]
comment = """
What runs without Windows, under Wine: the unit tests (less wine-skip.txt), and the
installer installing, the installed imager rendering its UI, and the uninstaller."""

[[matrix.check]]
name = "wine/windows-{arch}-install"
run = "bash tools/ci/windows/wine-test.sh install /target/windows/{arch}/package"
needs = ["package/windows-{arch}"]
inputs = ["tools/ci/windows/wine-test.sh", "tools/ci/windows/wine-prefix.sh"]
requires = ["arch={arch}"]
default = false
cpus = 4
memory = "8G"
only = ["x86_64"]

[[matrix]]
family = "apps"
about = """
Apps (tools/apps/t-release.sh; docs/publishing-on-t.md). Every app of the default collection
is built, packaged with throwaway keys and smoke-tested per architecture without credentials:
`t test apps-build-x86_64` is what a release builds. On each new head of stable the release
nodes sign those exact binaries with the publisher identities (sign-apps-*, which compile
nothing), upload the tapps, collections and runtime objects with the package token
(publish-apps, which sets the `app-collection` pointer to the collections an OS build takes:
`reads_pointers = ["stable:app-collection"]`) and submit
the publisher-signed registry entries (submit-apps). Main publishes no apps."""
each = [{ arch = "x86_64", node = "arch=x86_64" }, { arch = "aarch64", node = "arch=arm64" }]
fields = { inputs = ["apps/**", "crates/**", "vendor/**", "examples/apps/**", "dist/apps/**", "os/scripts/build-thin-apps.sh", "os/scripts/bake-runtime-bundle.sh", "os/scripts/collect-runtime-dependencies.py", "os/scripts/verify-runtime-bundle-closure.sh", "os/scripts/stamp-runtime.sh", "os/scripts/verify-elf-hardening.sh", "os/dev/assert-native-arch.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "tools/apps/**", "tools/perf/**", "tools/font-catalog.py", "tools/ci/__init__.py", "tools/ci/python.py", "tools/ci/workspace_graph.py", "tools/ci/rustc-thin-app-wrapper.sh", "tools/ci/runtime-dylib-lazy-link.py", "tools/ci/publish/lib.sh", "tools/upload_immutable_packages.sh", "tools/reuse_prior_app_collection.sh", "Cargo.toml", "Cargo.lock"] }

[[matrix.check]]
name = "apps-build-{arch}"
run = "bash tools/apps/t-release.sh build {arch} /target/apps-release/{arch}"
outputs = ["/target/apps-release/{arch}/compiled/**"]
requires = ["{node}"]
timeout_secs = 10800
cost = "heavy"
default = false

[[matrix.check]]
name = "sign-apps-{arch}"
run = "bash tools/apps/t-release.sh sign {arch} /target/apps-release/{arch} /target/apps-release/{arch}/signed"
needs = ["apps-build-{arch}"]
outputs = ["/target/apps-release/{arch}/signed/**"]
requires = ["{node}"]
# The release sequence is the commit's time.
git = true
secrets = ["TAPP_PUBLISHER_IDENTITY", "RUNTIME_BUNDLE_SIGNING_KEY"]
on = ["stable"]
cost = "minutes"

[[matrix.check]]
name = "publish-apps"
run = "bash tools/apps/t-release.sh publish /target/apps-release/channel /target/apps-release/x86_64/signed /target/apps-release/aarch64/signed"
needs = ["sign-apps-x86_64", "sign-apps-aarch64"]
outputs = ["/target/apps-release/channel/channel.json"]
# The collections an OS build takes its apps from, per reference: `stable:app-collection`.
pointers = { app-collection = "/target/apps-release/channel/channel.json" }
requires = ["arch=x86_64"]
# Assembles the collections under release/ and dist/app-collections/, and reads the commit's time.
writable_sources = true
git = true
secrets = ["REGISTRY_TOKEN"]
on = ["stable"]
cost = "minutes"

[[matrix.check]]
name = "submit-apps"
run = "bash tools/apps/t-release.sh submit /target/apps-release/x86_64/signed /target/apps-release/aarch64/signed"
needs = ["sign-apps-x86_64", "sign-apps-aarch64", "publish-apps"]
requires = ["arch=x86_64"]
writable_sources = true
git = true
secrets = ["TAPP_PUBLISHER_IDENTITY"]
on = ["stable"]
cost = "minutes"

[[matrix]]
family = "desktop"
about = """
Every distribution userspace of one architecture, built and install-tested in its own
container (dist/ci/package-lane.sh): `t outputs desktop-package-amd64` gives the packages and
the OS desktop payload. The containers need a privileged node."""
each = [{ arch = "x86_64", deb = "amd64", node = "arch=x86_64" }, { arch = "aarch64", deb = "arm64", node = "arch=arm64" }]

[[matrix.check]]
name = "desktop-package-{deb}"
run = "bash dist/ci/package-lane.sh {deb}"
inputs = ["dist/**", "crates/**", "apps/**", "vendor/**", "os/dev/install-cached-cosign.sh", "os/dev/fetch-env-runtime.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "os/Containerfile.env-runtime", "flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock"]
outputs = ["dist/ci-output/**"]
requires = ["{node}"]
privileged = true
writable_sources = true
# Packages record their source commit and time; the Nix lane reads the tree through Git.
git = true
timeout_secs = 14400
cost = "heavy"
default = false

[[matrix.check]]
name = "publish-desktop-payload"
image = "registry.tilo.so/tilo/ci-fast@sha256:ecfe2c2abf7a48d9d00d71083aba6b7b9dfc11bc9de63b87e3144522daf6d97c"
run = "bash dist/ci/publish-desktop-payload.sh /target/publish/desktop/payload.json"
inputs = ["dist/ci/publish-desktop-payload.sh", "tools/ci/publish/lib.sh"]
needs = ["desktop-package-amd64", "desktop-package-arm64"]
outputs = ["/target/publish/desktop/payload.json"]
pointers = { desktop-payload = "/target/publish/desktop/payload.json" }
secrets = ["REGISTRY_TOKEN"]
on = ["stable"]
comment = """
The OS desktop payload from stable: the Fedora lanes' payloads as immutable generic packages,
and the `desktop-payload` pointer to them, which an OS build reads
(`reads_pointers = ["stable:desktop-payload"]`)."""

[[matrix]]
family = "verifier-bundles"
about = """
The canonical verifier bundles (tools/ci/verifier-bundle.sh): the native tools an app
publication verifies with, per architecture, for someone to review and upload. Nothing here
publishes. `t dispatch verifier-bundle-x86_64` builds main's head; `t outputs
verifier-bundle-x86_64` downloads the bundle and its descriptor. The bundle names the
builder index the tools were built in, which is this file's `image`."""
each = [{ arch = "x86_64" }, { arch = "aarch64" }]

[[matrix.check]]
name = "verifier-bundle-{arch}"
run = "bash tools/ci/verifier-bundle.sh {arch} \"$(git rev-parse HEAD)\" \"$(awk -F'\"' '/^image = /{print $2; exit}' t.toml)\" /target/verifier-bundle"
inputs = ["t.toml", "tools/ci/verifier-bundle.sh", "tools/ci/python.py", "tools/canonical_verifier_bundle.py", "tools/apps/canonical_app_verifier.py", "tools/apps/app_channel_manifest.py", "crates/**", "apps/**", "vendor/**", "Cargo.toml", "Cargo.lock"]
outputs = ["/target/verifier-bundle/**"]
git = true
requires = ["arch={arch}"]
on = ["dispatch"]
cost = "heavy"
default = false

[[matrix]]
family = "development-signing"
about = """
The development signing tools proven natively on both architectures (os/tests/
development_signing_native.sh): a fixture image with private keys and a local registry,
whose tests nest Podman, so it runs as root in a micro-VM step. Run when asked for;
T_INPUT_PROOF=prediction|retention|prediction-retention selects one proof once it can also
be dispatched."""
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { default = false }

[[matrix.check]]
name = "development-signing-context-{arch}"
run = "bash os/tests/development_signing_native.sh context /target/development-signing/{arch}"
inputs = ["os/tests/development_signing_native.sh", "os/dev/install-cached-cosign.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "os/tests/test_tls_registry_fixture.py", "Cargo.lock", "Cargo.toml", "crates/workspace-hack/**", "os/dev/verify-development-source.py", "os/dev/development_boot.py", "os/dev/development_prediction.py", "os/tests/test_development_prediction.py", "os/tests/development_prediction_native.py", "os/dev/import-development-rootfs.py", "os/dev/initramfs-trust.py", "os/dev/complete-initramfs-rebind.py", "os/dev/installed_material_audit.py", "os/dev/rebind-development-rootfs.py", "os/usr/lib/dracut/modules.d/91tilo-rollback/**", "os/tests/test_rebind_development_rootfs.py", "os/tests/test_initramfs_trust.py", "os/tests/initramfs_trust_native.py", "os/tests/test_complete_initramfs_rebind.py", "os/dev/rebind-development-trust.py", "os/tests/test_import_development_rootfs.py", "os/tests/test_rebind_development_trust.py", "os/tests/test_development_trust.py", "os/dev/retain-development-rootfs.py", "os/tests/test_retain_development_rootfs.py", "os/tests/development_retention_native.py", "os/tests/tls_registry_fixture.py", "os/dev/audit-rootfs-layers.py", "os/tests/test_rootfs_layer_audit.py", "os/tests/development_layer_audit_native.py", "os/tests/development_rebind_native.py", "os/tests/test_development_boot.py", "os/tests/test_development_source.py", "os/dev/development-trust.py", "os/dev/install-public-trust.py", "os/dev/hardware_profile.py", "os/dev/development-signer.py", "os/dev/setup-development-signer.py", "os/dev/verify-authenticode-envelope.py", "os/dev/verify-development-loader.py", "os/tests/development_source_registry.py", "os/tests/development_signer.py", "os/tests/test_development_signer.py", "os/tests/test_development_loader.py", "os/tests/development_stage_reuse.py", "os/dev/sign-development-rootfs.py", "os/dev/private_disk_image.py", "os/tests/test_private_disk_image.py", "os/Containerfile.development-loader", "os/tests/test_sign_development_rootfs.py", "os/tests/development_rootfs.py", "os/tests/Containerfile.development-source", "crates/system/tilo-crypto/**"]
outputs = ["/target/development-signing/{arch}/**"]
requires = ["arch={arch}"]
