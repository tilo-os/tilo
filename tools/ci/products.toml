[[matrix.check]]
name = "os-dev-gate-{arch}"
comment = """
The dev channel's gate (tools/ci/publish/os-dev-gate.sh), the path a dev device takes: the dev
disk published last boots under KVM, stages os-dev-image-{arch} with bootc and applies it with
tilo-extension live:system, restarts into it to a greeter that takes input with the boot
assessment passed, and from there stages a newer image and applies it live. A device falls back
by itself from an image that fails to boot, so this is all a dev device needs before it follows
an image: that it takes it, boots it, and takes the next update."""
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
run = "bash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-{arch}.txt && bash tools/ci/publish/os-dev-gate.sh {arch} /target/publish/os-dev/{arch} /target/publish/os-dev-gate/{arch}"
needs = ["os-dev-image-{arch}", "{vm}"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
outputs = ["/target/publish/os-dev-gate/{arch}/**"]
git = true
requires = ["{node}", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 5400
default = false

[[matrix.check]]
name = "os-acceptance-{arch}"
heavy = true
comment = """
The devices and desktop a person gets from os-image-{arch} and os-dev-image-{arch}, booted under
KVM on throwaway overlays of the disk os-dev-disk-{arch} installed (tools/ci/publish/os-acceptance.sh):
a joined device signs in; nearby pairing from first-boot onboarding, a third device paired
through one without the identity key, sibling unlock and, on x86_64, wake; device-admin reach
through a relay; the installed desktop from the sign-in screen through first use, the apps,
hot-plugged input and the lock screen to tilo-vmd and app updates; the boot splash on a large
panel. The stable channel's gate; on main it runs when t has room and tells the commit that
broke it, and publishes nothing. `t outputs os-acceptance-x86_64` gives every gate's
report and the guests' logs."""
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
run = "bash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-{arch}.txt && bash tools/ci/publish/os-acceptance.sh {arch} /target/os/{arch}/image /target/publish/os-dev-disk/{arch} /target/publish/os-acceptance/{arch}"
needs = ["os-image-{arch}", "os-image-size-{arch}", "os-dev-disk-{arch}", "{vm}"]
env = { TILO_VM_BIN = "/target/tilo-vm-bin/tilo-vm" }
outputs = ["/target/publish/os-acceptance/{arch}/**"]
git = true
requires = ["{node}", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 10800
on = ["stable", "dispatch", "idle"]
default = false

