# What Tilo publishes as container images, one table per product. tools/ci/products.py turns
# each into its chain of checks in t.toml (`python3 tools/ci/t_toml.py write`); the format and
# how to add a product are in docs/publishing-on-t.md, "Products".

[defaults]
buildah = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
skopeo = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
# The release key in KMS and the role that may sign with it, for stable and v* tags only.
signing_env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
# The development key and the role that may sign with it, for main only (`dev_signed`).
dev_signing_env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-dev-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTDevSigner", TILO_SIGNING_AUDIENCE = "tilo-dev-signing" }

# ---------------------------------------------------------------------------
# Services, deployed by digest from a receipt.

[[product]]
family = "services"
name = "room-service"
about = """
The room service: tested before it is published, deployed by digest from stable's receipt.
Development tags are published only when dispatched (`t dispatch publish-room-service --ref
main`): what runs is stable's."""
repository = "registry.tilo.so/tilo/room-service"
dev = ["dev-{commit}"]
dispatch = true
release = ["sha-{commit}"]

[product.context]
run = "bash tools/ci/publish/room-service-context.sh {dir}/context /target/publish/room-service/bin /target/publish/web-desktop/bundle"
# The programs and the desktop bundle, built side by side; the bundle is the web entry's too.
needs = ["room-service-binaries", "web-desktop-bundle"]
outputs = ["{dir}/context/**"]
# The image's revision label names the commit (git rev-parse).
git = true

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
build_args = ["--build-arg SOURCE_REVISION=$(cat {dir}/context/source-revision)"]
test = ["bash crates/hosting/tilo-room-service/container/test-image.sh {out}/image.oci.tar $(cat {dir}/context/source-revision)"]

# Stable's receipt is what cloud-deploy deploys.
[product.publish]
pointers = { room-service = "{dir}/receipt.json" }

[[product]]
family = "services"
name = "web-entry"
about = """
The web entry: the Tilo app on the web, tested before it is published, deployed by digest from
stable's receipt. A release carries the version of the image production serves, so tabs open on
it survive the deploy: carry-web-entry derives that image from the build and tests it, and it is
what stable signs and publishes. Development tags, published only when dispatched (`t dispatch
publish-web-entry --ref main`), are the build as it is."""
repository = "registry.tilo.so/tilo/web-entry"
dev = ["dev-{commit}"]
dispatch = true
release = ["sha-{commit}"]
# Production (tilo.coffee, eu1) is released by its own session, by hand and independently of
# stable, so a push to stable neither carries, signs nor publishes the web entry's release: the
# site session dispatches it (`t dispatch publish-web-entry --ref stable`).
release_on = ["dispatch"]

[product.context]
run = "bash tools/ci/publish/web-entry-context.sh {dir}/context /target/publish/web-desktop/bundle"
# The desktop bundle it lays out, shared with the room service.
needs = ["web-desktop-bundle"]
outputs = ["{dir}/context/**"]
git = true

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
build_args = ["--build-arg SOURCE_REVISION=$(cat {dir}/context/source-revision)"]
test = ["bash crates/browser/tilo-browser-runtime/container/test-image.sh {out}/image.oci.tar"]

# It observes production (the image it replaces), so it runs on every release.
[product.release_build]
name = "carry-web-entry"
run = "bash tools/ci/publish/web-entry-carry.sh {out} {dir}/release"
outputs = ["{dir}/release/receipt-extra.json"]
cache = false

# Stable's receipt is what cloud-deploy deploys.
[product.publish]
pointers = { web-entry = "{dir}/receipt.json" }

[[product]]
family = "services"
name = "registry-server"
about = """
The app registry server (crates/packaging/registry-server): x86_64 only, like the cluster it
runs in. Rust compiles inside the Containerfile; the image is tested before it is published, and
the GitOps repository pins the receipt's digest. Stable publishes it signed with the release key
as `sha-<commit>`; a dispatch on main (`t dispatch publish-registry-server --ref main`) publishes
the unsigned development tag `dev-<commit>`."""
repository = "registry.tilo.so/tilo/tilo-registry-server"
dev = ["dev-{commit}"]
dispatch = true
release = ["sha-{commit}"]

[product.build]
run = """
TILO_ASSET_OFFLINE=1 bash os/dev/cache-github-assets.sh sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz
bash tools/ci/publish/oci-build.sh . crates/packaging/registry-server/container/Containerfile {out} --platform {platform} --build-context github-assets=os/external-assets/cache"""
needs = ["os-assets"]
test = ["bash crates/packaging/registry-server/container/test-image.sh {out}/image.oci.tar"]

[[product]]
family = "services"
name = "release-rehearsal"
about = """
The release rehearsal (tools/ci/publish/rehearsal): a one-file image that runs the whole chain
as a release does, so the chain is proven on t without publishing anything anyone deploys.
`t dispatch publish-release-rehearsal --ref main` publishes `dev-<commit>`; main doesn't on its
own, since nothing deploys it. A tag `v0-rehearsal-<n>` (or `t dispatch
publish-release-rehearsal --ref stable`) runs it as a release: it is signed with the release key in
KMS (identity token, AWS role), published as `sha-<commit>` with the signature and a receipt, and
the reference's `release-rehearsal` pointer is set. No other check runs on such a tag."""
repository = "registry.tilo.so/tilo/release-rehearsal"
dev = ["dev-{commit}"]
dispatch = true
release = ["sha-{commit}"]
release_on = ["dispatch", "tag:v0-rehearsal-*"]

[product.build]
context = "tools/ci/publish/rehearsal"
containerfile = "tools/ci/publish/rehearsal/Containerfile"

[product.publish]
pointers = { release-rehearsal = "{dir}/receipt.json" }

# ---------------------------------------------------------------------------
# CI tooling, not products: published from main and pinned by digest where they are used.

[[product]]
family = "ci-images"
name = "ci-fast"
about = """
The fast CI image, x86_64 only: published from main, pinned by digest in tools/ci/images.toml
by hand. image-ci-fast-smoke runs what the jobs that use it need, before it is published."""
repository = "registry.tilo.so/tilo/ci-fast"
dev = ["sha-{commit}"]
gates = ["image-ci-fast-smoke"]

[product.build]
containerfile = "os/Containerfile.ci-fast"

[[product]]
family = "ci-images"
name = "release-tools"
about = """
The release tools image (os/Containerfile.release-tools): the compiler-free environment the
release jobs run in, built and tested natively per architecture and published from main as
one index when someone asks (`t dispatch publish-release-tools --ref main`). Its consumers pin
the index by digest by hand, so a push to main has nothing to publish it for; jobs pull it
before they can log in, so it must be anonymously pullable."""
repository = "registry.tilo.so/tilo/tilo-release-tools"
arches = ["x86_64", "aarch64"]
index = true
dev = ["sha-{commit}"]
dispatch = true
anonymous = true

[product.build]
containerfile = "os/Containerfile.release-tools"
test = ["bash os/tests/release_tools_image.sh {out}/image.oci.tar"]

[[product]]
family = "ci-images"
name = "ci-builder"
about = """
The CI builder (os/Containerfile.builder, tools/ci/publish/ci-builder.sh): the image t's checks
and the CI jobs run in, with the pinned toolchain baked in, built natively per architecture and
joined into one index. The canaries below run inside each candidate before anything is signed
or published. Everyone pushes to main, so main publishes only development tags (`dev-<commit>`,
and `dev-<commit>-<arch>` for each image), signed with the development key (keys/cosign-dev.pub)
by sign-dev-ci-builder; nothing a consumer resolves by a moving tag or verifies against
keys/cosign.pub comes from main. Stable signs the index and both
images with the release key, each with a transparency log entry so that a plain `cosign verify
--key keys/cosign.pub` accepts them, and publishes `<commit>` and `<rust channel>`. `latest`, which
resolve_builder.py and tilo-app-cli's generated CI follow, is not moved yet: stable lags main,
and moving `latest` from it would hand main's consumers an older toolchain."""
repository = "registry.tilo.so/tilo/tilo-builder"
arches = ["x86_64", "aarch64"]
index = true
children = true
dev = ["dev-{commit}"]
release = ["{commit}", "{rust}"]
tlog = true
dev_signed = true
gates = ["canary-ci-builder-cache-warm-x86_64", "canary-ci-builder-cache-warm-aarch64", "canary-ci-builder-browser-x86_64", "canary-ci-builder-browser-aarch64", "canary-ci-builder-x11-bridge-x86_64"]
# The publication pushes archives of both architectures, so where it runs changes nothing it
# publishes. Pushes from the x86_64 micro-VMs stalled at about 1.2 GB of the builder's layers,
# every time, while the same blobs go through from arm64.
publish = { requires = ["arch=arm64"] }

[product.build]
run = "bash tools/ci/publish/ci-builder.sh build {arch} {out}"
needs = ["os-assets"]
timeout_secs = 14400

# The builder's canaries, in the candidate the same run built. Two jobs prove t's compiler cache works from it: the
# cold one compiles under a prefix nobody used and must write, the warm one, a fresh compiler
# process in another job (on whichever node), must read that back. The candidate's key covers
# everything that went into it, so a new image runs them again.
[[matrix]]
family = "ci-images"
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { requires = ["arch={arch}"], default = false }

[[matrix.check]]
name = "canary-ci-builder-cache-cold-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh cold /target/publish/ci-builder/{arch}/canary"
outputs = ["/target/publish/ci-builder/{arch}/canary/prefix"]

[[matrix.check]]
name = "canary-ci-builder-cache-warm-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh warm /target/publish/ci-builder/{arch}/canary"
needs = ["canary-ci-builder-cache-cold-{arch}"]

# The native Chromium and the browser regressions that once broke on a builder. Their tests run
# `npm ci` in scripts/moq-browser, inside the source tree. Both architectures gate publication,
# as build-ci-builder.yml did: a builder whose Chromium breaks on either is not published.
# Keyed by the candidate builder and the browser side of the tests, not by the Rust packages
# whose tests it runs: those change on nearly every commit of main (0.8% of its runs came from
# cache) while what it judges, the builder, changes rarely, and the packages' own tests run in
# the `test` family on every commit. A builder change runs it against that commit's code.
[[matrix.check]]
name = "canary-ci-builder-browser-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh browser"

# The shell's X11 clipboard tests against the candidate's own xwayland-satellite, which is built
# from patched source (os/external-assets/xwayland-satellite/): a builder whose bridge drops a
# paste in flight during the clipboard manager's takeover must not be published. Gates
# publication on x86_64 only: on aarch64 its compile of the shell outgrew the memory it had.
# Keyed by the builder and the bridge's sources, not by the shell, which changes on nearly every
# commit of main while what it judges, the builder's bridge, changes rarely; the shell's own tests
# run in its test family.
[[matrix.check]]
name = "canary-ci-builder-x11-bridge-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh x11-bridge"

# ---------------------------------------------------------------------------
# The OS's foundations: the frozen RPM snapshot, the kernel buildroot and the kernel.

[[product]]
family = "os-base"
name = "rpms"
about = """
The frozen RPM snapshot (tools/ci/publish/rpms-build.sh): every package the OS Containerfiles
name, resolved, signature-checked and laid out as a repository image, natively per
architecture, joined into one index. Stable signs the index and both images, attests the
index's SLSA provenance (frozen-rpm-index/v1: both package sets and the base, which
os/dev/resolve-rpm-snapshot.sh and the OS build verify), both with a transparency log entry,
and publishes it as `set-<fingerprint>` once: a fingerprint already published is never moved.
Main publishes nothing, since the snapshot is signed: a package set main changes is published
once stable reaches it."""
repository = "registry.tilo.so/tilo/rpms"
arches = ["x86_64", "aarch64"]
index = true
children = true
tlog = true
release = ["once:set-{fingerprint}"]

[product.provenance]
run = "bash tools/ci/publish/rpms-provenance.sh {dir}"
outputs = ["{dir}/index/fingerprint", "{dir}/x86_64/fingerprint", "{dir}/aarch64/fingerprint"]

# Each build starts FROM the mirrored Fedora bootc base, which mirror-base puts there. It takes
# the package set rpm-package-set derived, not the Containerfiles it was derived from: an edit
# to a Containerfile that names no other package leaves the snapshot, and everything built on
# it, where it was.
[product.build]
run = "bash tools/ci/publish/rpms-build.sh {arch} {out}"
outputs = ["{out}/epoch"]
needs = ["os-assets", "rpm-package-set"]
optional_needs = ["mirror-base"]
requires = ["disk-100g"]
timeout_secs = 10800

[[product]]
family = "os-base"
name = "kernel-buildroot"
about = """
The kernel buildroot (os/Containerfile.kernel-buildroot, tools/ci/publish/kernel-buildroot.sh):
the only build that resolves kernel build dependencies and the Fedora kernel SRPM from Fedora.
Each architecture is built natively and audited; stable signs (with a transparency log entry,
since the kernel build verifies requiring one) and publishes both and sets the
`kernel-buildroot` pointer. `kernel-buildroot.sh pin` commits stable's pins to
os/kernel-buildroot-snapshot.env from pin-kernel-buildroot, a check that pushes to main."""
repository = "registry.tilo.so/tilo/tilo-kernel-buildroot"
arches = ["x86_64", "aarch64"]
release = ["sha-{commit}-{arch}"]
tlog = true
after_publish = "bash tools/ci/publish/kernel-buildroot.sh pins {dir}/x86_64 {dir}/aarch64"

[product.build]
run = "bash tools/ci/publish/kernel-buildroot.sh build {arch} {out}"

[product.publish]
outputs = ["{dir}/pins.env"]
pointers = { kernel-buildroot = "{dir}/pins.env" }

[[product]]
family = "os-base"
name = "kernel"
about = """
The kernel (tools/ci/publish/kernel.sh): Fedora's kernel with Tilo's config fragment, built
FROM the pinned signed buildroot of the machine it builds on (natively, or the aarch64 kernel
cross-compiled on x86_64, where `hosts` says so) through the compiler cache
image-kernel-cache-<arch> compiled, then booted under emulation on its own architecture with its
module signatures checked and the firmware's Secure Boot enforcement probed, as root in a
micro-VM step (kernel-acceptance-<arch>). Stable
signs each architecture's image and attests its SLSA provenance (kernel-rpm/v1: the source
commit, the buildroot it was built FROM and the architecture it was built on, which
os/dev/verify-kernel-provenance.sh checks),
both with a transparency log entry, publishes them as `sha-<commit>-<arch>` and sets the
`kernel` pointer, which pin-kernel commits to os/kernel-snapshot.env on main. That tag is
pushed once: a stable run again on the same commit whose rebuild differs leaves it, and the
digest pinned from it, where they are, rather than moving the tag and leaving the earlier digest
untagged. Main publishes
nothing, since the OS build verifies the kernel's signature."""
repository = "registry.tilo.so/tilo/tilo-kernel"
arches = ["x86_64", "aarch64"]
release = ["once:sha-{commit}-{arch}"]
tlog = true
gates = ["kernel-acceptance-x86_64", "kernel-acceptance-aarch64"]
after_publish = "bash tools/ci/publish/kernel.sh pins {dir}"

[product.provenance]
run = "bash tools/ci/publish/kernel.sh provenance {dir}"

[product.publish]
outputs = ["{dir}/pins.env"]
pointers = { kernel = "{dir}/pins.env" }

[product.build]
run = "bash tools/ci/publish/kernel.sh build {arch} {out} /target/publish/kernel-cache/{arch}/compiler-cache.tar"
needs = ["os-assets", "image-kernel-cache-{arch}", "kernel-signer-crate"]
outputs = ["{out}/secureboot/**", "{out}/buildroot", "{out}/build-architecture"]
requires = ["disk-100g"]
timeout_secs = 14400

# ---------------------------------------------------------------------------
# Images the OS and its environments fetch: the relay and the Linux legacy VM guest.

[[product]]
family = "os-images"
name = "relay"
about = """
The standalone relay image (os/containers/tilo-relay): built on every change from the
mirrored base and the published frozen RPM snapshot (the run's own image-rpms-x86_64 while a
changed package set is unpublished, which is never signed), signed and released for version tags
only, as `<version>` (v1.2.3 -> 1.2.3) and `sha-<commit>`, and a final version (not a
pre-release) also as `latest`, which the relay and agent-host Compose files run by default."""
repository = "registry.tilo.so/tilo/tilo-relay"
release = ["{version}", "sha-{commit}", "final:latest"]
# Version tags only (v1.2.3, v1.2.3-rc.1): a release rehearsal's tag (v0-rehearsal-<n>) is a v*
# tag too, so the identity tokens reach it, but releases no relay.
release_on = ["tag:v[0-9]*.[0-9]*.[0-9]*"]
tlog = true

[product.build]
run = "bash tools/ci/publish/relay-build.sh /target/publish/rpm-snapshot /target/publish/rpms/x86_64 {out}"
needs = ["rpm-snapshot", "image-rpms-x86_64", "os-assets"]
outputs = ["/target/publish/relay/rpms-source"]

[[product]]
family = "os-images"
name = "legacy-guest"
about = """
The Linux legacy VM guest (os/Containerfile.legacy-guest, tools/ci/publish/legacy-guest.sh):
the guest agent built here, the guest image built with it as root in an x86_64 micro-VM
step, installed to a disk and booted once until the agent serves, then the whole path end to end
(legacy-guest-e2e: the disk through `tilo-legacy` against a headless shell, a window, typed
text, a shared directory, suspend and resume). Stable signs (with a transparency log entry,
since `tilo-legacy` verifies requiring one) and publishes the disk and sets the
`legacy-guest` pointer; `legacy-guest.sh pin` commits it to os/legacy-guest-snapshot.env from
pin-legacy-guest, a check that pushes to main."""
repository = "registry.tilo.so/tilo/legacy-guest"
out = "{dir}/image"
release = ["x86_64-{commit}"]
tlog = true
gates = ["legacy-guest-e2e"]
after_publish = "bash tools/ci/publish/legacy-guest.sh pins {out}"

[product.build]
run = "bash tools/ci/publish/legacy-guest.sh build {dir}/agent {out}"
image = ""
needs = ["legacy-guest-agent"]
requires = ["/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 9000

[product.publish]
outputs = ["{out}/pins.env"]
pointers = { legacy-guest = "{out}/pins.env" }

[[matrix]]
family = "windows"
about = """
Windows, cross-compiled and packaged on Linux (docs/publishing-on-t.md, Windows). The
builds run cargo-xwin against the MSVC CRT and Windows SDK, which Microsoft does not let
anyone redistribute: the windows-sdk checks download them once into t's private store
(their only input is the pinned versions) instead of into the public builder image.
Packaging and the Wine checks run on x86_64, the only builder with Wine (it runs x86 programs).
They pin the first builder with the Windows tools until the default image above moves past it."""
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { image = "registry.tilo.so/tilo/tilo-builder@sha256:da7c1556f8a38b33e5e85f8086bbd162194a2377e56898481000cefb4412fa9d" }

[[matrix.check]]
name = "build/windows-sdk-{arch}"
run = "bash tools/ci/windows/build.sh sdk {arch} /target/windows/sdk"
outputs = ["/target/windows/sdk/sdk-{arch}.tar.zst", "/target/windows/sdk/sdk-{arch}.tar.zst.sha256"]
default = false

[[matrix.check]]
name = "build/windows-{arch}"
run = "bash tools/ci/windows/build.sh imager {arch} /target/windows/sdk/sdk-{arch}.tar.zst /target/windows/{arch}/build"
needs = ["build/windows-sdk-{arch}"]
outputs = ["/target/windows/{arch}/build/imager.exe", "/target/windows/{arch}/build/imager.exe.sha256"]
default = false

[[matrix.check]]
name = "build/windows-{arch}-tests"
run = "bash tools/ci/windows/build.sh tests {arch} /target/windows/sdk/sdk-{arch}.tar.zst /target/windows/{arch}/tests"
needs = ["build/windows-sdk-{arch}"]
outputs = ["/target/windows/{arch}/tests/imager-tests.exe", "/target/windows/{arch}/tests/imager-tests.exe.sha256"]
default = false

[[matrix.check]]
name = "package/windows-{arch}"
run = "bash apps/imager/packaging/package-windows.sh {arch} /target/windows/{arch}/build/imager.exe /target/windows/{arch}/package"
needs = ["build/windows-{arch}"]
outputs = ["/target/windows/{arch}/package/*"]
requires = ["arch=x86_64"]
default = false
comment = "The unsigned package: standalone EXE, zip and Inno Setup installer, each with a digest."

[[matrix.check]]
name = "sign/windows-{arch}"
run = "bash tools/ci/windows/sign.sh {arch} /target/windows/{arch}/build /target/windows/{arch}/package /target/windows/{arch}/signed"
needs = ["build/windows-{arch}", "package/windows-{arch}"]
outputs = ["/target/windows/{arch}/signed/*"]
secrets = ["TILO_AUTHENTICODE_CERT_CHAIN", "TILO_WINDOWS_PUBLISHER"]
id_token = ["sts.amazonaws.com"]
env = { TILO_AUTHENTICODE_KMS_KEY = "arn:aws:kms:us-east-1:125650147312:alias/tilo-authenticode-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTPackageSigner" }
on = ["tag:imager-v*"]
requires = ["arch=x86_64"]
cache = false
comment = """
Authenticode, for imager release tags only: re-checks the build's digest against the one
the package carries, then packages that executable again signing the EXE and the installer
with a key that never leaves AWS KMS, as the role an identity token of the tag is
exchanged for."""

[[matrix.check]]
name = "package/windows-winget"
run = """
root=$TMPDIR/winget-release
rm -rf "$root" && mkdir -p "$root"
cp /target/windows/x86_64/package/tilo-imager-setup-windows-x86_64.exe* /target/windows/aarch64/package/tilo-imager-setup-windows-aarch64.exe* "$root/"
python3 apps/imager/packaging/generate-winget.py "$root" --version 0.1.0 --base-url https://github.com/tilo-os/releases/releases/download/imager-v0.1.0
python3 apps/imager/packaging/validate-winget.py "$root/winget"
rm -rf /target/windows/winget && cp -r "$root/winget" /target/windows/winget
"""
needs = ["package/windows-x86_64", "package/windows-aarch64"]
outputs = ["/target/windows/winget/*"]
# Python over the two installers: the manifests are the same from any node.
requires = ["arch=any"]
default = false
comment = """
Both installers in one WinGet manifest set, checked against WinGet's schemas (the version
and URL are placeholders: the release generates the real set from the signed installers)."""

[[matrix.check]]
name = "imager-winget-acceptance"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
run = '''
[[ -n ${TILO_SITE_TOKEN:-} ]] || {
  echo 'TILO_SITE_TOKEN is not set: the server config must give this check the site bot token' >&2
  exit 1
}
command -v npm >/dev/null || dnf -y -q install --setopt=install_weak_deps=False nodejs-npm >/dev/null
GITHUB_SERVER_URL=https://code.tilo.so TILO_SITE_GIT_TOKEN=$TILO_SITE_TOKEN \
  bash apps/imager/packaging/monitor-winget-acceptance.sh
'''
# The site repository is on the forge, whose Git does not take t's identity tokens.
secrets = ["TILO_SITE_TOKEN"]
# A check holding a secret runs as a micro-VM step, which t boots on x86_64 only for now.
requires = ["arch=x86_64"]
# It watches Microsoft's index and the published site, which change without this repository.
cache = false
timeout_secs = 1800
default = false
on = ["schedule:23 */6 * * *", "dispatch"]
comment = """
The landing page's WinGet route, every six hours: once Microsoft's index serves the exact
