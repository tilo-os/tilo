[[matrix]]
family = "desktop"
about = """
Every distribution userspace of one architecture, built and install-tested in its own
container (dist/ci/package-lane.sh): `t outputs desktop-package-amd64` gives the packages and
the OS desktop payload. The containers need a privileged node."""
each = [{ arch = "x86_64", deb = "amd64", node = "arch=x86_64" }, { arch = "aarch64", deb = "arm64", node = "arch=arm64" }]

[[matrix.check]]
name = "desktop-package-{deb}"
run = "bash dist/ci/package-lane.sh {deb}"
outputs = ["dist/ci-output/**"]
requires = ["{node}"]
isolation = "vm"
# Packages record their source commit and time; the Nix lane reads the tree through Git.
git = true
# Five userspaces, about an hour each for the four that compile the session (arch, Ubuntu,
# Debian, Fedora): the amd64 lane was still linking Fedora's at four hours.
timeout_secs = 21600
# The lanes build one after another, TILO_CARGO_JOBS (6) compilers at a time: fat-LTO links
# peak at several GiB each.
# The tilo registry's owner public key, which the packages install as the trust root for
# system app updates (dist/rpm/stage-app-store.sh). Public, but server configuration: t gives it
# to trusted runs of main, stable and tags only, so a working tree's run builds no Fedora RPMs.
secrets = ["TILO_OFFICIAL_REGISTRY_OWNER_PUBKEY"]
default = false
# Dispatchable on main, so a developer can install packages of main's head on their own host
# without building every lane on their machine.
on = ["dispatch"]

[[matrix.check]]
name = "host-session-e2e"
heavy = true
run = '''
dnf --setopt=retries=3 --setopt=install_weak_deps=False install -y \
  qemu-system-x86-core qemu-device-display-virtio-vga qemu-device-display-virtio-gpu \
  qemu-device-display-virtio-gpu-pci qemu-img openssh-clients xorriso python3 curl
python3 os/dev/probe-kvm.py x86_64
work=$(mktemp -d /var/tmp/host-session-e2e.XXXXXX)
rpms=dist/ci-output/fedora-44-amd64
rm -rf target/host-session-e2e && mkdir -p target/host-session-e2e
python3 dist/session/vm-e2e/run.py source --rpms "$rpms" --producer desktop-package-amd64
cp "$rpms/source.json" target/host-session-e2e/source.json
python3 dist/session/vm-e2e/run.py test --rpms "$rpms" --out target/host-session-e2e \
  --work "$work/vm" --image-cache "$work/images" --apps "${T_INPUT_APPS:-}"
'''
# Only a lane that passed has outputs, so the RPMs a failed lane keeps for diagnosis
# (failed-rpms/) never reach the VM; run.py takes the top-level *.rpm only.
needs = ["desktop-package-amd64"]
outputs = ["target/host-session-e2e/**"]
# source.json names the commit (T_COMMIT) in every run, not only dispatched ones.
git = true
requires = ["arch=x86_64", "/dev/kvm", "disk-100g"]
isolation = "vm"
timeout_secs = 5400
default = false
on = ["stable", "dispatch"]
dispatch_inputs = { apps = "" }
comment = """
The desktop session's Fedora 44 RPMs (desktop-package-amd64) on stock Fedora 44 Cloud under KVM,
as a person runs them: dnf install, the keyring unlocked, SDDM autologin into tilo.desktop, then
apps opened through search; the compositor must survive each. Then the way back: the same packages
upgraded in place with the person's files intact, signing out and signing in to the desktop the
host had before Tilo, and removing the packages while the login session menu, the packages and the
login user's files stay as they were (dist/session/README.md, "VM test"). The Cloud image carries
no other login, so the return check is reported as failed rather than skipped when the VM has no
previous desktop to sign back in to. In the privileged VM's own Fedora, which takes QEMU from dnf.
Stable publishes the desktop payload only after it passes. `t dispatch host-session-e2e --input
apps=so.tilo.notes` opens only those apps (empty: all); `t outputs host-session-e2e` gives the
report and source.json, each tested RPM's size and SHA-256."""

[[matrix.check]]
name = "publish-desktop-payload"
image = "registry.tilo.so/tilo/ci-fast@sha256:4974765531ae306e2c33265f0d7d33624c09579279dbf7ed0d519ca5ed0efa89"
run = "bash dist/ci/publish-desktop-payload.sh /target/publish/desktop/payload.json"
# Only packages that logged in on stock Fedora become the payload an OS build installs.
needs = ["desktop-package-amd64", "desktop-package-arm64", "host-session-e2e"]
outputs = ["/target/publish/desktop/payload.json"]
pointers = { desktop-payload = "/target/publish/desktop/payload.json" }
secrets = ["REGISTRY_TOKEN"]
# A check holding a secret runs as a micro-VM step, which t boots on x86_64 only for now.
requires = ["arch=x86_64"]
on = ["stable"]
comment = """
The OS desktop payload from stable: the Fedora lanes' payloads as immutable generic packages,
and the `desktop-payload` pointer to them, which an OS build reads
(`reads_pointers = ["stable:desktop-payload"]`)."""

