about = """
The portable FEX payload (os/Containerfile.fex-payload): the pinned FEX source, fetched and
verified with its submodules, compiled offline on aarch64 in the toolchain above against the
x86 SDK. Both are named by the digests they are published as, so publish-fex-payload pushes
them first. A development candidate: signed with the development key, never the release key."""
repository = "registry.tilo.so/tilo/tilo-fex-payload-candidate"
arches = ["aarch64"]
dev = ["{commit}"]
dispatch = true
dev_signed = true
gates = ["publish-fex-buildroot", "publish-fex-x86-sdk"]
after_publish = "sed -n 's/.*\"image\":\"\\([^\"]*\\)\".*/\\1/p' {dir}/receipt.json > {dir}/reference"

[product.publish]
outputs = ["{dir}/reference"]
pointers = { fex-payload-candidate = "{dir}/reference" }

# Its limited provenance (a development build whose runtime acceptance nothing verified),
# attested with the development key beside the signature.
[product.provenance]
run = "bash tools/ci/publish/fex-provenance.sh {dir} /target/publish/fex-buildroot /target/publish/fex-x86-sdk"
needs = ["image-fex-buildroot", "image-fex-x86-sdk"]

[product.context]
run = "bash tools/ci/publish/windows-compat.sh fex-source {dir}/fex-source.tar"
outputs = ["{dir}/fex-source.tar"]

[product.build]
run = "bash tools/ci/publish/fex-payload.sh {out} /target/publish/fex-buildroot /target/publish/fex-x86-sdk {dir}/fex-source.tar"
needs = ["image-fex-buildroot", "image-fex-x86-sdk"]
timeout_secs = 10800

[[product]]
family = "windows-compat"
name = "wine-tools"
about = """
The tooling Wine is rebuilt in (os/Containerfile.wine-tools): Mock, podman and the producer
scripts, natively on x86_64. The Wine steps below run in it as their micro-VM's userspace."""
repository = "registry.tilo.so/tilo/wine-tools"
dev = ["candidate-{commit}"]
dispatch = true

[product.build]
run = "bash tools/ci/publish/windows-compat.sh wine-tools {out}"
needs = ["os-assets"]
timeout_secs = 3600

[[matrix]]
family = "windows-compat"
about = """
The x86 Windows guest, as root in micro-VM steps running the wine-tools image just built
(tools/ci/publish/wine.sh): the pinned Wine source fetched and verified once; per target, Mock
resolves its build dependencies with the network, then wine-build-<target> rebuilds Wine from
that bundle alone, offline, into the RPMs and their contract; image-wine-paired merges the two
targets' RPMs into the pair the guest installs; image-windows-guest signs the pair with a key
made for the run and assembles the guest (tools/ci/publish/windows-guest.sh). Every image is an
archive named by the digest it is published with, so the contracts the steps write name what
is published."""
each = [{ arch = "x86_64", target = "x86_64" }, { arch = "x86_64", target = "i686" }]
fields = { image = { check = "image-wine-tools", path = "/target/publish/wine-tools/image.oci.tar" }, isolation = "vm", requires = ["arch=x86_64"], default = false }

# Fetching and verifying the source needs no root: the job sandbox, in the wine-tools image.
[[matrix.check]]
name = "wine-source"
isolation = "strict"
run = """
bash tools/ci/publish/wine.sh source /target/windows-compat/wine-source
for test in os/tests/test_fetch_wine_source.py os/tests/test_wine_rpm_contract.py os/tests/test_wine_rpm_merge.py os/tests/test_wine_mock_producer.py; do python3 "$test"; done
"""
outputs = ["/target/windows-compat/wine-source/**"]

[[matrix.check]]
name = "wine-resolve-{target}"
run = "bash tools/ci/publish/wine.sh resolve {target} /target/windows-compat/wine-resolve-{target}"
needs = ["wine-source"]
outputs = ["/target/windows-compat/wine-resolve-{target}/bundle.tar"]
timeout_secs = 3600

[[matrix.check]]
name = "wine-build-{target}"
run = "bash tools/ci/publish/wine.sh build {target} /target/windows-compat/wine-build-{target}"
needs = ["wine-resolve-{target}"]
outputs = ["/target/windows-compat/wine-build-{target}/**"]
requires = ["arch=x86_64", "disk-100g"]
timeout_secs = 14400

[[matrix.check]]
name = "image-wine-paired"
run = "bash tools/ci/publish/wine.sh pair /target/windows-compat/wine-paired"
needs = ["wine-build-x86_64", "wine-build-i686"]
outputs = ["/target/windows-compat/wine-paired/**"]
timeout_secs = 3600

[[matrix.check]]
name = "image-windows-guest"
run = "bash tools/ci/publish/windows-guest.sh /target/windows-compat/windows-guest"
needs = ["image-wine-paired"]
outputs = ["/target/windows-compat/windows-guest/**"]
requires = ["arch=x86_64", "disk-100g"]
timeout_secs = 5400

[[matrix.check]]
name = "publish-windows-guest"
comment = """
Pushes every image the guest names, in the order they name each other, and the guest last:
dispatched on main only (`t dispatch publish-windows-guest --ref main`)."""
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = """
set -e
w=/target/windows-compat
for target in x86_64 i686; do
  bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/wine-resolution $w/wine-build-$target/resolution "candidate-{commit}-$target"
  bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/wine-rpms $w/wine-build-$target/rpms "candidate-{commit}-$target"
done
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/wine-paired $w/wine-paired 'candidate-{commit}'
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-development-wine $w/windows-guest/development-wine 'candidate-{commit}'
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-development-windows-guest-rpms $w/windows-guest/rpms 'candidate-{commit}'
bash tools/ci/publish/oci-publish.sh dev registry.tilo.so/tilo/tilo-development-windows-guest $w/windows-guest/guest 'candidate-{commit}'
sed -n 's/.*"image":"\\([^"]*\\)".*/\\1/p' $w/windows-guest/guest/receipt.json > $w/windows-guest/guest/reference
"""
needs = ["publish-wine-tools", "wine-build-x86_64", "wine-build-i686", "image-wine-paired", "image-windows-guest"]
outputs = ["/target/windows-compat/wine-build-*/*/receipt.json", "/target/windows-compat/wine-paired/receipt.json", "/target/windows-compat/windows-guest/*/receipt.json", "/target/windows-compat/windows-guest/guest/reference"]
pointers = { windows-guest-candidate = "/target/windows-compat/windows-guest/guest/reference" }
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["dispatch"]

[[matrix]]
