timeout_secs = 7200
default = false

[[matrix.check]]
name = "os-dev-disk-{arch}"
comment = """
os-dev-image-{arch} installed onto a disk (tools/ci/publish/os-dev-disk.sh), never booted
itself: what os-acceptance-{arch} boots throwaway overlays of, and what publish-os-dev-disk-{arch}
publishes once they passed."""
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
run = "bash tools/ci/install-packages.sh tools/ci/packages/os-vm.txt tools/ci/packages/qemu-{arch}.txt && bash tools/ci/publish/os-dev-disk.sh {arch} /target/publish/os-dev/{arch} /target/publish/os-dev-disk/{arch}"
needs = ["os-dev-image-{arch}"]
