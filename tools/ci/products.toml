the desktop runs start (tools/ci/image_smoke.py); then the image is installed onto a disk as a
release validation installs one and booted under KVM until the greeter accepts input, with no
unit failed on the way. It installs from the RPM set of the same run when no snapshot of it is
published, so a package-set change is checked on main before it reaches stable."""
run = "bash tools/ci/publish/os-image-smoke.sh {arch} /target/publish/os/{arch} /target/publish/os-smoke/{arch}"
inputs = ["tools/ci/publish/lib.sh", "tools/ci/publish/os-image-smoke.sh", "tools/ci/image_smoke.py", "os/dev/vm.sh", "os/dev/_common.sh", "os/dev/installer-console.py", "os/dev/build-image.sh", "os/dev/disk-image.sh", "os/dev/reseal-image.sh"]
needs = ["os-image-{arch}"]
outputs = ["/target/publish/os-smoke/{arch}/**"]
git = true
requires = ["{node}", "/dev/kvm", "disk-100g"]
isolation = "vm"
cost = "heavy"
requirement = { cores = 8, memory = "16GiB" }
timeout_secs = 5400
on = ["schedule:30 1 * * *"]
default = false

[[matrix]]
family = "os"
about = """
Board dev images (os/Containerfile.board, tools/ci/publish/os-image.sh board): the board's
firmware, device tree and initramfs on the aarch64 dev image of the same commit, sealed in a UKI,
since bootc takes a device tree only from one. Every night, and when dispatched (`t dispatch
publish-os-board-lenovo-83ed --ref main`), main's head is built and pushed as
registry.tilo.so/tilo/tilo-vm:main-<commit7>-<board>, which `tilo-vm vm upgrade --from
sha:<commit>` takes on that board, and tilo-vm:<board>-ci moves to it, which installed boards
follow on their own (DEVELOPMENT.md, "Board dev images on real hardware")."""
each = [{ arch = "aarch64", board = "lenovo-83ed" }, { arch = "aarch64", board = "orangepi-3b-v2-1" }]

[[matrix.check]]
name = "os-board-{board}"
run = "bash tools/ci/publish/os-image.sh board {board} /target/publish/os-dev/aarch64 /target/publish/os-board/{board}"
inputs = ["os/Containerfile.board", "os/Containerfile.bootc-helper", "os/external-assets/**", "os/dev/**", "os/scripts/build-initramfs.sh", "os/scripts/verify-board-initramfs.py", "os/hardware/**", "os/usr/**", "os/etc/NetworkManager/**", "os/base-snapshot.env", "os/publication.env", ".containerignore"]
needs = ["os-dev-image-aarch64"]
outputs = ["/target/publish/os-board/{board}/image.oci.tar", "/target/publish/os-board/{board}/digest", "/target/publish/os-board/{board}/revision", "/target/publish/os-board/{board}/board"]
git = true
requires = ["arch=arm64", "disk-100g"]
isolation = "vm"
writable_sources = true
cost = "heavy"
requirement = { cores = 4, memory = "8GiB" }
timeout_secs = 3600
default = false

[[matrix.check]]
name = "publish-os-board-{board}"
image = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
run = "bash tools/ci/publish/os-board-publish.sh {board} /target/publish/os-board/{board}"
inputs = ["tools/ci/publish/lib.sh", "tools/ci/publish/oci-publish.sh", "tools/ci/publish/os-board-publish.sh"]
needs = ["os-board-{board}"]
outputs = ["/target/publish/os-board/{board}/receipt.json"]
id_token = ["registry.tilo.so"]
requires = ["arch=any"]
on = ["schedule:30 1 * * *", "dispatch"]

[[matrix]]
family = "extension-manifests"
about = """
Downloadable system-extension manifests (tools/ci/publish/extension-manifests.sh): every
day, and when dispatched with `--input images=…`, each published OS image's native child
resolves every extension inside itself, as root in a micro-VM step and without credentials;
`publish-extension-manifests` signs the manifests with the extension-manifest key in KMS (not
the OS release key) and publishes those that changed. Mirrors drop superseded builds and
publishers ship updates, so nothing is served from the cache."""
each = [{ arch = "x86_64", node = "arch=x86_64" }, { arch = "aarch64", node = "arch=arm64" }]
fields = { dispatch_inputs = { images = "", expected_content_sha256 = "", publish = "true" } }

[[matrix.check]]
name = "extension-manifests-{arch}"
run = "bash tools/ci/publish/extension-manifests.sh resolve {arch} /target/extension-manifests/{arch}"
inputs = ["tools/extensions/**"]
outputs = ["/target/extension-manifests/{arch}/**"]
requires = ["{node}", "disk-100g"]
isolation = "vm"
requirement = { cores = 4, memory = "8GiB" }
timeout_secs = 3600
cache = false
on = ["schedule:40 4 * * *", "dispatch"]
default = false

[[matrix.check]]
name = "publish-extension-manifests"
run = "bash tools/ci/publish/extension-manifests.sh publish /target/extension-manifests/x86_64 /target/extension-manifests/aarch64"
inputs = ["tools/extensions/**", "os/dev/configure-cosign-kms.sh", "os/dev/install-cached-cosign.sh", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", "keys/extensions.pub", "keys/release/**", "keys/operational/**", "tools/signing/sign-blob-certified.sh"]
needs = ["extension-manifests-x86_64", "extension-manifests-aarch64"]
# The extension-manifest key, not the OS release key: devices verify manifests only against
# keys/extensions.pub. Its role trusts only this audience, which no other check asks for.
env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-extension-manifests", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTExtensionManifestSigner", TILO_SIGNING_AUDIENCE = "tilo-extension-manifests" }
id_token = ["tilo-extension-manifests"]
# Generic packages take no identity token.
secrets = ["TILO_PACKAGES_TOKEN"]
requires = ["arch=any"]
cache = false
on = ["schedule:40 4 * * *", "dispatch"]
