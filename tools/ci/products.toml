# The size gate: packages the default collection as apps-build does and holds each tapp and the
# runtime to its budget (tools/perf/tapp-size-budget/, tools/perf/runtime-size-budget/). It runs
# on every release candidate (stable) and on demand (`t dispatch app-sizes-x86_64`, or
# `t test app-sizes-x86_64` for a working tree), not on every push to main: each run builds the
# whole collection, 10 to 16 minutes on 16 cores, and on main it cost 17 job-hours a day while
# failing on every run. A candidate over budget is held back, and the commit that took an app
# over is found among those the candidate adds.
# Between candidates, a change that concerns an app runs that app's own size check
# (`t test app-size/<app>-<arch>`, or `runtime-size-<arch>` for the runtime), keyed by what it is
# built from; t_toml.py generates them.
[[matrix.check]]
name = "app-sizes-{arch}"
run = "bash tools/apps/t-release.sh sizes {arch}"
requires = ["{node}"]
# The runtime library's link and the apps' one-unit codegen run side by side.
requirement = { cores = 16, memory = "32GiB" }
timeout_secs = 5400
cost = "heavy"
on = ["stable", "dispatch"]
default = false

# The default collection with its symbol tables, for reading what makes an app large:
# `t test app-binaries-aarch64 && t outputs app-binaries-aarch64` puts the apps, the runtime and
# its engines in target/app-binaries/aarch64/ (docs/measurements/app-package-size.md).
