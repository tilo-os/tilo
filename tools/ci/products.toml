[[matrix]]
family = "env-tools"
about = """
The env tool catalog (tools/ci/publish/env-tools.sh): every tool of os/env-tools-catalog.txt
built natively against the published env-runtime, as root in the CI builder in a micro-VM step
(the build sandbox makes user namespaces and mounts overlays). The build runs package
scriptlets, so it holds no key: it seals each tool for the runtime's publisher with a
placeholder signature. `t test env-tools-x86_64` builds the catalog from a working tree (on an
unpublished preview of the runtime while none is published), `t test image-env-tools-preview`
the image of both architectures. On stable, env-tools-plan names the tag the catalog publishes
as, `<runtime tag>-<catalog fingerprint>`; where that is published already nothing is built,
else it fetches the runtime release-env-runtime published for the builds. seal-env-tools, which
builds nothing, checks the tools and signs them with the publisher identity, rewriting each
catalog to name the signed ids; image-env-tools puts both architectures in one image for both
platforms, sign-env-tools signs its digest with a transparency log entry and publish-env-tools
pushes it once under the tag. Main publishes nothing: the publisher identity reaches stable
only."""
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { default = false }

