about = """
Images built on the OS image of the same tree: its image is os-image-<arch>, composed from the
layer actions of os/image/layers.toml (the os-layers block, tools/ci/os/os_toml.py), as an OCI
layout under /target/os/<arch>/image."""
each = [{ arch = "x86_64", node = "arch=x86_64", vm = "tilo-vm-binary-x86_64" }, { arch = "aarch64", node = "arch=arm64", vm = "tilo-vm-binary-arm64" }]

[[matrix.check]]
name = "os-dev-image-{arch}"
comment = """
The dev image a development VM runs (os/Containerfile.dev: tilo-vmd, sshd, the toolchain and the
components with their dev features, compiled by os-compile-dev-{arch}, and model-catalog-dev-{arch}'s
local model catalog with the runtimes of this tree) on os-image-{arch}, kept as an OCI layout of its
layers over the OS image's."""
image = { check = "os-assembler-{arch}", path = "/target/os/{arch}/assembler/oci" }
run = "bash tools/ci/publish/os-image.sh dev {arch} /target/os/{arch}/image /target/publish/os-dev/{arch} /target/os/{arch}/compiled-dev"
