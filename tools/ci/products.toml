# What Tilo publishes as container images, one table per product. tools/ci/products.py turns
# each into its chain of checks in t.toml (`python3 tools/ci/t_toml.py write`); the format and
# how to add a product are in docs/publishing-on-t.md, "Products".

[defaults]
buildah = "registry.tilo.so/tilo/buildah@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c"
skopeo = "registry.tilo.so/tilo/skopeo@sha256:7e735527d9d64c7456fc82d7f954c380b4a5dd1a8173115ce2ed7b3442ef36e0"
# The release key in KMS and the role that may sign with it, for stable and v* tags only.
signing_env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-release-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTReleaseSigner", TILO_SIGNING_AUDIENCE = "sts.amazonaws.com" }
# The development key and the role that may sign with it, for main only (`dev_signed`).
dev_signing_env = { COSIGN_KEY_REF = "awskms:///arn:aws:kms:us-east-1:125650147312:alias/tilo-dev-signing", AWS_SIGNING_ROLE_ARN = "arn:aws:iam::125650147312:role/TiloTDevSigner", TILO_SIGNING_AUDIENCE = "tilo-dev-signing" }

# ---------------------------------------------------------------------------
# Services, deployed by digest from a receipt.

[[product]]
family = "services"
name = "room-service"
about = "The room service: tested before it is published, deployed by digest from stable's receipt."
repository = "registry.tilo.so/tilo/room-service"
dev = ["dev-{commit}"]
release = ["sha-{commit}"]

[product.context]
run = "bash tools/ci/publish/room-service-context.sh {dir}/context /target/publish/room-service/bin /target/publish/web-desktop/bundle"
inputs = ["os/scripts/verify-no-cisco-openh264.sh", "crates/hosting/tilo-room-service/container/**", "crates/hosting/tilo-room-service/web/**", "apps/discord/bridge/program.json", "crates/sdk/ui-core/assets/fonts/**", "tools/font-catalog.py"]
# The programs and the desktop bundle, built side by side; the bundle is the web entry's too.
needs = ["room-service-binaries", "web-desktop-bundle"]
outputs = ["{dir}/context/**"]
# The image's revision label names the commit (git rev-parse).
git = true
cost = "minutes"
# Measured on main over a week: 8.6 GiB peak (99th percentile) and over 40 cores at the peak.
requirement = { cores = 8, memory = "16GiB" }

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
build_args = ["--build-arg SOURCE_REVISION=$(cat {dir}/context/source-revision)"]
test = ["bash crates/hosting/tilo-room-service/container/test-image.sh {out}/image.oci.tar $(cat {dir}/context/source-revision)"]
inputs = ["crates/hosting/tilo-room-service/container/test-image.sh"]
cost = "minutes"
requirement = { cores = 2, memory = "12GiB" }

# Stable's receipt is what cloud-deploy deploys.
[product.publish]
pointers = { room-service = "{dir}/receipt.json" }
requirement = { cores = 1, memory = "2GiB" }

[[product]]
family = "services"
name = "web-entry"
about = """
The web entry: the Tilo app on the web, tested before it is published, deployed by digest from
stable's receipt. A release carries the version of the image production serves, so tabs open on
it survive the deploy: carry-web-entry derives that image from the build and tests it, and it is
what stable signs and publishes. Main's development tags are the build as it is."""
repository = "registry.tilo.so/tilo/web-entry"
dev = ["dev-{commit}"]
release = ["sha-{commit}"]

[product.context]
run = "bash tools/ci/publish/web-entry-context.sh {dir}/context /target/publish/web-desktop/bundle"
inputs = ["crates/browser/tilo-browser-runtime/container/**"]
# The desktop bundle it lays out, shared with the room service.
needs = ["web-desktop-bundle"]
outputs = ["{dir}/context/**"]
git = true
cost = "minutes"
# Measured on main over a week: 12.4 GiB peak (99th percentile) and over 50 cores at the peak.
requirement = { cores = 8, memory = "24GiB" }

[product.build]
context = "{dir}/context"
containerfile = "{dir}/context/Containerfile"
build_args = ["--build-arg SOURCE_REVISION=$(cat {dir}/context/source-revision)"]
test = ["bash crates/browser/tilo-browser-runtime/container/test-image.sh {out}/image.oci.tar"]
inputs = ["crates/browser/tilo-browser-runtime/container/test-image.sh"]
cost = "minutes"
requirement = { cores = 2, memory = "4GiB" }

# It observes production (the image it replaces), so it runs on every release.
[product.release_build]
name = "carry-web-entry"
run = "bash tools/ci/publish/web-entry-carry.sh {out} {dir}/release"
inputs = ["crates/browser/tilo-browser-runtime/container/carry.sh", "crates/browser/tilo-browser-runtime/container/Containerfile.carry", "crates/browser/tilo-browser-runtime/container/test-image.sh"]
outputs = ["{dir}/release/receipt-extra.json"]
cache = false
cost = "minutes"

# Stable's receipt is what cloud-deploy deploys.
[product.publish]
pointers = { web-entry = "{dir}/receipt.json" }
requirement = { cores = 1, memory = "2GiB" }

[[product]]
family = "services"
name = "registry-server"
about = """
The app registry server (crates/packaging/registry-server): x86_64 only, like the cluster it
runs in. Rust compiles inside the Containerfile; the image is tested before main publishes it
and the GitOps repository pins the receipt's digest."""
repository = "registry.tilo.so/tilo/tilo-registry-server"
dev = ["sha-{commit}"]
publish = { requirement = { cores = 1, memory = "1GiB" } }

[product.build]
run = """
assets=$TMPDIR/github-assets
TILO_GITHUB_ASSET_CACHE=$assets TILO_ASSET_STORE= bash os/dev/cache-github-assets.sh sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz
bash tools/ci/publish/oci-build.sh . crates/packaging/registry-server/container/Containerfile {out} --platform {platform} --build-context github-assets=$assets"""
test = ["bash crates/packaging/registry-server/container/test-image.sh {out}/image.oci.tar"]
inputs = ["crates/packaging/registry-server/container/**", "os/dev/cache-github-assets.sh", "os/external-assets/github-assets.tsv", ".containerignore", ".cargo/**", "rust-toolchain.toml"]
cargo_packages = ["registry-server"]
cargo_dev_dependencies = false
cost = "heavy"
requirement = { cores = 5, memory = "24GiB" }

[[product]]
family = "services"
name = "release-rehearsal"
about = """
The release rehearsal (tools/ci/publish/rehearsal): a one-file image that runs the whole chain
as a release does, so the chain is proven on t without publishing anything anyone deploys.
Main publishes `dev-<commit>` when its inputs change. A tag `v0-rehearsal-<n>` (or `t dispatch
publish-release-rehearsal --ref stable`) runs it as a release: it is signed with the release key in
KMS (identity token, AWS role), published as `sha-<commit>` with the signature and a receipt, and
the reference's `release-rehearsal` pointer is set. No other check runs on such a tag."""
repository = "registry.tilo.so/tilo/release-rehearsal"
dev = ["dev-{commit}"]
release = ["sha-{commit}"]
release_on = ["dispatch", "tag:v0-rehearsal-*"]

[product.build]
context = "tools/ci/publish/rehearsal"
containerfile = "tools/ci/publish/rehearsal/Containerfile"
inputs = ["tools/ci/publish/rehearsal/**"]
requirement = { cores = 4, memory = "2GiB" }

[product.publish]
pointers = { release-rehearsal = "{dir}/receipt.json" }

# ---------------------------------------------------------------------------
# CI tooling, not products: published from main and pinned by digest where they are used.

[[product]]
family = "ci-images"
name = "ci-fast"
about = """
The fast CI images, x86_64 only: published from main, pinned by digest in tools/ci/images.toml
by hand. image-ci-fast-smoke runs what the jobs that use them need, before either is published."""
repository = "registry.tilo.so/tilo/ci-fast"
dev = ["sha-{commit}"]
gates = ["image-ci-fast-smoke"]

[product.build]
containerfile = "os/Containerfile.ci-fast"
inputs = ["os/Containerfile.ci-fast"]
cost = "heavy"
# It builds FROM the multi-GB CI builder: a micro-VM step can't grow past what it reserves.
# Measured: 7.4 GiB peak, too close to 8 GiB for a step that can't grow.
requirement = { cores = 4, memory = "12GiB" }

[[product]]
family = "ci-images"
name = "ci-control"
about = "ci-control adds the Docker client to the ci-fast image just built, not to the pinned one."
repository = "registry.tilo.so/tilo/ci-control"
dev = ["sha-{commit}"]
gates = ["image-ci-fast-smoke"]

[product.build]
containerfile = "os/Containerfile.ci-control"
build_args = ["--build-arg CI_FAST_IMAGE=oci-archive:/target/publish/ci-fast/image.oci.tar"]
needs = ["image-ci-fast"]
inputs = ["os/Containerfile.ci-control"]
cost = "minutes"
requirement = { cores = 4, memory = "8GiB" }

[[product]]
family = "ci-images"
name = "release-tools"
about = """
The release tools image (os/Containerfile.release-tools): the compiler-free environment the
release jobs run in, built and tested natively per architecture and published from main as
one index. Its consumers pin the index by digest; jobs pull it before they can log in, so it
must be anonymously pullable."""
repository = "registry.tilo.so/tilo/tilo-release-tools"
arches = ["x86_64", "aarch64"]
index = true
dev = ["sha-{commit}"]
anonymous = true

[product.build]
containerfile = "os/Containerfile.release-tools"
test = ["bash os/tests/release_tools_image.sh {out}/image.oci.tar"]
inputs = ["os/Containerfile.release-tools", "os/tests/release_tools_image.sh"]
cost = "minutes"

[[product]]
family = "ci-images"
name = "ci-builder"
about = """
The CI builder (os/Containerfile.builder, tools/ci/publish/ci-builder.sh): the image t's checks
and the CI jobs run in, with the pinned toolchain baked in, built natively per architecture and
joined into one index. The canaries below run inside each candidate before anything is signed
or published. Everyone pushes to main, so main publishes only development tags (`dev-<commit>`,
and `dev-<commit>-<arch>` for each image), signed with the development key (keys/cosign-dev.pub)
by sign-dev-ci-builder; nothing a consumer resolves by a moving tag or verifies against
keys/cosign.pub comes from main. Stable signs the index and both
images with the release key and publishes `<commit>` and `<rust channel>`. `latest`, which
resolve_builder.py and the Forgejo jobs follow, stays with build-ci-builder.yml until the
cutover: stable lags main, and moving `latest` from it now would hand main's Forgejo jobs an
older toolchain."""
repository = "registry.tilo.so/tilo/tilo-builder"
arches = ["x86_64", "aarch64"]
index = true
children = true
dev = ["dev-{commit}"]
release = ["{commit}", "{rust}"]
dev_signed = true
gates = ["canary-ci-builder-cache-warm-x86_64", "canary-ci-builder-cache-warm-aarch64", "canary-ci-builder-browser-x86_64", "canary-ci-builder-x11-bridge-x86_64"]
publish = { inputs = ["rust-toolchain.toml"], requirement = { cores = 2, memory = "24GiB" } }

[product.build]
run = "bash tools/ci/publish/ci-builder.sh build {arch} {out}"
inputs = ["os/Containerfile.builder", "os/external-assets/github-assets.tsv", "os/dev/cache-github-assets.sh", "rust-toolchain.toml", "dist/ci/install-build-deps.sh", "tools/ci/check-build-env.sh", "tools/ci/install-android-ndk.sh", "tools/ci/install-pdfium.sh", "tools/ci/install-xwayland-satellite.sh", "os/external-assets/xwayland-satellite/**", "tools/ci/native-mold-linker.sh", "tools/ci/verify-native-mold.sh", "tools/ci/windows/wine-prefix.sh", "tools/ci/sccache.sh", "tools/ci/measure.sh"]
cost = "heavy"
timeout_secs = 14400
# Measured: 30 GiB peak on x86_64, at the edge of 32 GiB.
requirement = { cores = 16, memory = "48GiB" }

# The builder's canaries, in the candidate the same run built (build-ci-builder.yml's
# cache-cold and cache-warm steps). Two jobs prove t's compiler cache works from it: the
# cold one compiles under a prefix nobody used and must write, the warm one, a fresh compiler
# process in another job (on whichever node), must read that back. The candidate's key covers
# everything that went into it, so a new image runs them again.
[[matrix]]
family = "ci-images"
each = [{ arch = "x86_64" }, { arch = "aarch64" }]
fields = { requires = ["arch={arch}"], default = false }

[[matrix.check]]
name = "canary-ci-builder-cache-cold-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh cold /target/publish/ci-builder/{arch}/canary"
inputs = ["tools/ci/sccache-canary.sh", "tools/ci/measure.sh"]
cargo_packages = ["tilo-advisory-lock"]
cargo_dev_dependencies = false
outputs = ["/target/publish/ci-builder/{arch}/canary/prefix"]
cost = "minutes"

[[matrix.check]]
name = "canary-ci-builder-cache-warm-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh warm /target/publish/ci-builder/{arch}/canary"
inputs = ["tools/ci/sccache-canary.sh", "tools/ci/measure.sh"]
cargo_packages = ["tilo-advisory-lock"]
cargo_dev_dependencies = false
needs = ["canary-ci-builder-cache-cold-{arch}"]
cost = "minutes"

# The native Chromium and the browser regressions that once broke on a builder. Their tests run
# `npm ci` in scripts/moq-browser, inside the source tree. Only x86_64's gates publication for
# now: on aarch64 its build directory under $TMPDIR loses files mid-build (cargo can't run
# sccache or read dep info it just wrote), which the job sandbox there has yet to fix.
[[matrix.check]]
name = "canary-ci-builder-browser-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh browser"
inputs = ["tools/web/chrome.mjs", "tools/web/owned_browser.py", "tools/ci/t-nextest.sh", "tools/ci/nextest_filters.py", ".config/nextest.toml", ".config/nextest-filters.toml", "tools/test-env.sh", "tools/with-test-environment.sh", "tools/with-headless-audio.sh", "crates/browser/tilo-browser-runtime/web/**", "scripts/moq-browser/**", "crates/sdk/ui-core/assets/fonts/**", "crates/browser/tilo-browser-peer/tests/support/**"]
cargo_packages = ["tilo-browser-peer", "tilo-agent-participant"]
writable_sources = true
cost = "heavy"
requirement = { cores = 8, memory = "12GiB" }

# The shell's X11 clipboard tests against the candidate's own xwayland-satellite, which is built
# from patched source (os/external-assets/xwayland-satellite/): a builder whose bridge drops a
# paste in flight during the clipboard manager's takeover must not be published. Gates
# publication on x86_64, like the browser canary.
[[matrix.check]]
name = "canary-ci-builder-x11-bridge-{arch}"
image = { check = "image-ci-builder-{arch}", path = "/target/publish/ci-builder/{arch}/image.oci.tar" }
run = "bash tools/ci/publish/ci-builder-canary.sh x11-bridge"
inputs = ["tools/ci/t-nextest.sh", "tools/ci/nextest_filters.py", ".config/nextest.toml", ".config/nextest-filters.toml", "tools/test-env.sh", "tools/with-test-environment.sh", "tools/ci/install-xwayland-satellite.sh", "os/external-assets/github-assets.tsv", "os/external-assets/xwayland-satellite/**"]
cargo_packages = ["shell"]
cost = "heavy"
requirement = { cores = 8, memory = "12GiB" }

# ---------------------------------------------------------------------------
# The OS's foundations: the frozen RPM snapshot, the kernel buildroot and the kernel.

[[product]]
family = "os-base"
name = "rpms"
about = """
The frozen RPM snapshot (tools/ci/publish/rpms-build.sh): every package the OS Containerfiles
name, resolved, signature-checked and laid out as a repository image, natively per
architecture, joined into one index. Stable signs the index and both images, attests the
index's SLSA provenance (frozen-rpm-index/v1: both package sets and the base, which
os/dev/resolve-rpm-snapshot.sh and the OS build verify), both with a transparency log entry,
and publishes it as `set-<fingerprint>` once: a fingerprint already published is never moved.
Main publishes nothing, since the snapshot is signed; until the cutover build-rpms.yml
publishes main's."""
repository = "registry.tilo.so/tilo/rpms"
arches = ["x86_64", "aarch64"]
index = true
children = true
tlog = true
release = ["once:set-{fingerprint}"]

[product.provenance]
run = "bash tools/ci/publish/rpms-provenance.sh {dir}"
inputs = ["os/dev/rpm-snapshot-fingerprint.py", "os/dev/derive-rpm-package-set.py", "os/base-snapshot.env", "os/Containerfile.rpms", "os/dev/layer-rpm-snapshot.py", "os/dev/verify-rpm-snapshot-signatures.sh", "os/scripts/verify-no-cisco-openh264.sh", "os/Containerfile", "os/Containerfile.dev", "os/Containerfile.host", "os/dev/composefs/Containerfile", "os/containers/tilo-relay/Containerfile", "os/Containerfile.env-runtime", "os/dev/uki-tools.packages"]
outputs = ["{dir}/index/fingerprint", "{dir}/x86_64/fingerprint", "{dir}/aarch64/fingerprint"]

[product.build]
run = "bash tools/ci/publish/rpms-build.sh {arch} {out}"
inputs = ["os/Containerfile.rpms", "os/base-snapshot.env", "os/dev/verify-rpm-snapshot-signatures.sh", "os/scripts/verify-no-cisco-openh264.sh", "os/dev/layer-rpm-snapshot.py", "os/dev/derive-rpm-package-set.py", "os/external-assets/github-assets.tsv", "os/dev/cache-github-assets.sh", "os/Containerfile", "os/Containerfile.dev", "os/Containerfile.host", "os/dev/composefs/Containerfile", "os/containers/tilo-relay/Containerfile", "os/Containerfile.env-runtime", "os/dev/uki-tools.packages"]
requires = ["disk-100g"]
requirement = { cores = 8, memory = "16GiB" }
timeout_secs = 10800

[[product]]
family = "os-base"
name = "kernel-buildroot"
about = """
The kernel buildroot (os/Containerfile.kernel-buildroot, tools/ci/publish/kernel-buildroot.sh):
the only build that resolves kernel build dependencies and the Fedora kernel SRPM from Fedora.
Each architecture is built natively and audited; stable signs (with a transparency log entry,
since build-kernel.yml verifies requiring one) and publishes both and sets the
`kernel-buildroot` pointer. `kernel-buildroot.sh pin` commits stable's pins to
os/kernel-buildroot-snapshot.env from a check that pushes, once build-buildroots.yml no longer
proposes them."""
repository = "registry.tilo.so/tilo/tilo-kernel-buildroot"
arches = ["x86_64", "aarch64"]
release = ["sha-{commit}-{arch}"]
tlog = true
after_publish = "bash tools/ci/publish/kernel-buildroot.sh pins {dir}/x86_64 {dir}/aarch64"

[product.build]
run = "bash tools/ci/publish/kernel-buildroot.sh build {arch} {out}"
inputs = ["os/Containerfile.kernel-buildroot", "os/base-snapshot.env"]
cost = "heavy"

[product.publish]
inputs = ["os/Containerfile.kernel-buildroot", "os/base-snapshot.env"]
outputs = ["{dir}/pins.env"]
pointers = { kernel-buildroot = "{dir}/pins.env" }

[[product]]
family = "os-base"
name = "kernel"
about = """
The kernel (tools/ci/publish/kernel.sh): Fedora's kernel with Tilo's config fragment, built
natively FROM the pinned signed buildroot, then booted under emulation with its module signatures
checked and the firmware's Secure Boot enforcement probed, as root in a micro-VM step
(kernel-acceptance-<arch>). Stable
signs each architecture's image and attests its SLSA provenance (kernel-rpm/v1: the source
commit and the buildroot it was built FROM, which os/dev/verify-kernel-provenance.sh checks),
both with a transparency log entry, publishes them as `sha-<commit>-<arch>` and sets the
`kernel` pointer, which pin-kernel commits to os/kernel-snapshot.env on main. Main publishes
nothing, since the OS build verifies the kernel's signature; until the cutover build-kernel.yml
publishes and pins main's. No compiler cache reaches checks yet, so every build compiles the
whole kernel."""
repository = "registry.tilo.so/tilo/tilo-kernel"
arches = ["x86_64", "aarch64"]
release = ["sha-{commit}-{arch}"]
tlog = true
gates = ["kernel-acceptance-x86_64", "kernel-acceptance-aarch64"]
after_publish = "bash tools/ci/publish/kernel.sh pins {dir}"

[product.provenance]
run = "bash tools/ci/publish/kernel.sh provenance {dir}"
inputs = ["os/kernel-buildroot-snapshot.env"]

[product.publish]
inputs = ["os/kernel/**", "os/kernel-buildroot-snapshot.env", "crates/system/tilo-crypto/Cargo.toml", "crates/system/tilo-crypto/src/lib.rs", "crates/system/tilo-crypto/src/main.rs", "os/tests/secureboot_vm_app.c"]
outputs = ["{dir}/pins.env"]
pointers = { kernel = "{dir}/pins.env" }

[product.build]
run = "bash tools/ci/publish/kernel.sh build {arch} {out}"
inputs = ["os/kernel/**", "os/kernel-buildroot-snapshot.env", "Cargo.toml", "Cargo.lock", "crates/system/tilo-crypto/Cargo.toml", "crates/system/tilo-crypto/src/lib.rs", "crates/system/tilo-crypto/src/main.rs", "os/tests/secureboot_vm_app.c", "os/external-assets/github-assets.tsv", "os/dev/cache-github-assets.sh", "os/dev/install-cached-cosign.sh", "keys/cosign.pub"]
outputs = ["{out}/secureboot/**"]
requires = ["disk-100g"]
requirement = { cores = 16, memory = "24GiB" }
timeout_secs = 14400

# ---------------------------------------------------------------------------
# Images the OS and its environments fetch: the relay and the Linux legacy VM guest.

[[product]]
family = "os-images"
name = "relay"
about = """
The standalone relay image (os/containers/tilo-relay): built on every change from the
mirrored base and the published frozen RPM snapshot, signed and released for version tags
only, as `<version>` (v1.2.3 -> 1.2.3) and `sha-<commit>`."""
repository = "registry.tilo.so/tilo/tilo-relay"
release = ["{version}", "sha-{commit}"]
# Version tags only (v1.2.3, v1.2.3-rc.1): a release rehearsal's tag (v0-rehearsal-<n>) is a v*
# tag too, so the identity tokens reach it, but releases no relay.
release_on = ["tag:v[0-9]*.[0-9]*.[0-9]*"]
tlog = true

[product.build]
run = "bash tools/ci/publish/relay-build.sh /target/publish/rpm-snapshot {out}"
needs = ["rpm-snapshot"]
