# Container images CI runs in.
#
# tools/ci/resolve_builder.py reads the registry from here. `pins` is for a
# workflow's `container.image`, which cannot read this file and so repeats the
# full reference; tools/tests/test_ci_images.py asserts every reference under
# `host/namespace` in .forgejo/workflows uses that digest. t's checks name their
# images in t.toml, so no workflow pins one today.
#
# A fork that publishes its own images can override it per run without editing this file:
#   TILO_CI_REGISTRY              registry host
#   TILO_CI_BUILDER_REPOSITORY    builder repository on that host
#   TILO_CI_REGISTRY_TOKEN_REALM  anonymous pull-token endpoint

[registry]
host = "registry.tilo.so"
namespace = "tilo"
token_realm = "https://registry.tilo.so/token"
# Resolved through the tag its inputs name; see tools/ci/resolve_builder.py.
builder = "tilo-builder"

# Repository name under host/namespace -> pinned digest.
[pins]
