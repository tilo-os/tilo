[package]
name = "collab-probe"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Sandboxed CRDT collaboration probe — reaches the broker exactly as a packaged app does."

[[bin]]
name = "tilo-collab-probe"
path = "src/main.rs"

[dependencies]
collab-types = { path = "../../crates/core/collab-types" }
runtime-collab = { path = "../../crates/core/runtime-collab" }
tilo-identity-client = { path = "../../crates/core/tilo-identity-client" }
runtime-portal = { path = "../../crates/core/runtime-portal" }
automerge.workspace = true
tilo-automerge.workspace = true
serde_json.workspace = true
tilo-resource-store = { path = "../../crates/core/resource-store" }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
