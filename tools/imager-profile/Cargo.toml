[package]
name = "tilo-imager-profile"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# Deliberately isolated: building release-media tools must not resolve or build
# the graphical application workspace. The profile model and codec are plain
# serde and SHA-256 in install-profile-model, taken without its `model`
# feature, so this build resolves no document stack either.
[workspace]

[dependencies]
install-profile-model = { path = "../../crates/os/install-profile-model" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.23.0"

[profile.release]
strip = true
opt-level = "s"
