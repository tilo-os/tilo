[package]
name = "tilo-imager-profile"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# The binary path-includes the production model/profile/CLI modules below;
# cargo-machete cannot follow those #[path] edges to these direct dependencies.
[package.metadata.cargo-machete]
ignored = ["hex", "install-profile-model", "libc", "serde", "sha2"]

# Deliberately isolated: building release-media tools must not resolve or build
# the graphical application workspace. Production modules are shared below.
[workspace]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
hex = "0.4.3"
sha2 = "0.11"
install-profile-model = { path = "../../crates/session/install-profile-model" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
strip = true
opt-level = "s"
