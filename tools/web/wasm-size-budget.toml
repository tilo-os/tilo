# Byte size of each web bundle's module (pkg/tilo_browser_runtime_bg.wasm).
# The app-sdk workflow fails when a bundle grows past its budget. Budgets may
# only decrease: tools/web/wasm_size_ratchet.py check-budget compares them
# with the base revision. When a bundle shrinks, the lane prints the lower
# budget to commit.

# All web-capable Tilo apps (32), as the app-sdk web lane builds them:
# `tilo-app build --target web --bundle desktop --release apps/calculator`,
# measured by that lane (app-sdk run 55499, wasm-opt 126, wasm-bindgen 0.2.108).
# The first budget, 67430997, came from a local build on another branch and
# was never met in CI: the lane was OOM-killed before it reached the check.
# (`build.sh --profile release` optimizes less and comes out about 2 MB
# larger.)
[bundles.desktop]
bytes = 74377063

[bundles.desktop.rebaseline]
run = 55499
reason = "first measurement by the app-sdk web lane; the earlier budget came from a local build on another branch"
