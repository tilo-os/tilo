# Byte size of each web bundle's module (pkg/tilo_browser_runtime_bg.wasm).
# The app-sdk workflow fails when a bundle grows past its budget. A budget is
# a measurement plus `headroom`, rounded up to 64 KiB, so a commit adding a
# few bytes passes and real growth fails. Budgets may only decrease:
# tools/web/wasm_size_ratchet.py check-budget compares them with the base
# revision, and a raise needs a rebaseline record. When a bundle shrinks, the
# lane prints the lower budget to commit.
headroom = 0.01

# All web-capable Tilo apps, as the app-sdk web lane builds them:
# `tilo-app build --target web --bundle desktop --release apps/calculator`.
# (`build.sh --profile release` optimizes less and comes out about 2 MB
# larger.)
[bundles.desktop]
bytes = 76939264

[bundles.desktop.rebaseline]
run = 56596
measured = 76128538
reason = "app-sdk run 56582 measured current main at 76024068 bytes; run 56596 adds governed browser voice and Chat call controls for 104470 bytes, with the standard 1% headroom"
