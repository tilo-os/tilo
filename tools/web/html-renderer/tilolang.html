<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tilolang on the web</title>
<style>
  :root{color-scheme:light dark;--ground:#f4f4f5;--panel:#fff;--line:#e4e4e7;--ink:#18181b;--muted:#71717a;--accent:#2563eb;--on:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ground:#0c0c0e;--panel:#18181b;--line:#27272a;--ink:#f4f4f5;--muted:#a1a1aa;--accent:#60a5fa;--on:#0c0c0e}}
  :root[data-theme=dark]{--ground:#0c0c0e;--panel:#18181b;--line:#27272a;--ink:#f4f4f5;--muted:#a1a1aa;--accent:#60a5fa;--on:#0c0c0e}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
  body{display:grid;grid-template-rows:auto 1fr}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:15px;font-weight:600;margin:0 auto 0 0}
  [role=radiogroup]{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
  [role=radio]{border:0;background:none;color:var(--muted);font:inherit;padding:4px 10px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
  [role=radio][aria-checked=true]{background:var(--accent);color:var(--on)}
  [role=radio]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{display:grid;gap:12px;padding:12px;min-height:0}
  main[data-show=both]{grid-template-columns:1fr 1fr}
  main[data-show=gpu] .dom,main[data-show=dom] .gpu{display:none}
  @media (max-width:900px){main[data-show=both]{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  figure{margin:0;display:grid;grid-template-rows:auto 1fr;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  figcaption{padding:6px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<header>
  <h1 id="title">tilolang</h1>
  <div role="radiogroup" aria-label="Renderer" id="show">
    <button role="radio" data-value="both">Side by side</button>
    <button role="radio" data-value="gpu">Canvas</button>
    <button role="radio" data-value="dom">HTML</button>
  </div>
  <div role="radiogroup" aria-label="Appearance" id="theme">
    <button role="radio" data-value="">System</button>
    <button role="radio" data-value="light">Light</button>
    <button role="radio" data-value="dark">Dark</button>
  </div>
</header>
<main id="panes">
  <figure class="gpu"><figcaption>Canvas (WebGPU)</figcaption><iframe title="Canvas"></iframe></figure>
  <figure class="dom"><figcaption>HTML</figcaption><iframe title="HTML"></iframe></figure>
</main>
<script type="module">
// A tilolang package (`?package=`, default the gallery build-tilolang-web.sh
// put under tl/) in app.html twice: on the WebGPU canvas and as HTML, side by
// side or one at a time, its record staged with every scenario the package declares
// (`?scenario=` names others). Each pane is a page of its own, with its own window.
const params = new URLSearchParams(location.search);
const pkg = params.get('package') ?? 'tl/so.tilo.lang.gallery/';
const panes = document.getElementById('panes');
document.getElementById('title').textContent = pkg.replace(/^tl\//, '').replace(/\/$/, '');
function load() {
  const theme = params.get('theme') ?? '';
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  for (const render of ['gpu', 'dom']) {
    const page = new URLSearchParams({package: pkg, render, scenario: params.get('scenario') ?? 'all'});
    if (theme) page.set('theme', theme);
    const src = `app.html?${page}`;
    const frame = panes.querySelector(`.${render} iframe`);
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
  }
  panes.dataset.show = params.get('show') ?? 'both';
  for (const group of ['show', 'theme']) {
    const value = params.get(group) ?? (group === 'show' ? 'both' : '');
    for (const radio of document.querySelectorAll(`#${group} [role=radio]`)) {
      radio.setAttribute('aria-checked', String(radio.dataset.value === value));
    }
  }
}
for (const group of ['show', 'theme']) {
  document.getElementById(group).addEventListener('click', event => {
    const radio = event.target.closest('[role=radio]');
    if (!radio) return;
    if (radio.dataset.value) params.set(group, radio.dataset.value); else params.delete(group);
    history.replaceState(null, '', `?${params}`);
    load();
  });
}
load();
</script>
</body>
</html>
