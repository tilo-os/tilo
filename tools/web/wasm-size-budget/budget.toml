# Byte size of each web bundle's module (pkg/tilo_browser_runtime_bg.wasm).
# The app-sdk workflow fails when a bundle grows past its budget: the `bytes`
# below plus every raise under raises/<bundle>/. A budget is a measurement plus
# `headroom`, rounded up to 64 KiB, so a commit adding a few bytes passes and
# real growth fails. Budgets may only decrease: tools/web/wasm_size_ratchet.py
# check-budget compares them with the base revision, and growth needs a new
# raise file (one per change, so concurrent changes never edit the same line).
# When a bundle shrinks, the lane prints the lower budget to commit here, with
# the raise files removed.
headroom = 0.01

# All web-capable Tilo apps, as the app-sdk web-size lane builds them:
# `tilo-app build --target web --bundle desktop --release apps/calculator`.
# (`build.sh --profile release` optimizes less and comes out about 2 MB
# larger.) The module is split (tools/web/wasm-split): this budget holds the
# start module, which the page loads first; each app's own code, including
# its instantiations of the resource, action and view framework, is in the
# module fetched when the app first opens and is not counted here. Measured
# at 20552592 bytes by the sdk-web-size steps once the splitter merged the
# copies of a function each module carried more than once.
[bundles.desktop]
bytes = 20774912

# What the web entry at tilo.coffee serves, under [shipped]: the desktop bundle
# `tools/ci/publish/web-desktop-bundle.sh` builds for this commit, split, and laid out
# by the entry image (layout.py) under its content version. The budgets above
# measure a module a one-app bundle starts with, which is not what a browser
# downloads on a first visit: the shipped start module is larger, and the seventy
# modules the split makes are four times its size beside it.
#
# Each module is weighed twice, as the Containerfile leaves it in the image:
# `start` and `chunks` are the raw bytes, `brotli` and `chunks_brotli` their
# Compress-stage sidecars, which is what a browser accepting br downloads (the
# entry page's cached first load). `largest`/`largest_brotli` are the biggest
# single chunk, which a visitor pays when that one app first opens.
#
# Measured on the production bundle at version f208d596546fb0848393 (build.json's
# revision 59c1737c) from the files https://tilo.coffee serves: the module the
# entry page loads hashes to build.json's entry and is 23078266 bytes, and the
# seventy top-level pkg/*.wasm beside it total 80235040 raw, 22269972 brotli.
# The split bundle is not reproducible in this worktree on macOS, so these are
# the live artifact's numbers, not a local build's.
[shipped.desktop]
start = 23330816
brotli = 5832704
chunks = 81068032
chunks_brotli = 22544384
largest = 20316160
largest_brotli = 5046272
