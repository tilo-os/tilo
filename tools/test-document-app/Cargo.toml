[package]
name = "test-document-app"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "A test-only document app: a rich-text record for suites that need a document app without a product's"

[lib]
name = "test_document_app"
path = "src/lib.rs"

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tilo-document = { path = "../../crates/sdk/tilo-document" }
# The content store a lent document is read from.
tilo-content = { path = "../../crates/core/content", features = ["dir"] }
serde.workspace = true
serde_json.workspace = true
automerge.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1" }

[lints]
workspace = true
