# Logs: the journal of the app's own scenario, through its actions (a
# capture never shows the journal of the machine the shots run on).

[[situation]]
name = "journal"
title = "The journal"
scenario = "detail"

[[situation]]
name = "live-tail"
title = "Following new entries"
scenario = "detail"

[[situation.steps]]
invoke = { resource = "logs.journal", action = "set-live-tail", args = { enabled = true } }

[[situation]]
name = "errors"
title = "Only the errors"
scenario = "filter-errors"
