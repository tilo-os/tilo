# Passwords: the vault's views and the new-item form, through its actions.

[[situation]]
name = "vault"
title = "The vault"

[[situation]]
name = "new-item"
title = "A new item being added"

[[situation.steps]]
invoke = { resource = "passwords.vault", action = "add" }

[[situation]]
name = "wifi-filter"
title = "Wi-Fi networks only"

[[situation.steps]]
invoke = { resource = "passwords.vault", action = "filter", args = { filter = "wifi" } }

[[situation]]
name = "access"
title = "Who may use the vault"

[[situation.steps]]
invoke = { resource = "passwords.vault", action = "show-access" }
