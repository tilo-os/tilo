# System monitor: its tabs over the processes of the app's own scenario,
# through the processes' actions (never the machine the shots run on).

[[situation]]
name = "processes"
title = "The process list"
scenario = "flat"

[[situation.steps]]
invoke = { resource = "monitor.processes", action = "show-tab", args = { tab = "processes" } }

[[situation]]
name = "resources"
title = "Resource graphs"
scenario = "resources"

[[situation]]
name = "tree"
title = "Processes as a tree"
scenario = "tree-expanded"
