# Feeds: a library of subscriptions from the app's own scenario, the unread
# place, an article opened in the reader's own face, size and paper, and an
# empty library. Fetching needs the network; the fixtures are the articles the
# app stages. A list row pressed opens the article's page, as a person opens it.

[[situation]]
name = "subscriptions"
title = "Subscriptions filed into folders"
scenario = "a library of feeds"

[[situation]]
name = "unread"
title = "The unread articles"
scenario = "a library of feeds"

[[situation.steps]]
perform = { target = "key:item:unread", action = "activate" }

[[situation]]
name = "article"
title = "An article in the reader's own face, size and paper"
scenario = "a library of feeds"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.feeds:root-u5mhrzrx", action = "begin_reading", bind = "reader" }

[[situation.steps]]
invoke = { resource = "{{reader.resources.0}}", action = "larger_text" }

[[situation.steps]]
invoke = { resource = "{{reader.resources.0}}", action = "set_face", args = { face = "sans" } }

[[situation.steps]]
invoke = { resource = "{{reader.resources.0}}", action = "set_paper", args = { paper = "sepia" } }

[[situation.steps]]
press = "A quiet morning in the city"

[[situation]]
name = "empty"
title = "The library before the first subscription"
