# Feeds: a library of subscriptions from the app's own scenario, the unread
# place, and an empty library. Fetching needs the network; the fixtures are the
# articles the app stages. The reading face, size and paper are each reader's
# own view state on an article's page, which a plan cannot set.

[[situation]]
name = "subscriptions"
title = "Subscriptions filed into folders"
scenario = "a library of feeds"

[[situation]]
name = "unread"
title = "The unread articles"
scenario = "a library of feeds"

[[situation.steps]]
perform = { target = "key:item:unread", action = "activate" }

[[situation]]
name = "empty"
title = "The library before the first subscription"
