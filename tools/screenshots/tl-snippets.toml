# Snippets: a library from the app's own scenario, its Favorites place, an
# empty library, and the system's search scoped to the app, opened from the
# window's own search.

[[situation]]
name = "library"
title = "A library of everyday snippets"
scenario = "a small library"

[[situation]]
name = "favorites"
title = "The snippets kept as favorites"
scenario = "a small library"

[[situation.steps]]
perform = { target = "key:item:favorites", action = "activate" }

[[situation]]
name = "search"
title = "The system's search, scoped to the snippets"
scenario = "a small library"

[[situation.steps]]
perform = { target = "window-search-open", action = "activate" }

[[situation.steps]]
perform = { target = "window-search-query", action = "set_value", value = "deploy" }

[[situation]]
name = "empty"
title = "The library before the first snippet"
