[[situation.steps]]
invoke = { resource = "video-player.library", action = "add-to-watch-later", args = { media_ref = "media:2be7-ipcc-ar6", title = "What the IPCC report says, in twenty minutes" } }

[[situation.steps]]
invoke = { resource = "video-player.library", action = "show-library", args = { tab = "queue" } }

