# Video player: the library's playlists and lists, through its actions.

[[situation]]
name = "playlists"
title = "Playlists and the watch-later list"

[[situation.steps]]
invoke = { resource = "video-player.library", action = "create-playlist", args = { name = "Woodworking" } }

[[situation.steps]]
invoke = { resource = "video-player.library", action = "create-playlist", args = { name = "Lectures: climate science" } }

[[situation.steps]]
