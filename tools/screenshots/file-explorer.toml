[[situation.steps]]
invoke = { resource = "files.folder", action = "grid" }

[[situation]]
name = "hidden-files"
title = "Hidden files shown"

[[situation.steps]]
invoke = { resource = "files.folder", action = "write-file-here", args = { name = ".profile", text = "export EDITOR=nano\n" } }

[[situation.steps]]
