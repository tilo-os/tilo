# Files: a home folder with documents, through the folder's actions (in the
# run's own scratch home).

[[situation]]
name = "home-folder"
title = "A home folder with folders and notes"

[[situation.steps]]
invoke = { resource = "files.folder", action = "new-folder-here", args = { name = "Projects" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "new-folder-here", args = { name = "Receipts 2026" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "new-folder-here", args = { name = "Travel" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "write-file-here", args = { name = "Shopping list.md", text = "- Oat milk\n- Sourdough loaf\n- Lemons\n" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "write-file-here", args = { name = "Garden plan.txt", text = "Bed 1: tomatoes, basil\nBed 2: beans, courgettes\nBed 3: lettuce, radishes\n" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "write-file-here", args = { name = "Budget.csv", text = "Category,Planned,Spent\nRent,1250,1250\nGroceries,420,386.40\n" } }

[[situation]]
name = "grid"
title = "The same folder as a grid"

[[situation.steps]]
invoke = { resource = "files.folder", action = "new-folder-here", args = { name = "Photos from Lisbon" } }

[[situation.steps]]
invoke = { resource = "files.folder", action = "new-folder-here", args = { name = "Recipes" } }

[[situation.steps]]
