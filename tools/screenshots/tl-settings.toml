# Settings: panes chosen in the window's sidebar. A pane is a row of its list,
# which it publishes as `key:item:<pane>`; the network pane's own pages are rows
# and buttons it answers a press on. Its Wi-Fi, VPN, modem and hotspot readings
# are the `a connected computer` scenario's, so the panes show a person's device.

[[situation]]
name = "appearance"
title = "Appearance"

[[situation.steps]]
perform = { target = "key:item:appearance", action = "activate" }

