# Passwords: logins added through the vault's actions, and its Wi-Fi place.

[[situation]]
name = "vault"
title = "The vault"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Bank" } }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Mail" } }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Router" } }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Workshop" } }

[[situation]]
name = "new-item"
title = "A new item being added"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item" }

[[situation]]
name = "wifi-filter"
title = "Wi-Fi networks only"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Bank" } }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.passwords:root-iivmujua", action = "new_item", args = { title = "Mail" } }

[[situation.steps]]
perform = { target = "key:item:wifi", action = "activate" }
