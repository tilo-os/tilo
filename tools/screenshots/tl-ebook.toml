# Books (tilolang): a shelf seeded from a folder, the reading settings, and a
# reading face chosen. The EPUB is the one the app's walk opens.

[[file]]
path = "Books/The Tide Glass.epub"
base64 = ""

[[situation]]
name = "library"
title = "A shelf with a book on it"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.ebook:root-srrcatfl", action = "watch_folder", args = { path = "${HOME}/Books" } }

[[situation]]
name = "reading-settings"
title = "Reading settings"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.ebook:root-srrcatfl", action = "watch_folder", args = { path = "${HOME}/Books" } }

[[situation.steps]]
perform = { target = "ToggleGroup", semantic_target = "segment:1", action = "activate" }

[[situation]]
name = "serif-font"
title = "A reading face chosen"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.ebook:root-srrcatfl", action = "watch_folder", args = { path = "${HOME}/Books" } }

[[situation.steps]]
perform = { target = "ToggleGroup", semantic_target = "segment:1", action = "activate" }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.ebook:root-srrcatfl", action = "set_face", args = { face = "serif" } }
