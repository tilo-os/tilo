# Books (tilolang): a shelf from the library's own scenario, the reading
# settings, and a reading face chosen. The scenario puts the walk's book on the
# shelf as opening its EPUB leaves it.

[[situation]]
name = "library"
title = "A shelf with a book on it"
scenario = "a shelf with a book"

[[situation]]
name = "reading-settings"
title = "Reading settings"

[[situation.steps]]
# The switcher in the window's header is what takes a person to the settings, and the window
# keeps it there.
perform = { target = "Settings", action = "activate" }

[[situation]]
name = "source-serif-font"
title = "A reading face chosen"

[[situation.steps]]
# The switcher in the window's header is what takes a person to the settings, and the window
# keeps it there.
perform = { target = "Settings", action = "activate" }

[[situation.steps]]
invoke = { resource = "tl:so.tilo.ebook:root-srrcatfl", action = "set_face", args = { face = "source_serif" } }
