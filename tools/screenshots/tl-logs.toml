[[situation]]
name = "journal"
workspace = true
title = "The journal"

[[situation]]
name = "live-tail"
workspace = true
title = "Following new entries"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.logs:root-ydaofznc", action = "follow", args = { on = true } }

[[situation]]
name = "errors"
workspace = true
title = "Only the errors"

[[situation.steps]]
invoke = { resource = "tl:so.tilo.logs:root-ydaofznc", action = "set_severity", args = { value = "err" } }
