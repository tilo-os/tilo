# Logs: this computer's journal, filtered through the window's own actions. A capture's profile is
# not the machine the shots run on, so the journal is staged here and the device reads it in place
# of its own: the entries below are what Logs shows.

[[journal]]
minutes_ago = 95
priority = 6
unit = "systemd"
identifier = "systemd"
message = "Started Tilo session."

[[journal]]
minutes_ago = 94
priority = 6
unit = "tilo-session.service"
identifier = "tilo-session"
message = "compositor: 2560x1440 at scale 1.5, 165 Hz"

