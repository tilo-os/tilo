[package]
name = "tilo-app-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Developer workflow for creating Tilo applications"
autotests = false

[lib]
name = "tilo_app_cli"

[[bin]]
name = "tilo-app"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fluent.workspace = true
fluent-syntax.workspace = true
hex.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
image = { workspace = true, features = ["png"] }
tilo-app-id.workspace = true
tilo-app-package = { path = "../../crates/packaging/tilo-app-package" }
# Inside a Tilo session, `dev` hands the app the shell's file chooser the
# way the launcher does.
launcher = { path = "../../crates/packaging/launcher" }
runtime-bundle = { path = "../../crates/packaging/runtime-bundle" }
blake3.workspace = true
tilo-caps = { path = "../../crates/sdk/tilo-caps" }
# History's message convention, which `check` lists missing messages by.
tilo-history = { path = "../../crates/sdk/tilo-history" }
tilo-actions = { path = "../../crates/collab/actions" }
# The form a surface is kept by, whose hash `install-app` names.
collab-types = { path = "../../crates/collab/collab-types" }
sha2.workspace = true
registry-types = { path = "../../crates/packaging/registry-types" }
app-registry = { path = "../../crates/packaging/app-registry" }
tilo-paths = { path = "../../crates/platform/tilo-paths" }
tilo-canonical-json = { path = "../../crates/platform/tilo-canonical-json" }
tilo-files = { path = "../../crates/platform/tilo-files", features = ["watch"] }
bounded-command = { path = "../../crates/platform/bounded-command" }
# The capability evidence table deserializes into typed entries.
serde.workspace = true
serde_json.workspace = true
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
tempfile.workspace = true
toml.workspace = true
tilo-ui-graph = { path = "../../crates/dev/ui-graph" }
tilo-headless-schema = { path = "../../crates/dev/headless-schema" }
# `tilo-app push`: the workspace's governance actions reached through its
# action API, as a key of the developer's, as `tilo` reaches it.
tilo-api = { path = "../../crates/server/tilo-api" }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[dev-dependencies]
serde_yaml = "0.9"
tempfile.workspace = true
tilo-test-env = { path = "../test-env" }
# The journey's checkout-external directory is held under an advisory lock.
tilo-advisory-lock = { path = "../../crates/platform/advisory-lock" }
# The outside-repository journey publishes into a real registry on loopback.
registry-server = { path = "../../crates/packaging/registry-server" }
# A framework app's surface, reported in process as its binary's `--surface`.
messages = { path = "../../apps/messages" }
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[features]
# Explicit expensive real generated-app/toolkit/package qualification.
native-sdk-qualification = []

[[test]]
name = "native-sdk"
path = "tests/native_sdk.rs"
required-features = ["native-sdk-qualification"]
