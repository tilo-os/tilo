# Tilo's model: its records, CRDT sync, settings store and identity. `tilo-ui` compiles these
# only with its `model` feature, which `tilo-app` turns on; its default features leave them out.
never = [
    "tilo-automerge",
    "tilo-collab-types",
    "tilo-collaboration",
    "tilo-resource",
    "tilo-resource-macros",
    "tilo-resource-store",
    "tilo-runtime-collab",
    "tilo-settings-store",
    "tilo-user-identity",
]
