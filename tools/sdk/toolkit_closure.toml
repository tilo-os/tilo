# The in-repo crates `tilo-ui` compiles, read by tools/sdk/check_toolkit_closure.py.
#
# `allowed` is exactly what it builds with every feature off: a Rust program that only draws
# a window compiles these and nothing else of this repository. The list only shrinks; a crate
# that joins it is a UI or platform crate the toolkit may use, never part of Tilo's model.
allowed = [
    "hexane",
    "regex-syntax",
    "rustls-native-certs",
    "serde_json",
    "tilo-action-policy",
    "tilo-actions",
    "tilo-advisory-lock",
