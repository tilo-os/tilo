# The entry points a program reaches a person's workspaces by: over iroh as one
# of the person's devices, asking the workspace's host for its records and its
# actions. The check measures the client graph from these.
client_roots = [
    "neighbour-wire",          # what peers say to each other: sync, actions, content
    "tilo-actions",            # resources, the actions on them, the ActionHost vocabulary
    "tilo-identity-client",    # the identity broker client: a device's keys
    "tilo-relay-session",      # the authenticated session: co-edit, anti-entropy, join
    "tilo-user-identity",      # who a device belongs to: certificates and revocations
    "tilo-workspace-join",     # signed invitations and join proofs
]

# Every Tilo crate those entry points reach, as one list. The client side is MIT
# end to end (LICENSING.md), so a crate joining this list is a licensing
# decision, not a build fix: one only a desktop, a relay or a workspace's own
# host needs (the desk, the live plane, the channels, the runtime that serves a
# workspace) stays AGPL. The check fails when the graph reaches a crate that is
# not here, and when one here is no longer reached.
client_side = [
    "collab-types",            # a document's signed envelopes, and resource paths
    "neighbour-wire",
    "runtime-portal",
    "rustls-native-certs",     # the system trust store, forked under crates/system
    "tilo-action-policy",      # the policy an answer to a message is held to
    "tilo-actions",
    "tilo-advisory-lock",
    "tilo-app-id",             # the id an app is known by
