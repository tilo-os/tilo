[package]
name = "tilolang-records"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The tilolang runtime's workspace records, styles and rich text, for the tests of the core crates that read them and ship without the language."

[lib]
name = "tilolang_records"
path = "src/lib.rs"

[dependencies]
# The language runtime the daemon links, whose records and styles a test reads through this.
tilolang-workspace = { path = "../../crates/lang/tilolang-workspace" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
