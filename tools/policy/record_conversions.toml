# Where a resource kind's data went when the kind moved between apps, read by
# tools/policy/check_resource_placement.py. A kind that moves takes what a
# person kept with it; an entry here says how it was carried over, or what the
# person loses.
#
[[change]]
kind = "logs.journal"
app = "logs"
change = "removed"
lost = "The journal filter a workspace shared with the Rust app. The tilolang app keeps its filter in its own record, but an earlier resource is not converted: a new installation starts with every severity and no facet set."

[[change]]
kind = "canvas.artwork"
app = "canvas"
change = "removed"
lost = "The Rust Canvas app's artworks, which its own surface held. The tilolang Canvas keeps the same artwork records in the workspace; an artwork the old app saved opens from its .artwork file, and one it never saved is not carried."

# kind = "<the resource kind>"   # or kinds = [...], each changed alike
# app = "<the app whose surface changed>"
# change = "moved" | "removed"
# conversion = "<path>:<fn>"   # a function in this tree that carries the data
# lost = "<what a person loses, and why>"   # or what could not be carried

[[change]]
kind = "chat.agent"
app = "chat"
change = "removed"
conversion = "crates/core/tilo-workspace-service/src/workspaces/agent_roster.rs:copy_agents"

[[change]]
kind = "canvas.recent-artworks"
app = "canvas"
change = "removed"
lost = "The artworks each device opened or saved lately, kept in the person's own state. Recents are now the device's settings, and the per-person state the old conversion read is gone, so earlier recents are not carried."

[[change]]
kind = "chat.drafts"
app = "chat"
change = "removed"
lost = "The words a person had typed into the native Chat and not sent. The tilolang Chat keeps no unsent words of its own, so they are not carried."

[[change]]
kind = "chat.workspace"
app = "chat"
change = "removed"
conversion = "apps/tl/chat/app.tl:carry_native_chat"

[[change]]
kind = "chat.messages"
app = "chat"
change = "removed"
conversion = "apps/tl/chat/app.tl:carry_native_chat"

[[change]]
kind = "chat.skills"
app = "chat"
change = "removed"
conversion = "apps/tl/chat/app.tl:carry_native_chat"

[[change]]
kind = "tilo.moderation"
app = "chat"
change = "removed"
lost = "The reports filed in the native Chat and the decisions taken on them. Reports are filed and decided in the tilolang Chat now, on its own messages; the native ones point at messages by ids the tilolang Chat does not keep, so they are not carried."

[[change]]
kind = "tilo.workspace.emoji"
app = "chat"
change = "removed"
lost = "Nothing a person kept: the workspace's emoji stay in their own record under Chat's id, which every app's framework and the workspace's settings read and write; only the native Chat's description of the kind goes."

[[change]]
kind = "chat.learned"
app = "chat"
change = "removed"
lost = "What a person told the native Chat's agents to remember about them. Only the session's agent turns for the native Chat read it, and those are gone with it; the tilolang Chat keeps no learned facts, so they are not carried."

[[change]]
kind = "disk-usage.recent-folders"
app = "disk-usage"
change = "removed"
lost = "The folders each device analyzed lately, which the native app kept in its device settings. The tilolang app keeps the folders measured lately in its own workspace record, so an earlier list is not carried."

[[change]]
kind = "files.recent"
app = "file-explorer"
change = "removed"
lost = "The files each device opened or changed through the Rust Files. The tilolang Files notes the files a person opens in its own record, and reads nothing of the old resource, so an earlier list is not carried."

[[change]]
kind = "firewall.config"
app = "firewall"
change = "removed"
lost = "The zones and rules a workspace shared with the Rust app. The tilolang app keeps the same configuration in its own record and each device applies it, but an earlier resource is not converted: a new installation reads this device's firewalld."

[[change]]
kind = "firewall.applied"
app = "firewall"
change = "removed"
lost = "The applied firewall configuration each device kept, in the person's own state. It is now the device's settings, and the per-person state the old conversion read is gone, so an earlier applied configuration is not carried."

[[change]]
kind = "terminal.recent-environments"
app = "terminal"
change = "removed"
conversion = "apps/terminal/src/target.rs:open"

[[change]]
kind = "tube.library"
app = "tube"
change = "removed"
conversion = "apps/tl/tube/app.tl:carry_native_tube"

[[change]]
kind = "tube.watch-history"
app = "tube"
change = "removed"
conversion = "apps/tl/tube/app.tl:carry_native_tube"

[[change]]
kind = "mail.mailbox"
app = "mail"
change = "removed"
lost = "The Rust Mail app is replaced by the tilolang Mail (apps/tl/mail). Messages and mailboxes are the mail server's, and the tilolang Mail reads them from the same accounts again; unsent drafts and waiting sends are carried into its drafts once by its carry_native_mail migration. Workspace-only labels on single messages and a change made offline but not yet sent to the server are not carried."

[[change]]
kind = "mail.messages"
app = "mail"
change = "removed"
lost = "The per-message read, flag and folder states mirror the mail server, which the tilolang Mail reads again. Mail delivered into the workspace rather than to a server (held messages) is not carried: the tilolang Mail has no workspace delivery."

[[change]]
kind = "mail.copies"
app = "mail"
change = "removed"
lost = "Copies of fetched mail kept on devices; the mail server holds the originals and the tilolang Mail fetches them again."

[[change]]
kind = "mail.trusted-senders"
app = "mail"
change = "removed"
lost = "Which senders may load remote images. The tilolang Mail shows plain text and loads no remote images, so the list has nothing to govern."

[[change]]
kind = "tilo.accounts"
app = "mail"
change = "moved"
lost = "Mail only read the workspace's accounts; Settings keeps them, and the tilolang Mail reads the same account store."

[[change]]
kind = "tilo.contacts.identities"
app = "mail"
change = "moved"
lost = "Mail only read the contacts' identities; Contacts keeps them."

[[change]]
kind = "calendar.calendar"
app = "calendar"
change = "removed"
lost = "The native Calendar's events, calendars, tasks and projects, kept in one workspace resource. The tilolang Calendar keeps the workspace's events in the calendar service's own resource types, which the native app never wrote, and it converts no document: what the native app held stays in its old resource and is not shown by the new one."

[[change]]
kinds = [
    "settings.accessibility",
    "settings.accessibility-device",
    "settings.agent-providers",
    "settings.appearance",
    "settings.appearance-device",
    "settings.audio",
    "settings.audio-device",
    "settings.automatic-display",
    "settings.clock",
    "settings.continuity",
    "settings.default-apps",
    "settings.desktop-controls",
    "settings.desktop-controls-device",
    "settings.device-vpn",
    "settings.display",
    "settings.display-change",
    "settings.display-placement",
    "settings.hosted-agent-providers",
    "settings.identity",
    "settings.input",
    "settings.input-device",
    "settings.locale",
    "settings.network-usage",
    "settings.night-light",
    "settings.notifications",
    "settings.osk-sources",
    "settings.power",
    "settings.search_history",
    "settings.shortcuts",
    "settings.text-assistance",
    "settings.updates",
    "settings.widgets",
