# Where a resource kind's data went when the kind moved between apps, read by
# tools/policy/check_resource_placement.py. A kind that moves takes what a
# person kept with it; an entry here says how it was carried over, or what the
# person loses.
#
# [[change]]
# kind = "<the resource kind>"
# app = "<the app whose surface changed>"
# change = "moved" | "removed"
# conversion = "<path>:<fn>"   # a function in this tree that carries the data
# lost = "<what a person loses, and why>"   # or what could not be carried

[[change]]
kind = "chat.agent"
app = "chat"
change = "removed"
conversion = "crates/server/tilo-workspace-service/src/workspaces/agent_roster.rs:copy_agents"

[[change]]
kind = "canvas.recent-artworks"
app = "canvas"
change = "removed"
lost = "The artworks each device opened or saved lately, kept in the person's own state. Recents are now the device's settings, and the per-person state the old conversion read is gone, so earlier recents are not carried."

[[change]]
kind = "chat.learned"
app = "chat"
change = "removed"
lost = "What a person told the native Chat's agents to remember about them. Only the session's agent turns for the native Chat read it, and those are gone with it; the tilolang Chat keeps no learned facts, so they are not carried."

[[change]]
kind = "clocks.on-devices"
app = "clocks"
change = "removed"
conversion = "apps/clocks/src/schedule.rs:new"

[[change]]
kind = "disk-usage.recent-folders"
app = "disk-usage"
change = "removed"
conversion = "apps/disk-usage/src/view.rs:new"

[[change]]
kind = "ebook.files"
app = "ebook"
change = "removed"
conversion = "apps/ebook/src/local_library.rs:open"

[[change]]
kind = "files.recent"
app = "file-explorer"
change = "removed"
conversion = "apps/file-explorer/src/resource.rs:open"

[[change]]
kind = "firewall.applied"
app = "firewall"
change = "removed"
lost = "The applied firewall configuration each device kept, in the person's own state. It is now the device's settings, and the per-person state the old conversion read is gone, so an earlier applied configuration is not carried."

[[change]]
kind = "maps.offline-areas"
app = "maps"
change = "removed"
lost = "The map regions each device downloaded for offline use, kept in the person's own state. They are now the device's settings, and the per-person state the old conversion read is gone, so earlier downloads are not carried."

[[change]]
kind = "terminal.recent-environments"
app = "terminal"
change = "removed"
conversion = "apps/terminal/src/target.rs:open"

[[change]]
kind = "tube.library"
app = "tube"
change = "removed"
conversion = "apps/tl/tube/app.tl:carry_native_tube"

[[change]]
kind = "tube.watch-history"
app = "tube"
change = "removed"
conversion = "apps/tl/tube/app.tl:carry_native_tube"

[[change]]
kind = "video-player.recent"
app = "video-player"
change = "removed"
lost = "The videos each device played lately and where each left off, kept in the person's own state. They are now the device's settings, and the per-person state the old conversion read is gone, so earlier positions are not carried."

[[change]]
kind = "mail.mailbox"
app = "mail"
change = "removed"
lost = "The Rust Mail app is replaced by the tilolang Mail (apps/tl/mail). Messages and mailboxes are the mail server's, and the tilolang Mail reads them from the same accounts again; unsent drafts and waiting sends are carried into its drafts once by its carry_native_mail migration. Workspace-only labels on single messages and a change made offline but not yet sent to the server are not carried."

[[change]]
kind = "mail.messages"
app = "mail"
change = "removed"
lost = "The per-message read, flag and folder states mirror the mail server, which the tilolang Mail reads again. Mail delivered into the workspace rather than to a server (held messages) is not carried: the tilolang Mail has no workspace delivery."

[[change]]
kind = "mail.copies"
app = "mail"
change = "removed"
lost = "Copies of fetched mail kept on devices; the mail server holds the originals and the tilolang Mail fetches them again."

[[change]]
kind = "mail.trusted-senders"
app = "mail"
change = "removed"
lost = "Which senders may load remote images. The tilolang Mail shows plain text and loads no remote images, so the list has nothing to govern."

[[change]]
kind = "tilo.accounts"
app = "mail"
change = "moved"
lost = "Mail only read the workspace's accounts; Settings keeps them, and the tilolang Mail reads the same account store."

[[change]]
kind = "tilo.contacts.identities"
app = "mail"
change = "moved"
lost = "Mail only read the contacts' identities; Contacts keeps them."

[[change]]
kind = "calendar.calendar"
app = "calendar"
change = "removed"
lost = "The native Calendar's events, calendars, tasks and projects, kept in one workspace resource. The tilolang Calendar keeps the workspace's events in the calendar service's own resource types, which the native app never wrote, and it converts no document: what the native app held stays in its old resource and is not shown by the new one."
