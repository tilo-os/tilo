# Every destructive action Undo takes back in full, with why it does.
#
# A destructive action that Undo takes back runs at once and offers Undo; it
# is never asked about. That is only true when everything it does is in the
# record Undo restores. An action that also reaches outside it (a server, a
# device, someone's inbox, what others saw) is `#[action(destructive,
# irreversible)]` and is asked first. tools/policy/check_action_confirmation.py
# refuses a destructive action that is neither irreversible nor listed here.
#
# Key: "<file>::<fn>". Value: what it changes, and that Undo restores it.

[undoable]
"apps/api-tester/src/resource.rs::delete_collection" = "Removes the collection and its saved requests from the record; Undo restores them."
"apps/api-tester/src/resource.rs::delete_request" = "Removes a saved request from the record; Undo restores it."
"apps/api-tester/src/resource.rs::delete_environment" = "Removes an environment and its variables from the record; no secret store is touched."
"apps/calculator/src/resource.rs::delete_history_entry" = "Removes one history entry from the record; Undo restores it."
"apps/calculator/src/resource.rs::clear_history" = "Empties the history in the record; Undo restores it."
"apps/calculator/src/resource.rs::delete_function" = "Removes a graphed function from the record; Undo restores it."
"apps/calculator/src/resource.rs::delete_surface" = "Removes a graphed surface from the record; Undo restores it."
"apps/calendar/src/resource.rs::delete_project" = "Removes a project from the record; its events stay; Undo restores it."
"apps/chat/src/messages.rs::delete_message" = "Removes one's own message from the room's record; no bridge deletes it elsewhere; Undo restores it for everyone."
"apps/chat/src/messages.rs::remove_message" = "A moderator removes a message from the room's record; Undo restores it for everyone."
"apps/chat/src/record.rs::delete_category" = "Removes a category from the record; its channels stay; Undo restores it."
"apps/chat/src/record.rs::delete_channel" = "Removes a channel from the record; its messages stay in their parts; Undo restores it."
"apps/code-editor/src/project.rs::delete" = "Removes the file's entry and text from the project record; nothing on disk is deleted."
"apps/contacts/src/resource.rs::delete_contact" = "Removes a contact from the book; Undo restores it."
