# What Undo cannot take back, and why it stays that way.
#
# An action built with `.destructive()` is a deletion; Undo takes it back
# unless what it destroys was never in the document to undo. Undo is a system
# service, so a destructive action that is not undoable is asked about, and a
# person who is always asked about an ordinary deletion has learned to answer
# without reading. tools/policy/check_action_confirmation.py therefore refuses
# such an action unless it is tagged `undo:irreversible` — which says what it
# destroys, and makes every door ask — or listed here with the reason Undo
# cannot take it back.
#
# A reason says what is lost outside what Undo holds, and in whose words the
# person is asked: a running process, a drive holding someone else's data,
# another person's copy the system cannot reach. "It is important", "users
# expect a question" and "safer" are not reasons: the question is what makes a
# deletion that could be undone feel final.
#
# An entry pins the one place its deletion is built, in one of three ways:
#
#   file = "apps/x/src/resource.rs"   the site that builds it; a `*` covers the
#                                     files its directory holds
#   file + effect = "EraseDevice"     the `#[effect(destructive)]` that site
#                                     declares, which its surface's builder
#                                     turns into a deletion
#   resource = "x.thing"              the kind whose own builder publishes
#                                     every action the resource declares
#
# An entry that neither names nor matches a deletion in the tree is refused:
# the check says so, so an entry cannot outlive the code it was written for.

[[deletion]]
action = "app.uninstall"
file = "crates/session/shell/src/shell/actions/all.rs"
reason = """
Uninstalling takes an app and what it keeps on this computer off it: the
program's own files, and the settings and saved files its sheet offers to send
to the Trash. None of them was ever in a document, so Undo holds no version of
them. The shell's own sheet names the app and says whether its data goes; a
person who wants it back takes it out of the Trash.
"""

[[deletion]]
action = "app.remove-from-apps"
file = "crates/session/shell/src/shell/actions/all.rs"
reason = """
Taking an app off the person's apps deletes nothing — its file stays on the
computer — but the list it leaves is the system's own, and no document holds
it, so Undo cannot put the entry back. The sheet says the app stays, and
adding it again is one step.
"""

[[deletion]]
action = "bot.remove"
file = "crates/session/shell/src/shell/actions/all.rs"
reason = """
Removing a bot stops it on the host that runs it and takes it out of the
workspace for every member at once. The bot's own store and the host's are not
documents this person's Undo holds, so the question names the bot before
either happens.
"""

[[deletion]]
action = "agent.remove"
file = "crates/session/shell/src/shell/actions/all.rs"
reason = """
Removing an agent revokes every grant it held in the workspace, and the members
see it leave their copies too. The grants are the workspace's shared record and
the agent's own store is not reachable from this machine, so Undo holds neither
what it is given back nor what it lost.
"""

[[deletion]]
action = "workspace.delete"
file = "crates/session/shell/src/shell/actions/all.rs"
reason = """
Deleting a workspace deletes it here and, through the room's host, on the
person's other devices, and this device leaves the room in the same step: it is
joined again rather than undone. The other members' copies and the room's own
record are not in this machine's document, so Undo cannot bring the workspace
back — joining it again is how it returns.
"""

[[deletion]]
action = "format"
file = "apps/disks/src/resource.rs"
effect = "Format"
reason = """
Formatting writes a new filesystem over what the drive or partition holds, and
nothing in the document remembers the bytes that were there: they are not this
machine's copy to keep, and Undo has no version of them to restore. The person
types the device's own name before it is written, so the question names what
is lost.
"""

[[deletion]]
action = "delete-offline-area"
file = "apps/maps/src/resource.rs"
effect = "DeleteOfflineArea"
reason = """
A downloaded area is copied from the map server, not edited by anyone, and
deleting it frees the space it takes on this device: the document never held
the bytes, so Undo cannot put them back, and offering it would promise a
download nobody asked for again.
"""

[[deletion]]
action = "clear-offline-areas"
file = "apps/maps/src/resource.rs"
effect = "ClearOfflineAreas"
reason = """
Clearing deletes every downloaded area at once, each of them a copy of the map
server's own data that this device downloaded and owns. Undo cannot restore
bytes the document never held, and none of them is anyone's work.
"""
