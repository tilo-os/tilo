# The words of docs/architecture/core.md's "Words that go", one row each, as they are counted in
# the code by tools/policy/check_words_that_go.py.
#
#   row     the row's first cell in core.md, which names it in the baseline
#   idents  identifiers counted: each is a run of words matched against the words of an
#           identifier (`app_keeper`, `AppKeeper` and `APP_KEEPER` all hold "keeper"), the last
#           word also in its plural. A name holding one that the baseline does not list fails.
#           A term starting with `=` is the whole identifier (`=answers` is `answers` and
#           `Answers`, not a test named `…_answers_…`).
#   generic identifiers matched the same way, but words so common in ordinary code that they
#           are counted and printed only, never failing the check
#   text    the exact text that names the concept, wherever it is in the code and strings
#           included; it counts as a name only as a whole name, so a row's `tilo.member` is
#           not found inside `tilo.membership`
#   paths   files (or a directory, ending in `/`) whose lines of code are counted, for a row
#           whose concept is a piece of code rather than a name: more lines than the baseline fail
#
# A row lists the identifiers that name its concept. Words too common to tell apart from
# ordinary English (the settings scopes `Personal` and `Shared`, `store` as a kind of device,
# the `-w` flag) are left out rather than counted wrongly.

