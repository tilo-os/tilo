[[step]]
name = "image-interpreters"
label = "No new interpreter scripts in the OS image"
run = "python3 tools/policy/check_image_interpreters.py"

[[step]]
name = "seeded-state-history"
label = "State seeded once keeps every version upgraded machines hold"
run = "python3 tools/policy/check_seeded_state_history.py"

[[step]]
name = "media-stack"
