# The repository policy suite, one step at a time.
#
# tools/policy/run.sh runs every step here, the checks of the tree side by side and then the
# tests. t runs each as a check of its own, `policy/<name>` (`policy/tests/<name>` for the
# tests), generated into t.toml by tools/ci/t_toml.py and keyed by the step's `inputs`: a change
# reruns the steps that read what it changed and no others (`t test policy` runs them all).
#
#   name     the check's name after `policy/`
#   label    what run.sh prints for it
#   run      the command, from the top of the tree
#   inputs   the files its result depends on, as t globs (`*` also matches `/`). The command's
#            own files and the tools/policy, tools/ci and tools/docs modules a Python step
#            imports are added by tools/ci/t_toml.py. A step that walks a tree names the tree;
#            one that lists the tracked files through Git and reads any of them says `**`.
#   git      it lists or reads the tracked files through Git: under t, whose checks see no
#            .git, it runs under tools/ci/t-git-index.sh, which indexes the files present
#   tests    a test of the suite's own tools, run after the checks of the tree: its fixtures
#            write beside the sources, so under t it gets a private copy of them
#   history  a test that reads the commit's Git history: under t it gets t's .git, which keys
#            its result per commit, so it reruns on every commit of main
#
# Workspace membership, the repository layout and the code map are t.toml's `workspace-layout`
# and `codemap` checks, and the SDK's portability, capabilities and browser desktop registry its
# `sdk-policy`; run.sh runs those as steps too, from their own declarations there.

[[step]]
name = "source-content"
label = "Source blobs are text and LF or explicitly pinned assets"
run = "python3 tools/policy/check_source_content.py"
git = true
inputs = ["**"]

[[step]]
name = "public-references"
label = "Tracked files reference no internal tracker"
run = "python3 tools/policy/check_public_references.py"
git = true
inputs = ["**"]

[[step]]
name = "dependency-cycles"
label = "Package graph is acyclic"
run = "python3 tools/policy/check_dependency_cycles.py"
inputs = ["Cargo.toml", "**/Cargo.toml", "Cargo.lock"]
pre_push = true

[[step]]
name = "integration-test-modules"
label = "Integration tests are compiled by a test target"
run = "python3 tools/policy/check_integration_test_modules.py"
inputs = ["Cargo.toml", "**/Cargo.toml", "**/*.rs"]
pre_push = true

[[step]]
name = "capnp-bindings"
label = "Checked-in capnp bindings match their schemas"
run = "python3 tools/policy/check_capnp_bindings.py"
inputs = ["tools/policy/capnp_bindings.toml", "**/*.capnp", "**/*_capnp.rs"]
pre_push = true

[[step]]
name = "interfaces"
label = "Interface schemas match the code and their versions"
