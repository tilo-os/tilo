run = "bash os/tests/workflow_dependency_invariants.sh"
inputs = [".forgejo/**", ".config/visual-goldens-image", "dist/ci/install-sccache.sh", "keys/cosign.pub",
          "os/Containerfile", "os/kernel/Containerfile", "os/dev/**", "os/external-assets/github-assets.tsv",
          "os/tests/test_require_cosign_authority.py", "tools/policy/check_workflow_actions.py"]
pre_push = true

[[step]]
name = "workflow-package-paths"
label = "Path-filtered package dependency triggers"
run = """python3 tools/policy/check_workflow_package_paths.py \
  --check tilo-advisory-lock 't.toml#canary-ci-builder-cache-cold-x86_64' \
  --check tilo-advisory-lock 't.toml#canary-ci-builder-cache-warm-x86_64' \
  --check tilo-crypto 't.toml#development-signing-context-x86_64' \
  --check tilo-fs 't.toml#real-fuse' \
  --check tilo-relay 't.toml#image-relay' \
  --check registry-server 't.toml#image-registry-server' \
  --check tilo-runtime 't.toml#runtime-macos' \
  --check notes 't.toml#apps-macos' \
  --check tilo-install-helpers 't.toml#vm-test-binaries' \
  --check tilo-app-cli 't.toml#sdk-linux'"""
inputs = ["t.toml", ".forgejo/workflows/**", "Cargo.toml", "**/Cargo.toml", "Cargo.lock"]
pre_push = true

[[step]]
name = "developer-docs"
label = "Developer docs pages and links"
