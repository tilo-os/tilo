run = "python3 tools/policy/check_iroh_presets.py"

[[step]]
name = "setup-neutral"
label = "No setup-specific references"
run = "python3 tools/policy/check_setup_neutral.py"

[[step]]
name = "vendor-provenance"
label = "Vendored crates carry licence and provenance"
run = "python3 tools/policy/check_vendor_provenance.py"

[[step]]
name = "too-many-arguments"
label = "At most eight parameters, no escape hatch"
run = "python3 tools/policy/check_too_many_arguments.py"

[[step]]
name = "source-file-size"
label = "Rust files stay under their size ceiling"
run = "python3 tools/policy/check_source_file_size.py"

# The suite's own tests, after the checks of the tree.

[[step]]
name = "unit"
label = "Repository policy unit tests"
run = "python3 tools/policy/run_unit_tests.py tools/tests"
tests = true

[[step]]
name = "sccache"
label = "Compiler-cache helper tests"
run = "bash tools/tests/ci_sccache.sh"
tests = true

[[step]]
name = "cargo-shim"
label = "Cargo shim tests"
run = "bash tools/tests/cargo_shim.sh"
tests = true

[[step]]
name = "receipt"
label = "CI receipt tests"
run = "bash tools/tests/test_ci_receipt.sh"
tests = true

[[step]]
name = "builder-candidate-workflow"
label = "Builder candidate workflow tests"
run = "python3 os/tests/test_builder_candidate_workflow.py"
tests = true


[[step]]
name = "codex-hooks-tests"
label = "Codex CI watcher tests"
run = "python3 tools/policy/run_unit_tests.py .codex/hooks"
tests = true

[[step]]
name = "workspace-membership"
label = "Workspace membership"
run = "./scripts/check-workspace-complete.sh"

[[step]]
name = "repository-layout"
label = "Repository layout"
run = "python3 tools/policy/check_repository_layout.py"

[[step]]
name = "codemap"
label = "Code map is current"
run = "python3 tools/docs/codemap.py --check"

[[step]]
name = "app-portability"
label = "Apps and portable SDK crates hold no platform code"
run = "python3 tools/policy/check_app_portability.py"

[[step]]
name = "app-capabilities"
label = "Apps declare the capabilities their code uses"
run = "python3 tools/policy/check_app_capabilities.py"

[[step]]
name = "web-desktop-registry"
label = "Browser desktop registry matches app manifests"
run = "python3 tools/web/generate_web_desktop.py --check"
