run = "python3 tools/policy/check_format_migrations.py check"
inputs = ["crates/**/*.rs", "apps/**/*.rs"]
pre_push = true

[[step]]
name = "workflow-timeouts"
label = "Workflow timeouts"
run = "python3 tools/policy/check_workflow_timeouts.py"
inputs = [".forgejo/workflows/**"]
pre_push = true

[[step]]
name = "workflow-dependencies"
