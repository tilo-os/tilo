# The repository policy suite, one step at a time.
#
# tools/policy/run.sh runs every step here, the checks of the tree side by side and then the
# tests.
#
#   name     a short name for the step
#   label    what run.sh prints for it
#   run      the command, from the top of the tree
#   tests    a test of the suite's own tools, run after the checks of the tree: its fixtures
#            write beside the sources

[[step]]
name = "source-content"
label = "Source blobs are text and LF or explicitly pinned assets"
run = "python3 tools/policy/check_source_content.py"

[[step]]
name = "public-references"
label = "Tracked files reference no internal tracker"
run = "python3 tools/policy/check_public_references.py"

[[step]]
name = "integration-test-modules"
label = "Integration tests are compiled by a test target"
run = "python3 tools/policy/check_integration_test_modules.py"

[[step]]
name = "capnp-bindings"
label = "Checked-in capnp bindings match their schemas"
run = "python3 tools/policy/check_capnp_bindings.py"

[[step]]
name = "interfaces"
label = "Interface schemas match the code and their versions"
run = "python3 tools/policy/check_interfaces.py check"

[[step]]
name = "format-migrations"
label = "Versioned on-disk formats name the oldest version they bring up"
run = "python3 tools/policy/check_format_migrations.py check"

[[step]]
name = "workflow-timeouts"
label = "Workflow timeouts"
run = "python3 tools/policy/check_workflow_timeouts.py"

[[step]]
name = "workflow-dependencies"
label = "Workflow dependency and supply-chain invariants"
run = "bash os/tests/workflow_dependency_invariants.sh"

[[step]]
name = "developer-docs"
label = "Developer docs pages and links"
run = "python3 -m unittest tools/tests/test_developer_docs.py tools/tests/test_development_book.py tools/tests/test_development_tool_help.py && python3 tools/docs/developer_docs.py check && python3 tools/docs/check_development_book.py"

[[step]]
name = "suites"
label = "Every test suite outside Cargo is gated or explained"
run = "python3 tools/ci/suites.py check"

[[step]]
name = "codex-hooks"
label = "Codex hook manifest"
run = "python3 -m json.tool .codex/hooks.json >/dev/null"

[[step]]
name = "app-text-contract"
label = "Application text-stack contract"
run = "python3 tools/policy/check_app_text_contract.py"

[[step]]
name = "action-confirmation"
label = "Undoable actions are never confirmed by typing; a deletion Undo cannot take back is written down"
run = "python3 tools/policy/check_action_confirmation.py"

[[step]]
name = "app-copy"
label = "Copy used by source is in every shipped catalogue"
run = "python3 tools/policy/check_app_copy.py"

[[step]]
name = "copy-language"
label = "Copy follows the house language and glossary"
run = "python3 tools/policy/check_copy_language.py"

[[step]]
name = "action-keywords"
label = "The other words actions declare for search are plain words"
run = "python3 tools/policy/check_action_keywords.py"

[[step]]
name = "primitives"
label = "Surfaces are built from the design system primitives"
run = "python3 tools/policy/check_primitives.py"

[[step]]
name = "breakpoints"
label = "Surfaces take their breakpoint from the rect they are laid out in"
run = "python3 tools/policy/check_breakpoints.py"

[[step]]
name = "swallowed-decodes"
label = "Session and app-hosting code hears its decode and parse errors"
run = "python3 tools/policy/check_swallowed_decodes.py"

[[step]]
name = "app-toolbars"
label = "Apps put their controls, search included, in the window bar's slots"
run = "python3 tools/policy/check_app_toolbars.py"

[[step]]
name = "host-data-apps"
label = "Apps that show the machine declare it and are captured only from scenarios"
run = "python3 tools/policy/check_host_data_apps.py"

[[step]]
name = "app-resource-action-contract"
label = "Application resource/action contract"
run = "python3 tools/policy/check_app_resource_action_contract.py"

[[step]]
name = "atspi-endpoint-contract"
label = "AT-SPI endpoint contract"
run = "python3 tools/policy/check_atspi_endpoint_contract.py"

[[step]]
name = "component-manifest"
label = "OS component manifest"
run = "python3 tools/policy/check_component_manifest.py"

[[step]]
name = "dev-image-contract"
label = "Dev image stays out of production"
run = "python3 tools/policy/check_dev_image_contract.py"

[[step]]
name = "uki-pipeline"
label = "Sealed images share one UKI pipeline"
run = "python3 tools/policy/check_uki_pipeline.py"

[[step]]
name = "image-builder-inputs"
label = "Image builders copy what they compile, and only that"
run = "python3 tools/policy/check_image_builder_inputs.py"

[[step]]
name = "kernel-dev-build"
label = "Dev kernel build follows the release build"
run = "python3 tools/policy/check_kernel_dev_build.py"

[[step]]
name = "dev-overrides-contract"
label = "Dev-override features stay out of production images"
run = "python3 tools/policy/check_dev_overrides_contract.py"

[[step]]
name = "ui-host-inputs-contract"
label = "UI host-inputs contract"
run = "python3 tools/policy/check_ui_host_inputs_contract.py"

[[step]]
name = "ui-clock-contract"
label = "UI clock contract"
run = "python3 tools/policy/check_ui_clock_contract.py"

[[step]]
name = "no-transient-cards"
label = "Transient notices are the window bar's"
run = "python3 tools/policy/check_no_transient_cards.py"

[[step]]
name = "motion-library"
label = "Animations are composed from the motion library"
run = "python3 tools/policy/check_motion_library.py"

[[step]]
name = "formats"
label = "Dates, times, numbers and sizes go through ui::format"
run = "python3 tools/policy/check_formats.py"

[[step]]
name = "settings-writes"
label = "Settings are written through typed keys"
run = "python3 tools/policy/check_settings_writes.py"

[[step]]
name = "widget-document-writes"
label = "Widgets never write the document"
run = "python3 tools/policy/check_widget_document_writes.py"

[[step]]
name = "app-content-store"
label = "App content store contract"
run = "python3 tools/policy/check_app_content_store.py"

[[step]]
name = "document-engine-boundary"
label = "Document content stays behind the document layer"
run = "python3 tools/policy/check_document_engine_boundary.py"

[[step]]
name = "desktop-model-dependencies"
label = "Desktop crates dependency boundary"
run = "python3 tools/policy/check_desktop_model_dependencies.py"

[[step]]
name = "shell-layers"
label = "Shell service modules stay below the compositor"
run = "python3 tools/policy/check_shell_layers.py"

[[step]]
name = "crate-layers"
label = "Crates reach only the layers their rules allow"
run = "python3 tools/policy/check_crate_layers.py"

[[step]]
name = "runtime-dylib-surface"
