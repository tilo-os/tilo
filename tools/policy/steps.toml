inputs = ["docs/**", "**/*.md", "**/Cargo.toml", "tools/docs/**", "tools/tests/test_developer_docs.py", "tools/tests/test_development_book.py", "tools/tests/test_development_tool_help.py", "tools/dev/install-git-hooks.py", "scripts/test-local.sh", "dist/rpm/build-rpm.sh", "crates/session/shell/build-macos.sh"]
pre_push = true

