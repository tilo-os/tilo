# Deprecated APIs that still have users (see check_compat_ratchet.py).
#
# Each [[api]] counts the sites of one old API with `pattern`, a Python regex
# run over Rust source (optionally limited to the path prefixes in `paths`);
# a match that starts on a `//` line does not count. The regex runs only on
# files containing one of `needles`, fixed strings every match must contain.
# Start a pattern with a literal (`fn\s+name`, not `\bfn`): a leading `\b`
# costs the regex engine its fast skip. `count` may only go down, and must be lowered
# in the change that removes sites; at zero, delete the whole block together
# with its adapter. Every item marked as a compatibility adapter in crates/sdk,
# and every #[deprecated] item, must be listed in some entry's `adapters` as
# "path::item". Do not add an entry to admit new users of an old API; add one
# only for a new migration, with the adapter it introduces.
#
# List an entry's sites with:
#   python3 tools/policy/check_compat_ratchet.py --list NAME

[[api]]
name = "widget-handle-event-positional"
owner = "crates/sdk/ui-core (refactor/widget-context)"
target = "Widget::handle_event_ctx(event, &mut EventCtx)"
reason = "Nine-parameter Widget::handle_event overrides; the trait default adapts them to EventCtx"
pattern = 'fn\s+handle_event\s*\(\s*&mut\s+self\s*,\s*\w+\s*:\s*&[\w:]*WindowEvent\s*,\s*\w+\s*:\s*f64\b'
needles = ["handle_event"]
count = 402
adapters = [
    "crates/sdk/ui-core/src/widget/mod.rs::handle_event",
    "crates/sdk/ui-core/src/widget/decorator.rs::handle_event",
]

