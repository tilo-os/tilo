# Edges and `use` paths that break a rule in crate_layers.toml and are still
# there, each with the work that removes it. The list only shrinks: an entry
# the code no longer needs fails as stale, and anything it does not record
# fails. `check_crate_layers.py --write-baseline` drops stale entries; it
# never records a new one.

# The desktop's transport carries the join contract's `TransportHint`, which
# the engine happens to re-export. It goes when the transport names the
# contract from tilo-workspace-join, which owns it.
[[violation]]
rule = "tilo-peer-state"
package = "tilo-network-actor"
path = "Cargo.toml"
