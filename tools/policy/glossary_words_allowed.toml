# Uses of the words docs/glossary.md does not use that mean something outside
# Tilo (tools/policy/check_glossary_words.py). Each rule names its `words`
# ("*" for all) and where they are allowed: `paths`, as globs in which `*`
# spans directories, or `identifiers`, the exact identifier the word is part
# of. A use of Tilo's own concept never goes here: rename it.

[[allow]]
reason = "Generated from sources the check already reads."
words = ["*"]
paths = [
    "crates/packaging/app-fleet/src/generated.rs",
    "crates/browser/tilo-web-desktop/src/apps.rs",
    "crates/agent/agent-session/src/web_apps.rs",
    "crates/workspace-hack/*",
    "docs/codemap.md",
]

[[allow]]
reason = "The pinned source of a released relay version, kept byte for byte."
words = ["*"]
paths = ["tools/relay-upgrade/*"]

[[allow]]
reason = "The BIP39 word list."
words = ["*"]
paths = ["crates/collab/threshold-identity/src/bip39.rs"]

[[allow]]
reason = "A Wayland or logind seat: a set of input devices and the session on them."
words = ["seat"]
identifiers = ["wl_seat", "WlSeat", "seat0", "XDG_SEAT", "libseat", "LibSeat", "zwp_input_method_v2", "ext_data_control_v1"]
paths = ["crates/session/compositor/*", "crates/session/greeter/*", "crates/platform/tilo-clipboard/*"]

[[allow]]
reason = "A seat at a poker table."
words = ["seat"]
paths = ["apps/poker/*"]

[[allow]]
reason = "iroh's NAT relay."
words = ["relay"]
identifiers = ["RelayMode", "RelayUrl", "RelayMap", "RelayNode", "RelayUrlParseError"]

