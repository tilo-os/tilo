# Uses of the words docs/glossary.md does not use that mean something outside
# Tilo (tools/policy/check_glossary_words.py). Each rule names its `words`
# ("*" for all) and where they are allowed: `paths`, as globs in which `*`
# spans directories, or `identifiers`, the exact identifier the word is part
# of. A use of Tilo's own concept never goes here: rename it.

[[allow]]
reason = "The dialer's name for the network host it reaches, which the glossary keeps as a network host name."
words = ["host"]
identifiers = ["Host", "host", "connect_to_pinned_host"]
paths = ["crates/system/tilo-cli/src/server.rs"]

[[allow]]
reason = "The workspace service's own names for the device a test runs workspaces on: its fixture (`Hosted`) and that fixture's `host` field, the signed holder address's `host` field, and the pinned-dial call that reaches it."
