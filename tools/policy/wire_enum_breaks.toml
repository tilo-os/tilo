[[break]]
file = "crates/lang/tilolang-runtime/src/value.rs"
enum = "Value"
reason = "`Picture` is a picture in a component's prop, made while a view is built and never stored or sent (like `Node` and `Rec` beside it); it was added in the middle of the enum, which moved `AtEvent` and every variant after it. Moving it back to the end restores the places every journal value and every stored value had before it existed: no release carries it, so no kept byte names a place it wrote (the enums it moved read as they always did)"

[[break]]
