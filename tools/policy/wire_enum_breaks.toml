reason = "postcard frames on the socket between a runtime and the apps it started, both from one build and live only as long as that connection; the conversation topic went with the private lane it named, and the runtime interface version was raised past its removal, so an app from another build never reads these frames"

[[break]]
file = "crates/runtime/runtime-collab/src/wire.rs"
