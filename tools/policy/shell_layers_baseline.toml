[shell_dependencies.added]
"tilo-onboarding" = "Setup as the app the session mounts in its own process and lends a seat, as it mounts the power menu's sheets: the shell keeps the ceremony, the journal and every secret's custody; it brings only tilo-app and zeroize, which the shell already depends on"
"tilo-onboarding-host" = "The host side of setup (first boot, the nearby, browser, elsewhere and migration hand-offs, the retained files) carved out of the shell into its own crate the session calls: the shell keeps the seat and the ceremony it lends; it brings only crates the shell already depends on"
"launcher-app" = "Search as the launcher app the session mounts in its own process, as it mounts the power menu's sheets: the desktop lends it what it can find; it brings only tilo-app and zeroize, which the shell already depends on"
"tilo-device-fabric" = "The state one person's devices share (presence, media, clipboard, roaming settings, unlock, realtime calls), carved out of the shell as a model the session drives; it brings tilo-desktop-surface, which the shell links through tilo-desktop, and otherwise only crates the shell already depends on"
"tilo-nearby-service" = "The private spool a nearby transfer between one person's devices is staged in, carved out of the shell; it brings only crates the shell already depends on"
"tilo-speaker-service" = "Speaker groups and remote audio across one person's devices, carved out of the shell as a service it drives; it brings only crates the shell already depends on"
"tilo-overview" = "The workspace overview as an ordinary framework app the shell mounts in its own process and lends the desktop to; it brings tilo-desktop, tilo-desktop-model, tilo-sheets, tilo-action-policy and tilo-app, which the shell already depends on"
"tilo-sheets" = "The sheets the shell shows over the desktop (the power menu) as ordinary framework apps it mounts in its own process; it brings only tilo-app, which the shell already depends on"
"tilo-onboarding-host" = "Setup's view and the session host it lends an onboarding app, moved out of the shell into a crate of its own: the shell re-exports them so its overlay and screens read one implementation, and it brings only tilo-app, tilo-onboarding, tilo-desktop-model and tilo-ui, which the shell already depends on"
"tilo-onboarding" = "The onboarding app's own record and effect types, which the shell reads beside the view it now hosts from tilo-onboarding-host: the crate brings only tilo-app, tilo-desktop-model and tilo-ui, which the shell already depends on"
"tilo-durable-writer" = "The off-frame-thread writer the workspace tree, drives and layout records go through, moved out of the shell into a crate of its own: the session's own app mounts it too, so it cannot live inside the shell; it brings nothing but what the shell already depends on"
"tilo-device-vpn" = "Routing a device's traffic through another device of the same person: the shell owns the iroh endpoint, so it accepts the tunnel ALPN and drives the client and exit; built with only the tunnel feature (wire format, packet loop, typed helper protocol), which brings iroh, tokio and serde that the shell already depends on, and none of the privileged helper"
"settings-sections" = "The person's settings sections as resource models, carved out of the Settings app: the session keeps them as records and serves their field edits and verbs to the palette, agents and scripts whether or not Settings is open; it brings settings-store, tilo-wallpapers, tilo-accessibility-settings and tilo-app, which the shell already depends on, and tilo-locale, which itself brings only tilo-app and serde"
"tasks" = "Runs of issues assigned to an agent (broker_services::tracker_runs) come from the tracker record, read with the Tasks app's own model as the shell already reads Notes, Code and Word records; it brings only tilo-document, tilo-rich-text and tilo-app, which the shell already depends on"
"tilo-documents" = "The files a person chooses for an app in the shell's chooser, served into that app's sandbox: the shell mounts the store and gives into it; the table, the beneath-only host access and the FUSE adapter live in this crate, which the launcher shares for the paths"
"tilo-lan-discovery" = "Replaces iroh-mdns-address-lookup, which the shell dropped: finding the person's own devices on the local network is an address lookup the shell's endpoint registers; the probe protocol, its freshness and the socket live in this crate"
"tilo-location" = "The automatic time zone (time_zone_follower) asks where the device is through the XDG Location portal; tilo-location is the one location client, which the app host already uses for apps, and brings only ashpd's location feature, tilo-rt and tilo-clock with it"
"tilo-owner-commit" = "The owner commit vocabulary carved out of tilo-peer-state, which the shell already depends on; the shell's native workspace owner implements its service and reaches the same code it did before, now in a smaller crate"
"tilo-model-client" = "The report review asks the model the person chose for the composer over a model gateway connection the shell makes itself (in_process::feedback_review), as a launcher makes one for an app; the shell already linked this crate through tilo-host, whose portable API no longer takes a unix descriptor, and builds it with only runtime-client"
"tilo-network-secret-agent" = "The NetworkManager secret agent carved out of the shell; the shell supplies only the sheet it asks in, the catalogue its keys resolve in and the roaming Wi-Fi store"
"tilo-tray-host" = "The status-notifier tray host carved out of the shell; the shell serves its watcher, paints its items and supplies the named-icon rasteriser."
"tilo-wallpapers" = "The shipped wallpapers' catalog, their lookup in the XDG data directories and the appearance.wallpaper setting, which Settings shares; the shell only paints the picture it decodes, and the crate brings only tilo-image-codec and tilo-paths with it"
"tilo-notification-banners" = "The notification banners carved out of the shell as an app the shell hosts in its own process: the banner stack, the machine-wide banners and their published actions live in this crate, which brings only tilo-app, tilo-desktop and durable-store, which the shell already depends on; the shell lends it the feed of the notifications it keeps"
"tilo-topbar" = "The top bar carved out of the shell as an app the shell hosts in its own process: the bars of every display, the workspace menu, the profile card and their published actions live in this crate, which brings only tilo-app, tilo-desktop, tilo-desktop-model and durable-store, which the shell already depends on; the shell lends it the feed of what its chrome knows"
"tilo-lock" = "A dependency-free std helper that recovers a poisoned lock's guard; it replaces the shell's inline `.unwrap_or_else(PoisonError::into_inner)` at every lock and adds no code of its own"
"account-custody" = "Service sessions (shell::broker_services::service_sessions) read and write the browser service-session secrets the person's account custody keeps; the custody crate is the one reader of that store, so the shell links it instead of a copy"
"app-catalogue" = "The catalogue of installable apps (Flathub's cached AppStream metadata, the fleet's manifests, the block list) that the shell's search reads and the Store shares; reading it from this one crate keeps both answering from the same catalogue"
"app-fleet" = "The fleet's compiled manifest metadata (tag lines, names, keywords, platforms) that desktop-search and app-catalogue already read, split out of app-catalogue so the browser desktop shares the one table; data only, no dependencies"
"browser-continuity" = "First boot finishes the browser hand-off the installer prepared (onboarding_browser, onboarding_prepared) and service sessions read its cookie records; the format and completion receipts live in this crate, shared with Browser"
"tilo-browser-peer" = "The member's side of pairing a new device through a shared host: the shell's network bridge answers the pending pairing requests with the crate's types, built without its default browser features"
"tilo-handoff" = "First boot receives the prepared setup from the installer or a peer computer (onboarding_peer) through the crate's authenticated hand-off receiver, the same code the installer sends with"
"tilo-messaging-service" = "The session door of the messaging service the compositor starts (shell::in_process::messaging) and the client Messages shown in the compositor uses; built without default features, so the compositor links no account, provider or vault code"
"tilo-audio-service" = "The line format of the session audio and media helper the compositor starts (shell::audio_service, shell::mpris) and the rules for which players may be handed off; built without default features, so the compositor links none of the audio policy and no MPRIS client"
"tilo-net-answers" = "The wire format of the confined network-answers helper search runs for currency rates; only the protocol types, built without default features, so the shell gains no network code"
"tilo-ntfs-mount" = "The consent-gated NTFS mount service's protocol for shell::drives, built without default features: the shell asks the service and never mounts itself"
"tilo-render-protocol" = "The messages between the compositor's render broker and the per-room render service it starts (compositor::render_broker)"
"tilo-render-service" = "The per-room render service runs as a mode of the session binary (linux_main dispatches it) and the compositor's broker starts it, so the binary links the service"
"tilo-system-stats" = "The typed system information service the session serves to apps, and the readings its own System monitor desk widget shows"
"host-fs" = "Uninstalling an app (shell::app_list) moves its program file and a Flatpak's data to the Trash, never deleting them; host-fs is the one Trash implementation, which Files and Backups already use, and brings only the trash crate and tilo-paths with it"
"tilo-winit-x11" = "The hosted backend's winit with X11 turned on, split out so hakari keeps X11 out of the shared app runtime; it adds no code beyond winit, which the shell already depends on as tilo-winit"
"tilo-wayland-ext" = "The color-management-v1 handlers and the EDID parsing, carved out of the shell so the compositor does not rebuild them; it brings neighbour-wire and smithay, which the shell already depends on"
"tilo-quick-settings" = "The Quick Settings panel, its sections and state, and the status line the top bar shares, carved out of the shell so a chrome or compositor change does not rebuild them; it brings tilo-ui, tilo-desktop, os-actions, settings-store and tilo-power-mgmt, which the shell already depends on"
"tilo-window-share" = "The owner side of a window shared with the workspace (share session, encoders, viewer registry, encode settings and counters), carved out of the shell so the compositor does not rebuild it; it brings neighbour-wire, tilo-callstream, tilo-media, tilo-paint-stream and smithay, which the shell already depends on"
"tilo-frame-metrics" = "The frame loop's instrumentation (phase timings, pacing, CPU traces, on-demand profiles), carved out of the compositor so a compositor change does not rebuild it; it brings libc, serde, serde_json, tilo-lock and tilo-paths, which the shell already depends on"
"tilo-liveness" = "The liveness socket's heartbeats, thread dumps and main-thread file audit, carved out of the compositor so a compositor change does not rebuild them; it brings backtrace, calloop, durable-store, libc, parking_lot and serde, which the shell already depends on"
"tilo-color-pipeline" = "The compositor's colour maths (HDR output encode, tone mapping, the HDR surface composite and its shaders, display capabilities, software dimming), carved out of the shell so a compositor change does not rebuild it; it brings neighbour-wire, settings-store, tilo-wayland-ext and vello, which the shell already depends on"
"tilo-output-passes" = "The GPU passes that put a frame on an output (orientation, ICC calibration, HDR encode and composite, XRGB damage history, shader warm-up, software GPU memory return), carved out of the shell so a compositor change does not rebuild them; it brings qcms, ash, sysinfo, settings-store, tilo-advisory-lock, tilo-color-pipeline and vello, which the shell already depends on"
"tilo-room-host" = "Every device hosts the rooms placed on it with the same host a relay embeds (docs/architecture/hosting.md): the room governance, member sessions and retained store live in tilo-room-host, built without its agents or web features, and the shell keeps only what ties it to this device, its router's deferred handlers (network::local_host) and placing its own workspaces on the host (shell::network::embedded_host), which reads the shell's workspace tree and network and so cannot move below it; a crate between the two would add a hop and leave the shell's graph the same"
"tilo-auth" = "The login screens' comforts go to tilo-authd over its own socket protocol, built with default features off; it is the one client of that protocol, and brings only the wire types the shell sends, not the daemon"
"pprof-alloc" = "Optional, behind the hosted-test-control feature: the sampling heap profiler installed as the global allocator in shell::heap_profile, idle unless PPROF_ALLOC_SAMPLE_RATE is set, so the idle-memory test and an on-demand profile can attribute live heap to a call site"
"prost" = "Optional, behind the hosted-test-control feature: decodes the gzipped pprof profile that pprof-alloc records, in shell::heap_profile only"
"flate2" = "Optional, behind the hosted-test-control feature: decompresses the gzipped pprof profile pprof-alloc writes, in shell::heap_profile only"
"tilo-network-actor" = "The peer-to-peer transport (the iroh actor: room host sessions, sessions with the person's own devices, direct links, the person's private device lane), carved out of the shell so a compositor change does not rebuild it; the desktop's side of what arrives on it is installed as services, and it brings iroh, tilo-joined-room, tilo-relay-session and the other transport crates the shell already depends on"
