# Layering of the `shell` crate split, checked by tools/policy/check_shell_layers.py
# (docs/policies.md, Shell layers). Every list only shrinks: an entry the code no longer needs
# fails as stale, and a new edge or dependency fails until it is removed or
# argued for in review. `check_shell_layers.py --write-baseline` drops stale
# entries; it never adds one.

# Service modules (paths relative to crates/session/shell) and the compositor,
# chrome or renderer paths they still reach.
[modules]

# Persistence reads launch keys from the launcher's process-wide table. This goes when
# the model records a window's launch key itself.
"src/shell/persist.rs" = [
    "crate::shell::launcher",
]

# The network bridge answers invitations with an overlay type. This goes when the overlay
# reads the bridge's events instead.
"src/shell/network.rs" = [
    "crate::shell::overlay_host",
]

# Peer presence measures tiles with vello's re-exported geometry types. This goes when
# it takes kurbo or its own rectangle type.
"src/shell/peer_presence.rs" = [
    "vello",
]

# Crates carved out of the shell. They must not reach the shell, the toolkit,
# the drawn desktop or a renderer through any workspace dependency.
[extracted]
crates = [
    "tilo-callstream",
    "tilo-frame-metrics",
    "tilo-liveness",
    "tilo-network-secret-agent",
    "tilo-polkit-agent",
    "tilo-relay-shell",
    "tilo-tray-host",
    "tilo-wayland-ext",
    "tilo-window-share",
]

# What an extracted crate may reach anyway, and why.
[extracted.allow]
"tilo-window-share" = { "smithay" = "A shared window's client dmabuf is staged for the encoder as smithay's buffer type, without a copy; it uses smithay with no features, only its allocator types, no renderer or backend" }
"tilo-wayland-ext" = { "smithay" = "It implements Wayland protocol handlers: smithay's wayland_server dispatch traits and surface data map are what a handler is written against; it uses only smithay's wayland frontend, no renderer or backend" }

# Workspace crates with a non-dev dependency on the shell, and why.
[shell_dependants]
"ux-bench" = "Runs declarative UX journeys against the native shell tree it builds in-process, so it links the shell as the thing it measures"

