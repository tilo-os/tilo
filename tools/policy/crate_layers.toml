# Crates whose use is a layer boundary, with the packages that may depend on
# them and why (tools/policy/check_crate_layers.py, docs/policies.md,
# "Architecture boundaries").
#
# A package not listed in a rule's `allow` may not depend on its crate; normal,
# build and dev dependencies all count, optional ones included. An allowance
# marked `tests` may declare the crate in its dev-dependencies only: a
# production edge is a finding. An allowance with `paths` may name the crate
# only in those directories of its package, each written from the package root
# and ending in "/". Every allowance says, in `why`, what the package does with
# the crate; a rule and its reasons change in review, like the code.

[[rule]]
crate = "tilo-cpu-raster"
reason = "it is the toolkit's CPU fallback renderer, and a UI draws through ui-core, which owns it"

  [[rule.allow]]
  package = "tilo-ui-base"
  why = "the toolkit's offscreen renderer rasterizes a surface's scene where no GPU can run vello's compute pipeline"

  [[rule.allow]]
  package = "tilo-ui"
  why = "the toolkit's own renderer rasterizes a surface's scene where no GPU can run vello's compute pipeline"

  [[rule.allow]]
  package = "tilo-ui-kms"
  why = "the toolkit's KMS host keeps one rasterizer across frames and copies only the damaged regions into dumb buffers, which ui-core's offscreen renderer does not expose"

[[rule]]
crate = "smithay"
reason = "it is the Wayland protocol and buffer stack, and everything else talks to the compositor through tilo-compositor's API"

  [[rule.allow]]
  package = "tilo-compositor"
  why = "the compositor is the one crate that speaks Wayland protocol and buffer types"


  [[rule.allow]]
  package = "tilo-wayland-ext"
  why = "it implements Wayland protocol handlers, written against smithay's wayland dispatch traits and surface data map, with no renderer or backend"

  [[rule.allow]]
  package = "tilo-app-keeper"
  why = "the app keeper is a Wayland server of its own for one app, written on smithay's protocol state with no renderer or backend; it reaches the compositor only as a Wayland client"

  [[rule.allow]]
  package = "tilo-window-share"
  why = "a shared window's client dmabuf is staged for the encoder as smithay's buffer type without a copy; it uses smithay's allocator types, no renderer or backend"

[[rule]]
crate = "tilo-peer-state"
reason = "it is the sync engine, and everyone else acts on the workspace through published actions, never by holding engine state"


  [[rule.allow]]
  package = "tilo-session"
  why = "the session is the person's local host and runs the engine beside the shell: it keeps each workspace's engine, takes in what a join brings here and publishes actions into it"

  [[rule.allow]]
  package = "tilo-session-client"
  why = "the member's client holds this device's own owner beside the shell: every workspace the person joined is a replica it opens, commits and enrolls into, and the governance its channels read is that owner's"

  [[rule.allow]]
  package = "tilo-runtime"
  why = "the shared runtime runs the engine for the apps attached to a member"

  [[rule.allow]]
  package = "tilo-broker-core"
  why = "the broker core declares the boundary a host's owner answers for its commits, so a broker and the host holding the owner name that owner in a signature; it holds no engine state and reads none"

  [[rule.allow]]
  package = "tilo-workspace-service"
  why = "the workspace host is the store node: it holds and serves a workspace's retained state"

  [[rule.allow]]
  package = "tilo-person-services"
  why = "a person's services run inside the store node's host: they read the workspace's accounts and vault documents and which devices are their person's from the peer the host holds"

  [[rule.allow]]
  package = "tilo-app-host"
  why = "the app host serves apps on the store node's workspaces: it opens their replicas and admits apps' writes into them"

  [[rule.allow]]
  package = "tilo-server"
  why = "the server embeds the workspace host and keeps workspaces for offline peers, the store node's network side"

  [[rule.allow]]
  package = "tilo-agent-session"
  why = "a member opens the document frame of the record it plans against, the framing every reader of a record's frames speaks"

  [[rule.allow]]
  package = "tilo-agent-session"
  why = "an agent's member names the engine's document-frame route — the address a frame names its place in a workspace's document by — and its join vocabulary; it holds no engine state and writes only through the actions it publishes"

  [[rule.allow]]
  package = "tilo-browser-runtime"
  why = "the browser runtime coalesces the engine's document-frame route for the app it mounts; the engine itself stays in the member's host"

  [[rule.allow]]
  package = "tilo-api"
  why = "a workspace one of the person's devices keeps is reached through that device's action service as a RemoteDevice provider, signed by the API key; it holds no engine state"

  [[rule.allow]]
  package = "tilo-vm"
  why = "a device's control actions are asked of that device's action service as a RemoteDevice provider, signed by this machine's login key; it holds no engine state"

  [[rule.allow]]
  package = "tilo-portal"
  why = "the desktop portal answers a device's permission questions from the grants a workspace keeps, naming the DeviceGrants a person's answer holds; it holds no engine state and acts only through published actions"

  [[rule.allow]]
  package = "tilo-daemon"
  tests = true
  why = "the daemon's tests are the person's other devices and their workspace's guests, each asking the daemon over the device link as a laptop does, signed by its own key; the client holds no workspace state and every change it writes is an action the daemon's host decides"

