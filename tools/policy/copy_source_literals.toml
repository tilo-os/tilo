# Copy a builder is handed that no catalogue has to say
# (check_copy_language.py, rule `uncatalogued`).
#
# A crate that ships a translation resolves everything a person reads through
# its catalogue, so a German window never mixes the two languages. Three kinds
# of text are exempt, each saying why here:
#
# * what an agent is told a tool does — the agent reads English, the person
#   never sees it;
# * a key's name as the keyboard prints it, spelled the same in every
#   language;
# * a label a performance harness paints, which no one reads.
#
# An entry that no longer matches anything fails the check.

