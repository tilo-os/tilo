# Tilo-native applications carry no reviewed callback or private-palette debt.
# The empty tables keep the zero-default rules explicit: adding an entry is a
# certification exception requiring architectural review.

[ratchets.raw_on_click_closure]

[ratchets.bespoke_command_entry]

[ratchets.private_palette_argument]

[ratchets.private_palette_outcome]

# Reviewed exceptions for legacy app-owned search callbacks. Removing one
# without lowering this table fails as stale; new callbacks fail at the zero
# default.
[ratchets.opaque_search_activation]

# The one resource/action/view model. Each count may only go down; the target
# for every table is empty.

[ratchets.app_action_host]
"apps/photos/src/resource.rs" = 2
"apps/settings/src/resource.rs" = 2

[ratchets.standalone_launch]
"apps/imager/src/main.rs" = 1
"apps/settings/src/main.rs" = 1

[ratchets.direct_document_api]

[ratchets.empty_action_vocabulary]

