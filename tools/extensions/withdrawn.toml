# Prebuilt system-extension payloads the feed must never offer again.
#
# A payload is immutable once published, so a bad one is taken out of the feed
# instead: sysext_image.py writes its part `unsupported`, with the reason below,
# and the next publication of that base's manifest replaces the offered entry.
# The payload file itself stays where it is; no device is told to fetch it.
#
# Every entry was read back from the published image: the root and /usr inodes
# carry no security.selinux extended attribute. Merged over /usr, such an image
# leaves /usr, /usr/lib and /usr/share unlabelled, which keeps every new login
# out and stops the next start in systemd-tmpfiles-setup.
schema = 1

