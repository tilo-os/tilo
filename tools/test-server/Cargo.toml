[package]
name = "test-server"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A host on this machine's loopback and fresh device keys for tests: no test reaches a relay or directory out on the internet, and two runs side by side are never one node"

# Test support only: depend on this from [dev-dependencies], never from a
# production dependency table.

[dependencies]
# The device daemon's keeping, which the loopback host runs. Its start on an endpoint of its own
# is `test-support`, which each test's dev-dependency on tilo-runtime turns on: a normal
# dependency turning it on would reach a shipping build's feature set.
tilo-runtime = { path = "../../crates/core/tilo-runtime" }
# The login a server daemon is signed in with, asked on its native endpoint.
tilo-actions = { path = "../../crates/core/actions" }
tilo-server-protocol = { path = "../../crates/core/tilo-server-protocol" }
tilo-action-policy = { path = "../../crates/core/action-policy" }
tilo-workspace-service = { path = "../../crates/core/tilo-workspace-service" }
tilo-endpoint-reachability = { path = "../../crates/core/endpoint-reachability" }
settings-store = { package = "tilo-settings-store", path = "../../crates/desktop/settings" }
tilo-workspace-join = { path = "../../crates/core/workspace-join" }
tilo-user-identity = { path = "../../crates/core/tilo-user-identity" }
tilo-clock = { path = "../../crates/platform/tilo-clock" }
# The identity a server daemon is started with, written where the daemon reads it.
tilo-device-identity = { path = "../../crates/core/tilo-device-identity" }
# The daemon binary the run built, and its start under the environment lock.
tilo-test-env = { path = "../test-env" }
# The daemon's own socket, reached at whatever path its profile lies at.
tilo-socket = { version = "0.1.0", path = "../../crates/platform/tilo-socket" }
serde_json.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tempfile.workspace = true
blake3.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true
iroh.workspace = true
# The QUIC address discovery service, and its self-signed certificate, as iroh-relay serves them.
iroh-relay = { version = "1.0.3", features = ["server", "test-utils"] }
tilo-net = { path = "../../crates/platform/tilo-net" }
# The tilolang apps a test's device installs, built from the tree's sources, and the signed
# runtimes they run on ([`apps`]): what the daemon tests' devices and the flows' server run apps
# with.
tilolang-cli = { path = "../../crates/lang/tilolang-cli", optional = true }
package-store = { package = "tilo-package-store", path = "../../crates/core/package-store", optional = true }
runtime-bundle = { package = "tilo-runtime-bundle", path = "../../crates/core/runtime-bundle", optional = true }
tilo-app-package = { path = "../../crates/core/tilo-app-package", optional = true }
launcher = { path = "../../crates/core/launcher", optional = true }
tilo-ui-base = { version = "0.1.0", path = "../../crates/ui/ui-base", default-features = false, optional = true }
tilo-paths = { workspace = true, optional = true }

[features]
# Install apps into a test's device ([`apps`]), and run them on the flows' server.
apps = [
    "dep:tilolang-cli",
    "dep:package-store",
    "dep:runtime-bundle",
    "dep:tilo-app-package",
    "dep:launcher",
    "dep:tilo-ui-base",
    "dep:tilo-paths",
]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }
