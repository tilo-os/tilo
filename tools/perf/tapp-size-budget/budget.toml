# Byte budgets for the signed .tapp of every app, per architecture, and the
# fleet ceilings over them. tools/perf/tapp_size_ratchet.py reads this file.
#
# - Release / apps fails when a tapp it has just packaged is over its app's
#   budget, which is the `bytes` below plus every raise under raises/.
# - Perf / scheduled fails when a published app is over its budget, or when
#   the median (p50), p90 or max of the apps in the registry is over its
#   fleet ceiling.
# - t's `changes` check fails when a budget grows without a raise file new in
#   the same change, and when the apps below are not exactly the default
#   collection (dist/apps/app-collections.toml).
#
# A budget is a measurement plus `headroom`, rounded up to 64 KiB. A commit
# that adds a few bytes passes, and real growth fails. Budgets only decrease.
# Intended growth adds raises/<change>.toml, one file per change, so
# concurrent changes never edit the same line. When an app shrinks, both
# gates print the lower budget to commit here. docs/measurements/app-package-size.md
# has the steps.
#
# The population is the default collection's apps. The runtime package
# (so.tilo.runtime, measured as the runtime's own KPI, #4000) and the
# runtime and provider stubs (so.tilo.runtime.chromium, so.tilo.runtime.signal,
# so.tilo.signal-provider, 5-39 KB each) are not apps, and counting them would
# pull the median down. so.tilo.image-editor is not counted: the registry still
# lists it, but its source left the repository in 85b967601d. The nightly
# names every package it leaves out.
headroom = 0.01
architectures = ["x86_64", "aarch64"]

# The "App package size" KPI targets, in decimal bytes. They may only be lowered.
[fleet]
p50 = 2000000
p90 = 4000000
max = 6000000

# Where the fleet does not meet a target yet, the nightly holds it to today's
# value plus headroom instead (registry sequence 805, 2026-10-09). An interim
# ceiling only decreases, and it is removed once the target holds; the nightly
# says when.
[fleet.interim.x86_64]
p50 = 2228224   # 2,150,400 (browser)
p90 = 4784128   # 4,696,576 (imager)
max = 6094848   # 6,015,488 (settings)

[fleet.interim.aarch64]
p90 = 4521984   # 4,447,232 (osk)

# Seeded from registry sequence 805 (2026-10-09). That registry state includes
# #3374 (OS dictation) and #3969 (the resource action cache), the two
# intended growth steps #3981 found. The exception is so.tilo.code-editor:
# the registry still served a tapp built at 0.1.76490, so its budget is the
# current source packaged by Release / apps runs 90043 (x86_64, 2,963,456 B)
# and 90066 (aarch64, 2,706,432 B).
#
# Lowered to what Release / apps 118009 (main at 28fe888fa3) packaged, for
# every app that came in under its budget by more than the ratchet's slack,
# with those apps dropped from their raise files. Agent and Discord fell
# furthest (x86_64 5,505,024 -> 1,179,648 and 5,963,776 -> 1,572,864 B).

[apps."so.tilo.agent"]
