# What each app below grew between the 2026-11-09 budgets (9ee2d3e1439) and
# the 2026-11-15 measurement: its binary's named code, split by crate in
# docs/measurements/app-package-size.md, and the surface.toml the tapp carries
# as data. Named code is what nm sees; a tapp is larger by its unwind tables,
# read-only data and the package format. The comment above each app names what
# grew in it.
reason = "Each amount is that app's overage at the 2026-11-15 measurement plus the ratchet's 1 % headroom, rounded up to 64 KiB, so an app a few kilobytes over still gets 64 KiB; t's app-sizes-x86_64 (run r1a9de479eb) measured the tapps. Browser, Calendar, Chat, Code Editor, Ebook, Mail, Notes and Tasks are not here: reading and writing the shared document codecs in the runtime took them below their raised budgets, so their budgets were lowered instead (9398258bffd)."
run = "r1a9de479eb"

