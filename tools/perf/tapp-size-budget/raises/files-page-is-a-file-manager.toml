# The Files page became a file manager of its own window type: a folder to show and the
# New folder and Upload effects (`FilesWindow`, `f05a15e59b0`), whose rows are declared types
# (`e80a669ff41`), and the desktop app also hosts that page's window, so this app compiles the
# framework for the type. Symbols builds of this tapp with `tools/perf/tapp_symbol_sizes.py`
# at `c2baf99c4bd` and at the commit before the cuts this change lands (1,757,876 -> 2,002,277
# bytes of named code) put 14 % of the growth in the app's own crates (27,692 in
# `file_explorer`, 5,544 in `file_explorer_model`, whose code the package also carries as a
# 50,023-byte `model.wasm`) and 86 % in code the toolkit instantiates for its types: the
# framework's `build_root` for the page's shell (9,275), its `Typed` (2,908), window bar
# (2,240), `BarActions` (1,666) and effect runner (1,551), the workspace resource it opens
# with (7,700), the effect vocabulary's specs (about 4,000), and the `alloc`, `core` and drop
# glue those bring (67,258). This change builds the parts that name no type once instead of
# once per type (an effect's spec and a declared row, a status with no parameter of its own,
# the window bar's parts, an opened resource's stored version): they are 11,262 bytes of this
# tapp's named symbols. A raise adds whole 64 KiB steps, so the cut does not lower the step
# this app needs; t's app-sizes-x86_64 run rea1410b424 measures the tapp at 3,425,792 bytes.
reason = "the Files page became a file manager of its own window type, so this app compiles the framework for that type, with its rows declared types; the row, spec, status and window-bar code that names no type now builds once"
run = "rea1410b424"

