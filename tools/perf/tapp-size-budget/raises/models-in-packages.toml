# What each app below gained since its budget: its package now carries the
# app's model module, the WebAssembly a device holding the workspace's keys
# applies its actions with (docs/architecture/apps.md). `t test app-models`
# builds the modules, and both packs write each app's into its payload as
# `model.wasm`, so the module's own bytes count against the app's budget. A
# module is 20 KB for Assistant to 460 KB for Calendar; the app binaries
# themselves grew about 40 KB each since the budgets were measured
# (Calendar's named code 1,605,089 to 1,594,816 bytes at ce691a3c2e, measured
# with tools/perf/tapp_symbol_sizes.py). Each amount is the app's overage at
# run rb55fae3ed4 plus the ratchet's 1 % headroom, rounded up to 64 KiB. Chat's
# module shrank from 509,894 bytes to 445,360 and the app now meets a lower
# budget, so it is no longer raised here. The aarch64 run prints its own numbers.
reason = "every app's package carries its model module now, the WebAssembly a device holding the workspace's keys applies its actions with, which adds 20 to 510 KB of the app's own model code to each tapp; the rest is the code the apps gained since the budgets were measured"
run = "rb55fae3ed4"

