# Calendar's model reads date-times with the date library, and no other app's
# model does. A schema check that several models reach used to read one too, so
# the library sat in the model runtime they all share; once that check was
# written out field by field (b9253788a30, for the pages that bind arguments),
# the model split left the library's parser and its date and time types in
# Calendar's own module: 124,888 bytes into Calendar's tapp and the same code
# out of the shared runtime, which was 2,431,613 bytes when measured. t's
# app-sizes-x86_64 (run r73f792e60a) measured Calendar's tapp at 3,361,792 bytes
# against 3,276,800, 84,992 over. Each amount is the overage plus the ratchet's
# 1 % headroom, rounded up to 64 KiB: two steps, the ratchet's quantum. A module
# is the same bytes on every architecture, so aarch64 carries the same growth;
# its first run prints what to raise it to.
reason = "the date library belongs to Calendar alone, so its bytes moved out of the shared model runtime into Calendar's module"
run = "r73f792e60a"

[apps."so.tilo.calendar"]
x86_64 = 131072
