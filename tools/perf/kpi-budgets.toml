# Budgets and comparison settings per KPI, read by tools/perf/compare.py.
#
# [defaults] are the KPIs' regression rule: fail on
# a p50 more than 10 % or a p99 more than 20 % above the median of the last
# five comparable runs, sustained over two runs.
#
# [kpi."<id>"] entries:
#   unit                     the record's unit; a mismatch fails
#   p50, p95, p99, max       ceilings on that percentile of the record
#   enforce                  true: a ceiling miss fails the run at once;
#                            false (default): it is reported as a target not
#                            yet met (marketing targets that are not true yet)
#   p50_tolerance, p99_tolerance, baseline_runs, baseline_min_runs, min_delta
#                            override [defaults]; min_delta is the absolute
#                            change (in the unit) below which a ratio never
#                            counts as a regression; baseline_min_runs is how
#                            many stored runs a baseline needs before a run is
#                            compared with it (an accepted run counts at once)
#   source                   where the number comes from
#
# A budgeted KPI whose group ran but produced no record fails the run as
# `missing`, so list every KPI a benchmark is expected to report.
#
# [lanes.<workflow>] say which workflow produces which KPIs, so a run is owed
# only its own: compare.py --lane names the run's workflow. `groups` are the
# KPI id prefixes the workflow produces, each in exactly one lane; `kpis`
# claims single KPIs whose prefix is another lane's group. Every budgeted KPI
# needs exactly one lane, or the budgets do not load; tools/perf/test_compare.py
# holds each workflow's selectable groups equal to its lane.

[defaults]
p50_tolerance = 1.10
p99_tolerance = 1.20
baseline_runs = 5
baseline_min_runs = 1
min_delta = 0.0

# Perf / scheduled (.forgejo/workflows/perf-scheduled.yml): one job per group,
# selected by its `kpis` input; its `compare` job runs with the default lane.
[lanes.perf-scheduled]
groups = ["fs", "footprint", "agent", "latency", "render", "wakeups", "search", "hosting", "browser", "stream"]

# Dev / VM acceptance (.forgejo/workflows/vm-acceptance.yml): the installed
# desktop in a KVM guest. Its R04 measures compositor CPU per painted frame on
# that desktop, a render KPI the headless render benches cannot produce.
[lanes.vm-acceptance]
groups = ["boot", "session", "idle", "memory", "disk", "app"]
kpis = ["render.frame_cpu_ms"]

# The reference machines' weekly run (scripts/perf/device_latency_bench.py,
# docs/benchmarks/reference-hardware.md), compared read-only.
[lanes.reference-hardware]
groups = ["hw"]

# tilo-fs latency benchmarks (crates/system/fs/tests/performance_timing.rs), a
# debug build on the shared `runner` class. The ceilings are the gate's own
# SLO constants (tools/perf/test_adapters.py keeps them equal): twice the p99
# of 56 CI runs, derived beside the constants; change both together.
# Tolerances are wider than the default because single runs
# of this gate on the shared runner have spread up to 1.8x between nights
# (KPI inventory: run 85201 against the maximum of eight runs); five
# repetitions per night and a two-run rule absorb the rest.

