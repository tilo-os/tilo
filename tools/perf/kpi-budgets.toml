# Latency, compositor side (scripts/perf/latency_bench.py): a headless dev
# build on the shared `runner` class, input through the control socket,
# lavapipe. The ceilings are the KPI document's 60 Hz targets ("Input→photon
# latency": p50 <= 1 refresh + 8 ms, p99 <= 2 refreshes + 8 ms; "Workspace
# switch": first frame <= 1 refresh, no dropped frame, <= 300 ms in all).
# This lane has no panel, so they are reported, never enforced; the relative
# rule catches regressions of the compositor's own work. A dropped-frame count
# whose baseline is zero has no ratio, so one frame either way is not a change.
# Timing KPIs need three stored runs before comparison: pointer p99 has ranged
# from 7 to 13 ms between nights on identical code (TIL-700). Dropped frames
# keep the one-run comparison: with a three-run minimum, elevated `new` runs
# enter the baseline and can hide sustained growth from zero. Its two-run
# regression rule still distinguishes a single noisy night.

[kpi."latency.input_to_frame.pointer"]
unit = "ms"
p50 = 24.7
p99 = 41.3
baseline_min_runs = 3
source = "KPI document: Input→photon latency (compositor side, headless)"

[kpi."latency.workspace_switch.first_frame"]
unit = "ms"
p99 = 16.7
baseline_min_runs = 3
source = "KPI document: Workspace switch, first frame (compositor side, headless)"

[kpi."latency.workspace_switch.settled"]
unit = "ms"
max = 300.0
baseline_min_runs = 3
source = "KPI document: Workspace switch, total (compositor side, headless)"

[kpi."latency.workspace_switch.dropped_frames"]
unit = "count"
max = 0.0
min_delta = 1.0
baseline_min_runs = 1
source = "KPI document: Workspace switch, dropped frames (compositor side, headless)"

# Idle wakeups (crates/session/shell/tests/idle_wakeups.rs, TIL-614): a
# headless dev build on the shared `runner` class with a signed-in desktop,
# a restored Notes tab and a Terminal, left alone and sampled from /proc over
# 60 s; context switches per second of every thread of the compositor's
# process tree, of the compositor process alone, and its frame loop's
# iterations. The installed desktop's counterpart is Dev / VM acceptance's
# `idle.*` (TIL-589). The ceilings are the KPI target (an idle desktop <= 5
# wakeups/s); reported, not enforced: the pull-request gate's budgets fail a
# regression, and are lowered there as each idle fix lands.
#
# A count of timers moves little with the runner, so the default tolerances
# hold (TIL-696 removed the frame-loop spin that once made these bimodal,
# docs/benchmarks/idle-wakeups-2026-10-09.md). The floor keeps a single
# extra timer tick from reading as a percentage regression.

[kpi."wakeups.headless_two_apps"]
unit = "per_s"
max = 5.0
min_delta = 1.0
source = "KPI document: idle desktop <= 5 wakeups/s (headless share)"

[kpi."wakeups.headless_two_apps.shell"]
unit = "per_s"
max = 5.0
min_delta = 1.0
source = "KPI document: idle desktop <= 5 wakeups/s (compositor process)"

# The compositor's frame loop parks while nothing asks for a frame, so an
