# Files search's name index under file changes (the shell unit test
# a_watched_change_costs_one_record_not_a_rebuild, through adapters.py
# files-name-index): process CPU in a debug lib-test build on the shared
# `runner` class, with an index of 50,000 names (the walk's MAX_ENTRIES).
# A watched change upserts or removes its own records and commits
# incrementally; before, every change rebuilt the whole index, which
# `rebuild_cpu_ms` still measures (a walk or rescan builds it so).
# Measured in two Dev / focused test runs of the test at 50,000 names
# (Oct 2026, 14 change samples): change 8.6-34.4 ms, unchanged 0.02-0.26 ms,
# rename 10.1-36.0 ms, 64-file burst 19.9-28.7 ms, whole build 4,053-4,544 ms.
# Enforced ceilings are about twice the measured maximum, as the tilo-fs
# gate's are; a regression to whole rebuilds lands two orders above them.
# The build's ceiling is twice its maximum too, reported only.
# Since each index keeps one writer and builds a commit's segment to its
# batch's size (tilo-search), Perf / scheduled mode ab, 8 rounds on one
# runner against the writer-per-commit base (Oct 2026): change 4.8-19.2 ms
# (the first change of a run opens the writer; 4.8-7.5 ms after it; base
