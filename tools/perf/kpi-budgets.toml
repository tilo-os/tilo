# Relay hosting cost (TIL-592): crates/hosting/tilo-relay/examples/relay_load,
# 100 collaborators in rooms of four, ten measured minutes, one sample per
# minute; tools/perf/adapters.py hosting-load prices them with
# tools/perf/prices.toml. The KPI document's target is at most $0.001 per
# active collaborator-hour.
#
# The enforced ceilings are about twice the first measurement (Perf /
# scheduled run 90022 on `runner`): CPU 31.2 s, RSS 0.86 MiB, fan-out p50 13.8
# and p99 244 ms. Bytes are nearly deterministic (egress 11.04 MB, frames
# 9.50 MB, max within 0.5 % of p50), so their ceilings sit about 15 % above:
# a delta resent whole or a presence storm fails at once. CPU and latency
# share the runner and get the fs gate's wider tolerances.

