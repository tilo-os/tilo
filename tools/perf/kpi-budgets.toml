# The kernel's memory init: the silence in the kernel log that ends at SLUB's first line,
# while the boot CPU alone hands every free page to the page allocator. With the
# init_on_free=1 karg it also zeroed all of RAM there (6.0 s of a 7.8 s kernel phase in a
# 4.5 GiB guest), which is why that karg is not in 01-hardening.toml. Without it the pass
# only links pages into the free lists; the ceiling is reported, not enforced, and the
# regression rule flags zeroing coming back while min_delta keeps scheduler noise out.
[kpi."boot.kernel_meminit_s"]
