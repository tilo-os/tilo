# footprint group. One sample per night: compressed layer bytes (a full pull)
# and unique content (what composefs stores after install; /sysroot, which
# bootc does not deploy, is left out). Byte counts are deterministic, so one
# stored run is a baseline, and growth of more than 5 % over the baseline
# fails on the second night running; an intended growth is accepted by
# dispatch (`accept`). The ceilings are enforced, set at 5 % over the image
# TIL-609 measured (docs/benchmarks/os-image-size-2026-10-09.md) and lowered by
