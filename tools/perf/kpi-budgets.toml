# One idle anti-entropy pass between two in-sync writers over a 50,000-change
# namespace (TIL-584): independent of history, since a pass resumes from the
# heads the last one agreed on.
[kpi."fs.idle-namespace-pass-resumed-50k"]
unit = "ms"
max = 5.0
enforce = true
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 1.0
source = "IDLE_SYNC_SLO"

# App package size: bytes of the newest signed tapp per app in the public
# registry index. Targets from the KPI document (median <= 2 MB, max <= 6 MB,
# decimal megabytes); reported, not enforced, until TIL-590's per-app ratchet
# owns the gate. The default relative rule already fails sustained growth.

[kpi."footprint.tapp.bytes.x86_64"]
unit = "bytes"
p50 = 2000000.0
max = 6000000.0
source = "KPI document: App package size"

[kpi."footprint.tapp.bytes.aarch64"]
unit = "bytes"
p50 = 2000000.0
max = 6000000.0
source = "KPI document: App package size"

# Agent round trip (scripts/perf/agent_rtt.py): one headless compositor on
# the shared `runner` class, a release build with `dev-overrides` and thin
# LTO, timed from the client's side of the control socket. Targets from the
# KPI document ("actions invoke round trip, local", "MCP tool call");
# reported, not enforced, until three nightly records exist (TIL-585).
#
# Tolerances are measured. Two runs of the same code, 35 minutes apart on
# `runner` (Perf / scheduled 87525 and 87819), spread by p50 x1.12 (no-op)
# to x1.89 (state dump, +0.26 ms) and x1.75 (throughput), and by p99 up to
# x1.85. The default 10 %/20 % rule would call that a regression most
# nights, so the group takes the fs gate's 1.5/2.0 and an absolute floor
# above the observed jitter. A 5 ms authorize cost (run 87820, the TIL-333
# shape) still moves the no-op p50 from 0.54-0.61 ms to 7.26 ms, the list
# p50 from 1.9-2.6 ms to 8.9 ms and throughput from 328-575 us to 6,757 us
# per call: far past both.

[kpi."agent.list.local"]
unit = "ms"
p99 = 10.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 1.0
source = "KPI document: actions list p99 <= 10 ms"

# The KPI document names no state-dump target; it is held to the list's.
[kpi."agent.state_dump.local"]
unit = "ms"
p99 = 10.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 0.5
source = "provisional: the actions list target"

[kpi."agent.invoke.local.noop.accept"]
unit = "ms"
p50 = 1.0
p99 = 5.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 0.5
source = "KPI document: no-op invoke p50 <= 1 ms, p99 <= 5 ms"

[kpi."agent.invoke.local.noop"]
unit = "ms"
p50 = 1.0
p99 = 5.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 0.5
source = "KPI document: no-op invoke p50 <= 1 ms, p99 <= 5 ms"

# Microseconds per completed no-op with eight clients at once, one sample
# per second. A desktop that answers one client in 1 ms must at least keep
# that rate under load.
[kpi."agent.invoke.local.throughput"]
unit = "us"
p50 = 1000.0
p50_tolerance = 2.0
p99_tolerance = 2.5
min_delta = 300.0
source = "provisional: derived from the no-op p50 target"

[kpi."agent.invoke.mcp.noop"]
unit = "ms"
p50 = 3.0
p99 = 7.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 0.5
source = "KPI document: MCP tool call <= local invoke + 2 ms"

# Latency, compositor side (scripts/perf/latency_bench.py): a headless dev
# build on the shared `runner` class, input through the control socket,
# lavapipe. The ceilings are the KPI document's 60 Hz targets ("Input→photon
# latency": p50 <= 1 refresh + 8 ms, p99 <= 2 refreshes + 8 ms; "Workspace
# switch": first frame <= 1 refresh, no dropped frame, <= 300 ms in all).
# This lane has no panel, so they are reported, never enforced; the relative
# rule catches regressions of the compositor's own work. A dropped-frame count
# whose baseline is zero has no ratio, so one frame either way is not a change.

[kpi."latency.input_to_frame.pointer"]
unit = "ms"
p50 = 24.7
p99 = 41.3
source = "KPI document: Input→photon latency (compositor side, headless)"

[kpi."latency.workspace_switch.first_frame"]
unit = "ms"
p99 = 16.7
source = "KPI document: Workspace switch, first frame (compositor side, headless)"

[kpi."latency.workspace_switch.settled"]
unit = "ms"
max = 300.0
source = "KPI document: Workspace switch, total (compositor side, headless)"

[kpi."latency.workspace_switch.dropped_frames"]
unit = "count"
max = 0.0
min_delta = 1.0
source = "KPI document: Workspace switch, dropped frames (compositor side, headless)"

