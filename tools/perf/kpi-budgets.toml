max = 4520000000.0
enforce = true
p50_tolerance = 1.05
p99_tolerance = 1.05
source = "TIL-609: 5,168,289,107 B with the font and botocore fixes, plus 5 %; TIL-733: -366,607,328 B (one package layer, no second initramfs); TIL-736: -40,963,819 B (identical files hard-linked); TIL-735: -44,785,493 B (env-runtime from host files); TIL-747: -456,868,541 B (content-based layers); KPI target 3.5 GB"

