# OS image size: main's newest production-layout image (the tilo-ci
# base tilo-vm:main-ci names), measured by tools/perf/image_size.py in the
# footprint group. One sample per night: compressed layer bytes (a full pull)
# and unique content (what composefs stores after install; /sysroot, which
# bootc does not deploy, is left out). Byte counts are deterministic, so one
# stored run is a baseline, and growth of more than 5 % over the baseline
# fails on the second night running; an intended growth is accepted by
# dispatch (`accept`). The ceilings are enforced, set at 5 % over the image
# #4003 measured (docs/benchmarks/os-image-size-2026-10-09.md) and lowered by
# what each later change saved (#4055, #4064, #4072: docs/benchmarks/os-image-size-2026-10-10.md;
# #4190, content-based layers: docs/benchmarks/os-image-size-2026-10-10-rechunk.md),
# so creep below the nightly rule fails too. They may only be lowered, except
# by a change that says why. The KPI targets, 3.5 GB compressed and 7 GB of content for x86_64,
# are not met yet: Windows compatibility is most of the gap.
# footprint.image.redundant_payload_bytes.<arch> (bytes shipped more than
# once) is recorded beside them, under the relative rule only.

[kpi."footprint.image.compressed_bytes.x86_64"]
unit = "bytes"
max = 4520000000.0
enforce = true
p50_tolerance = 1.05
p99_tolerance = 1.05
source = "#4003: 5,168,289,107 B with the font and botocore fixes, plus 5 %; #4055: -366,607,328 B (one package layer, no second initramfs); #4064: -40,963,819 B (identical files hard-linked); #4072: -44,785,493 B (env-runtime from host files); #4190: -456,868,541 B (content-based layers); KPI target 3.5 GB"

[kpi."footprint.image.unique_content_bytes.x86_64"]
