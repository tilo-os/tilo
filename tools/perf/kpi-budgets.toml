# ms in order, 105 ms pipelined and 1.7 idle round trips per step. `idle` is
# the host round trips per step that brought no news while a step ran (the
# plan in order). Reported, not enforced, until three nightly records exist.
[kpi."agent.task.native.pipelined.wall"]
unit = "ms"
p50 = 150.0
p99 = 200.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 20.0
source = "floor: one 100 ms step, plus 50 ms of the agent loop's own"

[kpi."agent.task.native.sequential.wall"]
unit = "ms"
p50 = 360.0
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 20.0
source = "three 100 ms steps in order, each noticed one round trip after it settles"

[kpi."agent.task.native.idle_round_trips"]
unit = "count"
p50 = 2.5
p50_tolerance = 1.5
p99_tolerance = 2.0
min_delta = 0.5
