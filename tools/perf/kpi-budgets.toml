max = 11356000000.0
enforce = true
p50_tolerance = 1.05
p99_tolerance = 1.05
source = "#4003: 10,909,686,891 B with the font and botocore fixes, plus 5 %; #4055: -103,299,459 B; KPI target 7 GB"

[kpi."footprint.image.compressed_bytes.aarch64"]
unit = "bytes"
max = 3727000000.0
enforce = true
p50_tolerance = 1.05
p99_tolerance = 1.05
source = "#4003: 4,304,306,967 B on db91126b44, plus 5 %; #4055: -363,422,293 B; #4190: -428,950,281 B (content-based layers)"

[kpi."footprint.image.unique_content_bytes.aarch64"]
