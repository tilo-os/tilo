# Browser runtime (scripts/perf/browser_qualification.mjs): the release
# desktop bundle (build.sh --bundle desktop, the bytes t's image-web-entry
# publishes) in headless Chrome for Testing on the shared `runner` class, one
# fresh-context round at 960x540. The runner has no GPU, and Chrome offers
# WebGPU no CPU driver but its own SwiftShader (it renders its page on
# lavapipe, but its WebGPU adapter stays SwiftShader). So these records are
# compared only with each other and never quoted as hardware figures, and the
# ceilings are reported, never enforced; the relative rule catches regressions
# of the runtime's own work. They time the page's side of each step (a frame
# presented is a frame submitted). SwiftShader takes tens of seconds for a
# panned FHD frame on this runner and queues its work behind the page (a first
# FHD round took 20 minutes, a second never finished in two hours), hence one
# small round. The demo workload is left out (--demo-seconds 0), so its frame
# rate and the 30 and 120 fps goals are judged where a GPU draws (a hardware qualification: --renderer gpu --enforce-goals,
# docs/measurements/performance.md). The ceilings are the runtime's goals: a
# window activated within 50 ms and first opened within 250 ms
# (crates/browser/tilo-web-desktop/scripts/open-times.mjs), its own code
# drawing within a second (the limit of an uninterrupted flow of thought); the
# desktop's first frame within 2.5 s of navigation (the web's "good" Largest
# Contentful Paint), which SwiftShader's pipeline compiles alone exceed; an
# idle desktop presenting at most two frames a second (idle.mjs). Timing KPIs
# need three stored runs before comparison, as the latency group's do:
# wall-clock on the shared runner varies between nights on identical code.

[kpi."browser.load.desktop_presented"]
unit = "ms"
p99 = 2500.0
baseline_min_runs = 3
source = "navigation to the desktop's first presented frame, fresh browser context (headless, SwiftShader)"

[kpi."browser.open.first_frame"]
unit = "ms"
p99 = 250.0
baseline_min_runs = 3
source = "launch command to the first frame presenting the new window, first open (headless, SwiftShader)"

[kpi."browser.open.ready"]
unit = "ms"
p99 = 1000.0
baseline_min_runs = 3
source = "launch command to the first frame after the app's own code (its split-off module) is instantiated, first open (headless, SwiftShader)"

[kpi."browser.activate.first_frame"]
unit = "ms"
p99 = 50.0
baseline_min_runs = 3
source = "select command to the first frame with the window active (headless, SwiftShader)"

[kpi."browser.idle.presented_per_s"]
unit = "per_s"
max = 2.0
min_delta = 0.5
baseline_min_runs = 1
source = "frames an idle desktop of the demo windows presents per second (headless, SwiftShader)"

# A native window on the browser desktop
# (scripts/perf/native_stream_qualification.mjs): a session's legacy window,
# encoded by the production real-time encoder with the shell's legacy-share
# configuration, through `tilo-relay dev`'s legacy-window bridge and live
# plane, decoded with WebCodecs and drawn by the release desktop bundle in
# headless Chrome for Testing on the shared `runner` class. The runner has no
# GPU: the session encodes in software (30 fps, the shell's software ceiling),
# Chrome decodes in software, and the desktop under the window draws on
# SwiftShader. So these records are compared only with each other and never
# quoted as hardware figures; a hardware encoder (60 fps), a hardware decoder
# and a GPU desktop are a hardware qualification's (--renderer gpu
# --enforce-goals, docs/measurements/performance.md). Every run is first
# judged correct (no decoder error, no corrupt, misnamed or older picture, the
# last frame shown, every press delivered) or it records nothing. SwiftShader
# compiles the window tile's pipelines when the desktop first draws it, which
# blocks the page for about 25 s on this runner: startup includes that, and
# the frame KPIs are timed after a 30 s warm-up (--warm-up 30). The
# ceilings are the harness's goals: the window's first picture within a second
# of the session starting its stream (an uninterrupted flow of thought), a
# frame on screen within 100 ms of its capture at p95, under 1 % of the frames
# sent after the first picture never drawn, a click reaching the session
# within 50 ms at p95 (it travels HTTPS, the host and the session's relay
# connection, all on loopback here), and pictures arriving at the session's
# software rate. Timing KPIs need three stored runs before comparison, as the
# browser group's do.

[kpi."stream.startup.first_picture"]
unit = "ms"
max = 1000.0
baseline_min_runs = 3
source = "the session starting its stream to the window's first picture on the desktop (software encode and decode, SwiftShader desktop)"

[kpi."stream.frame.latency"]
unit = "ms"
p95 = 100.0
baseline_min_runs = 3
source = "a frame's capture at the session to its picture drawn by the page, per frame (software encode and decode)"

[kpi."stream.frame.interval"]
unit = "ms"
p50 = 34.0
min_delta = 2.0
baseline_min_runs = 3
source = "between consecutive new pictures the page draws while the window repaints at 30 fps (software encode and decode)"

[kpi."stream.encode.frame"]
unit = "ms"
p95 = 33.3
baseline_min_runs = 3
source = "the production real-time encoder's time per 1280x720 frame, the shell's legacy-share configuration (software)"

[kpi."stream.input.latency"]
unit = "ms"
p95 = 50.0
baseline_min_runs = 3
source = "a click on the window in the page to the press arriving at the session, through the host's input route"

[kpi."stream.frame.missed"]
unit = "percent"
max = 1.0
min_delta = 0.5
baseline_min_runs = 1
source = "frames sent after the first picture that the page never drew"

# The same window streamed in software VP9 (--codec vp9, vp9enc): what a
# session with no H.264 encoder sends, a stock device being the normal case,
# and what every browser decodes. Everything else is the H.264 records' (same
# build, same Chrome, same job, after the H.264 run), and the series is its
# own so neither codec's baseline judges the other's. The ceilings come from
# the first run on this runner (October 2026: startup 8974 ms,
# latency p95 27.8 ms, interval p50 33.4 ms, encode p95 13.8 ms, input p95
# 40.3 ms, nothing missed) with headroom for the shared runner, not from
# H.264's goals: they are SwiftShader and software-codec figures, never a
# product or hardware figure. Startup is far over the 1 s goal on this runner
# for both codecs (H.264's first picture took 4248 ms in the same run), so its
# ceiling is the run's with headroom, not the goal; encode stays under the 33.3 ms a
# 30 fps frame allows, as H.264's does; a frame is still one 30 fps interval
# apart; frames missed is a delivery ceiling, as H.264's is.

[kpi."stream.vp9.startup.first_picture"]
unit = "ms"
max = 13500.0
baseline_min_runs = 3
source = "the session starting its VP9 stream to the window's first picture on the desktop (software encode and decode, SwiftShader desktop)"

[kpi."stream.vp9.frame.latency"]
