# Budgets for the shared app runtime, libruntime_dylib.so, per architecture.
# tools/perf/runtime_size_ratchet.py reads this file (TIL-604).
#
# - Release / apps fails when the dylib it has just built is over a budget
#   below plus every raise under raises/.
# - Perf / scheduled (footprint group) fails when the newest published
#   so.tilo.runtime is over one, and records the four numbers as
#   footprint.runtime.<metric>.<arch>.
# - CI / fast quality fails when a budget grows without a raise file new in
#   the same change.
#
# The metrics, all read from the ELF file:
#   bytes               the file a device downloads when an app's runtime is missing
#   relocation_bytes    dynamic relocation tables the loader reads at every app start
#   relocated_bytes     distinct 4 KiB pages those relocations write: private,
#                       dirty memory in every app process before main
#   symbol_relocations  relocations that need a symbol lookup at every app start
#
# A budget is a measurement plus `headroom`, rounded up to 64 KiB (a count to
# 64). Budgets only decrease. Intended growth adds raises/<change>.toml, one
# file per change; when the runtime shrinks, both gates print the lower budget
# to commit here. DEVELOPMENT.md ("Runtime size") has the steps.
headroom = 0.01
architectures = ["x86_64", "aarch64"]

# Apps that play no media. Release / apps fails when a built one, or the
# runtime itself, loads a library of needed_absent at exec (TIL-713). Only
# grows.
apps_without_media = ["calculator", "clocks", "notes", "totp", "weather"]

# What the runtime should cost (TIL-604): at most 150 MB, relocation tables
# under 1 MB, at most 4 MB of relocation-dirtied memory per app process, and
# few enough symbol lookups for relocation to take under 3 ms. Every app loads
# a DT_NEEDED library, so none of needed_absent belongs there: media libraries
# are for the apps that play media, and the runtime loads them on first use
# (tools/ci/runtime-dylib-lazy-link.py, TIL-713); the gates fail on one. The
# other targets are reported when not met; the budgets below are what fails.
# Targets only tighten.
[targets]
bytes = 150000000
relocation_bytes = 1000000
relocated_bytes = 4000000
symbol_relocations = 5000
needed_absent = ["libgst", "libglib-2.0", "libgobject-2.0", "libgio-2.0"]

# Measured by Release / apps 90216 (x86_64) and 90299 (aarch64) with packed
# relocations and -Bsymbolic-functions (TIL-604). The published runtime before
# them (so.tilo.runtime 0.1.90033) was 241944696 / 223411008 bytes, with
# 10.1 MB of relocation tables and 62k symbol relocations on each. Symbol
# relocations then fell with GLib and GStreamer loaded on first use (TIL-713,
# Release / apps 90457 against 90458): 13558 -> 11970 (x86_64) and
# 13571 -> 11983 (aarch64).
[runtime.x86_64]
bytes = 234618880
relocation_bytes = 458752
relocated_bytes = 7798784
symbol_relocations = 12096

[runtime.aarch64]
bytes = 215089152
relocation_bytes = 458752
relocated_bytes = 7471104
symbol_relocations = 12160
