# Budgets for the shared app runtime, libruntime_dylib.so, per architecture.
# tools/perf/runtime_size_ratchet.py reads this file.
#
# - the app release fails when the dylib it has just built is over a budget
#   below plus every raise under raises/.
# - t's perf-footprint (the performance run) fails when the newest published
#   so.tilo.runtime is over one, and records the four numbers as
#   footprint.runtime.<metric>.<arch>.
# - t's `changes` check fails when a budget grows without a raise file new in
#   the same change.
#
# The metrics, all read from the ELF file:
#   bytes               the file a device downloads when an app's runtime is missing
#   relocation_bytes    dynamic relocation tables the loader reads at every app start
#   relocated_bytes     distinct 4 KiB pages those relocations write: private,
#                       dirty memory in every app process before main
#   symbol_relocations  relocations that need a symbol lookup at every app start
#
# A budget is a measurement plus `headroom`, rounded up to 64 KiB (a count to
# 64). Budgets only decrease. Intended growth adds raises/<change>.toml, one
# file per change; when the runtime shrinks, both checks print the lower budget
# to commit here. docs/measurements/runtime-size.md has the steps.
headroom = 0.01
architectures = ["x86_64", "aarch64"]

# Apps that play no media. the app release fails when a built one, or the
# runtime itself, loads a library of needed_absent at exec. Only
# grows.
apps_without_media = ["clocks", "notes", "totp", "weather"]

# What the runtime should cost: at most 150 MB, relocation tables
# under 1 MB, at most 4 MB of relocation-dirtied memory per app process, and
# few enough symbol lookups for relocation to take under 3 ms. Every app loads
# a DT_NEEDED library, so none of needed_absent belongs there: media libraries
# are for the apps that play media, and the runtime loads them on first use
# (tools/ci/runtime-dylib-lazy-link.py, #4020); the checks fail on one. The
# other targets are reported when not met; the budgets below are what fails.
# Targets only tighten.
[targets]
bytes = 150000000
relocation_bytes = 1000000
relocated_bytes = 4000000
symbol_relocations = 5000
needed_absent = ["libgst", "libglib-2.0", "libgobject-2.0", "libgio-2.0"]

# Measured by the app release 90216 (x86_64) and 90299 (aarch64) with packed
# relocations and -Bsymbolic-functions. The published runtime before
# them (so.tilo.runtime 0.1.90033) was 241944696 / 223411008 bytes, with
# 10.1 MB of relocation tables and 62k symbol relocations on each. Symbol
# relocations then fell with GLib and GStreamer loaded on first use (#4020,
# the app release 90457 against 90458): 13558 -> 11970 (x86_64) and
# 13571 -> 11983 (aarch64). #4009 then took the OS internals out
# (filesystem, launcher, app host, install CLI, peer transport), measured
# before #4020 landed: x86_64 232303952 -> 204813024 bytes and 7663616 ->
# 6873088 bytes of relocation-dirtied memory per app process (the app release
# 90662 against 90776); aarch64 213053464 -> 188160992 bytes and 7380992 ->
# 6615040 (90371 against 90511). Both together, the app release 90940:
# 204606408 / 188035240 bytes, 6868992 / 6598656 bytes dirtied per process,
# 10049 / 10076 symbol relocations. Typst (62 crates and typst-assets' font
# table) then moved into its own engine library beside the runtime,
# libtilo_typst_engine.so, which only Typst Editor loads: aarch64
# 188908456 -> 155133008 bytes, 6639616 -> 5722112 bytes dirtied per process
# (the app release 94959 against 94951); x86_64 205836952 -> 170549744 bytes,
# 6897664 -> 5955584 (same runs). Spotify playback (librespot, its
# decoders and protobuf stack: 43 crates) then moved into
# libtilo_spotify_engine.so, which only Music loads (the app release 98251
# against 98250): x86_64 170118536 -> 158774624 bytes, 5931008 -> 5533696
# bytes dirtied per process, 9196 -> 8773 symbol relocations; aarch64
# 154733808 -> 143671024, 5709824 -> 5308416, 9219 -> 8793. Linking the
# runtime with section garbage collection and without the proc-macro crates'
# exports takes it lower again (the app release 97422, before the Spotify
# engine: aarch64 152438520 bytes, x86_64 167700968). Keeping the model
# gateway's daemon (its provider clients, on-device model service and rten)
# out of the runtime, then the main commits after it, left main's runtime at
# x86_64 156364744 bytes, 5435392 dirtied per process, 6625 symbol
# relocations; aarch64 141824904, 5218304, 6659 (the app release 119198, at
# 1067088ee0). Canvas's painting engines (libtilo_paint_engine.so) and the
# YouTube client of Music and Tube (libtilo_youtube_engine.so, rustypipe with
# QuickJS) then moved into engine libraries, 18 crates (the app release
# 119558): x86_64 151648352 bytes, 5152768 dirtied per process, 6439 symbol
# relocations; aarch64 137517640, 4935680, 6470. The two engines are
# 900880 + 2789552 bytes on x86_64 and 760616 + 2600216 on aarch64.
# Moving account credentials, the contact directory and the time-zone database
# into their own engines leaves 148084128 / 134312888 bytes in the runtime,
# with 4100096 / 3887104 bytes dirtied per process (x86_64 / aarch64).
# Native app-build checks also exercise the engine probes and loader traces;
# the budgets below adopt their suggested one-percent headroom.
#
# [engines.<arch>] budgets each engine library's file (crates/engines/loadable/)
# by name, with the same headroom, rounding and raise files
# ([engines.<arch>] "lib<name>.so" = <bytes> in a raise). the app release and
# t's runtime-size check fail when an engine is over its budget or has none.
# libtilo_typst_engine.so (34064744 bytes), libtilo_chip_engine.so (1203008),
# libtilo_camera_engine.so (1207944) and libtilo_diffmerge_engine.so (344200)
# were measured at their introduction on x86_64. The chip, camera and diffmerge
# aarch64 numbers are the x86_64 budgets, and Typst's is its earlier library's,
# until the first aarch64 run prints what to lower them to.

# The apps of apps_without_media that use an engine library
# (crates/engines/loadable/), by library: they load it at exec. the app release
# fails when one of those apps loads any other engine.
[engine_users]

[runtime.x86_64]
bytes = 149618688
relocation_bytes = 131072
relocated_bytes = 4194304
symbol_relocations = 1472

[runtime.aarch64]
bytes = 135659520
relocation_bytes = 262144
relocated_bytes = 3932160
symbol_relocations = 6592

# Measured at 38a33e80d7f plus the engines' link through
# runtime-dylib-lazy-link.py, which made Settings' engine export only its
# entry points: libtilo_settings_engine.so 16251144 -> 10105200 bytes on
# x86_64, the ad-block engine 2112792 -> 210328.
# The two engines that hold what Sheets' formulas and the agent's web tools
# used to carry in their own tapps, measured at rb4387cd6ce (x86_64). The
# aarch64 numbers are that measurement: the first aarch64 run prints what to
# lower them to. The theme painter interpreter's engine (wasmi) was measured
# by t's app-sizes-x86_64 run 1bcf1340bd; its aarch64 number is the x86_64 one
# until the first aarch64 run prints what to lower it to.
# The model runtime the bundle carries (lib/app-model-runtime): the WebAssembly
# every app's model module links against, which tools/ci/app-models.sh splits
# off the apps' models so that no app's package carries it. Measured by
# tools/ci/app-models.sh at its introduction: 2441734 bytes in three modules,
# the same on both architectures. Before it, each of the 19 apps with a model
# carried its own 2.6-3.0 MB copy in its package. The raise that covered the
# code two joined modules shared was dropped on 2026-11-19: the date library
# left the runtime for Calendar's module, where it is Calendar's alone, and
# the runtime is back at the budget it started with (2,431,613 measured).
[app_model_runtime.x86_64]
bytes = 2490368

[app_model_runtime.aarch64]
bytes = 2490368

