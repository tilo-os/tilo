[package]
name = "fake-model-providers"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "A scriptable stand-in for OpenAI's sign-in and ChatGPT backend, OpenAI's API and Anthropic's Messages API on loopback, for tests"

[dependencies]
base64.workspace = true
bytes.workspace = true
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
percent-encoding.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
agent-provider-config = { package = "tilo-agent-provider-config", path = "../../crates/integrations/provider-config" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
