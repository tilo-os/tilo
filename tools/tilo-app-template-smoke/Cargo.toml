[package]
name = "tilo-app-template-smoke"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
ui = { package = "tilo-app", path = "../../crates/sdk/tilo-app" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[build-dependencies]
tilo-app-builder = { path = "../../crates/lang/tilo-app-builder" }

# The templates' committed surfaces are compared with the code they are
# written from, as `tilolang check` compares an app's.
[dev-dependencies]
serde_json.workspace = true
tilo-surface-compile = { path = "../../crates/core/tilo-surface-compile" }
toml.workspace = true

# The smoke crate compiles sources emitted by `tilolang add` through `include!`, so
# cargo-machete cannot observe these dependencies in the crate's handwritten
# source or its build script even though removing them breaks the compile.
[package.metadata.cargo-machete]
ignored = ["tilo-app-builder"]

[lints]
workspace = true
