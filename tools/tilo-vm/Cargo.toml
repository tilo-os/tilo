[package]
name = "tilo-vm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "Host CLI for Tilo dev VMs: per-agent accounts, layer swaps and driving"

[lib]
name = "tilo_vm"

[[bin]]
name = "tilo-vm"
path = "src/main.rs"

[dependencies]
tilo-action-line = { version = "0.1.0", path = "../../crates/core/action-line" }
anyhow.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
iroh.workspace = true
tilo-actions = { path = "../../crates/core/actions" }
tilo-device-identity = { path = "../../crates/core/tilo-device-identity" }
tilo-identity = { path = "../../crates/core/tilo-identity" }
tilo-peer-state = { path = "../../crates/core/tilo-peer-state" }
tilo-rt.workspace = true
tilo-server-client = { path = "../../crates/core/tilo-server-client" }
tilo-server-protocol = { path = "../../crates/core/tilo-server-protocol" }
quick-xml.workspace = true
regex.workspace = true
base64.workspace = true
jiff.workspace = true
clap.workspace = true
tilo-clock = { path = "../../crates/platform/tilo-clock" }
tilo-files = { path = "../../crates/platform/tilo-files" }
tilo-formats = { path = "../../crates/ui/tilo-formats" }
tilo-paths.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tilo-app-package = { path = "../../crates/core/tilo-app-package" }
tilo-device-protocol = { path = "../../crates/os/tilo-device-protocol" }
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tilo-action-line-serve = { path = "../../crates/core/action-line-serve" }
tilo-automerge-isolate.workspace = true
tilo-peer-state = { path = "../../crates/core/tilo-peer-state", features = ["test-support"] }
tilo-user-identity = { path = "../../crates/core/tilo-user-identity" }
tilo-test-env = { path = "../test-env" }

[lints]
workspace = true
