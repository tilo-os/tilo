[package]
name = "click-test-client"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "The Wayland client the frame and typing measurements draw with: frames under load, and one frame per typed key"

# The client the frame and typing measurements draw with: frames under load,
# or exactly one frame per key the compositor delivers.
[[bin]]
name = "tilo-loadclient"
path = "src/bin/tilo-loadclient.rs"
test = false
bench = false

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.20.0"
wayland-client.workspace = true
[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace-hack's native feature set does not build for wasm32.
workspace-hack = { version = "0.1" }

[lints]
workspace = true
