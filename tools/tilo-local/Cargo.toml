[package]
name = "tilo-local"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
description = "One command for each way to run Tilo from a checkout: the desktop in a window, the session headless, the web desktop on the local hosting stack (cargo desktop, cargo headless, cargo web)"

# Standard library and one std-only leaf, and outside workspace-hack (.config/hakari.toml),
# so `cargo desktop` compiles this launcher in seconds before the real build.

[[bin]]
name = "tilo-local"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
# The check's trap sockets bind through the same code the rest of the tree does
# (`tilo_files::native::socket` re-exports it); a std-only leaf, so taking it keeps
# this launcher free of the dependency graph the unified set would bring.
tilo-socket = { version = "0.1.0", path = "../../crates/platform/tilo-socket" }

[lints]
workspace = true
